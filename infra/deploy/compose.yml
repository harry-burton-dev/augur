# The whole platform on one server, reached privately over Tailscale at
# https://<TS_HOSTNAME>.<your tailnet>.ts.net. See docs/deploy.md.
#   cp infra/deploy/.env.example infra/deploy/.env   # then fill it in
#   docker compose -f infra/deploy/compose.yml --env-file infra/deploy/.env up -d
# Runs the images CI built for the platform release PLATFORM_VERSION. To build them from this
# checkout instead, add -f infra/deploy/compose.build.yml (and --build).
# Keeps the old codename: Docker names the data volumes after the project, so renaming it would start empty.
name: platform

x-service: &service
  restart: unless-stopped
  environment: &env
    NODE_ENV: production
    IDENTITY_URL: http://identity:8081
    EVENTS_URL: http://events:8084
    REGISTRY_URL: http://registry:8082
    MODELS_URL: http://models:8085
    # Services believe a person is calling only when the gateway signed it; they fetch its key here.
    GATEWAY_URL: http://gateway:8080
    # Every service signs in as itself (its own Keycloak client and SERVICE_CLIENT_SECRET); tokens name the
    # public address and are fetched and checked over the compose network.
    OIDC_ISSUER: ${PLATFORM_URL}/sso/realms/platform
    OIDC_INTERNAL_URL: http://keycloak:8080/sso/realms/platform
    DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/platform
  depends_on:
    postgres: { condition: service_healthy }

services:
  # Puts the platform on your tailnet and serves it over HTTPS with a Tailscale certificate.
  tailscale:
    image: tailscale/tailscale:v1.76.6
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-platform}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-platform}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on: [web]

  web:
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/web:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    restart: unless-stopped
    environment:
      # Other sites apps may load from, space separated (also allow each in Admin, Apps).
      APP_ORIGINS: ${APP_ORIGINS:-}
    depends_on: [gateway, keycloak]

  # Postgres 16 with pgvector, for apps' embeddings. The same major version as before, so the data carries over.
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: platform
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A dump of the whole database every night into infra/deploy/backups, keeping 14 days,
  # and once a week a test restore of the newest into a throwaway database.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: platform
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      RESTORE_TEST_WEEKDAY: ${RESTORE_TEST_WEEKDAY:-0}
    volumes:
      - ./backup:/backup:ro
      - ./backups:/backups
      # Apps' files, read only: backed up beside the database.
      - garage-meta:/objects/meta:ro
      - garage-data:/objects/data:ro
    depends_on:
      postgres: { condition: service_healthy }

  # Apps' files: an S3-compatible object store, reached only inside the compose network.
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # Gives each app in APP_STORAGE its own database login and schema, and its own bucket and key,
  # from the secrets in .env, then stops. Runs on every `up`; see docs/app-storage.md.
  storage:
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/storage:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    restart: on-failure
    # Each app's secrets are named after it (FOLIO_DATABASE_PASSWORD, ...), so it reads them all from .env.
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform
      GARAGE_ADMIN_URL: http://garage:3903
      APP_STORAGE: ${APP_STORAGE:-}
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_started }

  # Sign-in. Served under /sso on the platform's own address, so tokens are issued for it.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: platform
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${PLATFORM_URL:?set PLATFORM_URL in .env}/sso
      KC_HTTP_RELATIVE_PATH: /sso
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # One instance: no cluster to find.
      KC_CACHE: local
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-keycloak-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Read by the realm file on first start: who you sign in as.
      PLATFORM_URL: ${PLATFORM_URL}
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:?set PLATFORM_ADMIN_USER in .env}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?set PLATFORM_ADMIN_PASSWORD in .env}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?set PLATFORM_ADMIN_EMAIL in .env}
      PLATFORM_ADMIN_FIRST_NAME: ${PLATFORM_ADMIN_FIRST_NAME:?set PLATFORM_ADMIN_FIRST_NAME in .env}
      PLATFORM_ADMIN_LAST_NAME: ${PLATFORM_ADMIN_LAST_NAME:?set PLATFORM_ADMIN_LAST_NAME in .env}
      PLATFORM_ADMIN_DEPARTMENT: ${PLATFORM_ADMIN_DEPARTMENT:-Platform}
    volumes:
      - ./keycloak/platform-realm.json:/opt/keycloak/data/import/platform-realm.json:ro
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/gateway:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      IDENTITY_URL: http://identity:8081
      REGISTRY_URL: http://registry:8082
      EVENTS_URL: http://events:8084
      MODELS_URL: http://models:8085
      # Tokens name the platform's public address; signing keys are fetched inside the compose network.
      OIDC_ISSUER: ${PLATFORM_URL}/sso/realms/platform
      OIDC_JWKS_URL: http://keycloak:8080/sso/realms/platform/protocol/openid-connect/certs
      OIDC_AUDIENCE: platform-api
      # Admin's Status reads what the backup container last wrote here.
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups:ro
    depends_on: [identity, registry, events, models]

  identity:
    <<: *service
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/identity:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    environment:
      <<: *env
      PORT: 8081
      # Admin's People screen: identity manages people in Keycloak as its admin. Departments are
      # identity's own teams, copied in once from Keycloak's groups.
      KEYCLOAK_URL: http://keycloak:8080/sso
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-keycloak-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # What the top floor, the whole organisation, is called.
      ORG_NAME: ${ORG_NAME:-Organisation}
      SERVICE_CLIENT_SECRET: ${IDENTITY_CLIENT_SECRET:?set IDENTITY_CLIENT_SECRET in .env}
      # Identity makes each platform service's sign-in in Keycloak with these secrets.
      SERVICE_CLIENT_SECRETS: platform-identity=${IDENTITY_CLIENT_SECRET},platform-registry=${REGISTRY_CLIENT_SECRET:?set REGISTRY_CLIENT_SECRET in .env},platform-events=${EVENTS_CLIENT_SECRET:?set EVENTS_CLIENT_SECRET in .env},platform-models=${MODELS_CLIENT_SECRET:-},platform-updater=${UPDATER_CLIENT_SECRET:-}

  registry:
    <<: *service
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/registry:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    environment:
      <<: *env
      PORT: 8082
      SERVICE_CLIENT_SECRET: "${REGISTRY_CLIENT_SECRET}"
      # Admin's Updates page: where new AUGUR releases are listed, and which ones to follow.
      RELEASE_FEED_URL: ${RELEASE_FEED_URL:-}
      RELEASE_CHANNEL: ${RELEASE_CHANNEL:-}
    volumes:
      # A read-only token for a private release feed, as secrets/release-feed-token (docs/upgrade.md).
      - ./secrets:/run/secrets/augur:ro
      # A mirror's feed kept on this server, for RELEASE_FEED_URL=file:///run/augur/releases/releases.json (docs/mirror.md).
      - ./releases:/run/augur/releases:ro

  events:
    <<: *service
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/events:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    environment: { <<: *env, PORT: 8084, SERVICE_CLIENT_SECRET: "${EVENTS_CLIENT_SECRET}" }

  # The model gateway: the only place a model provider's key is kept. Without MODEL_API_URL there is
  # no model and Agents stay off; with one, an admin turns models on in Admin. See docs/agents.md.
  models:
    <<: *service
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/models:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    environment:
      <<: *env
      PORT: 8085
      SERVICE_CLIENT_SECRET: "${MODELS_CLIENT_SECRET:-}"
      MODEL_API_URL: "${MODEL_API_URL:-}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL_NAME: "${MODEL_NAME:-}"

  # Applies the upgrades an admin asks for on Admin → Updates: backup, pull, restart each part, and back
  # by itself if one doesn't come up (docs/upgrade.md, The updater). Optional: only with
  # COMPOSE_PROFILES=updater in .env. It drives Docker, which can start anything, so it has the run of
  # the server: only it can reach docker-proxy, on a network of their own.
  updater:
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/updater:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    profiles: [updater]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REGISTRY_URL: http://registry:8082
      OIDC_ISSUER: ${PLATFORM_URL}/sso/realms/platform
      OIDC_INTERNAL_URL: http://keycloak:8080/sso/realms/platform
      SERVICE_CLIENT_SECRET: "${UPDATER_CLIENT_SECRET:-}"
      DOCKER_HOST: tcp://docker-proxy:2375
      # This folder's full path on the host, mounted at the same path so Compose's ./ paths still name the host's files.
      PLATFORM_DIR: "${PLATFORM_DIR:-}"
      # For private images: who the pull token in secrets/image-pull-token belongs to.
      IMAGE_PULL_USER: "${IMAGE_PULL_USER:-}"
    volumes:
      - ${PLATFORM_DIR:-./}:${PLATFORM_DIR:-/augur-deploy}
      - ./secrets:/run/secrets/augur:ro
    networks: [default, docker]
    depends_on: [docker-proxy, registry]

  # The Docker API, for the updater only, without the parts it doesn't need (swarm, secrets, builds, plugins).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    profiles: [updater]
    restart: unless-stopped
    environment: { CONTAINERS: 1, IMAGES: 1, NETWORKS: 1, VOLUMES: 1, EXEC: 1, POST: 1, INFO: 1, DISTRIBUTION: 1, AUTH: 1, DISABLE_IPV6: 1 }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker]

networks:
  default:
  # Nothing on it reaches anywhere else.
  docker:
    internal: true

volumes:
  pgdata:
  tailscale:
  garage-meta:
  garage-data:
