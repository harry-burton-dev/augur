# The whole platform on one server, reached privately over Tailscale at
# https://<TS_HOSTNAME>.<your tailnet>.ts.net. See AUGUR's docs, Install AUGUR.
#   cp infra/deploy/.env.example infra/deploy/.env   # then fill it in
#   docker compose -f infra/deploy/compose.yml --env-file infra/deploy/.env up -d
# Runs the images CI built for the platform release PLATFORM_VERSION. To build them from this
# checkout instead, add -f infra/deploy/compose.build.yml (and --build).
# Keeps the old codename: Docker names the data volumes after the project, so renaming it would start empty.
name: platform

# What every container AUGUR builds runs with: they run as an unprivileged user already, so they need
# no Linux capabilities and may never gain privileges. init passes Docker's stop signal on, so a stop
# takes a moment instead of the 10 seconds before Docker kills the process.
x-hardened: &hardened
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

# Every container's log, kept by Docker: at most three files of 10 MB each, so logs can't fill the disk.
# `pc logs` reads them as before. LOG_MAX_SIZE and LOG_MAX_FILES in .env change the limits.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-3}"

# OpenTelemetry (ADR 0034, 0059, docs/observability.md): every Node service loads the service kit's
# telemetry first and sends to the deployment's own otel-lgtm, or to the collector OTEL_EXPORTER_OTLP_ENDPOINT
# names. OTEL_SDK_DISABLED=true turns it off (and OTEL_LGTM_REPLICAS=0 stops otel-lgtm).
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
  # A collector's key, and which traces to keep (the SDK's defaults when empty).
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
  # Which deployment it came from: its ring, and the name it reports to Backstage under.
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${SERVER_RING:-production},deployment.name=${DEPLOYMENT_ID:-${SERVER_RING:-production}}
x-telemetry: &telemetry
  <<: *otel
  NODE_OPTIONS: --import @augur/service-kit/telemetry
  # How long one service waits for another before it says that one can't be reached (5 seconds unless set).
  SERVICE_CALL_TIMEOUT_SECONDS: ${SERVICE_CALL_TIMEOUT_SECONDS:-}
  # How long one database query may run before Postgres cancels it (a minute unless set; 0 for no limit).
  DATABASE_STATEMENT_TIMEOUT_SECONDS: ${DATABASE_STATEMENT_TIMEOUT_SECONDS:-}

x-service: &service
  <<: *hardened
  restart: unless-stopped
  # The compose network, and the telemetry network its traces, metrics and logs go out on (networks, below).
  networks: [default, telemetry]
  environment: &env
    <<: *telemetry
    NODE_ENV: production
    IDENTITY_URL: http://identity:8081
    EVENTS_URL: http://events:8084
    REGISTRY_URL: http://registry:8082
    MODELS_URL: http://models:8085
    # Services believe a person is calling only when the gateway signed it; they fetch its key here.
    GATEWAY_URL: http://gateway:8080
    # Every service signs in as itself (its own Keycloak client and SERVICE_CLIENT_SECRET); tokens name the
    # public address and are fetched and checked over the compose network.
    OIDC_ISSUER: ${PLATFORM_URL}/sso/realms/platform
    OIDC_INTERNAL_URL: http://keycloak:8080/sso/realms/platform
    DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/platform
  depends_on:
    postgres: { condition: service_healthy }

# A platform service with its own database login waits for the storage job, which makes the login
# and hands it the service's schema (PLATFORM_DATABASE_LOGINS below; AUGUR's docs, Install AUGUR).
x-own-login: &own-login
  postgres: { condition: service_healthy }
  storage: { condition: service_completed_successfully }

services:
  # Puts the platform on your tailnet and serves it over HTTPS with a Tailscale certificate. While
  # infra/deploy/public.sh has it open, Tailscale Funnel serves the same address to the internet too
  # (tailscale/start.sh; AUGUR's docs, Open AUGUR to the internet for a while).
  tailscale:
    logging: *logging
    image: tailscale/tailscale:v1.104.4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/config/start.sh"]
    hostname: ${TS_HOSTNAME:-platform}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-platform}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on: [web]

  web:
    logging: *logging
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/web:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    <<: *hardened
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    environment:
      # Other sites apps may load from, space separated (also allow each in Admin, Apps).
      APP_ORIGINS: ${APP_ORIGINS:-}
      # Where the UI kit is loaded from: this server's /kit/ unless set (AUGUR's docs, What browsers load).
      KIT_URL: ${KIT_URL:-/kit/}
      # The product's name in the browser tab (AUGUR's docs, Install AUGUR); AUGUR unless set.
      ORG_PRODUCT_NAME: ${ORG_PRODUCT_NAME:-AUGUR}
      # How focus is drawn: scrim for desktops without a GPU (AUGUR's docs, What browsers load); each app's choice unless set.
      FOCUS_DEPTH: ${FOCUS_DEPTH:-}
      # The front door's limits (AUGUR's docs, Limits and health); the image's defaults when unset.
      API_RATE_PER_SECOND: ${API_RATE_PER_SECOND:-30}
      API_RATE_BURST: ${API_RATE_BURST:-200}
      SSO_RATE_PER_SECOND: ${SSO_RATE_PER_SECOND:-10}
      SSO_RATE_BURST: ${SSO_RATE_BURST:-50}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      # Keycloak's own admin console, at PLATFORM_URL/sso/admin: open serves it; it's closed otherwise.
      KEYCLOAK_CONSOLE: ${KEYCLOAK_CONSOLE:-closed}
      # On the workbench (dev) only, the shell may load an app from a developer's machine on the tailnet.
      SERVER_RING: ${SERVER_RING:-}
      # Upgrade windows are in this time zone (Admin → Upgrade Centre), such as Europe/London; UTC when unset.
      DEPLOYMENT_TIME_ZONE: ${DEPLOYMENT_TIME_ZONE:-}
      # Its tailnet is the only one it loads apps from then (infra/deploy/live-origins.envsh).
      PLATFORM_URL: ${PLATFORM_URL}
    depends_on:
      gateway: { condition: service_started }
      keycloak: { condition: service_healthy }

  # Postgres 16 with pgvector, for apps' embeddings. The same major version as before, so the data carries over.
  # Archives every change (its WAL) into wal-archive as it goes, so the database can be put back as it was
  # at any moment since the oldest base backup (ADR 0064; postgres/start.sh; AUGUR's docs, Restore to a
  # point in time).
  postgres:
    logging: *logging
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/augur/start.sh"]
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: platform
      # At most this many seconds of changes wait before they're archived (when there are any).
      PITR_ARCHIVE_SECONDS: ${PITR_ARCHIVE_SECONDS:-900}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres:/etc/augur:ro
      - wal-archive:/wal-archive
    # And the rendition worker's network, which reaches only Postgres and Garage.
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A dump of the whole database every night into infra/deploy/backups, keeping 14 days, with a base backup
  # for the archived WAL to be replayed onto (the newest PITR_KEEP_DAYS kept; ADR 0064), and once a week a
  # test restore of the newest of each into a throwaway database. Once OFFSITE_REPOSITORY is
  # set, each night's dump and apps' files are also copied off the server with restic, encrypted before
  # they leave, and the weekly restore test restores from that copy (ADR 0060; AUGUR's docs, Backups).
  # The same image as postgres: the test restores into a Postgres of its own, which needs pgvector to bring
  # back apps' vector columns. The updater runs the test before every upgrade, so without it upgrades stop.
  backup:
    logging: *logging
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: platform
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      RESTORE_TEST_WEEKDAY: ${RESTORE_TEST_WEEKDAY:-0}
      # The off-server copy: a restic repository in an S3-compatible bucket, its encryption password, and
      # the bucket's key. Empty, nothing leaves the server.
      RESTIC_REPOSITORY: ${OFFSITE_REPOSITORY:-}
      RESTIC_PASSWORD: ${OFFSITE_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${OFFSITE_REGION:-}
      OFFSITE_KEEP_DAILY: ${OFFSITE_KEEP_DAILY:-30}
      PITR_KEEP_DAYS: ${PITR_KEEP_DAYS:-7}
    volumes:
      - ./backup:/backup:ro
      - ./backups:/backups
      # Apps' files, read only: backed up beside the database.
      - garage-meta:/objects/meta:ro
      - garage-data:/objects/data:ro
      # restic, put there by backup-tools.
      - backup-tools:/tools:ro
      # Postgres's archived WAL: pruned to the oldest base backup, copied off the server, replayed in tests.
      - wal-archive:/wal-archive
      # The deploy folder, read only: .env and secrets/ go into the off-server copy with the backups, encrypted.
      - ./:/deploy:ro
      # The knowledge graph's forget ledger, read only: copied off the server with apps' files.
      - knowledge-ledger:/knowledge-ledger:ro
    depends_on:
      postgres: { condition: service_healthy }
      backup-tools: { condition: service_completed_successfully }

  # Puts restic's binary (one static file) where the backup container runs it from, then stops. Runs on
  # every `up`, so a new restic arrives with the image tag here.
  backup-tools:
    logging: *logging
    image: restic/restic:0.19.1
    restart: on-failure
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    entrypoint: ["/bin/sh", "-c", "cp /usr/bin/restic /tools/restic.new && mv /tools/restic.new /tools/restic"]
    volumes:
      - backup-tools:/tools

  # Apps' files: an S3-compatible object store, reached only inside the compose network.
  garage:
    logging: *logging
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    # Ready once the node answers its own status (the image has only Garage's binary).
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks: [default]

  # Gives each platform service and Keycloak a database login of their own, and each app in
  # APP_STORAGE its own database login and schema, and its own bucket and key, from the secrets
  # in .env, then stops. Runs on every `up`; see docs/app-storage.md.
  storage:
    logging: *logging
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/storage:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    <<: *hardened
    restart: on-failure
    # Each app's secrets are named after it (<APP>_DATABASE_PASSWORD, ...), so it reads them all from .env.
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform
      GARAGE_ADMIN_URL: http://garage:3903
      # The apps named in .env that keep data outside the app runner (the runner sets up its own apps' storage).
      APP_STORAGE: ${APP_STORAGE:-}
      # The apps that shipped with AUGUR until ADR 0075: their database logins, schemas and buckets go, once on each
      # server (after the upgrade's backup), and are remembered as gone so an app installed later under one of these ids keeps its own.
      RETIRED_APPS: folio atlas mandate auspex
      # The platform's services that get a login owning only their own schema, each with its
      # <SERVICE>_DATABASE_PASSWORD from .env. Keycloak gets one too, from KEYCLOAK_DATABASE_PASSWORD.
      PLATFORM_DATABASE_LOGINS: identity registry events models permissions
      # The most connections each app's login may hold at once (30 when empty), so one app can't take AUGUR's (ADR 0073).
      APP_DATABASE_CONNECTIONS: ${APP_DATABASE_CONNECTIONS:-}
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_healthy }

  # Sign-in. Served under /sso on the platform's own address, so tokens are issued for it. Moving to a
  # new minor migrates Keycloak's database on its first start, which can't be undone: take a backup
  # first (docs/upgrade.md). The realm itself is kept as code and applied by keycloak-config below.
  keycloak:
    logging: *logging
    # AUGUR's Keycloak: Keycloak with AUGUR's sign-in and email theme (ADR 0041, infra/service.Dockerfile).
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/keycloak:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      # Its own login, owning only its own database; the storage job makes it.
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?set KEYCLOAK_DATABASE_PASSWORD in .env}
      KC_HOSTNAME: ${PLATFORM_URL:?set PLATFORM_URL in .env}/sso
      KC_HTTP_RELATIVE_PATH: /sso
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # One instance: no cluster to find.
      KC_CACHE: local
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-keycloak-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Read by the realm file on first start: who you sign in as.
      PLATFORM_URL: ${PLATFORM_URL}
      # And identity's own sign-in, so identity never needs Keycloak's admin.
      IDENTITY_CLIENT_SECRET: ${IDENTITY_CLIENT_SECRET:?set IDENTITY_CLIENT_SECRET in .env}
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:?set PLATFORM_ADMIN_USER in .env}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?set PLATFORM_ADMIN_PASSWORD in .env}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?set PLATFORM_ADMIN_EMAIL in .env}
      PLATFORM_ADMIN_FIRST_NAME: ${PLATFORM_ADMIN_FIRST_NAME:?set PLATFORM_ADMIN_FIRST_NAME in .env}
      PLATFORM_ADMIN_LAST_NAME: ${PLATFORM_ADMIN_LAST_NAME:?set PLATFORM_ADMIN_LAST_NAME in .env}
      PLATFORM_ADMIN_DEPARTMENT: ${PLATFORM_ADMIN_DEPARTMENT:-Administration}
      # Shown on the sign-in pages and in emails: the organisation's name (as identity has it) and, if
      # set, a link to its logo. The product's name is the realm's display name (keycloak-config sets it).
      ORG_NAME: ${ORG_NAME:-Organisation}
      ORG_LOGO_URL: ${ORG_LOGO_URL:-}
    # Its share of the server's memory: Keycloak sizes its Java heap from it.
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-2g}
    # Ready once it answers on its management port (9000, inside the container only). The image has no
    # curl or wget, so bash asks it directly.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /sso/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Its first start after an upgrade migrates its database, which can take a few minutes.
      start_period: 300s
    volumes:
      - ./keycloak/platform-realm.json:/opt/keycloak/data/import/platform-realm.json:ro
      # The breached-password list the realm's password policy checks against (ADR 0038).
      - ./keycloak/password-blacklists:/opt/keycloak/data/password-blacklists:ro
    depends_on: *own-login

  # The realm as code (ADR 0057): brings Keycloak's realm to what this release declares (password
  # policy, two-step sign-in for admin roles, passkeys, sessions, events, profile, roles, the services'
  # sign-ins and identity's rights), then stops. Runs on every `up`, so on every upgrade, before
  # identity starts. It is the only part of AUGUR that signs in as Keycloak's master admin.
  keycloak-config:
    logging: *logging
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/identity:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    <<: *hardened
    restart: on-failure:3
    command: ["node", "dist/realm-job.js"]
    environment:
      NODE_ENV: production
      KEYCLOAK_URL: http://keycloak:8080/sso
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-keycloak-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      IDENTITY_CLIENT_SECRET: ${IDENTITY_CLIENT_SECRET:?set IDENTITY_CLIENT_SECRET in .env}
      # Each platform service's sign-in in Keycloak, made or set to these secrets.
      SERVICE_CLIENT_SECRETS: platform-registry=${REGISTRY_CLIENT_SECRET:?set REGISTRY_CLIENT_SECRET in .env},platform-events=${EVENTS_CLIENT_SECRET:?set EVENTS_CLIENT_SECRET in .env},platform-models=${MODELS_CLIENT_SECRET:-},platform-knowledge=${KNOWLEDGE_CLIENT_SECRET:?set KNOWLEDGE_CLIENT_SECRET in .env},platform-permissions=${PERMISSIONS_CLIENT_SECRET:?set PERMISSIONS_CLIENT_SECRET in .env},platform-updater=${UPDATER_CLIENT_SECRET:-}
      # Given the deployment-admin role if nobody has it yet.
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:-}
      # Stricter than AUGUR's floors if you like, never looser (AUGUR's docs, Settings and secrets, The realm job).
      REALM_PASSWORD_MIN_LENGTH: ${REALM_PASSWORD_MIN_LENGTH:-}
      REALM_PASSWORD_DENYLIST: ${REALM_PASSWORD_DENYLIST:-}
      REALM_SESSION_IDLE_HOURS: ${REALM_SESSION_IDLE_HOURS:-}
      REALM_SESSION_MAX_HOURS: ${REALM_SESSION_MAX_HOURS:-}
      REALM_SIGN_IN_EVENT_DAYS: ${REALM_SIGN_IN_EVENT_DAYS:-}
      REALM_ADMIN_EVENT_DAYS: ${REALM_ADMIN_EVENT_DAYS:-}
      # The languages offered at sign-in, comma separated, the first the default (default en).
      REALM_LANGUAGES: ${REALM_LANGUAGES:-}
      # The product's name, as the realm's display name: the sign-in pages, emails and passkeys show it.
      ORG_PRODUCT_NAME: ${ORG_PRODUCT_NAME:-AUGUR}
      # The organisation's SMTP relay (ADR 0035). Without SMTP_HOST AUGUR sends no email and says so.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # The organisation's Entra, to sign in with the organisation's account (AUGUR's docs, Sign in with Entra). All three or none.
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      # Identity's database, read for the organisation's email sender (Admin → Organisation), which replaces SMTP_FROM.
      DATABASE_URL: postgres://platform_identity:${IDENTITY_DATABASE_PASSWORD:?set IDENTITY_DATABASE_PASSWORD in .env}@postgres:5432/platform
    depends_on:
      keycloak: { condition: service_healthy }
      postgres: { condition: service_healthy }

  gateway:
    logging: *logging
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/gateway:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    <<: *hardened
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    environment:
      <<: *telemetry
      NODE_ENV: production
      IDENTITY_URL: http://identity:8081
      REGISTRY_URL: http://registry:8082
      EVENTS_URL: http://events:8084
      MODELS_URL: http://models:8085
      KNOWLEDGE_URL: http://knowledge:8086
      # Asked whether someone is acting as an admin persona, when the shell says they are (ADR 0086).
      PERMISSIONS_URL: http://permissions:8087
      # Tokens name the platform's public address; signing keys are fetched inside the compose network.
      OIDC_ISSUER: ${PLATFORM_URL}/sso/realms/platform
      OIDC_JWKS_URL: http://keycloak:8080/sso/realms/platform/protocol/openid-connect/certs
      OIDC_AUDIENCE: platform-api
      # Apps' parts sign in as themselves (contract 3): their tokens carry this audience, and their client-credentials
      # grant is passed on to the sign-in service here (POST /api/identity/v1/token).
      OIDC_SERVICE_AUDIENCE: platform-services
      OIDC_INTERNAL_URL: http://keycloak:8080/sso/realms/platform
      # Admin's Status reads what the backup container last wrote here.
      BACKUP_DIR: /backups
      # And whether AUGUR is open to the internet, and until when, from what infra/deploy/public.sh wrote.
      PUBLIC_ACCESS_FILE: /run/augur/tailscale/public-until
      # Whether an admin may fill this deployment with synthetic sample data (pnpm seed, ADR 0056). Off unless set.
      SEED_ALLOWED: ${SEED_ALLOWED:-false}
      # The organisation's SMTP relay (ADR 0035), only so Admin → Status can say whether email can be sent (ADR 0065).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Apps' services run beside AUGUR outside the app runner, name=url: none (ADR 0075).
      APP_UPSTREAMS: ""
      # The brakes on calls to apps' parts, and how long a delegated caller lasts (AUGUR's docs, Limits and health).
      APP_CONNECT_TIMEOUT_MS: ${APP_CONNECT_TIMEOUT_MS:-}
      APP_RESPONSE_TIMEOUT_MS: ${APP_RESPONSE_TIMEOUT_MS:-}
      APP_CONCURRENT_CALLS: ${APP_CONCURRENT_CALLS:-}
      APP_DELEGATION_SECONDS: ${APP_DELEGATION_SECONDS:-}
      # The key it signs callers with; a new one each start when unset (docs/signed-caller.md).
      CALLER_SIGNING_KEY: ${CALLER_SIGNING_KEY:-}
    volumes:
      # Only the results the backup container writes for Status, never the backups themselves.
      - ./backups/status:/backups:ro
      - ./tailscale:/run/augur/tailscale:ro
    networks: [default, telemetry]
    depends_on: [identity, registry, events, models]

  identity:
    logging: *logging
    <<: *service
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/identity:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *env
      PORT: 8081
      # Asked beside each admin check, to compare answers before checks move there (shadow mode, docs/observability.md).
      PERMISSIONS_URL: http://permissions:8087
      # Its own login, owning only the identity schema.
      DATABASE_URL: postgres://platform_identity:${IDENTITY_DATABASE_PASSWORD:?set IDENTITY_DATABASE_PASSWORD in .env}@postgres:5432/platform
      # Admin's People screen: identity manages people in Keycloak as its own client, whose rights in
      # the realm (people, departments and apps' sign-ins, not the realm's settings) are given by
      # keycloak-config. Keycloak's master admin is never in identity's settings. Departments are
      # identity's own teams, copied in once from Keycloak's groups.
      KEYCLOAK_URL: http://keycloak:8080/sso
      # What the top floor, the whole organisation, is called.
      ORG_NAME: ${ORG_NAME:-Organisation}
      # The languages people may choose in Account, the same ones keycloak-config offers at sign-in.
      REALM_LANGUAGES: ${REALM_LANGUAGES:-}
      SERVICE_CLIENT_SECRET: ${IDENTITY_CLIENT_SECRET:?set IDENTITY_CLIENT_SECRET in .env}
    depends_on:
      <<: *own-login
      keycloak: { condition: service_healthy }
      keycloak-config: { condition: service_completed_successfully }

  registry:
    logging: *logging
    <<: *service
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/registry:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *env
      PORT: 8082
      # Asked beside each admin check, to compare answers before checks move there (shadow mode, docs/observability.md).
      PERMISSIONS_URL: http://permissions:8087
      SERVICE_CLIENT_SECRET: "${REGISTRY_CLIENT_SECRET}"
      # Its own login, owning only the registry schema.
      DATABASE_URL: postgres://platform_registry:${REGISTRY_DATABASE_PASSWORD:?set REGISTRY_DATABASE_PASSWORD in .env}@postgres:5432/platform
      # Asked at install what the knowledge graph offers apps.
      KNOWLEDGE_URL: http://knowledge:8086
      # The deployment's read key (secrets/github-read-key) and whose it is: the registry checks GitHub
      # for new AUGUR and app releases with it, and the updater pulls with it (docs/upgrade.md).
      GITHUB_READ_USER: "${GITHUB_READ_USER:-}"
      # Admin's Updates page: where new AUGUR releases are listed, and which ones to follow.
      RELEASE_FEED_URL: ${RELEASE_FEED_URL:-}
      RELEASE_CHANNEL: ${RELEASE_CHANNEL:-}
      PIPELINE_FEED_URL: ${PIPELINE_FEED_URL:-}
      PORTAL_URL: ${PORTAL_URL:-}
      # What this server runs, signed and reported to that Backstage under this name (ADR 0019).
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-}
      DEPLOYMENT_REPORTING: ${DEPLOYMENT_REPORTING:-}
      # Grafana's key to tell deployment admins of an alert (POST /v1/platform/alerts, ADR 0059).
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?set ALERT_WEBHOOK_TOKEN in .env}
      SERVER_RING: ${SERVER_RING:-}
      # Upgrade windows are in this time zone (Admin → Upgrade Centre), such as Europe/London; UTC when unset.
      DEPLOYMENT_TIME_ZONE: ${DEPLOYMENT_TIME_ZONE:-}
      # On the workbench, Live on the workbench loads apps only from machines on this address's tailnet.
      PLATFORM_URL: ${PLATFORM_URL}
      ALLOW_PR_PREVIEWS: ${ALLOW_PR_PREVIEWS:-}
      # How long an app removed from the server keeps its data, in days (30 when unset).
      APP_DATA_GRACE_DAYS: ${APP_DATA_GRACE_DAYS:-}
      # The apps this deployment installs from the feed by default (none when unset).
      DEFAULT_APPS: ${DEFAULT_APPS:-}
      # Admin → Apps: where apps' own releases are listed, for the app runner (docs/upgrade.md, The app runner).
      APP_FEEDS: ${APP_FEEDS:-}
      APP_FEED_URL: ${APP_FEED_URL:-}
      # Apps' frontends, kept by version in the bucket the storage container makes for them (docs/upgrade.md).
      FRONTENDS_BUCKET_SECRET: ${FRONTENDS_BUCKET_SECRET:-}
      FRONTENDS_S3_URL: http://garage:3900
      # Who must sign the release feed, for AUGUR published from a fork (docs/upgrade.md, The signed feed).
      FEED_SIGNER: ${FEED_SIGNER:-}
    volumes:
      # The read key, as secrets/github-read-key (or the older secrets/release-feed-token; docs/upgrade.md).
      - ./secrets:/run/secrets/augur:ro
      # A mirror's feed kept on this server, for RELEASE_FEED_URL=file:///run/augur/releases/releases.json (docs/mirror.md).
      - ./releases:/run/augur/releases:ro
    depends_on: *own-login

  events:
    logging: *logging
    <<: *service
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/events:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *env
      PORT: 8084
      SERVICE_CLIENT_SECRET: "${EVENTS_CLIENT_SECRET}"
      # Asked beside each admin and lead check, to compare answers before checks move there (shadow mode, docs/permissions.md).
      PERMISSIONS_URL: http://permissions:8087
      # Its own login, owning only the events schema: the audit log, notifications and domain events.
      DATABASE_URL: postgres://platform_events:${EVENTS_DATABASE_PASSWORD:?set EVENTS_DATABASE_PASSWORD in .env}@postgres:5432/platform
      # How many days apps' domain events are kept (30 when empty; docs/domain-events.md).
      DOMAIN_EVENTS_KEEP_DAYS: ${DOMAIN_EVENTS_KEEP_DAYS:-}
      INBOX_KEEP_DAYS: ${INBOX_KEEP_DAYS:-}
      # How many days back the Inbox's Done tab looks (30 when empty; docs/inbox.md).
      INBOX_DONE_DAYS: ${INBOX_DONE_DAYS:-}
      # Notices that need someone are emailed through the organisation's relay, linking back here (docs/notifications.md).
      PLATFORM_URL: ${PLATFORM_URL}
      ORG_PRODUCT_NAME: ${ORG_PRODUCT_NAME:-AUGUR}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on: *own-login

  # The model gateway: the only place a model provider's key is kept. Without MODEL_API_URL there is
  # no model and Agents stay off; with one, an admin turns models on in Admin. See docs/agents.md.
  models:
    logging: *logging
    <<: *service
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/models:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8085/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *env
      PORT: 8085
      # Asked beside each admin check, to compare answers before checks move there (shadow mode, docs/observability.md).
      PERMISSIONS_URL: http://permissions:8087
      SERVICE_CLIENT_SECRET: "${MODELS_CLIENT_SECRET:-}"
      # Its own login, owning only the models schema.
      DATABASE_URL: postgres://platform_models:${MODELS_DATABASE_PASSWORD:?set MODELS_DATABASE_PASSWORD in .env}@postgres:5432/platform
      MODEL_API_URL: "${MODEL_API_URL:-}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL_NAME: "${MODEL_NAME:-}"
      MODEL_EMBEDDING_NAME: "${MODEL_EMBEDDING_NAME:-}"
      # How long to wait for the model, in seconds (60 when empty).
      MODEL_TIMEOUT_SECONDS: "${MODEL_TIMEOUT_SECONDS:-}"
    depends_on: *own-login

  # Brings the knowledge graph's schema up to date as Postgres's admin login, then stops (ADR 0079). It makes
  # the two roles the graph runs under: kg_owner, which owns it and can't sign in, and kg_app, the service's
  # own login, which row security fences and which writes only through the graph's actions. Runs on every `up`.
  knowledge-migrate:
    logging: *logging
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/knowledge:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    <<: *hardened
    restart: on-failure:3
    command: ["node", "dist/migrate-job.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform
      KNOWLEDGE_DATABASE_PASSWORD: ${KNOWLEDGE_DATABASE_PASSWORD:?set KNOWLEDGE_DATABASE_PASSWORD in .env}
      KNOWLEDGE_LEDGER_DIR: /var/lib/augur/knowledge
    # After a restore, it forgets again what the forget ledger names (AUGUR's docs, Backups).
    volumes:
      - knowledge-ledger:/var/lib/augur/knowledge
    depends_on: *own-login

  # The knowledge graph of each floor (ADR 0079): what AUGUR knows of the entities in people's work, and
  # what each floor believes of them. People reach it through the gateway; it signs in to Postgres as kg_app.
  knowledge:
    logging: *logging
    <<: *service
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/knowledge:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8086/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *env
      PORT: 8086
      # Not connected to the models service in this phase of design: with no MODELS_URL, retain takes no raw text
      # and reflect writes no summaries. Both stay in the code, ready, until this line goes.
      MODELS_URL: ""
      KNOWLEDGE_PAGE_LIMIT: ${KNOWLEDGE_PAGE_LIMIT:-100}
      KNOWLEDGE_SUBGRAPH_DEPTH: ${KNOWLEDGE_SUBGRAPH_DEPTH:-3}
      KNOWLEDGE_REFLECT_DEBOUNCE_SECONDS: ${KNOWLEDGE_REFLECT_DEBOUNCE_SECONDS:-600}
      KNOWLEDGE_REFLECT_DAILY_BUDGET: ${KNOWLEDGE_REFLECT_DAILY_BUDGET:-400}
      KNOWLEDGE_REFLECT_FLOOR_BUDGET: ${KNOWLEDGE_REFLECT_FLOOR_BUDGET:-100}
      SERVICE_CLIENT_SECRET: ${KNOWLEDGE_CLIENT_SECRET:?set KNOWLEDGE_CLIENT_SECRET in .env}
      DATABASE_URL: postgres://kg_app:${KNOWLEDGE_DATABASE_PASSWORD:?set KNOWLEDGE_DATABASE_PASSWORD in .env}@postgres:5432/platform
      KNOWLEDGE_LEDGER_DIR: /var/lib/augur/knowledge
      # Who settles and raises on each floor is set in Admin and kept by the permissions service, which
      # knowledge asks on each request. While it can't answer, nobody settles or raises.
      PERMISSIONS_URL: http://permissions:8087
    # The forget ledger: which observations people forgot, ids only, outside Postgres so a restore can't undo it.
    volumes:
      - knowledge-ledger:/var/lib/augur/knowledge
    depends_on:
      knowledge-migrate: { condition: service_completed_successfully }
      identity: { condition: service_healthy }

  # OpenFGA (ADR 0085): it holds who may do what to what, as relationships, and answers the permissions
  # service's checks. AUGUR's image of it brings its tables up to date before it serves. They live in the
  # permissions schema, which the storage job gives the permissions login (PLATFORM_DATABASE_LOGINS). Only
  # the permissions service calls it, with OPENFGA_TOKEN. A check may be answered from its cache for up to
  # 10 seconds; the service asks for a fresh answer where a revoke must land at once (ADR 0085, D8).
  openfga:
    logging: *logging
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/openfga:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    <<: *hardened
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://platform_permissions:${PERMISSIONS_DATABASE_PASSWORD:?set PERMISSIONS_DATABASE_PASSWORD in .env}@postgres:5432/platform
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_TOKEN:?set OPENFGA_TOKEN in .env}
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
      OPENFGA_CHECK_QUERY_CACHE_ENABLED: "true"
      OPENFGA_CHECK_QUERY_CACHE_TTL: 10s
    depends_on: *own-login

  # The permissions service (ADR 0085): it answers whether a person, through the positions they hold, or an
  # admin persona may do something, from what OpenFGA holds. Only the gateway and AUGUR's own services ask it.
  # Services ask it beside their admin checks (shadow mode), and it keeps who is acting as an admin persona.
  permissions:
    logging: *logging
    <<: *service
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/permissions:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8087/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *env
      PORT: 8087
      OPENFGA_URL: http://openfga:8080
      # Its own login, the one OpenFGA keeps its tables under: persona sessions sit beside them (ADR 0086).
      DATABASE_URL: postgres://platform_permissions:${PERMISSIONS_DATABASE_PASSWORD:?set PERMISSIONS_DATABASE_PASSWORD in .env}@postgres:5432/platform
      PERSONA_DEPLOYMENT_ADMIN_MINUTES: ${PERSONA_DEPLOYMENT_ADMIN_MINUTES:-60}
      PERSONA_ORG_ADMIN_MINUTES: ${PERSONA_ORG_ADMIN_MINUTES:-480}
      OPENFGA_TOKEN: ${OPENFGA_TOKEN:?set OPENFGA_TOKEN in .env}
      # Its own sign-in, to copy floors, positions and who holds them from identity (ADR 0089), at once
      # when identity announces a change (platform.position.*, .team.*, .person.*) and whole every few minutes.
      SERVICE_CLIENT_SECRET: ${PERMISSIONS_CLIENT_SECRET:?set PERMISSIONS_CLIENT_SECRET in .env}
      PERMISSIONS_COPY_SECONDS: ${PERMISSIONS_COPY_SECONDS:-300}
    depends_on:
      openfga: { condition: service_healthy }
      identity: { condition: service_healthy }

  # Applies the upgrades an admin asks for on Admin → Upgrade Centre: backup, pull, restart each part, and back
  # by itself if one doesn't come up (docs/upgrade.md, The updater). Optional: only with
  # COMPOSE_PROFILES=updater in .env. It drives Docker, which can start anything, so it has the run of
  # the server: only it can reach docker-proxy, on a network of their own.
  updater:
    logging: *logging
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/updater:${PLATFORM_VERSION:?set PLATFORM_VERSION in .env}
    <<: *hardened
    profiles: [updater]
    restart: unless-stopped
    environment:
      <<: *telemetry
      NODE_ENV: production
      REGISTRY_URL: http://registry:8082
      OIDC_ISSUER: ${PLATFORM_URL}/sso/realms/platform
      OIDC_INTERNAL_URL: http://keycloak:8080/sso/realms/platform
      SERVICE_CLIENT_SECRET: "${UPDATER_CLIENT_SECRET:-}"
      DOCKER_HOST: tcp://docker-proxy:2375
      # This folder's full path on the host, mounted at the same path so Compose's ./ paths still name the host's files.
      PLATFORM_DIR: "${PLATFORM_DIR:-}"
      # The read key's account: the updater signs Docker in with secrets/github-read-key to pull.
      GITHUB_READ_USER: "${GITHUB_READ_USER:-}"
      # Before read keys: who the pull token in secrets/image-pull-token belongs to.
      IMAGE_PULL_USER: "${IMAGE_PULL_USER:-}"
      # Who must sign AUGUR's images and its dev builds, for AUGUR published from a fork; the publisher's
      # workflows when empty (docs/release-channels.md, Signatures).
      IMAGE_SIGNER: "${IMAGE_SIGNER:-}"
      IMAGE_SIGNER_ISSUER: "${IMAGE_SIGNER_ISSUER:-}"
      AUGUR_DEV_SIGNER: "${AUGUR_DEV_SIGNER:-}"
    volumes:
      - ${PLATFORM_DIR:-./}:${PLATFORM_DIR:-/augur-deploy}
      - ./secrets:/run/secrets/augur:ro
    networks: [default, docker, telemetry]
    depends_on: [docker-proxy, registry]

  # The Docker API, for the updater only, without the parts it doesn't need (swarm, secrets, builds, plugins).
  docker-proxy:
    logging: *logging
    image: tecnativa/docker-socket-proxy:v0.5.0
    profiles: [updater]
    restart: unless-stopped
    environment: { CONTAINERS: 1, IMAGES: 1, NETWORKS: 1, VOLUMES: 1, EXEC: 1, POST: 1, INFO: 1, DISTRIBUTION: 1, AUTH: 1, DISABLE_IPV6: 1 }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker]

  # Where the deployment watches itself (ADR 0034, 0059, docs/observability.md): Grafana's all-in-one
  # OpenTelemetry stack, for one server, keeping 72 hours. It runs AUGUR's alert rules and dashboard
  # (observability/) and tells deployment admins through the registry. Grafana answers on the server
  # itself only, at http://127.0.0.1:3001. A deployment with its own collector sets OTEL_LGTM_REPLICAS=0.
  otel-lgtm:
    logging: *logging
    image: grafana/otel-lgtm:0.39.0
    restart: unless-stopped
    deploy:
      replicas: ${OTEL_LGTM_REPLICAS:-1}
    mem_limit: ${OTEL_LGTM_MEM_LIMIT:-2g}
    environment:
      # Required: with none, Grafana would take admin/admin. An upgrade from the Upgrade Centre makes it up.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Read by contact-points.yaml: Grafana's key to the registry's alert webhook.
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?set ALERT_WEBHOOK_TOKEN in .env}
      # Prometheus and Pyroscope answer inside the container only, as Loki and Tempo do (lgtm/*.yaml): Grafana
      # reads them at 127.0.0.1, and nothing on the networks can query what the services logged.
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=72h --web.listen-address=127.0.0.1:9090
      PYROSCOPE_EXTRA_ARGS: -server.http-listen-address=127.0.0.1
    ports:
      - 127.0.0.1:3001:3000
    # Not on the compose network: only what sends telemetry reaches it, AUGUR's services and the apps that ask
    # for augur-telemetry (their networks join it). Its stores answer on 127.0.0.1 only; Grafana needs its password.
    # The rendition worker reaches it on its own network, so it never shares one with the services.
    networks: [telemetry, grafana]
    volumes:
      - otel-lgtm:/data
      - ./observability/lgtm/loki.yaml:/otel-lgtm/loki-config.yaml:ro
      - ./observability/lgtm/tempo.yaml:/otel-lgtm/tempo-config.yaml:ro
      - ./observability/grafana/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/augur.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/augur-dashboards:ro

networks:
  default:
  # Nothing on it reaches anywhere else.
  docker:
    internal: true
  # Traces, metrics and logs: the platform's services, the apps that ship with AUGUR and otel-lgtm. Apps the
  # runner installs join only the compose network, so they can't reach otel-lgtm at all. otel-lgtm sends
  # its alerts to the registry over it.
  telemetry:
    internal: true
  # Only so Grafana's port can be published on the server (a port can't be published from an internal network).
  grafana:

volumes:
  pgdata:
  tailscale:
  garage-meta:
  garage-data:
  # restic, for the backup container (backup-tools fills it on every `up`).
  backup-tools:
  # Postgres's archived changes (WAL), gzipped: postgres writes them, the backup container prunes and copies them.
  wal-archive:
  # The knowledge graph's forget ledger (ids only): the knowledge service writes it, its migrate job reads it.
  knowledge-ledger:
  otel-lgtm:
