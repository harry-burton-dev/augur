# Who may connect to Postgres (start.sh points hba_file here). AUGUR's own rule first: the backup container
# takes its nightly base backup over a replication connection as the platform user (ADR 0064). Then every
# rule of the data folder's own pg_hba.conf, as the image wrote it when the database was first made, so a
# deployment's existing rules carry on unchanged.
host replication platform all scram-sha-256
include /var/lib/postgresql/data/pg_hba.conf
