# One origin for the whole platform. Tailscale serves it over HTTPS and passes
# requests here over plain HTTP on the compose network.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  # Tailscale terminates TLS, so say the original scheme was https.
  set $forwarded_proto https;

  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # One id per request, followed through the gateway and every service's logs.
    proxy_set_header X-Request-Id $request_id;
    # The notification stream is server-sent events: no buffering, long reads.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /sso/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
  }

  # Apps' bundles: a missing file is a 404, never the shell's page.
  location /apps/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Hashed build output never changes.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Everything else is a location in the shell (/, /home, /admin/people…).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
