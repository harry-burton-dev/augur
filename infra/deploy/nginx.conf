# One origin for the whole platform. Tailscale serves it over HTTPS and passes
# requests here over plain HTTP on the compose network.
#
# This is a template. When the container starts, infra/deploy/kit-url.envsh
# writes the shell's page for KIT_URL and sets SCRIPT_HASHES (its inline
# scripts: the import map and the note shown if the kit can't be loaded) and
# KIT_ORIGIN (the kit's site, when it isn't this one); then nginx fills in those
# and APP_ORIGINS from the environment: other sites apps may load from, space separated, empty
# by default. A site must also be allowed in Admin, Apps. The other settings it
# fills in (rates, the upload ceiling, KEYCLOAK_CONSOLE) have defaults in the image.

# Who is calling: the address the proxy in front (Tailscale, or a load balancer) saw, which it
# passes on in X-Forwarded-For. Only believed from private addresses, where that proxy sits.
real_ip_header X-Forwarded-For;
real_ip_recursive on;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;

# Requests a second from one address, before it is answered 429 (Too Many Requests). A page
# fires many API calls at once, so each limit also lets a burst through.
limit_req_zone $binary_remote_addr zone=api:10m rate=${API_RATE_PER_SECOND}r/s;
limit_req_zone $binary_remote_addr zone=sso:10m rate=${SSO_RATE_PER_SECOND}r/s;
limit_req_status 429;

# Text goes out compressed: the shell, the kit and apps' bundles are about a third of their size
# gzipped. The notification stream (text/event-stream) isn't listed, so it is never held back to
# compress; images, fonts and uploads are compressed already.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1m;

  # Tailscale terminates TLS, so say the original scheme was https.
  set $forwarded_proto https;
  set $keycloak_console "${KEYCLOAK_CONSOLE}";

  # Where an app's part signs in with its client secret (contract 3): held to the sign-in rate, as /sso/ is,
  # since Keycloak's lockout after failed passwords covers people, not clients.
  location = /api/identity/v1/token {
    limit_req zone=sso burst=${SSO_RATE_BURST} nodelay;
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-Id $request_id;
  }

  location /api/ {
    limit_req zone=api burst=${API_RATE_BURST} nodelay;
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    # Uploads stream through to the gateway, which holds each app to its own limit
    # (its manifest's maxUpload, or less where an admin lowered it). This is only the ceiling.
    client_max_body_size ${MAX_UPLOAD_MB}m;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # One id per request, followed through the gateway and every service's logs.
    proxy_set_header X-Request-Id $request_id;
    # The notification stream is server-sent events: no buffering, long reads.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Keycloak's own admin console and API, and its master realm (which holds Keycloak's own
  # admin), are never served to the network: AUGUR's Admin covers people and departments, and
  # identity reaches Keycloak inside the compose network. KEYCLOAK_CONSOLE=open serves them, for
  # changing realm settings by hand; turn it back off afterwards. Never to the internet, though: while
  # AUGUR is open through Tailscale Funnel (infra/deploy/public.sh), Tailscale marks each request from
  # the internet with Tailscale-Funnel-Request (and strips it from any other), and those stay closed.
  location ~* ^/sso/(admin|realms/master)(/|$) {
    if ($keycloak_console != "open") {
      return 404;
    }
    if ($http_tailscale_funnel_request) {
      return 404;
    }
    limit_req zone=sso burst=${SSO_RATE_BURST} nodelay;
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
  }

  # Sign-in: each address may only try so often, beside Keycloak's own lockout after failed passwords.
  location /sso/ {
    limit_req zone=sso burst=${SSO_RATE_BURST} nodelay;
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
  }

  # Apps' frontends kept by version, /apps/<id>/<version>/…: the frontends bucket, which the registry
  # writes and Garage's web endpoint serves read-only. A version's files never change, and say so
  # (Cache-Control comes with each file). Garage's address is looked up per request through Docker's
  # DNS, so the front door starts even before Garage does.
  # AUGUR's own apps on the app contract (ADR 0083) are in the image at the same kind of address, so a file
  # here is served first; the registry never lets a feed app take one of their ids.
  location ~ ^/apps/[a-z][a-z0-9-]*/[0-9]+\.[0-9]+\.[0-9]+[^/]*/ {
    try_files $uri @frontends;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location @frontends {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $frontends garage:3902;
    proxy_pass http://$frontends;
    proxy_set_header Host augur-frontends.web.garage;
    proxy_hide_header x-amz-request-id;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Apps' bundles in the image: a missing file is a 404, never the shell's page.
  location /apps/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # The UI kit bundle (ADR 0048), where KIT_URL points by default: one folder per kit version, whose
  # files never change. The page holds each to its hash.
  location /kit/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The page every app's canvas opens in (contract 3, spec 6.11), in a frame sandboxed to scripts alone, so its
  # origin is opaque: it may load scripts from here (its own, the app's canvas script under /apps/), styles and
  # images from here, and reach nothing, so the port the shell hands it is its only way out. The same policy as
  # the dev server's (vite.config.ts). It isn't hashed, so it is checked each time.
  location ~ ^/sandbox/canvas\.(html|js)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'; sandbox allow-scripts" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The bootstrap of every app's worker (contract 3, ADR 0076), with the worker's own policy: it may load
  # scripts from here (itself, the app's entry under /apps/) and reach nothing, so the shell's bridge is the
  # app's only way out. Hashed names never change. The same policy as the dev server's (vite.config.ts).
  location /sandbox/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; worker-src 'none'; child-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The way back (ADR 0083): a page that needs nothing but itself, so a deployment admin can still go back to an
  # earlier release when the shell, the kit or an app won't open. It loads its own script and style from here,
  # talks only to this origin (sign-in at /sso, the registry at /api) and can't be framed.
  location = /recover {
    absolute_redirect off;
    return 301 /recover/;
  }
  location /recover/ {
    try_files $uri /recover/index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # The shell's own stand-in for react/jsx-dev-runtime (vite.shared.config.ts). Hashed names never change.
  location /shared/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # AUGUR's licence and the open-source notices, as plain text, without sign-in (docs/licensing.md).
  location /legal/ {
    try_files $uri =404;
    charset utf-8;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Hashed build output never changes.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Everything else is a location in the shell (/, /home, /admin/people…).
  # The shell's page says what it may run and reach: scripts from here (the
  # shell, the kit at KIT_URL, apps under /apps/), its own inline scripts, and
  # allowed app sites; style attributes, which the kit's screens use; fonts from here or the kit, nowhere else.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${SCRIPT_HASHES} ${KIT_ORIGIN} ${APP_ORIGINS} ${LIVE_ORIGINS}; style-src 'self' 'unsafe-inline' ${KIT_ORIGIN} ${APP_ORIGINS} ${LIVE_ORIGINS}; font-src 'self' ${KIT_ORIGIN}; img-src 'self' data: blob: ${APP_ORIGINS} ${LIVE_ORIGINS}; connect-src 'self' ${APP_ORIGINS} ${LIVE_ORIGINS}; worker-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
  }
}
