# One origin for the whole platform. Tailscale serves it over HTTPS and passes
# requests here over plain HTTP on the compose network.
#
# This is a template. At image build, infra/deploy/csp.mjs fills in the hash of
# the shell's import map; when the container starts, nginx fills in APP_ORIGINS
# from the environment: other sites apps may load from, space separated, empty
# by default. A site must also be allowed in Admin, Apps.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  # Tailscale terminates TLS, so say the original scheme was https.
  set $forwarded_proto https;

  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # One id per request, followed through the gateway and every service's logs.
    proxy_set_header X-Request-Id $request_id;
    # The notification stream is server-sent events: no buffering, long reads.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /sso/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
  }

  # Apps' bundles: a missing file is a 404, never the shell's page.
  location /apps/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # The kit and Lit, served once for the shell and every app. Hashed names never change.
  location /shared/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Hashed build output never changes.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Everything else is a location in the shell (/, /home, /admin/people…).
  # The shell's page says what it may run and reach: scripts from here (the
  # shell, the shared kit, apps under /apps/), its own import map, and allowed
  # app sites; style attributes, which the kit's screens use; fonts from Google.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' @SCRIPT_HASHES@ ${APP_ORIGINS}; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com ${APP_ORIGINS}; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: ${APP_ORIGINS}; connect-src 'self' ${APP_ORIGINS}; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
  }
}
