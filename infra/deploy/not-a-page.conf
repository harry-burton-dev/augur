# The headers on files that are never a page, served from the shell's own origin: apps' frontends (/apps/) and
# the shell's own hashed files (/assets/, /shared/). nginx.conf includes this in each of those locations, since
# an add_header there drops the server's. In the image at /etc/nginx/augur/not-a-page.conf (infra/web.Dockerfile).
#
# A file opened at its address as a page (an HTML or SVG document) would run as the shell's origin and could read
# the person's session. nosniff stops a browser taking a file for anything its Content-Type doesn't say. The
# policy only takes effect where a response is a document or a worker's own script, and nothing under these
# paths is either: an app's worker is /sandbox/'s bootstrap, under its own policy, and the scripts, styles and
# images it and the shell's page load ignore the policy their own response carries. So for a document opened
# from here: sandbox gives it an opaque origin and no scripts, forms or popups; default-src 'none' lets it load
# nothing; frame-ancestors 'none' lets nothing frame it. That is why enforcing it breaks nothing: no document or
# worker script is served from these paths. platform/contract/tests/apps-policy.spec.ts shows a page and an SVG
# under it run no script, and the reference app still drawing with it on its modules.
#
# Enforced since PER-453 part 2 (it was report-only first, and a browser ignores sandbox in a report-only policy).
add_header Content-Security-Policy "sandbox; default-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
