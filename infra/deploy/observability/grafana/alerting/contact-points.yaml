# Where AUGUR's alerts go (ADR 0059): into the registry, which raises a notice for deployment admins and
# another when the alert clears. Grafana fills $ALERT_WEBHOOK_TOKEN from compose; the registry refuses
# alerts without it. Email through the deployment's relay joins this once SMTP settings land (PER-189).
apiVersion: 1
contactPoints:
  - orgId: 1
    name: AUGUR notices
    receivers:
      - uid: augur-notices
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://registry:8082/v1/platform/alerts
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $ALERT_WEBHOOK_TOKEN

# One notice per incident: alerts are grouped by rule and part, and a firing one is told again only daily.
policies:
  - orgId: 1
    receiver: AUGUR notices
    group_by: [alertname, component, part, app]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 24h
