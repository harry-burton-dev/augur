# grafana/otel-lgtm 0.37.0's own Tempo settings, kept for 72 hours (ADR 0059). When Renovate moves the image,
# compare with the image's /otel-lgtm/tempo-config.yaml and carry its changes over, and check the keys
# below still exist in its Tempo (an unknown key stops Tempo, and with it otel-lgtm).
server:
  # Inside the container only: Grafana, beside it, reads Tempo at 127.0.0.1. Nothing else may query the traces
  # (compose.yml, the telemetry network).
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks

metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - service_name
        - operation
        - status_code
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

# Tempo 3 has no compactor: its backend worker compacts and deletes blocks past their retention.
backend_worker:
  compaction:
    block_retention: 72h
