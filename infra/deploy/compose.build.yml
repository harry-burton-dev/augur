# Builds the platform's images from this checkout instead of pulling a release's, for trying
# a change on a server before it's released. Use it on top of compose.yml:
#   docker compose -f infra/deploy/compose.yml -f infra/deploy/compose.build.yml --env-file infra/deploy/.env up -d --build
# The images are tagged with PLATFORM_VERSION as usual, so set it to something that isn't a
# release, such as `local`, or a later pull will replace them. The Upgrade Centre shows the server as
# a build from source, based on the last release; upgrading from there replaces it with released images.
# The builds read AUGUR's kit packages from GitHub Packages: set NODE_AUTH_TOKEN, in the shell you run
# compose from, to a GitHub token with read:packages.
services:
  web:
    build: { context: ../.., dockerfile: infra/web.Dockerfile, secrets: [node_auth_token], target: web }
  gateway:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, secrets: [node_auth_token], args: { PACKAGE: "@augur/gateway" } }
  identity:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, secrets: [node_auth_token], args: { PACKAGE: "@augur/identity" } }
  registry:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, secrets: [node_auth_token], target: registry, args: { PACKAGE: "@augur/registry" } }
    # Says so in the Upgrade Centre: a build from source still carries the last release's number.
    environment:
      AUGUR_BUILD: source
  events:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, secrets: [node_auth_token], args: { PACKAGE: "@augur/events" } }
  models:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, secrets: [node_auth_token], args: { PACKAGE: "@augur/models" } }
  knowledge:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, secrets: [node_auth_token], args: { PACKAGE: "@augur/knowledge" } }
  knowledge-migrate:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, secrets: [node_auth_token], args: { PACKAGE: "@augur/knowledge" } }
  storage:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, secrets: [node_auth_token], args: { PACKAGE: "@augur/storage" } }
  keycloak:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, secrets: [node_auth_token], target: keycloak }
  updater:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, secrets: [node_auth_token], target: updater, args: { PACKAGE: "@augur/updater" } }

# The kit packages' read token, for the builds above (infra/web.Dockerfile, infra/service.Dockerfile).
secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN
