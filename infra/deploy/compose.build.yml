# Builds the platform's images from this checkout instead of pulling a release's, for trying
# a change on a server before it's released. Use it on top of compose.yml:
#   docker compose -f infra/deploy/compose.yml -f infra/deploy/compose.build.yml --env-file infra/deploy/.env up -d --build
# The images are tagged with PLATFORM_VERSION as usual, so set it to something that isn't a
# release, such as `local`, or a later pull will replace them. The Upgrade Centre shows the server as
# a build from source, based on the last release; upgrading from there replaces it with released images.
services:
  web:
    build: { context: ../.., dockerfile: infra/web.Dockerfile, target: web }
  gateway:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, args: { PACKAGE: "@augur/gateway" } }
  identity:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, args: { PACKAGE: "@augur/identity" } }
  registry:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, target: registry, args: { PACKAGE: "@augur/registry" } }
    # Says so in the Upgrade Centre: a build from source still carries the last release's number.
    environment:
      AUGUR_BUILD: source
  events:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, args: { PACKAGE: "@augur/events" } }
  models:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, args: { PACKAGE: "@augur/models" } }
  storage:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, args: { PACKAGE: "@augur/storage" } }
  # The apps that ship with AUGUR aren't built here: they live in their own repositories (ADR 0049). A
  # build from source runs AUGUR's images of them from the newest beta release, or SHIPPED_APPS_VERSION's.
  folio:
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/folio:${SHIPPED_APPS_VERSION:-beta}
  folio-worker:
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/folio-worker:${SHIPPED_APPS_VERSION:-beta}
  auspex:
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/auspex:${SHIPPED_APPS_VERSION:-beta}
  atlas:
    image: ${PLATFORM_IMAGES:-ghcr.io/harry-burton-dev/im-platform}/atlas:${SHIPPED_APPS_VERSION:-beta}
  updater:
    build: { context: ../.., dockerfile: infra/service.Dockerfile, target: updater, args: { PACKAGE: "@augur/updater" } }
