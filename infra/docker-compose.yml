# Local stack. Frontends run separately with their Vite dev servers.
# "platform" is a codename until the platform has a name.
name: platform

x-service: &service
  restart: unless-stopped

# How services reach each other inside. The service token proves a call comes from
# inside; the gateway strips it from outside requests. Local only.
x-internal: &internal
  REGISTRY_URL: http://registry:8082
  EVENTS_URL: http://events:8084
  SERVICE_TOKEN: platform-local-only

services:
  # ---- infrastructure ----
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform-local-only
      POSTGRES_DB: platform
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD: platform-local-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Sign-in. The platform realm, its shell client and test users are imported from ./keycloak.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Browsers and the gateway reach Keycloak at different addresses; tokens name this one.
      KC_HOSTNAME: http://localhost:8180
    ports: ["8180:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]

  # ---- the platform ----
  gateway:
    <<: *service
    build: { context: .., dockerfile: infra/service.Dockerfile, args: { PACKAGE: "@platform/gateway" } }
    environment:
      PORT: 8080
      IDENTITY_URL: http://identity:8081
      REGISTRY_URL: http://registry:8082
      EVENTS_URL: http://events:8084
      # Tokens are issued for the browser's address; signing keys are fetched over the compose network.
      OIDC_ISSUER: http://localhost:8180/realms/platform
      OIDC_JWKS_URL: http://keycloak:8080/realms/platform/protocol/openid-connect/certs
      OIDC_AUDIENCE: platform-api
      # Each app's service, name=url. The platform knows no app by name.
      APP_UPSTREAMS: library=http://library:8083
    ports: ["8080:8080"]

  identity:
    <<: *service
    build: { context: .., dockerfile: infra/service.Dockerfile, args: { PACKAGE: "@platform/identity" } }
    environment: { PORT: 8081 }

  registry:
    <<: *service
    build: { context: .., dockerfile: infra/service.Dockerfile, args: { PACKAGE: "@platform/registry" } }
    environment:
      PORT: 8082
      DATABASE_URL: postgres://platform:platform-local-only@postgres:5432/platform
      <<: *internal
    depends_on: [postgres]

  events:
    <<: *service
    build: { context: .., dockerfile: infra/service.Dockerfile, args: { PACKAGE: "@platform/events" } }
    environment:
      PORT: 8084
      DATABASE_URL: postgres://platform:platform-local-only@postgres:5432/platform
      SERVICE_TOKEN: platform-local-only
    depends_on: [postgres]

  # ---- apps ----
  library:
    <<: *service
    build: { context: .., dockerfile: infra/service.Dockerfile, args: { PACKAGE: "@apps/library" } }
    environment:
      PORT: 8083
      <<: *internal
      APP_MANIFEST: /app/manifest.json
    volumes: ["../apps/library/manifest.json:/app/manifest.json:ro"]

volumes:
  pgdata:
  miniodata:
