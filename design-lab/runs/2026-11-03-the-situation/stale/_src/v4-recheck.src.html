<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Stale V4 · The re-check</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: reopening runs a challenge-and-response check over only what moved. The set said; it is now; keep, replace or set aside ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--space-6)}
.ck{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.prog{display:flex;gap:2px}
.prog i{flex:1;height:var(--space-1);border-radius:1px;background:var(--hairline)}
.prog i.done{background:var(--ink)}
.prog i.cur{background:var(--x-proposed-lit)}
.items{min-height:0;overflow:auto;scrollbar-width:thin;display:grid;gap:var(--space-2);align-content:start}
.it{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) minmax(0,1fr) auto;gap:var(--space-4);align-items:start;padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key);transition:border-color var(--motion-base) var(--ease-out),opacity var(--motion-base) var(--ease-out)}
.it .no{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.it h4{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-bottom:var(--space-1)}
.it p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.it .resp p{color:var(--light)}
.it.cur{border-color:var(--x-proposed-lit);background:var(--surface-inset)}
.it.done{opacity:var(--x-proposed-quiet)}
.it.todo .resp{opacity:.4}
.ans{display:grid;gap:var(--space-1);justify-items:end}
.ans .k{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--x-proposed-lit);text-transform:uppercase;letter-spacing:var(--tracking-caps)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.side .box{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.side .box b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.it{grid-template-columns:var(--space-4) minmax(0,1fr) minmax(0,1fr) auto;gap:var(--space-3);padding:var(--space-2) var(--space-3)}.side .box:nth-child(n+3){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Stale · V4</b> the re-check: reopening walks only what moved, challenge and response; keep, replace or set aside, and the set is version 2 · aviation checklists, challenge–response</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { k: 0, ans: {} };
/* only what moved is checked; the rest is listed as holding */
const MOVED = Object.keys(RO.changes);
const DEFAULT = { changed: ['keep', 'Keep the new reading'], gone: ['replace', `Replace with “${(CH('c2') || {}).replace}”`], orphan: ['ask', `Ask ${P('kerry').name} to confirm`] };
const VERB = { keep: 'kept, repaired', replace: 'replaced', ask: 'asked, still marked', aside: 'set aside' };
function render() {
  const holds = DATA.pieces.filter(p => !MOVED.includes(p.id));
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'Re-check'], [['Enter', 'answer'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="ck"><div><p class="eyebrow">Stale context · re-check on reopening · ${P(RO.by).name} · ${RO.on}</p><h1 class="title">${Math.min(S.k, MOVED.length)} of ${MOVED.length} checked</h1></div>
      <div class="prog">${MOVED.map((_, k) => `<i class="${k < S.k ? 'done' : k === S.k ? 'cur' : ''}"></i>`).join('')}</div>
      <div class="items">${MOVED.map((id, k) => { const p = PC(id), c = CH(id), a = S.ans[id]; return `<div class="it ${k < S.k ? 'done' : k === S.k ? 'cur' : 'todo'}"><span class="no">${k + 1}</span>
        <div><h4>The set said · ${p.at}</h4><p>${p.text}</p><p class="muted">${holdsHTML(p, true)}</p></div>
        <div class="resp"><h4>It is now · ${c.on}</h4><p>${c.now}</p><p class="muted">${REASON[c.reason]}</p></div>
        <div class="ans">${a ? `<span class="k">${I('check', 12)} ${VERB[a]}</span>` : k === S.k ? `<button class="btn sm go">${I('corner-down-left', 14)} ${DEFAULT[c.state][1]}</button><button class="btn sm">${I('archive', 14)} Set aside</button>` : ''}</div></div>`; }).join('')}</div>
    </div>
    <aside class="side">
      <div class="box"><b>Only what moved.</b> ${holds.length} pieces still hold and aren’t asked about; they are listed, not re-read.</div>
      <div class="box"><b>Each answer is recorded</b> with the reason AUGUR gave and the person who answered. When all ${MOVED.length} are answered, the set becomes version ${T.version + 1}, and the decision can rest on it.</div>
      <div class="box"><b>Nobody re-checks for you.</b> An agent may draft the “it is now” line in pencil; a person answers.</div>
      <div class="box">${holds.map(p => `<div class="small">${rm(p.rung, { word: false })} ${p.text}</div>`).join('')}</div>
    </aside>
  </div></main>`;
  hydrate($('#app'));
  $$('.it.cur .btn').forEach((b, j) => b.onclick = () => answer(j ? 'aside' : null));
}
function answer(force) { const id = MOVED[S.k]; if (!id) return; S.ans[id] = force || DEFAULT[CH(id).state][0]; S.k++; render(); }
play(() => { S.k = 0; S.ans = {}; render(); }, () => {
  const step = ms('--motion-calm');
  [0, 1, 2, 3].forEach(k => later(() => answer(), k * step * 0.8));
}, (e) => { if (e.key === 'Enter') answer(); });
</script>
</body>
</html>
