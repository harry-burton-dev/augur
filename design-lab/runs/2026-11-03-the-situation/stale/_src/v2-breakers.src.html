<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Stale V2 · Holds while</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: each piece's condition is a breaker. When its condition breaks, the breaker trips, with when and why; only a person resets it, by reading the piece again ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--space-6)}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.panel{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--space-2);align-content:start;padding:var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--slate-deep)}
.bk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset)}
.sw{grid-row:span 3;width:var(--space-5);height:calc(var(--space-6) + var(--space-1));border:1px solid var(--hairline-strong);border-radius:var(--radius-key);position:relative;background:var(--slate-deep)}
.sw::after{content:"";position:absolute;left:3px;right:3px;top:3px;height:45%;border-radius:2px;background:var(--ink-muted);transition:top var(--motion-base) var(--ease-out),background var(--motion-base) var(--ease-out)}
.bk.trip .sw::after{top:calc(55% - 3px);background:var(--x-proposed-broken)}
.bk.trip{border-color:var(--x-proposed-broken)}
.bk .cond{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.bk .cond b{font-weight:400}
.bk .pt{font-size:var(--x-proposed-type-micro);line-height:1.4;color:var(--ink-muted)}
.bk .tr{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--x-proposed-broken);display:none}
.bk.trip .tr{display:block}
.bk.trip .cond b{text-decoration:line-through;text-decoration-color:var(--x-proposed-broken)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.side h2{font-weight:300;font-size:var(--type-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.log li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:var(--space-2);padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);opacity:var(--x-proposed-quiet)}
.log li.on{opacity:1}
.log li span:first-child{font-family:var(--font-mono);color:var(--ink-muted)}
.note{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,1fr) 260px}.panel{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.bk .pt{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Stale · V2</b> holds while: each piece’s condition is a breaker that trips when it breaks; only a person resets it, by reading the piece again · circuit breaker panels, conditions precedent</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { t: 0 };
/* the days between assembly and reopening, as the panel saw them. Each event trips the pieces whose condition it broke */
const EVENTS = [
  { on: '10 Nov', what: `${R.changedRounds[1]} went back to its old route`, trips: ['i4', 'd5'] },
  { on: '14 Nov', what: `${P('tom').name} moved to ${P('tom').moves.to}`, trips: ['i5'] },
  { on: '18 Nov', what: `${T.supplierShort} withdrew the offer of 20 Oct`, trips: ['c2'] },
  { on: '20 Nov', what: `${T.supplierShort} revised its October count`, trips: ['d3', 'i3'] },
  { on: '21 Nov', what: 'November passed the limit', trips: ['i2', 'c1'] }
];
const tripped = () => new Set(EVENTS.slice(0, S.t).flatMap(e => e.trips));
const when = id => EVENTS.find(e => e.trips.includes(id));
function render() {
  const tr = tripped();
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'Conditions'], [['→', 'next day'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="left"><div><p class="eyebrow">Stale context · what each piece holds while</p><h1 class="title">${tr.size} of ${DATA.pieces.length} tripped</h1></div>
      <div class="panel">${DATA.pieces.map(p => { const e = when(p.id); return `<div class="bk ${tr.has(p.id) ? 'trip' : ''}" data-id="${p.id}"><span class="sw" aria-hidden="true"></span><span class="cond">holds while <b>${p.holds}</b></span><span class="pt">${rm(p.rung, { word: false })} ${p.text}</span><span class="tr">tripped ${e ? e.on : ''} · ${e ? e.what : ''}</span></div>`; }).join('')}</div></div>
    <aside class="side"><h2>What tripped them</h2>
      <ol class="log">${EVENTS.map((e, k) => `<li class="${k < S.t ? 'on' : ''}"><span>${e.on}</span><span>${e.what}<br><span class="muted">${e.trips.length} piece${e.trips.length > 1 ? 's' : ''}</span></span></li>`).join('')}</ol>
      <p class="note">A breaker trips on its condition, not its age: the July count is weeks old and still holds. A tripped piece stays in the set, marked, until its owner reads it again and resets it, replaces it or sets it aside.</p>
      <p class="note">${I('eye', 12)} Two conditions AUGUR can’t watch yet: “someone can still ask about it” and “the policy is unchanged”. They are checked by a person when the set is reopened.</p></aside>
  </div></main>`;
  hydrate($('#app'));
}
play(() => { S.t = 0; render(); }, () => {
  const step = ms('--motion-slow');
  EVENTS.forEach((e, k) => later(() => { S.t = k + 1; render(); }, k * step));
}, (e) => { if (e.key === 'ArrowRight') { S.t = Math.min(EVENTS.length, S.t + 1); render(); } });
</script>
</body>
</html>
