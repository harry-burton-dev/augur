<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Combined V1 · The life of a working set</title>
<meta name="x-shot-wait" content="3800">
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V1: one working set from assembly, through a handover to someone who wasn't there, to a decision; one piece goes stale on the way ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3)}
/* the life strip: five stops on one time scale, the lit one is where we are */
.life{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--hairline-strong)}
.stop{position:relative;display:grid;gap:2px;padding:var(--space-2) var(--space-3) 0 0;text-align:left;color:var(--ink-muted);transition:color var(--motion-base) var(--ease-out)}
.stop::before{content:"";position:absolute;top:calc(var(--space-1) * -1 - 1px);left:0;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--slate-deep);border:1px solid var(--hairline-strong);transition:background var(--motion-base) var(--ease-out),border-color var(--motion-base) var(--ease-out)}
.stop .d{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono)}
.stop b{font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta)}
.stop .w{font-size:var(--type-small);line-height:var(--leading-small)}
.stop.past{color:var(--ink)}
.stop.past::before{background:var(--ink-muted);border-color:var(--ink-muted)}
.stop[aria-current="step"]{color:var(--light)}
.stop[aria-current="step"]::before{background:var(--x-proposed-lit);border-color:var(--x-proposed-lit)}
.stop.warn::before{background:var(--x-proposed-broken);border-color:var(--x-proposed-broken)}
.head{display:flex;align-items:flex-end;gap:var(--space-5);justify-content:space-between;flex-wrap:wrap}
.head h1{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.head .who{font-size:var(--type-small)}
.meta{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);align-items:center}
.ver{font:400 var(--type-small)/1 var(--font-mono);color:var(--light);padding:var(--space-1) var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key)}
.stage{min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,1fr);gap:var(--space-5)}
/* left: the set itself, always the same object */
.set{min-height:0;display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);overflow:hidden}
.set .bar{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--hairline);font-size:var(--type-small);color:var(--ink-muted)}
.set .bar .grow{flex:1}
.rows{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.r{display:grid;grid-template-columns:var(--space-5) var(--space-5) minmax(0,1fr) minmax(0,0.75fr);gap:var(--space-3);align-items:start;padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);transition:background var(--motion-calm) var(--ease-out),opacity var(--motion-base) var(--ease-out)}
.r .n{font-family:var(--font-mono);color:var(--ink-muted)}
.r .t{color:var(--ink)}
.r .t.as-context{padding-left:var(--space-2)}
.r .y{color:var(--ink-muted)}
.r .y q{font-style:italic;color:var(--ink)}
.r.grp{display:block;padding:var(--space-2) var(--space-4) var(--space-1);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);border-bottom:0}
.r.gone{background:var(--x-proposed-stale)}
.r.gone .t .old{text-decoration:line-through;text-decoration-color:var(--x-proposed-broken);color:var(--ink-muted)}
.r.repaired{box-shadow:inset 2px 0 0 var(--x-proposed-seam)}
.r.orphan{box-shadow:inset 2px 0 0 var(--x-proposed-broken)}
.r.used{box-shadow:inset 2px 0 0 var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.r.dim{opacity:var(--x-proposed-quiet)}
.r .now{display:block;color:var(--light);margin-top:2px}
/* right: what this moment asks of a person */
.act{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);overflow:auto;scrollbar-width:thin}
.card{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset)}
.card h3{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.card p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.card .muted{color:var(--ink-muted)}
.card.lit{border-color:var(--x-proposed-lit)}
.card.warn{border-color:var(--x-proposed-broken)}
.card ul{display:grid;gap:var(--space-1)}
.card li{display:flex;gap:var(--space-2);align-items:baseline;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.card li svg{flex:none;transform:translateY(2px);color:var(--ink-muted)}
.card li.ok svg{color:var(--x-proposed-lit)}
.two{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.acts{display:flex;gap:var(--space-2);flex-wrap:wrap}
.gap{padding:var(--space-2) var(--space-3);--t:var(--space-2);color:var(--ink);font-size:var(--type-small);line-height:var(--leading-small);
  background:
    linear-gradient(var(--ink-muted),var(--ink-muted)) left top / var(--t) 1px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) left top / 1px var(--t) no-repeat,
    linear-gradient(var(--ink-muted),var(--ink-muted)) right top / var(--t) 1px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) right top / 1px var(--t) no-repeat,
    linear-gradient(var(--ink-muted),var(--ink-muted)) left bottom / var(--t) 1px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) left bottom / 1px var(--t) no-repeat,
    linear-gradient(var(--ink-muted),var(--ink-muted)) right bottom / var(--t) 1px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) right bottom / 1px var(--t) no-repeat}
.gap.filled{background:none;border-left:2px solid var(--x-proposed-seam);padding-left:var(--space-3)}
.sig{font:italic 300 var(--type-lead)/1.2 var(--font-sans);color:var(--light)}
.notice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--x-proposed-broken);border-radius:var(--radius-key);background:var(--slate-deep)}
.notice p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.notice svg{color:var(--x-proposed-broken)}
.swap{animation:land var(--motion-calm) var(--ease-out)}
@media (max-width:1400px){.stop .w{display:none}.r{grid-template-columns:var(--space-4) var(--space-5) minmax(0,1fr) minmax(0,0.7fr);padding:var(--space-1) var(--space-3)}.r .rm .rw{display:none}.stage{grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:var(--space-4)}.card{padding:var(--space-2) var(--space-3)}.card h3{font-size:var(--type-body);line-height:var(--leading-body)}.meta span:nth-child(n+4){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V1</b> the life of a working set: assembled, handed to someone who wasn’t there, a piece goes stale, decided on · bundle index, readback, breakers, errata, dispatch release</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* the five stops of WS-31's life. Space steps, 1–5 jumps */
const STOPS = [
  { key: 'assemble', on: '3 Nov', b: 'Assembled', w: `${P('tom').name} builds it for ${first(T.decider)}`, owner: 'tom', ver: 1 },
  { key: 'handover', on: '14 Nov', b: 'Handed over', w: `${first('tom')} moves to ${P('tom').moves.to}; ${first('leah')} reads it back`, owner: 'tom', ver: 2 },
  { key: 'stale', on: '18 Nov', b: 'A piece goes stale', w: `${T.supplierShort} withdraws its offer`, owner: 'leah', ver: 2, warn: true },
  { key: 'recheck', on: '24 Nov', b: 'Re-checked', w: `${first('leah')} answers only what moved`, owner: 'leah', ver: 3 },
  { key: 'decide', on: '1 Dec', b: 'Decided', w: `${first(T.decider)} decides on version 4`, owner: 'leah', ver: 4 }
];
const S = { k: 0, sub: 0 };
const CUR = () => STOPS[S.k].key;
/* by stop: which piece states show */
function stateAt(id) {
  const k = S.k, c = CH(id);
  if (k < 2 || !c) return 'holds';
  if (k === 2) return id === 'c2' ? 'gone' : (id === 'i5' ? 'orphan' : (['i4', 'd5'].includes(id) ? 'repaired' : 'holds'));
  return c.state === 'gone' ? 'replaced' : c.state === 'orphan' ? 'orphan' : 'repaired';
}
const USED = ['i2', 'c1', 'i3', 'c3', 'c4', 'i4'];
function rowHTML(p) {
  const st = stateAt(p.id), c = CH(p.id);
  const tier = p.rung === 'context' ? P(p.reader || T.decider).floor : '';
  let text = `<span class="t ${p.rung === 'context' ? 'as-context' : ''}" ${tier ? `data-tier="${tier}"` : ''}>${p.text}</span>`;
  if (st === 'gone') text = `<span class="t"><span class="old">${p.text}</span><span class="now">${I('unlink', 12)} No longer holds · ${c.on}: ${c.now}</span></span>`;
  if (st === 'replaced') text = `<span class="t">${c.now.split('. ').slice(1).join('. ')} <span class="small muted">· replaced ${c.on}, was “${p.text}”</span></span>`;
  if (st === 'repaired') text = `<span class="t">${c.now}<span class="small muted"> · repaired ${c.on}</span></span>`;
  if (st === 'orphan') text = `<span class="t">${p.text} ${saidHTML(p)}</span>`;
  const why = S.k === 1 && S.sub > 0 ? `<q>${p.reason}</q> <span class="small">${first(p.by)}</span>` : st === 'orphan' ? `<span>${CH(p.id).now}</span>` : (st === 'repaired' || st === 'replaced') ? `<span>${I('git-commit-horizontal', 12)} ${REASON[c.reason]} · ${c.why}</span>` : `${holdsHTML(p, st === 'gone')}`;
  const cls = [st === 'gone' ? 'gone' : '', st === 'repaired' || st === 'replaced' ? 'repaired' : '', st === 'orphan' ? 'orphan' : '', CUR() === 'decide' ? (USED.includes(p.id) ? 'used' : 'dim') : ''].join(' ');
  return `<div class="r ${cls}" data-id="${p.id}"><span class="n">${DATA.pieces.indexOf(p) + 1 || '+'}</span>${rm(p.rung, { word: false })}${text}<span class="y">${why}</span></div>`;
}
function setHTML() {
  const st = STOPS[S.k];
  const extra = S.k >= 3 ? RO.added : [];
  return `<section class="set"><div class="bar">${I('layers', 14)} <span>${T.id} · ${DATA.pieces.length + extra.length} pieces · ${DATA.setAside.length} set aside</span><span class="grow"></span><span>Owner ${whoHTML(st.owner)}</span>${S.k === 1 ? `<span>· changeover: both hold it</span>` : ''}</div>
    <div class="rows">${RUNGS.slice().reverse().map(r => `<div class="r grp">${RUNG[r].word}</div>` + [...DATA.pieces, ...extra].filter(p => p.rung === r).map(rowHTML).join('')).join('')}</div></section>`;
}
function actHTML() {
  const k = S.k;
  if (k === 0) return `<div class="card lit"><h3>Assembled, for a reader and a date</h3><p>${P('tom').name} put the set together for ${whoHTML(T.decider, { role: true })}, who decides by ${T.decideBy}. Each piece carries its rung, where it is kept, why it is here in his words, and what it holds while.</p></div>
    <div class="card"><p class="eyebrow">Given to an agent</p><p class="two">${mmHTML(true)} ${DATA.agent.name} under ${whoHTML(DATA.agent.supervisor)} was given ${DATA.bundle.given.length} documents and proposed ${DATA.bundle.proposed.length} clauses: ${DATA.bundle.proposed.filter(x => x.state === 'accepted').length} accepted (piece 13, its mark kept), ${DATA.bundle.proposed.filter(x => x.state === 'rejected').length} not.</p></div>
    <div class="card"><p class="eyebrow">Released for decision</p><p>Assembled by ${P('tom').name}. Released by <span class="lite">${P(T.decider).name}</span> once she is content with what is in it. <span class="muted">One piece runs out before the decision: the offer is valid until 19 Nov.</span></p></div>`;
  if (k === 1) return `<div class="card lit"><h3>${first('tom')} hands it to ${P('leah').name}</h3><p>${P('leah').name} starts on 14 Nov and wasn’t there for any of it. She gets the set, not a briefing: every reason in ${first('tom')}’s words (shown on the left), the set-aside list with why, and the agent’s bundle.</p><p class="muted">Ownership moves when she reads it back, not when it is sent. Until then both names show and ${first('tom')} still answers.</p></div>
    <div class="card ${S.sub > 1 ? '' : 'warn'}"><p class="eyebrow">What the set doesn’t hold</p><p>The handover asks ${first('tom')}: did anything happen that isn’t in it?</p>${RO.unrecorded.map(u => `<div class="gap ${S.sub > 1 ? 'filled swap' : ''}">${S.sub > 1 ? `${I('pen-line', 12)} <b>${u.on}:</b> ${P('kerry').name} said a recovery plan would follow “within a fortnight”. None has come. <span class="muted">Note added by ${P('tom').name}, 14 Nov, said not checked.</span>` : `<b>${u.on} · ${u.what}.</b> No note, no record.`}</div>`).join('')}</div>
    <div class="card ${S.sub > 2 ? 'lit' : ''}"><p class="eyebrow">Read back</p>${S.sub > 2 ? `<p>${P('leah').name}: <q class="pen">The decision turns on November’s count against clause 7.2. The offer runs out on 19 Nov. ${T.supplierShort}’s driver story and the recovery plan are said, not checked.</q></p><p class="two">${I('check', 14)} <span>Taken 17 Nov. ${DATA.agent.name}’s supervisor is now ${P('leah').name}; it waited until she took it.</span></p>` : `<p class="muted">Waiting for ${P('leah').name} to say back what the decision turns on.</p>`}</div>`;
  if (k === 2) { const c = CH('c2'); return `<div class="notice swap">${I('unlink', 18)}<div><p><b class="lite">A piece no longer holds.</b> ${PC('c2').text}: held while <s>${PC('c2').holds}</s>.</p><p class="muted">${REASON[c.reason]} · ${c.on} · ${c.now}</p></div></div>
    <div class="card"><p>The set doesn’t wait to be reopened. The one condition that broke trips the one piece that rests on it; ${P('leah').name}, the owner now, is told once, in place, with the reason. Nothing else lights.</p><div class="acts"><button class="btn sm go">${I('replace', 14)} Use “${c.replace}”</button><button class="btn sm">${I('archive', 14)} Set aside</button></div></div>
    <div class="card"><p class="eyebrow">Also moved, quietly</p><ul><li>${I('git-commit-horizontal', 12)} ${R.changedRounds[1]} went back to its old route on ${R.revertedN7}: pieces 5 and 9 repaired, a seam on each.</li><li>${I('user-x', 12)} Piece 10’s one source moved post on 14 Nov; still said, not checked.</li></ul></div>`; }
  if (k === 3) return `<div class="card lit"><h3>Re-checked: only what moved</h3><p>${P('leah').name} reopened it on ${RO.on}. Of ${DATA.pieces.length} pieces, ${Object.keys(RO.changes).length} moved; she answered those and nothing else.</p><ul>${Object.entries(RO.changes).map(([id, c]) => `<li class="ok">${I('check', 12)}<span>${DATA.pieces.findIndex(p => p.id === id) + 1} · ${c.state === 'gone' ? 'replaced' : c.state === 'orphan' ? 'asked, still marked' : 'kept, repaired'} <span class="muted">· ${REASON[c.reason]}</span></span></li>`).join('')}</ul><p class="muted">Added: ${RO.added[0].text}. The set is version 3; version 1 is kept, with an errata slip.</p></div>`;
  const d = DATA.decision;
  return `<div class="card lit"><p class="eyebrow">Decision · ${d.on} · rests on ${T.id} version 4</p><p class="lead" style="color:var(--light)">${d.text}</p><p class="sig">${P(d.by).name}</p><p class="muted">${P(d.by).role} · the named person with release authority for ${T.intent}</p></div>
    <div class="card"><p>Version 4 is version 3 with the new offer’s terms, released by ${first(T.decider)} on 28 Nov. It rests on the ${USED.length} pieces lit on the left; the rest were read and did not bear on it. ${d.board}</p><ul><li>${I('telescope', 12)} Projection that came true: clause 7.2’s service failure happened on 21 Nov.</li><li>${I('quote', 12)} Still said, not checked: ${lc(PC('i5').text)}; the decision doesn’t rest on it.</li></ul></div>`;
}
function render(fresh) {
  const st = STOPS[S.k];
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id], [['Space', 'next'], ['1–5', 'a stop'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="head"><div><p class="eyebrow">Working set · ${T.id} · from assembly to decision</p><h1>${T.title}</h1></div>
      <div class="meta"><span class="ver">v${st.ver}</span><span>For ${whoHTML(T.decider)}</span><span>Serves ${T.intent}</span><span>${st.on} 2026</span></div></div>
    <nav class="life" aria-label="Life of the working set">${STOPS.map((s, i) => `<button class="stop ${i < S.k ? 'past' : ''} ${s.warn && i <= S.k ? 'warn' : ''}" data-k="${i}" ${i === S.k ? 'aria-current="step"' : ''}><span class="d">${s.on}</span><b>${s.b}</b><span class="w">${s.w}</span></button>`).join('')}</nav>
    <div class="stage">${setHTML()}<aside class="act ${fresh ? 'swap' : ''}">${actHTML()}</aside></div>
  </div></main>`;
  hydrate($('#app'));
  $$('.stop').forEach(b => b.onclick = () => go(+b.dataset.k));
  if (CUR() === 'stale') { const r = $('.r[data-id="c2"]'); if (r) r.scrollIntoView({ block: 'nearest' }); }
}
function go(k) { S.k = Math.max(0, Math.min(STOPS.length - 1, k)); S.sub = S.k === 1 ? 3 : 0; render(true); }
function next() {
  if (S.k === 1 && S.sub < 3) { S.sub++; render(); return; }
  if (S.k < STOPS.length - 1) { S.k++; S.sub = 0; render(true); }
}
/* the moment at 1.2 s: hand over (stop 2), then the read-back fills in, step by step */
play(() => { S.k = 0; S.sub = 0; render(); }, () => {
  const step = ms('--motion-calm');
  later(() => { S.k = 1; S.sub = 1; render(true); }, 0);
  later(() => { S.sub = 2; render(); }, step * 1.4);
  later(() => { S.sub = 3; render(); }, step * 2.4);
}, (e) => { if (e.key === ' ') { e.preventDefault(); next(); } if ('12345'.includes(e.key)) go(+e.key - 1); });
</script>
</body>
</html>
