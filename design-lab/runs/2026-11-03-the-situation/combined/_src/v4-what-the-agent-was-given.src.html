<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Combined V4 · What the agent was given</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V4: an agent's working set, as the apprentice run's agent page would show it. What it was given and why; what it was not; what it said back, each clause tied to a given piece; a clause tied to nothing it was given is held ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3)}
.hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-4);align-items:center}
.mm.xl{--x-proposed-mark-size:2.75rem;font-size:var(--type-meta)}
.hd h1{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.hd p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.hd .lim{text-align:right;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
/* the mode line (apprentice): now, next, what stops it, why it last changed */
.mode{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--hairline-strong);border-radius:var(--radius-key);overflow:hidden}
.mode > div{display:grid;gap:2px;padding:var(--space-2) var(--space-3);border-right:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:box-shadow var(--motion-base) var(--ease-out)}
.mode > div:last-child{border-right:0}
.mode .k{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.mode .boxed{box-shadow:inset 0 0 0 1px var(--x-proposed-lit)}
.cols{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-2);overflow:auto;scrollbar-width:thin}
.col h2{display:flex;gap:var(--space-2);align-items:center;font-weight:300;font-size:var(--type-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.ex{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:2px var(--space-3);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);transition:border-color var(--motion-base) var(--ease-out),background var(--motion-base) var(--ease-out)}
.ex .lt{grid-row:span 3;font:400 var(--type-meta)/1 var(--font-mono);color:var(--ink-muted);padding-top:2px}
.ex b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.ex .dir{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.ex.hit{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.no{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px var(--space-3);padding:var(--space-2) var(--space-3);background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);transition:border-color var(--motion-base) var(--ease-out)}
.no b{font-weight:400;color:var(--ink)}
.no p{grid-column:2;color:var(--ink-muted)}
.no.hit{border-color:var(--x-proposed-broken)}
.cl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-3);border-radius:var(--radius-key);border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);align-items:start}
.cl p.t{font-style:italic;color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta)}
.cl .cite{grid-column:2 / -1;display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted)}
.cl .cite .tag{font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);padding:0 var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink)}
.cl.ink{border-style:solid;border-color:var(--hairline-strong);background:none}
.cl.ink p.t{font-style:normal;color:var(--light)}
.cl.off p.t{text-decoration:line-through;text-decoration-color:var(--ink-muted);color:var(--ink-muted)}
.cl.held{border:1px solid var(--x-proposed-broken);background:color-mix(in srgb,var(--warning) 5%,transparent)}
.cl.held .cite .tag{border-color:var(--x-proposed-broken);color:var(--x-proposed-broken)}
.cl .acts{grid-column:2 / -1;display:flex;gap:var(--space-2);flex-wrap:wrap}
.rule-box{padding:var(--space-2) var(--space-3);border-left:2px solid var(--hairline-strong);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rule-box b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){.hd p{display:none}.mode > div{padding:var(--space-1) var(--space-2)}.ex .src{display:none}.rule-box:nth-of-type(n+2){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V4</b> what the agent was given: its working set, each clause it says back tied to a piece it was given; one tied to nothing is held · the apprentice’s agent page, jury bundles, pencil and ink</div>
<script>
/*@DATA@*/
/*@LIB@*/
const A_ = DATA.agent, B = DATA.bundle;
const S = { third: false, mode: 0 };
const LT = k => String.fromCharCode(65 + k);
/* a third clause the agent offers: its claim leans on something it was not given */
const THIRD = { text: `${T.supplierShort} is three drivers short, so performance should recover by January.`, cites: 'Meeting note, 29 Oct' };
function clauseHTML(o, k) {
  const g = B.given.findIndex(x => x.ref === 'c3');
  if (o.state === 'accepted') return `<div class="cl ink">${mmHTML(true)}<p class="t">${o.text}</p><span class="small muted">${o.at}</span><span class="cite"><span class="tag">from ${LT(g)} · §7.4</span>${I('check', 12)} accepted by ${P(o.by).name} · now piece 13 of ${T.id}</span></div>`;
  return `<div class="cl off">${mmHTML(false)}<p class="t">${o.text}</p><span class="small muted">${o.at}</span><span class="cite"><span class="tag">from ${LT(g)} · §9.1</span>${I('x', 12)} not accepted by ${P(o.by).name}: <q>${o.why}</q></span></div>`;
}
const MODE = [
  { now: 'Reading A, the contract, for clauses on renewal', next: 'Compare B with A', stop: `${P(A_.supervisor).name} pauses it, or ${T.decideBy.replace(' 2026', '')} passes`, why: `Started 3 Nov 16:05 by ${P('tom').name}` },
  { now: 'Holding one clause for a person', next: 'Nothing until it is answered', stop: '—', why: 'A clause cited something outside its bundle' }
];
function render() {
  const m = MODE[S.mode];
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'Given to ' + A_.name], [['A', 'answer the held clause'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="hd"><span class="mm ink xl">${A_.mark}</span><div><p class="eyebrow">An agent’s working set · ${T.id}</p><h1>${A_.name} works under ${P(A_.supervisor).name}</h1><p>${A_.name} ${A_.errand}. Deputy ${P(A_.deputy).name}. Its working set is a slice of ${T.id}: the same pieces, each with a direction on what it may be used for, and a list of what it was not given and why.</p></div><p class="lim">${B.calls} of ${B.limit} model calls today<br>sealed 3 Nov 16:05<br>ends ${T.decideBy.replace(' 2026', '')}</p></div>
    <div class="mode" aria-live="polite"><div class="${S.mode ? 'boxed' : ''}"><span class="k">Now</span>${m.now}</div><div class="${S.mode ? 'boxed' : ''}"><span class="k">Next</span>${m.next}</div><div><span class="k">What stops it</span>${MODE[0].stop}</div><div class="${S.mode ? 'boxed' : ''}"><span class="k">Why it last changed</span>${m.why}</div></div>
    <div class="cols">
      <section class="col"><h2>${I('book-open-check', 18)} Given · ${B.given.length}</h2>
        ${B.given.map((g, k) => { const p = PC(g.ref); return `<div class="ex ${S.third ? '' : ''}"><span class="lt">${LT(k)}</span><b>${g.title} ${g.restricted ? I('lock', 12) : ''}</b>${srcHTML(p.src)}<p class="dir">${I('gavel', 12)} ${g.direction}</p></div>`; }).join('')}
        <h2 style="margin-top:var(--space-2)">${I('eye-off', 18)} Not given · ${B.notGiven.length}</h2>
        ${B.notGiven.map(n => `<div class="no ${S.third && n.title === THIRD.cites ? 'hit' : ''}">${I('lock', 14)}<b>${n.title}</b><p>${n.why}</p></div>`).join('')}
        <p class="rule-box"><b>The same record as a person’s set.</b> Each piece keeps its rung, source and reason; a direction is added. A person reviews what the agent was given before it runs, and can see after what it used.</p>
      </section>
      <section class="col"><h2>${I('pencil', 18)} What it said back</h2>
        <p class="small muted">Asked: <q class="pen">${T.question}</q> Every clause must name the given piece it comes from, by letter and place.</p>
        ${B.proposed.map(clauseHTML).join('')}
        ${S.third ? `<div class="cl held fresh">${mmHTML(false)}<p class="t">${THIRD.text}</p><span class="small muted">3 Nov 16:31</span><span class="cite"><span class="tag">cites: ${THIRD.cites}</span>${I('hand', 12)} Held: it cites something it was not given. ${A_.name} can’t have read it, so this is either a guess or a leak.</span>
          <span class="acts"><button class="btn sm go">${I('x', 14)} Strike it</button><button class="btn sm">${I('message-circle', 14)} Ask ${A_.name} where it came from</button></span></div>` : ''}
        <p class="rule-box"><b>It agrees with the apprentice run:</b> the agent works under a named person, its work is pencil with its mark until a person accepts it, and when ${T.id} is handed over its supervisor goes with it: no supervisor, no run.</p>
        <p class="rule-box"><b>What a context run adds:</b> the bundle is the agent’s whole world. A clause tied to nothing in it is held, not shown as an answer.</p>
      </section>
    </div>
  </div></main>`;
  hydrate($('#app'));
}
play(() => { S.third = false; S.mode = 0; render(); }, () => { S.third = true; S.mode = 1; render(); }, (e, k) => { if (k === 'a' && S.third) { S.third = false; S.mode = 0; render(); } });
</script>
</body>
</html>
