<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Combined V2 · The working set page</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V2: the working set as an Artifacts page. Questions on the left, pieces by rung in the middle, the piece's record on the right, each field naming the service that keeps it ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-3)}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2) var(--space-5);align-items:end}
.head h1{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.head .m{display:flex;gap:var(--space-1) var(--space-4);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);align-items:center}
.head .acts{display:flex;gap:var(--space-2);grid-row:1 / span 2;grid-column:2}
.cols{min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr) 380px;gap:var(--space-4)}
.qs{min-height:0;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:var(--space-1)}
.q{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px var(--space-2);padding:var(--space-2) var(--space-3);border-left:2px solid var(--hairline);text-align:left;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.q .n{font-family:var(--font-mono);color:var(--ink-muted)}
.q .s{grid-column:2;color:var(--ink-muted);display:flex;gap:var(--space-1);align-items:center}
.q[aria-pressed="true"]{border-left-color:var(--light);background:var(--surface-inset)}
.q.gap{border-left-style:dashed}
.ps{min-height:0;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:var(--space-1)}
.grp{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0 var(--space-1);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.p{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);text-align:left;transition:opacity var(--motion-base) var(--ease-out),border-color var(--motion-base) var(--ease-out),background var(--motion-base) var(--ease-out)}
.p .t{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.p .t.as-context{padding-left:var(--space-2);color:var(--light)}
.p .l{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2);align-items:center}
.p[aria-pressed="true"]{border-color:var(--light);background:var(--surface-raised)}
.p.under{border-color:var(--x-proposed-lit)}
.p.off{opacity:.42}
.rec{min-height:0;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane)}
.rec h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.f{display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--space-1) var(--space-3);padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.f > span:first-child{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding-top:2px}
.f q{font-style:italic}
.keeper{grid-column:2;display:none;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.keeper.need{color:var(--x-proposed-broken)}
.tech .keeper{display:block}
.tech .rec .tk,.tech .p .tk{display:none}
.rec h2{font-size:var(--type-body);line-height:var(--leading-body)}
.rec .tip{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:auto;padding-top:var(--space-2);border-top:1px solid var(--hairline)}
@media (max-width:1400px){.cols{grid-template-columns:210px minmax(0,1fr) 330px;gap:var(--space-3)}.p .t{font-size:var(--type-small);line-height:var(--leading-small)}.head .m span:nth-child(n+4){display:none}.f{grid-template-columns:80px minmax(0,1fr)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V2</b> the working set page: questions, pieces by rung, and each piece’s record with the service that keeps each field (T) · bundle index, questions first, where used, the release</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { q: null, sel: 'i2' };
const QS = [
  { q: `Is ${T.supplierShort} failing the contract?`, pieces: ['d1', 'd2', 'i1', 'i2', 'd4'], st: 'Answered' },
  { q: 'Can we decline to renew without penalty?', pieces: ['c1', 'i2'], st: 'Not until November' },
  { q: 'Is any of the rise our own doing?', pieces: ['d5', 'i4'], st: 'Answered' },
  { q: 'Do the two counts agree?', pieces: ['d3', 'i3'], st: 'Answered, in part' },
  { q: 'What would renewing cost, and the other ways?', pieces: ['c2', 'c3', 'c4'], st: 'Answered' },
  { q: `Can ${T.supplierShort} fix it, and how fast?`, pieces: ['i5'], st: 'Only something said', gap: true }
];
const usedBy = id => DATA.pieces.filter(p => (p.from || []).includes(id)).map(p => p.id);
const qsOf = id => QS.map((q, k) => q.pieces.includes(id) ? k + 1 : 0).filter(Boolean);
/* the record a piece carries, field by field, and the service that keeps each field today (or needs to) */
function recHTML(p) {
  const tier = p.rung === 'context' ? P(p.reader || T.decider).floor : '';
  const used = usedBy(p.id), from = p.from || [];
  const F_ = (k, v, keeper, need) => `<div class="f"><span>${k}</span><div>${v}</div><span class="keeper ${need ? 'need' : ''}">${need ? 'needs: ' : 'kept by '}${keeper}</span></div>`;
  return `<p class="eyebrow">Piece ${DATA.pieces.indexOf(p) + 1} of ${DATA.pieces.length}</p><h2 class="${p.rung === 'context' ? 'as-context' : ''}" ${tier ? `data-tier="${tier}"` : ''}>${p.text}</h2>
    ${F_('Rung', `${rm(p.rung)} <span class="muted">${RUNG[p.rung].what}</span>`, 'the working set (new)', true)}
    ${F_('Lifted by', p.lift ? liftsHTML(p) + (from.length ? `<br><span class="muted">from pieces ${from.map(f => DATA.pieces.findIndex(x => x.id === f) + 1).join(', ')}</span>` : '') : '<span class="muted">nothing: a reading, as read</span>', p.src.app === 'Explorer' ? 'Explorer (the query) · the set (the lift’s name)' : 'the working set (new)', p.src.app !== 'Explorer')}
    ${F_('Source', srcHTML(p.src) + `<br><span class="muted">kept by ${P(p.src.keeper).name}</span>`, p.src.app === 'Data Atlas' ? 'Data Atlas (fact, observation, provenance)' : p.src.app === 'Explorer' ? 'Explorer (saved query, version)' : 'Artifacts (document, version, library floor)')}
    ${p.said ? F_('Said by', saidHTML(p), 'Artifacts note · Data Atlas Triage when checked') : ''}
    ${p.agent ? F_('Made by', `${mmHTML(true)} ${DATA.agent.name}, accepted by ${P(p.by).name}`, 'model gateway audit · proposedBy / acceptedBy (apprentice)', true) : ''}
    ${F_('Why here', `<q>${p.reason}</q><br><span class="muted">${P(p.by).name}, ${p.at}</span>`, 'the working set (new)', true)}
    ${F_('For', p.rung === 'context' ? `${whoHTML(p.reader || T.decider, { role: true })}` : `<span class="muted">anyone reading ${T.id}: data and information name no reader</span>`, 'Identity (person, floor) · the set (the choice)')}
    ${F_('Serves', `${T.intent} · ${INTENT(T.intent).title}`, 'Mandate (intent) · the set (the link)')}
    ${F_('Holds while', holdsHTML(p), 'events service: a watch per condition', true)}
    ${F_('Answers', qsOf(p.id).map(n => 'Q' + n).join(', ') || '<span class="muted">no question: can’t stay without one</span>', 'the working set (new)', true)}
    ${F_('Used by', used.length ? used.map(u => `${DATA.pieces.findIndex(x => x.id === u) + 1}`).join(', ') : '<span class="muted">nothing else rests on it</span>', 'the working set (new)', true)}
    <p class="tip">${I('info', 12)} Press T to see which service keeps each field today, and which fields only a working set would hold.</p>`;
}
function pHTML(p) {
  const tier = p.rung === 'context' ? P(p.reader || T.decider).floor : '';
  const inQ = S.q === null || QS[S.q].pieces.includes(p.id);
  const under = S.sel && (PC(S.sel).from || []).includes(p.id);
  return `<button class="p ${inQ ? '' : 'off'} ${under ? 'under' : ''}" data-id="${p.id}" aria-pressed="${S.sel === p.id}"><span class="t ${p.rung === 'context' ? 'as-context' : ''}" ${tier ? `data-tier="${tier}"` : ''}>${p.text}</span><span class="small muted">${DATA.pieces.indexOf(p) + 1}</span>
    <span class="l">${liftsHTML(p)} ${saidHTML(p)} ${p.agent ? mmHTML(true) : ''} ${p.disagree ? '<span class="mk-disagree" title="sources disagree"></span>' : ''} ${srcHTML(p.src)}</span></button>`;
}
function render() {
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id], [['↑↓', 'piece'], ['Q', 'by question'], ['T', 'who keeps it', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="head"><div><p class="eyebrow">Working set · ${T.id} · version ${T.version} · a kind of Artifacts document</p><h1>${T.title}</h1></div>
      <p class="m"><span>Owner ${whoHTML(T.owner)}</span><span>For ${whoHTML(T.decider)}, by ${T.decideBy}</span><span>Serves ${T.intent} in Mandate</span><span>Assembled ${T.assembled}</span><span>${DATA.setAside.length} set aside</span></p>
      <div class="acts"><button class="btn sm">${I('bot', 14)} Given to ${DATA.agent.name}</button><button class="btn sm">${I('send', 14)} Hand over</button></div></div>
    <div class="cols">
      <nav class="qs" aria-label="Questions"><p class="eyebrow" style="padding:0 var(--space-3) var(--space-1)">The decision’s questions</p>${QS.map((q, k) => `<button class="q ${q.gap ? 'gap' : ''}" data-k="${k}" aria-pressed="${S.q === k}"><span class="n">Q${k + 1}</span><span>${q.q}</span><span class="s">${q.gap ? I('circle-dashed', 12) : I('check', 12)} ${q.st} · ${q.pieces.length}</span></button>`).join('')}
        <button class="q" data-k="all" aria-pressed="${S.q === null}"><span class="n">·</span><span>Every piece</span></button></nav>
      <section class="ps">${RUNGS.slice().reverse().map(r => `<p class="grp">${rm(r, { word: false })} ${RUNG[r].word} · ${DATA.pieces.filter(p => p.rung === r).length}</p>` + DATA.pieces.filter(p => p.rung === r).map(pHTML).join('')).join('')}</section>
      <aside class="rec">${recHTML(PC(S.sel))}</aside>
    </div>
  </div></main>`;
  hydrate($('#app'));
  $$('.p').forEach(b => b.onclick = () => { S.sel = b.dataset.id; render(); });
  $$('.q').forEach(b => b.onclick = () => { S.q = b.dataset.k === 'all' ? null : +b.dataset.k; render(); });
}
const order = () => RUNGS.slice().reverse().flatMap(r => DATA.pieces.filter(p => p.rung === r).map(p => p.id));
play(() => { S.q = null; S.sel = 'i2'; STATE.tech = false; document.body.classList.remove('tech'); render(); }, () => {
  S.q = 1; S.sel = 'c1'; render();
  later(() => { STATE.tech = true; document.body.classList.add('tech'); $('#h-t')?.classList.add('on'); }, ms('--motion-calm') * 1.6);
}, (e, k) => {
  const o = order(), i = o.indexOf(S.sel);
  if (e.key === 'ArrowDown') { e.preventDefault(); S.sel = o[Math.min(o.length - 1, i + 1)]; render(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); S.sel = o[Math.max(0, i - 1)]; render(); }
  if (k === 'q') { S.q = S.q === null ? 0 : S.q + 1 < QS.length ? S.q + 1 : null; render(); }
});
</script>
</body>
</html>
