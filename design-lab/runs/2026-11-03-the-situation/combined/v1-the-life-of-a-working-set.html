/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; listed as
   "needs token" in each notes.md. Carried marks first, then new.
   --------------------------------------------------------------- */
:root{
  /* carried: quiet lines, micro type, the lit next step */
  --x-proposed-quiet: .62;
  --x-proposed-type-micro: .6875rem;
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* carried: not yours to see (135 degree hatch) and stale (45 degree hatch) */
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  /* carried: sources disagree, a warning-tinted edge, never red */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  /* carried: pencil (reference desk), what a model or an agent wrote until a person accepts it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  /* carried: a visible repair (wear and time) */
  --x-proposed-seam: color-mix(in srgb, var(--info) 70%, var(--ink));
  --x-proposed-seam-wash: color-mix(in srgb, var(--info) 8%, transparent);
  /* carried: the maker's mark (apprentice) */
  --x-proposed-mark-size: 1.375rem;
  /* NEW: the rung mark, a three-step stair at text size; one step is this tall */
  --x-proposed-rung-step: calc(var(--space-1) - 1px);
  /* NEW: a lift, the step between two rungs (a comparison, a threshold, a question…): dashed, like a fold line */
  --x-proposed-lift-edge: color-mix(in srgb, var(--ink-muted) 55%, transparent);
  /* NEW: a broken "holds while" condition. Warm like disagree but lighter: it is a fact about time, not a dispute */
  --x-proposed-broken: color-mix(in srgb, var(--warning) 45%, var(--ink-muted));
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}

/* floors */

[data-tier="team"]{--fc:var(--floor-team-high);--fl:var(--floor-team-low)}

/* ---- the rung mark: a three-step stair, filled to the rung. Never a colour: a shape and a word ---- */

.rm .st i:nth-child(3){height:calc(var(--x-proposed-rung-step) * 3)}
.rm[data-r="1"] .st i:nth-child(-n+1),.rm[data-r="2"] .st i:nth-child(-n+2),.rm[data-r="3"] .st i:nth-child(-n+3){background:var(--ink)}

.rm.lg .st i{width:var(--space-2)}
.rm.lg .st i:nth-child(1){height:calc(var(--x-proposed-rung-step) * 2)}
.rm.lg .st i:nth-child(2){height:calc(var(--x-proposed-rung-step) * 4)}
.rm.lg .st i:nth-child(3){height:calc(var(--x-proposed-rung-step) * 6)}

/* how each rung reads: data as read (mono figure), information as a sentence, context as a sentence with its reader's edge */
.as-data{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard);white-space:nowrap}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}

}

/* ---- Combined V1: one working set from assembly, through a handover to someone who wasn't there, to a decision; one piece goes stale on the way ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3)}

.head{display:flex;align-items:flex-end;gap:var(--space-5);justify-content:space-between;flex-wrap:wrap}

.set .bar .grow{flex:1}

.r{display:grid;grid-template-columns:var(--space-5) var(--space-5) minmax(0,1fr) minmax(0,0.75fr);gap:var(--space-3);align-items:start;padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);transition:background var(--motion-calm) var(--ease-out),opacity var(--motion-base) var(--ease-out)}
.r .n{font-family:var(--font-mono);color:var(--ink-muted)}

/* right: what this moment asks of a person */

.card{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset)}

  background:

    linear-gradient(var(--ink-muted),var(--ink-muted)) left bottom / var(--t) 1px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) left bottom / 1px var(--t) no-repeat,
    linear-gradient(var(--ink-muted),var(--ink-muted)) right bottom / var(--t) 1px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) right bottom / 1px var(--t) no-repeat}

.sig{font:italic 300 var(--type-lead)/1.2 var(--font-sans);color:var(--light)}
.notice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--x-proposed-broken);border-radius:var(--radius-key);background:var(--slate-deep)}
.notice p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.notice svg{color:var(--x-proposed-broken)}
.swap{animation:land var(--motion-calm) var(--ease-out)}
@media (max-width:1400px){.stop .w{display:none}.r{grid-template-columns:var(--space-4) var(--space-5) minmax(0,1fr) minmax(0,0.7fr);padding:var(--space-1) var(--space-3)}.r .rm .rw{display:none}.stage{grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:var(--space-4)}.card{padding:var(--space-2) var(--space-3)}.card h3{font-size:var(--type-body);line-height:var(--leading-body)}.meta span:nth-child(n+4){display:none}}
</style>

<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V1</b> the life of a working set: assembled, handed to someone who wasn’t there, a piece goes stale, decided on · bundle index, readback, breakers, errata, dispatch release</div>
<script>
/* Sample data. Every name, label, count, floor and date below is deployment data:

const DATA = {

    { id: 'c1', rung: 'context', text: 'For the renewal: if November is also over 20, clause 7.2 calls it a service failure, and we can decline to renew without penalty. November decides it.', by: 'tom', at: '3 Nov', from: ['i2'],

      reason: 'Buys time if we don’t want three more years.', holds: 'the contract is in force', reader: 'grace' },
    { id: 'c4', rung: 'context', text: 'A retender takes about 9 months, so it can’t replace the contract by 31 Jan', by: 'tom', at: '3 Nov',

  /* pieces considered and set aside, with why. Kept, never deleted */
  setAside: [

    on: '24 Nov 2026', by: 'leah', weeks: 3,

/* ---- shared helpers (same in every page of the run) ---- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const I = (n, size = 16, stroke = 1.5) => Icons.svg(n, { size, stroke });
const RANK = Object.fromEntries(DATA.floorOrder.map((f, i) => [f, i]));
const P = id => DATA.people[id];
const F = id => DATA.floors[id];
const first = id => P(id).name.split(' ')[0];
const fmt = n => n.toLocaleString('en-GB');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ms = v => parseFloat(css(v)) || 0;
const R = DATA.reading;
const T = DATA.task;
const ALL = [...DATA.pieces, ...DATA.setAside, ...DATA.reopen.added];
const PC = id => ALL.find(p => p.id === id);
const INTENT = id => DATA.intents.find(x => x.id === id);
const READER = id => DATA.readers.find(x => x.id === id);
const CH = id => DATA.reopen.changes[id];
const STATE = { tech: false };

/* the three rungs, plain word first, the admin word one step down */
const RUNG = {
  data:    { n: 1, word: 'Data',        what: 'a reading',                        tech: 'observation · Data Atlas' },
  info:    { n: 2, word: 'Information', what: 'a reading given meaning',          tech: 'derived value · Explorer query' },
  context: { n: 3, word: 'Context',     what: 'meaning placed against a reader, a task and what else is going on', tech: 'working-set piece · Artifacts' }
};
const RUNGS = ['data', 'info', 'context'];
const APPICON = { 'Data Atlas': 'database', Explorer: 'compass', Artifacts: 'file-text', Mandate: 'target' };
/* the five reasons an answer moves (reference desk) */
const REASON = { happened: 'Something happened', learned: 'We learned about the past', access: 'Who can answer changed', settled: 'A guess was settled', meaning: 'A word changed meaning' };

function rm(rung, o = {}) {
  const r = RUNG[rung];
  return `<span class="rm ${o.lg ? 'lg' : ''}" data-r="${r.n}" title="${r.word}: ${r.what}"><span class="st" aria-hidden="true"><i></i><i></i><i></i></span>${o.word === false ? '' : `<span class="rw">${r.word}</span>`}<span class="tk">${r.tech}</span></span>`;
}
function liftHTML(l) {
  const L = DATA.lifts[l.k];
  return `<span class="lift" title="Lifted by ${L.word}">${I(L.icon, 12)}<span>${l.w}</span><span class="tk">&nbsp;· ${L.tech}</span></span>`;
}
const liftsHTML = p => (p.lift || []).map(liftHTML).join(' ');

/* access: a reader on floor f opens what is kept on f or the floors above it; restricted only by name */
function canOpen(src, readerId) {
  if (!readerId) return true;
  const p = P(readerId);
  if (src.restricted && !(src.restrictedTo || []).includes(readerId)) return false;
  return RANK[src.kept] <= RANK[p.floor];
}
function srcHTML(src, readerId) {
  if (!canOpen(src, readerId)) {
    return `<span class="unseen" title="${src.restricted || 'Kept on a floor this reader doesn’t read'}">${I('lock', 12)} not yours to see · ask ${P(src.keeper).name}</span>`;
  }
  return `<span class="src" data-tier="${src.kept}">${I(APPICON[src.app], 12)}<b>${src.title}</b><span class="fdot" aria-hidden="true"></span>${F(src.kept).word}${src.restricted ? ` ${I('lock', 12)}` : ''}<span class="tk">&nbsp;· ${src.tech}</span></span>`;
}
function whoHTML(id, o = {}) {
  const p = P(id);
  return `<span class="who" data-tier="${p.floor || 'outside'}"><span class="fdot" aria-hidden="true"></span><span>${p.name}${o.role ? `<span class="muted">, ${p.role}</span>` : ''}</span></span>`;
}
const mmHTML = (ink = true) => `<span class="mm ${ink ? 'ink' : ''}" title="${DATA.agent.name}, under ${P(DATA.agent.supervisor).name}">${DATA.agent.mark}</span>`;
function holdsHTML(p, broken) {
  return `<span class="holds ${broken ? 'broken' : ''}">${I(broken ? 'unlink' : 'link-2', 12)} holds while <b>${p.holds}</b></span>`;
}
function saidHTML(p) {
  return p.said ? `<span class="said">${I('quote', 12)} said by ${P(p.said).name}, not checked</span>` : '';
}
/* the class a piece's text takes, so each rung reads differently */
const asRung = r => r === 'data' ? 'as-data' : r === 'info' ? 'as-info' : 'as-context';

/* a piece of a working set, the standard row. opts: reader, why, holds, compact */
function pieceHTML(p, o = {}) {
  const reader = o.reader;
  const tier = p.rung === 'context' ? P(p.reader || T.decider).floor : '';
  const agent = p.agent ? `${mmHTML(true)} <span class="small muted">proposed by ${DATA.agent.name}, accepted by ${P(p.by).name}</span>` : '';
  return `<article class="pc dep ${o.cls || ''}" data-id="${p.id}" style="--i:${o.i || 0}">
    <div class="pc-h">${rm(p.rung)} ${liftsHTML(p)} ${p.disagree ? '<span class="mk-disagree" title="sources disagree"></span>' : ''}</div>
    <p class="pc-t ${asRung(p.rung)}" ${tier ? `data-tier="${tier}"` : ''}>${p.text}</p>
    <p class="pc-m">${srcHTML(p.src, reader)} ${saidHTML(p)} ${agent}</p>
    ${o.why === false ? '' : `<p class="pc-why"><q>${p.reason}</q> <span class="by">${P(p.by).name}, ${p.at}</span></p>`}
    ${o.holds === false || !p.holds ? '' : `<p>${holdsHTML(p, o.broken)}</p>`}
  </article>`;
}

/* the reading as a line, with the contract limit; months beyond the series can be passed in */
function chart(o = {}) {
  const w = o.w || 360, h = o.h || 120, pad = 18;
  const s = o.series || R.series;
  const max = Math.max(...s.map(p => p.v), R.limit) * 1.15;
  const X = i => pad + i * (w - pad * 2) / (s.length - 1), Y = v => h - pad - v * (h - pad * 2) / max;
  const pts = s.map((p, i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const lim = o.limit === false ? '' : `<line x1="${pad}" x2="${w - pad}" y1="${Y(R.limit)}" y2="${Y(R.limit)}" stroke="var(--ink-muted)" stroke-dasharray="3 3"/><text x="${pad}" y="${Y(R.limit) - 4}" text-anchor="start" fill="var(--ink-muted)" style="font:var(--x-proposed-type-micro) var(--font-mono)">limit ${R.limit}</text>`;
  const dots = s.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="${o.hi && o.hi.includes(p.m) ? 3.5 : 2}" fill="${o.hi && o.hi.includes(p.m) ? 'var(--light)' : 'var(--ink)'}"/>`).join('');
  const labels = s.map((p, i) => `<text x="${X(i)}" y="${h - 3}" text-anchor="middle" fill="var(--ink-muted)" style="font:var(--x-proposed-type-micro) var(--font-mono)">${p.m}</text>`).join('');
  const vals = o.values ? s.map((p, i) => `<text x="${X(i)}" y="${Y(p.v) - 7}" text-anchor="middle" fill="${o.hi && o.hi.includes(p.m) ? 'var(--light)' : 'var(--ink-muted)'}" style="font:var(--x-proposed-type-micro) var(--font-mono)">${p.v}</text>`).join('') : '';
  const extra = o.extra ? o.extra(X, Y) : '';
  return `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${R.label} by month: ${s.map(p => p.m + ' ' + p.v).join(', ')}; limit ${R.limit}">${lim}${extra}<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>${dots}${vals}${labels}</svg>`;
}

/* top bar */
function topHTML(crumbs, hints, floor = T.floor) {
  return `<header class="top"><p class="brand">AUGUR</p>
    <nav class="crumb" aria-label="Where you are">${crumbs.map((c, i) => (i ? I('chevron-right', 14) : '') + (i === crumbs.length - 1 ? `<b>${c}</b>` : `<span>${c}</span>`)).join('')}</nav>
    <span class="fchip" data-tier="${floor}">${F(floor).name} · ${F(floor).word}</span>
    <div class="hints">${hints.map(([k, w, id]) => `<span ${id ? `id="${id}"` : ''}><span class="kbd">${k}</span>${w}</span>`).join('')}</div></header>`;
}

/* timers for the auto demo, cleared on replay */
let TIMERS = [];
const later = (fn, t) => TIMERS.push(setTimeout(fn, reduced ? Math.min(t, 60) : t));
const clearLater = () => { TIMERS.forEach(clearTimeout); TIMERS = []; };

/* one runner per page: render(), then the moment at about 1.2 s; R replays, T shows the admin words */
function play(render, moment, keys) {
  const replay = () => {
    clearLater();
    document.body.classList.add('pre');
    render(true);
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('pre')));
    if (moment) later(moment, ms('--motion-run'));
  };
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input,textarea')) return;
    const k = e.key.toLowerCase();
    if (k === 'r') { replay(); return; }
    if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); $('#h-t')?.classList.toggle('on', STATE.tech); return; }
    keys && keys(e, k);
  });
  replay();
  return replay;
}
const hydrate = el => Icons.hydrate(el || document.body);
const lc = s => s[0].toLowerCase() + s.slice(1);

/* three weeks on: the state of each piece when the set is reopened */
const STATEW = { holds: 'Still holds', changed: 'Changed', gone: 'No longer holds', orphan: 'Its one source has moved on', new: 'New since' };
const STATEICON = { holds: 'check', changed: 'git-commit-horizontal', gone: 'unlink', orphan: 'user-x', new: 'plus' };
const stateOf = id => (CH(id) || {}).state || (DATA.reopen.added.some(a => a.id === id) ? 'new' : 'holds');
const RO = DATA.reopen;
function stateChip(id) {
  const s = stateOf(id), c = CH(id);
  return `<span class="stc st-${s}">${I(STATEICON[s], 12)} ${STATEW[s]}${c ? ` · ${c.on}` : ''}</span>`;
}

/* the five stops of WS-31's life. Space steps, 1–5 jumps */
const STOPS = [
  { key: 'assemble', on: '3 Nov', b: 'Assembled', w: `${P('tom').name} builds it for ${first(T.decider)}`, owner: 'tom', ver: 1 },
  { key: 'handover', on: '14 Nov', b: 'Handed over', w: `${first('tom')} moves to ${P('tom').moves.to}; ${first('leah')} reads it back`, owner: 'tom', ver: 2 },
  { key: 'stale', on: '18 Nov', b: 'A piece goes stale', w: `${T.supplierShort} withdraws its offer`, owner: 'leah', ver: 2, warn: true },
  { key: 'recheck', on: '24 Nov', b: 'Re-checked', w: `${first('leah')} answers only what moved`, owner: 'leah', ver: 3 },
  { key: 'decide', on: '1 Dec', b: 'Decided', w: `${first(T.decider)} decides on version 4`, owner: 'leah', ver: 4 }
];
const S = { k: 0, sub: 0 };
const CUR = () => STOPS[S.k].key;
/* by stop: which piece states show */
function stateAt(id) {
  const k = S.k, c = CH(id);
  if (k < 2 || !c) return 'holds';
  if (k === 2) return id === 'c2' ? 'gone' : (id === 'i5' ? 'orphan' : (['i4', 'd5'].includes(id) ? 'repaired' : 'holds'));
  return c.state === 'gone' ? 'replaced' : c.state === 'orphan' ? 'orphan' : 'repaired';
}
const USED = ['i2', 'c1', 'i3', 'c3', 'c4', 'i4'];
function rowHTML(p) {
  const st = stateAt(p.id), c = CH(p.id);
  const tier = p.rung === 'context' ? P(p.reader || T.decider).floor : '';
  let text = `<span class="t ${p.rung === 'context' ? 'as-context' : ''}" ${tier ? `data-tier="${tier}"` : ''}>${p.text}</span>`;
  if (st === 'gone') text = `<span class="t"><span class="old">${p.text}</span><span class="now">${I('unlink', 12)} No longer holds · ${c.on}: ${c.now}</span></span>`;
  if (st === 'replaced') text = `<span class="t">${c.now.split('. ').slice(1).join('. ')} <span class="small muted">· replaced ${c.on}, was “${p.text}”</span></span>`;
  if (st === 'repaired') text = `<span class="t">${c.now}<span class="small muted"> · repaired ${c.on}</span></span>`;
  if (st === 'orphan') text = `<span class="t">${p.text} ${saidHTML(p)}</span>`;
  const why = S.k === 1 && S.sub > 0 ? `<q>${p.reason}</q> <span class="small">${first(p.by)}</span>` : st === 'orphan' ? `<span>${CH(p.id).now}</span>` : (st === 'repaired' || st === 'replaced') ? `<span>${I('git-commit-horizontal', 12)} ${REASON[c.reason]} · ${c.why}</span>` : `${holdsHTML(p, st === 'gone')}`;
  const cls = [st === 'gone' ? 'gone' : '', st === 'repaired' || st === 'replaced' ? 'repaired' : '', st === 'orphan' ? 'orphan' : '', CUR() === 'decide' ? (USED.includes(p.id) ? 'used' : 'dim') : ''].join(' ');
  return `<div class="r ${cls}" data-id="${p.id}"><span class="n">${DATA.pieces.indexOf(p) + 1 || '+'}</span>${rm(p.rung, { word: false })}${text}<span class="y">${why}</span></div>`;
}
function setHTML() {
  const st = STOPS[S.k];
  const extra = S.k >= 3 ? RO.added : [];
  return `<section class="set"><div class="bar">${I('layers', 14)} <span>${T.id} · ${DATA.pieces.length + extra.length} pieces · ${DATA.setAside.length} set aside</span><span class="grow"></span><span>Owner ${whoHTML(st.owner)}</span>${S.k === 1 ? `<span>· changeover: both hold it</span>` : ''}</div>
    <div class="rows">${RUNGS.slice().reverse().map(r => `<div class="r grp">${RUNG[r].word}</div>` + [...DATA.pieces, ...extra].filter(p => p.rung === r).map(rowHTML).join('')).join('')}</div></section>`;
}
function actHTML() {
  const k = S.k;
  if (k === 0) return `<div class="card lit"><h3>Assembled, for a reader and a date</h3><p>${P('tom').name} put the set together for ${whoHTML(T.decider, { role: true })}, who decides by ${T.decideBy}. Each piece carries its rung, where it is kept, why it is here in his words, and what it holds while.</p></div>
    <div class="card"><p class="eyebrow">Given to an agent</p><p class="two">${mmHTML(true)} ${DATA.agent.name} under ${whoHTML(DATA.agent.supervisor)} was given ${DATA.bundle.given.length} documents and proposed ${DATA.bundle.proposed.length} clauses: ${DATA.bundle.proposed.filter(x => x.state === 'accepted').length} accepted (piece 13, its mark kept), ${DATA.bundle.proposed.filter(x => x.state === 'rejected').length} not.</p></div>
    <div class="card"><p class="eyebrow">Released for decision</p><p>Assembled by ${P('tom').name}. Released by <span class="lite">${P(T.decider).name}</span> once she is content with what is in it. <span class="muted">One piece runs out before the decision: the offer is valid until 19 Nov.</span></p></div>`;
  if (k === 1) return `<div class="card lit"><h3>${first('tom')} hands it to ${P('leah').name}</h3><p>${P('leah').name} starts on 14 Nov and wasn’t there for any of it. She gets the set, not a briefing: every reason in ${first('tom')}’s words (shown on the left), the set-aside list with why, and the agent’s bundle.</p><p class="muted">Ownership moves when she reads it back, not when it is sent. Until then both names show and ${first('tom')} still answers.</p></div>
    <div class="card ${S.sub > 1 ? '' : 'warn'}"><p class="eyebrow">What the set doesn’t hold</p><p>The handover asks ${first('tom')}: did anything happen that isn’t in it?</p>${RO.unrecorded.map(u => `<div class="gap ${S.sub > 1 ? 'filled swap' : ''}">${S.sub > 1 ? `${I('pen-line', 12)} <b>${u.on}:</b> ${P('kerry').name} said a recovery plan would follow “within a fortnight”. None has come. <span class="muted">Note added by ${P('tom').name}, 14 Nov, said not checked.</span>` : `<b>${u.on} · ${u.what}.</b> No note, no record.`}</div>`).join('')}</div>
    <div class="card ${S.sub > 2 ? 'lit' : ''}"><p class="eyebrow">Read back</p>${S.sub > 2 ? `<p>${P('leah').name}: <q class="pen">The decision turns on November’s count against clause 7.2. The offer runs out on 19 Nov. ${T.supplierShort}’s driver story and the recovery plan are said, not checked.</q></p><p class="two">${I('check', 14)} <span>Taken 17 Nov. ${DATA.agent.name}’s supervisor is now ${P('leah').name}; it waited until she took it.</span></p>` : `<p class="muted">Waiting for ${P('leah').name} to say back what the decision turns on.</p>`}</div>`;
  if (k === 2) { const c = CH('c2'); return `<div class="notice swap">${I('unlink', 18)}<div><p><b class="lite">A piece no longer holds.</b> ${PC('c2').text}: held while <s>${PC('c2').holds}</s>.</p><p class="muted">${REASON[c.reason]} · ${c.on} · ${c.now}</p></div></div>
    <div class="card"><p>The set doesn’t wait to be reopened. The one condition that broke trips the one piece that rests on it; ${P('leah').name}, the owner now, is told once, in place, with the reason. Nothing else lights.</p><div class="acts"><button class="btn sm go">${I('replace', 14)} Use “${c.replace}”</button><button class="btn sm">${I('archive', 14)} Set aside</button></div></div>
    <div class="card"><p class="eyebrow">Also moved, quietly</p><ul><li>${I('git-commit-horizontal', 12)} ${R.changedRounds[1]} went back to its old route on ${R.revertedN7}: pieces 5 and 9 repaired, a seam on each.</li><li>${I('user-x', 12)} Piece 10’s one source moved post on 14 Nov; still said, not checked.</li></ul></div>`; }
  if (k === 3) return `<div class="card lit"><h3>Re-checked: only what moved</h3><p>${P('leah').name} reopened it on ${RO.on}. Of ${DATA.pieces.length} pieces, ${Object.keys(RO.changes).length} moved; she answered those and nothing else.</p><ul>${Object.entries(RO.changes).map(([id, c]) => `<li class="ok">${I('check', 12)}<span>${DATA.pieces.findIndex(p => p.id === id) + 1} · ${c.state === 'gone' ? 'replaced' : c.state === 'orphan' ? 'asked, still marked' : 'kept, repaired'} <span class="muted">· ${REASON[c.reason]}</span></span></li>`).join('')}</ul><p class="muted">Added: ${RO.added[0].text}. The set is version 3; version 1 is kept, with an errata slip.</p></div>`;
  const d = DATA.decision;
  return `<div class="card lit"><p class="eyebrow">Decision · ${d.on} · rests on ${T.id} version 4</p><p class="lead" style="color:var(--light)">${d.text}</p><p class="sig">${P(d.by).name}</p><p class="muted">${P(d.by).role} · the named person with release authority for ${T.intent}</p></div>
    <div class="card"><p>Version 4 is version 3 with the new offer’s terms, released by ${first(T.decider)} on 28 Nov. It rests on the ${USED.length} pieces lit on the left; the rest were read and did not bear on it. ${d.board}</p><ul><li>${I('telescope', 12)} Projection that came true: clause 7.2’s service failure happened on 21 Nov.</li><li>${I('quote', 12)} Still said, not checked: ${lc(PC('i5').text)}; the decision doesn’t rest on it.</li></ul></div>`;
}
function render(fresh) {
  const st = STOPS[S.k];
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id], [['Space', 'next'], ['1–5', 'a stop'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="head"><div><p class="eyebrow">Working set · ${T.id} · from assembly to decision</p><h1>${T.title}</h1></div>
      <div class="meta"><span class="ver">v${st.ver}</span><span>For ${whoHTML(T.decider)}</span><span>Serves ${T.intent}</span><span>${st.on} 2026</span></div></div>
    <nav class="life" aria-label="Life of the working set">${STOPS.map((s, i) => `<button class="stop ${i < S.k ? 'past' : ''} ${s.warn && i <= S.k ? 'warn' : ''}" data-k="${i}" ${i === S.k ? 'aria-current="step"' : ''}><span class="d">${s.on}</span><b>${s.b}</b><span class="w">${s.w}</span></button>`).join('')}</nav>
    <div class="stage">${setHTML()}<aside class="act ${fresh ? 'swap' : ''}">${actHTML()}</aside></div>
  </div></main>`;
  hydrate($('#app'));
  $$('.stop').forEach(b => b.onclick = () => go(+b.dataset.k));
  if (CUR() === 'stale') { const r = $('.r[data-id="c2"]'); if (r) r.scrollIntoView({ block: 'nearest' }); }
}
function go(k) { S.k = Math.max(0, Math.min(STOPS.length - 1, k)); S.sub = S.k === 1 ? 3 : 0; render(true); }
function next() {
  if (S.k === 1 && S.sub < 3) { S.sub++; render(); return; }
  if (S.k < STOPS.length - 1) { S.k++; S.sub = 0; render(true); }
}
/* the moment at 1.2 s: hand over (stop 2), then the read-back fills in, step by step */
play(() => { S.k = 0; S.sub = 0; render(); }, () => {
  const step = ms('--motion-calm');
  later(() => { S.k = 1; S.sub = 1; render(true); }, 0);
  later(() => { S.sub = 2; render(); }, step * 1.4);
  later(() => { S.sub = 3; render(); }, step * 2.4);
}, (e) => { if (e.key === ' ') { e.preventDefault(); next(); } if ('12345'.includes(e.key)) go(+e.key - 1); });
</script>
</body>
</html>
