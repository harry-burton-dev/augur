<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Frames V5 · Agreed facts, issues in dispute</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: the two people first agree what they agree on, line by line, then list only what is still in dispute, each with what would decide it ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-6)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);overflow:auto;scrollbar-width:thin}
.col h2{font-weight:300;font-size:var(--type-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light);display:flex;gap:var(--space-2);align-items:center}
.af{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-3);align-items:start;padding:var(--space-2) 0;border-top:1px solid var(--hairline)}
.af .no{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.af p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.ini{display:flex;gap:var(--space-1)}
.ini span{display:inline-flex;align-items:center;justify-content:center;min-width:var(--space-6);height:var(--space-5);padding:0 var(--space-1);border:1px solid var(--fc);border-radius:var(--radius-key);font:italic 400 var(--type-small)/1 var(--font-sans);color:var(--light);opacity:0;transform:scale(.9);transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out)}
.ini span.on{opacity:1;transform:none}
.iss{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--x-proposed-disagree);border-left-width:2px;border-radius:var(--radius-key);background:var(--x-proposed-disagree-wash)}
.iss h3{font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.iss .pos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.iss .pos div{display:grid;gap:var(--space-1);padding-left:var(--space-2);border-left:2px solid var(--fc);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.iss .dec{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);display:flex;gap:var(--space-2);align-items:baseline}
.iss .dec svg{flex:none;transform:translateY(2px);color:var(--x-proposed-lit)}
.note{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (prefers-reduced-motion: reduce){.ini span{transform:none}}
@media (max-width:1400px){.af p{font-size:var(--type-small);line-height:var(--leading-small)}.iss{padding:var(--space-2) var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Frames · V5</b> agreed facts, issues in dispute: initial what you agree on, list only what you don’t, each with what would decide it · statement of agreed facts and issues, Scott schedule</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { n: 0 };
const [A, B] = DATA.frames;
const ini = id => P(id).name.split(' ').map(w => w[0]).join('');
const AGREED = ['d1', 'd2', 'd5', 'i1', 'i2', 'i4'];
const ISSUES = [
  { q: 'Is the rise mostly the route change, or mostly the supplier?', a: A.reading, b: 'Most of the rise is on the two rounds we redesigned.', dec: DATA.settle.test },
  { q: 'Should the “no access” calls count?', a: `Yes: the contract counts every scheduled bin (${R.limitWhere}).`, b: `Only where the crews have evidence: ${R.noAccessWithPhotos} of ${R.noAccess} so far.`, dec: `${T.supplierShort}’s vehicle tracking for the ${R.noAccess - R.noAccessWithPhotos} without photos.` },
  { q: `Is ${T.supplierShort} short of drivers?`, a: 'Yes, they said so.', b: 'Nobody has checked.', dec: `A written answer from ${P('kerry').name}, with rotas.` }
];
function render() {
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'Two frames'], [['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <section class="col"><div><p class="eyebrow">Two frames · ${whoHTML(A.who)} and ${whoHTML(B.who)}</p><h1 class="title">What we agree</h1></div>
      <p class="note">Each line is initialled by both. Agreeing a fact is not agreeing what it means; that goes on the right.</p>
      ${AGREED.map((id, k) => { const p = PC(id); return `<div class="af"><span class="no">${k + 1}</span><div><p>${p.text}</p>${rm(p.rung)}</div><span class="ini">${[A.who, B.who].map((w, j) => `<span data-tier="${P(w).floor}" class="${S.n > k * 2 + j ? 'on' : ''}" title="${P(w).name}">${ini(w)}</span>`).join('')}</span></div>`; }).join('')}
      <p class="note">${I('check', 12)} ${AGREED.length} facts, both initials on each. These go into ${T.id} as agreed, and nobody needs to argue about them again.</p>
    </section>
    <section class="col"><h2>${I('split', 18)} Still in dispute · ${ISSUES.length}</h2>
      ${ISSUES.map(x => `<div class="iss"><h3>${x.q}</h3><div class="pos"><div data-tier="${P(A.who).floor}"><span class="eyebrow">${first(A.who)}</span>${x.a}</div><div data-tier="${P(B.who).floor}"><span class="eyebrow">${first(B.who)}</span>${x.b}</div></div><p class="dec">${I('scale', 14)}<span><b class="lite">Would decide it:</b> ${x.dec}</span></p></div>`).join('')}
      <p class="note">The decision maker, ${whoHTML(T.decider)}, reads the agreed facts as fact and the issues as open, with both positions in their authors’ words.</p>
    </section>
  </div></main>`;
  hydrate($('#app'));
}
const showIni = () => $$('.ini span').forEach((el, k) => el.classList.toggle('on', k < S.n));
play(() => { S.n = 0; render(); }, () => {
  const step = ms('--motion-quick');
  for (let k = 1; k <= AGREED.length * 2; k++) later(() => { S.n = k; showIni(); }, k * step);
});
</script>
</body>
</html>
