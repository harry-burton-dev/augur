<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Frames V1 · Side by side, and what would settle it</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: two frames either side of the shared data; under them, the test that would settle it, run once ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.three{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,0.8fr) minmax(0,1fr);gap:var(--space-4)}
.frame{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);border:1px solid color-mix(in srgb,var(--fc) 40%,transparent);border-radius:var(--radius-inset);background:var(--surface-pane)}
.frame h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.frame .rd{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);border-left:2px solid var(--fc);padding-left:var(--space-3)}
.frame h3{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.frame ul{display:grid;gap:var(--space-1)}
.frame li{display:flex;gap:var(--space-2);align-items:baseline;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.frame .pred{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);font-style:italic}
.stamp{margin-top:auto;display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);border:1px solid var(--fc);border-radius:var(--radius-key);font:400 var(--type-small)/1.4 var(--font-mono);color:var(--light);width:max-content;opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.done .stamp{opacity:1}
.shared{min-height:0;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);border:1px dashed var(--hairline-strong);border-radius:var(--radius-inset)}
.shared .it{display:grid;gap:2px;padding:var(--space-1) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.shared .it .by{display:flex;gap:var(--space-1)}
.shared .it .by i{width:var(--space-3);height:3px;border-radius:1px;background:var(--fc)}
.settle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:var(--space-5);align-items:center;padding:var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-inset)}
.settle .q{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.split{display:grid;gap:var(--space-2)}
.split .bar{display:flex;height:var(--space-4);border-radius:2px;overflow:hidden;background:var(--hairline)}
.split .bar i{display:block;height:100%;transition:width var(--motion-calm) var(--ease-out)}
.split .bar i.b{background:var(--floor-team-high)}
.split .bar i.a{background:var(--floor-department-high)}
.split p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.verdict{opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.done .verdict{opacity:1}
@media (max-width:1400px){.frame{padding:var(--space-3)}.frame .rd{font-size:var(--type-small);line-height:var(--leading-small)}.shared .it .src{display:none}.settle{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}.settle .btn{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Frames · V1</b> side by side: two readings of the same data, never averaged, and the test that would settle it · Klein, Moon and Hoffman’s data/frame theory, Weick</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { done: false };
const ST = DATA.settle;
const shared = [...new Set(DATA.frames.flatMap(f => f.cues))];
function frameHTML(f) {
  const p = P(f.who);
  return `<section class="frame" data-tier="${p.floor}"><span class="eyebrow">Frame ${f.id} · ${whoHTML(f.who, { role: true })}</span><h2>${f.name}</h2><p class="rd">${f.reading}</p>
    <h3>The cues it picks</h3><ul>${f.cues.map(id => `<li>${rm(PC(id).rung, { word: false })}<span>${PC(id).text}</span></li>`).join('')}</ul>
    <h3>If it is right, we should see</h3><p class="pred">${f.predicts}</p>
    <span class="stamp">${I('scale', 14)} holds in part</span></section>`;
}
function render() {
  const total = ST.rise;
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'Two frames'], [['S', 'settle it'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap ${S.done ? 'done' : ''}">
    <div><p class="eyebrow">Two frames · ${T.id} · the same data, read two ways</p><h1 class="title">Both frames, not an average</h1></div>
    <div class="three">${frameHTML(DATA.frames[0])}
      <section class="shared"><span class="eyebrow">The data both look at</span>${shared.map(id => { const p = PC(id), by = DATA.frames.filter(f => f.cues.includes(id)); return `<div class="it">${rm(p.rung)}<span>${p.text}</span><span class="by">${by.map(f => `<i data-tier="${P(f.who).floor}" title="a cue for frame ${f.id}"></i>`).join('')}${srcHTML(p.src)}</span></div>`; }).join('')}
        <p class="small muted" style="margin-top:auto">Each frame picks different cues from the same set. Neither is shown as the right one until the test below.</p></section>
      ${frameHTML(DATA.frames[1])}</div>
    <div class="settle"><div><span class="eyebrow">What would settle it</span><p class="q">${ST.test}</p></div>
      <div class="split"><div class="bar" role="img" aria-label="${ST.onChanged} of ${total} on the changed rounds, ${ST.onOther} on the others"><i class="b" style="width:${S.done ? ST.onChanged / total * 100 : 0}%"></i><i class="a" style="width:${S.done ? ST.onOther / total * 100 : 0}%"></i></div>
        <p class="verdict">${ST.verdict}</p></div>
      <button class="btn ${S.done ? '' : 'go'}" id="run">${I('play', 14)} ${S.done ? 'Settled once · see why' : 'Run the test'}</button></div>
  </div></main>`;
  hydrate($('#app'));
  $('#run').onclick = settle;
}
function settle() { if (S.done) return; S.done = true; const w = $('.wrap'); w.classList.add('done'); const t = ST.rise; $('.bar .b').style.width = ST.onChanged / t * 100 + '%'; $('.bar .a').style.width = ST.onOther / t * 100 + '%'; $('#run').classList.remove('go'); $('#run').innerHTML = `${I('check', 14)} Settled once`; }
play(() => { S.done = false; render(); }, settle, (e, k) => { if (k === 's') settle(); });
</script>
</body>
</html>
