<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Frames V6 · The crux</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: before the test is run, each person writes what result would change their mind. Then it runs, once, and each rule applies itself ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-4)}
.test{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-4);align-items:center;padding:var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-inset)}
.test p{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.sealed{display:inline-flex;align-items:center;gap:var(--space-2);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.res{font:300 var(--type-title-s)/1 var(--font-mono);color:var(--light);opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.ran .res{opacity:1}
.two{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-5)}
.p{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);border:1px solid color-mix(in srgb,var(--fc) 40%,transparent);border-radius:var(--radius-inset);background:var(--surface-pane)}
.p h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.prerule{display:grid;gap:var(--space-1);padding:var(--space-3);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key)}
.prerule q{font-style:italic;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.prerule .when{font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted)}
.out{display:grid;gap:var(--space-1);padding:var(--space-3);border-left:2px solid var(--x-proposed-lit);background:var(--x-proposed-lit-wash);opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.ran .out{opacity:1}
.out p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.out .muted{font-size:var(--type-small)}
@media (max-width:1400px){.test p{font-size:var(--type-body);line-height:var(--leading-body)}.p{padding:var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Frames · V6</b> the crux: each writes, before the test, what result would change their mind; the test runs once and each rule applies itself · double crux, pre-registration</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { ran: false };
const [A, B] = DATA.frames, ST = DATA.settle;
const share = Math.round(ST.onChanged / ST.rise * 100);
/* written before the test: the result that would change each mind */
const RULES = {
  [A.who]: { after: `Frame A now reads: “${A.name}, and our route change is part of it.”`, q: `If more than half the rise is on ${R.changedRounds.join(' and ')}, I’ll accept the route change is a main cause, not only the supplier.`, met: ST.onChanged / ST.rise > 0.5, now: `It is: ${ST.onChanged} of ${ST.rise} (${share}%). ${first(A.who)} accepts the route change as a main cause.` },
  [B.who]: { after: `Frame B now reads: “${B.name}, and the supplier is failing too.”`, q: `If the other ${R.rounds - 2} rounds rose by more than 4, I’ll accept the supplier is failing too.`, met: ST.onOther > 4, now: `They rose by ${ST.onOther}. ${first(B.who)} accepts the supplier is failing too.` }
};
function render() {
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'Two frames'], [['Space', 'run the test'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap ${S.ran ? 'ran' : ''}">
    <div><p class="eyebrow">Two frames · what would change your mind</p><h1 class="title">Agree the test first</h1></div>
    <div class="test">${I('flask-conical', 24)}<div><p>${ST.test}</p><span class="sealed">${I('lock', 12)} both rules written 30 Oct, before anyone ran it · run once, by template</span></div><span class="res">${ST.onChanged} · ${ST.onOther}</span></div>
    <div class="two">${[A, B].map(f => { const r = RULES[f.who]; return `<section class="p" data-tier="${P(f.who).floor}"><span class="eyebrow">Frame ${f.id} · ${whoHTML(f.who, { role: true })}</span><h2>${f.name}</h2>
      <div class="prerule"><span class="when">${I('pen-line', 12)} Written before the test</span><q>${r.q}</q></div>
      <div class="out"><p>${r.met ? I('check', 14) : I('x', 14)} ${r.now}</p><span class="muted">The rule applied itself. ${first(f.who)} wrote it; nobody had to win the argument.</span></div>
      <div class="out"><p class="small">${I('git-commit-horizontal', 14)} In ${T.id}: ${r.after}</p><span class="muted">The old reading is kept, struck through, with the test and the rule that moved it. A frame is versioned like any other piece.</span></div></section>`; }).join('')}</div>
  </div></main>`;
  hydrate($('#app'));
}
play(() => { S.ran = false; render(); }, () => { S.ran = true; $('.wrap').classList.add('ran'); }, (e) => { if (e.key === ' ') { e.preventDefault(); S.ran = true; $('.wrap').classList.add('ran'); } });
</script>
</body>
</html>
