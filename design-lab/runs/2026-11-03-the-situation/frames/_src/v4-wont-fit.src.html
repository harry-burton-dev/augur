<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Frames V4 · Data that won’t fit</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: each frame says what it expects; each observation is marked against both; what fits neither is where the frame gets questioned ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.tbl{min-height:0;overflow:auto;scrollbar-width:thin;display:grid;grid-template-columns:minmax(0,1.2fr) repeat(2,minmax(0,1fr));align-content:start}
.tbl .h{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline-strong);display:grid;gap:var(--space-1);align-content:end}
.tbl .h b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.tbl .h.fr{border-top:2px solid var(--fc)}
.tbl .h p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);font-style:italic}
.tbl .c{padding:var(--space-3);border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);display:grid;gap:var(--space-1);align-content:start}
.tbl .c.ob p{font-size:var(--type-meta);line-height:var(--leading-meta)}
.fit{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);text-transform:uppercase;letter-spacing:var(--tracking-caps);opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.marked .fit{opacity:1}
.fit.yes{color:var(--x-proposed-lit)}
.fit.no{color:var(--x-proposed-disagree)}
.fit.na{color:var(--ink-muted)}
.c.anom{background:var(--x-proposed-disagree-wash)}
.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.mv{display:grid;gap:var(--space-1);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key)}
.mv b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.mv p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.mv.on{border-color:var(--x-proposed-lit)}
.mv .pen{color:var(--ink)}
@media (max-width:1400px){.tbl .c{padding:var(--space-2)}.mv p.muted{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Frames · V4</b> data that won’t fit: each frame’s expectations against what was seen · Klein, Moon and Hoffman: elaborate, question, reframe</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { marked: false, re: false };
const [A, B] = DATA.frames;
const rb = R.byRound;
/* observations, and how each frame's expectation fits: yes, no, or doesn't say */
const OBS = [
  { w: `Misses rose from ${rb.Jul.changed + rb.Jul.other} in July to ${rb.Oct.changed + rb.Oct.other} in October`, A: ['yes', 'Expected a rise'], B: ['yes', 'Expected a rise'] },
  { w: `${rb.Oct.changed} of ${rb.Oct.changed + rb.Oct.other} were on ${R.changedRounds.join(' and ')}, ${R.changedRounds.length} rounds of ${R.rounds}`, A: ['no', 'Expected misses spread over all rounds'], B: ['yes', 'Expected them to gather on the changed rounds'] },
  { w: `The other ${R.rounds - 2} rounds rose too, from ${rb.Jul.other} to ${rb.Oct.other}`, A: ['yes', 'A failing supplier fails everywhere'], B: ['no', 'Expected them to stay near July'], anom: true },
  { w: `${T.supplierShort}’s own count is ${R.supplierCount}, not ${R.series.at(-1).v}`, A: ['na', 'Says nothing either way'], B: ['na', 'Says nothing either way'] },
  { w: PC('i5').text, A: ['yes', 'Fits, if it is true'], B: ['na', 'Says nothing either way'], said: true }
];
const W = { yes: 'fits', no: 'doesn’t fit', na: 'doesn’t say' };
function render() {
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'Two frames'], [['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap ${S.marked ? 'marked' : ''}">
    <div><p class="eyebrow">Two frames · what each expects, against what was seen</p><h1 class="title">Data that won’t fit</h1></div>
    <div class="tbl"><div class="h"><b>What was seen</b><p>From ${T.id}</p></div>
      ${[A, B].map(f => `<div class="h fr" data-tier="${P(f.who).floor}"><b>${f.id} · ${f.name}</b><p>${f.predicts}</p></div>`).join('')}
      ${OBS.map(o => `<div class="c ob ${o.anom ? '' : ''}"><p>${o.w}</p>${o.said ? saidHTML(PC('i5')) : ''}</div>${['A', 'B'].map(k => `<div class="c ${o[k][0] === 'no' ? 'anom' : ''}"><span class="fit ${o[k][0]}">${I(o[k][0] === 'yes' ? 'check' : o[k][0] === 'no' ? 'triangle-alert' : 'minus', 12)} ${W[o[k][0]]}</span><span>${o[k][1]}</span></div>`).join('')}`).join('')}
    </div>
    <div class="moves">
      <div class="mv"><b>${I('plus', 14)} Elaborate</b><p>Each frame keeps what fits it. Neither may drop a row because it doesn’t fit.</p></div>
      <div class="mv"><b>${I('circle-help', 14)} Question</b><p>Each frame has one row that doesn’t fit. A’s is the gathering on ${R.changedRounds.join(' and ')}; B’s is the rise on the other rounds.</p></div>
      <div class="mv ${S.re ? 'on fresh' : ''}"><b>${I('git-merge', 14)} Reframe</b>${S.re ? `<p class="pen">${DATA.settle.verdict.split('. ')[0]}: both a route change on two rounds and a wider decline.</p><p class="muted">Offered in pencil, from the misfits. ${P(A.who).name} and ${P(B.who).name} each sign it, or don’t.</p>` : '<p class="muted">When each frame has a row it can’t explain, a third reading may explain both.</p>'}</div>
    </div>
  </div></main>`;
  hydrate($('#app'));
}
play(() => { S.marked = false; S.re = false; render(); }, () => { $('.wrap').classList.add('marked'); S.marked = true; later(() => { S.re = true; render(); }, ms('--motion-calm') * 1.5); });
</script>
</body>
</html>
