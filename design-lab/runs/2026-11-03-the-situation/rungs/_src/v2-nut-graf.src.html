<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Rungs V2 · The nut graf</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: a news story's layers. The figure, the lede, the nut graf (why it matters to you, now), the other side, what next ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--space-6)}
.story{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);overflow:auto;scrollbar-width:thin}
.story > .kick,.story > h1,.story > .byline{margin-left:calc(220px + var(--space-5));max-width:680px}
.kick{display:flex;gap:var(--space-3);align-items:center}
.story h1{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light);letter-spacing:var(--tracking-tight)}
.byline{font-size:var(--type-small);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--hairline);padding-bottom:var(--space-3)}
.para{display:grid;grid-template-columns:220px minmax(0,680px);column-gap:var(--space-5);row-gap:0;transition:opacity var(--motion-calm) var(--ease-out),max-height var(--motion-calm) var(--ease-out)}
.para p{grid-column:2;font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink)}
.para.nut p{padding:var(--space-2) var(--space-4);border-left:2px solid var(--fc);background:color-mix(in srgb,var(--fc) 6%,transparent)}
.para.nut p{color:var(--light)}
.para.gone{opacity:0;max-height:0;overflow:hidden}
.para.other p{border-left:2px solid var(--x-proposed-disagree);padding-left:var(--space-4)}
.para.gap p{padding-left:var(--space-4);border-left:1px dashed var(--hairline-strong)}
.para.gap p{color:var(--ink-muted)}
/* the margin: what job each paragraph does, and its rung */
.marg{grid-column:1;grid-row:1 / span 3;display:grid;gap:var(--space-1);justify-items:end;text-align:right}
.marg b{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light)}
.marg span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.right{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding-top:var(--space-6)}
.right .box{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.right .box b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,1fr) 240px;gap:var(--space-4)}.para{grid-template-columns:150px minmax(0,1fr)}.story > .kick,.story > h1,.story > .byline{margin-left:calc(150px + var(--space-5))}.marg span{display:none}.para p{font-size:var(--type-meta);line-height:var(--leading-meta)}.story h1{font-size:var(--type-heading);line-height:var(--leading-heading)}.right{padding-top:var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Rungs · V2</b> the nut graf: the paragraph that says why this matters to this reader now · newspaper nut graf, “why it matters”, inverted pyramid</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { nut: false };
const g = P(T.decider);
function render() {
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'As a story'], [['N', 'nut graf on/off'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <article class="story">
      <div class="kick"><span class="eyebrow">${R.place} · ${R.label}</span>${rm(S.nut ? 'context' : 'info')}</div>
      <h1>${PC('i1').text}</h1>
      <p class="byline">From ${T.id} · assembled by ${whoHTML(T.owner)} · ${T.assembled} · ${S.nut ? `for ${whoHTML(T.decider)}` : 'for nobody in particular'}</p>
      <div class="para dep" style="--i:0"><div class="marg"><b>The lede</b>${rm('info')}<span>The reading and its first comparisons</span></div>
        <p>${PC('i1').text}. ${PC('i2').text}.</p></div>
      <div class="para nut ${S.nut ? '' : 'gone'}" data-tier="${g.floor}"><div class="marg"><b>The nut graf</b>${rm('context')}<span>Why it matters to ${first(T.decider)}, now</span></div>
        <p>Why it matters to you: ${READER(T.decider).nut}</p>
        <p class="small muted">Lifted by ${liftHTML({ k: 'question', w: READER(T.decider).asks })} ${liftHTML({ k: 'reader', w: 'for ' + g.name })}</p></div>
      <div class="para other dep" style="--i:2"><div class="marg"><b>The other side</b>${rm('info')}<span>Where the sources and the frames disagree</span></div>
        <p>${PC('d3').text}. ${PC('i3').text}. ${PC('i4').text}.</p></div>
      <div class="para dep" style="--i:3"><div class="marg"><b>What’s next</b>${rm('context')}<span>The projection, from the rules in the set</span></div>
        <p>${PC('c4').text}. ${PC('c3').text}.</p></div>
      <div class="para gap dep" style="--i:4"><div class="marg"><b>What we don’t know</b><span>Gaps, with who could fill them</span></div>
        <p>Whether ${PC('i5').text[0].toLowerCase() + PC('i5').text.slice(1)}: ${saidHTML(PC('i5'))}. Whether November is over ${R.limit}: not known until ${T.decideBy.replace(' 2026', '')}.</p></div>
    </article>
    <aside class="right">
      <div class="box"><b>Without the nut graf</b> this is information: true, well sourced, and for nobody in particular. Press N.</div>
      <div class="box"><b>With it</b>, the same paragraphs become context for one reader, with one question and one date. Only the nut graf names a reader; everything else is shared.</div>
      <div class="box"><b>Built from the set:</b> every number comes from ${T.id}’s pieces by template. The nut graf’s words are ${P(T.owner).name}’s, signed.</div>
    </aside>
  </div></main>`;
  hydrate($('#app'));
}
play(() => { S.nut = false; render(); }, () => { S.nut = true; render(); }, (e, k) => { if (k === 'n') { S.nut = !S.nut; render(); } });
</script>
</body>
</html>
