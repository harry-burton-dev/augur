<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Readers V4 · Two levels up</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: a reader's context is the information placed against the intents on their floor and the floor above ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:var(--space-6)}
.floors{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.fl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-left:3px solid var(--fc);border-radius:var(--radius-key);transition:opacity var(--motion-base) var(--ease-out),background var(--motion-base) var(--ease-out)}
.fl .w{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fc)}
.fl b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.fl p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.fl.out{opacity:var(--x-proposed-quiet)}
.fl.mine{background:var(--surface-raised)}
.fl.up{background:var(--surface-inset)}
.fact{padding:var(--space-3) var(--space-4);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.ctx{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.tabs{display:flex;gap:var(--space-2);flex-wrap:wrap}
.bear{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2) var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset)}
.bear .lvl{grid-column:1 / -1;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.bear p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.bear p b{font-weight:400;color:var(--light)}
.nut{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);padding-left:var(--space-3);border-left:2px solid var(--fc)}
.none{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-3) var(--space-4);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key)}
.swap{animation:land var(--motion-calm) var(--ease-out)}
@media (max-width:1400px){.fl{grid-template-columns:90px minmax(0,1fr);padding:var(--space-2) var(--space-3)}.nut{font-size:var(--type-body);line-height:var(--leading-body)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Readers · V4</b> two levels up: a reader’s context is the information placed against the intents of their floor and the one above · mission command, Bungay, intent travels two levels</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { who: 'mira' };
/* how the information bears on each intent, in the intent owner's terms */
const BEARS = {
  'M-114': `${PC('i4').text}. Those rounds are yours; the other seven rose too.`,
  'M-208': `${PC('i2').text}. A third month over lets the contract end without penalty.`,
  'M-031': `One of ${R.otherContracts} service contracts is over its limit. Value for money turns on the renewal price.`
};
const twoUp = id => { const f = P(id).floor, i = RANK[f]; return DATA.floorOrder.filter(x => RANK[x] === i || RANK[x] === i - 1); };
function render(fresh) {
  const mine = twoUp(S.who), r = READER(S.who), myF = P(S.who).floor;
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'Readers'], [['1 2 3', 'reader'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="floors"><div><p class="eyebrow">Same information, three readers · two levels</p><h1 class="title">Your floor and the one above</h1></div>
      <p class="fact">${rm('info')} ${PC('i1').text}; ${lc(PC('i2').text)}.</p>
      ${DATA.floorOrder.map(f => { const it = DATA.intents.find(x => x.floor === f); return `<div class="fl ${mine.includes(f) ? (f === myF ? 'mine' : 'up') : 'out'}" data-tier="${f}"><span class="w">${F(f).word}</span><div><b>${it.id} · ${it.title}</b><p>Owner ${P(it.owner).name}</p></div></div>`; }).join('')}
      <p class="small muted">Lit: the intents ${P(S.who).name} reads the information against. A Team lead sees her own intent and the Department’s; the Org sees its own and none above.</p>
    </div>
    <div class="ctx ${fresh ? 'swap' : ''}">
      <div class="tabs">${DATA.readers.map((x, k) => `<button class="tab" data-w="${x.id}" data-tier="${P(x.id).floor}" aria-pressed="${S.who === x.id}"><span class="kbd">${k + 1}</span>${P(x.id).name} · ${F(P(x.id).floor).word}</button>`).join('')}</div>
      <p class="nut" data-tier="${myF}">${r.nut}</p>
      ${mine.map(f => { const it = DATA.intents.find(x => x.floor === f); return `<div class="bear" data-tier="${f}"><span class="lvl">${f === myF ? 'Your floor' : 'The floor above'} · ${F(f).word}</span>${I('target', 16)}<p><b>${it.title}</b><br>${BEARS[it.id]}</p></div>`; }).join('')}
      ${mine.length < 2 ? `<p class="none">${I('info', 12)} No floor above the Org. Its context comes from its own intent alone, and from what the Department tells it.</p>` : ''}
      <p class="small muted">${liftHTML({ k: 'intent', w: 'two levels' })} ${liftHTML({ k: 'reader', w: P(S.who).name })} · the same information, placed against different intents, is different context.</p>
    </div>
  </div></main>`;
  hydrate($('#app'));
  $$('.tab').forEach(b => b.onclick = () => { S.who = b.dataset.w; render(true); });
}
play(() => { S.who = 'mira'; render(); }, () => {
  const step = ms('--motion-calm') * 2;
  later(() => { S.who = 'grace'; render(true); }, 0);
}, (e, k) => { const x = DATA.readers[+k - 1]; if (x) { S.who = x.id; render(true); } });
</script>
</body>
</html>
