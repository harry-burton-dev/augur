<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Readers V5 · What it changes for you</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: for each reader, what they would do without it and with it. If nothing changes, it says so: information, not context, for them ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto auto auto;align-content:start;gap:var(--space-4)}
.fact{display:flex;gap:var(--space-3);align-items:center;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)}
.grid{min-height:0;display:grid;grid-template-columns:240px repeat(2,minmax(0,1fr)) 220px;align-content:start}
.grid .h{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline-strong)}
.grid .c{padding:var(--space-4) var(--space-3);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);display:grid;gap:var(--space-1);align-content:start}
.grid .c.who{border-left:3px solid var(--fc)}
.grid .c.with{color:var(--light);transition:opacity var(--motion-calm) var(--ease-out)}
.grid .c .muted{font-size:var(--type-small)}
.pre-with .c.with{opacity:0}
.res{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.res.ctx{color:var(--light)}
.res.no{color:var(--ink-muted)}
.res b{font-weight:400}
.foot{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);max-width:100ch;padding-top:var(--space-2)}
@media (max-width:1400px){.grid{grid-template-columns:180px repeat(2,minmax(0,1fr)) 170px}.grid .c{padding:var(--space-3) var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}.fact{font-size:var(--type-body)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Readers · V5</b> what it changes for you: without it, with it; if nothing changes, it is information for that reader, and says so · Bateson, value of information (Howard, 1966)</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { with: false };
/* per reader: what they would do without this information, with it, and whether that is a change */
const VOI = {
  mira:  { without: 'Keep N4 and N7 on their new routes; the crews are blamed for the misses.', with: `Review N4 and N7 this week; send photos for the ${R.noAccess - R.noAccessWithPhotos} “no access” calls without any.`, changes: true },
  grace: { without: `Renew for three years at the offered price; ${T.decideBy.replace(' 2026', '')} passes as a formality.`, with: 'Wait for November’s count; weigh a six-month extension against renewing; ask for a recovery plan.', changes: true },
  owen:  { without: 'Leave the decision to the Department; hold 15 Jan on the board agenda in case.', with: 'The same.', changes: false }
};
function render() {
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'Readers'], [['W', 'with / without'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap ${S.with ? '' : 'pre-with'}">
    <div><p class="eyebrow">Same information, three readers · what it changes</p><h1 class="title">A difference to someone</h1></div>
    <p class="fact">${rm('info', { lg: true, word: false })}<span>${PC('i1').text}; ${lc(PC('i2').text)}.</span></p>
    <div class="grid">
      <span class="h">Reader</span><span class="h">Without it, they would</span><span class="h">With it, they would</span><span class="h">So, for them</span>
      ${DATA.readers.map(r => { const v = VOI[r.id]; return `<div class="c who" data-tier="${P(r.id).floor}">${whoHTML(r.id)}<span class="muted">${P(r.id).role}</span><span class="muted">${r.asks}</span></div>
        <div class="c">${v.without}</div>
        <div class="c with">${v.with}</div>
        <div class="c with">${v.changes ? `<span class="res ctx">${rm('context')}</span><span class="small">It changes what ${first(r.id)} does: context, for ${first(r.id)}.</span>` : `<span class="res no">${rm('info')}</span><span class="small muted">It changes nothing ${first(r.id)} does today. Information for the Org, and that is fine: it says so rather than raising its voice.</span>`}</div>`; }).join('')}
    </div>
    <p class="foot">Context is a difference to what someone does. For a reader it changes nothing for, AUGUR files it as information and keeps it quiet: no notice, no badge. It lights again only if something it rests on moves their decision (here: a retender would put it on the board’s agenda).</p>
  </div></main>`;
  hydrate($('#app'));
}
play(() => { S.with = false; render(); }, () => { S.with = true; $('.wrap').classList.remove('pre-with'); }, (e, k) => { if (k === 'w') { S.with = !S.with; $('.wrap').classList.toggle('pre-with', !S.with); } });
</script>
</body>
</html>
