<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Readers V6 · Floor travel</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: travel between floors. The information stays sharp and still; each floor's context racks into focus in its colour ---- */
:root{ --x-proposed-far-blur: calc(var(--space-1) * 1.5); }
.wrap{height:100%;display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--space-6)}
.rail{display:flex;flex-direction:column;justify-content:center;gap:var(--space-2)}
.rail button{display:grid;gap:2px;padding:var(--space-2) var(--space-3);border-left:3px solid var(--hairline);text-align:left;color:var(--ink-muted);transition:border-color var(--motion-base) var(--ease-out),color var(--motion-base) var(--ease-out)}
.rail button[aria-current="true"]{border-left-color:var(--fc);color:var(--light)}
.rail .w{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}
.rail .n{font-size:var(--type-small)}
.scene{position:relative;min-height:0}
.fixed{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:2;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-4);align-items:center;padding:var(--space-4) var(--space-5);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--slate-deep)}
.fixed p{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)}
.layer{position:absolute;left:var(--space-6);right:var(--space-6);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-5);padding:var(--space-4) var(--space-5);border:1px solid color-mix(in srgb,var(--fc) 40%,transparent);border-radius:var(--radius-inset);background:color-mix(in srgb,var(--fl) 14%,var(--surface-pane));transition:filter var(--motion-slow) var(--ease-out),opacity var(--motion-slow) var(--ease-out),transform var(--motion-slow) var(--ease-out)}
.layer.soft{filter:blur(var(--x-proposed-far-blur)) saturate(.4);opacity:.4}
.layer.above{top:0;transform:translateY(calc(var(--space-2) * -1))}
.layer.below{bottom:0;transform:translateY(var(--space-2))}
.layer.sharp{opacity:1;transform:none;filter:none}
.layer .nut{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.layer .r{display:grid;gap:var(--space-2);align-content:start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.layer .r b{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fc)}
.layer.hide{display:none}
@media (prefers-reduced-motion: reduce){.layer{transition:opacity var(--motion-base) var(--ease-out);transform:none !important}}
@media (max-width:1400px){.wrap{grid-template-columns:120px minmax(0,1fr);gap:var(--space-4)}.layer{left:0;right:0;padding:var(--space-3) var(--space-4)}.layer .nut{font-size:var(--type-body);line-height:var(--leading-body)}.fixed p{font-size:var(--type-body);line-height:var(--leading-body)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Readers · V6</b> floor travel: the information stays sharp and still; each floor’s context racks into focus in its own colour · floor travel and focal planes (cinematic run), rack focus</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { f: 'team' };
const byFloor = f => DATA.readers.find(r => P(r.id).floor === f);
function layerHTML(f) {
  const r = byFloor(f), p = P(r.id), it = INTENT(r.intent);
  return `<section class="layer" data-f="${f}" data-tier="${f}"><div><p class="eyebrow" style="color:var(--fc)">${F(f).word} · ${F(f).name}</p><p class="nut">${r.nut}</p></div>
    <div class="r"><b>Asks</b><span>${r.asks}</span><b>Serves</b><span>${it.id} · ${it.title}</span><b>Can do</b><span>${r.does.join(' · ')} · by ${r.horizon}</span><span class="muted">${whoHTML(r.id, { role: true })}</span></div></section>`;
}
function place() {
  /* show the floor you are on and the one above it (the Org shows the one below); the higher floor sits on top */
  const cur = RANK[S.f], nb = cur > 0 ? cur - 1 : cur + 1;
  $$('.layer').forEach(el => {
    const k = RANK[el.dataset.f];
    el.classList.toggle('sharp', k === cur); el.classList.toggle('soft', k !== cur);
    el.classList.toggle('hide', k !== cur && k !== nb);
    el.classList.toggle('above', k === Math.min(cur, nb)); el.classList.toggle('below', k === Math.max(cur, nb));
    el.setAttribute('aria-hidden', k !== cur);
  });
  $$('.rail button').forEach(b => b.setAttribute('aria-current', b.dataset.f === S.f));
  $('.fixed .who-now').innerHTML = `${rm('context', { word: false })} context for the ${F(S.f).word} floor`;
}
function render() {
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'Readers'], [['↑ ↓', 'floor travel'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <nav class="rail" aria-label="Floors">${DATA.floorOrder.map(f => `<button data-f="${f}" data-tier="${f}" aria-current="${S.f === f}"><span class="w">${F(f).word}</span><span class="n">${F(f).name}</span></button>`).join('')}</nav>
    <div class="scene">${DATA.floorOrder.map(layerHTML).join('')}
      <div class="fixed">${rm('info', { lg: true, word: false })}<p>${PC('i1').text}; ${lc(PC('i2').text)}.</p><span class="small muted who-now"></span></div>
    </div>
  </div></main>`;
  hydrate($('#app'));
  place();
  $$('.rail button').forEach(b => b.onclick = () => { S.f = b.dataset.f; place(); });
}
const step = d => { const i = RANK[S.f] + d; if (i >= 0 && i < DATA.floorOrder.length) { S.f = DATA.floorOrder[i]; place(); } };
play(() => { S.f = 'team'; render(); }, () => {
  const t = ms('--motion-calm') * 1.6;
  later(() => step(-1), 0);
}, (e) => { if (e.key === 'ArrowUp') step(-1); if (e.key === 'ArrowDown') step(1); });
</script>
</body>
</html>
