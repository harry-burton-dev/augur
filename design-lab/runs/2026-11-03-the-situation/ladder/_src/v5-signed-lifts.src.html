<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Ladder V5 · Signed lifts</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: the climb isn't automatic. Rule lifts may run by template; judgement lifts need a name ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(300px,26%) minmax(0,1fr);gap:var(--space-6)}
.kinds{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.kinds h2{font-weight:300;font-size:var(--type-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.kinds section{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset)}
.kinds section b{font-weight:400;color:var(--light)}
.kinds section p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.kinds .ls{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.right{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.lede{max-width:84ch;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.climb{display:grid;gap:var(--space-2);flex:1;min-height:0;align-content:start}
.step{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:var(--space-4);align-items:start;padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset)}
.step .res p{font-size:var(--type-meta);line-height:var(--leading-meta)}
.step h4{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-bottom:var(--space-1)}
.step .sig{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small)}
.step .wrong{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.stamp{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);padding:0 var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink);width:max-content}
.stamp.byrule{border-style:dashed;color:var(--ink-muted)}
.refused{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-4);border:1px dotted var(--x-proposed-pencil);border-radius:var(--radius-key);background:var(--x-proposed-pencil-wash)}
.refused p{font-size:var(--type-meta);line-height:var(--leading-meta)}
.refused .why{font-size:var(--type-small);color:var(--ink-muted);font-style:normal}
.refused .acts{display:flex;gap:var(--space-2)}
.refused.done{border-style:solid;border-color:var(--hairline-strong);background:none}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(260px,25%) minmax(0,1fr);gap:var(--space-5)}.lede{display:none}.step{gap:var(--space-3);padding:var(--space-2) var(--space-3)}.step .res p{font-size:var(--type-small);line-height:var(--leading-small)}.kinds section p{display:none}.step .res .src{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Ladder · V5</b> signed lifts: a rule may lift by template, a judgement needs a name · Frické (2009), Weinberger (2010), pencil and ink</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { offer: 0, signed: false };
const RULE = ['comparison', 'threshold', 'rate', 'definition'];
const JUDGE = ['question', 'intent', 'reader', 'situation', 'projection'];
/* the steps of one climb, each with what it assumes and how it could be wrong */
const STEPS = [
  { p: 'i1', by: 'rule', wrong: 'July was itself unusual. The four months before it ran 11 to 14, so it wasn’t.' },
  { p: 'i2', by: 'rule', wrong: 'Clause 7.2 counts by calendar month; if it counted by 4-week period, September would be 19.' },
  { p: 'i4', by: 'mira', wrong: 'Rounds differ in size. N4 and N7 carry 2 of 9 rounds but a quarter of the bins.' },
  { p: 'c1', by: 'tom', wrong: 'The decision might not be about price or penalties at all, but about the service residents get.' },
  { p: 'c3', by: 'agent', wrong: 'Clause 7.4 may already have been used once. Checked: it hasn’t.' }
];
function stamp(st) {
  if (st.by === 'rule') return `<span class="stamp byrule">${I('settings-2', 12)} by rule · template</span>`;
  if (st.by === 'agent') return `<span class="stamp">${mmHTML(true)} ${DATA.agent.name} · accepted by ${P(PC(st.p).by).name}</span>`;
  return `<span class="stamp">${I('pen-line', 12)} ${P(st.by).name}</span>`;
}
function render() {
  const offer = PC('i3');
  $('#app').innerHTML = topHTML(['Grammar', 'The ladder'], [['A', 'accept'], ['N', 'name a reader'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <aside class="kinds scroll"><h2>Two kinds of lift</h2>
      <section><b>${I('settings-2', 14)} By rule</b><p>Mechanical: the same inputs always give the same result. A template may do these, and says it did.</p><div class="ls">${RULE.map(k => liftHTML({ k, w: DATA.lifts[k].word })).join('')}</div></section>
      <section><b>${I('pen-line', 14)} By judgement</b><p>Someone chose that this matters, for this task, to this reader. A person signs it; an agent may only offer it in pencil.</p><div class="ls">${JUDGE.map(k => liftHTML({ k, w: DATA.lifts[k].word })).join('')}</div></section>
      <section><b>${I('triangle-alert', 14)} The warning</b><p>The pyramid makes the climb look automatic: filter data and information falls out. It doesn’t. Every lift is a step someone took, and can be wrong.</p></section>
    </aside>
    <div class="right">
      <div><p class="eyebrow">Grammar · the climb isn’t automatic</p><h1 class="title">Every lift is signed</h1></div>
      <p class="lede">Each step up names what lifted it, who took it, and one way it could be wrong. A step by rule is signed by its template. A step by judgement is signed by a person. Nothing reaches the context rung without a reader and a reason.</p>
      <div class="climb">
        <div class="step" style="background:none;border-color:transparent;padding-block:0"><h4>The step</h4><h4>Signed by</h4><h4>How it could be wrong</h4></div>
        ${STEPS.map((st, k) => { const p = PC(st.p); return `<div class="step dep" style="--i:${k}"><div class="res">${rm(p.rung)} ${liftsHTML(p)}<p class="${asRung(p.rung)}" ${p.rung === 'context' ? `data-tier="${P(p.reader).floor}"` : ''}>${p.text}</p></div><div class="sig">${stamp(st)}${p.rung === 'context' ? `<span class="muted">for ${P(p.reader).name} · <q class="pen">${p.reason}</q></span>` : ''}</div><p class="wrong">${st.wrong}</p></div>`; }).join('')}
        ${S.offer ? `<div class="refused ${S.signed ? 'done' : ''} fresh">${S.signed ? I('check', 16) : mmHTML(false)}<div><p class="${S.signed ? '' : 'pen'}">${S.signed ? `Lifted to context for ${P('mira').name}, signed by ${P('mira').name}: “${READER('mira').does[1]}.”` : `${DATA.agent.name} offers to lift “${offer.text}” to context.`}</p><p class="why">${S.signed ? 'Its reader and reason are a person’s. The agent’s mark stays on the offer.' : 'Held in pencil: a lift to context needs a reader and a reason, and that is a judgement. Name a reader (N) or accept it as information only (A).'}</p></div>
          <div class="acts">${S.signed ? '' : `<button class="btn sm" data-a="a">${I('check', 14)} Information only</button><button class="btn sm go" data-a="n">${I('user-round', 14)} Name a reader</button>`}</div></div>` : ''}
      </div>
    </div>
  </div></main>`;
  hydrate($('#app'));
  $$('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
}
function act(a) { if (!S.offer) return; if (a === 'n') S.signed = true; if (a === 'a') { S.offer = 0; } render(); }
play(() => { S.offer = 0; S.signed = false; render(); }, () => { S.offer = 1; render(); }, (e, k) => { if (k === 'n' || k === 'a') act(k); });
</script>
</body>
</html>
