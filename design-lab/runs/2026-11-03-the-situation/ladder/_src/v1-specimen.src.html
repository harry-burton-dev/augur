<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Ladder V1 · The specimen</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: a type specimen for the three rungs. Built bottom up; every mark annotated ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,30%);gap:var(--space-6)}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.lede{max-width:72ch;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.stack{display:flex;flex-direction:column-reverse;gap:0;flex:1;min-height:0;justify-content:flex-end}
.row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--space-5);align-items:start;padding:var(--space-3) 0;border-top:1px solid var(--hairline)}
.row .nm{display:grid;gap:var(--space-1)}
.row .nm h3{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.row .nm p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.spec{display:grid;gap:var(--space-2)}
.spec .big{font-size:var(--type-heading);line-height:var(--leading-heading)}
.spec .big.as-data{font-size:var(--type-title-s);line-height:var(--leading-title-s)}
.spec .line{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center}
.spec .why{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.spec .why q{font-style:italic}
.liftrow{display:flex;flex-wrap:wrap;white-space:nowrap;align-items:center;gap:var(--space-3);padding:var(--space-2) 0 var(--space-2) calc(200px + var(--space-5));color:var(--ink-muted);font-size:var(--type-small)}
.liftrow svg.up{color:var(--ink-muted)}
.n{display:inline-flex;align-items:center;justify-content:center;width:calc(var(--space-4) + 2px);height:calc(var(--space-4) + 2px);border-radius:var(--radius-pill);border:1px solid var(--x-proposed-lit);color:var(--x-proposed-lit);font:500 var(--x-proposed-type-micro)/1 var(--font-mono);flex:none;opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.show-n .n{opacity:1}
.key{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.key h2{font-weight:300;font-size:var(--type-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.key ol{display:grid;gap:var(--space-2);padding-bottom:var(--space-4)}
.key li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);align-items:start}
.key li .s{grid-column:2}
.key li b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.key li p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.key .rule-note{margin-top:auto;padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
@media (max-width:1400px){.row{grid-template-columns:150px minmax(0,1fr);gap:var(--space-4)}.liftrow{padding-left:calc(150px + var(--space-4))}.spec .big{font-size:var(--type-lead);line-height:var(--leading-lead)}.spec .big.as-data{font-size:var(--type-heading)}.lede{display:none}.key li:nth-child(n+8){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Ladder · V1</b> the specimen: one reading at three rungs, every mark annotated · type specimen sheets, Ackoff, the nut graf</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { built: 0, n: false };
const d = PC('d1'), i = PC('i2'), c = PC('c1');
function rowHTML(p, k) {
  const r = RUNG[p.rung];
  const tier = p.rung === 'context' ? P(p.reader).floor : '';
  return `<section class="row dep" style="--i:${k}" ${S.built > k ? '' : 'hidden'}>
    <div class="nm">${rm(p.rung, { lg: true, word: false })}<h3>${r.word}</h3><p>${r.what}</p></div>
    <div class="spec">
      <p class="big ${asRung(p.rung)}" ${tier ? `data-tier="${tier}"` : ''}>${p.text}</p>
      <p class="line"><span class="n">1</span>${rm(p.rung)} <span class="n">2</span>${srcHTML(p.src)} ${p.lift ? `<span class="n">3</span>${liftsHTML(p)}` : ''}</p>
      <p class="line why"><span class="n">5</span><q>${p.reason}</q> <span class="muted">${P(p.by).name}, ${p.at}</span></p>
      <p class="line"><span class="n">6</span>${holdsHTML(p)} ${p.reader ? `<span class="n">4</span><span class="small muted">for ${whoHTML(p.reader, { role: true })}</span>` : ''}</p>
    </div></section>`;
}
function liftRow(p, k) {
  return `<div class="liftrow dep" style="--i:${k}" ${S.built > k ? '' : 'hidden'}>${I('arrow-up', 16)}<span>lifted by</span> ${liftsHTML(p)}<span class="muted">· never automatic: a named step someone took</span></div>`;
}
const KEY = [
  ['1', rm('context'), 'The rung', 'A three-step stair and a word. Data, information or context; never a colour.'],
  ['2', srcHTML(d.src), 'Where it comes from', 'The app, the record and the floor it is kept on. Click for the record.'],
  ['3', liftHTML({ k: 'comparison', w: 'compared with July' }), 'What lifted it', 'A comparison, a threshold, a rate, a definition, a question, an intent, a reader, what else is going on, what happens next.'],
  ['4', `<span class="as-context small" data-tier="department">for Grace Obi</span>`, 'Who it is for', 'Context takes its reader’s floor colour, because it is only context for someone.'],
  ['5', `<q class="small pen">The count the contract measures.</q>`, 'Why it is here', 'In the words of the person who added it, with their name and date.'],
  ['6', holdsHTML({ holds: 'November’s count is not yet in' }), 'Holds while', 'The condition it stays true under. When it breaks, the piece says so.'],
  ['', `<span class="unseen">${I('lock', 12)} not yours to see · ask Tom Reyes</span>`, 'Not yours to see', 'Kept where this reader can’t open it: shown, hatched, with whom to ask.'],
  ['', `<span class="mk-disagree"></span>`, 'Sources disagree', 'Two counts of the same thing. Both are kept; neither wins by default.'],
  ['', saidHTML({ said: 'kerry' }), 'Said, not checked', 'A person’s word, kept as said until someone checks it.'],
  ['', `${mmHTML(false)} <span class="small pen">pencil</span>`, 'An agent’s work', 'Dotted while pencil, solid once a person accepts it (the apprentice).']
];
function render() {
  $('#app').innerHTML = topHTML(['Grammar', 'The ladder'], [['N', 'numbers'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap ${S.n ? 'show-n' : ''}">
    <div class="left">
      <div><p class="eyebrow">Grammar · data, information, context</p><h1 class="title">One reading, three rungs</h1></div>
      <p class="lede">Data is a reading. Information is a reading given meaning by a comparison or a threshold. Context is information placed against who is asking, what they are trying to do, and what else is going on. Each rung looks different, and every climb names what lifted it.</p>
      <div class="stack">${rowHTML(d, 0)}${liftRow(i, 1)}${rowHTML(i, 2)}${liftRow(c, 3)}${rowHTML(c, 4)}</div>
    </div>
    <aside class="key scroll"><h2>The marks</h2><ol>${KEY.map(([n, s, b, t]) => `<li>${n ? `<span class="n" style="opacity:1">${n}</span>` : '<span></span>'}<div><div>${s}</div><b>${b}</b><p>${t}</p></div></li>`).join('')}</ol>
      <p class="rule-note">Data and information belong to nobody in particular. Context always names its reader, its task and its date, because the same information is different context for someone else.</p></aside>
  </div></main>`;
  hydrate($('#app'));
}
play(() => { S.built = 0; S.n = false; render(); }, () => {
  const step = ms('--motion-calm');
  [1, 2, 3, 4, 5].forEach((k, j) => later(() => { S.built = k; render(); $$('.row,.liftrow')[k - 1]?.classList.add('fresh'); }, j * step / 2));
  later(() => { S.n = true; render(); }, step * 3);
}, (e, k) => { if (k === 'n') { S.n = !S.n; render(); } });
</script>
</body>
</html>
