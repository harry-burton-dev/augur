<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Ladder V3 · Three levels of awareness</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: Endsley's three levels as three bands: what is there, what it means, what happens next ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,28%);gap:var(--space-6)}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.lede{max-width:80ch;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.bands{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:var(--space-2);flex:1;min-height:0}
.band{display:grid;grid-template-columns:210px minmax(0,1fr);gap:var(--space-4);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset)}
.band .hd{display:grid;gap:var(--space-1);align-content:start}
.band .hd b{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.band .hd .q{font-size:var(--type-small);color:var(--ink-muted)}
.band .hd .lv{font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-label);color:var(--ink-muted);text-transform:uppercase}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--space-2);align-content:start}
.it{display:grid;gap:var(--space-1);padding:var(--space-2) var(--space-3);border-left:2px solid var(--hairline-strong);font-size:var(--type-small);line-height:var(--leading-small)}
.it p{color:var(--ink)}
.it.as-context{border-left-color:var(--fc)}
.it .muted{font-size:var(--type-small)}
/* not known yet: corner ticks (catalogue run) */
.gap{position:relative;padding:var(--space-2) var(--space-3);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);--t:var(--space-2);
  background:
    linear-gradient(var(--ink-muted),var(--ink-muted)) left top / var(--t) 1px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) left top / 1px var(--t) no-repeat,
    linear-gradient(var(--ink-muted),var(--ink-muted)) right top / var(--t) 1px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) right top / 1px var(--t) no-repeat,
    linear-gradient(var(--ink-muted),var(--ink-muted)) left bottom / var(--t) 1px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) left bottom / 1px var(--t) no-repeat,
    linear-gradient(var(--ink-muted),var(--ink-muted)) right bottom / var(--t) 1px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) right bottom / 1px var(--t) no-repeat}
.gap b{font-weight:400;color:var(--ink)}
.band.l3{border-color:var(--hairline-strong)}
.band.l3.lit{box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.count{display:flex;gap:var(--space-3);align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
.count b{color:var(--light);font-weight:400}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.side h2{font-weight:300;font-size:var(--type-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.side li{display:grid;gap:2px;padding:var(--space-2) 0;border-top:1px solid var(--hairline)}
.side li b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.side li p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.side li p.ans{color:var(--ink)}
@media (max-width:1400px){.band{grid-template-columns:150px minmax(0,1fr);padding:var(--space-2) var(--space-3)}.items{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.lede{display:none}.band .hd .q{display:none}.it .src{display:none}.side li:nth-child(n+4){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Ladder · V3</b> three levels of awareness: what is there, what it means, what happens next · Endsley (1995), situation awareness demons</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { shown: 0 };
/* the projection band: what the set says happens next, and what nobody has projected yet */
const NEXT = [
  { p: 'c1', next: 'If November is over 20, it is a service failure.' },
  { p: 'c4', next: 'A retender can’t be ready before 31 Jan.' },
  { gap: 'What happens to the price if we extend for 6 months instead of renewing?', who: 'tom', where: 'the renewal offer' },
  { gap: 'Will N4 and N7 recover once the routes are fixed?', who: 'mira', where: 'the round log' }
];
const BANDS = [
  { lv: 'Level 1 · perception', name: 'What is there', q: 'The readings, as they were read.', rung: 'data', items: DATA.pieces.filter(p => p.rung === 'data').map(p => p.id) },
  { lv: 'Level 2 · comprehension', name: 'What it means', q: 'Readings given meaning by a comparison, a threshold or a rate.', rung: 'info', items: DATA.pieces.filter(p => p.rung === 'info').map(p => p.id) },
  { lv: 'Level 3 · projection', name: 'What happens next', q: 'The level most often missing. Gaps are drawn, with who could fill them.', rung: 'context', items: NEXT }
];
function itemHTML(x) {
  if (typeof x === 'string') { const p = PC(x); return `<div class="it ${p.rung === 'context' ? 'as-context' : ''}"><p class="${p.rung === 'data' ? 'as-data' : ''}">${p.text}</p>${srcHTML(p.src)}</div>`; }
  if (x.gap) return `<div class="gap"><b>Not projected yet.</b> ${x.gap} <span class="muted">${first(x.who)} could, from ${x.where}.</span></div>`;
  const p = PC(x.p);
  return `<div class="it as-context" data-tier="${P(p.reader).floor}"><p class="lite">${x.next}</p><span class="small">${liftsHTML({ lift: p.lift.filter(l => l.k === 'projection') })} ${srcHTML(p.src)}</span></div>`;
}
const DEMONS = [
  ['Out of the loop', 'Someone who joins late has the readings but not what they mean.', 'Each piece keeps its rung, its lift and why it is here, so the meaning travels with it.'],
  ['The memory trap', 'What happens next lives in one person’s head.', 'Projection is a band of its own. An empty band is drawn as gaps with names, never as nothing.'],
  ['Data overload', 'Everything that might matter is put in.', 'A piece needs a reason to be here. Pieces without one are set aside, with why.'],
  ['Errant mental model', 'The wrong frame reads the data its own way.', 'Two frames are kept side by side (see Two frames).'],
  ['Misplaced salience', 'The loudest number wins.', 'The rung, not the size, says what a piece is.']
];
function render() {
  const l3 = BANDS[2].items, gaps = l3.filter(x => x.gap).length;
  $('#app').innerHTML = topHTML(['Grammar', 'The ladder'], [['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="left">
      <div><p class="eyebrow">Grammar · three levels of situation awareness</p><h1 class="title">There, means, next</h1></div>
      <p class="lede">Endsley’s three levels map onto the rungs: perceiving what is there is data, comprehending it is information, and projecting what happens next is the part of context most often missing. Each level is a band the screen can support on its own, so a missing level shows as missing.</p>
      <p class="count dep" style="--i:0">For ${T.id} · <b>${T.title}</b> · ${whoHTML(T.owner)} · ${T.assembled}</p>
      <div class="bands">${BANDS.map((b, k) => `<section class="band ${k === 2 ? 'l3' : ''} ${k === 2 && S.shown > 3 ? 'lit' : ''} dep" style="--i:${k + 1}" ${S.shown > k ? '' : 'hidden'}>
        <div class="hd"><span class="lv">${b.lv}</span>${rm(b.rung, { lg: true })}<b>${b.name}</b><span class="q">${b.q}</span>${k === 2 ? `<span class="count"><b>${l3.length - gaps}</b> projected · <b>${gaps}</b> gaps</span>` : ''}</div>
        <div class="items">${b.items.map(itemHTML).join('')}</div></section>`).join('')}</div>
    </div>
    <aside class="side scroll"><h2>What it guards against</h2><p class="small muted">Endsley’s “demons” of situation awareness, and the rule in this grammar that answers each.</p>
      <ol>${DEMONS.map(([n, w, a]) => `<li><b>${n}</b><p>${w}</p><p class="ans">${a}</p></li>`).join('')}</ol></aside>
  </div></main>`;
  hydrate($('#app'));
}
play(() => { S.shown = 0; render(); }, () => {
  const step = ms('--motion-calm');
  [1, 2, 3, 4].forEach((k, j) => later(() => { S.shown = k; render(); const b = $$('.band')[k - 1]; b && b.classList.add('fresh'); }, j * step * 0.6));
});
</script>
</body>
</html>
