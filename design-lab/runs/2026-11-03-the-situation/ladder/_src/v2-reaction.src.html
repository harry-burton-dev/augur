<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Ladder V2 · Reaction scheme</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: the climb as a reaction scheme. What was added above the arrow, who and how below it ---- */
.wrap{height:100%;display:flex;flex-direction:column;gap:var(--space-4)}
.lede{max-width:96ch;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.scheme{display:grid;gap:var(--space-4);flex:1;min-height:0;align-content:start}
.path{display:grid;grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr) 170px minmax(0,1fr) 170px minmax(0,1.15fr);align-items:center;padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);transition:opacity var(--motion-base) var(--ease-out),border-color var(--motion-base) var(--ease-out)}
.path.dim{opacity:var(--x-proposed-quiet)}
.path.on{border-color:var(--hairline-strong);background:var(--surface-inset)}
.path h3{font-size:var(--type-meta);font-weight:400;grid-column:1 / -1;display:flex;gap:var(--space-2);align-items:center;margin-bottom:var(--space-2)}
.node{display:grid;gap:var(--space-1);align-content:start;min-width:0}
.node p{font-size:var(--type-meta);line-height:var(--leading-meta)}
.node p.as-context{font-size:var(--type-meta)}
.node.blank{visibility:hidden}
.nr{display:grid;gap:var(--space-1);padding:var(--space-2) var(--space-3);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key)}
.nr b{font:500 var(--type-meta)/1 var(--font-mono);letter-spacing:var(--tracking-caps);color:var(--ink-muted)}
.nr p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.arrow{display:grid;grid-template-rows:auto 14px auto;gap:2px;padding:0 var(--space-3);text-align:center}
.arrow .ab,.arrow .be{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);min-height:2.6em;display:flex;align-items:flex-end;justify-content:center;gap:var(--space-1)}
.arrow .ab{color:var(--ink)}
.arrow .be{align-items:flex-start;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono)}
.arrow svg.ln{width:100%;height:14px;overflow:visible}
.arrow svg.ln line{stroke:var(--ink-muted);stroke-width:1.25;stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset var(--motion-calm) var(--ease-out)}
.arrow svg.ln path{fill:none;stroke:var(--ink-muted);stroke-width:1.25;opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.arrow.drawn svg.ln line{stroke-dashoffset:0}
.arrow.drawn svg.ln path{opacity:1}
.arrow.nr-a svg.ln line{stroke-dasharray:4 4;stroke-dashoffset:0;opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.arrow.nr-a.drawn svg.ln line{opacity:1}
.prod{opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.prod.in{opacity:1}
.legend{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.legend b{font-weight:400;color:var(--ink)}
@media (prefers-reduced-motion: reduce){.arrow svg.ln line{transition:none;stroke-dashoffset:0}}
@media (max-width:1400px){.path{grid-template-columns:minmax(0,1fr) 128px minmax(0,1fr) 128px minmax(0,1fr) 128px minmax(0,1.1fr);padding:var(--space-2) var(--space-3)}.node p{font-size:var(--type-small);line-height:var(--leading-small)}.lede{display:none}.node .src{display:none}.tech .node .src{display:inline-flex}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Ladder · V2</b> reaction scheme: what was added above the arrow, who and how below; no reaction is a result · chemical reaction notation, Ackoff, Frické</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { drawn: 0, focus: 0 };
/* each path: [node, arrow, node, arrow, node, arrow, node]. arrow: above = what was added, below = how and who */
const PATHS = [
  { name: 'To the decision', who: 'grace', steps: [
    { node: 'd1' },
    { ab: `${I('database', 12)} ${PC('d2').text}`, be: `${DATA.lifts.comparison.word} · template` },
    { node: 'i1' },
    { ab: `${I('file-text', 12)} limit ${R.limit} · ${R.limitWhere}`, be: `${DATA.lifts.threshold.word} · ${first('tom')}` },
    { node: 'i2' },
    { ab: `${I('circle-help', 12)} ${T.title}`, be: `${DATA.lifts.question.word} + ${DATA.lifts.reader.word} · ${first('tom')}` },
    { node: 'c1' } ] },
  { name: 'To the crews', who: 'mira', steps: [
    { node: 'd1' },
    { ab: `${I('file-text', 12)} ${PC('d5').text}`, be: `${DATA.lifts.rate.word} · ${first('mira')}` },
    { node: 'i4' },
    { ab: `${I('target', 12)} ${INTENT('M-114').id} ${INTENT('M-114').title}`, be: `${DATA.lifts.intent.word} + ${DATA.lifts.reader.word} · ${first('mira')}` },
    { text: READER('mira').nut.split(': ')[0] + ': that part is yours to change.', rung: 'context', tier: 'team', label: `for ${P('mira').name}` },
    null, null ] },
  { name: 'No reaction', who: 'tom', steps: [
    { node: 'd1' },
    { ab: `${I('database', 12)} ${fmt(R.scheduled)} collections a month`, be: `${DATA.lifts.rate.word} · template` },
    { node: 'x1' },
    { ab: `${I('circle-help', 12)} ${T.title}`, be: `${DATA.lifts.question.word} · ${first('tom')}`, nr: true },
    { nr: PC('x1').why },
    null, null ] }
];
function nodeHTML(st, k) {
  if (!st) return '<div class="node blank"></div>';
  if (st.nr) return `<div class="node nr prod ${S.drawn > k ? 'in' : ''}"><b>N.R.</b><p>No reaction: it doesn’t bear on the question. <q class="pen">${st.nr}</q> ${P('tom').name}</p></div>`;
  const p = st.node ? PC(st.node) : st;
  const tier = p.rung === 'context' ? (st.tier || P(p.reader || T.decider).floor) : '';
  return `<div class="node ${k ? 'prod' : ''} ${S.drawn > k || !k ? 'in' : ''}">${rm(p.rung)}<p class="${asRung(p.rung)}" ${tier ? `data-tier="${tier}"` : ''}>${p.text}</p>${p.src ? srcHTML(p.src) : `<span class="small muted">${st.label}</span>`}</div>`;
}
function arrowHTML(st, k) {
  if (!st) return '<div></div>';
  return `<div class="arrow ${st.nr ? 'nr-a' : ''} ${S.drawn > k ? 'drawn' : ''}"><span class="ab">${st.ab}</span><svg class="ln" viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="7" x2="${st.nr ? 100 : 97}" y2="7" vector-effect="non-scaling-stroke"/>${st.nr ? '' : '<path d="M92 2 L99 7 L92 12" vector-effect="non-scaling-stroke"/>'}</svg><span class="be">${st.be}</span></div>`;
}
function render() {
  $('#app').innerHTML = topHTML(['Grammar', 'The ladder'], [['1–3', 'one path'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">Grammar · the climb as a reaction</p><h1 class="title">What was added, and by whom</h1></div>
    <p class="lede">A chemist writes what was added above the arrow and the conditions below it, and a reaction that gives nothing is still a result. Here the same reading is lifted three ways. Above each arrow: what was brought in (a second reading, a rule, a question). Below: what kind of lift it was and who did it. The third path gives nothing for this question, and says so.</p>
    <div class="scheme">${PATHS.map((pa, pi) => `<section class="path ${S.focus && S.focus !== pi + 1 ? 'dim' : ''} ${S.focus === pi + 1 ? 'on' : ''}"><h3><span class="kbd">${pi + 1}</span><span class="eyebrow">${pa.name}</span>${pi < 2 ? `<span class="small muted">· context for</span> ${whoHTML(pa.who, { role: true })}` : `<span class="small muted">· set aside by</span> ${whoHTML(pa.who)}`}</h3>
      ${pa.steps.map((st, k) => k % 2 ? arrowHTML(st, k) : nodeHTML(st, k)).join('')}</section>`).join('')}</div>
    <p class="legend"><span><b>Above the arrow</b> what was brought in, and where it is kept</span><span><b>Below</b> the kind of lift, and who lifted it (“template” when no person chose)</span><span><b>N.R.</b> a lift that gave nothing for this question: kept, with why</span></p>
  </div></main>`;
  hydrate($('#app'));
}
play(() => { S.drawn = 0; S.focus = 0; render(); }, () => {
  const step = ms('--motion-base');
  [1, 2, 3, 4, 5, 6, 7].forEach((k, j) => later(() => { S.drawn = k; $$('.path').forEach(pa => { const kids = [...pa.children].slice(1); kids.forEach((el, x) => { if (x < k) { el.classList.add('drawn', 'in'); } }); }); }, j * step * 1.5));
}, (e, k) => { if ('123'.includes(k)) { S.focus = S.focus === +k ? 0 : +k; S.drawn = 7; render(); } });
</script>
</body>
</html>
