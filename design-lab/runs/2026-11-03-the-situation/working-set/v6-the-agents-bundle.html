/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; listed as
   "needs token" in each notes.md. Carried marks first, then new.
   --------------------------------------------------------------- */
:root{
  /* carried: quiet lines, micro type, the lit next step */
  --x-proposed-quiet: .62;
  --x-proposed-type-micro: .6875rem;
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* carried: not yours to see (135 degree hatch) and stale (45 degree hatch) */
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  /* carried: sources disagree, a warning-tinted edge, never red */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  /* carried: pencil (reference desk), what a model or an agent wrote until a person accepts it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  /* carried: a visible repair (wear and time) */
  --x-proposed-seam: color-mix(in srgb, var(--info) 70%, var(--ink));
  --x-proposed-seam-wash: color-mix(in srgb, var(--info) 8%, transparent);
  /* carried: the maker's mark (apprentice) */
  --x-proposed-mark-size: 1.375rem;
  /* NEW: the rung mark, a three-step stair at text size; one step is this tall */
  --x-proposed-rung-step: calc(var(--space-1) - 1px);
  /* NEW: a lift, the step between two rungs (a comparison, a threshold, a question…): dashed, like a fold line */
  --x-proposed-lift-edge: color-mix(in srgb, var(--ink-muted) 55%, transparent);
  /* NEW: a broken "holds while" condition. Warm like disagree but lighter: it is a fact about time, not a dispute */
  --x-proposed-broken: color-mix(in srgb, var(--warning) 45%, var(--ink-muted));
}

/* ---- the rung mark: a three-step stair, filled to the rung. Never a colour: a shape and a word ---- */
.rm{display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap;vertical-align:-1px}

.rm[data-r="1"] .st i:nth-child(-n+1),.rm[data-r="2"] .st i:nth-child(-n+2),.rm[data-r="3"] .st i:nth-child(-n+3){background:var(--ink)}
.rm .rw{font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.rm.lg .st{height:calc(var(--x-proposed-rung-step) * 6)}
.rm.lg .st i{width:var(--space-2)}
.rm.lg .st i:nth-child(1){height:calc(var(--x-proposed-rung-step) * 2)}
.rm.lg .st i:nth-child(2){height:calc(var(--x-proposed-rung-step) * 4)}
.rm.lg .st i:nth-child(3){height:calc(var(--x-proposed-rung-step) * 6)}

/* how each rung reads: data as read (mono figure), information as a sentence, context as a sentence with its reader's edge */
.as-data{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.as-info{color:var(--ink)}
.as-context{color:var(--light);border-left:2px solid var(--fc,var(--ink-muted));padding-left:var(--space-3)}

/* a lift: the step between rungs */
.lift{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink);border:1px dashed var(--x-proposed-lift-edge);border-radius:var(--radius-key);padding:0 var(--space-2);white-space:nowrap;vertical-align:1px}

/* where a piece comes from */
.src{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);white-space:nowrap}
.src b{font-weight:400;color:var(--ink)}
.src .fdot{width:var(--space-1);height:var(--space-1)}
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);white-space:nowrap}
.mk-disagree{display:inline-block;width:var(--space-4);height:var(--space-3);border-left:2px solid var(--x-proposed-disagree);border-right:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);flex:none;vertical-align:-1px}
.said{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-bottom:1px dashed var(--hairline-strong)}

.holds{display:inline;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

.holds b{font-weight:400;color:var(--ink)}

/* the maker's mark (apprentice): dotted while pencil, solid once a person accepts it */
.mm{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:var(--x-proposed-mark-size);height:var(--x-proposed-mark-size);padding:0 var(--space-1);border:1px dotted var(--x-proposed-pencil);border-radius:var(--radius-key);font:500 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink);background:var(--x-proposed-pencil-wash);vertical-align:1px}

/* the seam: a visible repair; stale: the 45 degree hatch */
.seam{border-left:2px solid var(--x-proposed-seam);background:var(--x-proposed-seam-wash)}
.stale{background:var(--x-proposed-stale)}

.pc{display:grid;gap:var(--space-1);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset)}

.pc-t{font-size:var(--type-meta);line-height:var(--leading-meta)}
.pc-m{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1) var(--space-3)}
.pc-why{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}

/* people */

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard);white-space:nowrap}

.tab{display:inline-flex;align-items:center;gap:var(--space-2);height:calc(var(--target-sm) - var(--space-1));padding:0 var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-pill);font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}

.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--slate-deep) 70%,transparent);min-width:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);white-space:nowrap;min-width:0;overflow:hidden}

.main{min-height:0;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));overflow:hidden}

.rule-box{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.rule-box b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.hd p{display:none}.ex .src{display:none}}

/* ---- shared helpers (same in every page of the run) ---- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const I = (n, size = 16, stroke = 1.5) => Icons.svg(n, { size, stroke });
const RANK = Object.fromEntries(DATA.floorOrder.map((f, i) => [f, i]));
const P = id => DATA.people[id];
const F = id => DATA.floors[id];
const first = id => P(id).name.split(' ')[0];
const fmt = n => n.toLocaleString('en-GB');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ms = v => parseFloat(css(v)) || 0;
const R = DATA.reading;
const T = DATA.task;
const ALL = [...DATA.pieces, ...DATA.setAside, ...DATA.reopen.added];
const PC = id => ALL.find(p => p.id === id);
const INTENT = id => DATA.intents.find(x => x.id === id);
const READER = id => DATA.readers.find(x => x.id === id);
const CH = id => DATA.reopen.changes[id];
const STATE = { tech: false };

/* the three rungs, plain word first, the admin word one step down */
const RUNG = {
  data:    { n: 1, word: 'Data',        what: 'a reading',                        tech: 'observation · Data Atlas' },
  info:    { n: 2, word: 'Information', what: 'a reading given meaning',          tech: 'derived value · Explorer query' },
  context: { n: 3, word: 'Context',     what: 'meaning placed against a reader, a task and what else is going on', tech: 'working-set piece · Artifacts' }
};
const RUNGS = ['data', 'info', 'context'];
const APPICON = { 'Data Atlas': 'database', Explorer: 'compass', Artifacts: 'file-text', Mandate: 'target' };
/* the five reasons an answer moves (reference desk) */
const REASON = { happened: 'Something happened', learned: 'We learned about the past', access: 'Who can answer changed', settled: 'A guess was settled', meaning: 'A word changed meaning' };

function rm(rung, o = {}) {
  const r = RUNG[rung];
  return `<span class="rm ${o.lg ? 'lg' : ''}" data-r="${r.n}" title="${r.word}: ${r.what}"><span class="st" aria-hidden="true"><i></i><i></i><i></i></span>${o.word === false ? '' : `<span class="rw">${r.word}</span>`}<span class="tk">${r.tech}</span></span>`;
}
function liftHTML(l) {
  const L = DATA.lifts[l.k];
  return `<span class="lift" title="Lifted by ${L.word}">${I(L.icon, 12)}<span>${l.w}</span><span class="tk">&nbsp;· ${L.tech}</span></span>`;
}
const liftsHTML = p => (p.lift || []).map(liftHTML).join(' ');

/* access: a reader on floor f opens what is kept on f or the floors above it; restricted only by name */
function canOpen(src, readerId) {
  if (!readerId) return true;
  const p = P(readerId);
  if (src.restricted && !(src.restrictedTo || []).includes(readerId)) return false;
  return RANK[src.kept] <= RANK[p.floor];
}
function srcHTML(src, readerId) {
  if (!canOpen(src, readerId)) {
    return `<span class="unseen" title="${src.restricted || 'Kept on a floor this reader doesn’t read'}">${I('lock', 12)} not yours to see · ask ${P(src.keeper).name}</span>`;
  }
  return `<span class="src" data-tier="${src.kept}">${I(APPICON[src.app], 12)}<b>${src.title}</b><span class="fdot" aria-hidden="true"></span>${F(src.kept).word}${src.restricted ? ` ${I('lock', 12)}` : ''}<span class="tk">&nbsp;· ${src.tech}</span></span>`;
}
function whoHTML(id, o = {}) {
  const p = P(id);
  return `<span class="who" data-tier="${p.floor || 'outside'}"><span class="fdot" aria-hidden="true"></span><span>${p.name}${o.role ? `<span class="muted">, ${p.role}</span>` : ''}</span></span>`;
}
const mmHTML = (ink = true) => `<span class="mm ${ink ? 'ink' : ''}" title="${DATA.agent.name}, under ${P(DATA.agent.supervisor).name}">${DATA.agent.mark}</span>`;
function holdsHTML(p, broken) {
  return `<span class="holds ${broken ? 'broken' : ''}">${I(broken ? 'unlink' : 'link-2', 12)} holds while <b>${p.holds}</b></span>`;
}
function saidHTML(p) {
  return p.said ? `<span class="said">${I('quote', 12)} said by ${P(p.said).name}, not checked</span>` : '';
}
/* the class a piece's text takes, so each rung reads differently */
const asRung = r => r === 'data' ? 'as-data' : r === 'info' ? 'as-info' : 'as-context';

/* a piece of a working set, the standard row. opts: reader, why, holds, compact */
function pieceHTML(p, o = {}) {
  const reader = o.reader;
  const tier = p.rung === 'context' ? P(p.reader || T.decider).floor : '';
  const agent = p.agent ? `${mmHTML(true)} <span class="small muted">proposed by ${DATA.agent.name}, accepted by ${P(p.by).name}</span>` : '';
  return `<article class="pc dep ${o.cls || ''}" data-id="${p.id}" style="--i:${o.i || 0}">
    <div class="pc-h">${rm(p.rung)} ${liftsHTML(p)} ${p.disagree ? '<span class="mk-disagree" title="sources disagree"></span>' : ''}</div>
    <p class="pc-t ${asRung(p.rung)}" ${tier ? `data-tier="${tier}"` : ''}>${p.text}</p>
    <p class="pc-m">${srcHTML(p.src, reader)} ${saidHTML(p)} ${agent}</p>
    ${o.why === false ? '' : `<p class="pc-why"><q>${p.reason}</q> <span class="by">${P(p.by).name}, ${p.at}</span></p>`}
    ${o.holds === false || !p.holds ? '' : `<p>${holdsHTML(p, o.broken)}</p>`}
  </article>`;
}

/* the reading as a line, with the contract limit; months beyond the series can be passed in */
function chart(o = {}) {
  const w = o.w || 360, h = o.h || 120, pad = 18;
  const s = o.series || R.series;
  const max = Math.max(...s.map(p => p.v), R.limit) * 1.15;
  const X = i => pad + i * (w - pad * 2) / (s.length - 1), Y = v => h - pad - v * (h - pad * 2) / max;
  const pts = s.map((p, i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const lim = o.limit === false ? '' : `<line x1="${pad}" x2="${w - pad}" y1="${Y(R.limit)}" y2="${Y(R.limit)}" stroke="var(--ink-muted)" stroke-dasharray="3 3"/><text x="${pad}" y="${Y(R.limit) - 4}" text-anchor="start" fill="var(--ink-muted)" style="font:var(--x-proposed-type-micro) var(--font-mono)">limit ${R.limit}</text>`;
  const dots = s.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="${o.hi && o.hi.includes(p.m) ? 3.5 : 2}" fill="${o.hi && o.hi.includes(p.m) ? 'var(--light)' : 'var(--ink)'}"/>`).join('');
  const labels = s.map((p, i) => `<text x="${X(i)}" y="${h - 3}" text-anchor="middle" fill="var(--ink-muted)" style="font:var(--x-proposed-type-micro) var(--font-mono)">${p.m}</text>`).join('');
  const vals = o.values ? s.map((p, i) => `<text x="${X(i)}" y="${Y(p.v) - 7}" text-anchor="middle" fill="${o.hi && o.hi.includes(p.m) ? 'var(--light)' : 'var(--ink-muted)'}" style="font:var(--x-proposed-type-micro) var(--font-mono)">${p.v}</text>`).join('') : '';
  const extra = o.extra ? o.extra(X, Y) : '';
  return `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${R.label} by month: ${s.map(p => p.m + ' ' + p.v).join(', ')}; limit ${R.limit}">${lim}${extra}<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>${dots}${vals}${labels}</svg>`;
}

/* top bar */
function topHTML(crumbs, hints, floor = T.floor) {
  return `<header class="top"><p class="brand">AUGUR</p>
    <nav class="crumb" aria-label="Where you are">${crumbs.map((c, i) => (i ? I('chevron-right', 14) : '') + (i === crumbs.length - 1 ? `<b>${c}</b>` : `<span>${c}</span>`)).join('')}</nav>
    <span class="fchip" data-tier="${floor}">${F(floor).name} · ${F(floor).word}</span>
    <div class="hints">${hints.map(([k, w, id]) => `<span ${id ? `id="${id}"` : ''}><span class="kbd">${k}</span>${w}</span>`).join('')}</div></header>`;
}

/* timers for the auto demo, cleared on replay */
let TIMERS = [];
const later = (fn, t) => TIMERS.push(setTimeout(fn, reduced ? Math.min(t, 60) : t));
const clearLater = () => { TIMERS.forEach(clearTimeout); TIMERS = []; };

/* one runner per page: render(), then the moment at about 1.2 s; R replays, T shows the admin words */
function play(render, moment, keys) {
  const replay = () => {
    clearLater();
    document.body.classList.add('pre');
    render(true);
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('pre')));
    if (moment) later(moment, ms('--motion-run'));
  };
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input,textarea')) return;
    const k = e.key.toLowerCase();
    if (k === 'r') { replay(); return; }
    if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); $('#h-t')?.classList.toggle('on', STATE.tech); return; }
    keys && keys(e, k);
  });
  replay();
  return replay;
}
const hydrate = el => Icons.hydrate(el || document.body);
const lc = s => s[0].toLowerCase() + s.slice(1);

/* three weeks on: the state of each piece when the set is reopened */
const STATEW = { holds: 'Still holds', changed: 'Changed', gone: 'No longer holds', orphan: 'Its one source has moved on', new: 'New since' };
const STATEICON = { holds: 'check', changed: 'git-commit-horizontal', gone: 'unlink', orphan: 'user-x', new: 'plus' };
const stateOf = id => (CH(id) || {}).state || (DATA.reopen.added.some(a => a.id === id) ? 'new' : 'holds');
const RO = DATA.reopen;
function stateChip(id) {
  const s = stateOf(id), c = CH(id);
  return `<span class="stc st-${s}">${I(STATEICON[s], 12)} ${STATEW[s]}${c ? ` · ${c.on}` : ''}</span>`;
}

const S = { shown: 0, decided: false };
const A = DATA.agent, B = DATA.bundle;
function outHTML(o, k) {
  const st = S.decided ? o.state : 'pencil';
  return `<div class="out ${S.shown > k ? 'in' : ''} ${st}">${mmHTML(st === 'accepted')}<p class="t">${o.text}</p>
    <p class="vd">${st === 'pencil' ? `${I('pencil', 12)} pencil · waiting for ${P(A.supervisor).name}` : st === 'accepted' ? `${I('check', 12)} <b>accepted by ${P(o.by).name}</b> · ${o.at} · now piece ${DATA.pieces.findIndex(p => p.id === o.piece) + 1} of ${T.id}, with ${A.mark}’s mark kept` : `${I('x', 12)} <b>not accepted by ${P(o.by).name}</b> · ${o.at} · <q>${o.why}</q>`}</p></div>`;
}
function render() {
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'Given to ' + A.name], [['A', 'decide'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="hd"><span class="mm ink xl">${A.mark}</span><div><p class="eyebrow">Working set · what an agent was given</p><h1>${A.name}, for ${T.id}</h1><p>${A.name} ${A.errand}. Works under ${whoHTML(A.supervisor, { role: true })}; deputy ${whoHTML(A.deputy)}. It may read only what is in this bundle, and only for what each direction says.</p></div>
      <p class="lim">Model calls <b>${B.calls}</b> of ${B.limit} today<br>Bundle sealed ${T.assembled.replace(' 2026', '')}, 16:05<br>Ends with the task, ${T.decideBy.replace(' 2026', '')}</p></div>
    <section class="col"><h2>${I('book-open-check', 18)} Given · ${B.given.length}</h2>
      ${B.given.map((g, k) => `<div class="ex"><span class="tab" data-tier="${g.kept}">${String.fromCharCode(65 + k)}</span><b>${g.title} ${g.restricted ? I('lock', 12) : ''}</b><span>${srcHTML({ app: g.app, title: g.title, kept: g.kept, keeper: T.owner, tech: 'grant · read · ' + T.id })}</span><p class="dir">${I('gavel', 12)}<span><b class="small">Direction:</b> ${g.direction}</span></p></div>`).join('')}
      <h2 style="margin-top:var(--space-2)">${I('eye-off', 18)} Not given · ${B.notGiven.length}</h2>
      ${B.notGiven.map(n => `<div class="no">${I('lock', 14)}<b>${n.title}</b><p>${n.why}</p></div>`).join('')}
    </section>
    <section class="col"><h2>${I('pencil', 18)} What it said back</h2>
      <p class="small muted">The question it was asked: <q class="pen">${T.question}</q> It answers in pencil, one clause at a time, each pointing at a page of a given document.</p>
      ${B.proposed.map(outHTML).join('')}
      <div class="rule-box"><b>A person can review what it was given</b>, not only what it said: every exhibit, every direction, and everything held back, with why. If it says something it couldn’t have got from its bundle, that shows.</div>
      <div class="rule-box"><b>When ${T.id} is handed over</b>, ${A.name}’s supervisor is handed over with it. No supervisor, no run: until the new owner takes it, the agent waits.</div>
    </section>
  </div></main>`;
  hydrate($('#app'));
}
play(() => { S.shown = 0; S.decided = false; render(); }, () => {
  const step = ms('--motion-calm');
  later(() => { S.shown = 1; $$('.out')[0].classList.add('in'); }, 0);
  later(() => { S.shown = 2; $$('.out')[1].classList.add('in'); }, step * 0.7);
  later(() => { S.decided = true; render(); }, step * 2);
}, (e, k) => { if (k === 'a') { S.shown = 2; S.decided = !S.decided; render(); } });
</script>
</body>
</html>
