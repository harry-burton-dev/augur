<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Working set V4 · The flow</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: how the set was assembled, as a flow: where it looked, what it found, what it set aside and why, what it kept. The numbers add up ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,1fr);gap:var(--space-6)}
.flow{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,0.9fr);grid-auto-rows:auto;gap:var(--space-2) 0;align-content:start}
.stage-l{grid-column:1 / -1;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-top:var(--space-2)}
.box{display:grid;gap:var(--space-1);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--surface-inset);opacity:0;transform:translateY(var(--space-1));transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out),border-color var(--motion-base) var(--ease-out)}
.box.in{opacity:1;transform:none}
.box b.n{font:300 var(--type-heading)/1 var(--font-mono);color:var(--light)}
.box p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.box ul{display:grid;gap:2px}
.box li{display:flex;justify-content:space-between;gap:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.box li span:last-child{font-family:var(--font-mono);color:var(--ink)}
.box.out{border-style:dashed;background:none}
.box.keep{border-color:var(--x-proposed-lit)}
.box[aria-pressed="true"]{border-color:var(--light)}
.arr{display:flex;align-items:center;justify-content:center;color:var(--ink-muted)}
.down{grid-column:1;display:flex;justify-content:center;color:var(--ink-muted);height:var(--space-4)}
.list{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.list h2{font-weight:300;font-size:var(--type-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.list .it{display:grid;gap:2px;padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.list .it q{font-style:italic;color:var(--ink)}
.sum{font-size:var(--type-small);color:var(--ink-muted);border-top:1px solid var(--hairline-strong);padding-top:var(--space-2);font-family:var(--font-mono)}
.sum b{color:var(--light);font-weight:400}
@media (prefers-reduced-motion: reduce){.box{transform:none}}
@media (max-width:1400px){.box{padding:var(--space-2) var(--space-3)}.box b.n{font-size:var(--type-lead)}.list .it .src{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Working set · V4</b> the flow: where it looked, what it found, what it set aside and why, what it kept; every count adds up · PRISMA flow diagram, systematic review, the answer has a base</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { n: 0, sel: 'kept' };
/* where Tom looked, and how many each search found (the same item can turn up twice) */
const SEARCHES = [
  ['Data Atlas', `“missed collection”, ${R.place}, Apr–Oct`, 9],
  ['Artifacts', `“${T.supplierShort}”, the Department’s libraries`, 11],
  ['Mandate', `${T.intent} and the intents it serves`, 3]
];
const FOUND = SEARCHES.reduce((a, s) => a + s[2], 0);
const DUPES = 4;
/* set aside, by reason. The three named in the set, plus two more */
const OUT = [
  ...DATA.setAside.map(x => ({ why: x.why, items: [x] })),
  { why: 'Personal data; not needed for this decision.', items: [{ text: 'Named residents’ complaint letters', by: 'tom', rung: 'data', src: { app: 'Artifacts', title: 'Complaint letters', kept: 'org', keeper: 'cc', tech: 'document · restricted' } }] },
  { why: 'Outside the period the contract measures.', items: [{ text: 'Missed collections, 2025', by: 'tom', rung: 'data', src: { app: 'Data Atlas', title: 'Missed collection reports', kept: 'team', keeper: 'mira', tech: 'Observation · 2025' } }] }
];
const NOUT = OUT.reduce((a, o) => a + o.items.length, 0);
const KEPT = DATA.pieces.length;
function render() {
  const screened = FOUND - DUPES;
  const ok = screened - NOUT === KEPT;
  const box = (k, cls, html, sel) => `<div class="box ${cls} ${S.n > k ? 'in' : ''}" ${sel ? `role="button" tabindex="0" data-sel="${sel}" aria-pressed="${S.sel === sel}"` : ''}>${html}</div>`;
  const listItems = S.sel === 'kept' ? DATA.pieces.map(p => `<div class="it">${rm(p.rung)}<span>${p.text}</span><q>${p.reason}</q></div>`).join('')
    : OUT.map(o => o.items.map(p => `<div class="it">${rm(p.rung)}<span>${p.text}</span><q>${o.why}</q><span class="muted">set aside by ${P(p.by).name}</span></div>`).join('')).join('');
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id, 'How it was assembled'], [['K', 'kept'], ['S', 'set aside'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="flow">
      <div style="grid-column:1 / -1"><p class="eyebrow">Working set · ${T.id} · how it was assembled</p><h1 class="title">Found, screened, kept</h1></div>
      <span class="stage-l">Looked in</span>
      ${box(0, '', `<b class="n">${FOUND}</b><p>found by ${whoHTML(T.owner)} on ${T.assembled.replace(' 2026', '')}</p><ul>${SEARCHES.map(([a, q, n]) => `<li><span>${I(APPICON[a], 12)} ${a} · ${q}</span><span>${n}</span></li>`).join('')}</ul>`)}
      <span class="arr">${I('arrow-right', 16)}</span>
      ${box(1, 'out', `<b class="n">${DUPES}</b><p>the same record found twice</p>`)}
      <span class="down">${I('arrow-down', 16)}</span><span></span><span></span>
      <span class="stage-l">Screened</span>
      ${box(2, '', `<b class="n">${screened}</b><p>read, each asked “does it bear on the decision?”</p>`)}
      <span class="arr">${I('arrow-right', 16)}</span>
      ${box(3, 'out', `<b class="n">${NOUT}</b><p>set aside, each with why</p><ul>${OUT.map(o => `<li><span>${o.why}</span><span>${o.items.length}</span></li>`).join('')}</ul>`, 'out')}
      <span class="down">${I('arrow-down', 16)}</span><span></span><span></span>
      <span class="stage-l">Kept</span>
      ${box(4, 'keep', `<b class="n">${KEPT}</b><p>in the set</p><ul>${RUNGS.map(r => `<li><span>${rm(r)}</span><span>${DATA.pieces.filter(p => p.rung === r).length}</span></li>`).join('')}</ul>`, 'kept')}
      <span></span><span></span>
      <p class="sum" style="grid-column:1 / -1;margin-top:var(--space-3)">${FOUND} found − ${DUPES} twice − ${NOUT} set aside = <b>${KEPT} kept</b> ${ok ? I('check', 12) : '· does not add up'}</p>
    </div>
    <aside class="list"><h2>${S.sel === 'kept' ? `Kept · ${KEPT}` : `Set aside · ${NOUT}`}</h2><p class="small muted">${S.sel === 'kept' ? 'Each with its rung and why it is here.' : 'Kept with why, so the next owner knows they were looked at.'}</p><div class="scroll" style="min-height:0">${listItems}</div></aside>
  </div></main>`;
  hydrate($('#app'));
  $$('[data-sel]').forEach(b => b.onclick = () => { S.sel = b.dataset.sel; render(); });
}
play(() => { S.n = 0; S.sel = 'kept'; render(); }, () => {
  const step = ms('--motion-slow');
  [1, 2, 3, 4, 5].forEach((k, j) => later(() => { S.n = k; $$('.box').forEach((b, i) => b.classList.toggle('in', i < k)); }, j * step));
}, (e, k) => { if (k === 'k') { S.sel = 'kept'; render(); } if (k === 's') { S.sel = 'out'; render(); } });
</script>
</body>
</html>
