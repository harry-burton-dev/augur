<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Situation · Working set V1 · The bundle index</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: the working set as a bundle with an index. Tab, piece, rung, from, why, holds while; set aside below, never deleted ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--space-5)}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2) var(--space-5);align-items:end}
.head h1{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.head .meta{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);font-size:var(--type-small);color:var(--ink-muted);grid-column:1}
.head .acts{grid-row:1 / span 2;grid-column:2;display:flex;gap:var(--space-2)}
.idx{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;border-top:1px solid var(--hairline-strong)}
.idx table{width:100%;border-collapse:collapse}
.idx th{position:sticky;top:0;background:var(--slate-deep);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);z-index:1}
.idx td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);vertical-align:top;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.idx td.tabno{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);width:3.5em}
.idx td.pt{font-size:var(--type-meta);line-height:var(--leading-meta);width:34%}
.idx td.pt .as-context{padding-left:var(--space-2)}
.idx td q{font-style:italic}
.idx tr.grp td{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding-top:var(--space-3);border-bottom:0}
.idx tr.aside td{opacity:var(--x-proposed-quiet)}
.idx tr.aside td.pt{text-decoration:none}
.idx tr.moving td{background:var(--x-proposed-lit-wash)}
.idx tr:focus-within td,.idx tr.sel td{background:var(--surface-raised)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.side .box{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key)}
.side .box b{font-weight:400;color:var(--light)}
.side .box p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
.counts div{display:grid;gap:var(--space-1);justify-items:start}
.counts b{font:300 var(--type-heading)/1 var(--font-mono)}
.dlg{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--x-proposed-lit);border-radius:var(--radius-key);background:var(--surface-pane)}
.dlg p{font-size:var(--type-small);line-height:var(--leading-small)}
.dlg .warn{color:var(--x-proposed-broken)}
.dlg .typed{font-style:italic;color:var(--light);border-bottom:1px solid var(--hairline-strong);padding-bottom:var(--space-1)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,1fr) 250px}.idx .rg{display:none}.counts .rw{display:none}.idx td.hw,.idx th.hw{display:none}.idx td.pt{width:40%}.side .box:nth-child(3){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Working set · V1</b> the bundle index: every piece tabbed with its rung, source, reason and condition; set aside below, never deleted · court bundle index, finding aid</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { aside: [], moving: null, ask: null };
const used = id => DATA.pieces.filter(p => (p.from || []).includes(id)).map(p => p.id);
function row(p, n, aside) {
  const tier = p.rung === 'context' ? P(p.reader || T.decider).floor : '';
  return `<tr class="${aside ? 'aside' : ''} ${S.moving === p.id ? 'moving' : ''}" data-id="${p.id}">
    <td class="tabno">${aside ? '—' : n}</td>
    <td class="pt"><span class="${asRung(p.rung)}" ${tier ? `data-tier="${tier}"` : ''}>${p.text}</span><br>${liftsHTML(p)} ${saidHTML(p)} ${p.agent ? mmHTML(true) : ''} ${p.disagree ? '<span class="mk-disagree" title="sources disagree"></span>' : ''}</td>
    <td class="rg">${rm(p.rung)}</td>
    <td>${srcHTML(p.src)}<br><span class="muted">${(p.from || []).length ? 'lifted from tabs ' + p.from.map(f => DATA.pieces.findIndex(x => x.id === f) + 1).join(', ') : ''}</span></td>
    <td><q>${aside ? p.why || S.ask : p.reason}</q><br><span class="muted">${P(p.by).name}${p.at ? ', ' + p.at : ''}</span></td>
    <td class="hw">${aside ? '' : holdsHTML(p)}</td></tr>`;
}
function render() {
  const live = DATA.pieces.filter(p => !S.aside.includes(p.id));
  const aside = [...DATA.pieces.filter(p => S.aside.includes(p.id)).map(p => ({ ...p, why: S.why })), ...DATA.setAside];
  const n = r => live.filter(p => p.rung === r).length;
  $('#app').innerHTML = topHTML(['Artifacts', 'Working sets', T.id], [['↑↓', 'select'], ['X', 'set aside'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="left">
      <div class="head"><div><p class="eyebrow">Working set · ${T.id} · version ${T.version}</p><h1>${T.title}</h1></div>
        <p class="meta"><span>Owner ${whoHTML(T.owner)}</span><span>For ${whoHTML(T.decider)}, who decides by ${T.decideBy}</span><span>Serves ${T.intent} in Mandate</span><span>Assembled ${T.assembled}, ${T.assembledAt}</span></p>
        <div class="acts"><button class="btn sm">${I('send', 14)} Hand over</button><button class="btn sm">${I('plus', 14)} Add a piece</button></div></div>
      <div class="idx"><table>
        <thead><tr><th>Tab</th><th>Piece</th><th class="rg">Rung</th><th>From</th><th>Why it is here</th><th class="hw">Holds while</th></tr></thead>
        <tbody>${RUNGS.slice().reverse().map(r => `<tr class="grp"><td colspan="6">${RUNG[r].word} · ${n(r)}</td></tr>` + live.filter(p => p.rung === r).map(p => row(p, DATA.pieces.indexOf(p) + 1)).join('')).join('')}
          <tr class="grp"><td colspan="6">${I('archive', 12)} Set aside · ${aside.length} · kept, with why, so nobody adds them back without knowing</td></tr>${aside.map(p => row(p, 0, true)).join('')}</tbody></table></div>
    </div>
    <aside class="side">
      <div class="box"><b>In the set</b><div class="counts">${RUNGS.map(r => `<div>${rm(r)}<b>${n(r)}</b></div>`).join('')}</div><p class="muted">${aside.length} set aside · every piece is a link to its record, never a copy.</p></div>
      ${S.ask ? `<div class="dlg fresh"><p class="eyebrow">Set aside tab ${DATA.pieces.findIndex(x => x.id === S.ask) + 1}</p><p>${PC(S.ask).text}</p>${used(S.ask).length ? `<p class="warn">${I('triangle-alert', 12)} Tabs ${used(S.ask).map(u => DATA.pieces.findIndex(x => x.id === u) + 1).join(', ')} were lifted from it. They stay, and will say so.</p>` : `<p class="muted">Nothing in the set was lifted from it.</p>`}<p class="small muted">Why? (required)</p><p class="typed">${S.why || ''}</p></div>` : ''}
      <div class="box"><b>A piece is a reference</b><p>The set holds links to Data Atlas facts, Explorer queries and Artifacts documents, each with a rung, a reason, a reader and a condition. Readers open the record with their own access.</p></div>
      <div class="box"><b>Handing over</b><p>The next owner gets this index, the set-aside list and each reason in its author’s words. Nothing in it lives only in someone’s head.</p></div>
    </aside>
  </div></main>`;
  hydrate($('#app'));
}
/* the moment: Tom sets aside the complaints count, with a reason. It moves down, not out */
const WHY = 'About the service, not the contract’s terms. Kept as background in the Department’s notes.';
play(() => { S.aside = []; S.moving = null; S.ask = null; S.why = ''; render(); }, () => {
  const step = ms('--motion-calm');
  S.ask = 'd4'; S.moving = 'd4'; render();
  WHY.split(' ').forEach((w, k) => later(() => { S.why = WHY.split(' ').slice(0, k + 1).join(' '); const t = $('.typed'); if (t) t.textContent = S.why; }, step * 0.5 + k * ms('--motion-instant') * 0.5));
  later(() => { S.aside = ['d4']; S.ask = null; render(); const r = $('tr[data-id="d4"]'); if (r) { r.classList.add('moving'); $('.idx').scrollTop = r.offsetTop - $('.idx').clientHeight / 2; } }, step * 2.4);
});
</script>
</body>
</html>
