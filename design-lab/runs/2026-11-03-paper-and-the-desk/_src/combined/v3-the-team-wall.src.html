<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="x-shot-wait" content="4200">
<title>Desk · Combined V3 · The team wall</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- C3: the Team floor's wall. a row per person: where they are, a slot per job they may hold, the round's mark on each card ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--measure-card) - var(--space-4));gap:var(--space-5)}
.left{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-3);min-height:0}
.head{display:flex;align-items:flex-end;gap:var(--space-5)}
.head .tally{margin-left:auto;display:flex;gap:var(--space-5)}
.tally div{display:grid;gap:2px;text-align:right}
.tally b{font:200 var(--type-title-s)/1 var(--font-sans);color:var(--light)}
.tally span{white-space:nowrap;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.grid{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-6)) repeat(var(--n),minmax(0,1fr));gap:var(--space-2);align-content:start}
.pr{display:grid;gap:2px;align-content:center;padding-right:var(--space-2);border-right:1px solid var(--hairline)}
.pr .nm{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-meta);color:var(--light)}
.cell{min-height:calc(var(--target-md) + var(--space-2));display:grid}
.cell .slot{height:100%}
.tcard .mk{display:flex;gap:var(--space-1);align-items:center;font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted)}
.tcard .mk.ok{color:var(--x-proposed-lit)}.tcard .mk.help{color:var(--x-proposed-disagree)}
.tcard.offer{border-style:dashed;border-color:var(--x-proposed-transit);border-top:var(--x-proposed-strip-edge) solid var(--fc)}
.tcard.offer-in{border:1px dashed var(--x-proposed-lit);border-top:var(--x-proposed-strip-edge) solid var(--fc);animation:fill var(--motion-calm) var(--ease-out)}
@keyframes fill{from{background:var(--x-proposed-lit-wash);opacity:0}}
.foot{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.side{display:flex;flex-direction:column;gap:var(--space-4);border-left:1px solid var(--hairline);padding-left:var(--space-5);min-height:0}
.warn{display:grid;gap:var(--space-2);padding:var(--space-3);border:1px solid color-mix(in srgb,var(--x-proposed-past) 45%,transparent);border-radius:var(--radius-key)}
.warn.soon{border-style:dashed;border-color:color-mix(in srgb,var(--x-proposed-disagree) 40%,transparent)}
@media (max-width:1400px){.grid{grid-template-columns:calc(var(--space-8) + var(--space-3)) repeat(var(--n),minmax(0,1fr))}.cell{min-height:var(--target-md)}.tcard .tc-t{font-size:var(--x-proposed-type-micro)}.head .tally b{font-size:var(--type-heading)}.foot{display:none}.tcard .mk{min-width:0}.tcard .mk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V3</b> the team wall: where people are, a slot per job, the round's mark on each card, and cover offered in place · board V1 V3 V5 V6</div>
<script>
/*@DATA@*/
/*@LIB@*/
const N = B.slotsEach, COVER = { job: 'J-405', to: 'kai', by: 'nkechi' };
const HELP = { 'J-405': 'holder off sick', 'J-408': 'tenant wants an evening', 'J-410': 'Tom off from tomorrow' };
const S = { offer: false };
const cj = () => B.jobs.find(j => j.id === COVER.job);
function card(j, extra = '') {
  const help = HELP[j.id], away = j.holder && P(j.holder).in === 'off';
  const mk = S.offer && j.id === COVER.job ? `<span class="mk">${I('hand-helping', 12)}<span>offered to ${P(COVER.to).ini} by ${P(COVER.by).ini} · ${DATA.now.time}</span></span>`
    : `<span class="mk ${help ? 'help' : 'ok'}">${I(help ? 'hand' : 'circle-check', 12)}<span>${help || 'on track'} · ${P('nkechi').ini}</span></span>`;
  return tcard(j, { cls: `${away ? 'held-away' : ''} ${S.offer && j.id === COVER.job ? 'offer' : ''} ${extra}`, foot: mk });
}
function row(id) {
  const p = P(id), pr = presence(id), js = jobsOf(id).slice().sort((a, b) => a.h - b.h);
  const off = p.in === 'off';
  const extra = S.offer && id === COVER.to ? [{ ...cj(), _in: true }] : [];
  const all = js.concat(extra);
  const cells = Array.from({ length: N }, (_, i) => `<div class="cell">${all[i] ? (all[i]._in ? tcard(all[i], { cls: 'offer-in', foot: `<span class="mk">${I('hand-helping', 12)}<span>offered from ${P(cj().holder).ini} · take it to hold it</span></span>` }) : card(all[i])) : `<div class="slot ${off ? 'off' : ''}">${off ? 'away' : ''}</div>`}</div>`).join('');
  return `<div class="pr"><span class="nm">${ini(id, 'sm')}${p.name}</span><span class="pres ${pr.cls}">${pr.w}</span></div>${cells}`;
}
function render() {
  const inIds = DATA.team.filter(id => P(id).in !== 'off');
  const free = inIds.reduce((a, id) => a + N - jobsOf(id).length, 0) - (S.offer ? 1 : 0);
  const helpN = Object.keys(HELP).length, waiting = B.jobs.filter(j => !j.holder);
  const offIds = DATA.team.filter(id => P(id).in === 'off'), soon = DATA.team.filter(id => P(id).in !== 'off' && P(id).away);
  $('#app').innerHTML = topHTML(['Team', F('team').name, 'Board'], [['C', 'offer cover'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap"><div class="left">
      <div class="head"><div><p class="eyebrow">${F('team').name} · ${B.slotsEach} slots each, set by ${P('nkechi').name}</p><h1 class="t" style="margin-top:var(--space-1)">The wall</h1></div>
        <div class="tally"><div><b>${free}</b><span>free slots</span></div><div><b>${helpN}</b><span>need help</span></div><div><b>${waiting.length}</b><span>held by nobody</span></div></div></div>
      <div class="grid scroll" style="--n:${N}">${DATA.team.map(row).join('')}</div>
      <div class="foot"><span>dashed slot: room for one more</span><span>hatched: held by someone who is away</span><span>a card’s mark is the round’s, with initials; it doesn’t change by itself</span></div></div>
      <aside class="side"><p class="eyebrow">What the wall is asking</p>
        ${offIds.map(id => `<div class="warn"><p class="why">${I('user-x', 14)}<span><b style="font-weight:400;color:var(--ink)">${P(id).name}</b> is ${P(id).away} and holds ${plural(jobsOf(id).length, 'job')}; ${jobsOf(id).filter(j => j.h < 8).map(j => j.t + ', ' + j.home).join(', ')} is due today.</span></p>
          ${S.offer ? `<p class="note">Offered to <b>${P(COVER.to).name}</b> by ${P(COVER.by).name} at ${DATA.now.time}. Still ${first(id)}’s until he takes it; ${first(COVER.by)} answers for it meanwhile.</p>` : `<button class="btn go" data-c>${I('hand-helping', 14)} Offer it to ${P(COVER.to).name}, who has room <span class="kbd">C</span></button>`}</div>`).join('')}
        ${soon.map(id => `<div class="warn soon"><p class="why">${I('calendar-off', 14)}<span><b style="font-weight:400;color:var(--ink)">${P(id).name}</b> is ${P(id).away}; ${plural(jobsOf(id).length, 'job')} due while away. Hand them over in person today.</span></p></div>`).join('')}
        <div style="display:grid;gap:var(--space-2)"><p class="eyebrow">Held by nobody</p>${waiting.map(j => tcard(j, { foot: `<span class="mk">waiting ${j.waiting} · anyone with a free slot can take it</span>` })).join('')}</div>
        <p class="note" style="margin-top:auto">Only the team lead hands on someone else’s job. Anyone can take a waiting one into a free slot of their own.</p></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
  $('[data-c]') && ($('[data-c]').onclick = offer);
}
function offer() { if (!S.offer) { S.offer = true; render(); } }
function replay() {
  clearLater(); S.offer = false; render(); settle();
  /* the moment: Nkechi offers Grace's job that is due today to Kai; it shows dashed in both rows */
  later(offer, ms('--motion-run'));
}
onKeys({ r: replay, c: offer });
replay();
</script>
</body>
</html>
