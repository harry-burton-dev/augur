<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="x-shot-wait" content="4200">
<title>Desk · Combined V4 · Nothing erased</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- C4: a correction, from the value to every stamp that relied on it. struck in place, entered in the account, and the stamps that covered the old value say so ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--space-6)}
.col{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.val{display:grid;gap:var(--space-2);padding:var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane)}
.val .k{font-size:var(--type-small);color:var(--ink-muted)}
.big{display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap}
.old{position:relative;font:300 var(--type-title)/1 var(--font-mono);color:var(--ink-muted)}
.old::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:1.5px;background:var(--x-proposed-strike);transform-origin:left;transform:scaleX(var(--s,0));transition:transform var(--motion-calm) var(--ease-out)}
.nw{font:300 var(--type-title)/1 var(--font-mono);color:var(--light);transition:opacity var(--motion-base) var(--ease-out)}
.cm{display:inline-flex;gap:var(--space-1);align-items:center;font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted);border-left:1px solid var(--hairline-strong);padding-left:var(--space-2);transition:opacity var(--motion-base) var(--ease-out)}
.disp{transition:opacity var(--motion-base) var(--ease-out)}
.why2{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);border-left:2px solid var(--hairline-strong);padding-left:var(--space-3);transition:opacity var(--motion-base) var(--ease-out)}
.hide{opacity:0}
.ledger td{font-size:var(--type-small);line-height:var(--leading-small);padding:var(--space-1) var(--space-2)}
.rel{display:grid;gap:var(--space-3)}
.doc{padding:var(--space-3) var(--space-4);gap:var(--space-2)}
.doc .dt{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-meta);color:var(--light)}
.doc .dt .o{margin-left:auto;font-size:var(--type-small);color:var(--ink-muted)}
.line{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:opacity var(--motion-base) var(--ease-out)}
.line svg{flex:none;margin-top:2px;color:var(--x-proposed-lit)}
.signed{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-3);align-items:start}
.signed .stamp{min-width:0}
.flagm{display:inline-flex;gap:var(--space-1);align-items:center;font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--x-proposed-disagree);border:1px dashed var(--x-proposed-disagree);border-radius:var(--radius-key);padding:2px var(--space-2);transition:opacity var(--motion-base) var(--ease-out)}
.acts{display:flex;gap:var(--space-2);flex-wrap:wrap;transition:opacity var(--motion-base) var(--ease-out)}
@media (max-width:1400px){.old,.nw{font-size:var(--type-title-s)}.ledger tr:nth-child(-n+2){display:none}.val{padding:var(--space-3)}.col{gap:var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V4</b> nothing erased: a correction struck in place, entered in the account, and every stamp that covered the old value says so · ledger V1 V2 V5, approvals V2</div>
<script>
/*@DATA@*/
/*@LIB@*/
const c = FT.entries.find(e => e.act === 'correct');
/* the sign-off that relied on the old value: the stamp says what it covered */
const SIGNED = [
  { doc: FT.citedBy[0].t, owner: FT.citedBy[0].owner, who: FT.citedBy[0].owner, at: FT.entries.find(e => e.act === 'cited').at, covers: `the ${FT.subject} boiler ages, using ${FT.id} (${FT.entries[0].v})` },
  { doc: FT.citedBy[1].t, owner: FT.citedBy[1].owner, who: null, covers: null }
];
const S = { k: 0 }; /* 0 before, 1 struck, 2 entered, 3 told */
function render() {
  const k = S.k, es = FT.entries.filter(e => k >= 2 || e.act !== 'correct'), bal = running();
  $('#app').innerHTML = topHTML(['Data Atlas', FT.subject, FT.field], [['N', 'next'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <section class="col"><div><p class="eyebrow">${FT.id} · kept on the ${F(FT.floor).word} floor · steward ${P(FT.steward).name}</p><h1 class="t" style="margin-top:var(--space-1)">Nothing erased</h1></div>
        <div class="val"><span class="k">${FT.subject} · ${FT.field}</span>
          <div class="big"><span class="old" style="--s:${k >= 1 ? 1 : 0}">${c.was}</span><span class="nw ${k >= 1 ? '' : 'hide'}">${c.v}</span>
            <span class="cm ${k >= 1 ? '' : 'hide'}" data-tier="${P(c.by).floor}">${ini(c.by, 'sm')}${c.at} · countersigned ${P(c.counter).ini}</span>
            <span class="disp ${k >= 1 ? 'hide' : ''}" style="font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-disagree)">${I('scale', 12)} disputed: ${FT.entries.find(e => e.act === 'second').src} says ${FT.entries.find(e => e.act === 'second').v}</span></div>
          <p class="why2 ${k >= 1 ? '' : 'hide'}" style="margin:0"><b style="font-weight:400;color:var(--ink-muted)">Why:</b> ${c.note}</p></div>
        <p class="eyebrow">The account</p>
        <div class="scroll"><table class="ledger"><tbody>${es.map((e, i) => `<tr class="${e.act === 'correct' ? 'new write' : ''}"><td class="n">${e.n}</td><td class="d">${e.at}</td><td>${entryWords(e)}</td><td class="v">${bal[i].v}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="col"><div><p class="eyebrow">What relied on ${c.was}</p><h2 class="h" style="margin-top:var(--space-1)">${k >= 3 ? 'Told where they will see it' : 'Two documents cite it'}</h2></div>
        <div class="rel">${SIGNED.map(sg => `<div class="doc"><span class="dt">${I('file-text', 16)}${sg.doc}<span class="o">${P(sg.owner).name}</span></span>
          <span class="line ${k >= 3 ? '' : 'hide'}">${I('corner-down-right', 14)}<span>A line on the document: “${FT.subject} ${FT.field} was corrected from ${c.was} to ${c.v} on ${c.at.replace('today', DATA.now.day)}. This document quoted ${c.was}.”</span></span>
          ${sg.who ? `<div class="signed">${stampHTML(sg.who, 'Approved', sg.at)}<div style="display:grid;gap:var(--space-2)"><span class="note">Signed for: ${sg.covers}.</span>
            <span class="flagm ${k >= 3 ? '' : 'hide'}">${I('triangle-alert', 12)} covered a value since corrected (${FT.id}, entry ${c.n})</span>
            <div class="acts ${k >= 3 ? '' : 'hide'}"><button class="btn sm">${I('pen-line', 12)} Re-initial for ${c.v}</button><button class="btn sm">${I('sticky-note', 12)} Note: no change needed</button></div></div></div>` : `<span class="note">Quotes the value without a sign-off; only the line is added.</span>`}
          </div>`).join('')}</div>
        <div class="panel" style="display:grid;gap:var(--space-2)"><p class="eyebrow">What this does not do</p>
          <p class="note">It doesn’t change either document, and it doesn’t void ${first(SIGNED[0].who)}’s stamp. His stamp said what it covered, so AUGUR can tell him exactly which part moved. He decides; his answer is a new mark beside the old one.</p></div>
      </section></div></main>`;
  Icons.hydrate($('#app'));
}
function step(n) { S.k = n; render(); }
function replay() {
  clearLater(); S.k = 0; render(); settle();
  /* the moment: the line draws through 2014, entry 6 is entered, then the documents and the stamp that relied on 2014 are told */
  later(() => { S.k = 1; $('.old').style.setProperty('--s', 1); $$('.hide').forEach(e => { if (!e.closest('.doc') && !e.classList.contains('disp')) e.classList.remove('hide'); }); $('.disp').classList.add('hide'); }, ms('--motion-run'));
  later(() => step(2), ms('--motion-run') + ms('--motion-calm'));
  later(() => step(3), ms('--motion-run') + ms('--motion-calm') * 2);
}
onKeys({ r: replay, n: () => step(Math.min(3, S.k + 1)) });
replay();
</script>
</body>
</html>
