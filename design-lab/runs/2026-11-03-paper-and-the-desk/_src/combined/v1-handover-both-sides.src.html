<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="x-shot-wait" content="4600">
<title>Desk · Combined V1 · The handover, both sides</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- C1: one handover end to end, from both desks at once. flat: both desks equally sharp ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--space-3)}
.head{display:flex;align-items:flex-end;gap:var(--space-5)}
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative}
.stp{display:grid;gap:2px;padding:var(--space-2) var(--space-3) 0;border-top:2px solid var(--hairline);transition:border-color var(--motion-base) var(--ease-standard)}
.stp b{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.stp span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.stp.done{border-top-color:var(--hairline-strong)}.stp.done b{color:var(--ink)}
.stp.now{border-top-color:var(--x-proposed-lit)}.stp.now b{color:var(--x-proposed-lit)}.stp.now span{color:var(--ink)}
.desks{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--space-7) + var(--space-2)) minmax(0,1fr);gap:0;min-height:0}
.desk{display:flex;flex-direction:column;gap:var(--space-3);min-height:0;padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset)}
.dh{display:flex;align-items:center;gap:var(--space-3)}
.dh .pchip b{font-size:var(--type-lead)}
.dh .x{margin-left:auto;font-size:var(--type-small);color:var(--ink-muted)}
.desk .bay .strip{min-height:var(--target-md)}
.desk .bay .strip .ln{font-size:var(--x-proposed-type-micro)}
.mid{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:calc(var(--space-7) + var(--space-3));gap:var(--space-2)}
.mid .line{position:absolute;top:calc(var(--space-7) + var(--space-5));bottom:var(--space-5);left:50%;border-left:1px dashed var(--hairline-strong)}
.tok{position:relative;z-index:1;display:grid;justify-items:center;gap:2px;padding:var(--space-2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--slate-deep);font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--light);text-align:center;transition:transform var(--motion-calm) var(--ease-out),border-color var(--motion-base) var(--ease-standard)}
.tok.tr{border-style:dashed;border-color:var(--x-proposed-transit)}
.tok.l{transform:translateX(calc(var(--space-4) * -1))}.tok.r{transform:translateX(var(--space-4))}
.sbar{gap:var(--space-1)}
.sb{padding:var(--space-2) var(--space-3);grid-template-columns:var(--space-5) minmax(0,1fr)}
.sb .sk{font-size:var(--type-heading)}
.sb .sbt{font-size:var(--type-small);line-height:var(--leading-small)}
.sb .sbw{display:none}.sb{grid-template-areas:"k t" "k s";gap:0 var(--space-3)}.desk{overflow:hidden}
.card-in{display:grid;gap:var(--space-2);padding:var(--space-3);border:1px dashed var(--x-proposed-transit);border-radius:var(--radius-key)}
.card-in.taken{border-style:solid;border-color:var(--hairline-strong)}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2) var(--space-3);align-items:start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.q .tm{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.q .say{font-style:italic}
.q.ghost{opacity:.25}
.q.land{animation:fill var(--motion-calm) var(--ease-out)}
@keyframes fill{from{background:var(--x-proposed-lit-wash);opacity:0}}
.books{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-4);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.bk{display:grid;gap:var(--space-1)}
.bk .r{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:opacity var(--motion-base) var(--ease-out)}
.bk .r .tm{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.bk .r.off{opacity:.2}
@media (max-width:1400px){.sb .src{display:none}.stp span{display:none}.desk{padding:var(--space-2) var(--space-3);gap:var(--space-2)}.desk .bay .strip:nth-child(n+4){display:none}.desks{grid-template-columns:minmax(0,1fr) var(--space-7) minmax(0,1fr)}.tok.l{transform:translateX(calc(var(--space-5) * -1))}.tok.r{transform:translateX(var(--space-5))}.books .bk:nth-child(3){display:none}.books{grid-template-columns:1fr 1fr}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V1</b> the handover, both sides: card, offer, readback, a question, take · handover V1–V4, ledger V3</div>
<script>
/*@DATA@*/
/*@LIB@*/
const h = DATA.handover, it = ITEM(h.item), A = h.from, T = h.to;
const STEPS = [
  ['Card', `${first(A)} writes A and R; S and B come from records`],
  ['Offer', `both names on it; still ${first(A)}’s`],
  ['Read back', `${first(T)} says it in his words, and asks one thing`],
  ['Answer', `${first(A)} answers on the card`],
  ['Take', `the holder moves; both books get a line`]
];
const S = { st: 0 };
const T_AT = [h.start, h.times.offer, h.times.read, h.times.answer, h.times.take];
function aBay() {
  const st = S.st, mine = DATA.items.filter(x => x.holder === A && !x.to && x.id !== it.id).sort((a, b) => a.h - b.h).slice(0, 2);
  const s = st >= 4 ? null : { ...it, cock: null, to: st >= 1 ? T : null, state: st >= 1 ? 'offered to ' + P(T).name : it.state, line: st >= 1 ? 'still yours until Tom reads it back' : it.line };
  return `<div class="bay">${s ? stripHTML(s, { noCock: true, sel: true }) : `<p class="note" style="padding:var(--space-2) 0">${I('check', 12)} ${it.id} went to ${P(T).name} at ${h.times.take}. Your stamp book keeps the stub.</p>`}${mine.map((x, i) => stripHTML(x, { i, noCock: true })).join('')}</div>`;
}
function tBay() {
  const st = S.st, jobs = jobsOf(T).map(j => ({ id: j.id, kind: 'intent', title: j.t + ', ' + j.home, floor: 'team', holder: T, due: j.due, h: j.h, state: STG(j.stage).w, line: JK(j.kind).w }));
  const s = st < 1 ? null : { ...it, cock: null, holder: st >= 4 ? T : A, to: st >= 4 ? null : T, state: st >= 4 ? 'yours, taken from ' + P(A).name : 'offered to you by ' + P(A).name, line: st >= 4 ? 'the card stays on it' : 'yours when you read it back' };
  return `<div class="bay">${s ? stripHTML(s, { noCock: true, sel: true }) : `<p class="note" style="padding:var(--space-2) 0">Nothing offered to you.</p>`}${jobs.slice(0, 2).map((x, i) => stripHTML(x, { i, noCock: true })).join('')}</div>`;
}
function exchange() {
  const st = S.st;
  const rows = [
    [T, 'Read back', h.readback, h.times.read, st >= 2],
    [T, 'Asks', h.question, h.times.ask, st >= 2],
    [A, 'Answers', h.answer, h.times.answer, st >= 3],
    [T, 'Takes it', `It is mine from ${h.times.take}.`, h.times.take, st >= 4]
  ];
  return rows.map(([w, k, t, tm, on], i) => `<div class="q ${on ? '' : 'ghost'} ${on && i === [0, 0, 1, 2, 3][st] ? 'land' : ''}">${ini(w, 'sm')}<span><b style="font-weight:400;color:var(--ink-muted)">${k}:</b> <span class="say">“${t}”</span></span><span class="tm">${on ? tm : ''}</span></div>`).join('');
}
function render() {
  const st = S.st, tokPos = st === 0 ? 'l' : st >= 4 ? 'r' : '';
  $('#app').innerHTML = topHTML(['Mandate', it.id, 'Hand over'], [['N', 'next step'], ['B', 'back'], ['1–5', 'jump'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div class="head"><div><p class="eyebrow">${it.id} · ${it.title} · ${h.why}</p><h1 class="t" style="margin-top:var(--space-1)">The handover, both sides</h1></div></div>
      <div class="track">${STEPS.map(([w, d], i) => `<div class="stp ${i < st ? 'done' : i === st ? 'now' : ''}"><b>${i + 1} · ${w}${i <= st ? ' · ' + T_AT[i] : ''}</b><span>${d}</span></div>`).join('')}</div>
      <div class="desks">
        <section class="desk" aria-label="${P(A).name}'s desk"><div class="dh">${pchip(A)}<span class="x">${P(A).role} · gives</span></div>${aBay()}
          <p class="eyebrow">The card ${st === 0 ? '· writing' : '· sent ' + h.times.offer}</p>${sbarHTML({ show: 4 })}</section>
        <div class="mid" aria-hidden="true"><span class="line"></span><span class="tok ${st >= 1 && st < 4 ? 'tr' : ''} ${tokPos}">${I('target', 14)}${it.id}<span>${st >= 1 && st < 4 ? P(A).ini + ' + ' + P(T).ini : P(st >= 4 ? T : A).ini}</span></span></div>
        <section class="desk" aria-label="${P(T).name}'s desk"><div class="dh">${pchip(T)}<span class="x">${P(T).role} · ${P(T).away}</span></div>${tBay()}
          <p class="eyebrow">${st >= 1 ? 'Offered to you · read it back to take it' : 'In-tray · empty'}</p>
          <div class="card-in ${st >= 4 ? 'taken' : ''}">${st >= 1 ? `<p class="note" style="margin:0">${P(A).name}’s card: ${h.sbar.s.text}</p>${exchange()}` : '<p class="note" style="margin:0">Nothing is on its way to you.</p>'}</div></section>
      </div>
      <div class="books">
        <div class="bk"><p class="eyebrow">${first(A)}’s stamp book</p><span class="r ${st >= 1 ? '' : 'off'}">${I('hand-helping', 12)}offered ${it.id} to ${P(T).ini}<span class="tm">${h.times.offer}</span></span><span class="r ${st >= 3 ? '' : 'off'}">${I('message-square-quote', 12)}answered on the card<span class="tm">${h.times.answer}</span></span></div>
        <div class="bk"><p class="eyebrow">${first(T)}’s stamp book</p><span class="r ${st >= 2 ? '' : 'off'}">${I('message-square-quote', 12)}read back, asked one question<span class="tm">${h.times.read}</span></span><span class="r ${st >= 4 ? '' : 'off'}">${I('user-check', 12)}took ${it.id} from ${P(A).ini}<span class="tm">${h.times.take}</span></span></div>
        <div class="bk"><p class="eyebrow">${it.id}’s account</p><span class="r ${st >= 4 ? '' : 'off'}">${I('history', 12)}held by ${P(T).name}, from ${P(A).name}, with card and readback<span class="tm">${h.times.take}</span></span><span class="r ${st >= 1 && st < 4 ? '' : 'off'}">${I('hourglass', 12)}in the changeover zone until ${h.window.split(' ').pop()} at the latest<span class="tm"></span></span></div>
      </div>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function go(n) { S.st = Math.max(0, Math.min(STEPS.length - 1, n)); render(); }
function replay() {
  clearLater(); S.st = 0; render(); settle();
  /* the moment: at 1.2 s the card goes out as an offer; then the readback, the answer and the take follow */
  [1, 2, 3, 4].forEach((n, k) => later(() => go(n), ms('--motion-run') + k * ms('--motion-calm') * 1.4));
}
onKeys({ r: replay, n: () => go(S.st + 1), b: () => go(S.st - 1), 1: () => go(0), 2: () => go(1), 3: () => go(2), 4: () => go(3), 5: () => go(4) });
replay();
</script>
</body>
</html>
