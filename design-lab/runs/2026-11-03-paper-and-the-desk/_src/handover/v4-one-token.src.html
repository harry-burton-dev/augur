<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Handover V4 · One token</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: one token per thing. whoever holds it can change it; everyone else can read it. the token can't be in two hands ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-6)}
.inst{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--space-5);align-items:center;padding:var(--space-5);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset)}
.hand{display:grid;justify-items:center;gap:var(--space-2);text-align:center}
.hand .name{font-size:var(--type-meta);color:var(--light)}
.hand .r{font-size:var(--type-small);color:var(--ink-muted)}
.cup{width:calc(var(--space-7) + var(--space-3));height:calc(var(--space-7) + var(--space-3));border-radius:var(--radius-pill);border:1px dashed var(--x-proposed-slot);display:flex;align-items:center;justify-content:center}
/* the token: a disc with the thing's id. it moves; it is never copied */
.token{width:calc(var(--space-7) - var(--space-1));height:calc(var(--space-7) - var(--space-1));border-radius:var(--radius-pill);border:2px solid var(--fc);background:color-mix(in srgb,var(--fc) 16%,var(--slate-deep));display:grid;place-items:center;align-content:center;font:500 var(--x-proposed-type-micro)/1.2 var(--font-mono);color:var(--light);box-shadow:0 0 0 var(--space-1) color-mix(in srgb,var(--fc) 10%,transparent);animation:land var(--motion-calm) var(--ease-out)}
.mid{display:grid;justify-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted);text-align:center}
.mid .lock{display:flex;gap:var(--space-1);align-items:center;color:var(--ink)}
.left,.right{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.acts{display:grid;gap:var(--space-1)}
.act{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2);align-items:center;padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink)}
.act.no{color:var(--ink-muted)}
.act.no .wh{font-size:var(--type-small)}
.act.yes{background:var(--surface-raised)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.view{display:grid;gap:var(--space-2);align-content:start}
@media (max-width:1400px){.wrap{gap:var(--space-4)}.inst{padding:var(--space-3);gap:var(--space-3)}.act{font-size:var(--type-small);padding:var(--space-1) var(--space-2);grid-template-columns:var(--space-4) minmax(0,1fr)}.act .wh{grid-column:2;font-size:var(--x-proposed-type-micro)}.left .lede{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Handover · V4</b> one token: the holder can change it, others can read it; never in two hands · railway token working (Tyer, 1878)</div>
<script>
/*@DATA@*/
/*@LIB@*/
const h = DATA.handover, it = ITEM(h.item);
const S = { stage: 0 }; /* 0 Amara has it, 1 Tom asked / offered, 2 Tom has it */
const ACTS = [['calendar-clock', 'Change the deadline'], ['circle-check', 'Mark a home done'], ['undo-2', 'Close or hand back to Helen'], ['hand-helping', 'Hand it over'], ['message-square-quote', 'Add a note'], ['eye', 'Read it and its history']];
function actsHTML(who) {
  const holds = (S.stage === 2 ? h.to : h.from) === who;
  return `<div class="acts">${ACTS.map(([ic, w], i) => {
    const free = i >= 4, ok = holds || free;
    return `<div class="act ${ok ? 'yes' : 'no'}">${I(ok ? ic : 'lock', 14)}<span>${w}</span><span class="wh">${ok ? (free ? 'anyone who can see it' : 'you hold the token') : 'needs the token · ' + first(S.stage === 2 ? h.to : h.from) + ' has it'}</span></div>`;
  }).join('')}</div>`;
}
function render() {
  const st = S.stage, holder = st === 2 ? h.to : h.from;
  const tok = `<span class="token" data-tier="${it.floor}">${I('target', 14)}${it.id}</span>`;
  $('#app').innerHTML = topHTML(['Mandate', it.id], [['O', 'offer'], ['T', 'Tom reads back'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <section class="left"><div><p class="eyebrow">${it.title}</p><h1 class="t" style="margin-top:var(--space-1)">One token</h1></div>
        <p class="lede">Every thing that needs someone has one token. Whoever holds it can change the thing; everyone who can see it can read it and write notes. Handing over moves the token. There is no way to copy it, so two people can never both think it is theirs.</p>
        <div class="inst">
          <div class="hand">${pchip(h.from)}<span class="r">${P(h.from).role}</span><span class="cup">${holder === h.from ? tok : ''}</span></div>
          <div class="mid">${st === 1 ? `<span class="lock">${I('hand-helping', 16)} offered ${h.times.offer}</span>stays in Amara’s hand<br>until Tom reads it back` : st === 2 ? `<span class="lock">${I('arrow-right', 16)} moved ${h.times.take}</span>after Tom’s readback` : `<span class="lock">${I('lock', 16)} 1 token</span>for ${it.id}`}</div>
          <div class="hand">${pchip(h.to)}<span class="r">${P(h.to).role}</span><span class="cup">${holder === h.to ? tok : ''}</span></div></div>
        <p class="note">The token never rests in the middle. On the railway the instruments in two signal boxes were wired so that only one tablet could be out for a single line. Here the rule is the same, in software: one holder at a time, and the move is one step, not a copy and a delete.</p>
      </section>
      <section class="right"><div><p class="eyebrow">What each of them can do now</p><h2 class="h" style="margin-top:var(--space-1)">${st === 2 ? 'Tom can change it; Amara can read it' : 'Amara can change it; Tom can read it'}</h2></div>
        <div class="views"><div class="view"><p class="eyebrow">${first(h.from)}</p>${actsHTML(h.from)}</div><div class="view"><p class="eyebrow">${first(h.to)}</p>${actsHTML(h.to)}</div></div>
        <p class="why">${I('info', 14)}<span>Locked actions stay in the list and say who has the token, so nobody wonders why a button is missing.</span></p></section>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function offer() { if (S.stage === 0) { S.stage = 1; render(); } }
function take() { if (S.stage === 1) { S.stage = 2; render(); } }
function replay() {
  clearLater(); S.stage = 0; render(); settle();
  /* the moment: offered, then Tom reads it back and the token moves; the two lists of actions swap */
  later(offer, ms('--motion-run') - ms('--motion-calm'));
  later(take, ms('--motion-run') + ms('--motion-calm'));
}
onKeys({ r: replay, o: offer, t: take });
replay();
</script>
</body>
</html>
