<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Handover V2 · Across the bays</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: hand a strip across, as between sectors. it rests on the line between two bays until it is taken ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.bays{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0}
.bayc{display:grid;align-content:start;gap:var(--space-2);padding:var(--space-4) var(--space-5);min-height:0}
.bayc + .bayc{border-left:2px dashed var(--hairline-strong)}
.bayc .bay-h{margin-bottom:var(--space-2)}
.bayc .strip{grid-template-columns:var(--x-proposed-strip-edge) calc(var(--space-8) - var(--space-4)) minmax(0,1fr) calc(var(--space-7) + var(--space-1)) calc(var(--space-8) + var(--space-1))}
.mover{position:absolute;width:calc(50% - var(--space-6));left:var(--space-5);top:var(--y);transition:left var(--motion-calm) var(--ease-out),top var(--motion-calm) var(--ease-out);z-index:3;cursor:grab}
.mover.mid{left:25%}.mover.far{left:calc(50% + var(--space-5))}
.mover .strip{box-shadow:var(--shadow-raised)}
.mover .tag{position:absolute;left:50%;top:calc(100% + var(--space-1));transform:translateX(-50%);font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted);white-space:nowrap;background:var(--slate-deep);padding:2px var(--space-2);border-radius:var(--radius-key)}
.ph{margin-bottom:var(--space-5);height:calc(var(--target-md) + var(--space-3));border:1px dashed var(--x-proposed-slot);border-radius:var(--radius-key);display:flex;align-items:center;padding:0 var(--space-4);font-size:var(--type-small);color:var(--ink-muted)}
.custody{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap;border-top:1px solid var(--hairline);padding-top:var(--space-3);font-size:var(--type-small);color:var(--ink-muted)}
.custody .c{display:inline-flex;gap:var(--space-2);align-items:center}
.custody .c b{font-weight:400;color:var(--ink)}
.custody .c.on b{color:var(--x-proposed-lit)}
@media (max-width:1400px){.bayc{padding:var(--space-3)}.bayc .strip .ln{display:none}.bayc .strip{min-height:var(--target-sm)}.mover .strip .ln{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Handover · V2</b> across the bays: drag a strip to a colleague's bay; it rests on the line between until they take it · strips passed between sectors, the radar handoff "accept"</div>
<script>
/*@DATA@*/
/*@LIB@*/
const h = DATA.handover, it = ITEM(h.item);
const S = { stage: 0 }; /* 0 yours, 1 on the line, 2 taken */
const mineList = DATA.items.filter(x => x.holder === h.from && x.id !== it.id && !x.to).sort((a, b) => a.h - b.h).slice(0, 3);
const tomJobs = DATA.board.jobs.filter(j => j.holder === h.to);
const jobStrip = (j, i) => stripHTML({ id: j.id, kind: 'intent', title: j.t + ', ' + j.home, floor: 'team', holder: j.holder, due: j.due, h: j.h, state: DATA.board.stages.find(s => s.id === j.stage).w, line: DATA.board.jobKinds[j.kind].w }, { i, line: DATA.board.jobKinds[j.kind].w + ' · ' + DATA.board.stages.find(s => s.id === j.stage).w });
function render() {
  const st = S.stage, held = st === 2 ? h.to : h.from;
  const s = { ...it, cock: null, holder: held, to: st === 1 ? h.to : null, state: st === 1 ? 'on the line: offered to ' + P(h.to).name : st === 2 ? 'taken by ' + P(h.to).name + ' at ' + h.times.take : it.state, line: st === 1 ? 'yours until Tom reads it back' : it.line };
  $('#app').innerHTML = topHTML(['Team', 'Repairs North', 'Bays'], [['drag', 'or H to hand across'], ['T', 'Tom takes it'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div><p class="eyebrow">Two bays, one line between them</p><h1 class="t" style="margin-top:var(--space-1)">${st === 0 ? 'Hand it across' : st === 1 ? 'On the line' : 'Tom holds it'}</h1></div>
      <div class="bays" id="bays">
        <section class="bayc"><div class="bay-h"><p class="eyebrow">${P(h.from).name}</p><span class="x">${h.why.replace(P(h.from).name.split(' ')[0] + ' is ', '')}</span></div>
          ${st === 0 ? '<div class="ph" style="visibility:hidden"></div>' : `<div class="ph">${st === 1 ? 'still yours' : 'gone ' + h.times.take + ' · stub kept'}</div>`}
          ${mineList.map((x, i) => stripHTML(x, { i: i + 1, noCock: true })).join('')}</section>
        <section class="bayc"><div class="bay-h"><p class="eyebrow">${P(h.to).name}</p><span class="x">${P(h.to).away}</span></div>
          <div class="ph" style="justify-content:flex-end">${st === 2 ? '' : st === 1 ? 'read back · T' : 'room for one more'}</div>
          ${tomJobs.map((j, i) => jobStrip(j, i + 1)).join('')}</section>
        <div class="mover ${['', 'mid', 'far'][S.prev ?? st]}" id="mover" style="--y:calc(var(--space-4) + var(--space-6) + var(--space-2))">${stripHTML(s, { noCock: true })}${st === 1 ? `<span class="tag">${P(h.from).ini} holds · ${P(h.to).ini} to take · offered ${h.times.offer}</span>` : ''}</div>
      </div>
      <div class="custody"><span class="c ${st === 0 ? 'on' : ''}">${ini(h.from, 'sm')}<b>held by ${first(h.from)}</b></span>${I('chevron-right', 14)}
        <span class="c ${st === 1 ? 'on' : ''}">${I('hand-helping', 14)}<b>offered ${st ? h.times.offer : ''}</b> both names on it</span>${I('chevron-right', 14)}
        <span class="c ${st === 2 ? 'on' : ''}">${ini(h.to, 'sm')}<b>taken ${st === 2 ? h.times.take : ''}</b> after a readback</span>
        <span style="margin-left:auto">Dropping it anywhere but a bay puts it back. It is never held by nobody.</span></div>
    </div></main>`;
  Icons.hydrate($('#app'));
  const m = $('#mover');
  if (S.prev !== undefined && S.prev !== st) requestAnimationFrame(() => requestAnimationFrame(() => { m.classList.remove('mid', 'far'); if (st) m.classList.add(['', 'mid', 'far'][st]); }));
  S.prev = st;
  m.onpointerdown = e => { if (S.stage) return; const sx = e.clientX; m.setPointerCapture(e.pointerId); m.style.transition = 'none';
    m.onpointermove = v => { m.style.transform = `translateX(${v.clientX - sx}px)`; };
    m.onpointerup = v => { m.onpointermove = null; m.style.transition = ''; m.style.transform = ''; if (v.clientX - sx > $('#bays').clientWidth / 5) hand(); }; };
}
function hand() { if (S.stage === 0) { S.stage = 1; render(); } }
function take() { if (S.stage === 1) { S.stage = 2; render(); } }
function replay() {
  clearLater(); S.stage = 0; S.prev = undefined; render(); settle();
  /* the moment: the strip slides onto the line between the bays and rests there, both names on it */
  later(hand, ms('--motion-run'));
}
onKeys({ r: replay, h: hand, t: take });
replay();
</script>
</body>
</html>
