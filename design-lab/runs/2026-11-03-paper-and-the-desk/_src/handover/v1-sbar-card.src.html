<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Handover V1 · The SBAR card</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: a handover has one shape. records fill S and B; the giver writes A and R; the taker reads it back ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:var(--space-6)}
.col{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.who{display:flex;gap:var(--space-3);align-items:center;font-size:var(--type-meta);color:var(--ink-muted)}
.rule{display:grid;gap:var(--space-2)}
.rule li{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.rule ol{margin:0;padding-left:var(--space-5);display:grid;gap:var(--space-2)}
.state{display:flex;gap:var(--space-3);align-items:center;border-top:1px solid var(--hairline);padding-top:var(--space-3)}
@media (max-width:1400px){.sb .sbw small{display:none}.sb{padding:var(--space-2) var(--space-3)}.col{gap:var(--space-3)}.rule{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Handover · V1</b> the SBAR card: records fill S and B, the giver writes A and R, the taker reads it back before it moves · SBAR, I-PASS (Starmer 2014)</div>
<script>
/*@DATA@*/
/*@LIB@*/
const h = DATA.handover, it = ITEM(h.item);
const S = { show: 2, offered: false };
function render() {
  $('#app').innerHTML = topHTML(['Mandate', it.id, 'Hand over'], [['N', 'next box'], ['O', 'offer'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <section class="col"><div><p class="eyebrow">Hand over · ${it.id} · ${K(it.kind).word} on the ${F(it.floor).word} floor</p><h1 class="t" style="margin-top:var(--space-1)">${it.title}</h1></div>
        <div class="who">${pchip(h.from)} ${I('arrow-right', 16)} ${pchip(h.to, { role: true })}<span style="margin-left:auto">${h.why}</span></div>
        ${sbarHTML({ show: S.show })}
        <div class="state">${S.offered ? stripHTML({ ...it, to: h.to, cock: null, state: 'offered to ' + P(h.to).name, line: 'yours until ' + first(h.to) + ' reads it back' }, { noCock: true }) :
          `<button class="btn ${S.show === 4 ? 'go' : ''}" ${S.show === 4 ? '' : 'aria-disabled="true"'} data-o>${I('hand-helping', 14)} Offer it to ${first(h.to)} <span class="kbd">O</span></button><span class="note">${S.show < 4 ? 'All four boxes first. A and R are yours to write; AUGUR can’t know them.' : 'Nothing moves yet: it stays yours until ' + first(h.to) + ' reads it back.'}</span>`}</div>
      </section>
      <section class="col"><div><p class="eyebrow">What ${first(h.to)} will be asked to do</p><h2 class="h" style="margin-top:var(--space-1)">Read it back</h2></div>
        <div class="readback wait"><p class="eyebrow">${first(h.to)}’s readback · in his words, one or two lines</p><p class="note" style="font-style:italic">“${h.readback}”</p>
          <p class="note">A readback is not a tick. It is the taker saying, in their own words, what they now hold and what they will do first.</p></div>
        <div class="panel rule"><p class="eyebrow">The handover rule</p><ol>
          <li>One shape for every handover, on every floor: four boxes, in this order.</li>
          <li>Situation and Background come from records, and say so. The giver can add, never delete.</li>
          <li>Assessment and Recommendation are the giver’s own words. They can’t be skipped.</li>
          <li>It moves when the taker reads it back, not when the giver lets go. Until then the giver holds it, and both names are on the strip.</li>
          <li>The card stays with the thing for good, as the first page of its next chapter.</li></ol></div>
      </section></div></main>`;
  Icons.hydrate($('#app'));
  $('[data-o]') && ($('[data-o]').onclick = offer);
}
function next() { if (S.show < 4) { S.show++; render(); } }
function offer() { if (S.show === 4) { S.offered = true; render(); } }
function replay() {
  clearLater(); S.show = 2; S.offered = false; render(); settle();
  /* the moment: Amara's two boxes fill, then the strip goes out offered, both names on it */
  later(next, ms('--motion-run') - ms('--motion-calm'));
  later(next, ms('--motion-run'));
  later(offer, ms('--motion-run') + ms('--motion-calm'));
}
onKeys({ r: replay, n: next, o: offer });
replay();
</script>
</body>
</html>
