<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Handover V3 · The changeover zone</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: a handover is a zone in time, not an instant. both hold it inside the zone; outside it, exactly one does ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:var(--space-5)}
.track{position:relative;height:calc(var(--space-8) + var(--space-6));margin:0 var(--space-4)}
.lane{position:absolute;left:0;right:0;height:var(--space-6);border-top:1px solid var(--hairline-strong);border-bottom:1px solid var(--hairline-strong)}
.lane.a{top:var(--space-5)}.lane.b{top:calc(var(--space-5) + var(--space-6) + var(--space-3))}
.lane .lab{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);color:var(--ink)}
.run{position:absolute;top:calc(var(--space-2) + 1px);height:calc(var(--space-6) - var(--space-4));border-radius:var(--radius-pill);background:color-mix(in srgb,var(--fc) 35%,transparent);border:1px solid var(--fc)}
.run.dash{background:none;border-style:dashed}
.zone{position:absolute;top:0;bottom:var(--space-5);border-left:1px dashed var(--x-proposed-lit);border-right:1px dashed var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.zone span{position:absolute;top:calc(var(--space-4) * -1);left:0;right:0;text-align:center;font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--x-proposed-lit);white-space:nowrap}
.tk{position:absolute;bottom:0;transform:translateX(-50%);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.now{position:absolute;top:0;bottom:var(--space-4);border-left:1px solid var(--light);transition:left var(--motion-calm) var(--ease-out)}
.now::after{content:"now";position:absolute;top:calc(var(--space-4) * -1);right:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--light)}
.baton{position:absolute;top:calc(var(--space-5) + var(--space-6) - var(--space-1));transform:translate(-50%,-50%);display:flex;gap:2px;align-items:center;padding:var(--space-1) var(--space-2);background:var(--slate-deep);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);transition:left var(--motion-calm) var(--ease-out);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--light)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);align-items:start}
.rules .panel{display:grid;gap:var(--space-2);align-content:start}
.rules h3{margin:0;font-weight:400;font-size:var(--type-meta);color:var(--light);display:flex;gap:var(--space-2);align-items:center}
.can{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2) var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);align-items:center}
.can .y{color:var(--x-proposed-lit)}.can .n{color:var(--ink-muted)}
@media (max-width:1400px){.rules .panel:nth-child(3){display:none}.rules{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Handover · V3</b> the changeover zone: from offer to take both hold it; if the zone closes untaken it stays with the giver, never dropped · relay changeover zone, radar handoff</div>
<script>
/*@DATA@*/
/*@LIB@*/
const h = DATA.handover, it = ITEM(h.item);
/* the day from 09:00 to 17:00, as minutes */
const m = t => { const [a, b] = t.split(':').map(Number); return a * 60 + b; };
const T0 = m('09:00'), T1 = m('17:00'), X = t => (m(t) - T0) / (T1 - T0) * 100;
const ZEND = h.window.split(' ').pop();
const S = { stage: 0 };
const AT = ['10:40', h.times.offer, h.times.take];
function render() {
  const st = S.stage, take = st === 2 ? h.times.take : null;
  const aEnd = st === 0 ? null : st === 1 ? ZEND : take;
  const ticks = ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00'].map(t => `<span class="tk" style="left:${X(t)}%">${t}</span>`).join('');
  $('#app').innerHTML = topHTML(['Mandate', it.id, 'Hand over'], [['O', 'offer'], ['T', 'Tom takes it'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div><p class="eyebrow">${it.id} · ${it.title}</p><h1 class="t" style="margin-top:var(--space-1)">${st === 0 ? 'Amara holds it' : st === 1 ? 'In the changeover zone' : 'Tom holds it'}</h1></div>
      <p class="lede">A handover takes time. From the moment it is offered to the moment it is taken, it is in the zone: both names are on it, both can read it, and the giver still answers for it. The zone has an end the giver sets. If it isn’t taken by then, it stays with the giver and she is told: it is never dropped.</p>
      <div class="track" role="img" aria-label="Who holds ${it.id} through the day">
        ${st ? `<div class="zone" style="left:${X(h.times.offer)}%;width:${X(take || ZEND) - X(h.times.offer)}%"><span>zone · ${h.times.offer} to ${take || ZEND}${take ? ' (taken)' : ' at the latest'}</span></div>` : ''}
        <div class="lane a" data-tier="team"><span class="lab">${ini(h.from, 'sm')}</span><span class="run" style="left:2%;width:${(st ? X(take || ZEND) : X('10:40')) - 2}%"></span>${st === 1 ? '' : ''}</div>
        <div class="lane b" data-tier="team"><span class="lab">${ini(h.to, 'sm')}</span>${st ? `<span class="run ${st === 1 ? 'dash' : ''}" style="left:${X(h.times.offer)}%;width:${(st === 2 ? 100 : X(ZEND)) - X(h.times.offer)}%"></span>` : ''}</div>
        <span class="baton" style="left:${X(AT[st])}%">${I('target', 12)} ${it.id} · ${st === 1 ? P(h.from).ini + ' + ' + P(h.to).ini : P(st === 2 ? h.to : h.from).ini}</span>
        <span class="now" style="left:${X(AT[st])}%"></span>${ticks}</div>
      <div class="rules">
        <div class="panel"><h3>${I('hand-helping', 16)} In the zone, each of them can</h3><div class="can">
          ${[['read it and its card', 'both', 'both'], ['ask a question on the card', 'both', 'both'], ['change the deadline or close it', first(h.from), 'giver only'], ['read it back and take it', first(h.to), 'taker only'], ['take the offer back', first(h.from), 'giver only']].map(([a, w, x]) => `<span class="${w === 'both' ? 'y' : 'n'}">${I(w === 'both' ? 'check' : 'user-round', 14)}</span><span>${a}</span><span class="note">${x}</span>`).join('')}</div></div>
        <div class="panel"><h3>${I('clock', 16)} When the zone closes untaken</h3>
          <p class="note">At <b>${ZEND}</b> it stops being offered. It stays with ${first(h.from)}, the card is kept as a draft, and both get one line: “${it.id} wasn’t taken; it is still ${first(h.from)}’s.” Nothing is reassigned by a timer.</p></div>
        <div class="panel"><h3>${I('history', 16)} What the record keeps</h3>
          <p class="note">Two entries, one in each person’s book: “offered ${h.times.offer}” on ${first(h.from)}’s side, “taken ${h.times.take}” on ${first(h.to)}’s. The time between is the zone, and it is on the thing for good.</p></div>
      </div>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function offer() { if (S.stage === 0) { S.stage = 1; render(); } }
function take() { if (S.stage === 1) { S.stage = 2; render(); } }
function replay() {
  clearLater(); S.stage = 0; render(); settle();
  /* the moment: Amara offers it; the zone opens and both lanes carry the baton */
  later(offer, ms('--motion-run'));
}
onKeys({ r: replay, o: offer, t: take });
replay();
</script>
</body>
</html>
