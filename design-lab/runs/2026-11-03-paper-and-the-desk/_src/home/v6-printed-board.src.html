<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Home V6 · The printed board</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: the expert layer. strips as fixed-width printed lines, marks in a fixed shorthand, all by keyboard ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-6)}
.left{min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--space-3)}
.pr{font:400 var(--type-meta)/1.9 var(--font-mono);color:var(--ink);white-space:pre;overflow:hidden}
.colh{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);white-space:pre;border-bottom:1px solid var(--hairline-strong);padding:0 0 var(--space-2) var(--space-3)}
.rows{display:grid;gap:2px;align-content:start}
.row{position:relative;display:block;width:100%;padding:0 var(--space-3);border-left:var(--x-proposed-strip-edge) solid var(--fc);background:var(--x-proposed-strip);border-radius:2px;transition:transform var(--motion-calm) var(--ease-out)}
.row.sel{outline:1px solid var(--x-proposed-lit);outline-offset:-1px}
.row.cocked{transform:translateX(var(--x-proposed-cock))}
.row.transit{background:transparent;outline:1px dashed var(--x-proposed-transit);outline-offset:-1px}
.row.ghost{opacity:var(--x-proposed-quiet)}
.row .m{color:var(--x-proposed-lit)}
.row .p{color:var(--x-proposed-past)}
.sep{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-label);text-transform:uppercase;padding:var(--space-3) 0 var(--space-1) var(--space-3)}
.cmd{display:flex;align-items:center;gap:var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);font:400 var(--type-meta)/1.4 var(--font-mono);background:var(--surface-inset)}
.cmd .pr{color:var(--light)}
.cmd .caret{display:inline-block;width:1px;height:1.2em;background:var(--ink);vertical-align:-3px}
.cmd .out{margin-left:auto;font-size:var(--type-small);color:var(--ink-muted);font-family:var(--font-sans)}
.key{display:grid;align-content:start;gap:var(--space-4);border-left:1px solid var(--hairline);padding-left:var(--space-5);min-height:0}
.key table{border-collapse:collapse;font-size:var(--type-small);line-height:var(--leading-small)}
.key td{padding:var(--space-1) var(--space-2) var(--space-1) 0;vertical-align:top;color:var(--ink-muted)}
.key td:first-child{font-family:var(--font-mono);color:var(--light);white-space:nowrap}
@media (max-width:1400px){.pr{font-size:var(--type-small)}.wrap{grid-template-columns:minmax(0,1fr) calc(var(--measure-rail) + var(--space-5))}.key td:nth-child(3){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Home · V6</b> the printed board: fixed columns, a fixed shorthand of marks, every gesture a keystroke · strip printers, controllers' shorthand</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { sel: 0, cock: false, typed: '', done: null };
const me = DATA.me;
const pad = (s, n) => (s + ' '.repeat(n)).slice(0, n);
const lpad = (s, n) => (' '.repeat(n) + s).slice(-n);
const KIND = { intent: 'INT', fact: 'FCT', approval: 'APR', share: 'SHR', sync: 'SYN', upgrade: 'UPG' };
const FL = { org: 'O', department: 'D', team: 'T' };
const short = it => it.h < 0 ? `+${Math.floor(-it.h / 24)}D${Math.round(-it.h % 24)}H` : it.h < 24 ? `${Math.floor(it.h)}H${lpad(String(Math.round((it.h % 1) * 60)), 2).replace(' ', '0')}` : `${Math.round(it.h / 24)}D`;
/* marks in shorthand: ↳ cocked, → offered to, ⇠ offered by, ◌ after, ◉ pointed out by, ✓n initials so far */
function marks(it) {
  const m = [];
  if (it.cock && S.cock) m.push(`<span class="m">↳ ${it.cock.note.split(' ').slice(0, 3).join(' ').toUpperCase()}</span>`);
  if (it.to && it.holder === me) m.push(`→${P(it.to).ini}`);
  if (it.to === me) m.push(`⇠${P(it.holder).ini}`);
  if (it.next) m.push(`◌${P(it.holder).ini}`);
  if (it.pointedBy) m.push(`◉${P(it.pointedBy).ini}`);
  if (it.kind === 'approval' && it.holder === me) m.push(`✓${DATA.approval.route.filter(r => r.at).map(r => P(r.who).ini).join(' ✓')}`);
  if (S.done && S.done.id === it.id) m.push(`<span class="m">${S.done.mark}</span>`);
  return m.join(' ');
}
const line = it => `${pad(it.id, 7)} ${KIND[it.kind]} ${FL[it.floor]} ${pad(it.title.toUpperCase(), 40)} ${pad(P(it.holder).ini, 3)}${it.h < 0 ? `<span class="p">${lpad(short(it), 7)}</span>` : lpad(short(it), 7)}  ${marks(it)}`;
const GROUPS = [['held', 'held by you', x => x.holder === me], ['coming', 'coming to you', x => x.to === me || x.next === me], ['pointed', 'pointed out to you', x => x.pointedBy]];
const order = () => GROUPS.flatMap(([, , t]) => DATA.items.filter(t).sort((a, b) => a.h - b.h));
function render() {
  let n = 0;
  const rows = GROUPS.map(([id, w, t]) => `<p class="sep">${w}</p>` + DATA.items.filter(t).sort((a, b) => a.h - b.h).map(it => {
    const i = n++;
    return `<div class="row dep pr ${i === S.sel ? 'sel' : ''} ${it.cock && S.cock ? 'cocked' : ''} ${it.to ? 'transit' : ''} ${it.next || it.pointedBy ? 'ghost' : ''}" data-tier="${it.floor}" style="--i:${i}">${line(it)}</div>`;
  }).join('')).join('');
  $('#app').innerHTML = topHTML(['Home', 'What needs you · printed'], [['J K', 'move'], ['C', 'cock'], ['H', 'hand over'], ['I', 'initial'], [':', 'command'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap"><div class="left">
      <div><p class="eyebrow">Your bay · printed</p><h1 class="t">What needs you</h1></div>
      <div class="colh">${pad('ID', 7)} KND F ${pad('WHAT', 40)} HLD    TIME  MARKS</div>
      <div class="rows scroll">${rows}</div>
      <div class="cmd">${I('terminal', 14)}<span class="pr">${S.typed}<span class="caret"></span></span><span class="out">${S.done ? S.done.out : 'Type a mark: c 207 · h 207 tr · i 118'}</span></div>
    </div>
    <aside class="key scroll"><div><p class="eyebrow">The shorthand</p><p class="note" style="margin-top:var(--space-1)">One fixed list for every deployment. Each mark is also a sentence on the strip’s back.</p></div>
      <table>${[['↳', 'cocked by its holder', 'set aside to come back to'], ['→TR', 'offered to Tom Reyes', 'still yours until taken'], ['⇠TR', 'offered to you by Tom', 'yours when you read it back'], ['◌DK', 'comes after Dev Kapoor', 'not yours yet'], ['◉MH', 'pointed out by Mo Haddad', 'theirs; you were told'], ['✓DK', 'initialled by Dev Kapoor', 'a mark, never removed'], ['+3D22H', 'past its time by that much', 'warm ink, no alarm'], ['5H18', 'due in 5 h 18 min', ''], ['KND F', 'kind and floor (O, D, T)', 'floors from the deployment']].map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>
      <div><p class="eyebrow">Commands</p><table>${[['c 207', 'cock M-207'], ['h 207 tr', 'hand M-207 to Tom Reyes'], ['p 3290 nb', 'point F-3290 out to Nkechi'], ['i 118', 'initial A-118'], ['t 212', 'take M-212 (asks for a readback)']].map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
    </aside></div></main>`;
  Icons.hydrate($('#app'));
}
function type(text, then) { let i = 0; const step = () => { S.typed = text.slice(0, ++i); render(); if (i < text.length) later(step, ms('--motion-instant')); else later(then, ms('--motion-base')); }; step(); }
function replay() {
  clearLater(); S.sel = 0; S.cock = false; S.typed = ''; S.done = null; render(); settle();
  /* the moment: "c 207" is typed; M-207 cocks out with your note in shorthand */
  later(() => type('c 207', () => { S.cock = true; S.typed = ''; S.done = { id: 'M-207', mark: '', out: 'M-207 cocked · only you see it' }; render(); }), ms('--motion-run') - ms('--motion-base') * 2);
}
const mv = d => { const n = order().length; S.sel = (S.sel + d + n) % n; render(); };
onKeys({ r: replay, j: () => mv(1), k: () => mv(-1), ArrowDown: () => mv(1), ArrowUp: () => mv(-1), c: () => { if (order()[S.sel].cock) { S.cock = !S.cock; render(); } } });
replay();
</script>
</body>
</html>
