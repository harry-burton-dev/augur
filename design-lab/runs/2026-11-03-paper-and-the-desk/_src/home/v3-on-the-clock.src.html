<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Home V3 · On the clock</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: position is time. strips hang in time columns either side of a now line; cocked ones stand proud ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.head{display:flex;align-items:flex-end;gap:var(--space-5)}
.head .lede{margin-left:auto;max-width:56ch;text-align:right}
.board{position:relative;display:grid;grid-template-columns:1fr 2px 1.15fr 1fr 1fr 1fr;gap:var(--space-3);min-height:0}
.col{display:flex;flex-direction:column;gap:var(--space-2);min-height:0;padding-top:var(--space-6)}
.col-h{position:absolute;top:0;display:grid;gap:2px}
.col-h .eyebrow{color:var(--ink)}
.col-h .c{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.col{position:relative}
.now{background:var(--x-proposed-lit);opacity:.75;border-radius:1px;position:relative}
.now span{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-lit);background:var(--slate-deep);padding:var(--space-1);white-space:nowrap}
/* a narrow strip for a column: kind, id, title, holder; time is the column */
.cs{position:relative;display:grid;grid-template-columns:var(--x-proposed-strip-edge) minmax(0,1fr) auto;background:var(--x-proposed-strip);border:1px solid var(--hairline);border-radius:var(--radius-key);transition:transform var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.cs::before{content:"";background:var(--fc);border-radius:var(--radius-key) 0 0 var(--radius-key)}
.cs .b{padding:var(--space-2) var(--space-3);display:grid;gap:2px;min-width:0}
.cs .id{font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);color:var(--ink-muted);display:flex;gap:var(--space-1);align-items:center}
.cs .tt{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.cs .ln{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.cs .h{padding:var(--space-2);display:flex;align-items:flex-start;gap:2px;border-left:1px solid var(--hairline)}
/* cocked in a time column: it stands proud, up and out, never hidden behind the others */
.cs.cocked{transform:translate(calc(var(--space-2)), calc(var(--space-2) * -1));border-color:var(--x-proposed-lit)}
.cs.transit{border-style:dashed;border-color:var(--x-proposed-transit);background:color-mix(in srgb,var(--x-proposed-strip) 55%,transparent)}
.cs.ghost{opacity:var(--x-proposed-quiet)}
.empty{border:1px dashed var(--x-proposed-slot);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.foot{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.foot b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){.head .lede{display:none}.cs .ln{display:none}.board{grid-template-columns:1fr 2px 1.1fr 1fr 1fr 1fr;gap:var(--space-2)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Home · V3</b> on the clock: where a strip hangs is when it is due; a cocked strip stands proud · strip boards ordered by estimate, the time-ordered bay</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { cock: false, show: 'all' };
const me = DATA.me;
const COLS = [
  { id: 'over', w: 'Past its time', test: h => h < 0 },
  { id: 'now' },
  { id: 'today', w: 'Today', test: h => h >= 0 && h < 13.3 },
  { id: 'tom', w: 'Tomorrow', test: h => h >= 13.3 && h < 37.3 },
  { id: 'week', w: 'This week', test: h => h >= 37.3 && h < 109 },
  { id: 'later', w: 'Later', test: h => h >= 109 }
];
const mine = it => it.holder === me || it.to === me || it.next === me || it.pointedBy;
function cs(it, i) {
  const k = K(it.kind), cocked = it.cock && S.cock;
  const rel = it.to === me ? `offered by ${first(it.holder)}` : it.to ? `offered to ${first(it.to)}` : it.next === me ? `after ${first(it.holder)}` : it.pointedBy ? `${first(it.holder)}’s · pointed out` : it.state;
  const hold = it.to ? ini(it.holder, 'sm') + ini(it.to, 'sm') : it.next ? ini(it.holder, 'sm') + ini(it.next, 'sm') : ini(it.holder, 'sm');
  return `<div class="cs dep ${cocked ? 'cocked' : ''} ${it.to ? 'transit' : ''} ${it.next || it.pointedBy ? 'ghost' : ''}" data-tier="${it.floor}" style="--i:${i}">
    <span class="b"><span class="id">${I(k.icon, 12)}${it.id} · ${dueWords(it).main}</span><span class="tt">${it.title}</span><span class="ln">${cocked ? `<span class="cockline">cocked: ${it.cock.note}</span>` : rel}</span></span><span class="h">${hold}</span></div>`;
}
function render() {
  const list = DATA.items.filter(mine);
  const cols = COLS.map(c => c.id === 'now' ? `<div class="now" aria-hidden="true"><span>now ${DATA.now.time}</span></div>` : (() => {
    const xs = list.filter(it => c.test(it.h)).sort((a, b) => a.h - b.h);
    return `<section class="col" aria-label="${c.w}"><div class="col-h"><p class="eyebrow">${c.w}</p><span class="c">${xs.length ? plural(xs.length, 'strip') : 'none'}</span></div>
      ${xs.length ? xs.map(cs).join('') : `<p class="empty">${c.id === 'over' ? 'Nothing is past its time.' : 'Nothing falls due ' + c.w.toLowerCase() + '.'}</p>`}</section>`;
  })()).join('');
  const held = list.filter(x => x.holder === me).length;
  $('#app').innerHTML = topHTML(['Home', 'What needs you'], [['C', 'cock M-207'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div class="head"><div><p class="eyebrow">Your bay, on the clock</p><h1 class="t">What needs you</h1></div>
        <p class="lede">Where a strip hangs is when it falls due. The now line stays put; the columns are fixed, so the board moves only when a day turns over or a strip comes or goes.</p></div>
      <div class="board">${cols}</div>
      <div class="foot"><span><b>${held}</b> held by you</span><span><b>1</b> offered on, yours until Lena Fischer takes it</span><span><b>2</b> on the way to you</span><span><b>1</b> pointed out to you, Mo Haddad’s</span><span style="margin-left:auto">Solid: yours · dashed: offered · faint: someone else’s</span></div>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.cock = false; render(); settle();
  /* the moment: you cock the overdue intent; it stands proud of its column with your note */
  later(() => { S.cock = true; render(); }, ms('--motion-run'));
}
onKeys({ r: replay, c: () => { S.cock = !S.cock; render(); } });
replay();
</script>
</body>
</html>
