<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Home V4 · Pigeonholes</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: a rack of pigeonholes, one per kind × time. empty holes are your spare capacity ---- */
:root{--x-proposed-hole-h: calc(var(--space-8) - var(--space-3))}
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-6)}
.left{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4)}
.rack{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-5)) repeat(4,minmax(0,1fr));grid-template-rows:auto repeat(4,minmax(var(--x-proposed-hole-h),1fr));gap:var(--space-2)}
.ch{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink);padding:0 var(--space-2) var(--space-1);border-bottom:1px solid var(--hairline-strong)}
.rh{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);color:var(--ink);padding-right:var(--space-2)}
.rh small{display:block;font-size:var(--type-small);color:var(--ink-muted)}
.hole{position:relative;min-height:var(--x-proposed-hole-h);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset);padding:var(--space-2);display:flex;flex-direction:column;gap:var(--space-1);box-shadow:inset 0 var(--space-2) var(--space-3) color-mix(in srgb,var(--shade) 25%,transparent)}
.hole:empty::after{content:"";position:absolute;inset:var(--space-2);border:1px dashed var(--x-proposed-slot);border-radius:2px}
/* a card in a hole: a slip that sticks up out of it */
.slip{display:grid;gap:2px;padding:var(--space-1) var(--space-2) var(--space-2);background:var(--x-proposed-strip);border:1px solid var(--hairline);border-top:var(--x-proposed-strip-edge) solid var(--fc);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--light);transition:transform var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.slip .id{white-space:nowrap;font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);color:var(--ink-muted);display:flex;justify-content:space-between;gap:var(--space-1)}
.slip.cocked{transform:translateY(calc(var(--space-3) * -1)) rotate(0deg);border-color:var(--x-proposed-lit);border-top-color:var(--fc)}
.slip.transit{border-style:dashed;border-top-style:solid;border-color:var(--x-proposed-transit)}
.slip.arrive{animation:arrive var(--motion-calm) var(--ease-out)}
@keyframes arrive{from{opacity:0;transform:translateY(calc(var(--space-5) * -1))}}
.cap{display:grid;gap:var(--space-3)}
.meter{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--space-1)}
.meter i{height:var(--space-5);border-radius:2px;border:1px dashed var(--x-proposed-slot)}
.meter i.on{border:1px solid var(--hairline-strong);background:var(--x-proposed-strip)}
.meter i.t{border:1px dashed var(--x-proposed-transit);background:color-mix(in srgb,var(--x-proposed-strip) 50%,transparent)}
.meter i.new{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.big{margin:0;font:200 var(--type-display)/var(--leading-display) var(--font-sans);color:var(--light)}
.side{display:flex;flex-direction:column;gap:var(--space-5);border-left:1px solid var(--hairline);padding-left:var(--space-5);min-height:0}
@media (max-width:1400px){:root{--x-proposed-hole-h: calc(var(--space-7) + var(--space-3))}.rack{grid-template-columns:var(--space-8) repeat(4,minmax(0,1fr))}.big{font-size:var(--type-title);line-height:var(--leading-title)}.slip{font-size:var(--x-proposed-type-micro);line-height:1.3}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Home · V4</b> pigeonholes: one hole per kind and time; empty holes are spare capacity, and your limit is yours to set · post-room racks, T-card slots</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { taken: false, cock: false };
const me = DATA.me, LIMIT = 6; /* the person sets this; the team's rule is in board data */
const ROWS = ['intent', 'fact', 'approval', 'share'];
const COLS = [{ w: 'Past its time', t: h => h < 0 }, { w: 'Today', t: h => h >= 0 && h < 13.3 }, { w: 'This week', t: h => h >= 13.3 && h < 109 }, { w: 'Later', t: h => h >= 109 }];
function items() {
  return DATA.items.filter(x => x.holder === me || (S.taken && x.id === 'M-212')).map(x => x.id === 'M-212' ? { ...x, holder: me, to: null, fresh: true } : x);
}
function slip(it) {
  return `<div class="slip dep ${it.cock && S.cock ? 'cocked' : ''} ${it.to ? 'transit' : ''} ${it.fresh ? 'arrive' : ''}" data-tier="${it.floor}"><span class="id"><span>${it.id}</span><span class="${it.h < 0 ? 'past' : ''}">${dueWords(it).main}</span></span>${it.title}${it.to ? `<span class="id"><span>offered to ${first(it.to)}</span></span>` : it.cock && S.cock ? `<span class="cockline">${it.cock.note}</span>` : ''}</div>`;
}
function render() {
  const xs = items(), n = xs.length, transit = xs.filter(x => x.to).length;
  const grid = `<span></span>${COLS.map(c => `<span class="ch">${c.w}</span>`).join('')}` + ROWS.map(r => `<span class="rh">${I(K(r).icon, 16)}<span>${K(r).word}<small>${K(r).app}</small></span></span>` +
    COLS.map(c => `<div class="hole">${xs.filter(x => x.kind === r && c.t(x.h)).map(slip).join('')}</div>`).join('')).join('');
  const cells = Array.from({ length: LIMIT }, (_, i) => i < n ? (xs[i].to ? 't' : xs[i].fresh ? 'on new' : 'on') : '').map(c => `<i class="${c}"></i>`).join('');
  $('#app').innerHTML = topHTML(['Home', 'What needs you'], [['T', 'take M-212'], ['C', 'cock'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap"><div class="left">
      <div><p class="eyebrow">Your pigeonholes</p><h1 class="t">What needs you</h1></div>
      <div class="rack scroll">${grid}</div></div>
      <aside class="side"><div class="cap"><p class="eyebrow">How much you hold</p>
        <p class="big">${n} <span class="muted" style="font-size:var(--type-heading)">of ${LIMIT}</span></p>
        <div class="meter" style="--n:${LIMIT}" role="img" aria-label="${n} of ${LIMIT} slots used">${cells}</div>
        <p class="note">You set your own limit. Dashed cells are room for more. ${transit ? `<b>${transit}</b> is offered on and still counts until it is taken.` : ''}</p></div>
        <div class="cap"><p class="eyebrow">Waiting to come in</p>
          ${S.taken ? `<p class="note"><b>Tom Reyes’s certificates</b> are yours now, in the Later hole. That uses your ${n === LIMIT ? 'last' : 'next'} slot.</p>` :
          `<p class="note"><b>Tom Reyes</b> offers <b>M-212 Renew 6 gas safety certificates</b>. Taking it uses your ${n + 1 === LIMIT ? 'last' : 'next'} slot.</p>
          <button class="btn" data-take>${I('hand-helping', 14)} Read it back and take it <span class="kbd">T</span></button>`}
          <p class="note">When every slot is full, people can still offer you things; the offer waits beside the rack and tells them you are full, so they can ask someone else. Nothing is refused for you.</p></div>
      </aside></div></main>`;
  Icons.hydrate($('#app'));
  $('[data-take]') && ($('[data-take]').onclick = take);
}
function take() { if (S.taken) return; S.taken = true; render(); }
function replay() {
  clearLater(); S.taken = false; S.cock = false; render(); settle();
  /* the moment: you take Tom's certificates; the slip drops into its hole and fills your sixth slot */
  later(take, ms('--motion-run'));
}
onKeys({ r: replay, t: take, c: () => { S.cock = !S.cock; render(); } });
replay();
</script>
</body>
</html>
