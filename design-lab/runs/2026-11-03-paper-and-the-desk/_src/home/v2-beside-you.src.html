<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Home V2 · Beside you</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: your bay, with your neighbours' bays sharp beside it (no blur): peripheral awareness ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--space-8) minmax(0,.8fr);gap:var(--space-4)}
.mine{min-height:0;display:grid;align-content:start;gap:var(--space-3);padding-right:var(--x-proposed-cock)}
.gap{position:relative;border-left:1px dashed var(--hairline-strong);border-right:1px dashed var(--hairline-strong);display:flex;flex-direction:column;align-items:center;padding-top:var(--space-6);gap:var(--space-2)}
.gap .eyebrow{writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:var(--tracking-label)}
.side{min-height:0;display:grid;align-content:start;gap:var(--space-4)}
.nb{display:grid;gap:var(--space-1)}
.nb-h{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.nb-h b{font-weight:400;color:var(--ink)}
.nb-h .st{margin-left:auto;font:400 var(--x-proposed-type-micro)/1 var(--font-mono)}
.nb-h .st.off{color:var(--x-proposed-past)}
.line{display:grid;grid-template-columns:var(--x-proposed-strip-edge) auto minmax(0,1fr) auto;align-items:center;gap:var(--space-2);height:calc(var(--target-sm) - var(--space-1));background:var(--x-proposed-strip);border:1px solid var(--hairline);border-radius:var(--radius-key);padding-right:var(--space-2);font-size:var(--type-small);color:var(--ink);transition:transform var(--motion-calm) var(--ease-out)}
.line::before{content:"";align-self:stretch;background:var(--fc);border-radius:var(--radius-key) 0 0 var(--radius-key)}
.line .id{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);display:flex;gap:var(--space-1);align-items:center}
.line .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .d{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.line.cocked{transform:translateX(var(--space-3))}
.line.transit{border-style:dashed;border-color:var(--x-proposed-transit)}
.travel{position:absolute;left:50%;width:calc(var(--space-8) - var(--space-3));transform:translateX(-50%);top:var(--y,40%);transition:top var(--motion-calm) var(--ease-out),opacity var(--motion-base) var(--ease-standard)}
.travel .card{border:1px dashed var(--x-proposed-transit);border-radius:var(--radius-key);background:var(--x-proposed-strip);padding:var(--space-2);display:grid;gap:var(--space-1);justify-items:center;font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink);text-align:center}
.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);margin-top:var(--space-2)}
.legend span{display:inline-flex;gap:var(--space-2);align-items:center}
.sw{display:inline-block;width:var(--space-5);height:var(--space-3);border:1px solid var(--hairline);background:var(--x-proposed-strip);border-radius:2px}
.sw.t{border-style:dashed;border-color:var(--x-proposed-transit)}
.sw.c{transform:translateX(var(--space-1))}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,1fr) calc(var(--space-7) + var(--space-2)) minmax(0,.75fr)}.mine .strip .ln{display:none}.mine .strip{min-height:var(--target-sm)}.travel{width:calc(var(--space-7) - var(--space-1))}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Home · V2</b> beside you: your bay, and your team's bays sharp beside it, so a handover is seen coming · MacKay 1999, Wears and Perry 2007</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* what each neighbour holds, from the team board's jobs (one line each) */
const S = { offered: false, arrived: false, taken: false };
const me = DATA.me;
const nbs = DATA.team.filter(id => id !== me && id !== 'nkechi').slice(0, 5);
function lineHTML(j, i) {
  const jk = DATA.board.jobKinds[j.kind];
  return `<div class="line dep" data-tier="team" style="--i:${i}"><span class="id">${I(jk.icon, 12)}${j.home}</span><span class="tt">${j.t}</span><span class="d ${j.h < 8 ? 'past' : ''}">${j.due}</span></div>`;
}
function nbHTML(id, i) {
  const p = P(id), jobs = DATA.board.jobs.filter(j => j.holder === id);
  const st = p.in === 'off' ? `<span class="st off">${p.away}</span>` : p.in === 'out' ? `<span class="st">${p.where}</span>` : p.away ? `<span class="st">in · ${p.away}</span>` : `<span class="st">in</span>`;
  let lines = jobs.map(lineHTML).join('');
  if (id === 'tom' && !S.taken) lines = `<div class="line dep ${S.offered ? 'transit' : ''}" data-tier="department" style="--i:0"><span class="id">${I('target', 12)}M-212</span><span class="tt">Renew 6 gas safety certificates</span><span class="d">${S.offered ? '→ AO' : '13 Nov'}</span></div>` + lines;
  if (p.in === 'off' && jobs.length) lines += `<p class="note">${I('info', 12)} ${first(id)} holds ${plural(jobs.length, 'job')} while off. One is due today: <b>${jobs.find(j => j.h < 8)?.t || ''}</b>. Nkechi Bello can reassign.</p>`;
  return `<div class="nb"><div class="nb-h">${ini(id, 'sm')}<b>${p.name}</b>${st}</div>${lines || `<p class="note">holds nothing</p>`}</div>`;
}
function render() {
  const held = DATA.items.filter(x => x.holder === me).sort((a, b) => a.h - b.h);
  const off = DATA.items.find(x => x.id === 'M-212');
  $('#app').innerHTML = topHTML(['Home', 'What needs you'], [['T', 'take the offered strip'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <section class="mine scroll"><div><p class="eyebrow">Your bay</p><h1 class="t">You hold ${held.length}</h1></div>
        ${held.map((it, i) => stripHTML(it, { i })).join('')}
        ${S.taken ? `<div class="bay-h" style="margin-top:var(--space-2)"><p class="eyebrow">Taken from Tom Reyes</p><span class="x">read back at ${DATA.now.time}</span></div>${stripHTML({ ...off, holder: me, to: null, state: 'yours, taken from Tom Reyes' }, { i: 0 })}` : S.arrived ? `<div class="bay-h" style="margin-top:var(--space-2)"><p class="eyebrow">Offered to you</p><span class="x">yours when you read it back · T</span></div>${stripHTML(off, { i: 0 })}` : ''}
        <div class="legend"><span><i class="sw"></i>held</span><span><i class="sw c"></i>cocked by its holder</span><span><i class="sw t"></i>offered, not yet taken: both names on it</span></div>
      </section>
      <div class="gap" aria-hidden="true"><p class="eyebrow">changeover</p>
        <div class="travel" id="travel" style="--y:${S.arrived ? '62%' : '18%'};opacity:${S.offered && !S.taken ? 1 : 0}"><div class="card">${I('target', 14)}M-212<span>${ini('tom', 'sm')} ${I('arrow-down', 12)} ${ini(me, 'sm')}</span><span>09:55</span></div></div>
      </div>
      <section class="side scroll" aria-label="Beside you"><div><p class="eyebrow">Beside you · Repairs North</p><p class="note" style="margin-top:var(--space-1)">The same sharpness as your own bay. You can read their strips; only they can move them.</p></div>
        ${nbs.map(nbHTML).join('')}</section>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.offered = false; S.arrived = false; S.taken = false; render(); settle();
  /* the moment: Tom offers you a strip. It leaves his bay, crosses the changeover lane and waits in yours, dashed, with both names */
  later(() => { S.offered = true; render(); requestAnimationFrame(() => requestAnimationFrame(() => { const t = $('#travel'); t.style.setProperty('--y', '62%'); })); }, ms('--motion-run'));
  later(() => { S.arrived = true; render(); }, ms('--motion-run') + ms('--motion-calm'));
}
onKeys({ r: replay, t: () => { if (S.arrived) { S.taken = true; render(); } } });
replay();
</script>
</body>
</html>
