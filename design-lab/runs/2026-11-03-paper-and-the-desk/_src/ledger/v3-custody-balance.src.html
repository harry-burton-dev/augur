<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Corrections V3 · The custody balance</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: every handover is written twice, given and taken. the balance must come out: nothing held by nobody, nothing held twice ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--space-6)}
.col{display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4);min-height:0}
.ledger td.g,.ledger td.t{width:22%}
.ledger td.t.open{color:var(--ink-muted)}
.side{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.tb{width:100%;border-collapse:collapse;font-size:var(--type-meta)}
.tb td,.tb th{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);text-align:right;font-family:var(--font-mono)}
.tb th{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);border-bottom-color:var(--hairline-strong)}
.tb td:first-child,.tb th:first-child{text-align:left;font-family:var(--font-sans)}
.tb tfoot td{border-top:1px solid var(--hairline-strong);border-bottom:3px double var(--hairline-strong);color:var(--light)}
.check{display:grid;gap:var(--space-2)}
.ck{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2);align-items:center;font-size:var(--type-meta);color:var(--ink)}
.ck .v{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light)}
.ck.ok svg{color:var(--x-proposed-lit)}
.ck.open svg{color:var(--x-proposed-disagree)}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;font-size:var(--type-small);color:var(--ink);padding:var(--space-2) var(--space-3);border:1px dashed var(--x-proposed-transit);border-radius:var(--radius-key)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--space-4)}.ledger td{font-size:var(--type-small)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Corrections · V3</b> the custody balance: every handover written twice, given and taken; the balance proves nothing is held by nobody · double entry, the trial balance</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { taken: false };
const TAKE = { item: 'M-212', at: 'Tue 10:41' };
const rows = () => DATA.custody.map(c => c.item.startsWith(TAKE.item) && S.taken ? { ...c, taken: TAKE.at, now: true } : c);
function render() {
  const rs = rows(), open = rs.filter(c => !c.taken);
  const people = [...new Set(rs.flatMap(c => [c.from, c.to]))];
  const tb = people.map(id => ({ id, g: rs.filter(c => c.from === id).length, t: rs.filter(c => c.to === id && c.taken).length, o: rs.filter(c => c.to === id && !c.taken).length }));
  const G = rs.length, T = rs.filter(c => c.taken).length;
  $('#app').innerHTML = topHTML(['Team', F('team').name, 'Custody'], [['T', 'Amara takes M-212'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <section class="col"><div><p class="eyebrow">${F('team').name} · this week · every handover, both halves</p><h1 class="t" style="margin-top:var(--space-1)">Given and taken</h1></div>
        <div class="scroll"><table class="ledger"><thead><tr><th>Offered</th><th>What</th><th>Given by</th><th>Taken by</th></tr></thead>
          <tbody>${rs.map((c, i) => `<tr class="dep ${c.now ? 'new write' : ''}" style="--i:${i}"><td class="d">${c.at}</td><td>${c.item}</td><td class="g">${initialHTML(c.from, first(c.from))}</td>
            <td class="t ${c.taken ? '' : 'open'}">${c.taken ? initialHTML(c.to, first(c.to) + ' · ' + c.taken) : `<span class="initial">${ini(c.to, 'sm')}not yet taken</span>`}</td></tr>`).join('')}</tbody></table></div></section>
      <aside class="side"><div><p class="eyebrow">The balance</p><h2 class="h" style="margin-top:var(--space-1)">${open.length ? `${G} given, ${T} taken, ${open.length} in the zone` : 'Every handover is taken'}</h2></div>
        <table class="tb"><thead><tr><th>Person</th><th>Gave</th><th>Took</th><th>Offered to them</th></tr></thead>
          <tbody>${tb.map(r => `<tr><td>${pchip(r.id, { sm: true })}</td><td>${r.g}</td><td>${r.t}</td><td>${r.o || '·'}</td></tr>`).join('')}</tbody>
          <tfoot><tr><td>Total</td><td>${G}</td><td>${T}</td><td>${open.length}</td></tr></tfoot></table>
        <div class="check">
          <div class="ck ok">${I('circle-check', 16)}<span>Given = taken + offered</span><span class="v">${G} = ${T} + ${open.length}</span></div>
          <div class="ck ok">${I('circle-check', 16)}<span>Held by nobody</span><span class="v">0</span></div>
          <div class="ck ok">${I('circle-check', 16)}<span>Held by two people</span><span class="v">0</span></div>
          <div class="ck ${open.length ? 'open' : 'ok'}">${I(open.length ? 'hourglass' : 'circle-check', 16)}<span>Still in the changeover zone</span><span class="v">${open.length}</span></div></div>
        ${open.map(c => `<div class="tr">${I('hand-helping', 14)}<span>${c.item} · offered by ${first(c.from)} at ${c.at.split(' ').pop()}; still ${first(c.from)}’s until ${first(c.to)} takes it</span>${ini(c.to, 'sm')}</div>`).join('')}
        <p class="note">The first two checks can only fail through a bug, and if they do the board says so in words. That is the point of writing everything twice: the books prove themselves.</p></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function take() { if (!S.taken) { S.taken = true; render(); } }
function replay() {
  clearLater(); S.taken = false; render(); settle();
  /* the moment: Amara reads back M-212; its "taken" half is written and the balance closes by one */
  later(take, ms('--motion-run'));
}
onKeys({ r: replay, t: take });
replay();
</script>
</body>
</html>
