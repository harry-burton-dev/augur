<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Corrections V6 · The card drawer</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: one claim per card, numbered by where it branches. a correction is a new card filed behind the one it corrects ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.drawer{position:relative;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);padding:var(--space-6) var(--space-5) var(--space-5);overflow:hidden}
.cards{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:var(--space-4);align-items:start;z-index:1}
.zk{position:relative;display:grid;gap:var(--space-2);padding:var(--space-4) var(--space-3) var(--space-3);background:var(--x-proposed-strip);border:1px solid var(--hairline);border-radius:var(--radius-key);min-height:calc(var(--space-8) * 1.9);transition:transform var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.zk .tab{position:absolute;top:calc(var(--space-5) * -1 + 1px);left:var(--space-3);height:var(--space-5);padding:0 var(--space-3);display:flex;align-items:center;background:var(--x-proposed-strip);border:1px solid var(--hairline);border-bottom:0;border-radius:var(--radius-key) var(--radius-key) 0 0;font:400 var(--type-small)/1 var(--font-mono);color:var(--light)}
.zk .tab.br{left:auto;right:var(--space-3)}
.zk .kw{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.zk .tx{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.zk .tx b{font-weight:500;color:var(--light)}
.zk .lk{display:grid;gap:var(--space-1);border-top:1px solid var(--hairline);padding-top:var(--space-2);margin-top:auto}
.zk .lk span{display:flex;gap:var(--space-1);align-items:center;font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted)}
.zk .by{display:flex;gap:var(--space-2);align-items:center;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.zk.index{background:color-mix(in srgb,var(--x-proposed-strip) 70%,transparent);border-style:dashed}
.zk.new{border-color:var(--x-proposed-lit)}
.zk.new .tab{border-color:var(--x-proposed-lit);color:var(--x-proposed-lit)}
.zk.filing{transform:translateY(calc(var(--space-7) * -1));opacity:0}
svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
svg.links path{fill:none;stroke:var(--hairline-strong);stroke-width:1.25}
svg.links path.hot{stroke:var(--x-proposed-lit)}
svg.links text{font:400 10px var(--font-mono);fill:var(--ink-muted)}
.foot{display:flex;gap:var(--space-4);align-items:flex-start;border-top:1px solid var(--hairline);padding-top:var(--space-3)}
@media (max-width:1400px){.cards{gap:var(--space-2)}.zk{padding:var(--space-4) var(--space-2) var(--space-2)}.zk .tx{font-size:var(--x-proposed-type-micro);line-height:1.4}.foot .note{font-size:var(--x-proposed-type-micro)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Corrections · V6</b> the card drawer: one claim per card, numbered by branch; a correction files behind what it corrects · Luhmann's Zettelkasten</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { filed: false };
const E = n => FT.entries.find(e => e.n === n);
/* the drawer: entries as cards, numbered Luhmann-style by what they continue or branch from */
const CARDS = [
  { no: FT.id, kind: 'index', kw: 'Index card', tx: `<b>${FT.subject}</b> · ${FT.field}. Start at 1; the newest card that isn’t corrected is the value.`, lk: [] },
  { no: '1', e: 1, kw: 'Claim', tx: () => `Set to <b>${E(1).v}</b>. ${E(1).note}.`, lk: [['file-text', 'cited by 2 documents']] },
  { no: '1a', e: 3, kw: 'Disputes 1', tx: () => `The ${E(3).src} says <b>${E(3).v}</b>.`, lk: [['git-branch', 'branches from 1']] },
  { no: '1a1', e: 5, kw: 'Evidence for 1a', tx: () => E(5).note + '.', lk: [['camera', 'photo attached']] },
  { no: '1b', e: 6, kw: 'Corrects 1', tx: () => `<b>${E(6).v}</b>, not <span class="struck">${E(6).was}</span>. ${E(6).note}`, lk: [['corner-down-right', 'rests on 1a1'], ['stamp', 'countersigned ' + P(E(6).counter).ini]], fresh: true }
];
function card(c, i) {
  const e = c.e ? E(c.e) : null, by = e ? (e.by === 'import' ? `<span>import · ${e.at}</span>` : `${ini(e.by, 'sm')}<span>${e.at}</span>`) : '';
  return `<article class="zk dep ${c.kind || ''} ${c.fresh ? 'new' : ''} ${c.fresh && !S.filed ? 'filing' : ''}" data-no="${c.no}" style="--i:${i}"><span class="tab ${c.no.length > 2 && c.no !== FT.id ? 'br' : ''}">${c.no}</span>
    <span class="kw">${c.kw}</span><p class="tx" style="margin:0">${typeof c.tx === 'function' ? c.tx() : c.tx}</p>${by ? `<span class="by">${by}</span>` : ''}
    ${c.lk.length ? `<span class="lk">${c.lk.map(([ic, w]) => `<span>${I(ic, 12)}${w}</span>`).join('')}</span>` : ''}</article>`;
}
function links() {
  const box = $('.drawer').getBoundingClientRect(), at = no => $(`.zk[data-no="${no}"]`).getBoundingClientRect();
  const L = [['1', '1a', 'disputes'], ['1a', '1a1', 'evidence'], ...(S.filed ? [['1a1', '1b', 'rests on', 1], ['1', '1b', 'corrected by', 1]] : [])];
  $('svg.links').innerHTML = L.map(([a, b, w, hot], i) => {
    const A = at(a), Bb = at(b), y = Math.max(A.bottom, Bb.bottom) - box.top + 18 + i * 22, x1 = A.left - box.left + A.width / 2, x2 = Bb.left - box.left + Bb.width / 2;
    return `<path class="${hot ? 'hot' : ''}" d="M${x1},${A.bottom - box.top} V${y} H${x2} V${Bb.bottom - box.top}"/><text x="${Math.min(x1, x2) + 8}" y="${y - 5}">${w}</text>`;
  }).join('');
}
function render() {
  $('#app').innerHTML = topHTML(['Data Atlas', FT.subject, FT.field, 'Cards'], [['F', 'file the correction'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div><p class="eyebrow">${FT.id} · one claim per card</p><h1 class="t" style="margin-top:var(--space-1)">The card drawer</h1></div>
      <div class="drawer"><svg class="links" aria-hidden="true"></svg><div class="cards" style="--n:${CARDS.length}">${CARDS.map(card).join('')}</div></div>
      <div class="foot">${I('info', 16)}<p class="note">A card is never rewritten. A new claim about the same thing branches from the card it answers (1 → 1a), evidence files behind the claim it supports (1a → 1a1), and a correction is a new card filed behind the one it corrects (1 → 1b). The number says where a card belongs without a date or a search. The value is the newest card that no later card corrects: here, ${S.filed ? '1b, ' + E(6).v : '1, ' + E(1).v + ' (disputed by 1a)'}.</p></div>
    </div></main>`;
  Icons.hydrate($('#app'));
  requestAnimationFrame(links);
}
function file() { if (S.filed) return; S.filed = true; $('.zk[data-no="1b"]').classList.remove('filing'); $('.foot .note').innerHTML = $('.foot .note').innerHTML.replace(/here, .*$/, `here, 1b, ${E(6).v}.`); later(links, ms('--motion-calm')); }
function replay() {
  clearLater(); S.filed = false; render(); settle();
  /* the moment: card 1b drops into the drawer behind 1a1; its two links draw: rests on 1a1, corrects 1 */
  later(file, ms('--motion-run'));
}
addEventListener('resize', links);
onKeys({ r: replay, f: file });
replay();
</script>
</body>
</html>
