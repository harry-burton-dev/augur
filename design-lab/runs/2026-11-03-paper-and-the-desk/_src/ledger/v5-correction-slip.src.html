<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Corrections V5 · The correction slip</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: you can't edit a value. you fill a correction slip: from, to, why, evidence, who countersigns, who is told ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-6)}
.slip{display:grid;gap:var(--space-3);align-content:start;padding:var(--space-5);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--x-proposed-strip);box-shadow:var(--shadow-raised)}
.slip .row{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-3)) minmax(0,1fr);gap:var(--space-3);align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:var(--space-2)}
.slip .k{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.slip .vv{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.slip .vv.mono{font-family:var(--font-mono)}
.fill{border-bottom:1px dotted var(--x-proposed-pencil);min-height:var(--leading-meta);display:block}
.req{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-disagree);margin-left:var(--space-2)}
.right{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.ledger td{font-size:var(--type-small);line-height:var(--leading-small)}
.who{display:grid;gap:var(--space-2)}
.who .w{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;font-size:var(--type-small);color:var(--ink)}
.cant{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);color:var(--ink-muted);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset)}
@media (max-width:1400px){.slip{padding:var(--space-4);gap:var(--space-2)}.right .ledger tr:nth-child(-n+2){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Corrections · V5</b> the correction slip: no edit button; from, to, why, evidence, countersign, and the ledger line it will write · journal vouchers</div>
<script>
/*@DATA@*/
/*@LIB@*/
const c = FT.entries.find(e => e.act === 'correct'), ev = FT.entries.find(e => e.act === 'note');
const S = { k: 0 }; /* fields filled so far */
const F5 = [['From', () => `<span class="struck mono">${c.was}</span> <span class="note">as entered ${FT.entries[0].at}</span>`, false],
  ['To', () => `<span class="mono">${c.v}</span>`, true],
  ['Why', () => c.note, true],
  ['Evidence', () => `Entry ${ev.n}: ${ev.note.charAt(0).toLowerCase() + ev.note.slice(1)}, added by ${P(ev.by).name}`, true],
  ['Countersign', () => `${pchip(c.counter)} <span class="note">${P(c.counter).role}, keeps the facts register</span>`, false]];
function render() {
  const done = S.k >= F5.length;
  $('#app').innerHTML = topHTML(['Data Atlas', FT.subject, FT.field, 'Correct'], [['N', 'fill the next line'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <section style="display:flex;flex-direction:column;gap:var(--space-4)"><div><p class="eyebrow">${FT.id} · ${FT.subject}</p><h1 class="t" style="margin-top:var(--space-1)">Correction slip</h1></div>
        <p class="cant">${I('lock', 14)}<span>There is no edit button on a fact. To change a value you fill this slip; the old value stays in the account.</span></p>
        <div class="slip">${F5.map(([k, v, req], i) => `<div class="row"><span class="k">${k}${req && i >= S.k ? '<span class="req">needed</span>' : ''}</span><span class="vv">${i < S.k ? v() : '<span class="fill"></span>'}</span></div>`).join('')}
          <div style="display:flex;gap:var(--space-3);align-items:center"><button class="btn ${done ? 'go' : ''}" ${done ? '' : 'aria-disabled="true"'}>${I('pen-line', 14)} Post the correction</button>
          <span class="note">${done ? `Posts as entry ${c.n}, signed ${ME().name}, countersigned ${P(c.counter).name}.` : 'Why and evidence are needed: a correction without them is just an edit.'}</span></div></div></section>
      <section class="right"><div><p class="eyebrow">How the account will read</p><h2 class="h" style="margin-top:var(--space-1)">One new line; the old ones stay</h2></div>
        <table class="ledger"><tbody>${FT.entries.filter(e => e.act !== 'correct').slice(-3).map(e => `<tr><td class="n">${e.n}</td><td class="d">${e.at}</td><td>${entryWords(e)}</td></tr>`).join('')}
          ${S.k >= 2 ? `<tr class="new"><td class="n">${c.n}</td><td class="d">on posting</td><td>Corrected from <span class="struck">${c.was}</span> to <b>${c.v}</b>. ${S.k >= 3 ? c.note : '<span class="fill"></span>'}</td></tr>` : ''}</tbody></table>
        <div class="who"><p class="eyebrow">Who is told, and where</p>${FT.citedBy.map(d => `<div class="w">${I('file-text', 14)}<span>${d.t} · ${P(d.owner).name}</span><span class="note">a line on the document</span></div>`).join('')}
          <div class="w">${ini(c.counter, 'sm')}<span>${P(c.counter).name} countersigns before it posts</span><span class="note">on her desk, offered</span></div>
          <div class="w">${ini('rui', 'sm')}<span>${P('rui').name}, whose photo is the evidence</span><span class="note">pointed out</span></div></div>
      </section></div></main>`;
  Icons.hydrate($('#app'));
}
function next() { if (S.k < F5.length) { S.k++; render(); } }
function replay() {
  clearLater(); S.k = 1; render(); settle();
  /* the moment: the slip fills line by line; the ledger preview writes its new line as you go */
  for (let i = 0; i < F5.length - 1; i++) later(next, ms('--motion-run') + i * ms('--motion-base'));
}
onKeys({ r: replay, n: next });
replay();
</script>
</body>
</html>
