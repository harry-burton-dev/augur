<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Grammar V2 · Nine verbs</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: the desk's nine words: what each is on paper, by mouse, by key, its token recipe, and what it must never mean ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:var(--space-3);min-height:0}
.vb{display:grid;grid-template-columns:calc(var(--space-8) - var(--space-2)) minmax(0,1fr);gap:var(--space-2) var(--space-4);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);min-height:0;overflow:hidden;transition:border-color var(--motion-base) var(--ease-standard)}
.vb.hot{border-color:var(--x-proposed-lit)}
.vb .pic{grid-row:span 3;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--hairline);padding-right:var(--space-3)}
.vb h2{margin:0;font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);display:flex;align-items:baseline;gap:var(--space-2)}
.vb h2 .kbd{margin-left:auto}
.vb dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.vb dt{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}
.vb dd{margin:0;color:var(--ink)}
.vb dd.nv{color:var(--x-proposed-disagree)}
.vb dd.tk{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
/* tiny specimens, all from the same parts the screens use */
.mini{width:100%;display:grid;gap:3px}
.mini i{display:block;height:var(--space-3);border-radius:2px;background:var(--x-proposed-strip);border:1px solid var(--hairline);border-left:var(--x-proposed-strip-edge) solid var(--floor-team-high);transition:transform var(--motion-calm) var(--ease-out)}
.mini i.ck{transform:translateX(var(--space-3))}
.mini i.tr{border-style:dashed;border-left-style:solid;border-color:var(--x-proposed-transit);border-left-color:var(--floor-team-high)}
.mini i.sl{background:none;border:1px dashed var(--x-proposed-slot)}
.mini.board{grid-template-columns:repeat(3,1fr)}
.pic{overflow:hidden}.pic .stamp{min-width:0;max-width:100%;padding:var(--space-1);font-size:calc(var(--x-proposed-type-micro) * .85)}.pic .stamp .w{font-size:var(--x-proposed-type-micro);letter-spacing:var(--tracking-soft)}
.pic .ini{width:var(--space-6);height:var(--space-6);font-size:var(--type-small)}
.pic .str{font:400 var(--type-lead)/1 var(--font-mono);color:var(--ink-muted)}
@media (max-width:1400px){.vb{grid-template-columns:var(--space-7) minmax(0,1fr);padding:var(--space-2) var(--space-3)}.vb dt.x,.vb dd.x{display:none}.vb h2{font-size:var(--type-body);line-height:var(--leading-body)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V2</b> nine verbs: strip, bay, cock, hand over, stamp, initial, strike, slot, board; paper gesture, mouse, key, token and what each must never mean</div>
<script>
/*@DATA@*/
/*@LIB@*/
const me = DATA.me;
const V = [
  ['Strip', '', '<div class="mini"><i></i></div>', 'one paper strip per flight', 'one row per thing someone holds', '—', 'a notification, a task copy, or a link', 'strip-edge, strip'],
  ['Bay', '', '<div class="mini"><i></i><i></i><i></i></div>', 'the rack a controller’s strips sit in', 'a person’s Home, in time order', '↑ ↓ J K', 'a feed that reorders itself while you read', 'bay-h hairline'],
  ['Cock', 'C', '<div class="mini"><i></i><i class="ck" data-ck></i><i></i></div>', 'set a strip askew to come back to it', 'right-click › Cock, with a note', 'C', 'priority, urgency, or a signal to others', 'cock = space-5, no loop'],
  ['Hand over', 'H', '<div class="mini"><i></i><i class="tr"></i></div>', 'pass the strip to the next sector', 'drag to a person, or H', 'H, then Enter', 'that it has moved before it is taken', 'transit dashed'],
  ['Stamp', 'S', () => stampHTML('helen', 'Publish', 'Wed 4 Nov'), 'the office stamp: a decision with authority', 'hold S, or press and hold', 'hold S', 'agreement with parts nobody checked', 'stamp-weight, floor colour'],
  ['Initial', 'I', () => ini(me), 'initials in the margin: I checked this', 'click the margin box', 'I', 'approval of the whole', 'ini ring, floor colour'],
  ['Strike', '', '<span class="str"><span class="struck">2014</span> 2017</span>', 'one line through, still legible', 'Correct… opens a slip', '—', 'deletion, or a quiet edit', 'strike 1px, ink-muted'],
  ['Slot', '', '<div class="mini"><i></i><i class="sl"></i><i class="sl"></i></div>', 'a T-card slot, filled or empty', 'a place on a board', '—', 'a target to fill, or a score', 'slot dashed'],
  ['Board', '', '<div class="mini board"><i></i><i class="sl"></i><i></i><i></i><i></i><i class="sl"></i></div>', 'the one shared wall of a team', 'a Team floor’s board', '—', 'a dashboard of anyone’s performance', 'tcard, slot']
];
const S = { hot: -1 };
function render() {
  $('#app').innerHTML = topHTML(['Design lab', 'Desk language'], [['C', 'cock'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div style="display:flex;align-items:flex-end;gap:var(--space-5)"><div><p class="eyebrow">Desk language · nine verbs</p><h1 class="t" style="margin-top:var(--space-1)">What you can do to a thing</h1></div>
        <p class="lede" style="margin-left:auto;max-width:56ch;text-align:right">Each is a gesture with a person’s name on it. None of them moves, glows or sounds on its own: the light language stays for urgency.</p></div>
      <div class="grid">${V.map(([w, k, pic, paper, mouse, key, never, tok], i) => `<section class="vb dep ${S.hot === i ? 'hot' : ''}" style="--i:${i}"><div class="pic">${typeof pic === 'function' ? pic() : pic}</div>
        <h2>${w}${k ? `<span class="kbd">${k}</span>` : ''}</h2>
        <dl><dt>paper</dt><dd>${paper}</dd><dt>here</dt><dd>${mouse}</dd><dt class="x">key</dt><dd class="x">${key}</dd><dt class="x">token</dt><dd class="tk x">${tok}</dd></dl>
        <dl><dt>never</dt><dd class="nv">${never}</dd></dl></section>`).join('')}</div>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.hot = -1; render(); settle();
  /* the moment: the cock card lights and its specimen steps out of line */
  later(() => { S.hot = 2; $$('.vb')[2].classList.add('hot'); }, ms('--motion-run') - ms('--motion-base'));
  later(() => $('[data-ck]').style.transform = 'translateX(calc(var(--space-3) * 2))', ms('--motion-run'));
}
onKeys({ r: replay, c: () => $('[data-ck]').classList.toggle('ck') });
replay();
</script>
</body>
</html>
