<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Grammar V5 · Ink and light</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: where the desk meets the light language and focal planes. ink says who and what state; light says how urgent ---- */
:root{
  /* focal-plane values as the cinematic run proposed them, used here only to show the comparison */
  --x-proposed-far-blur: 3px;
  --x-proposed-far-sat: .55;
}
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-4)}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5)}
.pane{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);align-content:start}
.pane h2{margin:0;font-weight:300;font-size:var(--type-lead);color:var(--light);display:flex;gap:var(--space-3);align-items:baseline}
.pane h2 small{font-size:var(--type-small);color:var(--ink-muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.lane{display:grid;gap:var(--space-1);align-content:start;transition:filter var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.lane .lh{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
.ln{display:grid;grid-template-columns:var(--x-proposed-strip-edge) minmax(0,1fr) auto;gap:var(--space-2);align-items:center;height:var(--space-6);background:var(--x-proposed-strip);border:1px solid var(--hairline);border-radius:var(--radius-key);padding-right:var(--space-2);font-size:var(--type-small);color:var(--ink)}
.ln::before{content:"";align-self:stretch;background:var(--fc)}
.ln.tr{border-style:dashed;border-color:var(--x-proposed-transit)}
.ln .d{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.racked .far{filter:blur(var(--x-proposed-far-blur)) saturate(var(--x-proposed-far-sat));opacity:.7}
.lost{font-size:var(--type-small);line-height:var(--leading-small);color:var(--x-proposed-disagree);display:flex;gap:var(--space-2);align-items:flex-start;transition:opacity var(--motion-base) var(--ease-out)}
.map{width:100%;border-collapse:collapse;font-size:var(--type-small);line-height:var(--leading-small)}
.map th{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:0 var(--space-3) var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.map td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);vertical-align:top;color:var(--ink)}
.map td:first-child{color:var(--light);white-space:nowrap}
.map .v{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);white-space:nowrap}
.v.ok{color:var(--x-proposed-lit)}.v.cl{color:var(--x-proposed-disagree)}
@media (prefers-reduced-motion: reduce){.lane{transition:opacity var(--motion-quick) linear}}
@media (max-width:1400px){.map td:nth-child(3),.map th:nth-child(3){display:none}.pane{padding:var(--space-2) var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V5</b> ink and light: ink says who holds it and in what state; light says how urgent; depth is for one person's focus, never for a shared board · argues with focal planes</div>
<script>
/*@DATA@*/
/*@LIB@*/
const me = DATA.me, nb = 'tom';
const S = { rack: false };
const mine = DATA.items.filter(x => x.holder === me && !x.to).slice(0, 3);
const his = [ITEM('M-212'), ...jobsOf(nb).map(j => ({ id: j.home, title: j.t, floor: 'team', due: j.due }))];
function lane(id, list, far) {
  return `<div class="lane ${far ? 'far' : ''}"><span class="lh">${ini(id, 'sm')}${P(id).name}</span>${list.map(x => `<div class="ln ${x.to ? 'tr' : ''}" data-tier="${x.floor}"><span>${x.title}</span><span class="d">${x.to ? '→ ' + P(x.to).ini : x.due}</span></div>`).join('')}</div>`;
}
const ROWS = [
  ['Who holds it', 'initials on the strip; a name on the back', 'ink only: never a light, never a depth', 'ok', 'agrees'],
  ['Its state', 'where it sits: bay, offset, dashed, faint', 'position and outline; the light language stays out', 'ok', 'agrees'],
  ['How urgent', 'a warm time, past due', 'light: the beacon and the Letterbox, unchanged', 'ok', 'agrees'],
  ['At rest', 'nothing moves; a cock is a still offset', 'dark when normal', 'ok', 'agrees'],
  ['Your focus', 'the strip you are working on', 'the near plane may lift it; the bay stays sharp', 'ok', 'agrees, narrowly'],
  ['Other people’s work', 'beside yours, readable at a glance', 'focal planes would blur it: a handover to you can sit in the blur', 'cl', 'clashes'],
  ['A handover', 'two names, a dashed outline, a zone in time', 'a streak of light may draw the move once; it never carries the meaning', 'cl', 'light only as a cue']
];
function render() {
  $('#app').innerHTML = topHTML(['Design lab', 'Desk language'], [['F', 'rack focus on and off'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div style="display:flex;align-items:flex-end;gap:var(--space-5)"><div><p class="eyebrow">Desk language · against the light language and focal planes</p><h1 class="t" style="margin-top:var(--space-1)">Ink and light</h1></div>
        <p class="lede" style="margin-left:auto;max-width:58ch;text-align:right">Controllers sharing a suite read each other’s strips out of the corner of an eye, and that is how a handover is seen coming. Blur takes that away.</p></div>
      <div class="demo">
        <section class="pane ${S.rack ? 'racked' : ''}"><h2>Focal planes <small>your bay near, Tom’s far</small></h2><div class="two">${lane(me, mine, false)}${lane(nb, his, true)}</div>
          <p class="lost" style="opacity:${S.rack ? 1 : 0}">${I('eye-off', 14)}<span>${his.length} strips beside you can no longer be read, including <b>M-212</b>, which Tom has offered to you.</span></p></section>
        <section class="pane"><h2>The desk <small>both bays on one plane</small></h2><div class="two">${lane(me, mine, false)}${lane(nb, his, false)}</div>
          <p class="note">Your own strip can still be lifted when you open it. The neighbour’s bay stays readable, so the dashed offer is seen before it is chased.</p></section></div>
      <div class="scroll"><table class="map"><thead><tr><th>Says</th><th>On the desk</th><th>With light and depth</th><th>Verdict</th></tr></thead>
        <tbody>${ROWS.map(([a, b, c, k, v], i) => `<tr class="dep" style="--i:${i}"><td>${a}</td><td>${b}</td><td>${c}</td><td><span class="v ${k}">${v}</span></td></tr>`).join('')}</tbody></table></div>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function rack(on) { S.rack = on ?? !S.rack; $('.pane').classList.toggle('racked', S.rack); $('.lost').style.opacity = S.rack ? 1 : 0; }
function replay() {
  clearLater(); S.rack = false; render(); settle();
  /* the moment: the left pane racks focus to your bay; Tom's bay, with his offer to you, goes soft */
  later(() => rack(true), ms('--motion-run'));
}
onKeys({ r: replay, f: () => rack() });
replay();
</script>
</body>
</html>
