<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Grammar V6 · What the desk needs recorded</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: the rules the desk keeps, and the records AUGUR would need to keep them, checked live against the sample ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:var(--space-6)}
.col{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.rule{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) auto;gap:var(--space-3);align-items:start;padding:var(--space-3) 0;border-bottom:1px solid var(--hairline)}
.rule .no{font:200 var(--type-title-s)/1 var(--font-sans);color:var(--ink-muted)}
.rule h3{margin:0 0 2px;font-weight:400;font-size:var(--type-meta);color:var(--light)}
.rule p{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.rule .ck{font:400 var(--type-meta)/1 var(--font-mono);color:var(--x-proposed-lit);white-space:nowrap;display:flex;gap:var(--space-1);align-items:center}
.rule .ck.open{color:var(--x-proposed-disagree)}
.rec{width:100%;border-collapse:collapse;font-size:var(--type-small);line-height:var(--leading-small)}
.rec th{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:0 var(--space-3) var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.rec td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);vertical-align:top;color:var(--ink)}
.rec td:first-child{font-family:var(--font-mono);color:var(--light);white-space:nowrap}
.rec .st{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);white-space:nowrap}
.st.have{color:var(--ink-muted)}.st.part{color:var(--ink)}.st.new{color:var(--x-proposed-disagree)}
.rec tr.grp td{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding-top:var(--space-4);border-bottom-color:var(--hairline-strong)}
@media (max-width:1400px){.rec td:nth-child(3),.rec th:nth-child(3){display:none}.rule p{font-size:var(--x-proposed-type-micro);line-height:1.4}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V6</b> what the desk needs recorded: five rules, each checked against the sample, and the records AUGUR would have to keep that it doesn't today</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { checked: 0 };
const things = DATA.items.length + B.jobs.length;
const offered = DATA.items.filter(x => x.to).length;
const nobody = B.jobs.filter(j => !j.holder).length;
const RULES = [
  ['One holder', 'Every thing that needs someone has exactly one holder at a time, named on it.', () => `${things - nobody} of ${things} · ${nobody} waiting`, ''],
  ['Offered is not moved', 'A handover moves the holder when the taker reads it back. Until then both names show, and the giver answers for it.', () => `${offered} offered`, ''],
  ['Marks are added, never changed', 'Initial, stamp, note, strike, cock: each has a name, a time and a kind, and is never edited.', () => `${FT.entries.length} entries, 0 edits`, ''],
  ['Say what a mark covers', 'An initial or stamp names what was checked. What nobody checked is named too.', () => `${AP.uncovered.length} uncovered`, 'open'],
  ['Away is visible', 'A thing held by someone who is away shows as held while away, with its time, until it is handed on.', () => `${B.jobs.filter(j => j.holder && P(j.holder).in === 'off').length} held while away`, 'open']
];
const REC = [
  ['Holding', null],
  ['holder', 'one person per thing, now', 'Artifacts names an owning floor, not a person; there is no holder shared across apps', 'part'],
  ['held_since', 'when the current holder took it', 'not kept', 'new'],
  ['offer', 'to whom, when, the zone’s end, the SBAR card', 'not kept', 'new'],
  ['readback', 'the taker’s words and time; moves the holder', 'not kept', 'new'],
  ['point_out', 'to whom, when, seen at', 'not kept', 'new'],
  ['Marks', null],
  ['mark', 'who, when, kind, what it covers, note', 'Artifacts keeps who published, from where and when; not what a sign-off covers', 'part'],
  ['correction', 'from, to, why, evidence, countersign', 'Data Atlas keeps each source’s observation and shows disagreement; not a correction with a reason', 'part'],
  ['stub', 'the person’s own numbered copy of every mark', 'not kept', 'new'],
  ['Private', null],
  ['cock', 'the holder’s own offset and note, never shared', 'not kept, and must stay out of the audit log', 'new'],
  ['desk_layout', 'where you put strips, if the desk top is built', 'not kept', 'new'],
  ['Team', null],
  ['presence', 'in, out, off, and until when', 'not kept', 'new'],
  ['slots', 'the team’s own limits, per person or per stage', 'not kept', 'new']
];
function render() {
  $('#app').innerHTML = topHTML(['Design lab', 'Desk language'], [['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <section class="col"><div><p class="eyebrow">Desk language · the rules it keeps</p><h1 class="t" style="margin-top:var(--space-1)">Five rules</h1></div>
        <div>${RULES.map(([h, p, v, k], i) => `<div class="rule dep" style="--i:${i}"><span class="no">${i + 1}</span><div><h3>${h}</h3><p>${p}</p></div><span class="ck ${k}" style="opacity:${i < S.checked ? 1 : 0}">${I(k ? 'circle-alert' : 'circle-check', 14)}${v()}</span></div>`).join('')}</div>
        <p class="note">Checked against this run’s sample: ${things} things across Home and the team board. The two open checks are not failures: they are things AUGUR would show and today can’t.</p></section>
      <section class="col"><div><p class="eyebrow">What AUGUR would need to record</p><h2 class="h" style="margin-top:var(--space-1)">${REC.filter(r => r[3] === 'new').length} new records, ${REC.filter(r => r[3] === 'part').length} to extend</h2></div>
        <div class="scroll"><table class="rec"><thead><tr><th>Record</th><th>Holds</th><th>Today</th><th></th></tr></thead><tbody>
          ${REC.map(([a, b, c, k]) => b === null ? `<tr class="grp"><td colspan="4">${a}</td></tr>` : `<tr><td>${a}</td><td>${b}</td><td class="muted">${c}</td><td><span class="st ${k}">${k === 'new' ? 'new' : 'extend'}</span></td></tr>`).join('')}</tbody></table></div></section>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.checked = 0; render(); settle();
  /* the moment: each rule is checked against the sample in turn, and two come back open */
  RULES.forEach((_, i) => later(() => { S.checked = i + 1; $$('.rule .ck')[i].style.opacity = 1; }, ms('--motion-run') + i * ms('--motion-base')));
}
onKeys({ r: replay });
replay();
</script>
</body>
</html>
