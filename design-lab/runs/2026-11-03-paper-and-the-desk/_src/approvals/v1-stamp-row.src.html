<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Approvals V1 · The stamp row</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: a row of stamp boxes in order, as on a ringi-sho. earlier stamps are marks on the object ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:var(--space-6)}
.right{display:flex;flex-direction:column;gap:var(--space-5);min-height:0}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3);position:relative}
.box{display:grid;gap:var(--space-2);justify-items:center;align-content:start;text-align:center}
.box .role{min-height:2.7em;font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.box .well{width:100%;aspect-ratio:1/1;max-height:calc(var(--space-8) + var(--space-5));border:1px solid var(--hairline);border-radius:var(--radius-key);display:flex;align-items:center;justify-content:center;background:var(--surface-inset)}
.box .well .stamp{min-width:0;width:82%}
.box.next .well{border-color:var(--x-proposed-lit);border-style:dashed;background:var(--x-proposed-lit-wash)}
.box .held{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.box .says{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);text-align:left;border-top:1px solid var(--hairline);padding-top:var(--space-2);width:100%}
.box .says b{font-weight:400;color:var(--ink-muted);display:block;font-size:var(--x-proposed-type-micro);font-family:var(--font-mono);letter-spacing:var(--tracking-soft)}
.order{position:absolute;top:calc(var(--space-6) + var(--space-1));left:12%;right:12%;height:1px;background:linear-gradient(90deg,var(--hairline-strong),var(--hairline-strong));z-index:-1}
.holdbar{position:relative;overflow:hidden}
.holdbar::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:var(--p,0%);background:var(--x-proposed-lit)}
.press{display:flex;gap:var(--space-3);align-items:center}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:var(--space-5)}.sec .sw{display:none}.box .says{font-size:var(--x-proposed-type-micro)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Approvals · V1</b> the stamp row: boxes in order, each stamp a mark with a name and date; hold S to stamp yours · ringi-sho and hanko, kept upright</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { stamped: false, p: 0 };
const me = DATA.me;
function boxHTML(r, i) {
  const p = P(r.who), mine = r.who === me, done = r.at || (mine && S.stamped);
  const word = r.act === 'stamp' ? 'Publish' : 'Initialled';
  const st = done ? stampHTML(r.who, word, mine && S.stamped ? `${DATA.now.day} ${DATA.now.time}` : r.at, mine ? 'land' : '') : `<span class="stamp empty" data-tier="${p.floor}"><span class="w">${word}</span><span class="n">${p.name}</span><span class="d">${mine ? 'yours, next' : 'after you'}</span></span>`;
  return `<div class="box ${mine && !S.stamped ? 'next' : ''}"><span class="role">${i + 1} · ${p.role}</span><div class="well">${st}</div>
    <span class="held">${r.at ? 'held ' + r.held : mine ? (S.stamped ? 'held 18 h' : 'with you ' + r.held) : r.act === 'stamp' ? 'stamps to publish' : ''}</span>
    <span class="says"><b>${done ? 'SIGNED FOR' : 'ASKED TO SIGN FOR'}</b>${r.says}</span></div>`;
}
function render() {
  const route = AP.route;
  $('#app').innerHTML = topHTML(['Artifacts', AP.library, AP.doc], [['hold S', 'stamp'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <section class="doc scroll"><div class="doc-h"><p class="eyebrow">${AP.version} · was ${AP.was} · drafted by ${P(AP.author).name}</p><h2 class="h">${AP.doc}</h2>
        <p class="note">Ready to publish to <b>${AP.library}</b>: ${fmt(AP.readers)} readers on the <span class="fword" data-tier="${AP.floor}">${F(AP.floor).word} floor</span>. Initials beside each section show who has signed for it.</p></div>
        ${sectionsHTML({ mine: n => S.stamped ? ini(me, "sm") : "" })}</section>
      <section class="right"><div><p class="eyebrow">The stamp row · in order</p><h1 class="t" style="margin-top:var(--space-1)">${S.stamped ? 'Passed to ' + first('helen') : 'Your initial is next'}</h1></div>
        <div class="row">${route.map(boxHTML).join('')}</div>
        <div class="panel" style="display:grid;gap:var(--space-3)">
          <p class="why">${I('triangle-alert', 14)}<span><b style="color:var(--ink);font-weight:400">Nobody on this row signs for section 6, Costs</b>, which is new in ${AP.version}. Helen’s stamp would publish it unchecked. Ask ${P(AP.uncoveredWho).name}, ${P(AP.uncoveredWho).role}, to initial it, or say in a note why it needs no one.</span></p>
          ${S.stamped ? `<p class="note">Your initial is on the document and in your stamp book. It can’t be taken off; if you change your mind, add a note that withdraws it, and Helen sees both.</p>` :
          `<div class="press"><button class="btn go holdbar" id="hold" style="--p:${S.p}%">${I('stamp', 14)} Hold to initial sections 3 and 5 <span class="kbd">S</span></button><span class="note">Your initial says what’s on the box above, and only that.</span></div>`}
          <p class="note">Stamps are upright. On paper a ringi stamp bows to the one above it; here rank is in the order of the row, not in the angle of anyone’s mark.</p>
        </div></section>
    </div></main>`;
  Icons.hydrate($('#app'));
  const h = $('#hold'); if (h) { h.onpointerdown = startHold; h.onpointerup = h.onpointerleave = stopHold; }
}
let raf = 0, t0 = 0;
function startHold() { if (S.stamped) return; t0 = performance.now(); const step = now => { S.p = Math.min(100, (now - t0) / ms('--motion-run') * 100); const h = $('#hold'); h && h.style.setProperty('--p', S.p + '%'); if (S.p >= 100) { S.stamped = true; render(); return; } raf = requestAnimationFrame(step); }; raf = requestAnimationFrame(step); }
function stopHold() { cancelAnimationFrame(raf); if (!S.stamped) { S.p = 0; const h = $('#hold'); h && h.style.setProperty('--p', '0%'); } }
function replay() {
  clearLater(); S.stamped = false; S.p = 0; render(); settle();
  /* the moment: your initial lands in the third box; the row passes to Helen */
  later(() => { S.stamped = true; render(); }, ms('--motion-run'));
}
let down = false;
document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 's' && !down && !e.repeat) { down = true; startHold(); } });
document.addEventListener('keyup', e => { if (e.key.toLowerCase() === 's') { down = false; stopHold(); } });
onKeys({ r: replay });
replay();
</script>
</body>
</html>
