<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Approvals V3 · The routing slip</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: the slip clipped to the front: who it went to, when, and how long it sat with each ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4)}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--space-6);min-height:0}
.slip{align-self:start;border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--x-proposed-strip);box-shadow:var(--shadow-raised);padding:var(--space-4) var(--space-5);display:grid;gap:var(--space-3);align-content:start}
.slip table{width:100%;border-collapse:collapse;font-size:var(--type-meta);line-height:var(--leading-meta)}
.slip th{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:0 var(--space-2) var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.slip td{padding:var(--space-2);border-bottom:1px solid var(--hairline);vertical-align:middle;color:var(--ink)}
.slip td.m{font:400 var(--type-small)/1.3 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.slip tr.cur td{background:var(--x-proposed-lit-wash)}
.slip tr.cur td:first-child{box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.inibox{display:inline-flex;align-items:center;justify-content:center;min-width:calc(var(--space-7) - var(--space-2));height:var(--space-5);border:1px dashed var(--x-proposed-slot);border-radius:var(--radius-key);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.inibox.done{border:var(--x-proposed-stamp-weight) solid var(--fc);color:var(--fc);background:color-mix(in srgb,var(--fc) 6%,transparent)}
.inibox.done.land{animation:land var(--motion-base) var(--ease-out)}
/* the dwell ruler: how long it sat with each person, and the time left before it is due */
.ruler{position:relative;height:calc(var(--space-7) + var(--space-5));margin-top:var(--space-2)}
.ruler .seg{position:absolute;top:var(--space-5);height:var(--space-5);border-radius:2px;background:color-mix(in srgb,var(--fc) 30%,transparent);border:1px solid var(--fc);display:flex;align-items:center;padding:0 var(--space-2);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--light);overflow:hidden;white-space:nowrap;transition:width var(--motion-calm) var(--ease-out)}
.ruler .seg.left{background:none;border-style:dashed}
.ruler .tick{position:absolute;top:0;bottom:var(--space-3);border-left:1px solid var(--hairline-strong)}
.ruler .tick span{position:absolute;top:0;left:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.ruler .tick.now{border-color:var(--x-proposed-lit)}.ruler .tick.now span{color:var(--x-proposed-lit)}
.ruler .tick.due{border-color:var(--x-proposed-past);border-left-style:dashed}.ruler .tick.due span{color:var(--x-proposed-past);left:auto;right:var(--space-1)}.ruler .tick.now span{left:auto;right:var(--space-1);top:auto;bottom:calc(var(--space-4) * -1)}
.ruler .wknd{position:absolute;top:var(--space-5);height:var(--space-5);background:var(--x-proposed-unseen);opacity:.6}
.side{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
@media (max-width:1400px){.cols{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--space-5)}.side .doc .sec:nth-child(-n+1){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Approvals · V3</b> the routing slip: a slip on the front, initialled line by line, with how long it sat with each person · office routing slips, the registry docket</div>
<script>
/*@DATA@*/
/*@LIB@*/
const me = DATA.me;
const S = { done: false };
const H0 = AP.route[0].hIn, H1 = AP.route[3].hDue + 4, X = h => (h - H0) / (H1 - H0) * 100;
function rows() {
  return AP.route.map((r, i) => {
    const p = P(r.who), mine = r.who === me, done = r.at || (mine && S.done), cur = (mine && !S.done) || (r.act === 'stamp' && S.done);
    const out = r.at || (mine && S.done ? `${DATA.now.day} ${DATA.now.time}` : '');
    const held = r.at ? r.held : mine ? (S.done ? '18 h' : '18 h so far') : '';
    return `<tr class="${cur ? 'cur' : ''}" data-tier="${p.floor}"><td>${i + 1}</td><td>${pchip(r.who)}<div class="note">${p.role}</div></td>
      <td>${r.act === 'stamp' ? 'stamp to publish' : 'initial'}</td><td class="m">${r.in || (S.done ? `${DATA.now.day} ${DATA.now.time}` : '')}</td><td class="m">${out}</td><td class="m">${held}</td>
      <td><span class="inibox ${done ? 'done' : ''} ${mine && S.done ? 'land' : ''}">${done ? p.ini : mine ? 'you' : '—'}</span></td></tr>`;
  }).join('');
}
function ruler() {
  const segs = AP.route.map(r => {
    const p = P(r.who), a = r.hIn ?? (S.done ? 0 : null);
    if (a === null) return '';
    const b = r.hOut ?? (r.who === me ? 0 : r.act === 'stamp' ? r.hDue : 0);
    if (r.who === me && S.done) return `<span class="seg" data-tier="${p.floor}" style="left:${X(a)}%;width:${X(0) - X(a)}%">${p.ini}</span>`;
    return `<span class="seg ${r.act === 'stamp' ? 'left' : ''}" data-tier="${p.floor}" style="left:${X(a)}%;width:${X(b) - X(a)}%">${p.ini}${r.act === 'stamp' ? ' · ' + Math.round(r.hDue) + ' h left' : ''}</span>`;
  }).join('');
  /* the weekend: a hatch, because nobody holds anything over it on purpose */
  const wk = `<span class="wknd" style="left:${X(-91.5 + 8.8)}%;width:${X(-91.5 + 8.8 + 48) - X(-91.5 + 8.8)}%" title="weekend"></span>`;
  return `<div class="ruler" role="img" aria-label="How long the document sat with each person">${wk}${segs}
    <span class="tick" style="left:${X(H0)}%"><span>sent ${AP.route[0].in}</span></span>
    <span class="tick now" style="left:${X(0)}%"><span>now</span></span>
    <span class="tick due" style="left:${X(AP.route[3].hDue)}%"><span>due ${AP.route[3].due}</span></span></div>`;
}
function render() {
  const helen = AP.route[3];
  $('#app').innerHTML = topHTML(['Artifacts', AP.library, AP.doc], [['I', 'initial your line'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div><p class="eyebrow">Routing slip · ${AP.doc}, ${AP.version}</p><h1 class="t" style="margin-top:var(--space-1)">${S.done ? 'On to Helen Marsh' : 'Your line is next'}</h1></div>
      <div class="cols"><div class="slip"><table><thead><tr><th>#</th><th>To</th><th>For</th><th>In</th><th>Out</th><th>Held</th><th>Initial</th></tr></thead><tbody>${rows()}</tbody></table>
        <p class="eyebrow" style="margin-top:var(--space-2)">How long it sat with each</p>${ruler()}
        <p class="note">${S.done ? `It reached Helen with <b>${Math.round(helen.hDue)} h</b> to go before it is due. The weekend is hatched: the slip doesn’t count it against anyone.` : `It has been with you <b>18 h</b>. Helen has <b>${Math.round(helen.hDue)} h</b> left before it is due, less whatever you keep it.`}</p></div>
      <aside class="side"><div class="doc scroll" style="max-height:100%"><div class="doc-h"><p class="eyebrow">Under the slip</p><h2 class="h">${AP.doc}</h2></div>${sectionsHTML({ hot: AP.route.find(r => r.who === me).covers, mine: n => S.done && AP.route.find(r => r.who === me).covers.includes(n) ? ini(me, "sm") : "" })}</div>
        <button class="btn go" data-i ${S.done ? 'aria-disabled="true"' : ''}>${I('pen-line', 14)} ${S.done ? 'Initialled at ' + DATA.now.time : 'Initial your line and pass it on'} <span class="kbd">I</span></button></aside></div>
    </div></main>`;
  Icons.hydrate($('#app'));
  $('[data-i]').onclick = initial;
}
function initial() { if (S.done) return; S.done = true; render(); }
function replay() {
  clearLater(); S.done = false; render(); settle();
  /* the moment: you initial your line; your dwell bar closes at now and Helen's line lights */
  later(initial, ms('--motion-run'));
}
onKeys({ r: replay, i: initial });
replay();
</script>
</body>
</html>
