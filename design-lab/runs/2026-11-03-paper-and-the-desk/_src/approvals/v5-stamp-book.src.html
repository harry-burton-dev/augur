<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Approvals V5 · The stamp book</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: every mark is written twice: on the object, and as a counterfoil in your own stamp book ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-6)}
.left{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4);min-height:0}
.foot{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;border-top:1px dashed var(--hairline-strong);padding-top:var(--space-3);min-height:calc(var(--space-7) + var(--space-3))}
.book{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-3)}
.stubs{display:grid;gap:var(--space-2);align-content:start}
/* a counterfoil: the perforated stub you keep when the mark goes out */
.stub{display:grid;grid-template-columns:calc(var(--space-7) - var(--space-2)) minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-4);background:var(--x-proposed-strip);border:1px solid var(--hairline);border-right:2px dashed var(--hairline-strong);border-radius:var(--radius-key) 0 0 var(--radius-key)}
.stub .no{font:400 var(--type-heading)/1 var(--font-mono);color:var(--ink-muted)}
.stub .w{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.stub .c{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.stub .a{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink);text-align:right;text-transform:uppercase;letter-spacing:var(--tracking-caps)}
.stub.new{border-color:var(--x-proposed-lit);border-right-color:var(--x-proposed-lit);background:color-mix(in srgb,var(--x-proposed-strip) 80%,var(--green) 6%)}
.stub.new .no{color:var(--x-proposed-lit)}
.stub.write{animation:write var(--motion-calm) var(--ease-out)}
@keyframes write{from{opacity:0;transform:translateY(calc(var(--space-4) * -1))}}
.stub.ret .a{color:var(--x-proposed-disagree)}
.pair{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
@media (max-width:1400px){.left .doc .sec .sw{display:none}.stub{padding:var(--space-2) var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Approvals · V5</b> the stamp book: each mark goes on the object and leaves a numbered stub in your own book · cheque stubs, double entry</div>
<script>
/*@DATA@*/
/*@LIB@*/
const me = DATA.me, mine = AP.route.find(r => r.who === me);
const S = { done: false };
const NO = AP.book[0].no + 1;
function stub(b, cls = '') {
  return `<div class="stub dep ${cls} ${b.act === 'returned' ? 'ret' : ''}"><span class="no">${b.no}</span><span><span class="w">${b.what}</span><br><span class="c">${b.covers} · to ${P(b.for).name}</span></span><span class="a">${b.act}<br><span class="muted">${b.at}</span></span></div>`;
}
function render() {
  const mark = S.done ? `${stampHTML(me, 'Initialled · no. ' + NO, DATA.now.day + ' ' + DATA.now.time, 'land')}<span class="note">Sections 3 and 5. On the document for everyone who opens it, from now on.</span>` : `<span class="stamp empty" data-tier="team"><span class="w">no. ${NO}</span><span class="n">${ME().name}</span><span class="d">not yet</span></span><span class="note">Your mark will go here, and its counterfoil into your book with the same number.</span>`;
  $('#app').innerHTML = topHTML(['Artifacts', AP.library, AP.doc], [['S', 'stamp'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <section class="left"><div><p class="eyebrow">The object · everyone sees this mark</p><h2 class="h" style="margin-top:var(--space-1)">${AP.doc}, ${AP.version}</h2></div>
        <div class="doc scroll">${sectionsHTML({ hot: mine.covers, mine: n => S.done && mine.covers.includes(n) ? ini(me, 'sm') : '' })}</div>
        <div class="foot">${mark}${S.done ? '' : `<button class="btn go" data-s style="margin-left:auto">${I('stamp', 14)} Initial 3 and 5 <span class="kbd">S</span></button>`}</div></section>
      <section class="book"><div><p class="eyebrow">Your stamp book · only you see it whole</p><h1 class="t" style="margin-top:var(--space-1)">${plural(AP.book.length + (S.done ? 1 : 0), 'mark')} this month</h1>
        <p class="note" style="margin-top:var(--space-1)">Every mark you put on anything (initial, stamp, return, handover) leaves a numbered stub here. The two halves carry the same number, so a mark can always be found from either side.</p></div>
        <div class="stubs scroll">${S.done ? stub({ no: NO, what: AP.doc + ', ' + AP.version, act: 'initial', covers: 'Sections 3 and 5', for: 'helen', at: DATA.now.day }, 'new write') : `<div class="stub" style="border-style:dashed;opacity:var(--x-proposed-quiet)"><span class="no">${NO}</span><span class="c">The next stub. It is written when your mark goes on.</span><span></span></div>`}
          ${AP.book.map(b => stub(b)).join('')}
          <p class="pair">${I('link', 12)} Numbers run on without gaps. A gap would mean a mark went out without a stub, and the book would show it.</p></div></section>
    </div></main>`;
  Icons.hydrate($('#app'));
  $('[data-s]') && ($('[data-s]').onclick = stamp);
}
function stamp() { if (S.done) return; S.done = true; render(); }
function replay() {
  clearLater(); S.done = false; render(); settle();
  /* the moment: your initial lands on the document, and stub 42 writes itself at the top of your book */
  later(stamp, ms('--motion-run'));
}
onKeys({ r: replay, s: stamp });
replay();
</script>
</body>
</html>
