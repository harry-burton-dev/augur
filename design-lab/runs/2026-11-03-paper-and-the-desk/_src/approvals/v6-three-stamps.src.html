<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Approvals V6 · Three stamps</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: three stamps on the rack: initial, initial with a note, return. each previews where the strip goes ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-5)}
.head{display:flex;gap:var(--space-5);align-items:flex-end}
.head .sum{margin-left:auto;display:flex;gap:var(--space-4);align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
.rack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
.choice{display:grid;gap:var(--space-2);justify-items:start;padding:var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);text-align:left;transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard)}
.choice:hover,.choice[aria-pressed="true"]{border-color:var(--hairline-strong);background:var(--surface-raised)}
.choice[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--x-proposed-lit)}
.choice .stamp{min-width:calc(var(--space-8) + var(--space-6))}
.choice .d{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.choice .k{margin-left:auto}
.choice.ret .stamp[data-tier]{--fc:var(--x-proposed-disagree)}
.prev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-6);min-height:0}
.flow{display:grid;gap:var(--space-3);align-content:start}
.step{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.step svg{color:var(--ink-muted);margin-top:2px}
.step b{font-weight:400;color:var(--light)}
textarea{font:inherit;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);background:var(--x-proposed-pencil-wash);border:1px dotted var(--x-proposed-pencil);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);width:100%;min-height:calc(var(--space-7) + var(--space-3));resize:none}
textarea:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.never{border-top:1px solid var(--hairline);padding-top:var(--space-3)}
@media (max-width:1400px){.head .sum{display:none}.choice .d{font-size:var(--x-proposed-type-micro)}.prev{gap:var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Approvals · V6</b> three stamps: initial, initial with a note, or return it with one; each shows where the strip goes before you press · rubber-stamp racks, "returned for amendment"</div>
<script>
/*@DATA@*/
/*@LIB@*/
const me = DATA.me, mine = AP.route.find(r => r.who === me), back = AP.route[1].who, next = AP.route[3].who;
const S = { pick: 0, note: '' };
const NOTES = ['', 'Section 6 is fine by me, but nobody has checked the £1,800 figure.', 'Please ask Joe Park to check section 6 (Costs) before this goes to Helen: nobody on the row has.'];
const CH = [
  { w: 'Initialled', d: 'You checked what you were asked to. It goes on to the next box.', k: '1' },
  { w: 'Initialled, noting', d: 'You agree, and you want something on the record beside your mark.', k: '2' },
  { w: 'Returned', d: 'It goes back with your note. Nothing anyone wrote is lost.', k: '3', cls: 'ret' }
];
function preview(i) {
  const n = P(next).name, b = P(back).name;
  const steps = [
    [['stamp', `Your initial goes on sections <b>3 and 5</b>, with your name and ${DATA.now.time}.`], ['send', `The strip moves to <b>${n}</b>. It leaves your bay; your stamp book keeps the stub.`], ['eye', `${first(back)} and ${first('dev')} see it pass you.`]],
    [['stamp', `Your initial goes on sections <b>3 and 5</b>.`], ['sticky-note', `Your note is pinned beside it, in ink. ${first(next)} reads it before she stamps.`], ['send', `The strip moves to <b>${n}</b>.`]],
    [['undo-2', `The strip goes back to <b>${b}</b>, who passed it to you. It is hers until she sends it on again.`], ['sticky-note', `Your note goes with it and stays on the document as a mark: “returned by ${ME().name}”.`], ['history', `Dev’s and Nkechi’s initials stay. When it comes back, the row starts again from Nkechi, not from Dev.`], ['clock', `The time keeps running: it is due ${AP.route[3].due}.`]]
  ][i];
  return steps.map(([ic, t]) => `<div class="step dep">${I(ic, 16)}<span>${t}</span></div>`).join('');
}
function render() {
  const c = CH[S.pick];
  $('#app').innerHTML = topHTML(['Artifacts', AP.library, AP.doc], [['1 2 3', 'pick a stamp'], ['Enter', 'stamp'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div class="head"><div><p class="eyebrow">${AP.doc} · ${AP.version} · your box is the third of four</p><h1 class="t" style="margin-top:var(--space-1)">Pick a stamp</h1></div>
        <div class="sum">${AP.route.map(r => r.at ? initialHTML(r.who, r.at.split(' ').slice(0, 3).join(' ')) : `<span class="initial">${ini(r.who, 'sm')}${r.who === me ? 'you' : 'next'}</span>`).join(I('chevron-right', 12))}</div></div>
      <div class="rack" role="radiogroup" aria-label="Stamps">${CH.map((x, i) => `<button class="choice ${x.cls || ''}" role="radio" aria-pressed="${i === S.pick}" aria-checked="${i === S.pick}" data-i="${i}"><span style="display:flex;width:100%;align-items:center">${stampHTML(me, x.w, 'not yet')}<span class="kbd k">${x.k}</span></span><span class="d">${x.d}</span></button>`).join('')}</div>
      <div class="prev"><div class="flow"><p class="eyebrow">If you stamp “${c.w}”</p>${preview(S.pick)}</div>
        <div class="flow">${S.pick ? `<p class="eyebrow">Your note · ${S.pick === 2 ? 'needed to return it' : 'goes beside your mark'}</p><textarea aria-label="Your note">${NOTES[S.pick]}</textarea>` : `<p class="eyebrow">No note</p><p class="note">An initial on its own means: I checked sections 3 and 5 and I stand by them.</p>`}
          <button class="btn go" style="justify-self:start">${I('stamp', 14)} Stamp “${c.w}” <span class="kbd">Enter</span></button>
          <p class="note never"><b>There is no reject stamp, and no stamp upside down.</b> On paper an unwilling approver may stamp upside down; here that is “noting”, in words. A return is a handover back, never a dead end.</p></div></div>
    </div></main>`;
  Icons.hydrate($('#app'));
  $$('.choice').forEach(b => b.onclick = () => pick(+b.dataset.i));
}
function pick(i) { S.pick = i; render(); }
function replay() {
  clearLater(); S.pick = 0; render(); settle();
  /* the moment: you move to "Returned"; the preview shows the strip going back to Nkechi with your note */
  later(() => pick(2), ms('--motion-run'));
}
onKeys({ r: replay, 1: () => pick(0), 2: () => pick(1), 3: () => pick(2) });
replay();
</script>
</body>
</html>
