<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Approvals V4 · Initials in the margin</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: initial each changed section in the margin, as on each page of a contract; the pass-on unlocks when yours are done ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-6)}
.paper{min-height:0;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);display:grid;grid-template-columns:minmax(0,1fr) calc(var(--space-8) + var(--space-6));overflow:auto}
.body{padding:var(--space-5) var(--space-6);display:grid;gap:var(--space-4);align-content:start;max-width:var(--measure-read)}
.margin{border-left:1px solid var(--hairline-strong);padding:var(--space-5) var(--space-3);position:relative}
.para{display:grid;gap:var(--space-1)}
.para h3{margin:0;font-weight:400;font-size:var(--type-body);color:var(--light);display:flex;gap:var(--space-3);align-items:baseline}
.para h3 .n{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.para h3 .chw{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.para p{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.para p .ins{color:var(--light);background:var(--x-proposed-lit-wash);border-bottom:1px solid var(--x-proposed-lit)}
.para.same{opacity:var(--x-proposed-quiet)}
.mbox{position:absolute;left:var(--space-3);right:var(--space-3);display:flex;flex-wrap:wrap;gap:var(--space-1);align-items:center}
.mslot{display:inline-flex;align-items:center;justify-content:center;height:var(--space-5);padding:0 var(--space-2);border:1px dashed var(--x-proposed-lit);border-radius:var(--radius-key);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash);cursor:pointer}
.mslot.no{border-color:var(--x-proposed-disagree);color:var(--x-proposed-disagree);background:none;cursor:default}
.mini{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.mini.land .ini{animation:land var(--motion-base) var(--ease-out)}
.side{display:flex;flex-direction:column;gap:var(--space-4)}
.count{display:grid;grid-template-columns:repeat(2,auto) 1fr;gap:var(--space-2) var(--space-3);align-items:center;font-size:var(--type-small);color:var(--ink)}
@media (max-width:1400px){.body{padding:var(--space-4)}.wrap{grid-template-columns:minmax(0,1fr) calc(var(--measure-rail) + var(--space-6))}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Approvals · V4</b> initials in the margin: each changed section initialled where it sits; passing it on unlocks when yours are done · initialling each page of a contract, legal mark-ups</div>
<script>
/*@DATA@*/
/*@LIB@*/
const me = DATA.me, mine = AP.route.find(r => r.who === me).covers;
const S = { mine: new Set() };
const TEXT = {
  1: 'This standard covers every home Westmarch lets, and every report of damp or mould from a tenant, a visit or a survey.',
  2: 'An emergency hazard (mould over a sleeping area, or damp near electrics) is made safe within {ins}, and fixed within 14 days.',
  3: 'At the first visit the surveyor takes {ins}, with the date in the file name, and adds them to the case.',
  4: 'The tenant gets a written update within 3 working days of each visit, and a named contact.',
  5: 'Each case is recorded {ins}, so the case follows the home and not the person who opened it.',
  6: 'A coordinator may approve works {ins}. Above that, the Head of Property Services signs off.'
};
const INS = { 2: '24 hours', 3: 'a dated photo of every affected room', 5: 'against the home in Data Atlas', 6: 'up to £1,800 per home without further sign-off' };
function paraHTML(s, i) {
  const t = TEXT[s.n].replace('{ins}', s.ch === 'same' ? '' : `${s.old ? `<span class="struck">${s.old}</span> ` : ''}<span class="ins">${INS[s.n]}</span>`);
  return `<div class="para dep ${s.ch}" data-n="${s.n}" style="--i:${i}"><h3><span class="n">${s.n}</span>${s.t}<span class="chw">${s.ch === 'same' ? 'unchanged' : s.ch === 'new' ? 'new' : 'changed'}</span></h3><p>${t}</p></div>`;
}
function marginHTML(s) {
  const by = signedFor(s.n).map(w => `<span class="mini" data-tier="${P(w).floor}">${ini(w, 'sm')}</span>`).join('');
  const me1 = S.mine.has(s.n) ? `<span class="mini land" data-tier="${ME().floor}">${ini(me, 'sm')}${DATA.now.time}</span>` : mine.includes(s.n) ? `<button class="mslot" data-n="${s.n}">initial ${I('pen-line', 12)}</button>` : '';
  const none = s.ch !== 'same' && !signedFor(s.n).length && !mine.includes(s.n) ? `<span class="mslot no">nobody asked</span>` : '';
  return `<div class="mbox" data-m="${s.n}">${by}${me1}${none}</div>`;
}
function render() {
  const left = mine.filter(n => !S.mine.has(n));
  $('#app').innerHTML = topHTML(['Artifacts', AP.library, AP.doc], [['I', 'initial the next'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div class="paper scroll" id="paper"><div class="body"><div class="doc-h"><p class="eyebrow">${AP.doc} · ${AP.version}, changes since ${AP.was} marked</p><h2 class="h">${AP.doc}</h2></div>${AP.sections.map(paraHTML).join('')}</div>
        <div class="margin" id="margin"><p class="eyebrow">Initials</p>${AP.sections.map(marginHTML).join('')}</div></div>
      <aside class="side"><div><p class="eyebrow">Your part</p><h1 class="t" style="margin-top:var(--space-1);font-size:var(--type-title-s)">${left.length ? plural(left.length, 'section') + ' to initial' : 'Ready to pass on'}</h1></div>
        <div class="count">${AP.sections.filter(s => s.ch !== 'same').map(s => `<span class="mono muted">${s.n}</span><span>${s.t}</span><span style="justify-self:end">${signedFor(s.n).concat(S.mine.has(s.n) ? [me] : []).map(w => ini(w, 'sm')).join('') || '<span class="nobody">nobody</span>'}</span>`).join('')}</div>
        <p class="note">You are asked to initial <b>${mine.map(n => n + ' ' + AP.sections.find(s => s.n === n).t).join('</b> and <b>')}</b>. Unchanged sections need nobody. Initialling a section you weren’t asked about is allowed: it says you checked it too.</p>
        <button class="btn ${left.length ? '' : 'go'}" ${left.length ? 'aria-disabled="true"' : ''}>${I('send', 14)} Pass it on to Helen Marsh</button>
        ${left.length ? `<p class="why">${I('lock', 14)}<span>Locked until sections ${left.join(' and ')} carry your initials. The document can’t leave you half-signed.</span></p>` : `<p class="why">${I('triangle-alert', 14)}<span>Section 6, Costs, has no initials and nobody was asked. Helen will see that in the margin when she stamps.</span></p>`}
      </aside></div></main>`;
  Icons.hydrate($('#app'));
  place();
  $$('.mslot[data-n]').forEach(b => b.onclick = () => initial(+b.dataset.n));
}
/* each margin box sits level with its paragraph */
function place() { const top = $('#paper').getBoundingClientRect().top - $('#paper').scrollTop; $$('.mbox').forEach(m => { const p = $(`.para[data-n="${m.dataset.m}"]`); m.style.top = (p.getBoundingClientRect().top - top) + 'px'; }); }
function initial(n) { n = n || mine.find(x => !S.mine.has(x)); if (!n) return; S.mine.add(n); render(); }
function replay() {
  clearLater(); S.mine.clear(); render(); settle();
  /* the moment: your initials land beside 3, then 5; passing it on unlocks */
  later(() => initial(3), ms('--motion-run') - ms('--motion-calm'));
  later(() => initial(5), ms('--motion-run'));
}
addEventListener('resize', place);
onKeys({ r: replay, i: () => initial() });
replay();
</script>
</body>
</html>
