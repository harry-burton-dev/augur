<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Team board V3 · The ward whiteboard</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: one row per home, as one row per bed. people are magnets: who's in today at the top, holders on each row ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3)}
.today{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset)}
.today .lab{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-right:var(--space-2)}
.today .gap{width:1px;height:var(--space-5);background:var(--hairline-strong);margin:0 var(--space-2)}
/* a person magnet: round, their initials, ring in their floor colour */
.mag{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-2) 2px 2px;border-radius:var(--radius-pill);background:var(--x-proposed-strip);border:1px solid var(--hairline);font-size:var(--type-small);color:var(--ink);white-space:nowrap;transition:opacity var(--motion-calm) var(--ease-out),border-color var(--motion-base) var(--ease-standard)}
.mag.off{opacity:var(--x-proposed-quiet);background:var(--x-proposed-unseen)}
.mag.out .ini{border-style:dotted}
.mag.offer{border-style:dashed;border-color:var(--x-proposed-lit);color:var(--x-proposed-lit)}
table{width:100%;border-collapse:collapse}
th{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:var(--space-1) var(--space-3) var(--space-2);border-bottom:1px solid var(--hairline-strong);position:sticky;top:0;background:var(--slate-deep)}
td{padding:var(--space-1) var(--space-3);border-bottom:1px solid var(--hairline);vertical-align:middle;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);height:calc(var(--target-sm) + var(--space-1))}
td.home{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light);width:calc(var(--space-7) + var(--space-3))}
td.home small{display:block;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.jobs{display:flex;gap:var(--space-3);flex-wrap:wrap}
.job{display:inline-flex;gap:var(--space-1);align-items:center}
.stg{display:inline-flex;gap:2px}
.stg i{width:var(--space-2);height:var(--space-2);border-radius:1px;border:1px solid var(--hairline-strong)}
.stg i.on{background:var(--ink);border-color:var(--ink)}
.flag{display:inline-flex;gap:var(--space-1);align-items:center;font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);color:var(--x-proposed-disagree);border:1px solid color-mix(in srgb,var(--x-proposed-disagree) 50%,transparent);border-radius:var(--radius-key);padding:2px var(--space-1);white-space:nowrap}
.flag.q{color:var(--ink);border-color:var(--hairline-strong)}
tr.away td{background:color-mix(in srgb,var(--x-proposed-past) 5%,transparent)}
@media (max-width:1400px){td{height:var(--target-sm);padding:2px var(--space-2)}.stg{display:none}td.nx{display:none}th.nx{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Team board · V3</b> the ward whiteboard: a row per home, people as magnets; who's in today along the top, holders on each row · ward and A&amp;E status boards (Wears and Perry 2007)</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* flags written on the board against a home; these are the team's own words */
const FLAGS = { 'C-14': [['door-closed', 'access: tenant asks for an evening']], 'C-12': [['scale', DATA.fact.field + ' disputed (' + DATA.fact.id + ')', 'q']], 'C-10': [['hourglass', 'nobody holds it · 3 days']], 'B-11': [['user-x', 'holder off sick · due today']] };
const NEXT = { survey: 'write up survey', repair: 'book or do the works', cert: 'visit and certify', admin: 'desk work' };
const S = { cover: 0 }; /* 0 none, 1 offered to Kai, 2 Kai took it */
const COVER = { job: 'J-405', from: 'grace', to: 'kai' };
function mag(id, cls = '') { const pr = presence(id); return `<span class="mag ${pr.cls} ${cls}" data-tier="${P(id).floor}" title="${P(id).name} · ${pr.w}">${ini(id, 'sm')}${first(id)}</span>`; }
function stages(st) { const i = B.stages.findIndex(s => s.id === st); return `<span class="stg" title="${STG(st).w}">${B.stages.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</span>`; }
function render() {
  const homes = [...new Set(B.jobs.map(j => j.home))].sort((a, b) => Math.min(...B.jobs.filter(j => j.home === a).map(j => j.h)) - Math.min(...B.jobs.filter(j => j.home === b).map(j => j.h)));
  const groups = { in: [], out: [], off: [] };
  DATA.team.forEach(id => groups[presence(id).cls].push(id));
  const rows = homes.map((h, i) => {
    const js = B.jobs.filter(j => j.home === h), due = js.reduce((a, j) => j.h < a.h ? j : a);
    const away = js.some(j => j.holder && P(j.holder).in === 'off' && !(j.id === COVER.job && S.cover === 2));
    const holders = js.map(j => {
      if (j.id === COVER.job && S.cover === 1) return mag(j.holder, 'off') + I('arrow-right', 12) + mag(COVER.to, 'offer');
      if (j.id === COVER.job && S.cover === 2) return mag(COVER.to);
      return j.holder ? mag(j.holder) : `<span class="mag off">nobody</span>`;
    }).join(' ');
    const flags = (FLAGS[h] || []).filter(f => !(h === 'B-11' && S.cover === 2)).map(([ic, w, c]) => `<span class="flag ${c || ''}">${I(ic, 12)}${w}</span>`).join(' ');
    return `<tr class="dep ${away ? 'away' : ''}" style="--i:${i}"><td class="home">${h}<small>${plural(js.length, 'job')}</small></td>
      <td><div class="jobs">${js.map(j => `<span class="job">${I(JK(j.kind).icon, 14)}${j.t} ${stages(j.stage)}</span>`).join('')}</div></td>
      <td>${holders}</td><td class="nx">${NEXT[due.kind]}</td><td class="mono ${due.h < 8 ? 'past' : ''}">${due.due}</td><td>${flags}</td></tr>`;
  }).join('');
  $('#app').innerHTML = topHTML(['Team', F('team').name, 'Board'], [['C', 'cover B-11'], ['T', 'Kai takes it'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div style="display:flex;align-items:flex-end;gap:var(--space-5)"><div><p class="eyebrow">${F('team').name} · ${[...new Set(B.jobs.map(j => j.home))].length} homes with open jobs</p><h1 class="t" style="margin-top:var(--space-1)">The whiteboard</h1></div>
        <p class="lede" style="margin-left:auto;max-width:60ch;text-align:right">Read it from across the room: a row per home, ordered by what is due first. A person is a magnet; a home with a magnet of someone who is off is tinted until somebody else’s magnet is on it.</p></div>
      <div class="today"><span class="lab">In today</span>${groups.in.map(id => mag(id)).join('')}<span class="gap"></span><span class="lab">Out</span>${groups.out.map(id => mag(id)).join('')}<span class="gap"></span><span class="lab">Off</span>${groups.off.map(id => mag(id)).join('')}</div>
      <div class="scroll"><table><thead><tr><th>Home</th><th>Jobs · stage</th><th>Held by</th><th class="nx">Next</th><th>Due</th><th>Flags</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function cover() { if (S.cover === 0) { S.cover = 1; render(); } }
function take() { if (S.cover === 1) { S.cover = 2; render(); } }
function replay() {
  clearLater(); S.cover = 0; render(); settle();
  /* the moment: Nkechi puts Kai's magnet beside Grace's on B-11 (offered); Kai takes it and the row's tint clears */
  later(cover, ms('--motion-run') - ms('--motion-calm'));
  later(take, ms('--motion-run') + ms('--motion-calm'));
}
onKeys({ r: replay, c: cover, t: take });
replay();
</script>
</body>
</html>
