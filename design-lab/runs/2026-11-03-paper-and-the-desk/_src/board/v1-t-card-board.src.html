<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Team board V1 · The T-card board</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: one row per person, one slot per job they may hold. empty slots are the team's capacity, seen at a glance ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--measure-rail) + var(--space-5));gap:var(--space-5)}
.left{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-3);min-height:0}
.head{display:flex;align-items:flex-end;gap:var(--space-5)}
.head .cap{margin-left:auto;text-align:right}
.head .cap b{font:200 var(--type-title-s)/1 var(--font-sans);color:var(--light)}
.grid{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-7)) repeat(var(--n),minmax(0,1fr));gap:var(--space-2);align-content:start}
.pr{display:grid;gap:2px;align-content:center;padding-right:var(--space-2);border-right:1px solid var(--hairline)}
.pr .nm{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-meta);color:var(--light)}
.pr .rl{font-size:var(--type-small);color:var(--ink-muted)}
.row-off{background:var(--x-proposed-unseen);border-radius:var(--radius-key)}
.cell{min-height:calc(var(--target-md) + var(--space-1));display:grid}
.cell .slot{height:100%}
.colh{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);color:var(--ink-muted);text-transform:uppercase;padding-bottom:var(--space-1);border-bottom:1px solid var(--hairline-strong)}
.side{display:flex;flex-direction:column;gap:var(--space-4);border-left:1px solid var(--hairline);padding-left:var(--space-5);min-height:0}
.waiting{display:grid;gap:var(--space-2)}
.foot{display:flex;gap:var(--space-5);font-size:var(--type-small);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.foot span{display:inline-flex;gap:var(--space-2);align-items:center}
.ghostslot{border:1px dashed var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
@media (max-width:1400px){.grid{grid-template-columns:calc(var(--space-8) + var(--space-4)) repeat(var(--n),minmax(0,1fr))}.cell{min-height:var(--target-md)}.tcard .tc-t{font-size:var(--x-proposed-type-micro)}.pr .rl{display:none}.foot{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Team board · V1</b> the T-card board: a row per person, a slot per job they may hold; empty slots are capacity · T-card planning boards, Toyota's kanban</div>
<script>
/*@DATA@*/
/*@LIB@*/
const N = B.slotsEach;
const S = { placed: false };
const waiting = () => B.jobs.filter(j => !j.holder && !(S.placed && j.id === 'J-417'));
const TO = 'sol';
function rowHTML(id, r) {
  const p = P(id), pr = presence(id);
  let js = jobsOf(id).slice().sort((a, b) => a.h - b.h);
  if (S.placed && id === TO) js = js.concat([{ ...B.jobs.find(j => j.id === 'J-417'), holder: TO, moved: true }]);
  const off = p.in === 'off';
  const cells = Array.from({ length: N }, (_, i) => `<div class="cell">${js[i] ? tcard(js[i], { i: r + i, cls: (js[i].moved ? 'moved ' : '') + (off ? 'held-away' : '') }) : `<div class="slot ${off ? 'off' : ''}">${off ? 'away' : ''}</div>`}</div>`).join('');
  return `<div class="pr" data-tier="${p.floor}"><span class="nm">${ini(id, 'sm')}${p.name}</span><span class="rl">${p.role}</span><span class="pres ${pr.cls}">${pr.w}</span></div>${cells}`;
}
function render() {
  const total = B.slotsEach * DATA.team.length;
  const used = B.jobs.filter(j => j.holder).length + (S.placed ? 1 : 0);
  const avail = DATA.team.filter(id => P(id).in !== 'off').reduce((a, id) => a + N - jobsOf(id).length - (S.placed && id === TO ? 1 : 0), 0);
  const g = DATA.team.filter(id => P(id).in === 'off');
  $('#app').innerHTML = topHTML(['Team', F('team').name, 'Board'], [['P', 'place the waiting card'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap"><div class="left">
      <div class="head"><div><p class="eyebrow">${F('team').name} · ${B.rule}</p><h1 class="t" style="margin-top:var(--space-1)">Who holds what</h1></div>
        <div class="cap"><b>${avail}</b><p class="note">empty slots with people in today</p></div></div>
      <div class="grid scroll" style="--n:${N}"><span></span>${Array.from({ length: N }, (_, i) => `<span class="colh">slot ${i + 1}</span>`).join('')}${DATA.team.map(rowHTML).join('')}</div>
      <div class="foot"><span>${I('square-dashed', 14)} empty slot: room to take one more</span><span>hatched: held by someone who is away</span><span>${used} of ${total} slots in use</span></div></div>
      <aside class="side"><div><p class="eyebrow">Not held by anyone</p><p class="note" style="margin-top:var(--space-1)">A job nobody holds waits here, in plain sight, with how long it has waited.</p></div>
        <div class="waiting">${waiting().map(j => tcard(j, { foot: 'waiting ' + j.waiting })).join('') || `<p class="note">Nothing is waiting. ${S.placed ? 'C-10’s survey went to ' + P(TO).name + ' at ' + DATA.now.time + '.' : ''}</p>`}</div>
        ${g.map(id => `<div class="panel" style="display:grid;gap:var(--space-2)"><p class="why">${I('user-x', 14)}<span><b style="font-weight:400;color:var(--ink)">${P(id).name} is ${P(id).away}</b> and holds ${plural(jobsOf(id).length, 'job')}. ${jobsOf(id).filter(j => j.h < 8).map(j => j.t + ' at ' + j.home).join(', ')} is due today.</span></p><p class="note">Her cards stay in her row until someone takes them, so nothing vanishes. ${P('nkechi').name} can hand them on.</p></div>`).join('')}
        ${DATA.team.filter(id => P(id).in !== 'off' && P(id).away).map(id => `<div class="panel" style="display:grid;gap:var(--space-2)"><p class="why">${I('calendar-off', 14)}<span><b style="font-weight:400;color:var(--ink)">${P(id).name} is ${P(id).away}</b> and holds ${plural(jobsOf(id).length, 'job')} due while away (${jobsOf(id).map(j => j.home + ' ' + j.due).join(', ')}).</span></p><p class="note">Shown now, a day ahead, so they can be handed over in person rather than found on Thursday.</p></div>`).join('')}
      </aside></div></main>`;
  Icons.hydrate($('#app'));
}
function place() { if (!S.placed) { S.placed = true; render(); } }
function replay() {
  clearLater(); S.placed = false; render(); settle();
  /* the moment: the waiting survey goes into an empty slot in Sol's row; the count of empty slots drops by one */
  later(place, ms('--motion-run'));
}
onKeys({ r: replay, p: place });
replay();
</script>
</body>
</html>
