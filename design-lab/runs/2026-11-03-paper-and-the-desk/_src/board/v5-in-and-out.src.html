<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Team board V5 · In and out</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: the office in-and-out board, joined to what each person holds. a hold by someone who is away is the board's one warning ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-6)}
.left{display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4);min-height:0}
.rows{display:grid;gap:var(--space-1);align-content:start}
.io{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-6)) calc(var(--space-8) * 2.4) minmax(0,1fr);gap:var(--space-4);align-items:center;padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);background:var(--surface-inset);border:1px solid transparent}
.io.warn{border-color:color-mix(in srgb,var(--x-proposed-past) 45%,transparent)}
.io.soon{border-color:color-mix(in srgb,var(--x-proposed-disagree) 40%,transparent);border-style:dashed}
.nm{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-meta);color:var(--light)}
/* the sliding magnet track: IN | OUT | OFF; the magnet sits in one column */
.trk{position:relative;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--hairline);border-radius:var(--radius-pill);height:var(--space-5)}
.trk span{display:flex;align-items:center;justify-content:center;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);color:var(--ink-muted)}
.trk .m{position:absolute;top:2px;bottom:2px;width:calc(33.33% - 4px);left:calc(var(--pos) * 33.33% + 2px);border-radius:var(--radius-pill);background:var(--x-proposed-strip);border:1px solid var(--hairline-strong);display:flex;align-items:center;justify-content:center;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--light);transition:left var(--motion-calm) var(--ease-out)}
.trk .m.off{border-color:var(--x-proposed-past);color:var(--x-proposed-past)}
.hold{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
.chip{display:inline-flex;gap:var(--space-1);align-items:center;padding:2px var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink);font-size:var(--type-small);white-space:nowrap}
.chip.hot{border-color:var(--x-proposed-past);color:var(--x-proposed-past)}
.chip.give{border-style:dashed;border-color:var(--x-proposed-lit);color:var(--x-proposed-lit)}
.where{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted);grid-column:3}
.side{display:flex;flex-direction:column;gap:var(--space-4);border-left:1px solid var(--hairline);padding-left:var(--space-5)}
.side .big{font:200 var(--type-display)/1 var(--font-sans);color:var(--light);margin:0}
@media (max-width:1400px){.io{grid-template-columns:calc(var(--space-8) + var(--space-4)) calc(var(--space-8) * 2) minmax(0,1fr);gap:var(--space-3)}.wrap{grid-template-columns:minmax(0,1fr) calc(var(--measure-rail) + var(--space-5))}.side .big{font-size:var(--type-title)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Team board · V5</b> in and out: the office in-and-out board joined to what each person holds; holding while away is its one warning · in/out boards, ward staffing boards</div>
<script>
/*@DATA@*/
/*@LIB@*/
const POS = { in: 0, out: 1, off: 2 };
const S = { sick: false, given: false };
/* Grace's magnet starts at IN (the board as it was at 08:00); the moment slides it to OFF */
function state(id) { if (id === 'grace' && !S.sick) return { cls: 'in', w: 'in' }; return presence(id); }
function rowHTML(id, i) {
  const p = P(id), st = state(id), off = st.cls === 'off';
  const js = jobsOf(id);
  const items = DATA.items.filter(x => x.holder === id && !x.to).length;
  const due = js.filter(j => j.h < 8);
  const soon = !off && p.away;
  const chips = js.map(j => S.given && j.id === 'J-405' ? `<span class="chip give">${I(JK(j.kind).icon, 12)}${j.home} ${j.due} → ${P('kai').ini}</span>` : `<span class="chip ${off && j.h < 8 ? 'hot' : ''}">${I(JK(j.kind).icon, 12)}${j.home} ${j.due}</span>`).join('') + (S.given && id === 'kai' ? `<span class="chip give">${I(JK(B.jobs.find(j => j.id === 'J-405').kind).icon, 12)}${B.jobs.find(j => j.id === 'J-405').home} today · offered by ${first('nkechi')}</span>` : '');
  return `<div class="io dep ${off && js.length ? 'warn' : ''} ${soon ? 'soon' : ''}" style="--i:${i}"><span class="nm">${ini(id, 'sm')}${p.name}</span>
    <span class="trk"><span>in</span><span>out</span><span>off</span><span class="m ${off ? 'off' : ''}" style="--pos:${POS[st.cls]}">${st.cls}</span></span>
    <span class="hold">${chips || 'holds nothing'}${items ? `<span class="chip">${I('inbox', 12)}${items} more in their bay</span>` : ''}</span>
    <span class="where">${off ? (js.length ? `holds ${plural(js.length, 'job')} while ${p.away}${due.length ? ' · ' + due.length + ' due today' : ''}` : p.away) : soon ? `${p.away} · ${plural(js.length, 'job')} due while away` : st.cls === 'out' ? p.where : ''}</span></div>`;
}
function render() {
  const warn = DATA.team.filter(id => state(id).cls === 'off' && jobsOf(id).filter(j => !(S.given && j.id === 'J-405')).length);
  const dueAway = DATA.team.filter(id => state(id).cls === 'off').flatMap(id => jobsOf(id).filter(j => j.h < 8 && !(S.given && j.id === 'J-405')));
  $('#app').innerHTML = topHTML(['Team', F('team').name, 'In and out'], [['G', 'hand on the job due today'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap"><div class="left">
      <div><p class="eyebrow">${F('team').name} · ${DATA.now.day}</p><h1 class="t" style="margin-top:var(--space-1)">In and out</h1></div>
      <div class="rows scroll">${DATA.team.map(rowHTML).join('')}</div></div>
      <aside class="side"><p class="eyebrow">Held by someone who is away</p><p class="big">${dueAway.length}</p>
        <p class="note">${dueAway.length ? `due today and held by someone who is off: <b>${dueAway.map(j => j.t + ', ' + j.home).join('; ')}</b>.` : 'Nothing due today is held by someone who is off.'}</p>
        ${S.sick && !S.given ? `<button class="btn go" data-g>${I('hand-helping', 14)} Offer ${B.jobs.find(j => j.id === 'J-405').home} to ${P('kai').name}, who is in <span class="kbd">G</span></button><p class="note">Only Nkechi Bello, as team lead, can hand on someone else’s job. Grace is told when she is back; the stub stays in her book.</p>` : ''}
        ${S.given ? `<p class="note">Offered to Kai at ${DATA.now.time}. It is still Grace’s until he reads it back; Nkechi answers for it meanwhile.</p>` : ''}
        <p class="note" style="margin-top:auto">This is the board’s only warning. Everything else on it is just where people are and what they hold, and it stays quiet.</p></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
  $('[data-g]') && ($('[data-g]').onclick = give);
}
function give() { if (S.sick && !S.given) { S.given = true; render(); } }
function replay() {
  clearLater(); S.sick = false; S.given = false; render(); settle();
  /* the moment: Grace's magnet slides to OFF; her row and the one count on the right light up with what she holds */
  later(() => { S.sick = true; render(); const m = $$('.trk .m')[DATA.team.indexOf('grace')]; m.style.setProperty('--pos', 0); requestAnimationFrame(() => requestAnimationFrame(() => m.style.setProperty('--pos', 2))); }, ms('--motion-run'));
}
onKeys({ r: replay, g: give });
replay();
</script>
</body>
</html>
