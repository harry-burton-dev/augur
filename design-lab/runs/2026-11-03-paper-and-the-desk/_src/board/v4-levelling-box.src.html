<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Desk · Team board V4 · The levelling box</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: a pigeonhole per day and kind, sized to what the team can do. too much for a day sticks out of the box ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.box{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-4)) repeat(var(--d),minmax(0,1fr));gap:var(--space-3);align-content:start}
.dh{display:grid;gap:2px;border-bottom:1px solid var(--hairline-strong);padding-bottom:var(--space-2)}
.dh b{font-weight:400;font-size:var(--type-meta);color:var(--light)}
.dh small{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.dh.today b{color:var(--x-proposed-lit)}
.kh{display:grid;gap:2px;align-content:start;padding-top:var(--space-2)}
.kh .k{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-meta);color:var(--light)}
.kh small{font-size:var(--type-small);color:var(--ink-muted)}
/* the hole: exactly as many slots as the team can do that day; overflow sits below the rim, outside */
.hole{display:grid;gap:var(--space-1);align-content:start}
.rim{display:grid;gap:var(--space-1);padding:var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--surface-inset)}
.rim .slot{min-height:calc(var(--target-md) - var(--space-1))}
.rim.full{border-color:var(--hairline-strong)}
.over{display:grid;gap:var(--space-1);padding:var(--space-1);border:1px dashed var(--x-proposed-disagree);border-radius:var(--radius-key)}
.over .lab{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--x-proposed-disagree)}
.tcard .who{display:flex;gap:var(--space-1);align-items:center;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.foot{display:flex;gap:var(--space-4);align-items:flex-start;border-top:1px solid var(--hairline);padding-top:var(--space-3)}
@media (max-width:1400px){.box{grid-template-columns:var(--space-8) repeat(var(--d),minmax(0,1fr));gap:var(--space-2)}.kh small{display:none}.tcard .tc-t{font-size:var(--x-proposed-type-micro)}.rim .slot{min-height:var(--target-sm)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Team board · V4</b> the levelling box: a hole per day and kind, sized to what the team can do; too much for a day sticks out below the rim · heijunka box (Toyota), post-room sorting frames</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { pulled: false };
const MOVE = { job: 'J-415', to: 'Thu' };
const dayOf = j => S.pulled && j.id === MOVE.job ? MOVE.to : j.due;
function cell(kind, day, ki, di) {
  const js = B.jobs.filter(j => j.kind === kind && dayOf(j) === day.id), cap = B.perDay[kind];
  const inBox = js.slice(0, cap), over = js.slice(cap);
  const c = j => tcard(j, { i: ki + di, cls: S.pulled && j.id === MOVE.job ? 'moved' : '', foot: `<span class="who">${j.holder ? ini(j.holder, 'sm') + ' ' + first(j.holder) : 'nobody holds it'}</span>` });
  return `<div class="hole"><div class="rim ${inBox.length >= cap ? 'full' : ''}">${Array.from({ length: cap }, (_, i) => inBox[i] ? c(inBox[i]) : '<div class="slot">room</div>').join('')}</div>
    ${over.length ? `<div class="over"><span class="lab">${over.length} more than the team can do ${day.w}</span>${over.map(c).join('')}</div>` : ''}</div>`;
}
function render() {
  const kinds = Object.keys(B.perDay);
  const overs = B.days.flatMap(d => kinds.filter(k => B.jobs.filter(j => j.kind === k && dayOf(j) === d.id).length > B.perDay[k]).map(k => `${JK(k).w.toLowerCase()} on ${d.w}`));
  $('#app').innerHTML = topHTML(['Team', F('team').name, 'Board'], [['M', 'pull C-14 mould wash to Thu'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div><p class="eyebrow">${F('team').name} · by the day it is due</p><h1 class="t" style="margin-top:var(--space-1)">The levelling box</h1></div>
      <div class="box scroll" style="--d:${B.days.length}"><span></span>${B.days.map(d => `<div class="dh ${d.sub ? 'today' : ''}"><b>${d.w}</b><small>${d.sub || ''}</small></div>`).join('')}
        ${kinds.map((k, ki) => `<div class="kh"><span class="k">${I(JK(k).icon, 16)}${JK(k).w}</span><small>${B.perDay[k]} a day</small></div>${B.days.map((d, di) => cell(k, d, ki, di)).join('')}`).join('')}</div>
      <div class="foot">${I('info', 16)}<p class="note">Each hole holds exactly what the team can do that day, from who does that kind of work. A job due on a full day isn’t squeezed in or hidden: it sits below the rim, outside the box, until someone moves it to a day with room or takes on more. ${overs.length ? `<b>Over today: ${overs.join(', ')}.</b>` : 'Nothing is over.'}</p></div>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function pull() { if (!S.pulled) { S.pulled = true; render(); } }
function replay() {
  clearLater(); S.pulled = false; render(); settle();
  /* the moment: C-14's mould wash is pulled forward to Thursday, which already has two repairs; it lands below the rim */
  later(pull, ms('--motion-run'));
}
onKeys({ r: replay, m: pull });
replay();
</script>
</body>
</html>
