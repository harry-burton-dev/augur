      views: [

        { app: 'Explorer', icon: 'telescope', what: 'Saved views over Jobs', effect: 'Keep working; their titles are theirs to change.', n: 3 }

  ],
  /* sample sites (records) and what each holds of the new detail */
  records: [

    { name: 'Kellmoor Library', area: '920 m²', contract: null, floor: 'org', addr: 'Market Square, Kellmoor', manager: 'Ruth Adeyemi', opened: '1961', fill: { state: 'keeper', who: 'Ruth Adeyemi' } },
    { name: 'Ashgate Leisure Centre', area: '3,400 m²', contract: 'Ashgate facilities contract', floor: 'department', addr: 'Ashgate Lane', manager: 'Tom Birch', opened: '2009', fill: { state: 'doc', value: '2 Dec 2026', src: 'Ashgate FRA review.docx', srcFloor: 'department' } },
    { name: 'Brindle Street Offices', area: null, contract: 'Brindle St lease', floor: 'department', addr: '40 Brindle Street', manager: null, opened: '1984', fill: { state: 'nobody', ask: 'Dana Okafor' } },
    { name: 'Old Quarry Recycling', area: '610 m²', contract: 'Waste services 2024', floor: 'team', addr: 'Quarry Road', manager: 'Lee Hart', opened: '2014', fill: { state: 'keeper', who: 'Lee Hart' } },
    { name: 'Fenwick Day Centre', area: '480 m²', contract: null, floor: 'department', addr: '7 Fenwick Close', manager: 'Amira Khan', opened: '2001', fill: { state: 'filled', value: '20 Jan 2027', src: 'Entered by Amira Khan', srcFloor: 'you', at: '10:12' } },

  vehicles: [

  ],
  workorders: [ { name: 'Boiler service, plant room 2', ref: 'WO-31877', site: 'Ashgate Leisure Centre', by: 'Calder Heating Ltd', status: 'Done' } ],
  words: {
    kind: ['kind of thing', 'class'], detail: ['detail', 'property'], link: ['link', 'object property'],
    record: ['record', 'entity / individual'], gap: ['gap', 'missing expected value'], keeper: ['keeper', 'steward']

};

/* ---- helpers shared by every variant ---- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ms = n => parseFloat(cssv(n)) || 0;                 /* motion token in ms */
const px = n => { const v = cssv(n); return v.endsWith('rem') ? parseFloat(v) * 16 : parseFloat(v) || 0; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const kindOf = id => DATA.kinds.find(k => k.id === id);
const fl = f => `<span class="fl f-${DATA.floors[f].tok}">${esc(DATA.floors[f].label)} · ${esc(DATA.floors[f].name)}</span>`;
const fmtWhen = s => { const d = new Date(s.slice(0, 10) + 'T12:00:00'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + (s.length > 10 ? ' · ' + s.slice(11) : ''); };
const ic = (n, s = 16) => Icons.svg(n, { size: s });
let timers = [];
const later = (fn, t) => timers.push(setTimeout(fn, t));
const clearLater = () => { timers.forEach(clearTimeout); timers = []; };
function keys(list) {
  $('#keys').innerHTML = list.map(([a, b]) => `<span>${a.split(' ').map(x => x === 'or' ? 'or' : `<span class="kbd">${esc(x)}</span>`).join(' ')} ${esc(b)}</span>`).join('');
}
function rail(foot) {
  $('#appname').textContent = DATA.app;
  $('#navs').innerHTML = DATA.nav.map(n => `<a class="nav${n.on ? ' on' : ''}" href="#"><i data-lucide="${n.icon}" data-size="16"></i>${esc(n.label)}${n.n != null ? `<span class="n">${n.n}</span>` : ''}</a>`).join('');
  if (foot) $('#railfoot').innerHTML = foot;
}
/* why-panes for anything that explains itself */
const TIPS = {};
function tip(el) { const p = $('#tip'), k = el.dataset.tip; if (!TIPS[k]) return; p.innerHTML = TIPS[k](el); const r = el.getBoundingClientRect(), g = px('--space-3');
  p.style.left = Math.max(g, Math.min(innerWidth - p.offsetWidth - g, r.left + r.width / 2 - p.offsetWidth / 2)) + 'px';
  const top = r.bottom + g; p.style.top = (top + p.offsetHeight > innerHeight - g ? r.top - g - p.offsetHeight : top) + 'px'; p.classList.add('on'); Icons.hydrate(p); }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) tip(el); });
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) $('#tip').classList.remove('on'); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) tip(el); else $('#tip').classList.remove('on'); });
function boot(demo, onKey) {
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ((e.key === 'r' || e.key === 'R') && e.target.tagName !== 'INPUT') { $('#tip').classList.remove('on'); clearLater(); return demo(); }
    if (onKey) onKey(e);
  });
  Icons.hydrate();
  document.fonts.ready.then(demo);
}
/* the gap mark: who could fill this, in plain words */
function gapMark(rec, short) {
  const f = rec.fill, ch = DATA.changes[0].fillers;
  if (f.state === 'filled') return `<span class="mono">${esc(f.value)}</span>`;
  if (f.state === 'doc') return `<span class="gap doc" data-tip="doc" data-r="${esc(rec.name)}">${ic('file-search', 14)}<span>${short ? '' : 'Not filled · '}<b>${esc(f.value)}?</b> read from a document</span></span>`;
  if (f.state === 'keeper') return `<span class="gap keeper" data-tip="keeper" data-r="${esc(rec.name)}">${ic('user-check', 14)}<span>${short ? '' : 'Not filled · '}<b>${esc(f.who)}</b> can fill</span></span>`;
  return `<span class="gap nobody" data-tip="nobody" data-r="${esc(rec.name)}">${ic('circle-help', 14)}<span>${short ? '' : 'Not filled · '}<b>nobody yet</b>, ${esc(f.ask)} asked</span></span>`;
}
const recBy = el => DATA.records.find(r => r.name === el.dataset.r);
TIPS.doc = el => { const r = recBy(el), c = DATA.changes[0]; return `<div class="micro">Gap · ${esc(c.detail.word)}</div><div class="t">${esc(c.fillers.fromDocs.word)}</div><p><b>${esc(r.fill.value)}</b> was read from <b>${esc(r.fill.src)}</b> in Artifacts.</p><p class="m">${esc(c.fillers.fromDocs.how)} Until then it is not shown as known.</p>`; };
TIPS.keeper = el => { const r = recBy(el), c = DATA.changes[0]; return `<div class="micro">Gap · ${esc(c.detail.word)}</div><div class="t">${esc(r.fill.who)} can fill this</div><p>They manage ${esc(r.name)}. ${esc(c.fillers.keepers.how)}</p><p class="m">Anyone can propose a value; it waits in Triage for them.</p>`; };
TIPS.nobody = el => { const r = recBy(el), c = DATA.changes[0]; return `<div class="micro">Gap · ${esc(c.detail.word)}</div><div class="t">${esc(c.fillers.nobody.word)}</div><p>${esc(r.name)} has no manager on record, so no one is asked by default.</p><p class="m">${esc(c.fillers.nobody.how)} You can propose a value now.</p>`; };
/* every detail a site record could hold, older gaps included, then the new one */
function siteRows(rec, short) {
  const d = DATA.details.site, c = DATA.changes[0];
  const old = (txt) => `<span class="gap" data-tip="oldgap">${ic('user-check', 14)}<span>Not filled · <b>${esc(txt)}</b> can fill</span></span>`;
  const val = { 'Address': esc(rec.addr), 'Opened': `<span class="mono">${esc(rec.opened)}</span>`,
    'Manager': rec.manager ? `<span class="lnk">${esc(rec.manager)}</span>` : `<span class="gap nobody" data-tip="nomgr">${ic('circle-help', 14)}<span>Not filled · <b>nobody yet</b></span></span>`,
    'Floor area': rec.area ? `<span class="mono">${esc(rec.area)}</span>` : old(DATA.floors.department.name + ' keepers'),
    'Runs from': rec.contract ? `<span class="lnk">${esc(rec.contract)}</span>` : old(DATA.floors.department.name + ' keepers') };
  return d.map(x => ({ word: x.word, tech: x.tech, html: val[x.word], link: x.link }))
    .concat([{ word: c.detail.word, tech: c.detail.tech, html: gapMark(rec, short), isNew: true }]);
}
TIPS.oldgap = () => `<div class="micro">Gap</div><div class="t">Expected, not filled yet</div><p>Every site is expected to hold this. Keepers on the ${esc(DATA.floors.department.label)} floor can fill it.</p><p class="m">Anyone can propose a value; it waits in Triage.</p>`;
TIPS.nomgr = () => `<div class="micro">Gap · Manager</div><div class="t">No manager on record</div><p>${esc(DATA.changes[0].fillers.nobody.how)}</p>`;

const C = DATA.changes[0], NG = DATA.newGroup, G = DATA.groups;
let sel = C.kind, tech = false;
function cellFor(k, g) {
  const ds = (DATA.details[k.id] || []).filter(d => d.g === g.id);
  if (!ds.length) return `<div class="cell none" role="gridcell" data-tip="none" data-k="${k.id}" data-g="${g.id}"><span class="sr">nothing expected</span></div>`;
  return `<div class="cell" role="gridcell">${ds.map(d => `<span class="w">${esc(d.word)}</span><span class="bar"><i class="${d.fill < .6 ? 'lo' : ''}" style="width:${d.fill * 100}%"></i></span>`).join('')}</div>`;
}
function newCell(k) {
  const g = C.gaps;
  if (k.id === C.kind) {
    const seg = [['filled', g.filled], ['doc', g.fromDocs], ['keep', g.keepers], ['nobody', g.nobody]].map(([c, n]) => `<i class="s-${c}" style="flex:${n}"></i>`).join('');
    return `<button class="cell nc hit${sel === k.id ? ' sel' : ''}" role="gridcell" data-k="${k.id}"><span class="w">${esc(C.detail.word)}</span><span class="seg3">${seg}</span><span class="ghost">${g.filled} of ${g.total} filled</span></button>`;
  }
  const a = NG.lookAlike.find(x => x.kind === k.id);
  if (a) return `<button class="cell nc alike${sel === k.id ? ' sel' : ''}" role="gridcell" data-k="${k.id}"><span class="ghost">similar?</span><span class="w">${esc(a.detail)}?</span></button>`;
  return `<div class="cell nc none" role="gridcell"></div>`;
}
function render() {
  const tbl = $('#tbl');
  tbl.style.setProperty('--cols', G.length);
  tbl.innerHTML = `<div class="gh micro">Kind of thing</div>` + G.map(g => `<div class="gh micro">${esc(g.word)}</div>`).join('')
    + `<div class="gh new micro"><span>${ic('sparkle', 12)} ${esc(NG.word)}</span><span>new · ${esc(fmtWhen(C.when).split(' ·')[0])}</span><span class="tech">${esc(NG.tech)}</span></div>`
    + DATA.kinds.map(k => `<div class="kh${sel === k.id ? ' sel' : ''}">${ic(k.icon, 16)}<span>${esc(k.plural)}</span><span class="n">${k.count.toLocaleString('en-GB')}</span><span data-tip="floor" data-f="${k.floor}">${fl(k.floor)}</span><span class="tech">${esc(k.tech)}</span></div>`
      + G.map(g => cellFor(k, g)).join('') + newCell(k)).join('');
  $$('.nc[data-k]', tbl).forEach(b => b.onclick = () => pick(b.dataset.k));
  Icons.hydrate(tbl);
}
TIPS.floor = el => `<div class="micro">Kept on</div><div class="t">${esc(DATA.floors[el.dataset.f].label)} · ${esc(DATA.floors[el.dataset.f].name)}</div><p class="m">Records of this kind are made on this floor and seen from it and the floors below.</p>`;
TIPS.none = el => `<div class="micro">Not expected</div><div class="t">${esc(kindOf(el.dataset.k).plural)} keep nothing under “${esc(G.find(g => g.id === el.dataset.g).word)}”</div><p class="m">This is not a gap: no record is missing anything here. A gap has a dashed edge and says who can fill it.</p>`;
function drawer() {
  const d = $('#drawer'), k = kindOf(sel), g = C.gaps;
  if (sel === C.kind) {
    d.innerHTML = `<div><div class="micro">New column · ${esc(NG.word)} · ${esc(fmtWhen(C.when))} by ${esc(C.by)}</div><h2>${esc(k.plural)} now keep “${esc(C.detail.word)}”</h2>
      <p>${esc(C.why)}</p><p class="m x-opt">${esc(NG.word)}: ${esc(NG.note.toLowerCase())}.</p><p class="m">${esc(C.noLoss)}</p>
      <p class="m x-opt">Asked for by ${esc(C.asked.by)} in Mandate: “${esc(C.asked.intent)}”.</p></div>
      <ul class="legend"><li><i class="s-filled"></i><b>${g.filled}</b><span>filled</span></li>
      <li><i class="s-doc"></i><b>${g.fromDocs}</b><span>${esc(C.fillers.fromDocs.word)}<small>${esc(C.fillers.fromDocs.who)}. ${esc(C.fillers.fromDocs.how)}</small></span></li>
      <li><i class="s-keep"></i><b>${g.keepers}</b><span>${esc(C.fillers.keepers.word)}<small>${esc(C.fillers.keepers.who)}</small></span></li>
      <li><i class="s-nobody"></i><b>${g.nobody}</b><span>${esc(C.fillers.nobody.word)}<small>${esc(C.fillers.nobody.how)}</small></span></li></ul>`;
  } else {
    const a = NG.lookAlike.find(x => x.kind === sel);
    d.innerHTML = `<div><div class="micro">A gap in the table, not in the records</div><h2>${esc(k.plural)}: does “${esc(a.detail)}” belong under ${esc(NG.word)}?</h2>
      <p>The new column predicts it: “${esc(a.detail)}” is a date by which something must be checked again, like ${esc(C.detail.word.toLowerCase())}.</p>
      <p class="m">Nothing moves until ${esc(C.by)} decides. You can suggest it; the suggestion goes to whoever ${esc(DATA.admin.role.toLowerCase())}.</p></div>
      <div><p class="m">Today “${esc(a.detail)}” sits under When. Moving it changes no record and no value, only where it is filed in this table.</p><button class="btn" data-tip="suggest">${ic('send', 14)} Suggest it <span class="kbd">S</span></button></div>`;
  }
  Icons.hydrate(d); d.classList.add('on');
}
TIPS.suggest = () => `<div class="micro">Suggest</div><div class="t">Goes to ${esc(C.by)}</div><p>A suggestion, not a change. You'll see the answer on this cell.</p>`;
function pick(k) { sel = k; render(); $('#tbl').classList.add('grow', 'focus'); if (tech) $('#tbl').classList.add('techon'); drawer(); }
function demo() {
  clearLater(); sel = null; render();
  const t = $('#tbl'); t.className = 'tbl' + (tech ? ' techon' : ''); $('#drawer').classList.remove('on');
  later(() => t.classList.add('grow'), reduced ? 0 : ms('--motion-run'));
  later(() => pick(C.kind), ms('--motion-run') + ms('--motion-run') + ms('--motion-calm'));
}
$('#crumb').textContent = DATA.app + ' · ' + DATA.org;
$('#ename').textContent = 'What we keep';
$('#esub').innerHTML = `${DATA.kinds.length} kinds of thing, the details each keeps, and how full they are. <b>One column is new since your last visit.</b>`;
rail(`The table is the same for everyone. A dot means <b>nothing expected</b>; a dashed edge means <b>expected, not filled yet</b>.`);
keys([['↑ ↓', 'kind in new column'], ['Esc', 'clear'], ['T', 'technical names'], ['R', 'replay']]);
boot(demo, e => {
  const order = [C.kind, ...NG.lookAlike.map(x => x.kind)];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const i = order.indexOf(sel); pick(order[(i + (e.key === 'ArrowDown' ? 1 : order.length - 1) + order.length) % order.length]); }
  if (e.key === 'Escape') { sel = null; render(); $('#tbl').classList.add('grow'); $('#tbl').classList.remove('focus'); $('#drawer').classList.remove('on'); }
  if (e.key === 't' || e.key === 'T') { tech = !tech; $('#tbl').classList.toggle('techon', tech); }
});
</script>
