/* ======================================================================

:root{
  --x-type-micro:.6875rem;                                                   /* --type-micro: mono eyebrows inside data (wear-and-time already proposes it) */
  --x-gap-ink:color-mix(in srgb,var(--ink-muted) 70%,transparent);            /* --mark-gap: the dashed edge of an expected-but-missing value */
  --x-gap-fill:color-mix(in srgb,var(--ink) 3%,transparent);                 /* --mark-gap-fill: a gap is a held place, faintly lit, not hatch */
  --x-hatch:color-mix(in srgb,var(--ink-muted) 34%,transparent);             /* --mark-stale-hatch (wear and time): 'no record', not a gap */
  --x-stale:repeating-linear-gradient(45deg,transparent 0 var(--space-1),var(--x-hatch) var(--space-1) calc(var(--space-1) + 1px));
  --x-new:color-mix(in srgb,var(--green) 70%,var(--ink));                    /* --mark-structure-new: the structure itself changed here */
  --x-new-wash:color-mix(in srgb,var(--green) 10%,transparent);
  --x-seam:color-mix(in srgb,var(--warning) 55%,var(--ink));                 /* --mark-seam (wear-and-time grammar V1) */
  --x-paper:color-mix(in srgb,var(--ink) 92%,var(--warning));             /* --surface-slip: a paper notice, the one light surface */
  --x-paper-ink:var(--slate-deep);
  --x-near-dim:.55;                                                          /* far plane when one thing is in focus */
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}

.keys{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:var(--layer-chrome);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-3);max-width:calc(100% - var(--measure-glance) - var(--space-6));font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}

/* ---- app frame ---- */

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-raised)}

/* ---- floors ---- */
.fl{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.fl::before{content:"";width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--c)}

/* ---- the gap: an expected detail a record doesn't hold yet ----

   from wear-and-time's 'no record' (hatch), which says nobody can know. */
.gap{display:inline-flex;align-items:center;gap:var(--space-2);min-height:calc(var(--space-5) - var(--space-1));padding:0 var(--space-2);border:1px dashed var(--x-gap-ink);border-radius:var(--radius-key);background:var(--x-gap-fill);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

.gap.nobody{border-color:color-mix(in srgb,var(--warning) 50%,transparent)}
.gap.nobody b{color:var(--warning)}
.gap.doc b{color:var(--ink)}
.newtag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-new);white-space:nowrap}

/* ---- why-pane ---- */
.tip{position:fixed;z-index:var(--layer-overlay);width:var(--measure-card);padding:var(--space-3) var(--space-4);background:var(--surface-overlay);-webkit-backdrop-filter:blur(var(--surface-blur));backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);opacity:0;pointer-events:none;transition:opacity var(--motion-quick) var(--ease-out)}
.tip.on{opacity:1}
.tip .t{margin:var(--space-1) 0;color:var(--light);font-size:var(--type-body);line-height:var(--leading-body)}
.tip p{margin:0 0 var(--space-1);font-size:var(--type-meta);line-height:var(--leading-meta)}
.tip p.m{color:var(--ink-muted)}

.fade{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
@media (prefers-reduced-motion: reduce){ .fade{transition:opacity var(--motion-base) linear!important;transform:none!important} }

/* ---- V3: every structural change leaves a seam where it touched the record ---- */
:root{
  --x-stitch:repeating-linear-gradient(90deg,var(--x-seam) 0 1px,transparent 1px var(--space-2));   /* --mark-stitch: cross-stitches on a seam */
  --x-seam-old:color-mix(in srgb,var(--x-seam) 45%,var(--ink-muted));         /* --mark-seam-aged: before your last visit */
}
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);max-width:calc(var(--measure-wide) + var(--space-8) * 2);align-items:start}
.card{position:relative;border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);padding:var(--space-3) var(--space-4) var(--space-2);transition:opacity var(--motion-slow) var(--ease-standard),filter var(--motion-slow) var(--ease-standard)}
.card .k{display:flex;align-items:center;gap:var(--space-2);color:var(--ink-muted)}
.card{overflow:hidden}
.card .k .was{font-family:var(--font-sans);text-transform:none;letter-spacing:var(--tracking-soft);font-size:var(--type-small);text-decoration:line-through;text-decoration-color:var(--x-seam-old);color:var(--ink-muted);opacity:.8}
.card .k .now{color:var(--ink)}
.card h2{margin:var(--space-1) 0 var(--space-2);font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:grid;grid-template-columns:calc(var(--space-8) - var(--space-3)) minmax(0,1fr);gap:var(--space-3);align-items:center;padding:var(--space-1) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);min-height:var(--target-sm)}
.row .w{color:var(--ink-muted)}
.row .w .tech{display:none} .techon .row .w .tech{display:block}
.row .gap{font-size:var(--type-small);max-width:100%}
.lnk{box-shadow:inset 0 -1px 0 var(--hairline-strong)}
/* the seam: a stitched line across the card where the structure changed it */
.seam{position:relative;display:flex;align-items:center;gap:var(--space-2);width:calc(100% + var(--space-4) * 2);margin:0 calc(var(--space-4) * -1);padding:0 var(--space-4);height:var(--space-4);color:var(--x-seam);cursor:help}

.seam .lab{position:relative;margin-left:auto;padding:0 var(--space-1);background:var(--slate-deep);border-radius:var(--radius-key);font:400 var(--x-type-micro)/var(--space-4) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;white-space:nowrap;opacity:0;transition:opacity var(--motion-base) var(--ease-out);transition-delay:calc(var(--i) * var(--motion-base) + var(--motion-calm))}
.seam.old{color:var(--x-seam-old)} .seam.old::before{--x-seam:var(--x-seam-old);opacity:.7}
.sewn .seam::before{clip-path:inset(0 0 0 0)}
.sewn .seam .lab{opacity:1}
.seam:focus-visible{outline-offset:0}
.recentonly .seam.old{visibility:hidden}
/* a kind gap: the record is not placed in a kind yet */
.kgap{display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border:1px dashed var(--x-gap-ink);border-radius:var(--radius-key);background:var(--x-gap-fill);font-size:var(--type-small);color:var(--ink)}
.wall.focus .card:not(.sel){opacity:var(--x-near-dim);filter:saturate(.6)}
.legend{display:flex;gap:var(--space-5);margin-bottom:var(--space-4);font-size:var(--type-small);color:var(--ink-muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:var(--space-2)}
.legend i.sw{display:inline-block;width:var(--space-6);height:var(--space-2);background:linear-gradient(var(--c),var(--c)) center/100% 1px no-repeat,repeating-linear-gradient(90deg,var(--c) 0 1px,transparent 1px var(--space-2))}
@media (max-width:1400px){ .wall{gap:var(--space-3)} .card{padding:var(--space-2) var(--space-3) var(--space-1)} .seam{width:calc(100% + var(--space-3) * 2);margin:0 calc(var(--space-3) * -1);padding:0 var(--space-3)} .row{grid-template-columns:calc(var(--space-7) + var(--space-2)) minmax(0,1fr)} }
@media (max-height:840px){ .main{padding-top:var(--space-4)} .head{margin-bottom:var(--space-2)} .row{min-height:calc(var(--target-sm) - var(--space-1));padding:0} .card h2{margin:0 0 var(--space-1)} }
@media (prefers-reduced-motion: reduce){ .seam::before{transition:opacity var(--motion-base) linear!important;clip-path:none!important;opacity:0} .sewn .seam::before{opacity:1} .seam.old::before{opacity:0} .sewn .seam.old::before{opacity:.7} }
</style>

        { app: 'Mandate', icon: 'target', what: 'Intents that name jobs in their wording', effect: 'Their words are theirs: owners are told, nothing is rewritten.', n: 6, warn: true },

  records: [

    { name: 'Kellmoor Library', area: '920 m²', contract: null, floor: 'org', addr: 'Market Square, Kellmoor', manager: 'Ruth Adeyemi', opened: '1961', fill: { state: 'keeper', who: 'Ruth Adeyemi' } },

    { name: 'Brindle Street Offices', area: null, contract: 'Brindle St lease', floor: 'department', addr: '40 Brindle Street', manager: null, opened: '1984', fill: { state: 'nobody', ask: 'Dana Okafor' } },
    { name: 'Old Quarry Recycling', area: '610 m²', contract: 'Waste services 2024', floor: 'team', addr: 'Quarry Road', manager: 'Lee Hart', opened: '2014', fill: { state: 'keeper', who: 'Lee Hart' } },
    { name: 'Fenwick Day Centre', area: '480 m²', contract: null, floor: 'department', addr: '7 Fenwick Close', manager: 'Amira Khan', opened: '2001', fill: { state: 'filled', value: '20 Jan 2027', src: 'Entered by Amira Khan', srcFloor: 'you', at: '10:12' } },

  ],

  words: {
    kind: ['kind of thing', 'class'], detail: ['detail', 'property'], link: ['link', 'object property'],
    record: ['record', 'entity / individual'], gap: ['gap', 'missing expected value'], keeper: ['keeper', 'steward']

};

/* ---- helpers shared by every variant ---- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ms = n => parseFloat(cssv(n)) || 0;                 /* motion token in ms */
const px = n => { const v = cssv(n); return v.endsWith('rem') ? parseFloat(v) * 16 : parseFloat(v) || 0; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const kindOf = id => DATA.kinds.find(k => k.id === id);
const fl = f => `<span class="fl f-${DATA.floors[f].tok}">${esc(DATA.floors[f].label)} · ${esc(DATA.floors[f].name)}</span>`;
const fmtWhen = s => { const d = new Date(s.slice(0, 10) + 'T12:00:00'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + (s.length > 10 ? ' · ' + s.slice(11) : ''); };
const ic = (n, s = 16) => Icons.svg(n, { size: s });
let timers = [];
const later = (fn, t) => timers.push(setTimeout(fn, t));
const clearLater = () => { timers.forEach(clearTimeout); timers = []; };
function keys(list) {
  $('#keys').innerHTML = list.map(([a, b]) => `<span>${a.split(' ').map(x => x === 'or' ? 'or' : `<span class="kbd">${esc(x)}</span>`).join(' ')} ${esc(b)}</span>`).join('');
}
function rail(foot) {
  $('#appname').textContent = DATA.app;
  $('#navs').innerHTML = DATA.nav.map(n => `<a class="nav${n.on ? ' on' : ''}" href="#"><i data-lucide="${n.icon}" data-size="16"></i>${esc(n.label)}${n.n != null ? `<span class="n">${n.n}</span>` : ''}</a>`).join('');
  if (foot) $('#railfoot').innerHTML = foot;
}
/* why-panes for anything that explains itself */
const TIPS = {};
function tip(el) { const p = $('#tip'), k = el.dataset.tip; if (!TIPS[k]) return; p.innerHTML = TIPS[k](el); const r = el.getBoundingClientRect(), g = px('--space-3');
  p.style.left = Math.max(g, Math.min(innerWidth - p.offsetWidth - g, r.left + r.width / 2 - p.offsetWidth / 2)) + 'px';
  const top = r.bottom + g; p.style.top = (top + p.offsetHeight > innerHeight - g ? r.top - g - p.offsetHeight : top) + 'px'; p.classList.add('on'); Icons.hydrate(p); }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) tip(el); });
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) $('#tip').classList.remove('on'); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) tip(el); else $('#tip').classList.remove('on'); });
function boot(demo, onKey) {
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ((e.key === 'r' || e.key === 'R') && e.target.tagName !== 'INPUT') { $('#tip').classList.remove('on'); clearLater(); return demo(); }
    if (onKey) onKey(e);
  });
  Icons.hydrate();
  document.fonts.ready.then(demo);
}
/* the gap mark: who could fill this, in plain words */
function gapMark(rec, short) {
  const f = rec.fill, ch = DATA.changes[0].fillers;
  if (f.state === 'filled') return `<span class="mono">${esc(f.value)}</span>`;
  if (f.state === 'doc') return `<span class="gap doc" data-tip="doc" data-r="${esc(rec.name)}">${ic('file-search', 14)}<span>${short ? '' : 'Not filled · '}<b>${esc(f.value)}?</b> read from a document</span></span>`;
  if (f.state === 'keeper') return `<span class="gap keeper" data-tip="keeper" data-r="${esc(rec.name)}">${ic('user-check', 14)}<span>${short ? '' : 'Not filled · '}<b>${esc(f.who)}</b> can fill</span></span>`;
  return `<span class="gap nobody" data-tip="nobody" data-r="${esc(rec.name)}">${ic('circle-help', 14)}<span>${short ? '' : 'Not filled · '}<b>nobody yet</b>, ${esc(f.ask)} asked</span></span>`;
}
const recBy = el => DATA.records.find(r => r.name === el.dataset.r);
TIPS.doc = el => { const r = recBy(el), c = DATA.changes[0]; return `<div class="micro">Gap · ${esc(c.detail.word)}</div><div class="t">${esc(c.fillers.fromDocs.word)}</div><p><b>${esc(r.fill.value)}</b> was read from <b>${esc(r.fill.src)}</b> in Artifacts.</p><p class="m">${esc(c.fillers.fromDocs.how)} Until then it is not shown as known.</p>`; };
TIPS.keeper = el => { const r = recBy(el), c = DATA.changes[0]; return `<div class="micro">Gap · ${esc(c.detail.word)}</div><div class="t">${esc(r.fill.who)} can fill this</div><p>They manage ${esc(r.name)}. ${esc(c.fillers.keepers.how)}</p><p class="m">Anyone can propose a value; it waits in Triage for them.</p>`; };
TIPS.nobody = el => { const r = recBy(el), c = DATA.changes[0]; return `<div class="micro">Gap · ${esc(c.detail.word)}</div><div class="t">${esc(c.fillers.nobody.word)}</div><p>${esc(r.name)} has no manager on record, so no one is asked by default.</p><p class="m">${esc(c.fillers.nobody.how)} You can propose a value now.</p>`; };
/* every detail a site record could hold, older gaps included, then the new one */
function siteRows(rec, short) {
  const d = DATA.details.site, c = DATA.changes[0];
  const old = (txt) => `<span class="gap" data-tip="oldgap">${ic('user-check', 14)}<span>Not filled · <b>${esc(txt)}</b> can fill</span></span>`;
  const val = { 'Address': esc(rec.addr), 'Opened': `<span class="mono">${esc(rec.opened)}</span>`,
    'Manager': rec.manager ? `<span class="lnk">${esc(rec.manager)}</span>` : `<span class="gap nobody" data-tip="nomgr">${ic('circle-help', 14)}<span>Not filled · <b>nobody yet</b></span></span>`,
    'Floor area': rec.area ? `<span class="mono">${esc(rec.area)}</span>` : old(DATA.floors.department.name + ' keepers'),
    'Runs from': rec.contract ? `<span class="lnk">${esc(rec.contract)}</span>` : old(DATA.floors.department.name + ' keepers') };
  return d.map(x => ({ word: x.word, tech: x.tech, html: val[x.word], link: x.link }))
    .concat([{ word: c.detail.word, tech: c.detail.tech, html: gapMark(rec, short), isNew: true }]);
}
TIPS.oldgap = () => `<div class="micro">Gap</div><div class="t">Expected, not filled yet</div><p>Every site is expected to hold this. Keepers on the ${esc(DATA.floors.department.label)} floor can fill it.</p><p class="m">Anyone can propose a value; it waits in Triage.</p>`;
TIPS.nomgr = () => `<div class="micro">Gap · Manager</div><div class="t">No manager on record</div><p>${esc(DATA.changes[0].fillers.nobody.how)}</p>`;

const CH = Object.fromEntries(DATA.changes.map(c => [c.type, c]));
const recent = c => c.when.slice(0, 10) > DATA.viewer.lastVisit;
const day = c => fmtWhen(c.when).split(' ·')[0];
let tech = false, n = 0;
const seam = (c, label) => `<button class="seam${recent(c) ? '' : ' old'}" style="--i:${n++}" data-tip="seam" data-c="${c.id}" aria-label="${esc(label)}: why"><span class="lab">${esc(label)} · ${esc(day(c))}</span></button>`;
const row = (w, html, t) => `<div class="row"><div class="w">${esc(w)}${t ? `<span class="tech">${esc(t)}</span>` : ''}</div><div>${html}</div></div>`;
function siteCard(r, opts = {}) {
  const k = kindOf('site'), add = CH['add-detail'], dk = CH['add-kind'];
  const rows = siteRows(r, true);
  const head = opts.depot ? `<div class="k micro">${ic(dk.newKind.icon, 14)}<span class="now">${esc(dk.newKind.word)}</span> · a kind of ${esc(k.word.toLowerCase())}</div>` : `<div class="k micro">${ic(k.icon, 14)}<span class="now">${esc(k.word)}</span></div>`;
  return `<article class="card" data-c="${opts.depot ? dk.id : add.id}">${head}<h2>${esc(r.name)}</h2>${opts.depot ? seam(dk, 'filed as ' + dk.newKind.word.toLowerCase()) : ''}`
    + rows.filter(x => !x.isNew).slice(0, 3).map(x => row(x.word, x.html, x.tech)).join('')
    + seam(add, 'added') + rows.filter(x => x.isNew).map(x => row(x.word, x.html, x.tech)).join('') + `</article>`;
}
function vehicleCard(v) {
  const sp = CH.split, k = kindOf('vehicle');
  const head = v.placed ? `<div class="k micro">${ic(k.icon, 14)}<span class="was">${esc(k.word)}</span><span class="now">${esc(v.placed)}</span></div>`
    : `<div class="k micro">${ic(k.icon, 14)}<span class="now">${esc(k.word)}</span></div>`;
  return `<article class="card" data-c="${sp.id}">${head}<h2>${esc(v.name)}</h2>${seam(sp, v.placed ? 'split from ' + k.word.toLowerCase() : 'not placed yet')}`
    + (v.placed ? '' : row('Which kind', `<span class="kgap" data-tip="kgap">${ic('circle-help', 14)} ${sp.into.map(x => esc(x.word.split(' ')[0])).join(' or ')}?</span>`))
    + row('Kept at', `<span class="lnk">${esc(v.kept)}</span>`) + row('MOT due', `<span class="mono">${esc(v.mot)}</span>`)
    + row(sp.by_detail, v.held ? esc(v.held) : `<span class="gap">${ic('user-check', 14)}<span>Not filled · <b>${esc(v.ask)}</b> can fill</span></span>`) + `</article>`;
}
function workCard(w) {
  const rn = CH.rename;
  return `<article class="card" data-c="${rn.id}"><div class="k micro">${ic(kindOf(rn.kind).icon, 14)}<span class="was">${esc(rn.from)}</span><span class="now">${esc(rn.to)}</span></div><h2>${esc(w.name)}</h2>${seam(rn, 'renamed')}`
    + row('Reference', `<span class="mono">${esc(w.ref)}</span>`) + row('At site', `<span class="lnk">${esc(w.site)}</span>`) + row('Done by', `<span class="lnk">${esc(w.by)}</span>`) + row('Status', esc(w.status)) + `</article>`;
}
TIPS.seam = el => {
  const c = DATA.changes.find(x => x.id === el.dataset.c), k = kindOf(c.kind);
  const what = { 'add-detail': `${k.plural} gained a detail: “${c.detail?.word}”.`, 'add-kind': `A new kind, “${c.newKind?.word}”, was made inside ${k.plural}. This record matched: ${c.newKind?.rule.toLowerCase()}.`,
    split: `“${k.word}” was split into ${c.into?.map(x => '“' + x.word + '”').join(' and ')}, by the detail “${c.by_detail}”.`, rename: `“${c.from}” is now called “${c.to}”. Nothing else changed.` }[c.type];
  return `<div class="micro">Seam · ${esc(fmtWhen(c.when))}${recent(c) ? ' · since your last visit' : ''}</div><div class="t">${esc(what)}</div><p>${esc(c.why)}</p><p class="m">By ${esc(c.by)}, who ${esc(DATA.admin.role.toLowerCase())}. No value on this record was changed or lost.</p>`;
};
TIPS.kgap = () => { const sp = CH.split; return `<div class="micro">Gap · which kind</div><div class="t">Not placed in a kind yet</div><p>“${esc(sp.by_detail)}” is empty, so the split couldn't tell. ${sp.unsure} vehicles are waiting like this.</p><p class="m">Fleet keepers can fill it; the record moves when they do. Until then it stays a plain vehicle and nothing is hidden.</p>`; };
function render() {
  n = 0; const R = DATA.records;
  $('#wall').innerHTML = siteCard(R[1]) + siteCard(R[0], { depot: true }) + workCard(DATA.workorders[0]) + vehicleCard(DATA.vehicles[0]) + vehicleCard(DATA.vehicles[1]) + siteCard(R[3]);
  Icons.hydrate($('#wall'));
}
function demo() {
  clearLater(); const w = $('#wall'); render(); w.className = 'wall' + (tech ? ' techon' : '');
  later(() => w.classList.add('sewn'), reduced ? 0 : ms('--motion-run'));
  later(() => { const s = $$('.seam')[1]; w.classList.add('focus'); s.closest('.card').classList.add('sel'); s.focus({ preventScroll: true }); }, ms('--motion-run') * 3);
}
document.addEventListener('focusin', e => { const c = e.target.closest('.card'); $$('.card').forEach(x => x.classList.toggle('sel', x === c)); $('#wall').classList.toggle('focus', !!c); });
$('#crumb').textContent = DATA.app + ' · Your records';
$('#ename').textContent = 'Records you look at';
const nRecent = DATA.changes.filter(recent).length;
$('#esub').innerHTML = `The kinds of thing changed <b>${nRecent} times since your last visit</b> (${esc(fmtWhen(DATA.viewer.lastVisit))}). Each change left a seam where it touched a record.`;
$('#legend').innerHTML = `<span><i class="sw" style="--c:var(--x-seam)"></i>since your last visit</span><span><i class="sw" style="--c:var(--x-seam-old)"></i>earlier</span><span><span class="gap">${ic('user-check', 14)}<span>dashed edge: expected, not filled yet</span></span></span>`;
rail(`Seams never fade away: a record keeps the history of its shape. Earlier seams are quieter. <b>Tab</b> to a seam to ask why.`);
keys([['Tab', 'next seam'], ['S', 'recent only'], ['T', 'technical names'], ['R', 'replay']]);
boot(demo, e => {
  if (e.key === 's' || e.key === 'S') $('#wall').classList.toggle('recentonly');
  if (e.key === 't' || e.key === 'T') { tech = !tech; $('#wall').classList.toggle('techon', tech); }
  if (e.key === 'Escape') { document.activeElement.blur(); $('#wall').classList.remove('focus'); $('#tip').classList.remove('on'); }
});
</script>
