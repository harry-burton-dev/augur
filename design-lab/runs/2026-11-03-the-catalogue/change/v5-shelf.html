/* ======================================================================
   Proposed tokens (combinations of kit tokens only). Listed in notes.md.
   ====================================================================== */
:root{
  --x-type-micro:.6875rem;                                                   /* --type-micro: mono eyebrows inside data (wear-and-time already proposes it) */
  --x-gap-ink:color-mix(in srgb,var(--ink-muted) 70%,transparent);            /* --mark-gap: the dashed edge of an expected-but-missing value */
  --x-gap-fill:color-mix(in srgb,var(--ink) 3%,transparent);                 /* --mark-gap-fill: a gap is a held place, faintly lit, not hatch */
  --x-hatch:color-mix(in srgb,var(--ink-muted) 34%,transparent);             /* --mark-stale-hatch (wear and time): 'no record', not a gap */
  --x-stale:repeating-linear-gradient(45deg,transparent 0 var(--space-1),var(--x-hatch) var(--space-1) calc(var(--space-1) + 1px));
  --x-new:color-mix(in srgb,var(--green) 70%,var(--ink));                    /* --mark-structure-new: the structure itself changed here */
  --x-new-wash:color-mix(in srgb,var(--green) 10%,transparent);
  --x-seam:color-mix(in srgb,var(--warning) 55%,var(--ink));                 /* --mark-seam (wear-and-time grammar V1) */
  --x-paper:color-mix(in srgb,var(--ink) 92%,var(--warning));             /* --surface-slip: a paper notice, the one light surface */
  --x-paper-ink:var(--slate-deep);
  --x-near-dim:.55;                                                          /* far plane when one thing is in focus */
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.micro{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.tech{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:0}
.kbd{display:inline-block;font:400 var(--x-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink);min-width:var(--space-4);text-align:center}
.keys{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:var(--layer-chrome);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-3);max-width:calc(100% - var(--measure-glance) - var(--space-6));font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}
.keys > span{display:inline-flex;align-items:center;gap:var(--space-1);white-space:nowrap}

/* ---- app frame ---- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr)}
.rail{background:color-mix(in srgb,var(--slate-deep) 70%,transparent);border-right:1px solid var(--hairline);padding:var(--edge) var(--edge-tight);display:flex;flex-direction:column;gap:var(--space-1);min-height:0}
.rail .an{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light);padding:var(--space-2);margin-bottom:var(--space-4)}
.nav{text-decoration:none;display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-meta);border-radius:var(--radius-key)}
.nav.on{background:var(--surface-raised);color:var(--ink)}
.nav .n{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono)}
.rail .foot{margin-top:auto;margin-bottom:var(--space-6);padding:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rail .foot b{font-weight:400;color:var(--ink)}
.main{position:relative;padding:var(--edge) var(--space-6) var(--space-7);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-4)}
.head h1{margin:var(--space-2) 0 var(--space-1);font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.head .sub{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.head .sub b{font-weight:400;color:var(--ink)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-raised)}
.btn.go{border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green)}
.btn.quiet{border-color:transparent;color:var(--ink-muted)}
.btn[aria-disabled="true"]{color:var(--ink-muted);border-style:dashed;cursor:help}

/* ---- floors ---- */
.fl{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.fl::before{content:"";width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--c)}
.f-org{--c:var(--floor-org-high)} .f-department{--c:var(--floor-department-high)} .f-team{--c:var(--floor-team-high)} .f-you{--c:var(--floor-you-high)}

/* ---- the gap: an expected detail a record doesn't hold yet ----
   A held place: dashed edge, faint fill, and who could fill it. Different
   from wear-and-time's 'no record' (hatch), which says nobody can know. */
.gap{display:inline-flex;align-items:center;gap:var(--space-2);min-height:calc(var(--space-5) - var(--space-1));padding:0 var(--space-2);border:1px dashed var(--x-gap-ink);border-radius:var(--radius-key);background:var(--x-gap-fill);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.gap b{font-weight:400;color:var(--ink)}
.gap.nobody{border-color:color-mix(in srgb,var(--warning) 50%,transparent)}
.gap.nobody b{color:var(--warning)}
.gap.doc b{color:var(--ink)}
.newtag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-new);white-space:nowrap}

/* ---- why-pane ---- */
.tip{position:fixed;z-index:var(--layer-overlay);width:var(--measure-card);padding:var(--space-3) var(--space-4);background:var(--surface-overlay);-webkit-backdrop-filter:blur(var(--surface-blur));backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);opacity:0;pointer-events:none;transition:opacity var(--motion-quick) var(--ease-out)}
.tip.on{opacity:1}
.tip .t{margin:var(--space-1) 0;color:var(--light);font-size:var(--type-body);line-height:var(--leading-body)}
.tip p{margin:0 0 var(--space-1);font-size:var(--type-meta);line-height:var(--leading-meta)}
.tip p.m{color:var(--ink-muted)}

.fade{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
@media (prefers-reduced-motion: reduce){ .fade{transition:opacity var(--motion-base) linear!important;transform:none!important} }

/* ---- V5: the shelf, before and after. Records are spines; a change re-shelves them in front of you ---- */
:root{
  --x-spine-max:var(--space-3);                                              /* 12: widest spine */
  --x-shelf-h:calc(var(--space-8) + var(--space-7));                         /* 188: tallest spine on the 'now' shelf */
  --x-ghost-h:calc(var(--space-7) - var(--space-3));                         /* 60: the 'before' shelf, small */
}
.modes{display:flex;gap:var(--space-1);padding:var(--space-1);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);flex:none}
.modes button{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink-muted)}
.modes button[aria-pressed="true"]{background:var(--surface-raised);color:var(--light);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.modes .kbd{opacity:.7}
.stage{display:flex;flex-direction:column;gap:var(--space-4);max-width:calc(var(--measure-wide) + var(--space-8) * 2)}
.lbl{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-2)}
#la{margin-bottom:var(--space-7)}
.sec .cap .mono{margin-left:var(--space-1)}
.head{margin-bottom:var(--space-5)}
.lbl b{font-weight:400;color:var(--ink);font-size:var(--type-meta)}
.shelf{position:relative;display:flex;align-items:flex-end;gap:var(--space-3);border-bottom:2px solid var(--hairline-strong);padding:0 var(--space-2)}
.shelf.ghost{opacity:.5;border-bottom-width:1px}
.sec{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;flex:0 1 auto}
.sec.gapsec{min-width:calc(var(--space-8) + var(--space-5))}
.sec .row{display:flex;align-items:flex-end;gap:1px;height:var(--x-shelf-h)}
.ghost .sec .row{height:var(--x-ghost-h)}
.sec .cap{position:absolute;left:0;right:0;top:calc(100% + var(--space-2));display:flex;gap:var(--space-2);align-items:baseline;white-space:nowrap;overflow:visible;font-size:var(--type-small);color:var(--ink)}
.sec .cap .mono{color:var(--ink-muted)}
.sec .cap s{color:var(--ink-muted);text-decoration-color:var(--x-seam)}
.ghost .sec .cap{font-size:var(--x-type-micro);color:var(--ink-muted)}
.sec.newsec .cap{color:var(--x-new)}
/* a section that holds the records nobody could place: a held gap on the shelf */
.sec.gapsec{border:1px dashed var(--x-gap-ink);border-bottom:0;border-radius:var(--radius-key) var(--radius-key) 0 0;background:var(--x-gap-fill);padding:0 var(--space-1)}
.sec.gapsec .cap{color:var(--ink-muted);white-space:normal;display:block;line-height:var(--leading-small)}
.sec.gapsec .cap b{font-weight:400;color:var(--ink)}
/* a bookend inside a section: a kind inside a kind */
.bookend{flex:none;width:2px;height:calc(var(--x-shelf-h) + var(--space-3));background:var(--x-new);margin:0 var(--space-1)}
.sp{flex:0 1 auto;width:var(--x-spine-max);min-width:1px;height:var(--h);border-radius:1px 1px 0 0;background:color-mix(in srgb,var(--c) 34%,var(--slate));position:relative;will-change:transform}
.ghost .sp{height:calc(var(--h) * .42)}
.sp.mine{background:var(--light);box-shadow:0 0 var(--glow-blur) color-mix(in srgb,var(--light) 40%,transparent)}
.sp.unsure{background:transparent;outline:1px dashed var(--x-gap-ink);outline-offset:-1px}
.sp.unsure.mine{background:color-mix(in srgb,var(--light) 30%,transparent);outline-color:var(--light)}
/* the new detail as a band at the head of every spine */
.sp .band{position:absolute;left:0;right:0;top:0;height:var(--space-3);opacity:0;transition:opacity var(--motion-calm) var(--ease-out);transition-delay:calc(var(--d) * 1ms)}
.banded .sp .band{opacity:1}
.b-filled{background:var(--ink)} .b-doc{background:color-mix(in srgb,var(--info) 70%,var(--ink-muted))} .b-keep{background:transparent;outline:1px dashed var(--ink-muted);outline-offset:-1px} .b-nobody{background:transparent;outline:1px dashed var(--warning);outline-offset:-1px}
.c-org{--c:var(--floor-org-high)} .c-department{--c:var(--floor-department-high)} .c-team{--c:var(--floor-team-high)}
.flag{position:absolute;top:calc((var(--hf) - 1) * var(--x-shelf-h) - var(--space-4) - var(--fo, 0px));left:0;white-space:nowrap;font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light);pointer-events:none}
.flag::after{content:"";position:absolute;left:calc(var(--space-1) / 2);top:calc(100% + 2px);width:1px;height:calc((1 - var(--hf)) * var(--x-shelf-h) + var(--space-2) + var(--fo, 0px));background:color-mix(in srgb,var(--light) 50%,transparent)}
.ghost .flag{display:none}
.says{display:grid;align-items:start;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--space-6);margin-top:var(--space-6);padding-top:var(--space-4);border-top:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.says h2{margin:var(--space-1) 0 var(--space-2);font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.says p{margin:0 0 var(--space-2)} .says p.m{color:var(--ink-muted)}
.says ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.says li{display:grid;grid-template-columns:var(--space-3) minmax(0,1fr);gap:var(--space-2);color:var(--ink-muted)}
.says li i{width:var(--space-3);height:var(--space-3);border-radius:2px;margin-top:2px}
.says li b{font-weight:400;color:var(--ink)}
@media (max-height:840px){ :root{--x-shelf-h:calc(var(--space-8) - var(--space-3));--x-ghost-h:var(--space-6)} .main{padding-top:var(--space-4)} .head{margin-bottom:var(--space-2)} .stage{gap:var(--space-3)} #la{margin-bottom:var(--space-6)} .head{margin-bottom:var(--space-4)} .says{margin-top:var(--space-6);padding-top:var(--space-3)} }
@media (prefers-reduced-motion: reduce){ .sp{transition:none!important} }
</style>
</head>

<script>
/* ======================================================================
   Sample data: every name, label, count, floor and date on this page comes
   from here. In AUGUR it comes from Data Atlas (the ontology and its change
   log, counts per kind and floor, expected details per kind, triage),
   Artifacts (documents that could fill a gap), Mandate (intents bound to a
   detail) and Explorer (saved views). Nothing below is specific to one
   deployment: swap this object and the page redraws.
   ====================================================================== */
const DATA = {
  app: 'Data Atlas',
  org: 'Northfold Regional Services',
  today: '2026-11-03',
  viewer: { name: 'Priya Shah', floor: 'department', role: 'Operator', team: 'Estates bookings', lastVisit: '2026-10-20' },

  studioNav: [

    { label: 'Words asked for', icon: 'message-square-quote', tech: 'Term requests', n: 3 },
    { label: 'Changes', icon: 'history', tech: 'Change log', n: 41 }
  ],
  /* the kinds of thing (classes, one step down) */
  kinds: [
    { id: 'site', word: 'Site', plural: 'Sites', icon: 'building-2', tech: 'cco:Facility', floor: 'org', count: 142 },
    { id: 'supplier', word: 'Supplier', plural: 'Suppliers', icon: 'handshake', tech: 'cco:Organization', floor: 'org', count: 86 },
    { id: 'contract', word: 'Contract', plural: 'Contracts', icon: 'file-text', tech: 'cco:Contract', floor: 'department', count: 211 },
    { id: 'person', word: 'Person', plural: 'People', icon: 'user-round', tech: 'cco:Person', floor: 'org', count: 1340 },
    { id: 'vehicle', word: 'Vehicle', plural: 'Vehicles', icon: 'car', tech: 'cco:GroundVehicle', floor: 'team', count: 96 },
    { id: 'workorder', word: 'Job', plural: 'Jobs', icon: 'hammer', tech: 'nf:WorkOrder', floor: 'department', count: 3120 },

      { g: 'where', word: 'Address', tech: 'cco:has_address', fill: 1 },
      { g: 'when', word: 'Opened', tech: 'nf:openedOn', fill: .82 },
