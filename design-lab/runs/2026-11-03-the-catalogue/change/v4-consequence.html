/* ======================================================================

   ====================================================================== */
:root{
  --x-type-micro:.6875rem;                                                   /* --type-micro: mono eyebrows inside data (wear-and-time already proposes it) */
  --x-gap-ink:color-mix(in srgb,var(--ink-muted) 70%,transparent);            /* --mark-gap: the dashed edge of an expected-but-missing value */
  --x-gap-fill:color-mix(in srgb,var(--ink) 3%,transparent);                 /* --mark-gap-fill: a gap is a held place, faintly lit, not hatch */
  --x-hatch:color-mix(in srgb,var(--ink-muted) 34%,transparent);             /* --mark-stale-hatch (wear and time): 'no record', not a gap */
  --x-stale:repeating-linear-gradient(45deg,transparent 0 var(--space-1),var(--x-hatch) var(--space-1) calc(var(--space-1) + 1px));
  --x-new:color-mix(in srgb,var(--green) 70%,var(--ink));                    /* --mark-structure-new: the structure itself changed here */
  --x-new-wash:color-mix(in srgb,var(--green) 10%,transparent);
  --x-seam:color-mix(in srgb,var(--warning) 55%,var(--ink));                 /* --mark-seam (wear-and-time grammar V1) */
  --x-paper:color-mix(in srgb,var(--ink) 92%,var(--warning));             /* --surface-slip: a paper notice, the one light surface */
  --x-paper-ink:var(--slate-deep);
  --x-near-dim:.55;                                                          /* far plane when one thing is in focus */
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}

.keys{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:var(--layer-chrome);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-3);max-width:calc(100% - var(--measure-glance) - var(--space-6));font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}

.rail{background:color-mix(in srgb,var(--slate-deep) 70%,transparent);border-right:1px solid var(--hairline);padding:var(--edge) var(--edge-tight);display:flex;flex-direction:column;gap:var(--space-1);min-height:0}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-raised)}

/* ---- floors ---- */
.fl{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}

.gap.nobody{border-color:color-mix(in srgb,var(--warning) 50%,transparent)}
.gap.nobody b{color:var(--warning)}
.gap.doc b{color:var(--ink)}
.newtag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-new);white-space:nowrap}

/* ---- why-pane ---- */
.tip{position:fixed;z-index:var(--layer-overlay);width:var(--measure-card);padding:var(--space-3) var(--space-4);background:var(--surface-overlay);-webkit-backdrop-filter:blur(var(--surface-blur));backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);opacity:0;pointer-events:none;transition:opacity var(--motion-quick) var(--ease-out)}
.tip.on{opacity:1}
.tip .t{margin:var(--space-1) 0;color:var(--light);font-size:var(--type-body);line-height:var(--leading-body)}
.tip p{margin:0 0 var(--space-1);font-size:var(--type-meta);line-height:var(--leading-meta)}
.tip p.m{color:var(--ink-muted)}

.fade{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
@media (prefers-reduced-motion: reduce){ .fade{transition:opacity var(--motion-base) linear!important;transform:none!important} }

/* ---- V4: the studio shows the consequence before the admin commits ---- */
.rail .who{padding:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-bottom:var(--space-3)}
.nav .t2{display:block;font:400 var(--x-type-micro)/1 var(--font-mono);color:var(--ink-muted);opacity:.7;margin-top:2px}
.nav{height:auto;min-height:var(--target-sm);padding:var(--space-1) var(--space-2)}
.split{display:grid;grid-template-columns:minmax(0,calc(var(--measure-decision) - var(--space-5))) minmax(0,1fr);gap:var(--space-5);min-height:0;flex:1}
/* the draft: what the admin is about to do, in plain words with the technical line under */
.draft{display:flex;flex-direction:column;gap:var(--space-3)}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-1)}
.types button{display:flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink-muted)}

.types .kbd{margin-left:auto;opacity:.7}
.form{border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);padding:var(--space-4)}
.form h2{margin:0 0 var(--space-3);font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.fld{display:grid;grid-template-columns:calc(var(--space-8) - var(--space-4)) minmax(0,1fr);gap:var(--space-3);padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta);align-items:baseline}
.fld > span:first-child{color:var(--ink-muted);font-size:var(--type-small)}
.fld .tech{display:block}
.fld .val{color:var(--ink)}
.fld .val b{font-weight:400;color:var(--light)}
/* the preview: a developing print. Numbers arrive, bars grow, then the commit lights. */
.pv{position:relative;border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:linear-gradient(180deg,var(--surface-pane),var(--surface-inset));padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);min-height:0;overflow:auto;scrollbar-width:thin}
.pv .top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4)}
.pv h2{margin:var(--space-1) 0 0;font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--light)}
.pv h2 b{font:400 var(--type-heading)/1 var(--font-mono);color:var(--light)}
.blk{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-3)) minmax(0,1fr);gap:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--hairline);opacity:.25;transition:opacity var(--motion-calm) var(--ease-out)}
.dev .blk{opacity:1}
.blk > .micro{padding-top:2px}
.floors{display:flex;flex-direction:column;gap:var(--space-1)}
.fb{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-4)) minmax(0,1fr) calc(var(--space-6) + var(--space-2));gap:var(--space-3);align-items:center;font-size:var(--type-small)}
.fb .tr{height:var(--space-2);border-radius:var(--radius-pill);background:var(--hairline);overflow:hidden}
.fb .tr i{display:block;height:100%;width:0;background:var(--c);border-radius:var(--radius-pill);transition:width var(--motion-calm) var(--ease-out)}
.fb b{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink);text-align:right}
.st{display:flex;height:var(--space-3);gap:2px;border-radius:var(--radius-key);overflow:hidden;margin-bottom:var(--space-2)}
.st i{display:block;flex:0 1 0;transition:flex-grow var(--motion-calm) var(--ease-out)}
.s-filled{background:var(--ink)} .s-doc{background:color-mix(in srgb,var(--info) 70%,var(--ink-muted))} .s-keep{background:var(--ink-muted)} .s-nobody{background:var(--warning)} .s-new{background:var(--x-new)}
.leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-1) var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.leg span{display:flex;gap:var(--space-2);align-items:baseline}
.leg i{flex:none;width:var(--space-2);height:var(--space-2);border-radius:2px;align-self:center}
.leg b{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink)}
.views{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.views li{display:grid;grid-template-columns:var(--space-5) calc(var(--space-8) + var(--space-5)) minmax(0,1fr);gap:var(--space-2) var(--space-3);align-items:start;font-size:var(--type-small);line-height:var(--leading-small)}
.views li svg{color:var(--ink-muted);margin-top:1px}
.views li .a{color:var(--ink)}
.views li .a small{display:block;color:var(--ink-muted)}
.views li .e{color:var(--ink-muted)}
.views li.warn .e{color:var(--warning)}
.keep{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.keep b{font-weight:400;color:var(--ink)}
.commit{display:flex;align-items:center;gap:var(--space-3);margin-top:auto;padding-top:var(--space-3);border-top:1px solid var(--hairline)}
.commit .btn.go{opacity:.35;pointer-events:none;transition:opacity var(--motion-calm) var(--ease-out)}
.ready .commit .btn.go{opacity:1;pointer-events:auto}
.commit .note{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);flex:1}
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);background:var(--veil);border-radius:var(--radius-inset);opacity:0;pointer-events:none;transition:opacity var(--motion-calm) var(--ease-out);text-align:center;padding:var(--space-6)}
.done.on{opacity:1;pointer-events:auto}
.done h3{margin:0;font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--light)}
.done p{margin:0;max-width:var(--measure-prose);color:var(--ink-muted);font-size:var(--type-meta)}
@media (max-height:840px){ .main{padding-top:var(--space-4);padding-bottom:var(--space-7)} .head{margin-bottom:var(--space-2)} .pv{padding:var(--space-3) var(--space-4);gap:var(--space-2)} .blk{padding-top:var(--space-2)} .views{gap:var(--space-1)} .form{padding:var(--space-3)} .fld{padding:var(--space-1) 0} .head h1{font-size:var(--type-title-s)} .pv h2,.pv h2 b{font-size:var(--type-lead);line-height:var(--leading-lead)} }
@media (max-width:1400px){ .split{grid-template-columns:minmax(0,calc(var(--measure-card) - var(--space-4))) minmax(0,1fr)} .types{grid-template-columns:1fr} .views li{grid-template-columns:var(--space-5) calc(var(--space-8) + var(--space-2)) minmax(0,1fr)} }

/* why-panes for anything that explains itself */
const TIPS = {};
function tip(el) { const p = $('#tip'), k = el.dataset.tip; if (!TIPS[k]) return; p.innerHTML = TIPS[k](el); const r = el.getBoundingClientRect(), g = px('--space-3');
  p.style.left = Math.max(g, Math.min(innerWidth - p.offsetWidth - g, r.left + r.width / 2 - p.offsetWidth / 2)) + 'px';
  const top = r.bottom + g; p.style.top = (top + p.offsetHeight > innerHeight - g ? r.top - g - p.offsetHeight : top) + 'px'; p.classList.add('on'); Icons.hydrate(p); }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) tip(el); });
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) $('#tip').classList.remove('on'); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) tip(el); else $('#tip').classList.remove('on'); });
function boot(demo, onKey) {
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ((e.key === 'r' || e.key === 'R') && e.target.tagName !== 'INPUT') { $('#tip').classList.remove('on'); clearLater(); return demo(); }
    if (onKey) onKey(e);

  Icons.hydrate();
  document.fonts.ready.then(demo);
}

function form(c) {

    'add-kind': () => F('Inside', `<b>${esc(k.plural)}</b>`, k.tech) + F('New kind', `<b>${esc(c.newKind.word)}</b>`, `${c.newKind.tech} rdfs:subClassOf ${k.tech}`) + F('Rule', esc(c.newKind.rule)) + F('Why', esc(c.why)),

    rename: () => F('Kind', `<b>${esc(c.from)}</b>`, k.tech + ' (unchanged)') + F('New name', `<b>${esc(c.to)}</b> · ${esc(c.toPlural)}`, 'rdfs:label, skos:altLabel keeps “' + c.from + '”') + F('Why', esc(c.why))

/* the shares that land on the records, per kind of change */
function shares(c) {
  if (c.type === 'add-detail') { const g = c.gaps; return { total: g.total, head: `Gaps on <b>${g.total - g.filled}</b> of ${g.total} records`, parts: [['filled', g.filled, 'already filled'], ['doc', g.fromDocs, c.fillers.fromDocs.word.toLowerCase()], ['keep', g.keepers, c.fillers.keepers.word.toLowerCase()], ['nobody', g.nobody, c.fillers.nobody.word.toLowerCase()]] }; }

  if (c.type === 'split') return { total: kindOf(c.kind).count, head: `<b>${kindOf(c.kind).count}</b> ${esc(kindOf(c.kind).plural.toLowerCase())} are placed`, parts: [['new', c.into[0].n, c.into[0].word.toLowerCase()], ['filled', c.into[1].n, c.into[1].word.toLowerCase()], ['keep', c.unsure, 'can’t tell: a keeper places them']] };

function preview(c) {
