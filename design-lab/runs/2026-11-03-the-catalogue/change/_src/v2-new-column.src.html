<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When the structure changes · V2 · The table gains a column</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@BASE_CSS*/
/* ---- V2: the table of kinds gains a column; its layout predicts the look-alikes ---- */
:root{
  --x-col:minmax(0,1fr);
  --x-cell-h:calc(var(--target-md) + var(--space-1));                         /* 52: one kind, one group */
}
.tbl{display:grid;grid-template-columns:calc(var(--measure-rail) - var(--space-5)) repeat(var(--cols),var(--x-col)) var(--newcol,0fr);gap:var(--space-1);transition:grid-template-columns var(--motion-calm) var(--ease-out);max-width:calc(var(--measure-wide) + var(--space-8) * 2)}
.tbl.grow{--newcol:1.15fr}
.gh{display:flex;align-items:flex-end;padding:0 var(--space-2) var(--space-2);min-height:var(--space-6);overflow:hidden}
.gh.new{flex-direction:column;align-items:flex-start;justify-content:flex-end;color:var(--x-new);border-top:2px solid var(--x-new);background:linear-gradient(180deg,var(--x-new-wash),transparent)}
.gh.new .tech{opacity:0;transition:opacity var(--motion-base)} .techon .gh .tech{opacity:1}
.kh{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:var(--space-1) var(--space-2);padding:0 var(--space-2);min-height:var(--x-cell-h);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);color:var(--ink)}
.kh .n{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.kh .fl{font-size:0;gap:0}
.kh .tech{grid-column:2/5;display:none} .techon .kh .tech{display:block}
.cell{position:relative;min-height:var(--x-cell-h);padding:var(--space-2);border-radius:var(--radius-key);background:var(--surface-inset);border:1px solid transparent;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);min-width:0;text-align:left}
.cell .w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .bar{height:2px;border-radius:1px;background:var(--hairline);position:relative;overflow:hidden}
.cell .bar i{position:absolute;inset:0 auto 0 0;background:var(--ink-muted)}
.cell .bar i.lo{background:var(--warning)}
/* nothing expected here: not a gap. A quiet dot, no dashed edge. */
.cell.none{background:transparent;border:1px solid var(--hairline);align-items:center;color:var(--ink-muted)}
.cell.none::before{content:"";width:var(--space-1);height:var(--space-1);border-radius:50%;background:var(--hairline-strong)}
/* the new column */
.cell.nc{background:transparent;border:1px dashed transparent}
.cell.nc.hit{border-color:var(--x-gap-ink);background:var(--x-gap-fill)}
.cell.nc.hit .w{color:var(--light)}
.cell.nc.alike{border-color:var(--hairline);color:var(--ink-muted)}
.cell.nc.alike .w{color:var(--ink)}
.cell.nc .ghost{color:var(--ink-muted);font-size:var(--x-type-micro);font-family:var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;white-space:nowrap}
.cell .seg3{display:flex;height:var(--space-1);gap:1px;border-radius:1px;overflow:hidden}
.cell .seg3 i{display:block}
.s-filled{background:var(--ink)} .s-doc{background:color-mix(in srgb,var(--info) 70%,var(--ink-muted))} .s-keep{background:var(--ink-muted)} .s-nobody{background:var(--warning)}
.nc > *{opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.grow .nc > *{opacity:1;transition-delay:var(--motion-base)}
.tbl.focus .cell:not(.sel),.tbl.focus .kh:not(.sel){opacity:var(--x-near-dim);transition:opacity var(--motion-slow)}
.cell.sel{border-color:var(--x-new)!important}

/* drawer: what the new column means for this kind */
.drawer{margin-top:var(--space-4);max-width:calc(var(--measure-wide) + var(--space-8) * 2);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--space-6);padding:var(--space-4) var(--space-5);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);opacity:0;transform:translateY(var(--space-3));transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.drawer.on{opacity:1;transform:none}
.drawer h2{margin:var(--space-1) 0 var(--space-2);font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.drawer p{margin:0 0 var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.drawer p.m{color:var(--ink-muted)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.legend li{display:grid;grid-template-columns:var(--space-3) calc(var(--space-6) + var(--space-1)) minmax(0,1fr);gap:var(--space-2);align-items:baseline;font-size:var(--type-meta);line-height:var(--leading-meta)}
.legend li i{width:var(--space-3);height:var(--space-3);border-radius:2px;align-self:center}
.legend li b{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light);text-align:right}
.legend li span{color:var(--ink)} .legend li small{display:block;color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
@media (max-height:840px){ :root{--x-cell-h:var(--space-6)} .drawer{padding:var(--space-3) var(--space-4);margin-top:var(--space-3)} .legend{gap:var(--space-1)} .x-opt{display:none} .drawer h2{margin:0 0 var(--space-1)} .main{padding-top:var(--space-4)} .head{margin-bottom:var(--space-2)} }
@media (prefers-reduced-motion: reduce){ .tbl{transition:none!important} .drawer{transform:none!important} }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Data Atlas"><div class="an" id="appname"></div><div id="navs"></div><div class="foot" id="railfoot"></div></nav>
  <main class="main" id="main">
    <div class="head"><div><div class="eyebrow" id="crumb"></div><h1 id="ename"></h1><div class="sub" id="esub"></div></div></div>
    <div class="tbl" id="tbl" role="grid" aria-label="Kinds of thing and their details"></div>
    <section class="drawer" id="drawer" aria-live="polite"></section>
  </main>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="keys" id="keys"></div>
<div class="x-cap"><b>Structure changes · V2</b> the table gains a column · Mendeleev's gaps, PMEST facets</div>
<script>
/*@DATA*/
/*@BASE_JS*/
const C = DATA.changes[0], NG = DATA.newGroup, G = DATA.groups;
let sel = C.kind, tech = false;
function cellFor(k, g) {
  const ds = (DATA.details[k.id] || []).filter(d => d.g === g.id);
  if (!ds.length) return `<div class="cell none" role="gridcell" data-tip="none" data-k="${k.id}" data-g="${g.id}"><span class="sr">nothing expected</span></div>`;
  return `<div class="cell" role="gridcell">${ds.map(d => `<span class="w">${esc(d.word)}</span><span class="bar"><i class="${d.fill < .6 ? 'lo' : ''}" style="width:${d.fill * 100}%"></i></span>`).join('')}</div>`;
}
function newCell(k) {
  const g = C.gaps;
  if (k.id === C.kind) {
    const seg = [['filled', g.filled], ['doc', g.fromDocs], ['keep', g.keepers], ['nobody', g.nobody]].map(([c, n]) => `<i class="s-${c}" style="flex:${n}"></i>`).join('');
    return `<button class="cell nc hit${sel === k.id ? ' sel' : ''}" role="gridcell" data-k="${k.id}"><span class="w">${esc(C.detail.word)}</span><span class="seg3">${seg}</span><span class="ghost">${g.filled} of ${g.total} filled</span></button>`;
  }
  const a = NG.lookAlike.find(x => x.kind === k.id);
  if (a) return `<button class="cell nc alike${sel === k.id ? ' sel' : ''}" role="gridcell" data-k="${k.id}"><span class="ghost">similar?</span><span class="w">${esc(a.detail)}?</span></button>`;
  return `<div class="cell nc none" role="gridcell"></div>`;
}
function render() {
  const tbl = $('#tbl');
  tbl.style.setProperty('--cols', G.length);
  tbl.innerHTML = `<div class="gh micro">Kind of thing</div>` + G.map(g => `<div class="gh micro">${esc(g.word)}</div>`).join('')
    + `<div class="gh new micro"><span>${ic('sparkle', 12)} ${esc(NG.word)}</span><span>new · ${esc(fmtWhen(C.when).split(' ·')[0])}</span><span class="tech">${esc(NG.tech)}</span></div>`
    + DATA.kinds.map(k => `<div class="kh${sel === k.id ? ' sel' : ''}">${ic(k.icon, 16)}<span>${esc(k.plural)}</span><span class="n">${k.count.toLocaleString('en-GB')}</span><span data-tip="floor" data-f="${k.floor}">${fl(k.floor)}</span><span class="tech">${esc(k.tech)}</span></div>`
      + G.map(g => cellFor(k, g)).join('') + newCell(k)).join('');
  $$('.nc[data-k]', tbl).forEach(b => b.onclick = () => pick(b.dataset.k));
  Icons.hydrate(tbl);
}
TIPS.floor = el => `<div class="micro">Kept on</div><div class="t">${esc(DATA.floors[el.dataset.f].label)} · ${esc(DATA.floors[el.dataset.f].name)}</div><p class="m">Records of this kind are made on this floor and seen from it and the floors below.</p>`;
TIPS.none = el => `<div class="micro">Not expected</div><div class="t">${esc(kindOf(el.dataset.k).plural)} keep nothing under “${esc(G.find(g => g.id === el.dataset.g).word)}”</div><p class="m">This is not a gap: no record is missing anything here. A gap has a dashed edge and says who can fill it.</p>`;
function drawer() {
  const d = $('#drawer'), k = kindOf(sel), g = C.gaps;
  if (sel === C.kind) {
    d.innerHTML = `<div><div class="micro">New column · ${esc(NG.word)} · ${esc(fmtWhen(C.when))} by ${esc(C.by)}</div><h2>${esc(k.plural)} now keep “${esc(C.detail.word)}”</h2>
      <p>${esc(C.why)}</p><p class="m x-opt">${esc(NG.word)}: ${esc(NG.note.toLowerCase())}.</p><p class="m">${esc(C.noLoss)}</p>
      <p class="m x-opt">Asked for by ${esc(C.asked.by)} in Mandate: “${esc(C.asked.intent)}”.</p></div>
      <ul class="legend"><li><i class="s-filled"></i><b>${g.filled}</b><span>filled</span></li>
      <li><i class="s-doc"></i><b>${g.fromDocs}</b><span>${esc(C.fillers.fromDocs.word)}<small>${esc(C.fillers.fromDocs.who)}. ${esc(C.fillers.fromDocs.how)}</small></span></li>
      <li><i class="s-keep"></i><b>${g.keepers}</b><span>${esc(C.fillers.keepers.word)}<small>${esc(C.fillers.keepers.who)}</small></span></li>
      <li><i class="s-nobody"></i><b>${g.nobody}</b><span>${esc(C.fillers.nobody.word)}<small>${esc(C.fillers.nobody.how)}</small></span></li></ul>`;
  } else {
    const a = NG.lookAlike.find(x => x.kind === sel);
    d.innerHTML = `<div><div class="micro">A gap in the table, not in the records</div><h2>${esc(k.plural)}: does “${esc(a.detail)}” belong under ${esc(NG.word)}?</h2>
      <p>The new column predicts it: “${esc(a.detail)}” is a date by which something must be checked again, like ${esc(C.detail.word.toLowerCase())}.</p>
      <p class="m">Nothing moves until ${esc(C.by)} decides. You can suggest it; the suggestion goes to whoever ${esc(DATA.admin.role.toLowerCase())}.</p></div>
      <div><p class="m">Today “${esc(a.detail)}” sits under When. Moving it changes no record and no value, only where it is filed in this table.</p><button class="btn" data-tip="suggest">${ic('send', 14)} Suggest it <span class="kbd">S</span></button></div>`;
  }
  Icons.hydrate(d); d.classList.add('on');
}
TIPS.suggest = () => `<div class="micro">Suggest</div><div class="t">Goes to ${esc(C.by)}</div><p>A suggestion, not a change. You'll see the answer on this cell.</p>`;
function pick(k) { sel = k; render(); $('#tbl').classList.add('grow', 'focus'); if (tech) $('#tbl').classList.add('techon'); drawer(); }
function demo() {
  clearLater(); sel = null; render();
  const t = $('#tbl'); t.className = 'tbl' + (tech ? ' techon' : ''); $('#drawer').classList.remove('on');
  later(() => t.classList.add('grow'), reduced ? 0 : ms('--motion-run'));
  later(() => pick(C.kind), ms('--motion-run') + ms('--motion-run') + ms('--motion-calm'));
}
$('#crumb').textContent = DATA.app + ' · ' + DATA.org;
$('#ename').textContent = 'What we keep';
$('#esub').innerHTML = `${DATA.kinds.length} kinds of thing, the details each keeps, and how full they are. <b>One column is new since your last visit.</b>`;
rail(`The table is the same for everyone. A dot means <b>nothing expected</b>; a dashed edge means <b>expected, not filled yet</b>.`);
keys([['↑ ↓', 'kind in new column'], ['Esc', 'clear'], ['T', 'technical names'], ['R', 'replay']]);
boot(demo, e => {
  const order = [C.kind, ...NG.lookAlike.map(x => x.kind)];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const i = order.indexOf(sel); pick(order[(i + (e.key === 'ArrowDown' ? 1 : order.length - 1) + order.length) % order.length]); }
  if (e.key === 'Escape') { sel = null; render(); $('#tbl').classList.add('grow'); $('#tbl').classList.remove('focus'); $('#drawer').classList.remove('on'); }
  if (e.key === 't' || e.key === 'T') { tech = !tech; $('#tbl').classList.toggle('techon', tech); }
});
</script>
</body>
</html>
