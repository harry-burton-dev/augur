<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When the structure changes · V1 · Notice slip</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@BASE_CSS*/
/* ---- V1: the reclassification slip, tucked into the record ---- */
.body{display:flex;flex-direction:column;gap:var(--space-5);min-height:0}
.card{width:var(--measure-read);max-width:calc(100% - var(--measure-card))}
.card{position:relative;border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);padding:var(--space-4) var(--space-5) var(--space-3)}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:var(--space-3);border-bottom:1px solid var(--hairline)}
.card .ch b{font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.row{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-5)) minmax(0,1fr);gap:var(--space-4);align-items:center;padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-meta);min-height:var(--target-md)}
.row:last-child{border-bottom:0}
.row .w{color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.row .w .tech{display:block;opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.card.techon .row .w .tech{opacity:1}
.lnk{box-shadow:inset 0 -1px 0 var(--hairline-strong)}
.row.isnew{position:relative;transition:background var(--motion-calm) var(--ease-out)}
.row.isnew::before{content:"";position:absolute;left:calc(var(--space-5) * -1);top:0;bottom:0;width:2px;background:var(--x-new);opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.on .row.isnew::before{opacity:1}
.on .row.isnew{background:linear-gradient(90deg,var(--x-new-wash),transparent 70%)}
.row.isnew .w .newtag{margin-top:var(--space-1);opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.on .row.isnew .w .newtag{opacity:1}

/* the slip: paper, the one light surface; tucked under the card's top edge */
.slip{position:absolute;top:var(--slip-top,var(--space-6));left:calc(100% - var(--space-5));width:calc(var(--measure-card) - var(--space-5));background:var(--x-paper);color:var(--x-paper-ink);border-radius:var(--radius-key);box-shadow:var(--shadow-raised);padding:var(--space-3) var(--space-4) var(--space-3);transform-origin:top left;transform:translateY(calc(var(--travel-near) * -1)) rotate(1.5deg);opacity:0;transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);pointer-events:none;z-index:2}
.on .slip{opacity:1;transform:rotate(1.5deg);pointer-events:auto}
.slip .sh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid color-mix(in srgb,var(--x-paper-ink) 30%,transparent);padding-bottom:var(--space-1);margin-bottom:var(--space-2);font:500 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}
.slip h2{margin:0 0 var(--space-2);font:400 var(--type-body)/var(--leading-body) var(--font-sans)}
.slip p{margin:0 0 var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.slip p b{font-weight:500}
.slip .who{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);margin:var(--space-2) 0 var(--space-3);padding:var(--space-2) 0;border-top:1px dashed color-mix(in srgb,var(--x-paper-ink) 35%,transparent);border-bottom:1px dashed color-mix(in srgb,var(--x-paper-ink) 35%,transparent);font-size:var(--type-small);line-height:var(--leading-small)}
.slip .who dt{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;opacity:.7}
.slip .who dd{margin:0}
.slip .acts{display:flex;gap:var(--space-2);flex-wrap:wrap}
.slip .btn{height:calc(var(--target-sm) - var(--space-1));border-color:color-mix(in srgb,var(--x-paper-ink) 40%,transparent);color:var(--x-paper-ink);font-size:var(--type-small)}
.slip .btn:hover{background:color-mix(in srgb,var(--x-paper-ink) 8%,transparent)}
.slip .btn.go{background:var(--x-paper-ink);color:var(--x-paper);border-color:var(--x-paper-ink)}
.slip .btn .kbd{color:inherit;border-color:currentColor;opacity:.6}
/* read: the slip folds back to a tab on the card's edge; the gap stays */
.tab{position:absolute;top:var(--tab-top,var(--space-4));left:100%;height:var(--target-sm);display:flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);background:var(--x-paper);color:var(--x-paper-ink);border-radius:0 var(--radius-key) var(--radius-key) 0;font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;opacity:0;transition:opacity var(--motion-base) var(--ease-out);pointer-events:none}
.read .slip{opacity:0;transform:translateX(var(--space-6)) rotate(0deg) scale(.6);pointer-events:none}
.read .tab{opacity:1;pointer-events:auto}

/* the shelf of sites you look at: which carry an unread slip */
.side{display:grid;width:var(--measure-read);grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2) var(--space-3);align-content:start}
.side h3{grid-column:1/-1;margin:0}
.side .note{grid-column:1/-1}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-3);height:var(--target-md);padding:0 var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink)}
.mini.cur{border-color:var(--hairline-strong);background:var(--surface-raised)}
.mini .corner{width:0;height:0;border-style:solid;border-width:0 var(--space-3) var(--space-3) 0;border-color:transparent var(--x-paper) transparent transparent;justify-self:end;align-self:start;margin-top:-1px;margin-right:calc(var(--space-3) * -1)}
.mini .corner.seen{border-right-color:var(--hairline-strong)}
.side .note{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);max-width:var(--measure-prose);margin-top:var(--space-2)}
@media (max-width:1400px){ .card{width:calc(var(--measure-read) - var(--space-7))} .side{width:calc(var(--measure-read) - var(--space-7))} }
@media (max-height:840px){ .side .mini{height:var(--target-sm)} .slip{padding:var(--space-2) var(--space-3)} .slip .who{margin:var(--space-1) 0 var(--space-2)} .row{min-height:var(--target-sm);padding:var(--space-1) 0} .main{padding-top:var(--space-4)} }
@media (prefers-reduced-motion: reduce){ .slip{transform:rotate(1.5deg)!important} .read .slip{transform:none!important} }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Data Atlas"><div class="an" id="appname"></div><div id="navs"></div><div class="foot" id="railfoot"></div></nav>
  <main class="main" id="main">
    <div class="head"><div><div class="eyebrow" id="crumb"></div><h1 id="ename"></h1><div class="sub" id="esub"></div></div></div>
    <div class="body">
      <div class="card" id="card"></div>
      <aside class="side" id="side"></aside>
    </div>
  </main>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="keys" id="keys"></div>
<div class="x-cap"><b>Structure changes · V1</b> notice slip in the record · library reclassification slips</div>
<script>
/*@DATA*/
/*@BASE_JS*/
const C = DATA.changes[0], K = kindOf(C.kind);
let cur = 1, read = new Set(), tech = false;
const whoLine = r => r.fill.state === 'doc' ? `<b>${esc(C.fillers.fromDocs.word)}</b>: ${esc(r.fill.src)} says <b>${esc(r.fill.value)}</b>. A keeper confirms it.`
  : r.fill.state === 'keeper' ? `<b>${esc(r.fill.who)}</b>, who manages this site.`
  : r.fill.state === 'filled' ? `Filled by ${esc(r.fill.src.replace('Entered by ', ''))} at ${esc(r.fill.at)}.` : `<b>Nobody yet.</b> ${esc(C.fillers.nobody.how)}`;
function render(anim) {
  const r = DATA.records[cur], card = $('#card');
  $('#crumb').textContent = `${DATA.app} · ${K.word}`;
  $('#ename').textContent = r.name;
  $('#esub').innerHTML = `A ${esc(K.word.toLowerCase())} kept on ${fl(r.floor)}`;
  card.className = 'card' + (tech ? ' techon' : '') + (anim ? '' : (read.has(cur) ? ' on read' : ' on'));
  card.innerHTML = `<div class="ch"><b>${esc(K.word)} record</b><span class="micro">${siteRows(r).length} details expected</span></div>`
    + siteRows(r).map(x => `<div class="row${x.isNew ? ' isnew' : ''}"><div class="w">${esc(x.word)}${x.isNew ? `<div class="newtag">${ic('sparkle', 12)} new detail · ${esc(fmtWhen(C.when).split(' ·')[0])}</div>` : ''}<span class="tech">${esc(x.tech)}</span></div><div>${x.html}</div></div>`).join('')
    + `<div class="slip" role="note" aria-label="Notice"><div class="sh"><span>Notice · ${esc(K.plural)}</span><span>${esc(fmtWhen(C.when).split(' ·')[0])}</span></div>
        <h2>${esc(K.plural)} now keep one more detail: <b>${esc(C.detail.word)}</b></h2>
        <p>${esc(C.why)} This site ${r.fill.state === 'filled' ? 'already has it.' : 'doesn’t have it yet.'}</p>
        <dl class="who"><dt>Who can fill</dt><dd>${whoLine(r)}</dd><dt>Asked for by</dt><dd>${esc(C.asked.by)}: “${esc(C.asked.intent)}”</dd><dt>Changed by</dt><dd>${esc(C.by)}, who ${esc(DATA.admin.role.toLowerCase())}</dd><dt>Lost</dt><dd>Nothing on this record.</dd></dl>
        <div class="acts"><button class="btn go" id="ok">Got it <span class="kbd">Enter</span></button>${r.fill.state !== 'filled' ? `<button class="btn" id="prop">Propose a date <span class="kbd">P</span></button>` : ''}</div></div>
      <button class="tab" id="tab" data-tip="tab">${ic('sticky-note', 12)} 1 change</button>`;
  $('#ok').onclick = gotIt; $('#tab').onclick = () => { read.delete(cur); render(); };
  const shelf = DATA.records.slice(0, 6), unread = shelf.filter((x, i) => !read.has(i)).length;
  $('#side').innerHTML = `<h3 class="micro">Sites you look at</h3>` + shelf.map((x, i) => `<button class="mini${i === cur ? ' cur' : ''}" data-i="${i}"><span>${esc(x.name)}</span><span class="corner${read.has(i) ? ' seen' : ''}"></span></button>`).join('')
    + `<p class="note">A paper corner means a slip you haven’t read. Reading it folds it away for you only; the gap stays on the record until someone fills it.</p>`;
  $$('#side .mini').forEach(b => b.onclick = () => { cur = +b.dataset.i; render(true); show(); });
  rail(`<b>${unread}</b> of the sites you look at carry an unread notice. Notices sit on the records, not in a list.`);
  keys([['← →', 'site'], ['Enter', 'got it'], ['P', 'propose'], ['T', 'technical names'], ['R', 'replay']]);
  Icons.hydrate();
  const nr = $('.row.isnew', card); card.style.setProperty('--slip-top', (nr.offsetTop - px('--space-7')) + 'px'); card.style.setProperty('--tab-top', nr.offsetTop + 'px');
}
TIPS.tab = () => `<div class="micro">Notice, read</div><div class="t">${esc(K.plural)} gained “${esc(C.detail.word)}”</div><p>You folded this away. Click to read it again.</p>`;
function show() { later(() => $('#card').classList.add('on'), reduced ? 0 : ms('--motion-run')); }
function gotIt() { read.add(cur); $('#card').classList.add('read'); later(() => render(), ms('--motion-calm')); }
function demo() { clearLater(); read = new Set(); cur = 1; render(true); show(); }
boot(demo, e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { cur = (cur + (e.key === 'ArrowRight' ? 1 : DATA.records.length - 1)) % DATA.records.length; render(true); $('#card').classList.add('on'); if (read.has(cur)) $('#card').classList.add('read'); }
  if (e.key === 'Enter') gotIt();
  if (e.key === 't' || e.key === 'T') { tech = !tech; $('#card').classList.toggle('techon', tech); }
  if ((e.key === 'p' || e.key === 'P') && $('#prop')) $('#prop').focus();
});
</script>
</body>
</html>
