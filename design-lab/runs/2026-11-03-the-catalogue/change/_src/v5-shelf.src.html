<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When the structure changes · V5 · Before and after shelf</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@BASE_CSS*/
/* ---- V5: the shelf, before and after. Records are spines; a change re-shelves them in front of you ---- */
:root{
  --x-spine-max:var(--space-3);                                              /* 12: widest spine */
  --x-shelf-h:calc(var(--space-8) + var(--space-7));                         /* 188: tallest spine on the 'now' shelf */
  --x-ghost-h:calc(var(--space-7) - var(--space-3));                         /* 60: the 'before' shelf, small */
}
.modes{display:flex;gap:var(--space-1);padding:var(--space-1);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);flex:none}
.modes button{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink-muted)}
.modes button[aria-pressed="true"]{background:var(--surface-raised);color:var(--light);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.modes .kbd{opacity:.7}
.stage{display:flex;flex-direction:column;gap:var(--space-4);max-width:calc(var(--measure-wide) + var(--space-8) * 2)}
.lbl{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-2)}
#la{margin-bottom:var(--space-7)}
.sec .cap .mono{margin-left:var(--space-1)}
.head{margin-bottom:var(--space-5)}
.lbl b{font-weight:400;color:var(--ink);font-size:var(--type-meta)}
.shelf{position:relative;display:flex;align-items:flex-end;gap:var(--space-3);border-bottom:2px solid var(--hairline-strong);padding:0 var(--space-2)}
.shelf.ghost{opacity:.5;border-bottom-width:1px}
.sec{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;flex:0 1 auto}
.sec.gapsec{min-width:calc(var(--space-8) + var(--space-5))}
.sec .row{display:flex;align-items:flex-end;gap:1px;height:var(--x-shelf-h)}
.ghost .sec .row{height:var(--x-ghost-h)}
.sec .cap{position:absolute;left:0;right:0;top:calc(100% + var(--space-2));display:flex;gap:var(--space-2);align-items:baseline;white-space:nowrap;overflow:visible;font-size:var(--type-small);color:var(--ink)}
.sec .cap .mono{color:var(--ink-muted)}
.sec .cap s{color:var(--ink-muted);text-decoration-color:var(--x-seam)}
.ghost .sec .cap{font-size:var(--x-type-micro);color:var(--ink-muted)}
.sec.newsec .cap{color:var(--x-new)}
/* a section that holds the records nobody could place: a held gap on the shelf */
.sec.gapsec{border:1px dashed var(--x-gap-ink);border-bottom:0;border-radius:var(--radius-key) var(--radius-key) 0 0;background:var(--x-gap-fill);padding:0 var(--space-1)}
.sec.gapsec .cap{color:var(--ink-muted);white-space:normal;display:block;line-height:var(--leading-small)}
.sec.gapsec .cap b{font-weight:400;color:var(--ink)}
/* a bookend inside a section: a kind inside a kind */
.bookend{flex:none;width:2px;height:calc(var(--x-shelf-h) + var(--space-3));background:var(--x-new);margin:0 var(--space-1)}
.sp{flex:0 1 auto;width:var(--x-spine-max);min-width:1px;height:var(--h);border-radius:1px 1px 0 0;background:color-mix(in srgb,var(--c) 34%,var(--slate));position:relative;will-change:transform}
.ghost .sp{height:calc(var(--h) * .42)}
.sp.mine{background:var(--light);box-shadow:0 0 var(--glow-blur) color-mix(in srgb,var(--light) 40%,transparent)}
.sp.unsure{background:transparent;outline:1px dashed var(--x-gap-ink);outline-offset:-1px}
.sp.unsure.mine{background:color-mix(in srgb,var(--light) 30%,transparent);outline-color:var(--light)}
/* the new detail as a band at the head of every spine */
.sp .band{position:absolute;left:0;right:0;top:0;height:var(--space-3);opacity:0;transition:opacity var(--motion-calm) var(--ease-out);transition-delay:calc(var(--d) * 1ms)}
.banded .sp .band{opacity:1}
.b-filled{background:var(--ink)} .b-doc{background:color-mix(in srgb,var(--info) 70%,var(--ink-muted))} .b-keep{background:transparent;outline:1px dashed var(--ink-muted);outline-offset:-1px} .b-nobody{background:transparent;outline:1px dashed var(--warning);outline-offset:-1px}
.c-org{--c:var(--floor-org-high)} .c-department{--c:var(--floor-department-high)} .c-team{--c:var(--floor-team-high)}
.flag{position:absolute;top:calc((var(--hf) - 1) * var(--x-shelf-h) - var(--space-4) - var(--fo, 0px));left:0;white-space:nowrap;font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light);pointer-events:none}
.flag::after{content:"";position:absolute;left:calc(var(--space-1) / 2);top:calc(100% + 2px);width:1px;height:calc((1 - var(--hf)) * var(--x-shelf-h) + var(--space-2) + var(--fo, 0px));background:color-mix(in srgb,var(--light) 50%,transparent)}
.ghost .flag{display:none}
.says{display:grid;align-items:start;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--space-6);margin-top:var(--space-6);padding-top:var(--space-4);border-top:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.says h2{margin:var(--space-1) 0 var(--space-2);font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.says p{margin:0 0 var(--space-2)} .says p.m{color:var(--ink-muted)}
.says ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.says li{display:grid;grid-template-columns:var(--space-3) minmax(0,1fr);gap:var(--space-2);color:var(--ink-muted)}
.says li i{width:var(--space-3);height:var(--space-3);border-radius:2px;margin-top:2px}
.says li b{font-weight:400;color:var(--ink)}
@media (max-height:840px){ :root{--x-shelf-h:calc(var(--space-8) - var(--space-3));--x-ghost-h:var(--space-6)} .main{padding-top:var(--space-4)} .head{margin-bottom:var(--space-2)} .stage{gap:var(--space-3)} #la{margin-bottom:var(--space-6)} .head{margin-bottom:var(--space-4)} .says{margin-top:var(--space-6);padding-top:var(--space-3)} }
@media (prefers-reduced-motion: reduce){ .sp{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Data Atlas"><div class="an" id="appname"></div><div id="navs"></div><div class="foot" id="railfoot"></div></nav>
  <main class="main" id="main">
    <div class="head"><div><div class="eyebrow" id="crumb"></div><h1 id="ename"></h1><div class="sub" id="esub"></div></div><div class="modes" role="group" aria-label="Change" id="modes"></div></div>
    <div class="stage">
      <section aria-label="Before"><div class="lbl micro" id="lb"></div><div class="shelf ghost" id="before"></div></section>
      <section aria-label="Now" style="margin-top:var(--space-4)"><div class="lbl micro" id="la"></div><div class="shelf" id="after"></div></section>
    </div>
    <div class="says" id="says"></div>
  </main>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="keys" id="keys"></div>
<div class="x-cap"><b>Structure changes · V5</b> the shelf, before and after · library re-shelving, stack maps</div>
<script>
/*@DATA*/
/*@BASE_JS*/
/* a seeded random so every replay shelves the same way */
const rnd = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
const MAXSPINES = 140;
const ORDER = ['split', 'add-kind', 'add-detail', 'rename'];
const NAMES = { split: 'Split', 'add-kind': 'New kind', 'add-detail': 'New detail', rename: 'Rename' };
let mode = 'split';
function spinesFor(c) {
  const k = kindOf(c.kind), n = c.type === 'rename' ? c.n : k.count, per = Math.max(1, Math.ceil(n / MAXSPINES)), m = Math.ceil(n / per), r = rnd(7 + k.count);
  const floors = c.byFloor.flatMap(f => Array(Math.round(f.n / per)).fill(f.floor));
  const S = Array.from({ length: m }, (_, i) => ({ id: i, h: .55 + r() * .45, f: floors[i % floors.length] || k.floor }));
  S.sort(() => r() - .5); S.forEach((s, i) => s.id = i);
  return { S, per, k };
}
function plan(c) {
  const { S, per, k } = spinesFor(c);
  const take = (n, f) => S.filter(s => !s.g).slice(0, Math.round(n / per)).forEach(s => s.g = f);
  const total = c.type === 'rename' ? c.n : k.count;
  let before = [{ label: k.plural, n: total, ids: S.map(s => s.id) }], after, mine = [], says;
  if (c.type === 'split') {
    take(c.into[0].n, 'a'); take(c.unsure, 'u'); S.filter(s => !s.g).forEach(s => s.g = 'b');
    after = [{ label: c.into[0].word + 's', n: c.into[0].n, ids: S.filter(s => s.g === 'a').map(s => s.id), cls: 'newsec' }, { gap: true, label: 'Not placed yet', who: 'Fleet keepers', n: c.unsure, ids: S.filter(s => s.g === 'u').map(s => s.id) }, { label: c.into[1].word + 's', n: c.into[1].n, ids: S.filter(s => s.g === 'b').map(s => s.id), cls: 'newsec' }];
    S.filter(s => s.g === 'u').forEach(s => s.unsure = true);
    mine = [{ id: S.find(s => s.g === 'b').id, name: DATA.vehicles[0].name }, { id: S.find(s => s.g === 'u').id, name: DATA.vehicles[1].name }];
    says = { h: `${k.plural} became ${c.into.map(x => x.word.toLowerCase() + 's').join(' and ')}`, p: `Each was placed by its “${c.by_detail}”. ${c.unsure} couldn’t be told apart; they sit in a held space between the two until Fleet keepers place them. Nothing is hidden: search for any of them by its old kind still finds it.`,
      li: [[`var(--light)`, `<b>${esc(DATA.vehicles[0].name)}</b>, which you look at, moved to ${esc(c.into[1].word.toLowerCase())}s.`], [`transparent;outline:1px dashed var(--light)`, `<b>${esc(DATA.vehicles[1].name)}</b> is in the held space: its “${esc(c.by_detail)}” is empty.`]] };
  } else if (c.type === 'add-kind') {
    take(c.match.sure + c.match.ask, 'd'); const d = S.filter(s => s.g === 'd'); d.slice(-c.match.ask).forEach(s => s.unsure = true);
    after = [{ label: k.plural, n: k.count - c.match.sure - c.match.ask, ids: S.filter(s => s.g !== 'd').map(s => s.id) }, { label: c.newKind.plural, n: c.match.sure + c.match.ask, sub: `a kind of ${k.word.toLowerCase()}`, ids: d.map(s => s.id), cls: 'newsec', bookend: true }];
    mine = [{ id: d[0].id, name: DATA.records[0].name }];
    says = { h: `${c.newKind.plural} now have their own place inside ${k.plural.toLowerCase()}`, p: `${c.newKind.rule}. ${c.match.sure} sites matched; ${c.match.ask} wait for a keeper to confirm (dashed). A depot is still a site: every list of sites still shows it.`, li: [[`var(--light)`, `<b>${esc(DATA.records[0].name)}</b>, which you look at, is now filed as a ${esc(c.newKind.word.toLowerCase())}.`]] };
  } else if (c.type === 'add-detail') {
    const g = c.gaps, parts = [['filled', g.filled], ['doc', g.fromDocs], ['keep', g.keepers], ['nobody', g.nobody]];
    parts.forEach(([b, n]) => S.filter(s => !s.band).slice(0, Math.max(b === 'filled' ? 1 : 0, Math.round(n / per))).forEach(s => s.band = b));
    S.filter(s => !s.band).forEach(s => s.band = 'keep');
    after = [{ label: k.plural, n: total, ids: S.map(s => s.id), banded: true }];
    mine = [{ id: S.find(s => s.band === 'keep').id, name: DATA.records[1].name }];
    says = { h: `Every ${k.word.toLowerCase()} gained a band: “${c.detail.word}”`, p: `Nothing moved; each spine now carries one more detail at its head. ${c.noLoss}`,
      li: [['var(--ink)', `<b>${g.filled}</b> filled`], ['color-mix(in srgb,var(--info) 70%,var(--ink-muted))', `<b>${g.fromDocs}</b> ${esc(c.fillers.fromDocs.word.toLowerCase())}`], ['transparent;outline:1px dashed var(--ink-muted)', `<b>${g.keepers}</b> ${esc(c.fillers.keepers.word.toLowerCase())}`], ['transparent;outline:1px dashed var(--warning)', `<b>${g.nobody}</b> ${esc(c.fillers.nobody.word.toLowerCase())}`]] };
  } else {
    after = [{ label: c.toPlural, was: k.plural, n: total, ids: S.map(s => s.id) }];
    mine = [{ id: S[17].id, name: DATA.workorders[0].ref }];
    says = { h: `${c.from}s are now called ${c.toPlural.toLowerCase()}`, p: `${c.why} Nothing moved. The shelf keeps the old name, struck through, so it can still be found by it.`, li: [[`var(--light)`, `<b>${esc(DATA.workorders[0].ref)}</b>, which you look at, is the same record under a new name.`]] };
  }
  return { S, per, k, before, after, mine, says };
}
function shelfHTML(secs, P, ghost) {
  const byId = Object.fromEntries(P.S.map(s => [s.id, s]));
  return secs.map(sec => `<div class="sec${sec.gap ? ' gapsec' : ''}${sec.cls && !ghost ? ' ' + sec.cls : ''}" style="--n:${Math.max(sec.ids.length, sec.gap ? 16 : 6)}"${sec.gap ? ' data-tip="held"' : ''}>
    <div class="row">${sec.bookend && !ghost ? '<span class="bookend"></span>' : ''}${sec.ids.map(id => { const s = byId[id], m = P.mine.find(x => x.id === id);
      return `<span class="sp c-${s.f}${m ? ' mine' : ''}${s.unsure && !ghost ? ' unsure' : ''}" data-id="${id}" style="--h:${(s.h * 100).toFixed(1)}%;--hf:${s.h.toFixed(3)}">${!ghost && sec.banded ? `<i class="band b-${s.band}" style="--d:${Math.round(id * 7)}"></i>` : ''}${m && !ghost ? `<span class="flag" style="--fo:calc(var(--space-5) * ${P.mine.indexOf(m)})">${esc(m.name)}</span>` : ''}</span>`; }).join('')}</div>
    <div class="cap">${sec.gap ? `${ic('circle-help', 12)} ${esc(sec.label)} · <b>${esc(sec.who)}</b>` : `${sec.was && !ghost ? `<s>${esc(sec.was)}</s>` : ''}<span>${esc(sec.label)}</span>${sec.sub ? `<span class="mono">${esc(sec.sub)}</span>` : ''}`}<span class="mono">${(sec.n ?? sec.ids.length * P.per).toLocaleString('en-GB')}</span></div></div>`).join('');
}
TIPS.held = () => { const c = DATA.changes.find(x => x.type === 'split'); return `<div class="micro">A held space</div><div class="t">${c.unsure} vehicles not placed yet</div><p>Their “${esc(c.by_detail)}” is empty, so the split couldn’t tell which they are.</p><p class="m">Fleet keepers can fill it, and each moves to its shelf when they do.</p>`; };
let P;
function render(c, stage) {
  P = plan(c);
  $('#lb').innerHTML = `<b>Before</b> · until ${esc(fmtWhen(c.when).split(' ·')[0])}`;
  $('#la').innerHTML = `<b>Now</b> · ${esc(NAMES[c.type].toLowerCase())} by ${esc(c.by)} · ${esc(fmtWhen(c.when).split(' ·')[0])}${P.per > 1 ? ` · one spine is ${P.per} records` : ''}`;
  $('#before').innerHTML = shelfHTML(P.before, P, true);
  $('#after').innerHTML = shelfHTML(stage === 'before' ? P.before : P.after, P, stage === 'before');
  $('#after').classList.toggle('banded', stage !== 'before' && c.type === 'add-detail');
  $('#says').innerHTML = `<div><div class="micro">What changed on the shelf</div><h2>${esc(P.says.h)}</h2><p class="m">${esc(P.says.p)}</p></div><ul>${P.says.li.map(([c2, t]) => `<li><i style="background:${c2}"></i><span>${t}</span></li>`).join('')}</ul>`;
  $('#says').style.opacity = stage === 'before' ? 0 : 1;
  Icons.hydrate($('#main'));
}
/* FLIP: shelve the 'before' order, then animate every spine to its new place */
function play(c) {
  render(c, 'before');
  const first = Object.fromEntries($$('#after .sp').map(el => [el.dataset.id, el.getBoundingClientRect()]));
  later(() => {
    render(c, 'after');
    if (reduced) return;
    $$('#after .sp').forEach(el => { const f = first[el.dataset.id], l = el.getBoundingClientRect(); if (!f) return;
      el.style.transform = `translate(${f.left - l.left}px,0)`; el.style.transition = 'none'; });
    requestAnimationFrame(() => requestAnimationFrame(() => $$('#after .sp').forEach((el, i) => { el.style.transition = `transform var(--motion-run) var(--ease-standard) ${(i % 23) * 12}ms`; el.style.transform = ''; })));
    $('#says').style.transition = 'opacity var(--motion-calm) var(--ease-out) var(--motion-run)';
  }, ms('--motion-run'));
}
function setMode(m) { clearLater(); mode = m; $$('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m)); play(DATA.changes.find(c => c.type === m)); }
$('#crumb').textContent = DATA.app + ' · What we keep';
$('#ename').textContent = 'The shelves';
$('#esub').innerHTML = `Every record is a spine, coloured by the floor it’s kept on. When the kinds of thing change, <b>you watch them re-shelved</b>.`;
$('#modes').innerHTML = ORDER.map((m, i) => `<button data-m="${m}" aria-pressed="false">${esc(NAMES[m])}<span class="kbd">${i + 1}</span></button>`).join('');
$$('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));
rail(`Spines: ${['org', 'department', 'team'].map(f => fl(f)).join('<br>')}<br><br>Lit spines are records <b>you look at</b>. A dashed spine or space is a gap: someone must place or fill it.`);
keys([['1 2 3 4', 'change'], ['Space', 're-shelve'], ['R', 'replay']]);
function demo() { setMode('split'); }
boot(demo, e => {
  const i = /^[1-4]$/.test(e.key) ? +e.key - 1 : -1; if (i >= 0) setMode(ORDER[i]);
  if (e.key === ' ') { e.preventDefault(); setMode(mode); }
});
</script>
</body>
</html>
