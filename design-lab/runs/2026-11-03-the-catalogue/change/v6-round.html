/* ======================================================================
   Proposed tokens (combinations of kit tokens only). Listed in notes.md.
   ====================================================================== */
:root{
  --x-type-micro:.6875rem;                                                   /* --type-micro: mono eyebrows inside data (wear-and-time already proposes it) */
  --x-gap-ink:color-mix(in srgb,var(--ink-muted) 70%,transparent);            /* --mark-gap: the dashed edge of an expected-but-missing value */
  --x-gap-fill:color-mix(in srgb,var(--ink) 3%,transparent);                 /* --mark-gap-fill: a gap is a held place, faintly lit, not hatch */
  --x-hatch:color-mix(in srgb,var(--ink-muted) 34%,transparent);             /* --mark-stale-hatch (wear and time): 'no record', not a gap */
  --x-stale:repeating-linear-gradient(45deg,transparent 0 var(--space-1),var(--x-hatch) var(--space-1) calc(var(--space-1) + 1px));
  --x-new:color-mix(in srgb,var(--green) 70%,var(--ink));                    /* --mark-structure-new: the structure itself changed here */
  --x-new-wash:color-mix(in srgb,var(--green) 10%,transparent);
  --x-seam:color-mix(in srgb,var(--warning) 55%,var(--ink));                 /* --mark-seam (wear-and-time grammar V1) */
  --x-paper:color-mix(in srgb,var(--ink) 92%,var(--warning));             /* --surface-slip: a paper notice, the one light surface */
  --x-paper-ink:var(--slate-deep);
  --x-near-dim:.55;                                                          /* far plane when one thing is in focus */
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.micro{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.tech{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:0}
.kbd{display:inline-block;font:400 var(--x-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink);min-width:var(--space-4);text-align:center}
.keys{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:var(--layer-chrome);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-3);max-width:calc(100% - var(--measure-glance) - var(--space-6));font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}
.keys > span{display:inline-flex;align-items:center;gap:var(--space-1);white-space:nowrap}

/* ---- app frame ---- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr)}
.rail{background:color-mix(in srgb,var(--slate-deep) 70%,transparent);border-right:1px solid var(--hairline);padding:var(--edge) var(--edge-tight);display:flex;flex-direction:column;gap:var(--space-1);min-height:0}
.rail .an{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light);padding:var(--space-2);margin-bottom:var(--space-4)}
.nav{text-decoration:none;display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-meta);border-radius:var(--radius-key)}

.rail .foot{margin-top:auto;margin-bottom:var(--space-6);padding:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rail .foot b{font-weight:400;color:var(--ink)}
.main{position:relative;padding:var(--edge) var(--space-6) var(--space-7);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-4)}
.head h1{margin:var(--space-2) 0 var(--space-1);font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.head .sub{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.head .sub b{font-weight:400;color:var(--ink)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-raised)}
.btn.go{border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green)}
.btn.quiet{border-color:transparent;color:var(--ink-muted)}
.btn[aria-disabled="true"]{color:var(--ink-muted);border-style:dashed;cursor:help}

/* ---- floors ---- */
.fl{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.fl::before{content:"";width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--c)}
.f-org{--c:var(--floor-org-high)} .f-department{--c:var(--floor-department-high)} .f-team{--c:var(--floor-team-high)} .f-you{--c:var(--floor-you-high)}

/* ---- the gap: an expected detail a record doesn't hold yet ----
   A held place: dashed edge, faint fill, and who could fill it. Different
   from wear-and-time's 'no record' (hatch), which says nobody can know. */
.gap{display:inline-flex;align-items:center;gap:var(--space-2);min-height:calc(var(--space-5) - var(--space-1));padding:0 var(--space-2);border:1px dashed var(--x-gap-ink);border-radius:var(--radius-key);background:var(--x-gap-fill);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.gap b{font-weight:400;color:var(--ink)}
.gap.nobody{border-color:color-mix(in srgb,var(--warning) 50%,transparent)}
.gap.nobody b{color:var(--warning)}
.gap.doc b{color:var(--ink)}
.newtag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-new);white-space:nowrap}

/* ---- why-pane ---- */
.tip{position:fixed;z-index:var(--layer-overlay);width:var(--measure-card);padding:var(--space-3) var(--space-4);background:var(--surface-overlay);-webkit-backdrop-filter:blur(var(--surface-blur));backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);opacity:0;pointer-events:none;transition:opacity var(--motion-quick) var(--ease-out)}
.tip.on{opacity:1}
.tip .t{margin:var(--space-1) 0;color:var(--light);font-size:var(--type-body);line-height:var(--leading-body)}
.tip p{margin:0 0 var(--space-1);font-size:var(--type-meta);line-height:var(--leading-meta)}
.tip p.m{color:var(--ink-muted)}

.fade{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
@media (prefers-reduced-motion: reduce){ .fade{transition:opacity var(--motion-base) linear!important;transform:none!important} }

/* ---- V6: the new detail arrives as a round of small jobs, one question each ---- */
.split{display:grid;grid-template-columns:minmax(0,var(--measure-read)) minmax(0,1fr);gap:var(--space-6);align-items:start}
.dots{display:flex;align-items:center;gap:var(--space-1);margin-bottom:var(--space-3)}
.dots i{width:var(--space-3);height:var(--space-3);border-radius:var(--radius-pill);border:1px dashed var(--x-gap-ink);transition:background var(--motion-base) var(--ease-out),border-color var(--motion-base)}
.dots i.done{background:var(--ink-muted);border:1px solid var(--ink-muted)}
.dots i.cur{border:1px solid var(--light);box-shadow:0 0 0 var(--focus-gap) color-mix(in srgb,var(--light) 12%,transparent)}
.dots span{margin-left:var(--space-3)}
.pile{position:relative;min-height:calc(var(--space-8) * 3 + var(--space-3))}
.job{position:absolute;left:0;right:0;top:0;border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);-webkit-backdrop-filter:blur(var(--surface-blur));backdrop-filter:blur(var(--surface-blur));padding:var(--space-4) var(--space-5);box-shadow:var(--shadow-raised);transition:transform var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.job.next{transform:translateY(calc(var(--k) * var(--space-4))) scale(calc(1 - var(--k) * .03));opacity:calc(.7 - var(--k) * .25);z-index:calc(5 - var(--k));pointer-events:none}
.job.next > *{visibility:hidden}
.job.cur{z-index:6}
.job.gone{transform:translateX(calc(var(--travel-near) * 4));opacity:0;pointer-events:none}
.job.pre{transform:translateY(var(--travel-near));opacity:0}
.job h2{margin:var(--space-1) 0 var(--space-3);font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--light)}
.quote{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);padding:var(--space-3) var(--space-4);border-left:2px solid var(--hairline-strong);background:var(--surface-inset);border-radius:0 var(--radius-key) var(--radius-key) 0;margin-bottom:var(--space-3)}
.quote svg{color:var(--ink-muted);margin-top:2px}
.quote .q{font:400 var(--type-body)/var(--leading-body) var(--font-mono);color:var(--ink)}
.quote .s{grid-column:2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.quote .s b{font-weight:400;color:var(--ink)}
.ask{margin:0 0 var(--space-3);font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)}
.ask b{font-weight:400;color:var(--light);font-family:var(--font-mono)}
.acts{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.acts .btn .kbd{opacity:.7}
.btn.press{background:color-mix(in srgb,var(--green) 18%,transparent)}
.datein{display:none;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.datein.on{display:flex}
.datein input{height:var(--target-sm);padding:0 var(--space-3);border:1px dashed var(--x-gap-ink);border-radius:var(--radius-key);background:var(--x-gap-fill);color:var(--ink);font:400 var(--type-meta) var(--font-mono)}
.upnext{margin-top:var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.upnext ol{list-style:none;margin:var(--space-2) 0 0;padding:0;display:grid;gap:var(--space-1)}
.upnext li{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) auto;gap:var(--space-2);padding:var(--space-1) 0;border-bottom:1px solid var(--hairline)}
.upnext li b{font-weight:400;color:var(--ink)}
.foot2{margin-top:var(--space-3);padding-top:var(--space-2);border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
/* right: what the answer does to the record, and everyone else's rounds */
.side{display:flex;flex-direction:column;gap:var(--space-5)}
.mini{border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4)}
.mini .r{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-3)) minmax(0,1fr);gap:var(--space-3);padding:var(--space-1) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);align-items:center;min-height:var(--target-sm)}
.mini .r .w{color:var(--ink-muted)}
.mini .r.isnew{transition:background var(--motion-calm) var(--ease-out)}
.mini .r.flash{background:linear-gradient(90deg,var(--x-new-wash),transparent 80%)}
.mini h3{margin:var(--space-1) 0 var(--space-2);font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.val{display:flex;flex-direction:column}
.val small{color:var(--ink-muted)}
.lnk{box-shadow:inset 0 -1px 0 var(--hairline-strong)}
.who{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-1)}
.who li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-3);align-items:baseline;padding:var(--space-1) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.who li b{font-weight:400;color:var(--ink)} .who li small{display:block;color:var(--ink-muted)}
.who li .mono{color:var(--ink)}
.who li.me b{color:var(--light)}
.who li.lead b{color:var(--warning)}
.kbar{display:flex;height:var(--space-2);gap:1px;border-radius:var(--radius-pill);overflow:hidden;margin:var(--space-2) 0 var(--space-1)}
.kbar i{display:block;transition:flex-grow var(--motion-calm) var(--ease-out)}
.s-filled{background:var(--ink)} .s-doc{background:color-mix(in srgb,var(--info) 70%,var(--ink-muted))} .s-keep{background:var(--ink-muted);opacity:.5} .s-nobody{background:var(--warning)}
@media (max-width:1400px){ .split{grid-template-columns:minmax(0,calc(var(--measure-read) - var(--space-7))) minmax(0,1fr);gap:var(--space-5)} }
@media (max-height:840px){ .main{padding-top:var(--space-4)} .head{margin-bottom:var(--space-2)} .job{padding:var(--space-3) var(--space-4)} .job h2{margin-bottom:var(--space-2)} .side{gap:var(--space-3)} .mini .r{min-height:calc(var(--target-sm) - var(--space-2))} .pile{min-height:calc(var(--space-8) * 3)} }
@media (prefers-reduced-motion: reduce){ .job{transition:opacity var(--motion-base) linear!important;transform:none!important} }
</style>
</head>

<script>

   log, counts per kind and floor, expected details per kind, triage),
   Artifacts (documents that could fill a gap), Mandate (intents bound to a
   detail) and Explorer (saved views). Nothing below is specific to one
   deployment: swap this object and the page redraws.

/* ---- helpers shared by every variant ---- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ms = n => parseFloat(cssv(n)) || 0;                 /* motion token in ms */
const px = n => { const v = cssv(n); return v.endsWith('rem') ? parseFloat(v) * 16 : parseFloat(v) || 0; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const kindOf = id => DATA.kinds.find(k => k.id === id);
const fl = f => `<span class="fl f-${DATA.floors[f].tok}">${esc(DATA.floors[f].label)} · ${esc(DATA.floors[f].name)}</span>`;
const fmtWhen = s => { const d = new Date(s.slice(0, 10) + 'T12:00:00'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + (s.length > 10 ? ' · ' + s.slice(11) : ''); };
const ic = (n, s = 16) => Icons.svg(n, { size: s });
let timers = [];
const later = (fn, t) => timers.push(setTimeout(fn, t));
const clearLater = () => { timers.forEach(clearTimeout); timers = []; };
function keys(list) {
  $('#keys').innerHTML = list.map(([a, b]) => `<span>${a.split(' ').map(x => x === 'or' ? 'or' : `<span class="kbd">${esc(x)}</span>`).join(' ')} ${esc(b)}</span>`).join('');
}
function rail(foot) {
  $('#appname').textContent = DATA.app;
  $('#navs').innerHTML = DATA.nav.map(n => `<a class="nav${n.on ? ' on' : ''}" href="#"><i data-lucide="${n.icon}" data-size="16"></i>${esc(n.label)}${n.n != null ? `<span class="n">${n.n}</span>` : ''}</a>`).join('');
  if (foot) $('#railfoot').innerHTML = foot;
}
/* why-panes for anything that explains itself */
const TIPS = {};
function tip(el) { const p = $('#tip'), k = el.dataset.tip; if (!TIPS[k]) return; p.innerHTML = TIPS[k](el); const r = el.getBoundingClientRect(), g = px('--space-3');
  p.style.left = Math.max(g, Math.min(innerWidth - p.offsetWidth - g, r.left + r.width / 2 - p.offsetWidth / 2)) + 'px';
  const top = r.bottom + g; p.style.top = (top + p.offsetHeight > innerHeight - g ? r.top - g - p.offsetHeight : top) + 'px'; p.classList.add('on'); Icons.hydrate(p); }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) tip(el); });
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) $('#tip').classList.remove('on'); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) tip(el); else $('#tip').classList.remove('on'); });
function boot(demo, onKey) {
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ((e.key === 'r' || e.key === 'R') && e.target.tagName !== 'INPUT') { $('#tip').classList.remove('on'); clearLater(); return demo(); }
    if (onKey) onKey(e);
  });
  Icons.hydrate();
  document.fonts.ready.then(demo);
}
/* the gap mark: who could fill this, in plain words */
function gapMark(rec, short) {
  const f = rec.fill, ch = DATA.changes[0].fillers;
  if (f.state === 'filled') return `<span class="mono">${esc(f.value)}</span>`;
  if (f.state === 'doc') return `<span class="gap doc" data-tip="doc" data-r="${esc(rec.name)}">${ic('file-search', 14)}<span>${short ? '' : 'Not filled · '}<b>${esc(f.value)}?</b> read from a document</span></span>`;
  if (f.state === 'keeper') return `<span class="gap keeper" data-tip="keeper" data-r="${esc(rec.name)}">${ic('user-check', 14)}<span>${short ? '' : 'Not filled · '}<b>${esc(f.who)}</b> can fill</span></span>`;
  return `<span class="gap nobody" data-tip="nobody" data-r="${esc(rec.name)}">${ic('circle-help', 14)}<span>${short ? '' : 'Not filled · '}<b>nobody yet</b>, ${esc(f.ask)} asked</span></span>`;
}
const recBy = el => DATA.records.find(r => r.name === el.dataset.r);
TIPS.doc = el => { const r = recBy(el), c = DATA.changes[0]; return `<div class="micro">Gap · ${esc(c.detail.word)}</div><div class="t">${esc(c.fillers.fromDocs.word)}</div><p><b>${esc(r.fill.value)}</b> was read from <b>${esc(r.fill.src)}</b> in Artifacts.</p><p class="m">${esc(c.fillers.fromDocs.how)} Until then it is not shown as known.</p>`; };
TIPS.keeper = el => { const r = recBy(el), c = DATA.changes[0]; return `<div class="micro">Gap · ${esc(c.detail.word)}</div><div class="t">${esc(r.fill.who)} can fill this</div><p>They manage ${esc(r.name)}. ${esc(c.fillers.keepers.how)}</p><p class="m">Anyone can propose a value; it waits in Triage for them.</p>`; };
TIPS.nobody = el => { const r = recBy(el), c = DATA.changes[0]; return `<div class="micro">Gap · ${esc(c.detail.word)}</div><div class="t">${esc(c.fillers.nobody.word)}</div><p>${esc(r.name)} has no manager on record, so no one is asked by default.</p><p class="m">${esc(c.fillers.nobody.how)} You can propose a value now.</p>`; };
/* every detail a site record could hold, older gaps included, then the new one */
function siteRows(rec, short) {
  const d = DATA.details.site, c = DATA.changes[0];
  const old = (txt) => `<span class="gap" data-tip="oldgap">${ic('user-check', 14)}<span>Not filled · <b>${esc(txt)}</b> can fill</span></span>`;
  const val = { 'Address': esc(rec.addr), 'Opened': `<span class="mono">${esc(rec.opened)}</span>`,
    'Manager': rec.manager ? `<span class="lnk">${esc(rec.manager)}</span>` : `<span class="gap nobody" data-tip="nomgr">${ic('circle-help', 14)}<span>Not filled · <b>nobody yet</b></span></span>`,
    'Floor area': rec.area ? `<span class="mono">${esc(rec.area)}</span>` : old(DATA.floors.department.name + ' keepers'),
    'Runs from': rec.contract ? `<span class="lnk">${esc(rec.contract)}</span>` : old(DATA.floors.department.name + ' keepers') };
  return d.map(x => ({ word: x.word, tech: x.tech, html: val[x.word], link: x.link }))
    .concat([{ word: c.detail.word, tech: c.detail.tech, html: gapMark(rec, short), isNew: true }]);
}
TIPS.oldgap = () => `<div class="micro">Gap</div><div class="t">Expected, not filled yet</div><p>Every site is expected to hold this. Keepers on the ${esc(DATA.floors.department.label)} floor can fill it.</p><p class="m">Anyone can propose a value; it waits in Triage.</p>`;
TIPS.nomgr = () => `<div class="micro">Gap · Manager</div><div class="t">No manager on record</div><p>${esc(DATA.changes[0].fillers.nobody.how)}</p>`;

const C = DATA.changes[0], RD = C.round, K = kindOf(C.kind);
let at = 0, done = RD.done, answered = {};
const recFor = site => DATA.records.find(r => r.name === site) || { name: site, addr: '', manager: null, floor: 'department' };
function jobHTML(j, i, cls, k) {
  const n = RD.done + i + 1;
  const quote = `<div class="quote">${ic('file-search', 16)}<span class="q">“${esc(j.seen)}”</span><span class="s"><b>${esc(j.src)}</b>, ${esc(j.where)} · in Artifacts</span></div>`;
  const ask = j.value ? `<p class="ask">Is the next fire-safety check due <b>${esc(j.value)}</b>?</p>` : `<p class="ask">The date can’t be read. Do you know it?</p>`;
  const acts = j.value ? `<button class="btn go" data-a="yes">${ic('check', 16)} Yes, that’s right <span class="kbd">Enter</span></button><button class="btn" data-a="fix">No, it’s… <span class="kbd">C</span></button>`
    : `<button class="btn go" data-a="fix">${ic('square-pen', 16)} I know it <span class="kbd">C</span></button>`;
  return `<article class="job ${cls}" style="--k:${k}" data-i="${i}"><div class="micro">Job ${n} of ${RD.mine} · ${esc(C.detail.word)}</div><h2>${esc(j.site)}</h2>${quote}${ask}
    <div class="datein"><input type="text" aria-label="${esc(C.detail.word)}" placeholder="dd mmm yyyy"><button class="btn go" data-a="save">Save <span class="kbd">Enter</span></button></div>
    <div class="acts">${acts}<button class="btn quiet" data-a="cant" data-tip="cant">Can’t tell <span class="kbd">N</span></button><button class="btn quiet" data-a="notmine" data-tip="notmine">Not mine <span class="kbd">X</span></button></div>
    <div class="foot2">One question, about 20 seconds. Your answer is shown on the record as yours, with this document as its source.</div></article>`;
}
TIPS.cant = () => `<div class="micro">Can’t tell</div><div class="t">The job goes to ${esc(RD.lead.who)}</div><p>With your note. The gap stays on the record, now saying it was looked at and why it’s still open.</p>`;
TIPS.notmine = () => `<div class="micro">Not mine</div><div class="t">Back to the pool</div><p>${esc(RD.lead.who)} finds the right keeper. Nothing is lost.</p>`;
function renderPile() {
  $('#pile').innerHTML = RD.jobs.map((j, i) => i < at ? '' : jobHTML(j, i, i === at ? 'cur' : 'next', i - at)).join('');
  $$('#pile .job.cur [data-a]').forEach(b => b.onclick = () => act(b.dataset.a));
  Icons.hydrate($('#pile'));
}
function renderNext() {
  const rest = RD.jobs.slice(at + 1), more = RD.mine - RD.done - RD.jobs.length;
  $('#upnext').innerHTML = `<div class="micro">Next in your round</div><ol>${rest.map((j, i) => `<li><span class="mono">${RD.done + at + i + 2}</span><b>${esc(j.site)}</b><span>${j.value ? 'a document suggests a date' : 'date unreadable'}</span></li>`).join('')}${more > 0 ? `<li><span></span><span>and ${more} more, from the same documents</span><span></span></li>` : ''}</ol>`;
}
function renderDots() {
  $('#dots').innerHTML = Array.from({ length: RD.mine }, (_, i) => `<i class="${i < done ? 'done' : i === done ? 'cur' : ''}"></i>`).join('') + `<span>${done} of ${RD.mine} done · yours</span>`;
}
function renderMini(flash) {
  const j = RD.jobs[Math.min(at, RD.jobs.length - 1)], r = recFor(j.site), a = answered[j.site];
  const val = a ? `<span class="val"><span class="mono">${esc(a.value)}</span><small>${esc(RD.me.name)}, just now · from ${esc(j.src)}</small></span>`
    : j.value ? `<span class="gap doc">${ic('file-search', 14)}<span><b>${esc(j.value)}?</b> waiting for you</span></span>` : `<span class="gap">${ic('user-check', 14)}<span>Not filled · <b>you</b> can fill</span></span>`;
  $('#mini').innerHTML = `<div class="micro">On the record · what your answer changes</div><h3>${esc(j.site)}</h3>
    ${r.addr ? `<div class="r"><span class="w">Address</span><span>${esc(r.addr)}</span></div>` : ''}
    <div class="r"><span class="w">Manager</span><span>${r.manager ? `<span class="lnk">${esc(r.manager)}</span>` : `<span class="gap nobody" data-tip="nomgr">${ic('circle-help', 14)}<span><b>nobody yet</b></span></span>`}</span></div>
    <div class="r isnew${flash ? ' flash' : ''}"><span class="w">${esc(C.detail.word)}<span class="newtag" style="display:flex">${ic('sparkle', 12)} new</span></span>${val}</div>`;
  Icons.hydrate($('#mini'));
}
function renderOthers() {
  const g = C.gaps, filled = g.filled + done - RD.done;
  const bar = [['filled', filled], ['doc', g.fromDocs - (done - RD.done)], ['keep', g.keepers], ['nobody', g.nobody]];
  $('#others').innerHTML = `<div class="micro">Everyone’s rounds · ${esc(K.plural.toLowerCase())}</div><div class="kbar">${bar.map(([c, n]) => `<i class="s-${c}" style="flex-grow:${n}"></i>`).join('')}</div>
    <div class="micro" style="margin-bottom:var(--space-2)">${filled} of ${g.total} filled</div>
    <ul class="who"><li class="me"><span><b>You, ${esc(RD.me.name)}</b><small>${esc(RD.me.team)}: confirming what documents say</small></span><span class="mono">${RD.mine - done} left</span></li>
    ${RD.others.map(o => `<li><span><b>${esc(o.who)}</b><small>${esc(o.role)}</small></span><span class="mono">${o.n}</span></li>`).join('')}
    <li class="lead"><span><b>${esc(RD.lead.who)}</b><small>${esc(RD.lead.role)}: ${esc(RD.lead.task)}</small></span><span class="mono">${RD.lead.n}</span></li></ul>`;
}
function render(flash) { renderDots(); renderPile(); renderNext(); renderMini(flash); renderOthers(); }
function act(a) {
  const card = $('#pile .job.cur'); if (!card) return; const j = RD.jobs[at];
  if (a === 'fix') { $('.datein', card).classList.add('on'); $('.datein input', card).focus(); return; }
  if (a === 'save') { const v = $('.datein input', card).value.trim(); if (!v) return; return advance(j, v); }
  if (a === 'yes' && j.value) return advance(j, j.value);
  if (a === 'cant' || a === 'notmine') return advance(j, null);
}
function advance(j, value) {
  if (value) answered[j.site] = { value };
  done++; renderMini(true); renderDots(); renderOthers();
  const card = $('#pile .job.cur'); card.classList.add('gone');
  later(() => { at = Math.min(at + 1, RD.jobs.length - 1); renderPile(); const c = $('#pile .job.cur'); c.classList.add('pre'); requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove('pre'))); renderNext(); }, ms('--motion-calm'));
}
/* the record pane stays on your last answer until you turn to the next card */
['mouseover', 'focusin'].forEach(ev => $('#pile').addEventListener(ev, e => { if (e.target.closest('.job.cur') && $('#mini h3')?.textContent !== RD.jobs[at].site) renderMini(false); }));
function demo() {
  clearLater(); at = 0; done = RD.done; answered = {}; render(false);

  later(() => c.classList.remove('pre'), reduced ? 0 : ms('--motion-run'));
  later(() => { const b = $('#pile .job.cur [data-a="yes"]'); b.focus({ preventScroll: true }); b.classList.add('press'); }, ms('--motion-run') + ms('--motion-run'));
  later(() => act('yes'), ms('--motion-run') * 2 + ms('--motion-calm'));
}
$('#crumb').textContent = `${DATA.app} · Your round`;
$('#ename').textContent = 'A round of small jobs';
$('#esub').innerHTML = `${esc(K.plural)} gained “${esc(C.detail.word)}” on ${esc(fmtWhen(C.when).split(' ·')[0])}. <b>Each job asks one question about one site.</b> Nothing is filled until someone answers.`;
rail(`A change to the kinds of thing doesn’t become a backlog. It becomes rounds: <b>small, named, shared</b>, and anyone can see who holds which.`);
keys([['Enter', 'yes'], ['C', 'correct'], ['N', 'can’t tell'], ['X', 'not mine'], ['R', 'replay']]);
boot(demo, e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Enter') act('save'); return; }
  if (e.key === 'Enter') { e.preventDefault(); act(RD.jobs[at].value ? 'yes' : 'fix'); }
  if (e.key === 'c' || e.key === 'C') { e.preventDefault(); act('fix'); }
  if (e.key === 'n' || e.key === 'N') act('cant');
  if (e.key === 'x' || e.key === 'X') act('notmine');
