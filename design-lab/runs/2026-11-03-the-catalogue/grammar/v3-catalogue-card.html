/* ---------------------------------------------------------------
   Proposed tokens for the catalogue grammar. Every one is a mix of kit
   tokens and is listed as "needs token" in notes.md.
   --------------------------------------------------------------- */
:root{
  /* --mark-gap: the gap mark. Four corner ticks of the slot a detail would fill. No fill, no hatch. */
  --x-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-gap-tick: var(--space-2);
  --x-gap:
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left top / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left top / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right top / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right top / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left bottom / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left bottom / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right bottom / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right bottom / 1px var(--x-gap-tick) no-repeat;
  /* --mark-stale-hatch and shadow: carried unchanged from wear-and-time and the cinematic light language. */
  --x-hatch: color-mix(in srgb, var(--ink-muted) 26%, transparent);
  --x-stale: repeating-linear-gradient(45deg, transparent 0 var(--space-2), var(--x-hatch) var(--space-2) calc(var(--space-2) + 1px));
  --x-shadow: repeating-linear-gradient(135deg, transparent 0 var(--space-2), var(--hairline) var(--space-2) calc(var(--space-2) + 1px));
  /* --mark-expected: the "should have" tick before a detail name in a kind. */
  --x-expected: var(--ink);
  /* --mark-link: the hairline a link is drawn with, and its verb ink. */
  --x-link: var(--hairline-strong);
  /* --time-past-dim from wear-and-time, used for backward readings and quiet lines. */
  --x-quiet: .62;
}
body{overflow:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}

.kindmark.s{width:calc(var(--space-5) - var(--space-1));height:calc(var(--space-5) - var(--space-1))}
.count{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
/* the five empty-looking states */
.gapslot{background:var(--x-gap);padding:var(--space-2) var(--space-3);border-radius:0;min-height:var(--target-sm);display:flex;flex-direction:column;justify-content:center;gap:2px}
.gapslot .gl{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.gapslot .gw{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.staleage{background:var(--x-stale);padding:0 var(--space-1);border-radius:var(--radius-key);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.shadowslot{background:var(--x-shadow),var(--surface-inset);border:1px solid var(--hairline);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:center}
.nonev{color:var(--ink)}
.floorEdge{border-left:2px solid var(--fc)}
[data-tier="department"]{--fc:var(--floor-department-high)}
[data-tier="team"]{--fc:var(--floor-team-high)}
[data-tier="org"]{--fc:var(--floor-org-high)}
[data-tier="you"]{--fc:var(--floor-you-high)}
.ref{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);vertical-align:super;margin-left:2px}
.exptick{display:inline-block;width:2px;height:var(--space-3);background:var(--x-expected);margin-right:var(--space-2);vertical-align:-1px}
.exptick.can{background:transparent}
/* empty-looking family strip */
.fam{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:var(--space-3)}
.fam .st{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.fam .stage{height:calc(var(--space-7) - var(--space-2));position:relative;display:flex;align-items:center;padding:0 var(--space-2);border-radius:var(--radius-key);background:var(--slate-deep);border:1px solid var(--hairline)}
.fam .stage > *{width:100%}
.fam .nm{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.fam .nm small{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);margin-left:var(--space-1)}
.fam .d{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:0}
.fam .tk{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);opacity:var(--x-quiet);margin:0}
.fam .st.on .stage{border-color:var(--hairline-strong);background:var(--surface-raised)}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.vrow .k{color:var(--ink-muted)}
/* deposit animation: parts arrive in order, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-quick))}
.pre .dep{opacity:0;transform:translateY(calc(var(--space-1) * -1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}}
.hints{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:999;display:flex;gap:var(--space-3);align-items:center;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);background:var(--scrim);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key)}
.kbd{font:400 var(--type-small)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1)}

:root{
  /* card proportions: a 5 × 3 inch library card */
  --x-card-ratio: 5 / 3;
  /* ruled lines on the card, one per reading line */
  --x-rule: repeating-linear-gradient(to bottom, transparent 0 calc(var(--leading-body) - 1px), var(--hairline) calc(var(--leading-body) - 1px) var(--leading-body));
}
.wrap{padding-top:var(--space-4)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5);margin-bottom:var(--space-4)}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:var(--space-5);align-items:start}
.lc{position:relative;aspect-ratio:var(--x-card-ratio);border-radius:var(--radius-key);background:var(--slate-deep);border:1px solid var(--hairline-strong);box-shadow:var(--shadow-raised);padding:var(--space-4) var(--space-5) var(--space-5) calc(var(--space-8) + var(--space-2));overflow:hidden}
.lc::before{content:"";position:absolute;left:0;right:0;top:calc(var(--space-6) + var(--space-3));height:3px;border-top:1px solid var(--hairline-strong);border-bottom:1px solid var(--hairline-strong)}
.lc::after{content:"";position:absolute;left:50%;bottom:var(--space-3);width:var(--space-4);height:var(--space-4);margin-left:calc(var(--space-2) * -1);border-radius:var(--radius-pill);background:radial-gradient(var(--slate), var(--slate-deep));border:1px solid var(--hairline-strong)}
.lc .ruled{position:absolute;left:0;right:0;top:calc(var(--space-7) - var(--space-2));bottom:var(--space-6);background:var(--x-rule);opacity:.5;pointer-events:none}
.z{position:relative;transition:background var(--motion-base) var(--ease-standard),opacity var(--motion-base) var(--ease-standard),filter var(--motion-base)}
.z .zn{position:absolute;left:calc((var(--space-8) - var(--space-3)) * -1);top:0;font:400 var(--type-small)/var(--leading-body) var(--font-mono);color:var(--ink-muted)}
.callno{position:absolute;left:var(--space-4);top:var(--space-4);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink);display:flex;flex-direction:column;gap:2px}
.callno .k{display:flex;align-items:center;gap:var(--space-1);text-transform:uppercase;letter-spacing:var(--tracking-caps)}

.rhead{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-caps);text-transform:uppercase;margin:0 0 var(--space-3)}
.famh{display:flex;align-items:baseline;gap:var(--space-3);margin:var(--space-5) 0 var(--space-2)}

@media (max-width:1400px){.lc{aspect-ratio:auto;min-height:calc(var(--measure-card) + var(--space-5))}.main{grid-template-columns:minmax(0,1fr) minmax(0,.9fr)}.rules .nv{display:none}.rules li.on .nv{display:block}.lc{padding-left:var(--space-8)}}

const SHEET = {

      details: [{ n: 'Registered address', v: 'Unit 4, Mill Lane, Ashby', state: 'known', ref: 1 }, { n: 'Contact person', state: 'gap', who: 'Procurement leads can add it' }, { n: 'Insurance certificate', v: 'to 30 Apr 2026', state: 'stale', age: '6 months', ref: 2 }],
      subjects: ['Suppliers', 'Ashby'], links: [{ verb: 'holds', n: 5, kind: 'Contracts' }], sources: ['Supplier register', 'Insurance letter'] },
    { kind: 'incident', name: 'Skid on Kestrel Road', key: { n: 'Reference', v: 'INC-2291' }, floor: 'ops', id: 'ent_01JC1T9R2H…',

/* ===== Shared helpers (generated into every sheet) ===== */
const $ = s => document.querySelector(s);

const ms = n => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)) || 0;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ic = (n, s) => Icons.svg(n, { size: s || 16, stroke: 1.5 });
const K = id => DATA.kinds.find(k => k.id === id) || DATA.elsewhere.find(k => k.id === id);
const FL = id => DATA.floors[id];
const T = id => DATA.terms.find(t => t.id === id);
const REC = DATA.record;
const fmt = n => n.toLocaleString('en-GB');
const det = n => REC.details.find(d => d.n === n);
const byState = s => REC.details.find(d => d.state === s);
const SRC = id => REC.sources.find(s => s.id === id);

/* one stage per empty-looking state, all drawn from the specimen card */
function stateStage(id) {
  const g = byState('gap'), st = byState('stale'), no = byState('none'), h = REC.hidden, nr = REC.noRecord;
  if (id === 'gap') return `<div class="gapslot"><span class="gl">${g.n} · not known yet</span><span class="gw">${g.who}</span></div>`;
  if (id === 'none') return `<div class="vrow"><span class="k">${no.n}</span><span class="nonev">${no.v}<span class="ref">${no.ref}</span></span></div>`;
  if (id === 'stale') return `<div class="vrow"><span class="k">${st.n}</span><span>${st.v} <span class="staleage">${st.age}</span></span></div>`;
  if (id === 'shadow') return `<div class="shadowslot sm">${ic('lock', 14)}<span>${h.n} · kept on ${FL(h.floor).name}</span></div>`;
  if (id === 'could') return `<div class="sm muted">Could also hold: <span style="color:var(--ink)">${REC.could.join(', ')}</span></div>`;
  if (id === 'norecord') { let w = ''; for (let y = 2; y <= 22; y += 4) w += `${w ? 'L' : 'M'}${(y / 4) % 2 ? 94 : 90},${y}`; let w2 = ''; for (let y = 2; y <= 22; y += 4) w2 += `${w2 ? 'L' : 'M'}${(y / 4) % 2 ? 134 : 130},${y}`;
    return `<svg viewBox="0 0 220 40" style="display:block;width:100%;height:calc(var(--space-6) - var(--space-1))" aria-hidden="true">
      <rect x="0" y="4" width="90" height="16" data-tier="${FL(REC.floor).tier}" style="fill:color-mix(in srgb, var(--fc) 26%, transparent)"/>
      <rect x="92" y="4" width="40" height="16" style="fill:url(#x-stale)"/>
      <path d="${w}" style="fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2"/><path d="${w2}" style="fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2"/>
      <rect x="134" y="4" width="86" height="16" data-tier="${FL(REC.floor).tier}" style="fill:color-mix(in srgb, var(--fc) 26%, transparent)"/>
      <text x="112" y="36" text-anchor="middle" style="font:400 var(--type-small) var(--font-mono);fill:var(--ink)">no record ${nr.from} to ${nr.to}</text></svg>`; }

/* the strip of six empty-looking states; opts.tech shows the technical line, opts.ids picks and orders them */
function renderFamily(el, opts) {
  opts = opts || {};

  el.style.setProperty('--n', ids.length);
  el.innerHTML = ids.map((id, i) => { const s = DATA.states.find(x => x.id === id);
    return `<div class="st dep" style="--i:${i}" data-state="${id}"><div class="stage">${stateStage(id)}</div>
      <div class="nm">${s.plain}<small>${s.from}</small></div><p class="d">${s.d}</p>
      ${opts.tech === false ? '' : `<p class="tk">${s.tech} · never “${s.never}”</p>`}</div>`; }).join('');
  Icons.hydrate(el);
}
/* one shared hatch pattern for SVG */
document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="x-stale" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--x-hatch);stroke-width:1"/></pattern>
  <pattern id="x-shadow" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--hairline);stroke-width:1"/></pattern></defs></svg>`);
/* timers for the auto-demo; R replays from the start */
const TIMERS = [];
const later = (fn, t) => TIMERS.push(setTimeout(fn, t));
function boot(reset, demo) {
  const w = $('#wrap');
  const run = () => { TIMERS.splice(0).forEach(clearTimeout); reset(); w.classList.add('pre'); later(() => { w.classList.remove('pre'); demo(); }, ms('--motion-run')); };
  document.addEventListener('keydown', e => { if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) run(); });
  run();
}

/* the specimen in the same shape as the other sample cards */
const CARDS = [{ kind: REC.kind, name: REC.name, key: REC.key, floor: REC.floor, id: REC.id.slice(0, 14) + '…', details: REC.details,
  subjects: [K(REC.kind).plural, 'Hallam North', FL(REC.floor).name], links: REC.links, sources: REC.sources.map(s => s.what), hidden: REC.hidden }, ...SHEET.more];
let ci = 0, focusRule = null;
const rn = z => SHEET.rules.findIndex(r => r.z === z) + 1;
function cardHTML(c) {
  const k = K(c.kind), fl = FL(c.floor), kd = k.details;
  const val = d => d.state === 'gap' ? `<span class="gapin z" data-z="gap">${d.n.toLowerCase()} to be supplied · <b>${d.who}</b></span>`
    : `<span class="dn">${kd.find(x => x.n === d.n && x.exp) ? '<span class="exptick"></span>' : ''}${d.n}:</span> ${d.v}${d.ref ? `<span class="ref">${d.ref}</span>` : ''}${d.state === 'stale' ? ` <span class="staleage">${d.age} old</span>` : ''}`;
  const roman = ['I', 'II', 'III', 'IV'];
  return `<div class="ruled"></div>
    <div class="callno z dep" style="--i:1" data-z="callno"><span class="k"><span class="muted">${rn('callno')}</span>${ic(k.icon, 12)}${k.name}</span><span>${c.key.v}</span></div>
    <div class="stamp z dep" style="--i:6" data-z="stamp" data-tier="${fl.tier}"><span class="zn">${rn('stamp')}</span>Kept on ${fl.name}</div>
    <h2 class="heading z dep" style="--i:2" data-z="heading"><span class="zn">${rn('heading')}</span>${c.name}</h2>
    <p class="body z dep" style="--i:3;margin:0" data-z="body"><span class="zn">${rn('body')}</span>${c.key.n} ${c.key.v}<span class="sep"> — </span>${c.details.map(val).join('<span class="sep"> — </span>')}.</p>
    <p class="notes z dep" style="--i:4;margin-bottom:0" data-z="notes"><span class="zn">${rn('notes')}</span>Sources: ${c.sources.map((s, i) => `${i + 1}. <b>${s}</b>`).join('; ')}.${c.hidden ? ` Also ${c.hidden.what} kept on ${FL(c.hidden.floor).name}, ${ic('lock', 12)} not shown here: ${c.hidden.who.toLowerCase()}.` : ''}</p>
    <p class="tracings z dep" style="--i:5;margin-bottom:0" data-z="subjects"><span class="zn">${rn('subjects')}</span>${c.subjects.map((s, i) => `${i + 1}. <b>${s}</b>`).join('  ')}.</p>
    <p class="tracings z dep" style="--i:5;margin-top:0" data-z="added"><span class="zn">${rn('added')}</span>${c.links.map((l, i) => `${roman[i]}. ${l.verb} <b>${l.n} ${l.kind}</b>`).join('  ')}.</p>
    <span class="lcid dep" style="--i:7">${c.id}</span>`;
}
function render() {
  $('#eyebrow').textContent = SHEET.eyebrow; $('#h1').textContent = SHEET.title; $('#lede').textContent = SHEET.lede; $('#rhead').textContent = SHEET.rulesHead;
  $('#rules').innerHTML = SHEET.rules.map((r, i) => { const t = T(r.term);
    return `<li class="dep" style="--i:${i + 2}" data-n="${i + 1}"><div class="pl"><span class="lib"><span>${String(i + 1).padStart(2, '0')}</span>${r.lib}</span>${t.plain}</div><div class="tc">${t.tech}</div><p class="never nv" style="margin-bottom:0"><b>Never means</b> ${t.never}</p></li>`; }).join('');
  $('#switch').innerHTML = `<span class="lb">Same card, any kind</span>` + CARDS.map((c, i) => `<button class="tab" aria-pressed="${i === ci}" data-i="${i}">${ic(K(c.kind).icon, 14)}${K(c.kind).name}</button>`).join('');
  $$('#switch .tab').forEach(b => b.addEventListener('click', () => show(+b.dataset.i)));
  $('#famh').textContent = SHEET.famTitle; $('#famd').textContent = SHEET.famLede;
  renderFamily($('#fam'));
  show(ci, true);
}
function show(i, quiet) { ci = i; $('#lc').innerHTML = cardHTML(CARDS[i]); $('#lc').setAttribute('aria-label', `Card for ${CARDS[i].name}`);
  $$('#switch .tab').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === i)); Icons.hydrate(document.body); setRule(focusRule); }
function setRule(n) { focusRule = n; const r = n && SHEET.rules[n - 1];
  $('#lc').classList.toggle('focus', !!r); $('#lc').classList.toggle('req', !!r && r.term === 'expected'); $('#rules').classList.toggle('focus', !!r);
  $$('#lc .z').forEach(z => z.classList.toggle('on', !!r && z.dataset.z === r.z));
  $$('#rules li').forEach(l => l.classList.toggle('on', +l.dataset.n === n));
  $$('#fam .st').forEach(s => s.classList.toggle('on', !!r && r.term === 'gap' && s.dataset.state === 'gap')); }
render();
$$('#rules li').forEach(l => { l.tabIndex = 0; l.addEventListener('mouseenter', () => setRule(+l.dataset.n)); l.addEventListener('focus', () => setRule(+l.dataset.n)); l.addEventListener('mouseleave', () => setRule(null)); });
document.addEventListener('keydown', e => { if (e.key === 't' || e.key === 'T') show((ci + 1) % CARDS.length);
  const n = +e.key; if (n >= 1 && n <= SHEET.rules.length) setRule(n); if (e.key === 'Escape') setRule(null); });
boot(() => { setRule(null); show(0); }, () => later(() => setRule(SHEET.demoRule), ms('--motion-run') + ms('--motion-base')));
</script>
