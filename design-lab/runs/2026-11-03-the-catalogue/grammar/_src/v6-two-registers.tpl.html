<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar · V6 · Two registers</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*COMMON_CSS*/
:root{
  /* --x-admin-w: width of the admin-words column when open; folded it keeps a strip that says how to open it */
  --x-admin-w: calc(var(--measure-rail) + var(--space-5));
  --x-fold-w: var(--space-8);
}
.wrap{padding-top:var(--space-4)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5);margin-bottom:var(--space-4)}
.sw{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);background:var(--surface-pane);font-size:var(--type-meta);color:var(--ink)}
.sw .tr{position:relative;width:calc(var(--space-6) - var(--space-1));height:calc(var(--space-5) - var(--space-2));border-radius:var(--radius-pill);background:var(--surface-inset);border:1px solid var(--hairline-strong);transition:background var(--motion-base) var(--ease-standard)}
.sw .tr i{position:absolute;top:2px;left:2px;width:calc(var(--space-4) - 2px);height:calc(var(--space-4) - 2px);border-radius:var(--radius-pill);background:var(--ink-muted);transition:transform var(--motion-base) var(--ease-out),background var(--motion-base)}
.sw[aria-checked="true"] .tr{background:color-mix(in srgb, var(--ink) 18%, transparent)}
.sw[aria-checked="true"] .tr i{transform:translateX(calc(var(--space-6) - var(--space-1) - var(--space-4) - 2px));background:var(--light)}
.sw small{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.main{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:var(--space-5);align-items:start}
/* the sample card in both registers */
.card{border-radius:var(--radius-inset);background:var(--surface-pane);border:1px solid var(--hairline);border-left:2px solid var(--fc);box-shadow:var(--shadow-raised);padding:var(--space-3) var(--space-4)}
.cl{display:grid;grid-template-columns:calc(var(--measure-rail) * .55) minmax(0,1fr);gap:var(--space-3);padding:var(--space-1) 0;border-top:1px solid var(--hairline);align-items:start}
.cl:first-of-type{border-top:0}
.cl .k{font-size:var(--type-small);line-height:var(--leading-meta);color:var(--ink-muted)}
.cl .v{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);min-width:0}
.adm{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--motion-slow) var(--ease-out),opacity var(--motion-slow) var(--ease-out);opacity:0}
.adm > span{overflow:hidden;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.on .adm{grid-template-rows:1fr;opacity:1}
.nm{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.gapslot{min-height:0;padding:var(--space-1) var(--space-3)}
/* the ledger */
.led{width:100%;border-collapse:collapse;table-layout:fixed}
.led th{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-caps);text-transform:uppercase;text-align:left;padding:0 var(--space-3) var(--space-2) 0;vertical-align:bottom}
.led td{padding:var(--space-1) var(--space-3) var(--space-1) 0;border-top:1px solid var(--hairline);vertical-align:top;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.led .pl{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.led col.c1{width:23%} .led col.c3{width:22%}
.led col.c2{width:var(--x-fold-w);transition:width var(--motion-slow) var(--ease-out)}
.on .led col.c2{width:var(--x-admin-w)}
.led .ad{font-family:var(--font-mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led .ad span:not(.fz){transition:opacity var(--motion-slow) var(--ease-out);opacity:0}
.on .led .ad span{opacity:1}
.led .fold{position:relative}
.led .fold .lbl{position:absolute;left:0;top:0;writing-mode:vertical-rl;transform:rotate(180deg);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-caps);text-transform:uppercase;white-space:nowrap;transition:opacity var(--motion-base)}
.on .led .fold .lbl{opacity:0}
.led .st{font-family:var(--font-mono);color:var(--ink-muted);display:flex;gap:var(--space-1);align-items:flex-start}
.led .st svg{flex:none;margin-top:2px}
.led .fz{font-family:var(--font-sans);color:var(--ink-muted);opacity:var(--x-quiet)}
.on .led .fz{display:none}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3);margin:var(--space-3) 0 0;padding:0;list-style:none}
.rules li{border-top:1px solid var(--hairline-strong);padding-top:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rules b{display:block;font-weight:400;font-size:var(--type-small);line-height:var(--leading-meta);color:var(--ink);margin-bottom:var(--space-1)}
.famh{display:flex;align-items:baseline;gap:var(--space-3);margin:var(--space-4) 0 var(--space-2)}
.famh h2{margin:0;font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.fam .tk{max-height:0;overflow:hidden;opacity:0;transition:max-height var(--motion-slow) var(--ease-out),opacity var(--motion-slow)}
.on .fam .tk{max-height:var(--space-6);opacity:var(--x-quiet)}
@media (max-width:1400px){:root{--x-admin-w:calc(var(--measure-rail) * .6)}.rules{grid-template-columns:repeat(2,minmax(0,1fr))}.led col.c1{width:20%}.led col.c3{width:26%}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top"><div><span class="eyebrow" id="eyebrow"></span><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
    <button class="sw" id="sw" role="switch" aria-checked="false"><span id="swl"></span><span class="tr"><i></i></span><small>A</small></button></div>
  <div class="main" id="main">
    <div class="card dep" style="--i:0" id="card"></div>
    <div class="dep" style="--i:1"><table class="led" id="led"></table><ul class="rules" id="rules"></ul></div>
  </div>
  <div class="famh"><h2 id="famh"></h2><span class="sm muted" id="famd"></span></div>
  <div class="fam" id="fam"></div>
</div>
<div class="hints"><span><span class="kbd">A</span> admin words</span><span><span class="kbd">R</span> replay</span></div>
<div class="x-cap"><b>Grammar · V6</b> two registers: plain on top, admin one step down · Isotype’s transformer, Wikidata labels and ids</div>
<script>
/*DATA*/
const SHEET = {
  eyebrow: 'The catalogue · grammar · two registers',
  title: 'Two registers',
  lede: 'The same card, said twice. Plain words are always on top. The switch adds admin words underneath, never instead. Studio words never reach an operator’s view.',
  switchLabel: 'Admin words',
  heads: ['Operator says', 'One step down', 'Studio only', 'Never means'],
  fold: 'Folded · A',
  /* the specimen’s lines, each with its admin line */
  lines: [
    { k: 'Kind of thing', adm: 'class · cco:Facility' },
    { k: 'Name', adm: 'label · altLabel ×2' },
    { k: 'Site code', adm: 'identity key · unique across floors' },
    { k: 'Address', adm: 'property · xsd:string · B2' },
    { k: 'Opening hours', adm: 'missing value · min 1, 0 facts' },
    { k: 'Fire inspection', adm: 'stale · review age 12 months' },
    { k: 'Fuel store', adm: 'stated absence · B1' },
    { k: 'Links', adm: 'relations · 3 kinds, 26 facts' },
    { k: 'Kept on', adm: 'workspace · department' }
  ],
  rules: [
    ['Plain on top, always', 'The admin word sits under the plain one, smaller, in mono. It never replaces it, even for admins.'],
    ['Anyone may switch', 'Words are not secret. Off by default on Department and Team floors, on for admins, remembered per person.'],
    ['Studio words stay in the studio', 'IRIs, OWL, SHACL, raw ids and grade letters alone never reach an operator’s view, switch or no switch.'],
    ['Both registers find things', 'Typing "class" finds Kind of thing; typing "kind" finds class. One index, two vocabularies.']
  ],
  demoAt: 1, /* the switch turns on this long (in --motion-run) after the page arrives */
  famTitle: 'Six things that look empty, in both registers',
  famLede: 'Plain names for everyone; the admin line opens with the switch.'
};
/*COMMON_JS*/
const kind = K(REC.kind), fl = FL(REC.floor);
let on = false;
function cardHTML() {
  const L = k => SHEET.lines.find(l => l.k === k).adm;
  const row = (k, v) => `<div class="cl"><span class="k">${k}</span><span class="v">${v}<span class="adm"><span>${L(k)}</span></span></span></div>`;
  const d = n => det(n);
  return row('Kind of thing', `<span style="display:flex;align-items:center;gap:var(--space-2)"><span class="kindmark s">${ic(kind.icon, 14)}</span>${kind.name}</span>`)
    + row('Name', `<span class="nm">${REC.name}</span><br><span class="sm muted">Also called ${REC.other}</span>`)
    + row('Site code', `<span class="mono">${REC.key.v}</span>`)
    + row('Address', `${d('Address').v}<span class="ref">${d('Address').ref}</span>`)
    + row('Opening hours', `<div class="gapslot"><span class="gl">Not known yet</span><span class="gw">${d('Opening hours').who}</span></div>`)
    + row('Fire inspection', `${d('Fire inspection').v} <span class="staleage">${d('Fire inspection').age}</span>`)
    + row('Fuel store', `<span class="nonev">${d('Fuel store').v}</span><span class="ref">${d('Fuel store').ref}</span>`)
    + row('Links', REC.links.map(l => `${l.verb} <b style="font-weight:400;color:var(--light)">${l.n} ${l.kind}</b>`).join(' · '))
    + row('Kept on', `<span style="display:flex;align-items:center;gap:var(--space-2)"><i style="width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--fc)"></i>${fl.name}</span>`);
}
function render() {
  $('#eyebrow').textContent = SHEET.eyebrow; $('#h1').textContent = SHEET.title; $('#lede').textContent = SHEET.lede; $('#swl').textContent = SHEET.switchLabel;
  $('#card').setAttribute('data-tier', fl.tier); $('#card').innerHTML = cardHTML();
  $('#led').innerHTML = `<colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"></colgroup>
    <thead><tr><th>${SHEET.heads[0]}</th><th class="fold">${SHEET.heads[1]}</th><th class="c3c">${SHEET.heads[2]}</th><th>${SHEET.heads[3]}</th></tr></thead><tbody>`
    + DATA.terms.map((t, i) => `<tr><td><div class="pl">${t.plain}</div></td><td class="ad fold">${i === 0 ? `<span class="fz">${SHEET.fold}</span>` : ''}<span>${t.tech.split(' · ')[0]}</span></td><td class="c3c"><span class="st">${ic('lock', 12)}${t.studio}</span></td><td>${t.never}</td></tr>`).join('') + '</tbody>';
  $('#rules').innerHTML = SHEET.rules.map(([b, t], i) => `<li class="dep" style="--i:${i + 2}"><b>${b}</b>${t}</li>`).join('');
  $('#famh').textContent = SHEET.famTitle; $('#famd').textContent = SHEET.famLede;
  renderFamily($('#fam'));
  Icons.hydrate(document.body);
}
function setOn(v) { on = v; $('#wrap').classList.toggle('on', on); $('#sw').setAttribute('aria-checked', on); }
render();
$('#sw').addEventListener('click', () => setOn(!on));
document.addEventListener('keydown', e => { if ((e.key === 'a' || e.key === 'A') && !e.metaKey && !e.ctrlKey) setOn(!on); });
boot(() => setOn(false), () => later(() => setOn(true), ms('--motion-run') * SHEET.demoAt));
</script>
</body>
</html>
