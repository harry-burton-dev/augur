<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar · V2 · The table of what we keep</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*COMMON_CSS*/
:root{
  /* --mark-asked: a detail the table predicts and sources asked for, not yet in the ontology. Dotted, never corner ticks. */
  --x-asked: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  /* --mark-coverage: the bar of cards that hold a detail; lightness, not hue. */
  --x-cover: color-mix(in srgb, var(--ink) 55%, transparent);
  --x-cell-h: calc(var(--space-7) - var(--space-3)); /* 60 */
  --x-side: calc(var(--measure-card) + var(--space-3));
}
.wrap{padding-top:var(--space-4)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5);margin-bottom:var(--space-4)}
.main{display:grid;grid-template-columns:minmax(0,1fr) var(--x-side);gap:var(--space-5);align-items:start}
.tbl{display:grid;grid-template-columns:calc(var(--measure-rail) - var(--space-6)) repeat(var(--cols),minmax(0,1fr));gap:var(--space-1)}
.ch{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);padding:0 var(--space-1) var(--space-1);display:flex;flex-direction:column}
.ch b{font-family:var(--font-sans);font-weight:400;font-size:var(--type-meta);color:var(--ink);letter-spacing:0}
.rh{display:flex;align-items:center;gap:var(--space-2);padding-left:var(--space-2);border-left:2px solid var(--fc);min-height:var(--x-cell-h)}
.rh .nm{font-size:var(--type-meta);color:var(--ink);line-height:var(--leading-meta)}
.rh .nm small{display:block;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.cell{position:relative;height:var(--x-cell-h);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2) var(--space-2);display:flex;flex-direction:column;justify-content:space-between;background:var(--surface-inset);border:1px solid var(--hairline);text-align:left;min-width:0}
.cell .r1{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-1)}
.cell .sym{font-weight:300;font-size:var(--type-lead);line-height:1;color:var(--light)}
.cell .cv{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.cell .dn .exptick{height:var(--space-2);margin-right:0}
.cell .dn{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:var(--space-1);align-items:center}
.cell .dn svg{flex:none;color:var(--ink-muted)}
.bar{position:relative;height:var(--space-1);display:flex}
.bar i{display:block;height:100%;background:var(--x-cover);width:0;transition:width var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i,0) * var(--motion-instant))}
.bar u{display:block;flex:1;height:calc(var(--space-1) + var(--space-1));margin-top:calc(var(--space-1) * -.5);--x-gap-tick:var(--space-1);background:var(--x-gap);opacity:0;transition:opacity var(--motion-base) var(--ease-standard)}
.ran .bar u{opacity:1}
.cell.dot{background:none;border-color:transparent;align-items:center;justify-content:center}
.cell.dot::after{content:"";width:var(--space-1);height:var(--space-1);border-radius:var(--radius-pill);background:var(--hairline-strong)}
.cell.ask{background:none;border:1px dashed var(--x-asked);border-style:dotted}
.cell.ask .sym{color:var(--ink-muted)}
.cell.ask .dn{color:var(--ink-muted)}
.cell.cur{outline:var(--focus-ring) solid var(--ink);outline-offset:var(--focus-gap);background:var(--surface-raised)}
.cell.ask.cur{background:var(--surface-inset)}
.ew{margin-top:var(--space-2);display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:var(--space-1) var(--space-3)}
.ew .rh{border-left-style:dashed;border-left-color:var(--hairline-strong);min-height:var(--target-md)}
.ew .bandx{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink-muted)}
.ew .bandx b{font-weight:400;color:var(--ink)}
.ew .bandx{display:block;border:0;padding:0;line-height:var(--leading-small)}
.ewl{grid-column:1 / -1;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-caps);text-transform:uppercase;margin-top:var(--space-2)}
.read{margin-top:var(--space-4);min-height:calc(var(--space-8) - var(--space-3));display:flex;flex-direction:column;gap:var(--space-1);align-items:flex-start;padding:var(--space-2) var(--space-3);border-radius:var(--radius-inset);background:var(--surface-pane);border:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.read .w{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);flex:none}
.read b{font-weight:400;color:var(--light)}
/* side: the key */
.key{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-4);align-items:center;padding:var(--space-3);border-radius:var(--radius-inset);background:var(--surface-pane);border:1px solid var(--hairline);margin-bottom:var(--space-3)}
.key .cell{width:calc(var(--space-8) + var(--space-5));height:calc(var(--space-7) + var(--space-3))}
.key .cell .sym{font-size:var(--type-title-s)}
.key ol{margin:0;padding:0;list-style:none;display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.key ol b{font-weight:400;color:var(--ink)}
.legend{display:grid;gap:var(--space-2)}
.lg{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr);gap:var(--space-3);align-items:start}
.lg .sw{height:var(--space-5);border-radius:var(--radius-key);position:relative}
.lg .pl{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.lg .pl span{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);margin-left:var(--space-2)}
.lg .nv{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.sw.row{border-left:2px solid var(--floor-department-high);background:var(--surface-inset)}
.sw.cellsw{background:var(--surface-inset);border:1px solid var(--hairline)}
.sw.tick{background:var(--surface-inset);border:1px solid var(--hairline)}
.sw.tick::before{content:"";position:absolute;left:var(--space-2);top:var(--space-2);height:var(--space-2);width:2px;background:var(--x-expected)}
.sw.barsw::before{content:"";position:absolute;left:0;top:50%;height:var(--space-1);width:60%;background:var(--x-cover)}
.sw.gapsw{background:var(--x-gap)}
.sw.asksw{border:1px dotted var(--x-asked)}
.sw.dotsw{display:flex;align-items:center;justify-content:center}
.sw.dotsw::after{content:"";width:var(--space-1);height:var(--space-1);border-radius:var(--radius-pill);background:var(--hairline-strong)}
.sw.linksw{display:flex;align-items:center;justify-content:center;color:var(--ink-muted)}
.famh{display:flex;align-items:baseline;gap:var(--space-3);margin:var(--space-4) 0 var(--space-2)}
.fam .tk{display:none}
.fam{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2) var(--space-4)}
.fam .st{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0 var(--space-3);align-items:center}
.fam .st .stage{grid-row:1 / span 2}
.fam .nm small{display:none}
.famh h2{margin:0;font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
@media (max-width:1400px){:root{--x-side:var(--measure-card)}.key{display:none}.top .lede{max-width:56ch}.cell .sym{font-size:var(--type-body)}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top"><div><span class="eyebrow" id="eyebrow"></span><h1 id="h1"></h1><p class="lede" id="lede"></p></div></div>
  <div class="main">
    <div>
      <div class="tbl" id="tbl" role="grid" aria-label="Kinds of thing by family of detail"></div>
      <div class="ew" id="ew"></div>
      <div class="famh"><h2 id="famh"></h2><span class="sm muted" id="famd"></span></div>
      <div class="fam" id="fam"></div>
    </div>
    <aside>
      <div class="key dep" style="--i:2" id="key"></div>
      <div class="legend" id="legend"></div>
      <div class="read" id="read" aria-live="polite"></div>
    </aside>
  </div>
</div>
<div class="hints"><span><span class="kbd">←</span><span class="kbd">→</span><span class="kbd">↑</span><span class="kbd">↓</span> read a cell</span><span><span class="kbd">R</span> replay</span></div>
<div class="x-cap"><b>Grammar · V2</b> the table of what we keep: layout predicts what is missing · Mendeleev 1869, Bertin’s value variable</div>
<script>
/*DATA*/
const SHEET = {
  eyebrow: 'The catalogue · grammar · periodic sheet',
  title: 'The table of what we keep',
  lede: 'One row per kind of thing, one column per family of detail. Where a column is full but one row is not, the table asks a question, as Mendeleev’s gaps did.',
  predictAt: 5,               /* a family most kinds have predicts it for the rest */
  asked: { 'contract|place': { word: 'Delivery site', times: 6 }, 'vehicle|people': { word: 'Usual driver', times: 11 } },
  demoCell: 'vehicle|people',
  famTitle: 'On a card, six things look empty',
  famLede: 'The table works on kinds. These marks work on one card. Corner ticks are the only gap.',
  legend: [
    { sw: 'row', plain: 'Kind of thing', tech: 'class', never: 'a folder or a floor. The row edge is the floor that keeps it.' },
    { sw: 'cellsw', plain: 'Detail', tech: 'property', never: 'a column people add for themselves.', sym: 'Ad' },
    { sw: 'linksw', plain: 'Link', tech: 'relation', never: '“related to”. It names the kind at the other end.' },
    { sw: 'tick', plain: 'Should have', tech: 'min 1', never: 'compulsory. No tick: can have.' },
    { sw: 'barsw', plain: 'How many cards hold it', tech: 'coverage', never: 'quality or importance. Lightness only, never hue.' },
    { sw: 'gapsw', plain: 'Not known yet', tech: 'missing value', never: 'none. The rest of the bar, drawn as a slot.' },
    { sw: 'asksw', plain: 'Asked for', tech: 'candidate term', never: 'a gap on any card. The table’s own question, for admins.' },
    { sw: 'dotsw', plain: 'Nothing here', tech: 'not in the ontology', never: 'missing. Nothing suggests this kind needs it.' }
  ]
};
/*COMMON_JS*/
const fams = DATA.families, kinds = DATA.kinds;
const sym = n => { const w = n.split(/\s+/); return (w.length > 1 ? w[0][0] + w[1][0] : n.slice(0, 2)).replace(/^./, c => c.toUpperCase()).replace(/(?<=^.)./, c => c.toLowerCase()); };
const famCount = f => kinds.filter(k => k.details.some(d => d.fam === f)).length;
const linkTarget = (k, d) => { const l = DATA.links.find(l => l.from === k.id && (d.n.toLowerCase().includes(l.verb.split(' ').pop()) )); return l; };
const linkKind = { 'Site manager': 'person', 'Contact person': 'person', 'Contract owner': 'person', 'Works at': 'site', 'Based at': 'site', 'Happened at': 'site', 'Reported by': 'person' };
function cellInfo(k, f) {
  const d = k.details.find(d => d.fam === f.id), key = `${k.id}|${f.id}`;
  if (d) return { type: 'detail', d };
  if (famCount(f.id) >= SHEET.predictAt) return { type: 'ask', a: SHEET.asked[key] };
  return { type: 'dot' };
}
function render() {
  $('#eyebrow').textContent = SHEET.eyebrow; $('#h1').textContent = SHEET.title; $('#lede').textContent = SHEET.lede;
  const t = $('#tbl'); t.style.setProperty('--cols', fams.length);
  let h = `<div class="ch"></div>` + fams.map((f, i) => `<div class="ch dep" style="--i:${i}" role="columnheader">${['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'][i] || i + 1}<b>${f.name}</b></div>`).join('');
  kinds.forEach((k, r) => {
    const fl = FL(k.floor);
    h += `<div class="rh dep" style="--i:${r}" data-tier="${fl.tier}" role="rowheader"><span class="kindmark s">${ic(k.icon, 14)}</span><span class="nm">${k.plural}<small>${fmt(k.count)} · ${fl.name}</small></span></div>`;
    fams.forEach((f, c) => { const ci = cellInfo(k, f), key = `${k.id}|${f.id}`, i = r + c;
      if (ci.type === 'detail') { const d = ci.d, pc = d.known / k.count * 100, lk = linkKind[d.n];
        h += `<button class="cell ${d.exp ? 'exp' : ''} dep" style="--i:${i}" data-key="${key}" role="gridcell"><span class="r1"><span class="sym">${sym(d.n)}</span><span class="cv">${fmt(d.known)}/${fmt(k.count)}</span></span>
          <span class="dn">${d.exp ? '<span class="exptick"></span>' : ''}${lk ? ic('arrow-right', 12) : ''}${d.n}</span><span class="bar"><i style="--i:${i}" data-w="${pc}"></i>${d.exp && d.known < k.count ? '<u></u>' : ''}</span></button>`; }
      else if (ci.type === 'ask') h += `<button class="cell ask dep" style="--i:${i + 6}" data-key="${key}" role="gridcell"><span class="r1"><span class="sym">?</span><span class="cv">${ci.a ? 'asked ' + ci.a.times + '×' : ''}</span></span><span class="dn">${ci.a ? '“' + ci.a.word + '”' : 'others have one'}</span><span></span></button>`;
      else h += `<button class="cell dot dep" style="--i:${i}" data-key="${key}" role="gridcell" aria-label="${k.plural}, ${f.name}: nothing here"></button>`; });
  });
  t.innerHTML = h;
  $('#ew').innerHTML = `<div class="ewl">Kept by other apps, linked from cards</div>` + DATA.elsewhere.map((e, i) => `<div class="rh dep" style="--i:${8 + i}"><span class="kindmark s">${ic(e.icon, 14)}</span><span class="nm">${e.plural}<small>${fmt(e.count)} · ${DATA.apps[e.app]}</small></span></div>
    <div class="bandx dep" style="--i:${8 + i}">${e.id === 'document' ? `<b>Where it came from.</b> Every detail’s numbered source points at a document, a person or a register. ${DATA.apps.atlas} reads them; ${DATA.apps[e.app]} keeps them.` : `<b>Used by.</b> Intents bound to a card. ${DATA.apps[e.app]} keeps them and names them for you; a binding is never a detail.`}</div>`).join('');
  const kd = kinds[0].details[1];
  $('#key').innerHTML = `<div class="cell exp"><span class="r1"><span class="sym">${sym(kd.n)}</span><span class="cv">${kd.known}/${kinds[0].count}</span></span><span class="dn"><span class="exptick"></span>${kd.n}</span><span class="bar"><i style="width:100%"></i></span></div>
    <ol><li><b>Symbol</b> two letters, for scanning a row</li><li><b>${kd.known}/${kinds[0].count}</b> cards that hold it, of all ${kinds[0].plural.toLowerCase()}</li><li><b>Name</b> the detail, in plain words</li><li><b>Tick</b> should have · <b>bar</b> how many hold it</li></ol>`;
  $('#legend').innerHTML = SHEET.legend.map((l, i) => `<div class="lg dep" style="--i:${3 + i}"><span class="sw ${l.sw}">${l.sw === 'linksw' ? ic('arrow-right', 14) : ''}</span><div><div class="pl">${l.plain}<span>${l.tech}</span></div><div class="nv"><b style="font-weight:400;color:var(--ink)">Never</b> ${l.never}</div></div></div>`).join('');
  $('#famh').textContent = SHEET.famTitle; $('#famd').textContent = SHEET.famLede;
  renderFamily($('#fam'));
  Icons.hydrate(document.body);
  $$('.tbl .cell').forEach(c => { c.addEventListener('click', () => setCur(c.dataset.key)); c.addEventListener('focus', () => setCur(c.dataset.key, true)); });
}
function readCell(key) {
  const [kid, fid] = key.split('|'), k = K(kid), f = fams.find(f => f.id === fid), ci = cellInfo(k, f);
  if (ci.type === 'detail') { const d = ci.d, miss = k.count - d.known;
    return `<span class="w">${k.plural} · ${f.name}</span><span><b>${d.n}</b>${linkKind[d.n] ? `, a link to a ${K(linkKind[d.n]).name.toLowerCase()}` : ''}. ${d.exp ? 'Every one should have it' : 'Some can have it'}: ${fmt(d.known)} of ${fmt(k.count)} do.${d.exp && miss ? ` ${miss} show it as not known yet, with who could fill it.` : ''}</span>`; }
  if (ci.type === 'ask') { const others = kinds.filter(o => o.details.some(d => d.fam === fid)).length;
    return `<span class="w">${k.plural} · ${f.name}</span><span><b>Asked for.</b> ${others} of ${kinds.length} kinds have a ${f.name.toLowerCase()} detail; ${k.plural.toLowerCase()} don’t yet.${ci.a ? ` Sources asked for “${ci.a.word}” ${ci.a.times} times.` : ''} Admins decide in the studio; no card shows a gap until they do.</span>`; }
  return `<span class="w">${k.plural} · ${f.name}</span><span><b>Nothing here.</b> No ${f.name.toLowerCase()} detail for ${k.plural.toLowerCase()}, and fewer than ${SHEET.predictAt} kinds have one, so the table doesn’t ask.</span>`;
}
let cur = null;
function setCur(key, fromFocus) { cur = key; $$('.tbl .cell').forEach(c => c.classList.toggle('cur', c.dataset.key === key)); $('#read').innerHTML = key ? readCell(key) : '<span class="w">Read a cell</span><span class="muted">Arrow keys move through the table; each cell says what it is in a sentence.</span>'; }
document.addEventListener('keydown', e => { const mv = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key]; if (!mv) return; e.preventDefault();
  const [ki, fi] = cur ? [kinds.findIndex(k => k.id === cur.split('|')[0]), fams.findIndex(f => f.id === cur.split('|')[1])] : [0, -1];
  const nk = Math.max(0, Math.min(kinds.length - 1, ki + mv[0])), nf = Math.max(0, Math.min(fams.length - 1, fi + mv[1])); const key = `${kinds[nk].id}|${fams[nf].id}`; const c = $(`.tbl .cell[data-key="${key}"]`); c && c.focus(); });
render();
boot(() => { setCur(null); $('#wrap').classList.remove('ran'); $$('.tbl .bar i').forEach(b => b.style.width = '0'); },
  () => { requestAnimationFrame(() => $$('.tbl .bar i').forEach(b => b.style.width = b.dataset.w + '%'));
    later(() => $('#wrap').classList.add('ran'), ms('--motion-calm') + ms('--motion-slow'));
    later(() => setCur(SHEET.demoCell), ms('--motion-run') + ms('--motion-base')); });
</script>
</body>
</html>
