<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar · V1 · Parts of a card</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*COMMON_CSS*/
:root{
  --x-callout-w: calc(var(--measure-card) + var(--space-3)); /* callout column width, 396 */
}
.wrap{padding-top:var(--space-4)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5);margin-bottom:var(--space-3)}
.howto{max-width:var(--measure-read);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.howto b{font-weight:400;color:var(--ink)}
.plate{position:relative;display:grid;grid-template-columns:var(--x-callout-w) minmax(0,1fr) var(--x-callout-w);gap:var(--space-5);align-items:start}
.col{display:flex;flex-direction:column;gap:var(--space-2);position:relative;z-index:2}
.co{position:relative;padding:var(--space-2) var(--space-3);border-radius:var(--radius-inset);transition:opacity var(--motion-base) var(--ease-standard),filter var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard);text-align:left;width:100%}
.co:hover{background:var(--surface-inset)}
.co .h{display:flex;align-items:baseline;gap:var(--space-2)}
.co .no{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);width:var(--space-4)}
.co .pl{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.co .tc{margin:0 0 0 calc(var(--space-4) + var(--space-2));font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.co .sy{display:none}
.howto .pl{font-weight:300;font-size:var(--type-lead);color:var(--light);margin-right:var(--space-2)}
.howto{min-height:calc(var(--space-6) + var(--space-2))}
.co .nv{margin:var(--space-1) 0 0 calc(var(--space-4) + var(--space-2))}
.right .co{text-align:left}
.plate.focus .co:not(.on){opacity:var(--x-quiet);filter:saturate(.4) blur(.5px)}
.plate.focus .co.on{background:var(--surface-raised)}
/* specimen */
.spec{position:relative;z-index:2;justify-self:center;width:100%;max-width:calc(var(--measure-decision) + var(--space-6))}
.found{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center;margin-bottom:var(--space-2)}
.found .lb{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);height:calc(var(--space-5) - var(--space-1));padding:0 var(--space-2);border-radius:var(--radius-pill);border:1px solid var(--hairline);font-size:var(--type-small);color:var(--ink)}
.chip b{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.card{border-radius:var(--radius-inset);background:var(--surface-pane);border:1px solid var(--hairline);border-left:2px solid var(--fc);box-shadow:var(--shadow-raised);overflow:hidden}
.zone{padding:var(--space-2) var(--space-4) var(--space-3);border-top:1px solid var(--hairline);transition:background var(--motion-base) var(--ease-standard)}
.zone:first-child{border-top:0}
.cbody{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-top:1px solid var(--hairline)}
.cbody > .zone{border-top:0;border-right:1px solid var(--hairline)}
.cside .zone:first-child{border-top:0}
.srcs div{align-items:flex-start}.srcs span:last-child{display:none}
.spec{max-width:none}
.zone.lit{background:var(--surface-raised)}
.zl{font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-bottom:var(--space-2)}
.kindline{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.kindline b{font-weight:400;color:var(--ink)}
.kindline .kept{margin-left:auto;display:flex;align-items:center;gap:var(--space-1)}
.kindline .kept i{display:inline-block;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--fc)}
.nm{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);margin-top:var(--space-1)}
.al{font-size:var(--type-small);color:var(--ink-muted)}
.keyv{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-4);align-items:center;margin:0}
.dl dt{font-size:var(--type-small);color:var(--ink-muted);display:flex;align-items:center;white-space:nowrap}
.dl dd{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.dl dd.g{display:block}
.dl dd.g .gapslot{min-height:0;padding:var(--space-1) var(--space-3)}
.lk{color:var(--ink);text-decoration:underline;text-decoration-color:var(--x-link);text-underline-offset:3px}
.could{margin-top:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.links{display:flex;flex-direction:column;gap:var(--space-1);font-size:var(--type-small);color:var(--ink-muted)}
.links span b{font-weight:400;color:var(--ink)}
.links .lkrow{display:flex;align-items:center;gap:var(--space-2)}
.links .lkrow::before{content:"";width:var(--space-4);height:1px;background:var(--x-link)}
.srcs{display:grid;gap:var(--space-1);font-size:var(--type-small);color:var(--ink-muted)}
.srcs div{display:flex;gap:var(--space-2);align-items:center}
.srcs .n{font-family:var(--font-mono);width:var(--space-3)}
.srcs b{font-weight:400;color:var(--ink)}
svg.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
svg.leaders path{fill:none;stroke:var(--hairline-strong);stroke-width:1;transition:stroke-dashoffset var(--motion-calm) var(--ease-out),opacity var(--motion-base) var(--ease-standard),stroke var(--motion-base)}
svg.leaders circle{fill:var(--ink);transition:opacity var(--motion-base)}
svg.leaders .on path{stroke:var(--ink)}
.plate.focus svg.leaders g:not(.on){opacity:.25}
.famh{display:flex;align-items:baseline;gap:var(--space-3);margin:var(--space-4) 0 var(--space-2)}
.famh h2{margin:0;font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
@media (max-width:1400px){.cbody{grid-template-columns:1fr}.cbody > .zone{border-right:0}.cside{border-top:1px solid var(--hairline)}:root{--x-callout-w:calc(var(--measure-rail) + var(--space-6))}.top .lede{display:none}.co .nv{display:none}.co.on .nv{display:block}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top">
    <div><span class="eyebrow" id="eyebrow"></span><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
    <p class="howto" id="howto"></p>
  </div>
  <div class="plate" id="plate">
    <svg class="leaders" id="leaders" aria-hidden="true"></svg>
    <div class="col left" id="left"></div>
    <div class="spec dep" style="--i:0" id="spec"></div>
    <div class="col right" id="right"></div>
  </div>
  <div class="famh"><h2 id="famh"></h2><span class="sm muted" id="famd"></span></div>
  <div class="fam" id="fam"></div>
</div>
<div class="hints"><span><span class="kbd">1</span>–<span class="kbd">9</span> one part</span><span><span class="kbd">Esc</span> all parts</span><span><span class="kbd">R</span> replay</span></div>
<div class="x-cap"><b>Grammar · V1</b> parts of a card: a field guide’s topography plate for records · Sibley and Peterson front matter, Wikidata item pages</div>
<script>
/*DATA*/
const SHEET = {
  eyebrow: 'The catalogue · grammar · field guide front matter',
  title: 'Parts of a card',
  lede: 'Every thing we keep is drawn the same way. Learn the parts once and you can read any card, of any kind.',
  howto: '<b>How to use this guide.</b> The plain word is the one to say. The grey line under it is the word admins use, one step down. "Never means" is the misreading each part must not allow.',
  famTitle: 'Six things that look empty',
  famLede: 'Each says which it is. Only “could also hold” is allowed to be quiet.',
  left: ['facet', 'kind', 'detail', 'expected'],
  right: ['card', 'floor', 'gap', 'link', 'source'],
  demoFocus: 'gap'
};
/*COMMON_JS*/
const kind = K(REC.kind), fl = FL(REC.floor);
const order = [...SHEET.left, ...SHEET.right];
const num = id => DATA.terms.findIndex(t => t.id === id) + 1;
function callout(id, i) { const t = T(id);
  return `<button class="co dep" style="--i:${i + 1}" data-term="${id}" aria-describedby="t-${id}"><span class="h"><span class="no">${String(num(id)).padStart(2, '0')}</span><span class="pl">${t.plain}</span></span>
    <p class="tc">${t.tech}</p><p class="sy" id="t-${id}">${t.say}</p><p class="never nv"><b>Never means</b> ${t.never}</p></button>`; }
function specimen() {
  const ds = REC.details.map(d => { const exp = kind.details.find(k => k.n === d.n);
    const tick = `<span class="exptick ${exp && exp.exp ? '' : 'can'}" ${d.n === 'Address' ? 'data-z="expected"' : ''}></span>`;
    if (d.state === 'gap') return `<dt>${tick}${d.n}</dt><dd class="g"><div class="gapslot" data-z="gap"><span class="gl">Not known yet</span><span class="gw">${d.who} · ${d.hint}</span></div></dd>`;
    const v = d.link ? `<span class="lk">${d.v}</span>` : d.state === 'none' ? `<span class="nonev">${d.v}</span>` : d.v;
    return `<dt>${tick}${d.n}</dt><dd ${d.n === 'Address' ? 'data-z="detail"' : ''}>${v}<span class="ref">${d.ref}</span>${d.state === 'stale' ? ` <span class="staleage">${d.age}</span>` : ''}</dd>`; }).join('');
  return `<div class="found" data-z="facet"><span class="lb">Found under</span><span class="chip">${ic(kind.icon, 14)}${kind.name}</span><span class="chip">Hallam North</span><span class="chip">${fl.name}</span></div>
  <article class="card" data-tier="${fl.tier}" data-z="card" aria-label="${REC.name}, a ${kind.name}">
    <div class="zone" data-zone="kind"><div class="kindline"><span class="kindmark s" data-z="kind">${ic(kind.icon, 14)}</span><b>${kind.name}</b><span>one of ${kind.count}</span>
      <span class="kept" data-z="floor"><i></i>Kept on ${fl.name}</span></div>
      <div class="nm">${REC.name}</div><div class="al">Also called ${REC.other} · ${REC.key.n} <span class="keyv">${REC.key.v}</span></div></div>
    <div class="cbody"><div class="zone" data-zone="detail"><div class="zl">Details</div><dl class="dl">${ds}</dl><div class="could">Could also hold: ${REC.could.join(', ')}</div></div>
    <div class="cside"><div class="zone" data-zone="link"><div class="zl">Links</div><div class="links">${REC.links.map((l, i) => `<span class="lkrow" ${i === 0 ? 'data-z="link"' : ''}>${l.verb} <b>${l.n} ${l.kind}</b></span>`).join('')}
      <span class="lkrow">${ic('lock', 12)} ${REC.hidden.n}: ${REC.hidden.what} kept on ${FL(REC.hidden.floor).name}. ${REC.hidden.who}.</span></div></div>
    <div class="zone" data-zone="source"><div class="zl">Where it came from</div><div class="srcs" data-z="source">${REC.sources.slice(0, 3).map(s => `<div><span class="n">${s.id}</span>${ic(s.icon, 12)}<b>${s.what}</b><span>${s.sure}</span></div>`).join('')}</div></div></div></div>
  </article>`; }
function render() {
  $('#eyebrow').textContent = SHEET.eyebrow; $('#h1').textContent = SHEET.title; $('#lede').textContent = SHEET.lede; $('#howto').innerHTML = SHEET.howto;
  $('#left').innerHTML = SHEET.left.map(callout).join(''); $('#right').innerHTML = SHEET.right.map((id, i) => callout(id, i + SHEET.left.length)).join('');
  $('#spec').innerHTML = specimen(); $('#famh').textContent = SHEET.famTitle; $('#famd').textContent = SHEET.famLede;
  renderFamily($('#fam'));
  Icons.hydrate(document.body);
  $$('.co').forEach(b => { b.addEventListener('mouseenter', () => focusTerm(b.dataset.term)); b.addEventListener('mouseleave', () => focusTerm(null)); b.addEventListener('focus', () => focusTerm(b.dataset.term)); b.addEventListener('blur', () => focusTerm(null)); });
}
function leaders(draw) {
  const svg = $('#leaders'), pr = $('#plate').getBoundingClientRect();
  svg.innerHTML = order.map(id => { const co = $(`.co[data-term="${id}"]`), z = $(`[data-z="${id}"]`); if (!co || !z) return '';
    const c = co.getBoundingClientRect(), r = z.getBoundingClientRect(), left = SHEET.left.includes(id);
    const x0 = (left ? c.right : c.left) - pr.left, y0 = c.top - pr.top + c.height * .22;
    const x1 = (left ? r.left + Math.min(r.width * .1, 12) : r.right - Math.min(r.width * .1, 12)) - pr.left, y1 = r.top - pr.top + r.height / 2;
    const xm = left ? x0 + 16 : x0 - 16;
    const d = `M${x0},${y0} L${xm},${y0} L${x1},${y1}`, len = Math.hypot(xm - x0, 0) + Math.hypot(x1 - xm, y1 - y0) + 2;
    return `<g data-term="${id}"><path d="${d}" style="stroke-dasharray:${len};stroke-dashoffset:${draw ? len : 0}" data-len="${len}"/><circle cx="${x1}" cy="${y1}" r="2.5" style="opacity:${draw ? 0 : 1}"/></g>`; }).join('');
}
function drawLeaders() { $$('#leaders g').forEach((g, i) => later(() => { g.querySelector('path').style.strokeDashoffset = 0; g.querySelector('circle').style.opacity = 1; }, RM ? 0 : i * ms('--motion-quick'))); }
function focusTerm(id) {
  const t = id && T(id);
  $('#howto').innerHTML = t ? `<span class="pl">${t.plain}</span>${t.say}` : SHEET.howto;
  $('#plate').classList.toggle('focus', !!id);
  $$('.co').forEach(c => c.classList.toggle('on', c.dataset.term === id));
  $$('#leaders g').forEach(g => g.classList.toggle('on', g.dataset.term === id));
  $$('.zone').forEach(z => z.classList.toggle('lit', !!id && !!z.querySelector(`[data-z="${id}"]`)));
  $$('#fam .st').forEach(s => s.classList.toggle('on', id === 'gap' && s.dataset.state === 'gap'));
}
render();
window.addEventListener('resize', () => leaders(false));
document.addEventListener('keydown', e => { const n = +e.key; if (n >= 1 && n <= 9) { const t = DATA.terms[n - 1]; if (t) { const b = $(`.co[data-term="${t.id}"]`); b && b.focus(); } }
  if (e.key === 'Escape') { document.activeElement && document.activeElement.blur(); focusTerm(null); } });
boot(() => { focusTerm(null); $('#leaders').innerHTML = ''; }, () => { later(() => { leaders(true); requestAnimationFrame(drawLeaders); }, ms('--motion-calm')); later(() => focusTerm(SHEET.demoFocus), ms('--motion-calm') + ms('--motion-run')); });
</script>
</body>
</html>
