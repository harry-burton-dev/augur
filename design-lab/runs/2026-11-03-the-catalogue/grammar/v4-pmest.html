:root{
  /* --mark-gap: the gap mark. Four corner ticks of the slot a detail would fill. No fill, no hatch. */
  --x-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-gap-tick: var(--space-2);
  --x-gap:
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left top / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left top / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right top / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right top / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left bottom / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left bottom / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right bottom / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right bottom / 1px var(--x-gap-tick) no-repeat;
  /* --mark-stale-hatch and shadow: carried unchanged from wear-and-time and the cinematic light language. */
  --x-hatch: color-mix(in srgb, var(--ink-muted) 26%, transparent);
  --x-stale: repeating-linear-gradient(45deg, transparent 0 var(--space-2), var(--x-hatch) var(--space-2) calc(var(--space-2) + 1px));
  --x-shadow: repeating-linear-gradient(135deg, transparent 0 var(--space-2), var(--hairline) var(--space-2) calc(var(--space-2) + 1px));
  /* --mark-expected: the "should have" tick before a detail name in a kind. */
  --x-expected: var(--ink);
  /* --mark-link: the hairline a link is drawn with, and its verb ink. */
  --x-link: var(--hairline-strong);
  /* --time-past-dim from wear-and-time, used for backward readings and quiet lines. */
  --x-quiet: .62;
}

    { id: 'gap', plain: 'Not known yet', say: 'A detail this kind should have that this card does not: drawn where it would be, with who could fill it.',
      tech: 'missing value · expected property, no accepted fact', studio: 'sh:minCount 1 not met',
      mark: '--x-gap: four 1px corner ticks, --space-2 long · empty inside · words + who · Add if you may',
      never: 'none, zero, hidden, old or broken. Never blocks saving, never red.' },
    { id: 'source', plain: 'Where it came from', say: 'What every detail rests on: a document in Artifacts, a person, a register. How sure, in words.',
      tech: 'observation · provenance · grade (B2)', studio: 'prov:wasDerivedFrom, Admiralty grade',
      mark: 'numbered note in --font-mono · file-text or user icon · how sure in words, letters one step down',
      never: 'who typed it, or proof. A withdrawn source stays, struck, and stops counting.' },
    { id: 'floor', plain: 'Kept on', say: 'The floor that keeps a card and can change it. You see what is kept on your floor and the floors above.',
      tech: 'workspace · X-Workspace-Id', studio: 'floor fence, raise to a floor above',
      mark: '2px left edge in --floor-*-high · floor name',
      never: 'a kind, a category or importance. Floor hue never marks a kind or a state.' },
    { id: 'expected', plain: 'Should have', say: 'What a kind expects every card to hold. A missing "should have" is a gap; a missing "can have" is listed once, quietly.',
      tech: 'cardinality · min 1 (should) or min 0 (can)', studio: 'sh:minCount, owl:minCardinality',
      mark: '--x-expected: 2px tick before the detail name · "can have" details carry none',
      never: 'compulsory, a rule that stops work, or a score to hit.' }
  ],
  /* Six things that can look empty, and are not the same. */
  states: [
    { id: 'gap', plain: 'Not known yet', tech: 'missing value', from: 'this run', d: 'Should be on this card; nobody has recorded it.', never: 'none' },
    { id: 'none', plain: 'None', tech: 'stated absence', from: 'this run', d: 'Someone checked: there is none. A value, with its source.', never: 'a gap' },
    { id: 'stale', plain: 'Out of date', tech: 'stale · hatch 45°', from: 'wear and time', d: 'Known but old: says how old and who can refresh it.', never: 'unavailable' },
    { id: 'norecord', plain: 'No record', tech: 'record gap · unconformity', from: 'wear and time', d: 'A hole in time: we don’t know what happened, and why.', never: 'nothing happened' },
    { id: 'shadow', plain: 'Not yours to see', tech: 'unseen · shadow 135°', from: 'light language', d: 'It exists, kept elsewhere: which floor, who to ask.', never: 'missing' },
    { id: 'could', plain: 'Could also hold', tech: 'optional, min 0', from: 'this run', d: 'Not expected for this kind. Named once, never drawn as a slot.', never: 'a gap' }
  ]
};

const SHEET = {
  eyebrow: 'The catalogue · grammar · facet sheet',
  title: 'Five questions',
  lede: 'Ranganathan described anything with five questions. Answer some, in any order; each count says what is left. A missing answer is a choice too, never dropped.',
  kind: 'vehicle',        /* the kind the sample rows below belong to */
  /* PMEST: L = Ranganathan’s letter; name = his word (one step down); q = the operator’s question; ours = the AUGUR term it maps to; punct = colon-class connecting symbol */
  facets: [
    { L: 'P', name: 'Personality', q: 'What is it?', term: 'kind', ours: '<b>Kind of thing</b>, and the kinds inside it. The hatched kinds are real counts; this sheet’s sample rows are vehicles only.', punct: '', field: 'kind' },
    { L: 'M', name: 'Matter', q: 'What is it like?', term: 'detail', ours: '<b>Details</b>: what it is made of or has', punct: ';', field: 'fuel', detail: 'Fuel' },
    { L: 'E', name: 'Energy', q: 'What happened to it?', term: 'link', ours: '<b>Links</b> to incidents and intents', punct: ':', field: 'event' },
    { L: 'S', name: 'Space', q: 'Where?', term: 'detail', ours: '<b>Where</b> it is: a place detail or link', punct: '.', field: 'base', detail: 'Based at' },
    { L: 'T', name: 'Time', q: 'When?', term: 'detail', ours: '<b>When</b>: a date it holds', punct: '’', field: 'service', detail: 'Next service' }
  ],
  /* values for the sample: weights generate the rows deterministically; null = not known yet */
  values: {
    fuel: [['Diesel', 48], ['Electric', 18], ['Petrol', 15], [null, 6]],
    event: [['In an incident', 23], ['Used by an intent', 5], ['Neither', 59]],
    base: [['Kestrel Road Depot', 39], ['Ashby Yard', 26], ['Mill Vale', 16], [null, 6]],
    service: [['This month', 11], ['Next 3 months', 27], ['Later', 36], [null, 13]]
  },
  demo: ['fuel', 'event', 'base', 'service'],
  demoPick: { fuel: 'Diesel', event: 'In an incident', base: 'Kestrel Road Depot' },
  famTitle: 'Six things that look empty',
  famLede: 'In a filter, “not known yet” is a value with its count, marked as a gap. The other five never become filter values.'
};
/* ===== Shared helpers (generated into every sheet) ===== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const ms = n => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)) || 0;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ic = (n, s) => Icons.svg(n, { size: s || 16, stroke: 1.5 });
const K = id => DATA.kinds.find(k => k.id === id) || DATA.elsewhere.find(k => k.id === id);
const FL = id => DATA.floors[id];
const T = id => DATA.terms.find(t => t.id === id);
const REC = DATA.record;
const fmt = n => n.toLocaleString('en-GB');
const det = n => REC.details.find(d => d.n === n);
const byState = s => REC.details.find(d => d.state === s);
const SRC = id => REC.sources.find(s => s.id === id);

/* one stage per empty-looking state, all drawn from the specimen card */
function stateStage(id) {
  const g = byState('gap'), st = byState('stale'), no = byState('none'), h = REC.hidden, nr = REC.noRecord;
  if (id === 'gap') return `<div class="gapslot"><span class="gl">${g.n} · not known yet</span><span class="gw">${g.who}</span></div>`;
  if (id === 'none') return `<div class="vrow"><span class="k">${no.n}</span><span class="nonev">${no.v}<span class="ref">${no.ref}</span></span></div>`;
  if (id === 'stale') return `<div class="vrow"><span class="k">${st.n}</span><span>${st.v} <span class="staleage">${st.age}</span></span></div>`;
  if (id === 'shadow') return `<div class="shadowslot sm">${ic('lock', 14)}<span>${h.n} · kept on ${FL(h.floor).name}</span></div>`;
  if (id === 'could') return `<div class="sm muted">Could also hold: <span style="color:var(--ink)">${REC.could.join(', ')}</span></div>`;
  if (id === 'norecord') { let w = ''; for (let y = 2; y <= 22; y += 4) w += `${w ? 'L' : 'M'}${(y / 4) % 2 ? 94 : 90},${y}`; let w2 = ''; for (let y = 2; y <= 22; y += 4) w2 += `${w2 ? 'L' : 'M'}${(y / 4) % 2 ? 134 : 130},${y}`;
    return `<svg viewBox="0 0 220 40" style="display:block;width:100%;height:calc(var(--space-6) - var(--space-1))" aria-hidden="true">
      <rect x="0" y="4" width="90" height="16" data-tier="${FL(REC.floor).tier}" style="fill:color-mix(in srgb, var(--fc) 26%, transparent)"/>
      <rect x="92" y="4" width="40" height="16" style="fill:url(#x-stale)"/>
      <path d="${w}" style="fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2"/><path d="${w2}" style="fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2"/>
      <rect x="134" y="4" width="86" height="16" data-tier="${FL(REC.floor).tier}" style="fill:color-mix(in srgb, var(--fc) 26%, transparent)"/>
      <text x="112" y="36" text-anchor="middle" style="font:400 var(--type-small) var(--font-mono);fill:var(--ink)">no record ${nr.from} to ${nr.to}</text></svg>`; }
  return '';
}
/* the strip of six empty-looking states; opts.tech shows the technical line, opts.ids picks and orders them */
function renderFamily(el, opts) {
  opts = opts || {};
  const ids = opts.ids || DATA.states.map(s => s.id);
  el.style.setProperty('--n', ids.length);
  el.innerHTML = ids.map((id, i) => { const s = DATA.states.find(x => x.id === id);
    return `<div class="st dep" style="--i:${i}" data-state="${id}"><div class="stage">${stateStage(id)}</div>
      <div class="nm">${s.plain}<small>${s.from}</small></div><p class="d">${s.d}</p>
      ${opts.tech === false ? '' : `<p class="tk">${s.tech} · never “${s.never}”</p>`}</div>`; }).join('');
  Icons.hydrate(el);
}
/* one shared hatch pattern for SVG */
document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="x-stale" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--x-hatch);stroke-width:1"/></pattern>
  <pattern id="x-shadow" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--hairline);stroke-width:1"/></pattern></defs></svg>`);
/* timers for the auto-demo; R replays from the start */
const TIMERS = [];
const later = (fn, t) => TIMERS.push(setTimeout(fn, t));
function boot(reset, demo) {
  const w = $('#wrap');
  const run = () => { TIMERS.splice(0).forEach(clearTimeout); reset(); w.classList.add('pre'); later(() => { w.classList.remove('pre'); demo(); }, ms('--motion-run')); };
  document.addEventListener('keydown', e => { if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) run(); });
  run();
}

/* deterministic sample rows for one kind, from SHEET.values */
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const kind = K(SHEET.kind);
const ROWS = (() => { const r = rng(7), rows = [];
  const deck = f => { const d = []; SHEET.values[f].forEach(([v, n]) => { for (let i = 0; i < n; i++) d.push(v); }); for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } return d; };
  const D = {}; Object.keys(SHEET.values).forEach(f => D[f] = deck(f));
  for (let i = 0; i < kind.count; i++) rows.push({ name: `${kind.name} ${String(i + 1).padStart(2, '0')}`, kind: kind.id, fuel: D.fuel[i], event: D.event[i], base: D.base[i], service: D.service[i] });
  return rows; })();
const NK = '\u0000nk';   /* the "not known yet" choice */
let pick = {};
const match = (row, except) => Object.entries(pick).every(([f, v]) => f === except || (f === 'kind' ? row.kind === v : (v === NK ? row[f] == null : row[f] === v)));
const left = (f, v) => ROWS.filter(r => match(r, f) && (f === 'kind' ? r.kind === v : v === NK ? r[f] == null : r[f] === v)).length;
function chips(fc) {
  if (fc.field === 'kind') return DATA.kinds.map(k => k.id === SHEET.kind
    ? `<button class="chip" data-f="kind" data-v="${k.id}" aria-pressed="${pick.kind === k.id}"><span>${k.plural}</span><b>${fmt(k.count)}</b></button>`
    : `<span class="chip" aria-disabled="true" title="This sheet’s sample rows are ${kind.plural.toLowerCase()} only"><span>${k.plural}</span><b>${fmt(k.count)}</b></span>`).slice(0, 5).join('');
  return SHEET.values[fc.field].map(([v]) => { const key = v == null ? NK : v, n = left(fc.field, key), on = pick[fc.field] === key;
    return `<button class="chip ${v == null ? 'gap' : ''} ${n ? '' : 'zero'}" data-f="${fc.field}" data-v="${key}" aria-pressed="${on}"><span>${v == null ? 'Not known yet' : v}</span><b>${n}</b></button>`; }).join('');
}
function sentence() {
  const n = ROWS.filter(r => match(r)).length, f = SHEET.facets;
  const part = (fc, txt) => pick[fc.field] ? `<b>${txt}</b>` : '';
  const v = k => pick[k] === NK ? null : pick[k];
  const bits = [];
  if (pick.fuel) bits.push(part(f[1], v('fuel') ? v('fuel').toLowerCase() : `${f[1].detail.toLowerCase()} not known yet`));
  bits.push(pick.kind ? `<b>${kind.plural.toLowerCase()}</b>` : 'things');
  if (pick.event) bits.push(part(f[2], v('event') ? v('event').toLowerCase().replace('neither', 'in no incident or intent') : ''));
  if (pick.base) bits.push(part(f[3], v('base') ? `at ${v('base')}` : 'with no base known yet'));
  if (pick.service) bits.push(part(f[4], v('service') ? `serviced ${v('service').toLowerCase()}` : 'with no service date yet'));
  const s = bits.join(' ').replace(/^(<b>)?(.)/, (m, b, c) => (b || '') + c.toUpperCase());
  $('#say').innerHTML = Object.keys(pick).length ? `${s}: <span class="n">${n}</span>` : `Everything we keep: <span class="n">${fmt(DATA.kinds.reduce((a, k) => a + k.count, 0))}</span> cards. Answer a question below.`;
  const cc = [pick.kind ? kind.name : '', ...SHEET.facets.slice(1).map(fc => pick[fc.field] ? fc.punct + (pick[fc.field] === NK ? '[ ]' : pick[fc.field].replace(/(^|\s+)(\w)/g, (m, a, c) => c.toUpperCase())) : '')].join('');
  $('#cc').innerHTML = `Colon notation, one step down: <b>${cc || '—'}</b>`;
  const res = ROWS.filter(r => match(r)).slice(0, 3), fl = FL(kind.floor);
  $('#res').innerHTML = Object.keys(pick).length ? `<span class="rl">Cards left · ${n}</span>` + res.map(r => `<span class="rc" data-tier="${fl.tier}">${ic(kind.icon, 14)}${r.name}</span>`).join('') + (n > 3 ? `<span class="muted">and ${n - 3} more</span>` : '') : '';
}
function render() {
  $('#eyebrow').textContent = SHEET.eyebrow; $('#h1').textContent = SHEET.title; $('#lede').textContent = SHEET.lede;
  const fl = FL(kind.floor);
  $('#cols').innerHTML = SHEET.facets.map((fc, i) => `<section class="col dep" style="--i:${i + 1}"><div class="hd"><span class="L">${fc.L}</span><span class="q">${fc.q}<small>${fc.name} · ${T(fc.term).tech.split(' · ')[0]}</small></span></div>
      <div class="vals" data-col="${fc.field}">${chips(fc)}</div><p class="ours" style="margin:0">${fc.ours}</p></section>`).join('')
    + `<span class="sep" aria-hidden="true"></span><section class="col kept dep" style="--i:6"><div class="hd"><span class="L">Kept on</span></div><div class="vals"><span class="chip" data-tier="${fl.tier}" style="border-left:2px solid var(--fc)"><span>${fl.name}</span><b>${kind.count}</b></span></div>
      <p class="ours" style="margin:0"><b>Not a sixth question.</b> It says who keeps a card, not what the thing is. You can narrow by it; it never describes the thing.</p><p class="never nv" style="margin:0"><b>Never means</b> ${T('floor').never}</p></section>`;
  $('#gloss').innerHTML = DATA.terms.map((t, i) => `<div class="dep" style="--i:${i}"><b>${t.plain}</b><code>${t.tech.split(' · ')[0]}</code>${t.never.split('. ')[0].replace(/\.$/, '')}.</div>`).join('');
  $('#famh').textContent = SHEET.famTitle; $('#famd').textContent = SHEET.famLede;
  renderFamily($('#fam'), { ids: ['gap', 'none', 'stale', 'norecord', 'shadow', 'could'] });
  wire(); sentence(); Icons.hydrate(document.body);
}
function refresh() { SHEET.facets.forEach(fc => { const el = $(`.vals[data-col="${fc.field}"]`); if (el) el.innerHTML = chips(fc); }); wire(); sentence(); Icons.hydrate(document.body); }
function wire() { $$('.chip[data-f]').forEach(c => c.onclick = () => { const f = c.dataset.f, v = c.dataset.v; if (pick[f] === v) delete pick[f]; else pick[f] = v; refresh(); }); }
function lit(f, v) { const c = $(`.chip[data-f="${f}"][data-v="${v}"]`); if (c) { c.classList.add('lit'); later(() => c.classList.remove('lit'), ms('--motion-run')); } }
document.addEventListener('keydown', e => { if (e.key === '0') { pick = {}; refresh(); } });
render();
boot(() => { pick = {}; refresh(); }, () => {
  const step = ms('--motion-slow') + ms('--motion-quick');
  later(() => { pick.kind = kind.id; refresh(); lit('kind', kind.id); }, 0);
  SHEET.demo.forEach((f, i) => later(() => { const best = SHEET.values[f].filter(([v]) => v != null).map(([v]) => [v, left(f, v)]).sort((a, b) => b[1] - a[1])[0]; const want = SHEET.demoPick[f]; pick[f] = want && left(f, want) ? want : best[0]; refresh(); lit(f, best[0]); }, step * (i + 1)));
  later(() => { const g = $$('.chip.gap').find(c => !c.classList.contains('zero')); g && g.classList.add('lit'); }, step * (SHEET.demo.length + 1));
});
</script>
</body>
</html>
