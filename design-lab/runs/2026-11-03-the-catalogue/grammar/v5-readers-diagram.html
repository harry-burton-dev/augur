/* ---------------------------------------------------------------
   Proposed tokens for the catalogue grammar. Every one is a mix of kit
   tokens and is listed as "needs token" in notes.md.
   --------------------------------------------------------------- */
:root{
  /* --mark-gap: the gap mark. Four corner ticks of the slot a detail would fill. No fill, no hatch. */
  --x-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-gap-tick: var(--space-2);
  --x-gap:
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left top / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left top / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right top / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right top / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left bottom / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left bottom / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right bottom / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right bottom / 1px var(--x-gap-tick) no-repeat;
  /* --mark-stale-hatch and shadow: carried unchanged from wear-and-time and the cinematic light language. */
  --x-hatch: color-mix(in srgb, var(--ink-muted) 26%, transparent);
  --x-stale: repeating-linear-gradient(45deg, transparent 0 var(--space-2), var(--x-hatch) var(--space-2) calc(var(--space-2) + 1px));
  --x-shadow: repeating-linear-gradient(135deg, transparent 0 var(--space-2), var(--hairline) var(--space-2) calc(var(--space-2) + 1px));
  /* --mark-expected: the "should have" tick before a detail name in a kind. */
  --x-expected: var(--ink);
  /* --mark-link: the hairline a link is drawn with, and its verb ink. */
  --x-link: var(--hairline-strong);
  /* --time-past-dim from wear-and-time, used for backward readings and quiet lines. */
  --x-quiet: .62;
}

[data-tier="team"]{--fc:var(--floor-team-high)}
[data-tier="org"]{--fc:var(--floor-org-high)}

.ref{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);vertical-align:super;margin-left:2px}
.exptick{display:inline-block;width:2px;height:var(--space-3);background:var(--x-expected);margin-right:var(--space-2);vertical-align:-1px}
.exptick.can{background:transparent}
/* empty-looking family strip */
.fam{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:var(--space-3)}
.fam .st{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.fam .stage{height:calc(var(--space-7) - var(--space-2));position:relative;display:flex;align-items:center;padding:0 var(--space-2);border-radius:var(--radius-key);background:var(--slate-deep);border:1px solid var(--hairline)}

/* one stage per empty-looking state, all drawn from the specimen card */

/* the strip of six empty-looking states; opts.tech shows the technical line, opts.ids picks and orders them */

/* one shared hatch pattern for SVG */
document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="x-stale" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--x-hatch);stroke-width:1"/></pattern>
  <pattern id="x-shadow" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--hairline);stroke-width:1"/></pattern></defs></svg>`);
/* timers for the auto-demo; R replays from the start */
const TIMERS = [];

const W = 1000, H = 470;
const nodes = [...DATA.kinds, ...DATA.elsewhere];
const rad = k => 18 + 34 * Math.sqrt(k.count / Math.max(...DATA.kinds.map(x => x.count)));
const P = id => [SHEET.pos[id][0] * W, SHEET.pos[id][1] * H];
const complete = k => { const e = k.details.filter(d => d.exp); const known = e.reduce((a, d) => a + d.known, 0), all = e.length * k.count; return { pc: known / all, gaps: all - known }; };
function edge(a, b, ra, rb) { const [x1, y1] = P(a), [x2, y2] = P(b), d = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / d, uy = (y2 - y1) / d; return [x1 + ux * (ra + 6), y1 + uy * (ra + 6), x2 - ux * (rb + 6), y2 - uy * (rb + 6), ux, uy]; }
function draw() {
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kinds of thing and the links between them">`;
  Object.entries(SHEET.elsewhereTo).forEach(([e, tos]) => tos.forEach(t => { const [x1, y1, x2, y2] = edge(e, t, 26, rad(K(t))); s += `<g class="ex"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/></g>`; }));
  DATA.links.forEach((l, i) => { const a = K(l.from), b = K(l.to), [x1, y1, x2, y2, ux, uy] = edge(l.from, l.to, rad(a), rad(b)), mx = (x1 + x2) / 2, my = (y1 + y2) / 2, len = Math.hypot(x2 - x1, y2 - y1);
    const ang = Math.atan2(uy, ux) * 180 / Math.PI, ax = x2 - ux * 2, ay = y2 - uy * 2; let nx = -uy, ny = ux; if (ny > 0 || (ny === 0 && nx < 0)) { nx = -nx; ny = -ny; }
    s += `<g class="lk" data-i="${i}" tabindex="0" role="button" aria-label="${a.name} ${l.verb} ${b.name}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke-dasharray:${len};stroke-dashoffset:${len}" data-len="${len}"/>
      <polygon class="ah" points="0,0 -9,-4 -9,4" transform="translate(${ax},${ay}) rotate(${ang})"/>
      <rect class="dm" x="-6" y="-6" width="12" height="12" transform="translate(${mx},${my}) rotate(45)"/>
      <text class="vb" x="${mx + nx * 16}" y="${my + ny * 16 + 4}" text-anchor="${Math.abs(nx) < .3 ? 'middle' : nx > 0 ? 'start' : 'end'}">${l.verb}</text></g>`; });
  nodes.forEach(k => { const [x, y] = P(k.id), ex = !k.details, r = ex ? 26 : rad(k), c = ex ? null : complete(k), fl = ex ? null : FL(k.floor);
    const fill = ex ? 'transparent' : `color-mix(in srgb, var(--ink) calc(var(--x-fill-lo) + (var(--x-fill-hi) - var(--x-fill-lo)) * ${c.pc.toFixed(3)}), transparent)`;
    s += `<g class="${ex ? 'ex' : 'nd'}" data-k="${k.id}" ${fl ? `data-tier="${fl.tier}"` : ''}><circle class="f" cx="${x}" cy="${y}" r="${r}" style="fill:${fill};stroke:${ex ? 'var(--hairline-strong)' : 'var(--fc)'};stroke-width:${ex ? 1 : 2};${ex ? 'stroke-dasharray:3 3' : ''}"/>
      <g transform="translate(${x - 10},${y - 10})" style="color:var(--ink)">${Icons.svg(k.icon, { size: 20, stroke: 1.5 })}</g>
      <text class="nm" x="${x}" y="${y + r + 18}" text-anchor="middle">${k.plural}</text>
      <text class="ct" x="${x}" y="${y + r + 34}" text-anchor="middle">${fmt(k.count)}${ex ? ' · ' + DATA.apps[k.app] : ` · ${Math.round(c.pc * 100)}% known`}</text></g>`; });
  $('#dia').innerHTML = s + '</svg>';
  $$('.lk').forEach(g => { g.addEventListener('mouseenter', () => focusLink(+g.dataset.i)); g.addEventListener('focus', () => focusLink(+g.dataset.i)); g.addEventListener('click', () => focusLink(+g.dataset.i)); });
}
function swatch(t) {
  const df = FL('ops').tier;
  if (t === 'size') return `<svg class="sw" viewBox="0 0 44 28"><circle cx="9" cy="14" r="5" style="fill:none;stroke:var(--ink-muted)"/><circle cx="30" cy="14" r="11" style="fill:none;stroke:var(--ink-muted)"/></svg>`;
  if (t === 'value') return `<svg class="sw" viewBox="0 0 44 28"><circle cx="11" cy="14" r="9" style="fill:color-mix(in srgb, var(--ink) var(--x-fill-lo), transparent);stroke:var(--hairline-strong)"/><circle cx="33" cy="14" r="9" style="fill:color-mix(in srgb, var(--ink) var(--x-fill-hi), transparent);stroke:var(--hairline-strong)"/></svg>`;
  if (t === 'hue') return `<svg class="sw" viewBox="0 0 44 28"><circle cx="8" cy="14" r="6" style="fill:none;stroke:var(--floor-department-high);stroke-width:2"/><circle cx="22" cy="14" r="6" style="fill:none;stroke:var(--floor-team-high);stroke-width:2"/><circle cx="36" cy="14" r="6" style="fill:none;stroke:var(--floor-org-high);stroke-width:2"/></svg>`;
  if (t === 'shape') return `<span class="sw" style="display:flex;gap:4px;align-items:center;color:var(--ink)">${ic('building-2', 14)}${ic('truck', 14)}${ic('siren', 14)}</span>`;
  if (t === 'texture') return `<span class="sw" style="display:grid;grid-template-columns:1fr 1fr;gap:2px"><i style="background:var(--x-gap);--x-gap-tick:4px"></i><i style="background:var(--x-stale)"></i><i style="background:var(--x-shadow)"></i><i style="border-bottom:1px dashed var(--ink-muted)"></i></span>`;
  if (t === 'orient') return `<svg class="sw" viewBox="0 0 44 28"><line x1="2" y1="14" x2="36" y2="14" style="stroke:var(--ink-muted)"/><polygon points="42,14 33,10 33,18" style="fill:var(--ink-muted)"/></svg>`;
  return `<svg class="sw" viewBox="0 0 44 28"><circle cx="8" cy="20" r="3" style="fill:var(--ink-muted)"/><circle cx="22" cy="8" r="3" style="fill:var(--ink-muted)"/><circle cx="36" cy="16" r="3" style="fill:var(--ink-muted)"/></svg>`;
}
let cur = null;
function focusLink(i) { cur = i; $('#dia').classList.toggle('focus', i != null);
  $$('.lk').forEach(g => g.classList.toggle('on', +g.dataset.i === i));
  const l = i != null && DATA.links[i];
  $$('.nd').forEach(n => n.classList.toggle('on', !!l && (n.dataset.k === l.from || n.dataset.k === l.to)));
  if (!l) { $('#read').innerHTML = `<div class="s">Read a link</div><div class="s2">Every line is a verb. Pick one: it reads both ways, and says how many on each side in words, never as crow’s feet.</div>`; return; }
  const a = K(l.from), b = K(l.to), c = complete(a);
  const each = n => n === 'one' ? 'one' : 'any number of';
  $('#read').innerHTML = `<div class="s">Each ${a.name.toLowerCase()} ${l.verb} ${each(l.fromN) === 'one' ? 'one ' + b.name.toLowerCase() : 'any number of ' + b.plural.toLowerCase()}.</div>
    <div class="s">A ${b.name.toLowerCase()} ${l.back} ${l.toN === 'one' ? 'one ' + a.name.toLowerCase() : 'any number of ' + a.plural.toLowerCase()}.</div>
    <div class="s2">${a.plural}: ${Math.round(c.pc * 100)}% of what they should hold is known; ${fmt(c.gaps)} details show as not known yet, each with who could fill it.</div>
    <div class="t">One step down: ${l.tech} · domain ${a.name}, range ${b.name} · ${l.fromN === 'one' ? 'max 1' : 'many'} to ${l.toN === 'one' ? 'max 1' : 'many'}</div>`; }
function render() {
  $('#eyebrow').textContent = SHEET.eyebrow; $('#h1').textContent = SHEET.title; $('#lede').textContent = SHEET.lede; $('#bh').textContent = SHEET.bertinHead;
  $('#bt').innerHTML = SHEET.bertin.map((b, i) => `<tr class="dep" style="--i:${i + 1}"><td>${swatch(b.sw)}</td><td class="vv">${b.v}<small>${b.tech}</small></td><td class="job">${b.job}<br>Never ${b.never}.</td></tr>`).join('');
  $('#terms').innerHTML = DATA.terms.map(t => `<div><b>${t.plain}</b> <code>${t.tech.split(' · ')[0]}</code></div>`).join('');
  $('#famh').textContent = SHEET.famTitle; $('#famd').textContent = SHEET.famLede;
  renderFamily($('#fam'));

}
document.addEventListener('keydown', e => { const n = DATA.links.length;
  if (e.key === 'ArrowRight') focusLink(cur == null ? 0 : (cur + 1) % n); if (e.key === 'ArrowLeft') focusLink(cur == null ? n - 1 : (cur + n - 1) % n); if (e.key === 'Escape') focusLink(null); });
render();
boot(() => { focusLink(null); $$('.lk line').forEach(l => l.style.strokeDashoffset = l.dataset.len); },
  () => { requestAnimationFrame(() => $$('.lk line').forEach((l, i) => later(() => l.style.strokeDashoffset = 0, RM ? 0 : i * ms('--motion-quick'))));

</script>
