<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facets · V2 · Card drawers</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
:root{
  --x-proposed-card:color-mix(in srgb,var(--ink) 7%,var(--slate-deep));              /* --card-stock: the catalogue card, a lifted slate */
  --x-proposed-card-edge:color-mix(in srgb,var(--ink) 22%,transparent);               /* --card-edge: one card seen from above */
  --x-proposed-card-ratio:1.667;                                                       /* 5 x 3 inch library card */
}
.body{flex:1;min-height:0;display:grid;grid-template-columns:calc(var(--measure-rail) + var(--space-4)) minmax(0,1fr) var(--measure-card);gap:var(--space-5)}
@media (max-width:1440px){.body{grid-template-columns:calc(var(--measure-rail) - var(--space-5)) minmax(0,1fr) calc(var(--measure-card) * .8);gap:var(--space-4)}.gd .tab{font-size:var(--x-proposed-type-micro)}}
.box-top span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the cabinet: one drawer per kind of thing */
.cab{display:flex;flex-direction:column;gap:var(--space-2);min-height:0}
.cab .eyebrow{margin-bottom:var(--space-1)}
.dr{position:relative;display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;align-items:center;gap:var(--space-2);height:calc(var(--target-md) + var(--space-2));padding:0 var(--space-3);border-radius:var(--radius-key);background:linear-gradient(var(--surface-raised),var(--surface-inset));border:1px solid var(--hairline);transition:transform var(--motion-slow) var(--ease-out),border-color var(--motion-base) var(--ease-standard)}
.dr .hd{width:var(--space-5);height:var(--space-2);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);background:var(--slate-deep)}
.dr .lb{display:flex;flex-direction:column;min-width:0;padding:2px var(--space-2);border:1px solid var(--hairline-strong);border-radius:2px;background:var(--slate-deep)}
.dr .lb b{font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.dr .lb small{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.dr .n{font:400 var(--type-meta)/1 var(--font-mono);color:var(--ink-muted)}
.dr[aria-pressed="true"]{transform:translateX(var(--travel-near));border-color:color-mix(in srgb,var(--x-proposed-floor) 60%,transparent)}
.dr[aria-pressed="true"] .n{color:var(--light)}
.dr.zero{opacity:.62}
.dr.zero .lb{background:var(--x-proposed-gap)}
.dr .away{color:var(--floor-team-high)}
.dr .away svg{vertical-align:-1px}
/* the open drawer */
.open{display:flex;flex-direction:column;min-height:0;min-width:0}
.clips{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;margin-bottom:var(--space-3);font-size:var(--type-meta);color:var(--ink-muted)}
.clip{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--target-sm);padding:0 var(--space-1) 0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);background:var(--surface-inset)}
.clip.on{border-color:color-mix(in srgb,var(--x-proposed-floor) 60%,transparent);color:var(--light)}
.clip select{font:inherit;font-size:var(--type-meta);color:inherit;background:transparent;border:0;height:100%;padding:0 var(--space-1);cursor:pointer}
.clip select{max-width:calc(var(--space-8) + var(--space-5))}
.dr .lb small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip select option{background:var(--slate-deep);color:var(--ink)}
.box{position:relative;flex:1;min-height:0;border:1px solid var(--hairline-strong);border-top:0;border-radius:0 0 var(--radius-inset) var(--radius-inset);background:linear-gradient(var(--slate-deep),color-mix(in srgb,var(--slate-deep) 60%,transparent));padding:var(--space-4) var(--space-4) var(--space-3);display:flex;gap:var(--space-2);overflow:hidden;transform-origin:top left;transition:clip-path var(--motion-calm) var(--ease-out)}
.box.shut{clip-path:inset(0 100% 0 0)}
.box .by{position:absolute;right:var(--space-4);top:var(--space-2);font-size:var(--type-small);color:var(--ink-muted);display:flex;align-items:center;gap:var(--space-1)}
.box .by select{font:inherit;color:var(--ink);background:var(--surface-inset);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1)}
.box .by select option{background:var(--slate-deep)}
/* guide cards: a tab sticking up, the cards behind it as edges */
.gd{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;padding-top:var(--space-5)}
.gd .tab{align-self:flex-start;display:flex;flex-direction:column;gap:2px;max-width:100%;padding:var(--space-1) var(--space-2);border:1px solid var(--hairline-strong);border-bottom:0;border-radius:var(--radius-key) var(--radius-key) 0 0;background:var(--x-proposed-card);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:transform var(--motion-base) var(--ease-out)}
.gd .tab b{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light)}
.gd .pl{border-top:1px solid var(--hairline-strong);padding-top:var(--space-2);display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;overflow:hidden}
.gd .e{display:block;flex:none;padding:2px var(--space-1) 0;border-radius:2px 2px 0 0;border-top:1px solid var(--x-proposed-card-edge);background:linear-gradient(var(--x-proposed-card),transparent);font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:resin var(--motion-base) var(--ease-out) both}
.gd .pl{gap:2px}
.gd[aria-pressed="true"] .tab{transform:translateY(calc(var(--space-2) * -1));background:color-mix(in srgb,var(--x-proposed-floor) 22%,var(--x-proposed-card));box-shadow:0 0 var(--glow-blur) color-mix(in srgb,var(--x-proposed-floor) 30%,transparent)}
.gd[aria-pressed="true"] .e{border-top-color:color-mix(in srgb,var(--x-proposed-floor) 60%,transparent)}
.gd.gap .tab{background:var(--x-proposed-gap),var(--x-proposed-card);border-style:dashed}
.gd.zero .tab{color:var(--ink-muted)}
.gd .note{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.gd .note .why{padding:var(--space-1) 0;font-size:var(--type-small);line-height:var(--leading-small);grid-template-columns:var(--space-4) minmax(0,1fr)}
.gd .more{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);margin-top:var(--space-1)}
.box-top{display:flex;align-items:flex-end;gap:var(--space-3);height:var(--space-6);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-bottom:0;border-radius:var(--radius-inset) var(--radius-inset) 0 0;background:var(--surface-raised)}
.box-top h2{margin:0 0 var(--space-2);font:300 var(--type-lead)/1 var(--font-sans);color:var(--light)}
.box-top span{margin-bottom:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
/* the catalogue card: one fixed shape every record shares */
.card-col{display:flex;flex-direction:column;gap:var(--space-3);min-height:0}
.cc{aspect-ratio:var(--x-proposed-card-ratio);background:var(--x-proposed-card);border-radius:2px;box-shadow:var(--shadow-raised);padding:var(--space-3) var(--space-4);display:flex;flex-direction:column;position:relative;background-image:repeating-linear-gradient(transparent 0 calc(var(--leading-meta) - 1px),color-mix(in srgb,var(--info) 14%,transparent) calc(var(--leading-meta) - 1px) var(--leading-meta));background-position:0 calc(var(--space-6) + var(--space-2));animation:resin var(--motion-slow) var(--ease-out) both}
.cc::before{content:"";position:absolute;left:calc(var(--space-6) + var(--space-3));top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--danger) 30%,transparent)}
.cc .mark{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.cc h3{margin:var(--space-1) 0 var(--space-2) calc(var(--space-6) + var(--space-1));font:400 var(--type-body)/var(--leading-meta) var(--font-mono);color:var(--light)}
.cc dl{margin:0;display:grid;grid-template-columns:calc(var(--space-6) + var(--space-1)) minmax(0,1fr);column-gap:var(--space-4);font-size:var(--type-small);line-height:var(--leading-meta)}
.cc dt{font-family:var(--font-mono);color:var(--ink-muted);text-align:right;font-size:var(--x-proposed-type-micro)}
.cc dd{margin:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc dd.g{background:var(--x-proposed-gap);color:var(--ink-muted);border-radius:2px;padding:0 var(--space-1)}
.cc .tr{margin-top:auto;font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.behind{flex:1;min-height:0;overflow:auto;list-style:none;margin:0;padding:0;font-size:var(--type-small);scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.behind li button{width:100%;display:flex;gap:var(--space-2);justify-content:space-between;padding:var(--space-1) var(--space-2);border-top:1px solid var(--x-proposed-card-edge);color:var(--ink-muted)}
.behind li button:hover,.behind li button[aria-current="true"]{color:var(--ink);background:var(--surface-inset)}
.behind li button span:last-child{font-family:var(--font-mono);font-size:var(--x-proposed-type-micro)}
@media (max-height:840px){.dr{height:var(--target-md)}}
</style>
</head>
<body class="admin-off">
<div class="app" id="app"></div>
<div class="x-cap"><b>Facets · V2</b> pull a drawer, guide cards divide it, clips hold the rest · library card catalogue, Ranganathan colon notation</div>
<script>
/*@DATA*/
/*@ENGINE*/
const app = document.getElementById('app');
let drawer = null, by = 'when', guide = null, clips = {}, cardId = null;
const SYM = { kind: '', service: ';', state: ':', region: '.', when: "'" };
app.innerHTML = frame() + '<main class="main"><div class="head"><div><div class="eyebrow">' + DATA.app + ' · ' + DATA.floor.name + '</div><h1>The card drawers</h1><div class="sub">One drawer for each kind of thing. <b>Guide cards</b> divide a drawer; <b>clips</b> hold back cards you don’t want. Every count says how many cards are behind it before you look.</div></div><button class="btn" id="tbtn">' + Icons.svg('code', { size: 16 }) + 'Technical names <span class="kbd">T</span></button></div><div class="body"><div class="cab" id="cab"></div><div class="open" id="open"></div><div class="card-col" id="cardcol"></div></div></main>' +
  keys([['1-6', 'pull a drawer'], ['← →', 'guide cards'], ['↑ ↓', 'cards'], ['esc', 'push back'], ['T', 'technical names'], ['R', 'replay']]);
function selFor(extra) { const s = {}; for (const k in clips) if (clips[k]) s[k] = new Set([clips[k]]); if (drawer) s.kind = new Set([drawer]); return Object.assign(s, extra || {}); }
function code(r) {
  const k = F.KIND[r.kind]; const y = r.date ? r.date.slice(2, 4) : '__';
  return k.one.slice(0, 3).toUpperCase() + SYM.service + r.service.slice(0, 2).toUpperCase() + SYM.state + r.state.slice(0, 3).toUpperCase() + SYM.region + (r.region ? r.region.slice(0, 3).toUpperCase() : '___') + (k.date ? SYM.when + y : '');
}
function render() {
  const cs = {}; for (const k in clips) if (clips[k]) cs[k] = new Set([clips[k]]);
  const kc = F.counts('kind', cs);
  document.getElementById('cab').innerHTML = '<div class="eyebrow">Cabinet · ' + F.results(cs).length + ' cards</div>' + DATA.kinds.map((k, i) => {
    const n = kc[k.id], away = F.recs.filter(r => r.reach && r.kind === k.id && F.matches(r, cs, 'kind')).length;
    return '<button class="dr' + (!n ? ' zero' : '') + '" data-k="' + k.id + '" aria-pressed="' + (drawer === k.id) + '" title="' + (n ? '' : 'Empty with these clips: ' + F.why(cs, 'kind', k.id).map(x => x.head).join('; ')) + '"><span class="hd"></span><span class="lb"><b>' + F.cap(k.many) + '</b><small>' + (k.date ? 'by ' + k.date : 'no key date') + (away ? '<span class="away"> \u00b7 ' + Icons.svg('lock', { size: 10 }) + ' ' + away + ' below</span>' : '') + '<span class="tech"> · ' + k.tech + '</span></small></span><span class="n">' + n + '</span></button>';
  }).join('');
  const O = document.getElementById('open');
  if (!drawer) { O.innerHTML = '<div class="box-top"><h2>Pick a drawer</h2><span>Counts on the fronts say how many cards each holds now.</span></div><div class="box shut"></div>'; document.getElementById('cardcol').innerHTML = ''; return; }
  const K = F.KIND[drawer];
  const others = DATA.facets.filter(f => f.id !== 'kind' && f.id !== by && !(f.id === 'when' && !K.date));
  let h = '<div class="clips">' + Icons.svg('paperclip', { size: 16 }) + '<span>Clips</span>' + others.map(f => {
    const c = F.counts(f.id, selFor());
    return '<label class="clip' + (clips[f.id] ? ' on' : '') + '">' + f.plain + '<select data-clip="' + f.id + '"><option value="">any</option>' + f.values.concat(c[F.GAP] ? [{ id: F.GAP, label: 'Not recorded' }] : []).map(v => '<option value="' + v.id + '"' + (clips[f.id] === v.id ? ' selected' : '') + '>' + v.label + ' · ' + (c[v.id] || 'none, see why') + '</option>').join('') + '</select></label>';
  }).join('') + '</div>';
  const S = selFor(), c = F.counts(by, S), all = F.results(S);
  const fb = F.FACET[by];
  const vals = fb.values.concat(c[F.GAP] ? [{ id: F.GAP, label: 'Not recorded' }] : []);
  h += '<div class="box-top"><h2>' + F.cap(K.many) + '</h2><span>' + all.length + ' cards' + (F.size(Object.fromEntries(Object.entries(S).filter(([k]) => k !== 'kind'))) ? ', clipped: ' + F.esc(F.describe(S).text) : '') + '</span></div><div class="box" id="box"><label class="by">Guide cards by <select id="by">' + DATA.facets.filter(f => f.id !== 'kind' && !(f.id === 'when' && !K.date)).map(f => '<option value="' + f.id + '"' + (f.id === by ? ' selected' : '') + '>' + f.plain.toLowerCase() + (f.id === 'when' ? ' (' + K.date + ')' : '') + '</option>').join('') + '</select></label>';
  vals.forEach(v => {
    const n = c[v.id] || 0, on = guide === v.id;
    h += '<button class="gd' + (v.id === F.GAP ? ' gap' : '') + (!n ? ' zero' : '') + '" data-g="' + v.id + '" aria-pressed="' + on + '"><span class="tab">' + v.label + '<b>' + n + '</b></span><span class="pl">';
    if (n) { const rs = F.results(F.pick(S, by, v.id, 'only')); rs.slice(0, 14).forEach((r, i) => h += '<span class="e" style="animation-delay:calc(var(--motion-instant) * ' + i / 2 + ')">' + F.esc(r.name) + '</span>'); if (n > 14) h += '<span class="more">+' + (n - 14) + ' more</span>'; if (v.id === F.GAP) h += '<span class="note">' + K.keeper + ' can fill these in</span>'; }
    else h += '<span class="note">' + F.reasons(F.why(S, by, v.id).slice(0, 2)) + '</span>';
    h += '</span></button>';
  });
  O.innerHTML = h + '</div>';
  // the card in hand
  const C = document.getElementById('cardcol');
  const behind = guide != null ? F.results(F.pick(S, by, guide, 'only')) : [];
  if (!behind.length) { C.innerHTML = '<div class="eyebrow">Card in hand</div><p class="sub" style="color:var(--ink-muted);font-size:var(--type-meta)">Lift a guide card to read the cards behind it.</p>'; return; }
  const r = behind.find(x => x.id === cardId) || behind[0]; cardId = r.id;
  const d = F.fmtDate(r);
  const line = (t, v, gap) => '<dt>' + t + '</dt><dd' + (gap ? ' class="g" title="' + K.keeper + ' can fill it"' : '') + '>' + v + '</dd>';
  C.innerHTML = '<div class="eyebrow">Card in hand · ' + F.label(by, guide) + '</div><div class="cc"><span class="mark" title="Shelf mark: kind, about, status, where, when">' + code(r) + '<span class="tech"> colon notation (PMEST)</span></span><h3>' + F.esc(r.name) + '</h3><dl>' +
    line('about', F.label('service', r.service)) + line('status', F.label('state', r.state)) + line('where', r.region ? F.label('region', r.region) : 'not recorded · ' + K.keeper, !r.region) + (K.date ? line(K.date, d ? d.replace(K.date + ' ', '') : 'not recorded · ' + K.keeper, !d) : '') +
    r.missing.filter(m => !['region', K.date].includes(m)).slice(0, 2).map(m => line(m, 'not recorded · ' + K.keeper, true)).join('') +
    '</dl><div class="tr">used by ' + r.intents + ' intent' + (r.intents === 1 ? '' : 's') + ' · ' + r.docs + ' document' + (r.docs === 1 ? '' : 's') + '</div></div><div class="eyebrow">Behind it · ' + behind.length + '</div><ul class="behind">' + behind.map(x => '<li><button data-c="' + x.id + '" aria-current="' + (x.id === r.id) + '"><span>' + F.esc(x.name) + '</span><span>' + code(x) + '</span></button></li>').join('') + '</ul>';
}
app.addEventListener('click', e => {
  const d = e.target.closest('.dr'); if (d) { drawer = drawer === d.dataset.k ? null : d.dataset.k; guide = null; clips = {}; if (!F.KIND[drawer || 'site'].date && by === 'when') by = 'region'; render(); return; }
  const g = e.target.closest('.gd'); if (g) { guide = g.dataset.g; cardId = null; render(); return; }
  const c = e.target.closest('[data-c]'); if (c) { cardId = +c.dataset.c; render(); }
});
app.addEventListener('change', e => {
  if (e.target.id === 'by') { by = e.target.value; guide = null; delete clips[by]; render(); }
  if (e.target.dataset.clip) { clips[e.target.dataset.clip] = e.target.value || null; render(); }
});
document.getElementById('tbtn').onclick = () => document.body.classList.toggle('admin-off');
let run = 0;
async function demo() {
  const me = ++run; drawer = null; guide = null; clips = {}; by = 'when'; render();
  await F.wait(F.ms('--motion-run'));
  if (me !== run) return; drawer = 'contract'; render();
  const box = document.getElementById('box'); box.classList.add('shut'); requestAnimationFrame(() => requestAnimationFrame(() => box.classList.remove('shut')));
  await F.wait(F.ms('--motion-calm') * 1.5); if (me !== run) return;
  clips.region = 'north'; render();
  await F.wait(F.ms('--motion-calm')); if (me !== run) return;
  guide = 'this'; render();
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'r' || e.key === 'R') demo();
  else if (e.key === 't' || e.key === 'T') document.body.classList.toggle('admin-off');
  else if (/^[1-9]$/.test(e.key) && DATA.kinds[+e.key - 1]) { drawer = DATA.kinds[+e.key - 1].id; guide = null; clips = {}; if (!F.KIND[drawer].date && by === 'when') by = 'region'; render(); }
  else if (e.key === 'Escape') { drawer = null; render(); }
  else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && drawer) { const vs = [...document.querySelectorAll('.gd')].map(x => x.dataset.g); let i = vs.indexOf(guide); i = e.key === 'ArrowRight' ? Math.min(vs.length - 1, i + 1) : Math.max(0, i - 1); guide = vs[i]; cardId = null; render(); }
  else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && guide != null) { const ids = [...document.querySelectorAll('[data-c]')].map(x => +x.dataset.c); let i = ids.indexOf(cardId); i = e.key === 'ArrowDown' ? Math.min(ids.length - 1, i + 1) : Math.max(0, i - 1); cardId = ids[i]; render(); e.preventDefault(); }
});
demo();
</script>
</body>
</html>
