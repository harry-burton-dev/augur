<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facets · V6 · A trail you can rewind</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
:root{
  --x-proposed-trail-h:calc(var(--space-8) + var(--space-5));                         /* --trail-height: the narrowing band */
}
/* ---- V6: the choices as a trail that narrows, rewindable, with the undone steps kept as a branch ---- */
.trail{position:relative;height:var(--x-proposed-trail-h);margin:var(--space-2) 0 var(--space-4)}
.trail > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.band{fill:var(--x-proposed-bar);transition:d var(--motion-slow) var(--ease-out)}
.band.ghost{fill:none;stroke:var(--ink-muted);stroke-dasharray:3 4;opacity:.7}
.band.prev{fill:color-mix(in srgb,var(--light) 10%,transparent)}
.tn{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;transform:translateX(-50%);width:calc(var(--space-8) + var(--space-3));text-align:center;pointer-events:none}
.tn > *{pointer-events:auto}
.tn .lb{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.tn .lb small{display:block;font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.tn .ct{font:200 var(--type-heading)/1 var(--font-sans);color:var(--light);font-variant-numeric:tabular-nums}
.tn .acts{display:flex;gap:var(--space-1);opacity:0;transition:opacity var(--motion-quick) var(--ease-standard)}
.tn:hover .acts,.tn:focus-within .acts,.tn.hot .acts{opacity:1}
.tn .acts button{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--space-5);padding:0 var(--space-2);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-small);background:var(--surface-overlay);white-space:nowrap}
.tn.ghost .lb,.tn.ghost .ct{color:var(--ink-muted)}
.tn.ghost .ct{font-size:var(--type-lead)}
.tn.cur .ct{color:var(--x-proposed-floor);text-shadow:0 0 var(--glow-blur) color-mix(in srgb,var(--x-proposed-floor) 60%,transparent)}
.redo{position:absolute;right:0;bottom:calc(var(--space-1) * -1);display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:var(--space-6)}
.next{min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.next h2,.rs h2{margin:0 0 var(--space-2);font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.fx{display:grid;grid-template-columns:calc(var(--space-8) - var(--space-3)) minmax(0,1fr);gap:var(--space-2);padding:var(--space-2) 0;border-top:1px solid var(--hairline)}
.fx > span{font-size:var(--type-meta);color:var(--ink-muted);padding-top:var(--space-1)}
.fx > span .tech{display:block}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.ch{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-2);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);color:var(--ink)}
.ch .c{font:400 var(--type-small)/1 var(--font-mono);color:var(--x-proposed-floor)}
.ch:hover{background:var(--surface-raised)}
.ch.zero{border-style:dashed;color:var(--ink-muted)}
.ch.zero .c{color:var(--ink-muted);font-size:var(--x-proposed-type-micro);letter-spacing:var(--tracking-caps);text-transform:uppercase;display:inline-flex;gap:2px;align-items:center}
.ch.gap{background:var(--x-proposed-gap)}
.ch.used{opacity:.5}
.fx.done > span{color:var(--ink)}
.whybox{margin-top:var(--space-2);padding:var(--space-2) var(--space-3);border-left:2px solid var(--hairline-strong);background:var(--surface-inset);border-radius:0 var(--radius-key) var(--radius-key) 0}
.rs{min-height:0;display:flex;flex-direction:column}
.rs .sc{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.rs .res{grid-template-columns:var(--space-5) minmax(0,1fr) calc(var(--space-7) - var(--space-2)) calc(var(--space-8) + var(--space-4))}
.rs .res .ms{display:none}
@media (max-height:840px){:root{--x-proposed-trail-h:calc(var(--space-8) + var(--space-2))}}
</style>
</head>
<body class="admin-off">
<div class="app" id="app"></div>
<div class="x-cap"><b>Facets · V6</b> choices as a narrowing trail; rewind to any step, the undone steps wait as a branch · undo trees, Sankey's width-as-quantity, breadcrumbs</div>
<script>
/*@DATA*/
/*@ENGINE*/
const app = document.getElementById('app');
let steps = [], cur = 0, hot = null, ask = null; // steps[0..cur) are in force; steps[cur..] are the undone branch
const total = F.results({}).length;
const selAt = n => { const s = {}; steps.slice(0, n).forEach(x => s[x.f] = new Set([x.v])); return s; };
const without = i => { const s = {}; steps.slice(0, cur).forEach((x, j) => { if (j !== i) s[x.f] = new Set([x.v]); }); return s; };
app.innerHTML = frame() + '<main class="main"><div class="head"><div><div class="eyebrow">' + DATA.app + ' · ' + DATA.floor.name + '</div><h1>Find, step by step</h1><div class="sub">Each choice narrows the trail. <b>Rewind to any step</b>, or drop one step alone; what you undid waits as a faint branch until you choose again.</div></div><button class="btn" id="tbtn">' + Icons.svg('code', { size: 16 }) + 'Technical names <span class="kbd">T</span></button></div><div class="trail" id="trail"></div><div class="body"><section class="next" id="next"></section><section class="rs" id="rs"></section></div></main>' +
  keys([['click', 'choose next'], ['⌫', 'rewind one'], ['⇧⌫', 'redo'], ['esc', 'back to start'], ['T', 'technical names'], ['R', 'replay']]);
function trail() {
  const T = document.getElementById('trail'); const w = T.clientWidth, h = T.clientHeight;
  const all = [{ start: true }].concat(steps);
  const n = Math.max(5, all.length); const pad = F.ms('--space-8') / 2 + F.ms('--space-3');
  const X = i => pad + i * (w - pad * 2) / (n - 1);
  const cnt = all.map((_, i) => F.results(selAt(i)).length);
  const mid = h / 2 + F.ms('--space-1'), maxH = h / 2 - F.ms('--space-6') + F.ms('--space-3');
  const H = c => Math.max(1.5, Math.sqrt(c / total) * maxH);
  let s = '';
  for (let i = 0; i < all.length - 1; i++) {
    const a = X(i), b = X(i + 1), ha = H(cnt[i]), hb = H(cnt[i + 1]), m = (a + b) / 2;
    const d = 'M' + a + ' ' + (mid - ha) + ' C' + m + ' ' + (mid - ha) + ' ' + m + ' ' + (mid - hb) + ' ' + b + ' ' + (mid - hb) + ' L' + b + ' ' + (mid + hb) + ' C' + m + ' ' + (mid + hb) + ' ' + m + ' ' + (mid + ha) + ' ' + a + ' ' + (mid + ha) + 'Z';
    const ghost = i + 1 > cur, prev = hot != null && i + 1 > hot && i + 1 <= cur;
    s += '<path class="band' + (ghost ? ' ghost' : prev ? ' prev' : '') + '" d="' + d + '"/>';
  }
  let nodes = '';
  all.forEach((x, i) => {
    const ghost = i > cur, isCur = i === cur;
    const lb = x.start ? 'Everything<small>kept here</small>' : F.esc(F.label(x.f, x.v)) + '<small>' + F.FACET[x.f].plain + '</small>';
    let acts = '';
    if (!x.start && !ghost) acts = '<span class="acts"><button data-rw="' + (i - 1) + '" title="Rewind to before this step">' + Icons.svg('undo-2', { size: 14 }) + 'rewind</button><button data-drop="' + (i - 1) + '" title="Drop just this step">' + Icons.svg('x', { size: 14 }) + 'drop: +' + (F.results(without(i - 1)).length - cnt[cur]) + '</button></span>';
    else if (x.start && cur) acts = '<span class="acts"><button data-rw="-1">' + Icons.svg('rotate-ccw', { size: 14 }) + 'start over</button></span>';
    else if (ghost) acts = '<span class="acts"><button data-redo="' + (i - 1) + '">' + Icons.svg('redo-2', { size: 14 }) + 'redo to here</button></span>';
    nodes += '<div class="tn' + (ghost ? ' ghost' : '') + (isCur ? ' cur' : '') + (hot === i ? ' hot' : '') + '" data-i="' + i + '" style="left:' + X(i) + 'px"><span class="lb">' + lb + '</span><span class="ct">' + cnt[i] + '</span>' + acts + '</div>';
  });
  T.innerHTML = '<svg aria-hidden="true">' + s + '</svg>' + nodes + (steps.length > cur ? '<div class="redo">' + Icons.svg('git-branch', { size: 14 }) + (steps.length - cur) + ' undone step' + (steps.length - cur > 1 ? 's' : '') + ' kept as a branch</div>' : '');
}
function next() {
  const S = selAt(cur), N = document.getElementById('next');
  const used = new Set(steps.slice(0, cur).map(x => x.f));
  let h = '<h2>Choose next</h2>';
  DATA.facets.forEach(f => {
    const c = F.counts(f.id, S); const vals = f.values.concat(c[F.GAP] ? [{ id: F.GAP, label: 'Not recorded' }] : []);
    if (used.has(f.id)) { const st = steps.slice(0, cur).find(x => x.f === f.id); h += '<div class="fx done"><span>' + f.plain + '</span><div class="chips"><span class="ch used">' + F.label(f.id, st.v) + ' · chosen</span></div></div>'; return; }
    const allNa = vals.every(v => !c[v.id]) && c[F.NA];
    h += '<div class="fx"><span>' + f.plain + '<span class="tech">' + f.pm + ' · ' + f.tech + '</span></span><div class="chips">';
    if (allNa) h += '<span class="ch zero" style="background:var(--x-proposed-na)">does not apply to ' + F.things(S, 2) + '</span>';
    else vals.forEach(v => {
      const n = c[v.id];
      if (n) { h += '<button class="ch' + (v.id === F.GAP ? ' gap' : '') + '" data-f="' + f.id + '" data-v="' + v.id + '">' + v.label + '<span class="c">' + n + '</span></button>'; return; }
      const w = F.why(S, f.id, v.id); const top = w.find(x => x.type === 'reach') || w.find(x => x.type === 'triage') || w[0];
      const tag = top.type === 'reach' ? Icons.svg('lock', { size: 12 }) + top.n + ' below' : top.type === 'triage' ? Icons.svg('inbox', { size: 12 }) + top.n + ' waiting' : top.type === 'na' ? 'n/a' : 'none';
      h += '<button class="ch zero" data-why="' + f.id + '|' + v.id + '" aria-expanded="' + (ask === f.id + '|' + v.id) + '">' + v.label + '<span class="c">' + tag + '</span></button>';
    });
    h += '</div></div>';
    if (ask && ask.split('|')[0] === f.id) h += '<div class="fx" style="border-top:0;padding-top:0"><span></span><div class="whybox">' + F.reasons(F.why(S, f.id, ask.split('|')[1])) + '</div></div>';
  });
  N.innerHTML = h;
}
function results() {
  const res = F.results(selAt(cur)), d = F.describe(selAt(cur));
  document.getElementById('rs').innerHTML = '<h2>' + res.length + ' ' + F.esc(cur ? d.text : 'things kept here') + '</h2><div class="sc"><ul class="list">' + res.slice(0, 50).map(F.row).join('') + '</ul></div>';
}
function render() { trail(); next(); results(); }
function choose(f, v) { steps = steps.slice(0, cur).concat([{ f, v }]); cur = steps.length; hot = null; ask = null; render(); }
app.addEventListener('click', e => {
  const c = e.target.closest('.ch[data-f]'); if (c) { choose(c.dataset.f, c.dataset.v); return; }
  const z = e.target.closest('[data-why]'); if (z) { ask = ask === z.dataset.why ? null : z.dataset.why; next(); return; }
  const rw = e.target.closest('[data-rw]'); if (rw) { cur = +rw.dataset.rw + 1; hot = null; ask = null; render(); return; }
  const dr = e.target.closest('[data-drop]'); if (dr) { const i = +dr.dataset.drop; steps = steps.slice(0, cur).filter((_, j) => j !== i).concat(steps.slice(cur)); cur--; hot = null; render(); return; }
  const rd = e.target.closest('[data-redo]'); if (rd) { cur = +rd.dataset.redo + 1; hot = null; render(); }
});
app.addEventListener('mouseover', e => { const t = e.target.closest('.tn'); const i = t ? +t.dataset.i : null; if (i !== hot && (i == null || i < cur)) { hot = i; trail(); } });
document.getElementById('tbtn').onclick = () => document.body.classList.toggle('admin-off');
addEventListener('resize', trail);
let run = 0;
async function demo() {
  const me = ++run; steps = []; cur = 0; hot = null; ask = null; render();
  await F.wait(F.ms('--motion-run'));
  const st = F.ms('--motion-calm') * .6;
  for (const [f, v] of [['kind', 'contract'], ['service', 'waste'], ['region', 'north'], ['when', 'this']]) { if (me !== run) return; choose(f, v); await F.wait(st); }
  if (me !== run) return; cur = 3; hot = 3; ask = null; render(); const z = document.querySelector('.ch.zero[data-why]'); if (z) { ask = z.dataset.why; next(); }
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') demo();
  else if (e.key === 't' || e.key === 'T') document.body.classList.toggle('admin-off');
  else if (e.key === 'Backspace' && e.shiftKey) { if (cur < steps.length) { cur++; render(); } }
  else if (e.key === 'Backspace') { if (cur) { cur--; render(); } }
  else if (e.key === 'Escape') { cur = 0; ask = null; render(); }
});
demo();
</script>
</body>
</html>
