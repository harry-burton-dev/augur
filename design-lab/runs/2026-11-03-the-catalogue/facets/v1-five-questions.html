    if (base.length && app.length) {
      const c = counts(fid, sel); const near = FACET[fid].values.filter(v => v.id !== vid && c[v.id]).map(v => label(fid, v.id).toLowerCase() + ' ' + c[v.id]);
      out.unshift({ type: 'none', icon: 'search-x', head: 'None, checked ' + app.length + ' ' + things(sel, app.length), text: 'No ' + T + ' ' + pred(sel, fid, vid) + '.' + (near.length ? ' Nearest: ' + near.slice(0, 3).join(', ') + '.' : '') });
    }
    return out;
  }
  /* the whole result is empty: which single choice to undo gives most back */
  function recover(sel) {
    let best = null;
    for (const fid in sel) for (const vid of sel[fid] || []) {
      const s = pick(sel, fid, vid, 'add'); const n = results(s).length;
      if (!best || n > best.n) best = { fid, vid, n };
    }
    return best;
  }
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
  const css = getComputedStyle(document.documentElement);
  const ms = name => parseFloat(css.getPropertyValue(name)) || 0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = t => new Promise(r => setTimeout(r, reduced ? 1 : t));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function fmtDate(r) { const k = KIND[r.kind]; if (!k.date) return ''; if (!r.date) return null; const [y, m] = r.date.split('-'); return k.date + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m - 1] + ' ' + y; }
  /* one result row: kind, name, where, key date; gaps drawn as gaps */
  function row(r) {
    const k = KIND[r.kind]; const d = fmtDate(r);
    const reg = r.region ? label('region', r.region) : null;
    return '<li class="res"><span class="ki">' + Icons.svg(k.icon, { size: 16 }) + '</span><span class="nm">' + esc(r.name) + '<small>' + k.one + ' · ' + label('service', r.service).toLowerCase() + '</small></span>' +
      (reg ? '<span class="rg">' + reg + '</span>' : '<span class="rg gapv" title="Where is not recorded. ' + k.keeper + ' can fill it.">where?</span>') +
      (d === '' ? '<span class="dt na">no key date</span>' : d ? '<span class="dt">' + d + '</span>' : '<span class="dt gapv" title="' + k.date + ' is not recorded. ' + k.keeper + ' can fill it.">' + k.date + '?</span>') +
      (r.missing.length ? '<span class="ms" title="Missing: ' + r.missing.join(', ') + '">' + r.missing.length + ' gap' + (r.missing.length > 1 ? 's' : '') + '</span>' : '<span class="ms ok"></span>') + '</li>';
  }
  function reasons(list) {
    return list.map(x => '<div class="why w-' + x.type + '"><span class="wi">' + Icons.svg(x.icon, { size: 16 }) + '</span><div><b>' + esc(x.head) + '</b><span>' + esc(x.text) + '</span></div></div>').join('');
  }
  const elsewhereTotal = () => recs.filter(r => r.reach).length;
  const triageTotal = () => recs.filter(r => r.triage).length;
  return { pred, GAP, NA, KIND, FACET, recs, val, visible, matches, results, counts, pick, leaves, size, label, things, describe, phrase, why, recover, ms, reduced, wait, esc, row, reasons, cap, join, fmtDate, clone, elsewhereTotal, triageTotal };
})();

/* the app frame shared by every variant: Data Atlas on a Department floor */
function frame(active) {
  const nav = [['compass', 'What we keep', 0], ['list-filter', 'Find', 1], ['inbox', 'Triage', 0, F.triageTotal()], ['pencil-line', 'Studio', 0, null, true]];
  return '<nav class="rail" aria-label="Data Atlas"><div class="an">' + DATA.app + '</div>' +
    nav.map(n => '<a class="nav' + (n[2] ? ' on' : '') + (n[4] ? ' off' : '') + '" href="#" ' + (n[4] ? 'aria-disabled="true" title="Admins change the kinds of thing here. Ask your floor admin."' : '') + '>' + Icons.svg(n[0], { size: 16 }) + '<span>' + n[1] + '</span>' + (n[3] != null ? '<span class="n">' + n[3] + '</span>' : '') + (n[4] ? '<span class="n">' + Icons.svg('lock', { size: 12 }) + '</span>' : '') + '</a>').join('') +
    '<div class="foot"><span class="fl"></span><b>' + DATA.floor.name + '</b><br>' + DATA.floor.short + ' floor: what is kept here and above. ' + F.elsewhereTotal() + ' kept below are counted, locked.</div></nav>';
}
function keys(list) { return '<div class="keys" aria-hidden="true">' + list.map(k => '<span><span class="kbd">' + k[0] + '</span> ' + k[1] + '</span>').join('') + '</div>'; }

const app = document.getElementById('app');
let sel = {}, hist = [], hot = null; const total = F.results({}).length;
app.innerHTML = frame() + '<main class="main"><div class="head"><div><div class="eyebrow">' + DATA.app + ' · ' + DATA.floor.name + '</div><h1>Find</h1><div class="sub">Answer any of the five questions, in any order. Each number says <b>what picking it would leave</b>, before you pick.</div></div><button class="btn" id="tbtn">' + Icons.svg('code', { size: 16 }) + 'Technical names <span class="kbd">T</span></button></div><div class="axes" id="axes"></div><div class="lower"><section class="rs"><div class="sum" id="sum"></div><div class="sc"><ul class="list" id="list"></ul></div></section><aside class="side" id="side" aria-live="polite"></aside></div></main>' +
  keys([['click', 'pick or unpick'], ['⌫', 'undo last'], ['esc', 'clear'], ['T', 'technical names'], ['R', 'replay']]);
const all = {}; DATA.facets.forEach(f => all[f.id] = F.counts(f.id, {}));
function render() {
  const ax = document.getElementById('axes');
  ax.innerHTML = DATA.facets.map(f => {
    const c = F.counts(f.id, sel), base = all[f.id];
    const max = Math.max(1, ...Object.values(base));
    const s = sel[f.id] || new Set();
    const vals = f.values.map(v => ({ id: v.id, label: v.label })).concat(base[F.GAP] ? [{ id: F.GAP, label: 'Not recorded' }] : []);
    let h = '<div class="ax"><h2><span class="pm" title="' + f.pm + '">' + f.pmest + '</span>' + f.plain + '</h2><div class="q">' + f.q + '?<span class="tech">' + f.pm + ' · ' + f.tech + '</span></div>';
    vals.forEach(v => {
      const n = c[v.id], on = s.has(v.id), z = !n && !on;
      const lv = on ? null : F.leaves(sel, f.id, v.id);
      h += '<button class="v' + (z ? ' zero' : '') + (v.id === F.GAP ? ' gap' : '') + (hot && hot.f === f.id && hot.v === v.id ? ' hot' : '') + '" data-f="' + f.id + '" data-v="' + v.id + '" aria-pressed="' + on + '"><span class="ghost" style="width:' + (base[v.id] / max * 100) + '%"></span><span class="bar" style="width:' + (n / max * 100) + '%"></span><span class="l">' + v.label + '</span><span class="c">' + (lv != null && F.size(sel) && !z ? '<span class="pv">→' + lv + ' </span>' : '') + n + '</span></button>';
    });
    if (c[F.NA]) h += '<div class="v na" title="These have no ' + f.plain.toLowerCase() + ' detail in this deployment"><span class="l">' + F.cap(F.join([...new Set(F.results(sel).filter(r => F.val(r, f.id) === F.NA).map(r => F.KIND[r.kind].many))])) + '</span><span class="c">' + c[F.NA] + ' n/a</span></div>';
    return h + '</div>';
  }).join('');
  const res = F.results(sel), d = F.describe(sel);
  document.getElementById('sum').innerHTML = '<span class="n mono">' + res.length + '</span><span class="t">' + F.esc(F.size(sel) ? F.cap(d.text) : 'Everything you can see') + ' <small>of ' + total + ' kept here</small></span>';
  const L = document.getElementById('list');
  if (res.length) L.innerHTML = res.slice(0, 60).map(F.row).join('');
  else { const b = F.recover(sel); L.innerHTML = '<li class="empty">' + F.reasons([{ type: 'none', icon: 'search-x', head: 'Nothing matches all of these together', text: b ? 'Undo “' + F.label(b.fid, b.vid) + '” and ' + b.n + ' come back.' : '' }]) + '</li>'; }
  side();
}
function side() {
  const S = document.getElementById('side');
  let h = '';
  if (hot) {
    const f = F.FACET[hot.f], n = F.counts(hot.f, sel)[hot.v], on = (sel[hot.f] || new Set()).has(hot.v);
    h += '<div class="eyebrow">' + f.plain + ' · ' + F.label(hot.f, hot.v) + '</div>';
    if (on) h += '<h3>Chosen</h3><p>Unpick it to get back <b>' + (F.results(F.pick(sel, hot.f, hot.v)).length - F.results(sel).length) + '</b>.</p>';
    else if (n) h += '<h3>Would leave ' + F.leaves(sel, hot.f, hot.v) + '</h3><p>Of the <b>' + F.results(sel).length + '</b> showing now. Picked with others in the same column, it widens instead of narrowing.</p>';
    else h += '<h3>Would leave none</h3>' + F.reasons(F.why(sel, hot.f, hot.v));
  } else h += '<div class="eyebrow">How to read it</div><h3>Point at any answer</h3><p>The number beside it is what you would see if you picked it. A faint line shows how many are kept in all.</p>';
  h += '<div class="legend"><span><i class="mk gap"></i>Not recorded yet</span><span><i class="mk na"></i>Does not apply</span><span>' + Icons.svg('lock', { size: 14 }) + 'Kept out of reach</span><span>' + Icons.svg('inbox', { size: 14 }) + 'Waiting in Triage</span></div>';
  S.innerHTML = h;
}
function toggle(f, v) { hist.push(F.clone(sel)); sel = F.pick(sel, f, v); render(); }
app.addEventListener('click', e => { const b = e.target.closest('.v[data-f]'); if (!b) return; hot = { f: b.dataset.f, v: b.dataset.v }; if (b.classList.contains('zero')) { render(); return; } toggle(b.dataset.f, b.dataset.v); });
app.addEventListener('mouseover', e => { const b = e.target.closest('.v[data-f]'); if (!b) return; const h = { f: b.dataset.f, v: b.dataset.v }; if (!hot || hot.f !== h.f || hot.v !== h.v) { hot = h; document.querySelectorAll('.v.hot').forEach(x => x.classList.remove('hot')); b.classList.add('hot'); side(); } });
app.addEventListener('focusin', e => { const b = e.target.closest('.v[data-f]'); if (b) { hot = { f: b.dataset.f, v: b.dataset.v }; side(); } });
document.getElementById('tbtn').onclick = () => document.body.classList.toggle('admin-off');
let run = 0;
async function demo() {
  const me = ++run; sel = {}; hist = []; hot = null; render();
  await F.wait(F.ms('--motion-run'));
  const step = F.ms('--motion-calm') * .75;
  for (const [f, v] of [['kind', 'contract'], ['service', 'roads'], ['region', 'coast']]) {
    if (me !== run) return; hot = { f, v }; render(); await F.wait(step / 2); if (me !== run) return; toggle(f, v); await F.wait(step / 2);
  }
  if (me !== run) return; hot = { f: 'when', v: 'this' }; render();
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') demo();
  else if (e.key === 't' || e.key === 'T') document.body.classList.toggle('admin-off');
  else if (e.key === 'Backspace' && hist.length) { sel = hist.pop(); render(); }
  else if (e.key === 'Escape') { if (F.size(sel)) hist.push(F.clone(sel)); sel = {}; hot = null; render(); }
});
demo();
</script>
