      const w = join(ls.map(x => x.toLowerCase()));
      return ks && ks.verb ? 'that ' + ks.verb + ' ' + w : 'with a key date ' + w;
    }
    return '';
  }
  /* the choice as a verb phrase: 'end this year', 'are in the Coast' */
  function pred(sel, fid, vid) {
    const l = label(fid, vid);
    if (vid === GAP) return 'are missing it';
    if (fid === 'kind') return 'are ' + l.toLowerCase();
    if (fid === 'service') return 'are about ' + l.toLowerCase();
    if (fid === 'state') return 'are ' + l.toLowerCase();
    if (fid === 'region') return 'are in the ' + l;
    const ks = sel.kind && sel.kind.size === 1 ? KIND[[...sel.kind][0]] : null;
    return ks && ks.verb ? ks.verb + ' ' + l.toLowerCase() : 'have a key date ' + l.toLowerCase();
  }
  function describe(sel) {
    const n = results(sel).length;
    const parts = ['service', 'region', 'state', 'when'].map(f => phrase(sel, f)).filter(Boolean);
    return { n, text: [things(sel, n)].concat(parts).join(' ') };
  }
  /* Why is this empty? Every zero gets a reason, never a blank. */
  function why(sel, fid, vid) {
    const base = recs.filter(r => visible(r) && matches(r, sel, fid));
    const app = base.filter(r => val(r, fid) !== NA);
    const want = pick(sel, fid, vid, 'only');
    const reach = recs.filter(r => r.reach && !r.triage && matches(r, want));
    const tri = recs.filter(r => r.triage && matches(r, want));
    const out = [];
    const T = things(sel, 2);
    if (!base.length) out.push({ type: 'before', icon: 'list-filter', head: 'Your other choices leave nothing', text: 'Nothing is left before this choice. Undo a choice to see more.' });
    else if (!app.length) {
      const has = DATA.kinds.filter(k => fid !== 'when' || k.date).map(k => k.many);
      out.push({ type: 'na', icon: 'ban', head: 'Does not apply', text: cap(T) + ' have no ' + (FACET[fid].plain.toLowerCase()) + ' detail here. Only ' + join(has, 'and') + ' do.' });
    }
    const gaps = app.filter(r => val(r, fid) === GAP);
    if (reach.length) {
      const by = {}; reach.forEach(r => (by[r.reach] = by[r.reach] || []).push(r));
      Object.keys(by).forEach(k => { const fl = DATA.elsewhere[k]; out.push({ type: 'reach', icon: 'lock', head: by[k].length + ' kept on ' + fl.name, text: 'A ' + fl.type + ' floor below yours: you can’t open ' + (by[k].length === 1 ? 'it' : 'them') + ' from here. Ask ' + fl.ask + '.', n: by[k].length }); });
    }
    if (tri.length) out.push({ type: 'triage', icon: 'inbox', head: tri.length + ' waiting in Triage', text: 'Proposed by a source, not accepted yet. ' + (tri.length === 1 ? 'It counts' : 'They count') + ' once someone accepts ' + (tri.length === 1 ? 'it' : 'them') + '.', n: tri.length });
    if (gaps.length) { const ks = kindsIn(gaps); out.push({ type: 'gap', icon: 'circle-dashed', head: gaps.length + ' with no ' + FACET[fid].plain.toLowerCase() + ' recorded', text: 'Any of them could be ' + label(fid, vid).toLowerCase() + '. ' + join(ks.map(k => k.keeper), 'or') + ' can fill ' + (gaps.length === 1 ? 'it' : 'them') + ' in.', n: gaps.length }); }
    if (base.length && app.length) {
      const c = counts(fid, sel); const near = FACET[fid].values.filter(v => v.id !== vid && c[v.id]).map(v => label(fid, v.id).toLowerCase() + ' ' + c[v.id]);
      out.unshift({ type: 'none', icon: 'search-x', head: 'None, checked ' + app.length + ' ' + things(sel, app.length), text: 'No ' + T + ' ' + pred(sel, fid, vid) + '.' + (near.length ? ' Nearest: ' + near.slice(0, 3).join(', ') + '.' : '') });
    }
    return out;
  }
  /* the whole result is empty: which single choice to undo gives most back */
  function recover(sel) {
    let best = null;
    for (const fid in sel) for (const vid of sel[fid] || []) {
      const s = pick(sel, fid, vid, 'add'); const n = results(s).length;
      if (!best || n > best.n) best = { fid, vid, n };
    }
    return best;
  }
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
  const css = getComputedStyle(document.documentElement);
  const ms = name => parseFloat(css.getPropertyValue(name)) || 0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = t => new Promise(r => setTimeout(r, reduced ? 1 : t));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function fmtDate(r) { const k = KIND[r.kind]; if (!k.date) return ''; if (!r.date) return null; const [y, m] = r.date.split('-'); return k.date + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m - 1] + ' ' + y; }
  /* one result row: kind, name, where, key date; gaps drawn as gaps */
  function row(r) {
    const k = KIND[r.kind]; const d = fmtDate(r);
    const reg = r.region ? label('region', r.region) : null;
    return '<li class="res"><span class="ki">' + Icons.svg(k.icon, { size: 16 }) + '</span><span class="nm">' + esc(r.name) + '<small>' + k.one + ' · ' + label('service', r.service).toLowerCase() + '</small></span>' +
      (reg ? '<span class="rg">' + reg + '</span>' : '<span class="rg gapv" title="Where is not recorded. ' + k.keeper + ' can fill it.">where?</span>') +
      (d === '' ? '<span class="dt na">no key date</span>' : d ? '<span class="dt">' + d + '</span>' : '<span class="dt gapv" title="' + k.date + ' is not recorded. ' + k.keeper + ' can fill it.">' + k.date + '?</span>') +
      (r.missing.length ? '<span class="ms" title="Missing: ' + r.missing.join(', ') + '">' + r.missing.length + ' gap' + (r.missing.length > 1 ? 's' : '') + '</span>' : '<span class="ms ok"></span>') + '</li>';
  }
  function reasons(list) {
    return list.map(x => '<div class="why w-' + x.type + '"><span class="wi">' + Icons.svg(x.icon, { size: 16 }) + '</span><div><b>' + esc(x.head) + '</b><span>' + esc(x.text) + '</span></div></div>').join('');
  }
  const elsewhereTotal = () => recs.filter(r => r.reach).length;
  const triageTotal = () => recs.filter(r => r.triage).length;
  return { pred, GAP, NA, KIND, FACET, recs, val, visible, matches, results, counts, pick, leaves, size, label, things, describe, phrase, why, recover, ms, reduced, wait, esc, row, reasons, cap, join, fmtDate, clone, elsewhereTotal, triageTotal };
})();

/* the app frame shared by every variant: Data Atlas on a Department floor */
function frame(active) {
  const nav = [['compass', 'What we keep', 0], ['list-filter', 'Find', 1], ['inbox', 'Triage', 0, F.triageTotal()], ['pencil-line', 'Studio', 0, null, true]];
  return '<nav class="rail" aria-label="Data Atlas"><div class="an">' + DATA.app + '</div>' +
    nav.map(n => '<a class="nav' + (n[2] ? ' on' : '') + (n[4] ? ' off' : '') + '" href="#" ' + (n[4] ? 'aria-disabled="true" title="Admins change the kinds of thing here. Ask your floor admin."' : '') + '>' + Icons.svg(n[0], { size: 16 }) + '<span>' + n[1] + '</span>' + (n[3] != null ? '<span class="n">' + n[3] + '</span>' : '') + (n[4] ? '<span class="n">' + Icons.svg('lock', { size: 12 }) + '</span>' : '') + '</a>').join('') +
    '<div class="foot"><span class="fl"></span><b>' + DATA.floor.name + '</b><br>' + DATA.floor.short + ' floor: what is kept here and above. ' + F.elsewhereTotal() + ' kept below are counted, locked.</div></nav>';
}
function keys(list) { return '<div class="keys" aria-hidden="true">' + list.map(k => '<span><span class="kbd">' + k[0] + '</span> ' + k[1] + '</span>').join('') + '</div>'; }

const app = document.getElementById('app');
let drawer = null, by = 'when', guide = null, clips = {}, cardId = null;
const SYM = { kind: '', service: ';', state: ':', region: '.', when: "'" };
app.innerHTML = frame() + '<main class="main"><div class="head"><div><div class="eyebrow">' + DATA.app + ' · ' + DATA.floor.name + '</div><h1>The card drawers</h1><div class="sub">One drawer for each kind of thing. <b>Guide cards</b> divide a drawer; <b>clips</b> hold back cards you don’t want. Every count says how many cards are behind it before you look.</div></div><button class="btn" id="tbtn">' + Icons.svg('code', { size: 16 }) + 'Technical names <span class="kbd">T</span></button></div><div class="body"><div class="cab" id="cab"></div><div class="open" id="open"></div><div class="card-col" id="cardcol"></div></div></main>' +
  keys([['1-6', 'pull a drawer'], ['← →', 'guide cards'], ['↑ ↓', 'cards'], ['esc', 'push back'], ['T', 'technical names'], ['R', 'replay']]);
function selFor(extra) { const s = {}; for (const k in clips) if (clips[k]) s[k] = new Set([clips[k]]); if (drawer) s.kind = new Set([drawer]); return Object.assign(s, extra || {}); }
function code(r) {
  const k = F.KIND[r.kind]; const y = r.date ? r.date.slice(2, 4) : '__';
  return k.one.slice(0, 3).toUpperCase() + SYM.service + r.service.slice(0, 2).toUpperCase() + SYM.state + r.state.slice(0, 3).toUpperCase() + SYM.region + (r.region ? r.region.slice(0, 3).toUpperCase() : '___') + (k.date ? SYM.when + y : '');
}
function render() {
  const cs = {}; for (const k in clips) if (clips[k]) cs[k] = new Set([clips[k]]);
  const kc = F.counts('kind', cs);
  document.getElementById('cab').innerHTML = '<div class="eyebrow">Cabinet · ' + F.results(cs).length + ' cards</div>' + DATA.kinds.map((k, i) => {
    const n = kc[k.id], away = F.recs.filter(r => r.reach && r.kind === k.id && F.matches(r, cs, 'kind')).length;
    return '<button class="dr' + (!n ? ' zero' : '') + '" data-k="' + k.id + '" aria-pressed="' + (drawer === k.id) + '" title="' + (n ? '' : 'Empty with these clips: ' + F.why(cs, 'kind', k.id).map(x => x.head).join('; ')) + '"><span class="hd"></span><span class="lb"><b>' + F.cap(k.many) + '</b><small>' + (k.date ? 'by ' + k.date : 'no key date') + (away ? '<span class="away"> \u00b7 ' + Icons.svg('lock', { size: 10 }) + ' ' + away + ' below</span>' : '') + '<span class="tech"> · ' + k.tech + '</span></small></span><span class="n">' + n + '</span></button>';
  }).join('');
  const O = document.getElementById('open');
  if (!drawer) { O.innerHTML = '<div class="box-top"><h2>Pick a drawer</h2><span>Counts on the fronts say how many cards each holds now.</span></div><div class="box shut"></div>'; document.getElementById('cardcol').innerHTML = ''; return; }
  const K = F.KIND[drawer];
  const others = DATA.facets.filter(f => f.id !== 'kind' && f.id !== by && !(f.id === 'when' && !K.date));
  let h = '<div class="clips">' + Icons.svg('paperclip', { size: 16 }) + '<span>Clips</span>' + others.map(f => {
    const c = F.counts(f.id, selFor());
    return '<label class="clip' + (clips[f.id] ? ' on' : '') + '">' + f.plain + '<select data-clip="' + f.id + '"><option value="">any</option>' + f.values.concat(c[F.GAP] ? [{ id: F.GAP, label: 'Not recorded' }] : []).map(v => '<option value="' + v.id + '"' + (clips[f.id] === v.id ? ' selected' : '') + '>' + v.label + ' · ' + (c[v.id] || 'none, see why') + '</option>').join('') + '</select></label>';
  }).join('') + '</div>';
  const S = selFor(), c = F.counts(by, S), all = F.results(S);
  const fb = F.FACET[by];
  const vals = fb.values.concat(c[F.GAP] ? [{ id: F.GAP, label: 'Not recorded' }] : []);
  h += '<div class="box-top"><h2>' + F.cap(K.many) + '</h2><span>' + all.length + ' cards' + (F.size(Object.fromEntries(Object.entries(S).filter(([k]) => k !== 'kind'))) ? ', clipped: ' + F.esc(F.describe(S).text) : '') + '</span></div><div class="box" id="box"><label class="by">Guide cards by <select id="by">' + DATA.facets.filter(f => f.id !== 'kind' && !(f.id === 'when' && !K.date)).map(f => '<option value="' + f.id + '"' + (f.id === by ? ' selected' : '') + '>' + f.plain.toLowerCase() + (f.id === 'when' ? ' (' + K.date + ')' : '') + '</option>').join('') + '</select></label>';
  vals.forEach(v => {
    const n = c[v.id] || 0, on = guide === v.id;
    h += '<button class="gd' + (v.id === F.GAP ? ' gap' : '') + (!n ? ' zero' : '') + '" data-g="' + v.id + '" aria-pressed="' + on + '"><span class="tab">' + v.label + '<b>' + n + '</b></span><span class="pl">';
    if (n) { const rs = F.results(F.pick(S, by, v.id, 'only')); rs.slice(0, 14).forEach((r, i) => h += '<span class="e" style="animation-delay:calc(var(--motion-instant) * ' + i / 2 + ')">' + F.esc(r.name) + '</span>'); if (n > 14) h += '<span class="more">+' + (n - 14) + ' more</span>'; if (v.id === F.GAP) h += '<span class="note">' + K.keeper + ' can fill these in</span>'; }
    else h += '<span class="note">' + F.reasons(F.why(S, by, v.id).slice(0, 2)) + '</span>';
    h += '</span></button>';
  });
  O.innerHTML = h + '</div>';
  // the card in hand
  const C = document.getElementById('cardcol');
  const behind = guide != null ? F.results(F.pick(S, by, guide, 'only')) : [];
  if (!behind.length) { C.innerHTML = '<div class="eyebrow">Card in hand</div><p class="sub" style="color:var(--ink-muted);font-size:var(--type-meta)">Lift a guide card to read the cards behind it.</p>'; return; }
  const r = behind.find(x => x.id === cardId) || behind[0]; cardId = r.id;
  const d = F.fmtDate(r);
  const line = (t, v, gap) => '<dt>' + t + '</dt><dd' + (gap ? ' class="g" title="' + K.keeper + ' can fill it"' : '') + '>' + v + '</dd>';
  C.innerHTML = '<div class="eyebrow">Card in hand · ' + F.label(by, guide) + '</div><div class="cc"><span class="mark" title="Shelf mark: kind, about, status, where, when">' + code(r) + '<span class="tech"> colon notation (PMEST)</span></span><h3>' + F.esc(r.name) + '</h3><dl>' +
    line('about', F.label('service', r.service)) + line('status', F.label('state', r.state)) + line('where', r.region ? F.label('region', r.region) : 'not recorded · ' + K.keeper, !r.region) + (K.date ? line(K.date, d ? d.replace(K.date + ' ', '') : 'not recorded · ' + K.keeper, !d) : '') +
    r.missing.filter(m => !['region', K.date].includes(m)).slice(0, 2).map(m => line(m, 'not recorded · ' + K.keeper, true)).join('') +
    '</dl><div class="tr">used by ' + r.intents + ' intent' + (r.intents === 1 ? '' : 's') + ' · ' + r.docs + ' document' + (r.docs === 1 ? '' : 's') + '</div></div><div class="eyebrow">Behind it · ' + behind.length + '</div><ul class="behind">' + behind.map(x => '<li><button data-c="' + x.id + '" aria-current="' + (x.id === r.id) + '"><span>' + F.esc(x.name) + '</span><span>' + code(x) + '</span></button></li>').join('') + '</ul>';
}
app.addEventListener('click', e => {
  const d = e.target.closest('.dr'); if (d) { drawer = drawer === d.dataset.k ? null : d.dataset.k; guide = null; clips = {}; if (!F.KIND[drawer || 'site'].date && by === 'when') by = 'region'; render(); return; }
  const g = e.target.closest('.gd'); if (g) { guide = g.dataset.g; cardId = null; render(); return; }
  const c = e.target.closest('[data-c]'); if (c) { cardId = +c.dataset.c; render(); }
});
app.addEventListener('change', e => {
  if (e.target.id === 'by') { by = e.target.value; guide = null; delete clips[by]; render(); }
  if (e.target.dataset.clip) { clips[e.target.dataset.clip] = e.target.value || null; render(); }
});
document.getElementById('tbtn').onclick = () => document.body.classList.toggle('admin-off');
let run = 0;
async function demo() {
  const me = ++run; drawer = null; guide = null; clips = {}; by = 'when'; render();
  await F.wait(F.ms('--motion-run'));
  if (me !== run) return; drawer = 'contract'; render();
  const box = document.getElementById('box'); box.classList.add('shut'); requestAnimationFrame(() => requestAnimationFrame(() => box.classList.remove('shut')));
  await F.wait(F.ms('--motion-calm') * 1.5); if (me !== run) return;
  clips.region = 'north'; render();
  await F.wait(F.ms('--motion-calm')); if (me !== run) return;
  guide = 'this'; render();
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'r' || e.key === 'R') demo();
  else if (e.key === 't' || e.key === 'T') document.body.classList.toggle('admin-off');
  else if (/^[1-9]$/.test(e.key) && DATA.kinds[+e.key - 1]) { drawer = DATA.kinds[+e.key - 1].id; guide = null; clips = {}; if (!F.KIND[drawer].date && by === 'when') by = 'region'; render(); }
  else if (e.key === 'Escape') { drawer = null; render(); }
  else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && drawer) { const vs = [...document.querySelectorAll('.gd')].map(x => x.dataset.g); let i = vs.indexOf(guide); i = e.key === 'ArrowRight' ? Math.min(vs.length - 1, i + 1) : Math.max(0, i - 1); guide = vs[i]; cardId = null; render(); }
  else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && guide != null) { const ids = [...document.querySelectorAll('[data-c]')].map(x => +x.dataset.c); let i = ids.indexOf(cardId); i = e.key === 'ArrowDown' ? Math.min(ids.length - 1, i + 1) : Math.max(0, i - 1); cardId = ids[i]; render(); e.preventDefault(); }
});
demo();
</script>
