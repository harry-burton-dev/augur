/* the app frame shared by every variant: Data Atlas on a Department floor */
function frame(active) {
  const nav = [['compass', 'What we keep', 0], ['list-filter', 'Find', 1], ['inbox', 'Triage', 0, F.triageTotal()], ['pencil-line', 'Studio', 0, null, true]];
  return '<nav class="rail" aria-label="Data Atlas"><div class="an">' + DATA.app + '</div>' +
    nav.map(n => '<a class="nav' + (n[2] ? ' on' : '') + (n[4] ? ' off' : '') + '" href="#" ' + (n[4] ? 'aria-disabled="true" title="Admins change the kinds of thing here. Ask your floor admin."' : '') + '>' + Icons.svg(n[0], { size: 16 }) + '<span>' + n[1] + '</span>' + (n[3] != null ? '<span class="n">' + n[3] + '</span>' : '') + (n[4] ? '<span class="n">' + Icons.svg('lock', { size: 12 }) + '</span>' : '') + '</a>').join('') +
    '<div class="foot"><span class="fl"></span><b>' + DATA.floor.name + '</b><br>' + DATA.floor.short + ' floor: what is kept here and above. ' + F.elsewhereTotal() + ' kept below are counted, locked.</div></nav>';
}
function keys(list) { return '<div class="keys" aria-hidden="true">' + list.map(k => '<span><span class="kbd">' + k[0] + '</span> ' + k[1] + '</span>').join('') + '</div>'; }

const app = document.getElementById('app');
let rows = 'kind', cols = 'when', flt = {}, cell = null;
app.innerHTML = frame() + '<main class="main"><div class="head"><div><div class="eyebrow">' + DATA.app + ' · ' + DATA.floor.name + '</div><h1>Facet map</h1><div class="sub">Two questions crossed. Each square is what both answers leave. <b>An empty square is never blank:</b> it says which kind of empty it is.</div></div><button class="btn" id="tbtn">' + Icons.svg('code', { size: 16 }) + 'Technical names <span class="kbd">T</span></button></div><div class="ctl" id="ctl"></div><div class="body"><div class="map" id="map"></div><aside class="side" id="side" aria-live="polite"></aside></div></main>' +
  keys([['click', 'a square'], ['←↑→↓', 'move'], ['X', 'swap axes'], ['esc', 'clear'], ['T', 'technical names'], ['R', 'replay']]);
function sel() { const s = {}; for (const k in flt) if (flt[k]) s[k] = new Set([flt[k]]); return s; }
function vals(fid) { const c = F.counts(fid, {}); return F.FACET[fid].values.concat(c[F.GAP] ? [{ id: F.GAP, label: 'Not recorded' }] : []); }
function ctl() {
  const opt = (cur, skip) => DATA.facets.filter(f => f.id !== skip).map(f => '<option value="' + f.id + '"' + (f.id === cur ? ' selected' : '') + '>' + f.plain + '</option>').join('');
  const rest = DATA.facets.filter(f => f.id !== rows && f.id !== cols);
  document.getElementById('ctl').innerHTML = '<span>Rows</span><select id="rows" aria-label="Rows">' + opt(rows, cols) + '</select><span>across</span><select id="cols" aria-label="Columns">' + opt(cols, rows) + '</select><button class="btn" id="swap">' + Icons.svg('arrow-left-right', { size: 14 }) + '<span class="kbd">X</span></button><span class="sep"></span><span>only</span>' +
    rest.map(f => { const c = F.counts(f.id, sel()); return '<label class="flt' + (flt[f.id] ? ' on' : '') + '"><select data-flt="' + f.id + '" aria-label="' + f.plain + '"><option value="">' + f.plain.toLowerCase() + ': any</option>' + vals(f.id).map(v => '<option value="' + v.id + '"' + (flt[f.id] === v.id ? ' selected' : '') + '>' + f.plain.toLowerCase() + ': ' + v.label + ' · ' + (c[v.id] || 'none') + '</option>').join('') + '</select></label>'; }).join('');
}
function cellSel(r, c) { return F.pick(F.pick(sel(), rows, r, 'only'), cols, c, 'only'); }
function kindOf(list) { const t = list[0] ? list[0].type : 'none'; return t; }
function render() {
  ctl();
  const S = sel(), R = vals(rows), C = vals(cols);
  const M = document.getElementById('map');
  M.style.gridTemplateColumns = 'calc(var(--measure-rail) * .75) repeat(' + C.length + ', minmax(0,1fr))';
  const grid = R.map(r => C.map(c => F.results(cellSel(r.id, c.id)).length));
  const mx = Math.max(1, ...grid.flat());
  const colT = C.map(c => F.leaves(S, cols, c.id, 'only')), rowT = R.map(r => F.leaves(S, rows, r.id, 'only'));
  let h = '<div class="mh"><span class="tech">' + F.FACET[rows].pm + ' × ' + F.FACET[cols].pm + '</span></div>' + C.map((c, j) => '<button class="mh col' + (c.id === F.GAP ? ' gaph' : '') + '" data-col="' + c.id + '" title="Pick ' + c.label + ': leaves ' + colT[j] + '">' + c.label + '<span class="t">' + colT[j] + '</span></button>').join('');
  R.forEach((r, i) => {
    const K = rows === 'kind' ? F.KIND[r.id] : null;
    h += '<button class="mh row' + (r.id === F.GAP ? ' gaph' : '') + '" data-row="' + r.id + '" title="Pick ' + r.label + ': leaves ' + rowT[i] + '">' + (K ? Icons.svg(K.icon, { size: 16 }) : '') + '<span>' + r.label + '</span><span class="t">' + rowT[i] + '</span></button>';
    C.forEach((c, j) => {
      const n = grid[i][j], on = cell && cell.r === r.id && cell.c === c.id;
      const gc = c.id === F.GAP || r.id === F.GAP;
      if (n) { const side = Math.sqrt(n / mx) * 100; h += '<button class="cell' + (gc ? ' gapcol' : '') + '" data-r="' + r.id + '" data-c="' + c.id + '" aria-pressed="' + on + '" aria-label="' + r.label + ', ' + c.label + ': ' + n + '"><span class="sq" style="width:calc(' + side + '% - var(--space-2));height:calc(' + side + '% - var(--space-2))"></span><span class="n">' + n + '</span></button>'; return; }
      const why = F.why(F.pick(sel(), rows, r.id, 'only'), cols, c.id);
      const na = why.find(x => x.type === 'na') || (cols === 'when' && K && !K.date ? { type: 'na' } : null);
      const reach = why.filter(x => x.type === 'reach').reduce((a, x) => a + x.n, 0), tri = why.find(x => x.type === 'triage');
      let cls, txt;
      if (na) { cls = 'e-na'; txt = 'n/a'; }
      else if (reach) { cls = 'e-reach'; txt = Icons.svg('lock', { size: 14 }) + reach + ' below'; }
      else if (tri) { cls = 'e-triage'; txt = Icons.svg('inbox', { size: 14 }) + tri.n + ' waiting'; }
      else if (gc) { cls = 'e-gapcol'; txt = 'none'; }
      else { cls = 'e-none'; txt = 'none'; }
      h += '<button class="cell e ' + cls + '" data-r="' + r.id + '" data-c="' + c.id + '" aria-pressed="' + on + '" aria-label="' + r.label + ', ' + c.label + ': empty">' + txt + '</button>';
    });
  });

}
function side() {
  const S = document.getElementById('side'); let h = '';
  if (cell) {
    const s = cellSel(cell.r, cell.c), res = F.results(s), d = F.describe(s);
    h += '<div class="eyebrow">' + F.label(rows, cell.r) + ' × ' + F.label(cols, cell.c) + '</div><h3>' + (res.length ? res.length + ' ' : 'No ') + F.esc(d.text) + '</h3>';
    if (res.length) h += '<div class="sc"><ul class="list">' + res.map(F.row).join('') + '</ul></div>';
    else h += '<div class="sc">' + F.reasons(F.why(F.pick(sel(), rows, cell.r, 'only'), cols, cell.c)) + '</div>';
  } else h += '<div class="eyebrow">Reading the map</div><h3>Point at a square</h3><p>Its size is how many things both answers leave. Headings show what picking that answer alone would leave; click one to keep only it.</p>';
  h += '<div class="key"><span><i class="c none"></i>none: checked, nothing there</span><span><i class="c na"></i>n/a: that kind has no such detail</span><span><i class="c gap"></i>not recorded yet</span><span><i class="c reach"></i>kept on a floor below</span><span><i class="c triage"></i>waiting in Triage</span></div>';
  S.innerHTML = h;
}
app.addEventListener('click', e => {
  const c = e.target.closest('.cell'); if (c) { cell = cell && cell.r === c.dataset.r && cell.c === c.dataset.c ? null : { r: c.dataset.r, c: c.dataset.c }; render(); return; }
  const hr = e.target.closest('[data-row]'); if (hr) { const f = rows; const rest = DATA.facets.find(x => x.id !== rows && x.id !== cols && !flt[x.id]); flt[f] = hr.dataset.row; rows = rest ? rest.id : rows; cell = null; render(); return; }
  const hc = e.target.closest('[data-col]'); if (hc) { const f = cols; const rest = DATA.facets.find(x => x.id !== rows && x.id !== cols && !flt[x.id]); flt[f] = hc.dataset.col; cols = rest ? rest.id : cols; cell = null; render(); return; }
  if (e.target.closest('#swap')) { [rows, cols] = [cols, rows]; cell = null; render(); }
});
app.addEventListener('change', e => {
  if (e.target.id === 'rows') { rows = e.target.value; delete flt[rows]; cell = null; render(); }
  if (e.target.id === 'cols') { cols = e.target.value; delete flt[cols]; cell = null; render(); }
  if (e.target.dataset.flt) { flt[e.target.dataset.flt] = e.target.value || null; cell = null; render(); }
});
document.getElementById('tbtn').onclick = () => document.body.classList.toggle('admin-off');
let run = 0;
async function demo() {
  const me = ++run; rows = 'kind'; cols = 'when'; flt = {}; cell = null; render();
  await F.wait(F.ms('--motion-run')); if (me !== run) return;
  flt.region = 'coast'; render();
  await F.wait(F.ms('--motion-calm')); if (me !== run) return;
  const target = document.querySelector('.cell.e-reach') || document.querySelector('.cell.e-triage') || document.querySelector('.cell.e-none');
  if (target) { cell = { r: target.dataset.r, c: target.dataset.c }; render(); }
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'r' || e.key === 'R') demo();
  else if (e.key === 't' || e.key === 'T') document.body.classList.toggle('admin-off');
  else if (e.key === 'x' || e.key === 'X') { [rows, cols] = [cols, rows]; cell = null; render(); }
  else if (e.key === 'Escape') { flt = {}; cell = null; render(); }
  else if (e.key.startsWith('Arrow')) {
    const R = vals(rows).map(v => v.id), C = vals(cols).map(v => v.id);
    let i = cell ? R.indexOf(cell.r) : 0, j = cell ? C.indexOf(cell.c) : 0;
    if (cell) { if (e.key === 'ArrowUp') i = Math.max(0, i - 1); if (e.key === 'ArrowDown') i = Math.min(R.length - 1, i + 1); if (e.key === 'ArrowLeft') j = Math.max(0, j - 1); if (e.key === 'ArrowRight') j = Math.min(C.length - 1, j + 1); }
    cell = { r: R[i], c: C[j] }; render(); const el = document.querySelector('.cell[aria-pressed="true"]'); if (el) el.focus(); e.preventDefault();
  }
});
demo();
</script>
