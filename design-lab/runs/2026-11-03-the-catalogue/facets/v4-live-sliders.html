  G.style.left = pct(d, v) + '%'; G.querySelector('.lv').textContent = d.fmt(v) + ' → leaves ' + left({ date: rg }).length; G.classList.add('in');
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') demo();
  else if (e.key === 't' || e.key === 'T') document.body.classList.toggle('admin-off');
  else if (e.key === 'Escape') { S.date = [0, NM - 1]; S.fill = [0, 10]; S.use = [0, 12]; S.kinds = new Set(DATA.kinds.map(k => k.id)); render(); }

});
