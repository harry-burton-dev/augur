      (d === '' ? '<span class="dt na">no key date</span>' : d ? '<span class="dt">' + d + '</span>' : '<span class="dt gapv" title="' + k.date + ' is not recorded. ' + k.keeper + ' can fill it.">' + k.date + '?</span>') +
      (r.missing.length ? '<span class="ms" title="Missing: ' + r.missing.join(', ') + '">' + r.missing.length + ' gap' + (r.missing.length > 1 ? 's' : '') + '</span>' : '<span class="ms ok"></span>') + '</li>';
  }
  function reasons(list) {
    return list.map(x => '<div class="why w-' + x.type + '"><span class="wi">' + Icons.svg(x.icon, { size: 16 }) + '</span><div><b>' + esc(x.head) + '</b><span>' + esc(x.text) + '</span></div></div>').join('');
  }
  const elsewhereTotal = () => recs.filter(r => r.reach).length;
  const triageTotal = () => recs.filter(r => r.triage).length;
  return { pred, GAP, NA, KIND, FACET, recs, val, visible, matches, results, counts, pick, leaves, size, label, things, describe, phrase, why, recover, ms, reduced, wait, esc, row, reasons, cap, join, fmtDate, clone, elsewhereTotal, triageTotal };
})();

/* the app frame shared by every variant: Data Atlas on a Department floor */
function frame(active) {
  const nav = [['compass', 'What we keep', 0], ['list-filter', 'Find', 1], ['inbox', 'Triage', 0, F.triageTotal()], ['pencil-line', 'Studio', 0, null, true]];
  return '<nav class="rail" aria-label="Data Atlas"><div class="an">' + DATA.app + '</div>' +
    nav.map(n => '<a class="nav' + (n[2] ? ' on' : '') + (n[4] ? ' off' : '') + '" href="#" ' + (n[4] ? 'aria-disabled="true" title="Admins change the kinds of thing here. Ask your floor admin."' : '') + '>' + Icons.svg(n[0], { size: 16 }) + '<span>' + n[1] + '</span>' + (n[3] != null ? '<span class="n">' + n[3] + '</span>' : '') + (n[4] ? '<span class="n">' + Icons.svg('lock', { size: 12 }) + '</span>' : '') + '</a>').join('') +
    '<div class="foot"><span class="fl"></span><b>' + DATA.floor.name + '</b><br>' + DATA.floor.short + ' floor: what is kept here and above. ' + F.elsewhereTotal() + ' kept below are counted, locked.</div></nav>';
}
function keys(list) { return '<div class="keys" aria-hidden="true">' + list.map(k => '<span><span class="kbd">' + k[0] + '</span> ' + k[1] + '</span>').join('') + '</div>'; }

const app = document.getElementById('app');
let sel = {}, open = null, fresh = null, shown = 0;
const total = F.results({}).length;
app.innerHTML = frame() + '<main class="main"><div class="head"><div><div class="eyebrow">' + DATA.app + ' · ' + DATA.floor.name + '</div><h1>Ask</h1><div class="sub">Fill any blank. Every word you could put there shows <b>how many it would leave</b>; words that leave none say why.</div></div><button class="btn" id="tbtn">' + Icons.svg('code', { size: 16 }) + 'Technical names <span class="kbd">T</span></button></div><div class="q" id="q"></div><div class="answer" id="ans"></div><div class="res-wrap"><ul class="list" id="list"></ul></div></main>' +
  keys([['1-5', 'open a blank'], ['↑ ↓ ↵', 'choose'], ['⌫', 'empty a blank'], ['esc', 'close'], ['T', 'technical names'], ['R', 'replay']]);
const ORDER = ['kind', 'service', 'region', 'state', 'when'];
const ANY = { kind: 'everything', service: 'about any service', region: 'anywhere', state: 'in any state', when: 'at any time' };
function words(fid, vid, s) { // how this choice reads in the sentence
  if (fid === 'kind') return F.KIND[vid].many;
  return F.phrase(F.pick(s || sel, fid, vid, 'only'), fid);
}
function single() { return sel.kind && sel.kind.size === 1 ? F.KIND[[...sel.kind][0]] : null; }
function render() {
  const Q = document.getElementById('q'); const K = single();
  let h = '<span class="w">Show me </span>';
  ORDER.forEach((fid, i) => {
    const s = sel[fid], f = F.FACET[fid];
    if (fid === 'when' && K && !K.date) { h += ' <span class="slot na" title="' + F.cap(K.many) + ' have no key date in this deployment. Contracts, sites and incidents do.">(' + K.many + ' have no key date)</span>'; return; }
    const txt = s && s.size ? (fid === 'kind' ? F.join([...s].map(v => F.KIND[v].many)) : F.phrase(sel, fid)) : ANY[fid];
    h += (i ? ' ' : '') + '<button class="slot' + (s && s.size ? ' set' : '') + (fresh === fid ? ' fresh' : '') + '" data-f="' + fid + '" aria-expanded="' + (open === fid) + '" aria-label="' + f.plain + ': ' + txt + '">' + F.esc(txt) + '</button>';
  });
  Q.innerHTML = h + '<span class="w">.</span>';
  const res = F.results(sel);
  const A = document.getElementById('ans');
  const filled = ORDER.filter(f => sel[f] && sel[f].size);
  A.innerHTML = '<span class="n" id="num">' + shown + '</span><span class="t">' + F.things(sel, res.length) + (res.length === 1 ? ' matches' : ' match') + '<small>of ' + total + ' kept here' + (F.elsewhereTotal() ? ', plus ' + F.elsewhereTotal() + ' kept on floors below' : '') + '</small></span><span class="trail">' + (filled.length ? 'Empty a blank to get back: ' + filled.map(f => { const d = F.results(dropped(f)).length - res.length; return F.FACET[f].plain.toLowerCase() + ' <b>+' + d + '</b>'; }).join(' \u00b7 ') : '') + '</span>';
  tick(res.length);
  const L = document.getElementById('list');
  if (res.length) L.innerHTML = res.slice(0, 40).map(F.row).join('');
  else { const b = F.recover(sel); L.innerHTML = '<li class="empty">' + F.reasons([{ type: 'none', icon: 'search-x', head: 'Nothing fits the whole sentence', text: b ? 'Take out “' + words(b.fid, b.vid) + '” and ' + b.n + ' come back.' : '' }]) + '</li>'; }
  if (open) pop(); else document.querySelectorAll('.pop').forEach(p => p.remove());
}
function dropped(fid) { const o = F.clone(sel); delete o[fid]; return o; }
let tk = 0;
function tick(n) { // the count rolls to its new value
  const me = ++tk, from = shown, t0 = performance.now(), d = F.reduced ? 1 : F.ms('--motion-calm');
  (function f(t) { if (me !== tk) return; const p = Math.min(1, (t - t0) / d); shown = Math.round(from + (n - from) * (1 - Math.pow(1 - p, 3))); const el = document.getElementById('num'); if (el) el.textContent = shown; if (p < 1) requestAnimationFrame(f); })(t0);
}
function pop() {
  document.querySelectorAll('.pop').forEach(p => p.remove());
  const slot = document.querySelector('.slot[data-f="' + open + '"]'); if (!slot) return;
  const f = F.FACET[open], c = F.counts(open, sel), cur = sel[open] || new Set();
  const vals = f.values.concat(c[F.GAP] ? [{ id: F.GAP, label: 'Not recorded' }] : []);
  let h = '<div class="ph"><span>' + f.q + '?</span><span class="tech">' + f.pm + ' · ' + f.tech + '</span></div>';
  h += '<button class="opt" data-v="" aria-checked="' + !cur.size + '"><span>' + ANY[open] + '</span><span class="c">' + F.results(dropped(open)).length + '</span></button>';
  vals.forEach(v => {
    const n = c[v.id], on = cur.has(v.id);
    const w = v.id === F.GAP ? 'with no ' + f.plain.toLowerCase() + ' recorded' : words(open, v.id);
    h += '<button class="opt' + (!n ? ' zero' : '') + (v.id === F.GAP ? ' gap' : '') + '" data-v="' + v.id + '" aria-checked="' + on + '"><span>' + F.esc(w) + '</span><span class="c">' + (n ? n : 'none') + '</span></button>';
    if (!n) h += '<div class="zr">' + F.reasons(F.why(sel, open, v.id).slice(0, 2)) + '</div>';
    else if (v.id === F.GAP) h += '<div class="zr"><div class="why w-gap"><span class="wi">' + Icons.svg('circle-dashed', { size: 16 }) + '</span><div><span>' + F.join(F.recs.filter(r => F.visible(r) && F.matches(r, sel, open) && F.val(r, open) === F.GAP).map(r => F.KIND[r.kind].keeper).filter((x, i, a) => a.indexOf(x) === i)) + ' can fill these in.</span></div></div></div>';
  });
  const P = document.createElement('div'); P.className = 'pop'; P.setAttribute('role', 'dialog'); P.innerHTML = h;
  const q = document.getElementById('q'); q.appendChild(P);
  const sr = slot.getBoundingClientRect(), qr = q.getBoundingClientRect();
  let left = sr.left - qr.left; const max = innerWidth - qr.left - P.offsetWidth - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--edge'));
  P.style.left = Math.max(0, Math.min(left, max)) + 'px'; P.style.top = (sr.bottom - qr.top + 4) + 'px';
  const room = innerHeight - sr.bottom - 24; if (P.offsetHeight > room) { P.style.maxHeight = room + 'px'; P.style.overflow = 'auto'; }
}
function choose(fid, vid) { if (!vid) delete sel[fid]; else sel = F.pick(sel, fid, vid, 'only'); if (fid === 'kind' && single() && !single().date) delete sel.when; fresh = fid; open = null; render(); }
app.addEventListener('click', e => {
  const s = e.target.closest('.slot[data-f]'); if (s) { open = open === s.dataset.f ? null : s.dataset.f; fresh = null; render(); return; }
  const o = e.target.closest('.opt'); if (o) { choose(open, o.dataset.v); return; }
  if (!e.target.closest('.pop') && open) { open = null; render(); }
});
document.getElementById('tbtn').onclick = () => document.body.classList.toggle('admin-off');
let run = 0;
async function demo() {
  const me = ++run; sel = {}; open = null; fresh = null; render();
  await F.wait(F.ms('--motion-run'));
  const step = F.ms('--motion-calm') * .6;
  for (const [f, v] of [['kind', 'contract'], ['service', 'waste'], ['region', 'north'], ['when', 'this']]) { if (me !== run) return; choose(f, v); await F.wait(step); }
  if (me !== run) return; open = 'region'; fresh = null; render();
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') demo();
  else if (e.key === 't' || e.key === 'T') document.body.classList.toggle('admin-off');
  else if (/^[1-5]$/.test(e.key)) { open = ORDER[+e.key - 1]; render(); const o = document.querySelector('.pop .opt'); if (o) o.focus(); }
  else if (e.key === 'Escape') { open = null; render(); }
  else if (e.key === 'Backspace' && open) { choose(open, ''); }
  else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && open) { const os = [...document.querySelectorAll('.pop .opt')]; let i = os.indexOf(document.activeElement); i = e.key === 'ArrowDown' ? Math.min(os.length - 1, i + 1) : Math.max(0, i - 1); os[i].focus(); e.preventDefault(); }
});
demo();
</script>
</body>
