<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record card · V2 · Statements in plain words</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---- shared by every record card variant (proposed tokens first, all listed in notes.md) ---- */
:root{
  --x-type-micro:.6875rem;                                                     /* --type-micro: mono eyebrows and numerals inside data (also proposed by wear-and-time) */
  --x-gap-ink:color-mix(in srgb,var(--ink-muted) 70%,transparent);             /* --mark-gap: the edge of a detail nobody has filled (dashed, never hatched) */
  --x-gap-fill:color-mix(in srgb,var(--ink-muted) 6%,transparent);             /* --mark-gap-fill: the inside of the empty box */
  --x-disagree:color-mix(in srgb,var(--warning) 70%,var(--ink));               /* --mark-disagree: two sources, side by side */
  --x-withdrawn:color-mix(in srgb,var(--danger) 45%,var(--ink-muted));         /* --mark-withdrawn: read from a withdrawn document */
  --x-kept:var(--floor-department-high);                                       /* the floor the record is kept on (set from data) */
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.micro{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink);letter-spacing:0}
.keys{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:var(--layer-chrome);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-3);max-width:calc(var(--measure-wide) * .7);font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:lowercase;color:var(--ink-muted);background:var(--scrim);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key)}
.x-cap{max-width:calc(var(--measure-wide) * .8)}
@media (max-width:1400px){.x-cap{max-width:var(--measure-glance)}.keys{max-width:calc(var(--measure-read) - var(--space-6))}}
svg{flex:none}
/* the app frame: a slim rail so the card sits inside Data Atlas */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr)}
.rail{background:color-mix(in srgb,var(--slate-deep) 70%,transparent);border-right:1px solid var(--hairline);padding:var(--edge) var(--edge-tight);display:flex;flex-direction:column;gap:var(--space-1)}
.rail .an{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light);padding:var(--space-2);margin-bottom:var(--space-4)}
.nav{display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-meta);border-radius:var(--radius-key)}
.nav.on{background:var(--surface-raised);color:var(--ink)}
.nav .n{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono)}
.rail .foot{margin-top:auto;margin-bottom:var(--space-6);padding:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rail .foot b{font-weight:400;color:var(--ink)}
.main{position:relative;overflow:hidden;min-height:0}
/* marks shared by all six: gap (dashed, empty, owned), disagree (two side by side), withdrawn (struck, marked), reach (lock, says who) */
.gapbox{border:1px dashed var(--x-gap-ink);background:var(--x-gap-fill);border-radius:var(--radius-key);color:var(--ink-muted)}
.tag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;padding:calc(var(--space-1) / 2) var(--space-1);border-radius:var(--radius-key);white-space:nowrap}
.tag.disagree{color:var(--x-disagree);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--x-disagree) 40%,transparent)}
.tag.withdrawn{color:var(--x-withdrawn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--x-withdrawn) 40%,transparent)}
.tag.gap{color:var(--ink-muted);box-shadow:inset 0 0 0 1px var(--x-gap-ink)}
.tag.reach{color:var(--ink-muted);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.struck{text-decoration:line-through;text-decoration-color:var(--x-withdrawn);text-decoration-thickness:1px}
.fdot{display:inline-block;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);flex:none}
.lit{box-shadow:0 0 0 var(--focus-ring) var(--light),0 0 var(--glow-blur) color-mix(in srgb,var(--green) 45%,transparent)!important}
@media (prefers-reduced-motion: reduce){ .lit{box-shadow:0 0 0 var(--focus-ring) var(--light)!important} }

:root{
  --x-side:calc(var(--measure-drawer) + var(--space-3));                       /* 332: the Used by column */
  --x-blank:calc(var(--space-8) + var(--space-4));                            /* 132: the drawn blank in a sentence nobody finished */
}
.main{padding:var(--edge) var(--space-6) var(--space-7);display:grid;grid-template-columns:minmax(0,1fr) var(--x-side);grid-template-rows:auto minmax(0,1fr);column-gap:var(--space-6)}
@media (max-width:1400px){.main{padding-left:var(--space-5);padding-right:var(--space-5);column-gap:var(--space-5)}:root{--x-side:calc(var(--measure-rail) + var(--space-5))}}
header{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:var(--space-3);margin-bottom:var(--space-3);border-bottom:1px solid var(--hairline)}
header h1{margin:var(--space-1) 0 0;font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);letter-spacing:var(--tracking-soft);color:var(--light)}
header .is{font-size:var(--type-meta);color:var(--ink-muted)}
header .is b{font-weight:400;color:var(--ink)}
header .tally span{white-space:nowrap}
header .tally{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-4);font-size:var(--type-small);color:var(--ink-muted);align-items:center}
header .tally b{font:400 var(--type-meta)/1 var(--font-mono);color:var(--ink);margin-right:var(--space-1)}
.stmts{display:grid;grid-template-columns:1fr 1fr;align-items:start;column-gap:var(--space-6);min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 var(--space-2);margin:0 calc(var(--space-2) * -1);scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
@media (max-width:1400px){.stmts{column-gap:var(--space-4)}}
.grp{break-inside:avoid;margin-bottom:var(--space-3)}
.grp h2{margin:0 0 var(--space-1);font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.st{display:block;width:100%;padding:var(--space-1) var(--space-2);margin-left:calc(var(--space-2) * -1);border-radius:var(--radius-key);break-inside:avoid;transition:background var(--motion-quick) var(--ease-standard),opacity var(--motion-base) var(--ease-out)}
.st:hover{background:color-mix(in srgb,var(--surface-raised) 60%,transparent)}
.st.on{background:var(--surface-raised)}
.st .s{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink-muted)}
.st .s b{font-weight:400;color:var(--light)}
.st .s b small{color:var(--ink-muted);font-size:var(--type-small)}
.st .q{display:flex;flex-wrap:wrap;gap:0 var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.st .q span{display:inline-flex;align-items:center;gap:var(--space-1)}
.st .tr{display:none;font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech .st .tr{display:block}
/* the blank: a sentence with its missing word drawn as a box, and who could finish it */
.blank{display:inline-block;width:var(--x-blank);height:calc(var(--leading-body) - var(--space-1));vertical-align:bottom;margin:0 var(--space-1);transition:width var(--motion-calm) var(--ease-out),border-color var(--motion-calm) var(--ease-out)}
.blank.pre{width:var(--space-3)}
.st.gap .q{color:var(--ink)}
.st.gap .q .who{color:var(--ink)}
/* two sources, two answers: the sentence forks, side by side */
.fork{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-1);transition:grid-template-columns var(--motion-calm) var(--ease-out)}
.fork.pre{grid-template-columns:1fr 0fr}
.fork > div{overflow:hidden;padding:var(--space-1) var(--space-2);border-left:2px solid var(--x-disagree);background:color-mix(in srgb,var(--x-disagree) 6%,transparent);border-radius:0 var(--radius-key) var(--radius-key) 0;min-width:0}
.fork b{display:block;font:400 var(--type-body)/var(--leading-body) var(--font-sans);color:var(--light);white-space:nowrap}
.fork span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.withdrawn .s b{color:var(--ink-muted)}
/* side: what uses this record, also in sentences */
.side{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:var(--space-2)}
.side h2{margin:0;font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.use{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline)}
.use b{font-weight:400;color:var(--ink)}
.use .w{color:var(--x-disagree)}
.use.wd b{color:var(--ink-muted)}
.use.wd .x{color:var(--x-withdrawn)}
.panel{padding:var(--space-3) var(--space-4);background:var(--surface-overlay);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);font-size:var(--type-meta);line-height:var(--leading-meta);transition:opacity var(--motion-base) var(--ease-out)}
.panel[hidden]{display:block;opacity:0;pointer-events:none;height:0;padding:0;border:0;overflow:hidden}
.panel h3{margin:var(--space-1) 0;font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.panel p{margin:0 0 var(--space-2)}
.panel p.m{color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);margin:var(--space-1) var(--space-2) 0 0}
.btn.go{border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green)}
@media (prefers-reduced-motion: reduce){.fork{transition:none}.blank{transition:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Data Atlas"></nav>
  <main class="main" id="main">
    <header>
      <div><div class="eyebrow" id="crumb"></div><h1 id="title"></h1><div class="is" id="is"></div></div>
      <div class="tally" id="tally"></div>
    </header>
    <section class="stmts" id="stmts" aria-label="What is known"></section>
    <aside class="side" id="side" aria-label="Used by"></aside>
  </main>
</div>
<div class="keys" id="keys"></div>
<div class="x-cap"><b>Record card · V2</b> statements in plain words: every detail is a sentence, gaps are blanks in the sentence, sources are references under it · Wikidata item pages, cloze tests</div>
<script>
/* ======================================================================
   Sample data: every name, label, count, date and word on this page comes
   from here. In AUGUR it comes from Data Atlas: the ontology (kinds of thing,
   their details and kinds of link, each with the pack term it stands for),
   what's known (observations from sources, facts a floor's leads accepted,
   disputes), Used by (Mandate bindings, the documents read) and the floors.
   Nothing below is drawn for one deployment: swap this object and the page
   redraws for any org. Press K to switch to a record of another kind.
   ====================================================================== */
const DATA = {
  app: 'Data Atlas',
  org: 'Vale Regional Services',

    source: ['Where it came from', 'observation · prov:wasDerivedFrom'],

    fact: ['Accepted', 'fact (accepted by floor leads)'],
    usedBy: ['Used by', 'Mandate bindings · source documents'],
    kept: ['Kept on', 'owning workspace']
  },
  /* sources: a document in Artifacts or a person. A withdrawn document's readings stay, marked, and stop counting. */

    register: { type: 'document', word: 'Asset register, Q3 2026', where: 'Estates records', floor: 'org', on: '2026-10-01' },
    lease:    { type: 'document', word: 'Lease agreement, Halden Road', where: 'Estates records', floor: 'department', on: '2019-04-02' },
    survey:   { type: 'document', word: 'Facilities survey 2025', where: 'Facilities library', floor: 'department', on: '2025-06-18' },
    fmdoc:    { type: 'document', word: 'Contract FM-2024-017', where: 'Contracts', floor: 'department', on: '2024-02-20' },
    handbook: { type: 'document', word: 'Depot handbook 2019', where: 'Facilities library', floor: 'department', on: '2019-05-01',
                withdrawn: { on: '2026-02-10', by: 'Facilities leads', why: 'Replaced by the 2026 handbook, which has not been read yet.' } },
    ir2291:   { type: 'document', word: 'Incident report IR-2291', where: 'Depot logs', floor: 'team', on: '2026-08-14' },
    priya:    { type: 'person', word: 'Priya Natarajan', role: 'Site manager', floor: 'department', on: '2026-09-30' },
    gmdoc:    { type: 'document', word: 'Grounds maintenance contract', where: 'Contracts', floor: 'department', on: '2023-03-10' },
    tender:   { type: 'document', word: 'Tender evaluation 2023', where: 'Procurement', floor: 'department', on: '2023-02-02' },
    tomasz:   { type: 'person', word: 'Tomasz Wilk', role: 'Contract manager', floor: 'department', on: '2026-07-11' }
  },
  /* the ontology: kinds of thing (only the two shown in full here, plus the kinds links point at) */

    site: {
      word: 'Site', plural: 'Sites', icon: 'warehouse', count: 46,
      tech: { name: 'cco:Facility', pack: 'Common Core Ontologies 2.0', iri: 'http://www.ontologyrepository.com/CommonCoreOntologies/Facility' },

      },

        managedBy:    { word: 'Managed by', say: 'It is managed by {v}.', back: 'manages', to: 'person', tech: 'vrs:managed_by' },
        covers:       { word: 'Covers', say: 'It applies at {v}.', back: 'covered by', to: 'site', tech: 'vrs:covers_site', many: true }
      }
    },
    region: { word: 'Region', plural: 'Regions', icon: 'map', count: 6 },
    organisation: { word: 'Organisation', plural: 'Organisations', icon: 'building-2', count: 318 },

    vehicle: { word: 'Vehicle', plural: 'Vehicles', icon: 'truck', count: 410 },

  },
  /* records. Each detail holds observations: { v, src, on, note?, grade?, accepted? }.

    {
      id: 'ent_01J8R4T', kind: 'site', name: 'Halden Road Depot', floor: 'department',

        alias:     [{ v: 'Depot 4', src: 'register', on: '2026-10-01', accepted: true }, { v: 'HRD', src: 'priya', on: '2026-09-30', accepted: true }],
        purpose:   [{ v: 'a vehicle depot and stores', src: 'register', on: '2026-10-01', accepted: true }],
        address:   [{ v: 'Unit 2, Halden Road, Marrow Bridge MB4 7QT', src: 'lease', on: '2019-04-02', note: 'page 1', accepted: true }],
        floorArea: [{ v: '2,400', src: 'lease', on: '2019-04-02', note: 'schedule 2' }, { v: '2,650', src: 'survey', on: '2025-06-18', note: 'counts the 2023 extension' }],
        spaces:    [{ v: '38', src: 'survey', on: '2025-06-18', accepted: true }],
        opened:    [{ v: '13 May 2019', src: 'handbook', on: '2019-05-01', note: 'foreword' }],
        energy:    [{ v: 'C', src: 'survey', on: '2025-06-18', accepted: true, grade: 'B2' }],
        inRegion:  [{ to: 'North Vale', src: 'register', on: '2026-10-01', accepted: true }],
        runBy:     [{ to: 'Corvane Facilities Ltd', src: 'fmdoc', on: '2024-02-20', note: 'since 1 April 2024', accepted: true }],
        managedBy: [{ to: 'Priya Natarajan', src: 'register', on: '2026-10-01', accepted: true }],
        coveredBy: [{ to: 'FM-2024-017 · Facilities management', src: 'fmdoc', on: '2024-02-20', accepted: true }],
        houses:    [{ to: '31 vehicles', count: 31, sample: ['VN-23 electric van', 'GR-07 gritter', 'TK-12 tipper'], src: 'register', on: '2026-10-01', accepted: true }],
        incidents: [{ to: '3 incidents this year', count: 3, sample: ['IR-2291 roller door fault', 'IR-2240 forklift near miss', 'IR-2177 flooding, bay 3'], src: 'ir2291', on: '2026-08-14', accepted: true }]
      },
      usedBy: {
        intents: [
          { word: 'Cut depot energy use by 15% by 2027', owner: 'Estates', floor: 'org', uses: ['energy', 'floorArea'] },
          { word: 'Fleet electrification, phase 2', owner: 'Fleet', floor: 'department', uses: ['spaces', 'houses'] },
          { word: 'Close open fire safety actions by March', owner: 'Health and safety', floor: 'department', uses: ['fireCheck'], waits: true }
        ],
        documents: ['register', 'lease', 'survey', 'fmdoc', 'ir2291', 'handbook']
      },
      also: [ { name: 'Halden Rd depot', floor: 'team', why: 'Same address, spelt differently. In Triage as a possible match.' } ]
    },
    {
      id: 'ent_01J9C2M', kind: 'contract', name: 'Grounds maintenance, North Vale', floor: 'department',
      since: '2023-04-01', changed: '2026-07-11',
      known: {
        name:    [{ v: 'Grounds maintenance, North Vale', src: 'gmdoc', on: '2023-03-10', accepted: true }],
        ref:     [{ v: 'GM-2023-004', src: 'gmdoc', on: '2023-03-10', accepted: true }],
        scope:   [{ v: 'mowing, hedges and winter gritting at 12 sites', src: 'gmdoc', on: '2023-03-10', note: 'schedule A', accepted: true }],
        value:   [{ v: '184,000', src: 'gmdoc', on: '2023-03-10', note: 'clause 6' }, { v: '196,500', src: 'tomasz', on: '2026-07-11', note: 'after the 2025 uplift' }],
        starts:  [{ v: '1 April 2023', src: 'gmdoc', on: '2023-03-10', accepted: true }],
        ends:    [{ v: '31 March 2027', src: 'gmdoc', on: '2023-03-10', accepted: true }],
        withSupplier: [{ to: 'Greenline Services', src: 'tender', on: '2023-02-02', accepted: true }],
        managedBy:    [{ to: 'Tomasz Wilk', src: 'tomasz', on: '2026-07-11', accepted: true }],
        covers:       [{ to: '12 sites', count: 12, sample: ['Halden Road Depot', 'Marrow Bridge offices', 'Fenwick salt store'], src: 'gmdoc', on: '2023-03-10', accepted: true }]
      },
      usedBy: {
        intents: [
          { word: 'Re-tender grounds maintenance before it ends', owner: 'Procurement', floor: 'department', uses: ['ends', 'renewal', 'notice'], waits: true },
          { word: 'Hold grounds spend flat in 2027', owner: 'Finance', floor: 'org', uses: ['value'] }
        ],
        documents: ['gmdoc', 'tender', 'tomasz']
      },
      also: []
    }
  ],
  demo: { detail: 'fireCheck', dispute: 'floorArea' }
};

/* ====================================================================== shared helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ms = t => { const v = getComputedStyle(document.documentElement).getPropertyValue(t).trim(); return RM ? 0 : (parseFloat(v) || 0); };
const ic = (n, s = 16) => Icons.svg(n, { size: s, stroke: 1.5 });
const FV = { org: '--floor-org-high', department: '--floor-department-high', team: '--floor-team-high', you: '--floor-you-high' };
const floorC = f => `var(${FV[f] || '--ink-muted'})`;
const floorW = f => DATA.floors[f]?.word || f;
const W = k => DATA.words[k][0];
const T = k => DATA.words[k][1];
const fmtDate = s => { const d = new Date(s + 'T00:00:00Z'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }); };
const ORDER = { org: 3, department: 2, team: 1, you: 0 };
const seesFloor = f => ORDER[f] >= ORDER[DATA.viewer.floor];

let REC = 0;
const rec = () => DATA.records[REC];
const kindOf = r => DATA.kinds[r.kind];
const defOf = (r, k) => kindOf(r).details[k] || kindOf(r).links[k];
const isLink = (r, k) => !!kindOf(r).links[k];
const src = id => DATA.sources[id];
const srcIcon = id => src(id)?.type === 'person' ? 'user-round' : 'file-text';
const srcWhere = id => { const s = src(id); return s.type === 'person' ? `${s.role}, said ${fmtDate(s.on)}` : `Artifacts · ${s.where}`; };

/* the state of one detail on one record: filled, disagree, gap, reach (kept out of view), withdrawn (known only from a withdrawn source) */
function stateOf(r, k) {
  const d = defOf(r, k), obs = r.known[k] || [];
  if (d.reach && (d.reach.restricted || !seesFloor(d.reach.floor))) return { s: 'reach', obs: [], d };
  if (!obs.length) return { s: 'gap', obs, d };
  const live = obs.filter(o => !src(o.src).withdrawn);
  if (!live.length) return { s: 'withdrawn', obs, d };
  const vals = new Set(live.map(o => o.v ?? o.to));
  if (vals.size > 1 && !live.some(o => o.accepted)) return { s: 'disagree', obs: live, d };
  return { s: 'filled', obs, d };
}
const valOf = (o, d) => esc(o.v ?? o.to) + (d.unit && d.type !== 'money' ? ` <small>${esc(d.unit)}</small>` : '');
const moneyOf = (o, d) => d.type === 'money' ? `${esc(d.unit)}${esc(o.v)}` : null;
const show = (o, d) => moneyOf(o, d) ?? valOf(o, d);
const allKeys = r => kindOf(r).groups.flatMap(g => g.items);
function tally(r) {
  const t = { filled: 0, disagree: 0, gap: 0, reach: 0, withdrawn: 0 };
  allKeys(r).forEach(k => t[stateOf(r, k).s]++);
  t.total = allKeys(r).length; return t;
}
/* who could fill a gap: the kind's own hint, or the floor's leads */
const filler = (r, d) => d.fill || { who: `${floorW(r.floor)} leads`, floor: r.floor, hint: 'anyone with access can propose a value' };
const usedFor = (r, k) => r.usedBy.intents.filter(i => i.uses.includes(k));

/* the Data Atlas rail: kinds come from the ontology, counts from Data Atlas */
function rail(active) {
  const ks = ['site', 'contract', 'organisation', 'person', 'vehicle', 'incident'];
  $('#rail').innerHTML = `<div class="an">${esc(DATA.app)}</div>
    <div class="nav"><span>${ic('library')}</span>What we keep</div>
    ${ks.map(k => { const K = DATA.kinds[k]; return `<div class="nav ${k === active ? 'on' : ''}"><span>${ic(K.icon)}</span>${esc(K.plural)}<span class="n">${K.count.toLocaleString('en-GB')}</span></div>`; }).join('')}
    <div class="nav"><span>${ic('inbox')}</span>Triage<span class="n">7</span></div>
    <div class="foot">You are on the <b>${esc(floorW(DATA.viewer.floor))}</b> floor. You see what is kept here and on the floors above: <b>${esc(floorW('org'))}</b>.</div>`;
}

/* keys bar + tip */
function keys(list) {
  $('#keys').innerHTML = list.map(([a, b]) => `<span>${a.split(' ').map(x => `<span class="kbd">${esc(x)}</span>`).join(' ')} ${esc(b)}</span>`).join('');
}
const timers = []; const later = (f, t) => timers.push(setTimeout(f, t));
const clearTimers = () => { while (timers.length) clearTimeout(timers.pop()); };


/* ====================================================================== V2: statements */
let cur = -1, tech = false, order = [];
const fill = (d, v) => esc(d.say).replace('\\{v\\}', '{v}').replace('{v}', v);
const lower = (o, d) => (d.type === 'text' && !d.key && /^[a-z]/.test(o.v || '')) ? esc(o.v) : show(o, d);
function q(o) {
  const s = src(o.src);
  return `<span>${ic(srcIcon(o.src), 12)} ${esc(s.word)}${o.note ? ', ' + esc(o.note) : ''}</span>${o.grade ? `<span>graded ${esc(o.grade)}</span>` : ''}${o.accepted ? `<span>${ic('check', 12)} accepted</span>` : ''}`;
}
function triple(r, k, d, o) {
  const v = o ? (o.to ? `ent:${o.to.replace(/\W+/g, '_').slice(0, 18)}` : `"${o.v}"`) : '[]';
  return `${r.id}  ${d.tech}  ${v}`;
}
function statement(r, k) {
  const st = stateOf(r, k), d = st.d;
  if (st.s === 'filled') {
    const v = st.obs.map(o => `<b>${o.to ? esc(o.to) : lower(o, d)}</b>`).join(' and ');
    return `<div class="s">${fill(d, v)}</div><div class="q">${st.obs.map(q).join('')}</div><div class="tr">${esc(triple(r, k, d, st.obs[0]))}</div>`;
  }
  if (st.s === 'disagree') {
    return `<div class="s">${fill(d, '<b>…</b>')} <span class="tag disagree">${ic('git-compare', 12)} ${esc(W('disagree'))}</span></div>
      <div class="fork pre">${st.obs.map(o => `<div><b>${show(o, d)}</b><span>${ic(srcIcon(o.src), 12)} ${esc(src(o.src).word)}, ${fmtDate(o.on)}</span>${o.note ? `<span>${esc(o.note)}</span>` : ''}</div>`).join('')}</div>
      <div class="q"><span>Neither is accepted. ${esc(floorW(r.floor))} leads decide; both stay until then.</span></div><div class="tr">${esc(triple(r, k, d, st.obs[0]))}  ⟂  ${esc(triple(r, k, d, st.obs[1]).split('  ').pop())}</div>`;
  }
  if (st.s === 'withdrawn') {
    const o = st.obs[0];
    return `<div class="s">${fill(d, `<b class="struck">${show(o, d)}</b>`)} <span class="tag withdrawn">${ic('file-x', 12)} source withdrawn</span></div>
      <div class="q"><span>Only ${esc(src(o.src).word)} said so, and it was withdrawn ${fmtDate(src(o.src).withdrawn.on)}. It no longer counts.</span></div><div class="tr">${esc(triple(r, k, d, o))}  (retracted)</div>`;
  }
  if (st.s === 'gap') {
    const f = filler(r, d), u = usedFor(r, k);
    return `<div class="s">${fill(d, '<span class="blank gapbox pre" aria-label="not known yet"></span>')}</div>
      <div class="q"><span>${ic('circle-dashed', 12)} Nobody has said yet.</span><span class="who">${ic('user-round', 12)} ${esc(f.who)} could, ${esc(f.hint)}.</span>${u.length ? `<span style="color:var(--x-disagree)">${ic('target', 12)} ${esc(u[0].word)} waits on it.</span>` : ''}</div><div class="tr">${esc(triple(r, k, d))}  expected, no assertion</div>`;
  }
  return `<div class="s">${fill(d, `<b>${ic('lock', 14)}</b>`)}</div><div class="q"><span>Kept on the ${esc(floorW(d.reach.floor))} floor, out of view from here. Ask ${esc(d.reach.ask)}.</span></div><div class="tr">${esc(d.tech)}  (kept: ${esc(d.reach.floor)})</div>`;
}
function render() {
  const r = rec(), K = kindOf(r), t = tally(r);
  rail(r.kind);
  $('#crumb').textContent = `${DATA.app} · ${K.plural}`;
  $('#title').textContent = r.name;
  $('#is').innerHTML = `A <b>${esc(K.word.toLowerCase())}</b>${tech ? ` <span class="mono">(${esc(K.tech.name)})</span>` : ''}, kept on <b>${esc(floorW(r.floor))}</b> since ${fmtDate(r.since)}. ${esc(K.says)}`;
  $('#tally').innerHTML = `<span><b>${t.filled}</b>said</span><span><b>${t.disagree}</b>disputed</span><span><b>${t.gap}</b>not known yet</span><span><b>${t.withdrawn + t.reach}</b>other</span><span class="micro"><span class="kbd">T</span> ${tech ? 'plain' : 'statements as triples'}</span>`;
  order = [];
  const grps = K.groups.map(g => `<div class="grp"><h2>${esc(g.word)}</h2>${g.items.map(k => { order.push(k); const s = stateOf(r, k).s; return `<button class="st ${s}" data-k="${k}">${statement(r, k)}</button>`; }).join('')}</div>`);
  /* two columns, split where half the statements are */
  let acc = 0, cut = 1, best = 1e9;
  for (let i = 0; i < K.groups.length - 1; i++) { acc += K.groups[i].items.length; if (Math.abs(acc - order.length / 2) < best) { best = Math.abs(acc - order.length / 2); cut = i + 1; } }
  $('#stmts').innerHTML = `<div>${grps.slice(0, cut).join('')}</div><div>${grps.slice(cut).join('')}</div>`;
  $('#stmts').classList.toggle('tech', tech);
  $('#side').innerHTML = `<div class="panel" id="panel" hidden></div><h2>${esc(W('usedBy'))}</h2>${r.usedBy.intents.map(i => `<div class="use">${ic('target', 14)}<div><b>${esc(i.word)}</b> reads its ${i.uses.map(k => esc(defOf(r, k).word.toLowerCase())).join(' and ')}. <span>${esc(i.owner)}, ${esc(floorW(i.floor))}.</span>${i.waits ? ` <span class="w">It is waiting on something not known yet.</span>` : ''}</div></div>`).join('')}
    <h2 style="margin-top:var(--space-2)">What this was read from</h2>${r.usedBy.documents.map(id => `<div class="use ${src(id).withdrawn ? 'wd' : ''}">${ic(srcIcon(id), 14)}<div><b>${esc(src(id).word)}</b> <span>${esc(srcWhere(id))}</span>${src(id).withdrawn ? ` <span class="x">Withdrawn; what it said no longer counts.</span>` : ''}</div></div>`).join('')}`;
  $$('.st').forEach(b => b.addEventListener('click', () => sel(order.indexOf(b.dataset.k))));
  keys([['↑ ↓', 'statement'], ['Enter', 'act on it'], ['Esc', 'close'], ['T', 'as triples'], ['K', 'another kind'], ['R', 'replay']]);
}
function sel(i) {
  cur = i; const r = rec();
  $$('.st').forEach((b, j) => b.classList.toggle('on', j === i));
  const p = $('#panel');
  if (i < 0) { p.hidden = true; return; }
  const k = order[i], st = stateOf(r, k), d = st.d; $$('.st')[i].focus({ preventScroll: true }); $$('.st')[i].scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' });
  if (st.s === 'gap') { const f = filler(r, d); p.innerHTML = `<div class="micro">${esc(d.word)}</div><h3>Finish this sentence</h3><p>${fill(d, '<span class="blank gapbox" style="width:var(--space-7)"></span>')}</p><p class="m">${esc(f.who)} could. What you write goes to Triage on ${esc(floorW(r.floor))} with you as the source; a lead accepts it.</p><button class="btn go">${ic('pencil-line', 14)} Propose</button><button class="btn">${ic('send', 14)} Ask</button>`; }
  else if (st.s === 'disagree') p.innerHTML = `<div class="micro">${esc(d.word)}</div><h3>Two answers</h3><p class="m">Leads on ${esc(floorW(r.floor))} pick one or keep both. You can add a third source.</p><button class="btn">${ic('file-plus', 14)} Add a source</button><button class="btn">${ic('flag', 14)} Say which is wrong</button>`;
  else p.innerHTML = `<div class="micro">${esc(d.word)}</div><h3>${st.s === 'reach' ? 'Out of view' : 'Rests on'} </h3><p class="m">${st.s === 'reach' ? esc(d.reach.why) : st.obs.map(o => esc(src(o.src).word) + ', ' + fmtDate(o.on)).join('; ')}</p><button class="btn">${ic('flag', 14)} Say it's wrong</button>`;
  p.hidden = false;
}
function demo() {
  clearTimers(); cur = -1; render();
  $$('.st').forEach(s => s.style.opacity = 0);
  later(() => $$('.st').forEach((s, i) => later(() => s.style.opacity = 1, i * ms('--motion-instant') / 2)), ms('--motion-instant'));
  later(() => { $$('.fork').forEach(f => f.classList.remove('pre')); $$('.blank').forEach(b => b.classList.remove('pre')); }, ms('--motion-run'));
  later(() => { const i = order.indexOf(DATA.demo.detail); if (i >= 0) sel(i); }, ms('--motion-run') + ms('--motion-calm') * 2);
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') return demo();
  if (e.key === 'k' || e.key === 'K') { REC = (REC + 1) % DATA.records.length; return demo(); }
  if (e.key === 't' || e.key === 'T') { tech = !tech; const c = cur; render(); $$('.fork,.blank').forEach(f => f.classList.remove('pre')); return sel(c); }
  if (e.key === 'Escape') return sel(-1);
  if (e.key === 'ArrowDown') { e.preventDefault(); sel(Math.min(order.length - 1, cur + 1)); }
  if (e.key === 'ArrowUp') { e.preventDefault(); sel(Math.max(0, cur - 1)); }
});
document.fonts.ready.then(demo);
</script>
