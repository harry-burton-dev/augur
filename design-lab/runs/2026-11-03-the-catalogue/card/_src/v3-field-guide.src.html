<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record card · V3 · Field guide account</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@COMMON_CSS*/
:root{
  --x-plate:calc(var(--measure-card) + var(--space-6));                        /* 428: the plate page */
}
@media (max-width:1400px){:root{--x-plate:var(--measure-card)}}
.main{padding:var(--edge) var(--space-6) var(--space-7);display:grid;grid-template-columns:var(--x-plate) minmax(0,1fr);column-gap:var(--space-6)}
@media (max-width:1400px){.main{padding-left:var(--space-5);padding-right:var(--space-5);column-gap:var(--space-5)}}
/* the plate: the record drawn with its field marks, and its associations */
.plate{position:relative;display:flex;flex-direction:column;gap:var(--space-3);min-height:0}
.plate .num{display:flex;justify-content:space-between;align-items:baseline}
.plate .num b{font:200 var(--type-display)/1 var(--font-sans);color:var(--x-kept)}
.fig{position:relative;flex:1;min-height:0;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset)}
.fig svg.ln{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.fig svg.ln line{stroke:var(--ink-muted);stroke-width:1;transition:stroke-dashoffset var(--motion-calm) var(--ease-out)}
.fig svg.ln line.gap{stroke:var(--x-gap-ink);stroke-dasharray:3 3}
.fig .em{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:calc(var(--space-8) + var(--space-3));height:calc(var(--space-8) + var(--space-3));border-radius:50%;display:grid;place-items:center;color:var(--ink);background:radial-gradient(circle,color-mix(in srgb,var(--x-kept) 18%,transparent),transparent 70%);border:1px solid color-mix(in srgb,var(--x-kept) 40%,transparent)}
.fm{position:absolute;max-width:calc(var(--space-8) + var(--space-6));font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:opacity var(--motion-base) var(--ease-out)}
.fm .n{font:400 var(--x-type-micro)/1 var(--font-mono);color:var(--x-kept);margin-right:var(--space-1)}
.fm .m{display:block;color:var(--ink-muted)}
.fm.gap{color:var(--ink-muted);font-style:italic}
.fm.pre{opacity:0}
.assoc{height:calc(var(--space-8) + var(--space-7));border-top:1px solid var(--hairline);padding-top:var(--space-2);position:relative}
.assoc svg{width:100%;height:calc(100% - var(--space-4));overflow:visible}
.assoc text{font:400 var(--x-type-micro) var(--font-sans);fill:var(--ink-muted)}
.assoc text.v{fill:var(--ink)}
/* the account: dense run-in prose, field guide style */
.acct{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.acct header{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.acct h1{margin:0;font:300 var(--type-title-s)/var(--leading-title-s) var(--font-sans);color:var(--light);letter-spacing:var(--tracking-soft)}
.acct .alt{font-style:italic;color:var(--ink-muted);font-size:var(--type-meta)}
.acct .alt .mono{font-style:normal;font-size:var(--x-type-micro)}
.cols{columns:2;column-gap:var(--space-5);padding-top:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);min-height:0;overflow:hidden;flex:1}
.cols p{margin:0 0 var(--space-3);break-inside:avoid;color:var(--ink-muted)}
.cols p > b:first-child{font-weight:500;color:var(--light);margin-right:var(--space-1);letter-spacing:var(--tracking-soft)}
.it{color:var(--ink)}
.it i{font-style:normal;color:var(--ink-muted)}
.it.gapw{display:inline-block;padding:0 var(--space-1);color:var(--ink-muted);font-style:italic}
.cite{font-size:var(--type-small);color:var(--ink-muted)}
.differ{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin:var(--space-1) 0}
.differ span{padding:var(--space-1) var(--space-2);border-left:2px solid var(--x-disagree);background:color-mix(in srgb,var(--x-disagree) 6%,transparent);color:var(--ink);font-size:var(--type-small);line-height:var(--leading-small)}
.differ span b{display:block;font:400 var(--type-body)/var(--leading-body) var(--font-sans);color:var(--light)}
/* status: how well this record is known, as a field guide gives a status */
.status{display:flex;gap:2px;margin:var(--space-2) 0 var(--space-1)}
.status span{flex:1;padding:var(--space-1) 0;text-align:center;font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);background:var(--surface-raised)}
.status span:first-child{border-radius:var(--radius-key) 0 0 var(--radius-key)}
.status span:last-child{border-radius:0 var(--radius-key) var(--radius-key) 0}
.status span.on{background:color-mix(in srgb,var(--x-kept) 30%,var(--slate-deep));color:var(--light);box-shadow:inset 0 0 0 1px var(--x-kept)}
.wanted{display:block;margin:0 0 var(--space-3);color:var(--ink-muted);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);break-inside:avoid;transition:box-shadow var(--motion-calm) var(--ease-out)}
.wanted li{margin:0 0 var(--space-1)}
.wanted ul{margin:var(--space-1) 0 0;padding-left:var(--space-4)}
.wanted b{font-weight:400;color:var(--ink)}
.rec{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr) auto;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.rec b{font-weight:400;color:var(--ink)}
.rec .n{font-family:var(--font-mono);color:var(--ink)}
.rec.wd b,.rec.wd .n{color:var(--x-withdrawn)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);margin:var(--space-2) var(--space-2) 0 0;color:var(--ink)}
.btn.go{border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green)}
.cols .tr{display:none;font:400 var(--x-type-micro)/1 var(--font-mono);color:var(--ink-muted);margin-left:var(--space-1)}
.tech .cols .tr{display:inline}
@media (max-height:840px){.cols{font-size:var(--type-small);line-height:var(--leading-small)}.assoc{height:calc(var(--space-8) + var(--space-5))}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Data Atlas"></nav>
  <main class="main" id="main">
    <section class="plate" aria-label="Plate">
      <div class="num"><span class="eyebrow" id="plateno"></span><b id="kno"></b></div>
      <div class="fig" id="fig"></div>
      <div class="assoc" id="assoc"><div class="micro">Found with · its links</div></div>
    </section>
    <article class="acct" id="acct"></article>
  </main>
</div>
<div class="keys" id="keys"></div>
<div class="x-cap"><b>Record card · V3</b> field guide account: a plate with field marks, run-in prose, a status, "reports differ", records by observer, observers wanted · Collins Bird Guide, Peterson, IUCN status</div>
<script>
/*@COMMON_JS*/

/* ====================================================================== V3: the species account */
let tech = false;
const STATUS = ['Barely', 'Sparse', 'Patchy', 'Well known', 'Complete'];
function item(r, k, compact) {
  const st = stateOf(r, k), d = st.d, tr = `<span class="tr">${esc(d.tech)}</span>`;
  if (st.s === 'filled') return `<span class="it">${st.obs.map(o => o.to ? esc(o.to) : show(o, d)).join(', ')}</span>${compact ? '' : ` <span class="cite">(${esc([...new Set(st.obs.map(o => src(o.src).word))].join('; '))})</span>`}${tr}`;
  if (st.s === 'disagree') return `reports differ.<span class="differ">${st.obs.map(o => `<span><b>${show(o, d)}</b>${esc(src(o.src).word)}, ${o.on.slice(0, 4)}${o.note ? ` · ${esc(o.note)}` : ''}</span>`).join('')}</span>`;
  if (st.s === 'withdrawn') return `<span class="it struck">${show(st.obs[0], d)}</span> <span class="tag withdrawn">withdrawn source</span>${tr}`;
  if (st.s === 'gap') return `<span class="it gapw gapbox">not yet recorded</span>${tr}`;
  return `<span class="it">${ic('lock', 12)} <i>kept on ${esc(floorW(d.reach.floor))}; ask ${esc(d.reach.ask)}</i></span>${tr}`;
}
function render() {
  const r = rec(), K = kindOf(r), t = tally(r);
  document.documentElement.style.setProperty('--x-kept', floorC(r.floor));
  rail(r.kind);
  $('#plateno').textContent = `Plate ${DATA.records.indexOf(r) + 1} · ${K.plural}`;
  $('#kno').textContent = String(DATA.records.indexOf(r) + 1).padStart(2, '0');
  /* field marks: the identity keys first, then what's said most firmly */
  const keysF = allKeys(r).filter(k => !isLink(r, k));
  const marks = keysF.filter(k => defOf(r, k).key).concat(keysF.filter(k => !defOf(r, k).key && ['filled', 'disagree', 'gap'].includes(stateOf(r, k).s))).slice(0, 6);
  const pos = [[6, 8], [64, 6], [70, 40], [64, 74], [6, 74], [4, 40]];
  const fig = $('#fig');
  fig.innerHTML = `<svg class="ln" id="lines"></svg><div class="em">${ic(K.icon, 56)}</div>` + marks.map((k, i) => {
    const st = stateOf(r, k), d = st.d;
    const v = st.s === 'gap' ? 'not yet recorded' : st.s === 'disagree' ? st.obs.map(o => o.v).join(' or ') + (d.unit ? ' ' + d.unit : '') : (st.obs[0].v ?? st.obs[0].to);
    return `<div class="fm pre ${st.s}" data-i="${i}" style="left:${pos[i][0]}%;top:${pos[i][1]}%"><span class="n">${i + 1}</span>${esc(v)}<span class="m">${esc(d.word)}</span></div>`;
  }).join('');
  /* associations: the links, drawn as a small constellation */
  const lk = allKeys(r).filter(k => isLink(r, k));
  const A = $('#assoc'), w = A.clientWidth, h = A.clientHeight - 24, cx = w / 2, cy = h / 2;
  A.innerHTML = `<div class="micro">Found with · its links</div><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Links">${lk.map((k, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / lk.length, x = cx + Math.cos(a) * w * .2, y = cy + Math.sin(a) * h * .36, st = stateOf(r, k), d = st.d;
    const lbl = st.s === 'gap' ? `${d.word}: ?` : `${d.word} ${st.obs[0].to}`;
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(${st.s === 'gap' ? '--x-gap-ink' : '--hairline-strong'});${st.s === 'gap' ? 'stroke-dasharray:3 3' : ''}"/><circle cx="${x}" cy="${y}" r="4" style="fill:${st.s === 'gap' ? 'var(--slate-deep)' : 'var(--ink-muted)'};stroke:var(--x-gap-ink);${st.s === 'gap' ? 'stroke-dasharray:2 2' : ''}"/><text class="${st.s === 'gap' ? '' : 'v'}" x="${x + (x < cx - 4 ? -8 : x > cx + 4 ? 8 : 0)}" y="${y + (Math.abs(x - cx) < 5 ? (y < cy ? -8 : 14) : 4)}" text-anchor="${x < cx - 4 ? 'end' : x > cx + 4 ? 'start' : 'middle'}">${esc(lbl.length > 26 ? lbl.slice(0, 25) + '…' : lbl)}</text>`;
  }).join('')}<circle cx="${cx}" cy="${cy}" r="6" style="fill:var(--x-kept)"/></svg>`;
  /* the account */
  const lvl = Math.min(4, Math.floor(t.filled / t.total * 5));
  const people = Object.keys(DATA.sources).filter(id => r.usedBy.documents.includes(id) || allKeys(r).some(k => (r.known[k] || []).some(o => o.src === id)));
  const count = id => allKeys(r).filter(k => (r.known[k] || []).some(o => o.src === id)).length;
  const gaps = allKeys(r).filter(k => stateOf(r, k).s === 'gap');
  let h2 = `<header><div><div class="eyebrow">${esc(DATA.app)} · ${esc(K.plural)}</div><h1>${esc(r.name)}</h1><div class="alt">${(r.known.alias || []).map(o => esc(o.v)).join(', ') || esc(K.word)} · <span class="mono">${tech ? esc(K.tech.name) + ' · ' + esc(r.id) : esc(K.word.toLowerCase())}</span></div></div>
    <div class="micro" style="text-align:right"><span class="fdot" style="background:${floorC(r.floor)}"></span> ${esc(W('kept'))} ${esc(floorW(r.floor))}<br><span class="kbd">T</span> ${tech ? 'plain words' : 'technical names'}</div></header><div class="cols" id="cols">`;
  h2 += `<p><b>Identification.</b>${esc(K.says)} ${marks.length} field marks on the plate; the first is its name, which no other ${esc(K.word.toLowerCase())} may share.</p>`;
  K.groups.forEach(g => {
    h2 += `<p><b>${esc(g.word)}.</b>${g.items.map(k => `${esc(defOf(r, k).word)}: ${item(r, k)}${stateOf(r, k).s === 'disagree' ? '' : '.'}`).join(' ')}</p>`;
  });
  h2 += `<p><b>Status.</b>${esc(STATUS[lvl])}: ${t.filled} of the ${t.total} things a ${esc(K.word.toLowerCase())} is expected to have are said and accepted.<span class="status">${STATUS.map((s, i) => `<span class="${i === lvl ? 'on' : ''}">${esc(s)}</span>`).join('')}</span></p>`;
  h2 += `<div class="wanted gapbox" id="wanted"><b style="font-weight:500;color:var(--light)">Observers wanted.</b> Not yet recorded:<ul>${gaps.map(k => { const f = filler(r, defOf(r, k)); return `<li><b>${esc(defOf(r, k).word)}</b>: ${esc(f.who)}, ${esc(f.hint)}.${usedFor(r, k).length ? ` <span style="color:var(--x-disagree)">${esc(usedFor(r, k)[0].word)} waits on it.</span>` : ''}</li>`; }).join('')}</ul><button class="btn go">${ic('pencil-line', 14)} Record one</button></div>`;
  if (r.also.length) h2 += `<p><b>Similar records.</b>${r.also.map(a => `<span class="it">${esc(a.name)}</span> on ${esc(floorW(a.floor))}: ${esc(a.why)}`).join(' ')}</p>`;
  h2 += `<p><b>Records.</b>Who and what said what is known here:${people.map(id => `<span class="rec ${src(id).withdrawn ? 'wd' : ''}">${ic(srcIcon(id), 14)}<span><b>${esc(src(id).word)}</b>, ${src(id).type === 'person' ? esc(src(id).role) : 'in Artifacts'}, ${fmtDate(src(id).on)}${src(id).withdrawn ? '. Withdrawn; no longer counts' : ''}</span><span class="n">${count(id)}</span></span>`).join('')}</p>`;
  h2 += `<p><b>${esc(W('usedBy'))}.</b>${r.usedBy.intents.map(i => `<span class="it">${esc(i.word)}</span> (${esc(i.owner)}) reads its ${i.uses.map(k => esc(defOf(r, k).word.toLowerCase())).join(' and ')}`).join('; ')}.</p></div>`;
  $('#acct').innerHTML = h2; $('#acct').classList.toggle('tech', tech);
  keys([['T', 'technical names'], ['K', 'another kind'], ['R', 'replay']]);
}
function drawLines(animate) {
  const fig = $('#fig'), fb = fig.getBoundingClientRect(), em = $('.em', fig).getBoundingClientRect();
  const cx = em.left + em.width / 2 - fb.left, cy = em.top + em.height / 2 - fb.top, rr = em.width / 2;
  $('#lines').innerHTML = $$('.fm', fig).map(f => {
    const b = f.getBoundingClientRect(), x = (b.left + b.right) / 2 - fb.left, y = (b.top + b.bottom) / 2 - fb.top;
    const tx = x < cx ? b.right - fb.left + 6 : b.left - fb.left - 6, ty = y;
    const a = Math.atan2(ty - cy, tx - cx), sx = cx + Math.cos(a) * rr, sy = cy + Math.sin(a) * rr;
    const L = Math.hypot(tx - sx, ty - sy);
    return `<line class="${f.classList.contains('gap') ? 'gap' : ''}" x1="${sx}" y1="${sy}" x2="${tx}" y2="${ty}" style="stroke-dasharray:${f.classList.contains('gap') ? '3 3' : L};stroke-dashoffset:${animate && !f.classList.contains('gap') ? L : 0}"/>`;
  }).join('');
}
function demo() {
  clearTimers(); render(); drawLines(true);
  $('#wanted').classList.remove('lit');
  later(() => { $$('#lines line').forEach(l => l.style.strokeDashoffset = 0); }, ms('--motion-run'));
  later(() => $$('.fm').forEach((f, i) => later(() => f.classList.remove('pre'), i * ms('--motion-quick'))), ms('--motion-run') + ms('--motion-base'));
  later(() => $('#wanted').classList.add('lit'), ms('--motion-run') + ms('--motion-calm') * 2);
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') return demo();
  if (e.key === 'k' || e.key === 'K') { REC = (REC + 1) % DATA.records.length; return demo(); }
  if (e.key === 't' || e.key === 'T') { tech = !tech; render(); $$('.fm').forEach(f => f.classList.remove('pre')); drawLines(false); }
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { render(); $$('.fm').forEach(f => f.classList.remove('pre')); drawLines(false); }, 100); });
document.fonts.ready.then(demo);
</script>
</body>
</html>
