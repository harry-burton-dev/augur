<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record card · V5 · The honest form</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@COMMON_CSS*/
:root{
  --x-cell:calc(var(--space-5) - var(--space-1));                              /* 24: one comb cell, the size of one expected character */
  --x-margin-w:calc(var(--measure-rail) + var(--space-3));                     /* 252: the form's margin strip */
}
.main{padding:var(--edge) var(--space-6) var(--space-7);display:grid;grid-template-columns:minmax(0,1fr) var(--x-margin-w);grid-template-rows:auto minmax(0,1fr);column-gap:var(--space-5)}
@media (max-width:1400px){.main{padding-left:var(--space-5);padding-right:var(--space-5)}:root{--x-margin-w:calc(var(--measure-rail) - var(--space-4))}}
header{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:var(--space-3)}
header h1{margin:var(--space-1) 0 0;font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);color:var(--light);letter-spacing:var(--tracking-soft)}
header .form-no{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);text-align:right}
.form{min-height:0;overflow-y:auto;overflow-x:hidden;padding-left:var(--space-2);padding-right:var(--space-2);scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent;display:grid;grid-template-columns:1fr 1fr;align-items:start;column-gap:var(--space-5);border-top:2px solid var(--x-kept);padding-top:var(--space-3);transition:opacity var(--motion-base) var(--ease-out)}
.sec{break-inside:avoid;margin-bottom:var(--space-3)}
.sec h2{display:flex;gap:var(--space-2);align-items:baseline;margin:0 0 var(--space-2);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink)}
.sec h2 span{color:var(--x-kept)}
.f{display:grid;grid-template-columns:calc(var(--space-5) + var(--space-1)) calc(var(--space-8) + var(--space-2)) minmax(0,1fr);align-items:center;gap:var(--space-1) var(--space-2);padding:var(--space-1) var(--space-2);margin:0 calc(var(--space-2) * -1);border-radius:var(--radius-key);transition:background var(--motion-quick) var(--ease-standard),max-height var(--motion-base) var(--ease-out),opacity var(--motion-base) var(--ease-out)}
.f .n{font:400 var(--x-type-micro)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.f .lab{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:flex;justify-content:space-between;gap:var(--space-2)}
.f .lab .t{display:none;font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono)}
.tech .f .lab .t{display:inline}
.f .ans{grid-column:3;min-height:var(--target-sm);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset);font-size:var(--type-body);color:var(--ink);min-width:0}
.f .ans > span.txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .ans small{color:var(--ink-muted);font-size:var(--type-small)}
.f .ans .src{margin-left:auto;font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap;display:inline-flex;gap:var(--space-1);align-items:center}
/* the honest blank: the empty box keeps the shape of the answer it expects */
.f.gap .ans{border:1px dashed var(--x-gap-ink);background:var(--x-gap-fill);color:var(--ink-muted)}
.comb{display:inline-flex;gap:2px;align-items:center}
.comb i{display:inline-grid;place-items:center;width:var(--x-cell);height:var(--x-cell);border:1px solid var(--x-gap-ink);border-radius:2px;font:400 var(--x-type-micro)/1 var(--font-mono);font-style:normal;color:color-mix(in srgb,var(--ink-muted) 60%,transparent)}
.comb b{width:var(--space-2)}
.lineblank{flex:1;height:1px;border-bottom:1px dashed var(--x-gap-ink);align-self:flex-end;margin-bottom:var(--space-2)}
.slot{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small)}
.f.gap .who{grid-column:3;display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.f.gap .who .w{color:var(--x-disagree)}
.helper{grid-column:3;display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--motion-slow) var(--ease-out)}
.helper > div{overflow:hidden}
.f.on .helper{grid-template-rows:1fr}
.f.on{background:var(--surface-raised)}
.f.on .ans{border-color:var(--light)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);margin:var(--space-2) var(--space-2) var(--space-1) 0}
.btn.go{border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green)}
.f.disagree .ans{display:grid;grid-template-columns:1fr 1fr;padding:0;border-color:color-mix(in srgb,var(--x-disagree) 50%,transparent);background:none}
.f.disagree .ans > div{padding:var(--space-1) var(--space-2);min-width:0}
.f.disagree .ans > div + div{border-left:1px solid color-mix(in srgb,var(--x-disagree) 40%,transparent)}
.f.disagree .ans .src{margin:0;display:flex;overflow:hidden;min-width:0}
.f.disagree .ans .src .sw{overflow:hidden;text-overflow:ellipsis}
.f.withdrawn .ans .txt{color:var(--ink-muted)}
.f.reach .ans{background:none;border-style:solid;color:var(--ink-muted);font-size:var(--type-small)}
/* empty-only view: filled boxes fold to a thin line, still numbered */
.only .f.filled{max-height:var(--space-5);opacity:.5;overflow:hidden}
.only .f.filled .ans{display:none}
/* the margin strip: a tally of the boxes, as a form's office-use column */
.strip{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);border-left:1px solid var(--hairline);padding-left:var(--space-4);overflow:hidden}
.strip h2{margin:0;font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.ticks{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--space-1)}
.ticks button{height:var(--target-sm);display:grid;place-items:center;border-radius:var(--radius-key);border:1px solid var(--hairline);font:400 var(--x-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.ticks .filled{background:var(--surface-raised);color:var(--ink)}
.ticks .gap{border-style:dashed;border-color:var(--x-gap-ink)}
.ticks .disagree{border-color:var(--x-disagree);color:var(--x-disagree)}
.ticks .withdrawn{border-color:var(--x-withdrawn);color:var(--x-withdrawn)}
.ticks .on{box-shadow:0 0 0 var(--focus-ring) var(--light)}
.legend{display:grid;gap:var(--space-1);font-size:var(--type-small);color:var(--ink-muted)}
.legend b{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink);margin-right:var(--space-2)}
.rel{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rel b{font-weight:400;color:var(--ink)}
.rel .w{color:var(--x-disagree)}
.rel.wd b{color:var(--x-withdrawn)}
@media (max-height:840px){.f .ans{min-height:calc(var(--target-sm) - var(--space-1))}.f{padding:calc(var(--space-1) / 2) var(--space-2)}.sec{margin-bottom:var(--space-2)}}
@media (max-width:1400px){
  .f{grid-template-columns:var(--space-5) calc(var(--space-7) + var(--space-3)) minmax(0,1fr)}
  .f .ans .sw,.f .helper .who{display:none}
  :root{--x-cell:calc(var(--space-4) + var(--space-1))}
  .btn{height:calc(var(--target-sm) - var(--space-1));padding:0 var(--space-2);font-size:var(--type-small);margin-top:var(--space-1)}
  .f.disagree .ans .src{display:none}
}
@media (max-height:840px){.f .ans{min-height:calc(var(--target-sm) - var(--space-2))}.f .ans{font-size:var(--type-meta)}.sec h2{margin-bottom:var(--space-1)}}
@media (prefers-reduced-motion: reduce){.helper{transition:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Data Atlas"></nav>
  <main class="main" id="main">
    <header><div><div class="eyebrow" id="crumb"></div><h1 id="title"></h1></div><div class="form-no" id="formno"></div></header>
    <section class="form" id="form" aria-label="Record form"></section>
    <aside class="strip" id="strip" aria-label="Boxes on this form"></aside>
  </main>
</div>
<div class="keys" id="keys"></div>
<div class="x-cap"><b>Record card · V5</b> the honest form: every box the kind expects is drawn, and an empty box keeps the shape of its answer (date cells, letter cells, a slot for a kind of thing) · paper forms, comb fields, office-use margins</div>
<script>
/*@COMMON_JS*/

/* ====================================================================== V5: the form */
let cur = -1, tech = false, only = false, order = [];
const COMB = { date: [['D', 'D'], ['M', 'M'], ['Y', 'Y', 'Y', 'Y']], count: [['', '', '', '']], band: [['A', 'B', 'C', 'D', 'E', 'F', 'G']] };
function blank(r, d) {
  if (d.to) { const K = DATA.kinds[d.to]; return `<span class="slot">${ic(K.icon, 14)} pick ${/^[aeiou]/i.test(K.word) ? "an" : "a"} ${esc(K.word.toLowerCase())}</span><span class="lineblank"></span>`; }
  const c = COMB[d.type];
  if (c) return `<span class="comb">${c.map(g => g.map(x => `<i>${esc(x)}</i>`).join('')).join('<b></b>')}</span>`;
  if (d.type === 'money' || d.type === 'measure') return `<span>${esc(d.unit || '')}</span><span class="comb">${['', '', '', '', '', ''].map(() => '<i></i>').join('')}</span>`;
  return `<span class="lineblank"></span>`;
}
function field(r, k, n) {
  const st = stateOf(r, k), d = st.d, s = st.s;
  const lab = `<span class="n">${n}</span><span class="lab"><span>${esc(d.word)}</span><span class="t">${esc(d.tech)}</span></span>`;
  const srcs = o => `<span class="src" title="${esc(src(o.src).word)}">${ic(srcIcon(o.src), 12)} <span class="sw">${esc(src(o.src).word)}</span></span>`;
  let a = '', extra = '';
  if (s === 'filled') a = `<span class="txt">${st.obs.map(o => o.to ? esc(o.to) : show(o, d)).join(', ')}</span>${srcs(st.obs[0])}`;
  if (s === 'disagree') a = st.obs.map(o => `<div><span class="txt">${show(o, d)}</span>${srcs(o)}</div>`).join('');
  if (s === 'withdrawn') a = `<span class="txt struck">${show(st.obs[0], d)}</span><span class="tag withdrawn">withdrawn source</span>`;
  if (s === 'reach') a = `${ic('lock', 14)} kept on ${esc(floorW(d.reach.floor))}; ask ${esc(d.reach.ask)}`;
  if (s === 'gap') {
    const f = filler(r, d), u = usedFor(r, k);
    a = blank(r, d);
    extra = `<div class="who">${ic('user-round', 12)} ${esc(f.who)} could fill this${u.length ? ` <span class="w">· ${esc(u[0].word)} waits on it</span>` : ''}</div>
      <div class="helper"><div><button class="btn go">${ic('pencil-line', 14)} I know this</button><button class="btn">${ic('file-search', 14)} From a document</button><button class="btn">${ic('send', 14)} Ask ${esc(f.who.split(',')[0])}</button>
      <div class="who" style="color:var(--ink-muted)">${esc(f.hint)}. What you enter goes to Triage on ${esc(floorW(r.floor))} with its source; a lead accepts it.</div></div></div>`;
  }
  if (s === 'disagree') extra = `<div class="who" style="grid-column:3;font-size:var(--type-small);color:var(--x-disagree)">${ic('git-compare', 12)} Two answers on file. ${esc(floorW(r.floor))} leads decide.</div>`;
  return `<div class="f ${s}" data-k="${k}">${lab}<div class="ans">${a}</div>${extra}</div>`;
}
function render() {
  const r = rec(), K = kindOf(r), t = tally(r);
  document.documentElement.style.setProperty('--x-kept', floorC(r.floor));
  rail(r.kind);
  $('#crumb').textContent = `${DATA.app} · ${K.plural} · record form`;
  $('#title').textContent = r.name;
  $('#formno').innerHTML = `Form: ${esc(K.word)}${tech ? ` (${esc(K.tech.name)})` : ''} · ${t.total} boxes<br>${esc(W('kept'))} ${esc(floorW(r.floor))} · ${esc(r.id)}`;
  order = [];
  const secs = K.groups.map((g, gi) => `<div class="sec"><h2><span>${gi + 1}</span>${esc(g.word)}</h2>${g.items.map((k, i) => { order.push(k); return field(r, k, `${gi + 1}.${i + 1}`); }).join('')}</div>`);
  /* two columns, split where half the boxes are */
  let acc = 0, cut = K.groups.length; const half = order.length / 2;
  let best = 1e9; for (let i = 0; i < K.groups.length - 1; i++) { acc += K.groups[i].items.length; if (Math.abs(acc - half) < best) { best = Math.abs(acc - half); cut = i + 1; } }
  $('#form').innerHTML = `<div>${secs.slice(0, cut).join('')}</div><div>${secs.slice(cut).join('')}</div>`;
  $('#form').classList.toggle('tech', tech); $('#form').classList.toggle('only', only);
  $('#strip').innerHTML = `<h2>For office use · boxes</h2><div class="ticks">${order.map((k, i) => `<button class="${stateOf(r, k).s}" data-i="${i}" aria-label="${esc(defOf(r, k).word)}">${K.groups.findIndex(g => g.items.includes(k)) + 1}.${K.groups.find(g => g.items.includes(k)).items.indexOf(k) + 1}</button>`).join('')}</div>
    <div class="legend"><span><b>${t.filled}</b>filled and accepted</span><span><b>${t.gap}</b>empty, someone could fill</span><span><b>${t.disagree}</b>two answers on file</span><span><b>${t.withdrawn}</b>from a withdrawn document</span><span><b>${t.reach}</b>kept out of view</span></div>
    <h2>Relied on by</h2>${r.usedBy.intents.map(i => `<div class="rel">${ic('target', 14)}<span><b>${esc(i.word)}</b> · ${esc(i.owner)}${i.waits ? ` <span class="w">· waiting on an empty box</span>` : ''}</span></div>`).join('')}
    <h2>Attached</h2>${r.usedBy.documents.map(id => `<div class="rel ${src(id).withdrawn ? 'wd' : ''}">${ic(srcIcon(id), 14)}<span><b>${esc(src(id).word)}</b>${src(id).withdrawn ? ' · withdrawn' : ''}</span></div>`).join('')}`;
  $$('.f').forEach(f => f.addEventListener('click', () => go(order.indexOf(f.dataset.k))));
  $$('.ticks button').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
  keys([['N', 'next empty box'], ['↑ ↓', 'box'], ['E', only ? 'show all boxes' : 'empty boxes only'], ['T', 'technical names'], ['K', 'another kind'], ['R', 'replay']]);
}
function go(i) {
  cur = i;
  $$('.f').forEach((f, j) => f.classList.toggle('on', j === i));
  $$('.ticks button').forEach((b, j) => b.classList.toggle('on', j === i));
  if (i >= 0) $$('.f')[i].scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' });
}
const nextGap = () => { const r = rec(); for (let j = 1; j <= order.length; j++) { const i = (cur + j) % order.length; if (stateOf(r, order[i]).s === 'gap') return go(i); } };
function demo() {
  clearTimers(); cur = -1; only = false; render();
  later(() => { const i = order.indexOf(DATA.demo.detail); go(i >= 0 ? i : 0); if (i < 0) nextGap(); }, ms('--motion-run'));
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') return demo();
  if (k === 'k') { REC = (REC + 1) % DATA.records.length; return demo(); }
  if (k === 't') { tech = !tech; const c = cur; render(); return go(c); }
  if (k === 'e') { only = !only; const c = cur; render(); return go(c); }
  if (k === 'n') return nextGap();
  if (e.key === 'Escape') return go(-1);
  if (e.key === 'ArrowDown') { e.preventDefault(); go(Math.min(order.length - 1, cur + 1)); }
  if (e.key === 'ArrowUp') { e.preventDefault(); go(Math.max(0, cur - 1)); }
});
document.fonts.ready.then(demo);
</script>
</body>
</html>
