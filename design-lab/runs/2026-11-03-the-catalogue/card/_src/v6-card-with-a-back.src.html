<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record card · V6 · A card with a back</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@COMMON_CSS*/
:root{
  --x-row:var(--space-5);                                                      /* 28: one row, shared by front and back so they line up */
  --x-perspective:calc(var(--measure-wide) * 2);                               /* 1840: the turn's depth */
}
@media (max-height:840px){:root{--x-row:calc(var(--space-5) - var(--space-1))}.ft .ln:nth-child(n+4){display:none}}
.main{padding:var(--edge) var(--space-6) var(--space-7);display:flex;flex-direction:column}
@media (max-width:1400px){.main{padding-left:var(--space-5);padding-right:var(--space-5)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)}
.who{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.who b{font-weight:400;color:var(--ink)}
.spread{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;perspective:var(--x-perspective)}
.face{position:relative;min-width:0;border:1px solid var(--hairline-strong);background:color-mix(in srgb,var(--slate) 88%,var(--ink) 4%);box-shadow:var(--shadow-raised);padding:var(--space-4) var(--space-4) var(--space-3);display:flex;flex-direction:column;overflow:hidden}
.front{border-radius:var(--radius-inset) 0 0 var(--radius-inset);border-right-color:var(--hairline)}
.front::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--x-kept)}
/* the back: same rows, technical names, a quieter ground */
.back{border-radius:0 var(--radius-inset) var(--radius-inset) 0;background:color-mix(in srgb,var(--slate-deep) 92%,var(--ink) 3%);transform-origin:left center;transform:rotateY(0);backface-visibility:hidden;transition:transform var(--motion-run) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.back.shut{transform:rotateY(-178deg);opacity:0}
.fold{position:absolute;left:50%;top:0;bottom:0;width:var(--space-5);transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--shade) 30%,transparent) 50%,transparent);transition:opacity var(--motion-calm) var(--ease-out)}
.shut ~ .fold,.fold.off{opacity:0}
/* a closed card shows the corner you can lift */
.corner{position:absolute;right:calc(50% + var(--space-3));bottom:var(--space-3);display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted);opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.corner.on{opacity:1}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;height:calc(var(--space-7) + var(--space-3));overflow:hidden;flex:none;padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.front .hd h1{margin:0;font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .hd .s{font-size:var(--type-small);color:var(--ink-muted)}
.back .hd{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.back .hd b{display:block;font:400 var(--type-meta)/var(--leading-meta) var(--font-mono);color:var(--ink)}
.rows{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.g{height:calc(var(--space-4) + var(--space-1));display:flex;align-items:flex-end;font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding-bottom:var(--space-1)}
.back .g{letter-spacing:0;text-transform:none}
.r{display:grid;align-items:center;height:var(--x-row);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);min-width:0;transition:background var(--motion-quick) var(--ease-standard)}
.r.on{background:var(--surface-raised)}
.front .r{grid-template-columns:calc(var(--space-8) + var(--space-3)) minmax(0,1fr) auto;gap:var(--space-3)}
.front .r .w{color:var(--ink-muted);font-size:var(--type-small);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .r .v{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .r .v small{color:var(--ink-muted)}
.front .r .v .or{color:var(--x-disagree);margin:0 var(--space-2)}
.front .r.gap .v{font-style:italic;color:var(--ink-muted);padding:0 var(--space-2);height:calc(var(--x-row) - var(--space-2));display:flex;align-items:center;font-size:var(--type-small)}
.front .r.reach .v,.front .r.withdrawn .v{color:var(--ink-muted)}
.back .r{grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) calc(var(--space-6) + var(--space-1)) minmax(0,1.2fr);gap:var(--space-3);font:400 var(--x-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.back .r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back .r .p{color:var(--ink)}
.back .r .x.req{color:var(--ink)}
.back .r.gap .a{color:var(--ink)}
.back .r.disagree .a{color:var(--x-disagree)}
.back .r.withdrawn .a{color:var(--x-withdrawn)}
.colh{flex:none;height:calc(var(--space-5) - var(--space-1));align-items:end}
.front .colh{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-3)) minmax(0,1fr);gap:var(--space-3);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.back .colh{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) calc(var(--space-6) + var(--space-1)) minmax(0,1.2fr);gap:var(--space-3);font:400 var(--x-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.ft{flex:none;padding-top:var(--space-2);border-top:1px solid var(--hairline-strong);display:grid;gap:2px;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);height:calc(var(--space-8) - var(--space-1));overflow:hidden}
.ft b{font-weight:400;color:var(--ink)}
.ft .ln{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft .ln span{overflow:hidden;text-overflow:ellipsis}
.ft .w{color:var(--x-disagree)}
.back .ft{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono)}
.ctl{display:flex;align-items:center;gap:var(--space-2)}
.btn.s{height:calc(var(--target-sm) - var(--space-2))}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font:400 var(--type-small)/1 var(--font-sans);color:var(--ink)}
.btn[aria-disabled="true"]{border-style:dashed;color:var(--ink-muted);cursor:help}
.btn.go{border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green)}
.ctl .why{font:400 var(--type-small)/var(--leading-small) var(--font-sans);color:var(--ink-muted)}
@media (prefers-reduced-motion: reduce){.back{transition:opacity var(--motion-base) linear}.back.shut{transform:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Data Atlas"></nav>
  <main class="main" id="main">
    <div class="top"><div class="eyebrow" id="crumb"></div><div class="who" id="who"></div></div>
    <div class="spread" id="spread">
      <article class="face front" id="front" aria-label="Front: for everyone"></article>
      <article class="face back shut" id="back" aria-label="Back: technical names, for admins"></article>
      <div class="fold off" id="fold"></div>
      <div class="corner" id="corner"></div>
    </div>
  </main>
</div>
<div class="keys" id="keys"></div>
<div class="x-cap"><b>Record card · V6</b> a card with a back: the front in plain words for operators, the back in technical names for admins, row for row, opened like a folded card · index cards, museum catalogue cards with accession data on the reverse, OWL/SHACL</div>
<script>
/*@COMMON_JS*/

/* ====================================================================== V6: front and back */
let open = false, cur = -1, admin = false, keysList = [];
const DT = { text: 'xsd:string', date: 'xsd:date', count: 'xsd:nonNegativeInteger', measure: 'xsd:decimal', money: 'xsd:decimal', band: 'xsd:token' };
const card = d => d.key ? '1' : d.many ? '0..*' : '0..1';
function front(r) {
  const K = kindOf(r), t = tally(r);
  let h = `<div class="hd"><div><div class="eyebrow">${esc(K.word)} · front</div><h1>${esc(r.name)}</h1><div class="s">${esc(K.says)}</div></div><div class="s"><span class="fdot" style="background:${floorC(r.floor)}"></span> ${esc(W('kept'))} ${esc(floorW(r.floor))} · ${t.filled}/${t.total}</div></div><div class="colh"><span>detail</span><span>what is known</span></div><div class="rows" data-side="front">`;
  K.groups.forEach(g => {
    h += `<div class="g">${esc(g.word)}</div>`;
    g.items.forEach(k => {
      const st = stateOf(r, k), d = st.d; let v = '', m = '';
      if (st.s === 'filled') v = st.obs.map(o => o.to ? esc(o.to) : show(o, d)).join(', ');
      if (st.s === 'disagree') { v = st.obs.map(o => `${show(o, d)} <small>${esc(src(o.src).word.split(',')[0])}</small>`).join('<span class="or">or</span>'); m = `<span class="tag disagree">disagree</span>`; }
      if (st.s === 'withdrawn') { v = `<span class="struck">${show(st.obs[0], d)}</span>`; m = `<span class="tag withdrawn">withdrawn</span>`; }
      if (st.s === 'gap') { v = `${esc(filler(r, d).who)} could fill this`; m = `<span class="tag gap">not known yet</span>`; }
      if (st.s === 'reach') { v = `${ic('lock', 12)} kept on ${esc(floorW(d.reach.floor))} · ask ${esc(d.reach.ask)}`; }
      h += `<div class="r ${st.s}" data-k="${k}"><span class="w">${esc(d.word)}</span><span class="v ${st.s === 'gap' ? 'gapbox' : ''}">${v}</span>${m}</div>`;
    });
  });
  h += `</div><div class="ft"><div class="micro">${esc(W('usedBy'))}</div>${r.usedBy.intents.map(i => `<div class="ln">${ic('target', 14)}<span><b>${esc(i.word)}</b> · ${esc(i.owner)}${i.waits ? ' <span class="w">· waiting on a gap</span>' : ''}</span></div>`).join('')}<div class="ln">${ic('files', 14)}<span>Read from ${r.usedBy.documents.length} documents in Artifacts${r.usedBy.documents.some(id => src(id).withdrawn) ? ', one withdrawn' : ''}</span></div></div>`;
  return h;
}
function back(r) {
  const K = kindOf(r);
  let h = `<div class="hd"><div><div class="eyebrow">class · back</div><b>${esc(K.tech.name)}</b>${esc(K.tech.iri)}<br>pack ${esc(K.tech.pack)} · ontology v14 · ${esc(r.id)} · workspace ${esc(r.floor)}:${esc(floorW(r.floor).toLowerCase().replace(/\W+/g, '-'))}</div></div>
    <div class="colh"><span>property</span><span>range</span><span>card.</span><span>assertions</span></div><div class="rows" data-side="back">`;
  K.groups.forEach(g => {
    h += `<div class="g">group: ${esc(g.word.toLowerCase().replace(/\W+/g, '_'))}</div>`;
    g.items.forEach(k => {
      const st = stateOf(r, k), d = st.d, obs = r.known[k] || [];
      const range = d.to ? `→ ${DATA.kinds[d.to].word}` : DT[d.type];
      let a = '';
      if (st.s === 'filled') a = obs.every(o => o.accepted) ? `${obs.length} obs · fact ✓` : `${obs.length} obs`;
      if (st.s === 'disagree') a = `${obs.length} obs ⟂ · no fact`;
      if (st.s === 'withdrawn') a = `${obs.length} obs · retracted`;
      if (st.s === 'gap') a = `0 · expected (minCount 1) · fill: ${(d.fill?.floor) || r.floor}`;
      if (st.s === 'reach') a = `kept: ${d.reach.floor} · 403`;
      const g2 = obs.find(o => o.grade)?.grade;
      h += `<div class="r ${st.s}" data-k="${k}"><span class="p">${esc(d.tech)}</span><span>${esc(range)}</span><span class="x ${d.key ? 'req' : ''}">${card(d)}${d.key ? ' key' : ''}</span><span class="a">${esc(a)}${g2 ? ' · ' + esc(g2) : ''}</span></div>`;
    });
  });
  h += `</div><div class="ft"><div class="micro">events and bindings</div><div class="ln">${ic('radio-tower', 14)}<span>mandate.intent.entity-bound × ${r.usedBy.intents.length} · roles: ${r.usedBy.intents.map(i => i.uses[0]).join(', ')}</span></div><div class="ln">${ic('file-x', 14)}<span>folio.document.withdrawn · ${esc(r.usedBy.documents.filter(id => src(id).withdrawn).join(', ') || 'none')}</span></div>
    <div class="ctl">${admin ? `<button class="btn s go">${ic('pencil-ruler', 14)} Change this kind in the studio</button><button class="btn s">${ic('download', 14)} OWL</button>` : `<button class="btn s" aria-disabled="true">${ic('lock', 14)} Change this kind</button><span class="why">Only Data Atlas admins can change the back. Ask ${esc(DATA.admin.name)}.</span>`}</div></div>`;
  return h;
}
function render() {
  const r = rec();
  document.documentElement.style.setProperty('--x-kept', floorC(r.floor));
  rail(r.kind);
  $('#crumb').textContent = `${DATA.app} · ${kindOf(r).plural} · ${r.name}`;
  $('#who').innerHTML = `${ic('user-round', 14)} Viewing as <b>${esc(admin ? DATA.admin.name : DATA.viewer.name)}</b> · ${admin ? esc(DATA.admin.role) : 'operator, ' + esc(floorW(DATA.viewer.floor))} <span class="kbd">A</span>`;
  $('#front').innerHTML = front(r);
  $('#back').innerHTML = back(r);
  $('#corner').innerHTML = `${ic('book-open', 14)} <span class="kbd">B</span> turn over: the same card in technical names, for admins`;
  $$('.r').forEach(x => x.addEventListener('mouseenter', () => hi(x.dataset.k)));
  syncScroll();
  setOpen(open, true);
}
function hi(k) {
  $$('.r').forEach(x => x.classList.toggle('on', x.dataset.k === k)); cur = allKeys(rec()).indexOf(k);
  const f = $(`.front .r[data-k="${k}"]`); if (f) f.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' });
}
/* front and back scroll together, so a row always faces its row */
function syncScroll() {
  const [a, b] = $$('.rows'); let lock = false;
  const tie = (x, y) => x.addEventListener('scroll', () => { if (lock) return; lock = true; y.scrollTop = x.scrollTop; requestAnimationFrame(() => lock = false); });
  tie(a, b); tie(b, a);
}
function setOpen(v, quiet) {
  open = v;
  $('#back').classList.toggle('shut', !v); $('#fold').classList.toggle('off', !v); $('#corner').classList.toggle('on', !v);
  keys([['B', open ? 'close the back' : 'turn over'], ['↑ ↓', 'row on both sides'], ['A', admin ? 'view as operator' : 'view as admin'], ['K', 'another kind'], ['R', 'replay']]);
}
function demo() {
  clearTimers(); open = false; cur = -1; render();
  later(() => setOpen(true), ms('--motion-run'));
  later(() => hi(DATA.demo.detail), ms('--motion-run') * 2 + ms('--motion-base'));
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') return demo();
  if (k === 'k') { REC = (REC + 1) % DATA.records.length; return demo(); }
  if (k === 'b') return setOpen(!open);
  if (k === 'a') { admin = !admin; const c = cur; render(); if (c >= 0) hi(allKeys(rec())[c]); return; }
  const ks = allKeys(rec());
  if (e.key === 'ArrowDown') { e.preventDefault(); hi(ks[Math.min(ks.length - 1, cur + 1)]); }
  if (e.key === 'ArrowUp') { e.preventDefault(); hi(ks[Math.max(0, cur - 1)]); }
});
document.fonts.ready.then(demo);
</script>
</body>
</html>
