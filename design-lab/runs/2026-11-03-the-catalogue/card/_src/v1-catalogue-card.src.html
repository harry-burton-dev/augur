<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record card · V1 · Catalogue card</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@COMMON_CSS*/
:root{
  --x-rule:calc(var(--space-5) + var(--space-1));                              /* 32: one ruled line of the card */
  --x-margin:calc(var(--space-8) + var(--space-5));                            /* 144: the card's left margin, where the call mark sits */
  --x-slip-w:calc(var(--measure-rail) + var(--space-5));                       /* 268: the pocket slip */
}
@media (max-height:840px){:root{--x-rule:calc(var(--space-5) - var(--space-1))}}
@media (max-width:1400px){.main{padding-left:var(--space-5);padding-right:var(--space-5)}:root{--x-margin:calc(var(--space-8) + var(--space-3))}}
.main{padding:var(--edge) var(--space-6) var(--space-7) var(--space-6);display:flex;flex-direction:column}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:var(--space-4)}
.top .drawer{display:flex;align-items:center;gap:var(--space-3);color:var(--ink-muted);font-size:var(--type-meta)}
.top .drawer .lbl{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink)}
.desk{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--x-slip-w);gap:0;align-items:start}
/* the stack behind: other cards in the drawer, edges only */
.stack{position:absolute;left:var(--space-2);right:calc(var(--x-slip-w) + var(--space-2));top:calc(var(--space-2) * -1);height:var(--space-4);border:1px solid var(--hairline);border-bottom:0;border-radius:var(--radius-inset) var(--radius-inset) 0 0;background:color-mix(in srgb,var(--surface-raised) 50%,transparent)}
.stack.b{left:var(--space-4);right:calc(var(--x-slip-w) + var(--space-4));top:calc(var(--space-4) * -1);opacity:.6}
.card{position:relative;z-index:2;background:color-mix(in srgb,var(--slate) 88%,var(--ink) 4%);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-raised);padding:var(--space-4) var(--space-5) var(--space-5) 0;transition:transform var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.card.pre{transform:translateY(var(--travel-floor));opacity:0}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:var(--radius-inset) var(--radius-inset) 0 0;background:var(--x-kept)}
.card .hole{position:absolute;left:50%;bottom:var(--space-2);width:var(--space-4);height:var(--space-4);margin-left:calc(var(--space-2) * -1);border-radius:50%;background:var(--slate-deep);box-shadow:inset 0 1px 2px var(--shade)}
.head{display:grid;grid-template-columns:var(--x-margin) minmax(0,1fr) auto;align-items:start;padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.call{padding-left:var(--space-5);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink);letter-spacing:var(--tracking-soft)}
.call span{display:block}
.call span:first-child{color:var(--x-kept)}
.head h1{margin:0;font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--light);letter-spacing:var(--tracking-soft)}
.head .sub{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.head .kept{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
/* ruled lines: one per detail the kind holds, in the kind's own order */
.lines{position:relative}
.grp{display:grid;grid-template-columns:var(--x-margin) minmax(0,1fr);align-items:center;height:calc(var(--x-rule) * .8);color:var(--ink-muted)}
.grp span:last-child{font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}
.ln{display:grid;grid-template-columns:var(--x-margin) minmax(0,1fr) auto;align-items:center;width:100%;height:var(--x-rule);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta);transition:background var(--motion-quick) var(--ease-standard)}
.ln:hover{background:color-mix(in srgb,var(--surface-raised) 60%,transparent)}
.ln.on{background:var(--surface-raised)}
.ln .w{padding-left:var(--space-5);font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .w .t{display:none;font-family:var(--font-mono);font-size:var(--x-type-micro)}
.tech .ln .w .p{display:none}.tech .ln .w .t{display:inline}
.ln .v{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.ln .v small{color:var(--ink-muted)}
.ln .v sup,.trc sup{font:400 var(--x-type-micro)/0 var(--font-mono);color:var(--ink-muted);margin-left:2px}
.ln .v .or{color:var(--x-disagree);margin:0 var(--space-2)}
.ln .r{display:flex;gap:var(--space-2);align-items:center;padding-left:var(--space-3)}
/* a gap: the ruled line stays, empty, with a pencilled note of who could fill it */
.ln.gap .v{display:flex;align-items:center;gap:var(--space-2);height:calc(var(--x-rule) - var(--space-2));padding:0 var(--space-2)}
.ln.gap .v em{font-style:italic;color:var(--ink-muted);font-size:var(--type-small);opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.ln.gap .v em.in{opacity:1}
.ln.reach .v{color:var(--ink-muted);font-size:var(--type-small);display:flex;gap:var(--space-2);align-items:center}
.ln.withdrawn .v{color:var(--ink-muted)}
/* tracings: the links, numbered as a catalogue card numbers its added entries */
.trc{display:grid;grid-template-columns:var(--x-margin) minmax(0,1fr);padding-top:var(--space-3);font-size:var(--type-small);line-height:var(--leading-meta);color:var(--ink-muted)}
.trc ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:0 var(--space-4)}
.trc li b{font-weight:400;color:var(--ink)}
.trc li.gap b{border-bottom:1px dashed var(--x-gap-ink);color:var(--ink-muted);font-style:italic}
.refs{display:grid;grid-template-columns:var(--x-margin) minmax(0,1fr);padding-top:var(--space-2);font-size:var(--x-type-micro);line-height:var(--leading-small);color:var(--ink-muted)}
.refs ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:0 var(--space-4)}
.refs li .n{font-family:var(--font-mono);color:var(--ink)}
.refs li.wd{color:var(--x-withdrawn)}
/* the pocket slip: Used by, as a library slip of stamps */
.slip{position:relative;z-index:1;margin-top:var(--space-6);margin-left:calc(var(--space-4) * -1);padding:var(--space-4) var(--space-4) var(--space-4) var(--space-5);background:var(--surface-inset);border:1px solid var(--hairline);border-left:0;border-radius:0 var(--radius-inset) var(--radius-inset) 0;transition:transform var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.slip.pre{transform:translateX(calc(var(--space-6) * -1));opacity:0}
.slip h2{margin:0 0 var(--space-2);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.stamp{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);padding:var(--space-2) 0;border-bottom:1px dashed var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.stamp:last-of-type{border-bottom:0}
.stamp b{display:block;font-weight:400;color:var(--ink)}
.stamp .m{color:var(--ink-muted)}
.stamp .waits{color:var(--x-disagree)}
.stamp.doc .m.wd{color:var(--x-withdrawn)}
/* the index note: what one line rests on, opened over the slip */
.note{position:absolute;right:0;top:0;width:var(--x-slip-w);z-index:3;padding:var(--space-4);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));-webkit-backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);opacity:0;transform:translateY(var(--space-2));pointer-events:none;transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out)}
.note.on{opacity:1;transform:none;pointer-events:auto}
.note h3{margin:var(--space-1) 0 var(--space-2);font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.note p{margin:0 0 var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.note p.m{color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.obs{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.obs b{font-weight:400;color:var(--ink);display:block}
.obs .m{color:var(--ink-muted)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);margin:var(--space-2) var(--space-2) 0 0}
.btn.go{border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green)}
@media (prefers-reduced-motion: reduce){
  .card.pre,.slip.pre{transform:none}
  .note{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Data Atlas"></nav>
  <main class="main" id="main">
    <div class="top">
      <div class="drawer"><span class="lbl" id="drawer"></span><span id="drawersub"></span></div>
      <div class="micro" id="techhint"></div>
    </div>
    <div class="desk" id="desk">
      <div class="stack b"></div><div class="stack"></div>
      <article class="card pre" id="card" aria-label="Record card"></article>
      <aside class="slip pre" id="slip" aria-label="Used by"></aside>
      <div class="note" id="note" role="dialog" aria-live="polite"></div>
    </div>
  </main>
</div>
<div class="keys" id="keys"></div>
<div class="x-cap"><b>Record card · V1</b> catalogue card: one fixed shape, ruled lines for every detail, tracings for links, a pocket slip for Used by · library unit card, ISBD, Dewey</div>
<script>
/*@COMMON_JS*/

/* ====================================================================== V1: the catalogue card */
let cur = -1, tech = false, lines = [];
function callMark(r) {
  const K = kindOf(r), g = r.known.inRegion?.[0]?.to || r.known.withSupplier?.[0]?.to || '';
  const yr = (r.since || '').slice(0, 4);
  return [K.word.toUpperCase(), g.toUpperCase(), floorW(r.floor).toUpperCase(), yr];
}
function render() {
  const r = rec(), K = kindOf(r);
  document.documentElement.style.setProperty('--x-kept', floorC(r.floor));
  rail(r.kind);
  $('#drawer').innerHTML = `${ic(K.icon, 14)} ${esc(K.plural)}`;
  $('#drawersub').textContent = `card ${DATA.records.indexOf(r) + 1} of ${K.count} in this drawer`;
  $('#techhint').innerHTML = `<span class="kbd">T</span> ${tech ? 'plain words' : 'technical names, for admins'}`;
  /* numbered sources, in the order they first appear */
  const refs = [];
  const ref = id => { let i = refs.indexOf(id); if (i < 0) { refs.push(id); i = refs.length - 1; } return i + 1; };
  const t = tally(r);
  let html = `<div class="head"><div class="call" aria-label="Call mark">${callMark(r).map(s => `<span>${esc(s)}</span>`).join('')}</div>
    <div><h1>${esc(r.name)}</h1><div class="sub">${esc(K.says)}</div></div>
    <div class="kept"><span class="fdot" style="background:${floorC(r.floor)}"></span>${esc(W('kept'))} ${esc(floorW(r.floor))} · ${t.filled} of ${t.total} known</div></div><div class="lines" id="lines">`;
  lines = [];
  const trac = [];
  K.groups.forEach(g => {
    const det = g.items.filter(k => !isLink(r, k) || k === 'inRegion');
    const lk = g.items.filter(k => isLink(r, k) && k !== 'inRegion');
    lk.forEach(k => trac.push(k));
    if (!det.length) return;
    html += `<div class="grp"><span></span><span>${esc(g.word)}</span></div>`;
    det.forEach(k => {
      const st = stateOf(r, k), d = st.d; lines.push(k);
      const w = `<span class="p">${esc(d.word)}</span><span class="t">${esc(d.tech)}</span>`;
      let v = '', rr = '';
      if (st.s === 'filled') v = st.obs.map(o => `${show(o, d)}<sup>${ref(o.src)}</sup>`).join(d.many ? '; ' : ' ');
      if (st.s === 'disagree') { v = st.obs.map(o => `${show(o, d)}<sup>${ref(o.src)}</sup>`).join('<span class="or">or</span>'); rr = `<span class="tag disagree">${ic('git-compare', 12)} ${esc(W('disagree'))}</span>`; }
      if (st.s === 'withdrawn') { v = st.obs.map(o => `<span class="struck">${show(o, d)}</span><sup>${ref(o.src)}</sup>`).join(' '); rr = `<span class="tag withdrawn">${ic('file-x', 12)} source withdrawn</span>`; }
      if (st.s === 'gap') { const f = filler(r, d); v = `<em>${esc(f.who)} could fill this · ${esc(f.hint)}</em>`; rr = `<span class="tag gap">${ic('circle-dashed', 12)} ${esc(W('gap'))}</span>`; }
      if (st.s === 'reach') { v = `${ic('lock', 14)} Kept on the ${esc(floorW(d.reach.floor))} floor · ask ${esc(d.reach.ask)}`; rr = `<span class="tag reach">out of view</span>`; }
      html += `<button class="ln ${st.s}" data-k="${k}"><span class="w">${w}</span><span class="v ${st.s === 'gap' ? 'gapbox' : ''}">${v}</span><span class="r">${rr}</span></button>`;
    });
  });
  html += `</div><div class="trc"><span class="micro" style="padding-left:var(--space-5)">Links</span><ol>${trac.map((k, i) => {
    const st = stateOf(r, k), d = st.d;
    if (st.s === 'gap') return `<li class="gap">${['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'][i]}. ${esc(d.word)} <b>${esc(filler(r, d).who)} could say</b></li>`;
    return `<li>${['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'][i]}. ${esc(tech ? d.tech : d.word)} <b>${st.obs.map(o => esc(o.to)).join(', ')}</b><sup>${ref(st.obs[0].src)}</sup></li>`;
  }).join('')}</ol></div>
  <div class="refs"><span class="micro" style="padding-left:var(--space-5)">Sources</span><ol>${refs.map((id, i) => `<li class="${src(id).withdrawn ? 'wd' : ''}"><span class="n">${i + 1}</span> ${esc(src(id).word)}${src(id).withdrawn ? ' (withdrawn)' : ''}</li>`).join('')}</ol></div>
  <span class="hole" aria-hidden="true"></span>`;
  const card = $('#card'); card.innerHTML = html; card.classList.toggle('tech', tech);
  /* the pocket slip: Used by */
  $('#slip').innerHTML = `<h2>${esc(W('usedBy'))}</h2>${r.usedBy.intents.map(i => `<div class="stamp">${ic('target', 14)}<div><b>${esc(i.word)}</b><span class="m">${esc(i.owner)} · ${esc(floorW(i.floor))} · reads ${i.uses.map(k => esc(defOf(r, k).word.toLowerCase())).join(', ')}</span>${i.waits ? `<span class="waits"><br>waits on a detail not known yet</span>` : ''}</div></div>`).join('')}
    <h2 style="margin-top:var(--space-4)">Read from</h2>${r.usedBy.documents.map(id => `<div class="stamp doc">${ic(srcIcon(id), 14)}<div><b>${esc(src(id).word)}</b><span class="m ${src(id).withdrawn ? 'wd' : ''}">${src(id).withdrawn ? 'withdrawn ' + fmtDate(src(id).withdrawn.on) + ', no longer counts' : esc(srcWhere(id))}</span></div></div>`).join('')}`;
  $$('.ln').forEach(b => b.addEventListener('click', () => open(lines.indexOf(b.dataset.k))));
  keys([['↑ ↓', 'line'], ['Enter', 'what it rests on'], ['Esc', 'close'], ['T', 'technical names'], ['K', 'another kind'], ['R', 'replay']]);
}
function open(i) {
  cur = i; const r = rec(), k = lines[i];
  $$('.ln').forEach((b, j) => b.classList.toggle('on', j === i));
  if (i < 0) { $('#note').classList.remove('on'); return; }
  const st = stateOf(r, k), d = st.d, b = $$('.ln')[i];
  b.focus({ preventScroll: true });
  const top = b.offsetTop + $('#card').offsetTop - $('#desk').offsetTop;
  let h = `<div class="micro">${esc(d.word)} · <span style="text-transform:none">${esc(d.tech)}</span></div>`;
  if (st.s === 'gap') {
    const f = filler(r, d), u = usedFor(r, k);
    h += `<h3>Nobody has said yet</h3><p>A ${esc(kindOf(r).word.toLowerCase())} is expected to have this. <b>${esc(f.who)}</b> (${esc(floorW(f.floor))}) could fill it: ${esc(f.hint)}.</p>
      ${u.length ? `<p class="m">${u.map(x => `"${esc(x.word)}"`).join(', ')} is waiting on it.</p>` : ''}
      <p class="m">What you propose goes to Triage on ${esc(floorW(r.floor))}; a lead there accepts it.</p>
      <button class="btn go">${ic('pencil-line', 14)} Propose a value</button><button class="btn">${ic('send', 14)} Ask ${esc(f.who.split(',')[0])}</button>`;
  } else if (st.s === 'reach') {
    h += `<h3>Out of view from here</h3><p>${esc(d.reach.why)}</p><p class="m">Ask ${esc(d.reach.ask)} if you need it.</p>`;
  } else {
    h += `<h3>${st.s === 'disagree' ? 'Two sources, two answers' : st.s === 'withdrawn' ? 'Known only from a withdrawn document' : 'Where it came from'}</h3>`;
    h += st.obs.map(o => { const s = src(o.src); return `<div class="obs">${ic(srcIcon(o.src), 14)}<div><b>${show(o, d)} · ${esc(s.word)}</b><span class="m">${esc(srcWhere(o.src))}${o.note ? ' · ' + esc(o.note) : ''}${o.accepted ? ' · accepted' : ''}${s.withdrawn ? `<br><span style="color:var(--x-withdrawn)">Withdrawn ${fmtDate(s.withdrawn.on)} by ${esc(s.withdrawn.by)}. ${esc(s.withdrawn.why)}</span>` : ''}</span></div></div>`; }).join('');
    if (st.s === 'disagree') h += `<p class="m">Neither is accepted yet. ${esc(floorW(r.floor))} leads decide; until then both show.</p>`;
  }
  $('#note').innerHTML = h;
  $('#note').style.top = Math.max(0, Math.min(top - 40, $('#desk').clientHeight - $('#note').offsetHeight)) + 'px';
  $('#note').classList.add('on');
}
function demo() {
  clearTimers(); open(-1);
  render();
  $('#card').classList.add('pre'); $('#slip').classList.add('pre');
  $$('.ln.gap .v em').forEach(e => e.classList.remove('in'));
  later(() => $('#card').classList.remove('pre'), ms('--motion-run'));
  later(() => $('#slip').classList.remove('pre'), ms('--motion-run') + ms('--motion-base'));
  later(() => $$('.ln.gap .v em').forEach((e, i) => later(() => e.classList.add('in'), i * ms('--motion-base'))), ms('--motion-run') + ms('--motion-calm'));
  later(() => { const i = lines.indexOf(DATA.demo.detail); if (i >= 0) open(i); }, ms('--motion-run') + ms('--motion-calm') * 2);
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') return demo();
  if (e.key === 'k' || e.key === 'K') { REC = (REC + 1) % DATA.records.length; return demo(); }
  if (e.key === 't' || e.key === 'T') { tech = !tech; const c = cur; render(); $$('.ln.gap .v em').forEach(e => e.classList.add('in')); $('#card').classList.remove('pre'); $('#slip').classList.remove('pre'); if (c >= 0) open(c); return; }
  if (e.key === 'Escape') return open(-1);
  if (e.key === 'ArrowDown') { e.preventDefault(); open(Math.min(lines.length - 1, cur + 1)); }
  if (e.key === 'ArrowUp') { e.preventDefault(); open(Math.max(0, cur - 1)); }
});
document.fonts.ready.then(demo);
</script>
</body>
</html>
