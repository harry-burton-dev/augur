<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record card · V4 · Specimen label</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@COMMON_CSS*/
:root{
  --x-tilt:-1.2deg;                                                            /* --slip-tilt: a pinned determination slip sits slightly off true, so it reads as added */
}
.main{padding:var(--edge) var(--space-6) var(--space-7);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);column-gap:var(--space-6)}
@media (max-width:1400px){.main{padding-left:var(--space-5);padding-right:var(--space-5);column-gap:var(--space-5)}}
.tray{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.tray .top{display:flex;justify-content:space-between;align-items:flex-end}
.tray .top h1{margin:var(--space-1) 0 0;font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);color:var(--light);letter-spacing:var(--tracking-soft)}
/* the label: fixed boxes every record of this kind shares */
.label{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:dense;border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:color-mix(in srgb,var(--slate) 85%,var(--ink) 4%);box-shadow:var(--shadow-raised);position:relative}
.label::before{content:"";position:absolute;inset:var(--space-1);border:1px solid var(--hairline);border-radius:2px;pointer-events:none}
.bx{position:relative;padding:var(--space-2) var(--space-3);border-right:1px solid var(--hairline);border-bottom:1px solid var(--hairline);min-height:calc(var(--space-7) - var(--space-2));min-width:0}
.bx.w2{grid-column:span 2}.bx.w4{grid-column:span 4}.bx.w3{grid-column:span 3}
.bx .c{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);display:flex;justify-content:space-between;gap:var(--space-2)}
.bx .c{flex-wrap:wrap}
.bx .c .t{display:none;text-transform:none;letter-spacing:0;color:var(--ink)}
.tech .bx .c .t{display:inline}
.bx .v{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink)}
.bx .v small{color:var(--ink-muted);font-size:var(--type-small)}
.bx.big .v{font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--light)}
.bx.no{font-family:var(--font-mono)}
.bx.gap .v{white-space:normal;margin-top:var(--space-1);padding:0 var(--space-2);font-size:var(--type-small);line-height:calc(var(--leading-body) - var(--space-1));font-style:italic}
.bx.reach .v{color:var(--ink-muted);font-size:var(--type-small)}
.bx.disagree{background:color-mix(in srgb,var(--x-disagree) 5%,transparent)}
.bx.disagree .v{color:var(--x-disagree)}
.bx.withdrawn .v{color:var(--ink-muted)}
.bx button{all:unset}
/* determination slips: never removed, only added beneath, newest on top */
.slips{position:relative;display:flex;flex-direction:column;gap:0;padding-left:var(--space-6)}
.slips .hd{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
.slip{position:relative;width:min(100%,calc(var(--measure-glance) + var(--space-5)));display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-3);margin-top:calc(var(--space-1) * -1);background:var(--surface-raised);border:1px solid var(--hairline-strong);border-radius:2px;box-shadow:var(--shadow-raised);font-size:var(--type-meta);line-height:var(--leading-meta);transition:transform var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.slip:nth-child(odd){transform:rotate(var(--x-tilt))}
.slip:nth-child(even){transform:rotate(calc(var(--x-tilt) * -0.6)) translateX(var(--space-3))}
.slip.pre{opacity:0;transform:translateY(calc(var(--travel-near) * -1)) rotate(0)}
.slip .pin{color:var(--ink-muted)}
.slip b{font-weight:400;color:var(--light)}
.slip .m{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.slip .det{font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-disagree)}
.slip.wd{opacity:.75}
.slip.wd b{text-decoration:line-through;text-decoration-color:var(--x-withdrawn)}
.slip.wd .det{color:var(--x-withdrawn)}
.decide{margin-top:var(--space-3);font-size:var(--type-small);color:var(--ink-muted);max-width:var(--measure-read)}
/* the object record: museum documentation sections, in plain words */
.recd{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:var(--space-1)}
.sec{border-top:1px solid var(--hairline);padding:var(--space-2) 0}
.sec h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 var(--space-1);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.sec h2 i{font-style:normal;text-transform:none;letter-spacing:0;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);padding:calc(var(--space-1) / 2) 0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.row b{font-weight:400;color:var(--ink)}
.row.gap b{font-style:italic;color:var(--ink-muted);border-bottom:1px dashed var(--x-gap-ink)}
.row .w{color:var(--x-disagree)}
.row.wd b{color:var(--x-withdrawn)}
.cond{display:flex;align-items:center;gap:var(--space-3);font-size:var(--type-meta)}
.cond .bar{flex:1;display:flex;height:var(--space-2);border-radius:var(--radius-pill);overflow:hidden;background:var(--surface-inset)}
.cond .bar span{display:block;height:100%}
.chain{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted)}
.chain b{font-weight:400;color:var(--ink)}
@media (max-height:840px){.bx{min-height:calc(var(--space-6) + var(--space-2));padding:var(--space-1) var(--space-3)}.bx.big .v{font-size:var(--type-lead);line-height:var(--leading-lead)}.row{font-size:var(--type-small);line-height:var(--leading-small)}}
@media (prefers-reduced-motion: reduce){.slip.pre{transform:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Data Atlas"></nav>
  <main class="main" id="main">
    <section class="tray" id="tray" aria-label="Label"></section>
    <aside class="recd" id="recd" aria-label="Object record"></aside>
  </main>
</div>
<div class="keys" id="keys"></div>
<div class="x-cap"><b>Record card · V4</b> specimen label: fixed boxes on the label, determination slips added beneath and never removed, the object record's provenance, condition and loans · herbarium sheets, museum object records (SPECTRUM)</div>
<script>
/*@COMMON_JS*/

/* ====================================================================== V4: label and slips */
let tech = false;
/* box widths come from the detail's type, never from its name: the record's name spans the label, other text takes two boxes */
const wide = (r, k) => k === allKeys(r)[0] ? 'w4 big' : (defOf(r, k).type === 'text' ? 'w2' : '');
function box(r, k) {
  const st = stateOf(r, k), d = st.d;
  let v;
  if (st.s === 'filled') v = st.obs.map(o => show(o, d)).join(', ');
  if (st.s === 'disagree') v = `${ic('git-compare', 14)} see ${st.obs.length} slips`;
  if (st.s === 'withdrawn') v = `<span class="struck">${show(st.obs[0], d)}</span>`;
  if (st.s === 'gap') v = `<span class="gapbox" style="display:block">wanted from ${esc(filler(r, d).who.split(',')[0])}</span>`;
  if (st.s === 'reach') v = `${ic('lock', 12)} kept on ${esc(floorW(d.reach.floor))}`;
  return `<div class="bx ${wide(r, k)} ${st.s}"><div class="c"><span>${esc(d.word)}</span><span class="t">${esc(d.tech)}</span></div><div class="v">${v}</div></div>`;
}
function render() {
  const r = rec(), K = kindOf(r), t = tally(r);
  rail(r.kind);
  const det = allKeys(r).filter(k => !isLink(r, k));
  const fill4 = det.reduce((n, k) => n + ({ 'w4 big': 4, w2: 2 }[wide(r, k)] || 1), 0);
  const pad = (4 - (fill4 + 1) % 4) % 4;
  /* slips: every disagreement and every withdrawn reading, as determinations, oldest first so the newest lies on top */
  const slips = [];
  det.forEach(k => { const st = stateOf(r, k); if (st.s === 'disagree' || st.s === 'withdrawn') st.obs.slice().sort((a, b) => a.on.localeCompare(b.on)).forEach(o => slips.push({ k, o, s: st.s })); });
  $('#tray').innerHTML = `<div class="top"><div><div class="eyebrow">${esc(DATA.app)} · ${esc(K.plural)} · label</div><h1>A ${esc(K.word.toLowerCase())}</h1></div><div class="micro"><span class="kbd">T</span> ${tech ? 'plain words' : 'technical names on the label'}</div></div>
    <div class="label ${tech ? 'tech' : ''}">${det.map(k => box(r, k)).join('')}<div class="bx no" style="grid-column:span ${pad + 1}"><div class="c"><span>Record number</span><span class="t">@id</span></div><div class="v mono">${esc(r.id)}</div></div></div>
    <div class="slips"><div class="hd micro">${ic('pin', 14)} Determination slips · added, never removed</div>${slips.map(({ k, o, s }) => { const S = src(o.src), d = defOf(r, k); return `<div class="slip pre ${S.withdrawn ? 'wd' : ''}"><span class="pin">${ic(srcIcon(o.src), 18)}</span><div><b>${esc(d.word)}: ${show(o, d)}</b><span class="m">det. ${esc(S.word)}, ${fmtDate(o.on)}${o.note ? ' · ' + esc(o.note) : ''}${S.withdrawn ? ` · withdrawn ${fmtDate(S.withdrawn.on)}, no longer counts` : ''}</span></div><span class="det">${S.withdrawn ? 'withdrawn' : s === 'disagree' ? 'disagrees' : ''}</span></div>`; }).join('')}
    <div class="decide">${slips.some(x => x.s === 'disagree') ? `Where slips disagree, both stay on the label until ${esc(floorW(r.floor))} leads accept one. A new reading goes on top; the old one is never taken off.` : ''}</div></div>`;
  /* the object record */
  const lk = allKeys(r).filter(k => isLink(r, k));
  const seg = (n, c) => `<span style="width:${n / t.total * 100}%;background:${c}"></span>`;
  $('#recd').innerHTML = `
    <div class="sec"><h2>Provenance <i>${esc(W('kept'))} ${esc(floorW(r.floor))}</i></h2>
      <div class="chain">${ic('arrow-down-to-line', 14)} Added on <b>${esc(floorW(r.floor))}</b> ${fmtDate(r.since)} ${ic('arrow-right', 12)} last changed <b>${fmtDate(r.changed)}</b> </div>
      ${r.also.map(a => `<div class="row">${ic('copy', 14)}<span>Possibly the same as <b>${esc(a.name)}</b> on ${esc(floorW(a.floor))}. ${esc(a.why)}</span></div>`).join('')}</div>
    <div class="sec"><h2>Condition <i>${t.filled} of ${t.total} known</i></h2>
      <div class="cond"><div class="bar">${seg(t.filled, 'var(--ink-muted)')}${seg(t.disagree, 'var(--x-disagree)')}${seg(t.withdrawn, 'var(--x-withdrawn)')}${seg(t.reach, 'var(--hairline-strong)')}${seg(t.gap, 'transparent')}</div></div>
      <div class="row" style="grid-template-columns:1fr"><span>${t.disagree} disagree · ${t.withdrawn} withdrawn · ${t.reach} out of view · <b style="color:var(--ink-muted)">${t.gap} wanted</b></span></div>
      ${allKeys(r).filter(k => stateOf(r, k).s === 'gap').map(k => { const f = filler(r, defOf(r, k)); return `<div class="row gap">${ic('circle-dashed', 14)}<span><b>${esc(defOf(r, k).word)}</b> wanted from ${esc(f.who)}, ${esc(f.hint)}.</span></div>`; }).join('')}</div>
    <div class="sec"><h2>Associations <i>its links</i></h2>${lk.map(k => { const st = stateOf(r, k), d = st.d; return st.s === 'gap' ? `<div class="row gap">${ic('link-2-off', 14)}<span>${esc(tech ? d.tech : d.word)} <b>not recorded</b></span></div>` : `<div class="row">${ic(DATA.kinds[d.to]?.icon || 'link-2', 14)}<span>${esc(tech ? d.tech : d.word)} <b>${st.obs.map(o => esc(o.to)).join(', ')}</b></span></div>`; }).join('')}</div>
    <div class="sec"><h2>On loan to <i>${esc(W('usedBy'))}</i></h2>${r.usedBy.intents.map(i => `<div class="row">${ic('target', 14)}<span><b>${esc(i.word)}</b> · ${esc(i.owner)}, reads ${i.uses.map(k => esc(defOf(r, k).word.toLowerCase())).join(', ')}${i.waits ? ` <span class="w">· waits on a wanted detail</span>` : ''}</span></div>`).join('')}</div>
    <div class="sec"><h2>References <i>what it was read from</i></h2>${r.usedBy.documents.map(id => `<div class="row ${src(id).withdrawn ? 'wd' : ''}">${ic(srcIcon(id), 14)}<span><b>${esc(src(id).word)}</b> · ${esc(srcWhere(id))}${src(id).withdrawn ? ' · withdrawn' : ''}</span></div>`).join('')}</div>`;
  keys([['T', 'technical names'], ['K', 'another kind'], ['R', 'replay']]);
}
function demo() {
  clearTimers(); render();
  const s = $$('.slip');
  s.forEach((x, i) => later(() => x.classList.remove('pre'), ms('--motion-run') + i * ms('--motion-slow')));
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') return demo();
  if (e.key === 'k' || e.key === 'K') { REC = (REC + 1) % DATA.records.length; return demo(); }
  if (e.key === 't' || e.key === 'T') { tech = !tech; render(); $$('.slip').forEach(x => x.classList.remove('pre')); }
});
document.fonts.ready.then(demo);
</script>
</body>
</html>
