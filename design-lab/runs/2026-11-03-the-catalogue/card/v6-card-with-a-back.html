<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record card · V6 · A card with a back</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---- shared by every record card variant (proposed tokens first, all listed in notes.md) ---- */
:root{
  --x-type-micro:.6875rem;                                                     /* --type-micro: mono eyebrows and numerals inside data (also proposed by wear-and-time) */
  --x-gap-ink:color-mix(in srgb,var(--ink-muted) 70%,transparent);             /* --mark-gap: the edge of a detail nobody has filled (dashed, never hatched) */
  --x-gap-fill:color-mix(in srgb,var(--ink-muted) 6%,transparent);             /* --mark-gap-fill: the inside of the empty box */
  --x-disagree:color-mix(in srgb,var(--warning) 70%,var(--ink));               /* --mark-disagree: two sources, side by side */
  --x-withdrawn:color-mix(in srgb,var(--danger) 45%,var(--ink-muted));         /* --mark-withdrawn: read from a withdrawn document */
  --x-kept:var(--floor-department-high);                                       /* the floor the record is kept on (set from data) */
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.micro{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink);letter-spacing:0}
.keys{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:var(--layer-chrome);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-3);max-width:calc(var(--measure-wide) * .7);font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:lowercase;color:var(--ink-muted);background:var(--scrim);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key)}
.x-cap{max-width:calc(var(--measure-wide) * .8)}
@media (max-width:1400px){.x-cap{max-width:var(--measure-glance)}.keys{max-width:calc(var(--measure-read) - var(--space-6))}}
svg{flex:none}
/* the app frame: a slim rail so the card sits inside Data Atlas */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr)}
.rail{background:color-mix(in srgb,var(--slate-deep) 70%,transparent);border-right:1px solid var(--hairline);padding:var(--edge) var(--edge-tight);display:flex;flex-direction:column;gap:var(--space-1)}
.rail .an{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light);padding:var(--space-2);margin-bottom:var(--space-4)}
.nav{display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-meta);border-radius:var(--radius-key)}
.nav.on{background:var(--surface-raised);color:var(--ink)}
.nav .n{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono)}
.rail .foot{margin-top:auto;margin-bottom:var(--space-6);padding:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rail .foot b{font-weight:400;color:var(--ink)}
.main{position:relative;overflow:hidden;min-height:0}
/* marks shared by all six: gap (dashed, empty, owned), disagree (two side by side), withdrawn (struck, marked), reach (lock, says who) */
.gapbox{border:1px dashed var(--x-gap-ink);background:var(--x-gap-fill);border-radius:var(--radius-key);color:var(--ink-muted)}
.tag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;padding:calc(var(--space-1) / 2) var(--space-1);border-radius:var(--radius-key);white-space:nowrap}
.tag.disagree{color:var(--x-disagree);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--x-disagree) 40%,transparent)}
.tag.withdrawn{color:var(--x-withdrawn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--x-withdrawn) 40%,transparent)}
.tag.gap{color:var(--ink-muted);box-shadow:inset 0 0 0 1px var(--x-gap-ink)}
.tag.reach{color:var(--ink-muted);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.struck{text-decoration:line-through;text-decoration-color:var(--x-withdrawn);text-decoration-thickness:1px}
.fdot{display:inline-block;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);flex:none}
.lit{box-shadow:0 0 0 var(--focus-ring) var(--light),0 0 var(--glow-blur) color-mix(in srgb,var(--green) 45%,transparent)!important}
@media (prefers-reduced-motion: reduce){ .lit{box-shadow:0 0 0 var(--focus-ring) var(--light)!important} }

:root{
  --x-row:var(--space-5);                                                      /* 28: one row, shared by front and back so they line up */
  --x-perspective:calc(var(--measure-wide) * 2);                               /* 1840: the turn's depth */
}
@media (max-height:840px){:root{--x-row:calc(var(--space-5) - var(--space-1))}.ft .ln:nth-child(n+4){display:none}}
.main{padding:var(--edge) var(--space-6) var(--space-7);display:flex;flex-direction:column}
@media (max-width:1400px){.main{padding-left:var(--space-5);padding-right:var(--space-5)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)}
.who{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.who b{font-weight:400;color:var(--ink)}
.spread{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;perspective:var(--x-perspective)}
.face{position:relative;min-width:0;border:1px solid var(--hairline-strong);background:color-mix(in srgb,var(--slate) 88%,var(--ink) 4%);box-shadow:var(--shadow-raised);padding:var(--space-4) var(--space-4) var(--space-3);display:flex;flex-direction:column;overflow:hidden}
.front{border-radius:var(--radius-inset) 0 0 var(--radius-inset);border-right-color:var(--hairline)}
.front::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--x-kept)}
/* the back: same rows, technical names, a quieter ground */
.back{border-radius:0 var(--radius-inset) var(--radius-inset) 0;background:color-mix(in srgb,var(--slate-deep) 92%,var(--ink) 3%);transform-origin:left center;transform:rotateY(0);backface-visibility:hidden;transition:transform var(--motion-run) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.back.shut{transform:rotateY(-178deg);opacity:0}
.fold{position:absolute;left:50%;top:0;bottom:0;width:var(--space-5);transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--shade) 30%,transparent) 50%,transparent);transition:opacity var(--motion-calm) var(--ease-out)}
.shut ~ .fold,.fold.off{opacity:0}
/* a closed card shows the corner you can lift */
.corner{position:absolute;right:calc(50% + var(--space-3));bottom:var(--space-3);display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted);opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.corner.on{opacity:1}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;height:calc(var(--space-7) + var(--space-3));overflow:hidden;flex:none;padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.front .hd h1{margin:0;font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .hd .s{font-size:var(--type-small);color:var(--ink-muted)}
.back .hd{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.back .hd b{display:block;font:400 var(--type-meta)/var(--leading-meta) var(--font-mono);color:var(--ink)}
.rows{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.g{height:calc(var(--space-4) + var(--space-1));display:flex;align-items:flex-end;font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding-bottom:var(--space-1)}
.back .g{letter-spacing:0;text-transform:none}
.r{display:grid;align-items:center;height:var(--x-row);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);min-width:0;transition:background var(--motion-quick) var(--ease-standard)}
.r.on{background:var(--surface-raised)}
.front .r{grid-template-columns:calc(var(--space-8) + var(--space-3)) minmax(0,1fr) auto;gap:var(--space-3)}
.front .r .w{color:var(--ink-muted);font-size:var(--type-small);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .r .v{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .r .v small{color:var(--ink-muted)}
.front .r .v .or{color:var(--x-disagree);margin:0 var(--space-2)}
.front .r.gap .v{font-style:italic;color:var(--ink-muted);padding:0 var(--space-2);height:calc(var(--x-row) - var(--space-2));display:flex;align-items:center;font-size:var(--type-small)}
.front .r.reach .v,.front .r.withdrawn .v{color:var(--ink-muted)}
.back .r{grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) calc(var(--space-6) + var(--space-1)) minmax(0,1.2fr);gap:var(--space-3);font:400 var(--x-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.back .r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back .r .p{color:var(--ink)}
.back .r .x.req{color:var(--ink)}
.back .r.gap .a{color:var(--ink)}
.back .r.disagree .a{color:var(--x-disagree)}
.back .r.withdrawn .a{color:var(--x-withdrawn)}
.colh{flex:none;height:calc(var(--space-5) - var(--space-1));align-items:end}
.front .colh{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-3)) minmax(0,1fr);gap:var(--space-3);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.back .colh{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) calc(var(--space-6) + var(--space-1)) minmax(0,1.2fr);gap:var(--space-3);font:400 var(--x-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.ft{flex:none;padding-top:var(--space-2);border-top:1px solid var(--hairline-strong);display:grid;gap:2px;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);height:calc(var(--space-8) - var(--space-1));overflow:hidden}
.ft b{font-weight:400;color:var(--ink)}
.ft .ln{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft .ln span{overflow:hidden;text-overflow:ellipsis}
.ft .w{color:var(--x-disagree)}
.back .ft{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono)}
.ctl{display:flex;align-items:center;gap:var(--space-2)}
.btn.s{height:calc(var(--target-sm) - var(--space-2))}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font:400 var(--type-small)/1 var(--font-sans);color:var(--ink)}
.btn[aria-disabled="true"]{border-style:dashed;color:var(--ink-muted);cursor:help}
.btn.go{border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green)}
.ctl .why{font:400 var(--type-small)/var(--leading-small) var(--font-sans);color:var(--ink-muted)}
@media (prefers-reduced-motion: reduce){.back{transition:opacity var(--motion-base) linear}.back.shut{transform:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Data Atlas"></nav>
  <main class="main" id="main">
    <div class="top"><div class="eyebrow" id="crumb"></div><div class="who" id="who"></div></div>
    <div class="spread" id="spread">
      <article class="face front" id="front" aria-label="Front: for everyone"></article>
      <article class="face back shut" id="back" aria-label="Back: technical names, for admins"></article>
      <div class="fold off" id="fold"></div>
      <div class="corner" id="corner"></div>
    </div>
  </main>
</div>
<div class="keys" id="keys"></div>
<div class="x-cap"><b>Record card · V6</b> a card with a back: the front in plain words for operators, the back in technical names for admins, row for row, opened like a folded card · index cards, museum catalogue cards with accession data on the reverse, OWL/SHACL</div>
<script>
/* ======================================================================
   Sample data: every name, label, count, date and word on this page comes
   from here. In AUGUR it comes from Data Atlas: the ontology (kinds of thing,
   their details and kinds of link, each with the pack term it stands for),
   what's known (observations from sources, facts a floor's leads accepted,
   disputes), Used by (Mandate bindings, the documents read) and the floors.
   Nothing below is drawn for one deployment: swap this object and the page
   redraws for any org. Press K to switch to a record of another kind.
   ====================================================================== */
const DATA = {
  app: 'Data Atlas',
  org: 'Vale Regional Services',
  now: '2026-11-03',
  viewer: { name: 'Sam Okafor', floor: 'department', admin: false },
  admin: { name: 'Jo Reyes', role: 'Data Atlas admin' },
  floors: {
    you: { word: 'You' },
    team: { word: 'Depot operations' },
    department: { word: 'Facilities' },
    org: { word: 'Vale Regional Services' }
  },
  words: {                     /* plain word first, technical word one step down */
    kind: ['Kind of thing', 'class'],
    detail: ['Detail', 'datatype property'],
    link: ['Link', 'object property'],
    gap: ['Not known yet', 'expected, no assertion'],
    source: ['Where it came from', 'observation · prov:wasDerivedFrom'],
    disagree: ['Sources disagree', 'conflicting observations'],
    fact: ['Accepted', 'fact (accepted by floor leads)'],
    usedBy: ['Used by', 'Mandate bindings · source documents'],
    kept: ['Kept on', 'owning workspace']
  },
  /* sources: a document in Artifacts or a person. A withdrawn document's readings stay, marked, and stop counting. */
  sources: {
    register: { type: 'document', word: 'Asset register, Q3 2026', where: 'Estates records', floor: 'org', on: '2026-10-01' },
    lease:    { type: 'document', word: 'Lease agreement, Halden Road', where: 'Estates records', floor: 'department', on: '2019-04-02' },
    survey:   { type: 'document', word: 'Facilities survey 2025', where: 'Facilities library', floor: 'department', on: '2025-06-18' },
    fmdoc:    { type: 'document', word: 'Contract FM-2024-017', where: 'Contracts', floor: 'department', on: '2024-02-20' },
    handbook: { type: 'document', word: 'Depot handbook 2019', where: 'Facilities library', floor: 'department', on: '2019-05-01',
                withdrawn: { on: '2026-02-10', by: 'Facilities leads', why: 'Replaced by the 2026 handbook, which has not been read yet.' } },
    ir2291:   { type: 'document', word: 'Incident report IR-2291', where: 'Depot logs', floor: 'team', on: '2026-08-14' },
    priya:    { type: 'person', word: 'Priya Natarajan', role: 'Site manager', floor: 'department', on: '2026-09-30' },
    gmdoc:    { type: 'document', word: 'Grounds maintenance contract', where: 'Contracts', floor: 'department', on: '2023-03-10' },
    tender:   { type: 'document', word: 'Tender evaluation 2023', where: 'Procurement', floor: 'department', on: '2023-02-02' },
    tomasz:   { type: 'person', word: 'Tomasz Wilk', role: 'Contract manager', floor: 'department', on: '2026-07-11' }
  },
  /* the ontology: kinds of thing (only the two shown in full here, plus the kinds links point at) */
  kinds: {
    site: {
      word: 'Site', plural: 'Sites', icon: 'warehouse', count: 46,
      tech: { name: 'cco:Facility', pack: 'Common Core Ontologies 2.0', iri: 'http://www.ontologyrepository.com/CommonCoreOntologies/Facility' },
      says: 'A place the org runs or uses: a depot, office, yard or store.',
      groups: [
        { word: 'What it is', items: ['name', 'alias', 'purpose'] },
        { word: 'Where it is', items: ['address', 'inRegion'] },
        { word: 'Size and use', items: ['floorArea', 'spaces', 'opened'] },
        { word: 'Care and safety', items: ['fireCheck', 'hours', 'energy', 'security'] },
        { word: 'Who and what', items: ['runBy', 'managedBy', 'coveredBy', 'insuredBy', 'houses', 'incidents'] }
      ],
      details: {
        name:      { word: 'Name', say: 'Its name is {v}.', tech: 'rdfs:label', type: 'text', key: true },
        alias:     { word: 'Also called', say: 'It is also called {v}.', tech: 'skos:altLabel', type: 'text', many: true },
        purpose:   { word: 'Used for', say: 'It serves as {v}.', tech: 'vrs:site_use', type: 'text' },
        address:   { word: 'Address', say: 'It is at {v}.', tech: 'cco:has_address', type: 'text' },
        floorArea: { word: 'Floor area', say: 'It has a floor area of {v}.', tech: 'vrs:floor_area', type: 'measure', unit: 'm²' },
        spaces:    { word: 'Vehicle spaces', say: 'It has room for {v} vehicles.', tech: 'vrs:vehicle_capacity', type: 'count' },
        opened:    { word: 'Opened', say: 'It opened on {v}.', tech: 'vrs:opened_on', type: 'date' },
        fireCheck: { word: 'Last fire risk check', say: 'Its fire risk was last checked on {v}.', tech: 'vrs:fire_risk_assessed_on', type: 'date',
                     fill: { who: 'Health and safety team', floor: 'department', hint: 'usually in a fire risk assessment' } },
        hours:     { word: 'Opening hours', say: 'It is open {v}.', tech: 'vrs:opening_hours', type: 'text',
                     fill: { who: 'Priya Natarajan, site manager', floor: 'department', hint: 'she can say it herself' } },
        energy:    { word: 'Energy rating', say: 'Its energy rating is {v}.', tech: 'vrs:epc_band', type: 'band' },
        security:  { word: 'Security grading', say: 'Its security grading is {v}.', tech: 'vrs:security_grade', type: 'band',
                     reach: { floor: 'team', ask: 'Depot security leads', why: 'Kept on the Depot operations floor, below yours. Floors see their own and the floors above.' } }
      },
      links: {
        inRegion:  { word: 'In', say: 'It is in {v}.', back: 'has site', to: 'region', tech: 'cco:located_in' },
        runBy:     { word: 'Run by', say: 'It is run by {v}.', back: 'runs', to: 'organisation', tech: 'vrs:operated_by' },
        managedBy: { word: 'Managed by', say: 'It is managed by {v}.', back: 'manages', to: 'person', tech: 'vrs:managed_by' },
        coveredBy: { word: 'Covered by', say: 'It is covered by {v}.', back: 'covers', to: 'contract', tech: 'vrs:subject_of_contract' },
        insuredBy: { word: 'Insured by', say: 'It is insured by {v}.', back: 'insures', to: 'organisation', tech: 'vrs:insured_by',
                     fill: { who: 'Finance, insurance desk', floor: 'org', hint: 'from the property schedule' } },
        houses:    { word: 'Home to', say: 'It is home to {v}.', back: 'based at', to: 'vehicle', tech: 'vrs:base_of', many: true },
        incidents: { word: 'Incidents here', say: 'It was the scene of {v}.', back: 'happened at', to: 'incident', tech: 'cco:is_site_of', many: true }
      }
    },
    contract: {
      word: 'Contract', plural: 'Contracts', icon: 'file-signature', count: 132,
      tech: { name: 'cco:Contract', pack: 'Common Core Ontologies 2.0', iri: 'http://www.ontologyrepository.com/CommonCoreOntologies/Contract' },
      says: 'An agreement with a supplier: what they do, for how long, for how much.',
      groups: [
        { word: 'What it is', items: ['name', 'ref', 'scope'] },
        { word: 'Money and time', items: ['value', 'starts', 'ends', 'notice'] },
        { word: 'Decisions', items: ['renewal', 'risk'] },
        { word: 'Who and what', items: ['withSupplier', 'managedBy', 'covers'] }
      ],
      details: {
        name:    { word: 'Name', say: 'Its name is {v}.', tech: 'rdfs:label', type: 'text', key: true },
        ref:     { word: 'Reference', say: 'Its reference is {v}.', tech: 'vrs:contract_ref', type: 'text', key: true },
        scope:   { word: 'What it covers', say: 'It covers {v}.', tech: 'vrs:scope', type: 'text' },
        value:   { word: 'Value a year', say: 'It is worth {v} a year.', tech: 'vrs:annual_value', type: 'money', unit: '£' },
        starts:  { word: 'Starts', say: 'It starts on {v}.', tech: 'cco:has_start_date', type: 'date' },
        ends:    { word: 'Ends', say: 'It ends on {v}.', tech: 'cco:has_end_date', type: 'date' },
        notice:  { word: 'Notice to end', say: 'Either side can end it with {v} notice.', tech: 'vrs:notice_period', type: 'text',
                   fill: { who: 'Procurement', floor: 'department', hint: 'clause 14 of the signed contract' } },
        renewal: { word: 'Renewal decision by', say: 'A renewal decision is due by {v}.', tech: 'vrs:renewal_decision_due', type: 'date',
                   fill: { who: 'Tomasz Wilk, contract manager', floor: 'department', hint: 'he set the timetable' } },
        risk:    { word: 'Supplier risk', say: 'Its supplier risk is {v}.', tech: 'vrs:supplier_risk', type: 'band',
                   reach: { floor: 'org', restricted: true, ask: 'Commercial risk office', why: 'Kept on the Org floor in a restricted list. You can see that it exists, not its value.' } }
      },
      links: {
        withSupplier: { word: 'With', say: 'It is with {v}.', back: 'holds', to: 'organisation', tech: 'cco:has_party' },
        managedBy:    { word: 'Managed by', say: 'It is managed by {v}.', back: 'manages', to: 'person', tech: 'vrs:managed_by' },
        covers:       { word: 'Covers', say: 'It applies at {v}.', back: 'covered by', to: 'site', tech: 'vrs:covers_site', many: true }
      }
    },
    region: { word: 'Region', plural: 'Regions', icon: 'map', count: 6 },

/* ====================================================================== shared helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ms = t => { const v = getComputedStyle(document.documentElement).getPropertyValue(t).trim(); return RM ? 0 : (parseFloat(v) || 0); };
const ic = (n, s = 16) => Icons.svg(n, { size: s, stroke: 1.5 });
const FV = { org: '--floor-org-high', department: '--floor-department-high', team: '--floor-team-high', you: '--floor-you-high' };
const floorC = f => `var(${FV[f] || '--ink-muted'})`;
const floorW = f => DATA.floors[f]?.word || f;
const W = k => DATA.words[k][0];
const T = k => DATA.words[k][1];
const fmtDate = s => { const d = new Date(s + 'T00:00:00Z'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }); };
const ORDER = { org: 3, department: 2, team: 1, you: 0 };
const seesFloor = f => ORDER[f] >= ORDER[DATA.viewer.floor];

let REC = 0;
const rec = () => DATA.records[REC];
const kindOf = r => DATA.kinds[r.kind];
const defOf = (r, k) => kindOf(r).details[k] || kindOf(r).links[k];
const isLink = (r, k) => !!kindOf(r).links[k];
const src = id => DATA.sources[id];
const srcIcon = id => src(id)?.type === 'person' ? 'user-round' : 'file-text';
const srcWhere = id => { const s = src(id); return s.type === 'person' ? `${s.role}, said ${fmtDate(s.on)}` : `Artifacts · ${s.where}`; };

/* the state of one detail on one record: filled, disagree, gap, reach (kept out of view), withdrawn (known only from a withdrawn source) */
function stateOf(r, k) {
  const d = defOf(r, k), obs = r.known[k] || [];
  if (d.reach && (d.reach.restricted || !seesFloor(d.reach.floor))) return { s: 'reach', obs: [], d };
  if (!obs.length) return { s: 'gap', obs, d };
  const live = obs.filter(o => !src(o.src).withdrawn);
  if (!live.length) return { s: 'withdrawn', obs, d };
  const vals = new Set(live.map(o => o.v ?? o.to));
  if (vals.size > 1 && !live.some(o => o.accepted)) return { s: 'disagree', obs: live, d };
  return { s: 'filled', obs, d };
}
const valOf = (o, d) => esc(o.v ?? o.to) + (d.unit && d.type !== 'money' ? ` <small>${esc(d.unit)}</small>` : '');
const moneyOf = (o, d) => d.type === 'money' ? `${esc(d.unit)}${esc(o.v)}` : null;
const show = (o, d) => moneyOf(o, d) ?? valOf(o, d);
const allKeys = r => kindOf(r).groups.flatMap(g => g.items);
function tally(r) {
  const t = { filled: 0, disagree: 0, gap: 0, reach: 0, withdrawn: 0 };
  allKeys(r).forEach(k => t[stateOf(r, k).s]++);
  t.total = allKeys(r).length; return t;
}
/* who could fill a gap: the kind's own hint, or the floor's leads */
const filler = (r, d) => d.fill || { who: `${floorW(r.floor)} leads`, floor: r.floor, hint: 'anyone with access can propose a value' };
const usedFor = (r, k) => r.usedBy.intents.filter(i => i.uses.includes(k));

/* the Data Atlas rail: kinds come from the ontology, counts from Data Atlas */
function rail(active) {
  const ks = ['site', 'contract', 'organisation', 'person', 'vehicle', 'incident'];
  $('#rail').innerHTML = `<div class="an">${esc(DATA.app)}</div>
    <div class="nav"><span>${ic('library')}</span>What we keep</div>
    ${ks.map(k => { const K = DATA.kinds[k]; return `<div class="nav ${k === active ? 'on' : ''}"><span>${ic(K.icon)}</span>${esc(K.plural)}<span class="n">${K.count.toLocaleString('en-GB')}</span></div>`; }).join('')}
    <div class="nav"><span>${ic('inbox')}</span>Triage<span class="n">7</span></div>
    <div class="foot">You are on the <b>${esc(floorW(DATA.viewer.floor))}</b> floor. You see what is kept here and on the floors above: <b>${esc(floorW('org'))}</b>.</div>`;
}

/* keys bar + tip */
function keys(list) {
  $('#keys').innerHTML = list.map(([a, b]) => `<span>${a.split(' ').map(x => `<span class="kbd">${esc(x)}</span>`).join(' ')} ${esc(b)}</span>`).join('');
}
const timers = []; const later = (f, t) => timers.push(setTimeout(f, t));
const clearTimers = () => { while (timers.length) clearTimeout(timers.pop()); };


/* ====================================================================== V6: front and back */
let open = false, cur = -1, admin = false, keysList = [];
const DT = { text: 'xsd:string', date: 'xsd:date', count: 'xsd:nonNegativeInteger', measure: 'xsd:decimal', money: 'xsd:decimal', band: 'xsd:token' };
const card = d => d.key ? '1' : d.many ? '0..*' : '0..1';
function front(r) {
  const K = kindOf(r), t = tally(r);
  let h = `<div class="hd"><div><div class="eyebrow">${esc(K.word)} · front</div><h1>${esc(r.name)}</h1><div class="s">${esc(K.says)}</div></div><div class="s"><span class="fdot" style="background:${floorC(r.floor)}"></span> ${esc(W('kept'))} ${esc(floorW(r.floor))} · ${t.filled}/${t.total}</div></div><div class="colh"><span>detail</span><span>what is known</span></div><div class="rows" data-side="front">`;
  K.groups.forEach(g => {
    h += `<div class="g">${esc(g.word)}</div>`;
    g.items.forEach(k => {
      const st = stateOf(r, k), d = st.d; let v = '', m = '';
      if (st.s === 'filled') v = st.obs.map(o => o.to ? esc(o.to) : show(o, d)).join(', ');
      if (st.s === 'disagree') { v = st.obs.map(o => `${show(o, d)} <small>${esc(src(o.src).word.split(',')[0])}</small>`).join('<span class="or">or</span>'); m = `<span class="tag disagree">disagree</span>`; }
      if (st.s === 'withdrawn') { v = `<span class="struck">${show(st.obs[0], d)}</span>`; m = `<span class="tag withdrawn">withdrawn</span>`; }
      if (st.s === 'gap') { v = `${esc(filler(r, d).who)} could fill this`; m = `<span class="tag gap">not known yet</span>`; }
      if (st.s === 'reach') { v = `${ic('lock', 12)} kept on ${esc(floorW(d.reach.floor))} · ask ${esc(d.reach.ask)}`; }
      h += `<div class="r ${st.s}" data-k="${k}"><span class="w">${esc(d.word)}</span><span class="v ${st.s === 'gap' ? 'gapbox' : ''}">${v}</span>${m}</div>`;
    });
  });
  h += `</div><div class="ft"><div class="micro">${esc(W('usedBy'))}</div>${r.usedBy.intents.map(i => `<div class="ln">${ic('target', 14)}<span><b>${esc(i.word)}</b> · ${esc(i.owner)}${i.waits ? ' <span class="w">· waiting on a gap</span>' : ''}</span></div>`).join('')}<div class="ln">${ic('files', 14)}<span>Read from ${r.usedBy.documents.length} documents in Artifacts${r.usedBy.documents.some(id => src(id).withdrawn) ? ', one withdrawn' : ''}</span></div></div>`;
  return h;
}
function back(r) {
  const K = kindOf(r);
  let h = `<div class="hd"><div><div class="eyebrow">class · back</div><b>${esc(K.tech.name)}</b>${esc(K.tech.iri)}<br>pack ${esc(K.tech.pack)} · ontology v14 · ${esc(r.id)} · workspace ${esc(r.floor)}:${esc(floorW(r.floor).toLowerCase().replace(/\W+/g, '-'))}</div></div>
    <div class="colh"><span>property</span><span>range</span><span>card.</span><span>assertions</span></div><div class="rows" data-side="back">`;
  K.groups.forEach(g => {
    h += `<div class="g">group: ${esc(g.word.toLowerCase().replace(/\W+/g, '_'))}</div>`;
    g.items.forEach(k => {
      const st = stateOf(r, k), d = st.d, obs = r.known[k] || [];
      const range = d.to ? `→ ${DATA.kinds[d.to].word}` : DT[d.type];
      let a = '';
      if (st.s === 'filled') a = obs.every(o => o.accepted) ? `${obs.length} obs · fact ✓` : `${obs.length} obs`;
      if (st.s === 'disagree') a = `${obs.length} obs ⟂ · no fact`;
      if (st.s === 'withdrawn') a = `${obs.length} obs · retracted`;
      if (st.s === 'gap') a = `0 · expected (minCount 1) · fill: ${(d.fill?.floor) || r.floor}`;
      if (st.s === 'reach') a = `kept: ${d.reach.floor} · 403`;
      const g2 = obs.find(o => o.grade)?.grade;
      h += `<div class="r ${st.s}" data-k="${k}"><span class="p">${esc(d.tech)}</span><span>${esc(range)}</span><span class="x ${d.key ? 'req' : ''}">${card(d)}${d.key ? ' key' : ''}</span><span class="a">${esc(a)}${g2 ? ' · ' + esc(g2) : ''}</span></div>`;
    });
  });
  h += `</div><div class="ft"><div class="micro">events and bindings</div><div class="ln">${ic('radio-tower', 14)}<span>mandate.intent.entity-bound × ${r.usedBy.intents.length} · roles: ${r.usedBy.intents.map(i => i.uses[0]).join(', ')}</span></div><div class="ln">${ic('file-x', 14)}<span>folio.document.withdrawn · ${esc(r.usedBy.documents.filter(id => src(id).withdrawn).join(', ') || 'none')}</span></div>
    <div class="ctl">${admin ? `<button class="btn s go">${ic('pencil-ruler', 14)} Change this kind in the studio</button><button class="btn s">${ic('download', 14)} OWL</button>` : `<button class="btn s" aria-disabled="true">${ic('lock', 14)} Change this kind</button><span class="why">Only Data Atlas admins can change the back. Ask ${esc(DATA.admin.name)}.</span>`}</div></div>`;
  return h;
}
function render() {
  const r = rec();
  document.documentElement.style.setProperty('--x-kept', floorC(r.floor));
  rail(r.kind);
  $('#crumb').textContent = `${DATA.app} · ${kindOf(r).plural} · ${r.name}`;
  $('#who').innerHTML = `${ic('user-round', 14)} Viewing as <b>${esc(admin ? DATA.admin.name : DATA.viewer.name)}</b> · ${admin ? esc(DATA.admin.role) : 'operator, ' + esc(floorW(DATA.viewer.floor))} <span class="kbd">A</span>`;
  $('#front').innerHTML = front(r);
  $('#back').innerHTML = back(r);
  $('#corner').innerHTML = `${ic('book-open', 14)} <span class="kbd">B</span> turn over: the same card in technical names, for admins`;
  $$('.r').forEach(x => x.addEventListener('mouseenter', () => hi(x.dataset.k)));
  syncScroll();
  setOpen(open, true);
}
function hi(k) {
  $$('.r').forEach(x => x.classList.toggle('on', x.dataset.k === k)); cur = allKeys(rec()).indexOf(k);
  const f = $(`.front .r[data-k="${k}"]`); if (f) f.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' });
}
/* front and back scroll together, so a row always faces its row */
function syncScroll() {
  const [a, b] = $$('.rows'); let lock = false;
  const tie = (x, y) => x.addEventListener('scroll', () => { if (lock) return; lock = true; y.scrollTop = x.scrollTop; requestAnimationFrame(() => lock = false); });
  tie(a, b); tie(b, a);
}
function setOpen(v, quiet) {
  open = v;
  $('#back').classList.toggle('shut', !v); $('#fold').classList.toggle('off', !v); $('#corner').classList.toggle('on', !v);
  keys([['B', open ? 'close the back' : 'turn over'], ['↑ ↓', 'row on both sides'], ['A', admin ? 'view as operator' : 'view as admin'], ['K', 'another kind'], ['R', 'replay']]);
}
function demo() {
  clearTimers(); open = false; cur = -1; render();
  later(() => setOpen(true), ms('--motion-run'));
  later(() => hi(DATA.demo.detail), ms('--motion-run') * 2 + ms('--motion-base'));
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') return demo();
  if (k === 'k') { REC = (REC + 1) % DATA.records.length; return demo(); }
  if (k === 'b') return setOpen(!open);
  if (k === 'a') { admin = !admin; const c = cur; render(); if (c >= 0) hi(allKeys(rec())[c]); return; }
  const ks = allKeys(rec());
  if (e.key === 'ArrowDown') { e.preventDefault(); hi(ks[Math.min(ks.length - 1, cur + 1)]); }
  if (e.key === 'ArrowUp') { e.preventDefault(); hi(ks[Math.max(0, cur - 1)]); }
});
document.fonts.ready.then(demo);
</script>
