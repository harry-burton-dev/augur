<style>
/* ======================================================================

:root{

}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}

.keys{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:var(--layer-chrome);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-3);max-width:calc(50% - var(--space-6));font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:lowercase;color:var(--ink-muted);background:var(--scrim);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key)}

.kind{display:inline-flex;align-items:center;gap:var(--space-2);color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);background:var(--surface-inset);white-space:nowrap}
.btn svg{width:var(--space-4);height:var(--space-4)}

/* ---- "is it one of these?": near matches ---- */

.nm{display:block;width:100%;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);padding:var(--space-2) var(--space-3);margin-bottom:var(--space-2);transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard),opacity var(--motion-base) var(--ease-standard)}

.nm ul{list-style:none;margin:var(--space-1) 0 0;padding:0;display:grid;gap:calc(var(--space-1) / 2);font-size:var(--type-small);line-height:var(--leading-small)}
.nm li{display:flex;gap:var(--space-2);align-items:center;color:var(--ink)}
.nm li svg{width:var(--space-3);height:var(--space-3);flex:none}
.nm li.same svg{color:var(--success)}
.nm li.diff{color:var(--ink-muted)}
.nm .acts{display:flex;gap:var(--space-2);margin-top:var(--space-2);flex-wrap:wrap}
.nm .acts .btn{height:calc(var(--space-5) + var(--space-1));font-size:var(--type-small)}
.nm.pick{border-color:var(--x-accent);box-shadow:0 0 0 1px var(--x-accent-edge)}
.nm.no{opacity:var(--x-out)}

/* ---- the Triage slip: the last step of every path ---- */
.slip{border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);padding:var(--space-3) var(--space-4)}
.slip .stamp{display:inline-flex;align-items:center;gap:var(--space-2);font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-accent);margin-bottom:var(--space-2)}
.slip .stamp svg{width:var(--space-3);height:var(--space-3)}
.slip.waiting .stamp{color:var(--x-wait)}
.slip p{margin:0 0 var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}

.det{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:0 var(--space-3);margin:var(--space-2) 0 var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.det > *{padding:calc(var(--space-1) + 1px) 0;border-bottom:1px solid var(--hairline)}

.gap{display:inline-flex;flex-direction:column;gap:0;width:100%;padding:0 var(--space-2) !important;border:1px dashed var(--x-gap-edge) !important;border-radius:var(--radius-key);color:var(--ink-muted)}
.det .gap{margin:calc(var(--space-1) / 2) 0}
.gap b{font-weight:400;color:var(--ink)}
.who{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-1) var(--space-2);margin:var(--space-2) 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.who svg{width:var(--space-4);height:var(--space-4);color:var(--ink)}
.who b{font-weight:400;color:var(--ink)}

.fade{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.fade.pre{opacity:0;transform:translateY(var(--space-2))}
@media (prefers-reduced-motion: reduce){.fade{transition:opacity var(--motion-base) linear!important}.fade.pre{transform:none}}
@media (max-height:840px){.main{padding-top:var(--edge-tight)}.head{margin-bottom:var(--space-3)}.head h1{font-size:var(--type-heading);line-height:var(--leading-heading)}}
.nm .t .kind .st{display:none!important}

/* ====================== V1: The key ====================== */
.grid{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) var(--x-col-side);gap:var(--space-5)}
.left{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.keypage{position:relative;flex:1;min-height:0;border-top:1px solid var(--hairline-strong);padding-top:var(--space-3)}

.cp{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr);column-gap:var(--space-2);padding:calc(var(--space-1) / 2) 0;border-radius:var(--radius-key);transition:opacity var(--motion-slow) var(--ease-standard),background var(--motion-slow) var(--ease-standard)}

.ld .ab{font:400 var(--x-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.ld .dots{align-self:center;height:1px;background-image:radial-gradient(circle,var(--ink-muted) 0.6px,transparent 0.8px);background-size:var(--space-2) 2px;background-repeat:repeat-x;opacity:.7}
.ld .to{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);display:inline-flex;gap:var(--space-2);align-items:center;white-space:nowrap}

.cp.past{opacity:.55}

.cp.now{background:var(--surface-raised);box-shadow:inset 2px 0 0 var(--x-accent);opacity:1}

.right{display:flex;flex-direction:column;gap:var(--space-3);min-height:0;overflow:hidden}

.poss .elsew{margin-top:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:flex;gap:var(--space-2)}
.poss .elsew svg{width:var(--space-4);height:var(--space-4);flex:none}
.res{border:1px solid var(--x-accent-edge);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4);background:var(--x-accent-soft)}
.res .big{display:flex;align-items:center;gap:var(--space-3);font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--light)}

<script>
/* ======================================================================
   Sample data: every name, word, count and question on this page comes
   from here. In AUGUR it comes from Data Atlas: the ontology (kinds,
   their details and links, each with a plain word and a studio word),
   counts per kind, Triage, and the people who decide (steward, admin).
   A regional services deployment; nothing here is drawn for one domain.
   ====================================================================== */

  app: 'Data Atlas',
  floor: { kind: 'Team', name: 'Ashby Road Crew', above: 'Highways and Depots' },

  /* plain word first, studio word one step down */

    ask: ['ask for a new kind', 'ontology change request'], gap: ['not known yet', 'expected property, no value'],
    key: ['the key', 'decision tree over class axioms'], genus: ['what it is', 'superclass'], diff: ['what sets it apart', 'differentia'],
    example: ['like this one', 'exemplar / type specimen']

  matching: { byMeaning: false, note: 'Matched by name, spelling and keys. Matching by meaning is off on this deployment.' },
  steps: { fits: ['Say what it is', 'Find its kind', 'Is it one of these?', 'Triage'], misfit: ['Say what it is', 'Find its kind', 'Ask for a kind', 'Waits in Triage'] },

  /* what a thing is (genus) and its shape: the two axes the kinds sit on */
  genera: [
    { id: 'place', word: 'Place', a: 'a place', studio: 'Site (BFO)' },
    { id: 'thing', word: 'Thing', a: 'a thing', studio: 'Material Artifact' },
    { id: 'someone', word: 'Someone', a: 'someone', studio: 'Agent' },
    { id: 'agreement', word: 'Agreement', a: 'an agreement', studio: 'Directive Information Content Entity' },

  ],

    { id: 'point', word: 'One, in one spot', studio: '0-dimensional / object' },
    { id: 'line', word: 'Along a line, or over an area', studio: '1- or 2-dimensional region' },
    { id: 'many', word: 'Many, counted as one', studio: 'Object aggregate' }
  ],
  kinds: [
    { id: 'site', word: 'Site', studio: 'Facility', icon: 'building-2', n: 38, genus: 'place', shape: 'point',

      has: ['Address', 'Run by', 'Opening hours', 'Capacity'], is: ['touch', 'stays', 'address'], eg: 'Ashby depot' },
    { id: 'vehicle', word: 'Vehicle', studio: 'Ground Vehicle', icon: 'truck', n: 164, genus: 'thing', shape: 'point',
      diff: 'moves under its own power', says: 'Moves under its own power, with a registration: a gritter, a van, a sweeper.',
      has: ['Registration', 'Based at', 'Mileage', 'Next MOT'], is: ['touch', 'self'], eg: 'Gritter GR-04' },
    { id: 'equipment', word: 'Equipment', studio: 'Material Artifact', icon: 'package', n: 702, genus: 'thing', shape: 'point',

    { n: 4, a: ['It moves under its own power, with a registration', 'vehicle'], b: ['It is carried, towed or set up', 'equipment'] },
    { n: 5, a: ['It’s someone', 6], b: ['It was agreed, or it happened', 7] },

      { id: 'wu3', name: 'Welfare unit WU-03', kind: 'equipment', where: 'Kept on Highways and Depots · since March',
        same: ['Owned by Hallam Plant Hire'], diff: ['Tag WU-03', 'Kept at Ollerton yard'] },
      { id: 'tr12', name: 'Trailer TR-12', kind: 'vehicle', where: 'Kept on Ashby Road Crew · since 2024',
        same: ['Kept at Ashby depot', 'Towed'], diff: ['A Vehicle: has a registration'] }
    ],
    misfit: [
      { id: 'ashby', name: 'Ashby depot', kind: 'site', where: 'Kept on Ashby Road Crew',
        same: ['Stays in one place'], diff: ['Has an address', 'People work there'] },
      { id: 'a614w', name: 'A614 works, phase 1', kind: 'incident', where: 'Kept on Highways and Depots',
        same: ['Names the A614'], diff: ['An Incident: it happened on one day'] }
    ]
  },
  examples: ['wu3', 'tr12', 'ashby', 'sam', 'hire', 'spill'],
  entities: {

    tr12: { name: 'Trailer TR-12', kind: 'vehicle', d: { 'Registration': 'TR12 ARC', 'Based at': 'Ashby depot', 'Mileage': '—', 'Next MOT': 'Feb 2027' } },
    ashby: { name: 'Ashby depot', kind: 'site', d: { 'Address': 'Mansfield Rd, Ashby', 'Run by': 'Sam Whitlock', 'Opening hours': '06:00–18:00', 'Capacity': '40 vehicles' } },
    sam: { name: 'Sam Whitlock', kind: 'person', d: { 'Name': 'Sam Whitlock', 'Role': 'Depot manager', 'Works at': 'Ashby depot', 'Phone': '07700 900412' } },
    hire: { name: 'Plant hire 2026/14', kind: 'contract', d: { 'Parties': 'Us, Hallam Plant Hire', 'Starts': '1 Nov', 'Ends': '31 Mar', 'Value': '£18,400' } },
    spill: { name: 'Spill at Blyth layby', kind: 'incident', d: { 'When': '22 Oct, 14:10', 'Where': 'Blyth layby', 'Reported by': 'Sam Whitlock', 'Severity': 'Low' } }
  },
  /* the demo: which answers the operator gives, in order */
  demo: { fits: 'fits', misfit: 'misfit' }
};

/* ---- helpers shared by every variant ---- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ms = t => { const v = getComputedStyle(document.documentElement).getPropertyValue(t).trim(); return v.endsWith('ms') ? parseFloat(v) : parseFloat(v) * 1000; };
let timers = [];
const later = (fn, d) => timers.push(setTimeout(fn, RM ? 0 : d));
const clearLater = () => { timers.forEach(clearTimeout); timers = []; };
const K = id => DATA.kinds.find(k => k.id === id);
const G = id => DATA.genera.find(g => g.id === id);
const ic = (n, s = 16) => Icons.svg(n, { size: s, stroke: 1.5 });
const st = w => `<span class="st">${w}</span>`;
const W = k => DATA.words[k];
const fmt = n => n.toLocaleString('en-GB');
let MODE = location.hash === '#misfit' ? 'misfit' : 'fits';
if (location.hash === '#studio') document.body.classList.add('studio');

function frame(V) {
  $('#rail').innerHTML = `<div class="an">${DATA.app}</div>
    <div class="floor"><span class="dot"></span>${DATA.floor.kind} · ${DATA.floor.name}</div>
    ${DATA.nav.map(n => `<div class="nav${n.on ? ' on' : ''}">${ic(n.icon)}<span>${n.label}</span>${n.n != null ? `<span class="n">${fmt(n.n)}</span>` : ''}</div>`).join('')}
    <div class="foot" id="railfoot"></div>`;
  $('#crumb').textContent = `${DATA.floor.name} · ${DATA.app} · Add a thing`;
  $('#h1').textContent = V.title;
  $('#sub').innerHTML = V.sub;
  studioFoot();
}
function studioFoot() {
  const on = document.body.classList.contains('studio');
  $('#railfoot').innerHTML = on
    ? `<b>Studio words are on.</b> Each plain word shows the name admins use, one step down. <span class="kbd">S</span> hides them.`
    : `Plain words only. Admins can show the <b>studio words</b> underneath with <span class="kbd">S</span>`;
}
function steps(at, waiting) {
  const L = DATA.steps[MODE];
  $('#steps').innerHTML = L.map((l, i) => {
    const c = i < at ? 'done' : i === at ? (waiting && i === L.length - 1 ? 'wait' : 'now') : '';
    const lock = i === L.length - 1 ? `<i data-lucide="${waiting ? 'hourglass' : 'shield-check'}"></i>` : '';
    return `${i ? '<span class="sep"></span>' : ''}<span class="s ${c}${lock ? ' lock' : ''}"><b>${i < at ? '✓' : i + 1}</b>${l}${lock}</span>`;
  }).join('');
  Icons.hydrate($('#steps'));
}
function thingCard(t = DATA.things[MODE]) {
  return `<div class="said"><div class="micro">The new thing, in your words</div><div class="w">${t.said}</div><p>${t.note}</p>
    <div class="from">${ic('pencil-line', 12)}${t.from}</div></div>`;
}
function kindChip(k, count = true) {
  return `<span class="kind">${ic(k.icon)}<span>${k.word}</span>${count ? `<span class="c">${fmt(k.n)}</span>` : ''}${st(k.studio)}</span>`;
}
function nearHTML(list = DATA.near[MODE], opt = {}) {
  const head = opt.head ?? (MODE === 'fits' ? 'Is it one of these?' : 'Closest we already keep');
  const why = opt.why ?? (MODE === 'fits'
    ? `If it is, what you know is added to that record instead of making a second one. ${DATA.matching.note}`
    : `None is the same kind of thing. Shown so you can check before asking for a new kind. ${DATA.matching.note}`);
  return `<div class="near"><h3>${head}${st(W('near')[1])}</h3><p class="why">${why}</p>
    ${list.map((n, i) => `<div class="nm${n.lead ? ' lead' : ''}" data-nm="${n.id}">
      <div class="t"><b>${n.name}</b>${kindChip(K(n.kind), false)}</div>
      <div class="where">${n.where}</div>
      <ul>${n.same.map(s => `<li class="same">${ic('check', 12)}${s}</li>`).join('')}${n.diff.map(s => `<li class="diff">${ic('x', 12)}${s}</li>`).join('')}</ul>
      ${MODE === 'fits' && !opt.noActs ? `<div class="acts"><button class="btn${n.lead ? ' go' : ' quiet'}" data-same="${n.id}">That’s it: add to it${n.lead ? ' <span class="kbd">Y</span>' : ''}</button></div>` : ''}
    </div>`).join('')}
    ${MODE === 'fits' && !opt.noActs ? `<button class="btn" data-new>None of these: it’s new <span class="kbd">Enter</span></button>` : ''}</div>`;
}
function detRows(k, t) {
  return k.has.map(h => {
    if (t.known && t.known[h]) return `<div class="k">${h}</div><div class="v">${t.known[h]}</div>`;
    const who = t.gaps && t.gaps[h];
    return `<div class="k">${h}</div><div class="v"><span class="gap"><span>Not known yet</span><span>${who ? `<b>${who}</b> could fill it` : 'Nobody named yet: Triage will ask'}</span></span></div>`;
  }).join('');
}
/* the last step of every path: what goes to Triage, who checks it, what is still missing */
function slipHTML(kind, same) {
  const t = DATA.things[MODE], s = DATA.steward, a = DATA.admin;
  if (MODE === 'misfit') {
    const p = DATA.predicted.find(x => x.genus === t.genus && x.shape === t.shape);
    const prior = p && p.asks.length ? p.asks.map(x => `${x.by} asked for this on ${x.on}`).join('; ') : '';
    return `<div class="slip waiting"><div class="stamp">${ic('hourglass', 12)}Waiting for a kind${st(W('ask')[1])}</div>
      <h3>${t.said}</h3>
      <p>No kind of thing we keep fits it, so it can’t be placed yet. It waits in <b>Triage</b>, under <b>Unplaced</b>, with everything you said kept.</p>
      <div class="who">${ic('user-round-check')}<span><b>${a.name}</b>, ${a.role} (${a.floor}), decides new kinds. Asked for: <b>“${p ? p.word : 'a new kind'}”</b>, ${t.words}.${prior ? ` ${prior}: yours is added to that ask (${p.asks.length + 1} asks).` : ''}</span>
        ${ic('clipboard-list')}<span>Your answers go with the ask, so ${a.name.split(' ')[0]} sees why nothing fitted.</span>
        ${ic('link')}<span>Until then it can’t be linked to other things. You can still attach the documents it came from.</span></div>
      <p class="m">Closest kind: ${K(t.closest).word}. Putting it there would leave ${K(t.closest).has[0]} as a gap nobody can ever fill.</p>
      <button class="btn quiet" aria-disabled="true" title="Possible, but ${s.name} would see you weren’t sure">Put it under ${K(t.closest).word} anyway</button></div>`;
  }
  const k = K(kind);
  if (same) {
    const n = DATA.near.fits.find(x => x.id === same);
    return `<div class="slip"><div class="stamp">${ic('inbox', 12)}Sent to Triage, as an addition</div><h3>Add to ${n.name}</h3>
      <p>What you know is proposed as details of the record we already keep. Where you disagree with it (${n.diff[0].toLowerCase()}), both are shown side by side until it’s decided.</p>
      <div class="who">${ic('user-round-check')}<span><b>${s.name}</b>, ${s.role} (${s.floor}), checks it. Nothing skips Triage.</span></div></div>`;
  }
  return `<div class="slip"><div class="stamp">${ic('inbox', 12)}Sent to Triage, as a new ${k.word}</div><h3>${t.said}</h3>
    <div class="det">${detRows(k, t)}</div>
    <div class="who">${ic('user-round-check')}<span><b>${s.name}</b>, ${s.role} (${s.floor}), checks it before it’s kept. Nothing skips Triage.</span>
    ${ic('waypoints')}<span>Links proposed with it: ${t.links.map(l => `${l[0]} <b>${l[1]}</b>`).join(', ')}.</span></div></div>`;
}
function keys(list) {
  $('#keys').innerHTML = list.map(([k, l]) => `<span><span class="kbd">${k}</span>${l}</span>`).join('');
}
function reveal(el) { if (!el) return; el.classList.add('fade', 'pre'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('pre'))); }

function boot(V) {
  frame(V);
  const go = () => { clearLater(); V.reset(); steps(0); keys([...V.keys(), ['N', MODE === 'fits' ? 'nothing fits' : 'one that fits'], ['S', 'studio words'], ['R', 'replay']]); later(() => V.demo(), ms('--motion-run')); };
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'r') { go(); return; }
    if (k === 'n') { MODE = MODE === 'fits' ? 'misfit' : 'fits'; go(); return; }
    if (k === 's') { document.body.classList.toggle('studio'); studioFoot(); if (V.onStudio) V.onStudio(); return; }
    if (V.key && V.key(e)) e.preventDefault();
  });
  document.addEventListener('click', e => {
    const s = e.target.closest('[data-same]'), n = e.target.closest('[data-new]');
    if (s && V.done) V.done(s.dataset.same);
    if (n && V.done) V.done(null);
  });
  go();
}

/* ====================== V1: The key ====================== */
const V = {
  title: 'Add a thing', sub: 'Answer the key, a or b, the way a field guide works. It ends at a kind of thing, or tells you none fits yet. <b>Then it goes to Triage.</b>',
  at: 1, path: [], result: undefined,
  keys() { return [['A B', 'choose'], ['⌫', 'back a step'], ['Y', 'that’s it'], ['Enter', 'it’s new']]; },
  reset() { this.at = 1; this.path = []; this.result = undefined; $('#thing').innerHTML = thingCard(); this.draw(); },
  draw() {
    const onPath = new Map(this.path.map(p => [p.n, p.ab]));
    $('#key').innerHTML = DATA.key.map(c => {
      const cls = this.result === undefined && c.n === this.at ? 'now' : onPath.has(c.n) ? 'past' : (this.path.length ? 'off' : '');
      const lead = ab => { const [txt, to] = c[ab];
        const took = onPath.get(c.n) === ab, left = onPath.has(c.n) && !took;
        const dest = typeof to === 'number' ? `<span class="to">go to ${to}</span>`
          : to ? `<span class="to kindto">${ic(K(to).icon)}${K(to).word}${st(K(to).studio)}</span>` : `<span class="to none">no kind yet</span>`;
        return `<button class="ld${took ? ' took' : ''}${left ? ' left' : ''}" data-c="${c.n}" data-ab="${ab}" ${cls === 'now' ? '' : 'tabindex="-1"'}><span class="ab">${c.n}${ab}</span><span>${txt}</span><span class="dots"></span>${dest}</button>`; };
      return `<div class="cp ${cls}" role="listitem"><span class="no">${c.n}</span><div>${lead('a')}${lead('b')}</div></div>`;
    }).join('');
    this.side();
  },
  possible() {
    // kinds reachable from the current couplet
    const reach = new Set(); const walk = n => { const c = DATA.key.find(x => x.n === n); for (const ab of ['a', 'b']) { const to = c[ab][1]; if (typeof to === 'number') walk(to); else if (to) reach.add(to); else reach.add('?'); } };
    if (this.result === undefined) walk(this.at); return reach;
  },
  side() {
    const r = $('#right');
    if (this.result === undefined) {
      const reach = this.possible();
      r.innerHTML = `<div class="poss"><h3>Still possible</h3>${DATA.kinds.map(k => `<div class="row${reach.has(k.id) ? '' : ' out'}">${kindChip(k)}<span class="r">${reach.has(k.id) ? '' : 'ruled out'}</span></div>`).join('')}
        <div class="elsew">${ic('file-text')}<span>Written down? A report, a letter or a form is kept in <b>Artifacts</b>. Data Atlas keeps what it’s about.</span></div>
        <p class="trail" style="margin-top:var(--space-3)">${this.path.length ? 'Your way through: ' + this.path.map(p => `<b>${p.n}${p.ab}</b>`).join(' → ') : ''}</p></div>`;
      return;
    }
    const trail = `<p class="trail">Your way through: ${this.path.map(p => `<b>${p.n}${p.ab}</b>`).join(' → ')}</p>`;
    if (this.result) {
      const k = K(this.result);
      r.innerHTML = `<div class="res"><div class="micro">It keys out as</div><div class="big">${ic(k.icon)}${k.word}</div>${st(k.studio)}<p>${k.says} We keep ${fmt(k.n)}.</p></div>${trail}<div id="nr">${nearHTML()}</div>`;
      steps(2); reveal($('#nr'));
    } else {
      const t = DATA.things.misfit, p = DATA.predicted.find(x => x.genus === t.genus && x.shape === t.shape);
      r.innerHTML = `<div class="res none"><div class="micro">The key ends at</div><div class="big">${ic('circle-dashed')}No kind yet</div><p>Nothing we keep ${p.diff}. The key says so, rather than making it fit.</p></div>${trail}<div id="nr">${slipHTML()}</div>`;
      steps(3, true); reveal($('#nr'));
    }
    Icons.hydrate(r);
  },
  choose(ab) {
    if (this.result !== undefined) return;
    const c = DATA.key.find(x => x.n === this.at), to = c[ab][1];
    this.path.push({ n: c.n, ab });
    if (typeof to === 'number') { this.at = to; steps(1); } else this.result = to;
    this.draw();
    const now = $('.cp.now .ld'); if (now) now.focus({ preventScroll: true });
  },
  back() { if (!this.path.length) return; const p = this.path.pop(); this.at = p.n; this.result = undefined; steps(this.path.length ? 1 : 0); this.draw(); },
  done(same) { if (MODE !== 'fits' || !this.result) return; $('#nr').innerHTML = slipHTML(this.result, same); steps(3); reveal($('#nr')); },
  demo() {
    steps(1);
    const path = DATA.things[MODE].keyPath;
    path.forEach((p, i) => later(() => this.choose(p.slice(-1)), ms('--motion-calm') * i));
  },
  key(e) {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'b') { this.choose(k); return true; }
    if (e.key === 'Backspace') { this.back(); return true; }
    if (k === 'y') { this.done('wu7'); return true; }
    if (e.key === 'Enter' && this.result) { this.done(null); return true; }
  }
};
document.addEventListener('click', e => { const l = e.target.closest('.cp.now .ld'); if (l) V.choose(l.dataset.ab); });
boot(V);
</script>
