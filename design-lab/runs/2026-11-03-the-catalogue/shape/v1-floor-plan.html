<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shape · V1 Floor plan</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ===== Shape of what we keep: shared by all six variants (generated into each page by _src/build.py) ===== */
:root{
  /* proposed --gap-ink: a detail a kind expects but a record lacks. Drawn as an empty socket, never as blank space */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink) 26%, transparent);
  /* proposed --gap-fill: the faint hatch inside a gap socket (lighter than wear-and-time's stale hatch: a gap is not old, it is missing) */
  --x-proposed-gap-fill: color-mix(in srgb, var(--ink) 7%, transparent);
  /* proposed --known: how much is known, as light. Thin knowledge is quiet, full knowledge is bright, never as bright as --light */
  --x-proposed-known: color-mix(in srgb, var(--ink) 78%, transparent);
  /* proposed --reach-out: something kept on a floor you can't see from here. Dashed edge + muted ink, always with words */
  --x-proposed-reach-out: color-mix(in srgb, var(--ink-muted) 60%, transparent);
  --x-here: var(--floor-department-high);
  --x-above: var(--floor-org-high);
  --x-below: var(--floor-team-high);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
[hidden]{display:none!important}
.lucide{flex:none}
.mono{font-family:var(--font-mono)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.kbd{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1)}
.water{position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 55% 110%, color-mix(in srgb, var(--navy) 42%, transparent), transparent 70%)}
.horizon{position:fixed;left:0;right:0;bottom:0;height:50%;pointer-events:none;background:radial-gradient(55% 70% at 58% 100%, color-mix(in srgb, var(--floor-department-low) 22%, transparent), transparent 75%)}
.scroll{scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* ===== app frame: rail · main · drawer ===== */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr) 0;transition:grid-template-columns var(--motion-calm) var(--ease-standard)}
.app.open{grid-template-columns:var(--measure-rail) minmax(0,1fr) calc(var(--measure-drawer) + var(--space-6))}
.rail{display:flex;flex-direction:column;gap:var(--space-1);padding:var(--edge-tight) var(--edge-tight) var(--space-6);background:color-mix(in srgb, var(--slate-deep) 70%, transparent);border-right:1px solid var(--hairline);min-width:0;overflow:hidden}
.appname{font-size:var(--type-meta);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);padding:var(--space-2) var(--space-3) var(--space-4)}
.nav{display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);color:var(--ink-muted);font-size:var(--type-meta);white-space:nowrap;flex:none}
.nav:hover{background:var(--surface-inset);color:var(--ink)}
.nav.lit{background:var(--surface-raised);color:var(--light)} .nav.lit .lucide{color:var(--green)}
.nav .n{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono)}
.rail-note{margin-top:auto;padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rail-note b{color:var(--ink);font-weight:400}

.main{position:relative;min-width:0;display:flex;flex-direction:column;padding:var(--space-4) var(--space-5) 0;overflow:hidden}
.head{display:flex;align-items:flex-end;gap:var(--space-4);flex:none;margin-bottom:var(--space-3)}
.head h1{margin:0;font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.head .sum{color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta);padding-bottom:var(--space-1)}
.head .sum b{color:var(--ink);font-weight:400}

/* floor strip: what this page can see, and from where */
.floors{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);flex:none;margin-bottom:var(--space-3)}
.fl{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--space-5);padding:0 var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--hairline);white-space:nowrap}
.fl i.dot{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--c)}
.fl.here{border-color:color-mix(in srgb,var(--x-here) 50%,transparent);color:var(--ink)}
.fl.out{border-style:dashed;border-color:var(--x-proposed-reach-out)}
.fl.out i.dot{background:transparent;box-shadow:inset 0 0 0 1px var(--c)}

/* known bar: filled part = records that have it; the rest is a gap socket */
.kbar{position:relative;height:var(--space-1);border-radius:1px;background:var(--x-proposed-gap-fill);box-shadow:inset 0 0 0 1px var(--x-proposed-gap-ink)}
.kbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:1px;background:var(--x-proposed-known);width:calc(var(--p) * 1%)}
.gaphatch{background-image:repeating-linear-gradient(135deg,var(--x-proposed-gap-ink) 0 1px,transparent 1px var(--space-1))}

/* ===== the kind card (drawer): the same explanation in every variant ===== */
.drawer{position:relative;min-width:0;overflow:hidden;border-left:1px solid var(--hairline);background:var(--surface-pane);backdrop-filter:blur(var(--surface-blur));-webkit-backdrop-filter:blur(var(--surface-blur))}
.drawer-in{position:absolute;inset:0;width:calc(var(--measure-drawer) + var(--space-6));overflow:auto;padding:var(--space-5) var(--space-5) var(--space-8)}
.drawer .x{position:absolute;top:var(--space-3);right:var(--space-3);width:var(--target-sm);height:var(--target-sm);display:grid;place-items:center;border-radius:var(--radius-key);color:var(--ink-muted)}
.drawer .x:hover{background:var(--surface-inset);color:var(--ink)}
.kc-title{display:flex;align-items:baseline;gap:var(--space-3);margin:var(--space-2) 0 var(--space-2)}
.kc-title h2{margin:0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.kc-title .c{font:400 var(--type-meta)/1 var(--font-mono);color:var(--ink-muted)}
.kc-lede{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);margin:0 0 var(--space-4)}
.kc-sec{margin:var(--space-5) 0 var(--space-2);display:flex;align-items:baseline;gap:var(--space-2)}
.kc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:center;padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.kc-row .kbar{grid-column:1 / -1}
.kc-row .pc{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.kc-row .who{grid-column:1 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:flex-start}
.kc-row .who .lucide{margin-top:2px}
.kc-row.thin .pc{color:var(--ink)}
.kc-link{display:flex;gap:var(--space-2);align-items:flex-start;padding:var(--space-2) 0;font-size:var(--type-meta);line-height:var(--leading-meta);border-bottom:1px solid var(--hairline)}
.kc-link .lucide{margin-top:3px;color:var(--ink-muted)}
.kc-link b{font-weight:400;color:var(--light)}
.kc-link .sub{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.tech{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}
body:not(.show-tech) .tech{display:none}
.kc-admin{margin-top:var(--space-5);padding:var(--space-3);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.kc-admin b{color:var(--ink);font-weight:400}
.kc-act{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);white-space:nowrap}
.btn:hover{background:var(--surface-inset)}
.btn.pri{border-color:color-mix(in srgb,var(--green) 60%,transparent);color:var(--light)} .btn.pri .lucide{color:var(--green)}
.kc-out{padding:var(--space-3) var(--space-4);border:1px dashed var(--x-proposed-reach-out);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta)}
.kc-out p{margin:0 0 var(--space-2)}
.kc-out p:last-child{margin:0}

/* keys + caption */
.keys{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:var(--layer-chrome);display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-1);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft);background:var(--scrim);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key)}
.keys{transition:right var(--motion-calm) var(--ease-standard)}
.keys div{display:flex;gap:var(--space-2);align-items:center}
.toast{position:fixed;left:50%;bottom:var(--space-7);transform:translate(-50%,var(--travel-near));opacity:0;z-index:var(--layer-toast);max-width:var(--measure-glance);padding:var(--space-3) var(--space-4);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);font-size:var(--type-meta);line-height:var(--leading-meta);transition:opacity var(--motion-base) var(--ease-standard),transform var(--motion-base) var(--ease-out);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1400px){.hide-s{display:none!important}}
/* narrow screens: the card floats over the picture instead of squeezing it */
@media (max-width:1400px){
  .app.open{grid-template-columns:var(--measure-rail) minmax(0,1fr) 0}
  .drawer{position:fixed;top:0;bottom:0;right:0;width:calc(var(--measure-drawer) + var(--space-6));z-index:var(--layer-overlay);box-shadow:var(--shadow-overlay);transform:translateX(100%);transition:transform var(--motion-calm) var(--ease-standard);background:var(--surface-overlay)}
  .app.open .drawer{transform:none}
  .head .sum{max-width:var(--measure-read)}
}
.kc-out.gaphatch{background-image:repeating-linear-gradient(135deg,var(--x-proposed-gap-fill) 0 1px,transparent 1px var(--space-1))}


/* ===== V1: the library floor plan. Kinds are rooms, details are shelves, links are the hall between them ===== */
.plan{position:relative;flex:1;min-height:0;margin-bottom:var(--space-7)}
.plan #svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.storey{position:absolute;left:0;border-top:1px solid var(--hairline-strong);padding-top:var(--space-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.storey .eyebrow b{font-weight:400;color:var(--c)}
.room{position:absolute;display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-3);border:1px solid var(--hairline-strong);border-radius:2px;background:color-mix(in srgb,var(--slate-deep) 55%,transparent);transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard),opacity var(--motion-base) var(--ease-standard),filter var(--motion-base) var(--ease-standard);overflow:hidden}
.room::before{content:"";position:absolute;left:0;right:0;height:2px;background:var(--c);opacity:.7}
.room.up::before{bottom:0}.room.down::before{top:0}
.room:hover,.room.lit{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--slate-deep))}
.plan.focus .room:not(.lit):not(.near){opacity:.45;filter:saturate(.4)}
.room .rn{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light);white-space:nowrap}
.room .rc{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);margin-left:auto}
.shelves{display:flex;flex-direction:column;gap:var(--space-1);margin-top:var(--space-1)}
.shelf{display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.shelf span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf.thin span{color:var(--ink)}
.room .rf{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.door{position:absolute;height:2px;width:var(--space-5);background:var(--slate-deep)}
.annex{position:absolute;top:0;bottom:0;right:0;display:flex;flex-direction:column;gap:var(--space-2)}
.annex .eyebrow{margin-top:var(--space-2)}
.cell{display:flex;gap:var(--space-2);align-items:flex-start;padding:var(--space-2) var(--space-3);border:1px dashed var(--x-proposed-reach-out);border-radius:2px;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);transition:border-color var(--motion-base)}
.cell b{display:block;font-weight:400;color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta)}
.cell:hover,.cell.lit{border-color:var(--ink-muted)}
.cell .lucide{margin-top:var(--space-1)}
.cell.locked{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.cell.locked .lucide{color:var(--c)}
.lk{fill:none;stroke:var(--ink-muted);stroke-linecap:round;opacity:.35;transition:opacity var(--motion-base),stroke var(--motion-base)}
.lk.thin{stroke-dasharray:2 5}
.lk.on{opacity:1;stroke:var(--light)}
.lk.out{stroke-dasharray:1 4;opacity:.3}
.lbl{font:400 11px/1 var(--font-mono);fill:var(--ink);letter-spacing:.02em;opacity:0;transition:opacity var(--motion-base)}
.lbl.on{opacity:1}
.lblbg{fill:var(--slate-deep);opacity:0;transition:opacity var(--motion-base)}
.lblbg.on{opacity:.9}
.hall{font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;fill:var(--ink-muted);opacity:.6}
.here-mark{position:absolute;display:flex;align-items:center;gap:var(--space-1);font:400 var(--type-small)/1 var(--font-mono);color:var(--green);white-space:nowrap}

</style></head>
<body>
<div class="water"></div><div class="horizon"></div>

<div class="app">
  <nav class="rail" aria-label="Data Atlas"></nav>
  <main class="main">
    <div class="head"><h1>What we keep</h1><div class="sum" id="sum"></div></div>
    <div class="floors" id="floors"></div>
    <div class="plan" id="plan"><svg id="svg" aria-hidden="true"></svg></div>
  </main>
  <aside class="drawer" aria-label="Kind of thing"><div class="drawer-in scroll"></div></aside>
</div>
<div class="x-cap"><b>Shape · V1</b> floor plan: kinds are rooms, details are shelves, links run through the hall · library floor plans, Chen ER, Bertin</div>

<div class="toast" role="status" aria-live="polite"></div>
<div class="keys"></div>
<script>
/* ===== Sample data: every name, label, count and word on this page comes from here.
   A deployment's ontology (kinds, details, links) and its counts. Swap this object and the page redraws. ===== */
const DATA = {
  app: 'Data Atlas',
  viewer: { name: 'Mira Chen', memberOf: ['dept-ops'] },
  here: 'dept-ops',
  /* floors: kind = org | department | team, parent = the floor above */
  floors: [
    { id: 'org',        kind: 'org',        name: 'Northvale Regional Services' },
    { id: 'dept-ops',   kind: 'department', name: 'Operations',  parent: 'org' },
    { id: 'dept-fin',   kind: 'department', name: 'Finance',     parent: 'org' },
    { id: 'team-depot', kind: 'team',       name: 'Depot North', parent: 'dept-ops' }
  ],
  /* the big families every kind sits in (plain word, the ontology's word one step down) */
  groups: [
    { id: 'who',    plain: 'People and organisations', tech: 'cco:Agent' },
    { id: 'where',  plain: 'Places',                    tech: 'bfo:Site · cco:GeospatialRegion' },
    { id: 'things', plain: 'Things we run',             tech: 'cco:MaterialArtifact' },
    { id: 'happen', plain: 'Things that happen',        tech: 'bfo:Process · cco:Act' },
    { id: 'papers', plain: 'Agreements and papers',     tech: 'cco:InformationContentEntity' }
  ],
  /* kinds of thing. details: [plain name, % of records that have it, link target kind (if the detail is a link)]
     gapBy: who could fill what's missing. usedBy: intents in Mandate and documents in Artifacts that rely on this kind */
  kinds: [
    { id: 'person', sym: 'Pe', plain: 'People', one: 'person', tech: 'cco:Person', group: 'who', floor: 'org', count: 1942,
      about: 'Everyone who works for or with the organisation.', steward: 'People team', triage: 6,
      details: [['Name', 100], ['Role', 93], ['Works at', 81, 'site'], ['Phone', 64], ['Start date', 47]],
      gapBy: 'People team, or each person from Home', usedBy: { intents: 4, docs: 210 } },
    { id: 'supplier', sym: 'Su', plain: 'Suppliers', one: 'supplier', tech: 'cco:Organization', group: 'who', floor: 'org', count: 386,
      about: 'Companies we buy goods or services from.', steward: 'Procurement', triage: 11,
      details: [['Name', 100], ['Company number', 88], ['Address', 91], ['Contact person', 54, 'person'], ['Insurance expiry', 31]],
      gapBy: 'Procurement, from the supplier questionnaire', usedBy: { intents: 9, docs: 640 } },
    { id: 'site', sym: 'Si', plain: 'Sites', one: 'site', tech: 'cco:Facility', group: 'where', floor: 'org', count: 214,
      about: 'Buildings and yards we run services from.', steward: 'Estates', triage: 2,
      details: [['Name', 100], ['Address', 99], ['Service area', 97, 'area'], ['Opening hours', 58], ['Step-free entrance', 22]],
      gapBy: 'Estates, or the site lead', usedBy: { intents: 12, docs: 380 } },
    { id: 'area', sym: 'Ar', plain: 'Service areas', one: 'service area', tech: 'cco:GeospatialRegion', group: 'where', floor: 'org', count: 38,
      about: 'The districts we serve.', steward: 'Planning', triage: 0,
      details: [['Name', 100], ['Boundary', 100], ['Population', 74]],
      gapBy: 'Planning, from the census tables', usedBy: { intents: 3, docs: 44 } },
    { id: 'vehicle', sym: 'Ve', plain: 'Vehicles', one: 'vehicle', tech: 'cco:GroundVehicle', group: 'things', floor: 'dept-ops', count: 612,
      about: 'Every van, gritter and car the fleet runs.', steward: 'Fleet team', triage: 4,
      details: [['Registration', 100], ['Make and model', 98], ['Based at', 93, 'site'], ['Next service due', 71], ['Mileage', 44], ['Usual driver', 38, 'person']],
      gapBy: 'Fleet team, or the fleet register in Artifacts', usedBy: { intents: 7, docs: 290 } },
    { id: 'equipment', sym: 'Eq', plain: 'Equipment', one: 'piece of equipment', tech: 'cco:Artifact', group: 'things', floor: 'dept-ops', count: 2340,
      about: 'Plant, tools and machines that need checking.', steward: 'Maintenance', triage: 9,
      details: [['Name', 100], ['Serial number', 76], ['Installed at', 82, 'site'], ['Maintained by', 51, 'supplier'], ['Last checked', 29]],
      gapBy: 'Maintenance, or Depot North from inspections', usedBy: { intents: 5, docs: 520 } },
    { id: 'incident', sym: 'In', plain: 'Incidents', one: 'incident', tech: 'cco:Act', group: 'happen', floor: 'dept-ops', count: 1108,
      about: 'Things that went wrong and were reported.', steward: 'Operations control', triage: 14,
      details: [['When', 100], ['What happened', 100], ['Where', 87, 'site'], ['Severity', 79], ['Reported by', 66, 'person'], ['Vehicle involved', 34, 'vehicle']],
      gapBy: 'Operations control, or whoever reported it', usedBy: { intents: 11, docs: 930 } },
    { id: 'contract', sym: 'Co', plain: 'Contracts', one: 'contract', tech: 'cco:Contract', group: 'papers', floor: 'dept-ops', count: 274,
      about: 'What we agreed with suppliers, and for how long.', steward: 'Commercial team', triage: 3,
      details: [['Reference', 100], ['With', 96, 'supplier'], ['Starts', 92], ['Ends', 88], ['Value', 61], ['Covers', 58, 'site']],
      gapBy: 'Commercial team, from the signed copy in Artifacts', usedBy: { intents: 6, docs: 406 } },
    /* kept on a floor you can't see from here */
    { id: 'invoice', sym: 'Iv', plain: 'Invoices', one: 'invoice', tech: 'cco:Invoice', group: 'papers', floor: 'dept-fin',
      about: 'Bills from suppliers against contracts.', ask: 'Priya Nair', askRole: 'Finance data steward' },
    { id: 'inspection', sym: 'Is', plain: 'Inspections', one: 'inspection', tech: 'cco:Act', group: 'happen', floor: 'team-depot',
      about: 'Checks done on equipment at the depot.', ask: 'Dan Osei', askRole: 'Depot North lead' }
  ],
  /* in the ontology, but nobody keeps any yet; or a word sources asked for that admins haven't decided */
  unadopted: [
    { id: 'route', sym: 'Ro', plain: 'Routes', group: 'where', tech: 'cco:Route', why: 'In the ontology, nobody keeps any yet.' },
    { id: 'permit', sym: 'Pm', plain: 'Permits', group: 'papers', tech: 'cco:Permit', why: 'In the ontology, nobody keeps any yet.' },
    { id: 'depot', sym: 'De', plain: 'Depots', group: 'where', asked: 14, why: 'Sources used this word 14 times. Admins decide whether it means Sites.' },
    { id: 'skill', sym: 'Sk', plain: 'Qualifications', group: 'who', asked: 5, why: 'Sources used this word 5 times. Admins decide whether to add it.' }
  ],
  admins: 'Sam Okafor (Data Atlas admin)',
  /* kinds of link. cover = % of the "from" kind that have this link */
  links: [
    { from: 'vehicle',   verb: 'is based at',     to: 'site',     count: 569,  cover: 93, tech: 'cco:located_in' },
    { from: 'vehicle',   verb: 'is usually driven by', to: 'person', count: 233, cover: 38, tech: 'cco:has_operator' },
    { from: 'equipment', verb: 'is installed at', to: 'site',     count: 1919, cover: 82, tech: 'cco:located_in' },
    { from: 'equipment', verb: 'is maintained by', to: 'supplier', count: 1193, cover: 51, tech: 'cco:maintained_by' },
    { from: 'incident',  verb: 'happened at',     to: 'site',     count: 964,  cover: 87, tech: 'cco:occurs_at' },
    { from: 'incident',  verb: 'involved',        to: 'vehicle',  count: 377,  cover: 34, tech: 'cco:has_participant' },
    { from: 'incident',  verb: 'was reported by', to: 'person',   count: 731,  cover: 66, tech: 'cco:has_agent' },
    { from: 'contract',  verb: 'is with',         to: 'supplier', count: 263,  cover: 96, tech: 'cco:has_party' },
    { from: 'contract',  verb: 'covers',          to: 'site',     count: 159,  cover: 58, tech: 'cco:is_about' },
    { from: 'person',    verb: 'works at',        to: 'site',     count: 1573, cover: 81, tech: 'cco:has_workplace' },
    { from: 'supplier',  verb: 'has a contact',   to: 'person',   count: 208,  cover: 54, tech: 'cco:has_member' },
    { from: 'site',      verb: 'is in',           to: 'area',     count: 208,  cover: 97, tech: 'cco:located_in' },
    { from: 'invoice',   verb: 'is against',      to: 'contract', tech: 'cco:is_about' },
    { from: 'inspection', verb: 'checked',        to: 'equipment', tech: 'cco:has_participant' }
  ],
  /* where what's known came from, and what relies on it (other pillar apps) */
  sources: { docs: 3420, docsApp: 'Artifacts', intents: 57, intentsApp: 'Mandate' },
  thin: 70 /* below this % known, a kind or detail reads as "thin" */
};

/* ===== helpers ===== */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = getComputedStyle(document.documentElement);
const T = n => parseFloat(css.getPropertyValue('--motion-' + n)) || 0;
const PX = n => parseFloat(css.getPropertyValue('--' + n)) || 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = n => n.toLocaleString('en-GB');
const K = id => DATA.kinds.find(k => k.id === id) || DATA.unadopted.find(k => k.id === id);
const F = id => DATA.floors.find(f => f.id === id);
const HERE = F(DATA.here);
const floorWord = f => ({ org: 'Org', department: 'Department', team: 'Team' })[f.kind];
const floorColor = f => 'var(--floor-' + f.kind + '-high)';
/* which floors this floor can see: itself and every floor above */
const visibleFloors = (() => { const out = []; let f = HERE; while (f) { out.push(f.id); f = f.parent && F(f.parent); } return out; })();
/* reach: here | above | below | aside | none */
function reach(k){
  if (!k.floor) return 'none';
  if (k.floor === DATA.here) return 'here';
  if (visibleFloors.includes(k.floor)) return 'above';
  const f = F(k.floor); return f.parent === DATA.here ? 'below' : 'aside';
}
const seen = k => ['here', 'above'].includes(reach(k));
const SEEN = DATA.kinds.filter(seen);
const OUT = DATA.kinds.filter(k => !seen(k));
const known = k => k.details ? Math.round(k.details.reduce((a, d) => a + d[1], 0) / k.details.length) : 0;
const isThin = p => p < DATA.thin;
const linksOf = id => DATA.links.filter(l => l.from === id || l.to === id);
const visibleLink = l => seen(K(l.from)) && seen(K(l.to));
const missing = (k, d) => Math.round(k.count * (100 - d[1]) / 100);
const totalSeen = SEEN.reduce((a, k) => a + k.count, 0);
const art = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;
const techId = s => s.toLowerCase().replace(/[^a-z]+/g, '_').replace(/^_|_$/g, '');
const reachWords = k => {
  const f = F(k.floor), r = reach(k);
  if (r === 'here') return 'kept here on ' + f.name;
  if (r === 'above') return 'kept on ' + f.name + ' (' + floorWord(f) + '), above you';
  if (r === 'below') return 'kept on ' + f.name + ' (' + floorWord(f) + ' floor under ' + HERE.name + ')';
  if (r === 'aside') return 'kept on ' + f.name + ' (another ' + floorWord(f) + ')';
  return 'not kept yet';
};

/* ===== shell: rail, floor strip ===== */
function mountShell(lit){
  const triage = SEEN.reduce((a, k) => a + (k.triage || 0), 0);
  document.querySelector('.rail').innerHTML =
    '<div class="appname">' + esc(DATA.app) + '</div>' +
    [['shapes', 'What we keep', '', 'shape'], ['list', 'Everything', nf(totalSeen)], ['inbox', 'Triage', triage], ['scale', 'Disputes', 3], ['file-text', 'Sources', nf(DATA.sources.docs)]]
      .map(([i, t, n, id]) => '<button class="nav' + (id === lit ? ' lit' : '') + '"><i data-lucide="' + i + '"></i>' + t + '<span class="n">' + n + '</span></button>').join('') +
    '<div class="rail-note">This page shows <b>kinds of thing</b>, not records. A floor shows what is kept on it and on the floors above. <span class="kbd">T</span> shows the ontology\'s words, for admins.</div>';
}
function floorStrip(){
  const up = visibleFloors.slice().reverse().map(id => F(id));
  const out = DATA.floors.filter(f => !visibleFloors.includes(f.id));
  return '<span>You are on</span>' +
    '<span class="fl here" style="--c:' + floorColor(HERE) + '"><i class="dot"></i>' + esc(HERE.name) + ' · ' + floorWord(HERE) + '</span>' +
    '<span>and can see</span>' + up.filter(f => f.id !== DATA.here).map(f => '<span class="fl" style="--c:' + floorColor(f) + '"><i class="dot"></i>' + esc(f.name) + ' · ' + floorWord(f) + '</span>').join('') +
    '<span>· out of reach</span>' + out.map(f => '<span class="fl out" style="--c:' + floorColor(f) + '"><i class="dot"></i>' + esc(f.name) + ' · ' + floorWord(f) + '</span>').join('');
}

/* ===== the kind card: one explanation for every variant ===== */
let onDrawer = () => {};
function openKind(id){
  const k = K(id); if (!k) return;
  const app = document.querySelector('.app'), d = document.querySelector('.drawer-in');
  let h = '<button class="x" aria-label="Close" data-close><i data-lucide="x"></i></button>';
  const r = reach(k);
  if (r === 'none'){
    h += '<div class="eyebrow">Not kept yet</div><div class="kc-title"><h2>' + esc(k.plain) + '</h2></div>' +
      '<p class="kc-lede">' + esc(k.why) + '</p>' +
      '<div class="kc-out gaphatch"><p>This is a gap in what we keep, not in any one record. Nothing is lost: there was never a place for it.</p><p>Who decides: <b>' + esc(DATA.admins) + '</b>.</p></div>' +
      (k.tech ? '<p class="tech">class · ' + k.tech + ' · in the Common Core Ontologies profile, not adopted</p>' : '<p class="tech">no class yet · a term asked for by sources</p>') +

  } else if (!seen(k)){
    const f = F(k.floor);
    h += '<div class="eyebrow">Out of reach from ' + esc(HERE.name) + '</div><div class="kc-title"><h2>' + esc(k.plain) + '</h2><span class="c">count not shown</span></div>' +
      '<p class="kc-lede">' + esc(k.about) + '</p>' +
      '<div class="kc-out" style="border-color:color-mix(in srgb,' + floorColor(f) + ' 50%,transparent)"><p><b>Where:</b> ' + esc(reachWords(k)) + '.</p>' +
      '<p><b>Why you can\'t see them:</b> ' + (r === 'below' ? 'a floor shows what is kept on it and above, never below. They show on ' + esc(f.name) + ' itself.' : 'they belong to another ' + floorWord(f) + ', and you are not a member.') + '</p>' +
      '<p><b>Who to ask:</b> ' + esc(k.ask) + ', ' + esc(k.askRole) + '.</p></div>' +
      '<p class="tech">class · ' + k.tech + ' · floor ' + esc(k.floor) + '</p>' +
      '<div class="kc-act"><button class="btn pri"><i data-lucide="message-square"></i>Ask ' + esc(k.ask.split(' ')[0]) + '</button></div>';
  } else {
    const f = F(k.floor), p = known(k);
    h += '<div class="eyebrow" style="color:' + floorColor(f) + '">Kind of thing · ' + esc(reachWords(k)) + '</div>' +
      '<div class="kc-title"><h2>' + esc(k.plain) + '</h2><span class="c">' + nf(k.count) + ' kept</span></div>' +
      '<p class="tech">class · ' + k.tech + '</p>' +
      '<p class="kc-lede">' + esc(k.about) + ' Looked after by <b>' + esc(k.steward) + '</b>. On average ' + p + '% of the details are known.</p>' +
      '<div class="kc-sec"><span class="eyebrow">Details each ' + esc(k.one) + ' can have</span></div>' +
      k.details.map(dd => { const m = missing(k, dd), th = isThin(dd[1]);
        return '<div class="kc-row' + (th ? ' thin' : '') + '"><span>' + esc(dd[0]) + (dd[2] ? ' <span class="tech">→ ' + esc(K(dd[2]).plain) + '</span>' : '') + ' <span class="tech">· ' + (dd[2] ? 'object' : 'data') + ' property · ' + techId(dd[0]) + '</span></span><span class="pc">' + dd[1] + '%</span>' +
          '<span class="kbar" style="--p:' + dd[1] + '"><i></i></span>' +
          (m ? '<span class="who"><i data-lucide="user-round-pen" data-size="12"></i><span>' + nf(m) + ' don\'t have it yet · ' + esc(k.gapBy) + ' could fill it</span></span>' : '') + '</div>'; }).join('') +
      '<div class="kc-sec"><span class="eyebrow">How ' + esc(k.plain.toLowerCase()) + ' connect</span></div>' +
      linksOf(k.id).map(l => { const a = K(l.from), b = K(l.to), vis = visibleLink(l);
        if (!vis){ const o = seen(a) ? b : a;
          return '<div class="kc-link" style="opacity:.75"><i data-lucide="lock"></i><span>' + esc(a.plain) + ' ' + esc(l.verb) + ' ' + esc(b.plain.toLowerCase()) + '<span class="sub">' + esc(o.plain) + ' are ' + esc(reachWords(o)) + '. Ask ' + esc(o.ask) + '.</span></span></div>'; }
        return '<div class="kc-link"><i data-lucide="' + (l.from === k.id ? 'arrow-right' : 'arrow-left') + '"></i><span>' + (l.from === k.id ? 'Each ' + esc(a.one) + ' <b>' + esc(l.verb) + '</b> ' + esc(art(b.one)) : esc(art(a.one)).replace(/^a/, 'A') + ' <b>' + esc(l.verb) + '</b> ' + esc(art(b.one))) +
          '<span class="sub">' + nf(l.count) + ' links · ' + l.cover + '% of ' + esc(a.plain.toLowerCase()) + ' say which' + (isThin(l.cover) ? ' · thin' : '') + '</span><span class="tech">object property · ' + l.tech + '</span></span></div>'; }).join('') +
      '<div class="kc-sec"><span class="eyebrow">Relied on by</span></div>' +
      '<div class="kc-link"><i data-lucide="target"></i><span>' + k.usedBy.intents + ' intents in ' + esc(DATA.sources.intentsApp) + '<span class="sub">' + nf(k.usedBy.docs) + ' documents in ' + esc(DATA.sources.docsApp) + ' are where what\'s known came from</span></span></div>' +
      '<div class="kc-act"><button class="btn pri"><i data-lucide="list"></i>Open the ' + nf(k.count) + ' ' + esc(k.plain.toLowerCase()) + '</button>' +
      (k.triage ? '<button class="btn"><i data-lucide="inbox"></i>' + k.triage + ' waiting in triage</button>' : '') + '</div>' +
      '<div class="kc-admin tech">For admins: kinds, details and links come from the Common Core Ontologies profile. Changed in the studio by ' + esc(DATA.admins) + '. Exports as OWL.</div>';
  }
  d.innerHTML = h; Icons.hydrate(d); d.scrollTop = 0;
  app.classList.add('open'); onDrawer(id);
}
function closeKind(){ document.querySelector('.app').classList.remove('open'); onDrawer(null); }

/* ===== toast, keys, demo + replay ===== */
let toastT;
function toast(html){ const t = document.querySelector('.toast'); t.innerHTML = html; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), T('toast')); }
function keys(rows){ document.querySelector('.keys').innerHTML = rows.map(r => '<div>' + r + '</div>').join(''); }
let demoT = [];
const later = (fn, ms) => demoT.push(setTimeout(fn, ms));
function boot(reset, demo){
  const go = () => { demoT.forEach(clearTimeout); demoT = []; closeKind(); reset(); later(demo, T('run')); };
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input')) return;
    if (e.key === 'r' || e.key === 'R') go();
    else if (e.key === 't' || e.key === 'T'){ document.body.classList.toggle('show-tech'); toast(document.body.classList.contains('show-tech') ? 'Showing the ontology\'s words one step down (for admins). <span class="kbd">T</span> hides them.' : 'Plain words only.'); }
    else if (e.key === 'Escape') closeKind();
  });
  document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeKind(); });
  go();
}
const ICON = { person: 'users', supplier: 'building-2', site: 'map-pin', area: 'map', vehicle: 'truck', equipment: 'wrench', incident: 'siren', contract: 'file-signature', invoice: 'receipt', inspection: 'clipboard-check', route: 'route', permit: 'file-badge', depot: 'warehouse', skill: 'award' };


const plan = document.getElementById('plan'), svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
let geo = {}, labels = [];
function layout(){
  plan.querySelectorAll('.room,.storey,.annex,.here-mark').forEach(n => n.remove());
  svg.innerHTML = '';
  const W = plan.clientWidth, H = plan.clientHeight, g = PX('space-3');
  const annexW = Math.max(200, W * 0.2), PW = W - annexW - PX('space-5');
  const upper = SEEN.filter(k => reach(k) === 'above'), lower = SEEN.filter(k => reach(k) === 'here');
  const top = PX('space-5'), rowH = (H - top * 3) * 0.4, hallH = (H - top * 3) * 0.2;
  const rows = [[upper, top, 'up'], [lower, top * 2 + rowH + hallH, 'down']];
  const fUp = F(upper[0].floor);
  [[fUp, 0, 'Upstairs'], [HERE, top + rowH + hallH, 'This floor']].forEach(([f, y, w]) => {
    const s = document.createElement('div'); s.className = 'storey'; s.style.cssText = 'top:' + y + 'px;width:' + PW + 'px;--c:' + floorColor(f);
    s.innerHTML = '<span class="eyebrow">' + w + ' · <b>' + esc(f.name) + '</b> · ' + floorWord(f) + (w === 'Upstairs' ? ' · you can read it, its stewards keep it' : '') + '</span>'; plan.appendChild(s);
  });
  geo = {}; labels = [];
  rows.forEach(([list, y, side]) => {
    const ws = list.map(k => Math.sqrt(k.count)), sum = ws.reduce((a, b) => a + b, 0);
    const avail = PW - g * (list.length - 1); let x = 0;
    /* width = an even share plus a share by size (sqrt of the count), so small kinds stay readable */
    const share = list.map((k, i) => 0.65 / list.length + 0.35 * ws[i] / sum);
    list.forEach((k, i) => {
      const w = avail * share[i];
      const r = document.createElement('button'); r.className = 'room ' + side; r.dataset.id = k.id;
      r.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + (w - 0) + 'px;height:' + rowH + 'px;--c:' + floorColor(F(k.floor));
      const p = known(k);
      r.innerHTML = '<span class="rn"><i data-lucide="' + ICON[k.id] + '" data-size="14"></i>' + esc(k.plain) + '<span class="rc">' + nf(k.count) + '</span></span>' +
        '<span class="shelves">' + k.details.slice(0, Math.floor((rowH - 70) / 26)).map(d => '<span class="shelf' + (isThin(d[1]) ? ' thin' : '') + '"><span>' + esc(d[0]) + ' · ' + d[1] + '%</span><span class="kbar" style="--p:' + d[1] + '"><i></i></span></span>').join('') + '</span>' +
        '<span class="rf">' + (k.triage ? k.triage + ' waiting in triage · ' : '') + k.details.filter(d => isThin(d[1])).length + ' thin shelves</span><span class="tech">' + k.tech + '</span>';
      r.setAttribute('aria-label', k.plain + ', ' + k.count + ' kept, ' + p + '% of details known');
      r.onclick = () => select(k.id);
      plan.appendChild(r);
      geo[k.id] = { x: x + w / 2, y: side === 'up' ? y + rowH : y, w, side };
      x += w + g;
    });
  });
  /* the hall: links between rooms */
  const hallTop = top + rowH, hallMid = hallTop + (hallH + top) / 2;
  const t = document.createElementNS(NS, 'text'); t.setAttribute('class', 'hall'); t.setAttribute('x', PW); t.setAttribute('y', hallMid + 4); t.setAttribute('text-anchor', 'end'); t.textContent = 'the hall · how kinds connect'; svg.appendChild(t);
  const vis = DATA.links.filter(visibleLink), maxC = Math.max(...vis.map(l => l.count));
  const used = {};
  vis.forEach((l, i) => {
    const a = geo[l.from], b = geo[l.to];
    /* spread each link's door along the room's hall wall */
    const off = id => { used[id] = (used[id] || 0) + 1; const n = linksOf(id).filter(visibleLink).length; return (used[id] - (n + 1) / 2) * Math.min(PX('space-4'), geo[id].w / (n + 1)); };
    const ax = a.x + off(l.from), bx = b.x + off(l.to);
    let d;
    if (a.side === b.side){ const dip = (a.side === 'up' ? 1 : -1) * (PX('space-5') + Math.abs(ax - bx) * 0.08); d = 'M' + ax + ' ' + a.y + ' C' + ax + ' ' + (a.y + dip) + ' ' + bx + ' ' + (b.y + dip) + ' ' + bx + ' ' + b.y; }
    else d = 'M' + ax + ' ' + a.y + ' C' + ax + ' ' + hallMid + ' ' + bx + ' ' + hallMid + ' ' + bx + ' ' + b.y;
    const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d);
    p.setAttribute('class', 'lk' + (isThin(l.cover) ? ' thin' : '')); p.setAttribute('stroke-width', 1 + 3 * Math.sqrt(l.count / maxC));
    p.dataset.from = l.from; p.dataset.to = l.to; svg.appendChild(p);
    const len = p.getTotalLength(), m = p.getPointAtLength(len / 2);
    const txt = art(K(l.from).one) + ' ' + l.verb + ' ' + art(K(l.to).one) + ' · ' + l.cover + '% say';
    const bg = document.createElementNS(NS, 'rect'), tx = document.createElementNS(NS, 'text');
    tx.setAttribute('class', 'lbl'); tx.setAttribute('text-anchor', 'middle'); tx.textContent = txt;
    bg.setAttribute('class', 'lblbg'); bg.setAttribute('rx', 2);
    [bg, tx].forEach(n => { n.dataset.from = l.from; n.dataset.to = l.to; svg.appendChild(n); });
    labels.push({ l, p, tx, bg });
  });
  /* annex: locked rooms and rooms not built */
  const ax = document.createElement('div'); ax.className = 'annex'; ax.style.width = annexW + 'px';
  ax.innerHTML = '<span class="eyebrow">Locked rooms · kept elsewhere</span>' +
    OUT.map(k => { const f = F(k.floor); return '<button class="cell locked" data-id="' + k.id + '" style="--c:' + floorColor(f) + '"><i data-lucide="door-closed" data-size="14"></i><span><b>' + esc(k.plain) + '</b>' + esc(f.name) + ' · ' + floorWord(f) + (reach(k) === 'below' ? ', downstairs' : '') + '. Ask ' + esc(k.ask) + '.</span></button>'; }).join('') +
    '<span class="eyebrow">On the plan, never built</span>' +
    DATA.unadopted.map(k => '<button class="cell gaphatch" data-id="' + k.id + '"><i data-lucide="' + ICON[k.id] + '" data-size="14"></i><span><b>' + esc(k.plain) + '</b>' + (k.asked ? 'Asked for ' + k.asked + ' times' : 'In the ontology, none kept') + '</span></button>').join('');
  ax.querySelectorAll('.cell').forEach(c => c.onclick = () => select(c.dataset.id));
  plan.appendChild(ax);
  const hm = document.createElement('div'); hm.className = 'here-mark'; hm.style.cssText = 'left:0;top:' + (H - top + PX('space-2')) + 'px';
  hm.innerHTML = '<i data-lucide="map-pin" data-size="12"></i>You are here · ' + esc(HERE.name) + ' · Department';
  plan.appendChild(hm);
  Icons.hydrate(plan);
  if (cur) light(cur);
}
let cur = null;
function light(id){
  cur = id;
  plan.classList.toggle('focus', !!id);
  const near = new Set(id ? linksOf(id).flatMap(l => [l.from, l.to]) : []);
  plan.querySelectorAll('.room,.cell').forEach(r => { r.classList.toggle('lit', r.dataset.id === id); r.classList.toggle('near', near.has(r.dataset.id)); });
  svg.querySelectorAll('[data-from]').forEach(n => n.classList.toggle('on', !!id && (n.dataset.from === id || n.dataset.to === id)));
  /* place each lit label near the far room, so labels of one room fan out instead of piling up mid-hall */
  const placed = [];
  labels.filter(o => id && (o.l.from === id || o.l.to === id)).forEach(o => {
    const len = o.p.getTotalLength(), t = o.l.from === id ? 0.72 : 0.28; let m = o.p.getPointAtLength(len * t);
    let y = m.y; placed.forEach(q => { if (Math.abs(q.x - m.x) < 220 && Math.abs(q.y - y) < 18) y = q.y + 20; });
    const half = o.tx.getComputedTextLength() / 2 + 6, x = Math.min(Math.max(m.x, half), plan.clientWidth - half);
    o.tx.setAttribute('x', x); o.tx.setAttribute('y', y + 4); placed.push({ x: m.x, y });
    const bb = o.tx.getBBox(); o.bg.setAttribute('x', bb.x - 4); o.bg.setAttribute('y', bb.y - 2); o.bg.setAttribute('width', bb.width + 8); o.bg.setAttribute('height', bb.height + 4);
  });
}
function select(id){ light(id); openKind(id); }
onDrawer = id => { if (!id) light(null); setTimeout(layout, T('calm') + T('quick')); };
document.getElementById('sum').innerHTML = '<b>' + SEEN.length + '</b> kinds of thing · <b>' + nf(totalSeen) + '</b> kept · <b>' + DATA.links.filter(visibleLink).length + '</b> kinds of link · rooms sized by how many, shelves by how much is known';
document.getElementById('floors').innerHTML = floorStrip();
mountShell('shape'); Icons.hydrate(document.body);
keys(['click a room · <span class="kbd">Tab</span> <span class="kbd">Enter</span>', '<span class="kbd">T</span> ontology words · <span class="kbd">Esc</span> close', '<span class="kbd">R</span> replay']);
addEventListener('resize', layout);
boot(() => { light(null); layout(); }, () => select('vehicle'));
