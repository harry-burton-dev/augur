<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shape · V5 Line map</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ===== Shape of what we keep: shared by all six variants (generated into each page by _src/build.py) ===== */
:root{
  /* proposed --gap-ink: a detail a kind expects but a record lacks. Drawn as an empty socket, never as blank space */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink) 26%, transparent);
  /* proposed --gap-fill: the faint hatch inside a gap socket (lighter than wear-and-time's stale hatch: a gap is not old, it is missing) */
  --x-proposed-gap-fill: color-mix(in srgb, var(--ink) 7%, transparent);
  /* proposed --known: how much is known, as light. Thin knowledge is quiet, full knowledge is bright, never as bright as --light */
  --x-proposed-known: color-mix(in srgb, var(--ink) 78%, transparent);
  /* proposed --reach-out: something kept on a floor you can't see from here. Dashed edge + muted ink, always with words */
  --x-proposed-reach-out: color-mix(in srgb, var(--ink-muted) 60%, transparent);
  --x-here: var(--floor-department-high);
  --x-above: var(--floor-org-high);
  --x-below: var(--floor-team-high);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
[hidden]{display:none!important}
.lucide{flex:none}
.mono{font-family:var(--font-mono)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.kbd{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1)}
.water{position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 55% 110%, color-mix(in srgb, var(--navy) 42%, transparent), transparent 70%)}
.horizon{position:fixed;left:0;right:0;bottom:0;height:50%;pointer-events:none;background:radial-gradient(55% 70% at 58% 100%, color-mix(in srgb, var(--floor-department-low) 22%, transparent), transparent 75%)}
.scroll{scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* ===== app frame: rail · main · drawer ===== */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr) 0;transition:grid-template-columns var(--motion-calm) var(--ease-standard)}
.app.open{grid-template-columns:var(--measure-rail) minmax(0,1fr) calc(var(--measure-drawer) + var(--space-6))}
.rail{display:flex;flex-direction:column;gap:var(--space-1);padding:var(--edge-tight) var(--edge-tight) var(--space-6);background:color-mix(in srgb, var(--slate-deep) 70%, transparent);border-right:1px solid var(--hairline);min-width:0;overflow:hidden}
.appname{font-size:var(--type-meta);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);padding:var(--space-2) var(--space-3) var(--space-4)}
.nav{display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);color:var(--ink-muted);font-size:var(--type-meta);white-space:nowrap;flex:none}
.nav:hover{background:var(--surface-inset);color:var(--ink)}
.nav.lit{background:var(--surface-raised);color:var(--light)} .nav.lit .lucide{color:var(--green)}
.nav .n{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono)}
.rail-note{margin-top:auto;padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rail-note b{color:var(--ink);font-weight:400}

.main{position:relative;min-width:0;display:flex;flex-direction:column;padding:var(--space-4) var(--space-5) 0;overflow:hidden}
.head{display:flex;align-items:flex-end;gap:var(--space-4);flex:none;margin-bottom:var(--space-3)}
.head h1{margin:0;font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.head .sum{color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta);padding-bottom:var(--space-1)}
.head .sum b{color:var(--ink);font-weight:400}

/* floor strip: what this page can see, and from where */
.floors{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);flex:none;margin-bottom:var(--space-3)}
.fl{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--space-5);padding:0 var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--hairline);white-space:nowrap}
.fl i.dot{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--c)}
.fl.here{border-color:color-mix(in srgb,var(--x-here) 50%,transparent);color:var(--ink)}
.fl.out{border-style:dashed;border-color:var(--x-proposed-reach-out)}
.fl.out i.dot{background:transparent;box-shadow:inset 0 0 0 1px var(--c)}

/* known bar: filled part = records that have it; the rest is a gap socket */
.kbar{position:relative;height:var(--space-1);border-radius:1px;background:var(--x-proposed-gap-fill);box-shadow:inset 0 0 0 1px var(--x-proposed-gap-ink)}
.kbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:1px;background:var(--x-proposed-known);width:calc(var(--p) * 1%)}
.gaphatch{background-image:repeating-linear-gradient(135deg,var(--x-proposed-gap-ink) 0 1px,transparent 1px var(--space-1))}

/* ===== the kind card (drawer): the same explanation in every variant ===== */
.drawer{position:relative;min-width:0;overflow:hidden;border-left:1px solid var(--hairline);background:var(--surface-pane);backdrop-filter:blur(var(--surface-blur));-webkit-backdrop-filter:blur(var(--surface-blur))}
.drawer-in{position:absolute;inset:0;width:calc(var(--measure-drawer) + var(--space-6));overflow:auto;padding:var(--space-5) var(--space-5) var(--space-8)}
.drawer .x{position:absolute;top:var(--space-3);right:var(--space-3);width:var(--target-sm);height:var(--target-sm);display:grid;place-items:center;border-radius:var(--radius-key);color:var(--ink-muted)}
.drawer .x:hover{background:var(--surface-inset);color:var(--ink)}
.kc-title{display:flex;align-items:baseline;gap:var(--space-3);margin:var(--space-2) 0 var(--space-2)}
.kc-title h2{margin:0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.kc-title .c{font:400 var(--type-meta)/1 var(--font-mono);color:var(--ink-muted)}
.kc-lede{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);margin:0 0 var(--space-4)}
.kc-sec{margin:var(--space-5) 0 var(--space-2);display:flex;align-items:baseline;gap:var(--space-2)}
.kc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:center;padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.kc-row .kbar{grid-column:1 / -1}
.kc-row .pc{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.kc-row .who{grid-column:1 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:flex-start}
.kc-row .who .lucide{margin-top:2px}
.kc-row.thin .pc{color:var(--ink)}
.kc-link{display:flex;gap:var(--space-2);align-items:flex-start;padding:var(--space-2) 0;font-size:var(--type-meta);line-height:var(--leading-meta);border-bottom:1px solid var(--hairline)}
.kc-link .lucide{margin-top:3px;color:var(--ink-muted)}
.kc-link b{font-weight:400;color:var(--light)}
.kc-link .sub{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.tech{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}
body:not(.show-tech) .tech{display:none}
.kc-admin{margin-top:var(--space-5);padding:var(--space-3);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.kc-admin b{color:var(--ink);font-weight:400}
.kc-act{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);white-space:nowrap}
.btn:hover{background:var(--surface-inset)}
.btn.pri{border-color:color-mix(in srgb,var(--green) 60%,transparent);color:var(--light)} .btn.pri .lucide{color:var(--green)}
.kc-out{padding:var(--space-3) var(--space-4);border:1px dashed var(--x-proposed-reach-out);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta)}
.kc-out p{margin:0 0 var(--space-2)}
.kc-out p:last-child{margin:0}

/* keys + caption */
.keys{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:var(--layer-chrome);display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-1);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft);background:var(--scrim);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key)}
.keys{transition:right var(--motion-calm) var(--ease-standard)}
.keys div{display:flex;gap:var(--space-2);align-items:center}
.toast{position:fixed;left:50%;bottom:var(--space-7);transform:translate(-50%,var(--travel-near));opacity:0;z-index:var(--layer-toast);max-width:var(--measure-glance);padding:var(--space-3) var(--space-4);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);font-size:var(--type-meta);line-height:var(--leading-meta);transition:opacity var(--motion-base) var(--ease-standard),transform var(--motion-base) var(--ease-out);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1400px){.hide-s{display:none!important}}
/* narrow screens: the card floats over the picture instead of squeezing it */
@media (max-width:1400px){
  .app.open{grid-template-columns:var(--measure-rail) minmax(0,1fr) 0}
  .drawer{position:fixed;top:0;bottom:0;right:0;width:calc(var(--measure-drawer) + var(--space-6));z-index:var(--layer-overlay);box-shadow:var(--shadow-overlay);transform:translateX(100%);transition:transform var(--motion-calm) var(--ease-standard);background:var(--surface-overlay)}
  .app.open .drawer{transform:none}
  .head .sum{max-width:var(--measure-read)}
}
.kc-out.gaphatch{background-image:repeating-linear-gradient(135deg,var(--x-proposed-gap-fill) 0 1px,transparent 1px var(--space-1))}


/* ===== V5: a Beck-style line map. Kinds are stations, chains of links are lines you can ride, floors are zones ===== */
:root{
  /* proposed --line-1..5: a categorical set for "lines" (not floors, not status). Built from existing hues; needs a real token set */
  --x-proposed-line-1: var(--green);
  --x-proposed-line-2: var(--info);
  --x-proposed-line-3: color-mix(in srgb, var(--ink) 85%, var(--light));
  --x-proposed-line-4: color-mix(in srgb, var(--green) 45%, var(--info));
  --x-proposed-line-5: color-mix(in srgb, var(--info) 45%, var(--light));
  --x-proposed-line-6: color-mix(in srgb, var(--green) 40%, var(--light));
}
.map{position:relative;flex:1;min-height:0}
.map #svg{position:absolute;inset:0;width:100%;height:100%}
.zone{transition:opacity var(--motion-base)}
.zone-l{font:400 11px var(--font-mono);letter-spacing:.2em;text-transform:uppercase}
.tp{fill:none;stroke-linecap:round;stroke-linejoin:round}
.trk{transition:opacity var(--motion-base)}
.casing{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke:var(--slate-deep)}
.st{cursor:pointer}
.st circle.ring{fill:var(--slate-deep);stroke:var(--light);stroke-width:2.5}
.st.closed circle.ring{stroke:var(--ink-muted);stroke-dasharray:3 3}
.st .nm{font:400 14px var(--font-sans);fill:var(--light)}
.st .ct{font:400 11px var(--font-mono);fill:var(--ink-muted)}
.st.closed .nm{fill:var(--ink-muted)}
.st:focus{outline:none}
.st:focus-visible circle.ring,.st.lit circle.ring{stroke:var(--green);stroke-width:3.5}
.map.focus .trk:not(.on){opacity:.15}
.map.focus .st:not(.lit):not(.near){opacity:.35}
.vb{font:400 11px var(--font-mono);fill:var(--light);opacity:0;transition:opacity var(--motion-base);pointer-events:none}
.vbbg{fill:var(--slate-deep);opacity:0;transition:opacity var(--motion-base)}
.vb.on{opacity:1}.vbbg.on{opacity:.9}
.side{position:absolute;right:0;top:0;width:calc(var(--measure-card) * .78);display:flex;flex-direction:column;gap:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ln{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);align-items:start;padding:var(--space-1);border-radius:var(--radius-key);transition:opacity var(--motion-base),background var(--motion-base)}
.ln:hover{background:var(--surface-inset)}
.ln .sw{height:var(--space-1);border-radius:2px;margin-top:var(--space-2);background:var(--c)}
.ln b{color:var(--ink);font-weight:400;display:block}
.map.focus .ln:not(.on){opacity:.4}
.lk-key{display:flex;align-items:center;gap:var(--space-2)}
.lk-key i{display:inline-block;width:var(--space-5);height:var(--space-1);border-radius:2px}
.lk-key i.full{background:var(--ink)}
.lk-key i.lim{height:var(--space-2);border:2px solid var(--ink);background:var(--slate-deep)}
.lk-key i.ring{width:var(--space-3);height:var(--space-3);border-radius:50%;border:2px solid var(--light)}
.lk-key i.closed{width:var(--space-3);height:var(--space-3);border-radius:50%;border:2px dashed var(--ink-muted)}
.lk-key i.plan{width:var(--space-3);height:var(--space-3);border-radius:50%;border:1px dashed var(--x-proposed-gap-ink)}
.planned{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.planned button{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--space-5);padding:0 var(--space-2);border:1px dashed var(--x-proposed-gap-ink);border-radius:var(--radius-pill)}
.planned button:hover{color:var(--ink);border-color:var(--ink-muted)}

</style></head>
<body>
<div class="water"></div><div class="horizon"></div>

<div class="app">
  <nav class="rail" aria-label="Data Atlas"></nav>
  <main class="main">
    <div class="head"><h1>What we keep</h1><div class="sum" id="sum"></div></div>
    <div class="floors" id="floors"></div>
    <div class="map" id="map"><svg id="svg" role="group" aria-label="Line map of kinds of thing"></svg><div class="side scroll" id="side"></div></div>
  </main>
  <aside class="drawer" aria-label="Kind of thing"><div class="drawer-in scroll"></div></aside>
</div>
<div class="x-cap"><b>Shape · V5</b> line map: kinds are stations, chains of links are lines, floors are zones · Harry Beck's Underground diagram (1933), zone fares, "limited service"</div>

<div class="toast" role="status" aria-live="polite"></div>
<div class="keys"></div>
<script>
/* ===== Sample data: every name, label, count and word on this page comes from here.
   A deployment's ontology (kinds, details, links) and its counts. Swap this object and the page redraws. ===== */
const DATA = {
  app: 'Data Atlas',
  viewer: { name: 'Mira Chen', memberOf: ['dept-ops'] },
  here: 'dept-ops',
  /* floors: kind = org | department | team, parent = the floor above */
  floors: [
    { id: 'org',        kind: 'org',        name: 'Northvale Regional Services' },
    { id: 'dept-ops',   kind: 'department', name: 'Operations',  parent: 'org' },
    { id: 'dept-fin',   kind: 'department', name: 'Finance',     parent: 'org' },
    { id: 'team-depot', kind: 'team',       name: 'Depot North', parent: 'dept-ops' }
  ],
  /* the big families every kind sits in (plain word, the ontology's word one step down) */
  groups: [
    { id: 'who',    plain: 'People and organisations', tech: 'cco:Agent' },
    { id: 'where',  plain: 'Places',                    tech: 'bfo:Site · cco:GeospatialRegion' },
    { id: 'things', plain: 'Things we run',             tech: 'cco:MaterialArtifact' },
    { id: 'happen', plain: 'Things that happen',        tech: 'bfo:Process · cco:Act' },
    { id: 'papers', plain: 'Agreements and papers',     tech: 'cco:InformationContentEntity' }
  ],
  /* kinds of thing. details: [plain name, % of records that have it, link target kind (if the detail is a link)]
     gapBy: who could fill what's missing. usedBy: intents in Mandate and documents in Artifacts that rely on this kind */
  kinds: [
    { id: 'person', sym: 'Pe', plain: 'People', one: 'person', tech: 'cco:Person', group: 'who', floor: 'org', count: 1942,
      about: 'Everyone who works for or with the organisation.', steward: 'People team', triage: 6,
      details: [['Name', 100], ['Role', 93], ['Works at', 81, 'site'], ['Phone', 64], ['Start date', 47]],
      gapBy: 'People team, or each person from Home', usedBy: { intents: 4, docs: 210 } },
    { id: 'supplier', sym: 'Su', plain: 'Suppliers', one: 'supplier', tech: 'cco:Organization', group: 'who', floor: 'org', count: 386,
      about: 'Companies we buy goods or services from.', steward: 'Procurement', triage: 11,
      details: [['Name', 100], ['Company number', 88], ['Address', 91], ['Contact person', 54, 'person'], ['Insurance expiry', 31]],
      gapBy: 'Procurement, from the supplier questionnaire', usedBy: { intents: 9, docs: 640 } },
    { id: 'site', sym: 'Si', plain: 'Sites', one: 'site', tech: 'cco:Facility', group: 'where', floor: 'org', count: 214,
      about: 'Buildings and yards we run services from.', steward: 'Estates', triage: 2,
      details: [['Name', 100], ['Address', 99], ['Service area', 97, 'area'], ['Opening hours', 58], ['Step-free entrance', 22]],
      gapBy: 'Estates, or the site lead', usedBy: { intents: 12, docs: 380 } },
    { id: 'area', sym: 'Ar', plain: 'Service areas', one: 'service area', tech: 'cco:GeospatialRegion', group: 'where', floor: 'org', count: 38,
      about: 'The districts we serve.', steward: 'Planning', triage: 0,
      details: [['Name', 100], ['Boundary', 100], ['Population', 74]],
      gapBy: 'Planning, from the census tables', usedBy: { intents: 3, docs: 44 } },
    { id: 'vehicle', sym: 'Ve', plain: 'Vehicles', one: 'vehicle', tech: 'cco:GroundVehicle', group: 'things', floor: 'dept-ops', count: 612,
      about: 'Every van, gritter and car the fleet runs.', steward: 'Fleet team', triage: 4,
      details: [['Registration', 100], ['Make and model', 98], ['Based at', 93, 'site'], ['Next service due', 71], ['Mileage', 44], ['Usual driver', 38, 'person']],
      gapBy: 'Fleet team, or the fleet register in Artifacts', usedBy: { intents: 7, docs: 290 } },
    { id: 'equipment', sym: 'Eq', plain: 'Equipment', one: 'piece of equipment', tech: 'cco:Artifact', group: 'things', floor: 'dept-ops', count: 2340,
      about: 'Plant, tools and machines that need checking.', steward: 'Maintenance', triage: 9,
      details: [['Name', 100], ['Serial number', 76], ['Installed at', 82, 'site'], ['Maintained by', 51, 'supplier'], ['Last checked', 29]],
      gapBy: 'Maintenance, or Depot North from inspections', usedBy: { intents: 5, docs: 520 } },
    { id: 'incident', sym: 'In', plain: 'Incidents', one: 'incident', tech: 'cco:Act', group: 'happen', floor: 'dept-ops', count: 1108,
      about: 'Things that went wrong and were reported.', steward: 'Operations control', triage: 14,
      details: [['When', 100], ['What happened', 100], ['Where', 87, 'site'], ['Severity', 79], ['Reported by', 66, 'person'], ['Vehicle involved', 34, 'vehicle']],
      gapBy: 'Operations control, or whoever reported it', usedBy: { intents: 11, docs: 930 } },
    { id: 'contract', sym: 'Co', plain: 'Contracts', one: 'contract', tech: 'cco:Contract', group: 'papers', floor: 'dept-ops', count: 274,
      about: 'What we agreed with suppliers, and for how long.', steward: 'Commercial team', triage: 3,
      details: [['Reference', 100], ['With', 96, 'supplier'], ['Starts', 92], ['Ends', 88], ['Value', 61], ['Covers', 58, 'site']],
      gapBy: 'Commercial team, from the signed copy in Artifacts', usedBy: { intents: 6, docs: 406 } },
    /* kept on a floor you can't see from here */
    { id: 'invoice', sym: 'Iv', plain: 'Invoices', one: 'invoice', tech: 'cco:Invoice', group: 'papers', floor: 'dept-fin',
      about: 'Bills from suppliers against contracts.', ask: 'Priya Nair', askRole: 'Finance data steward' },
    { id: 'inspection', sym: 'Is', plain: 'Inspections', one: 'inspection', tech: 'cco:Act', group: 'happen', floor: 'team-depot',
      about: 'Checks done on equipment at the depot.', ask: 'Dan Osei', askRole: 'Depot North lead' }
  ],
  /* in the ontology, but nobody keeps any yet; or a word sources asked for that admins haven't decided */
  unadopted: [
    { id: 'route', sym: 'Ro', plain: 'Routes', group: 'where', tech: 'cco:Route', why: 'In the ontology, nobody keeps any yet.' },
    { id: 'permit', sym: 'Pm', plain: 'Permits', group: 'papers', tech: 'cco:Permit', why: 'In the ontology, nobody keeps any yet.' },
    { id: 'depot', sym: 'De', plain: 'Depots', group: 'where', asked: 14, why: 'Sources used this word 14 times. Admins decide whether it means Sites.' },
    { id: 'skill', sym: 'Sk', plain: 'Qualifications', group: 'who', asked: 5, why: 'Sources used this word 5 times. Admins decide whether to add it.' }
  ],
  admins: 'Sam Okafor (Data Atlas admin)',
  /* kinds of link. cover = % of the "from" kind that have this link */
  links: [
    { from: 'vehicle',   verb: 'is based at',     to: 'site',     count: 569,  cover: 93, tech: 'cco:located_in' },

      return '<div class="ln" data-start="' + st + '" style="--c:' + startColor(si) + '"><span class="sw"></span><span><b>' + esc(K(st).plain) + ' line' + (br.length > 1 ? ' · ' + br.length + ' branches' : '') + '</b>' +
      br.map(ln => esc(art(K(ln[0].node).one)).replace(/^a/, 'A') + ln.slice(1).map((q, i) => (i ? ', which ' : ' ') + esc(q.e.verb) + ' ' + esc(art(K(q.node).one))).join('') + '.').join(' ') + '</span></div>'; }).join('') +
    '<span class="eyebrow">Key</span>' +
    '<span class="lk-key"><i class="full"></i>Full service · most records say</span>' +
    '<span class="lk-key"><i class="lim"></i>Limited · fewer than ' + DATA.thin + '% say</span>' +
    '<span class="lk-key"><i class="ring"></i>Station · a kind of thing; big ring = change lines</span>' +
    '<span class="lk-key"><i class="closed"></i>Closed from here · kept on another floor</span>' +
    '<span class="eyebrow">Planned stations · not kept yet</span><span class="planned">' +
    DATA.unadopted.map(k => '<button data-id="' + k.id + '"><i data-lucide="' + ICON[k.id] + '" data-size="12"></i>' + esc(k.plain) + (k.asked ? ' ×' + k.asked : '') + '</button>').join('') + '</span>';
  Icons.hydrate(side);
  side.querySelectorAll('.planned button').forEach(b => b.onclick = () => select(b.dataset.id));
}
let cur = null;
function light(id){
  cur = id; map.classList.toggle('focus', !!id);
  const near = new Set(id ? linksOf(id).flatMap(l => [l.from, l.to]) : []);
  svg.querySelectorAll('.st').forEach(s => { s.classList.toggle('lit', s.dataset.id === id); s.classList.toggle('near', near.has(s.dataset.id)); });
  svg.querySelectorAll('[data-from]').forEach(n => n.classList.toggle('on', !!id && (n.dataset.from === id || n.dataset.to === id)));
  /* lit verb labels: nudge apart so none sits on another */
  const placed = [];
  svg.querySelectorAll('text.vb.on').forEach(t => { if (t._y0 == null) t._y0 = +t.getAttribute('y'); let y = t._y0; const x = +t.getAttribute('x'), w = t.getComputedTextLength();
    placed.forEach(q => { if (Math.abs(q.x - x) < (q.w + w) / 2 + 8 && Math.abs(q.y - y) < 18) y = q.y + 20; });
    t.setAttribute('y', y); placed.push({ x, y, w }); const bg = t.previousSibling, bb = t.getBBox();
    bg.setAttribute('x', bb.x - 4); bg.setAttribute('y', bb.y - 2); bg.setAttribute('width', bb.width + 8); bg.setAttribute('height', bb.height + 4); });
  side.querySelectorAll('.ln').forEach(l => l.classList.toggle('on', !!id && CHAINS.some(c => c[0].node === l.dataset.start && c.some(q => q.node === id))));
}
function select(id){ light(id); openKind(id); }
onDrawer = id => { if (!id) light(null); setTimeout(render, T('calm') + T('quick')); };
document.getElementById('sum').innerHTML = '<b>' + SEEN.length + '</b> stations · <b>' + STARTS.length + '</b> lines · <b>' + nf(totalSeen) + '</b> kept';
document.getElementById('floors').innerHTML = floorStrip();
mountShell('shape'); Icons.hydrate(document.body);
keys(['click or <span class="kbd">Tab</span> to a station · <span class="kbd">Enter</span>', '<span class="kbd">T</span> ontology words · <span class="kbd">Esc</span> close', '<span class="kbd">R</span> replay']);
renderSide();
addEventListener('resize', render);
boot(() => { render(); light(null); }, () => select('vehicle'));

</script>
