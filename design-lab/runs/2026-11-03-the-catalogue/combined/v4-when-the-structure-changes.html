<style>
/* ======================================================================
   Proposed tokens (all combinations of kit tokens; listed in notes-vN.md).
   ====================================================================== */
:root{
  --x-proposed-type-micro:.6875rem;                                        /* --type-micro: mono numerals and eyebrows inside data (also asked for by wear and time) */
  /* --mark-gap (grammar sheet): four 1px corner ticks of the slot, empty inside */
  --x-proposed-gap-ink:color-mix(in srgb,var(--ink-muted) 78%,transparent);
  --x-proposed-gap-tick:var(--space-2);
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
  /* --mark-stale-hatch (wear and time, 45°) and the shadow (light language, 135°) */
  --x-proposed-hatch:color-mix(in srgb,var(--ink-muted) 34%,transparent);
  --x-proposed-stale:repeating-linear-gradient(45deg,transparent 0 var(--space-1),var(--x-proposed-hatch) var(--space-1) calc(var(--space-1) + 1px));
  --x-proposed-unseen:repeating-linear-gradient(135deg,transparent 0 var(--space-2),var(--hairline-strong) var(--space-2) calc(var(--space-2) + 1px));
  /* --mark-waiting: a thing waiting on a person; never alarming */
  --x-proposed-wait:color-mix(in srgb,var(--warning) 70%,var(--ink));
  /* --mark-predicted: a slot the table predicts; dotted, quiet */
  --x-proposed-predicted:color-mix(in srgb,var(--ink-muted) 60%,transparent);
  /* --mark-structure-new and the seam it leaves once read */
  --x-proposed-new:color-mix(in srgb,var(--green) 70%,var(--ink));
  --x-proposed-new-wash:color-mix(in srgb,var(--green) 10%,transparent);
  --x-proposed-seam:color-mix(in srgb,var(--ink-muted) 55%,transparent);
  /* --surface-slip: the notice slip, the one light surface; toned down from round 1 */
  --x-proposed-paper:color-mix(in srgb,var(--ink) 84%,var(--warning));
  --x-proposed-paper-ink:var(--slate-deep);
  /* --dim-far: the far plane while one thing is in focus */
  --x-proposed-far:.38;
  /* the current floor's accent as one alias; set per page from DATA */
  --x-accent:var(--floor-team-high);
  --x-accent-soft:color-mix(in srgb,var(--x-accent) 14%,transparent);
  --x-accent-edge:color-mix(in srgb,var(--x-accent) 46%,transparent);
  --x-side:calc(var(--measure-card) + var(--space-5));                     /* layout: the right-hand column */
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.micro{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink);letter-spacing:0;text-transform:none;min-width:var(--space-4);text-align:center}
.x-cap{max-width:calc(50% - var(--space-6))}
.keys{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:var(--layer-chrome);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-3);max-width:calc(50% - var(--space-6));font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);background:var(--scrim);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key)}
.keys span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.muted{color:var(--ink-muted)}
b,strong{font-weight:400;color:var(--light)}

/* two registers: the technical word one step down, only with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:0;color:var(--ink-muted);text-transform:none}
body.tech .tk{display:block}
body.tech span.tk,body.tech i.tk{display:inline;margin-left:var(--space-1);font-style:normal}

/* ---- app frame ---- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr)}
.rail{background:color-mix(in srgb,var(--slate-deep) 70%,transparent);border-right:1px solid var(--hairline);padding:var(--edge) var(--edge-tight);display:flex;flex-direction:column;gap:var(--space-1);min-height:0}
.rail .an{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light);padding:var(--space-2);margin-bottom:var(--space-3)}
.nav{display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-meta);border-radius:var(--radius-key)}
.nav svg{width:var(--space-4);height:var(--space-4);flex:none}
.nav.on{background:var(--surface-raised);color:var(--ink);box-shadow:inset 2px 0 0 var(--x-accent)}
.nav .n{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono)}
.rail .foot{margin-top:auto;margin-bottom:var(--space-6);padding:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.who-am{display:grid;grid-template-columns:var(--space-2) minmax(0,1fr);gap:0 var(--space-2);align-items:baseline;padding:var(--space-2);margin-bottom:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.who-am .dot{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--fc,var(--x-accent));transform:translateY(-1px)}
.who-am b{color:var(--ink)}
.main{position:relative;padding:var(--edge) var(--space-6) var(--space-7);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-4);flex:none}
.head h1{margin:var(--space-2) 0 var(--space-1);font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.head .eyebrow{white-space:nowrap}
.head .sub{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);max-width:var(--measure-wide)}
.head .sub b{color:var(--ink)}
.work{position:relative;flex:1;min-height:0}

/* who is looking: the viewer switch (A / K / O) */
.viewers{display:flex;gap:var(--space-1);flex:none;padding:var(--space-1);border:1px solid var(--hairline);border-radius:var(--radius-pill)}
.viewers button{display:inline-flex;align-items:center;gap:var(--space-2);height:calc(var(--space-5) + var(--space-1));padding:0 var(--space-3);border-radius:var(--radius-pill);font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap;transition:background var(--motion-base) var(--ease-standard),color var(--motion-base) var(--ease-standard)}
.viewers button .dot{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--fc)}
.viewers button.on{background:var(--surface-raised);color:var(--light)}

/* floors */
[data-tier="department"]{--fc:var(--floor-department-high)}
[data-tier="team"]{--fc:var(--floor-team-high)}
[data-tier="org"]{--fc:var(--floor-org-high)}
[data-tier="you"]{--fc:var(--floor-you-high)}
.fl{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.fl::before{content:"";width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--fc)}

/* kind chip */
.kind{display:inline-flex;align-items:center;gap:var(--space-2);color:var(--ink);white-space:nowrap}
.kind svg{width:var(--space-4);height:var(--space-4);flex:none;color:var(--ink-muted)}
.kind .c{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}

.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);background:var(--surface-inset);white-space:nowrap;color:var(--ink);transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard)}
.btn svg{width:var(--space-4);height:var(--space-4)}
.btn:hover{background:var(--surface-raised)}
.btn.go{border-color:var(--x-accent-edge);color:var(--light);background:var(--x-accent-soft)}
.btn.quiet{border-color:var(--hairline)}
.btn.press{background:var(--surface-raised);border-color:var(--x-accent)}
.btn[aria-disabled="true"]{color:var(--ink-muted);border-style:dashed;cursor:help}
.btn .kbd{margin-left:var(--space-1)}
.btn.sm{height:calc(var(--space-5) + var(--space-1));font-size:var(--type-small)}

/* ======================================================================
   The six ways to be empty. One mark and one sentence each.
   ====================================================================== */
.e{display:flex;flex-direction:column;gap:0;min-width:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.e .w{color:var(--ink)}
.e.gap{background:var(--x-proposed-gap);padding:var(--space-1) var(--space-2)}
.e.gap b{color:var(--ink)}
.e.none .w{color:var(--ink)}
.e.na{color:var(--ink-muted);opacity:.8}
.e.na .w{color:var(--ink-muted)}
.age{display:inline-block;margin-left:var(--space-2);padding:0 var(--space-1);border-radius:var(--radius-key);background:var(--x-proposed-stale);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.e.unseen{flex-direction:row;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--x-proposed-unseen),var(--surface-inset)}
.e.unseen svg{width:var(--space-3);height:var(--space-3);flex:none;color:var(--ink-muted)}
.e.wait{color:var(--x-proposed-wait)}
/* the key: six marks in a row, each with its sentence */
.ekey{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--hairline)}
.ekey > div{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.ekey .m{height:var(--space-5);display:flex;align-items:center;padding:0 var(--space-2);font-size:var(--type-small);color:var(--ink)}
.ekey .m.gap{background:var(--x-proposed-gap)}
.ekey .m.stale span{background:var(--x-proposed-stale);padding:0 var(--space-1);border-radius:var(--radius-key);font-family:var(--font-mono);color:var(--ink-muted)}
.ekey .m.unseen{background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:var(--radius-key);gap:var(--space-2);color:var(--ink-muted)}
.ekey .m.unseen svg{width:var(--space-3);height:var(--space-3)}
.ekey .m.na{color:var(--ink-muted)}
.ekey .m svg.wave{width:100%;height:var(--space-4)}
.ekey .s{font-size:var(--x-proposed-type-micro);line-height:var(--leading-small);color:var(--ink-muted)}
.ekey .s b{color:var(--ink)}
.ekey.on-these > div:not(.here){opacity:var(--x-proposed-far)}
.ekey.v{grid-template-columns:minmax(0,1fr);gap:var(--space-2)}
.ekey.v > div{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-3)) minmax(0,1fr);align-items:center;gap:var(--space-3)}
.ekey.v .m{height:var(--space-5)}

/* record rows (statements) */
.rec{display:grid;grid-template-columns:minmax(0,.42fr) minmax(0,1fr);gap:0 var(--space-4);font-size:var(--type-meta);line-height:var(--leading-meta)}
.rec > .k,.rec > .v{padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);min-width:0}
.rec > .k{color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-meta)}
.rec > .v{color:var(--ink)}
.rec .lk{color:var(--light);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:3px}
.rec .src{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

.fade{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.fade.pre{opacity:0;transform:translateY(var(--space-2))}
@media (prefers-reduced-motion: reduce){.fade{transition:opacity var(--motion-base) linear!important}.fade.pre{transform:none}}
@media (max-height:840px){.main{padding-top:var(--edge-tight)}.head{margin-bottom:var(--space-3)}.head h1{font-size:var(--type-heading);line-height:var(--leading-heading)}}

/* ====================== V4: When the structure changes ====================== */
/* the kind's fill bar: one strip, the same in every view */
.work{display:flex;flex-direction:column}
.fill{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2) var(--space-5);align-items:center;padding:var(--space-2) var(--space-4);margin-bottom:var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);flex:none}
.fill .lab{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);white-space:nowrap}
.fill .lab .kind svg{color:var(--ink-muted)}
.fill .lab small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.fbar{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.fbar .track{flex:1;display:flex;gap:2px;height:var(--space-3);min-width:0}
.fbar .track i{display:block;min-width:0;border-radius:2px;transition:flex-grow var(--motion-calm) var(--ease-out)}
.fbar .s-known{background:color-mix(in srgb,var(--ink) 72%,transparent)}
.fbar .s-doc{background:color-mix(in srgb,var(--ink) 30%,transparent)}
.fbar .s-keeper{background:var(--x-proposed-gap),linear-gradient(var(--hairline),var(--hairline))}
.fbar .s-nobody{border:1px dashed var(--x-proposed-wait)}
.fbar .stub{flex:none;width:var(--space-6);height:var(--space-3);border-radius:2px;background:var(--x-proposed-unseen);border:1px solid var(--hairline)}
.fill.draft .track{opacity:.55}
.fill.draft .track i{background-image:none;border:1px dotted var(--x-proposed-predicted);background-color:transparent}
.fleg{grid-column:1 / -1;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:var(--space-1) var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.fleg span{display:inline-flex;align-items:center;gap:var(--space-1);white-space:nowrap}
.fleg i{display:inline-block;width:var(--space-3);height:var(--space-2);border-radius:2px}
.fleg b{font-family:var(--font-mono);color:var(--ink)}
.fill .bump{color:var(--x-proposed-new)}

.vw{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:var(--space-5);min-height:0}
.pane{border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);padding:var(--space-4) var(--space-5);min-height:0;overflow:auto;scrollbar-width:thin}
.pane h2{margin:0 0 var(--space-2);font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--light)}
.pane .eyebrow{display:flex;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-1)}
/* admin: the draft */
.draft-c .rec > .k{font-size:var(--type-small)}
.draft-c .rec .v2{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.saved{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-3);padding-top:var(--space-2);border-top:1px dashed var(--x-proposed-seam);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.saved svg{width:var(--space-3);height:var(--space-3);color:var(--x-proposed-new)}
/* admin: the consequence */
.cq{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-3)) minmax(0,1fr);gap:0 var(--space-4)}
.cq > dt,.cq > dd{padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);margin:0}
.cq > dt{font:400 var(--x-proposed-type-micro)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.cq > dd{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.cq .flr{display:grid;grid-template-columns:max-content minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:center}
.cq .flr .b{height:var(--space-1);border-radius:var(--radius-pill);background:var(--hairline)}
.cq .flr .b i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--fc)}
.cq .flr .n{font-family:var(--font-mono);color:var(--ink)}
.cq .apps{display:grid;grid-template-columns:var(--space-4) minmax(0,.9fr) minmax(0,1.4fr);gap:var(--space-2) var(--space-3)}
.cq .apps svg{width:var(--space-4);height:var(--space-4);color:var(--ink-muted)}
.cq .apps .w{color:var(--ink-muted)}
.cq ul{margin:0;padding-left:var(--space-4)}
.cq .beyond{color:var(--ink-muted)}
.cq .beyond b{color:var(--ink)}
.dev{transition:opacity var(--motion-calm) var(--ease-out),filter var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i,0) * var(--motion-quick))}
.developing .dev{opacity:0;filter:blur(2px)}
@media (prefers-reduced-motion: reduce){.developing .dev{filter:none}}
.cfoot{position:sticky;bottom:calc(var(--space-3) * -1);display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin:var(--space-3) calc(var(--space-2) * -1) 0;padding:var(--space-2);border-radius:var(--radius-key);background:color-mix(in srgb,var(--slate-deep) 94%,transparent)}
.cfoot .m{font-size:var(--type-small);color:var(--ink-muted)}
/* admin after save: rounds */
.rounds{display:flex;flex-direction:column}
.rd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.rd .nm{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.rd .who{color:var(--ink-muted)}
.rd .ct{font-family:var(--font-mono);color:var(--ink);text-align:right}
.dots{display:flex;gap:var(--space-1);grid-column:1 / -1;flex-wrap:wrap}
.dots i{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);border:1px dashed var(--x-proposed-gap-ink);transition:background var(--motion-base) var(--ease-out),border-color var(--motion-base)}
.dots i.on{background:var(--ink);border:1px solid var(--ink)}
.rd.lead .nm{color:var(--x-proposed-wait)}
.rd.fresh{background:var(--x-proposed-new-wash)}
/* keeper: one question per site */
.qc .site{font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--light)}
.qc .ask{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);margin:var(--space-1) 0 var(--space-3)}
.qt{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);gap:0 var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}

const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

const K = id => DATA.kinds.find(k => k.id === id);

    <div class="t">Every ${KD.word.toLowerCase()} record now keeps one more detail: <b>${DT.word}</b>.</div>
    <div>${C.why}</div>
    <dl><dt>This one</dt><dd>${samAns ? `Already filled by <b>${k.name}</b>, from the hire pack.` : `<b>${k.name}</b> is asked, in his ${C.rounds[0].name}.`}</dd>
      <dt>Asked for by</dt><dd>Mandate: “${C.intent}”</dd><dt>Changed by</dt><dd>${a.name}, who ${a.role}</dd><dt>Lost</dt><dd>Nothing on this record.</dd></dl>
    <div class="acts"><button class="btn" data-got>Got it <span class="kbd">Enter</span></button><span class="once">You see this once.</span></div>`;
  pane.appendChild(el);
  const pr = pane.getBoundingClientRect(), rr = row.getBoundingClientRect(), sw = el.offsetWidth;
  const rp = $('#recp').getBoundingClientRect();
  el.style.left = `${Math.min(pr.width - sw, rp.right - pr.left - sw * .45)}px`; el.style.top = `${Math.max(0, Math.min(pr.height - el.offsetHeight, rr.top - pr.top - el.offsetHeight / 2))}px`;
  $('#stage .vw.op').classList.add('slipped');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('pre')));
}
function readSlip() {
  const el = $('#slip'); if (!el || S.slipRead) return;
  el.classList.add('fold'); S.slipRead = true; $('#stage .vw.op').classList.remove('slipped');
  later(() => { draw(); }, ms('--motion-slow'));
}
/* ---------- actions ---------- */
function save() {
  if (S.saved || S.view !== 'admin') return; S.saved = true; head(); draw();
  const g = ms('--motion-run');
  C.arrivals.forEach((a, i) => later(() => arrive(a), g * (i + 1.5)));
}
function arrive(a) {
  const f = S.fill, r = S.rounds[a.r]; let b = 0;
  if (a.doc) { f.doc -= a.doc; f.known += a.doc; b += a.doc; }
  if (a.keeper) { f.keeper -= a.keeper; f.known += a.keeper; b += a.keeper; }
  if (a.named) { f.nobody -= a.named; f.keeper += a.named; }
  r.done = Math.min(r.q, r.done + a.q);
  drawFill(b || null);
  if (S.view === 'admin') { draw(true); const el = $(`.rd[data-r="${a.r}"]`); if (el) { el.classList.add('fresh'); } }
}
function samAct(kind) {
  if (S.view !== 'keeper' || S.samDone) return;
  const rows = C.myRound[0].rows, f = S.fill;
  if (kind === 'yes') { let n = 0; rows.filter(r => r.sug && !S.samRows[r.item]).forEach(r => { S.samRows[r.item] = 1; n++; }); f.doc -= n; f.known += n; draw(true); drawFill(n);
    later(() => samAct('type'), ms('--motion-run')); return; }
  if (kind === 'type' || kind === 'c') { let n = 0; rows.filter(r => r.type && !S.samRows[r.item]).forEach(r => { S.samRows[r.item] = 1; n++; }); f.keeper -= n; f.known += n; draw(true); if (n) drawFill(n);
    later(() => samAct('n'), ms('--motion-run')); return; }
  if (kind === 'n' || kind === 'x') { rows.filter(r => r.cant).forEach(r => { S.samRows[r.item] = 1; }); draw(true);
    later(() => { S.samDone = true; S.rounds[0].done = 1; draw(); }, ms('--motion-run') + ms('--motion-calm')); }
}
/* ---------- render ---------- */
function draw(quiet) {
  rail(); head(); if (!quiet) drawFill();
  const st = $('#stage');
  st.innerHTML = S.view === 'admin' ? adminHTML() : S.view === 'keeper' ? keeperHTML() : opHTML();
  Icons.hydrate(st);
  if (S.view === 'op') requestAnimationFrame(placeSlip);
}
function setView(v) {
  S.view = v; accent(v); draw(); reveal($('#stage').firstElementChild);
  keys(v === 'admin' ? [['Enter', 'make the change'], ['K', 'keeper'], ['O', 'operator'], ['T', 'technical words'], ['R', 'replay']]
    : v === 'keeper' ? [['Enter', 'yes'], ['C', 'correct'], ['N', 'can’t tell'], ['X', 'not mine'], ['A', 'admin'], ['O', 'operator'], ['T', 'technical'], ['R', 'replay']]
    : [['Enter', 'got it'], ['A', 'admin'], ['K', 'keeper'], ['T', 'technical words'], ['R', 'replay']]);
  if (v === 'keeper' && !Object.keys(S.samRows).length) later(() => { const b = $('[data-k="yes"]'); if (b) b.classList.add('press'); later(() => samAct('yes'), ms('--motion-calm')); }, ms('--motion-run'));
}
const V = {
  reset() {
    fresh(); const h = location.hash;
    if (h.includes('saved') || h.includes('keeper') || h.includes('op')) { S.saved = true; }
    if (h.includes('keeper')) { setView('keeper'); return; }
    if (h.includes('op')) { if (h.includes('read')) S.slipRead = true; setView('op'); return; }
    S.view = 'admin'; accent('admin'); draw();
    if (!S.saved) $('#stage .vw > .pane:last-child').classList.add('developing');
  },
  demo() {
    if (S.view === 'admin' && !S.saved) { const p = $('#stage .vw > .pane:last-child'); if (p) p.classList.remove('developing'); }
    if (S.view === 'admin' && S.saved && location.hash.includes('saved')) C.arrivals.forEach((a, i) => later(() => arrive(a), ms('--motion-run') * i));
  },
  onTech() { draw(true); },
  key(e) {
    const k = e.key.toLowerCase();
    if (k === 'a') { setView('admin'); return true; }
    if (k === 'k') { if (!S.saved) { S.saved = true; } setView('keeper'); return true; }
    if (k === 'o') { if (!S.saved) S.saved = true; setView('op'); return true; }
    if (e.key === 'Enter') { if (S.view === 'admin') save(); else if (S.view === 'keeper') { clearLater(); samAct('yes'); } else readSlip(); return true; }
    if (S.view === 'keeper' && ['c', 'n', 'x'].includes(k)) { clearLater(); samAct(k); return true; }
  }
};
document.addEventListener('click', e => {
  const v = e.target.closest('[data-v]'), kb = e.target.closest('[data-k]');
  if (v) { if (v.dataset.v !== 'admin') S.saved = true; setView(v.dataset.v); }
  if (e.target.closest('[data-save]')) save();
  if (kb) { clearLater(); samAct(kb.dataset.k); }
  if (e.target.closest('[data-got]')) readSlip();
});
addEventListener('resize', () => { if (S.view === 'op' && !S.slipRead) { const s = $('#slip'); if (s) s.remove(); placeSlip(); } });
boot(V);
</script>
</body>
