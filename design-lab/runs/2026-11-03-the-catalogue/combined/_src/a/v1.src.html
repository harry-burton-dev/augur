<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Catalogue · Combined V1 · Three ways to read</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@COMMON_CSS@*/
:root{
  /* layout only (needs token if adopted): the side column of counts and verdict */
  --x-proposed-side-w: calc(var(--measure-rail) + var(--space-8) + var(--space-5));
}
@media (max-width: 1400px){ :root{ --x-proposed-side-w: calc(var(--measure-rail) + var(--space-8)); } }
.app{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--space-3);padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5)}
.top .lede{max-width:96ch}
.bar{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--hairline-strong);border-radius:var(--radius-key);overflow:hidden;flex:none}
.seg button{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);font-size:var(--type-meta);color:var(--ink-muted);border-right:1px solid var(--hairline)}
.seg button:last-child{border-right:0}
.seg button[aria-selected="true"]{background:var(--surface-raised);color:var(--light)}
.tasks{display:flex;gap:var(--space-2);min-width:0;flex-wrap:wrap}
.tasks button{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink-muted);border:1px solid transparent}
.tasks button[aria-pressed="true"]{color:var(--light);border-color:var(--hairline-strong);background:var(--surface-inset)}
.tasks .kq{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.body{display:grid;grid-template-columns:minmax(0,1fr) var(--x-proposed-side-w);gap:var(--space-4);min-height:0}
.stagewrap{min-height:0;display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);overflow:hidden}
.stage{position:relative;flex:1;min-height:0;padding:var(--space-4)}
.counter{flex:none;border-top:1px solid var(--hairline-strong);background:var(--surface-inset);padding:var(--space-3) var(--space-4);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-5);align-items:start}
.counter .ph{grid-column:1 / -1;margin:0}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding-right:var(--space-1)}
.panel{border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);padding:var(--space-3) var(--space-4)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2);margin:0 0 var(--space-2)}
.ph .eyebrow{letter-spacing:var(--tracking-caps)}
.hints .w{color:var(--ink-muted)}
@media (max-height: 820px){ .top .lede{display:none} h1{margin:0} .app{gap:var(--space-2)} }
.bottom{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);flex-wrap:wrap;padding-left:0}

/* ---------- 1 the table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:var(--type-meta);line-height:var(--leading-meta)}
.tbl th{text-align:left;font-weight:400;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-2) var(--space-2);border-bottom:1px solid var(--hairline-strong);vertical-align:bottom;white-space:nowrap}
.tbl td[data-col=where],.tbl td[data-col=ends],.tbl td[data-col=ask],.tbl td[data-col=kind]{white-space:nowrap}
.tbl td{padding:var(--space-2);border-bottom:1px solid var(--hairline);vertical-align:top;color:var(--ink)}
.tbl td.nm{box-shadow:inset 2px 0 0 var(--fc);padding-left:var(--space-3)}
.tbl td.nm b{display:block;font-weight:400;color:var(--light)}
.tbl td.nm span{display:flex;gap:var(--space-1);align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.tbl .sub{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.tbl .dis{display:grid;gap:2px}
.tbl .dis b{font-weight:400;color:var(--light);border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);padding:0 var(--space-1)}
.tbl .marks{display:flex;gap:var(--space-1);align-items:center;flex-wrap:wrap}
.tbl .marks .n{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);margin-left:var(--space-1)}
.tbl tbody tr.row{cursor:pointer}
.tbl tbody tr.row:hover td{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.tbl tr.more td{background:var(--surface-inset);padding:var(--space-2) var(--space-3) var(--space-3)}
.tbl tr.more .foot{border-top:0;margin:0;padding:0}
.tbl .open{font-weight:400;color:var(--light)}
.tblnote{margin:var(--space-3) 0 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

/* ---------- 2 the cards ---------- */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3);align-items:start}
.card{border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);padding:var(--space-3);box-shadow:inset 2px 0 0 var(--fc)}
.card .ch{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.card .ch .key{margin-left:auto;font:400 var(--x-proposed-type-micro)/1 var(--font-mono)}
.card .foot{border-top:0;border-bottom:1px solid var(--hairline);margin:0 0 var(--space-2);padding:0 0 var(--space-2)}
.card h3{margin:var(--space-1) 0 var(--space-2);font-weight:400;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}

/* ---------- 3 the facets ---------- */
.fx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:var(--space-4);align-items:start}
.fx.nopeek{grid-template-columns:minmax(0,1fr)}
.sent{font-weight:300;font-size:var(--type-heading);line-height:calc(var(--leading-heading) + var(--space-2));color:var(--ink-muted);margin:0 0 var(--space-2);position:relative}
.blank{position:relative;color:var(--ink-muted);border-bottom:1px dashed var(--hairline-strong);border-radius:2px;padding:0 2px}
.blank.set{color:var(--light);border-bottom:2px solid var(--x-proposed-here)}
.blank[aria-expanded="true"]{background:var(--surface-raised)}
.pop{position:absolute;z-index:5;min-width:calc(var(--measure-drawer) - var(--space-5));background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);padding:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.pop .q{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);padding:var(--space-1) var(--space-2)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 var(--space-3);width:100%;padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);color:var(--ink)}
.opt:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.opt .c{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink)}
.opt .why{grid-column:1 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.opt.zero{color:var(--ink-muted)}
.opt.zero .c{color:var(--ink-muted)}
.pop .naline{padding:var(--space-1) var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.cnt{display:flex;gap:var(--space-3);align-items:baseline;margin:0 0 var(--space-3);color:var(--ink-muted);font-size:var(--type-small)}
.cnt b{font:200 var(--type-title-s)/1 var(--font-sans);color:var(--light)}
.res{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:center;width:100%;padding:var(--space-2) var(--space-2);border-bottom:1px solid var(--hairline);border-radius:var(--radius-key)}
.res:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.res b{font-weight:400;color:var(--light)}
.res .r2{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:right}
.peek .card{background:var(--surface-raised)}

/* ---------- the eye's path ---------- */
.rings{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:6}
.ring{position:absolute;border:var(--focus-ring) solid var(--x-proposed-lit);border-radius:var(--radius-key);background:var(--x-proposed-lit-wash);transition:opacity var(--motion-base) var(--ease-out)}
.ring .no{position:absolute;left:calc(var(--space-2) * -1);top:calc(var(--space-2) * -1);display:inline-flex;align-items:center;gap:2px;height:calc(var(--space-4) + var(--space-1));padding:0 var(--space-1);border-radius:var(--radius-pill);background:var(--slate-deep);border:1px solid var(--x-proposed-lit);color:var(--light);font:400 var(--x-proposed-type-micro)/1 var(--font-mono)}
.ring.past{opacity:.45}
.ring.enter{opacity:0}

/* ---------- step counter, board, verdict ---------- */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3)}
.steps li{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);opacity:.5;transition:opacity var(--motion-base)}
.steps li.done{opacity:1;color:var(--ink)}
.steps li.now{color:var(--light)}
.steps li .i{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.steps li .skip{color:var(--ink-muted);font-style:italic}
.tot{display:flex;gap:var(--space-2);align-items:baseline;justify-content:flex-end;font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.tot b{font:300 var(--type-heading)/1 var(--font-sans);color:var(--light)}
.ans{grid-column:1 / -1;margin:0;min-height:calc(var(--leading-small) * 2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);opacity:0;transition:opacity var(--motion-calm)}
.ans.on{opacity:1}
.ans em{font-style:normal;color:var(--ink-muted)}
.board table{width:100%;border-collapse:collapse;font-size:var(--type-small);line-height:var(--leading-small)}
.board th{font-weight:400;color:var(--ink-muted);text-align:left;padding:var(--space-1);white-space:nowrap}

.board td{padding:2px}
.board td button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 var(--space-2);align-items:center;width:100%;padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);border:1px solid var(--hairline);text-align:left}
.board td button .n{font:300 var(--type-lead)/1 var(--font-sans);color:var(--ink);min-width:1.4ch}
.board td button .s{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.board td button.best{border-color:var(--x-proposed-lit)}
.board td button.best .n{color:var(--light)}
.board td button.best .s::before{content:"fastest";display:block;color:var(--x-proposed-lit)}
.board td button.cur{background:var(--surface-raised)}
.board .note{margin:var(--space-2) 0 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.board .scale-why{display:block;font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted);white-space:normal}
.verdict h4{margin:var(--space-2) 0 0;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light);display:flex;gap:var(--space-2);align-items:center}
.verdict p{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.verdict .rec{margin-top:var(--space-3);padding:var(--space-2) var(--space-3);border-left:2px solid var(--x-proposed-lit);background:var(--x-proposed-lit-wash);color:var(--ink);font-size:var(--type-small);line-height:var(--leading-small)}
.verdict .rec b{font-weight:400;color:var(--light)}
.verdict .hon{margin-top:var(--space-2);font-style:italic}
</style>
</head>
<body>
<div class="app pre" id="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1>Three ways to read</h1>
      <p class="lede" id="lede"></p>
    </div>
    <button class="techbtn" id="techBtn" aria-pressed="false"><i data-lucide="code"></i>Technical words <span class="kbd">T</span></button>
  </header>
  <div class="bar">
    <div class="seg" role="tablist" aria-label="View" id="views"></div>
    <div class="tasks" role="group" aria-label="Task" id="tasks"></div>
  </div>
  <div class="body">
    <div class="stagewrap">
      <section class="stage scroll" id="stage" aria-live="polite"></section>
      <section class="counter" id="counter" aria-label="Step counter"></section>
    </div>
    <aside class="side scroll" aria-label="Counts and verdict">
      <section class="panel board" id="board"></section>
      <section class="panel verdict" id="verdict"></section>
    </aside>
  </div>
  <div class="bottom">
    <div class="key6" id="key6"></div>
    <div class="hints">
      <span><span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span> view</span>
      <span><span class="kbd">A</span><span class="kbd">B</span><span class="kbd">C</span> task</span>
      <span><span class="kbd">P</span> play</span>
      <span><span class="kbd">space</span> step</span>
      <span><span class="kbd">S</span> scale</span>
      <span><span class="kbd">T</span> words</span>
      <span><span class="kbd">R</span> replay</span>
    </div>
  </div>
</div>
<div class="x-cap"><b>Catalogue · Combined V1</b> the same five things read three ways, every step counted · card V2, facets V3, grammar V6</div>
<script>
/*@DATA@*/
/*@COMMON_JS@*/

const VIEWS = [
  { id: 'table', w: 'Table', icon: 'table-2' },
  { id: 'cards', w: 'Cards', icon: 'rows-3' },
  { id: 'facets', w: 'Facets', icon: 'list-filter' }
];
const S = { view: 'table', task: 'A', i: 0, playing: false, scale: false, sel: {}, open: null, peek: null, expanded: null };
const stage = $('#stage');
const REC = id => DATA.records[id];
const RES = {};                       // resolved paths for this window size: scripted steps plus the scrolls they need
const PATH = () => (RES[S.view] && RES[S.view][S.task]) || DATA.paths[S.view][S.task];
const TASK = id => DATA.tasks.find(t => t.id === id);
const countOf = p => ({ look: p.filter(s => s.k === 'look').length, click: p.filter(s => s.k !== 'look').length, all: p.length });
const sWord = c => `${c.look} look${c.look === 1 ? '' : 's'}${c.click ? ` · ${c.click} click${c.click === 1 ? '' : 's'}` : ''}`;

/* ---------- header ---------- */
$('#eyebrow').textContent = `${DATA.app} · ${FLOOR(DATA.viewer.floor).name} · the same ${DATA.five.length} things, read three ways`;
$('#lede').innerHTML = `${DATA.five.length} things of three kinds, with gaps and one disagreement. The same three questions on each view; every look and click counted.`;
$('#views').innerHTML = VIEWS.map((v, n) => `<button role="tab" data-view="${v.id}" aria-selected="false">${ic(v.icon, 15)}${v.w} <span class="kbd">${n + 1}</span></button>`).join('');
$('#tasks').innerHTML = DATA.tasks.map(t => `<button data-task="${t.id}" aria-pressed="false"><span class="kbd">${t.id}</span>${esc(t.q)}</button>`).join('');
$('#key6').innerHTML = keySix() + `<span>${mark('disagree')}<b>${esc(DATA.words.disagree[0])}</b></span>`;

/* ---------- the three views ---------- */
function cell(e, col) {
  const r = DATA.table.rows[e], rec = REC(e), k = KIND(rec.kind);
  if (col === 'name') return `<b>${esc(rec.name)}</b><span>kept on ${esc(FLOOR(rec.floor).name)}</span>`;
  if (col === 'kind') return `<span style="display:inline-flex;gap:var(--space-1);align-items:center">${ic(k.icon, 14)}${esc(cap1(k.one))}</span><span class="tk">${esc(k.tech)}</span>`;
  const c = r[col];
  if (col === 'unknown') {
    const lab = c.map(st => st === 'disagree' ? DATA.words.disagree[0] : EMPTY(st).plain).join(', ');
    return `<span class="marks" role="img" aria-label="${esc(lab)}">${c.map(mark).join('')}<span class="n">${c.length}</span></span>`;
  }
  if (c[0] === 'na') return `<span class="na">doesn’t apply</span>`;
  if (c[0] === 'none') return `<span class="mk mk-none">none</span> <span class="sub">checked</span>`;
  if (c[0] === 'disagree') return `<span class="dis"><b>${esc(c[1])}</b><b>${esc(c[2])}</b></span><span class="sub">sources disagree</span>`;
  if (col === 'links') return `${esc(c[1])}<span class="sub">${esc(c[2]).replace('open', '<span class="open">open</span>')}</span>`;
  return esc(c[1]);
}
function renderTable() {
  const cols = DATA.table.cols;
  const rows = DATA.five.map(e => {
    const rec = REC(e);
    const tr = `<tr class="row" data-e="${e}" tabindex="0" aria-expanded="${S.expanded === e}">${cols.map(c => `<td data-e="${e}" data-col="${c.id}"${c.id === 'name' ? ` class="nm" data-tier="${FLOOR(rec.floor).tier}"` : ''}>${cell(e, c.id)}</td>`).join('')}</tr>`;
    const more = S.expanded === e ? `<tr class="more" data-e="${e}"><td colspan="${cols.length}">${foot(rec)}</td></tr>` : '';
    return tr + more;
  }).join('');
  const naCount = DATA.five.filter(e => DATA.table.rows[e].ends[0] === 'na').length;
  stage.innerHTML = `<table class="tbl"><thead><tr>${cols.map(c => `<th data-col="${c.id}">${esc(c.w)}<span class="tk">${esc(c.tech)}</span></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <p class="tblnote">A table of mixed kinds keeps only what they share: ${naCount} of ${DATA.five.length} Ends cells say “doesn’t apply”, and details only one kind has (opening hours, notice to end) aren’t columns. Click a row to open what it doesn’t know.</p><div class="rings" id="rings"></div>`;
  $$('tr.row', stage).forEach(tr => {
    const go = () => { S.expanded = S.expanded === tr.dataset.e ? null : tr.dataset.e; renderTable(); };
    tr.onclick = go; tr.onkeydown = ev => { if (ev.key === 'Enter') go(); };
  });
}
function card(e, extra) {
  const rec = REC(e), k = KIND(rec.kind);
  return `<article class="card" data-e="${e}" data-tier="${FLOOR(rec.floor).tier}"${extra || ''}>
    <div class="ch">${ic(k.icon, 14)}<span>${esc(cap1(k.one))} · kept on ${esc(FLOOR(rec.floor).name)}</span><span class="key">${esc(rec.key)}</span></div>
    <p class="tk">${esc(k.tech)} · ${esc(DATA.words.record[1])}</p>
    <h3>${esc(rec.name)}</h3>
    ${foot(rec)}
    ${rec.st.map(s => statement(s)).join('')}
  </article>`;
}
function renderCards() {
  stage.innerHTML = `<div class="cards">${DATA.five.map(e => card(e)).join('')}</div><div class="rings" id="rings"></div>`;
}
/* facet counts over the five, computed, never typed in */
function matches(sel) {
  return DATA.five.filter(e => DATA.facets5.every(f => {
    const v = sel[f.id]; if (!v) return true;
    return f.vals.find(x => x.id === v).has.includes(e);
  }));
}
function kindsIn(list) { return [...new Set(list.map(e => REC(e).kind))]; }
function renderFacets() {
  const sel = S.sel, left = matches(sel);
  const words = DATA.facets5.map(f => {
    const v = sel[f.id] && f.vals.find(x => x.id === sel[f.id]);
    return `<button class="blank${v ? ' set' : ''}" data-f="${f.id}" aria-expanded="${S.open === f.id}" aria-haspopup="listbox">${esc(v ? v.w : f.blank)}</button>`;
  }).join(' ');
  let pop = '';
  if (S.open) {
    const f = DATA.facets5.find(x => x.id === S.open);
    const base = matches(Object.assign({}, sel, { [f.id]: null }));
    const many = kindsIn(base).map(k => KIND(k).many.toLowerCase()).join(' and ');
    const opts = f.vals.map(v => {
      const n = matches(Object.assign({}, sel, { [f.id]: v.id })).length;
      const dis = (v.disputed || []).filter(e => base.includes(e)).length;
      const why = n ? (dis ? `${dis} of them with a disputed date` : '') : `none: checked ${base.length} ${esc(many)}`;
      return `<button class="opt${n ? '' : ' zero'}" data-v="${v.id}" role="option">${esc(v.w)}<span class="c">${n || 'none'}</span>${why ? `<span class="why">${why}</span>` : ''}</button>`;
    }).join('');
    let na = '';
    if (f.applies) {
      const out = kindsIn(base).filter(k => !f.applies.includes(k));
      if (out.length) na = `<div class="naline"><span class="na">Doesn’t apply to ${out.map(k => KIND(k).many.toLowerCase()).join(' or ')}: they don’t end. Choosing a date leaves them out.</span></div>`;
    }
    pop = `<div class="pop" id="pop" role="listbox" aria-label="${esc(f.q)}"><div class="q">${esc(f.q)}</div>${opts}${na}<p class="tk" style="padding:0 var(--space-2)">${esc(f.tech)}</p></div>`;
  }
  const res = left.map(e => { const rec = REC(e), k = KIND(rec.kind);
    return `<button class="res" data-e="${e}">${ic(k.icon, 15)}<span><b>${esc(rec.name)}</b></span><span class="r2">${esc(cap1(k.one))} · ${esc(DATA.table.rows[e].where[1])}</span></button>`; }).join('');
  const peek = S.peek ? `<div class="peek">${card(S.peek)}</div>` : '';
  stage.innerHTML = `<div class="fx${S.peek ? '' : ' nopeek'}"><div>
      <div class="sent">Show me ${words}.${pop}</div>
      <p class="tk">a sentence of facets · one value per blank, every blank narrows (AND)</p>
      <div class="cnt"><b>${left.length}</b><span>of ${DATA.five.length} match. Every word you could choose shows what it would leave.</span></div>
      <div>${res}</div></div>${peek}</div><div class="rings" id="rings"></div>`;
  if (S.open) { // place the popover under its blank
    const b = $(`.blank[data-f=${S.open}]`, stage), p = $('#pop'), s = $('.sent', stage);
    const br = b.getBoundingClientRect(), sr = s.getBoundingClientRect();
    p.style.left = Math.max(0, Math.min(br.left - sr.left, sr.width - p.offsetWidth)) + 'px';
    p.style.top = (b.offsetTop + b.offsetHeight + tok('--space-2')) + 'px';
  }
  $$('.blank', stage).forEach(b => b.onclick = () => { S.open = S.open === b.dataset.f ? null : b.dataset.f; renderFacets(); });
  $$('.opt', stage).forEach(o => o.onclick = () => { S.sel[S.open] = o.dataset.v; S.open = null; S.peek = null; renderFacets(); });
  $$('.res', stage).forEach(r => r.onclick = () => { S.peek = r.dataset.e; S.open = null; renderFacets(); });
}
function renderView() {
  if (S.view === 'table') renderTable();
  if (S.view === 'cards') renderCards();
  if (S.view === 'facets') renderFacets();
  Icons.hydrate(stage);
  $$('#views button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === S.view));
  $$('#tasks button').forEach(b => b.setAttribute('aria-pressed', b.dataset.task === S.task));
}

/* ---------- the step runner ---------- */
let rings = [];
function topIn(sel) { const el = $(sel, stage), b = el.getBoundingClientRect(), r = stage.getBoundingClientRect(); return Math.max(0, b.top - r.top + stage.scrollTop - tok('--space-4')); }
function inView(sel) {
  const el = $(sel, stage); if (!el) return true;
  const b = el.getBoundingClientRect(), r = stage.getBoundingClientRect();
  if (b.height > r.height) return b.top >= r.top - 1 && b.top < r.bottom - tok('--space-6');
  return b.top >= r.top - 1 && b.bottom <= r.bottom + 1;
}
/* walk every path silently at this window size and add a scroll wherever a target is out of view */
function resolveAll() {
  const keep = { view: S.view, task: S.task };
  VIEWS.forEach(v => { RES[v.id] = {}; DATA.tasks.forEach(tk => {
    S.view = v.id; S.task = tk.id; S.sel = {}; S.open = null; S.peek = null; S.expanded = null;
    renderView(); stage.scrollTop = 0;
    const out = [];
    DATA.paths[v.id][tk.id].forEach(s => {
      if (!inView(s.at)) { const sc = { k: 'scroll', t: 'Scroll to bring it into view', at: s.at, act: 'scrollto:' + s.at }; act(sc.act, true); out.push(sc); }
      out.push(s); act(s.act, true);
    });
    RES[v.id][tk.id] = out;
  }); });
  S.view = keep.view; S.task = keep.task;
}
function act(a, instant) {
  if (!a) return;
  const [verb, x, y] = a.split(':');
  if (verb === 'expand') { S.expanded = x; renderTable(); }
  if (verb === 'open') { S.open = x; renderFacets(); }
  if (verb === 'pick') { S.sel[x] = y; S.open = null; renderFacets(); }
  if (verb === 'record') { S.peek = x; S.open = null; renderFacets(); }
  if (verb === 'scrollto') { stage.scrollTo({ top: topIn(a.slice(9)), behavior: RM || instant ? 'auto' : 'smooth' }); }
  Icons.hydrate(stage);
}
function drawRings() {
  const layer = $('#rings', stage); if (!layer) return;
  const sr = stage.getBoundingClientRect();
  layer.innerHTML = rings.map((r, n) => {
    const els = $$(r.at, stage).filter(el => { const q = el.getBoundingClientRect(); return q.bottom > sr.top && q.top < sr.bottom; });
    if (!els.length) return '';
    const rs = els.map(el => el.getBoundingClientRect());
    const b = { left: Math.min(...rs.map(q => q.left)), top: Math.min(...rs.map(q => q.top)), right: Math.max(...rs.map(q => q.right)), bottom: Math.max(...rs.map(q => q.bottom)) };
    b.width = b.right - b.left; b.height = b.bottom - b.top; const pad = tok('--space-1');
    const icon = r.k === 'look' ? 'eye' : (r.k === 'scroll' ? 'move-vertical' : 'mouse-pointer-click');
    return `<div class="ring${n < rings.length - 1 ? ' past' : ''}" style="left:${b.left - sr.left + stage.scrollLeft - pad}px;top:${b.top - sr.top + stage.scrollTop - pad}px;width:${b.width + pad * 2}px;height:${b.height + pad * 2}px"><span class="no">${ic(icon, 10)}${n + 1}</span></div>`;
  }).join('');
}
const settle0 = s => false;
function step() {
  const p = PATH(); if (S.i >= p.length) return false;
  const s = p[S.i];
  act(s.act);
  rings.push(s);
  S.i++;
  if (s.k === 'look' && !settle0(s) && !inView(s.at)) console.warn('HONESTY', S.view, S.task, S.i, 'look out of view');
  const settle = s.act && s.act.startsWith('scrollto') && !RM ? tok('--motion-calm') : 0;
  setTimeout(() => { drawRings(); renderCounter(); }, settle);
  if (!settle) { drawRings(); renderCounter(); }
  return S.i < p.length;
}
function reset(view, task) {
  clearTimers(); S.playing = false;
  if (view) S.view = view; if (task) S.task = task;
  S.i = 0; S.sel = {}; S.open = null; S.peek = null; S.expanded = null; rings = [];
  stage.scrollTop = 0;
  renderView(); renderCounter(); renderBoard();
}
function play() {
  reset();
  S.playing = true;
  const gap = tok('--motion-spin');
  const tick = () => { const more = step(); if (more) later(tick, gap); else S.playing = false; };
  tick();
}

/* ---------- step counter ---------- */
function renderCounter() {
  const p = PATH(), c = countOf(p), t = TASK(S.task), v = VIEWS.find(x => x.id === S.view);
  const done = S.i >= p.length;
  $('#counter').innerHTML = `<div class="ph"><p class="eyebrow">Task ${t.id} \u00b7 ${esc(v.w)} \u00b7 ${esc(t.q)}</p><span class="eyebrow" style="letter-spacing:var(--tracking-soft)">${esc(t.kindOfQ)}</span></div>
    <ol class="steps">${p.map((s, n) => `<li class="${n < S.i ? 'done' : ''}${n === S.i - 1 ? ' now' : ''}"><span class="i">${n + 1}</span>${ic(s.k === 'look' ? 'eye' : (s.k === 'scroll' ? 'move-vertical' : 'mouse-pointer-click'), 13)}<span>${esc(s.t)}</span></li>`).join('')}</ol>
    <div class="tot"><b>${done ? c.all : S.i}</b><span>${done ? sWord(c) : `of ${c.all} steps`}</span></div>
    <p class="ans${done ? ' on' : ''}"><em>Answer.</em> ${esc(t.answer)} <em>Made hard:</em> ${esc(DATA.hard[S.view][S.task])}</p>`;
}
/* ---------- scoreboard (computed from the paths) ---------- */
function renderBoard() {
  const head = `<tr><th></th>${VIEWS.map(v => `<th>${esc(v.w)}</th>`).join('')}</tr>`;
  const rows = DATA.tasks.map(t => {
    const vals = VIEWS.map(v => S.scale ? DATA.atScale[t.id][v.id][0] : RES[v.id][t.id].length);
    const min = Math.min(...vals);
    return `<tr><th class="t" title="${esc(t.q)}"><span class="kbd">${t.id}</span></th>${VIEWS.map((v, n) => {
      const sub = S.scale ? `<span class="scale-why">${esc(DATA.atScale[t.id][v.id][1])}</span>` : sWord(countOf(RES[v.id][t.id]));
      return `<td><button class="${vals[n] === min ? 'best' : ''}${v.id === S.view && t.id === S.task ? ' cur' : ''}" data-v="${v.id}" data-t="${t.id}"><span class="n">${S.scale ? '~' : ''}${vals[n]}</span><span class="s">${sub}</span></button></td>`;
    }).join('')}</tr>`;
  }).join('');
  $('#board').innerHTML = `<div class="ph"><p class="eyebrow">${S.scale ? 'At scale' : `Steps at ${innerWidth} \u00d7 ${innerHeight}`}</p><button class="eyebrow" id="scaleBtn" style="letter-spacing:var(--tracking-soft)"><span class="kbd">S</span> ${S.scale ? 'five things' : 'at scale'}</button></div>
    <table>${head}${rows}</table>
    <p class="note">${S.scale ? esc(DATA.atScale.note) : 'Scrolls are added where a target is out of view at this size. ' + esc(DATA.honesty)}</p>`;
  $$('#board td button').forEach(b => b.onclick = () => { reset(b.dataset.v, b.dataset.t); play(); });
  $('#scaleBtn').onclick = () => { S.scale = !S.scale; renderBoard(); };
}
/* ---------- verdict ---------- */
function renderVerdict() {
  const best = { cards: 'rows-3', table: 'table-2', facets: 'list-filter', tie: 'equal' };
  $('#verdict').innerHTML = `<div class="ph"><p class="eyebrow">Verdict</p></div>
    <div class="rec" style="margin:0 0 var(--space-1)"><b>Recommended default.</b> ${esc(DATA.recommend)}</div>
    ${DATA.verdict.map(v => `<h4>${v.best ? ic(best[v.best], 14) : ic('info', 14)}${esc(v.head)}</h4><p>${esc(v.body)}</p>`).join('')}
`;
  Icons.hydrate($('#verdict'));
}

/* ---------- keys and boot ---------- */
$$('#views button').forEach(b => b.onclick = () => { reset(b.dataset.view); play(); });
$$('#tasks button').forEach(b => b.onclick = () => { reset(null, b.dataset.task); play(); });
$('#techBtn').onclick = () => { setTech(!document.body.classList.contains('tech')); drawRings(); };
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (['1', '2', '3'].includes(k)) { reset(VIEWS[+k - 1].id); play(); }
  else if (['a', 'b', 'c'].includes(k)) { reset(null, k.toUpperCase()); play(); }
  else if (k === 'p') play();
  else if (k === ' ' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); clearTimers(); if (S.i >= PATH().length) reset(); step(); }
  else if (k === 's') { S.scale = !S.scale; renderBoard(); }
  else if (k === 't') { setTech(!document.body.classList.contains('tech')); drawRings(); }
  else if (k === 'r') boot();
  else if (k === 'escape' && S.open) { S.open = null; renderFacets(); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const v = S.view, tk = S.task; resolveAll(); reset(v, tk); }, tok('--motion-slow')); });
stage.addEventListener('scroll', () => {}, { passive: true });
function boot() {
  setTech(false);
  S.scale = false;
  resolveAll();
  const h = new URLSearchParams(location.hash.slice(1));
  reset(h.get('v') || 'table', h.get('t') || 'A');
  if (h.get('s')) S.scale = true;
  renderVerdict();
  const w = $('#wrap'); w.classList.add('pre');
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.remove('pre')));
  later(play, tok('--motion-run'));
}
Icons.hydrate();
boot();
</script>
</body>
</html>
