<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Catalogue · Combined V2 · An operator's first day</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens (all mixes of kit tokens; listed as "needs token"
   in notes-v1.md and notes-v2.md).
   --------------------------------------------------------------- */
:root{
  /* --mark-gap (grammar sheet): four 1px corner ticks around the slot a detail would fill. Not known yet. */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-proposed-gap-tick: var(--space-2);
}
/* declared again on the mark itself, so a smaller tick resolves locally */
:root, .mk-gap{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
:root{
  /* --mark-stale-hatch (wear and time): 45 degree hatch, only ever on the age text */
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  /* shadow (light language): 135 degree hatch plus a lock, for not yours to see */
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* sources disagree: a warning-tinted edge, never red */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  /* --time-past-dim (wear and time): quiet lines, doesn't-apply text */
  --x-proposed-quiet: .62;
  /* the floor you are on, as one alias (Department here) */
  --x-proposed-here: var(--floor-department-high);
  /* mono numerals in data; wear and time asked for it too */
  --x-proposed-type-micro: .6875rem;
  /* the lit path of the eye in V1 (light language: the lit navigation path) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
h1{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;margin:var(--space-1) 0;color:var(--light)}
.lede{margin:0;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* two registers: the technical line sits one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}
.techbtn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink-muted)}
.techbtn[aria-pressed="true"]{color:var(--light);border-color:var(--ink-muted);background:var(--surface-raised)}

/* floor edges */
[data-tier="department"]{--fc:var(--floor-department-high)}
[data-tier="team"]{--fc:var(--floor-team-high)}
[data-tier="org"]{--fc:var(--floor-org-high)}
[data-tier="you"]{--fc:var(--floor-you-high)}

/* ===== the six ways to be empty ===== */
.mk{display:inline-block;vertical-align:middle;flex:none}
/* 1 not known yet: corner ticks around an empty slot */
.mk-gap{background:var(--x-proposed-gap);width:calc(var(--space-6) + var(--space-4));height:calc(var(--space-4) + var(--space-1));vertical-align:calc(var(--space-1) * -1)}
.mk-gap.s{width:calc(var(--space-5) - var(--space-1));height:var(--space-4);vertical-align:-1px;--x-proposed-gap-tick:var(--space-1)}
/* 2 none: the word itself, plainly */
.v-none{color:var(--ink);font-style:normal}
.mk-none{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink);border-bottom:1px solid var(--ink-muted);padding:0 1px}
/* 3 doesn't apply: quiet words, no edge */
.na{color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.mk-na{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
/* 4 out of date: 45 degree hatch on the age, never on the value */
.age{background:var(--x-proposed-stale);padding:0 var(--space-1);border-radius:2px;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.mk-stale{background:var(--x-proposed-stale);width:var(--space-4);height:var(--space-3);border-radius:2px}
/* 5 no record: wavy dashed break */
.mk-break{width:var(--space-5);height:var(--space-3);vertical-align:-1px}
.mk-break path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.mk-break.s{width:var(--space-4)}
/* 6 not yours to see: 135 degree hatch and a lock */
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);vertical-align:1px}
.mk-unseen{display:inline-flex;align-items:center;justify-content:center;width:var(--space-4);height:var(--space-3);background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:2px;color:var(--ink-muted)}
/* sources disagree */
.mk-disagree{width:var(--space-4);height:var(--space-3);border-left:2px solid var(--x-proposed-disagree);border-right:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash)}
.tag-dis{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-disagree);border:1px solid color-mix(in srgb,var(--warning) 35%,transparent);border-radius:2px;padding:0 var(--space-1)}

/* ===== statements (card V2) ===== */
.stm{padding:var(--space-1) 0 var(--space-2)}
.stm .say{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.stm .say b{font-weight:400;color:var(--light)}
.stm .say b.lk{color:var(--light);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap)}
.stm .say button.lk{color:var(--light);text-decoration:underline;text-decoration-color:var(--ink-muted);text-underline-offset:var(--focus-gap);border-radius:2px}
.stm .meta{margin:2px 0 0;display:flex;flex-wrap:nowrap;gap:0 var(--space-2);align-items:flex-start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.stm .meta svg{flex:none;margin-top:2px}
.stm .meta > span{min-width:0}
.stm.na .say{opacity:var(--x-proposed-quiet)}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin:var(--space-1) 0 0}
.fork .alt{border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);padding:var(--space-1) var(--space-2);border-radius:0 2px 2px 0}
.fork .alt b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.fork .alt span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.foot{border-top:1px solid var(--hairline);margin-top:var(--space-2);padding-top:var(--space-2)}
.foot .fh{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0 0 var(--space-1)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.foot li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);align-items:baseline;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.foot li .mk{justify-self:start}
.foot li b{font-weight:400;color:var(--ink)}

/* empties key strip */
.key6{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.key6 span{display:inline-flex;gap:var(--space-2);align-items:center;white-space:nowrap}
.key6 b{font-weight:400;color:var(--ink)}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}

.app{height:100vh;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr)}
.rail{background:var(--surface-bar);border-right:1px solid var(--hairline);padding:var(--space-5) var(--space-4) calc(var(--space-6) + var(--space-2));display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0}
.walk{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-1);position:relative}
.walk::before{content:"";position:absolute;left:calc(var(--space-3) - 1px);top:var(--space-4);bottom:var(--space-4);border-left:1px solid var(--hairline-strong)}
.walk button{position:relative;display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:0 var(--space-2);width:100%;padding:var(--space-2) var(--space-2) var(--space-2) 0;border-radius:var(--radius-key);color:var(--ink-muted)}
.walk .dot{grid-row:span 2;justify-self:center;margin-top:var(--space-1);width:var(--space-3);height:var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);background:var(--surface-bar)}
.walk .w{font-size:var(--type-meta);line-height:var(--leading-meta)}
.walk .s{font-size:var(--type-small);line-height:var(--leading-small);opacity:var(--x-proposed-quiet)}
.walk button.done .dot{background:var(--ink-muted);border-color:var(--ink-muted)}
.walk button.done{color:var(--ink)}
.walk button.here{background:var(--surface-raised);color:var(--light)}
.walk button.here .dot{background:var(--x-proposed-lit);border-color:var(--x-proposed-lit);box-shadow:0 0 var(--glow-blur) color-mix(in srgb,var(--green) 50%,transparent)}
.where{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.where b{font-weight:400;color:var(--ink)}
.where .floorline{display:block;width:var(--space-5);height:2px;background:var(--x-proposed-here);margin-bottom:var(--space-2)}
.rail .hints{flex-direction:column;align-items:flex-start;gap:var(--space-1)}
.dnote{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-left:2px solid var(--hairline-strong);padding-left:var(--space-2);margin:0}

.main{min-width:0;min-height:0;display:flex;flex-direction:column;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1))}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1) var(--space-2);min-height:var(--target-sm);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);border-bottom:1px solid var(--hairline);padding-bottom:var(--space-2);margin-bottom:var(--space-3)}
.crumbs button{border-radius:2px;color:var(--ink)}
.crumbs button:hover{color:var(--light)}
.crumbs .sep{color:var(--ink-muted);display:inline-flex;opacity:var(--x-proposed-quiet)}
.crumbs .last{color:var(--light)}
.crumbs .sn{color:var(--ink-muted)}
.crumbs .sn b{font-weight:400;color:var(--light);border-bottom:2px solid var(--x-proposed-here)}
.page{flex:1;min-height:0;transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out)}
.page.out{opacity:0;transform:translateX(calc(var(--travel-near) * -1))}
.page.in{opacity:0;transform:translateX(var(--travel-near))}
@media (prefers-reduced-motion: reduce){.page.out,.page.in{transform:none}}
.ph1{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-3)}
.ph1 .lede{max-width:92ch}

/* the lit next step (light language: lit navigation path) */
.next{box-shadow:0 0 0 var(--focus-ring) var(--x-proposed-lit);background:var(--x-proposed-lit-wash)!important;border-radius:var(--radius-key)}
.nexthint{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--x-proposed-lit);white-space:nowrap}

/* ---------- 1 contents page ---------- */
.book{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.82fr);gap:var(--space-5);overflow:auto;padding-right:var(--space-2)}
.part-no{font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fc)}
.part-t{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light);margin:var(--space-1) 0 0}
.part-s{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:0 0 var(--space-2)}
.entry{display:block;width:100%;padding:var(--space-2) var(--space-2) var(--space-2) var(--space-3);margin-left:calc(var(--space-3) * -1);border-radius:var(--radius-key);transition:background var(--motion-base),box-shadow var(--motion-base)}
.entry:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.line{display:flex;align-items:baseline;gap:var(--space-2)}
.line .nm{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);white-space:nowrap;display:inline-flex;gap:var(--space-2);align-items:center}
.line .nm svg{color:var(--ink-muted);align-self:center}
.line .lead{flex:1;border-bottom:1px dotted var(--hairline-strong);transform:translateY(calc(var(--space-1) * -1));min-width:var(--space-5)}
.line .ct{font:400 var(--type-meta)/1 var(--font-mono);color:var(--ink)}
.about{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:2px}
.subs{display:block;font-size:var(--type-small);line-height:var(--leading-meta);color:var(--ink);margin-top:2px}
.subs .d{white-space:nowrap}
.subs .d.thin{color:var(--ink-muted);font-style:italic}
.subs .pc{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.subs .sep{color:var(--ink-muted);margin:0 var(--space-1)}
.see{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:2px}
.see i{font-style:italic}
.see b{font-weight:400;color:var(--ink);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap)}
.side3 h3{margin:0 0 var(--space-1);font-weight:300;font-size:var(--type-body);line-height:var(--leading-body);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.side3 section{margin-bottom:var(--space-4)}
.vol{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 var(--space-2);padding:var(--space-2);margin-bottom:var(--space-2);background:var(--surface-inset);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.vol b{font-weight:400;color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta)}
.vol .mk-unseen{width:var(--space-5);height:var(--space-5);margin-top:2px}
.pred{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 var(--space-2);padding:var(--space-2);margin-bottom:var(--space-2);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.pred b{font-weight:400;font-style:italic;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.pred svg{margin-top:var(--space-1);opacity:var(--x-proposed-quiet)}
.triage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 var(--space-2);padding:var(--space-2);border:1px solid var(--hairline);border-left:2px solid var(--info);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.triage b{font-weight:400;color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta)}
.triage svg{margin-top:var(--space-1);color:var(--info)}
.side3 .key6{flex-direction:column;gap:var(--space-1)}

/* ---------- 2 and 3: a kind, and finding one ---------- */
.kindpage{height:100%;display:grid;grid-template-columns:calc(var(--measure-drawer) + var(--space-6)) minmax(0,1fr);gap:var(--space-5);min-height:0}
.kcard{overflow:auto;padding-right:var(--space-2)}
.kcard h1{display:flex;align-items:center;gap:var(--space-3)}
.kcard .says{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);margin:0 0 var(--space-3)}
.kcard h4{margin:var(--space-3) 0 var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.det{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--space-2);padding:var(--space-1) 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.det .bar{grid-column:1 / -1;height:var(--space-2);background:var(--x-proposed-gap);position:relative;--x-proposed-gap-tick:var(--space-1)}
.det .bar i{position:absolute;left:0;top:0;bottom:0;width:var(--p);background:color-mix(in srgb,var(--ink) 55%,transparent)}
.det .pc{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.det .who{grid-column:1 / -1;color:var(--ink-muted)}
.linkline{margin:0;font-size:var(--type-small);line-height:var(--leading-meta);color:var(--ink-muted)}
.linkline b{font-weight:400;color:var(--ink)}
.findcol{min-width:0;min-height:0;display:flex;flex-direction:column}
.sent{position:relative;font-weight:300;font-size:var(--type-heading);line-height:calc(var(--leading-heading) + var(--space-2));color:var(--ink-muted);margin:0 0 var(--space-1)}
.blank{position:relative;color:var(--ink-muted);border-bottom:1px dashed var(--hairline-strong);border-radius:2px;padding:0 2px}
.blank.set{color:var(--light);border-bottom:2px solid var(--x-proposed-here)}
.blank[aria-expanded="true"]{background:var(--surface-raised)}
.pop{position:absolute;z-index:5;width:calc(var(--measure-drawer) + var(--space-5));max-height:calc(var(--measure-glance) - var(--space-5));overflow:auto;background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);padding:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}

    let why = '';
    if (r.v === null && r.n) why = `${mark('gap')} not known yet · ${esc(KIND('contract').keeper)} could fill ${r.n === 1 ? 'it' : 'them'}`;
    if (!r.n) why = `none: checked ${base.length} contracts`;
    else if (r.dis) why = `${mark('disagree')} ${r.dis} with a disputed end date, counted under both`;
    return `<button class="opt${r.n ? '' : ' zero'}${lit ? ' lit' : ''}" data-v="${r.v === null ? '' : esc(r.v)}" role="option">${esc(valWord(f, r.v))}<span class="c">${r.n || 'none'}</span>${why ? `<span class="why">${why}</span>` : ''}</button>`;
  };
  const hf = FLOOR(DATA.hiddenContracts.floor);
  return `<div class="pop" id="pop" role="listbox" aria-label="${esc(f.q)}"><div class="q">${esc(f.q)} · what each would leave</div>${shown.map(opt).join('')}
    ${hiddenZero > 0 ? `<div class="opt zero"><span class="why">${hiddenZero} more that leave none</span></div>` : ''}
    <div class="hid">${mark('hidden')}<span>And ${esc(DATA.hiddenCount)} on ${esc(hf.name)}, a floor you can’t open · ask ${esc(hf.ask)}</span></div>
    <p class="tk" style="padding:0 var(--space-2)">facet · ${esc(f.tech)}</p></div>`;
}
function sentenceHtml() {
  const words = CF.map(f => {
    const set = f.id in S.sel;
    return `<button class="blank${set ? ' set' : ''}" data-f="${f.id}" aria-expanded="${S.open === f.id}" aria-haspopup="listbox">${esc(set ? valWord(f, S.sel[f.id]) : f.blank)}</button>`;
  }).join(' ');
  return `<div class="sent" id="sent">Show me <b style="font-weight:300;color:var(--light);border-bottom:2px solid var(--x-proposed-here)">contracts</b> ${words}.${S.open ? popHtml(CF.find(f => f.id === S.open)) : ''}</div>`;
}
const fmtEnd = c => c.alt ? `<span class="dis">${mark('disagree')}<b>31 Dec 2026</b><b>30 Jun 2027</b></span>` : (c.end === null ? `<span class="mk mk-gap s" role="img" aria-label="not known yet"></span> <span class="muted">not known yet</span>` : (c.end === '2028+' ? '2028 or later' : 'in ' + c.end));
function tableHtml(list) {
  const rows = list.slice(0, 60).map(c => `<tr class="row${c.id && S.stage === 2 && list.length === 1 ? ' next' : ''}" data-id="${c.id || ''}"><td class="n">${esc(c.n)}</td><td>${esc(c.sup)}</td><td>${c.site ? esc(c.site) : `<span class="mk mk-gap s" role="img" aria-label="not known yet"></span> <span class="muted">not known yet</span>`}</td><td>${fmtEnd(c)}</td><td class="mono">£${c.val}k</td></tr>`).join('');
  return `<div class="tblwrap scroll"><table class="ct"><thead><tr><th>Name</th><th>With</th><th>Covers</th><th>Ends</th><th>Value a year</th></tr></thead><tbody>${rows}</tbody></table>
    ${list.length > 60 ? `<p class="muted" style="font-size:var(--type-small)">and ${list.length - 60} more; narrow the sentence to see fewer.</p>` : ''}</div>`;
}
function renderFind() {
  const left = matchC(S.sel);
  const col = $('#findcol');
  col.innerHTML = `${sentenceHtml()}<p class="tk">a sentence of facets · one value per blank, every blank narrows (AND)</p>
    <div class="cnt"><b>${left.length}</b><span>of ${nf(C.length)} contracts on ${esc(HERE.name)} match.${Object.keys(S.sel).length ? ' Empty a blank to widen.' : ' Fill any blank: each word says how many it would leave.'}${left.length === 1 && left[0].id ? ` <span class="nexthint">${ic('arrow-right', 11)}enter: read it</span>` : ''}</span></div>${tableHtml(left)}`;
  if (S.open) {
    const b = $(`.blank[data-f=${S.open}]`, col), p = $('#pop', col), s = $('#sent', col);
    p.style.left = Math.max(0, Math.min(b.offsetLeft, s.clientWidth - p.offsetWidth)) + 'px';
    p.style.top = (b.offsetTop + b.offsetHeight + tok('--space-2')) + 'px';
  }
  $$('.blank', col).forEach(b => b.onclick = () => { S.open = S.open === b.dataset.f ? null : b.dataset.f; S.lit = null; renderFind(); });
  $$('.opt[data-v]', col).forEach(o => o.onclick = () => { const f = CF.find(x => x.id === S.open); S.sel[f.id] = o.dataset.v === '' ? null : o.dataset.v; S.open = null; S.lit = null; renderFind(); });
  $$('tr.row', col).forEach(r => r.onclick = () => { if (r.dataset.id) go(3); });
  Icons.hydrate(col);
}

/* ---------- the five stops ---------- */
function entryHtml(k, n) {
  const subs = k.details.map(([w, p]) => `<span class="d${p < 70 ? ' thin' : ''}">${esc(w)}${p < 100 ? ` <span class="pc">${p}%</span>` : ''}${p < 70 ? ` ${mark('gap')}` : ''}</span>`).join('<span class="sep">·</span>');
  const see = k.see.map(([verb, to]) => `<i>${esc(verb)}</i> <b>${esc(KIND(to).many)}</b>`).join('; ');
  return `<button class="entry dep" style="--i:${n}" data-kind="${k.id}">
    <span class="line"><span class="nm">${ic(k.icon, 16)}${esc(k.many)}</span><span class="lead"></span><span class="ct">${nf(k.count)}</span></span>
    <span class="about">${esc(k.about)} ${esc(k.keeper)} look after them · ${k.known}% known${k.triage ? ` · ${k.triage} waiting in Triage` : ''} <span class="tk">${esc(k.tech)} · ${esc(DATA.words.kind[1])}</span></span>
    <span class="subs">${subs}</span>
    ${see ? `<span class="see">See: ${see}</span>` : ''}</button>`;
}
function stageContents() {
  let n = 0;
  const part = (fid, idx) => {
    const f = FLOOR(fid), list = DATA.kinds.filter(k => k.floor === fid);
    return `<section data-tier="${f.tier}"><div class="part-no">Part ${romans[idx]}</div><h2 class="part-t">${esc(f.name)}</h2>
      <p class="part-s">${esc(f.word)} · ${esc(f.says)} · ${list.length} kinds of thing</p>${list.map(k => entryHtml(k, n++)).join('')}</section>`;
  };
  const vols = DATA.elsewhere.map(e => { const f = FLOOR(e.floor);
    return `<div class="vol dep" style="--i:${n++}"><span class="mk mk-unseen" aria-hidden="true">${ic('lock', 14)}</span><span><b>${esc(e.many)}</b> · ${esc(DATA.hiddenCount)} records<br>${esc(e.about)} Kept on ${esc(f.name)}, ${esc(f.word.toLowerCase())}. Ask ${esc(f.ask)}.</span></div>`; }).join('');
  const preds = DATA.predicted.map(p => `<div class="pred dep" style="--i:${n++}">${ic(p.icon, 14)}<span><b>${esc(p.many)}</b><br>${esc(p.why)} <span class="tk">${esc(p.tech)}</span></span></div>`).join('');
  page.innerHTML = `<div class="ph1"><div><p class="eyebrow">${esc(DATA.app)} · ${esc(HERE.name)}</p><h1>What we keep</h1>
      <p class="lede">Every kind of thing you can read, before any one record. Parts are floors, entries are kinds of thing, details follow each entry, and “See” lines are its links. <i>Thin</i> details carry the not-known-yet mark.</p></div>
      <button class="techbtn" aria-pressed="false">${ic('code', 14)}Technical words <span class="kbd">T</span></button></div>
    <div class="book scroll" style="height:calc(100% - var(--space-8) - var(--space-2))">
      <div>${part('org', 0)}</div>
      <div>${part('facilities', 1)}</div>
      <div class="side3">
        <section><h3>Other volumes</h3><p class="part-s">Kept on floors you can’t open. They stay listed, with whom to ask.</p>${vols}</section>
        <section><h3>Not yet written</h3><p class="part-s">Kinds the structure predicts but nobody keeps yet.</p>${preds}</section>
        <section><h3>Waiting</h3><div class="triage dep" style="--i:${n++}">${ic('inbox', 14)}<span><b>${DATA.triage.count} things wait in Triage</b><br>Nobody could place them yet. ${esc(DATA.triage.who)} decides. One is “${esc(DATA.triage.example)}”.</span></div></section>
        <section><h3>Six ways to be empty</h3><div class="key6">${keySix()}</div></section>
      </div>
    </div>`;
  $$('.entry', page).forEach(b => b.onclick = () => { if (b.dataset.kind === 'contract') go(1); else { $$('.entry', page).forEach(x => x.classList.remove('next')); b.classList.add('next'); } });
}
function stageKind(find) {
  const k = KIND('contract'), f = FLOOR(k.floor), hf = FLOOR(DATA.hiddenContracts.floor);
  const dets = k.details.map(([w, p]) => `<div class="det"><span>${esc(w)}</span><span class="pc">${p}% known</span><span class="bar" role="img" aria-label="${p}% known, the rest not known yet"><i style="--p:${p}%"></i></span>${p < 70 ? `<span class="who">${mark('gap')} ${nf(Math.round(k.count * (100 - p) / 100))} not known yet · ${esc(k.keeper)} could fill</span>` : ''}</div>`).join('');
  const links = k.see.map(([verb, to]) => `<p class="linkline">A contract <i>${esc(verb)}</i> <b>${esc(KIND(to).many.toLowerCase())}</b>.</p>`).join('');
  page.innerHTML = `<div class="kindpage">
    <div class="kcard scroll">
      <p class="eyebrow">Kind of thing <span class="tk">${esc(k.tech)} · ${esc(DATA.words.kind[1])}</span></p>
      <h1>${ic(k.icon, 26)}${esc(k.many)}</h1>
      <p class="says">${esc(k.about)}</p>
      <p class="linkline"><b>${nf(k.count)}</b> kept on ${esc(f.name)} · ${esc(k.keeper)} look after them</p>
      <h4>Every contract should say</h4>${dets}
      <h4>Links</h4>${links}
      <h4>Not on this page</h4>
      <p class="linkline">${mark('hidden')} ${esc(cap1(DATA.hiddenCount))} more on ${esc(hf.name)}, a floor you can’t open. Ask ${esc(hf.ask)}.</p>
      <p class="linkline">${ic('inbox', 12)} ${k.triage} waiting in Triage. ${esc(DATA.triage.who)} decides.</p>
    </div>
    <div class="findcol" id="findcol"></div></div>`;
  renderFind();
}
const PEOPLE = ['priya', 'tomasz', 'proc'];
function recordHtml(id, came, follow) {
  const rec = DATA.records[id], k = KIND(rec.kind), f = FLOOR(rec.floor);
  const srcs = [...new Set(rec.st.flatMap(s => s.vals ? s.vals.map(v => v.src) : (s.src ? [s.src] : [])))];
  return `<div class="rec">
    <div class="main2 scroll" data-tier="${f.tier}">
      ${came ? `<p class="came">${ic('corner-down-right', 13)}You came from <button data-back="1">${esc(came)}</button>, which is with this supplier.</p>` : ''}
      <p class="kline">${ic(k.icon, 14)}<span>${esc(cap1(k.one))} · kept on ${esc(f.name)}</span><span class="key">${esc(rec.key)}</span><span class="tk">${esc(k.tech)}</span></p>
      <h1>${esc(rec.name)}</h1>
      <div class="stms">${rec.st.map(s => { const h = statement(s, { follow: follow || [] }); return s.st === 'disagree' ? h.replace('class="stm"', 'class="stm wide"') : h; }).join('')}</div>
    </div>
    <aside class="scroll">${foot(rec)}
      <p class="fh">Where it came from</p>
      <ul class="srcs">${srcs.map(s => `<li>${ic(PEOPLE.includes(s) ? 'user-round' : 'file-text', 13)}<span>${esc(SRC(s))}</span></li>`).join('')}</ul>
      <p class="fh" style="margin-top:var(--space-4)">Six ways to be empty</p><div class="key6" style="flex-direction:column;gap:var(--space-1)">${keySix()}</div>
    </aside></div>`;
}
function stageRecord() {
  page.innerHTML = recordHtml('grounds', null, ['meadow']);
  const nx = $('[data-follow=meadow]', page);
  if (nx) { nx.closest('.stm').classList.add('next'); nx.insertAdjacentHTML('afterend', ` <span class="nexthint">${ic('arrow-right', 11)}enter: follow the link</span>`); }
  $$('[data-follow]', page).forEach(b => b.onclick = () => { if (b.dataset.follow === 'meadow') go(4); else if (b.dataset.follow === 'halden') {} });
}
function stageFollow() {
  page.innerHTML = recordHtml('meadow', DATA.records.grounds.name, ['grounds']);
  $('[data-back]', page).onclick = () => go(3);
  $$('[data-follow=grounds]', page).forEach(b => b.onclick = () => go(3));
}

/* ---------- breadcrumb: the path as a sentence ---------- */
function renderCrumbs() {
  const sep = `<span class="sep">${ic('chevron-right', 14)}</span>`;
  const parts = [`<button data-go="0">${esc(DATA.app)}: what we keep</button>`];
  if (S.stage >= 1) parts.push(`<button data-go="1">${esc(KIND('contract').many)}</button>`);
  if (S.stage >= 2 && Object.keys(S.sel).length) {
    const phr = CF.filter(f => f.id in S.sel).map(f => `<b>${esc(valWord(f, S.sel[f.id]))}</b>`).join(', ');
    parts.push(`<span class="sn">${phr}</span>`);
  }
  if (S.stage >= 3) parts.push(`<button data-go="3">${esc(DATA.records.grounds.name)}</button>`);
  if (S.stage >= 4) parts.push(`<span class="sn">is with</span> <button data-go="4">${esc(DATA.records.meadow.name)}</button>`);
  $('#crumbs').innerHTML = parts.join(sep);
  const last = $$('#crumbs button').pop(); if (last) last.classList.add('last');
  $$('#crumbs button').forEach(b => b.onclick = () => go(+b.dataset.go));
  Icons.hydrate($('#crumbs'));
}

/* ---------- moving along the walk ---------- */
function draw() {
  clearTimers();
  if (S.stage === 0) stageContents();
  if (S.stage === 1) { S.sel = {}; S.open = null; stageKind(); }
  if (S.stage === 2) { stageKind(); if (Object.keys(S.sel).length < DATA.demoFind.length) findDemo(); }
  if (S.stage === 3) stageRecord();
  if (S.stage === 4) stageFollow();
  renderWalk(); renderCrumbs();
  Icons.hydrate(page);
  setTech(document.body.classList.contains('tech'));
  $$('.techbtn', page).forEach(b => b.onclick = () => setTech(!document.body.classList.contains('tech')));
}
function go(n) {
  n = Math.max(0, Math.min(DATA.walk.length - 1, n));
  if (n <= 1 || (n === 2 && S.stage < 2)) S.sel = {};
  if (n >= 3) DATA.demoFind.forEach(([f, v]) => { S.sel[f] = v; });
  S.open = null; S.lit = null;
  if (RM) { S.stage = n; draw(); return; }
  page.classList.add('out');
  setTimeout(() => { S.stage = n; draw(); page.classList.remove('out'); page.classList.add('in'); requestAnimationFrame(() => requestAnimationFrame(() => page.classList.remove('in'))); }, tok('--motion-base'));
}
/* stage 3 plays itself: open a blank, show what each word leaves, choose, next */
function findDemo() {
  const steps = [];
  DATA.demoFind.forEach(([f, v]) => {
    if (f in S.sel) return;
    steps.push(() => { S.open = f; S.lit = null; renderFind(); renderCrumbs(); });
    steps.push(() => { S.lit = [f, v]; renderFind(); });
    steps.push(() => { S.sel[f] = v; S.open = null; S.lit = null; renderFind(); renderCrumbs(); });
  });
  let t = tok('--motion-calm');
  steps.forEach(s => { later(s, t); t += tok('--motion-spin'); });
}
function next() {
  if (S.stage === 2 && Object.keys(S.sel).length < DATA.demoFind.length) { clearTimers(); DATA.demoFind.forEach(([f, v]) => { S.sel[f] = v; }); S.open = null; S.lit = null; renderFind(); renderCrumbs(); return; }
  go(S.stage + 1);
}
function playWalk() {
  clearTimers(); S.sel = {}; S.stage = 0; draw();
  const dwell = [tok('--motion-still'), tok('--motion-still'), tok('--motion-hold') + tok('--motion-still'), tok('--motion-hold'), 0];
  let t = 0;
  dwell.slice(0, 4).forEach((d, i) => { t += d; TIMERS.push(setTimeout(() => go(i + 1), RM ? 0 : t)); });
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowright' || (k === 'enter' && document.activeElement === document.body)) { e.preventDefault(); next(); }
  else if (k === 'arrowleft') go(S.stage - 1);
  else if (['1', '2', '3', '4', '5'].includes(k)) go(+k - 1);
  else if (k === 'p') playWalk();
  else if (k === 't') setTech(!document.body.classList.contains('tech'));
  else if (k === 'r') boot();
  else if (k === 'escape' && S.open) { S.open = null; renderFind(); }
});
function boot() {
  clearTimers(); setTech(false);
  const h = parseInt(location.hash.slice(1), 10);
  S.sel = {}; S.open = null; S.lit = null;
  S.stage = h >= 1 && h <= 5 ? h - 1 : 0;
  if (S.stage >= 3) DATA.demoFind.forEach(([f, v]) => { S.sel[f] = v; });
  const w = $('#wrap'); w.classList.add('pre');
  const keep = S.stage; S.stage = keep === 2 ? 1 : keep; draw(); S.stage = keep;
  later(() => {
    w.classList.remove('pre');
    if (keep === 0) later(() => { const c = $('.entry[data-kind=contract]', page); if (c) { c.classList.add('next'); c.querySelector('.line .nm').insertAdjacentHTML('beforeend', ` <span class="nexthint">${ic('arrow-right', 11)}open</span>`); Icons.hydrate(c); } }, tok('--motion-calm') + tok('--motion-slow'));
    if (keep === 2) draw();
  }, tok('--motion-run'));
}
Icons.hydrate();
boot();
</script>
</body>
</html>
