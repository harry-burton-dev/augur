<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Marking V4 · Agreed in the room</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Marking V4: the meeting agrees the review as it agrees a minute. Assent is to the record, not to the mark; a disagreement stays as two signed marks ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.items{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.it{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-pane);display:grid;grid-template-columns:3em minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:start;transition:border-color var(--motion-calm) var(--ease-out)}
.it .n{font:300 var(--type-heading)/1 var(--font-mono);color:var(--ink-muted)}
.it .s{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.it .mk{grid-column:2 / 4;display:grid;gap:var(--space-1)}
.it .mk .m{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.it .mk .by{color:var(--ink-muted)}
.it .faces{grid-column:2 / 4;display:flex;gap:var(--space-1);align-items:center;flex-wrap:wrap}
.it .faces .w{font-size:var(--type-small);color:var(--ink-muted);margin-left:var(--space-2)}
.it .st{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.it.pen{border-style:dotted;border-color:var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash)}
.it.pen .mk .m span:last-child{font-style:italic}
.it.ink .st{color:var(--x-proposed-lit)}
.it.split .st{color:var(--x-proposed-mark-info)}
.face.yes{border-color:var(--x-proposed-lit);color:var(--light);box-shadow:0 0 0 var(--focus-gap) var(--x-proposed-lit-wash)}
.rules{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.rules li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);padding:var(--space-2) 0;border-top:1px solid var(--hairline)}
.rules b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.it{padding:var(--space-2) var(--space-3)}.items{gap:var(--space-2)}.rules{padding:var(--space-3) var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Marking · V4</b> agreed in the room: each critical moment read back, each person present says “that is the review”; two reviewers who disagree both stay, signed · Hansard’s agreed record, the minute run, dual-annotated games</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = DATA.review;
const PRESENT = ['p1', 'p2', 'p3', 'p4', 'p5', 'p8'];
const ITEMS = peopleCritical();
const S = { done: [4], live: 6 };
function render() {
  $('#app').innerHTML = topHTML(['Mandate', DATA.body.short, '8 Dec 2026', 'Item 3: review of ' + DEC.id], [['Space', 'next person assents'], ['R', 'replay']], { as: R.agreed }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">Agreed in the room</h1><p class="lede">The review is agreed at the next meeting, the way a minute is. ${P(R.facilitator).name} reads back each critical moment; each person present answers “that is the review”. Assent is to the record, not to the mark: you can assent to a mark you’d have put differently, and say so.</p></div>
    <section class="items scroll">${ITEMS.map(n => { const m = MV(n), done = S.done.includes(n), live = S.live === n, two = reviewMarks(n).length > 1;
      const yes = done ? PRESENT : live ? PRESENT.slice(0, S.k || 0) : [];
      return `<div class="it ${done ? (two ? 'ink split' : 'ink') : 'pen'}"><span class="n">${n}.</span><span class="s">${m.san}</span><span class="st">${done ? (two ? 'agreed · two marks' : 'agreed') : live ? 'reading back' : 'pencil'}</span>
        <div class="mk">${ANN(n).map(a => `<div class="m">${gl(a.g)}<span>${a.line} <span class="by">· ${first(a.by)}${a.self ? ', own move' : ''}</span></span></div>`).join('')}</div>
        <div class="faces">${PRESENT.map(p => face(p, 'sm ' + (yes.includes(p) ? 'yes' : ''))).join('')}<span class="w">${done ? `all ${PRESENT.length} present` : live ? `${yes.length} of ${PRESENT.length}` : 'not yet read back'}</span></div></div>`; }).join('')}</section>
    <aside class="rules pane scroll"><p class="eyebrow">The rules of agreeing</p><ul>
      <li>${I('users', 16)}<span><b>Everyone present answers.</b> Silence isn’t assent; the item stays open until each person has answered.</span></li>
      <li>${I('split', 16)}<span><b>A disagreement is recorded, not settled.</b> Move 13 keeps ${gl('!?')} from ${first('p9')} and ${gl('?')} from ${first('p5')}. Nobody votes on a mark.</span></li>
      <li>${I('user-round', 16)}<span><b>The mover’s own mark always stays,</b> beside the reviewer’s, even when they differ.</span></li>
      <li>${I('stamp', 16)}<span><b>Once agreed, marks are ink.</b> A later correction is a new, dated mark beside the old one, with a reason.</span></li>
      <li>${I('book-open', 16)}<span><b>Agreeing files it.</b> The review goes into the floor’s book under ${DATA.book.games[0].code}, readable by whoever can open ${DEC.id}.</span></li></ul></aside>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function step() { S.k = (S.k || 0) + 1; if (S.k >= PRESENT.length) { S.done.push(S.live); const i = ITEMS.indexOf(S.live); S.live = ITEMS[i + 1] || null; S.k = 0; } render(); }
function replay() {
  clearLater(); S.done = [4]; S.live = 6; S.k = 0; render(); settle();
  PRESENT.forEach((_, i) => later(step, MOMENT() + i * ms('--motion-base')));
}
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key === ' ' && S.live) { e.preventDefault(); clearLater(); step(); } });
replay();
</script>
</body>
</html>
