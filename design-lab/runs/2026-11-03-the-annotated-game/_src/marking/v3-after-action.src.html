<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Marking V3 · The after-action review</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Marking V3: the four after-action questions, each answer pinned to a move. Pinning is how a move gets its mark ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-4)}
.strip{padding:var(--space-2) var(--space-3);display:flex;gap:var(--space-1);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);padding:var(--space-1) var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);transition:border-color var(--motion-calm) var(--ease-out),color var(--motion-calm) var(--ease-out)}
.chip.world{border-style:dashed;font-style:italic}
.chip.pinned{border-color:var(--hairline-strong);color:var(--light)}
.chip.flash{border-color:var(--x-proposed-warn)}
.chip .gl{font-size:var(--type-small);min-width:0}
.q4{min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}
.q{min-height:0;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.q h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.q .h{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-bottom:var(--space-1)}
.q .t{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2);align-items:start;padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline);background:var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small)}
.item .pin{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink);white-space:nowrap}
.item .pin .gl{font-size:var(--type-small);min-width:0}
.item.new{border-color:var(--x-proposed-warn)}
.sub{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-top:var(--space-2)}
.facts{display:grid;grid-template-columns:auto auto;gap:var(--space-1) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);justify-content:start}
.facts b{font-weight:400;color:var(--light);font-family:var(--font-mono)}
@media (max-width:1400px){.q{padding:var(--space-3)}.q4{gap:var(--space-3)}.item{padding:var(--space-1) var(--space-2)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Marking · V3</b> the after-action review: what was meant, what happened, why, what to keep; every “why” and “keep” is pinned to a move, and that pin is its mark · US Army after-action review, Kasparov</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = DATA.review;
const S = { pinned: false };
/* which moves are pinned: every why, keep and change points at one */
const pins = () => [...R.why, ...R.keep, ...R.change].filter(x => S.pinned || x.move !== 6).map(x => x.move);
const pin = (x, cls = '') => { const g = (mainMark(x.move) || {}).g; return `<div class="item ${cls}"><span>${x.text}</span><span class="pin">${x.move}. ${g ? gl(g) : ''}</span></div>`; };
function render() {
  const P_ = pins();
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'After-action review'], [['P', 'pin the second why'], ['R', 'replay']], { as: R.held }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">The after-action review</h1><p class="lede">Four questions, asked the same way every time, led by ${P(R.facilitator).name} with ${R.with.length} people who took part. A routine, not a blame exercise. Every answer to “why” and “what to keep” is pinned to the move it is about; the pin becomes that move’s mark.</p></div>
    <div class="strip pane" aria-label="Moves">${MOVES.map(m => `<span class="chip ${m.side} ${P_.includes(m.n) ? 'pinned' : ''} ${S.pinned && m.n === 6 ? 'flash' : ''}" title="${m.san}">${m.n}${P_.includes(m.n) && mainMark(m.n) ? ' ' + gl(mainMark(m.n).g) : ''}</span>`).join('')}<span class="small muted" style="margin-left:var(--space-2)">${new Set(P_).size} of ${MOVES.filter(m => m.side === 'us').length} of our moves pinned</span></div>
    <div class="q4">
      <section class="q pane"><h2>What was meant to happen?</h2><p class="h">From the decision’s own words. Not rewritten.</p><p class="t">${DEC.intended}</p>
        <p class="sub">Its lines</p>${DATA.lines.map(L => `<p class="t muted">${L.text}</p>`).join('')}</section>
      <section class="q pane"><h2>What happened?</h2><p class="h">From the records, as at ${dt(DEC.ended, 'short')}. Nobody types these.</p>
        <div class="facts"><span>Fitters in post</span><b>${seriesAt('fitters', DEC.ended)} of 2</b><span>Vans overdue</span><b>${seriesAt('overdue', DEC.ended)} of ${DATA.series.overdue.of}</b><span>Our cost a van</span><b>£${seriesAt('cost', DEC.ended)}</b><span>Days in force</span><b>${DEC.days}</b><span>Result</span><b>${DATA.results[DEC.result]}</b></div>
        <p class="t">${DEC.happened}</p></section>
      <section class="q pane scroll"><h2>Why?</h2><p class="h">Causes, each at a move. A cause that can’t be pinned to a move isn’t one yet.</p>
        ${R.why.map(x => S.pinned || x.move !== 6 ? pin(x, S.pinned && x.move === 6 ? 'new fade' : '') : `<div class="item pencil"><span class="pt">${x.text}</span><span class="pin muted">pin to…</span></div>`).join('')}</section>
      <section class="q pane scroll"><h2>What to keep, what to change?</h2><p class="h">Both, every time. The keeps are the ${gl('!')} marks.</p>
        <p class="sub">Keep</p>${R.keep.map(x => pin(x)).join('')}<p class="sub">Change</p>${R.change.map(x => S.pinned || x.move !== 6 ? pin(x) : `<div class="item pencil"><span class="pt">${x.text}</span><span class="pin muted">pin to…</span></div>`).join('')}</section>
    </div>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.pinned = false; render(); settle(); later(() => { S.pinned = true; render(); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key.toLowerCase() === 'p') { S.pinned = true; render(); } });
replay();
</script>
</body>
</html>
