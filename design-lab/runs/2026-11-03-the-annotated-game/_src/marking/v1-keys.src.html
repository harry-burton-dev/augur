<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Marking V1 · Six keys and a line</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Marking V1: keyboard first. Pick a move, press a number for the mark, write one sentence. Drafts are pencil ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.sheet{min-height:0;padding:var(--space-3);display:flex;flex-direction:column;gap:2px}
.mv .draft{font-style:italic;color:var(--ink-muted);border-bottom:1px dotted var(--x-proposed-pencil)}
.ed{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.ed .san{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--space-2)}
.key{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);padding:var(--space-2) var(--space-1);border:1px solid var(--hairline);border-radius:var(--radius-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.key .gl{font-size:var(--type-heading)}
.key.on{border-color:var(--light);background:var(--surface-raised);color:var(--light)}
.signs{display:flex;gap:var(--space-2);flex-wrap:wrap}
.signs .btn .gl{min-width:0}
.line{display:grid;gap:var(--space-1)}
.line label{font-size:var(--type-small);color:var(--ink-muted)}
.line textarea{font:italic 400 var(--type-meta)/var(--leading-meta) var(--font-sans);color:var(--ink);background:var(--x-proposed-pencil-wash);border:1px dotted var(--x-proposed-pencil);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);resize:none;height:calc(var(--leading-meta) * 2 + var(--space-4))}
.line .cnt{display:flex;justify-content:space-between;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.line .cnt .over{color:var(--x-proposed-warn)}
.prompts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.prompts .p{padding:var(--space-2) var(--space-3);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.prompts .p b{display:block;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink)}
.state{margin-top:auto;display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.ed{padding:var(--space-3) var(--space-4);gap:var(--space-2)}.sheet .mv{padding:2px var(--space-2)}.key{padding:var(--space-1)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Marking · V1</b> six keys and a line: pick a move, press 1 to 6, write one sentence; a draft stays pencil until the reviewer releases it · Informator symbols, keyboard annotation in analysis boards</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { n: 11, g: null, line: '', released: false };
const MAX = 140;
function render() {
  const m = MV(S.n), mine = S.g;
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'Marking'], [['↑ ↓', 'move'], ['1–6', 'mark'], ['0', 'clear'], ['Enter', 'release'], ['R', 'replay']], { as: DATA.review.held }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">Six keys and a line</h1><p class="lede">Marking a move takes one key. A line takes one sentence, and only where it matters. Everything you write is pencil until you release it to the review; nobody else sees it before then.</p></div>
    <section class="sheet pane scroll" aria-label="Moves">${MOVES.map(x => { let r = moveRow(x, { sel: S.n, marks: x.n !== S.n || !mine ? (x.n === 11 ? false : true) : false }); if (x.n === S.n && mine) r = r.replace('<span class="mv-g"></span>', `<span class="mv-g"><span class="draft">${gl(mine)}</span></span>`); return r; }).join('')}</section>
    <section class="ed pane">
      <p class="lab">Move ${m.n} · ${dt(m.on)} · ${m.side === 'world' ? 'the world' : P(m.by).name}</p>
      <p class="san">${m.san}</p><p class="small">${m.text}</p>
      ${m.side === 'world' ? `<p class="box small">${I('info', 14)} The world’s moves aren’t marked: nobody chose them. Mark the move that answered it.</p>` : `
      <div class="keys" role="radiogroup" aria-label="Mark">${DATA.markOrder.map((g, i) => `<button class="key ${mine === g ? 'on' : ''}" data-g="${g}" role="radio" aria-checked="${mine === g}">${gl(g)}<span><span class="kbd">${i + 1}</span> ${MK(g).w}</span></button>`).join('')}</div>
      <div class="signs">${Object.keys(DATA.signs).filter(g => g !== '∆').map(g => `<button class="btn sm">${gl(g)} ${MK(g).w}</button>`).join('')}<button class="btn sm">${gl('∞')} ${DATA.unclear.w}</button></div>
      <div class="line"><label for="ln">One line, if this is where it turned</label><textarea id="ln" maxlength="${MAX + 40}" placeholder="What was known, what was chosen, what else was on the record.">${S.line}</textarea>
        <div class="cnt"><span>${mine === '?' || mine === '??' ? 'A ? needs what else was on the record. Without it, ?! at most.' : 'Optional on a quiet move.'}</span><span class="${S.line.length > MAX ? 'over' : ''}">${S.line.length} / ${MAX}</span></div></div>
      <div class="prompts"><div class="p"><b>Known then</b>${recordAt(m.on).slice(-1)[0].w}</div><div class="p"><b>Chosen</b>${m.san}</div><div class="p"><b>Instead, on the record</b>${(m.opts || []).filter(o => !o.played).map(o => o.san).join(' · ') || 'nothing recorded'}</div></div>`}
      <div class="state">${S.released ? `${I('check', 14)} <span class="lite">Released to the review.</span> ${list(DATA.review.with.map(first))} can see it. It is agreed with the rest on ${dt(DATA.review.agreed, 'short')}.` : `${I('pencil', 14)} Pencil: only you, ${P(DATA.review.facilitator).name}, can see this. <button class="btn sm go" id="rel" ${mine ? '' : 'aria-disabled="true"'}>${I('send', 14)} Release</button>`}</div>
    </section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('.key').forEach(b => b.onclick = () => { S.g = S.g === b.dataset.g ? null : b.dataset.g; render(); });
  $$('.mv').forEach(b => b.onclick = () => { clearLater(); S.n = +b.dataset.n; S.g = (mainMark(S.n) || {}).g || null; S.line = (mainMark(S.n) || {}).line || ''; S.released = !!mainMark(S.n) && S.n !== 11; render(); });
  const ta = $('#ln'); if (ta) ta.oninput = () => { S.line = ta.value; const c = $('.cnt span:last-child'); c.textContent = S.line.length + ' / ' + MAX; c.classList.toggle('over', S.line.length > MAX); };
  $('#rel') && ($('#rel').onclick = () => { if (S.g) { S.released = true; render(); } });
}
function replay() {
  clearLater(); Object.assign(S, { n: 11, g: null, line: '', released: false }); render(); settle();
  const target = mainMark(11);
  later(() => { S.g = target.g; render(); }, MOMENT());
  later(() => { S.line = target.line; render(); }, MOMENT() + ms('--motion-slow'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.target.closest('textarea')) return;
  const i = '123456'.indexOf(e.key); if (i >= 0 && MV(S.n).side === 'us') { S.g = DATA.markOrder[i]; render(); }
  if (e.key === '0') { S.g = null; render(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); clearLater(); S.n = Math.max(1, Math.min(MOVES.length, S.n + (e.key === 'ArrowDown' ? 1 : -1))); S.g = (mainMark(S.n) || {}).g || null; S.line = (mainMark(S.n) || {}).line || ''; S.released = !!mainMark(S.n) && S.n !== 11; render(); }
  if (e.key === 'Enter' && S.g) { S.released = true; render(); }
});
replay();
</script>
</body>
</html>
