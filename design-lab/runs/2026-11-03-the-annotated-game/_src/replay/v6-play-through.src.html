<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Replay V6 · Play through</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Replay V6: play the decision through at reading pace. Quiet moves pass in a line; it stops only where it turned ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.stage{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-read) minmax(0,1fr);align-items:center}
.ticker{grid-column:1;justify-self:end;display:flex;flex-direction:column;gap:var(--space-1);align-items:flex-end;padding-right:var(--space-6);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.ticker .t{white-space:nowrap}
.ticker .t .gl{font-size:var(--type-small);min-width:0}
.card{grid-column:2;padding:var(--space-5) var(--space-6);display:flex;flex-direction:column;gap:var(--space-3)}
.card.stop{border-color:var(--x-proposed-warn)}
.card .d{display:flex;gap:var(--space-3);align-items:baseline}
.card .d .n{font:300 var(--type-title)/1 var(--font-mono);color:var(--ink-muted)}
.card .d .w{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.card .san{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light)}
.card .txt{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.card .an{display:grid;grid-template-columns:3em minmax(0,1fr);gap:var(--space-3);align-items:baseline;font-size:var(--type-meta);line-height:var(--leading-meta);padding-top:var(--space-2);border-top:1px solid var(--hairline)}
.card .an .by{font-size:var(--type-small);color:var(--ink-muted)}
.card .go{display:flex;align-items:center;gap:var(--space-3);font-size:var(--type-small);color:var(--ink-muted)}
.side{grid-column:3;padding-left:var(--space-6);display:flex;flex-direction:column;gap:var(--space-2);align-items:flex-start}
.side .eb{height:calc(var(--space-8) + var(--space-6))}
.prog{position:relative;height:var(--space-6);margin:0 var(--space-3)}
.prog .base{position:absolute;left:0;right:0;top:var(--space-3);height:1px;background:var(--hairline-strong)}
.prog .done{position:absolute;left:0;top:calc(var(--space-3) - 1px);height:3px;background:var(--light);border-radius:1px;transition:width var(--motion-base) var(--ease-out)}
.prog .st{position:absolute;top:calc(var(--space-3) - var(--space-1) - 1px);width:var(--space-3);height:var(--space-3);transform:translateX(-50%);border-radius:var(--radius-pill);border:1px solid var(--x-proposed-warn);background:var(--slate-deep)}
.prog .st.past{background:var(--x-proposed-warn)}
.prog .nl{position:absolute;top:calc(var(--space-4) + var(--space-1));transform:translateX(-50%);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
@media (max-width:1400px){.stage{grid-template-columns:minmax(0,1fr) var(--measure-decision) minmax(0,.8fr)}.card{padding:var(--space-4) var(--space-5)}.card .san{font-size:var(--type-heading);line-height:var(--leading-heading)}.ticker{padding-right:var(--space-4)}.side{padding-left:var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Replay · V6</b> play through: quiet moves pass in a line at reading pace; it stops at the four moments that turned and waits for you · annotated game collections, Nimzowitsch</div>
<script>
/*@DATA@*/
/*@LIB@*/
const STOPS = peopleCritical();
const S = { n: 0, stopped: false };
function card() {
  if (!S.n) return `<section class="card pane"><p class="lab">${DEC.id} · ${MOVES.length} moves · ${STOPS.length} stops</p><p class="san">${DEC.title}</p><p class="txt">${DEC.intended}</p><p class="go">${I('play', 14)} <span class="kbd">Space</span> plays it through. It stops where the game turned.</p></section>`;
  const m = MV(S.n), stop = STOPS.includes(m.n);
  return `<section class="card pane fade ${stop ? 'stop' : ''}" aria-live="polite"><div class="d"><span class="n">${m.n}.</span><span class="w">${dt(m.on)} · ${m.side === 'world' ? 'the world' : first(m.by)}</span></div>
    <p class="san">${m.san} ${m.sign ? gl(m.sign, 'big') : ''}</p><p class="txt">${m.text}</p>
    ${stop ? ANN(m.n).map(a => `<div class="an">${gl(a.g, 'big')}<span>${a.line}<br><span class="by">${P(a.by).name}${a.self ? ', own move' : ''}</span></span></div>`).join('') + `<p class="go">${I('pause', 14)} Stopped at a critical moment. <span class="kbd">Space</span> plays on.</p>` : ''}
    ${S.n === MOVES.length ? `<p class="go">${I('flag', 14)} ${DATA.results[DEC.result]} after ${DEC.days} days. <span class="kbd">R</span> from the start.</p>` : ''}</section>`;
}
function render() {
  const p = S.n ? posAt(MV(S.n).on) : posAt(MOVES[0].on);
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'Play through'], [['Space', 'play, stop'], ['← →', 'step'], ['R', 'from the start']]) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">Play through</h1><p class="lede">How masters study: replay the whole game at a steady pace and stop where it turned. Quiet moves pass in a line on the left; the four critical moments wait for you.</p></div>
    <div class="stage">
      <div class="ticker" aria-hidden="true">${MOVES.filter(m => m.n < S.n).slice(-9).map(m => `<span class="t">${m.n}. ${m.san} ${mainMark(m.n) ? gl(mainMark(m.n).g) : ''}</span>`).join('')}</div>
      ${card()}
      <div class="side">${posGl(p.s, 'big')}${evalBar(p.h)}<span class="small muted">${p.w}</span></div>
    </div>
    <div class="prog"><span class="base"></span><span class="done" style="width:${(S.n / MOVES.length * 100).toFixed(1)}%"></span>${STOPS.map(n => `<span class="st ${n <= S.n ? 'past' : ''}" style="left:${(n / MOVES.length * 100).toFixed(1)}%" title="Move ${n}"></span><span class="nl" style="left:${(n / MOVES.length * 100).toFixed(1)}%">${n}</span>`).join('')}</div>
  </div></main>`;
  Icons.hydrate($('#app'));
}
/* play: a quiet move every --motion-slow + --motion-base; stop at a critical one */
function play() {
  clearLater();
  const step = () => { if (S.n >= MOVES.length) return; S.n++; render(); if (!STOPS.includes(S.n)) later(step, ms('--motion-slow') + ms('--motion-base')); };
  step();
}
function replay() { clearLater(); S.n = 0; render(); settle(); later(play, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === ' ') { e.preventDefault(); play(); }
  if (e.key === 'ArrowRight') { clearLater(); S.n = Math.min(MOVES.length, S.n + 1); render(); }
  if (e.key === 'ArrowLeft') { clearLater(); S.n = Math.max(0, S.n - 1); render(); }
});
replay();
</script>
</body>
</html>
