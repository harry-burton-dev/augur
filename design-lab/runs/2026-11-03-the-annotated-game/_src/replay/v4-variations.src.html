<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Replay V4 · Variations</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Replay V4: the main line, and at the moments that turned, the lines not played that were on the record at the time ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.main-line{min-height:0;padding:var(--space-3);display:flex;flex-direction:column;gap:2px}
.mv .vb{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-mark-info);border:1px solid color-mix(in srgb,var(--info) 40%,transparent);border-radius:var(--radius-pill);padding:2px var(--space-1)}
.tree{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.at{display:flex;align-items:baseline;gap:var(--space-3)}
.at .n{font:300 var(--type-title-s)/1 var(--font-mono);color:var(--ink-muted)}
.at .t{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.branches{position:relative;display:grid;gap:var(--space-3);padding-left:var(--space-6)}
.branches::before{content:"";position:absolute;left:var(--space-4);top:0;bottom:var(--space-6);width:1px;background:var(--hairline-strong)}
.br{position:relative;padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-inset);display:grid;gap:var(--space-1);transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.br::before{content:"";position:absolute;left:calc(var(--space-5) * -1 + 1px);top:var(--space-5);width:calc(var(--space-5) - 2px);height:1px;background:var(--hairline-strong)}
.br.played{border-color:var(--hairline-strong)}
.br.played .s::after{content:"  · played";font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.br.alt{border-style:dashed;border-color:color-mix(in srgb,var(--info) 50%,transparent)}
.br .s{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.br .t{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.br .src{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted)}
.br .est{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);font-style:italic}
.br .elsewhere{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--x-proposed-mark-good)}
.closed .br.alt{opacity:0;transform:translateX(calc(var(--space-4) * -1))}
.foot{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.tree{padding:var(--space-3) var(--space-4);gap:var(--space-2)}.br{padding:var(--space-2) var(--space-3)}.main-line .mv{padding:2px var(--space-2)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Replay · V4</b> variations: at the moments that turned, the lines not played, only from the record at the time; one was played elsewhere and kept · Informator variations, opening theory</div>
<script>
/*@DATA@*/
/*@LIB@*/
const BRANCHED = MOVES.filter(m => m.opts).map(m => m.n);
const S = { n: 6, open: false };
/* a line not played: what the records can say about it, and what only a reviewer can */
const EST = {
  6: { 1: { est: 'Reviewer’s estimate: inspections stay with Kestrel to March 2027 at £186; notice goes in December once both fitters are in; nothing overdue.', game: 'R-03' }, 2: { est: 'Reviewer’s estimate: the same hiring trouble, three months later. Buys time, not an answer.' } },
  11: { 1: { est: 'Reviewer’s estimate: the meeting sees it in August, before Kestrel stops on 1 September.' }, 2: { est: 'Reviewer’s estimate: the September meeting gets a reason to test.' } },
  13: { 1: { est: 'On the record: £210 a van for the overdue vans. About £1,500 to the end of the trial.' }, 2: { est: 'Reviewer’s estimate: reversal two months earlier, with Kestrel still willing to quote.' } }
};
function render() {
  const m = MV(S.n), G = n => DATA.book.games.find(g => g.id === n);
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'Variations'], [['← →', 'moments with lines'], ['T', 'sources', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">Variations</h1><p class="lede">An annotated game shows the moves that could have been played. Here only lines that were <b class="lite">on the record at the time</b> count: a clause, a quote in a pack, a choice the item offered. The records can’t play a line out, so what follows one is a reviewer’s estimate, and says so.</p></div>
    <section class="main-line pane scroll" aria-label="Main line">${MOVES.map(x => moveRow(x, { sel: S.n }).replace('</span></button>', '</span>' + (BRANCHED.includes(x.n) ? `<span class="vb">${x.opts.length - 1} lines</span>` : '<span></span>') + '</button>')).join('')}</section>
    <section class="tree pane ${S.open ? '' : 'closed'}" aria-live="polite">
      <div class="at"><span class="n">${m.n}.</span><span class="t">${m.san}</span>${ANN(m.n).map(a => gl(a.g, 'big')).join('')}</div>
      <p class="small muted">${dt(m.on)} · ${m.side === 'world' ? 'the world' : P(m.by).name}</p>
      ${m.opts ? `<div class="branches">${m.opts.map((o, i) => { const e = (EST[m.n] || {})[i]; const g = e && e.game ? G(e.game) : null; return `<div class="br ${o.played ? 'played' : 'alt'}" style="transition-delay:calc(var(--motion-instant) * ${i})">
          <p class="s">(${m.n}. ${o.san})</p>${o.text ? `<p class="t">${o.text}</p>` : ''}${o.from ? `<p class="src">${I('file-text', 11)} ${o.from}</p>` : ''}
          ${e ? `<p class="est">${e.est}</p>` : ''}${g ? `<p class="elsewhere">${I('book-open', 14)} Played in ${g.id}, ${g.unit}, ${g.year}: ${DATA.results[g.result].toLowerCase()}. “${g.note}”</p>` : ''}</div>`; }).join('')}</div>`
      : `<p class="meta">No lines were on the record at this move. ${BRANCHED.length} moves have them: ${BRANCHED.join(', ')}.</p>`}
      <p class="foot">${I('info', 12)} Lines a reviewer thinks of afterwards are allowed, and marked “not on the record”. They teach, but they don’t count against the people who played the move.</p>
    </section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('.mv').forEach(b => b.onclick = () => { clearLater(); S.n = +b.dataset.n; S.open = true; render(); });
}
function replay() { clearLater(); S.n = 6; S.open = false; render(); settle(); later(() => { S.open = true; $('.tree').classList.remove('closed'); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const i = BRANCHED.indexOf(S.n);
  if (e.key === 'ArrowRight') { clearLater(); S.n = BRANCHED[Math.min(BRANCHED.length - 1, i + 1)]; S.open = true; render(); }
  if (e.key === 'ArrowLeft') { clearLater(); S.n = BRANCHED[Math.max(0, i - 1)]; S.open = true; render(); }
});
replay();
</script>
</body>
</html>
