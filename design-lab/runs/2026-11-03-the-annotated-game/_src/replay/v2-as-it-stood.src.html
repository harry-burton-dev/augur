<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Replay V2 · As it stood</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Replay V2: a blind replay. The future is the far plane, racked out of focus; hindsight only on request, on its own wash ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.moves{min-height:0;padding:var(--space-3);display:flex;flex-direction:column;gap:2px}
.mv{transition:filter var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.fold{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);border-top:1px dashed var(--hairline-strong);margin:var(--space-1) 0}
.now{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.now .d{font:300 var(--type-title-s)/var(--leading-title-s) var(--font-mono);color:var(--light)}
.now .san{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4)}
.known li,.unknown li{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);padding:var(--space-1) 0}
.unknown li{color:var(--ink-muted)}
.unknown .blank{display:inline-block;width:5em;height:.9em;vertical-align:-1px;background:var(--x-proposed-stale);border:1px solid var(--hairline);border-radius:2px}
.mark{display:grid;grid-template-columns:3em minmax(0,1fr);gap:var(--space-3);align-items:baseline;font-size:var(--type-meta);line-height:var(--leading-meta)}
.mark .by{font-size:var(--type-small);color:var(--ink-muted)}
.ask{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.hind{transition:opacity var(--motion-calm) var(--ease-out)}
.foot{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.now{padding:var(--space-3) var(--space-4);gap:var(--space-2)}.now .d{font-size:var(--type-heading);line-height:var(--leading-heading)}.now .san{font-size:var(--type-lead);line-height:var(--leading-lead)}.moves .mv{padding:2px var(--space-2)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Replay · V2</b> as it stood: the moves still to come are out of focus, and hindsight comes only when asked, labelled · outcome bias (Baron and Hershey), “resulting” (Duke), rack focus</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { n: 5, hind: false };
/* the questions still open on a date, worded from the lines and assumptions, never from what happened */
function openQs(at) {
  const qs = [];
  if (!le('2026-08-01', at)) qs.push(['Will two fitters be in post by 1 August?', 'answered on 1 Aug']);
  if (!le('2026-09-01', at)) qs.push(['How will inspections run once Kestrel stops?', 'answered from 1 Sep']);
  if (!le('2026-10-06', at)) qs.push(['Will the overdue count stay under 4?', 'answered on 6 Oct']);
  if (!le('2026-10-31', at)) qs.push(['What will our own inspections really cost?', 'known month by month from Jul']);
  return qs;
}
function render() {
  const m = MV(S.n), at = m.on, p = posAt(at);
  const known = [...recordAt(at).slice(-3).map(r => r.w), ...DATA.lines.filter(L => L.kind !== 'aim').map(L => { const l = p.lines.find(x => x.id === L.id); return `${L.kind === 'max' ? l.v + ' vans overdue' : l.v + ' fitters in post'} (line: ${L.kind === 'max' ? 'more than ' + L.at : L.need + ' by ' + dt(L.by, 'short')})`; })];
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'Replay as it stood'], [['→', 'next move'], ['H', 'hindsight', 'h-h'], ['R', 'replay']], { as: at }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">As it stood</h1><p class="lede">Judge the choice, not the result. The moves still to come are out of focus until you reach them, so a mark is made on what was known that day. Hindsight is there when you ask, labelled, never mixed in.</p></div>
    <section class="moves pane scroll" aria-label="Moves">${MOVES.map(x => (x.n === S.n + 1 ? `<div class="fold">${I('eye-off', 12)} not known on ${dt(at, 'short')}</div>` : '') + moveRow(x, { sel: S.n, cls: x.n > S.n ? 'future' : '', marks: x.n <= S.n })).join('')}</section>
    <section class="now pane" aria-live="polite">
      <div><span class="d">${dt(at)}</span> <span class="lab">move ${m.n} · ${m.side === 'world' ? 'the world' : first(m.by)}</span></div>
      <p class="san">${m.san} ${m.sign ? gl(m.sign, 'big') : ''}</p>
      <div class="cols">
        <ul class="known"><li class="lab" style="display:block">Known that day</li>${known.map(k => `<li>${I('check', 14)}<span>${k}</span></li>`).join('')}</ul>
        <ul class="unknown"><li class="lab" style="display:block">Not known yet</li>${openQs(at).map(([q, w]) => `<li>${I('circle-help', 14)}<span>${q} <span class="blank" title="${w}"></span></span></li>`).join('') || '<li><span></span><span>Nothing: every question this decision raised has an answer.</span></li>'}</ul>
      </div>
      ${ANN(m.n).map(a => `<div class="mark">${gl(a.g, 'big')}<span>${a.line || ''}<br><span class="by">${P(a.by).name}${a.self ? ', own move' : ''}</span></span></div>`).join('')}
      ${DATA.hindsight[m.n] ? (S.hind ? `<p class="hind"><span class="hl">${I('history', 12)} Known later</span>${DATA.hindsight[m.n]}</p>` : `<div class="ask"><button class="btn sm" id="hb">${I('history', 14)} Show what came of it</button><span class="small muted">Mark first. Hindsight is kept apart so it can’t make a choice look worse than it was.</span></div>`) : ''}
      <p class="foot">${posGl(p.s)} the records’ view on this date: ${p.w.toLowerCase()}. It is worked out as at ${dt(at, 'short')} too, so it never uses what came later.</p>
    </section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $('#h-h')?.classList.toggle('on', S.hind);
  $('#hb') && ($('#hb').onclick = () => { S.hind = true; render(); });
  $$('.mv').forEach(b => b.onclick = () => { clearLater(); S.n = +b.dataset.n; S.hind = false; render(); });
}
function replay() { clearLater(); S.n = 5; S.hind = false; render(); settle(); later(() => { S.n = 6; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const k = e.key;
  if (k === 'ArrowRight') { clearLater(); S.n = Math.min(MOVES.length, S.n + 1); S.hind = false; render(); }
  if (k === 'ArrowLeft') { clearLater(); S.n = Math.max(1, S.n - 1); S.hind = false; render(); }
  if (k.toLowerCase() === 'h') { S.hind = !S.hind; render(); }
});
replay();
</script>
</body>
</html>
