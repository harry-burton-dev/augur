<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Replay V1 · The analysis board</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Replay V1: an analysis board. The position as at the move on the left, the score sheet on the right, the curve below ---- */
.wrap{height:100%;display:grid;grid-template-columns:var(--space-5) minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:var(--space-3) var(--space-4)}
.ebcol{display:flex;flex-direction:column;align-items:center;gap:var(--space-2)}
.ebcol .eb{flex:1;width:100%}
.board{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.bh{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap}
.bh .d{font:300 var(--type-heading)/var(--leading-heading) var(--font-mono);color:var(--light);white-space:nowrap}
.bh .pw{margin-left:auto;display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);color:var(--light)}
.grid2{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-3) var(--space-5);align-content:start}
.sq{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 6em;gap:var(--space-1) var(--space-3);align-items:center;font-size:var(--type-small);line-height:var(--leading-small)}
.row .v{grid-column:1;color:var(--ink-muted);font-family:var(--font-mono)}
.row .eb{grid-row:1 / 3;grid-column:2}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline;font-size:var(--type-small);line-height:var(--leading-small)}
.act .st{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.act .st.late{color:var(--x-proposed-warn)}
.act .st.done{color:var(--x-proposed-lit)}
.rec{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:var(--space-1) var(--space-2)}
.rec .d{font-family:var(--font-mono);color:var(--ink-muted)}
.rec .new{color:var(--light)}
.this{margin-top:auto;padding:var(--space-3) var(--space-4);display:grid;gap:var(--space-2)}
.this .t{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.this .an{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.this .an .by{color:var(--ink-muted)}
.sheet{min-height:0;padding:var(--space-3);display:flex;flex-direction:column;gap:2px}
.sheet .eyebrow{padding:var(--space-1) var(--space-2) var(--space-2)}
.cvp{grid-column:1 / -1;padding:var(--space-2) var(--space-4)}
@media (max-width:1400px){.board{padding:var(--space-3) var(--space-4)}.grid2{gap:var(--space-2) var(--space-4)}.this{padding:var(--space-2) var(--space-3)}.sheet .mv{padding:2px var(--space-2)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Replay · V1</b> the analysis board: step through a decision; the board shows only what stood on that date · open-source analysis boards, Kasparov’s replayed games</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { n: 5 };
function render() {
  const m = MV(S.n), at = m.on, p = posAt(at);
  $('#app').innerHTML = topHTML(['Mandate', 'Decisions', DEC.id, 'Replay'], [['← →', 'move'], ['Home End', 'start, end'], ['T', 'numbers', 'h-t'], ['R', 'replay']], { as: at }) +
  `<main class="main"><div class="wrap">
    <div class="ebcol">${posGl(p.s)}${evalBar(p.h, { blind: !!posMark(m.n) })}</div>
    <section class="board pane" aria-live="polite">
      <div class="bh"><span class="d">${dt(at)}</span><span class="lab">after move ${m.n} of ${MOVES.length}</span><span class="pw">${posGl(p.s)} ${p.w}</span></div>
      <div class="grid2">
        <div class="sq"><p class="eyebrow">Its lines, as at this date</p>${DATA.lines.map(L => { const l = p.lines.find(x => x.id === L.id); return `<div class="row"><span>${L.text}</span>${evalBar(l.h, { flat: true })}<span class="v">${L.kind === 'aim' ? '£' + l.v + ' a van' : l.v + (L.kind === 'max' ? ' overdue' : ' in post')}${l.crossed ? ' · crossed' : ''}</span></div>`; }).join('')}</div>
        <div class="sq"><p class="eyebrow">Its actions</p>${DATA.actions.map(a => { const s = actionAt(a, at); return s ? `<div class="act">${face(a.owner, 'sm')}<span>${a.text}${s.moved ? ` <span class="muted">· date moved ${s.moved}×</span>` : ''}</span><span class="st ${s.s}">${s.w}</span></div>` : ''; }).join('') || '<p class="small muted">None yet: the decision isn’t made.</p>'}</div>
        <div class="sq" style="grid-column:1 / -1"><p class="eyebrow">On the record by this date</p><div class="rec">${recordAt(at).slice(-4).map(r => `<span class="d">${dt(r.on, 'short')}</span><span class="${r.on === at ? 'new' : ''}">${r.w}</span>`).join('')}</div></div>
      </div>
      <div class="this box ${ANN(m.n).some(a => a.crit) ? 'warn' : ''}"><p class="t">${m.n}. ${m.san} ${m.sign ? gl(m.sign) : ''}</p><p class="small">${m.text}${m.clock ? ' <span class="muted">' + gl('⊕') + ' ' + m.clock + '</span>' : ''}</p>
        ${ANN(m.n).map(a => `<div class="an">${gl(a.g)}<span>${a.line || '<span class="muted">No line. A mark on its own says enough here.</span>'} <span class="by">· ${P(a.by).name}${a.self ? ', own move' : ''}</span></span></div>`).join('') || (m.side === 'world' ? '<p class="small muted">The world’s move. Not marked.</p>' : '<p class="small muted">Unmarked.</p>')}</div>
    </section>
    <section class="sheet pane scroll" aria-label="Moves"><p class="eyebrow">The moves</p>${MOVES.map(x => moveRow(x, { sel: S.n, pos: true })).join('')}</section>
    <div class="cvp pane" id="cvp"></div>
  </div></main>`;
  Icons.hydrate($('#app'));
  $('#cvp').innerHTML = curve({ w: $('#cvp').clientWidth - 32, h: Math.max(48, Math.min(80, innerHeight * .08)), sel: S.n });
  $$('.mv').forEach(b => b.onclick = () => { clearLater(); S.n = +b.dataset.n; render(); });
  $('.mv.sel')?.scrollIntoView({ block: 'nearest' });
}
function replay() { clearLater(); S.n = 5; render(); settle(); later(() => { S.n = 6; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const k = e.key; if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(k)) return;
  clearLater(); S.n = k === 'Home' ? 1 : k === 'End' ? MOVES.length : Math.max(1, Math.min(MOVES.length, S.n + (k === 'ArrowRight' ? 1 : -1))); render();
});
addEventListener('resize', render);
replay();
</script>
</body>
</html>
