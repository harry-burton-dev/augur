<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Replay V5 · Move and reply</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Replay V5: the game in turns. Our moves on the left, the world's reply on the right, the position after each turn ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--space-3)}
.head{display:grid;grid-template-columns:4em minmax(0,1fr) minmax(0,1fr) 9em;gap:var(--space-4);padding:0 var(--space-4)}
.turns{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.turn{display:grid;grid-template-columns:4em minmax(0,1fr) minmax(0,1fr) 9em;gap:var(--space-4);align-items:start;padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-pane);transition:border-color var(--motion-calm) var(--ease-out),background var(--motion-calm) var(--ease-out)}
.turn.crit{border-color:var(--hairline-strong)}
.lit .turn.crit{border-color:var(--x-proposed-warn);background:color-mix(in srgb,var(--warning) 5%,var(--surface-pane))}
.turn .tn{font:300 var(--type-heading)/1 var(--font-mono);color:var(--ink-muted)}
.turn .tn small{display:block;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.side{display:grid;gap:var(--space-1)}
.m{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);align-items:baseline}
.m .n{font-family:var(--font-mono);color:var(--ink-muted);text-align:right}
.m .s{color:var(--light)}
.world .m .s{color:var(--ink);font-style:italic}
.world .none{font-size:var(--type-small);color:var(--ink-muted)}
.after{display:flex;align-items:center;gap:var(--space-2);justify-content:flex-end;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.after .eb{height:var(--space-6);min-height:0}
.q{grid-column:2 / 4;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-top:1px dashed var(--hairline);padding-top:var(--space-1);display:none}
.lit .turn.crit .q{display:block}
.foot{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.turn{padding:var(--space-2) var(--space-3)}.turns{gap:var(--space-1)}.turn .tn{font-size:var(--type-lead)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Replay · V5</b> move and reply: the decision as turns, ours and the world’s; only ours are marked, and each turn asks what our move gave the world to work with · game notation in pairs, after-action review</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* turns: our moves until the world next moves, then the world's reply */
const TURNS = []; let cur = { us: [], world: [] };
MOVES.forEach(m => { if (m.side === 'us') { if (cur.world.length) { TURNS.push(cur); cur = { us: [], world: [] }; } cur.us.push(m); } else cur.world.push(m); });
TURNS.push(cur);
const Q = { 1: 'The notice (6) left the world a free move: if hiring failed, nothing could take Kestrel’s place. It failed.', 3: 'Noting the line without a reason left the next reply, Kestrel’s exit, unanswered for a week.', 4: 'Keeping the trial with one fitter asked the world to stay quiet for eight weeks. It didn’t.' };
const S = { lit: false };
function render() {
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'Move and reply'], [['T', 'how turns are cut', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap ${S.lit ? 'lit' : ''}">
    <div class="intro"><h1 class="h1">Move and reply</h1><p class="lede">A game has two sides. So does a decision: what we did, and what the world did next. Only our moves are marked. The question at each turn is what our move left the world free to do.</p></div>
    <div class="head lab"><span>Turn</span><span>Us · ${DATA.body.short}</span><span>The world’s reply</span><span style="text-align:right">The records, after</span></div>
    <section class="turns scroll">${TURNS.map((t, i) => { const last = [...t.us, ...t.world].pop(), p = posAt(last.on), crit = !!Q[i + 1];
      return `<div class="turn dep ${crit ? 'crit' : ''}" style="--i:${i}"><span class="tn">${i + 1}<small>${dt(t.us[0].on, 'short')}</small></span>
        <div class="side us">${t.us.map(m => `<div class="m"><span class="n">${m.n}.</span><span class="s">${m.san}${m.door ? ' ' + I('door-closed', 12) : ''}</span><span>${ANN(m.n).filter(a => !a.self).map(a => gl(a.g)).join('')}</span></div>`).join('')}</div>
        <div class="side world">${t.world.length ? t.world.map(m => `<div class="m"><span class="n">${m.n}.</span><span class="s">${m.san}</span><span></span></div>`).join('') : `<p class="none">${i === TURNS.length - 1 ? 'Game over: ' + DATA.results[DEC.result].toLowerCase() + ' by ' + DEC.reversedBy + '.' : 'No reply.'}</p>`}</div>
        <div class="after">${posGl(p.s)} <span>${p.w}</span>${evalBar(p.h)}</div>
        ${crit ? `<p class="q">${I('corner-down-right', 12)} ${Q[i + 1]}</p>` : ''}</div>`; }).join('')}</section>
    <p class="foot">${TURNS.length} turns. The world’s moves are never marked: nobody chose them. A mark on our move is about what it left open, judged with what was known then. <span class="tk">turn := our consecutive moves + the world moves that follow</span></p>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.lit = false; render(); settle(); later(() => { S.lit = true; $('.wrap').classList.add('lit'); }, MOMENT()); }
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
replay();
</script>
</body>
</html>
