<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Two voices V2 · Parallel text</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Two voices V2: the same game told twice, line for line: the records' account by template, the reviewer's in his words ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3)}
.heads{display:grid;grid-template-columns:3em minmax(0,1fr) var(--space-5) minmax(0,1fr);gap:var(--space-3);padding:0 var(--space-4)}
.heads .h{display:flex;align-items:baseline;gap:var(--space-3)}
.heads .h b{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.heads .h span{font-size:var(--type-small);color:var(--ink-muted)}
.text{min-height:0;padding:var(--space-3) var(--space-4)}
.row{display:grid;grid-template-columns:3em minmax(0,1fr) var(--space-5) minmax(0,1fr);gap:var(--space-3);padding:var(--space-2) 0;border-top:1px solid var(--hairline);align-items:start;font-size:var(--type-small);line-height:var(--leading-small)}
.row .n{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);text-align:right}
.row .rec{color:var(--ink)}
.row .rec .num{font-family:var(--font-mono);color:var(--light)}
.row .gut{display:flex;justify-content:center;color:var(--x-proposed-warn)}
.row .rev{color:var(--ink)}
.row .rev.none{color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.row.split{background:linear-gradient(90deg,transparent,var(--x-proposed-warn-wash) 45%,var(--x-proposed-warn-wash) 55%,transparent)}
.row .mk{font-size:var(--type-small)}
.row.dim{opacity:var(--x-proposed-quiet)}
.lit .row.dim{opacity:.35}
.lit .row.split{outline:1px solid color-mix(in srgb,var(--warning) 25%,transparent);outline-offset:-1px}
@media (max-width:1400px){.row{padding:var(--space-1) 0}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Two voices · V2</b> parallel text: the records’ account built by template from the numbers, the reviewer’s in his own words, aligned move for move · bilingual editions, dual-annotated games, pencil and ink</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* the records' account: sentences built by template from the lines, never written by a model */
function recSentence(m) {
  const p = posOfMove(m.n), prev = m.n > 1 ? posOfMove(m.n - 1) : p;
  const parts = [];
  if (m.door) parts.push('A step recorded as one-way.');
  p.lines.forEach(l => { const L = DATA.lines.find(x => x.id === l.id); const q = prev.lines.find(x => x.id === l.id);
    if (q && q.v !== l.v) parts.push(L.kind === 'max' ? `Overdue <span class="num">${q.v} → ${l.v}</span>.` : L.kind === 'by' ? `Fitters in post <span class="num">${q.v} → ${l.v}</span>.` : `Cost a van <span class="num">£${q.v} → £${l.v}</span>.`);
    if (l.crossed && !(q && q.crossed)) parts.push(`Line crossed: ${L.text.replace('revisit if ', '')}.`); });
  if (p.rank !== prev.rank) parts.push(`Position ${posGl(prev.s)} → ${posGl(p.s)}.`);
  if (!parts.length) parts.push(`No change on its lines. ${posGl(p.s)}`);
  return parts.join(' ');
}
const SPLIT = [4, 6, 9, 13];
const S = { lit: false };
function render() {
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'Parallel text'], [['R', 'replay']]) +
  `<main class="main"><div class="wrap ${S.lit ? 'lit' : ''}">
    <div class="intro"><h1 class="h1">Parallel text</h1><p class="lede">The same seventeen moves told twice. On the left, what the records can say, sentence by sentence from the numbers. On the right, what the reviewer said. Where one is silent and the other speaks, the gutter marks it.</p></div>
    <div class="heads"><span></span><p class="h"><b>The records</b><span>by template, from ${DATA.lines.length} lines and the one-way steps</span></p><span></span><p class="h"><b>The reviewer</b><span>${P(DATA.review.facilitator).name}, with the movers’ own marks</span></p></div>
    <section class="text pane scroll">${MOVES.map(m => { const a = ANN(m.n), sp = SPLIT.includes(m.n), quiet = !a.length && !recSentence(m).includes('→') && !m.door;
      return `<div class="row ${sp ? 'split' : ''} ${quiet ? 'dim' : ''}"><span class="n">${m.n}.</span><span class="rec">${m.side === 'world' ? '<i>' + m.san + '.</i> ' : m.san + '. '}${recSentence(m)}</span><span class="gut">${sp ? I('split', 14) : ''}</span>
        <span class="rev ${a.length ? '' : 'none'}">${a.length ? a.map(x => `<span class="mk">${gl(x.g, x.self ? 'second' : '')}</span> ${x.line ? x.line : ''}${x.self ? ` <span class="muted">(${first(x.by)}, own move)</span>` : ''}`).join('<br>') : m.side === 'world' ? 'Not marked: the world’s move.' : '—'}</span></div>`; }).join('')}</section>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.lit = false; render(); settle(); later(() => { S.lit = true; $('.wrap').classList.add('lit'); }, MOMENT()); }
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
replay();
</script>
</body>
</html>
