<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Two voices V6 · Where they differ, ask</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Two voices V6: a disagreement becomes one question to the person who can answer it; the answer becomes theory in the book ---- */
.wrap{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.st{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);transition:opacity var(--motion-calm) var(--ease-out),border-color var(--motion-calm) var(--ease-out)}
.st.wait{opacity:var(--x-proposed-quiet)}
.st.now{border-color:var(--x-proposed-lit)}
.st .k{display:flex;align-items:center;gap:var(--space-2)}
.st h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.st .t{font-size:var(--type-small);line-height:var(--leading-small)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-3)}
.vs .box{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);align-content:start}
.q{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.to{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.ans{padding:var(--space-3);border-radius:var(--radius-inset);border:1px solid var(--hairline-strong);font-size:var(--type-meta);line-height:var(--leading-meta)}
.theory{display:grid;gap:var(--space-2)}
.theory .code{font:400 var(--type-small)/1 var(--font-mono);color:var(--light)}
.theory .rule{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.theory .src{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.queue{grid-column:1 / -1;display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-2) var(--space-4)}
.queue .chip{display:inline-flex;align-items:center;gap:var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3);color:var(--ink)}
@media (max-width:1400px){.st{padding:var(--space-3) var(--space-4);gap:var(--space-2)}.q{font-size:var(--type-lead);line-height:var(--leading-lead)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Two voices · V6</b> where they differ, ask: a disagreement on move 8 becomes one question to the chair; his answer becomes a line of theory in the book under C3.2 · opening theory, question and answer, after-action review</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { step: 1 };
const m = MV(8);
const QUEUE = [[4, 'p3', 'Should an assumption that a decision rests on get a test date at the table?'], [6, 'p4', 'When a one-way step comes due before what it depends on, who moves which date?'], [13, 'p5', 'Is one fitter for 18 vans a number the meeting can see before it keeps a trial going?']];
function render() {
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'Open questions'], [['Space', 'next step'], ['R', 'replay']], { as: DATA.review.held }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">Where they differ, ask</h1><p class="lede">A disagreement between the voices is a question nobody has asked yet. The review turns each one into a single question to the one person who can answer it. The answer, once given, becomes theory in the book, the way opening theory grows from games.</p></div>
    <section class="st pane ${S.step === 1 ? 'now' : ''}"><p class="k">${I('split', 16)} <span class="lab">1 · They differ</span></p><h2>${m.n}. ${m.san}</h2>
      <div class="vs"><div class="box"><p class="lab">The records</p><p>${posGl(posOfMove(8).s, 'big')}</p><p class="muted">The line said 1 August; on 23 June it still had room.</p></div><div class="box"><p class="lab">The reviewer</p><p>${gl(mainMark(8).g, 'big')}</p><p class="muted">${mainMark(8).line}</p></div></div>
      <p class="t muted">Reason: the line was set wrong. The records read it faithfully; the plan had moved.</p></section>
    <section class="st pane ${S.step === 2 ? 'now' : S.step < 2 ? 'wait' : ''}"><p class="k">${I('circle-help', 16)} <span class="lab">2 · One question, one person</span></p>
      <p class="q">When an action’s date moves, should the line that depends on it move too?</p>
      <p class="to">${face('p1', 'sm')} to ${P('p1').name}, who set both · open until answered, no chasing</p>
      ${S.step >= 2 ? `<div class="ans fade">${I('message-square', 14)} “Yes, or we say at the table why not. I moved the date to be kind to Jo and forgot the line was the safety net.” <span class="small muted">· ${first('p1')}, ${dt('2026-11-27', 'short')}</span></div>` : `<p class="small muted">Not answered yet.</p>`}</section>
    <section class="st pane ${S.step === 3 ? 'now' : 'wait'}"><p class="k">${I('book-open', 16)} <span class="lab">3 · Theory, in the book</span></p>
      ${S.step >= 3 ? `<div class="theory fade"><span class="code">${DATA.book.games[0].code} · ${DATA.book.codes['C3.2']}</span><p class="rule">When an action a line depends on moves its date, the line moves with it, or the meeting writes down why not.</p><p class="src">From ${DEC.id}, move ${m.n} (${gl('?!')}), answered by ${P('p1').name}. Shown to anyone drafting a ${DATA.book.games[0].code} decision who moves a date.</p></div>` : `<p class="small muted">Waits for the answer. A disagreement with no answer stays a question in the review; it never becomes a rule by itself.</p>`}</section>
    <div class="queue pane">${I('inbox', 14)} Also asked from this review: ${QUEUE.map(([n, p, q]) => `<span class="chip">${n}. ${face(p, 'sm')} ${q}</span>`).join('')}</div>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.step = 1; render(); settle(); later(() => { S.step = 2; render(); }, MOMENT()); later(() => { S.step = 3; render(); }, MOMENT() + ms('--motion-run')); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key === ' ') { e.preventDefault(); clearLater(); S.step = S.step % 3 + 1; render(); } });
replay();
</script>
</body>
</html>
