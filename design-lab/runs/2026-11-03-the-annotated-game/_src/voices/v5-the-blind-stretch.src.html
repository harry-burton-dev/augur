<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Two voices V5 · The blind stretch</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Two voices V5: a person's ∞ hatches the stretch the records couldn't see; a ghost line shows what they'd have said with the door recorded ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.chart{position:relative;min-height:0;padding:var(--space-4) var(--space-5) var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)}
.cvw{position:relative;flex:1;min-height:0}
.band{position:absolute;top:0;bottom:var(--space-5);background:var(--x-proposed-unseen);border-left:1px dashed var(--hairline-strong);border-right:1px dashed var(--hairline-strong)}
.band .bl{position:absolute;top:var(--space-2);left:var(--space-2);right:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);background:var(--surface-overlay);border-radius:var(--radius-key);padding:var(--space-2)}
.ghost{fill:none;stroke:var(--info);stroke-width:1.5;stroke-dasharray:5 4;transition:stroke-dashoffset var(--motion-still) var(--ease-out)}
.gl-label{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);fill:var(--info)}
.ax{display:flex;justify-content:space-between;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);padding:0 var(--space-2)}
.legend{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:var(--space-2)}
.sw{display:inline-block;width:var(--space-5);height:2px;background:var(--light)}
.sw.g{background:none;border-top:2px dashed var(--info);height:0}
.sw.b{height:var(--space-3);background:var(--x-proposed-unseen);border:1px dashed var(--hairline-strong)}
.need{min-height:0;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.need li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);padding:var(--space-2) 0;border-top:1px solid var(--hairline)}
.need b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.chart{padding:var(--space-3) var(--space-4)}.need{padding:var(--space-3)}.need li{padding:var(--space-1) 0}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Two voices · V5</b> the blind stretch: the reviewer’s ∞ hatches what the records couldn’t see; a ghost line shows what they would have said had the one-way step been recorded · engine horizon, chess “unclear ∞”</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { ghost: false };
const A = MV(6).on, B = MV(10).on;
/* the ways back: what the records could have read had the one-way step and its dependency been recorded */
const door = d => !le(A, d) ? 1 : seriesAt('fitters', d) >= 2 ? 1 : le('2026-09-01', d) ? -0.3 : 0;
function render() {
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'The blind stretch'], [['G', 'ghost line'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">The blind stretch</h1><p class="lede">Engines have a horizon: past it, they can’t see. So do the records. A reviewer’s ${gl('∞')} doesn’t move the records’ line; it hatches the stretch where they couldn’t see what mattered, and asks what AUGUR would need to record to see it next time.</p></div>
    <section class="chart pane"><div class="cvw" id="cvw"></div><div class="ax" id="ax"></div>
      <div class="legend"><span><i class="sw"></i> the records, as at each date</span><span><i class="sw b"></i> ${gl('∞')} ${P(DATA.review.facilitator).name}: the records can’t see this</span><span><i class="sw g"></i> with the one-way step recorded (not real: what it could have read)</span></div></section>
    <aside class="need pane scroll"><p class="eyebrow">To see it next time, record</p><ul>
      <li>${I('door-closed', 16)}<span><b>One-way steps, when taken.</b> The notice, with its way back and what that costs: here, a quick tender or ad hoc visits at £210 a van.</span></li>
      <li>${I('circle-help', 16)}<span><b>Assumptions, with a date to test them.</b> “Two fitters by 30 June” becomes a line from the day it’s said, not only on 1 August.</span></li>
      <li>${I('link', 16)}<span><b>What each step depends on.</b> The notice depended on the hiring. With that link, the records can say “a one-way step was taken before what it depends on” on the day.</span></li></ul>
      <p class="muted">None of these is a model guess. Each is a field someone fills when they act, and the rule reads it.</p></aside>
  </div></main>`;
  Icons.hydrate($('#app'));
  draw();
}
function draw() {
  const box = $('#cvw'), w = box.clientWidth, h = box.clientHeight - 28, o = { w, h, ticks: true };
  const svg = curve(o);
  const pts = []; for (let d = G0; le(d, addDays(G1, 6)); d = addDays(d, 2)) pts.push([d, Math.min(posAt(d).h, door(d))]);
  const Y = v => h / 2 - clamp(v) * (h / 2 - 6);
  const gp = pts.map(([d, v], i) => (i ? 'L' : 'M') + curveX(o, d).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const len = w * 2;
  box.innerHTML = `<div class="band" style="left:${curveX(o, A)}px;width:${curveX(o, B) - curveX(o, A)}px"><span class="bl">${gl('∞')} ${dt(A, 'short')} to ${dt(B, 'short')}. The records read ${posGl(posAt(A).s)} then ${posGl(posAt('2026-06-23').s)}. The way back had already closed.</span></div>` +
    svg.replace('</svg>', `<path d="${gp}" class="ghost" style="stroke-dasharray:5 4;opacity:${S.ghost ? 1 : 0};transition:opacity var(--motion-calm) var(--ease-out)"/><text x="${curveX(o, A) + 6}" y="${Y(0) + 14}" class="gl-label" style="opacity:${S.ghost ? 1 : 0}">= from ${dt(A, 'short')}, had the step been recorded</text></svg>`);
  $('#ax').innerHTML = [5, 6, 7, 8, 9, 10, 11].map(mo => `<span>${dt('2026-' + String(mo).padStart(2, '0'), 'short')}</span>`).join('');
}
function replay() { clearLater(); S.ghost = false; render(); settle(); later(() => { S.ghost = true; draw(); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key.toLowerCase() === 'g') { S.ghost = !S.ghost; draw(); } });
addEventListener('resize', render);
replay();
</script>
</body>
</html>
