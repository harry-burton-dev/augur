<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Two voices V1 · The bar and the marks</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Two voices V1: every move with the records' bar and the people's mark on one row; rows where they pull apart are split ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.tbl{min-height:0;padding:var(--space-3) var(--space-4);display:flex;flex-direction:column}
.hd,.r{display:grid;grid-template-columns:2em minmax(0,1fr) 9em 2.6em 4.2em 2.4em;gap:var(--space-3);align-items:center}
.hd{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);padding:0 var(--space-2) var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.r{padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);transition:background var(--motion-calm) var(--ease-out),box-shadow var(--motion-calm) var(--ease-out)}
.r .n{font-family:var(--font-mono);color:var(--ink-muted);text-align:right}
.r.world .s{font-style:italic;color:var(--ink-muted)}
.r .split{display:inline-flex;color:var(--x-proposed-warn);opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.lit .r.diff{background:var(--x-proposed-warn-wash);box-shadow:inset 2px 0 0 var(--x-proposed-warn)}
.lit .r.diff .split{opacity:1}
.r.sel{outline:1px solid var(--light);outline-offset:-1px}
.r .eb.flat{height:var(--space-2)}
.why{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.why .s{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-3)}
.pair .box{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);align-content:start}
.rule{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:auto}
@media (max-width:1400px){.hd,.r{grid-template-columns:2em minmax(0,1fr) 6em 2.4em 4em 2em;gap:var(--space-2)}.why{padding:var(--space-3) var(--space-4)}.r{padding:1px var(--space-2)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Two voices · V1</b> the bar and the marks: on each row the records’ position and the people’s mark; where one says harm and the other doesn’t, the row splits · analysis-board evaluation columns, Informator</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* they pull apart when a person says harm and the records see none in the next month, or a person says good while the records fall */
function diffAt(n) {
  const m = MV(n), r = mainMark(n); if (!r || m.side === 'world') return null;
  const now = posOfMove(n), later = posAt(addDays(m.on, 30));
  const t = toneOf(r.g), d = later.rank - now.rank;
  if (t === 'bad' && later.rank <= 1) return { k: 'harm', w: `${gl(r.g)} says this made it worse; a month later the records still read on course (${posGl(now.s)} → ${posGl(later.s)}). They can’t see an assumption until it fails.` };
  if (t === 'good' && d >= 2) return { k: 'good', w: `${gl(r.g)} says a good move; the records fall in the month after (${posGl(now.s)} → ${posGl(later.s)}). A good move can’t rescue a position already lost elsewhere.` };
  if (posMark(n)) return { k: 'blind', w: `${gl('∞')}: a person says the records can’t see what matters here: the one-way step closed the way back.` };
  const rm = reviewMarks(n); if (rm.length > 1 && toneOf(rm[0].g) !== toneOf(rm[1].g)) return { k: 'people', w: `Two reviewers: ${gl(rm[0].g)} from ${first(rm[0].by)}, ${gl(rm[1].g)} from ${first(rm[1].by)}. The records sit with neither; they only say where it stood.` };
  return null;
}
const DIFFS = MOVES.map(m => m.n).filter(diffAt);
const S = { lit: false, n: 6 };
function render() {
  const m = MV(S.n), d = diffAt(S.n), r = mainMark(S.n), p = posOfMove(S.n);
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'Two voices'], [['↑ ↓', 'move'], ['T', 'the rule', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap ${S.lit ? 'lit' : ''}">
    <div class="intro"><h1 class="h1">The bar and the marks</h1><p class="lede">One row a move. The records’ bar says where the decision stood after it; the mark says what a person made of the choice. They are different questions, so they will differ. The rows where they pull apart are where a review earns its keep.</p></div>
    <section class="tbl pane scroll"><div class="hd"><span>#</span><span>Move</span><span>The records</span><span></span><span>People</span><span></span></div>
      ${MOVES.map(x => { const rr = mainMark(x.n), pp = posOfMove(x.n); return `<button class="r ${x.side} ${DIFFS.includes(x.n) ? 'diff' : ''} ${S.n === x.n ? 'sel' : ''}" data-n="${x.n}"><span class="n">${x.n}</span><span class="s">${x.san}</span>${evalBar(pp.h, { flat: true, blind: !!posMark(x.n) })}<span>${posGl(pp.s)}</span><span>${ANN(x.n).filter(a => !a.pos).map(a => gl(a.g, a.self ? 'second' : '')).join('')}</span><span class="split">${I('split', 14)}</span></button>`; }).join('')}
    </section>
    <section class="why pane" aria-live="polite"><p class="lab">Move ${m.n} · ${dt(m.on)}</p><p class="s">${m.san}</p>
      <div class="pair"><div class="box"><p class="lab">The records</p><p>${posGl(p.s, 'big')} ${p.w}</p><p class="muted">${p.say} Weakest line: ${DATA.lines.find(L => L.id === p.weakest.id).text}.</p></div>
        <div class="box"><p class="lab">People</p>${ANN(m.n).map(a => `<p>${gl(a.g, 'big')} <span class="muted">${first(a.by)}${a.self ? ', own move' : ''}</span></p><p>${a.line || ''}</p>`).join('') || `<p class="muted">${m.side === 'world' ? 'A world move. Not marked.' : 'Unmarked.'}</p>`}</div></div>
      ${d ? `<div class="box warn small">${I('split', 14)} ${d.w}</div>` : `<p class="small muted">The two voices don’t pull apart here.</p>`}
      <p class="rule">${DIFFS.length} rows split: ${DIFFS.join(', ')}. Nothing is averaged and no row is “resolved”: a split is a question for the reader, not an error.<span class="tk">split := (mark ∈ {?, ??} ∧ rank₊₃₀ ≤ ⩲) ∨ (mark ∈ {!, !!} ∧ Δrank₃₀ ≥ 2) ∨ ∞ ∨ reviewers differ</span></p>
    </section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('.r').forEach(b => b.onclick = () => { S.n = +b.dataset.n; render(); });
}
function replay() { clearLater(); S.lit = false; S.n = 6; render(); settle(); later(() => { S.lit = true; $('.wrap').classList.add('lit'); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.n = Math.max(1, Math.min(MOVES.length, S.n + (e.key === 'ArrowDown' ? 1 : -1))); render(); }
});
replay();
</script>
</body>
</html>
