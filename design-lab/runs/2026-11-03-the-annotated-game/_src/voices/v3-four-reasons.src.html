<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Two voices V3 · Four reasons they differ</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Two voices V3: every disagreement filed under one of four reasons, each with what it teaches AUGUR to record ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.four{min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}
.rs{min-height:0;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);transition:border-color var(--motion-calm) var(--ease-out)}
.rs .ic{display:flex;align-items:center;gap:var(--space-2);color:var(--light)}
.rs h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.rs .def{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.case{padding:var(--space-3);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-inset);display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);opacity:0;transform:translateY(var(--space-1));transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.lit .case{opacity:1;transform:none}
.case .h{display:flex;align-items:baseline;gap:var(--space-2);color:var(--light)}
.case .v{display:flex;gap:var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.case .v .gl{font-size:var(--type-meta)}
.teach{margin-top:auto;padding-top:var(--space-2);border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.teach b{display:block;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-bottom:var(--space-1)}
.foot{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:0 var(--space-2)}
@media (max-width:1400px){.rs{padding:var(--space-3);gap:var(--space-2)}.four{gap:var(--space-3)}.case{padding:var(--space-2)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Two voices · V3</b> four reasons they differ: the records can’t see it, hindsight, the line was set wrong, two people judge differently; each teaches something to record · the reference desk’s five reasons, engine-versus-human commentary</div>
<script>
/*@DATA@*/
/*@LIB@*/
const REASONS = [
  { ic: 'eye-off', t: 'The records can’t see it', def: 'What mattered left no trace in the lines: an assumption nobody tested, a door that closed.', cases: [4, 6], teach: 'Record assumptions and one-way steps when they are made, so the lines can watch them.' },
  { ic: 'history', t: 'Hindsight', def: 'Judged by how it turned out rather than by what was known. The records as at the date are fair; the records now are not.', cases: [13], teach: 'Mark as it stood. Hindsight is shown apart, labelled, after the mark.' },
  { ic: 'ruler', t: 'The line was set wrong', def: 'The records read the line faithfully, but the line no longer matched the plan.', cases: [8], teach: 'When an action’s date moves, ask whether the line it feeds should move too.' },
  { ic: 'users', t: 'Two people judge differently', def: 'Same facts, different weight. Neither is an error; both are signed.', cases: [13], teach: 'Keep both marks. Never average them, never vote.' }
];
const EX = {
  4: 'Records ± for two months. Reviewer ?: nothing tested it.',
  6: 'Records ± before and after. Reviewer ? and ∞: the way back closed.',
  13: { 1: 'As at 8 Sep the records were already ∓, so !? isn’t blind optimism; it is a risk named. Hindsight (overdue 2 → 7) would make it ?.', 3: `${first('p9')} ${'!?'}: a fitter started the next day. ${first('p5')} ?: one fitter can’t inspect 18 vans a month.` },
  8: 'Records ⩲ on 23 Jun: the line still gave until 1 August. Reviewer ?!: the action moved to 31 August and the line didn’t.'
};
const S = { lit: false };
function render() {
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'Where they differ'], [['R', 'replay']]) +
  `<main class="main"><div class="wrap ${S.lit ? 'lit' : ''}">
    <div class="intro"><h1 class="h1">Four reasons they differ</h1><p class="lede">When the records and a person disagree, one of four things is true. Naming which is the useful part: each reason teaches AUGUR, or the next reviewer, something different.</p></div>
    <div class="four">${REASONS.map((r, i) => `<section class="rs pane"><p class="ic">${I(r.ic, 20)} <span class="lab">${i + 1} of 4</span></p><h2>${r.t}</h2><p class="def">${r.def}</p>
      ${r.cases.map((n, j) => { const m = MV(n), ex = typeof EX[n] === 'string' ? EX[n] : EX[n][i]; return `<div class="case" style="transition-delay:calc(var(--motion-instant) * ${i * 2 + j})"><p class="h"><span class="mono">${n}.</span> ${m.san}</p><p class="v">records ${posGl(posOfMove(n).s)} <span>people</span> ${ANN(n).map(a => gl(a.g, a.self ? 'second' : '')).join('')}</p><p>${ex}</p></div>`; }).join('')}
      <p class="teach"><b>What it teaches</b>${r.teach}</p></section>`).join('')}</div>
    <p class="foot">Move 13 appears twice, because two things are true of it. Moves where the voices agree (10, 11, 15, 16, 17) need no filing: the records saw the trouble and the reviewer marked the answer to it.</p>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.lit = false; render(); settle(); later(() => { S.lit = true; $('.wrap').classList.add('lit'); }, MOMENT()); }
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
replay();
</script>
</body>
</html>
