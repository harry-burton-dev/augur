<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Collection V4 · Motifs</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Collection V4: motifs. The patterns that recur across games, each with the games that show it, in pairs that oppose ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.list{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.mo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-pane);text-align:left;width:100%}
.mo .n{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.mo .s{grid-column:1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.mo .c{grid-row:1 / 3;grid-column:2;font:300 var(--type-heading)/1 var(--font-mono);color:var(--ink-muted);align-self:center}
.mo.good .n::before{content:"! ";font-family:var(--font-mono);color:var(--x-proposed-mark-good)}
.mo.bad .n::before{content:"? ";font-family:var(--font-mono);color:var(--x-proposed-mark-bad)}
.mo.sel{border-color:var(--light);background:var(--surface-raised)}
.mo.pair{border-color:var(--hairline-strong);border-style:dashed}
.detail{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4)}
.side h3{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);margin-bottom:var(--space-2)}
.gr{display:grid;grid-template-columns:4em minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline;padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.gr .id{font-family:var(--font-mono);color:var(--light)}
.gr .u{display:block;color:var(--ink-muted)}
.rz{font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;white-space:nowrap}
.rz.kept{color:var(--x-proposed-mark-good)}.rz.amended{color:var(--ink)}.rz.reversed{color:var(--x-proposed-mark-bad)}
.base{padding:var(--space-3) var(--space-4);font-size:var(--type-small);line-height:var(--leading-small)}
.base b{font-weight:400;color:var(--light)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin:0 var(--space-1)}
.dots i{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);border:1px solid var(--ink-muted)}
.dots i.kept{background:var(--x-proposed-mark-good);border-color:var(--x-proposed-mark-good)}
.dots i.reversed{background:var(--x-proposed-mark-bad);border-color:var(--x-proposed-mark-bad)}
@media (max-width:1400px){.mo{padding:var(--space-2) var(--space-3)}.detail{padding:var(--space-3) var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Collection · V4</b> motifs: the patterns that recur across reviewed games, set against their opposites, with how those games ended and how few there are · de Groot’s chunks, tactics trainers, the answer has a base</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = DATA.later.today;
const BK = DATA.book;
const PAIRS = { first: 'depfirst', depfirst: 'first', noted: null, trial: null, cover: null, wake: null };
const S = { mk: 'cover' };
const vis = BK.games.filter(g => !g.restricted);
const withM = mk => vis.filter(g => g.motifs.includes(mk));
function side(mk) {
  const gs = withM(mk), M = BK.motifs[mk];
  return `<div class="side"><h3>${gl(M.tone === 'good' ? '!' : '?')} ${M.name}</h3><p class="small muted">${M.say}</p>
    ${gs.map(g => `<div class="gr"><span class="id">${g.id}</span><span>${g.title}<span class="u">${g.unit}, ${g.year} · ${g.code}</span></span><span class="rz ${g.result}">${DATA.results[g.result]}</span></div>`).join('')}</div>`;
}
const dots = gs => `<span class="dots">${gs.map(g => `<i class="${g.result}" title="${g.id}: ${g.result}"></i>`).join('')}</span>`;
function render() {
  const mk = S.mk, other = PAIRS[mk], a = withM(mk), b = other ? withM(other) : [];
  $('#app').innerHTML = topHTML(['Mandate', 'The book', 'Motifs'], [['↑ ↓', 'motif'], ['R', 'replay']], { as: NOW }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">Motifs</h1><p class="lede">De Groot found that masters don’t calculate more; they recognise more. A motif is a pattern a reviewer named in one game and someone found again in another. Shown with its opposite where it has one, and always with how few games stand behind it.</p></div>
    <section class="list scroll">${Object.entries(BK.motifs).map(([k, M]) => `<button class="mo ${M.tone} ${k === mk ? 'sel' : ''} ${k === other ? 'pair' : ''}" data-k="${k}"><span class="n">${M.name}</span><span class="s">${M.say}</span><span class="c">${withM(k).length}</span></button>`).join('')}</section>
    <section class="detail pane scroll" aria-live="polite">
      <div class="vs">${side(mk)}${other ? side(other) : `<div class="side"><h3 class="muted">No opposite named yet</h3><p class="small muted">When a review names the move that avoids this, it pairs here.</p></div>`}</div>
      <div class="base box"><p>${dots(a)} <b>${a.length} games</b> with “${BK.motifs[mk].name.toLowerCase()}”: ${['kept', 'amended', 'reversed'].map(r => a.filter(g => g.result === r).length + ' ' + r).join(', ')}.${other ? ` ${dots(b)} <b>${b.length}</b> with “${BK.motifs[other].name.toLowerCase()}”: ${['kept', 'amended', 'reversed'].map(r => b.filter(g => g.result === r).length + ' ' + r).join(', ')}.` : ''}</p>
        <p class="muted" style="margin-top:var(--space-1)">${a.length + b.length < 10 ? `Too few to call a rate. Read the games; don’t count them.` : 'Enough to compare, with care: games aren’t a sample.'} A motif is a reviewer’s name for a pattern, not a cause.</p></div>
    </section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('.mo').forEach(b => b.onclick = () => { S.mk = b.dataset.k; render(); });
}
function replay() { clearLater(); S.mk = 'cover'; render(); settle(); later(() => { S.mk = 'first'; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const ks = Object.keys(BK.motifs), i = ks.indexOf(S.mk);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.mk = ks[Math.max(0, Math.min(ks.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; render(); }
});
replay();
</script>
</body>
</html>
