<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Collection V1 · The book</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Collection V1: the book. Situations named and coded, like an opening encyclopaedia; each code a page with its games and its theory ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.tree{min-height:0;padding:var(--space-3);display:flex;flex-direction:column;gap:2px}
.fam{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);padding:var(--space-3) var(--space-2) var(--space-1)}
.node{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline;padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);text-align:left;width:100%}
.node .c{font-family:var(--font-mono);color:var(--light)}
.node.sub{padding-left:var(--space-5)}
.node .k{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.node:hover{background:var(--surface-raised)}
.node.sel{background:var(--surface-raised);box-shadow:inset 2px 0 0 var(--light)}
.node.none{opacity:var(--x-proposed-quiet)}
.page{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.page .code{font:300 var(--type-title)/1 var(--font-mono);color:var(--light)}
.page .nm{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.facets{display:flex;gap:var(--space-2);flex-wrap:wrap}
.facets span{font-size:var(--type-small);line-height:var(--leading-small);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:2px var(--space-3)}
.facets b{font-weight:400;color:var(--ink-muted)}
.main-line{font:400 var(--type-small)/1.9 var(--font-mono);color:var(--ink);padding:var(--space-3) var(--space-4)}
.main-line .bk{color:var(--x-proposed-mark-good)}
.main-line .dev{color:var(--x-proposed-mark-bad)}
.games{display:grid;gap:var(--space-1)}
.g{display:grid;grid-template-columns:4em minmax(0,1fr) 9em 6em;gap:var(--space-3);align-items:baseline;padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.g .id{font-family:var(--font-mono);color:var(--light)}
.g .u{color:var(--ink-muted)}
.res{font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.res.kept{color:var(--x-proposed-mark-good)}.res.amended{color:var(--ink)}.res.reversed{color:var(--x-proposed-mark-bad)}
.g.locked{color:var(--ink-muted)}
.theory{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small)}
.theory li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);padding:var(--space-1) 0}
.page.closed > *:not(.code):not(.nm){opacity:0}
.page > *{transition:opacity var(--motion-calm) var(--ease-out)}
@media (max-width:1400px){.page{padding:var(--space-3) var(--space-4);gap:var(--space-2)}.page .code{font-size:var(--type-title-s)}.g{padding:var(--space-1) 0}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Collection · V1</b> the book: situations coded like openings; each code a page with its defining facts, its book line, its games and its theory · ECO codes, opening encyclopaedias, Informator</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = DATA.later.today;
const BK = DATA.book;
const S = { code: 'C3', open: false };
const gamesOf = c => BK.games.filter(g => g.code === c || g.code.startsWith(c + '.'));
function render() {
  const c = S.code, gs = gamesOf(c), visible = gs.filter(g => !g.restricted);
  $('#app').innerHTML = topHTML(['Mandate', 'The book'], [['↑ ↓', 'code'], ['R', 'replay']], { as: NOW }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">The book</h1><p class="lede">Every agreed review is filed under the situation it was, not the subject it was about. Codes and names are this deployment’s own; a code is a position anyone can recognise before they have played it.</p></div>
    <nav class="tree pane scroll" aria-label="Situations">${Object.entries(BK.families).map(([f, fw]) => `<p class="fam">${f} · ${fw}</p>` + Object.keys(BK.codes).filter(k => k[0] === f).map(k => { const n = gamesOf(k).length; return `<button class="node ${k.includes('.') ? 'sub' : ''} ${k === c ? 'sel' : ''} ${n ? '' : 'none'}" data-c="${k}"><span class="c">${k}</span><span>${BK.codes[k]}</span><span class="k">${n || '—'}</span></button>`; }).join('')).join('')}</nav>
    <section class="page pane scroll ${S.open ? '' : 'closed'}">
      <p class="code">${c}</p><p class="nm">${BK.codes[c]}</p>
      ${c === 'C3.2' || c === 'C3' ? `<div class="facets"><span><b>changes</b> a contract</span><span><b>depends on</b> ${c === 'C3.2' ? 'hiring' : 'staff, kit or nothing new'}</span><span><b>one-way step</b> a notice period</span></div>
      <div class="main-line pane"><span class="lab">Book line, from ${visible.length} games</span><br>1. Paper with cover counted · 2. Trial with an end date · 3. Lines anyone can read · <span class="bk">4. Hire, then 5. give notice</span> <span class="muted">(R-03, R-11)</span><br><span class="dev">4. Notice, then 5. hire ?</span> <span class="muted">(R-07: reversed after 175 days)</span></div>` : ''}
      <p class="lab">Games · ${gs.length}${gs.length !== visible.length ? `, ${gs.length - visible.length} you can’t open` : ''}</p>
      <div class="games">${gs.map(g => g.restricted ? `<div class="g locked"><span class="id">${g.id}</span><span><span class="unseen">${I('lock', 12)} ${g.unit}, ${g.year}</span> ${g.restricted.why} Ask ${P(g.restricted.who).name}.</span><span></span><span></span></div>` : `<div class="g"><span class="id">${g.id}</span><span>${g.title} <span class="u">· ${g.unit}, ${g.year}</span></span><span class="res ${g.result}">${DATA.results[g.result]}${g.days ? ' · ' + g.days + ' days' : ''}</span><span class="u">${g.crit} moments</span></div>`).join('') || '<p class="small muted">No reviewed games under this code yet. The first decision made here will be the first.</p>'}</div>
      ${c === 'C3.2' || c === 'C3' ? `<p class="lab">Theory · answers to questions reviews asked</p><ul class="theory">
        <li>${I('book-open', 14)}<span>When an action a line depends on moves its date, the line moves with it, or the meeting writes down why not. <span class="muted">R-07 move 8, answered by ${P('p1').name}</span></span></li>
        <li>${I('book-open', 14)}<span>Count cover for sickness, leave and vacancies in any in-house costing. <span class="muted">R-07 move 1, R-02, R-03</span></span></li></ul>` : ''}
    </section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('.node').forEach(b => b.onclick = () => { S.code = b.dataset.c; S.open = true; render(); });
}
function replay() { clearLater(); S.code = 'C3'; S.open = false; render(); settle(); later(() => { S.code = 'C3.2'; S.open = true; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const ks = Object.keys(BK.codes), i = ks.indexOf(S.code);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.code = ks[Math.max(0, Math.min(ks.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; S.open = true; render(); }
});
replay();
</script>
</body>
</html>
