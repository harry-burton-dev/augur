<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Collection V3 · The floor’s best games</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Collection V3: an anthology. A short book of the floor's games chosen to teach, each with its turning point drawn and one line on what it teaches ---- */
.wrap{height:100%;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.toc{min-height:0;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-1)}
.toc button{display:grid;grid-template-columns:2em minmax(0,1fr);gap:var(--space-2);padding:var(--space-2);border-radius:var(--radius-key);text-align:left;font-size:var(--type-small);line-height:var(--leading-small)}
.toc button .n{font-family:var(--font-mono);color:var(--ink-muted)}
.toc button.sel{background:var(--surface-raised);box-shadow:inset 2px 0 0 var(--light);color:var(--light)}
.toc .ed{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.chap{min-height:0;padding:var(--space-5) var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
.chap .k{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.chap h2{font-weight:200;font-size:var(--type-title);line-height:var(--leading-title);letter-spacing:var(--tracking-soft);color:var(--light)}
.chap .lede2{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink);max-width:var(--measure-read)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
.gm{padding:var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline-strong);background:var(--surface-inset);display:flex;flex-direction:column;gap:var(--space-2)}
.gm .h{display:flex;align-items:baseline;gap:var(--space-2);flex-wrap:wrap}
.gm .id{font:400 var(--type-small)/1 var(--font-mono);color:var(--light)}
.gm .t{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.gm .u{font-size:var(--type-small);color:var(--ink-muted)}
.gm .kp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);align-items:baseline;font-size:var(--type-small);line-height:var(--leading-small);padding-top:var(--space-2);border-top:1px solid var(--hairline)}
.gm .teach{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.gm .teach b{font-weight:400;color:var(--light)}
.gm .mini{height:var(--space-7)}
.chap.turn{animation:fade var(--motion-calm) var(--ease-out)}
@media (max-width:1400px){.chap{padding:var(--space-4) var(--space-5);gap:var(--space-3)}.chap h2{font-size:var(--type-title-s);line-height:var(--leading-title-s)}.gm{padding:var(--space-3)}.gm .mini{height:var(--space-6)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Collection · V3</b> the floor’s best games: a short anthology chosen to teach, a chapter per lesson, each game with its turning point drawn · Kasparov’s My Great Predecessors, Nimzowitsch’s My System</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = DATA.later.today;
const BK = DATA.book, G = id => BK.games.find(g => g.id === id);
const CH = [
  { t: 'Order of moves', lede: 'The same moves in a different order win or lose. Secure what a decision depends on before the step you can’t undo.', games: [['R-07', 6, '?', 'Notice before hiring. The door closed with nothing behind it.'], ['R-03', 3, '!', 'Four gardeners in post, then notice. Kept for 410 days and counting.']] },
  { t: 'Trials, not bets', lede: 'A change with an end date and a review costs little to undo. Most of our reversals were cheap because of one amendment.', games: [['R-07', 2, '!', 'Ade’s “as a six-month trial” is why reversing cost so little.'], ['R-05', 1, '!', 'Twelve vans first; eighteen only after three months of numbers.']] },
  { t: 'Lines that fire', lede: 'A line anyone can read fires on time. A line noted without a reason fires into silence.', games: [['R-07', 11, '?', 'Crossed on 1 August; looked at on 8 September.'], ['R-05', 2, '?!', 'Data quality line crossed twice, noted twice. Lucky.']] },
  { t: 'Cover', lede: 'Every in-house costing we reviewed that left out sickness and leave came in high.', games: [['R-07', 1, '?!', '£112 planned, £148 by October.'], ['R-02', 2, '?', 'Cleaning re-tendered on a price with no cover; amended in month four.']] }
];
const S = { c: 0 };
function mini(id, mark) {
  if (id !== 'R-07') return `<svg class="mini" width="100%" viewBox="0 0 200 44" preserveAspectRatio="none" role="img" aria-label="Turning point drawn from the game’s own records"><line x1="0" x2="200" y1="22" y2="22" class="cv-mid"/><path d="M0 12 L${mark === '!' ? '200 10' : '120 14 L140 30 L200 32'}" class="cv-ln"/></svg>`;
  return `<div class="mini" data-cv="1"></div>`;
}
function render() {
  const c = CH[S.c] || { t: 'Foreword', lede: `Eight games from ${BK.games.filter(g => !g.restricted).length} reviewed. Each was agreed by the meeting that played it. The marks are theirs; the choice of games and the chapter headings are mine. Read a chapter before you draft a decision of the same kind.`, games: [] };
  $('#app').innerHTML = topHTML(['Mandate', 'The book', 'Best games'], [['← →', 'chapter'], ['R', 'replay']], { as: NOW }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">Our best games</h1><p class="lede">Masters learn from collections someone chose. This is a short one, edited by ${P(DATA.review.facilitator).name} for the ${DATA.floors.department.name} floor: four lessons, two games each, readable in twenty minutes.</p></div>
    <nav class="toc pane" aria-label="Chapters">${CH.map((x, i) => `<button class="${i === S.c ? 'sel' : ''}" data-i="${i}"><span class="n">${i + 1}</span><span>${x.t}</span></button>`).join('')}
      <p class="ed">${I('pen-line', 12)} Edited, not generated. A chapter is added when two reviewed games teach the same thing.</p></nav>
    <article class="chap pane scroll turn"><p class="k">${S.c < 0 ? P(DATA.review.facilitator).name + ', editor' : `Chapter ${S.c + 1} of ${CH.length}`}</p><h2>${c.t}</h2><p class="lede2">${c.lede}</p>
      <div class="games">${c.games.map(([id, mv, mark, teach]) => { const g = G(id); return `<div class="gm"><div class="h"><span class="id">${g.id}</span><span class="t">${g.title}</span></div><p class="u">${g.unit}, ${g.year} · ${DATA.results[g.result].toLowerCase()} · ${g.code}</p>
        ${mini(id, mark)}<div class="kp">${gl(mark, 'big')}<span>Move ${mv}${id === 'R-07' ? ': ' + MV(mv).san : ''}</span></div><p class="teach"><b>${teach}</b></p></div>`; }).join('')}</div>
    </article>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('[data-cv]').forEach(el => { const n = c.games.find(x => x[0] === 'R-07')[1]; el.innerHTML = curve({ w: el.clientWidth, h: el.clientHeight, sel: n, pad: 3 }); });
  $$('.toc button').forEach(b => b.onclick = () => { S.c = +b.dataset.i; render(); });
}
function replay() { clearLater(); S.c = -1; render(); settle(); later(() => { S.c = 0; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowRight') { S.c = Math.min(CH.length - 1, S.c + 1); render(); }
  if (e.key === 'ArrowLeft') { S.c = Math.max(-1, S.c - 1); render(); }
});
replay();
</script>
</body>
</html>
