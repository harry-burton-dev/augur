<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Grammar V4 · The evaluation, worked out</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Grammar V4: how the records' position is worked out on a date, line by line, weakest wins ---- */
.wrap{height:100%;display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) minmax(0,.9fr);grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.barcol{grid-row:2 / 4;display:flex;flex-direction:column;align-items:center;gap:var(--space-2)}
.barcol .eb{flex:1;width:var(--space-5)}
.barcol .gl{font-size:var(--type-heading)}
.work{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.when{display:flex;align-items:baseline;gap:var(--space-3)}
.when .d{font:300 var(--type-heading)/var(--leading-heading) var(--font-mono);color:var(--light);white-space:nowrap}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 9em;gap:var(--space-1) var(--space-4);align-items:center;padding:var(--space-3) 0;border-top:1px solid var(--hairline)}
.ln .t{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.ln .v{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);grid-column:1}
.ln .v b{font-weight:400;color:var(--light)}
.ln .hb{grid-column:2;grid-row:1 / 3}
.ln.weak{box-shadow:inset 2px 0 0 var(--x-proposed-warn);padding-left:var(--space-3)}
.ln.weak .t::after{content:"  ← weakest";font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-warn)}
.verdict{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-4)}
.verdict .w{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.rules{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.rules ol{display:grid;gap:var(--space-2);counter-reset:r}
.rules li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);counter-increment:r}
.rules li::before{content:counter(r);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.rules b{font-weight:400;color:var(--light)}
.sc{display:grid;grid-template-columns:auto auto auto;gap:var(--space-1) var(--space-3);align-items:center;justify-content:start}
.sc .tk{display:none}.tech .sc .tk{display:inline}
.track{grid-column:2 / 4;padding:var(--space-3) var(--space-4) var(--space-2)}
.track .row{display:flex;justify-content:space-between;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);margin-top:var(--space-1)}
.track .stops{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-2)}
.track .stops button{font:400 var(--type-small)/1 var(--font-mono);padding:var(--space-1) var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink-muted)}
.track .stops button.on{border-color:var(--light);color:var(--light)}
@media (max-width:1400px){.ln{padding:var(--space-2) 0}.rules{padding:var(--space-3) var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V4</b> the evaluation, worked out: three lines the decision set, the weakest one decides the sign · engine evaluation bars, confidence is worked out</div>
<script>
/*@DATA@*/
/*@LIB@*/
const STOPS = [3, 6, 7, 9, 10, 14, 15, 17];
const S = { i: 1 };
const lineVal = (L, l) => L.kind === 'max' ? `<b>${l.v}</b> of ${DATA.series.overdue.of} vans overdue · line at ${L.at}` : L.kind === 'by' ? `<b>${l.v}</b> of ${L.need} fitters in post · ${l.crossed ? 'line passed on ' + dt(L.by, 'short') : l.left != null ? l.left + ' days to ' + dt(L.by, 'short') : ''}` : `<b>£${l.v}</b> a van against £${L.was} · ${Math.round(l.share * 100)}% of the planned saving`;
function render() {
  const m = MV(STOPS[S.i]), p = posAt(m.on);
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'The evaluation'], [['← →', 'move'], ['T', 'the numbers', 'h-t'], ['R', 'replay']], { as: m.on }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">The evaluation</h1><p class="lede">The computed view is not a model’s opinion. It reads only the lines ${DEC.id} set for itself at the table, on the date of the move, and the weakest line decides. A summary is no surer than its weakest part.</p></div>
    <div class="barcol" aria-label="Evaluation bar">${posGl(p.s)}${evalBar(p.h)}<span class="lab">${p.s}</span></div>
    <section class="work pane" aria-live="polite">
      <div class="when"><span class="d">${dt(m.on)}</span><span class="lab">move ${m.n} · ${m.san}</span></div>
      ${DATA.lines.map(L => { const l = p.lines.find(x => x.id === L.id); return `<div class="ln ${l === p.weakest ? 'weak' : ''}"><span class="t">${L.text}</span><span class="hb">${evalBar(l.h, { flat: true })}</span><span class="v">${lineVal(L, l)} <span class="tk">${L.id} headroom ${l.h.toFixed(2)}</span></span></div>`; }).join('')}
      <div class="verdict box ${p.crossed ? 'warn' : ''}">${posGl(p.s, 'huge')}<div><p class="w">${p.w}</p><p class="small muted">${p.say}${p.crossed ? ` ${p.crossed} line${p.crossed > 1 ? 's' : ''} crossed.` : ''}</p></div></div>
    </section>
    <section class="rules pane scroll"><p class="eyebrow">The rule, the same for every decision</p>
      <ol><li><span>Each line the decision set gets a <b>headroom</b>, from full room to far over, read from its record on that date.</span></li>
      <li><span>A line with a date (“two fitters by 1 August”) loses room as the date nears and nothing moves.</span></li>
      <li><span>The <b>weakest</b> line decides the sign. Two lines crossed is always ${posGl('∓')}.</span></li>
      <li><span>It knows nothing the lines don’t: not a notice period, not who was off sick, not a clause in a contract. A person can say so with ${gl('∞')}, which lowers its certainty and never its number.</span></li>
      <li><span>No lines, no evaluation. A decision that set none shows an empty bar and says why.</span></li></ol>
      <div class="sc">${DATA.positions.map(x => `${posGl(x.s)}<span class="small">${x.w}</span><span class="tk">≥ ${x.min}</span>`).join('')}</div>
    </section>
    <section class="track pane"><div id="cv"></div><div class="stops">${STOPS.map((n, i) => `<button class="${i === S.i ? 'on' : ''}" data-i="${i}">${n} · ${dt(MV(n).on, 'short')}</button>`).join('')}</div></section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $('#cv').innerHTML = curve({ w: $('#cv').clientWidth, h: 70, sel: m.n });
  $$('.stops button').forEach(b => b.onclick = () => { clearLater(); S.i = +b.dataset.i; render(); });
}
function replay() { clearLater(); S.i = 1; render(); settle(); [2, 3, 4].forEach((k, j) => later(() => { S.i = k; render(); }, MOMENT() + j * ms('--motion-calm'))); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowRight') { clearLater(); S.i = Math.min(STOPS.length - 1, S.i + 1); render(); }
  if (e.key === 'ArrowLeft') { clearLater(); S.i = Math.max(0, S.i - 1); render(); }
});
addEventListener('resize', render);
replay();
</script>
</body>
</html>
