<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Grammar V6 · Who marks what</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Grammar V6: five voices, what each may write, and who sees it before the review is agreed ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.mx{min-height:0;padding:var(--space-4) var(--space-4) var(--space-3)}
table{width:100%;border-collapse:collapse;font-size:var(--type-small);line-height:var(--leading-small)}
th{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:var(--space-2);vertical-align:bottom;border-bottom:1px solid var(--hairline-strong)}
td{padding:var(--space-2);border-bottom:1px solid var(--hairline);vertical-align:top;color:var(--ink)}
td:first-child{width:22%}
td .v{display:block;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
td .r{color:var(--ink-muted)}
tr{transition:background var(--motion-calm) var(--ease-out)}
tr.hl{background:var(--x-proposed-lit-wash);box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.y{display:inline-flex;align-items:center;gap:var(--space-1);color:var(--light)}
.n{color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.pen{display:inline-flex;align-items:center;gap:var(--space-1);font-style:italic;color:var(--ink-muted);border-bottom:1px dotted var(--x-proposed-pencil)}
.gw-off .pen.model{text-decoration:line-through;opacity:var(--x-proposed-quiet)}
.priv{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.priv li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-1);padding:var(--space-2) 0;border-top:1px solid var(--hairline)}
.priv li b{font-weight:400;color:var(--light)}
.priv .lab{margin-top:var(--space-2)}
@media (max-width:1400px){td,th{padding:var(--space-1) var(--space-2)}td .v{font-size:var(--type-small)}.priv li{padding:var(--space-1) 0}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V6</b> who marks what: the mover first, then the reviewer, the meeting agrees; the records never judge a move, the model never marks · after-action review, self-annotated games</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { hl: -1, gw: true };
const y = w => `<span class="y">${I('check', 14)}${w ? ' <span class="' + (/^[!?□⊕∞±⩲=⩱∓ ]+/.test(w) ? 'mono' : '') + '">' + w + '</span>' : ''}</span>`, n = w => `<span class="n">${w || '—'}</span>`, pen = (w, c = '') => `<span class="pen ${c}">${I('pencil', 12)} ${w}</span>`;
const COLS = ['Mark a move', 'Mark a position', 'Write a line', 'Find a moment', 'Seen before it’s agreed by'];
const ROWS = [
  { v: 'The person who made the move', r: 'first, on their own moves only', c: [y('! ? □ ⊕'), y('∞ only'), y(), y('“I’d go back to here”'), 'only them, until they release it'] },
  { v: 'The reviewer', r: 'someone outside the moves; here ' + P(DATA.review.facilitator).name, c: [y('every move but the world’s'), y('∞ only'), y('at critical moments'), y(), 'the people in the review'] },
  { v: 'A second reviewer', r: 'optional; their marks sit beside, never averaged', c: [y(), y('∞ only'), y(), y(), 'the people in the review'] },
  { v: 'The meeting', r: 'agrees the review, as it agrees a minute', c: [n('agrees, never re-marks'), n(), n('agrees the lines'), n(), '— (agreeing publishes it)'] },
  { v: 'The records', r: 'the lines the decision set', c: [n('never: a choice isn’t a number'), y('± ⩲ = ⩱ ∓'), y('a sentence by template'), y('falls, crossings, one-way steps'), 'everyone who can open the decision'] },
  { v: 'The model', r: 'through the model gateway', c: [n('never'), n('never'), pen('drafts a line for the reviewer to keep or bin', 'model'), pen('suggests, the reviewer decides', 'model'), 'the reviewer only'] }
];
function render() {
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', 'Who marks what'], [['G', 'model gateway', 'h-g'], ['T', 'record names', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap ${S.gw ? '' : 'gw-off'}">
    <div class="intro"><h1 class="h1">Who marks what</h1><p class="lede">Masters annotate their own games first. Here the person who made a move marks it before anyone else does, the reviewer marks the rest, and the meeting agrees the review the way it agrees a minute. Nobody else edits it after.</p></div>
    <section class="mx pane scroll"><table><thead><tr><th>Voice</th>${COLS.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>
      ${ROWS.map((r, i) => `<tr class="${S.hl === i ? 'hl' : ''}"><td><span class="v">${r.v}</span><span class="r">${r.r}</span></td>${r.c.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
    </tbody></table>
    <p class="small muted" style="margin-top:var(--space-3)">${S.gw ? 'With the model gateway off, the two pencil cells go; every mark, line and moment stays. G turns it off.' : `<span class="lite">Model gateway off.</span> Nothing in the review changes: the model only ever drafts in pencil.`}</p></section>
    <section class="priv pane scroll"><p class="eyebrow">Mine and ours</p>
      <ul>
        <li>${I('user-round', 16)}<span><b>Your marks on your own moves are yours</b> until you release them to the review. You can withdraw them up to the day it’s agreed.</span></li>
        <li>${I('users', 16)}<span><b>Marks belong to moves, not people.</b> No page anywhere counts anyone’s ? marks, and the book is never searchable by person.</span></li>
        <li>${I('pencil', 16)}<span><b>Drafts are pencil</b> and seen only by the people in the review. Only the agreed review is filed in the book.</span></li>
        <li>${I('eye-off', 16)}<span><b>A learner’s guesses are private.</b> Nobody sees which move a new starter would have played.</span></li>
        <li>${I('lock', 16)}<span><b>Reach follows the decision.</b> Whoever can open ${DEC.id} can read its review; nobody else, and the book says so where it can’t show one.</span></li>
      </ul>
      <p class="lab">Never</p><p class="muted">A review of a person. Marks on a world move. An average of two reviewers. A mark changed after the review is agreed: a correction is a new, dated mark beside the old one.</p>
    </section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $('#h-g')?.classList.toggle('on', !S.gw);
}
function replay() { clearLater(); S.hl = -1; S.gw = true; render(); settle(); later(() => { S.hl = 0; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'g') { S.gw = !S.gw; render(); }
});
replay();
</script>
</body>
</html>
