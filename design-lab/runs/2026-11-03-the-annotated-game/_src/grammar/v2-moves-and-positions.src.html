<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Grammar V2 · Moves and positions</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Grammar V2: two voices on one time scale. The records mark positions above, people mark moves below ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.stage{position:relative;min-height:0;padding:var(--space-4) var(--space-5);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto auto;gap:var(--space-2)}
.cvbox{min-height:0}
.lane{display:flex;align-items:baseline;gap:var(--space-3)}
.lane .lab{min-width:0}
.lane .w{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.track{position:relative;height:var(--space-5)}
.track.marks{height:calc(var(--space-7) + var(--space-3))}
.pin{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.pin .gl{font-size:var(--type-meta)}
.pin .mk{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.hidden .pin .mk{opacity:0;transform:translateY(calc(var(--space-2) * -1))}
.moves .pin{color:var(--ink)}
.moves .pin.world{color:var(--ink-muted);font-style:italic}
.cvbox{position:relative}
.bracket{position:absolute;border:1px solid var(--x-proposed-warn);border-radius:var(--radius-key);pointer-events:none;opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.lit .bracket{opacity:1}
.bracket .bl{position:absolute;left:calc(100% + var(--space-2));top:var(--space-6);width:var(--measure-card);font:400 var(--type-small)/var(--leading-small) var(--font-sans);color:var(--ink);background:var(--surface-overlay);border:1px solid var(--x-proposed-warn);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
.three .box{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small)}
.three h3{font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.rule{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V2</b> moves and positions: the records mark where it stood, people mark what was chosen · engine bars, de Groot, Informator</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { lit: false };
function render() {
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'Two voices'], [['T', 'how it’s read', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">Moves and positions</h1><p class="lede">Two voices, never one number. The records say where the decision <b class="lite">stood</b> on each date, read from the lines it set itself. People say whether each <b class="lite">choice</b> was good, given what was known when it was made.</p></div>
    <section class="stage pane ${S.lit ? 'lit' : 'hidden'}" id="stage">
      <div class="lane"><span class="lab">The records · positions</span><span class="w">worked out by rule from ${DATA.lines.length} lines, as at each date. Nobody types these.</span></div>
      <div class="track" id="signs"></div>
      <div class="cvbox" id="cvbox"></div>
      <div class="track moves" id="moves"></div>
      <div class="lane"><span class="lab">People · moves</span><span class="w">the person who made the move marks it first; the reviewer’s mark sits under it. World moves get no mark.</span></div>
      <div class="track marks" id="marks"></div>
    </section>
    <div class="three">
      <div class="box"><h3>${I('equal', 14)} Where they agree</h3><p>Move ${MV(11).n}, ${dt(MV(11).on, 'short')}: the records are ${posGl(posOfMove(11).s)} (${POS(posOfMove(11).s).w.toLowerCase()}) and the reviewer marks the chair’s “${MV(11).san.toLowerCase()}” ${gl('?')}. Both say this is where it turned.</p></div>
      <div class="box warn"><h3>${I('split', 14)} Where they disagree</h3><p>Move ${MV(6).n}, ${dt(MV(6).on, 'short')}: the records stay ${posGl(posOfMove(6).s)}. Dana marks her own move ${gl('□')}, the reviewer ${gl('?')} and ${gl('∞')}: the options closed and no line the records watch could see it.</p></div>
      <div class="box"><h3>${I('circle-help', 14)} Where neither has the last word</h3><p>Move ${MV(13).n}: two reviewers, ${gl('!?')} and ${gl('?')}. Both marks are kept and signed. A review doesn’t need one verdict; marks are never averaged, and never added up into a score.</p></div>
    </div>
  </div></main>`;
  Icons.hydrate($('#app'));
  draw();
}
function draw() {
  const box = $('#cvbox'), w = box.clientWidth, o = { w, h: Math.max(90, box.clientHeight) };
  box.innerHTML = curve(o);
  /* group moves that sit within a few pixels: one position per group, marks stacked */
  const byDate = {}; let last = null;
  MOVES.forEach(m => { const x = curveX(o, m.on); if (last && x - curveX(o, last) < 48) { byDate[last].push(m); } else { last = m.on; byDate[last] = [m]; } });
  $('#signs').innerHTML = Object.entries(byDate).map(([d, ms]) => `<span class="pin" style="left:${curveX(o, d)}px">${posGl(posAt(ms[ms.length - 1].on).s)}</span>`).join('');
  $('#moves').innerHTML = Object.entries(byDate).map(([d, ms]) => `<span class="pin ${ms.every(m => m.side === 'world') ? 'world' : ''}" style="left:${curveX(o, d)}px">${ms.map(m => m.n).join(' ')}<span class="muted">${dt(d, 'short')}</span></span>`).join('');
  $('#marks').innerHTML = Object.entries(byDate).map(([d, ms]) => `<span class="pin" style="left:${curveX(o, d)}px">${ms.filter(m => ANN(m.n).length).map((m, i) => `<span class="mk" style="transition-delay:calc(var(--motion-instant) * ${i})">${m.n} ${ANN(m.n).map(a => gl(a.g, a.self ? 'second' : '')).join('')}</span>`).join('')}</span>`).join('');
  /* the disagreement bracket around move 6, from the sign row to the marks row */
  const x = curveX(o, MV(6).on), st = $('#stage').getBoundingClientRect(), top = $('#signs').getBoundingClientRect().top - st.top - 4, bot = $('#marks').getBoundingClientRect().top - st.top + 44;
  const b = document.createElement('div'); b.className = 'bracket';
  b.style.cssText = `left:${x + box.offsetLeft - 34}px;top:${top}px;width:68px;height:${bot - top}px`;
  b.innerHTML = `<span class="bl">The records: ${posGl(posOfMove(6).s)} before and after. People: ${gl('?')} ${gl('∞')}. <span class="muted">The disagreement is the lesson: a one-way step the lines couldn’t see.</span><span class="tk">min headroom 28 May: ${posOfMove(6).h.toFixed(2)} (L1)</span></span>`;
  $('#stage').appendChild(b);
}
function replay() { clearLater(); S.lit = false; render(); settle(); later(() => { S.lit = true; $('#stage').classList.replace('hidden', 'lit'); }, MOMENT()); }
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
addEventListener('resize', render);
replay();
</script>
</body>
</html>
