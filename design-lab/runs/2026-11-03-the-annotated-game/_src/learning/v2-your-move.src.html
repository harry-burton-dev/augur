<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Learning V2 · Your move</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Learning V2: guess the move. The precedent's critical position, as it stood; she chooses first, privately, then sees what was played and the marks ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.pos{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.pos .d{font:300 var(--type-heading)/var(--leading-heading) var(--font-mono);color:var(--light)}
.pos li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-1);padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.pos .pv{margin-top:auto;display:flex;align-items:center;gap:var(--space-3);font-size:var(--type-small);color:var(--ink-muted)}
.pos .pv .eb{height:var(--space-6);min-height:0}
.play{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.play .q{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.ch{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline-strong);text-align:left;font-size:var(--type-meta);line-height:var(--leading-meta);width:100%}
.ch .k{font-family:var(--font-mono);color:var(--ink-muted)}
.ch:hover{background:var(--surface-raised)}
.ch.mine{border-color:var(--light);background:var(--surface-raised)}
.ch .tag{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);white-space:nowrap}
.ch.played .tag{color:var(--x-proposed-mark-bad)}
.ch.best .tag{color:var(--x-proposed-mark-good)}
.reveal{display:grid;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.reveal .m{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:var(--space-2)}
.reveal .by{color:var(--ink-muted)}
.priv{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.pos,.play{padding:var(--space-3) var(--space-4);gap:var(--space-2)}.pos li{padding:var(--space-1) 0;font-size:var(--type-small);line-height:var(--leading-small)}.ch{padding:var(--space-2) var(--space-3)}.play .q{font-size:var(--type-lead);line-height:var(--leading-lead)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Learning · V2</b> your move: the precedent’s critical position as it stood; she chooses first, privately, then sees what was played, its marks and the line another floor played · de Groot’s choice-of-move experiments, “guess the move” training</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = DATA.later.today;
const L = DATA.later, Z = L.puzzle, m = MV(Z.move);
const S = { pick: null };
function render() {
  const p = posAt(Z.asAt), done = !!S.pick;
  $('#app').innerHTML = topHTML(['Mandate', 'The book', 'R-07', 'Your move'], [['A B C', 'choose'], ['R', 'replay']], { as: NOW }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">Your move</h1><p class="lede">Before ${first(L.who)} reads how R-07 went, she plays its critical moment herself. She sees only what was known that day. Her choice is hers alone: nobody sees it, and nothing scores it.</p></div>
    <section class="pos pane"><p class="lab">R-07 · move ${m.n} · as it stood</p><p class="d">${dt(Z.asAt)}</p>
      <ul>${Z.known.map(k => `<li>${I('check', 14)}<span>${k}</span></li>`).join('')}</ul>
      <p class="pv">${evalBar(p.h)} ${posGl(p.s, 'big')} <span>The records said ${p.w.toLowerCase()} that day. ${done ? '' : 'What came next is out of focus.'}</span></p></section>
    <section class="play pane" aria-live="polite"><p class="q">You are the contracts manager. What do you do?</p>
      ${Z.choices.map(c => `<button class="ch ${S.pick === c.k ? 'mine' : ''} ${done && c.played ? 'played' : ''} ${done && c.best ? 'best' : ''}" data-k="${c.k}"><span class="k">${c.k.toUpperCase()}</span><span>${c.san}</span><span class="tag">${done ? (c.played ? 'played in R-07 · ' + mainMark(6).g : c.best ? 'played in R-03 · kept' : 'not played') : ''}${S.pick === c.k ? (done ? ' · your choice' : '') : ''}</span></button>`).join('')}
      ${done ? `<div class="reveal fade">${ANN(6).map(a => `<div class="m">${gl(a.g)}<span>${a.line} <span class="by">· ${P(a.by).name}${a.self ? ', own move' : ''}</span></span></div>`).join('')}
        <p class="muted">${S.pick === 'b' ? 'You chose the book line. R-03 played it in 2025 and kept the change.' : S.pick === 'a' ? 'You chose what was played. Most people do: the decision said 1 September, and the notice clock was running.' : 'Moving the start was not on the record in 2026; the reviewer raised it afterwards. His estimate: it buys time, not an answer, because the moves stay in the same order.'} ${DATA.hindsight[6]}</p></div>` : ''}
      <p class="priv">${I('eye-off', 12)} Private. Your choice isn’t stored after you leave this page, unless you keep it in your own notes.</p></section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('.ch').forEach(b => b.onclick = () => { S.pick = b.dataset.k; render(); });
}
function replay() { clearLater(); S.pick = null; render(); settle(); later(() => { S.pick = 'a'; render(); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; const k = e.key.toLowerCase(); if ('abc'.includes(k) && k.length === 1) { S.pick = k; render(); } });
replay();
</script>
</body>
</html>
