<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Learning V6 · What it asks of your draft</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Learning V6: the precedent turned into three questions on her draft, each citing the move it comes from. She can answer, change her draft, or keep it with a reason ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.draft{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-2)}
.draft .t{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.st{display:grid;grid-template-columns:2em minmax(0,1fr);gap:var(--space-1) var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline);background:var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small)}
.st .n{font-family:var(--font-mono);color:var(--ink-muted)}
.st .s{color:var(--light)}
.st .seam{grid-column:2;display:flex;gap:var(--space-2);align-items:baseline;border-left:2px solid var(--info);padding-left:var(--space-2);color:var(--ink-muted)}
.st .seam s{color:var(--ink-muted)}
.st.new{border-color:var(--x-proposed-lit)}
.qs{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.q{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline-strong);background:var(--surface-pane);display:grid;gap:var(--space-2);transition:border-color var(--motion-calm) var(--ease-out)}
.q .h{display:flex;align-items:baseline;gap:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.q .src{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.q .acts{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.q .st2{font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-left:auto}
.q.done{border-color:var(--x-proposed-lit)}
.q.done .st2{color:var(--x-proposed-lit)}
.q.kept .st2{color:var(--ink)}
.foot{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.q{padding:var(--space-2) var(--space-3);gap:var(--space-1)}.qs{gap:var(--space-2)}.draft{padding:var(--space-3) var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Learning · V6</b> what it asks of your draft: three questions from the precedent, each citing its move; she changes two steps and keeps one with a reason; the changes stay as seams · after-action “change” items, theory, visible repair</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = DATA.later.today;
const L = DATA.later, D = L.draft;
const QS = [
  { k: 'order', h: 'Is what it depends on in place before the step you can’t undo?', src: [6, 'R-03'], from: D.moves[2].san, to: 'Renew Brackley for six months with a break; notice once both fitters are in post', how: 'changed' },
  { k: 'cover', h: 'Does the costing count cover for sickness, leave and vacancies?', src: [1, 'R-02'], from: `Paper: the North bay at £${D.ours} a van`, to: `Paper: £131 a van, cover counted (still £${D.price - 131} under Brackley)`, how: 'changed' },
  { k: 'trial', h: 'Is it a trial with an end date and a line?', src: [2, 3], how: 'kept', why: 'Kept for good: the south depot’s vans already use the North bay for repairs, so there is nothing to go back to. A line on overdue vans is added instead.' }
];
const S = { n: 0 };
function render() {
  const done = QS.slice(0, S.n);
  const mv = D.moves.map(m => { const q = done.find(x => x.how === 'changed' && x.from === m.san); return { ...m, q }; });
  $('#app').innerHTML = topHTML(['Mandate', 'Drafts', D.id], [['Space', 'answer the next'], ['R', 'replay']], { as: NOW }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">What it asks of your draft</h1><p class="lede">The precedent doesn’t become rules. It becomes three questions on ${first(L.who)}’s draft, each pointing at the move it comes from. She can change a step, or keep it and say why. Either way the meeting sees the question and her answer.</p></div>
    <section class="draft pane scroll"><p class="lab">Draft · ${D.id}</p><p class="t">${D.title}</p>
      ${mv.map(m => `<div class="st ${m.q ? 'new' : ''}"><span class="n">${m.n}.</span><span class="s">${m.q ? m.q.to : m.san}</span>${m.q ? `<span class="seam"><s>${m.san}</s> · changed after R-07 move ${m.q.src[0]}</span>` : ''}</div>`).join('')}
      ${done.find(x => x.k === 'trial') ? `<div class="st new fade"><span class="n">4.</span><span class="s">Line: revisit if more than 3 south depot vans are overdue</span></div>` : ''}
      <p class="foot" style="margin-top:auto">Seams stay on the draft: the meeting will see what changed and which game it came from.</p></section>
    <section class="qs scroll">${QS.map((q, i) => { const st = i < S.n ? q.how : 'open';
      return `<div class="q ${st === 'changed' ? 'done' : st === 'kept' ? 'kept' : ''}"><p class="h">${gl(i === 2 ? '!' : mainMark(q.src[0]).g)} ${q.h}</p>
        <p class="src">From R-07 move ${q.src[0]}${typeof q.src[1] === 'number' ? ' and ' + q.src[1] : ', and ' + q.src[1]}: ${MV(q.src[0]).san}. ${(mainMark(q.src[0]) || {}).line || ''}</p>
        ${st === 'kept' ? `<p class="small">${I('message-square', 12)} ${q.why}</p>` : ''}
        <div class="acts">${st === 'open' ? `<button class="btn sm">${I('pen-line', 14)} Change my step</button><button class="btn sm">${I('message-square', 14)} Keep it, with a reason</button>` : ''}<span class="st2">${st === 'open' ? 'open' : st === 'changed' ? 'step changed' : 'kept, with a reason'}</span></div></div>`; }).join('')}
      <p class="foot">${I('info', 12)} Questions come only from agreed reviews and the book’s theory, never from a model. Each one can be kept with a reason; none blocks the draft.</p></section>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.n = 0; render(); settle(); [1, 2, 3].forEach((k, i) => later(() => { S.n = k; render(); }, MOMENT() + i * ms('--motion-slow'))); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key === ' ') { e.preventDefault(); S.n = (S.n + 1) % 4; render(); } });
replay();
</script>
</body>
</html>
