<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Learning V5 · Ask who played it</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Learning V5: the precedent comes with its players. Who is still here, which moves each can speak to, and one question at a time ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.people{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3);align-content:start}
.pp{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-pane);display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);align-items:start;text-align:left;width:100%}
.pp .face{grid-row:span 3}
.pp .nm{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.pp .rl{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.pp .mv{display:flex;gap:var(--space-1);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small)}
.pp .mvs{grid-column:2;display:flex;gap:var(--space-1);flex-wrap:wrap}
.pp .mvs span{font:400 var(--type-small)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:2px var(--space-2)}
.pp.gone{background:var(--x-proposed-stale),var(--surface-inset);color:var(--ink-muted)}
.pp.gone .nm{color:var(--ink)}
.pp.sel{border-color:var(--light)}
.ask{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.ask .to{display:flex;align-items:center;gap:var(--space-3)}
.ask textarea{font:400 var(--type-meta)/var(--leading-meta) var(--font-sans);color:var(--ink);background:var(--surface-inset);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);resize:none;height:calc(var(--leading-meta) * 3 + var(--space-4))}
.ask .ctx{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-2) var(--space-3);border-left:2px solid var(--hairline-strong)}
.ask .rules{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.sent{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--x-proposed-lit)}
@media (max-width:1400px){.pp{padding:var(--space-2) var(--space-3)}.ask{padding:var(--space-3) var(--space-4);gap:var(--space-2)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Learning · V5</b> ask who played it: the precedent’s players, who is still here, which moves each can speak to; one question, with the move attached · master and apprentice, after-action review, works under someone</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = DATA.later.today;
const L = DATA.later;
const Q = 'Would you give notice before the fitters are in post again? Brackley wants three months, so I’d have to write by 31 December, and the hiring is due by 1 March.';
const S = { to: 'p4', sent: false, typed: '' };
function render() {
  const sel = L.people.find(x => x.id === S.to);
  $('#app').innerHTML = topHTML(['Mandate', 'The book', 'R-07', 'Who played it'], [['click', 'choose a person'], ['R', 'replay']], { as: NOW }) +
  `<main class="main"><div class="wrap">
    <div class="intro"><h1 class="h1">Ask who played it</h1><p class="lede">An annotated game is only half the lesson; the players are the other half. The precedent comes with the people who made its moves, what each can speak to, and whether they are still here to ask.</p></div>
    <section class="people scroll">${L.people.map(x => { const p = P(x.id); return `<button class="pp ${x.here ? '' : 'gone'} ${S.to === x.id ? 'sel' : ''}" data-id="${x.id}" ${x.here ? '' : 'aria-disabled="true"'}>${face(x.id, x.here ? '' : 'off')}<span class="nm">${p.name}${x.id === L.manager ? ' <span class="small muted">· your manager</span>' : ''}</span><span class="rl">${p.role}${x.here ? '' : ` · left ${dt(p.left, 'month')}`}</span>
      <span class="mvs">${x.about.map(a => typeof a === 'number' ? `<span>${a}. ${MV(a).san.split(':')[0]} ${(ANN(a).find(n => n.by === x.id) || {}).g || ''}</span>` : `<span>${a}: played the book line</span>`).join('')}</span>
      ${x.here ? '' : `<span class="rl" style="grid-column:2">Can’t be asked. Her own mark and line on move 1 stay in the review.</span>`}</button>`; }).join('')}</section>
    <section class="ask pane" aria-live="polite"><div class="to">${face(S.to)}<div><p class="lab">To ${P(S.to).name}</p><p class="small muted">about R-07 move ${sel.about.filter(a => typeof a === 'number').join(', ') || sel.about.join(', ')}</p></div></div>
      <div class="ctx">${sel.about.filter(a => typeof a === 'number').map(a => `<span>${a}. ${MV(a).san} ${ANN(a).filter(n => n.by === S.to).map(n => gl(n.g) + ' “' + n.line + '”').join(' ')}</span>`).join('') || `<span>${DATA.book.games.find(g => g.id === 'R-03').note}</span>`}</div>
      <label class="small muted" for="q">One question, in your own words</label><textarea id="q">${S.typed}</textarea>
      ${S.sent ? `<p class="sent fade">${I('check', 14)} Sent to ${first(S.to)} with move ${sel.about[0]} attached. It waits as a question until she answers; nobody chases it.</p>` : `<div><button class="btn go sm" id="send">${I('send', 14)} Ask</button></div>`}
      <p class="rules">${I('lock', 12)} The question and the answer are between you two unless ${first(S.to)} adds the answer to the review as a reply. Asking about a move is never a complaint about the person who made it.</p></section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('.pp').forEach(b => b.onclick = () => { const x = L.people.find(y => y.id === b.dataset.id); if (!x.here) return; S.to = x.id; S.sent = false; S.typed = ''; render(); });
  $('#q').oninput = e => { S.typed = e.target.value; };
  $('#send') && ($('#send').onclick = () => { S.sent = true; render(); });
}
function replay() { clearLater(); Object.assign(S, { to: 'p4', sent: false, typed: '' }); render(); settle(); later(() => { S.typed = Q; render(); }, MOMENT()); later(() => { S.sent = true; render(); }, MOMENT() + ms('--motion-calm')); }
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
replay();
</script>
</body>
</html>
