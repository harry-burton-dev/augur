<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Learning V3 · Two boards</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Learning V3: her draft beside the precedent, step for step. Same moves, a missing move, and the move where the precedent turned ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--space-3)}
.heads,.row{display:grid;grid-template-columns:minmax(0,1fr) 9em minmax(0,1fr);gap:var(--space-4)}
.heads{padding:0 var(--space-4)}
.heads .h{display:grid;gap:2px}
.heads .h b{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.heads .h span{font-size:var(--type-small);color:var(--ink-muted)}
.rows{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.row{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-pane);align-items:center;transition:border-color var(--motion-calm) var(--ease-out),background var(--motion-calm) var(--ease-out)}
.cell{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small)}
.cell .s{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.cell.gap{color:var(--ink-muted);font-style:italic}
.cell.gap .s{color:var(--ink-muted)}
.mid{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);text-align:center;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink-muted)}
.mid .gl{font-size:var(--type-heading)}
.lit .row.same-bad{border-color:var(--x-proposed-warn);background:color-mix(in srgb,var(--warning) 5%,var(--surface-pane))}
.lit .row.missing{border-color:var(--x-proposed-lit);border-style:dashed}
.lit .row.better{border-color:var(--x-proposed-lit)}
.sum{padding:var(--space-3) var(--space-4);font-size:var(--type-meta);line-height:var(--leading-meta)}
.sum b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.row{padding:var(--space-2) var(--space-3)}.rows{gap:var(--space-1)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Learning · V3</b> two boards: her draft and the precedent aligned step for step; where she plays the same, where the precedent had a good move she lacks, and where it turned · comparing games move by move, transpositions</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = DATA.later.today;
const L = DATA.later, D = L.draft;
/* rows: each step of R-07 that her draft meets, matched by kind of move; a gap where she has no such move */
const ROWS = [
  { r: 1, d: 1, k: 'same', w: 'same move' },
  { r: 2, d: null, k: 'missing', w: 'no trial', note: 'Her draft is for good. R-07’s trial is why reversing it cost little.' },
  { r: 3, d: null, k: 'missing', w: 'no line yet', note: 'No line that would bring it back to the meeting.' },
  { r: 4, d: 2, k: 'same', w: 'same move' },
  { r: 6, d: 3, k: 'same-bad', w: 'same move' }
];
const S = { lit: false };
function render() {
  $('#app').innerHTML = topHTML(['Mandate', 'Drafts', D.id, 'Beside R-07'], [['R', 'replay']], { as: NOW }) +
  `<main class="main"><div class="wrap ${S.lit ? 'lit' : ''}">
    <div class="intro"><h1 class="h1">Two boards</h1><p class="lede">${first(L.who)}’s draft and the precedent, step for step. Not to copy it: to see where she is playing the same game, which good move she hasn’t played yet, and which move turned it last time.</p></div>
    <div class="heads"><p class="h"><b>Her draft · ${D.id}</b><span>${D.title}</span></p><span></span><p class="h"><b>The precedent · R-07</b><span>${DEC.title}, ${dt(DEC.made, 'month')}</span></p></div>
    <section class="rows scroll">${ROWS.map(x => { const r = MV(x.r), d = x.d ? D.moves.find(m => m.n === x.d) : null, mk = mainMark(x.r);
      return `<div class="row ${x.k}"><div class="cell ${d ? '' : 'gap'}">${d ? `<span class="s">${d.n}. ${d.san} ${d.door ? I('door-closed', 13) : ''}</span><span class="muted">${d.text}</span>` : `<span class="s">—</span><span>${x.note}</span>`}</div>
        <div class="mid">${mk ? gl(mk.g) : ''}<span>${x.w}</span></div>
        <div class="cell"><span class="s">${r.n}. ${r.san} ${r.door ? I('door-closed', 13) : ''}</span><span class="muted">${mk && mk.line ? mk.line : r.text}</span></div></div>`; }).join('')}</section>
    <p class="sum pane">${I('scale', 14)} <b>Three steps the same</b>, including the one marked ${gl('?')}. <b>Two good moves missing</b>: the trial (${gl('!')}) and a line (${gl('!')}). Her costing is ${D.ours < 112 ? 'lower' : 'higher'} than R-07’s (£${D.ours} against £112) but, like R-07’s, counts no cover.</p>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.lit = false; render(); settle(); later(() => { S.lit = true; $('.wrap').classList.add('lit'); }, MOMENT()); }
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
replay();
</script>
</body>
</html>
