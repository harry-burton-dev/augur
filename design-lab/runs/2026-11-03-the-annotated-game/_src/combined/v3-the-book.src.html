<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Combined V3 · The book</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V3: the book that could ship: find by position, the code's page with its book line and explorer, its games (with transpositions and the ones you can't open), its motifs ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.find{grid-column:1 / -1;padding:var(--space-3) var(--space-4);display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap;font-weight:300;font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-2));color:var(--ink)}
.find .f{color:var(--light);border-bottom:1px solid var(--light);padding:0 var(--space-1);transition:color var(--motion-calm) var(--ease-out),border-color var(--motion-calm) var(--ease-out)}
.find .f.blank{color:var(--ink-muted);border-bottom-style:dashed;border-color:var(--ink-muted)}
.find .code{margin-left:auto;font:400 var(--type-meta)/1 var(--font-mono);color:var(--light);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2)}
.page{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);transition:opacity var(--motion-calm) var(--ease-out)}
.page.closed{opacity:.25}
.page .nm{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.bl{font:400 var(--type-small)/1.9 var(--font-mono);color:var(--ink)}
.bl .bk{color:var(--x-proposed-mark-good)}.bl .dev{color:var(--x-proposed-mark-bad)}
.ex{display:grid;gap:var(--space-2)}
.ex .row{display:grid;grid-template-columns:minmax(0,1.4fr) 2.5em minmax(0,1fr);gap:var(--space-3);align-items:center;font-size:var(--type-small);line-height:var(--leading-small)}
.ex .ct{font:300 var(--type-lead)/1 var(--font-mono);color:var(--light);text-align:right}
.bar{display:flex;height:var(--space-3);border-radius:2px;overflow:hidden;border:1px solid var(--hairline-strong)}
.bar i.kept{background:var(--x-proposed-mark-good)}.bar i.amended{background:var(--ink-muted)}.bar i.reversed{background:var(--x-proposed-mark-bad)}
.g{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto;gap:var(--space-3);align-items:baseline;padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.g .id{font-family:var(--font-mono);color:var(--light)}
.g .u{color:var(--ink-muted)}
.g .tr{color:var(--x-proposed-mark-info)}
.rz{font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.rz.kept{color:var(--x-proposed-mark-good)}.rz.amended{color:var(--ink)}.rz.reversed{color:var(--x-proposed-mark-bad)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.side .pane{padding:var(--space-3) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.mo{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline}
.mo .c{font-family:var(--font-mono);color:var(--ink-muted)}
.th li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);padding:var(--space-1) 0}
@media (max-width:1400px){.page{padding:var(--space-3) var(--space-4);gap:var(--space-2)}.find{font-size:var(--type-meta);line-height:calc(var(--leading-meta) + var(--space-2))}.g{padding:var(--space-1) 0}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V3</b> the book: say where you stand, get the code’s page: its book line, what was played next and how it ended, its games (a transposition, two you can’t open), its motifs and theory · collection V1 V2 V4 V5 V6, voices V6</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = DATA.later.today;
const BK = DATA.book, G = id => BK.games.find(g => g.id === id);
const F = { kind: 'contract', depends: 'hiring', door: 'notice', trial: 'yes' };
const S = { k: 1 };
const keys = BK.facets.map(f => f.k);
function bar(ids) { return `<div class="bar">${['kept', 'amended', 'reversed'].map(r => { const k = ids.filter(id => G(id).result === r).length; return k ? `<i class="${r}" style="width:${k / ids.length * 100}%"></i>` : ''; }).join('')}</div>`; }
function render() {
  const filled = keys.slice(0, S.k), done = S.k >= keys.length;
  const vis = BK.games.filter(g => !g.restricted);
  const full = vis.filter(g => keys.every(k => g.facets[k] === F[k]));
  const same = BK.games.filter(g => g.code === 'C3.2' || full.includes(g));
  const fv = k => filled.includes(k) ? `<span class="f">${BK.facets.find(x => x.k === k).vals[F[k]]}</span>` : `<span class="f blank">${BK.facets.find(x => x.k === k).w.toLowerCase()}</span>`;
  $('#app').innerHTML = topHTML(['Mandate', 'The book'], [['R', 'replay']], { as: NOW }) +
  `<main class="main"><div class="wrap">
    <p class="find pane">${I('search', 18)} A change to ${fv('kind')} that depends on ${fv('depends')}, where the one-way step is ${fv('door')}, made as ${fv('trial')}.<span class="code">${done ? 'C3.2 · ' + full.length + ' games in this position' : 'C3 · …'}</span></p>
    <section class="page pane scroll ${done ? '' : 'closed'}"><p class="lab">C3.2</p><p class="nm">${BK.codes['C3.2']}</p>
      <div class="bl"><span class="lab">Book line</span><br>1. Costing with cover · 2. Trial with an end date · 3. A line anyone can read · <span class="bk">4. Hire · 5. then give notice</span><br><span class="dev">4. Notice · 5. then hire ?</span> <span class="muted">R-07, R-04</span></div>
      <div class="ex"><p class="lab">At the step that decides it: what was played next</p>
        <div class="row"><span>Secure it, then the one-way step ${gl('!')}</span><span class="ct">2</span>${bar(['R-03', 'R-11'])}</div>
        <div class="row"><span>The one-way step, then secure it ${gl('?')}</span><span class="ct">2</span>${bar(['R-07', 'R-04'])}</div>
        <p class="small muted">Four games. Not a rate: read them.</p></div>
      <p class="lab">Games in this position</p>
      ${same.map(g => g.restricted ? `<div class="g"><span class="id">${g.id}</span><span><span class="unseen">${I('lock', 12)} ${g.unit}, ${g.year}</span> ${g.restricted.why} Ask ${P(g.restricted.who).name}.</span><span></span></div>`
        : `<div class="g"><span class="id">${g.id}</span><span>${g.title} <span class="u">· ${g.unit}, ${g.year}</span>${g.code !== 'C3.2' ? `<br><span class="tr">${I('git-merge', 12)} ${g.code}, a different code reaching the same position. “${g.note}”</span>` : ''}</span><span class="rz ${g.result}">${DATA.results[g.result]}</span></div>`).join('')}
    </section>
    <aside class="side">
      <div class="pane"><p class="eyebrow">Motifs in these games</p>${Object.entries(BK.motifs).map(([k, M]) => { const n = same.filter(g => !g.restricted && g.motifs.includes(k)).length; return n ? `<div class="mo">${gl(M.tone === 'good' ? '!' : '?')}<span>${M.name}</span><span class="c">${n}</span></div>` : ''; }).join('')}</div>
      <div class="pane"><p class="eyebrow">Theory</p><ul class="th"><li>${I('book-open', 14)}<span>Secure what it depends on before the step you can’t undo. <span class="muted">R-07 6, R-03 3</span></span></li><li>${I('book-open', 14)}<span>When an action a line depends on moves its date, move the line or say why not. <span class="muted">R-07 8, ${P('p1').name}</span></span></li><li>${I('book-open', 14)}<span>Count cover in any in-house costing. <span class="muted">R-07 1, R-02, R-03</span></span></li></ul></div>
      <div class="pane"><p class="eyebrow">Reach</p><p class="muted">You can read every review whose decision you can open. Two in this position belong to bodies that keep them to those who took part; they are listed, with whom to ask. Nothing here can be searched by person.</p></div>
    </aside>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.k = 1; render(); settle(); [2, 3, 4].forEach((k, i) => later(() => { S.k = k; render(); }, MOMENT() + i * ms('--motion-base'))); }
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
replay();
</script>
</body>
</html>
