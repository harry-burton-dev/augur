<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The annotated game · Combined V4 · In book, while you draft</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V4: the drafting screen that could ship. A margin that follows her moves, speaks once at the move where the precedent turned, lets her play it first, and turns it into questions on her draft ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--space-5)}
.draft{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.draft .t{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.fields{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-4);font-size:var(--type-small);line-height:var(--leading-small)}
.fields span:nth-child(odd){color:var(--ink-muted)}
.st{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-3);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-inset);font-size:var(--type-meta);line-height:var(--leading-meta);transition:border-color var(--motion-calm) var(--ease-out)}
.st .n{font-family:var(--font-mono);color:var(--ink-muted)}
.st .bk{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);white-space:nowrap}
.st .x{grid-column:2 / 4;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.st .seam{grid-column:2 / 4;border-left:2px solid var(--info);padding-left:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.st.out{border-color:var(--x-proposed-warn)}
.st.fixed{border-color:var(--x-proposed-lit)}
.margin{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.mg{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-pane);display:grid;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.mg .h{display:flex;align-items:center;gap:var(--space-2);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.mg.warn{border-color:var(--x-proposed-warn);background:var(--x-proposed-warn-wash)}
.mg .q{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.ch{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:var(--space-2);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);text-align:left;width:100%;font-size:var(--type-small);line-height:var(--leading-small)}
.ch .k{font-family:var(--font-mono);color:var(--ink-muted)}
.ch.mine{border-color:var(--light);background:var(--surface-raised)}
.ch .tag{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.m2{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:var(--space-2)}
.m2 .by{color:var(--ink-muted)}
.qq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline;padding:var(--space-1) 0;border-top:1px solid var(--hairline)}
.qq .s{font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.qq .s.ok{color:var(--x-proposed-lit)}
.quiet{color:var(--ink-muted)}
@media (max-width:1400px){.draft{padding:var(--space-3) var(--space-4);gap:var(--space-2)}.st{padding:var(--space-2) var(--space-3)}.mg{padding:var(--space-2) var(--space-3);gap:var(--space-1)}.margin{gap:var(--space-2)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V4</b> in book, while you draft: the margin follows her moves, speaks once where the precedent turned, lets her play that moment first, then asks three questions of her draft · learning V1 V2 V5 V6, collection V1</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = DATA.later.today;
const L = DATA.later, D = L.draft, Z = L.puzzle;
/* stages: 0 drafting (moves 1-2), 1 move 3 added: margin speaks, 2 she plays it, 3 questions, 4 draft changed */
const S = { st: 0 };
function stepHTML(m) {
  const fixed = S.st >= 4 && m.n === 3, out = S.st >= 1 && m.n === 3 && !fixed;
  if (fixed) return `<div class="st fixed fade"><span class="n">3.</span><span>Renew ${D.contractor} for six months with a break; notice once both fitters are in post</span><span class="bk">book line</span><span class="seam"><s>${m.san}</s> · changed after R-07 move 6</span></div>`;
  return `<div class="st ${out ? 'out' : ''}"><span class="n">${m.n}.</span><span>${m.san} ${m.door ? I('door-closed', 14) : ''}</span><span class="bk">${m.like === 6 ? (out ? 'R-07 turned here' : '') : 'in book · R-07 ' + m.like}</span><span class="x">${m.text}</span></div>`;
}
function render() {
  const moves = D.moves.slice(0, S.st >= 1 ? 3 : 2);
  $('#app').innerHTML = topHTML(['Mandate', 'Drafts', D.id], [['Space', 'next step'], ['R', 'replay']], { as: NOW }) +
  `<main class="main"><div class="wrap">
    <section class="draft pane scroll"><p class="lab">Draft · ${P(L.who).name} · for ${D.meeting} on ${dt(D.meets, 'short')}</p><p class="t">${D.title}</p>
      <div class="fields"><span>Kind</span><span>Change a contract · ${DATA.book.codes[D.code]} (${D.code})</span><span>Contract</span><span>${D.contractor}, ends ${dt(D.ends)}, three months’ notice</span><span>Vans</span><span>${D.vans}, inspected now at £${D.price} each</span></div>
      <p class="lab">Steps</p>${moves.map(stepHTML).join('')}
      ${S.st >= 4 ? `<div class="st fixed fade"><span class="n">4.</span><span>Line: revisit if more than 3 south depot vans are overdue</span><span class="bk">added</span></div>` : ''}
      <p class="small quiet" style="margin-top:auto">${I('lock', 12)} Your draft is yours until you send it. The margin reads it and tells nobody what you wrote.</p></section>
    <aside class="margin scroll" aria-live="polite">
      <div class="mg"><p class="h">${I('book-open', 12)} In book</p><p>Your first two steps follow <b class="lite">R-07</b> (${DEC.title.toLowerCase()}, ${DEC.made.slice(0, 4)}), ${DATA.results[DEC.result].toLowerCase()} after ${DEC.days} days.</p></div>
      ${S.st >= 1 ? `<div class="mg warn fade"><p class="h">${gl('?')} R-07 turned at this step</p><p>Your step 3 is R-07’s move 6: a one-way step before what it depends on. ${S.st === 1 ? 'Play that moment first, then read what happened.' : ''}</p>
        ${S.st >= 2 ? `<p class="q">${dt(Z.asAt)}. No fitter hired; Kestrel needs three months’ notice; clause 9 allows a break. You are the contracts manager.</p>
          ${Z.choices.map(c => `<button class="ch ${c.k === 'b' ? 'mine' : ''}"><span class="k">${c.k.toUpperCase()}</span><span>${c.san}</span><span class="tag">${c.played ? 'played · ' + mainMark(6).g : c.best ? 'R-03 · kept' : ''}${c.k === 'b' ? ' · yours' : ''}</span></button>`).join('')}
          ${ANN(6).filter(a => !a.pos).map(a => `<div class="m2">${gl(a.g, 'big')}<span>${a.line} <span class="by">· ${first(a.by)}${a.self ? ', own move' : ''}</span></span></div>`).join('')}
          <p class="quiet">${I('eye-off', 12)} Your choice is private.</p>` : `<button class="btn sm go">${I('play', 14)} Play it first</button>`}</div>` : `<div class="mg"><p class="quiet">${I('check', 12)} Nothing to say. The margin speaks only where a reviewed game turned.</p></div>`}
      ${S.st >= 3 ? `<div class="mg fade"><p class="h">${I('list-checks', 12)} What R-07 asks of your draft</p>
        <div class="qq"><span>Is what it depends on in place before the one-way step? <span class="quiet">(move 6)</span></span><span class="s ${S.st >= 4 ? 'ok' : ''}">${S.st >= 4 ? 'changed' : 'open'}</span></div>
        <div class="qq"><span>Does the costing count cover? <span class="quiet">(move 1)</span></span><span class="s">open</span></div>
        <div class="qq"><span>A trial with an end date, and a line? <span class="quiet">(moves 2, 3)</span></span><span class="s ${S.st >= 4 ? 'ok' : ''}">${S.st >= 4 ? 'line added' : 'open'}</span></div>
        <p class="quiet">Each can be kept with a reason; none blocks the draft. ${face(L.manager, 'sm')} <button class="btn sm">${I('message-square', 14)} Ask ${first(L.manager)} about move 6</button></p></div>` : ''}
    </aside>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.st = 0; render(); settle(); [1, 2, 3, 4].forEach((k, i) => later(() => { S.st = k; render(); }, MOMENT() + i * ms('--motion-slow'))); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key === ' ') { e.preventDefault(); clearLater(); S.st = (S.st + 1) % 5; render(); } });
replay();
</script>
</body>
</html>
