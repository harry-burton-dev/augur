<style>
/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; listed as
   "needs token" in the notes. Marks carried from earlier runs.
   --------------------------------------------------------------- */
:root{
  /* carried: six ways to be empty, stale hatch, not yours to see, warning edge, quiet, micro type, lit, pencil */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-warn: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-warn-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  --x-proposed-quiet: .62;
  --x-proposed-type-micro: .6875rem;
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  /* NEW in this run. the marks: tone only backs the glyph, never replaces it */
  --x-proposed-mark-good: var(--x-proposed-lit);
  --x-proposed-mark-info: color-mix(in srgb, var(--info) 75%, var(--ink));
  --x-proposed-mark-soft: color-mix(in srgb, var(--warning) 40%, var(--ink));
  --x-proposed-mark-bad: var(--x-proposed-warn);
  /* NEW. glyph pairs (!? ?!) set tight, as in print */
  --x-proposed-glyph-tracking: calc(var(--tracking-caps) * -1);
  /* NEW. the computed view's bar: the two halves of an evaluation bar */
  --x-proposed-eval-on: color-mix(in srgb, var(--light) 82%, transparent);
  --x-proposed-eval-off: var(--slate-deep);
  /* NEW. the far plane of a replay: what was not known yet, racked out of focus (focal planes) */
  --x-proposed-future-blur: var(--space-1);
  /* NEW. hindsight: anything known only after the move, on its own wash */
  --x-proposed-hindsight: color-mix(in srgb, var(--info) 7%, transparent);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.lite{color:var(--light)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}

.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}

/* floors */
[data-tier="department"]{--fc:var(--floor-department-high);--fl:var(--floor-department-low)}
[data-tier="team"]{--fc:var(--floor-team-high);--fl:var(--floor-team-low)}
[data-tier="org"]{--fc:var(--floor-org-high);--fl:var(--floor-org-low)}
[data-tier="you"]{--fc:var(--floor-you-high);--fl:var(--floor-you-low)}
.fchip{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap}
.fchip::before{content:"";width:var(--space-4);height:2px;background:var(--fc);border-radius:1px}
.who{color:var(--ink);white-space:nowrap;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--fc) 55%,transparent);text-underline-offset:var(--focus-gap);text-decoration-thickness:1px}
.face{display:inline-flex;align-items:center;justify-content:center;width:var(--target-sm);height:var(--target-sm);border-radius:var(--radius-pill);border:1px solid color-mix(in srgb,var(--fc) 60%,transparent);font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink);background:var(--surface-inset);flex:none}
.face.sm{width:calc(var(--space-5) - var(--space-1));height:calc(var(--space-5) - var(--space-1));font-size:var(--x-proposed-type-micro)}
.face.off{opacity:var(--x-proposed-quiet);border-style:dashed}

/* two registers: technical line one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* ---- the notation ---- */
.gl{display:inline-block;font:500 var(--type-meta)/1 var(--font-mono);letter-spacing:var(--x-proposed-glyph-tracking);color:var(--ink);min-width:1.4em;text-align:center;white-space:nowrap}
.gl-good{color:var(--x-proposed-mark-good)}
.gl-info{color:var(--x-proposed-mark-info)}
.gl-soft{color:var(--x-proposed-mark-soft)}
.gl-bad{color:var(--x-proposed-mark-bad)}
.gl-pos{color:var(--light);font-weight:400}
.gl-plain{color:var(--ink)}
.gl.big{font-size:var(--type-heading)}
.gl.huge{font-size:var(--type-title);font-weight:400}
.gl.second{opacity:var(--x-proposed-quiet)}
.door{display:inline-flex;vertical-align:-2px;color:var(--ink-muted)}
.did{display:inline-block;font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:3px var(--space-1);white-space:nowrap;vertical-align:1px}

/* the score sheet */
.mv{display:grid;grid-template-columns:2.2em var(--space-1) minmax(0,1fr) auto auto;gap:var(--space-2);align-items:center;width:100%;padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:background var(--motion-quick) var(--ease-standard)}
.mv:hover{background:var(--surface-raised)}
.mv.sel{background:var(--surface-raised);box-shadow:inset 2px 0 0 var(--light)}
.mv-n{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);text-align:right}
.mv-side{width:var(--space-1);height:var(--space-4);border-radius:1px;background:var(--light)}
.mv.world .mv-side{background:none;outline:1px solid var(--ink-muted);outline-offset:-1px}
.mv.world .mv-san{color:var(--ink-muted);font-style:italic}
.mv-san{min-width:0}
.mv-g{display:inline-flex;gap:var(--space-1)}
.mv-p{min-width:2em;text-align:right}
.mv.future{filter:blur(var(--x-proposed-future-blur)) saturate(0);opacity:var(--x-proposed-quiet);pointer-events:none}

/* the evaluation bar */
.eb{position:relative;display:inline-block;width:var(--space-3);height:100%;min-height:var(--space-6);background:var(--x-proposed-eval-off);border:1px solid var(--hairline-strong);border-radius:2px;overflow:hidden;vertical-align:middle}
.eb-on{position:absolute;left:0;right:0;top:0;background:var(--x-proposed-eval-on);transition:height var(--motion-calm) var(--ease-out),width var(--motion-calm) var(--ease-out)}
.eb::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--x-proposed-warn);opacity:.7}
.eb.flat{width:100%;height:var(--space-2);min-height:0}
.eb.flat .eb-on{top:0;bottom:0;right:auto}
.eb.flat::after{left:50%;top:0;bottom:0;width:1px;height:auto}
.eb-blind{position:absolute;inset:0;background:var(--x-proposed-unseen)}

/* the curve */
.cv{display:block;overflow:visible}
.cv-mid{stroke:var(--hairline-strong);stroke-width:1}
.cv-band{stroke:var(--hairline);stroke-width:1;stroke-dasharray:2 3}
.cv-area{fill:color-mix(in srgb,var(--light) 9%,transparent)}
.cv-ln{fill:none;stroke:var(--light);stroke-width:1.5;stroke-linejoin:round}
.cv-tick{stroke:var(--ink-muted);stroke-width:1}
.cv-tick.us{stroke:var(--ink)}
.cv-tick.sel{stroke:var(--light);stroke-width:2}
.cv-sel{stroke:var(--light);stroke-width:1;opacity:.5}
.cv-crit{fill:var(--slate-deep);stroke:var(--x-proposed-warn);stroke-width:1.5}
.cv-now{stroke:var(--light);stroke-width:1}

/* pencil and ink */
.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3)}
.pencil .pt{font-style:italic;color:var(--ink)}
.pencil .pl{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);margin:0 0 var(--space-1)}
.hind{background:var(--x-proposed-hindsight);border-left:2px solid var(--info);padding:var(--space-1) var(--space-2);border-radius:0 var(--radius-key) var(--radius-key) 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.hind .hl{font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--info);margin-right:var(--space-2)}
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);white-space:nowrap;transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard)}
.btn:hover{background:var(--surface-raised)}
.btn.go{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.btn.sm{height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-2);font-size:var(--type-small)}
.btn[aria-disabled="true"]{opacity:var(--x-proposed-quiet);cursor:not-allowed}
.btn.on{border-color:var(--light);background:var(--surface-raised);color:var(--light)}

/* app frame */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--slate-deep) 70%,transparent);min-width:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.crumb b{font-weight:400;color:var(--light)}
.crumb svg{opacity:var(--x-proposed-quiet);flex:none}
.asat{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.asat b{font-weight:400;color:var(--light)}
.top .hints{margin-left:auto;justify-content:flex-end}
.main{min-height:0;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));overflow:hidden}
.h1{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.h2{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.lab{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.small{font-size:var(--type-small);line-height:var(--leading-small)}
.meta{font-size:var(--type-meta);line-height:var(--leading-meta)}
.pane{background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset)}
.box{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline-strong);background:var(--surface-inset)}
.box.lit{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.box.warn{border-color:var(--x-proposed-warn);background:var(--x-proposed-warn-wash)}
.intro{display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap}
.intro .lede{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);max-width:var(--measure-wide)}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
.fade{animation:fade var(--motion-calm) var(--ease-out)}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}
.x-cap{max-width:calc(100vw - 2 * var(--edge-tight));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intro .h1{white-space:nowrap}
@media (max-width:1400px){.h1{font-size:var(--type-heading);line-height:var(--leading-heading);letter-spacing:var(--tracking-label)}}

/* ---- Marking V6: the rules put candidates on the table; the model may draft a sentence in pencil; only the reviewer marks ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.intro{grid-column:1 / -1}
.cands{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3);align-content:start}
.cd{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-pane);display:flex;flex-direction:column;gap:var(--space-2);transition:opacity var(--motion-calm) var(--ease-out),border-color var(--motion-calm) var(--ease-out)}
.cd .h{display:flex;align-items:baseline;gap:var(--space-3)}
.cd .h .n{font:300 var(--type-heading)/1 var(--font-mono);color:var(--ink-muted)}
.cd .h .s{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.cd .why{display:flex;gap:var(--space-1);flex-wrap:wrap}
.cd .why span{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);border:1px solid var(--hairline);border-radius:var(--radius-pill);padding:1px var(--space-2)}
.cd .dec{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-top:auto}
.cd.kept{border-color:var(--hairline-strong)}
.cd.hide{opacity:0}
.gw-off .pencil.model{display:none}
.gw-off .gwnote{display:flex}
.gwnote{display:none;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.side{min-height:0;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.side li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);padding:var(--space-2) 0;border-top:1px solid var(--hairline)}
.side b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.cd{padding:var(--space-2) var(--space-3);gap:var(--space-1)}.cands{gap:var(--space-2)}}
</style>

    '!':  { w: 'Good move',   say: 'Helped, and is worth repeating.',                                  tone: 'good' },

    words: 'That van inspections at the North depot move in-house from 1 July 2026, as a six-month trial, and that Kestrel’s servicing contract is reduced to breakdown cover when it renews on 1 September 2026.',

/* dates: ISO in the data, words on the page */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const dP = iso => { const [y, m, d] = iso.split('-').map(Number); return { y, m, d: d || 1 }; };
const dt = (iso, style = 'long') => { if (!iso) return ''; const { y, m, d } = dP(iso); if (iso.length === 7) return style === 'long' ? `${MONTH[m - 1]} ${y}` : MON[m - 1]; return style === 'short' ? `${d} ${MON[m - 1]}` : style === 'month' ? `${MON[m - 1]} ${y}` : `${d} ${MON[m - 1]} ${y}`; };
const ts = iso => Date.UTC(dP(iso).y, dP(iso).m - 1, dP(iso).d);
const days = (a, b) => Math.round((ts(b) - ts(a)) / 864e5);
const le = (a, b) => ts(a) <= ts(b);
const addDays = (iso, n) => new Date(ts(iso) + n * 864e5).toISOString().slice(0, 10);

/* the game */
const DEC = DATA.decision;
const MOVES = DATA.moves;
const MV = n => MOVES.find(m => m.n === n);
const ANN = n => DATA.annotations[n] || [];
const selfMark = n => ANN(n).find(a => a.self);
const reviewMarks = n => ANN(n).filter(a => !a.self && !a.pos);
const posMark = n => ANN(n).find(a => a.pos);
const mainMark = n => reviewMarks(n)[0];

/* ---- the computed view: read from the decision's own lines, as at a date. Never typed ---- */
function seriesAt(key, at) {
  const pts = DATA.series[key].pts.filter(([d]) => le(d, at));
  return pts.length ? pts[pts.length - 1][1] : DATA.series[key].pts[0][1];
}
const clamp = (v, a = -1, b = 1) => Math.max(a, Math.min(b, v));
function lineAt(L, at) {
  const v = seriesAt(L.series, at);
  if (L.kind === 'max') return { id: L.id, v, h: clamp((L.at - v) / L.at), crossed: v > L.at };
  if (L.kind === 'by') {
    const missing = Math.max(0, L.need - v);
    if (!missing) return { id: L.id, v, h: 1, crossed: false };
    if (ts(at) < ts(L.by)) { const el = clamp(days(L.from, at) / days(L.from, L.by), 0, 1); return { id: L.id, v, h: Math.max(0, 1 - 1.5 * el * missing / L.need), crossed: false, left: days(at, L.by) }; }
    return { id: L.id, v, h: -missing / L.need, crossed: true };
  }
  const share = (L.was - v) / (L.was - L.plan);
  return { id: L.id, v, h: clamp((share - 0.5) * 2), crossed: false, share };
}
function posAt(at) {
  const lines = DATA.lines.map(L => lineAt(L, at));
  const h = Math.min(...lines.map(l => l.h));
  const crossed = lines.filter(l => l.crossed).length;
  let p = DATA.positions.find(x => h >= x.min);
  if (crossed >= 2) p = DATA.positions[DATA.positions.length - 1];
  const weakest = lines.find(l => l.h === h);
  return { lines, h, crossed, s: p.s, w: p.w, say: p.say, rank: DATA.positions.indexOf(p), weakest };
}
const POS = s => DATA.positions.find(p => p.s === s);
const posOfMove = n => posAt(MV(n).on);
/* critical moments the records find: the position falls two steps, or a line is newly crossed */
function recordsCritical() {
  const out = [];
  MOVES.forEach((m, i) => { if (!i) return; const a = posOfMove(MOVES[i - 1].n), b = posOfMove(m.n);
    if (b.rank - a.rank >= 2 || b.crossed > a.crossed) out.push(m.n); });
  return out;
}
const peopleCritical = () => Object.keys(DATA.annotations).map(Number).filter(n => ANN(n).some(a => a.crit));

/* an action as at a date */
function actionAt(a, at) {
  if (!le(a.set, at)) return null;
  let due = a.due[0][1]; a.due.forEach(([on, d]) => { if (le(on, at)) due = d; });
  const moved = a.due.filter(([on]) => le(on, at)).length - 1;
  if (a.overtaken && le(a.overtaken, at)) return { s: 'overtaken', w: 'Overtaken by D-131', due, moved };
  if (a.done && le(a.done, at)) return { s: 'done', w: 'Done ' + dt(a.done, 'short'), due, moved };
  const late = ts(due) < ts(at);
  if (a.part && le(a.part[0], at)) return { s: late ? 'late' : 'part', w: a.part[1] + (late ? ' · late' : ''), due, moved };
  return { s: late ? 'late' : 'open', w: late ? 'Late' : 'Open', due, moved };
}
const recordAt = at => DATA.record.filter(r => le(r.on, at));

/* ---- marks ---- */
const MK = g => DATA.marks[g] || DATA.signs[g] || (g === DATA.unclear.s ? DATA.unclear : null) || POS(g) || { w: g };
const toneOf = g => (DATA.marks[g] || {}).tone || (POS(g) ? 'pos' : 'plain');
const gl = (g, cls = '') => `<span class="gl gl-${toneOf(g)} ${cls}" title="${MK(g).w}">${g}</span>`;
const posGl = (s, cls = '') => `<span class="gl gl-pos ${cls}" title="${POS(s).w} (from the records)">${s}</span>`;

/* the evaluation bar: light from the top is "on course", ground from the bottom is "off course" */
function evalBar(h, opts = {}) {
  const f = (clamp(h) + 1) / 2;
  const blind = opts.blind ? `<span class="eb-blind" title="${DATA.unclear.w}"></span>` : '';
  return `<span class="eb ${opts.flat ? 'flat' : ''}" role="img" aria-label="Computed position ${(h * 100).toFixed(0)} in a range of minus 100 to 100"><span class="eb-on" style="${opts.flat ? 'width' : 'height'}:${(f * 100).toFixed(1)}%"></span>${blind}</span>`;
}

/* the curve: the computed position over the game, with moves as ticks */
const G0 = MOVES[0].on, G1 = DEC.ended;
function curve(opts = {}) {
  const w = opts.w || 600, h = opts.h || 120, pad = opts.pad || 6, from = opts.from || G0, to = opts.to || addDays(G1, 6), upto = opts.upto || to;
  const X = d => pad + (ts(d) - ts(from)) / (ts(to) - ts(from)) * (w - 2 * pad);
  const Y = v => h / 2 - clamp(v) * (h / 2 - pad);
  const pts = []; for (let d = from; le(d, upto); d = addDays(d, 2)) pts.push([d, posAt(d).h]);
  const end = posAt(upto).h; pts.push([upto, end]);
  let path = ''; pts.forEach(([d, v], i) => { path += (i ? 'L' : 'M') + X(d).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; });
  const area = path + `L${X(upto).toFixed(1)} ${(h / 2).toFixed(1)} L${X(from).toFixed(1)} ${(h / 2).toFixed(1)} Z`;
  const bands = DATA.positions.slice(0, -1).map(p => `<line x1="${pad}" x2="${w - pad}" y1="${Y(p.min).toFixed(1)}" y2="${Y(p.min).toFixed(1)}" class="cv-band"/>`).join('');
  const rc = opts.crit === false ? [] : recordsCritical();
  const ticks = (opts.ticks === false ? [] : MOVES.filter(m => le(m.on, upto))).map(m => {
    const x = X(m.on).toFixed(1), sel = opts.sel === m.n;
    return `<line x1="${x}" x2="${x}" y1="${h - pad}" y2="${h - pad - (m.side === 'world' ? 4 : 7)}" class="cv-tick ${m.side} ${sel ? 'sel' : ''}"/>` +
      (rc.includes(m.n) ? `<circle cx="${x}" cy="${Y(posOfMove(m.n).h).toFixed(1)}" r="3.5" class="cv-crit"/>` : '') +
      (sel ? `<line x1="${x}" x2="${x}" y1="${pad}" y2="${h - pad}" class="cv-sel"/>` : '');
  }).join('');
  const nowx = opts.now ? `<line x1="${X(opts.now).toFixed(1)}" x2="${X(opts.now).toFixed(1)}" y1="0" y2="${h}" class="cv-now"/>` : '';
  const label = `Computed position from ${dt(from)} to ${dt(upto)}: ${MOVES.filter(m => le(m.on, upto)).map(m => 'move ' + m.n + ' ' + POS(posOfMove(m.n).s).w).join(', ')}`;
  return `<svg class="cv" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">
    <line x1="${pad}" x2="${w - pad}" y1="${h / 2}" y2="${h / 2}" class="cv-mid"/>${bands}
    <path d="${area}" class="cv-area"/><path d="${path}" class="cv-ln"/>${ticks}${nowx}</svg>`;
}
const curveX = (opts, d) => { const w = opts.w || 600, pad = opts.pad || 6, from = opts.from || G0, to = opts.to || addDays(G1, 6); return pad + (ts(d) - ts(from)) / (ts(to) - ts(from)) * (w - 2 * pad); };

/* a move as one row of a score sheet */
function moveRow(m, opts = {}) {
  const r = mainMark(m.n), s = selfMark(m.n), pm = posMark(m.n);
  const marks = opts.marks === false ? '' : `${r ? gl(r.g) : ''}${reviewMarks(m.n).length > 1 ? gl(reviewMarks(m.n)[1].g, 'second') : ''}${pm ? gl(pm.g) : ''}`;
  const pos = opts.pos ? posGl(posOfMove(m.n).s) : '';
  return `<button class="mv ${m.side} ${opts.sel === m.n ? 'sel' : ''} ${opts.cls || ''}" data-n="${m.n}" aria-label="Move ${m.n}, ${dt(m.on)}: ${esc(m.san)}">
    <span class="mv-n">${m.n}</span><span class="mv-side" aria-hidden="true"></span>
    <span class="mv-san">${m.san}${m.sign ? ' ' + gl(m.sign) : ''}${m.door ? ` <span class="door" title="Can’t be undone">${I('door-closed', 13)}</span>` : ''}</span>
    <span class="mv-g">${marks}</span>${pos ? `<span class="mv-p">${pos}</span>` : ''}</button>`;
}

/* ---- frame ---- */
const STATE = { tech: false };
function topHTML(crumbs, hints, opts = {}) {
  const fl = DATA.floors[opts.floor || DEC.floor];
  return `<header class="top"><p class="brand">AUGUR</p>
    <nav class="crumb" aria-label="Where you are">${crumbs.map((c, i) => (i ? I('chevron-right', 14) : '') + (i === crumbs.length - 1 ? `<b>${c}</b>` : `<span>${c}</span>`)).join('')}</nav>
    <span class="fchip" data-tier="${opts.floor || DEC.floor}">${fl.name} · ${fl.word}</span>
    ${opts.as ? `<span class="asat">${I('calendar', 14)} as at <b>${dt(opts.as)}</b></span>` : ''}
    <div class="hints">${hints.map(([k, w, id]) => `<span ${id ? `id="${id}"` : ''}><span class="kbd">${k}</span>${w}</span>`).join('')}</div></header>`;
}
function commonKeys(e, rerender, replay) {
  const k = e.key.toLowerCase();
  if (e.metaKey || e.ctrlKey || e.altKey) return false;
  if (e.target.closest && e.target.closest('input,textarea,[contenteditable="true"]')) return false;
  if (k === 'r') { replay(); return true; }
  if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); $('#h-t')?.classList.toggle('on', STATE.tech); return true; }
  return false;
}
/* timers for the moment, cleared on replay */
let TIMERS = [];
const later = (fn, t) => TIMERS.push(setTimeout(fn, reduced ? Math.min(t, 50) : t));
const clearLater = () => { TIMERS.forEach(clearTimeout); TIMERS = []; };
const MOMENT = () => ms('--motion-run');
function settle() { document.body.classList.add('pre'); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('pre'))); }

const S = { gw: true, shown: false };
/* candidates the rules find, with why. The model's draft is a pencil sentence the reviewer may keep or bin */
const CAND = [
  { n: 6, why: [['door-closed', 'one-way step']], draft: 'Notice was given before either fitter was hired; the contract allowed a break instead.' },
  { n: 10, why: [['trending-down', 'falls two steps'], ['eye', 'line crossed']], draft: 'No fitter in post on 1 August; the line set at the table is crossed.' },
  { n: 11, why: [['clock', 'no answer for 38 days']], draft: 'The chair noted the crossed line; no reason is recorded.' },
  { n: 12, why: [['door-closed', 'one-way step']], draft: 'Kestrel stops inspecting with no fitter in post.' },
  { n: 15, why: [['eye', 'line crossed']], draft: '5 of 18 vans overdue, over the line of 4.' },
  { n: 8, why: [['calendar-clock', 'date moved, line not']], draft: 'The action’s date moved to 31 August; the line stayed at 1 August.' }
];
function render() {
  $('#app').innerHTML = topHTML(['Mandate', 'Reviews', DEC.id, 'Candidates'], [['G', 'model gateway', 'h-g'], ['R', 'replay']], { as: DATA.review.held }) +
  `<main class="main"><div class="wrap ${S.gw ? '' : 'gw-off'}">
    <div class="intro"><h1 class="h1">Found by rule, marked by people</h1><p class="lede">Engines show where the evaluation dropped; players decide what it meant. Here the records’ rules put candidate moments on the table with their reason. The model may draft a sentence for each, in pencil. Only the reviewer marks.</p></div>
    <section class="cands scroll">${CAND.map((c, i) => { const m = MV(c.n), r = mainMark(c.n);
      return `<div class="cd ${S.shown ? '' : 'hide'} ${r ? 'kept' : ''}" style="transition-delay:calc(var(--motion-instant) * ${i})"><div class="h"><span class="n">${c.n}.</span><span class="s">${m.san}</span></div>
        <div class="why">${c.why.map(([ic, w]) => `<span>${I(ic, 11)} ${w}</span>`).join('')}<span>${posGl(posOfMove(c.n).s)} ${POS(posOfMove(c.n).s).w.toLowerCase()}</span></div>
        <div class="pencil model"><p class="pl">${I('pencil', 11)} drafted by the model, from the records only</p><p class="pt">${c.draft}</p></div>
        <div class="dec">${m.side === 'world' ? `<span class="small muted">A world move: no mark. The reviewer marks the answer to it${c.n === 10 ? ' (11)' : c.n === 12 ? ' (13)' : c.n === 15 ? ' (16)' : ''}.</span>` : r ? `${gl(r.g, 'big')}<span class="small">marked by ${first(r.by)}${r.line && r.line !== c.draft ? ', in his own words' : ''}</span>` : `<button class="btn sm">${I('check', 14)} Keep as a moment</button><button class="btn sm">${I('x', 14)} Not critical</button>`}</div></div>`; }).join('')}</section>
    <aside class="side pane scroll"><p class="eyebrow">What each voice did here</p><ul>
      <li>${I('activity', 16)}<span><b>The records</b> found ${CAND.length} candidates by rule. They can’t find move 4: an untested assumption leaves no trace in the numbers until it fails.</span></li>
      <li>${I('pencil', 16)}<span><b>The model</b> drafted one sentence each from the same records, in pencil. It never marks, and never sees the people’s own marks.</span></li>
      <li>${I('user-round', 16)}<span><b>The reviewer</b> kept 4 of these, marked 6, 8 and 11 in his own words, and added move 4 and 13 himself.</span></li></ul>
      <p class="gwnote">${I('plug-zap', 14)} Model gateway off: the drafts are gone. Every candidate, mark and line is still here.</p>
      <p class="small muted" style="margin-top:auto">Turning the model gateway off changes the work, never the review. G toggles it.</p></aside>
  </div></main>`;
  Icons.hydrate($('#app'));
  $('#h-g')?.classList.toggle('on', !S.gw);
}
function replay() { clearLater(); S.shown = false; S.gw = true; render(); settle(); later(() => { S.shown = true; $$('.cd').forEach(c => c.classList.remove('hide')); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key.toLowerCase() === 'g') { S.gw = !S.gw; render(); } });
replay();
</script>
</body>
</html>
