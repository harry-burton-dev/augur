<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The backbrief and drift · V4 · The work drifts</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: work drifting off the intent, worked out from the team's own records: where the gangs' hours went, week by week, and what that does to done-looks-like. A question to the owner, never an alarm ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:var(--space-6)}
.chart{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-3);min-height:0}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-5);align-items:end;padding:0 var(--space-4);border-bottom:1px solid var(--hairline-strong);position:relative;min-height:0}
.wk{display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-2);height:100%;transition:opacity var(--motion-calm) var(--ease-out)}
.wk.wait{opacity:0}
.stack{display:flex;flex-direction:column-reverse;height:100%;width:55%;justify-self:center;border-radius:var(--radius-key) var(--radius-key) 0 0;overflow:hidden}
.stack i{display:flex;align-items:center;justify-content:center;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--slate-deep)}
.stack .lg{background:color-mix(in srgb,var(--ink) 55%,transparent)}
.stack .cu{background:color-mix(in srgb,var(--x-proposed-drift) 60%,transparent);color:var(--slate-deep)}
.stack .ot{background:var(--hairline-strong);color:var(--ink)}
.wk .tp{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);text-align:center}
.wk .tp b{display:block;font:300 var(--type-heading)/1 var(--font-sans);color:var(--light)}
.axis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-5);padding:0 var(--space-4);font-size:var(--type-small);color:var(--ink-muted);text-align:center}
.legend{display:flex;gap:var(--space-4);font-size:var(--type-small);color:var(--ink-muted);flex-wrap:wrap}
.legend span{display:inline-flex;gap:var(--space-2);align-items:center}
.sw{width:var(--space-3);height:var(--space-3);border-radius:2px;display:inline-block}
.side{display:grid;gap:var(--space-4);align-content:start}
.proj{display:grid;gap:var(--space-2)}
.proj .big{font:200 var(--type-display)/1 var(--font-sans);color:var(--light)}
.proj .big span{font-size:var(--type-heading);color:var(--ink-muted)}
.q{display:grid;gap:var(--space-3);padding:var(--space-4);border-left:2px solid var(--x-proposed-drift);background:var(--x-proposed-drift-wash);transition:opacity var(--motion-calm) var(--ease-out)}
.q.wait{opacity:0}
.q .btns{display:grid;gap:var(--space-2)}
.q .btns .btn{justify-content:flex-start}
@media (max-width:1400px){.bars{gap:var(--space-4)}.axis{gap:var(--space-4)}.proj .big{font-size:var(--type-title)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>The backbrief and drift · V4</b> the work drifts: where the gangs’ hours went and what it does to done; a question, not an alarm · cross-track error</div>
<script>
/*@DATA@*/
/*@LIB@*/
ME = 'p4';
const W = DATA.workDrift, n = N(W.intent), t = TASK(W.intent, W.task), f = FACT('leaksFixed');
const S = { k: 3, answer: null };
function render() {
  $('#app').innerHTML = topHTML(['Mandate', F('team').name, W.intent, 'Drift'], [['1–3', 'answer'], ...STD], 'team') +
  `<main class="main"><div class="wrap">
    <section class="chart"><div><p class="eyebrow">${ichip(W.intent, { short: true })} ${W.task} · ${t.w}</p><h1 class="h">Where the repair gangs’ hours went</h1></div>
      <div class="bars" aria-label="Share of gang hours by week">${W.weeks.map((w, i) => `<div class="wk ${i >= S.k ? 'wait' : ''}"><span class="tp"><b>${W.largest[i]}%</b>on the largest</span>
        <div class="stack"><i class="lg" style="height:${W.largest[i]}%">${W.fixedPerWeek[i]} fixed</i><i class="cu" style="height:${W.customer[i]}%">${W.customer[i]}%</i><i class="ot" style="height:${W.other[i]}%"></i></div></div>`).join('')}</div>
      <div class="axis">${W.weeks.map(w => `<span>${w}</span>`).join('')}</div>
      <p class="legend"><span><i class="sw" style="background:color-mix(in srgb,var(--ink) 55%,transparent)"></i>the ${f.target} largest leaks (${W.task})</span><span><i class="sw" style="background:var(--x-proposed-drift)"></i>customer-reported small leaks (no intent)</span><span><i class="sw" style="background:var(--hairline-strong)"></i>other</span></p>
    </section>
    <aside class="side" aria-live="polite">
      <div class="proj"><p class="eyebrow">${f.w}, at this rate</p><p class="big">${S.k >= 4 ? W.projected : '—'} <span>of ${W.target} by ${W.by}</span></p>
        <p class="small muted">${f.now} fixed so far; ${W.needPerWeek} a week needed, ${W.fixedPerWeek[Math.min(S.k, 4) - 1]} last week. Worked out from the repair log, not estimated.</p>
        <span class="drift small">${W.largest[0]}% → ${W.largest[Math.min(S.k, 4) - 1]}% of hours on the task</span></div>
      <div class="q ${S.k >= 4 ? '' : 'wait'}"><p class="eyebrow">Asked once · of ${P(ME).name}</p><p class="small">${W.why} The intent says largest first. Does it still?</p>
        ${S.answer ? `<p class="small lite">${S.answer}</p><p class="micro muted">Recorded on ${W.intent}. Not asked again unless the share falls below ${W.largest.at(-1) - 10}%.</p>` : `<div class="btns">
          <button class="btn sm" data-a="1"><span class="kbd">1</span> Keep the intent; steer the gangs back</button>
          <button class="btn sm" data-a="2"><span class="kbd">2</span> Amend ${W.intent}: small leaks are part of it now</button>
          <button class="btn sm" data-a="3"><span class="kbd">3</span> Ask ${first(N('DEP-14').owner)}: it touches DEP-14 K2</button></div>`}</div>
      <p class="small muted">Drift is a question for the owner, in a muted warm mark, never red and never in the Letterbox. Nobody did anything wrong: the work followed the calls.</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('[data-a]').forEach(b => b.onclick = () => answer(+b.dataset.a));
}
function answer(i) { S.answer = [null, `Kept. The gangs go back to the largest first from Monday; small leaks fit around them, as ${first(DATA.backbriefs.find(b => b.said && /customer leaks/.test(b.said)).who)} said it back.`, `Amend opened on ${W.intent}: a new draft will say how small leaks fit, and be said back again.`, `Asked ${P(N('DEP-14').owner).name}, with this chart attached.`][i]; render(); }
function replay() { clearLater(); S.k = 3; S.answer = null; settle(); render(); later(() => { S.k = 4; render(); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; const k = +e.key; if (S.k >= 4 && !S.answer && k >= 1 && k <= 3) answer(k); });
replay();
</script>
</body>
</html>
