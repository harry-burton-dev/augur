<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The backbrief and drift · V1 · Say it back</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: before work starts, the holder says the intent back in their own words. Each phrase is matched to the part it covers; what wasn't said is shown, and the owner confirms or corrects ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:var(--space-6)}
.intent{display:grid;gap:var(--space-2);align-content:start;min-height:0}
.part{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-3);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);transition:background var(--motion-base) var(--ease-standard)}
.part .mk{color:var(--ink-muted);display:flex;align-items:center}
.part.cov .mk{color:var(--x-proposed-lit)}
.part.miss .mk{color:var(--x-proposed-standby)}
.part.miss{background:var(--x-proposed-standby-wash)}
.part.hot{outline:1px solid var(--x-proposed-thread)}
.part.nm{opacity:var(--x-proposed-quiet)}
.words mark.own{border-bottom-style:dashed;border-bottom-color:var(--x-proposed-freedom)}
.sec{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-top:var(--space-2)}
.said{display:grid;gap:var(--space-4);align-content:start}
.words{padding:var(--space-4) var(--space-5);font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-1));color:var(--ink);font-weight:300}
.words mark{background:none;color:var(--light);border-bottom:1px solid var(--x-proposed-thread);cursor:pointer}
.words mark sup{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-thread);margin-left:2px}
.reply{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-left:2px solid var(--fc);transition:opacity var(--motion-calm) var(--ease-out)}
.reply.wait{opacity:0}
.reply .h{display:flex;gap:var(--space-3);align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
.reply p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.today{padding:var(--space-3) var(--space-4);border-left:2px solid var(--x-proposed-drift);background:var(--x-proposed-drift-wash);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
@media (max-width:1400px){.words{font-size:var(--type-body);line-height:var(--leading-lead);padding:var(--space-3) var(--space-4)}.wrap{gap:var(--space-5)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>The backbrief and drift · V1</b> say it back: own words matched to the parts they cover; what wasn’t said shows; the owner confirms · Bungay</div>
<script>
/*@DATA@*/
/*@LIB@*/
const BB = DATA.backbriefs[0], n = N('TM-31'), who = BB.who;
const S = { matched: false, reply: false, hot: null };
function parts() {
  return [['Purpose', [['purpose', n.purpose]]], ['Done looks like', n.end.map((e, i) => ['end' + i, e.w])], ['Key tasks', n.tasks.map((t, i) => ['task' + i, t.w])], ['Freedom', n.freedom.map((f, i) => ['free' + i, f])],
    ['Limits', limitsOf('TM-31').map(l => [l.id, l.id + ' · ' + l.w])]];
}
function wordsHTML() {
  let t = BB.said;
  BB.spans.forEach(([ph, part, lab]) => { t = t.replace(ph, `<mark data-h="${part}" class="${part === 'own' ? 'own' : ''}">${ph}<sup>${lab}</sup></mark>`); });
  return S.matched ? t : BB.said;
}
function render() {
  const ring = !S.reply ? 'open' : 'corrected';
  const missLim = BB.misses.filter(m => LIMIT(m));
  $('#app').innerHTML = topHTML(['Mandate', F('team').name, 'TM-31', 'Said back'], [['Space', 'Sam replies'], ...STDG], 'team') +
  `<main class="main"><div class="wrap">
    <section class="intent scroll" aria-label="The intent"><p class="eyebrow">${ichip('TM-31')} · ${P(n.owner).name}</p>
      ${parts().map(([h, ls]) => `<p class="sec">${h}</p>${ls.map(([k, w]) => { const cov = S.matched && BB.covers.includes(k), miss = S.matched && BB.misses.includes(k), nm = S.matched && BB.notMine.includes(k);
        return `<div data-k="${k}" class="part ${cov ? 'cov' : ''} ${miss ? 'miss' : ''} ${nm ? 'nm' : ''} ${S.hot === k ? 'hot' : ''}"><span class="mk">${S.matched ? I(cov ? 'check' : miss ? 'circle-dashed' : 'minus', 14) : ''}</span><span>${w}${nm ? ' <span class="micro muted">· others’ part</span>' : ''}</span></div>`; }).join('')}`).join('')}
    </section>
    <section class="said" aria-live="polite">
      <div><p class="eyebrow">${ringHTML(ring)} ${P(who).name} says it back · ${BB.at}</p></div>
      <div class="words inset">${wordsHTML()}</div>
      ${S.matched ? `<p class="small muted">${STATE.gateway ? `Matched in pencil by a model, phrase to part; ${first(who)} ticked each before sending.` : `The model gateway is off: ${first(who)} ticks which part each phrase covers; nothing else changes.`} Covered: ${BB.covers.length} parts, and one limit of his own the intent doesn’t have. Not said: the freedom, and ${missLim.join(', ')}. ${first(n.owner)} sees both before confirming.</p>` : ''}
      <div class="reply ${S.reply ? '' : 'wait'}" data-tier="team"><span class="h">${ringHTML('corrected')} ${P(BB.correction.by).name} confirms, with one correction</span><p>${BB.correction.w}</p>
        <span class="small muted">Confirmed with ${missLim.length} inherited limits not said back. They still bind; the record shows they weren’t said.</span></div>
      ${S.reply ? `<div class="today">${I('history', 14)} ${DATA.today}, ${ITEM(BB.bit.item).t}: ${BB.bit.limit} (${LIMIT(BB.bit.limit).w.toLowerCase()}) is in the morning’s first rank. It was one of the limits not said back on ${BB.at}.</div>` : ''}
    </section></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('mark[data-h]').forEach(m => { m.onmouseenter = () => { S.hot = m.dataset.h; $$('.part').forEach(p => p.classList.toggle('hot', p.dataset.k === S.hot)); }; }); /* in place: no re-render under the pointer */
}
function replay() { clearLater(); S.matched = false; S.reply = false; S.hot = null; settle(); render(); later(() => { S.matched = true; render(); }, MOMENT()); later(() => { S.reply = true; render(); }, MOMENT() + ms('--motion-spin')); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key === ' ') { e.preventDefault(); S.reply = !S.reply; S.matched = true; render(); } });
replay();
</script>
</body>
</html>
