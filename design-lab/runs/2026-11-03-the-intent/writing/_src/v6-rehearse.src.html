<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Writing an intent · V6 · Rehearse on last winter</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: before it is passed down, the draft is played against surprises that really happened. Each one points at the line that answers it, or finds the gap ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:var(--space-6)}
.draft{display:grid;gap:2px;align-content:start;min-height:0}
.ln{display:grid;grid-template-columns:calc(var(--space-6) + var(--space-1)) minmax(0,1fr);gap:var(--space-3);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:background var(--motion-base) var(--ease-standard),color var(--motion-base) var(--ease-standard)}
.ln b{font:500 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.ln.hit{background:var(--x-proposed-thread-wash);color:var(--light);outline:1px solid var(--x-proposed-thread);outline-offset:-1px}
.ln.add{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash)}
.sec{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-top:var(--space-2)}
.reh{display:grid;gap:var(--space-3);align-content:start;min-height:0}
.case{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);text-align:left;transition:border-color var(--motion-base) var(--ease-standard),opacity var(--motion-calm) var(--ease-out)}
.case .hd{display:flex;gap:var(--space-3);align-items:baseline}
.case .hd .d{font-family:var(--font-mono);font-size:var(--type-small);color:var(--ink-muted)}
.case .hd b{font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.case .a{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);display:flex;gap:var(--space-2);align-items:flex-start}
.case .a .ic{flex:none;padding-top:1px}
.case.ok .a .ic{color:var(--x-proposed-lit)}
.case.gap{border-color:var(--x-proposed-drift)}
.case.gap .a .ic{color:var(--x-proposed-drift)}
.case.cur{border-color:var(--x-proposed-thread)}
.case.wait{opacity:var(--x-proposed-quiet)}
.case .refs{display:flex;gap:var(--space-2);flex-wrap:wrap}
.case .refs span{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--x-proposed-thread);border:1px solid var(--x-proposed-thread);border-radius:var(--radius-key);padding:0 var(--space-1)}
.sug{display:grid;gap:var(--space-2);padding:var(--space-2) var(--space-3)}
.sug .btns{display:flex;gap:var(--space-2)}
@media (max-width:1400px){.ln{padding:1px var(--space-2)}.case{padding:var(--space-2) var(--space-3)}.case .a.what{display:none}.wrap{gap:var(--space-5)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Writing an intent · V6</b> rehearse on last winter: each real surprise finds its line in the draft, or the gap · rehearsal of concept</div>
<script>
/*@DATA@*/
/*@LIB@*/
ME = 'p3';
const n = N('DEP-14'), LW = DATA.lastWinter;
const S = { k: 0, sel: null, added: false };
function lines() {
  return [['Done looks like', n.end.map((e, i) => ['E' + (i + 1), e.w])], ['Key tasks', n.tasks.map(t => [t.id, t.w])], ['Limits', limitsOf('DEP-14').map(l => [l.id, l.w])],
    ['Freedom', n.freedom.map((f, i) => ['F' + (i + 1), f]).concat(S.added ? [['F' + (n.freedom.length + 1), LW[2].suggest, 'add']] : [])], ['Branches', n.branches.map(b => [b.id, b.if + ': ' + b.then])]];
}
function render() {
  const cur = S.sel != null ? S.sel : S.k - 1, refs = cur >= 0 ? LW[cur].refs : [];
  $('#app').innerHTML = topHTML(['Mandate', F('department').name, 'DEP-14 draft', 'Rehearse'], [['1–3', 'case'], ['A', 'add'], ...STDG], 'department') +
  `<main class="main"><div class="wrap">
    <section class="draft scroll" aria-label="Draft"><p class="eyebrow">${ichip('DEP-14', { short: true })} · draft 3, before it is passed down</p>
      ${lines().map(([h, ls]) => `<p class="sec">${h}</p>${ls.map(([id, w, add]) => `<div class="ln ${refs.includes(id) ? 'hit' : ''} ${add ? 'add' : ''}"><b>${id}</b><span>${w}</span></div>`).join('')}`).join('')}
    </section>
    <section class="reh scroll" aria-live="polite"><p class="eyebrow">Played against last winter · ${LW.length} surprises from the control log</p>
      ${LW.map((c, i) => { const run = i < S.k, gap = run && !c.answered && !(S.added && i === 2);
        return `<button class="case ${!run ? 'wait' : gap ? 'gap' : 'ok'} ${i === cur ? 'cur' : ''}" data-c="${i}"><span class="hd"><span class="d">${c.d}</span><b>${c.w}</b></span>
          ${!run ? '<span class="a muted">Not played yet</span>' : c.answered || (S.added && i === 2) ? `<span class="a"><span class="ic">${I('check', 14)}</span><span>Answered: ${c.answered || 'by the new freedom line'}</span></span>${c.what ? `<span class="a what muted"><span class="ic"></span><span>A controller at 03:00 would: ${c.what}</span></span>` : ''}<span class="refs">${(c.refs.length ? c.refs : ['F' + (n.freedom.length + 1)]).map(r => `<span>${r}</span>`).join('')}</span>` : `<span class="a"><span class="ic">${I('circle-dashed', 14)}</span><span>Not answered. ${c.missing}</span></span>`}
        </button>${gap ? `<div class="sug ${STATE.gateway ? 'pencil' : 'inset'}">${STATE.gateway ? `<span class="pt">Add to freedom: “${c.suggest}”</span><span class="micro muted">pencil · a model drafted the words from the case; you decide whether and how</span>` : '<span class="small muted">The model gateway is off. Write the line yourself, or leave the gap and say so to the teams.</span>'}<span class="btns"><button class="btn sm" data-add>${I('plus', 14)} Add as freedom <span class="kbd">A</span></button></span></div>` : ''}`; }).join('')}
      <p class="small muted">${S.k >= LW.length ? `${LW.filter(c => c.answered).length + (S.added ? 1 : 0)} of ${LW.length} answered. A gap found now costs a line; found at 03:00 it costs a phone call, or a guess.` : 'Each case asks: under this draft alone, would a controller know what to do?'}</p>
    </section></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('[data-c]').forEach(b => b.onclick = () => { S.sel = +b.dataset.c; render(); });
  $('[data-add]')?.addEventListener('click', add);
}
function add() { S.added = true; S.sel = 2; render(); }
function replay() { clearLater(); S.k = 0; S.sel = null; S.added = false; settle(); render(); LW.forEach((_, i) => later(() => { S.k = i + 1; render(); }, MOMENT() + i * ms('--motion-spin'))); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; const k = +e.key; if (k >= 1 && k <= LW.length) { S.k = Math.max(S.k, k); S.sel = k - 1; render(); } if (e.key.toLowerCase() === 'a' && S.k >= LW.length && !S.added) add(); });
replay();
</script>
</body>
</html>
