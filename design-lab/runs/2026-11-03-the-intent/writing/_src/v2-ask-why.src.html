<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Writing an intent · V2 · Ask “so that?”</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: start from what you want done and keep asking "so that?" until the answer is the intent above. The rung below the meeting is the purpose ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,1fr);gap:var(--space-7)}
.climb{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:0;min-height:0}
.step{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr);gap:var(--space-4);align-items:start;transition:opacity var(--motion-calm) var(--ease-out)}
.step .k{font:400 var(--x-proposed-type-micro)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:right;padding-top:var(--space-3)}
.step .card{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);display:grid;gap:var(--space-1)}
.step .card q{quotes:none;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);font-weight:300}
.step .card p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.step.method .card{border-style:dashed;background:none}
.step.method .card q{color:var(--ink)}
.step.purpose .card{border-color:var(--x-proposed-thread);background:var(--x-proposed-thread-wash)}
.step.meets .card{border-color:var(--fc);background:none}
.ask{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr);gap:var(--space-4);height:calc(var(--space-6) + var(--space-2));align-items:center}
.ask .ln{justify-self:center;width:1px;height:100%;background:var(--x-proposed-thread)}
.ask span.so{font-size:var(--type-small)}
.side{display:grid;align-content:start;gap:var(--space-4)}
.cand{display:grid;gap:var(--space-2)}
.cand .t{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.cand .t b{font:500 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.cand .t.hit{border-color:var(--floor-org-high);color:var(--light)}
.cand .t .pen{font-size:var(--x-proposed-type-micro);color:var(--ink-muted)}
.out{padding:var(--space-4);display:grid;gap:var(--space-2)}
.out dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2) var(--space-4);font-size:var(--type-small);line-height:var(--leading-small)}
.out dt{color:var(--ink-muted)}
.out dd{margin:0;color:var(--ink)}
.hidden{opacity:0}
@media (max-width:1400px){.wrap{gap:var(--space-5)}.step .card q{font-size:var(--type-body);line-height:var(--leading-body)}.ask{height:var(--space-6)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Writing an intent · V2</b> ask “so that?” until the answer is the intent above; the rung below is the purpose · why-how laddering</div>
<script>
/*@DATA@*/
/*@LIB@*/
ME = 'p3';
const L = DATA.whyLadder, TOP = L[L.length - 1], up = N(TOP.meets[0]);
const S = { shown: 1 };
const KW = { method: 'how', end: 'done', purpose: 'purpose', meets: 'meets' };
function render() {
  const met = S.shown >= L.length;
  $('#app').innerHTML = topHTML(['Mandate', F('department').name, 'New intent', 'So that?'], [['Space', 'ask so that?'], ...STDG], 'department') +
  `<main class="main"><div class="wrap">
    <section class="climb" aria-label="Asking so that">
      ${L.map((st, i) => `${i ? `<div class="ask ${i < S.shown ? '' : 'hidden'}"><span class="ln"></span><span class="so">${I('arrow-up', 12)} so that?</span></div>` : ''}
        <div class="step ${st.as} ${i < S.shown ? '' : 'hidden'}" ${st.as === 'meets' ? `data-tier="${up.floor}"` : ''}><span class="k">${KW[st.as]}</span>
          <div class="card"><q>${st.w}</q><p>${st.as === 'meets' ? `Meets ${TOP.meets[0]} ${TOP.meets[1]}: ${TASK(TOP.meets[0], TOP.meets[1]).w}. Stop climbing: above here is the Org’s intent, not yours.` : met ? st.becomes : i === S.shown - 1 ? 'Answer “so that?” in a few words.' : st.becomes}</p></div></div>`).join('')}
    </section>
    <aside class="side">
      <div class="cand"><p class="eyebrow">What it could meet · ${ichip(TOP.meets[0])}</p>
        ${up.tasks.map(t => { const hit = met && t.id === TOP.meets[1]; const sug = STATE.gateway && S.shown === L.length - 1 && t.id === TOP.meets[1]; return `<div class="t ${hit ? 'hit' : ''} ${sug ? 'pencil' : ''}"><b>${t.id}</b><span>${t.w}</span>${hit ? I('check', 14) : sug ? '<span class="pen">pencil: likely this one</span>' : ''}</div>`; }).join('')}
        <p class="small muted">${STATE.gateway ? 'A model may point at the likely task in pencil. Only you choose; nothing climbs on its own.' : 'The model gateway is off. You choose the task it meets; nothing changes.'}</p></div>
      <div class="out inset ${met ? '' : 'hidden'}" aria-live="polite"><p class="eyebrow">What the climb wrote</p>
        <dl><dt>Serves</dt><dd>${ichip(TOP.meets[0], { short: true })} ${TOP.meets[1]}</dd>${L.slice(0, -1).reverse().map(st => `<dt>${st.as === 'method' ? 'Set aside' : PART(st.as).w}</dt><dd>${st.becomes.replace(/^[^:]+: /, '')}</dd>`).join('')}</dl>
        <p class="small muted">The first thing you wrote was method. It isn’t lost: the teams read it as one way, not the way.</p></div>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function step() { if (S.shown < L.length) { S.shown++; render(); } }
function replay() { clearLater(); S.shown = 1; settle(); render(); L.slice(1).forEach((_, i) => later(step, MOMENT() + i * ms('--motion-spin'))); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key === ' ') { e.preventDefault(); if (S.shown >= L.length) S.shown = 1; else S.shown++; render(); } });
replay();
</script>
</body>
</html>
