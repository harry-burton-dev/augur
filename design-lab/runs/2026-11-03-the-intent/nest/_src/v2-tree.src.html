<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The nest · V2 · The lit path</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: the whole nest as a tree. Your chain to the Org is the lit path; everything else is the far plane, there and readable, never hidden ---- */
.wrap{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:var(--space-4)}
.tree{position:relative;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:var(--space-4);min-height:0}
.row{display:flex;justify-content:center;align-items:center;gap:var(--space-3);position:relative;z-index:1}
.row .lbl{position:absolute;left:0;top:50%;transform:translateY(-50%);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.node{display:grid;gap:2px;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);max-width:calc(var(--measure-card) * .62);text-align:left;transition:filter var(--motion-slow) var(--ease-standard),opacity var(--motion-slow) var(--ease-standard),border-color var(--motion-slow) var(--ease-standard)}
.node .t{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.node .o{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.node.far{filter:saturate(.35);opacity:var(--x-proposed-quiet)}
.node.on{border-color:var(--x-proposed-lit);box-shadow:0 0 var(--space-4) color-mix(in srgb,var(--x-proposed-lit) 18%,transparent)}
.node.on .t{color:var(--light)}
.node.sel{outline:var(--focus-ring) solid var(--x-proposed-thread);outline-offset:var(--focus-gap)}
.node.restricted{background:var(--x-proposed-unseen),var(--surface-inset)}
svg.links{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
svg.links path{fill:none;stroke:var(--hairline-strong);stroke-width:1}
svg.links path.lit{stroke:var(--x-proposed-lit);stroke-width:2;transition:stroke-dashoffset var(--motion-spin) var(--ease-out)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);gap:var(--space-5);padding:var(--space-3) var(--space-4);font-size:var(--type-small);line-height:var(--leading-small)}
.detail .p{color:var(--ink)}
@media (max-width:1400px){.node{max-width:calc(var(--measure-card) * .5);padding:var(--space-1) var(--space-2)}.node .o{display:none}.row .lbl{display:none}.detail{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}.detail > :last-child{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>The nest · V2</b> the lit path: the whole nest as a tree; your chain to the Org is lit, the rest is the far plane · cinematic lit path, Hoshin cascade</div>
<script>
/*@DATA@*/
/*@LIB@*/
const CH = DATA.chain, ROWS = ['org', 'department', 'team', 'you'];
const S = { drawn: false, sel: CH[0] };
const all = Object.keys(DATA.intents);
const childrenOf = id => all.filter(k => N(k).serves === id);
function rowIds(fl) { if (fl === 'org') return ['ORG-07']; if (fl === 'department') return all.filter(k => floorOf(k) === 'department'); if (fl === 'team') return childrenOf('DEP-14'); return childrenOf('TM-31'); }
function render() {
  const sel = N(S.sel);
  $('#app').innerHTML = topHTML(['Mandate', 'The nest'], [['←→', 'along the path'], ...STD], 'team') +
  `<main class="main"><div class="wrap">
    <section class="tree" id="tree" aria-label="All intents you can see"><svg class="links" id="links" aria-hidden="true"></svg>
      ${ROWS.map(fl => `<div class="row"><span class="lbl">${F(fl).word}</span>${rowIds(fl).map(k => { const n = N(k), on = CH.includes(k);
        return `<button class="node ${on ? 'on' : 'far'} ${k === S.sel ? 'sel' : ''} ${n.restricted ? 'restricted' : ''}" data-tier="${n.floor}" data-id="${k}">${ichip(k, { short: true, ring: n.restricted ? null : n.state === 'force' ? 'confirmed' : 'open' })}<span class="t">${n.restricted ? 'Restricted' : n.title}</span><span class="o">${P(n.owner).name}</span></button>`; }).join('')}</div>`).join('')}
    </section>
    <section class="detail inset" aria-live="polite">
      <div>${ichip(S.sel, { lg: true })}<p class="muted" style="margin-top:var(--space-1)">${P(sel.owner).name} · ${sel.dept || sel.team || F(sel.floor).name}</p></div>
      <div class="p">${sel.restricted ? `You can’t open it. ${P(sel.owner).name} holds it; it is shown because it serves ${sel.serves}.` : sel.purpose || `${sel.title}. Serves ${sel.serves} ${sel.servesPart}${sel.serves && TASK(sel.serves, sel.servesPart) ? ': ' + TASK(sel.serves, sel.servesPart).w : ''}.`}</div>
      <div class="muted">${CH.includes(S.sel) ? `On your path: ${CH.indexOf(S.sel) === 0 ? 'your own part' : CH.indexOf(S.sel) <= 2 ? `${CH.indexOf(S.sel)} up, read in full` : 'three up, one line unless opened'}.` : 'Off your path: readable here; it doesn’t rank what reaches you.'}</div>
    </section></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('[data-id]').forEach(b => b.onclick = () => { S.sel = b.dataset.id; render(); });
  requestAnimationFrame(draw);
}
function draw() {
  const W = $('#tree').getBoundingClientRect();
  $('#links').innerHTML = all.filter(k => N(k).serves && $(`[data-id="${k}"]`) && $(`[data-id="${N(k).serves}"]`)).map(k => {
    const a = $(`[data-id="${k}"]`).getBoundingClientRect(), b = $(`[data-id="${N(k).serves}"]`).getBoundingClientRect();
    const x1 = a.left + a.width / 2 - W.left, y1 = a.top - W.top, x2 = b.left + b.width / 2 - W.left, y2 = b.bottom - W.top, my = (y1 + y2) / 2;
    const lit = CH.includes(k) && CH.includes(N(k).serves);
    return `<path class="${lit ? 'lit' : ''}" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" ${lit ? `pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:${S.drawn ? 0 : 1}"` : ''}/>`;
  }).join('');
}
function replay() { clearLater(); S.drawn = false; S.sel = CH[0]; settle(); render(); later(() => { S.drawn = true; $$('#links path.lit').forEach(p => p.style.strokeDashoffset = 0); S.sel = CH[2]; $$('.node').forEach(n => n.classList.toggle('sel', n.dataset.id === S.sel)); }, MOMENT()); later(render, MOMENT() + ms('--motion-spin')); }
addEventListener('resize', draw);
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) { requestAnimationFrame(draw); return; } const i = CH.indexOf(S.sel); if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { S.sel = CH[Math.min(CH.length - 1, Math.max(0, i) + 1)]; render(); } if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { S.sel = CH[Math.max(0, i - 1)]; render(); } });
replay();
</script>
</body>
</html>
