<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The nest · V1 · Floors as bands</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
:root{--x-proposed-far-blur:calc(var(--space-1) * .2); /* NEW: far-plane softening for text, a fraction of the shapes blur */}
/* ---- V1: the nest as the four floors, stacked. Your chain is the lit path; floor travel racks focus from band to band; two levels up in full, further up folded ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-3)}
.bands{display:grid;grid-template-rows:auto auto auto auto;gap:var(--space-2);min-height:0;position:relative}
.band{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-5)) minmax(0,1.5fr) minmax(0,1fr);gap:var(--space-5);align-items:center;padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:linear-gradient(90deg,color-mix(in srgb,var(--fl) 22%,transparent),transparent 60%);transition:filter var(--motion-slow) var(--ease-standard),opacity var(--motion-slow) var(--ease-standard),border-color var(--motion-slow) var(--ease-standard)}
.band.far{filter:saturate(.35) blur(var(--x-proposed-far-blur));opacity:var(--x-proposed-quiet)}
.band.near{border-color:var(--fc)}
.band .fl{display:grid;gap:2px}
.band .fl b{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fc)}
.band .fl span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.mine{display:grid;gap:var(--space-1);position:relative;padding-left:var(--space-4)}
.mine::before{content:"";position:absolute;left:0;top:calc(var(--space-2) * -2);bottom:calc(var(--space-2) * -2);width:2px;background:var(--x-proposed-lit);box-shadow:0 0 var(--space-3) color-mix(in srgb,var(--x-proposed-lit) 50%,transparent);opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.lit .mine::before{opacity:.8}
.mine .tt{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.mine p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);max-width:var(--measure-read)}
.mine .srv{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.band.folded .mine .tt{font-size:var(--type-meta);line-height:var(--leading-meta)}
.band.folded .mine p,.band.folded .mine .srv{display:none}
.sib{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);align-content:center}
.sib .ichip{color:var(--ink-muted)}
.sib .lbl{width:100%;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.rule2{font-size:var(--type-small);color:var(--ink-muted);display:flex;gap:var(--space-4);flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){.band{transition:opacity var(--motion-base) linear}.band.far{filter:none}}
@media (max-width:1400px){.band{grid-template-columns:calc(var(--space-8) + var(--space-2)) minmax(0,1.5fr) minmax(0,1fr);padding:var(--space-2) var(--space-3);gap:var(--space-4)}.mine .tt{font-size:var(--type-body);line-height:var(--leading-body)}.mine p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>The nest · V1</b> floors as bands: your chain is the lit path; floor travel racks focus; two up in full, further up folded · cinematic focal planes, ADP 6-0</div>
<script>
/*@DATA@*/
/*@LIB@*/
const CH = DATA.chain, FL = ['org', 'department', 'team', 'you'];
const S = { focus: 'you', lit: false };
const chainOn = fl => CH.find(id => floorOf(id) === fl);
function sibsOn(fl) { const mine = chainOn(fl); return Object.keys(DATA.intents).filter(k => k !== mine && floorOf(k) === fl && N(k).sibling && (fl !== 'you' || N(k).serves === CH[1])); }
function render() {
  $('#app').innerHTML = topHTML(['Mandate', 'The nest'], [['↑↓', 'floor travel'], ...STD], S.focus === 'you' ? 'team' : S.focus) +
  `<main class="main"><div class="wrap ${S.lit ? 'lit' : ''}">
    <p class="rule2"><span>${P(ME).name} · ${P(ME).role}</span><span>${I('eye', 14)} Two levels up in full: your part, ${F('team').name}, ${F('department').name}</span><span>${I('fold-vertical', 14)} Further up: one line, open it any time</span></p>
    <section class="bands" aria-label="Your intents by floor">${FL.map(fl => { const id = chainOn(fl), n = N(id), lvl = CH.indexOf(id), folded = lvl > 2;
      return `<div class="band ${S.focus === fl ? 'near' : 'far'} ${folded ? 'folded' : ''}" data-tier="${fl}" data-fl="${fl}">
        <div class="fl"><b>${F(fl).word}</b><span>${fl === 'you' ? P(ME).name : F(fl).name}</span><span class="tk">${lvl === 0 ? 'own part' : lvl === 1 ? 'one level up' : lvl === 2 ? 'two levels up' : 'beyond two levels'}</span></div>
        <div class="mine"><span>${ichip(id, { short: true, ring: n.state === 'force' ? 'confirmed' : 'open' })} <span class="micro muted">${P(n.owner).name}${folded ? ' · folded, three up' : ''}</span></span><span class="tt">${n.title}</span><p>${n.purpose}</p>${n.serves ? `<span class="srv"><span class="so">so that</span> ${n.serves} ${n.servesPart}: ${TASK(n.serves, n.servesPart).w}</span>` : ''}</div>
        <div class="sib"><span class="lbl">${fl === 'you' ? `others’ parts of ${CH[1]}` : `beside it on this floor`}</span>${sibsOn(fl).map(k => `${ichip(k, { ring: N(k).restricted ? null : N(k).state === 'force' ? 'confirmed' : 'open' })}`).join('') || '<span class="small muted">none</span>'}</div>
      </div>`; }).join('')}</section>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('[data-fl]').forEach(b => b.onclick = () => { S.focus = b.dataset.fl; apply(); });
}
/* rack focus in place, so the blur and the lit path move rather than redraw */
function apply() { $$('.band').forEach(b => { b.classList.toggle('near', b.dataset.fl === S.focus); b.classList.toggle('far', b.dataset.fl !== S.focus); }); $('.wrap').classList.toggle('lit', S.lit); }
function travel(d) { const i = FL.indexOf(S.focus); S.focus = FL[Math.max(0, Math.min(FL.length - 1, i + d))]; apply(); }
function replay() { clearLater(); S.focus = 'you'; S.lit = false; settle(); render(); later(() => { S.lit = true; S.focus = 'department'; apply(); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key === 'ArrowUp') travel(-1); if (e.key === 'ArrowDown') travel(1); });
replay();
</script>
</body>
</html>
