<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The nest · V3 · The X-matrix, unfolded</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: Hoshin's X-matrix, unfolded to its two working quadrants: key tasks on every floor against the measures they move, and who holds each. Gaps show both ways ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,var(--measure-card));gap:var(--space-6)}
.mx{display:grid;align-content:start;min-height:0;overflow:auto}
table{border-collapse:collapse;font-size:var(--type-small);line-height:var(--leading-small)}
th,td{padding:var(--space-2) var(--space-2);border-bottom:1px solid var(--hairline);text-align:left;vertical-align:middle}
thead th{vertical-align:bottom;font-weight:400;color:var(--ink-muted);border-bottom-color:var(--hairline-strong)}
thead th.m{width:calc(var(--space-7) + var(--space-2));text-align:center}
thead th.m span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
thead th.m .num{display:block;color:var(--ink-muted);font-size:var(--x-proposed-type-micro)}
td.c{text-align:center}
.dot{display:inline-block;width:var(--space-3);height:var(--space-3);border-radius:50%;vertical-align:middle}
.dot.s2{background:var(--ink)}
.dot.s1{border:1.5px solid var(--ink-muted)}
tr.grp td{padding-top:var(--space-3);border-bottom:0}
tr.gap td.task{color:var(--ink-muted)}
tr.gap td.c.none{color:var(--x-proposed-drift);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-soft)}
tr.hi td{background:var(--x-proposed-thread-wash)}
td.c.hi,th.m.hi{background:var(--x-proposed-thread-wash)}
td.task b{font:500 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);margin-right:var(--space-2)}
td.own{color:var(--ink-muted);white-space:nowrap}
tfoot td{color:var(--ink-muted);border-bottom:0}
tfoot td.c{font-family:var(--font-mono)}
tfoot td.c.thin{color:var(--x-proposed-drift)}
.side{display:grid;gap:var(--space-4);align-content:start}
.find{display:grid;gap:var(--space-1);padding:var(--space-3);border-left:2px solid var(--x-proposed-drift);background:var(--x-proposed-drift-wash)}
.find b{font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.find p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.legend{display:flex;gap:var(--space-4);font-size:var(--type-small);color:var(--ink-muted);align-items:center;flex-wrap:wrap}
@media (max-width:1400px){th,td{padding:var(--space-1) var(--space-1)}thead th.m{width:calc(var(--space-6) + var(--space-3))}thead th.m span{font-size:var(--x-proposed-type-micro);line-height:1.3}.wrap{grid-template-columns:minmax(0,1fr) 250px;gap:var(--space-4)}td.own{display:none}th.own{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>The nest · V3</b> the X-matrix, unfolded: key tasks on every floor against the measures they move; gaps both ways · Hoshin Kanri X-matrix (Akao)</div>
<script>
/*@DATA@*/
/*@LIB@*/
ME = 'p1';
const X = DATA.xmatrix, M = X.measures;
const S = { col: null, found: false };
function render() {
  const tot = m => sum(X.rows, r => r.m[m] || 0);
  const noMeasure = X.rows.filter(r => !Object.keys(r.m).length);
  const thin = M.filter(m => !X.rows.some(r => r.m[m] === 2));
  let last = null;
  $('#app').innerHTML = topHTML(['Mandate', F('org').name, 'Across the floors'], [['←→', 'measure'], ...STD], 'org') +
  `<main class="main"><div class="wrap">
    <section class="mx"><table aria-label="Key tasks against measures">
      <thead><tr><th>Key task</th>${M.map((m, i) => `<th class="m ${S.col === i ? 'hi' : ''}"><span>${FACT(m).w}</span><span class="num">${FACT(m).target}${FACT(m).unit === '%' ? '%' : ' ' + FACT(m).unit} · ${FACT(m).by}</span></th>`).join('')}<th class="own">Holds it</th></tr></thead>
      <tbody>${X.rows.map(r => { const g = r.iid !== last; last = r.iid; const n = N(r.iid), t = TASK(r.iid, r.t), none = !Object.keys(r.m).length;
        return `${g ? `<tr class="grp"><td colspan="${M.length + 2}">${ichip(r.iid)}</td></tr>` : ''}<tr class="${none && S.found ? 'gap' : ''}"><td class="task"><b>${r.t}</b>${t.w}</td>${M.map((m, i) => `<td class="c ${S.col === i ? 'hi' : ''} ${none && i === 0 && S.found ? 'none' : ''}">${r.m[m] ? `<span class="dot s${r.m[m]}" title="${r.m[m] === 2 ? 'moves it directly' : 'helps'}"></span>` : none && i === 0 && S.found ? 'no measure' : ''}</td>`).join('')}<td class="own">${P(n.owner).name}</td></tr>`; }).join('')}</tbody>
      <tfoot><tr><td>Tasks moving it</td>${M.map((m, i) => `<td class="c ${S.found && thin.includes(m) ? 'thin' : ''} ${S.col === i ? 'hi' : ''}">${X.rows.filter(r => r.m[m]).length}</td>`).join('')}<td class="own"></td></tr></tfoot>
    </table>
    <p class="legend" style="margin-top:var(--space-3)"><span><span class="dot s2"></span> moves it directly</span><span><span class="dot s1"></span> helps</span><span class="tk">X-matrix quadrants: tactics × metrics, tactics × owners; breakthrough objectives are the intents’ purposes</span></p></section>
    <aside class="side" aria-live="polite"><p class="eyebrow">What the grid shows ${P(ME).name}</p>
      ${S.found ? `${noMeasure.map(r => `<div class="find"><b>${r.iid} ${r.t} moves no measure</b><p>“${TASK(r.iid, r.t).w}” has no fact to check it against. ${N('DEP-11').dept} holds it (${ichip('DEP-11', { short: true })}); done looks like should name one, or the task can only be argued about.</p></div>`).join('')}
        ${thin.map(m => `<div class="find"><b>${FACT(m).w}: no task moves it directly</b><p>${X.rows.filter(r => r.m[m]).length} tasks help it while doing something else. Normal for a line that is really a limit; worth knowing before a freeze.</p></div>`).join('')}` : '<p class="small muted">Reading the rows…</p>'}
      <p class="small muted">The full X-matrix also crosses objectives with each other and owners with tasks. The two quadrants here are the ones people act on: does each task move something we can check, and does each measure have tasks behind it?</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.found = false; S.col = null; settle(); render(); later(() => { S.found = true; render(); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key === 'ArrowRight') { S.col = S.col == null ? 0 : Math.min(M.length - 1, S.col + 1); render(); } if (e.key === 'ArrowLeft') { S.col = S.col == null ? 0 : Math.max(0, S.col - 1); render(); } });
replay();
</script>
</body>
</html>
