<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Kept · V5 · The ledger</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Kept V5: the working as a bound ledger. Each entry is dated and signed, lists the facts it read with their word at the time, and what those facts say now ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,var(--measure-drawer));gap:var(--space-5)}
.book{min-height:0;border-left:3px double var(--hairline-strong);padding-left:var(--space-5);display:flex;flex-direction:column;gap:0}
.en{display:grid;grid-template-columns:calc(var(--space-8) - var(--space-3)) minmax(0,1fr);gap:var(--space-4);padding:var(--space-3) 0;border-bottom:1px solid var(--hairline);transition:opacity var(--motion-calm) var(--ease-out)}
.hold .en{opacity:0}
.en .d{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.en .body{display:grid;gap:var(--space-2);min-width:0}
.en .res{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.facts{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr);gap:2px var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.facts .h{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.facts .now{color:var(--ink)}
.facts .now.moved{color:var(--light)}
.facts .now.moved::before{content:"→ ";color:var(--x-proposed-seam)}
.sig{display:flex;gap:var(--space-4);flex-wrap:wrap;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.sig b{font-weight:400;color:var(--ink)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Kept · V5</b> the ledger: each technique dated, signed, with the facts it read then and what they say now · laboratory notebooks, chain of custody</div>
<script>
/*@DATA@*/
/*@LIB@*/
const LT = DATA.later;
/* what each technique read, from its own record */
const READ = { outside: ['tenders'], ach: X.rows.map(r => r.fact), kac: DATA.assumptions.map(a => a.fact).filter(Boolean), pre: ['lowmoor2', 'county'] };
const PENCIL = { ach: 'proposed “crews moved”: taken, untested', pre: 'proposed one reason: taken, sorted as a watch' };
const S = { shown: false };
function render() {
  $('#app').innerHTML = topHTML(['Mandate', DATA.decision.id, 'Working', 'Ledger'], [...STD]) +
  `<main class="main"><div class="wrap ${S.shown ? '' : 'hold'}">
    <div class="book scroll">${DATA.working.map((w, i) => { const fs = [...new Set(READ[w.tid])];
      return `<div class="en" style="transition-delay:calc(${i} * var(--motion-quick))"><span class="d">${w.on}</span><div class="body">
        <div style="display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap">${tq(w.tid, 16)}<span class="small muted">said ${w.said} min · took ${w.took}</span><span class="tk">${T(w.tid).tech}</span></div>
        <p class="res">${w.result}</p>
        <div class="facts"><span class="h">Read · ${plural(fs.length, 'fact')}</span><span class="h">Word then</span><span class="h">Now, ${LT.today}</span>
          ${fs.slice(0, 5).map(f => `<span>${DATA.facts[f].say}</span>${yw(f)}<span class="now ${LT.factsNow[f] ? 'moved' : ''}">${LT.factsNow[f] || 'unchanged'}</span>`).join('')}${fs.length > 5 ? `<span class="muted">and ${fs.length - 5} more</span><span></span><span></span>` : ''}</div>
        <div class="sig"><span>Signed <b>${w.by.map(p => P(p).name).join(', ')}</b></span><span>Changed: <b>${w.changed}</b></span>${STATE.gateway && PENCIL[w.tid] ? `<span>${I('pencil', 10)} assistant ${PENCIL[w.tid]}</span>` : ''}</div>
      </div></div>`; }).join('')}</div>
    <aside class="col scroll" style="display:flex;flex-direction:column;gap:var(--space-3)">
      <div class="card"><p class="lbl">Why a ledger</p><p class="small">Entries are added, never edited. Each one keeps the facts as they were read, with the word they had, so a reader a year on can see what the people deciding could see, and what has moved since.</p></div>
      <div class="card"><p class="lbl">Moved since</p><p class="small">${Object.keys(LT.factsNow).length} facts the working read have moved. None of them reverses a result; the arrows show where a reader might ask.</p></div>
      ${gatewayNote()}
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.shown = false; settle(); render(); later(() => { S.shown = true; $('.wrap').classList.remove('hold'); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) { markKeys(); } });
replay();
</script>
</body>
</html>
