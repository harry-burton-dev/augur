<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Kept · V3 · The score</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Kept V3: a year on, every tested judgement is scored against what happened: the forecast, the explanation, each assumption, each premortem reason ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,var(--measure-drawer));gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
table{width:100%;border-collapse:collapse;font-size:var(--type-small);line-height:var(--leading-small)}
th,td{padding:var(--space-1) var(--space-3);border-bottom:1px solid var(--hairline);text-align:left;vertical-align:top}
th{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);font-weight:400}
tr.sec td{padding-top:var(--space-3);border-bottom:0}
tr.sec td .tq{font-size:var(--type-meta)}
td.now{color:var(--light);transition:opacity var(--motion-calm) var(--ease-out)}
td.now .o{display:inline-flex;align-items:center;gap:var(--space-1)}
td.now .o.no{color:var(--ink-muted)}
td.now .o.cant{color:var(--ink-muted)}
.hold td.now{opacity:0}
.big{font:200 var(--type-title-s)/1 var(--font-mono);color:var(--light)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Kept · V3</b> the score: a year on, each tested judgement set against what happened · Tetlock and Gardner (2015) keeping score, after-action review</div>
<script>
/*@DATA@*/
/*@LIB@*/
const LT = DATA.later;
/* plain outcome words → a mark; the outcome text itself is from the record */
const OUT = t => /^held|^happened/.test(t) ? ['yes', 'check'] : /^partly/.test(t) ? ['part', 'circle-dot'] : /^can’t tell|^not tested/.test(t) ? ['cant', 'circle-dashed'] : ['no', 'minus'];
const S = { shown: false };
function render() {
  const as = DATA.assumptions, rs = DATA.premortem.reasons.filter(r => STATE.gateway || !r.pencil);
  const held = as.filter(a => OUT(LT.assumptions[a.id])[0] === 'yes'), solid = as.filter(a => markOf(a) === 'solid');
  const happened = rs.filter(r => ['yes', 'part'].includes(OUT(LT.reasons[r.id])[0]));
  const row = (then, now, extra = '') => { const [k, ic] = OUT(now); return `<tr><td>${then}</td><td>${extra}</td><td class="now"><span class="o ${k}">${I(ic, 12)}${now}</span></td></tr>`; };
  $('#app').innerHTML = topHTML(['Mandate', DATA.decision.id, 'The score'], [...STD]) +
  `<main class="main"><div class="wrap ${S.shown ? '' : 'hold'}">
    <section class="col scroll"><p class="eyebrow">${DATA.decision.id} · scored ${LT.today}, a year after ${DATA.decision.on} · for ${P(LT.reader).name}</p>
      <table><thead><tr><th>What the working said</th><th>Its mark then</th><th>What happened</th></tr></thead><tbody>
        <tr class="sec"><td colspan="3">${tq('outside', 14)}</td></tr>
        ${row(`${DATA.outsideView.question}`, (LT.forecast.happened ? 'happened: ' : 'didn’t: ') + LT.forecast.note.lc(), `${LT.forecast.said}`)}
        <tr class="sec"><td colspan="3">${tq('ach', 14)}</td></tr>
        ${row(X.result, 'held: ' + LT.ach.charAt(0).lc() + LT.ach.slice(1), 'least against')}
        <tr class="sec"><td colspan="3">${tq('kac', 14)}</td></tr>
        ${as.map(a => row(a.say, LT.assumptions[a.id], amk(markOf(a)))).join('')}
        <tr class="sec"><td colspan="3">${tq('pre', 14)}</td></tr>
        ${rs.map(r => row(r.say, LT.reasons[r.id], r.pencil ? '<span class="pen">assistant</span>' : first(r.by))).join('')}
      </tbody></table></section>
    <aside class="col scroll">
      <div class="card"><p class="lbl">Assumptions</p><p><span class="big">${held.length}</span> <span class="muted">of ${as.length} held</span></p><p class="small">All ${solid.length} marked solid held. The one marked unsupported held a week late, and was caught by its watch.</p></div>
      <div class="card"><p class="lbl">Premortem reasons</p><p><span class="big">${happened.length}</span> <span class="muted">of ${rs.length} happened, at least partly</span></p><p class="small">Two were caught by the watch they had become. The tender one wasn’t: AUGUR couldn’t see the date pass, so it started 12 days late. The reason nobody could watch can’t be scored.</p></div>
      <div class="card"><p class="lbl">The floor’s record</p><p class="small">${LT.record.forecasts} forecasts scored on ${F('fac').name}. ${LT.record.sameAsSaid}: about right.</p><p class="small muted">One decision proves nothing. The score is kept so that, over years, a floor can see whether its “about half” means half.</p></div>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.shown = false; settle(); render(); later(() => { S.shown = true; $('.wrap').classList.remove('hold'); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) { markKeys(); } });
replay();
</script>
</body>
</html>
