<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Kept · V1 · How it was tested</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Kept V1: the decision record a year on, with a "how it was tested" section under the words: one line per technique, what it found and what it changed ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,var(--measure-drawer));gap:var(--space-6)}
.rec{min-height:0;display:flex;flex-direction:column;gap:var(--space-4);padding-right:var(--space-3)}
.hd{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--light);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:0 var(--space-3);line-height:1.8}
.status i{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--ink)}
.words{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);border-left:2px solid var(--ink);padding-left:var(--space-4)}
.tested{display:grid;gap:0}
.tr{display:grid;grid-template-columns:minmax(200px,.9fr) minmax(0,1.6fr) minmax(0,1fr);gap:var(--space-4);padding:var(--space-3) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);transition:background var(--motion-base) var(--ease-standard)}
.tr .t{display:grid;gap:var(--space-1);align-content:start}
.tr .t .meta2{color:var(--ink-muted)}
.tr .res{color:var(--ink)}
.tr .ch{color:var(--light)}
.tr .ch::before{content:"Changed: ";color:var(--ink-muted)}
.tr.hot{background:var(--x-proposed-lit-wash)}
.tr{transition:opacity var(--motion-calm) var(--ease-out)}
.hold .tr{opacity:0}
.weak{border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4);display:grid;gap:var(--space-2)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Kept · V1</b> how it was tested: the decision record carries one line per technique, what it found and what it changed · UK JIC scope notes, decision records (ADRs)</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = DATA.decision, LT = DATA.later;
const S = { shown: false, hot: null };
function render() {
  const wk = A(D.weakest);
  $('#app').innerHTML = topHTML(['Mandate', F('fac').name, 'Decisions', D.id], [['1–4', 'a technique'], ...STD]) +
  `<main class="main"><div class="wrap ${S.shown ? '' : 'hold'}">
    <article class="rec scroll">
      <div class="hd"><p class="eyebrow">${D.id} · ${D.body} · ${D.on} · read by ${P(LT.reader).name}, ${LT.today}</p><span class="status"><i></i>In force</span></div>
      <p class="words">${D.words}</p>
      <p class="small muted">Answers ${DATA.intent.id} “${DATA.intent.title}”. Chaired by ${P(D.chair).name}. A ${DATA.intent.kind.lc()} decision asks for ${DATA.yardstick[DATA.intent.bar].word.lc()} or better.</p>
      <div class="weak"><p class="lbl">Decided below its bar, with a hedge</p><p class="small">No surer than its weakest assumption: <b class="lite">${wk.say}</b> ${amk(markOf(wk))}</p><div class="hedge">${D.hedge}</div></div>
      <div><p class="eyebrow" style="margin-bottom:var(--space-2)">How it was tested · ${DATA.working.length} techniques, ${sum(DATA.working, w => w.took)} minutes</p>
        <div class="tested">${DATA.working.map((w, i) => `<div class="tr ${S.hot === i ? 'hot' : ''}" style="transition-delay:calc(${i} * var(--motion-quick))"><div class="t">${tq(w.tid, 14)}<span class="tk">${T(w.tid).tech}</span><span class="meta2">${w.on} · ${mins(w.took)} · ${w.by.map(first).join(', ')}</span></div><span class="res">${w.result}</span><span class="ch">${w.changed}</span></div>`).join('')}</div></div>
    </article>
    <aside class="side scroll">
      <div class="card"><p class="lbl">Its watches</p>${DATA.watches.map(w => watchHTML(w, { listens: false })).join('')}</div>
      <div class="card"><p class="lbl">Not run, and why</p>${D.notRun.map(n => `<p class="small">${T(n.tid).name}: ${n.why}.</p>`).join('')}</div>
      ${STATE.gateway ? `<div class="card"><p class="lbl">Pencil in the working</p><p class="small">The assistant proposed one explanation and one premortem reason. Both were taken by a person; neither changed a mark.</p></div>` : gatewayNote()}
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.shown = false; S.hot = null; settle(); render(); later(() => { S.shown = true; $('.wrap').classList.remove('hold'); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (/^[1-4]$/.test(e.key)) { S.hot = +e.key - 1; render(); }
});
replay();
</script>
</body>
</html>
