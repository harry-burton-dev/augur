<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Grammar · V5 · Priced in minutes</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">

<style>
/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; listed as
   "needs token" in each notes.md. Carried marks first, then new.
   --------------------------------------------------------------- */
:root{
  /* carried: quiet, micro type, lit, not yours to see, sources disagree, pencil, seam */
  --x-proposed-quiet: .62;
  --x-proposed-type-micro: .6875rem;
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  --x-proposed-seam: color-mix(in srgb, var(--info) 70%, var(--ink));
  --x-proposed-seam-wash: color-mix(in srgb, var(--info) 8%, transparent);
  /* carried from the briefing: ink by yardstick rung; brightness only steps down, never a traffic light */
  --x-proposed-rung-0: var(--light);
  --x-proposed-rung-1: color-mix(in srgb, var(--light) 70%, var(--ink));
  --x-proposed-rung-2: var(--ink);
  --x-proposed-rung-3: color-mix(in srgb, var(--ink-muted) 85%, transparent);
  --x-proposed-rung-4: color-mix(in srgb, var(--ink-muted) 60%, transparent);
  /* NEW: a mark against an explanation. Heavier ink, never red: "against" is information, not alarm */
  --x-proposed-against: color-mix(in srgb, var(--light) 85%, var(--warning));
  /* NEW: one cell of the competing-explanations grid, a fixed size so grids compare across questions */
  --x-proposed-cell: 2.75rem;
  /* NEW: the hedge, the fallback a decision names for an assumption below its bar */
  --x-proposed-hedge: color-mix(in srgb, var(--info) 55%, var(--ink));
  /* NEW: the imagined future of a premortem, a far plane: cooler, never mistaken for today */
  --x-proposed-future-wash: color-mix(in srgb, var(--floor-org-high) 7%, transparent);
  --x-proposed-future: color-mix(in srgb, var(--floor-org-high) 60%, var(--ink));
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.lite{color:var(--light)}
.small{font-size:var(--type-small);line-height:var(--leading-small)}
.meta{font-size:var(--type-meta);line-height:var(--leading-meta)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.hints .on{color:var(--x-proposed-lit)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.title{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0}
.h{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);letter-spacing:var(--tracking-tight)}
.lead{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)}
.sent{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)}
.sent b{font-weight:400;color:var(--light)}
.rule{height:1px;background:linear-gradient(90deg,var(--hairline-strong),transparent)}
.pane{background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);backdrop-filter:blur(var(--surface-blur))}
.inset{background:var(--surface-inset);border:1px solid var(--hairline);border-radius:var(--radius-inset)}
.card{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);display:grid;gap:var(--space-2);align-content:start;min-width:0}
.card > h3,.lbl{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}

/* floors */
[data-tier="department"]{--fc:var(--floor-department-high);--fl:var(--floor-department-low)}
[data-tier="team"]{--fc:var(--floor-team-high);--fl:var(--floor-team-low)}
[data-tier="org"]{--fc:var(--floor-org-high);--fl:var(--floor-org-low)}
[data-tier="you"]{--fc:var(--floor-you-high);--fl:var(--floor-you-low)}
.fchip{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap}
.fchip::before{content:"";width:var(--space-4);height:2px;background:var(--fc);border-radius:1px}

/* two registers: the technique's trade name and source one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* the time a technique asks for, always said before it starts */
.mins{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink);white-space:nowrap}
.mins svg{opacity:var(--x-proposed-quiet)}
.mins.over{color:var(--x-proposed-disagree)}

/* a technique's name tag */
.tq{display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap;color:var(--light)}
.tq svg{flex:none;opacity:.85}

/* the confidence word from the yardstick (computed, never typed) */
.yw{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);white-space:nowrap;color:var(--rc,var(--ink))}
.yw .st{display:inline-flex;gap:1px;vertical-align:1px}
.yw .st i{width:var(--space-1);height:var(--space-2);background:var(--hairline-strong);border-radius:1px}
.yw .st i.on{background:var(--rc,var(--ink))}
.r0{--rc:var(--x-proposed-rung-0)}.r1{--rc:var(--x-proposed-rung-1)}.r2{--rc:var(--x-proposed-rung-2)}.r3{--rc:var(--x-proposed-rung-3)}.r4{--rc:var(--x-proposed-rung-4)}
.yw.dispute{color:var(--x-proposed-disagree)}
.yw.gap,.yw.hidden{color:var(--ink-muted)}

/* assumption marks: solid, with caveats, unsupported, and two that can't be marked */
.amk{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);white-space:nowrap;color:var(--ink)}
.amk i{flex:none;width:var(--space-3);height:var(--space-3);border-radius:2px;border:1.5px solid var(--ink)}
.amk.solid i{background:var(--light);border-color:var(--light)}
.amk.solid{color:var(--light)}
.amk.caveats i{background:linear-gradient(0deg,var(--ink) 50%,transparent 50%)}
.amk.unsupported i{border-style:dashed;border-color:var(--ink-muted)}
.amk.unsupported{color:var(--ink-muted)}
.amk.gap i{border:0;background:
  linear-gradient(var(--ink-muted),var(--ink-muted)) 0 0/4px 1.5px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) 0 0/1.5px 4px no-repeat,
  linear-gradient(var(--ink-muted),var(--ink-muted)) 100% 100%/4px 1.5px no-repeat,linear-gradient(var(--ink-muted),var(--ink-muted)) 100% 100%/1.5px 4px no-repeat}
.amk.gap,.amk.hidden{color:var(--ink-muted)}
.amk.hidden i{border-color:var(--hairline-strong);background:var(--x-proposed-unseen)}

/* competing explanations: one mark per cell. Only "against" carries weight */
.cm{display:inline-grid;place-items:center;width:var(--x-proposed-cell);height:calc(var(--x-proposed-cell) * .72);border-radius:var(--radius-key);position:relative}
.cm.C::after{content:"";width:var(--space-1);height:var(--space-1);border-radius:50%;background:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.cm.I::after,.cm.II::after{content:"";width:var(--space-4);height:3px;border-radius:2px;background:var(--x-proposed-against)}
.cm.II::after{box-shadow:0 calc(var(--space-2) * -1) 0 var(--x-proposed-against)}
.cm.II{padding-top:var(--space-2)}
.cm.weak::after{opacity:.5}
.cm.open{border:1px dotted var(--x-proposed-pencil)}

/* pencil and ink */
.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key)}
.pencil .pt,.pt.pen{font-style:italic;color:var(--ink)}
.pencil.inked{border-style:solid;border-color:var(--hairline-strong);background:none}
.pencil.inked .pt{font-style:normal}
.pen{font-style:italic}
.byline{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);white-space:nowrap}

/* the seam: a visible repair */
.seam{border-left:2px solid var(--x-proposed-seam);background:var(--x-proposed-seam-wash);padding:var(--space-1) var(--space-3)}
.struck{text-decoration:line-through;text-decoration-color:var(--x-proposed-seam);color:var(--ink-muted)}

/* watches: say what they listen to, and what they can't see */
.wl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-2);align-items:start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.wl svg{margin-top:1px;opacity:.85}
.wl b{font-weight:400;color:var(--light)}
.wl .cant{grid-column:2;color:var(--ink-muted)}
.wl.blind > svg{opacity:var(--x-proposed-quiet)}
.blindtag{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-1);color:var(--ink-muted);font-size:var(--x-proposed-type-micro);line-height:1.5;white-space:nowrap}

/* the hedge: a fallback named at the table */
.hedge{border-left:2px dashed var(--x-proposed-hedge);padding:var(--space-1) var(--space-3);color:var(--ink);font-size:var(--type-small);line-height:var(--leading-small)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);white-space:nowrap;transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard)}
.btn:hover{background:var(--surface-raised)}
.btn.sm{height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-3);font-size:var(--type-small)}
.btn.go{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.btn[aria-disabled="true"]{opacity:var(--x-proposed-quiet);cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--surface-raised);border-color:var(--ink-muted);color:var(--light)}
.lit{border-color:var(--x-proposed-lit)!important;background:var(--x-proposed-lit-wash)}
.lit-ink{color:var(--x-proposed-lit)}

/* app frame */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--slate-deep) 70%,transparent);min-width:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.crumb b{font-weight:400;color:var(--light)}
.crumb svg{opacity:var(--x-proposed-quiet);flex:none}
.top .hints{margin-left:auto;justify-content:flex-end}
.main{min-height:0;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));overflow:hidden}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}
.x-cap{max-width:calc(100vw - 2 * var(--edge-tight))}
@media (max-width:1400px){.top .hints .opt{display:none}}

/* the competing-explanations grid */
.mx{border-collapse:separate;border-spacing:0;font-size:var(--type-small);line-height:var(--leading-small);width:100%}
.mx th,.mx td{padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline);text-align:center;vertical-align:middle;font-weight:400}
.mx .fh{text-align:left;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.mx .hh{color:var(--light);font-size:var(--type-small);vertical-align:bottom;min-width:calc(var(--x-proposed-cell) + var(--space-3))}
.mx .hh span{display:block}
.mx .hh.pen{font-style:italic;color:var(--ink)}
.mx .hh.hot{box-shadow:inset 0 -2px 0 var(--x-proposed-lit)}
.mx .fr{text-align:left;color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-3);align-items:center}
.mx tbody tr{transition:background var(--motion-base) var(--ease-standard)}
.mx tbody tr.lit{background:var(--x-proposed-lit-wash)}
.mx tbody tr.lit .fr .ft{color:var(--light)}
.mx tbody tr.nd .fr .ft{color:var(--ink-muted)}
.mx tfoot td,.mx tfoot th{border-bottom:0;padding-top:var(--space-2)}
.mx .tot{display:grid;gap:2px;justify-items:center}
.mx .tot b{font-weight:400;color:var(--x-proposed-against)}
.mx .tot i{display:block;height:3px;background:var(--x-proposed-against);border-radius:2px;justify-self:stretch;max-width:100%}
.mx .tot.least b{color:var(--x-proposed-lit)}
.mx.compact .fr{grid-template-columns:minmax(0,1fr)}
.mx.compact .fr .yw{display:none}

/* ---- Grammar V5: every technique has a price in minutes and people, said before it starts and checked after ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.chart{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.6fr) minmax(170px,.9fr);gap:0 var(--space-4);align-content:start;min-height:0}
.ax{grid-column:2;position:relative;height:var(--space-5);border-bottom:1px solid var(--hairline-strong)}
.ax span{position:absolute;bottom:var(--space-1);transform:translateX(-50%);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.row{display:contents}
.row > *{padding:var(--space-3) 0;border-bottom:1px solid var(--hairline)}
.nm{display:grid;gap:2px}
.nm .small{color:var(--ink-muted)}
.track{position:relative}
.bar{position:absolute;left:0;top:calc(50% - var(--space-3));height:var(--space-3);border-radius:2px;background:color-mix(in srgb,var(--ink) 30%,transparent);transition:width var(--motion-calm) var(--ease-out)}
.bar.team{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ink) 30%,transparent) 0 var(--space-2),color-mix(in srgb,var(--ink) 18%,transparent) var(--space-2) calc(var(--space-2) + 2px))}
.took{position:absolute;top:calc(50% + var(--space-1));height:2px;left:0;background:var(--x-proposed-lit);transition:width var(--motion-calm) var(--ease-out)}
.took.over{background:var(--x-proposed-disagree)}
.took-l{position:absolute;top:calc(50% + var(--space-2));font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);white-space:nowrap;transition:opacity var(--motion-calm) var(--ease-out)}
.pays{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.pays .muted{display:block}
.zero .bar,.zero .took{width:0!important}
.zero .took-l{opacity:0}
.foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
.big{font:200 var(--type-title-s)/1 var(--font-mono);color:var(--light)}
</style>
</head>

<script>
/* ======================================================================
   Sample data for one deployment (Vale Regional Services). Every name,
   label, count, date, grade and sentence part on every page of this run
   comes from here; nothing in the markup repeats any of it. In AUGUR it
   would come from Data Atlas (facts, sources and their grades, the
   contract outcomes register), Mandate (the intent, its kind and bar,
   the decision record) and the bench's own result records.
   The story is the briefing run's and the minute run's: Facilities
   deciding whether to renew Calder Waste on the North round.
   ====================================================================== */
const DATA = {
  org: 'Vale Regional Services',
  today: '18 Nov 2026',
  me: 'sam',
  people: {
    sam:   { name: 'Sam Okafor',  role: 'operator, Facilities',          floor: 'fac' },
    jo:    { name: 'Jo Reyes',    role: 'Head of Facilities',            floor: 'fac' },
    ola:   { name: 'Ola Mensah',  role: 'contracts officer',             floor: 'fac' },
    marta: { name: 'Marta Kowal', role: 'depot lead',                    floor: 'depot' },
    priya: { name: 'Priya Nair',  role: 'finance lead',                  floor: 'fin' },
    nadia: { name: 'Nadia Osei',  role: 'Head of Facilities since Sep 2027', floor: 'fac' },
    malik: { name: 'Malik Haddad', role: 'deployment admin',             floor: 'org' }
  },
  floors: {
    org:   { name: 'Vale Regional Services', tier: 'org',        word: 'Org floor' },
    fac:   { name: 'Facilities',             tier: 'department', word: 'Department floor' },
    depot: { name: 'Depot operations',       tier: 'team',       word: 'Team floor' },
    fin:   { name: 'Finance',                tier: 'department', word: 'Department floor' },
    ws:    { name: 'Waste and Streets',      tier: 'department', word: 'Department floor' },
    parks: { name: 'Parks and Leisure',      tier: 'department', word: 'Department floor' },
    hou:   { name: 'Housing',                tier: 'department', word: 'Department floor', closed: true }
  },
  gateway: { on: true, admin: 'malik' },

  supplier: 'Calder Waste',
  round: 'North round',
  contract: { id: 'CN-0412', supplier: 'Calder Waste', what: 'North round waste collection', ends: '31 Mar 2027', notice: '31 Dec 2026' },
  intent: { id: 'INT-208', title: 'Decide on the North waste contract', owner: 'jo', due: '15 Dec 2026', kind: 'Renew or end a contract', floor: 'fac',
    bar: 1 /* the standard of proof this kind asks for: rung 1, very likely or better (briefing run) */, barSetBy: 'the owner of the kind, Procurement' },

  /* ---------- the yardstick, carried unchanged from the briefing run ---------- */
  yardstick: [
    { word: 'Almost certain', rule: 'Two or more sources agree, one of them a source we usually trust. None disagree.', tech: '≥2 independent · best strong · 0 against' },
    { word: 'Very likely',    rule: 'One source we usually trust, or two fair ones that agree. None disagree.',          tech: '1 strong, or ≥2 with best fair' },
    { word: 'Likely',         rule: 'One fair source, or two weak ones that agree.',                                    tech: '1 fair, or ≥2 weak' },
    { word: 'Possible',       rule: 'One weak or ungraded source, and nothing to check it against.',                     tech: '1 weak or ungraded' },
    { word: 'Unlikely',       rule: 'Better sources say otherwise, with at least twice the weight.',                    tech: 'weight against ≥ 2 × weight for' }
  ],
  outside: {
    dispute: { word: 'Sources disagree', icon: 'split' },
    gap:     { word: 'Not known yet',    icon: 'square-dashed' },
    hidden:  { word: 'Not yours to see', icon: 'lock' }
  },
  strengthWord: { strong: 'a source we usually trust', fair: 'a fair source', weak: 'a weak or ungraded source' },

  /* ---------- sources, with the grade Data Atlas already stores ---------- */
  sources: {
    s1:  { name: 'Contract CN-0412',                     grade: 'A1', by: 'Procurement',       kind: 'document' },
    s2:  { name: 'Procurement framework register',       grade: 'A2', by: 'Procurement',       kind: 'record' },
    s3:  { name: 'Depot missed-collection log',          grade: 'B3', by: 'Marta Kowal',       kind: 'record' },
    s4:  { name: 'Residents’ complaints export',         grade: 'C3', by: 'Customer services', kind: 'record' },
    s5:  { name: 'Calder quarterly report, Q3',          grade: 'C3', by: 'Calder Waste',      kind: 'document', note: 'written by the supplier' },

    changes: [

  later: {

      { d: '12 May 2027', w: 'w4', say: 'Tender preparation started, 12 days after the line. Nobody was told: AUGUR couldn’t see the date pass.' },
      { d: '16 May 2027', w: 'w3', say: 'Watch W3 crossed: Low Moor phase 2 occupied. Calder added a 10th vehicle in June.' },
      { d: '31 May 2027', w: null, say: 'Missed collections at 13 for May: back under 15, in month 2 of the contract.' }
    ],
    assumptions: { a1: 'held, a week late', a2: 'held by May', a3: 'held (+3%)', a4: 'held', a5: 'not tested: the break wasn’t used', a6: 'held', a7: 'held: audit passed' },
    reasons: { r1: 'partly: a week late, caught by W1', r5: 'happened: W3 caught it', r3: 'partly: started 12 days late', r2: 'can’t tell: the credit was never triggered', r7: 'didn’t happen', r6: 'didn’t happen: the named watcher held', r4: 'didn’t happen', r9: 'didn’t happen', r8: 'can’t tell: AUGUR never saw Calder’s rota' },
    forecast: { said: '5 in 11', happened: true, note: 'Back under 15 by May' },
    ach: 'Tuesday’s misses fell to 3 a month once the 9th vehicle ran; every day had risen. Both causes held.',
    /* the same facts read a year on, for then-and-now */
    factsNow: { fleet: '10 vehicles since June 2027', missed: '13 a month in October 2027', vehjan: 'happened on 25 Jan 2027, a week late', price: 'renewed at +3%', audit: 'passed, report received 20 Jan 2027', lowmoor2: 'occupied from 16 May 2027' },

};

/* ---- shared helpers (same in every page of the run) ---- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const I = (n, size = 16, stroke = 1.5) => Icons.svg(n, { size, stroke });
const P = id => id === 'model' ? { name: 'the assistant', role: 'model, in pencil' } : DATA.people[id];
const F = id => DATA.floors[id];
const T = id => DATA.techniques[id];
const first = id => id === 'model' ? 'Assistant' : P(id).name.split(' ')[0];
const fmt = n => n.toLocaleString('en-GB');
const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : (many || one + 's')}`;
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ms = v => parseFloat(css(v)) || 0;
const STATE = { tech: false, gateway: DATA.gateway.on };
const ME = DATA.me;
/* lower-case only a sentence's first letter, and never a name: "Low Moor" and "Calder" keep their capitals */
const PROPER = new Set([...Object.values(DATA.people).flatMap(p => p.name.split(' ')), ...DATA.supplier.split(' '), ...DATA.org.split(' '), ...Object.values(DATA.floors).flatMap(f => f.name.split(' ')), ...DATA.missedByMonth.months, 'Low', 'Calder', 'Calder’s', 'Highways', 'Tuesday', 'Thursday', 'January', 'Dan', 'Procurement', 'Customer']);
String.prototype.lc = function () { const w = String(this).split(/[\s,:;]/)[0]; return PROPER.has(w) || /^[A-Z0-9-]{2,}/.test(w) ? String(this) : this.charAt(0).toLowerCase() + this.slice(1); };

/* ======================== the one rule (the briefing run's yardstick) ======================== */
const WT = { strong: 3, fair: 2, weak: 1 };
function strength(g) {
  if (!g) return 'weak';
  const r = g[0], c = +g[1];
  if ('AB'.includes(r) && c <= 2) return 'strong';
  if ('ABC'.includes(r) && c <= 3) return 'fair';
  return 'weak';
}
function sideInfo(srcs) {
  const st = srcs.map(s => strength(DATA.sources[s].grade));
  const best = st.includes('strong') ? 'strong' : st.includes('fair') ? 'fair' : 'weak';
  const n = st.length, w = sum(st, s => WT[s]);
  let rung;
  if (n >= 2 && best === 'strong') rung = 0;
  else if ((n === 1 && best === 'strong') || (n >= 2 && best === 'fair')) rung = 1;
  else if ((n === 1 && best === 'fair') || (n >= 2 && best === 'weak')) rung = 2;
  else rung = 3;
  return { n, best, w, rung };
}
function derive(fid) {
  const f = DATA.facts[fid];
  if (!f) return null;
  if (f.hidden) return { kind: 'hidden', word: DATA.outside.hidden.word, f };
  if (f.gap || !f.sides || !f.sides.length) return { kind: 'gap', word: DATA.outside.gap.word, f };
  if (f.sides.length > 1) return { kind: 'dispute', word: DATA.outside.dispute.word, f };
  const s = sideInfo(f.sides[0]);
  return { kind: 'fact', rung: s.rung, word: DATA.yardstick[s.rung].word, n: s.n, best: s.best, f };
}
/* the word at word size: a five-step stick plus the word; title holds the rule */
function yw(fid, withWord = true) {
  const d = derive(fid);
  if (!d) return '';
  if (d.kind !== 'fact') return `<span class="yw ${d.kind}" title="${d.word}">${I(DATA.outside[d.kind].icon, 12)}${withWord ? d.word : ''}</span>`;
  const y = DATA.yardstick[d.rung];
  return `<span class="yw r${d.rung}" title="${y.word}: ${y.rule}"><span class="st" aria-hidden="true">${[4, 3, 2, 1, 0].map(k => `<i class="${k >= d.rung && d.rung < 4 ? 'on' : ''}"></i>`).join('')}</span>${withWord ? y.word : ''}</span>`;
}
const why = fid => {
  const d = derive(fid), f = DATA.facts[fid];
  if (d.kind === 'hidden') return `Kept on the ${F(f.hidden.floor).name} floor, which you can’t open. Ask ${P(f.hidden.ask).name}.`;
  if (d.kind === 'gap') return `Nobody has said yet. ${P(f.gap.who).name} could: ${f.gap.how}.`;
  const srcs = f.sides[0].map(s => DATA.sources[s].name).join(' and ');
  return `${d.n === 1 ? 'One source' : d.n + ' sources agree'}: ${srcs}. Best is ${DATA.strengthWord[d.best]}.`;
};

/* ======================== assumption marks, from the word ======================== */
function markOf(a) {
  if (a.mark) return a.mark;                     /* a person (or a technique) lowered it, with a reason */
  const d = derive(a.fact);
  if (!d) return 'unsupported';
  if (d.kind === 'gap' || d.kind === 'hidden') return d.kind;
  if (d.kind === 'dispute') return 'unsupported';
  return d.rung <= 1 ? 'solid' : d.rung === 2 ? 'caveats' : 'unsupported';
}
const amk = (k, withWord = true) => `<span class="amk ${k}" title="${DATA.marks[k].word}: ${DATA.marks[k].rule}"><i aria-hidden="true"></i>${withWord ? DATA.marks[k].word : ''}</span>`;
const A = id => DATA.assumptions.find(a => a.id === id);
const markCount = () => { const c = {}; DATA.assumptions.forEach(a => { const k = markOf(a); c[k] = (c[k] || 0) + 1; }); return c; };

/* ======================== competing explanations ======================== */
const X = DATA.ach;
const H = id => X.hyps.find(h => h.id === id);
const hypsShown = () => X.hyps.filter(h => !h.pencil || STATE.gateway);
const MW = { I: 1, II: 2 };
/* weight of a mark: a fact that is only "possible" counts half and can't rule anything out alone */
function markWeight(row, hid) {
  const m = row.m[hid]; if (!MW[m]) return 0;
  const d = derive(row.fact); return d && d.kind === 'fact' && d.rung >= 3 ? MW[m] / 2 : MW[m];
}
const against = (hid, rows = X.rows) => sum(rows, r => markWeight(r, hid));
const touched = (hid, rows = X.rows) => rows.filter(r => r.m[hid]).length;
const tested = hid => touched(hid) >= 3;
const rowAgainst = (r, hs = hypsShown()) => sum(hs, h => markWeight(r, h.id));
const diagnostic = (r, hs = hypsShown()) => hs.some(h => MW[r.m[h.id]]) && hs.some(h => !MW[r.m[h.id]]);
const MARKWORD = { C: 'fits', I: 'against', II: 'rules it out', '': 'says nothing' };
const cm = (m, extra = '') => `<span class="cm ${m} ${extra}" title="${MARKWORD[m || '']}"></span>`;

/* the grid: explanations across, facts down, one mark per cell; totals count only what is against */
function matrixHTML(o = {}) {
  const hs = o.hyps || hypsShown(), rows = (o.rows || X.rows).filter(r => !(o.off || new Set()).has(r.id));
  const lit = o.lit || new Set(), open = o.open || new Set();
  const gone = o.gone || new Set(), tr = o.totRows || rows;
  const maxA = Math.max(1, ...hs.map(h => against(h.id, tr)));
  return `<table class="mx ${o.compact ? 'compact' : ''}"><thead><tr><th class="fh">${o.corner || 'Fact · its word'}</th>${hs.map(h => `<th class="hh ${h.pencil ? 'pen' : ''} ${o.hot === h.id ? 'hot' : ''}" title="${h.say}"><span>${h.short}</span>${h.pencil ? `<span class="byline">${I('pencil', 10)}assistant</span>` : ''}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r => `<tr class="${lit.has(r.id) ? 'lit' : ''} ${diagnostic(r, hs) ? '' : 'nd'} ${gone.has(r.id) ? 'gone' : ''}"><th class="fr"><span class="ft">${DATA.facts[r.fact].say}</span>${o.words === false ? '' : yw(r.fact)}</th>${hs.map(h => `<td>${open.has(h.id) ? cm('', 'open') : cm(r.m[h.id], derive(r.fact).rung >= 3 ? 'weak' : '')}</td>`).join('')}</tr>`).join('')}</tbody>
  ${o.totals === false ? '' : `<tfoot><tr><th class="fr">Against it ${o.tech !== false ? '<span class="tk">rules it out = 2, against = 1; a fact that is only possible counts half</span>' : ''}</th>${hs.map(h => { const a = against(h.id, tr), t = tested(h.id); return `<td><span class="tot ${a === 0 && t ? 'least' : ''}">${open.has(h.id) || !t ? '<span class="small muted">untested</span>' : `<b class="num">${a}</b><i style="width:${a / maxA * 100}%"></i>`}</span></td>`; }).join('')}</tr></tfoot>`}</table>`;
}

/* ======================== small parts ======================== */
const mins = (n, over = false) => `<span class="mins ${over ? 'over' : ''}">${I('timer', 13)}${n} min</span>`;
const tq = (tid, size = 16) => `<span class="tq">${I(T(tid).icon, size)}${T(tid).name}</span>`;
const fchip = fl => `<span class="fchip" data-tier="${F(fl).tier}">${F(fl).name} · ${F(fl).word}</span>`;
const W = id => DATA.watches.find(w => w.id === id);
const watchHTML = (w, opts = {}) => `<div class="wl ${w.sees ? '' : 'blind'}">${I(w.sees ? 'eye' : 'eye-off', 14)}<span><b>${w.say}</b> ${w.line}${opts.owner === false ? '' : ` <span class="muted">· ${P(w.owner).name}</span>`}</span>${w.sees ? (opts.listens === false ? '' : `<span class="cant">listens to ${w.listens}</span>`) : `<span class="cant"><span class="blindtag">${I('eye-off', 10)}can’t see</span> ${w.cant}</span>`}</div>`;
const pencilBy = () => `<span class="byline">${I('pencil', 11)}the assistant, in pencil</span>`;

/* the offer: one technique, with why, its price said first, and a quiet way out */
function offerHTML(tid, whyText, opts = {}) {
  const t = T(tid);
  return `<div class="offer card ${opts.cls || ''}"><p class="lbl">${opts.label || 'AUGUR offers one technique'}</p>
    <div style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap"><span class="tq" style="font-size:var(--type-heading);line-height:var(--leading-heading);font-weight:300">${I(t.icon, 22)}${t.name}</span>${mins(t.minutes)}<span class="small muted">${t.people}</span></div>
    <span class="tk">${t.tech}</span>
    <p class="small"><span class="muted">Why this one:</span> ${whyText}</p>
    <p class="small"><span class="muted">You get:</span> ${t.makes.charAt(0).toLowerCase() + t.makes.slice(1)}. <span class="muted">Kept</span> ${t.kept.toLowerCase()}.</p>
    ${opts.then ? `<p class="small"><span class="muted">Then:</span> ${opts.then}</p>` : ''}
    <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-1)"><button class="btn go">${I('play', 14)}Start · ${t.minutes} min</button><button class="btn">Not now</button>${opts.extra || ''}</div></div>`;
}

/* top bar */
function topHTML(crumbs, hints, floor = 'fac') {
  return `<header class="top"><p class="brand">AUGUR</p>
    <nav class="crumb" aria-label="Where you are">${crumbs.map((c, i) => (i ? I('chevron-right', 14) : '') + (i === crumbs.length - 1 ? `<b>${c}</b>` : `<span>${c}</span>`)).join('')}</nav>
    ${fchip(floor)}
    <div class="hints">${hints.map(([k, w, id, opt]) => `<span ${id ? `id="${id}"` : ''} class="${opt ? 'opt' : ''}"><span class="kbd">${k}</span>${w}</span>`).join('')}</div></header>`;
}
const STD = [['T', 'trade names', 'h-t'], ['G', 'model off', 'h-g'], ['R', 'replay']];

/* keys shared by every page */
function commonKeys(e, rerender, replay) {
  if (e.metaKey || e.ctrlKey || e.altKey) return false;
  if (e.target.closest && e.target.closest('input,textarea,select')) return false;
  const k = e.key.toLowerCase();
  if (k === 'r') { replay(); return true; }
  if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); return true; }
  if (k === 'g') { STATE.gateway = !STATE.gateway; rerender(); return true; }
  return false;
}
function markKeys() { $('#h-t')?.classList.toggle('on', STATE.tech); $('#h-g')?.classList.toggle('on', !STATE.gateway); }
const gatewayNote = () => STATE.gateway ? '' : `<p class="small muted">${I('power-off', 12)} The model is off (${P(DATA.gateway.admin).name} can turn it on). Pencil is gone; no mark, count or word changed.</p>`;

/* timers for the moment, cleared on replay */
let TIMERS = [];
const later = (fn, t) => TIMERS.push(setTimeout(fn, reduced ? Math.min(t, 50) : t));
const clearLater = () => { TIMERS.forEach(clearTimeout); TIMERS = []; };
const MOMENT = () => ms('--motion-run'); /* the moment plays at ~1.2 s */
function settle() { document.body.classList.add('pre'); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('pre'))); }

const MAX = 35;
const RAN = Object.fromEntries(DATA.working.map(w => [w.tid, w]));
/* what "pays back" means, per technique: a test anyone can check at the end of a quarter */
const PAYS = { outside: 'it moved a forecast or a term', ach: 'it ruled out a cause someone believed', kac: 'it marked one load-bearing assumption below solid', pre: 'a reason became a change or a watch', qic: 'it found a source carrying more weight than its grade', against: 'one point of the case against changed the choice' };
const S = { zero: true };
function render() {
  const said = sum(DATA.working, w => w.said), took = sum(DATA.working, w => w.took);
  $('#app').innerHTML = topHTML(['Explorer', 'The bench', 'Prices'], [...STD]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">What each technique costs</p><p class="sent" style="max-width:72ch">Each technique says <b>how many minutes and how many people</b> before it starts. AUGUR times it, keeps both, and asks one question a quarter: <b>did it pay?</b></p></div>
    <div class="chart scroll ${S.zero ? 'zero' : ''}">
      <span></span><div class="ax">${[0, 5, 10, 15, 20, 25, 30, 35].map(m => `<span style="left:${m / MAX * 100}%">${m}</span>`).join('')}</div><span class="lbl" style="align-self:end">It pays when</span>
      ${DATA.kinds.map(k => { const t = T(k.tid), r = RAN[k.tid], team = /together|people|challenger/.test(t.people) && !/1 or 2/.test(t.people);
        return `<div class="row"><div class="nm">${tq(k.tid, 14)}<span class="small">“${k.ask}” · ${t.people}</span><span class="tk">${t.tech}</span></div>
        <div class="track"><div class="bar ${team ? 'team' : ''}" style="width:${t.minutes / MAX * 100}%"></div>
          ${r ? `<div class="took ${r.took > r.said ? 'over' : ''}" style="width:${r.took / MAX * 100}%"></div><span class="took-l" style="left:calc(${r.took / MAX * 100}% + var(--space-2))">took ${r.took} on ${DATA.intent.id}</span>` : ''}
          <span class="mins" style="position:absolute;left:calc(${t.minutes / MAX * 100}% + var(--space-2));top:calc(50% - var(--space-3))">${t.minutes} min</span></div>
        <p class="pays">${PAYS[k.tid]}<span class="muted">${r ? 'it did: ' + r.changed.lc() : 'not run on ' + DATA.intent.id}</span></p></div>`; }).join('')}
    </div>
    <div class="foot">
      <div class="card"><p class="lbl">On ${DATA.intent.id}</p><p><span class="big">${took}</span> <span class="muted">min, said ${said}</span></p><p class="small">Four techniques, ${took - said} minutes over. Every one changed a line of the decision.</p></div>
      <div class="card"><p class="lbl">Solid bar, striped bar</p><p class="small">Solid: on your own. Striped: people together, so the minutes are each person’s. A premortem of five people for 20 minutes costs 100 minutes of the floor.</p></div>
      <div class="card"><p class="lbl">The quarterly test</p><p class="small">A technique that changed nothing in 3 of every 4 runs leaves the shelf for that floor, and says so on the bench. Prices that run over by half get re-said.</p></div>
    </div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.zero = true; settle(); render(); later(() => { S.zero = false; $('.chart').classList.remove('zero'); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) { markKeys(); } });
replay();
</script>
