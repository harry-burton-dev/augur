<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Grammar · V3 · Four situations</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Grammar V3: the kind of situation chooses whether a technique helps at all. Two of the four say "no technique" ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,var(--measure-drawer));gap:var(--space-5)}
.map{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;min-height:0;background:var(--hairline);border-radius:var(--radius-inset);overflow:hidden}
.dom{background:var(--slate-deep);padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-2);min-height:0;position:relative}
.dom h2{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.dom .test{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.dom .method{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);max-width:44ch}
.dom .ts{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);margin-top:var(--space-1)}
.dom .ts .tq{font-size:var(--type-small)}
.dom .none{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted);border:1px dashed var(--hairline-strong);border-radius:var(--radius-pill);padding:2px var(--space-3)}
.dom.hot{background:color-mix(in srgb,var(--slate-deep) 85%,var(--x-proposed-lit-wash))}
.pins{margin-top:auto;display:grid;gap:var(--space-1)}
.pin{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);align-items:start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--light);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);background:var(--surface-raised);opacity:0;transform:scale(.96);transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.pin.in{opacity:1;transform:none}
.pin .what{color:var(--ink-muted);grid-column:2}
.axis{position:absolute;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);z-index:1}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.side .sent{font-size:var(--type-body);line-height:var(--leading-body)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V3</b> four situations choose the method; two of them say “no technique” · Snowden and Boone (2007), Cynefin</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* the renewal's questions, placed by the one test each situation names */
const PLACED = [
  { s: 'complicated', q: 'Why have missed collections doubled since July?', what: 'Someone could work it out from the depot log: competing explanations' },
  { s: 'complex',     q: 'Will Calder recover if we renew?', what: 'Only renewing will tell: start from how it usually goes, then watch' },
  { s: 'clear',       q: 'When must notice be given on CN-0412?', what: `The contract says ${DATA.contract.notice}. No technique` },
  { s: 'chaotic',     q: 'No crew turned up on the Tuesday round today', what: 'Phone Calder and send the spare crew. Review after' }
];
const ORDER = ['complex', 'complicated', 'chaotic', 'clear']; /* Snowden's layout */
const S = { n: 0, hot: null };
function render() {
  const sit = id => DATA.situations.find(s => s.id === id);
  $('#app').innerHTML = topHTML(['Explorer', 'The bench', 'Four situations'], [['1–4', 'a situation'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div class="map">${ORDER.map((id, i) => { const s = sit(id); return `<section class="dom ${S.hot === id ? 'hot' : ''}">
      <h2>${s.name}</h2><p class="test">${s.test}</p><p class="method">${s.method}</p>
      <div class="ts">${s.tids.length ? s.tids.map(t => `${tq(t)}`).join('') : `<span class="none">${I('circle-slash', 13)}No technique ${id === 'clear' ? 'needed' : 'now'}</span>`}</div>
      <div class="pins">${PLACED.filter(p => p.s === id).map(p => `<div class="pin ${PLACED.indexOf(p) < S.n ? 'in' : ''}" data-k="${PLACED.indexOf(p)}">${I('message-circle-question', 14)}<span>“${p.q}”</span><span class="what">${p.what}</span></div>`).join('')}</div>
    </section>`; }).join('')}</div>
    <aside class="side scroll"><p class="eyebrow">How to read it</p>
      <p class="sent">Before any technique, one question: <b>does anyone know what causes what?</b> The answer puts the situation in one of four places, and only two of them want analysis.</p>
      <p class="small">A technique in a clear situation only slows people down. In a chaotic one there is no time: act, then come back to the bench once things hold still.</p>
      <p class="small muted">One decision can hold all four. The renewal had a clear question (the notice date), a complicated one (why service fell), a complex one (will it recover) and, on one Tuesday, a chaotic one.</p>
      <div class="rule"></div>
      <p class="eyebrow">Placed by</p><p class="small">The person, answering the test in plain words. AUGUR never places a situation for them; the model may suggest, in pencil.</p>
      <p class="tk">Cynefin domains: clear (sense, categorise, respond) · complicated (sense, analyse, respond) · complex (probe, sense, respond) · chaotic (act, sense, respond) · confused: not yet placed</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.n = 0; S.hot = null; settle(); render(); PLACED.forEach((_, i) => later(() => { S.n = i + 1; $(`.pin[data-k="${i}"]`)?.classList.add('in'); }, MOMENT() + i * ms('--motion-slow'))); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (/^[1-4]$/.test(e.key)) { const id = ORDER[+e.key - 1]; S.hot = S.hot === id ? null : id; render(); }
});
replay();
</script>
</body>
</html>
