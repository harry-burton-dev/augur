<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Grammar · V2 · The key</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Grammar V2: a field guide's key. Pairs of plain statements lead to one technique; the path you took stays lit ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--space-6)}
.key{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.cp{display:grid;grid-template-columns:calc(var(--space-6) - var(--space-2)) minmax(0,1fr);gap:var(--space-1) var(--space-3);padding:var(--space-2) 0;border-top:1px solid var(--hairline)}
.cp .n{font:300 var(--type-heading)/1 var(--font-mono);color:var(--ink-muted)}
.cp .ask{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);grid-column:2}
.lead-row{grid-column:2;display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;align-items:baseline;gap:var(--space-2);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);color:var(--ink);transition:background var(--motion-base) var(--ease-standard),color var(--motion-base) var(--ease-standard)}
.lead-row .ab{font-family:var(--font-mono);color:var(--ink-muted)}
.lead-row .to{font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap;display:inline-flex;gap:var(--space-1);align-items:center}
.lead-row.on{background:var(--x-proposed-lit-wash);color:var(--light)}
.lead-row.on .to{color:var(--x-proposed-lit)}
.lead-row.off{opacity:var(--x-proposed-quiet)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.qs{display:grid;gap:var(--space-1)}
.qs button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:left}
.qs button[aria-pressed="true"]{background:var(--surface-raised);color:var(--light)}
.arrive{padding:var(--space-4);display:grid;gap:var(--space-3)}
.arrive .tq{font-size:var(--type-heading);line-height:var(--leading-heading);font-weight:300}
.arrive.hold{opacity:0}
.arrive{transition:opacity var(--motion-calm) var(--ease-out)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V2</b> a field guide’s key: two plain statements at each step, one technique at the end · dichotomous keys, Tradecraft Primer (2009)</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* the key: product grammar, the same in every deployment. Each lead goes to a couplet or ends at a technique */
const KEY = [
  { n: 1, ask: 'Is it about what has happened, or what will?', a: ['It is about what has already happened', 2], b: ['It is about what will happen', 3] },
  { n: 2, ask: 'What do you need to know about it?', a: ['Why it happened', 'ach'], b: ['Whether what you were told is true', 'qic'] },
  { n: 3, ask: 'What are you trying to settle?', a: ['A number or a date: how long, how much, how many', 'outside'], b: ['A plan, or a choice between options', 4] },
  { n: 4, ask: 'Have you chosen yet?', a: ['Not yet, but you lean one way', 'against'], b: ['Yes, and you want to test it', 5] },
  { n: 5, ask: 'How close is committing?', a: ['Not yet: find what it rests on, on your own', 'kac'], b: ['Soon: the people who will carry it imagine it failed', 'pre'] }
];
/* the renewal's own questions, as people asked them, and the path each takes */
const ASKED = [
  { q: 'Why have missed collections on the North round doubled since July?', path: ['1a', '2a'] },
  { q: 'Calder says it was road closures. Is that right?', path: ['1a', '2b'] },
  { q: 'If we renew, will it be back under 15 a month by June?', path: ['1b', '3a'] },
  { q: 'We’re leaning towards renewing for a year. Are we right?', path: ['1b', '3b', '4a'] },
  { q: 'What does the 12-month renewal rest on?', path: ['1b', '3b', '4b', '5a'] },
  { q: 'We sign on the 10th. What could go wrong?', path: ['1b', '3b', '4b', '5b'] }
];
const S = { q: 0, shown: 0 };
function end() { const p = ASKED[S.q].path, last = p[p.length - 1]; const c = KEY[+last[0] - 1]; return c[last[1]][1]; }
function render() {
  const p = ASKED[S.q].path.slice(0, S.shown), tid = end();
  $('#app').innerHTML = topHTML(['Explorer', 'The bench', 'The key'], [['1–6', 'a question'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="key scroll"><p class="eyebrow">The key · read down, take the line that is true</p>
      ${KEY.map(c => `<div class="cp"><span class="n">${c.n}</span><span class="ask">${c.ask}</span>${['a', 'b'].map(ab => {
        const [say, to] = c[ab], id = c.n + ab, on = p.includes(id), off = p.some(x => +x[0] === c.n) && !on;
        return `<div class="lead-row ${on ? 'on' : ''} ${off ? 'off' : ''}"><span class="ab">${id}</span><span>${say}</span><span class="to">${typeof to === 'number' ? 'go to ' + to + ' ' + I('arrow-down', 12) : I(T(to).icon, 14) + T(to).name + ' · ' + T(to).minutes + ' min'}</span></div>`; }).join('')}</div>`).join('')}
      <p class="small muted">Five steps at most. Nobody needs to know a technique’s name to get to it, and every end is one technique, never a list.</p>
    </section>
    <aside class="side scroll"><p class="eyebrow">Questions asked on ${DATA.intent.id}</p>
      <div class="qs">${ASKED.map((a, i) => `<button aria-pressed="${S.q === i}" data-i="${i}"><span class="kbd">${i + 1}</span>“${a.q}”</button>`).join('')}</div>
      <div class="card arrive ${S.shown < ASKED[S.q].path.length ? 'hold' : ''}"><p class="lbl">The key ends at</p>${tq(tid, 22)}<span class="tk">${T(tid).tech}</span>
        <p class="small">${mins(T(tid).minutes)} · ${T(tid).people}</p><p class="small"><span class="muted">Makes</span> ${T(tid).makes}.</p><p class="small"><span class="muted">Kept</span> ${T(tid).kept.lc()}.</p></div>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.qs button').forEach(b => b.onclick = () => pick(+b.dataset.i));
}
function walk() { clearLater(); S.shown = 0; render(); ASKED[S.q].path.forEach((_, i) => later(() => { S.shown = i + 1; render(); }, MOMENT() + i * ms('--motion-slow') * 2)); }
function pick(i) { S.q = i; walk(); }
function replay() { settle(); S.q = 0; walk(); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (/^[1-6]$/.test(e.key)) pick(+e.key - 1);
});
replay();
</script>
</body>
</html>
