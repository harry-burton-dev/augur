<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Grammar · V1 · The shelf</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Grammar V1: the bench as a shadow board. Six tools, each in its painted outline; an empty outline says who has it ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.hd{display:flex;align-items:end;gap:var(--space-5);justify-content:space-between}
.hd .sent{max-width:60ch}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);min-height:0}
.slot{position:relative;border:1.5px dashed var(--hairline-strong);border-radius:var(--radius-inset);padding:var(--space-2);min-height:0;display:grid}
.slot .outline{position:absolute;top:var(--space-2);right:var(--space-3);color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.tool{border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-pane);padding:var(--space-3) var(--space-4);display:grid;gap:var(--space-2);align-content:start;text-align:left;min-width:0;transition:transform var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out),border-color var(--motion-base) var(--ease-standard)}
.tool:hover{border-color:var(--hairline-strong)}
.tool.sel{border-color:var(--x-proposed-lit);background:color-mix(in srgb,var(--surface-pane) 80%,var(--x-proposed-lit-wash))}
.tool .q{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.tool .row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.tool dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px var(--space-3);margin:0;font-size:var(--type-small);line-height:var(--leading-small)}
.tool dt{color:var(--ink-muted)}
.tool dd{margin:0;color:var(--ink)}
.tool .mod{border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.out .tool{opacity:0;transform:translateY(calc(var(--space-6) * -1))}
.inuse{display:grid;place-content:center;gap:var(--space-2);text-align:center;color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);padding:var(--space-4)}
.inuse b{color:var(--ink);font-weight:400}
.inuse .bar{height:3px;background:var(--hairline);border-radius:2px;overflow:hidden;width:min(100%,var(--measure-card));margin:0 auto}
.inuse .bar i{display:block;height:100%;background:var(--x-proposed-lit)}
.train{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.train .t{display:inline-flex;align-items:center;gap:var(--space-1);border:1px solid var(--hairline);border-radius:var(--radius-pill);padding:2px var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);opacity:.85}
.train .t:hover::after{content:attr(data-why);color:var(--ink);margin-left:var(--space-1)}
@media (max-width:1400px){.tool dl .opt{display:none}.tool .q{font-size:var(--type-body);line-height:var(--leading-body)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V1</b> the bench as a shadow board: six tools, each in its outline · Tradecraft Primer (2009), lean shadow boards</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* the order of the shelf is the order of the kinds of question */
const S = { sel: null, out: true, inUse: 'ach' };
function render() {
  $('#app').innerHTML = topHTML(['Explorer', 'The bench'], [['1–6', 'a tool'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div class="hd"><div><p class="eyebrow">The bench · ${DATA.floors.fac.name}</p><p class="sent">Six techniques, <b>one for each kind of question</b>. Each says how long it takes before it starts, runs on your own facts, and leaves its result beside the output it shaped.</p></div>
      <p class="small muted" style="max-width:36ch">An empty outline means someone has that tool out. It says who, on what, and how far through.</p></div>
    <div class="board ${S.out ? 'out' : ''}">${DATA.kinds.map((k, i) => {
      const t = T(k.tid);
      if (S.inUse === k.tid) return `<div class="slot"><span class="outline">${I(t.icon, 28, 1)}</span><div class="inuse"><span class="q" style="font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)">“${k.ask}”</span><span><b>${t.name}</b> is out</span><span>${P('sam').name} and ${P('marta').name}, on ${DATA.intent.id}</span><span class="num">12 of ${t.minutes} min</span><div class="bar"><i style="width:${12 / t.minutes * 100}%"></i></div></div></div>`;
      return `<div class="slot"><span class="outline">${I(t.icon, 28, 1)}</span><button class="tool ${S.sel === i ? 'sel' : ''}" data-i="${i}" style="transition-delay:calc(${i} * var(--motion-instant))">
        <span class="q">“${k.ask}”</span>
        <span class="row">${tq(k.tid)}${mins(t.minutes)}<span class="small muted">${t.people}</span></span>
        <span class="tk">${t.tech}</span>
        <dl><dt>Takes</dt><dd>${t.takes}</dd><dt>Makes</dt><dd>${t.makes}</dd><dt class="opt">Kept</dt><dd class="opt">${t.kept}</dd></dl>
        <dl class="mod"><dt>Model may</dt><dd class="pen">${t.may}</dd><dt>Never</dt><dd>${t.never}</dd></dl>
      </button></div>`; }).join('')}</div>
    <div><p class="eyebrow" style="margin-bottom:var(--space-2)">Left to training · named here so nobody wonders where they went</p>
      <div class="train">${DATA.training.map(t => `<span class="t" tabindex="0" data-why="· ${t.why}" title="${t.why}">${I('graduation-cap', 12)}${t.name}</span>`).join('')}</div></div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.tool').forEach(b => b.onclick = () => { S.sel = S.sel === +b.dataset.i ? null : +b.dataset.i; render(); });
}
function replay() { clearLater(); S.out = true; S.sel = null; settle(); render(); later(() => { S.out = false; $('.board').classList.remove('out'); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (/^[1-6]$/.test(e.key)) { const i = +e.key - 1; S.sel = S.sel === i ? null : i; if (DATA.kinds[i].tid === S.inUse) S.inUse = null; render(); }
});
replay();
</script>
</body>
</html>
