<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Explanations · V4 · If a source is wrong</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Explanations V4: take out one source at a time and see whether the answer moves. A source the answer hangs on is its linchpin ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.6fr);gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.srcs{display:grid;gap:var(--space-1)}
.src{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:center;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);text-align:left;font-size:var(--type-small);line-height:var(--leading-small)}
.src b{font-weight:400;color:var(--ink)}
.src .v{grid-column:2/-1;color:var(--ink-muted)}
.src .v.moves{color:var(--x-proposed-disagree)}
.src[aria-pressed="true"]{border-color:var(--x-proposed-against);background:var(--surface-raised)}
.src[aria-pressed="true"] b{text-decoration:line-through;text-decoration-color:var(--x-proposed-against)}
.verdict{font-size:var(--type-lead);line-height:var(--leading-lead);font-weight:300;color:var(--light)}
.verdict.moves{color:var(--x-proposed-disagree)}
.mx tbody tr.gone{opacity:.28}
.mx tbody tr.gone .ft{text-decoration:line-through}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Explanations · V4</b> if a source is wrong: take one out, see if the answer moves; the one it hangs on is the linchpin · Heuer step 6 (sensitivity), linchpin analysis</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* sources the grid rests on, most facts first */
const USED = [...new Set(X.rows.flatMap(r => DATA.facts[r.fact].sides[0]))].sort((a, b) => X.rows.filter(r => DATA.facts[r.fact].sides[0].includes(b)).length - X.rows.filter(r => DATA.facts[r.fact].sides[0].includes(a)).length);
/* without a source: a fact keeps its other sources (with a lower word) or drops out */
function rowsWithout(src) {
  return X.rows.filter(r => !src || DATA.facts[r.fact].sides[0].some(s => s !== src));
}
function survivors(rows) {
  const hs = hypsShown().filter(h => tested(h.id));
  const m = Math.min(...hs.map(h => against(h.id, rows)));
  return hs.filter(h => against(h.id, rows) === m).map(h => h.id).sort().join(',');
}
const BASE = survivors(X.rows);
const S = { off: null };
function render() {
  const rows = rowsWithout(S.off), off = new Set(X.rows.filter(r => !rows.includes(r)).map(r => r.id));
  const moves = S.off && survivors(rows) !== BASE;
  const hs = hypsShown().filter(h => tested(h.id));
  const delta = S.off ? hs.filter(h => against(h.id, rows) !== against(h.id)).map(h => `${h.short.lc()} ${against(h.id)} → ${against(h.id, rows)}`) : [];
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, T('ach').name, 'If a source is wrong'], [['1–9', 'take one out'], ['0', 'all back'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="col scroll"><p class="eyebrow">Suppose this source is wrong</p>
      <div class="srcs">${USED.map((s, i) => { const r = rowsWithout(s), mv = survivors(r) !== BASE, n = X.rows.length - r.length;
        return `<button class="src" aria-pressed="${S.off === s}" data-s="${s}"><span class="kbd">${i + 1}</span><b>${DATA.sources[s].name}</b><span class="mono muted">${DATA.sources[s].grade || 'ungraded'}</span><span class="v ${mv ? 'moves' : ''}">${n ? `${plural(n, 'fact')} drop out` : 'no fact drops out'} · ${mv ? 'the answer moves' : 'the answer holds'}</span></button>`; }).join('')}</div>
      <p class="small muted">A source that carries a fact alone takes the fact with it. A fact with another source stays.</p></section>
    <section class="col scroll">
      <p class="verdict ${moves ? 'moves' : ''}">${!S.off ? `With every source: <b>${BASE.split(',').map(id => H(id).short).join(' and ')}</b> least against.` : moves ? `Without ${DATA.sources[S.off].name.lc()}, the answer moves.` : `Without ${DATA.sources[S.off].name.lc()}, the answer holds.`}</p>
      ${S.off ? `<p class="small">${delta.length ? 'Against: ' + delta.join(' · ') + '.' : 'No total changes.'} ${off.size ? `${plural(off.size, 'fact')} drop${off.size === 1 ? 's' : ''} out (struck through below).` : ''}</p>` : `<p class="small">No single source holds this answer up: take out any one and ${BASE.split(',').map(id => H(id).short.lc()).join(' and ')} still have nothing against them. The answer is worth more for that, and the working says so.</p>`}
      ${matrixHTML({ gone: off, totRows: rows, corner: 'Fact · its word, with every source' })}
      ${gatewayNote()}
    </section></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.src').forEach(b => b.onclick = () => { S.off = S.off === b.dataset.s ? null : b.dataset.s; render(); });
}
function replay() { clearLater(); S.off = null; settle(); render(); later(() => { S.off = USED[0]; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === '0') { S.off = null; render(); }
  if (/^[1-9]$/.test(e.key) && USED[+e.key - 1]) { S.off = USED[+e.key - 1]; render(); }
});
replay();
</script>
</body>
</html>
