<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Explanations · V5 · The shape it predicts</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Explanations V5: each explanation predicts a shape over time. Laid over the record, a wrong shape is against it, and the timeline can't split what shares a shape ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.q{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.sm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);min-height:0;align-content:start}
.mc{border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4);display:grid;gap:var(--space-1);background:var(--surface-inset);transition:border-color var(--motion-base) var(--ease-standard),opacity var(--motion-calm) var(--ease-out)}
.mc.fit{border-color:color-mix(in srgb,var(--x-proposed-lit) 60%,transparent)}
.mc.miss{opacity:.8}
.mc.pen{border-style:dotted;background:var(--x-proposed-pencil-wash)}
.mc .nm{display:flex;justify-content:space-between;gap:var(--space-2);align-items:baseline}
.mc .nm b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.mc.pen .nm b{font-style:italic}
.mc .v{font-size:var(--type-small);white-space:nowrap}
.mc.fit .v{color:var(--x-proposed-lit)}
.mc.miss .v{color:var(--x-proposed-against)}
svg.sp{width:100%;height:auto;display:block}
svg.sp .b{fill:color-mix(in srgb,var(--ink) 22%,transparent)}
svg.sp .pl{fill:none;stroke:var(--light);stroke-width:2;stroke-linejoin:round;stroke-dasharray:var(--dash);stroke-dashoffset:var(--dash);transition:stroke-dashoffset var(--motion-calm) var(--ease-out)}
.drawn svg.sp .pl{stroke-dashoffset:0}
svg.sp .off{fill:var(--x-proposed-disagree-wash);stroke:var(--x-proposed-against);stroke-width:1.5;stroke-dasharray:3 2}
svg.sp .ev{stroke:var(--hairline-strong);stroke-dasharray:2 3}
svg.sp text{font:400 calc(var(--x-proposed-type-micro) * .8) var(--font-mono);fill:var(--ink-muted)}
.foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Explanations · V5</b> the shape it predicts: each explanation’s month-by-month shape laid over the record · Heuer (1999), process signatures in quality control</div>
<script>
/*@DATA@*/
/*@LIB@*/
const M = DATA.missedByMonth, TOL = Math.round(Math.max(...M.n) / 4); /* a month off by more than a quarter of the peak is against */
const S = { drawn: false };
function spark(h) {
  const sh = X.shapes[h.id], W = 320, Hh = 96, mx = Math.max(...M.n, ...sh.line) + 4, bw = W / M.n.length;
  const y = v => Hh - 14 - v / mx * (Hh - 22), xc = i => i * bw + bw / 2;
  const pts = sh.line.map((v, i) => `${xc(i)},${y(v)}`).join(' ');
  return `<svg class="sp" viewBox="0 0 ${W} ${Hh}" style="--dash:${W * 2}" aria-hidden="true">
    ${X.events.map(e => `<line class="ev" x1="${e.i * bw + bw / 2}" x2="${e.i * bw + bw / 2}" y1="4" y2="${Hh - 14}"/>`).join('')}
    ${M.n.map((v, i) => `<rect class="${Math.abs(sh.line[i] - v) > TOL && S.drawn ? 'off' : 'b'}" x="${i * bw + 5}" y="${y(v)}" width="${bw - 10}" height="${Hh - 14 - y(v)}" rx="2"/><text x="${xc(i)}" y="${Hh - 3}" text-anchor="middle">${M.months[i]}</text>`).join('')}
    <polyline class="pl" points="${pts}"/></svg>`;
}
function render() {
  const hs = hypsShown(), fits = h => X.shapes[h.id].line.every((v, i) => Math.abs(v - M.n[i]) <= TOL);
  const miss = hs.filter(h => !fits(h)), share = hs.filter(fits);
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, T('ach').name, 'Shapes'], [...STD]) +
  `<main class="main"><div class="wrap ${S.line ? 'drawn' : ''}">
    <div><p class="eyebrow">${T('ach').name} · each explanation, drawn as the months it predicts (line) over the depot log (bars)</p><p class="q">${X.question}</p></div>
    <div class="sm scroll">${hs.map(h => `<div class="mc ${S.drawn ? (fits(h) ? 'fit' : 'miss') : ''} ${h.pencil ? 'pen' : ''}"><div class="nm"><b>${h.short}</b><span class="v">${S.drawn ? (fits(h) ? 'fits the shape' : 'wrong shape: against') : ''}</span></div>${spark(h)}<span class="small muted">${X.shapes[h.id].says}${h.pencil ? ' · the assistant’s, in pencil' : ''}</span></div>`).join('')}</div>
    <div class="foot">
      <div class="card"><p class="lbl">Against by shape</p><p class="small">${miss.map(h => `<b class="lite">${h.short}</b>`).join(' and ')}: a month is off by more than ${TOL} (a quarter of the peak). Bars it misses are marked.</p></div>
      <div class="card"><p class="lbl">Same shape, can’t split</p><p class="small">${share.map(h => h.short.lc()).join(', ')} all predict a step in July. The timeline can’t tell them apart; ${X.tests[0].fact.lc()} can.</p></div>
      <div class="card"><p class="lbl">Who draws the shapes</p><p class="small">The person who proposed each explanation sketches it before seeing the record laid over it. The record is ink; the shape is theirs, and stays theirs.</p>${gatewayNote()}</div>
    </div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.drawn = false; S.line = false; settle(); render(); later(() => { S.drawn = true; render(); requestAnimationFrame(() => requestAnimationFrame(() => { $('.wrap').classList.add('drawn'); S.line = true; })); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) { markKeys(); } });
replay();
</script>
</body>
</html>
