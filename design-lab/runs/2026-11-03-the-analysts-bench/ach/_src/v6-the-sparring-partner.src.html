<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Explanations · V6 · The sparring partner</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Explanations V6: the model argues the other side, in pencil. It may add an explanation or a fact to find; the new column arrives empty, because only people mark ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.q{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.spar{display:grid;gap:var(--space-3)}
.pc{padding:var(--space-3) var(--space-4);display:grid;gap:var(--space-2);transition:opacity var(--motion-calm) var(--ease-out),border-color var(--motion-base) var(--ease-standard)}
.pc .k{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.pc.taken{border-style:solid;border-color:var(--x-proposed-lit)}
.pc.taken .k{color:var(--x-proposed-lit)}
.pc.left{opacity:var(--x-proposed-quiet)}
.pc .acts{display:flex;gap:var(--space-2);flex-wrap:wrap}
.tally{display:flex;gap:var(--space-5);font-size:var(--type-small);color:var(--ink-muted)}
.tally b{display:block;font:200 var(--type-heading)/1 var(--font-mono);color:var(--light)}
.mx .hh.new{animation:arrive var(--motion-calm) var(--ease-out)}
@keyframes arrive{from{opacity:0;transform:translateY(calc(var(--space-2) * -1))}to{opacity:1;transform:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Explanations · V6</b> the sparring partner: the model argues the other side and widens the grid; it never marks a cell · Tradecraft Primer devil’s advocacy, pencil and ink</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* what the assistant offers. kind: an explanation nobody listed, or a fact worth finding. Never a mark */
const OFFERS = [
  { id: 'o1', kind: 'An explanation nobody listed', say: X.pencilWhy, adds: 'h6' },
  { id: 'o2', kind: 'A fact that leans on one source', say: `“${DATA.facts.overtime.say}” rests only on ${DATA.sources.s5.name}, ${DATA.sources.s5.note}. If it is wrong, too few vehicles loses its July step.`, find: 'Calder’s overtime hours by month, from its invoices' },
  { id: 'o3', kind: 'What the other side will say', say: 'Every fact against road closures comes from our own records. Calder will say we count missed collections differently.', find: 'Calder’s own missed-collection log for July to October' }
];
const S = { taken: new Set(), left: new Set(), fresh: false };
function render() {
  const g = STATE.gateway, hasH6 = S.taken.has('o1') && g;
  const hs = X.hyps.filter(h => !h.pencil || hasH6);
  const finds = OFFERS.filter(o => o.find && S.taken.has(o.id));
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, T('ach').name], [['A', 'take the first offer'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="col scroll"><p class="eyebrow">${T('ach').name} · marked by ${X.markedBy.map(p => P(p).name).join(' and ')}</p><p class="q">${X.question}</p>
      ${matrixHTML({ hyps: hs, open: new Set(hasH6 ? ['h6'] : []) }).replace('class="hh pen ', `class="hh pen ${S.fresh ? 'new' : ''} `)}
      ${hasH6 ? `<p class="small">${I('square-dashed', 12)} <b class="lite">${H('h6').short}</b> arrived empty. ${P('sam').name} or ${P('marta').name} marks each cell; until then it is untested and can’t be least against.</p>` : ''}
      ${finds.length ? `<div class="card"><p class="lbl">Facts to find, added from the sparring</p>${finds.map(o => `<p class="small">${I('search', 12)} ${o.find}</p>`).join('')}</div>` : ''}
    </section>
    <aside class="col scroll"><p class="eyebrow">Arguing the other side</p>
      ${g ? `<div class="spar">${OFFERS.map(o => `<div class="pc pencil ${S.taken.has(o.id) ? 'taken' : ''} ${S.left.has(o.id) ? 'left' : ''}"><span class="k">${S.taken.has(o.id) ? 'taken by ' + P('sam').name : o.kind}</span><p class="small pt">${o.say}</p>
        ${S.taken.has(o.id) || S.left.has(o.id) ? '' : `<div class="acts"><button class="btn sm" data-take="${o.id}">${I('plus', 13)}${o.adds ? 'Add as an explanation' : 'Add the fact to find'}</button><button class="btn sm" data-leave="${o.id}">Leave it</button></div>`}</div>`).join('')}</div>
        <div class="tally"><span><b>${OFFERS.length}</b>offered</span><span><b>${S.taken.size}</b>taken</span><span><b>0</b>cells marked by the model</span></div>
        <p class="small muted">${pencilBy()} It may widen the grid: an explanation, a fact to find, what the other side will say. It never marks a cell, ranks a column or writes the result.</p>`
      : `<div class="card"><p class="small">${I('power-off', 12)} The model is off. Nobody argues the other side unless a person does: ${T('against').name.lc()} on the bench, with a colleague.</p><p class="small muted">No mark, total or result changed: the model never set one.</p></div>`}
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys(); S.fresh = false;
  $$('[data-take]').forEach(b => b.onclick = () => take(b.dataset.take));
  $$('[data-leave]').forEach(b => b.onclick = () => { S.left.add(b.dataset.leave); render(); });
}
function take(id) { S.taken.add(id); S.fresh = id === 'o1'; render(); }
function replay() { clearLater(); S.taken = new Set(); S.left = new Set(); settle(); render(); later(() => take('o1'), MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key.toLowerCase() === 'a') take('o1');
});
replay();
</script>
</body>
</html>
