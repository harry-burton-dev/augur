<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Assumptions · V6 · The challenge</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Assumptions V6: two people. The planner states each assumption; a challenger asks "how do you know?". A challenge can lower a mark, never raise it ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,var(--measure-drawer));gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.who{display:flex;gap:var(--space-5);align-items:center;flex-wrap:wrap}
.who span{display:inline-flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
.who b{font-weight:400;color:var(--light)}
.ex{display:grid;gap:var(--space-2)}
.turn{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) minmax(0,1fr) auto;gap:var(--space-3);align-items:start;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);transition:opacity var(--motion-base) var(--ease-standard)}
.turn .id{font-family:var(--font-mono);color:var(--ink-muted)}
.turn .st{color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.turn .q{color:var(--ink)}
.turn .q .qq{display:block;color:var(--light)}
.turn .q .qq.pen{font-style:italic;color:var(--ink)}
.turn .q .aa{display:block;color:var(--ink-muted);margin-top:2px}
.turn.wait .q,.turn.wait .amk{opacity:0}
.turn .q,.turn .amk{transition:opacity var(--motion-base) var(--ease-out)}
.turn.now{background:var(--x-proposed-lit-wash)}
.mkcell{display:grid;gap:2px;justify-items:start}
.mkcell .was{opacity:var(--x-proposed-quiet)}
.mkcell .was .amk{text-decoration:line-through}
.prog{height:3px;border-radius:2px;background:var(--hairline);overflow:hidden}
.prog i{display:block;height:100%;background:var(--x-proposed-lit);transition:width var(--motion-base) var(--ease-out)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Assumptions · V6</b> the challenge: the planner states, a challenger asks “how do you know?”; a challenge only lowers · murder boards, Tradecraft Primer devil’s advocacy</div>
<script>
/*@DATA@*/
/*@LIB@*/
const OWNER = 'ola', CHAL = 'sam';
/* the mark before the challenge: what the fact alone gives (the challenge lowers a5 with a reason) */
const before = a => { if (!a.mark || !a.fact) return markOf(a); const d = derive(a.fact); return d.rung <= 1 ? 'solid' : d.rung === 2 ? 'caveats' : 'unsupported'; };
const S = { n: 0 };
function render() {
  const g = STATE.gateway, as = DATA.assumptions.filter(a => g || a.ch.by !== 'model');
  const lowered = as.filter((a, i) => i < S.n && before(a) !== markOf(a));
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, T('kac').name, 'The challenge'], [['→', 'next'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="col scroll"><div class="who"><span>${I('user-round', 14)}Planner <b>${P(OWNER).name}</b></span><span>${I('swords', 14)}Challenger <b>${P(CHAL).name}</b></span>${g ? `<span>${I('pencil', 14)}<b class="pen">the assistant</b> may challenge too, in pencil</span>` : ''}</div>
      <div class="prog"><i style="width:${Math.min(S.n, as.length) / as.length * 100}%"></i></div>
      <div class="ex">${as.map((a, i) => { const done = i < S.n, b = before(a), m = markOf(a);
        return `<div class="turn ${done ? '' : 'wait'} ${i === S.n - 1 ? 'now' : ''}"><span class="id">${a.id}</span><span class="st">${a.say}</span>
          <span class="q"><span class="qq ${a.ch.by === 'model' ? 'pen' : ''}">“${a.ch.q}”${a.ch.by === 'model' ? ' <span class="byline">assistant</span>' : ''}</span><span class="aa">${first(OWNER)}: ${a.ch.a}</span></span>
          <span class="mkcell">${b !== m && done ? `<span class="was">${amk(b)}</span>` : ''}${amk(done ? m : b)}</span></div>`; }).join('')}</div>
      ${g ? '' : gatewayNote()}
    </section>
    <aside class="col scroll"><div class="card"><p class="lbl">The rule</p><p class="small">The challenger asks one question per assumption: <b class="lite">how do you know?</b> The answer either points at a fact, whose word sets the mark, or it doesn’t. A challenge may lower a mark, with a reason kept on the record. Nobody can raise one above its fact.</p></div>
      <div class="card"><p class="lbl">Lowered in this round</p>${lowered.length ? lowered.map(a => `<div class="seam small"><b class="lite">${a.id}</b> ${DATA.marks[before(a)].word.lc()} → ${DATA.marks[markOf(a)].word.lc()} by ${P(CHAL).name}: ${a.why}</div>`).join('') : '<p class="small muted">Nothing yet.</p>'}</div>
      <div class="card"><p class="lbl">Who challenges</p><p class="small">Someone who didn’t write the plan, chosen by the planner’s lead. On a ${DATA.intent.kind.lc()} decision, ${P(CHAL).name} or ${P('marta').name}. The model’s challenges count as questions only; a person answers and a person lowers.</p></div>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.n = 0; settle(); render(); DATA.assumptions.forEach((_, i) => later(() => { S.n = i + 1; render(); }, MOMENT() * .5 + i * ms('--motion-base'))); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === 'ArrowRight') { clearLater(); S.n = Math.min(DATA.assumptions.length, S.n + 1); render(); }
});
replay();
</script>
</body>
</html>
