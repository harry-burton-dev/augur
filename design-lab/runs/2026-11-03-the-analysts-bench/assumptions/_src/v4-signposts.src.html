<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Assumptions · V4 · Signposts</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Assumptions V4: each assumption gets a signpost on the calendar, the date by which it would show failing. Signposts AUGUR can't see are drawn, and say so ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.cal{display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,3fr);align-content:start;min-height:0;position:relative}
.cal > *{border-bottom:1px solid var(--hairline);padding:var(--space-2) var(--space-3);min-width:0}
.mh{position:relative;height:var(--space-5);padding:0}
.mh span{position:absolute;bottom:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);transform:translateX(-50%)}
.lane{position:relative;padding:0}
.lname{display:grid;gap:2px;font-size:var(--type-small);line-height:var(--leading-small)}
.lname b{font-weight:400;color:var(--light)}
.post{position:absolute;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--x-proposed-type-micro);line-height:1.3;color:var(--ink);white-space:nowrap;padding:2px var(--space-2);border-radius:var(--radius-key);border:1px solid var(--ink-muted);background:var(--slate-deep);transition:border-color var(--motion-base) var(--ease-standard),box-shadow var(--motion-base) var(--ease-standard)}
.post.blind{border-color:var(--hairline-strong);background:var(--x-proposed-unseen),var(--slate-deep);color:var(--ink-muted)}
.post.next{border-color:var(--x-proposed-lit);box-shadow:0 0 var(--space-4) color-mix(in srgb,var(--x-proposed-lit) 30%,transparent);color:var(--light)}
.span{position:absolute;top:calc(50% - 1px);height:2px;background:var(--hairline-strong)}
.span.blind{background:repeating-linear-gradient(90deg,var(--hairline-strong) 0 var(--space-1),transparent var(--space-1) var(--space-2))}
.cal > .today{position:absolute;top:0;bottom:0;width:1px;padding:0;border:0;background:var(--x-proposed-lit);transition:left var(--motion-calm) var(--ease-out);pointer-events:none}
.cal > .today b{position:absolute;top:var(--space-1);left:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-lit);font-weight:400;white-space:nowrap}
.foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Assumptions · V4</b> signposts: the date each assumption would show failing, on one calendar; the ones AUGUR can’t see are drawn and say why · Dewar (RAND, 1993), indicators and warnings</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* the calendar runs month by month from the decision; each signpost sits where it would show (in months from 1 Dec), or spans if it could come any time */
const MONTHS = ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'];
const WHEN = { a3: [0.3], a7: [1.45], a1: [1.6], a2: [2.95, 4.95], a5: [4.95], a4: ['span'], a6: ['span'] };
const S = { t: 0 };
function render() {
  const pct = m => m / MONTHS.length * 100;
  const as = [...DATA.assumptions].sort((a, b) => (typeof WHEN[a.id][0] === 'number' ? WHEN[a.id][0] : 99) - (typeof WHEN[b.id][0] === 'number' ? WHEN[b.id][0] : 99));
  const next = as.filter(a => typeof WHEN[a.id][0] === 'number' && WHEN[a.id][0] > S.t)[0];
  const nextSeen = as.filter(a => a.sees && typeof WHEN[a.id][0] === 'number' && WHEN[a.id][0] > S.t)[0];
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, T('kac').name, 'Signposts'], [...STD]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">${DATA.plan.title} · signposts from ${DATA.decision.on}</p><p class="sent" style="max-width:84ch">Every assumption gets <b>a signpost</b>: what you would see, and by when, if it were failing. ${DATA.assumptions.filter(a => a.sees).length} AUGUR can watch. ${DATA.assumptions.filter(a => !a.sees).length} it can’t, and they are drawn anyway.</p></div>
    <div class="cal scroll">
      <div class="mh"></div><div class="mh">${MONTHS.map((m, i) => `<span style="left:${pct(i + .5)}%">${m}</span>`).join('')}</div>
      ${as.map(a => { const w = WHEN[a.id];
        return `<div class="lname"><b>${a.id} · ${a.say}</b>${amk(markOf(a))}</div><div class="lane">${w[0] === 'span'
          ? `<span class="span ${a.sees ? '' : 'blind'}" style="left:0;right:0"></span><span class="post ${a.sees ? '' : 'blind'}" style="left:50%">${I(a.sees ? 'eye' : 'eye-off', 11)}${a.sign} · any time</span>`
          : w.map(m => `<span class="post ${a.sees ? '' : 'blind'} ${next === a ? 'next' : ''}" style="left:${pct(m)}%">${I(a.sees ? 'eye' : 'eye-off', 11)}${a.sign.length > 34 ? a.sign.slice(0, 32) + '…' : a.sign}</span>`).join('')}</div>`; }).join('')}
      <div class="today" style="left:calc(25% + ${S.t / MONTHS.length} * 75%)"><b>${S.t < .3 ? 'decided ' + DATA.decision.on : ''}</b></div>
    </div>
    <div class="foot">
      <div class="card"><p class="lbl">Next signpost</p><p class="small">${next ? `<b class="lite">${next.sign}</b> (${next.id}). ${next.sees ? 'AUGUR will see it.' : `AUGUR can’t see it: ${next.cant}. ${P(next.owner).name} checks by hand.`}` : 'None left.'}</p>${nextSeen && nextSeen !== next ? `<p class="small muted">First one AUGUR can see: ${nextSeen.sign.lc()} (${nextSeen.id}).</p>` : ''}</div>
      <div class="card"><p class="lbl">Can’t see, and why</p>${DATA.assumptions.filter(a => !a.sees).map(a => `<p class="small"><span class="blindtag">${I('eye-off', 10)}${a.id}</span> ${a.cant}</p>`).join('')}</div>
      <div class="card"><p class="lbl">When a signpost shows</p><p class="small">The decision is marked <b class="lite">worth revisiting</b> and its chair is asked once. A signpost never changes the decision; people do.</p></div>
    </div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.t = 0; settle(); render(); later(() => { S.t = 0.35; render(); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) { markKeys(); } });
replay();
</script>
</body>
</html>
