<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Assumptions · V1 · Under the plan</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Assumptions V1: the key assumptions check as a list under the Mandate plan. Each mark is worked out from its fact's word; each has a sign it is failing ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.plan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-5);align-items:end}
.plan .sent{max-width:90ch}
.counts{display:flex;gap:var(--space-4);flex-wrap:wrap}
.counts span{display:inline-flex;gap:var(--space-2);align-items:center}
.counts b{font:300 var(--type-heading)/1 var(--font-mono);color:var(--light)}
table{width:100%;border-collapse:collapse;font-size:var(--type-small);line-height:var(--leading-small)}
th,td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);text-align:left;vertical-align:top}
th{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);font-weight:400;position:sticky;top:0;background:var(--slate-deep)}
td{color:var(--ink)}
td.say{color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
td .why{color:var(--ink-muted);display:block;margin-top:2px}
tr.lb td:first-child{box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.load{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--ink-muted)}
.load.high{color:var(--light)}
.mk{transition:opacity var(--motion-calm) var(--ease-out)}
.hold .mk{opacity:0}
.foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Assumptions · V1</b> under the plan: each assumption marked from its fact’s word, each with a sign it is failing · Tradecraft Primer (2009) key assumptions check</div>
<script>
/*@DATA@*/
/*@LIB@*/
const ORDER = ['unsupported', 'gap', 'hidden', 'caveats', 'solid'];
const S = { marked: false };
function render() {
  const rows = [...DATA.assumptions].sort((a, b) => ORDER.indexOf(markOf(a)) - ORDER.indexOf(markOf(b)) || (a.load === 'high' ? -1 : 1));
  const c = markCount(), run = DATA.working.find(w => w.tid === 'kac');
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, T('kac').name], [...STD]) +
  `<main class="main"><div class="wrap ${S.marked ? '' : 'hold'}">
    <div class="plan"><div><p class="eyebrow">${T('kac').name} · ${mins(T('kac').minutes)} · ${run.by.map(p => P(p).name).join(' and ')} · on ${DATA.plan.id}</p><span class="tk">${T('kac').tech}</span>
      <p class="sent">${DATA.plan.text.map(t => t[0]).join('')}</p></div>
      <div class="counts">${Object.keys(DATA.marks).map(k => `<span>${amk(k, false)}<b>${c[k] || 0}</b></span>`).join('')}</div></div>
    <div class="scroll"><table><thead><tr><th>The plan assumes</th><th>Load</th><th>Rests on</th><th>Mark</th><th>Sign it is failing</th><th>Watched by</th></tr></thead><tbody>
      ${rows.map(a => { const k = markOf(a); return `<tr class="${a.load === 'high' && ['unsupported', 'gap', 'hidden'].includes(k) ? 'lb' : ''}">
        <td class="say">${a.say}</td><td><span class="load ${a.load}">${a.load}</span></td>
        <td>${a.fact ? `${DATA.facts[a.fact].say.split(' (')[0]} <span class="why">${yw(a.fact)}</span>` : `<span>${T(a.from).name}</span>`}</td>
        <td class="mk">${amk(k)}<span class="why">${a.mark ? (a.fact ? 'lowered by a person: ' : 'from ' + T(a.from).name.lc() + ': ') + a.why : a.fact ? why(a.fact) : ''}</span></td>
        <td>${a.sign}</td><td>${a.sees ? `${I('eye', 12)} ${a.event}` : `<span class="blindtag">${I('eye-off', 10)}can’t see</span> <span class="why">${a.cant}</span>`}<span class="why">${P(a.owner).name}</span></td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="foot">
      <div class="card"><p class="lbl">How a mark is set</p><p class="small">${Object.entries(DATA.marks).slice(0, 3).map(([k, m]) => `${amk(k)} ${m.rule}`).join('<br>')}</p><p class="small muted">A person may lower a mark, with a reason. Nobody can raise one above its fact.</p></div>
      <div class="card"><p class="lbl">Load-bearing and not solid</p><p class="small">${DATA.assumptions.filter(a => a.load === 'high' && markOf(a) !== 'solid').map(a => `<b class="lite">${a.say}</b>`).join('; ')}. Each needs a sign and a fallback before the plan is decided.</p></div>
      <div class="card"><p class="lbl">Signs AUGUR can’t see</p><p class="small">${DATA.assumptions.filter(a => !a.sees).length} of ${DATA.assumptions.length}: the quote is a letter, round changes are agreed by phone, and a date passing makes no event yet. Each is named, with who watches it by hand.</p></div>
    </div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.marked = false; settle(); render(); later(() => { S.marked = true; $('.wrap').classList.remove('hold'); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) { markKeys(); } });
replay();
</script>
</body>
</html>
