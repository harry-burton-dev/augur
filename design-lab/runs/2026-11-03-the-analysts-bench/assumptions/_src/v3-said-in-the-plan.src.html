<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Assumptions · V3 · Said in the plan</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Assumptions V3: assumptions found in the plan's own words. The model points at phrases in pencil; a person inks each one, and its mark appears beside the words ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--space-6)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.text{font-weight:300;font-size:var(--type-heading);line-height:calc(var(--leading-heading) + var(--space-3));color:var(--ink)}
.text .as{color:var(--light);border-bottom:2px dotted var(--x-proposed-pencil);padding-bottom:2px;cursor:pointer;transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard)}
.text .as.ink{border-bottom-style:solid;border-bottom-color:var(--ink)}
.text .as.hot{background:var(--x-proposed-lit-wash);border-bottom-color:var(--x-proposed-lit)}
.text .as sup{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);margin-left:2px}
.text .plain .as{border-bottom-color:transparent}
.list{display:grid;gap:var(--space-2)}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:start;padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);text-align:left;width:100%}
.it .id{font-family:var(--font-mono);color:var(--ink-muted)}
.it .w{color:var(--ink)}
.it .w.pen{font-style:italic;color:var(--ink-muted)}
.it .sub{grid-column:2/-1;color:var(--ink-muted)}
.it.hot{background:var(--surface-raised)}
.it .amk{transition:opacity var(--motion-calm) var(--ease-out)}
.it.pencilled .amk{opacity:0}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Assumptions · V3</b> said in the plan: the model points at the words that assume, a person inks them, each mark sits beside its words · Tradecraft Primer (2009), decided versus said</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { inked: new Set(), hot: null, pointed: false };
function render() {
  const g = STATE.gateway, show = g ? S.pointed : true;
  const txt = DATA.plan.text.map(([t, id]) => !id ? t : `<span class="as ${S.inked.has(id) || !g ? 'ink' : ''} ${S.hot === id ? 'hot' : ''}" data-a="${id}">${t}<sup>${id}</sup></span>`).join('');
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, T('kac').name, 'In the words'], [['I', 'ink all'], ['↑ ↓', 'move'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="col"><p class="eyebrow">${DATA.plan.id} · ${DATA.plan.title}</p>
      <p class="text ${show ? '' : 'plain'}">${txt}</p>
      <p class="small muted">${g ? `${pencilBy()} pointed at ${DATA.assumptions.length} phrases that assume something. A dotted line is its suggestion; a solid line, a person’s. Only inked phrases are checked.` : `${I('power-off', 12)} The model is off: ${P('ola').name} underlined these by hand. The marks are the same; the model never set one.`}</p>
    </section>
    <aside class="col scroll"><p class="eyebrow">What the words assume</p>
      <div class="list">${DATA.assumptions.map(a => { const inked = S.inked.has(a.id) || !g, k = markOf(a);
        return `<button class="it ${S.hot === a.id ? 'hot' : ''} ${inked ? '' : 'pencilled'}" data-a="${a.id}"><span class="id">${a.id}</span><span class="w ${inked ? '' : 'pen'}">${a.say}</span>${amk(k)}
          <span class="sub">${inked ? (a.fact ? DATA.facts[a.fact].say.split(' (')[0] + ' · ' : '') + (a.mark ? a.why : a.fact ? why(a.fact) : '') : 'suggested · press to ink'}</span></button>`; }).join('')}</div>
      <p class="small muted">Inking a phrase makes it an assumption of the plan. Its mark comes from the fact it rests on, and the plan can’t be decided while a load-bearing one is unmarked.</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('[data-a]').forEach(b => { b.onclick = () => { S.inked.add(b.dataset.a); S.hot = b.dataset.a; render(); }; });
}
function replay() {
  clearLater(); S.inked = new Set(); S.hot = null; S.pointed = false; settle(); render();
  later(() => { S.pointed = true; render(); }, MOMENT() * .5);
  DATA.assumptions.forEach((a, i) => later(() => { S.inked.add(a.id); S.hot = a.id; render(); }, MOMENT() + i * ms('--motion-base')));
  later(() => { S.hot = 'a1'; render(); }, MOMENT() + DATA.assumptions.length * ms('--motion-base'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key.toLowerCase() === 'i') { DATA.assumptions.forEach(a => S.inked.add(a.id)); render(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { const ids = DATA.assumptions.map(a => a.id), k = ids.indexOf(S.hot); S.hot = ids[(k + (e.key === 'ArrowDown' ? 1 : ids.length - 1)) % ids.length]; render(); }
});
replay();
</script>
</body>
</html>
