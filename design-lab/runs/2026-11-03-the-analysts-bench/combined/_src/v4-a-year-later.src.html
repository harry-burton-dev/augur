<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Combined · V4 · A year later</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V4: the new Head of Facilities opens D-142 a year on. The words, how they were tested, what each test said would happen and what did, and the questions she can ask the working ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:var(--space-6)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.hd{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--light);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:0 var(--space-3);line-height:1.8}
.status i{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--ink)}
.words{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);border-left:2px solid var(--ink);padding-left:var(--space-4)}
.seam{font-size:var(--type-small);line-height:var(--leading-small)}
.tests{display:grid;gap:0}
.tt{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(0,1.3fr) minmax(0,1.1fr);gap:var(--space-4);padding:var(--space-3) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.tt .then{color:var(--ink)}
.tt .now{color:var(--light);transition:opacity var(--motion-calm) var(--ease-out)}
.tt .now b{font-weight:400;color:var(--x-proposed-lit)}
.hold .tt .now{opacity:0}
.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3)}
.score div{display:grid;gap:2px;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.score b{font:200 var(--type-heading)/1 var(--font-mono);color:var(--light)}
.qs{display:grid;gap:var(--space-1)}
.qs button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:left}
.qs button[aria-pressed="true"]{background:var(--surface-raised);color:var(--light)}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);padding:var(--space-1) 0;border-bottom:1px solid var(--hairline)}
.ln .ref{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V4</b> a year later: the words, how they were tested, what each test expected and what happened, and questions for the working · kept V1, V3, V6; the minute run’s status beside the words</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = DATA.decision, LT = DATA.later, OV = DATA.outsideView;
const OK = t => /^held|^happened/.test(t);
/* each technique: what it said then, and what happened, read from the score */
const ROWS = [
  { tid: 'outside', then: `${OV.forecast.yes} of ${OV.forecast.of}: about half back under 15 a month by June`, now: () => `<b>${LT.forecast.happened ? 'Happened' : 'Didn’t'}</b>: ${LT.forecast.note.lc()}.` },
  { tid: 'ach', then: X.result, now: () => `<b>Held</b>: ${LT.ach}` },
  { tid: 'kac', then: `${DATA.assumptions.length} assumptions; weakest: ${A(D.weakest).say.lc()}`, now: () => `<b>${DATA.assumptions.filter(a => OK(LT.assumptions[a.id])).length} of ${DATA.assumptions.length} held</b>. The weakest ${LT.assumptions[D.weakest]}, caught by W1.` },
  { tid: 'pre', then: `${DATA.premortem.reasons.length} reasons, ${DATA.watches.length} watches`, now: () => `<b>${Object.values(LT.reasons).filter(t => /^happened|^partly/.test(t)).length} happened</b>, at least partly. Low Moor phase 2 was one; W3 caught it and a 10th vehicle followed.` }
];
const QS = [
  { q: 'Why 12 months and not five?', a: () => [[`${OV.classes[0].yes} of ${OV.classes[0].n} renewals like this recovered within 6 months; five years left no way out.`, `${T('outside').name.lc()} · ${DATA.working[0].on}`], [`The break at 6 months: ${A(D.weakest).say.lc()} was load-bearing and unsupported.`, `${T('kac').name.lc()} · a1`]] },
  { q: 'What couldn’t AUGUR see?', a: () => DATA.watches.filter(w => !w.sees).map(w => [`${w.say}: ${w.cant}.`, `watch ${w.id.toUpperCase()}`]) },
  { q: 'Should I renew it again?', a: () => [[`The working can’t answer that. It can say the break wasn’t used, ${LT.assumptions.a5}, and the round runs 10 vehicles now.`, 'score · ' + LT.today], [`It can offer a technique for the new question: ${T('outside').name.lc()}, ${T('outside').minutes} min, starting from this decision as one more case.`, 'the bench']] }
];
const S = { shown: false, q: 0 };
function render() {
  const yes = DATA.assumptions.filter(a => OK(LT.assumptions[a.id])).length;
  $('#app').innerHTML = topHTML(['Mandate', F('fac').name, 'Decisions', D.id], [['1–3', 'a question'], ...STD]) +
  `<main class="main"><div class="wrap ${S.shown ? '' : 'hold'}">
    <section class="col scroll"><div class="hd"><p class="eyebrow">${D.id} · ${D.body} · ${D.on} · opened by ${P(LT.reader).name}, ${LT.today}</p><span class="status"><i></i>In force</span></div>
      <p class="words">${D.words}</p>
      <p class="seam">Worth revisiting from 19 to 22 Jan 2027 (W1: 8 vehicles); kept by ${P(D.chair).name}. Worth revisiting on 28 Feb (W2: 22 missed); kept.</p>
      <p class="eyebrow" style="margin-top:var(--space-2)">How it was tested, and what happened</p>
      <div class="tests">${ROWS.map(r => { const w = DATA.working.find(x => x.tid === r.tid); return `<div class="tt"><span>${tq(r.tid, 14)}<span class="muted" style="display:block">${w.on} · ${w.took} min · ${w.by.map(first).join(', ')}</span><span class="tk">${T(r.tid).tech}</span></span><span class="then"><span class="muted">Said:</span> ${r.then}</span><span class="now">${r.now()}</span></div>`; }).join('')}</div>
      <div class="score"><div><b>${yes}/${DATA.assumptions.length}</b>assumptions held</div><div><b>${LT.forecast.said}</b>forecast, and it happened</div><div><b>${DATA.later.events.filter(e => e.w && !e.closed && W(e.w).sees).length}</b>watches crossed and seen</div><div><b>1</b>crossed and missed for 12 days: AUGUR had no clock</div></div>
    </section>
    <aside class="col scroll"><p class="eyebrow">Ask the working</p>
      <div class="qs">${QS.map((x, i) => `<button aria-pressed="${S.q === i}" data-i="${i}"><span class="kbd">${i + 1}</span>${x.q}</button>`).join('')}</div>
      <div>${QS[S.q].a().map(([t, r]) => `<div class="ln"><span>${t}</span><span class="ref">${r}</span></div>`).join('')}</div>
      <div class="card"><p class="lbl">For the floor’s record</p><p class="small">${D.id} adds four runs to ${F('fac').name}’s bench record: all four changed a line, and the forecast came true. ${LT.record.sameAsSaid}.</p></div>
      ${gatewayNote()}
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.qs button').forEach(b => b.onclick = () => { S.q = +b.dataset.i; render(); });
}
function replay() { clearLater(); S.shown = false; S.q = 0; settle(); render(); later(() => { S.shown = true; $('.wrap').classList.remove('hold'); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (/^[1-3]$/.test(e.key)) { S.q = +e.key - 1; render(); }
});
replay();
</script>
</body>
</html>
