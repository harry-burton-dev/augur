<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Combined · V1 · The renewal, end to end</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V1: Facilities decides whether to renew Calder. Four techniques in the order a decision needs them; the draft at the top changes as each one changes a line; the working builds up on the right and goes with the decision ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3)}
.steps{display:flex;gap:var(--space-1);align-items:stretch}
.stp{flex:1;display:grid;gap:2px;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);text-align:left;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);min-width:0}
.stp b{font-weight:400;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp.done b{color:var(--ink)}
.stp.on{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.stp.on b{color:var(--light)}
.draft{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-4);align-items:baseline;padding:var(--space-2) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane)}
.draft .w{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.draft del{color:var(--ink-muted);text-decoration-color:var(--x-proposed-against);text-decoration-thickness:2px}
.draft ins{text-decoration:none;border-bottom:2px solid var(--x-proposed-lit)}
.draft ins.fresh{background:var(--x-proposed-lit-wash)}
.draft .tag{font:500 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-lit);vertical-align:super;margin-left:1px}
.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,var(--measure-drawer));gap:var(--space-5);min-height:0}
.stage{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding-right:var(--space-2)}
.q{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.rail{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.wk{border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-2) var(--space-3);display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);background:var(--surface-inset);transition:border-color var(--motion-base) var(--ease-standard)}
.wk.fresh{border-color:var(--x-proposed-lit)}
.wk .ch{color:var(--light)}
.wk .ch::before{content:"Changed: ";color:var(--ink-muted)}
.wk.todo{border-style:dashed;color:var(--ink-muted);background:none}
/* stage parts */
.dots{display:flex;gap:var(--space-2);flex-wrap:wrap}
.dot{width:var(--space-5);height:var(--space-5);border-radius:50%;border:1.5px solid var(--ink)}
.dot.yes{background:var(--light);border-color:var(--light)}
.dot.late{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.dot.ended{border-style:dashed;border-color:var(--ink-muted)}
.big{font:200 var(--type-title)/1 var(--font-mono);color:var(--light)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4)}
.tbar{position:relative;height:var(--space-4);border-radius:2px;background:var(--hairline)}
.tbar .rng{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 35%,transparent);border-radius:2px}
.tbar .have{position:absolute;top:calc(var(--space-1) * -1);bottom:calc(var(--space-1) * -1);width:2px;background:var(--x-proposed-lit)}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline)}
.opt .id{font-family:var(--font-mono);color:var(--ink-muted)}
.opt.drop b{text-decoration:line-through;text-decoration-color:var(--x-proposed-against);color:var(--ink-muted);font-weight:400}
.opt.keep b{color:var(--light);font-weight:400}
.alist{display:grid;gap:0}
.ar{display:grid;grid-template-columns:var(--space-5) minmax(0,1.4fr) auto minmax(0,1.2fr);gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);align-items:start}
.ar .id{font-family:var(--font-mono);color:var(--ink-muted)}
.ar.lb .s{color:var(--light)}
.fates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.fate{display:grid;gap:var(--space-1);align-content:start}
.fate h3{display:flex;gap:var(--space-2);align-items:center;font-weight:300;font-size:var(--type-meta);color:var(--light);margin:0}
.fate .it{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);padding:var(--space-1) var(--space-2);border-left:2px solid var(--hairline-strong)}
.words{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);border-left:2px solid var(--ink);padding-left:var(--space-4)}
.status{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--light);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:0 var(--space-3);line-height:1.8}
.status i{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--ink)}
.watchg{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2) var(--space-4)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V1</b> the renewal, end to end: four techniques in order, the draft changing as each changes a line, the working kept with the decision · grammar V4, choose V3, explanations V1, assumptions V1 and V5, premortem V3, kept V1 and V4</div>
<script>
/*@DATA@*/
/*@LIB@*/
const OV = DATA.outsideView, D = DATA.decision, PM = DATA.premortem;
const STAGES = [
  { tid: 'outside', title: 'How renewals like this go' },
  { tid: 'ach', title: 'Why service fell' },
  { tid: 'kac', title: 'What the plan rests on' },
  { tid: 'pre', title: 'Imagine it failed' },
  { tid: null, title: 'The decision, with its working' }
];
const S = { st: 0, applied: 0, fresh: -1 };
const order = ['outside', 'ach', 'kac', 'pre'];
/* the draft at the top: each technique's recorded changes are applied once its stage is done */
function draftHTML() {
  const done = order.slice(0, S.applied);
  let w = D.draft;
  D.changes.forEach((c, i) => {
    if (!done.includes(c.tid)) return;
    const fresh = c.tid === order[S.fresh] ? 'fresh' : '', tag = `<span class="tag">${order.indexOf(c.tid) + 1}</span>`;
    if (c.from && w.includes(c.from)) w = w.replace(c.from, `<del>${c.from}</del> <ins class="${fresh}">${c.to}</ins>${tag}`);
    else if (!c.from && !D.draft.includes(c.to)) w = w.replace(/\.$/, `, and <ins class="${fresh}">${c.to.charAt(0).lc() + c.to.slice(1)}</ins>${tag}.`);
    else if (!c.from) w = w.replace(c.to, `<ins class="${fresh}">${c.to}</ins>${tag}`);
  });
  return w;
}
function stageHTML() {
  const st = STAGES[S.st];
  if (st.tid === 'outside') {
    const c = OV.classes[0], tn = OV.tender;
    return `<p class="q">${OV.question}</p>
      <div class="row2"><div class="card"><p class="lbl">${c.name} · ${DATA.sources[c.from].name}</p><div class="dots">${OV.cases.map(x => `<span class="dot ${x.out}" title="${x.name}, ${x.year}: ${OV.outWord[x.out]}"></span>`).join('')}</div>
        <p><span class="big">${c.yes} of ${c.n}</span> <span class="muted">back to target within 6 months</span></p>
        <p class="small muted">The inside view: ${OV.inside.who} says “${OV.inside.says}”. It is kept beside the count, not in place of it.</p>
        ${OV.steps.map(s => `<p class="small">${I('move-right', 12)} ${P(s.by).name}: ${s.move > 0 ? '+' + s.move : 'holds'}. ${s.why}.</p>`).join('')}
        <p class="small">Forecast kept: <b class="lite">${OV.forecast.yes} of ${OV.forecast.of}</b>, scored when June 2027 comes.</p></div>
      <div class="card"><p class="lbl">${tn.question}</p><div class="tbar"><span class="rng" style="left:${tn.min / 8 * 100}%;width:${(tn.max - tn.min) / 8 * 100}%"></span><span class="have" style="left:${tn.haveMonths / 8 * 100}%"></span></div>
        <p class="small">${tn.n} waste tenders here took <b class="lite">${tn.min} to ${tn.max} months</b>. Notice leaves <b class="lite">${tn.haveMonths}</b> (the line).</p>
        <div>${DATA.options.map(o => `<div class="opt ${o.fate === 'Dropped' ? 'drop' : 'keep'}"><span class="id">${o.id}</span><b>${o.say}</b><span></span><span class="muted">${o.fate === 'Dropped' ? 'Dropped: ' + o.why : 'Still standing'}</span></div>`).join('')}</div></div></div>`;
  }
  if (st.tid === 'ach') return `<p class="q">${X.question}</p>${matrixHTML({ lit: new Set(X.rows.filter(r => Object.values(r.m).includes('II')).map(r => r.id)), compact: true, tech: false })}
      <p class="small"><b class="lite">${X.result}</b> ${H('h1').short} (${H('h1').by}) has most against it. Next fact: ${X.split.fact.lc()}, from ${P(X.split.who).name}.</p>`;
  if (st.tid === 'kac') return `<p class="q">${DATA.plan.title}: what does it rest on?</p>
      <div class="alist">${DATA.assumptions.map(a => { const k = markOf(a); return `<div class="ar ${a.load === 'high' && k !== 'solid' ? 'lb' : ''}"><span class="id">${a.id}</span><span class="s">${a.say} <span class="muted">· ${a.load}</span></span>${amk(k)}<span>${a.sees ? I('eye', 12) : `<span class="blindtag">${I('eye-off', 10)}can’t see</span>`} ${a.sign}</span></div>`; }).join('')}</div>
      <p class="small">Below the bar (${DATA.yardstick[DATA.intent.bar].word.lc()}): ${DATA.assumptions.filter(a => markOf(a) !== 'solid').length}, each with a hedge written. Load-bearing and unsupported: <b class="lite">${A('a1').say}</b>.</p>`;
  if (st.tid === 'pre') return `<p class="q">It is ${PM.future}. The renewal failed. Why?</p>
      <p class="small muted">${PM.room.map(p => P(p).name).join(', ')}, and the assistant in pencil · ${PM.silentMinutes} minutes alone, then read aloud · ${plural(PM.reasons.length, 'reason')}</p>
      <div class="fates">${[['change', 'Change the plan now', 'pencil-ruler'], ['watch', 'Watch for it', 'eye'], ['accept', 'Accept, by name', 'hand']].map(([f, n, ic]) => `<div class="fate"><h3>${I(ic, 15)}${n}</h3>${PM.clusters.filter(c => c.to === f && (STATE.gateway || c.id !== 'county')).map(c => `<span class="it">${c.name}: ${f === 'change' ? c.change : f === 'watch' ? W(c.watch).line : c.why}</span>`).join('')}</div>`).join('')}</div>`;
  const wk = A(D.weakest);
  return `<div style="display:flex;gap:var(--space-3);align-items:center"><p class="eyebrow">${D.id} · ${D.body} · ${D.on}</p><span class="status"><i></i>In force</span></div>
      <p class="words">${D.words}</p>
      <div class="row2"><div class="card"><p class="lbl">Decided below its bar, with a hedge</p><p class="small">No surer than <b class="lite">${wk.say}</b> ${amk(markOf(wk))}</p><div class="hedge">${D.hedge}</div></div>
        <div class="card"><p class="lbl">Its watches</p><div class="watchg">${DATA.watches.map(w => watchHTML(w, { listens: false, owner: false })).join('')}</div></div></div>
      <div class="row2"><div class="card"><p class="lbl">Revisit if</p><p class="small">Any watch crosses its line. ${D.id} is then marked <b class="lite">worth revisiting</b> and ${P(D.chair).name} is asked once; a watch never changes the decision.</p></div>
        <div class="card"><p class="lbl">Options set aside, kept</p>${DATA.options.filter(o => o.fate === 'Dropped').map(o => `<p class="small"><span class="struck">${o.say}</span> · ${T(o.by).name.lc()}: ${o.why}</p>`).join('')}</div></div>`;
}
function render() {
  const took = sum(DATA.working.slice(0, S.applied), w => w.took);
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, DATA.intent.title], [['← →', 'stage'], ['1–5', 'jump'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div class="steps">${STAGES.map((s, i) => `<button class="stp ${S.st === i ? 'on' : ''} ${i < S.applied ? 'done' : ''}" data-i="${i}"><span class="mono">${i + 1} ${s.tid ? '· ' + T(s.tid).minutes + ' min' : '· ' + D.on}</span><b>${s.tid ? T(s.tid).name : s.title}</b></button>`).join('')}</div>
    <div class="draft"><span class="lbl">${S.st === 4 ? 'Draft to decided' : 'The draft'}</span><span class="w">${draftHTML()}</span></div>
    <div class="body"><section class="stage scroll">${stageHTML()}</section>
      <aside class="rail scroll"><p class="eyebrow">The working · ${took} min so far</p>
        ${DATA.working.map((w, i) => i < S.applied ? `<div class="wk ${i === S.fresh ? 'fresh' : ''}">${tq(w.tid, 14)}<span class="muted">${w.on} · ${mins(w.took)} · ${w.by.map(first).join(', ')}</span><span>${w.result}</span><span class="ch">${w.changed}</span></div>` : `<div class="wk todo">${tq(w.tid, 14)}<span>${mins(w.said)} · not run yet</span></div>`).join('')}
        <p class="small muted">It goes with ${D.id} when it is decided, and shows at every height: the chip, the card and the page.</p>${gatewayNote()}
      </aside></div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.stp').forEach(b => b.onclick = () => go(+b.dataset.i));
}
/* moving to a stage counts the stages before it as done; finishing a technique stage applies its changes */
function go(i) { clearLater(); S.st = Math.max(0, Math.min(4, i)); S.applied = Math.max(S.applied, S.st); S.fresh = -1; render(); if (S.st < 4 && S.applied === S.st) later(() => { S.applied = S.st + 1; S.fresh = S.st; render(); }, MOMENT()); }
function replay() { clearLater(); S.st = 0; S.applied = 0; S.fresh = -1; settle(); render(); later(() => { S.applied = 1; S.fresh = 0; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === 'ArrowRight') go(S.st + 1);
  if (e.key === 'ArrowLeft') go(S.st - 1);
  if (/^[1-5]$/.test(e.key)) go(+e.key - 1);
});
replay();
</script>
</body>
</html>
