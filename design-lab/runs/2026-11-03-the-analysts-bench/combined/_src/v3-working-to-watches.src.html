<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Combined · V3 · From working to watches</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V3: what the working does after the meeting. Each assumption and premortem reason became a watch; when an event crosses one, the chain runs: watch, assumption, decision, hedge, one person asked. Pins show what the events service would need ---- */
.wrap{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:var(--space-4)}
.top3{display:grid;grid-template-columns:minmax(240px,.9fr) minmax(0,1.5fr) minmax(260px,1fr);gap:var(--space-5);min-height:0}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.wv{padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard)}
.wv.hot{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.wv .from{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);margin-top:2px}
.chain{display:grid;gap:0}
.link{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr);gap:var(--space-3);padding:var(--space-2) 0;opacity:.3;transition:opacity var(--motion-calm) var(--ease-out)}
.link.on{opacity:1}
.link .ic{display:grid;justify-items:center;gap:var(--space-1)}
.link .ic span{width:var(--space-6);height:var(--space-6);border-radius:50%;border:1px solid var(--hairline-strong);display:grid;place-items:center;color:var(--ink)}
.link.on .ic span{border-color:var(--x-proposed-lit);color:var(--light)}
.link .ic i{width:1px;flex:1;min-height:var(--space-3);background:var(--hairline-strong)}
.link .t{display:grid;gap:2px;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.link .t b{font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.link .t .muted{color:var(--ink-muted)}
.st{display:inline-flex;align-items:center;gap:var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:0 var(--space-2);font-size:var(--type-small);line-height:1.6;color:var(--light)}
.st.rev{border-color:var(--x-proposed-disagree);color:var(--x-proposed-disagree)}
.need{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-1) 0}
.need b{color:var(--ink);font-weight:400}
.need .pin{display:inline-grid;place-items:center;width:var(--space-5);height:var(--space-5);border-radius:50%;background:var(--x-proposed-lit);color:var(--slate-deep);font:500 var(--type-small)/1 var(--font-mono)}
.need.gap .pin{background:none;border:1.5px dashed var(--x-proposed-lit);color:var(--x-proposed-lit)}
.tl{position:relative;height:calc(var(--space-6) + var(--space-3));border-top:1px solid var(--hairline-strong);margin:0 var(--space-4)}
.tl .e{position:absolute;top:calc(var(--space-1) * -1 - 1px);transform:translateX(-50%);display:grid;justify-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted);white-space:nowrap;cursor:pointer}
.tl .e i{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--ink-muted)}
.tl .e.on{color:var(--light)}
.tl .e.on i{background:var(--x-proposed-lit);box-shadow:0 0 var(--space-3) var(--x-proposed-lit)}
.tl .e.blind i{background:none;border:1px dashed var(--ink-muted)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V3</b> from working to watches: an event crosses a watch and the chain runs to one person asked; pins show what the events service needs · assumptions V4, premortem V6, the briefing run’s watches</div>
<script>
/*@DATA@*/
/*@LIB@*/
const LT = DATA.later, D = DATA.decision;
/* what happened, event by event, and the chain each one runs. Built from the decision's watches and the year's events */
const CHAINS = {
  '19 Jan 2027': [
    ['database', 'An event', `${DATA.sources.s3.name}: 8 vehicles in the week of 18 Jan.`, 'Data Atlas fact changed · old value 7, new value 8'],
    ['eye', 'Watch W1 crossed', `${W('w1').say}: ${W('w1').line}.`, `From ${T('kac').name.lc()} (a1) and ${T('pre').name.lc()} (vehicles never came back)`],
    ['list-checks', 'Assumption a1 is failing', `${A('a1').say}. Marked ${DATA.marks[markOf(A('a1'))].word.lc()} on ${DATA.working[2].on}.`, 'It was the weakest; the decision was no surer than it'],
    ['flag', `${D.id} worth revisiting`, `<span class="st rev">${I('flag', 12)}worth revisiting</span> The words don’t change. The status beside them does.`, 'One of five reasons an answer moves: a fact it rests on changed'],
    ['split', 'The hedge is offered', D.hedge, 'Written at the table on ' + D.on + ', so nobody has to invent it now'],
    ['inbox', `${P(D.chair).name} is asked, once`, 'An Inbox item: keep, use the hedge, or reopen. No reminder loop.', 'Nobody else is told: the watch has one owner, and the chair']
  ],
  '25 Jan 2027': [
    ['database', 'An event', 'The 9th vehicle joined the round.', 'Data Atlas fact changed · 8 → 9'],
    ['eye', 'Watch W1 back inside its line', `${W('w1').say}: 9.`, 'Quiet again; nothing lights'],
    ['list-checks', 'Assumption a1 held, a week late', `${LT.assumptions.a1}.`, 'Kept for the score, not raised: a held assumption keeps its mark from the day'],
    ['flag', `${D.id} in force`, `<span class="st">${I('circle', 12)}in force</span> ${P(D.chair).name} kept it on 22 Jan; the hedge wasn’t used.`, 'The status moves back, with a seam'],
    ['inbox', 'Nobody is asked', 'A watch going quiet is news for the record, not for a person.', 'Dark when normal']
  ],
  '12 May 2027': [
    ['clock', 'No event', `${W('w4').line}: nothing fired on 30 Apr.`, 'A date passing makes no event yet'],
    ['eye-off', 'Watch W4 couldn’t see it', `${W('w4').say}: ${W('w4').cant}.`, 'It said so on the decision since 10 Dec'],
    ['user-round', 'Found by hand, 12 days late', LT.events.find(e => e.w === 'w4').say, 'The cost of the missing clock, in days']
  ]
};
const NEEDS = [
  ['Fact-changed events with old and new values', 'so a watch can test its line without reading the whole record', false],
  ['A clock: dates passing as events', 'W4 and W6 wait on dates; today nothing fires', true],
  ['Silence as an event', '“no report by 15 Jan” is the absence of one', true],
  ['Lines tested on saved questions, with the watcher’s access', 'the watch keeps the query, never a copied number', false],
  ['A reason on every notice', 'one of the five reasons an answer moves', false],
  ['A “can’t see” list per watch, published with it', 'so silence never reads as “nothing changed”', false]
];
const DATES = Object.keys(CHAINS);
const S = { d: 0, n: 0 };
function render() {
  const d = DATES[S.d], ch = CHAINS[d];
  const hot = { '19 Jan 2027': 'w1', '25 Jan 2027': 'w1', '12 May 2027': 'w4' }[d];
  $('#app').innerHTML = topHTML(['Mandate', D.id, 'Watches'], [['← →', 'event'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div class="top3">
      <section class="col scroll"><p class="eyebrow">${D.id} left ${DATA.watches.length} watches</p>
        ${DATA.watches.map(w => `<div class="wv ${hot === w.id ? 'hot' : ''}">${watchHTML(w)}<p class="from">from ${w.from.map(f => f.startsWith('a') ? f : 'premortem').join(' · ')}</p></div>`).join('')}</section>
      <section class="col scroll"><p class="eyebrow">${d} · what runs</p>
        <div class="chain">${ch.map(([ic, b, t, m], i) => `<div class="link ${i < S.n ? 'on' : ''}"><div class="ic"><span>${I(ic, 16)}</span>${i < ch.length - 1 ? '<i></i>' : ''}</div><div class="t"><b>${b}</b><span>${t}</span><span class="muted">${m}</span></div></div>`).join('')}</div></section>
      <aside class="col scroll"><p class="eyebrow">What the events service would need</p>
        ${NEEDS.map(([b, w, gap], i) => `<div class="need ${gap ? 'gap' : ''}"><span class="pin">${i + 1}</span><span><b>${b}</b> ${w}${gap ? ' <span class="lit-ink">· missing today</span>' : ''}</span></div>`).join('')}
        <div class="card"><p class="lbl">Confidence, worked out again</p><p class="small">A watch never changes a word itself. The fact changes; the yardstick works the word out again; the decision is no surer than its weakest claim, and says which one.</p></div></aside>
    </div>
    <div class="tl">${LT.events.map(e => { const pct = DATES.includes(e.d) ? 1 : 0; const x = (['Jan', 'Feb', 'Mar', 'Apr', 'May'].indexOf(e.d.split(' ')[1]) + (+e.d.split(' ')[0]) / 31) / 5.2 * 100; return `<span class="e ${e.d === d ? 'on' : ''} ${e.w && !W(e.w).sees ? 'blind' : ''}" style="left:${x}%" title="${e.d}: ${e.say.replace(/"/g, '')}" ${pct ? `data-d="${DATES.indexOf(e.d)}"` : ''}><i></i>${pct ? e.d.split(' ').slice(0, 2).join(' ') : ''}</span>`; }).join('')}</div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.tl .e[data-d]').forEach(b => b.onclick = () => pick(+b.dataset.d));
}
function run() { clearLater(); S.n = 0; render(); CHAINS[DATES[S.d]].forEach((_, i) => later(() => { S.n = i + 1; render(); }, MOMENT() + i * ms('--motion-base'))); }
function pick(i) { S.d = Math.max(0, Math.min(DATES.length - 1, i)); run(); }
function replay() { settle(); S.d = 0; run(); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === 'ArrowRight') pick(S.d + 1);
  if (e.key === 'ArrowLeft') pick(S.d - 1);
});
replay();
</script>
</body>
</html>
