<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Combined · V2 · A part any app opens</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V2: the bench as a kit part. Opened on a sentence in an Artifacts briefing, it offers one technique by rule, runs in a sheet beside the work, and attaches its result to the sentence. Pins show the part's contract ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,calc(var(--measure-drawer) + var(--space-8)));gap:0}
.doc{min-height:0;padding:0 var(--space-6) 0 0;display:flex;flex-direction:column;gap:var(--space-3);transition:filter var(--motion-slow) var(--ease-standard),opacity var(--motion-slow) var(--ease-standard)}
.doc h1{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.doc p.b{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink);max-width:var(--measure-read)}
.sel{background:color-mix(in srgb,var(--info) 18%,transparent);border-radius:2px;color:var(--light)}
.att{display:inline-flex;align-items:center;gap:var(--space-1);margin-left:var(--space-1);padding:0 var(--space-2);border:1px solid var(--x-proposed-lit);border-radius:var(--radius-pill);font-size:var(--type-small);line-height:1.6;color:var(--light);vertical-align:1px;white-space:nowrap;animation:in var(--motion-calm) var(--ease-out)}
@keyframes in{from{opacity:0}to{opacity:1}}
.seamline{display:block;margin-top:var(--space-1)}
.sheet{position:relative;min-height:0;border-left:1px solid var(--hairline-strong);background:var(--surface-pane);backdrop-filter:blur(var(--surface-blur));padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.quote{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);border-left:2px solid var(--info);padding-left:var(--space-3)}
.why{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.res{display:grid;gap:var(--space-2)}
.res .r{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.pin{display:inline-grid;place-items:center;width:var(--space-5);height:var(--space-5);border-radius:50%;background:var(--x-proposed-lit);color:var(--slate-deep);font:500 var(--type-small)/1 var(--font-mono);flex:none;transition:opacity var(--motion-base) var(--ease-out)}
.pins-off .pin.p{opacity:0}
.pin.p{position:absolute;z-index:2}
.contract{display:grid;gap:var(--space-1);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.contract div{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.contract div b{color:var(--ink);font-weight:400}
.mini{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,var(--space-7));gap:var(--space-1) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);align-items:center}
.mini .h{color:var(--ink-muted);font-size:var(--x-proposed-type-micro);line-height:1.3;text-align:center}
.mini .h:first-child{text-align:left}
.mini .cm{justify-self:center}
.mini .cm{width:var(--space-6);height:var(--space-4)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V2</b> a part any app opens: the bench as a kit sheet on a sentence, its result attached in place · choose V4, grammar V4 and V6, explanations V1</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* the briefing in Artifacts (sample), and the sentence Sam selected */
const DOC = [
  `Missed collections on the ${DATA.round} stepped up in July, from 14 to 31 a month.`,
  `SEL`,
  `Notice is due by ${DATA.contract.notice}. Two other framework suppliers could bid.`,
  `Recommendation: renew for 12 months, with a break at 6 months.`
];
const SEL = `${DATA.supplier} says most missed collections were caused by road closures.`;
/* the part's contract: what any app passes in, and what comes back */
const CONTRACT = [
  ['Opened by any app', 'on a selection, with the output’s Ref and the selected text. Apps never import the bench; they ask the kit for the sheet.'],
  ['Offers one technique, by rule', 'from the kind of sentence and its sources. The model may suggest; the rule chooses.'],
  ['Reads facts and intents by Ref', 'from Data Atlas and Mandate, with the reader’s own access. Nothing is copied in.'],
  ['Runs beside the work', 'in a sheet; the app stays where it was, out of focus, not hidden.'],
  ['Leaves a result record', 'with its own Ref, cited by the sentence it tested. It shows as a chip, a card or a page.'],
  ['Says so on the events service', 'so watches, the decision and the floor’s score can pick it up.']
];
const S = { stage: 'offer', pins: false };
function render() {
  const done = S.stage === 'done', r = DATA.working.find(w => w.tid === 'ach');
  const hs = ['h1', 'h2', 'h3'].map(H);
  $('#app').innerHTML = topHTML(['Artifacts', 'Facilities briefings', `North round: renew ${DATA.supplier}?`], [['A', 'attach'], ['P', 'pins'], ...STD]) +
  `<main class="main"><div class="wrap ${S.pins ? '' : 'pins-off'}">
    <article class="doc scroll" style="${done ? '' : 'filter:blur(1px) saturate(.6);opacity:.75'}"><p class="eyebrow">Draft · ${P('sam').name} · for ${P('jo').name}</p><h1>North round: renew ${DATA.supplier}?</h1>
      ${DOC.map(t => t === 'SEL' ? `<p class="b"><span class="${done ? '' : 'sel'}">${SEL}</span>${done ? `<span class="att">${I(T('ach').icon, 12)}tested · ${H('h1').short.lc()} has most against it</span><span class="seamline seam small">${T('ach').name}, ${r.on}: ${against('h1')} against, two facts rule it out. ${X.result}</span>` : ''}</p>` : `<p class="b">${t}</p>`).join('')}
    </article>
    <aside class="sheet scroll"><span class="pin p" style="top:var(--space-2);left:calc(var(--space-2) * -1)">1</span>
      <div class="hd"><p class="eyebrow">Test this sentence</p><button class="btn sm">${I('x', 13)}Close</button></div>
      <p class="quote">${SEL}</p>
      ${S.stage === 'offer' ? `<div style="position:relative"><span class="pin p" style="top:calc(var(--space-2) * -1);right:0">2</span>${offerHTML('ach', `It explains a fall, and it is ${DATA.supplier}’s own explanation. Line it up against the others before the briefing leans on it.`, { label: 'One technique fits' })}</div>
        <p class="why">Also fits, offered later: ${T('qic').name.lc()} (the sentence rests on one supplier-written source).</p>`
      : `<div class="res"><p class="lbl">${tq('ach', 14)} · done · ${mins(r.took)} · ${r.by.map(first).join(', ')}</p>
          <div class="mini"><span class="h">Fact</span>${hs.map(h => `<span class="h">${h.short}</span>`).join('')}${X.rows.filter(x => ['e2', 'e3', 'e5'].includes(x.id)).map(x => `<span>${DATA.facts[x.fact].say.split(':')[0]}</span>${hs.map(h => cm(x.m[h.id])).join('')}`).join('')}</div>
          <p class="r">${X.result}</p><p class="why">Attached to the sentence as a chip, kept as a result record (${DATA.intent.id} · working).</p></div>`}
      <div class="contract" style="position:relative"><p class="lbl">The part’s contract</p>${CONTRACT.map(([b, w], i) => `<div><span class="pin">${i + 1}</span><span><b>${b}</b> ${w}</span></div>`).join('')}</div>
      ${gatewayNote()}
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.stage = 'offer'; S.pins = false; settle(); render(); later(() => { S.stage = 'done'; render(); }, MOMENT()); later(() => { S.pins = true; render(); }, MOMENT() + ms('--motion-calm')); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key.toLowerCase() === 'a') { S.stage = 'done'; render(); }
  if (e.key.toLowerCase() === 'p') { S.pins = !S.pins; render(); }
});
replay();
</script>
</body>
</html>
