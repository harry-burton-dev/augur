<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Choosing · V6 · The time you have</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Choosing V6: the person says how much time and how many people they have; the offer fits, and says what a cheaper choice gives up ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:var(--space-6)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.q{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.seg{display:flex;gap:var(--space-1);flex-wrap:wrap}
.seg button{height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-key);font:400 var(--type-meta)/1 var(--font-mono);color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash);color:var(--light)}
.cands{display:grid;gap:var(--space-2)}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);transition:opacity var(--motion-base) var(--ease-standard),border-color var(--motion-base) var(--ease-standard)}
.cand.no{opacity:var(--x-proposed-quiet);border-style:dashed}
.cand.on{border-color:var(--x-proposed-lit)}
.cand .why{font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.gives{border-left:2px solid var(--x-proposed-disagree);padding:var(--space-2) var(--space-3);background:var(--x-proposed-disagree-wash);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Choosing · V6</b> the time you have: the offer fits your minutes and people, and says what the cheaper one gives up · Klein (2007), consequence preview</div>
<script>
/*@DATA@*/
/*@LIB@*/
const KIND = DATA.kinds.find(k => k.id === 'commit');
/* for this kind of question, the order AUGUR prefers, and what each would leave out compared with the first */
const PREF = [
  { tid: 'pre', need: 3, loses: '' },
  { tid: 'kac', need: 1, loses: 'Nobody else imagines it failing, so reasons only the depot or Finance would think of are missed, and you get no watches from them.' },
  { tid: 'against', need: 2, loses: 'You test the choice, not the plan: what it rests on stays unchecked.' },
  { tid: 'outside', need: 1, loses: 'You get a starting count, not reasons. Nothing becomes a watch.' }
];
const MINS = [5, 10, 15, 30], PEOPLE = [[1, 'just me'], [2, 'two of us'], [5, 'the team']];
const S = { m: 30, p: 5 };
function render() {
  const fit = c => T(c.tid).minutes <= S.m && c.need <= S.p;
  const pick = PREF.find(fit), top = PREF[0];
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, 'Test a judgement'], [['1–4', 'minutes'], ['Q W E', 'people'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="col"><p class="eyebrow">Your question</p><p class="q">“We sign on ${DATA.decision.on.split(' ').slice(0, 2).join(' ')}. ${KIND.ask.split('. ')[1]}”</p>
      <p class="eyebrow">How long do you have?</p><div class="seg">${MINS.map((m, i) => `<button aria-pressed="${S.m === m}" data-m="${m}">${m} min</button>`).join('')}</div>
      <p class="eyebrow">Who can join?</p><div class="seg">${PEOPLE.map(([n, w]) => `<button aria-pressed="${S.p === n}" data-p="${n}">${w}</button>`).join('')}</div>
      <div class="cands">${PREF.map(c => { const t = T(c.tid), ok = fit(c); return `<div class="cand ${ok ? '' : 'no'} ${pick === c ? 'on' : ''}">${tq(c.tid, 14)}${mins(t.minutes)}<span class="why">${ok ? t.people : t.minutes > S.m ? `needs ${t.minutes} min` : `needs ${c.need}+ people`}</span></div>`; }).join('')}</div>
      <p class="small muted">Nothing that doesn’t fit is hidden: it stays in the list and says what it needs.</p>
    </section>
    <aside class="col">${pick ? offerHTML(pick.tid, pick === top ? `It is the one that fits a decision about to be signed, and you have the time and the people for it.` : `It is the best that fits ${S.m} minutes and ${PEOPLE.find(p => p[0] === S.p)[1]}.`) : `<div class="card"><p class="lbl">Nothing on the bench fits ${S.m} minutes</p><p class="small">Write down the one thing you are surest of and why. Then book ${T(top.tid).minutes} minutes with the team before ${DATA.intent.due}: AUGUR can hold the slot on ${DATA.intent.id}.</p></div>`}
      ${pick && pick !== top ? `<div class="gives"><b>Compared with ${T(top.tid).name.lc()}, you give up:</b> ${pick.loses}</div>` : ''}
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('[data-m]').forEach(b => b.onclick = () => { S.m = +b.dataset.m; render(); });
  $$('[data-p]').forEach(b => b.onclick = () => { S.p = +b.dataset.p; render(); });
}
function replay() { clearLater(); S.m = 30; S.p = 5; settle(); render(); later(() => { S.m = 15; S.p = 1; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (/^[1-4]$/.test(e.key)) { S.m = MINS[+e.key - 1]; render(); }
  const pk = { q: 1, w: 2, e: 5 }[e.key.toLowerCase()]; if (pk) { S.p = pk; render(); }
});
replay();
</script>
</body>
</html>
