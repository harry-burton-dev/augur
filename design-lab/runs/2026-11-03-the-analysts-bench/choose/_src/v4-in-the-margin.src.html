<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Choosing · V4 · In the margin</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Choosing V4: nobody asks. While a briefing is written, a rule spots the sentence a technique would test and offers it in the margin, one at a time ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,var(--measure-read)) minmax(0,1fr);gap:var(--space-6);justify-content:center}
.doc{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding-right:var(--space-3)}
.doc h1{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.para{position:relative;font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink);padding:var(--space-1) var(--space-2);margin:0 calc(var(--space-2) * -1);border-radius:var(--radius-key);transition:background var(--motion-base) var(--ease-standard)}
.para.hot{background:var(--x-proposed-lit-wash)}
.para .dot{position:absolute;right:calc(var(--space-4) * -1 - var(--space-2));top:var(--space-3);width:var(--space-2);height:var(--space-2);border-radius:50%;border:1px solid var(--ink-muted)}
.para.hot .dot{background:var(--x-proposed-lit);border-color:var(--x-proposed-lit)}
.para .caret{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-2px}
.margin{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);position:relative}
.note{position:relative;transition:transform var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.note.hold{opacity:0;transform:translateX(var(--space-4))}
.rulecard{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.quiet{display:grid;gap:var(--space-1)}
.quiet div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Choosing · V4</b> in the margin: a rule spots the sentence a technique would test, one offer at a time · clinical decision support, Tradecraft Primer (2009)</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* the draft, as Sam writes it. A paragraph may carry a trigger: the rule that spotted it, and the technique it offers */
const DOC = [
  { t: `Missed collections on the ${DATA.round} stepped up in July, from 14 to 31 a month.` },
  { t: `${DATA.supplier} says most of them were caused by road closures, and expects to be back to normal by January.`, trig: { tid: 'qic', rule: `rests on one source, written by the supplier (${DATA.sources.s5.name}, graded ${DATA.sources.s5.grade})`, why: 'This sentence carries the explanation, and its only source is the supplier being judged. Check what else says so.' } },
  { t: `Notice is due by ${DATA.contract.notice}. Two other framework suppliers could bid.` },
  { t: `Recommendation: renew for 12 months, with a break at 6 months.`, trig: { tid: 'pre', rule: `a recommendation on a “${DATA.intent.kind}” decision`, why: `${DATA.intent.kind} decisions of this size go to a meeting. Before then, the people who will carry it imagine it failed.` } },
  { t: `If service is back by June, we would renew again for two years.`, trig: { tid: 'outside', rule: 'a forecast (“back by June”) with no starting count', why: 'A date is a forecast. Start from how renewals like this usually go, then adjust.' } }
];
const S = { typed: 0, hot: 1 };
function render() {
  const p = DOC[S.hot], trig = p && p.trig;
  $('#app').innerHTML = topHTML(['Artifacts', 'Facilities briefings', 'North round: renew Calder?'], [['↑ ↓', 'move between offers'], ...STD]) +
  `<main class="main"><div class="wrap">
    <article class="doc scroll"><p class="eyebrow">Draft · ${P('sam').name} · for ${P('jo').name}</p><h1>North round: renew ${DATA.supplier}?</h1>
      ${DOC.slice(0, S.typed).map((d, i) => `<p class="para ${S.hot === i && d.trig ? 'hot' : ''}">${d.t}${d.trig ? '<span class="dot" aria-hidden="true"></span>' : ''}${i === S.typed - 1 && S.typed < DOC.length ? '<span class="caret"></span>' : ''}</p>`).join('')}
    </article>
    <aside class="margin scroll"><p class="eyebrow">In the margin · one offer at a time</p>
      ${trig && S.hot < S.typed ? `<div class="note">${offerHTML(trig.tid, trig.why, { label: 'This sentence ' + trig.rule })}</div>` : `<div class="note hold card"></div>`}
      <div class="quiet">${DOC.map((d, i) => d.trig && i !== S.hot && i < S.typed ? `<div>${I('circle', 10)}<span>Also spotted: “${d.t.slice(0, 44)}…” · ${T(d.trig.tid).name}</span></div>` : '').join('')}</div>
      <div class="rule"></div>
      <p class="rulecard">Offers here are made by <b class="lite">rules on the records</b>, not by the model: one supplier-written source, a recommendation on a decision kind, a forecast with no starting count. Turning the model off (G) changes none of them. A dismissed offer doesn’t come back for that sentence.</p>
      <p class="tk">triggers: claim.sources.length = 1 ∧ source.author = subject → qic · recommendation ∧ intent.kind.meeting → pre · claim.kind = forecast ∧ ¬baseRate → outside</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.typed = 1; S.hot = -1; settle(); render(); [2, 3, 4, 5].forEach((n, i) => later(() => { S.typed = n; if (n === 2) S.hot = 1; render(); }, MOMENT() + i * ms('--motion-slow'))); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  const trigs = DOC.map((d, i) => d.trig ? i : -1).filter(i => i >= 0);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { const k = trigs.indexOf(S.hot); S.hot = trigs[(k + (e.key === 'ArrowDown' ? 1 : trigs.length - 1)) % trigs.length]; S.typed = DOC.length; render(); }
});
replay();
</script>
</body>
</html>
