<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Choosing · V3 · Pause points</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Choosing V3: the decision's own timeline has pause points, like a surgical checklist; each pause point carries the technique that fits it ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-5)}
.rail{position:relative;height:calc(var(--space-8) + var(--space-5));margin:0 var(--space-5)}
.rail .line{position:absolute;left:0;right:0;top:var(--space-6);height:2px;background:var(--hairline-strong)}
.rail .done{position:absolute;left:0;top:var(--space-6);height:2px;background:var(--ink-muted);transition:width var(--motion-calm) var(--ease-out)}
.now{position:absolute;top:calc(var(--space-6) - var(--space-5));bottom:calc(var(--space-2) * -1);width:1px;background:var(--x-proposed-lit);transition:left var(--motion-calm) var(--ease-out)}
.now span{position:absolute;top:calc(var(--space-4) * -1);left:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-lit);white-space:nowrap}
.date{position:absolute;top:calc(var(--space-6) + var(--space-3));transform:translateX(-50%);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:center;white-space:nowrap}
.date b{display:block;color:var(--ink);font-weight:400}
.date::before{content:"";position:absolute;left:50%;top:calc(var(--space-3) * -1 - 3px);width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ink-muted)}
.pp{position:absolute;top:calc(var(--space-6) - var(--space-3));transform:translateX(-50%);width:var(--space-5);height:var(--space-5);border-radius:var(--radius-key);border:1.5px solid var(--hairline-strong);background:var(--slate-deep);display:grid;place-items:center;color:var(--ink-muted)}
.pp.done{border-color:var(--ink-muted);color:var(--ink)}
.pp.due{border-color:var(--x-proposed-lit);color:var(--light);box-shadow:0 0 var(--space-4) color-mix(in srgb,var(--x-proposed-lit) 35%,transparent)}
.stops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);min-height:0}
.stop{display:flex;flex-direction:column;gap:var(--space-2);min-height:0}
.stop .nm{font-weight:200;font-size:var(--type-heading);line-height:var(--leading-heading);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.stop .when{font-size:var(--type-small);color:var(--ink-muted)}
.stop .card.done{opacity:.85}
.stop.due .nm{color:var(--x-proposed-lit)}
.stop .res{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Choosing · V3</b> pause points: the decision’s timeline says which technique fits now · WHO surgical safety checklist (2009), Klein (2007)</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* days from 18 Nov 2026, so dates place on the rail */
const DAYS = { '18 Nov': 0, '24 Nov': 6, '1 Dec': 13, '10 Dec': 22, '15 Dec': 27, '31 Dec': 43 };
const SPAN = 46, X_ = d => DAYS[d] / SPAN * 100;
const DATES = [['18 Nov', 'question set'], ['10 Dec', 'meeting'], ['15 Dec', 'decision due'], ['31 Dec', 'notice due']];
/* pause points, as in a surgical checklist: when the question is set, when the evidence is in, before anyone signs */
const STOPS = [
  { nm: 'Sign in',        at: '18 Nov', when: 'when the question is set', tids: ['outside', 'ach'], why: 'Before anyone has a favourite: how it usually goes, and why it went wrong.' },
  { nm: 'Time out',       at: '24 Nov', when: 'when a plan is on paper', tids: ['kac', 'qic'], why: 'A plan exists: what it rests on, and whether the sources under it hold.' },
  { nm: 'Before signing', at: '1 Dec',  when: 'before the meeting commits', tids: ['pre', 'against'], why: 'The people who will carry it imagine it failed.' }
];
const S = { now: 0 };
const RAN = Object.fromEntries(DATA.working.map(w => [w.tid, w]));
function render() {
  const nowD = Object.keys(DAYS)[S.now];
  const st = i => DAYS[STOPS[i].at] < DAYS[nowD] ? 'done' : DAYS[STOPS[i].at] === DAYS[nowD] ? 'due' : 'later';
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, 'Pause points'], [['← →', 'move today'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">${DATA.intent.id} · ${DATA.intent.title} · ${DATA.intent.kind}</p><p class="sent" style="max-width:76ch">Every decision of this kind has <b>three pause points</b>. At each, AUGUR offers the technique that fits that moment, and nothing in between.</p></div>
    <div class="rail"><div class="line"></div><div class="done" style="width:${X_(nowD)}%"></div>
      ${DATES.map(([d, w]) => `<span class="date" style="left:${X_(d)}%"><b>${d}</b>${w}</span>`).join('')}
      ${STOPS.map((s, i) => `<span class="pp ${st(i)}" style="left:${X_(s.at)}%" title="${s.nm}">${I(st(i) === 'done' ? 'check' : 'pause', 14)}</span>`).join('')}
      <div class="now" style="left:${X_(nowD)}%"><span>today · ${nowD}</span></div></div>
    <div class="stops">${STOPS.map((s, i) => { const k = st(i); return `<section class="stop ${k}">
      <p class="nm">${s.nm}</p><p class="when">${s.at} · ${s.when}</p><p class="small">${s.why}</p>
      ${k === 'due' ? offerHTML(s.tids[0], s.why, { label: 'Due now', extra: `<span class="small muted" style="align-self:center">or ${T(s.tids[1]).name.lc()} (${T(s.tids[1]).minutes} min) if time is short</span>` })
        : s.tids.map(t => `<div class="card ${k}">${tq(t, 14)}<span class="tk">${T(t).tech}</span>${k === 'done' ? (RAN[t] ? `<p class="res">${RAN[t].result}</p><p class="small muted">${mins(RAN[t].took)} · ${RAN[t].by.map(first).join(', ')}</p>` : `<p class="small muted">Skipped: not needed this time. Said so on the intent.</p>`) : `<p class="small muted">${mins(T(t).minutes)} · queued, not offered yet</p>`}</div>`).join('')}
    </section>`; }).join('')}</div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.now = 0; settle(); render(); later(() => { S.now = 1; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === 'ArrowRight') { S.now = Math.min(S.now + 1, Object.keys(DAYS).length - 1); render(); }
  if (e.key === 'ArrowLeft') { S.now = Math.max(S.now - 1, 0); render(); }
});
replay();
</script>
</body>
</html>
