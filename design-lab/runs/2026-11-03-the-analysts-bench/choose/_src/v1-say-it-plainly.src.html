<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Choosing · V1 · Say it plainly</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Choosing V1: the person says what they are trying to decide in their own words; AUGUR offers one technique, and one for later ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--space-6)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.ask{position:relative;border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-inset);padding:var(--space-4) var(--space-5);font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);min-height:calc(var(--space-8) + var(--space-6))}
.ask .caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:-3px;margin-left:2px}
.ask mark{background:none;color:inherit;border-bottom:2px dotted var(--x-proposed-pencil);padding-bottom:1px}
.ask mark.on{border-bottom:2px solid var(--x-proposed-lit)}
.reads{display:grid;gap:var(--space-2)}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.1fr);gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.read .ph{font-style:italic;color:var(--ink)}
.read .k{color:var(--light)}
.pick{display:grid;gap:var(--space-1)}
.pick button{display:flex;gap:var(--space-2);align-items:center;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink)}
.pick button[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.offer{transition:opacity var(--motion-calm) var(--ease-out)}
.offer.hold{opacity:0}
.alsofit{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Choosing · V1</b> say it plainly: your own sentence, read in pencil, one technique back · Cynefin (2007), ask only what changes</div>
<script>
/*@DATA@*/
/*@LIB@*/
const SAID = 'We need to decide whether to renew Calder on the North round, now that collections have got so much worse since July.';
/* what the model read in the sentence: phrase → kind. Pencil, shown so the person can correct it */
const READS = [{ ph: 'decide whether to renew', kind: 'commit' }, { ph: 'got so much worse since July', kind: 'why' }];
const S = { typed: 0, read: false, pick: 'why' };
function sentence() {
  let t = SAID.slice(0, S.typed);
  if (S.read && STATE.gateway) READS.forEach(r => { t = t.replace(r.ph, `<mark class="${S.pick === r.kind ? 'on' : ''}">${r.ph}</mark>`); });
  return t + (S.typed < SAID.length ? '<span class="caret"></span>' : '');
}
function render() {
  const g = STATE.gateway, k = DATA.kinds.find(x => x.id === S.pick);
  const why = S.pick === 'why' ? 'Your sentence asks two things. You can’t test a plan to fix the North round until you know why it got worse, so start there.' : 'You are about to commit, so the people who will carry it imagine it failed.';
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, 'Test a judgement'], [['1–6', 'pick the question'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="col"><p class="eyebrow">What are you trying to decide? Say it as you would to a colleague</p>
      <div class="ask" aria-live="polite">${sentence()}</div>
      ${g ? `<div class="reads">${S.read ? READS.map(r => `<div class="read pencil"><span class="ph">“${r.ph}”</span>${I('arrow-right', 14)}<span>sounds like <span class="k">${DATA.kinds.find(x => x.id === r.kind).ask}</span></span></div>`).join('') + `<p class="byline">${I('pencil', 11)}the assistant read your sentence, in pencil · pick another below if it misread</p>` : ''}</div>` : `<p class="small muted">${I('power-off', 12)} The model is off, so nothing reads your sentence. Pick the question below; it chooses the same way.</p>`}
      <p class="eyebrow">Or pick the question</p>
      <div class="pick">${DATA.kinds.map((x, i) => `<button aria-pressed="${S.pick === x.id}" data-k="${x.id}"><span class="kbd">${i + 1}</span>${x.ask}</button>`).join('')}</div>
    </section>
    <aside class="col">${offerHTML(k.tid, why, { cls: S.read || !g ? '' : 'hold', then: S.pick === 'why' ? `before you sign, <b class="lite">${T('pre').name}</b> (${T('pre').minutes} min, with the people who will carry it). It is queued on ${DATA.intent.id}, not offered now.` : '' })}
      <p class="alsofit">Other techniques could fit your sentence too. AUGUR offers one at a time, in the order a decision needs them, so you never choose from a list of six. The others stay on <span class="lite">the bench</span>.</p>
      <p class="small muted">Runs on: ${DATA.intent.id} “${DATA.intent.title}”, due ${DATA.intent.due}, and the facts it already cites.</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.pick button').forEach(b => b.onclick = () => { S.pick = b.dataset.k; render(); });
}
function replay() {
  clearLater(); S.typed = reduced ? SAID.length : 0; S.read = false; S.pick = 'why'; settle(); render();
  const step = Math.max(1, Math.round(SAID.length / 20));
  for (let i = 1; i <= 20; i++) later(() => { S.typed = Math.min(SAID.length, i * step); render(); }, i * ms('--motion-instant') / 2);
  later(() => { S.typed = SAID.length; S.read = true; render(); }, MOMENT() + ms('--motion-base'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (/^[1-6]$/.test(e.key)) { S.pick = DATA.kinds[+e.key - 1].id; S.read = true; S.typed = SAID.length; render(); }
});
replay();
</script>
</body>
</html>
