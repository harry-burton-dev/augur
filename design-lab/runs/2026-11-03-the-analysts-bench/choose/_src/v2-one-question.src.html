<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Choosing · V2 · One question</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Choosing V2: AUGUR reads what the records already say, and asks only the one question that changes the offer ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.known{display:grid;gap:var(--space-2)}
.kn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.kn svg{margin-top:1px;color:var(--ink-muted)}
.kn .src{grid-column:2;color:var(--ink-muted)}
.kn.missing svg{color:var(--x-proposed-lit)}
.q{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.ans{display:grid;gap:var(--space-2)}
.ans button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);text-align:left;transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard)}
.ans button b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.ans button .to{grid-column:2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:flex;gap:var(--space-1);align-items:center;flex-wrap:wrap}
.ans button[aria-pressed="true"]{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.ans button[aria-pressed="true"] .to{color:var(--ink)}
.offer{transition:opacity var(--motion-calm) var(--ease-out)}
.offer.hold{opacity:0}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Choosing · V2</b> one question: AUGUR reads the records and asks only what changes the offer · ask only what changes, Tradecraft Primer (2009)</div>
<script>
/*@DATA@*/
/*@LIB@*/
const I_ = DATA.intent;
/* what AUGUR read without asking; each line names where it came from */
const KNOWN = [
  { ic: 'target', w: `${I_.id} is a “${I_.kind}” decision, due ${I_.due}`, src: 'Mandate' },
  { ic: 'calendar-clock', w: `Notice on ${DATA.contract.id} is due by ${DATA.contract.notice}`, src: `Contract ${DATA.contract.id} · Artifacts` },
  { ic: 'trending-up', w: DATA.facts.missed.say, src: 'Data Atlas · ' + DATA.yardstick[derive('missed').rung].word.lc() },
  { ic: 'quote', w: `${DATA.supplier} says road closures caused it`, src: 'Calder quarterly report · cited in the draft briefing' },
  { ic: 'file-pen-line', w: 'A plan is drafted: renew for 12 months', src: `${I_.id}, option C` },
  { ic: 'circle-help', w: 'No explanation is recorded on the intent', src: 'nothing on the bench for this intent yet', missing: true }
];
const ANS = [
  { id: 'yes',  b: 'Yes, and it is recorded', to: 'kac', why: 'You know the cause, so test what the plan rests on.' },
  { id: 'some', b: 'We think so, but nobody has checked', to: 'ach', why: 'A cause nobody has checked is the one most often wrong. Line it up against the others first.' },
  { id: 'no',   b: 'No', to: 'ach', why: 'Without a cause, a plan is a guess. Find the explanation with least against it.' }
];
const S = { a: null };
function render() {
  const a = ANS.find(x => x.id === S.a);
  $('#app').innerHTML = topHTML(['Mandate', I_.id, 'Test a judgement'], [['1–3', 'answer'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="col scroll"><p class="eyebrow">Already known · not asked</p>
      <div class="known">${KNOWN.map(k => `<div class="kn ${k.missing ? 'missing' : ''}">${I(k.ic, 14)}<span>${k.w}</span><span class="src">${k.src}</span></div>`).join('')}</div>
      <p class="small muted">Six things AUGUR could have asked you. It read them instead, and shows where from, so you can correct any.</p>
    </section>
    <section class="col"><p class="eyebrow">The one question that changes the offer</p>
      <p class="q">Has anyone worked out why service fell?</p>
      <div class="ans">${ANS.map((x, i) => `<button aria-pressed="${S.a === x.id}" data-a="${x.id}"><span class="kbd">${i + 1}</span><b>${x.b}</b><span class="to">${I('corner-down-right', 12)}${T(x.to).name} · ${T(x.to).minutes} min</span></button>`).join('')}</div>
      <p class="small muted">Each answer shows where it leads before you choose it. Two answers lead to the same place; that is said, not hidden.</p>
    </section>
    <aside class="col">${a ? offerHTML(a.to, a.why, { then: a.to === 'ach' ? `${T('kac').name} on option C, then ${T('pre').name} before ${I_.due}.` : `${T('pre').name} before ${I_.due}.` }) : `<div class="card offer hold"></div>`}</aside>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.ans button').forEach(b => b.onclick = () => { S.a = b.dataset.a; render(); });
}
function replay() { clearLater(); S.a = null; settle(); render(); later(() => { S.a = 'some'; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (/^[1-3]$/.test(e.key)) { S.a = ANS[+e.key - 1].id; render(); }
});
replay();
</script>
</body>
</html>
