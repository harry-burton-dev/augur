<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Premortem · V1 · News from the future</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Premortem V1: the room reads a front page dated a year on, saying the plan failed, then each person writes why. The future sits on its own far plane ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4)}
.future{border:1px solid color-mix(in srgb,var(--x-proposed-future) 40%,transparent);background:var(--x-proposed-future-wash);border-radius:var(--radius-inset);padding:var(--space-4) var(--space-6);display:grid;gap:var(--space-2);text-align:center}
.mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid color-mix(in srgb,var(--x-proposed-future) 40%,transparent);padding-bottom:var(--space-2);font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--x-proposed-future)}
.hl{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light);letter-spacing:var(--tracking-tight);max-width:40ch;margin:var(--space-2) auto 0}
.sub{font-size:var(--type-meta);color:var(--ink);font-style:italic}
.room{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--space-3);min-height:0;align-content:start}
.p{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.p .who{display:grid;gap:2px;font-size:var(--type-small);line-height:var(--leading-small)}
.p .who b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.p .who span{color:var(--ink-muted)}
.note{border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--surface-pane);padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.note.pen{border-style:dotted;background:var(--x-proposed-pencil-wash);font-style:italic}
.hold .note{opacity:0;transform:translateY(calc(var(--space-2) * -1))}
.empty{border:1px dashed var(--hairline);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);font-size:var(--type-small);color:var(--ink-muted)}
.p.model .who b{font-style:italic}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Premortem · V1</b> news from the future: a front page dated a year on says it failed; each person writes why · Klein (2007), working backwards from a press release</div>
<script>
/*@DATA@*/
/*@LIB@*/
const PM = DATA.premortem;
const S = { shown: false };
function render() {
  const g = STATE.gateway, people = [...PM.room, ...(g ? ['model'] : [])];
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, T('pre').name], [...STD]) +
  `<main class="main"><div class="wrap ${S.shown ? '' : 'hold'}">
    <div class="future"><div class="mast"><span>${DATA.org} · ${F('fac').name} news</span><span>${PM.future} · imagined</span></div>
      <p class="hl">${PM.headline}</p>
      <p class="sub">It is ${PM.future}. ${DATA.plan.title} was decided on ${DATA.decision.on}. Why did it fail?</p>
      <p class="small muted">${T('pre').name} · ${mins(PM.said)} · ${PM.date} · chaired by ${P(PM.chair).name} · write alone for ${PM.silentMinutes} minutes, then read aloud</p><span class="tk">${T('pre').tech}</span></div>
    <div class="room scroll">${people.map(p => { const rs = PM.reasons.filter(r => r.by === p);
      return `<div class="p ${p === 'model' ? 'model' : ''}"><div class="who"><b>${p === 'model' ? 'The assistant' : P(p).name}</b><span>${p === 'model' ? 'one reason, in pencil' : P(p).role}</span></div>
        ${rs.map((r, i) => `<div class="note ${r.pencil ? 'pen' : ''}" style="transition-delay:calc(${PM.room.indexOf(p) + i} * var(--motion-quick))">${r.say}</div>`).join('') || '<div class="empty">nothing written</div>'}</div>`; }).join('')}</div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.shown = false; settle(); render(); later(() => { S.shown = true; $('.wrap').classList.remove('hold'); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) { markKeys(); } });
replay();
</script>
</body>
</html>
