<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Premortem · V5 · How these usually fail</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Premortem V5: the room's reasons laid beside how renewals like this one actually failed here. A way they failed that nobody named is lit ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(240px,.8fr);gap:var(--space-5);min-height:0}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.h2{font-weight:200;font-size:var(--type-lead);line-height:var(--leading-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.way{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--space-3);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard),opacity var(--motion-base) var(--ease-standard)}
.way b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.way .cs{grid-column:1/-1;color:var(--ink-muted)}
.way .st{font-size:var(--type-small);white-space:nowrap}
.way.cov .st{color:var(--ink-muted)}
.way.miss{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.way.miss .st{color:var(--x-proposed-lit)}
.way.part .st{color:var(--ink)}
.pre-match .way .st{opacity:0}
.ours{display:grid;gap:var(--space-1)}
.ours div{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);padding:var(--space-1) var(--space-2);border-left:2px solid var(--hairline-strong)}
.ours div.pen{font-style:italic;border-left-style:dotted}
.ours div.extra{border-left-color:var(--ink-muted);color:var(--ink-muted)}
.big{font:200 var(--type-title-s)/1 var(--font-mono);color:var(--light)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Premortem · V5</b> how these usually fail: the room’s reasons beside how renewals like this failed here; the way nobody named is lit · Kahneman and Lovallo (1993), Klein (2007)</div>
<script>
/*@DATA@*/
/*@LIB@*/
const OV = DATA.outsideView, PM = DATA.premortem;
const S = { matched: false };
function render() {
  const g = STATE.gateway, rs = PM.reasons.filter(r => g || !r.pencil);
  const bad = OV.cases.filter(c => c.out !== 'yes');
  const ways = Object.values(bad.reduce((m, c) => { (m[c.cl] = m[c.cl] || { cl: c.cl, why: c.why, cases: [] }).cases.push(c); return m; }, {})).sort((a, b) => b.cases.length - a.cases.length);
  /* covered if a reason from the room is in the same group; partly if the assumptions check named it */
  const named = cl => rs.some(r => r.cl === cl);
  const inKac = { price: 'a3', depot: 'a7', veh: 'a1', homes: 'a6' };
  const st = w => named(w.cl) ? 'cov' : inKac[w.cl] ? 'part' : 'miss';
  const missed = ways.filter(w => st(w) === 'miss');
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, T('pre').name, 'Against the record'], [...STD]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">${T('pre').name} · seeded by ${T('outside').name.lc()}</p><p class="sent" style="max-width:86ch">${bad.length} of ${OV.cases.length} renewals like this one went wrong here. <b>Before the room’s reasons are sorted, they are laid beside how those actually failed.</b></p></div>
    <div class="two ${S.matched ? '' : 'pre-match'}">
      <section class="col scroll"><p class="h2">How they failed here</p>
        ${ways.map(w => `<div class="way ${S.matched ? st(w) : ''}"><b>${w.why}</b><span class="st">${st(w) === 'cov' ? I('check', 12) + ' named in the room' : st(w) === 'part' ? 'in the assumptions check (' + inKac[w.cl] + ')' : I('circle-help', 12) + ' nobody named it'}</span><span class="cs">${w.cases.map(c => `${c.name}, ${c.year}`).join(' · ')}</span></div>`).join('')}
        <p class="small muted">From the ${DATA.sources.s17.name.lc()} (${DATA.sources.s17.grade}), ${bad.length} cases.</p></section>
      <section class="col scroll"><p class="h2">The room’s reasons</p>
        <div class="ours">${rs.map(r => `<div class="${r.pencil ? 'pen' : ''} ${ways.some(w => w.cl === r.cl) ? '' : 'extra'}">${r.say} <span class="muted">· ${r.pencil ? 'assistant' : first(r.by)}</span></div>`).join('')}</div>
        <p class="small muted">Grey: reasons the record has no case of yet. Not wrong; new here.</p></section>
      <aside class="col"><div class="card"><p class="lbl">Not named by anyone</p><p class="big">${missed.length}</p>${missed.map(w => `<p class="small"><b class="lite">${w.why}</b>: it happened in ${plural(w.cases.length, 'case')} like this one. ${PM.asks[w.cl] || ''}</p>`).join('')}</div>
        <div class="card"><p class="lbl">Why the record first</p><p class="small">A room imagines failure from what it knows. The record knows how things like this have actually failed here, including ways nobody in the room has seen.</p></div></aside>
    </div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.matched = false; settle(); render(); later(() => { S.matched = true; render(); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) { markKeys(); } });
replay();
</script>
</body>
</html>
