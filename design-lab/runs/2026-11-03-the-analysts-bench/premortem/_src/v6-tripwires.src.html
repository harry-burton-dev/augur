<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Premortem · V6 · Tripwires</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Premortem V6: the watches the premortem left, drawn as tripwires across the contract year. Dark while nothing crosses; a crossing lights one point and asks one person ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.wires{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,3.2fr);align-content:start;min-height:0;position:relative}
.wires > *{padding:var(--space-3) var(--space-3);border-bottom:1px solid var(--hairline);min-width:0}
.mh{position:relative;height:var(--space-5);padding:0!important}
.mh span{position:absolute;bottom:var(--space-1);transform:translateX(-50%);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.wn{display:grid;gap:2px;font-size:var(--type-small);line-height:var(--leading-small)}
.wn b{font-weight:400;color:var(--light)}
.wn .muted{color:var(--ink-muted)}
.wire{position:relative}
.wire .ln{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--hairline-strong)}
.wire.blind .ln{background:repeating-linear-gradient(90deg,var(--hairline-strong) 0 var(--space-1),transparent var(--space-1) var(--space-2))}
.x{position:absolute;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:var(--space-1);white-space:nowrap;font-size:var(--x-proposed-type-micro);line-height:1.3;color:var(--light);transition:opacity var(--motion-calm) var(--ease-out)}
.x i{width:var(--space-3);height:var(--space-3);border-radius:50%;background:var(--x-proposed-lit);box-shadow:0 0 var(--space-3) color-mix(in srgb,var(--x-proposed-lit) 55%,transparent)}
.x.late i{background:none;border:1.5px dashed var(--x-proposed-disagree);box-shadow:none}
.x.late{color:var(--x-proposed-disagree)}
.x.future{opacity:0}
.x.closed i{background:none;border:1.5px solid var(--ink-muted);box-shadow:none}
.x.closed{color:var(--ink-muted)}
.cursor{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-muted);transition:left var(--motion-calm) var(--ease-out);pointer-events:none;padding:0!important;border:0!important}
.cursor b{position:absolute;top:var(--space-1);left:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink);font-weight:400;white-space:nowrap}
.foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.ev .d{font-family:var(--font-mono);color:var(--ink-muted)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Premortem · V6</b> tripwires: the premortem’s watches across the contract year, dark until crossed · Heath and Heath, Decisive (2013), indicators and warnings</div>
<script>
/*@DATA@*/
/*@LIB@*/
const MON = ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];
const LEN = { Jan: 31, Feb: 28, Mar: 31, Apr: 30, May: 31, Jun: 30, Jul: 31, Aug: 31, Sep: 30, Oct: 31, Nov: 30, Dec: 31 };
const at = d => { const [day, mon] = d.split(' '); return MON.indexOf(mon) + (+day - 1) / LEN[mon]; };
const EV = DATA.later.events.filter(e => e.w);
const S = { now: 0.3 };
function render() {
  const pct = m => m / MON.length * 100;
  const crossed = EV.filter(e => at(e.d) <= S.now);
  $('#app').innerHTML = topHTML(['Mandate', DATA.decision.id, 'Tripwires'], [['← →', 'move a month'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">${DATA.decision.id} · from ${T('pre').name.lc()} on ${DATA.premortem.date} and ${T('kac').name.lc()}</p><p class="sent" style="max-width:86ch"><b>${DATA.watches.length} tripwires</b> across the contract year. Dark while nothing crosses them. A crossing lights one point, marks ${DATA.decision.id} worth revisiting and asks its owner once.</p></div>
    <div class="wires scroll"><div class="mh"></div><div class="mh">${MON.map((m, i) => `<span style="left:${pct(i + .5)}%">${m}</span>`).join('')}</div>
      ${DATA.watches.map(w => { const mine = EV.filter(e => e.w === w.id);
        return `<div class="wn"><b>${w.id.toUpperCase()} · ${w.say}</b><span class="muted">${w.line}</span><span class="muted">${P(w.owner).name} · ${w.sees ? w.listens : `<span class="blindtag">${I('eye-off', 10)}can’t see</span> ${w.cant}`}</span></div>
        <div class="wire ${w.sees ? '' : 'blind'}"><span class="ln"></span>${mine.map(e => `<span class="x ${e.closed ? 'closed' : w.sees ? '' : 'late'} ${at(e.d) > S.now ? 'future' : ''}" style="left:${pct(at(e.d))}%"><i></i>${e.d.split(' ').slice(0, 2).join(' ')}${e.closed ? ' · closed, not crossed' : w.sees ? '' : ' · noticed late'}</span>`).join('')}</div>`; }).join('')}
      <div class="cursor" style="left:calc(${100 / 4.2}% + ${S.now / MON.length} * ${100 - 100 / 4.2}%)"><b>${MON[Math.min(MON.length - 1, Math.floor(S.now))]} ${S.now >= 1 ? '2027' : '2026'}</b></div>
    </div>
    <div class="foot">
      <div class="card"><p class="lbl">Crossed so far</p>${crossed.length ? crossed.map(e => `<div class="ev"><span class="d">${e.d.split(' ').slice(0, 2).join(' ')}</span><span>${e.say}</span></div>`).join('') : '<p class="small muted">Nothing. The page is dark, as it should be.</p>'}</div>
      <div class="card"><p class="lbl">Dark when normal</p><p class="small">An uncrossed tripwire draws nothing but its line. No counters, no green ticks: silence here means only that nothing AUGUR can see has crossed.</p></div>
      <div class="card"><p class="lbl">The dashed wires</p><p class="small">${DATA.watches.filter(w => !w.sees).length} tripwires AUGUR can’t see. When one is crossed, it is found by hand, late: tender preparation started 12 days after its line, and nobody was told.</p></div>
    </div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.now = 0.3; settle(); render(); later(() => { S.now = 2.3; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === 'ArrowRight') { S.now = Math.min(MON.length - .01, Math.floor(S.now) + 1.3); render(); }
  if (e.key === 'ArrowLeft') { S.now = Math.max(0.3, Math.floor(S.now) - .7); render(); }
});
replay();
</script>
</body>
</html>
