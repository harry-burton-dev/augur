<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Premortem · V2 · Alone, then aloud</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Premortem V2: the method's one hard rule made visible. Everyone writes alone and sees only how many others have written; all reasons turn over at once; then one each, round the room ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,var(--measure-drawer));gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.phase{display:flex;gap:var(--space-2);align-items:center}
.ph{display:inline-flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);color:var(--ink-muted);padding:var(--space-1) var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--hairline)}
.ph.on{color:var(--light);border-color:var(--x-proposed-lit)}
.clock{font:200 var(--type-title-s)/1 var(--font-mono);color:var(--light)}
.table{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);min-height:0;align-content:start}
.seat{display:grid;gap:var(--space-2);align-content:start}
.seat .nm{display:flex;justify-content:space-between;font-size:var(--type-small)}
.seat .nm b{font-weight:400;color:var(--light)}
.card2{perspective:600px;height:calc(var(--space-7) + var(--space-3))}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform var(--motion-calm) var(--ease-out)}
.open .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);display:flex;align-items:center}
.back{border:1px solid var(--hairline-strong);background:repeating-linear-gradient(45deg,transparent 0 var(--space-2),var(--hairline) var(--space-2) calc(var(--space-2) + 1px)),var(--surface-inset);color:var(--ink-muted);justify-content:center;gap:var(--space-2)}
.front{transform:rotateY(180deg);border:1px solid var(--hairline-strong);background:var(--surface-pane);color:var(--ink)}
.front.pen{border-style:dotted;font-style:italic;background:var(--x-proposed-pencil-wash)}
.front.read{border-color:var(--x-proposed-lit)}
.order{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small)}
.order div{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);color:var(--ink-muted)}
.order div.done{color:var(--ink)}
@media (prefers-reduced-motion: reduce){.flip{transition:none}.open .back{opacity:0}.front{transform:none;opacity:0;transition:opacity var(--motion-base) linear}.open .front{opacity:1}.open .flip{transform:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Premortem · V2</b> alone, then aloud: nobody sees a reason until everyone has written; all turn over at once · Klein (2007), Delbecq and Van de Ven’s nominal group technique (1971)</div>
<script>
/*@DATA@*/
/*@LIB@*/
const PM = DATA.premortem;
const S = { open: false, read: 0 };
function render() {
  const g = STATE.gateway, rs = PM.reasons.filter(r => g || !r.pencil);
  const seats = [...PM.room.filter(p => p !== PM.chair), PM.chair, ...(g ? ['model'] : [])];
  /* round robin: one reason per person per turn, in seat order */
  const turns = []; for (let k = 0; k < 3; k++) seats.forEach(p => { const r = rs.filter(x => x.by === p)[k]; if (r) turns.push(r); });
  $('#app').innerHTML = topHTML(['Mandate', DATA.intent.id, T('pre').name], [['Space', 'next reason'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="col"><div class="phase"><span class="ph ${S.open ? '' : 'on'}">${I('pen-line', 13)}1 · write alone</span>${I('chevron-right', 14)}<span class="ph ${S.open && S.read < turns.length ? 'on' : ''}">${I('rotate-ccw', 13)}2 · all turn over</span>${I('chevron-right', 14)}<span class="ph">${I('repeat', 13)}3 · one each, round the room</span></div>
      <p class="sent">It is ${PM.future}, and the renewal failed. <b>Why?</b> ${S.open ? 'Everyone has written. All reasons are open at once.' : `Write alone. You can see how many others have written, never what.`}</p>
      <div class="table ${S.open ? 'open' : ''}">${seats.map(p => { const mine = rs.filter(r => r.by === p);
        return `<div class="seat"><div class="nm"><b>${p === 'model' ? 'The assistant' : P(p).name}</b><span class="muted">${plural(mine.length, 'reason')}</span></div>
          ${mine.map(r => `<div class="card2"><div class="flip"><div class="face back">${I('eye-off', 14)}written</div><div class="face front ${r.pencil ? 'pen' : ''} ${turns.indexOf(r) < S.read ? 'read' : ''}">${r.say}</div></div></div>`).join('')}</div>`; }).join('')}</div>
    </section>
    <aside class="col scroll">
      <div class="card"><p class="lbl">Writing time</p><p class="clock">${S.open ? '0:00' : PM.silentMinutes + ':00'}</p><p class="small muted">${S.open ? 'Closed when the last person said “done”.' : 'Closes when everyone says “done”, or when the time runs out.'}</p></div>
      <div class="card"><p class="lbl">Read aloud, one each</p><div class="order">${turns.map((r, i) => `<div class="${i < S.read ? 'done' : ''}"><span class="num">${i + 1}</span><span>${r.by === 'model' ? 'Assistant' : first(r.by)}${i < S.read ? ': ' + r.say : ''}</span></div>`).join('')}</div></div>
      <div class="card"><p class="lbl">Why alone first</p><p class="small">The first reason said aloud pulls the rest towards it, and the most senior person’s pulls hardest. Writing alone keeps ${PM.room.length} separate views; the chair, ${P(PM.chair).name}, reads after the others.</p>${g ? `<p class="small muted">${pencilBy()} wrote one reason too, alone, and is read last.</p>` : ''}</div>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.open = false; S.read = 0; settle(); render(); later(() => { S.open = true; $('.table').classList.add('open'); }, MOMENT()); later(() => { S.read = 3; render(); }, MOMENT() + ms('--motion-calm') * 2); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === ' ') { e.preventDefault(); S.open = true; S.read++; render(); }
});
replay();
</script>
</body>
</html>
