<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>A proposal waiting · V3 · The workings</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: the workings as a numbered method, each step marked by who did it (model, pattern, AUGUR) and what it produced ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--space-6)}
.steps{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.st{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) auto;gap:var(--space-3);align-items:start;padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);transition:opacity var(--motion-calm) var(--ease-out)}
.st .n{font:200 var(--type-title-s)/1 var(--font-sans);color:var(--light)}
.st b{display:block;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.st .by{font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;white-space:nowrap;padding:0 var(--space-2);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);color:var(--ink-muted)}
.st .by.model{border-style:dotted;color:var(--ink);font-style:italic}
.st.model{border-style:dotted;background:var(--x-proposed-pencil-wash)}
.st.off{opacity:var(--x-proposed-quiet)}
.st.off b{text-decoration:line-through;text-decoration-color:var(--hairline-strong)}
.st .out{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:2px}
.st.hot{border-color:var(--light)}
.res{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-3)}
.row .k{display:block;font-size:var(--type-small);color:var(--ink-muted)}
.row .v{font-size:var(--type-lead);line-height:var(--leading-lead)}
.row .why{font-size:var(--type-small);color:var(--ink-muted);text-align:right}
.verdict{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.verdict b{font-weight:400;color:var(--light)}
.btns{display:flex;gap:var(--space-2);flex-wrap:wrap}
@media (max-width:1400px){.st .out{display:none}.st{padding:var(--space-2) var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>A proposal waiting · V3</b> the workings: a numbered method, each step marked model, pattern or AUGUR · show your working, the reference desk's method card</div>
<script>
/*@DATA@*/
/*@LIB@*/
const PR = DATA.proposal, AG = PR.agent, a = A(AG);
const S = { shown: 0, hot: -1 };
const BY = s => s.model ? 'model' : /pattern/i.test(s.w) ? 'pattern' : 'AUGUR';
function render() {
  const g = STATE.gateway;
  /* with the gateway off, the model steps don't run; what is left is what the pattern reader finds */
  const lines = PR.lines.map(l => ({ ...l, gone: !g && l.rule === '—', val: !g ? (l.rule === '—' ? null : l.rule) : l.v }));
  $('#app').innerHTML = topHTML(['Data Atlas', 'Triage', PR.entity.name, 'Workings'], [['↑ ↓', 'step'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="steps scroll"><p class="eyebrow">${mm(AG)} How ${a.name} got here · run ${PR.run}</p><h1 class="title" style="margin-bottom:var(--space-2)">The workings</h1>
      ${PR.steps.map((s, i) => `<div class="st dep ${s.model ? 'model' : ''} ${!g && s.model ? 'off' : ''} ${S.hot === i ? 'hot' : ''}" style="--i:${i}" data-i="${i}"><span class="n">${i + 1}</span><span><b>${s.w}</b><span class="out">${s.at ? s.at + ' · ' : ''}${s.model ? (g ? 'the model read the page; nothing it wrote is used except as pencil' : 'skipped: the model gateway is off') : 'no model call'}</span><span class="tk">${s.tech}</span></span><span class="by ${s.model ? 'model' : ''}">${BY(s)}</span></div>`).join('')}
    </section>
    <section class="res">
      <p class="eyebrow">What the steps produced</p>
      ${lines.map(l => `<div class="row ${l.gone ? '' : 'pencil'}"><span><span class="k">${l.k}</span><span class="v ${l.gone ? 'muted' : 'pen'}">${l.gone ? 'not read without the model' : l.val}</span></span><span class="why">${l.gone ? '' : l.disagrees ? `<span class="mk-disagree"></span> record: ${l.disagrees}` : l.rule === '—' ? 'model only' : l.agree ? 'model and pattern agree' : 'they differ'}</span></div>`).join('')}
      <div class="verdict">${g ? `<b>${(n => n.length === 1 ? 'Step ' + n[0] + ' is the only one' : 'Steps ' + n.join(' and ') + ' are the only ones')(PR.steps.map((s, i) => s.model ? i + 1 : 0).filter(Boolean))} that used the model.</b> Every value above was also found by the pattern reader, except ${lines.filter(l => l.rule === '—').map(l => l.k.toLowerCase()).join(', ')}. Change any step and the details are read again, still in pencil.` : `<b>With the model gateway off</b>, ${lines.filter(l => !l.gone).length} of ${lines.length} details are still read by pattern, the match by IMO number still holds, and no number changes.`}</div>
      <div class="btns"><button class="btn go">${I('check', 14)} Accept the ${lines.filter(l => !l.gone).length}</button><button class="btn">${I('pen-line', 14)} Change step 2: another vessel</button><button class="btn">${I('rotate-ccw', 14)} Read again</button></div>
      <p class="small muted">Accepting here accepts the details, not the method. The method is kept with them, so the record can say how each was found.</p>
    </section></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.st').forEach(s => s.onmouseenter = () => { if (S.hot !== +s.dataset.i) { S.hot = +s.dataset.i; render(); } });
}
function replay() { clearLater(); S.hot = -1; settle(); render(); later(() => { S.hot = PR.steps.findIndex(s => s.model); render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === 'ArrowDown') { S.hot = (S.hot + 1) % PR.steps.length; render(); }
  if (e.key === 'ArrowUp') { S.hot = (S.hot - 1 + PR.steps.length) % PR.steps.length; render(); }
});
replay();
</script>
</body>
</html>
