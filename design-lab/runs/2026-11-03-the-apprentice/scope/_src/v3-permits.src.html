<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Scope and level · V3 · Permits to work</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: every widening is a permit with an area, hazards, precautions and an end date. Trust lapses unless a person renews it ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto auto;align-content:start;gap:var(--space-5)}
.permits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);min-height:0;align-items:start}
.pm{position:relative;display:grid;grid-template-rows:auto auto auto;border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);overflow:hidden;min-height:0}
.pm header{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--hairline-strong)}
.pm header b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.pm header .no{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.pm dl{margin:0;padding:var(--space-3) var(--space-4);display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);align-content:start}
.pm dt{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.pm dd{margin:0;color:var(--ink)}
.pm footer{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-top:1px dashed var(--hairline-strong)}
.left{font-size:var(--type-small);color:var(--ink-muted)}
.left b{font-weight:400;font-family:var(--font-mono);color:var(--light)}
.bar{height:var(--space-1);border-radius:1px;background:var(--hairline);margin-top:var(--space-1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink-muted)}
.pm.near .bar i{background:var(--x-proposed-disagree)}
.pm.susp{border-style:dashed}
.pm.susp dl,.pm.susp header b{opacity:var(--x-proposed-quiet)}
.stamp{position:absolute;right:var(--space-4);top:calc(var(--space-7) + var(--space-3));transform:rotate(-8deg);padding:var(--space-1) var(--space-3);border:2px solid var(--x-proposed-disagree);border-radius:var(--radius-key);color:var(--x-proposed-disagree);font:500 var(--type-meta)/1.3 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;text-align:center;background:var(--slate-deep);transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-spring)}
.stamp small{display:block;font-size:var(--x-proposed-type-micro);letter-spacing:0;text-transform:none}
.stamp.off{opacity:0;transform:rotate(-8deg) scale(1.3)}
.note{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);max-width:var(--measure-wide)}
.note b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){.pm dl{gap:var(--space-1) var(--space-2)}.pm dd.long{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Scope and level · V3</b> permits to work: each widening has an area, hazards, precautions and an end date · industrial permit-to-work (HSE HSG250), access recertification</div>
<script>
/*@DATA@*/
/*@LIB@*/
const AG = 'a1', a = A(AG);
/* permits: one per widened kind of work. Dates are deployment data */
const PERMITS = () => [
  { k: 'k1', no: K('k1').permit, from: K('k1').from, until: K('k1').until, weeksLeft: 11.5, hz: 'Each issuer lays out its tables differently. A sister ship can share a name.', pc: 'Read twice; anything read once is always checked. Sample drawn across issuers.', area: `Data Atlas Triage, ${F(a.floor).name}` },
  { k: 'k5', no: K('k5').permit, from: K('k5').from, until: K('k5').until, weeksLeft: 10, hz: 'A report filed in the wrong library is hard to find.', pc: `Undo for ${DATA.undoDays} days. Same readers only: filing never widens who can read.`, area: `Artifacts, Vessel surveys, ${F(a.floor).name}` },
  { k: 'k2', no: K('k2').permit, from: K('k2').from, until: 'suspended', susp: true, hz: 'Older Nordhavn certificates print net tonnage before gross.', pc: 'Suspended: back to asking each time until 20 are accepted unchanged in a row.', area: `Data Atlas Triage, ${F(a.floor).name}` }
];
const S = { stamp: false };
function render() {
  const ps = PERMITS();
  $('#app').innerHTML = topHTML(['Admin', 'Agents', a.name, 'Permits'], [['R', 'replay the stamp'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">${mm(AG)} ${a.name} · each rung above “asks each time” is a permit</p><h1 class="title">Permits to work</h1></div>
    <div class="permits">${ps.map((p, i) => { const kd = K(p.k), pct = p.susp ? 0 : Math.max(4, Math.min(100, p.weeksLeft / DATA.permitWeeks * 100)); return `<article class="pm dep ${p.near ? 'near' : ''} ${p.susp ? 'susp' : ''}" style="--i:${i}">
      <header><b>${kd.w}</b><span class="no">Permit ${p.no}</span></header>
      <dl><dt>Holder</dt><dd>${mm(AG)} ${a.name}</dd><dt>Issued by</dt><dd>${P(a.supervisor).name}, ${p.from}</dd><dt>Area</dt><dd>${p.area}</dd><dt>Rung</dt><dd>${lvl(p.susp ? 2 : kd.level, kd.cap)}</dd><dt>Hazards</dt><dd class="long">${p.hz}</dd><dt>Precautions</dt><dd class="long">${p.pc}</dd><dt>Its record</dt><dd>${fmt(kd.acc)} accepted as read, ${kd.chg + kd.rej} not</dd></dl>
      <footer>${p.susp ? `<span class="left">Suspended Fri 6 Nov by ${P(a.supervisor).name}</span><button class="btn sm">${I('file-text', 14)} Why</button>` : `<span class="left" style="flex:1">Valid until <b>${p.until}</b>${p.near ? ' · renew within a week' : ''}<span class="bar"><i style="width:${pct}%"></i></span></span><button class="btn sm ${p.near ? 'go' : ''}">${I('rotate-cw', 14)} Renew</button>`}</footer>
      ${p.susp ? `<span class="stamp ${S.stamp ? '' : 'off'}">Suspended<small>Fri 6 Nov · ${first(a.supervisor)}</small></span>` : ''}
    </article>`; }).join('')}</div>
    <p class="note"><b>Trust lapses unless it is renewed.</b> A permit runs ${DATA.permitWeeks} weeks. To renew, ${first(a.supervisor)} sees the record since it was issued and signs again; if nobody renews it, the kind of work drops back to “asks each time” on the day, says so in the diary, and nothing is lost. A permit can be suspended at once, by its issuer, with a reason. ${a.name} can never issue, renew or extend its own.</p>
    <p class="tk">grant.kinds[].level with issuedBy, issuedAt, expiresAt · on expiry: level → 1, diary entry, Inbox item to the supervisor a week before</p>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.stamp = false; settle(); render(); later(() => { S.stamp = true; render(); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) markKeys(); });
replay();
</script>
</body>
</html>
