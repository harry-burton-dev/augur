<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Scope and level · V2 · The fence</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: scope as a site with a fence. Floors by apps; inside the fence it may work, outside is drawn and says who could widen it ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,var(--measure-card));gap:var(--space-6)}
.site{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.grid{position:relative;display:grid;grid-template-columns:minmax(180px,var(--measure-rail)) repeat(4,minmax(0,1fr));gap:var(--space-2)}
.grid .h{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding:0 var(--space-2) var(--space-1)}
.fl{display:flex;flex-direction:column;justify-content:center;padding:var(--space-3);border-left:3px solid var(--fc)}
.fl b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.fl span{font-size:var(--type-small);color:var(--ink-muted)}
.cell{min-height:calc(var(--space-8) - var(--space-3));padding:var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline);display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-1);text-align:left;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.cell b{font-weight:400;font-size:var(--type-meta);color:var(--ink);display:flex;align-items:center;gap:var(--space-2)}
.cell.read{background:var(--surface-inset)}
.cell.propose{background:var(--x-proposed-pencil-wash);border:1px dotted var(--x-proposed-pencil)}
.cell.propose b{font-style:italic}
.cell.act{background:var(--surface-raised);border-color:var(--hairline-strong)}
.cell.supervisor{background:var(--surface-inset)}
.cell.none{background:var(--x-proposed-unseen);border-style:dashed}
.cell.none b{color:var(--ink-muted)}
.cell.sel{outline:1.5px solid var(--light);outline-offset:-1px}
.cell.try{outline:1.5px dashed var(--info);outline-offset:-1px}
svg.fence{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg.fence rect{fill:none;stroke:var(--x-proposed-lit);stroke-width:1.5;stroke-dasharray:6 4}
.key{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted)}
.key span{display:inline-flex;gap:var(--space-2);align-items:center}
.sw{display:inline-block;width:var(--space-5);height:var(--space-3);border-radius:2px;border:1px solid var(--hairline)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding-top:var(--space-7)}
.box{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:grid;gap:var(--space-2)}
.box h3{margin:0;font-weight:400;font-size:var(--type-meta);color:var(--light)}
.box b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){.cell{min-height:var(--space-7)}.cell span.d{display:none}.side{padding-top:0}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Scope and level · V2</b> the fence: floors by apps, where it may read, propose and act, and who could move the fence · site hoarding, permit zones</div>
<script>
/*@DATA@*/
/*@LIB@*/
const AG = 'a1', a = A(AG), G = DATA.scopeGrid;
const WORD = { read: ['Reads', 'eye', 'can open and read; never writes'], propose: ['Proposes', 'pencil', 'drafts in pencil for a person'], act: ['Acts', 'hammer', 'reversible work in its own area (rung 3 kinds)'], supervisor: ['Tells its supervisor', 'user-round', 'the one person it may tell'], none: ['Outside', 'fence', 'can’t reach this'] };
const S = { sel: null, try: false };
/* who could widen a cell: the floor's admin for a floor, the deployment admin for an app it lacks */
const widener = (fl, j) => G.rows.find(r => r.floor === fl).cells[j] === 'none' && j >= 2 ? `${P(DATA.gateway.admin).name} (an app it isn’t granted)` : fl === a.floor ? P(a.supervisor).name : `the ${F(fl).word} floor’s lead (${P(fl === 'department' ? 'p5' : 'p4').name})`;
function render() {
  const sel = S.sel;
  $('#app').innerHTML = topHTML(['Admin', 'Agents', a.name, 'Scope'], [['click', 'a square'], ['W', 'try widening'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="site"><div><p class="eyebrow">${mm(AG)} ${a.name} · granted at the start of each run</p><h1 class="title">Where it may work</h1></div>
      <div class="grid" id="grid"><span></span>${G.cols.map(c => `<span class="h">${c}</span>`).join('')}
        ${G.rows.map((r, i) => `<div class="fl" data-tier="${r.floor}"><b>${F(r.floor).name}</b><span>${F(r.floor).word} · ${fmt(F(r.floor).reach)} people</span></div>
          ${r.cells.map((c, j) => { const w = WORD[c], isSel = sel && sel[0] === i && sel[1] === j; const tryIt = S.try && r.floor === 'department' && j === 1; return `<button class="cell dep ${c} ${isSel ? 'sel' : ''} ${tryIt ? 'try' : ''}" style="--i:${i * 4 + j}" data-c="${i},${j}"><b>${I(w[1], 14)} ${tryIt ? 'Would propose' : w[0]}</b><span class="d">${tryIt ? `its pencil would be seen by ${fmt(F(r.floor).reach)} people` : w[2]}</span></button>`; }).join('')}`).join('')}
        <svg class="fence" aria-hidden="true"></svg>
      </div>
      <div class="key">${Object.entries(WORD).map(([k, w]) => `<span><i class="sw cell ${k}" style="min-height:0;padding:0"></i>${w[0]}</span>`).join('')}<span><svg width="28" height="10" aria-hidden="true"><rect x="1" y="1" width="26" height="8" fill="none" stroke="var(--x-proposed-lit)" stroke-dasharray="6 4"/></svg> the fence: where it writes anything</span></div>
    </section>
    <aside class="side">${sel ? (() => { const r = G.rows[sel[0]], c = r.cells[sel[1]], app = G.cols[sel[1]]; return `<div class="box"><h3>${app} on ${F(r.floor).name}</h3><p><b>${WORD[c][0]}.</b> ${WORD[c][2]}.</p>${c === 'none' || c === 'read' ? `<p>To widen it, ask <b>${widener(r.floor, sel[1])}</b>. Widening is recorded with who and why, and takes effect at its next run.</p>` : `<p>Inside the fence. ${P(a.supervisor).name} answers for what it does here.</p>`}${r.floor !== a.floor && c === 'read' ? `<p>What it reads here can feed a proposal on ${F(a.floor).name}, never one here.</p>` : ''}</div>`; })() : `<div class="box"><h3>Point at a square</h3><p>Each square is one app on one floor. The fence is drawn round every square where it writes anything, even pencil.</p></div>`}
      <div class="box"><h3>Reading upward, writing here</h3><p>Like a person on ${F(a.floor).name}, it can read what is kept on the floors above. It writes only on its own floor. That is the floor rule from Data Atlas, applied to an agent.</p></div>
      ${S.try ? `<div class="box" style="border-color:var(--info)"><h3>If it proposed on ${F('department').name}</h3><p>Its pencil would sit in ${F('department').name}’s Triage, read by <b>${fmt(F('department').reach)}</b> people instead of ${fmt(F(a.floor).reach)}, and accepted by their reviewers, not ${first(a.supervisor)}. It would need a supervisor on that floor too.</p></div>` : ''}
      <p class="tk">grants at start: workspace × scope (Data Atlas propose, Artifacts write, notifications to the supervisor only) · ADR 0008 signed caller names the agent, never a person</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys(); fence();
  $$('.cell[data-c]').forEach(b => b.onclick = () => { S.sel = b.dataset.c.split(',').map(Number); render(); });
}
/* the fence: a dashed line round the squares where it writes */
function fence() {
  const g = $('#grid').getBoundingClientRect(), cells = $$('.cell.propose, .cell.act, .cell.supervisor, .cell.try');
  if (!cells.length) return;
  const pad = 4, svg = $('svg.fence'); svg.setAttribute('viewBox', `0 0 ${g.width} ${g.height}`);
  svg.innerHTML = cells.map(c => { const r = c.getBoundingClientRect(); return `<rect x="${r.left - g.left - pad}" y="${r.top - g.top - pad}" width="${r.width + pad * 2}" height="${r.height + pad * 2}" rx="8"/>`; }).join('');
}
addEventListener('resize', fence);
function replay() { clearLater(); S.sel = null; S.try = false; settle(); render(); later(() => { S.sel = [1, 1]; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key.toLowerCase() === 'w') { S.try = !S.try; S.sel = S.try ? [1, 1] : S.sel; render(); }
});
replay();
</script>
</body>
</html>
