<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Scope and level · V4 · The logbook</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: the agent's logbook. A ruled line per day, carried-forward totals, and endorsements signed by its supervisor ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:var(--space-6)}
.book{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
table{width:100%;border-collapse:collapse;font-size:var(--type-small);line-height:var(--leading-small)}
th{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:right;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline-strong);vertical-align:bottom}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);text-align:right;font-family:var(--font-mono);color:var(--ink)}
td.l{font-family:var(--font-sans);color:var(--ink-muted)}
td .sig{font-family:var(--font-sans);font-style:italic;color:var(--light)}
tr.cf td{color:var(--ink-muted);border-bottom:1px solid var(--hairline-strong)}
tr.tot td{color:var(--light);border-top:2px solid var(--hairline-strong);border-bottom:0}
tr.new td{background:var(--x-proposed-lit-wash)}
tr.rchg td{background:var(--surface-inset)}
.rb{display:inline-flex}
.ends{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.end{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:grid;gap:var(--space-1)}
.end b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.end .s{font-style:italic;color:var(--ink)}
.end.down{border-style:dashed}
.end.next{border-color:var(--hairline);border-style:dotted}
@media (max-width:1400px){td,th{padding:var(--space-1) var(--space-2)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Scope and level · V4</b> the logbook: a line a day, totals carried forward, endorsements signed by the supervisor · a pilot's logbook, the nurse's competency book</div>
<script>
/*@DATA@*/
/*@LIB@*/
const AG = 'a1', a = A(AG), W = DATA.week;
/* the logbook covers everything it proposes to Triage: every kind of work with cap 2 */
const TK = DATA.kinds.filter(k => k.cap === 2);
const KD = { w: 'Everything it proposes to Data Atlas', cap: 2, acc: sum(TK, k => k.acc), chg: sum(TK, k => k.chg), rej: sum(TK, k => k.rej) };
const S = { added: false };
/* carried forward: the record before this week is the kind's totals less the week */
const wk = { p: sum(W, d => d.proposed), acc: sum(W, d => d.acc), chg: sum(W, d => d.chg), rej: sum(W, d => d.rej) };
const cf = { acc: KD.acc - wk.acc, chg: KD.chg - wk.chg, rej: KD.rej - wk.rej };
cf.p = cf.acc + cf.chg + cf.rej;
function render() {
  const rows = W.slice(0, S.added ? W.length : W.length - 1);
  const t = { p: cf.p + sum(rows, d => d.proposed), acc: cf.acc + sum(rows, d => d.acc), chg: cf.chg + sum(rows, d => d.chg), rej: cf.rej + sum(rows, d => d.rej), mins: sum(rows, d => d.mins) };
  $('#app').innerHTML = topHTML(['Admin', 'Agents', a.name, 'Logbook'], [['Space', 'write today’s line'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="book scroll"><div><p class="eyebrow">${mm(AG)} ${a.name} · ${KD.w.toLowerCase()}</p><h1 class="title">Logbook</h1></div>
      <table><thead><tr><th>Day</th><th>Rung</th><th>Proposed</th><th>Accepted</th><th>Corrected</th><th>Rejected</th><th>Sample</th><th>Minutes</th><th class="l">Signed</th></tr></thead>
      <tbody><tr class="cf"><td class="l">Carried forward from 26 Oct</td><td></td><td>${fmt(cf.p)}</td><td>${fmt(cf.acc)}</td><td>${cf.chg}</td><td>${cf.rej}</td><td></td><td></td><td></td></tr>
        ${rows.map((d, i) => `<tr class="${i === W.length - 1 && S.added ? 'new' : ''} ${i && W[i - 1].level !== d.level ? 'rchg' : ''}"><td class="l">${d.d}</td><td><span class="rb">${rungs(d.level, KD.cap)}</span></td><td>${d.proposed}</td><td>${d.acc}</td><td>${d.chg}</td><td>${d.rej}</td><td>${d.sample ?? '—'}</td><td>${d.mins}</td><td class="l"><span class="sig">${P(a.supervisor).name.split(' ').map(w => w[0]).join('')}</span></td></tr>`).join('')}
        <tr class="tot"><td class="l">Totals</td><td></td><td>${fmt(t.p)}</td><td>${fmt(t.acc)}</td><td>${t.chg}</td><td>${t.rej}</td><td></td><td>${t.mins}</td><td></td></tr></tbody></table>
      <p class="small muted">Every line is counted from Triage, never written by ${a.name}. A grey line is a day its rung changed. ${S.added ? '' : 'Friday’s line is written when Friday’s batch is signed.'}</p>
    </section>
    <aside class="ends scroll"><p class="eyebrow">Endorsements</p>
      ${a.history.map((h, i) => `<div class="end dep ${/narrow/.test(h.w) ? 'down' : ''}" style="--i:${i}"><b>${h.w[0].toUpperCase() + h.w.slice(1)}</b><span>${h.d} · ${h.why || 'started at rung 1 for every kind'}</span><span class="s">${P(h.by).name}</span></div>`).join('')}
      <div class="end next"><b>Next endorsement it could earn</b><span>${K('k2').why}</span><span>${K('k3').w}: ${K('k3').run} in a row; a replay would show whether ${fmt(K('k3').acc)} of ${fmt(K('k3').acc + K('k3').chg + K('k3').rej)} is good enough.</span><span class="s">Only ${P(a.supervisor).name} can sign it.</span></div>
      <p class="tk">record per kind = counts of Triage verdicts on proposedBy agent · endorsements = audit agent.level.changed with why</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.added = false; settle(); render(); later(() => { S.added = true; render(); }, MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) { markKeys(); return; } if (e.key === ' ') { e.preventDefault(); S.added = !S.added; render(); } });
replay();
</script>
</body>
</html>
