<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Scope and level · V6 · Delegation in a sentence</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: the delegation as one sentence from a schedule of delegated authority. Each choice says what it changes before you pick it ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-5);max-width:var(--measure-wide);margin:0 auto}
.sent{font-weight:300;font-size:var(--type-heading);line-height:calc(var(--leading-heading) + var(--space-3));color:var(--ink-muted)}
.sent .fix{color:var(--ink)}
.slot{display:inline;color:var(--light);border-bottom:1px dashed var(--ink-muted);padding:0 2px;font-weight:400;border-radius:2px}
.slot::after{content:"▾";font-size:var(--type-small);color:var(--ink-muted);margin-left:var(--space-1);vertical-align:2px}
.slot[aria-expanded="true"]{background:var(--surface-raised);border-bottom-color:var(--info)}
.slot.changed{border-bottom-color:var(--x-proposed-lit);color:var(--x-proposed-lit)}
.slot.locked{border-bottom:1px solid var(--x-proposed-ceiling);cursor:default}
.slot.locked::after{content:""}
.opts{display:grid;align-content:start;align-self:start;gap:var(--space-1);padding:var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-overlay)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-4);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);text-align:left;width:100%}
.opt:hover,.opt.hot,.opt:focus-visible{background:var(--surface-raised)}
.opt b{font-weight:400;color:var(--light)}
.opt .r{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);text-align:right}
.opt .s{grid-column:1 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.opt.no{opacity:var(--x-proposed-quiet);cursor:not-allowed}
.foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-4);align-items:center;border-top:1px solid var(--hairline-strong);padding-top:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);align-self:end}
.foot b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){.sent{font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-2))}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Scope and level · V6</b> delegation in a sentence: each choice says what it changes before you pick it · schedules of delegated authority, said in a sentence</div>
<script>
/*@DATA@*/
/*@LIB@*/
const AG = 'a1', a = A(AG), KD = K('k3');
/* the slots and their options. r = what the option changes, worked out from the record and the floor data */
const OPTS = {
  verb: [{ id: 'propose', w: 'propose', r: 'pencil', s: 'it drafts; a person signs every one' }, { id: 'file', w: 'file', r: 'cap 2', s: `facts reach Data Atlas only through Triage: this kind can’t go past proposing`, no: true }],
  floor: [{ id: 'team', w: F('team').name, r: `${F('team').reach} readers`, s: `${first(a.supervisor)}’s Triage, ${first(a.supervisor)} accepts` }, { id: 'department', w: F('department').name, r: `${F('department').reach} readers`, s: `needs a supervisor on that floor; ${P('p5').name} would have to agree` }],
  rung: DATA.ladder.map(r => ({ id: String(r.n), w: r.name.toLowerCase(), r: r.n > KD.cap ? 'over the cap' : `${r.n === 1 ? KD.perWeek : r.n === 2 ? Math.min(KD.perWeek, 14) : 0} checks a week`, s: r.check, no: r.n > KD.cap })),
  calls: [{ id: '200', w: '200 model calls', r: 'about 2 nights of reports', s: 'it would stop most nights before the reports are read' }, { id: '500', w: '500 model calls', r: `${a.calls.used} used today`, s: 'what Admin set for this app' }, { id: '1000', w: '1,000 model calls', r: `needs ${first(DATA.gateway.admin)}`, s: `only ${P(DATA.gateway.admin).name} can raise an app’s daily limit`, no: true }],
  until: [{ id: '4', w: '4 weeks', r: 'renew 7 Dec', s: 'a short trial' }, { id: '12', w: `${DATA.permitWeeks} weeks`, r: 'renew 27 Jan', s: 'the usual permit' }, { id: 'ever', w: 'no end date', r: 'not allowed', s: 'every widening ends; a person renews it', no: true }]
};
const S = { v: { verb: 'propose', floor: 'team', rung: '1', calls: '500', until: '12' }, open: null, hot: null, changed: {} };
const opt = (k, id) => OPTS[k].find(o => o.id === id);
const slot = k => `<button class="slot ${S.changed[k] ? 'changed' : ''}" aria-expanded="${S.open === k}" data-k="${k}">${opt(k, S.hot && S.open === k ? S.hot : S.v[k]).w}</button>`;
function render() {
  $('#app').innerHTML = topHTML(['Admin', 'Agents', a.name, 'Delegation'], [['click', 'a choice'], ['Esc', 'close'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">${mm(AG)} Schedule of delegation · ${KD.w}</p><h1 class="title">In a sentence</h1></div>
    <p class="sent dep"><span class="fix">${a.name}</span> may ${slot('verb')} <span class="fix">${KD.w.toLowerCase()}</span> on ${slot('floor')}, ${slot('rung')}, using up to ${slot('calls')} a day, for ${slot('until')}, under <button class="slot locked" title="Changing the supervisor is a separate decision">${P(a.supervisor).name}</button>. It stands by for a person before <span class="slot locked" title="${DATA.ceiling.map(c => c.w).join('; ')}">the ${DATA.ceiling.length} things on the ceiling</span>.</p>
    ${S.open ? `<div class="opts" role="listbox">${OPTS[S.open].map(o => `<button class="opt ${o.no ? 'no' : ''} ${(S.hot || S.v[S.open]) === o.id ? 'hot' : ''}" role="option" data-id="${o.id}" ${o.no ? 'aria-disabled="true"' : ''}><b>${o.w}</b><span class="r">${o.r}</span><span class="s">${o.s}</span></button>`).join('')}</div>` : '<span></span>'}
    <div class="foot"><span>${Object.keys(S.changed).length ? `<b>${Object.keys(S.changed).length} change${Object.keys(S.changed).length > 1 ? 's' : ''}.</b> Saved with your name and a reason; takes effect at its next run, and it says so in its diary.` : `This is what ${first(a.supervisor)} agreed on ${a.history[0].d}. Its record for this kind: ${KD.acc} of ${KD.acc + KD.chg + KD.rej} accepted as read.`}</span><button class="btn ${Object.keys(S.changed).length ? 'go' : ''}" ${Object.keys(S.changed).length ? '' : 'aria-disabled="true"'}>${I('signature', 14)} Sign the change</button></div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.slot[data-k]').forEach(b => b.onclick = e => { e.stopPropagation(); S.open = S.open === b.dataset.k ? null : b.dataset.k; S.hot = null; render(); });
  $$('.opt').forEach(b => {
    b.onmouseenter = () => { if (S.hot !== b.dataset.id) { S.hot = b.dataset.id; render(); } };
    b.onclick = e => { e.stopPropagation(); if (b.getAttribute('aria-disabled')) return; const k = S.open; if (S.v[k] !== b.dataset.id) { S.v[k] = b.dataset.id; S.changed[k] = true; } S.open = null; S.hot = null; render(); };
  });
}
document.addEventListener('click', () => { if (S.open) { S.open = null; S.hot = null; render(); } });
function replay() {
  clearLater(); S.v = { verb: 'propose', floor: 'team', rung: '1', calls: '500', until: '12' }; S.open = null; S.hot = null; S.changed = {}; settle(); render();
  /* the moment: the rung choice opens and previews widening, then the cap */
  later(() => { S.open = 'rung'; render(); }, MOMENT());
  later(() => { S.hot = '2'; render(); }, MOMENT() + ms('--motion-calm'));
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { S.open = null; S.hot = null; render(); return; } if (commonKeys(e, render, replay)) markKeys(); });
replay();
</script>
</body>
</html>
