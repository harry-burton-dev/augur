<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Combined · V3 · From standby to go</title>
<meta name="x-shot-wait" content="4200">
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V3: one standby, end to end. Prepared, lamp, urgent frame with the time out, a read-back only for the email, go, and the diary ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3)}
.film{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-2)}
.fr{display:grid;gap:2px;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset);text-align:left;width:100%;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.fr b{font-weight:400;color:var(--ink);font-size:var(--type-meta)}
.fr .t{font-family:var(--font-mono)}
.fr.sel{border-color:var(--light);background:var(--surface-raised)}
.fr.sel b{color:var(--light)}
.stage{position:relative;min-height:0;border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--slate-deep);overflow:hidden}
.band{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--hairline);font-size:var(--type-small);color:var(--ink-muted)}
.band .cue{margin-left:auto;display:inline-flex;align-items:center;gap:var(--space-2);padding:2px var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);color:var(--ink)}
.band .cue.on{border-color:var(--x-proposed-standby);color:var(--light)}
.inner{padding:var(--space-4) var(--space-5);display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,var(--measure-card));gap:var(--space-5);height:calc(100% - var(--space-7))}
.inner.dim{filter:saturate(.4) blur(2px)}
.notice{padding:var(--space-3) var(--space-4);font-style:italic;color:var(--ink);line-height:var(--leading-body)}
.notice h3{margin:0 0 var(--space-1);font-weight:300;font-size:var(--type-lead);color:var(--light)}
.part{padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);margin-top:var(--space-2)}
.part.hard{border-color:var(--x-proposed-standby);background:var(--x-proposed-standby-wash)}
.part h4{margin:0 0 var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.part div{color:var(--ink)}
.log .r{display:grid;grid-template-columns:var(--space-7) minmax(0,1fr);gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-small);color:var(--ink)}
.log .r .t{font-family:var(--font-mono);color:var(--ink-muted)}
.log .r.new{background:var(--x-proposed-lit-wash)}
.lb{position:absolute;inset:0;display:grid;pointer-events:none}
.lb .bar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:var(--space-5);padding:0 var(--space-6);background:var(--scrim);font-size:var(--type-small);color:var(--ink);pointer-events:auto}
.lb .bar b{font-weight:400;color:var(--light)}
.lb .bar .k{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.lb .fm{position:absolute;left:0;right:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-5);align-items:center;padding:var(--space-3) var(--space-7);pointer-events:auto}
.ck{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);padding:2px 0}
.ck svg{color:var(--x-proposed-lit)}
.rb{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);color:var(--ink-muted);margin-top:var(--space-2)}
.rb input{width:calc(var(--space-7) + var(--space-3));height:var(--target-sm);background:var(--surface-inset);border:1px solid var(--x-proposed-lit);border-radius:var(--radius-key);color:var(--light);font:400 var(--type-meta)/1 var(--font-mono);padding:0 var(--space-2)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V3</b> from standby to go: prepared, the lamp, the urgent frame with the time out, a read-back only for the email, go, the diary · standby V1–V6</div>
<script>
/*@DATA@*/
/*@LIB@*/
const SB = DATA.standby, AG = SB.agent, a = A(AG); ME = SB.me;
const FRAMES = () => [
  { t: SB.log[0].t, b: 'The log records a fault', w: `${a.name} starts a draft` },
  { t: SB.raisedAt, b: 'Prepared, then holds', w: `${SB.done.length} done · ${SB.irreversible.length} wait` },
  { t: SB.ackAt, b: 'The lamp in the band', w: `${first(ME)}: standing by` },
  { t: SB.framedAt, b: 'Urgent: the Letterbox', w: `go by ${SB.goBy} · time out` },
  { t: DATA.now, b: 'Go', w: 'published, emailed, in the diary' }
];
const S = { f: 0 };
function stage() {
  const f = S.f, ir = SB.irreversible, lamp = f >= 1 && f < 4;
  const band = `<div class="band">${I('waves', 14)} ${F('department').name} · Artifacts${f >= 2 ? '' : ' · ' + first(ME) + ' is reading a report'}<span class="cue ${lamp ? 'on' : ''}"><span class="lamp ${lamp ? 'on' : f === 4 ? 'go' : 'off'}"></span>${mm(AG)} ${lamp ? (f >= 2 ? 'standing by' : 'standby') : f === 4 ? 'gone' : 'no cue'}</span></div>`;
  const draft = `<div class="notice ${f === 4 ? 'pencil inked' : 'pencil'}"><h3>${SB.title}: ${SB.subject}</h3>${SB.body}</div>`;
  const split = `<div class="part"><h4>Done · can be undone</h4>${SB.done.map(x => `<div>${x.w}</div>`).join('')}</div><div class="part hard"><h4>${f === 4 ? 'Gone · can’t be undone' : 'On go · can’t be undone'}</h4>${ir.map(x => `<div>${x.w} · ${fmt(x.reach)} ${x.ext ? 'addresses' : 'people'}</div>`).join('')}</div>`;
  const log = `<div class="log"><p class="eyebrow">Harbour log · ${DATA.today}</p>${SB.log.map(l => `<div class="r"><span class="t">${l.t}</span><span>${l.w}</span></div>`).join('')}${f >= 1 ? `<div class="r"><span class="t">${SB.raisedAt}</span><span>${mm(AG)} drafted ${SB.title}; stands by for ${P(ME).name}</span></div>` : ''}${f === 4 ? `<div class="r new"><span class="t">${DATA.now}</span><span>${P(ME).name} said go. Published to ${fmt(ir[0].reach)}, emailed ${fmt(ir[1].reach)} (read back). Undo left: withdraw the notice.</span></div>` : ''}</div>`;
  let body;
  if (f === 0) body = `<div>${log}</div><div>${modeHTML(AG, { v: true })}</div>`;
  else if (f === 1 || f === 2) body = `<div>${draft}${split}</div><div>${modeHTML(AG, { v: true })}${f === 2 ? `<p class="small muted" style="margin-top:var(--space-3)">${first(ME)} answered “standing by”: ${a.name} stops asking anyone else. Not a yes.</p>` : ''}</div>`;
  else if (f === 3) body = `<div>${draft}</div><div>${log}</div>`;
  else body = `<div>${draft}${split}</div><div>${log}</div>`;
  let lb = '';
  if (f === 3) {
    lb = `<div class="lb" id="lb"><div class="bar" data-b="t"><span class="k">Stands by</span>${ir.map(x => `<span>${x.w.split(' ').slice(0, 3).join(' ')} · <b>${fmt(x.reach)}</b> · ${x.undoWord.split(':')[0]}</span>`).join('')}</div>
      <div class="fm" data-b="f"><div><p class="eyebrow">${mm(AG)} ${a.name} · time out</p>${SB.checks.map(c => `<div class="ck">${I('check', 14)}<span>${c.w}: ${c.v}</span></div>`).join('')}</div>
        <div><div class="rb">${SB.readBack.ask} <input value="${SB.readBack.answer}" aria-label="${SB.readBack.ask}" readonly></div><p class="small muted" style="margin:var(--space-2) 0">Read back only for the email: it leaves ${DATA.org} and can’t be unsent.</p><div style="display:flex;gap:var(--space-2)"><button class="btn go">${I('play', 14)} Go</button><button class="btn">${I('pause', 14)} Hold</button><button class="btn">Hand on to ${first(SB.deputy)}</button></div></div></div>
      <div class="bar" data-b="b"><span class="k">Go by</span><span><b>${SB.goBy}</b> for ${SB.goByWhy}</span><span>lapses <b>${SB.expires}</b>: not done</span><span>deputy asked at ${SB.deputyAt}</span></div></div>`;
  }
  return `${band}<div class="inner ${f === 3 ? 'dim' : ''}">${body}</div>${lb}`;
}
function fitLb() {
  const lb = $('#lb'); if (!lb) return;
  const r = lb.getBoundingClientRect(), ratio = parseFloat(css('--letterbox-ratio')), minBar = parseFloat(css('--letterbox')) / 100 * r.height;
  const fh = Math.min(r.width / ratio, r.height - minBar * 2), bh = (r.height - fh) / 2;
  $('[data-b="t"]').style.cssText = `top:0;height:${bh}px`; $('[data-b="b"]').style.cssText = `bottom:0;height:${bh}px`; $('[data-b="f"]').style.cssText = `top:${bh}px;height:${fh}px`;
}
function render() {
  $('#app').innerHTML = topHTML(['Inbox', SB.title], [['← →', 'step'], ['1–5', 'frame'], ['T', 'ADR words'], ['R', 'replay']], 'department') +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">${mm(AG)} ${a.name} · works under ${P(ME).name} · ${DATA.today}</p><h1 class="title">From standby to go</h1></div>
    <div class="film">${FRAMES().map((x, i) => `<button class="fr ${S.f === i ? 'sel' : ''}" data-f="${i}"><span class="t">${x.t}</span><b>${i + 1}. ${x.b}</b><span>${x.w}</span></button>`).join('')}</div>
    <section class="stage">${stage()}</section>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys(); fitLb();
  $$('.fr').forEach(b => b.onclick = () => { S.f = +b.dataset.f; render(); });
}
addEventListener('resize', fitLb);
function replay() { clearLater(); S.f = 0; settle(); render(); [1, 2, 3].forEach(k => later(() => { S.f = k; render(); }, MOMENT() * .6 + k * ms('--motion-calm'))); }
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'r') return replay();
  if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); return; }
  if (e.key === 'ArrowRight') { S.f = Math.min(4, S.f + 1); render(); }
  if (e.key === 'ArrowLeft') { S.f = Math.max(0, S.f - 1); render(); }
  if (/^[1-5]$/.test(k)) { S.f = +k - 1; render(); }
});
replay();
</script>
</body>
</html>
