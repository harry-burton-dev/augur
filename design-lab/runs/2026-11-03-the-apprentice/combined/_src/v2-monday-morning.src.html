<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Combined · V2 · Monday morning</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V2: back after the weekend. The orders, answered; the absence on one scale; what waits, by whose it is ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:var(--space-3)}
.modes{display:grid;gap:var(--space-2)}
.strip{position:relative;height:calc(var(--space-7) + var(--space-3));border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);padding:0 var(--space-4) 0 calc(var(--space-8) + var(--space-3))}
.strip .ax{position:absolute;left:calc(var(--space-8) + var(--space-3));right:var(--space-5);top:0;bottom:0}
.strip .ln{position:absolute;left:0;right:0;border-top:1px dashed var(--hairline)}
.strip .nm{position:absolute;left:var(--space-3);transform:translateY(-50%);font-size:var(--type-small);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:center}
.strip .tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--hairline)}
.strip .tick span{position:absolute;bottom:2px;left:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.strip .mk{position:absolute;transform:translate(-50%,-50%);display:inline-grid;place-items:center;width:var(--space-5);height:var(--space-5);border-radius:50%;background:var(--slate-deep);border:1px solid var(--hairline-strong);color:var(--ink)}
.strip .mk.standby{border-color:var(--x-proposed-standby)}
.strip .standing{position:absolute;height:2px;background:var(--x-proposed-standby);opacity:.7;transform:translateY(-50%)}
.strip .gap{position:absolute;height:var(--space-3);background:var(--x-proposed-unseen);border:1px dashed var(--hairline-strong);transform:translateY(-50%);border-radius:2px}
.strip .now{position:absolute;right:0;top:0;bottom:0;border-left:1.5px solid var(--x-proposed-lit)}
.cols{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:var(--space-5)}
.orders{min-height:0;display:flex;flex-direction:column;gap:var(--space-1)}
.o{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr) auto;gap:var(--space-3);align-items:start;padding:var(--space-1) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.o i{font-style:italic;color:var(--ink-muted)}
.o .a{display:block;color:var(--ink)}
.o .v{font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-proposed-lit)}
.o .v.late{color:var(--x-proposed-disagree)}
.calm{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-meta);color:var(--light);margin-top:var(--space-2)}
.waits{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.w{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-3);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-inset)}
.w.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash)}
.w.theirs{opacity:.75}
.w b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta)}
.w .s{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rec{padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.rec ol{margin:var(--space-1) 0 0;padding-left:var(--space-4);font-style:italic}
@media (max-width:1400px){.o i{display:none}.modes .mode > div:nth-child(4){display:none}.modes .mode{grid-template-columns:auto minmax(0,1.3fr) minmax(0,1.3fr) auto}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V2</b> Monday morning: the orders answered, the weekend on one scale, what waits by whose it is · diary V2, V4, V3; proposal V6; standby V1</div>
<script>
/*@DATA@*/
/*@LIB@*/
const d = id => DATA.diary.find(x => x.id === id), AG = 'a1', a = A(AG);
const DAYI = { Fri: 0, Sat: 1, Sun: 2, Mon: 3 };
const hrs = s => { const [dd, t] = s.split(/,?\s+/); const [h, m] = t.split(':').map(Number); return DAYI[dd] * 24 + h + m / 60; };
const T0 = hrs(DATA.awaySince.replace(/ \d+ \w+/, '')), T1 = hrs(DATA.today.split(' ')[0] + ' ' + DATA.now), X = t => (t - T0) / (T1 - T0) * 100;
const S = { shown: 0 };
const ORD = () => [
  [`Read reports as they arrive and each night`, `${D.reports(AG)} read; ${d('d9').n} waited for the limit`, 'late'],
  [`Batch class survey details for me`, `${D.n('batch', AG)} in ${D.of('batch', AG).length} batches, check ${sum(D.of('batch', AG), x => x.sample)}`],
  [`Hold Nordhavn Class one by one`, `${d('d2').n} held`], [`Hold new vessels`, `${d('d5').n} held`],
  [`Don’t choose between sources`, `${d('d8').n} set aside`], [`Don’t propose outside ${F(a.floor).name}`, `${d('d3').n} left for ${first(d('d3').ask)}`],
  [`Call me if it can’t wait`, 'no call']
];
function render() {
  const lanes = ['a1', 'a2'];
  $('#app').innerHTML = topHTML(['Home', 'Agents on ' + F('team').name], [...STD]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">Good morning, ${first(DATA.me)} · ${DATA.awaySince} to ${DATA.today}, ${DATA.now}</p><h1 class="title">While you were away</h1></div>
    <div class="modes">${modeHTML('a1')}</div>
    <div class="strip" role="img" aria-label="The weekend on one time scale"><div class="ax">
      ${[1, 2, 3].map(dd => dd * 24).map(t => `<div class="tick" style="left:${X(t)}%"><span>${Object.keys(DAYI)[t / 24]} 00:00</span></div>`).join('')}
      ${lanes.map((aid, li) => { const y = 30 + li * 36; return `<div class="ln" style="top:${y}%"></div>
        ${DATA.diary.filter(e => e.agent === aid).map((e, k) => `<span class="mk dep ${e.kind}" style="left:${X(hrs(e.t))}%;top:${y}%;--i:${k}" title="${e.t}: ${e.text}">${e.kind === 'standby' ? '<span class="lamp on" style="width:var(--space-2);height:var(--space-2)"></span>' : I(KIND_ICON[e.kind], 12)}</span>`).join('')}
        ${aid === 'a2' ? `<div class="standing" style="left:${X(hrs(d('d7').t))}%;width:${100 - X(hrs(d('d7').t))}%;top:${y}%"></div>` : `<div class="gap" style="left:${X(hrs(d('d9').t))}%;width:${X(hrs(d('d9').resumed)) - X(hrs(d('d9').t))}%;top:${y}%"></div>`}`; }).join('')}
      <div class="now"></div></div>
      ${lanes.map((aid, li) => `<span class="nm" style="top:${30 + li * 36}%">${mm(aid)} ${A(aid).name}</span>`).join('')}
    </div>
    <div class="cols">
      <section class="orders scroll"><p class="eyebrow">Your night orders, answered</p>
        ${ORD().map((o, i) => `<div class="o"><span>${i < S.shown ? I(o[2] ? 'minus' : 'check', 14) : ''}</span><span><i>${o[0]}</i><span class="a">${i < S.shown ? o[1] : '&nbsp;'}</span></span><span class="v ${o[2] || ''}">${i < S.shown ? (o[2] ? 'late' : 'kept') : ''}</span></div>`).join('')}
        <p class="calm">${I('moon', 16)} Nobody was called.</p>
      </section>
      <section class="waits scroll"><p class="eyebrow">What waits, and whose it is</p>
        ${STATE.gateway ? `<div class="rec pencil"><span class="small muted">${I('pencil', 12)} ${a.name} suggests an order</span><ol>${DATA.handoverRec.map(r => `<li>${r.w}</li>`).join('')}</ol></div>` : `<div class="rec pencil off"><span class="small muted">Gateway off: oldest first.</span></div>`}
        <div class="w pencil">${mm(AG)}<span><b>${D.n('batch', AG)} details in ${D.of('batch', AG).length} batches</b><span class="s">check ${sum(D.of('batch', AG), x => x.sample)} by sample, then sign each · ${lvl(a.level)}</span></span><button class="btn sm go">Open</button></div>
        <div class="w pencil">${mm(AG)}<span><b>${D.n('held', AG) + D.n('disagree', AG)} one by one</b><span class="s">${d('d2').n} Nordhavn · ${d('d5').n} new vessel · ${d('d8').n} where sources disagree</span></span><button class="btn sm">Open</button></div>
        <div class="w">${I('fence', 16)}<span><b>${d('d3').text[0].toUpperCase() + d('d3').text.slice(1)}</b><span class="s">outside its scope · ${P(d('d3').ask).name} could take it</span></span><button class="btn sm">Tell ${first(d('d3').ask)}</button></div>
        <div class="w theirs"><span class="lamp on"></span><span><b>${A('a2').name} stands by: ${d('d7').text}</b><span class="s">for ${P(d('d7').waits).name}, not you · since ${d('d7').t} · no deadline</span></span><span class="small muted">${first(d('d7').waits)}’s</span></div>
        <div class="w theirs">${mm('a2', true)}<span><b>${d('d6').n} certificates filed</b><span class="s">done, can be undone until ${d('d6').undoUntil} · in ${first(A('a2').supervisor)}’s diary</span></span><span></span></div>
      </section>
    </div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.shown = 0; settle(); render(); ORD().forEach((_, i) => later(() => { S.shown = i + 1; render(); }, MOMENT() + i * ms('--motion-instant') * 2)); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) markKeys(); });
replay();
</script>
</body>
</html>
