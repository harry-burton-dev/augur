<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Combined · V1 · A week in Triage</title>
<meta name="x-shot-wait" content="4200">
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V1: Survey reader extracts facts into Data Atlas Triage over one week. Its rung changes twice, both times by a person, with a reason ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:var(--space-3)}
.head{display:flex;justify-content:space-between;align-items:end;gap:var(--space-5)}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-2)}
.day{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:center;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);text-align:left;width:100%;transition:opacity var(--motion-base) var(--ease-out)}
.day.sel{border-color:var(--light);background:var(--surface-raised)}
.day.future{opacity:.45}
.day b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.day .m{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);text-align:right}
.day .ev{grid-column:1 / -1;display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);min-height:var(--leading-small)}
.day .ev.up{color:var(--x-proposed-lit)}
.day .ev.down{color:var(--x-proposed-disagree)}
.body{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,var(--measure-drawer));gap:var(--space-5)}
.story{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.beat{display:grid;grid-template-columns:calc(var(--space-7) - var(--space-2)) minmax(0,1fr);gap:var(--space-3);padding:var(--space-2) var(--space-3);border-left:2px solid var(--hairline-strong);transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.beat.wait{opacity:0;transform:translateY(var(--space-1))}
.beat .t{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.beat b{font-weight:400;color:var(--light)}
.beat p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.beat .sub{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:2px}
.beat.person{border-left-color:var(--x-proposed-lit)}
.beat.agent{border-left-style:dotted;border-left-color:var(--x-proposed-pencil)}
.beat.flag{border-left-color:var(--x-proposed-disagree)}
.beat.seam{border-left-color:var(--x-proposed-seam);background:var(--x-proposed-seam-wash)}
.rows{display:grid;gap:2px;margin-top:var(--space-2)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:var(--space-3);align-items:center;padding:2px var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);border-radius:var(--radius-key)}
.row .v{font-style:italic}
.row.ok .v{font-style:normal}
.row .vd{font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.cells{display:flex;flex-wrap:wrap;gap:2px;margin-top:var(--space-2)}
.cl{width:var(--space-3);height:var(--space-3);border:1px dotted var(--x-proposed-pencil);border-radius:1px}
.cl.s{border:1.5px solid var(--light)}
.cl.n{background:var(--floor-department-high)}
.cl.ink{border-style:solid;border-color:var(--hairline-strong);background:color-mix(in srgb,var(--ink) 18%,transparent)}
.cl.bad{background:var(--x-proposed-seam);border-color:var(--x-proposed-seam)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.card{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:grid;gap:var(--space-2)}
.card h3{margin:0;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.kr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2);color:var(--ink)}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-2);align-items:end;height:var(--space-8)}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.bars i{display:block;width:100%;border-radius:2px 2px 0 0;background:color-mix(in srgb,var(--ink) 30%,transparent)}
.bars div.sel i{background:var(--light)}
.bars div.fut i{background:var(--hairline)}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.tot span{display:flex;flex-direction:column;color:var(--ink-muted)}
.tot b{font:300 var(--type-heading)/1.2 var(--font-mono);color:var(--light)}
@media (max-width:1400px){.beat .sub{display:none}.day .ev{font-size:var(--x-proposed-type-micro)}.mode > div:nth-child(4){display:none}.mode{grid-template-columns:auto minmax(0,1.3fr) minmax(0,1.3fr) auto}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V1</b> a week in Triage: one agent, five days, two rung changes, each a person's decision with a reason · from all six surfaces</div>
<script>
/*@DATA@*/
/*@LIB@*/
const AG = 'a1', a = A(AG), W = DATA.week, MK = DATA.mistake, R = DATA.replay, M = DATA.batchMix;
const wrong = MK.siblings.filter(s => s.proposed !== s.right);
/* the rung of each kind, by day: class survey details widen on Wed; Nordhavn narrows on Fri */
const RUNG = { k1: [1, 1, 2, 2, 2], k2: [1, 1, 2, 2, 1], k3: [1, 1, 1, 1, 1], k4: [1, 1, 1, 1, 1] };
const EV = [
  { ic: 'hand', w: 'one by one' },
  { ic: 'pencil', w: 'AUGUR suggests a replay' },
  { ic: 'arrow-up', w: 'widened by ' + first(a.supervisor), cls: 'up' },
  { ic: 'layers', w: 'batch signed by sample' },
  { ic: 'arrow-down', w: 'mistake · narrowed', cls: 'down' }
];
const vs = k => M.vessels[k % M.vessels.length];
/* what happened each day, as beats. kind: agent | person | flag | seam */
function beats(i) {
  const d = W[i], sup = first(a.supervisor);
  if (i === 0) return [
    { t: '00:40', k: 'agent', p: `${mm(AG)} <b>${d.proposed} details</b> proposed overnight, each waiting on its own. ${lvl(1, 2)}`, x: `<div class="rows">${[0, 1, 2, 3].map(k => `<div class="row ${k < 3 ? 'ok' : ''}">${mm(AG, k < 3)}<span>${vs(k)} · ${M.details[k]}</span><span class="v">${k === 3 ? 'pencil' : 'ink'}</span><span class="vd">${k < 2 ? 'ticked' : k === 2 ? 'corrected' : 'waiting'}</span></div>`).join('')}</div>` },
    { t: '09:10', k: 'person', p: `<b>${sup}</b> checks them one by one: ${d.acc} ticked, ${d.chg} corrected, ${d.rej} crossed (“wrong vessel”, a sister ship).`, s: `${d.mins} minutes. Each correction is kept as feedback on the kind of work.` }
  ];
  if (i === 1) return [
    { t: '00:35', k: 'agent', p: `${mm(AG)} <b>${d.proposed} details</b>, one by one again.` },
    { t: '09:05', k: 'person', p: `<b>${sup}</b>: ${d.acc} ticked, ${d.chg} corrected.`, s: `${d.mins} minutes.` },
    { t: '09:50', k: 'agent', p: `<span class="pencil" style="padding:2px var(--space-2)"><span class="pen">AUGUR: class survey details, ${K('k1').run} in a row accepted as read. A replay of ${R.of} would show whether a batch is safe.</span></span>`, s: `A suggestion, in pencil. ${sup} books the replay for tonight: ${R.checked * 2} model calls, outside ${a.name}’s day.` }
  ];
  if (i === 2) return [
    { t: '02:10', k: 'agent', p: `${mm(AG)} The replay: <b>${R.agree} of ${R.checked}</b> agree with what people decided. ${R.differWhy.map(x => `${x.n} were ${x.w}`).join('; ')}.`, s: 'Nothing the shadow run wrote was kept.' },
    { t: '09:20', k: 'person', p: `<b>${sup} widens</b> class survey details to ${lvl(2, 2)}. Links and new vessels stay at rung 1.`, s: `Reason on the record: “${a.history[1].why}”. Permit for ${DATA.permitWeeks} weeks.` },
    { t: '23:55', k: 'agent', p: `${mm(AG)} The first batch: <b>${d.proposed} details</b>, sample of ${d.sample} drawn across issuers.`, x: `<div class="cells">${Array.from({ length: d.proposed }, (_, k) => `<i class="cl ink ${k % 6 === 1 ? 's' : ''}"></i>`).join('')}</div>` },
    { t: '09:00', k: 'person', p: `<b>${sup}</b> checks ${d.sample}, all right, and signs the batch: ${d.proposed} in ink.`, s: `${d.mins} minutes, down from ${W[1].mins}.` }
  ];
  if (i === 3) return [
    { t: '00:20', k: 'agent', p: `${mm(AG)} <b>${d.proposed} details</b> in one batch. Sample of ${d.sample}: ${MK.batch.nordhavnInSample} from a Nordhavn Class certificate, in the new layout.`, x: `<div class="cells">${Array.from({ length: d.proposed }, (_, k) => `<i class="cl ${S.day === 3 && S.beat > 1 ? 'ink' : ''} ${k % 7 === 2 ? 's' : ''} ${k === 16 ? 'n s' : ''} ${[3, 11, 24, 33, 40, 47].includes(k) ? 'n' : ''}"></i>`).join('')}</div><span class="sub">Lavender: Nordhavn Class. Outlined: in the sample.</span>` },
    { t: '08:55', k: 'person', p: `<b>${sup}</b> checks ${d.sample}, all right, signs: ${d.proposed} in ink, each “accepted in a batch of ${d.proposed}, ${d.sample} checked”.`, s: `${d.mins} minutes. Nothing looked wrong; nothing in the sample was an old Nordhavn certificate.` }
  ];
  return [
    { t: MK.found.at.split(' ')[1], k: 'flag', p: `<b>${P(MK.found.who).name}</b> flags ${MK.fact.entity}’s tonnage: ${MK.found.how}` },
    { t: MK.pausedAt.split(' ')[1], k: 'flag', p: `${first(MK.found.who)} pulls the cord: <b>${MK.lot.rule}</b> stop. Nothing else stops.` },
    { t: '11:40', k: 'person', p: `<b>${sup}</b> recalls the lot: ${MK.siblings.length} tonnages made the same way since ${MK.lot.since}. <b>${wrong.length} wrong</b>, all old layout.`, x: `<div class="cells">${MK.siblings.map(s => `<i class="cl ${s.proposed !== s.right ? 'bad' : 'ink'}" title="${s.v}"></i>`).join('')}</div>` },
    { t: MK.repairedAt.split(' ')[1], k: 'seam', p: `Repaired, each with a seam: <span class="struck">${MK.fact.wrong}</span> ${MK.fact.right} and ${wrong.length - 1} more. ${MK.used.filter(u => !u.dup).length} owners told, by ${sup}.` },
    { t: MK.narrowedAt.split(' ')[1], k: 'person', p: `<b>${sup} narrows</b> Nordhavn Class to ${lvl(1, 2)}; class survey details stay at 2, sampled across issuers <i>and</i> layouts.`, s: `“${a.history[2].why}” ${MK.back}.` }
  ];
}
const S = { day: 0, beat: 99, shown: 1 };
function render() {
  const i = S.day, d = W[i];
  const upto = W.slice(0, i + 1), tot = { acc: sum(upto, x => x.acc), chg: sum(upto, x => x.chg), rej: sum(upto, x => x.rej) };
  const maxM = Math.max(...W.map(x => x.mins));
  /* the mode line as it stood that morning */
  const now = i === 4 && S.beat > 1 ? { w: 'Reading', what: 'class survey reports', step: `${MK.lot.rule}: stopped by ${first(MK.found.who)}`, tech: 'kind k2 paused' }
    : { w: 'Waiting', what: `${d.proposed} details for ${first(a.supervisor)}`, step: d.sample ? `as one batch, check ${d.sample}` : 'one by one', tech: 'checkpoint open' };
  const fakeA = { ...a, level: RUNG.k1[i], now };
  DATA.agents.a1 = fakeA;
  const mode = i === 4 && S.beat > 1 ? modeHTML(AG, { next: { w: 'Hold', what: MK.lot.rule }, boxNext: true }) : modeHTML(AG);
  DATA.agents.a1 = a;
  $('#app').innerHTML = topHTML(['Data Atlas', 'Triage', a.name, 'This week'], [['1–5', 'a day'], ['← →', 'day'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div class="head"><div><p class="eyebrow">${mm(AG)} ${a.name} · under ${P(a.supervisor).name} · ${W[0].d} to ${W[4].d}</p><h1 class="title">A week in Triage</h1></div></div>
    <div class="days">${W.map((x, k) => `<button class="day ${k === i ? 'sel' : ''} ${k >= S.shown ? 'future' : ''}" data-d="${k}">${rungs(RUNG.k1[k], 2)}<b>${x.d}</b><span class="m">${x.mins} min</span><span class="ev ${EV[k].cls || ''}">${I(EV[k].ic, 14)} ${EV[k].w}</span></button>`).join('')}</div>
    ${mode}
    <div class="body">
      <section class="story scroll" aria-live="polite">${beats(i).map((b, k) => `<div class="beat ${b.k} ${k < S.beat ? '' : 'wait'}"><span class="t">${b.t}</span><div><p>${b.p}</p>${b.s ? `<span class="sub">${b.s}</span>` : ''}${b.x || ''}</div></div>`).join('')}</section>
      <aside class="side scroll">
        <div class="card"><h3>Rungs, ${d.d}</h3>${['k1', 'k2', 'k3', 'k4'].map(k => `<div class="kr"><span>${K(k).w}</span>${lvl(RUNG[k][i], K(k).cap, false)}</div>`).join('')}</div>
        <div class="card"><h3>${first(a.supervisor)}’s minutes a day</h3><div class="bars">${W.map((x, k) => `<div class="${k === i ? 'sel' : ''} ${k >= S.shown ? 'fut' : ''}"><span>${x.mins}</span><i style="height:${x.mins / maxM * 80}%"></i><span>${x.d.split(' ')[0]}</span></div>`).join('')}</div></div>
        <div class="card"><h3>The record, to ${d.d}</h3><div class="tot"><span><b>${tot.acc}</b>ticked</span><span><b>${tot.chg}</b>corrected</span><span><b>${tot.rej}</b>crossed</span></div><span>Counted from Triage. ${a.name} never writes its own record.</span></div>
        <p class="tk">rung changes = audit agent.level.changed (Wed, Fri) · pause = kind paused by a reader · recall = lot query · repairs = seams on details</p>
      </aside></div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.day').forEach(b => b.onclick = () => go(+b.dataset.d));
}
function go(k) { clearLater(); S.day = Math.max(0, Math.min(4, k)); S.shown = Math.max(S.shown, S.day + 1); S.beat = 0; render(); beats(S.day).forEach((_, b) => later(() => { S.beat = b + 1; render(); }, (b + 1) * ms('--motion-slow'))); }
function replay() {
  clearLater(); S.day = 0; S.shown = 1; S.beat = 99; settle(); render();
  /* the moment: the week fills day by day and lands on Friday, where the mistake is */
  [1, 2, 3].forEach(k => later(() => { S.day = k; S.shown = k + 1; render(); }, MOMENT() * .5 + k * ms('--motion-slow')));
  later(() => go(4), MOMENT() * .5 + 4 * ms('--motion-slow'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (/^[1-5]$/.test(e.key)) go(+e.key - 1);
  if (e.key === 'ArrowRight') go(S.day + 1);
  if (e.key === 'ArrowLeft') go(S.day - 1);
});
replay();
</script>
</body>
</html>
