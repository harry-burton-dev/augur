<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Apprentice sheet · V2 · The ladder and the ceiling</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: four named rungs, a fixed ceiling above them, and Sheridan and Verplank's ten levels mapped onto them ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,var(--measure-drawer));gap:var(--space-6)}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.ceiling{position:relative;padding:var(--space-3) var(--space-4) var(--space-3) calc(var(--space-7) + var(--space-4));border-top:3px solid var(--x-proposed-ceiling);border-bottom:1px solid var(--hairline)}
.ceiling .lab{position:absolute;left:0;top:var(--space-3);width:var(--space-7);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light)}
.ceiling ul{list-style:none;margin:var(--space-1) 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px var(--space-5);font-size:var(--type-small);line-height:var(--leading-small)}
.ceiling li{color:var(--ink)}
.ceiling li i{font-style:normal;color:var(--ink-muted)}
.ceiling p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.master{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding-left:calc(var(--space-7) + var(--space-4))}
.master b{font-weight:400;color:var(--light)}
.ladder{flex:1;min-height:0;display:flex;flex-direction:column-reverse;gap:var(--space-2)}
.rung{flex:1;display:grid;grid-template-columns:var(--space-7) minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);gap:var(--space-4);align-items:start;padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard);text-align:left;width:100%}
.rung:hover,.rung.hot{border-color:var(--hairline-strong);background:var(--surface-raised)}
.rung > span{display:block;min-width:0}
.rung .n{font:200 var(--type-display)/1 var(--font-sans);color:var(--light)}
.rung .g{display:block;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-top:var(--space-1)}
.rung h3{font-weight:400;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);margin:0 0 var(--space-1)}
.rung .d{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.rung .c{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rung .c b{display:block;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-bottom:2px}
.kinds{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.kind{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-2);border:1px dotted var(--x-proposed-pencil);border-radius:var(--radius-pill);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.kind.away{opacity:0;transform:translateY(calc(var(--space-4) * -1))}
.kind.cap{border:1px dashed var(--hairline);color:var(--ink-muted)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.sv{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sv li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small)}
.sv li .n{font-family:var(--font-mono);color:var(--ink-muted)}
.sv li .u{display:block;color:var(--ink-muted)}
.sv li.used{background:var(--surface-inset)}
.sv li.used .u{color:var(--x-proposed-lit)}
.sv li.never .w{text-decoration:line-through;text-decoration-color:var(--hairline-strong);color:var(--ink-muted)}
.sv li.hot{outline:1px solid var(--x-proposed-lit);outline-offset:-1px}
.side .note{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.rung{grid-template-columns:var(--space-7) minmax(0,1fr) minmax(0,1fr);gap:var(--space-1) var(--space-4);padding:var(--space-2) var(--space-4)}.rung .c.who{grid-column:2 / -1;display:flex;gap:var(--space-3);align-items:center}.rung .c.who b{margin:0}.rung h3{font-size:var(--type-body)}.ceiling{padding-top:var(--space-2);padding-bottom:var(--space-2)}.rung > span{display:block;min-width:0}
.rung .n{font-size:var(--type-title-s)}.ceiling ul{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Apprentice sheet · V2</b> four rungs and a ceiling no rung passes · Sheridan and Verplank's levels of automation, SAE J3016, the guild ladder</div>
<script>
/*@DATA@*/
/*@LIB@*/
const AG = 'a1', a = A(AG);
const S = { hot: null, placed: false };
function render() {
  const svOf = n => DATA.sv.filter(v => L(n).sv === v.n);
  $('#app').innerHTML = topHTML(['Admin', 'Agents', 'How agents work'], [['0–3', 'a rung'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="left">
      <div class="ceiling dep" style="--i:0"><span class="lab">Ceiling</span>
        <p>At every rung, an agent stands by for a person before it would:</p>
        <ul>${DATA.ceiling.map(c => `<li><span>${c.w}</span> <i>· ${c.why}</i></li>`).join('')}</ul>
        <p class="tk">AUGUR’s list, not a setting: no deployment and no supervisor can lower it. ADR 0014 needs it as a fixed set of checkpoint kinds.</p></div>
      <p class="master dep" style="--i:1"><b>There is no rung above ${DATA.ladder.length - 1}.</b> A person is always the master: the guild’s top grade is not an agent’s to reach.</p>
      <div class="ladder" role="list">${DATA.ladder.map(r => {
        const ks = DATA.kinds.filter(k => k.level === r.n);
        const capped = DATA.kinds.filter(k => k.cap < r.n);
        return `<button class="rung dep ${S.hot === r.n ? 'hot' : ''}" style="--i:${2 + r.n}" data-n="${r.n}" role="listitem">
          <span><span class="n">${r.n}</span><span class="g">${r.guild}</span></span>
          <span><h3>${r.name}</h3><span class="d">${r.alone}</span><span class="tk">${r.tech}</span></span>
          <span class="c"><b>A person</b>${r.check}</span>
          <span class="c who"><b>${a.name} here</b><span class="kinds">${ks.map(k => `<span class="kind ${S.placed ? '' : 'away'}">${mm(AG)} ${k.w}</span>`).join('') || '<span class="muted">nothing</span>'}${capped.length && r.n > 0 ? `<span class="kind cap" title="${capped.map(k => k.w).join(', ')}">${plural(capped.length, 'kind')} can’t reach this rung</span>` : ''}</span></span>
        </button>`; }).join('')}</div>
    </section>
    <aside class="side scroll">
      <p class="eyebrow">Sheridan and Verplank, ten levels</p>
      <ul class="sv">${DATA.sv.map(v => { const used = !/^never|^not used|^how people/.test(v.use); return `<li class="${used ? 'used' : /^never/.test(v.use) ? 'never' : ''} ${S.hot !== null && L(S.hot).sv === v.n ? 'hot' : ''}"><span class="n">${v.n}</span><span><span class="w">${v.w}</span><span class="u">${v.use}</span></span></li>`; }).join('')}</ul>
      <p class="note">AUGUR keeps four of the ten. It leaves out 6, the veto timer (“it goes ahead unless you stop it”), because silence is never a yes. It leaves out 8 to 10 because the diary always tells.</p>
      <p class="note">SAE J3016 asks who watches the road and who takes over. Here it is the same person at every rung: ${P(a.supervisor).name}, the supervisor.</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.rung').forEach(b => { b.onmouseenter = () => { S.hot = +b.dataset.n; render(); }; b.onclick = () => { S.hot = +b.dataset.n; render(); }; });
}
function replay() {
  clearLater(); S.hot = null; S.placed = false; settle(); render();
  /* the moment: Survey reader's kinds of work drop onto their rungs, and its highest rung is lit */
  later(() => { S.placed = true; render(); }, MOMENT());
  later(() => { S.hot = a.level; render(); }, MOMENT() + ms('--motion-calm'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (/^[0-3]$/.test(e.key)) { S.hot = +e.key; render(); }
});
replay();
</script>
</body>
</html>
