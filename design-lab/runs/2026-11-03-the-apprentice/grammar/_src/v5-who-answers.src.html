<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Apprentice sheet · V5 · Who answers for what</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: the delegation matrix. The five rights of delegation as the header, then every action against everyone it touches ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3)}
.rights{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-2)}
.right{padding:var(--space-2) var(--space-3);border-top:2px solid var(--hairline-strong);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.right b{display:block;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.right em{font-style:normal;color:var(--ink)}
.right.hot{border-top-color:var(--x-proposed-lit)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--type-small);line-height:var(--leading-small)}
th,td{padding:var(--space-1) var(--space-3);border-bottom:1px solid var(--hairline);text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--slate-deep);font-weight:400;color:var(--ink-muted);z-index:1}
thead th b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta)}
tbody th{font-weight:400;color:var(--ink);white-space:nowrap}
tbody th .r{display:block;color:var(--ink-muted)}
td{white-space:nowrap}
.c{display:inline-flex;align-items:center;gap:var(--space-1);padding:1px var(--space-2);border-radius:var(--radius-pill);border:1px solid transparent}
.c.does{border-color:var(--hairline-strong);color:var(--ink)}
.c.pencil{border-style:dotted;font-style:italic}
.c.answers{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.c.stop{color:var(--ink)}
.c.cant{color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.c.hold{border-color:var(--x-proposed-standby);color:var(--light)}
tr.ceil th{border-left:3px solid var(--x-proposed-ceiling);padding-left:calc(var(--space-3) - 3px)}
tr.hot td,tr.hot th{background:var(--surface-raised)}
.key{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);align-items:center}
.col-hot{background:var(--x-proposed-lit-wash)}
@media (max-width:1400px){.right{padding:var(--space-1) var(--space-2)}.right span{display:none}tbody th .r{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Apprentice sheet · V5</b> who answers for what: the delegation matrix · the five rights of delegation (nursing), RCN accountability, RACI</div>
<script>
/*@DATA@*/
/*@LIB@*/
const AG = 'a1', a = A(AG);
const S = { hot: -1, col: -1 };
/* the five rights of delegation, and what each is in AUGUR */
const RIGHTS = [
  { b: 'Right task', w: 'Only kinds of work with a cap that allows it', em: 'kind and cap' },
  { b: 'Right circumstance', w: 'Only on its floors, within its limits', em: 'scope and limits' },
  { b: 'Right person', w: 'An agent whose record earns the rung', em: 'rung, from the record' },
  { b: 'Right direction', w: 'An errand anyone affected can read', em: 'the indenture' },
  { b: 'Right supervision', w: 'A named person, a diary, a deputy', em: 'supervisor and diary' }
];
const COLS = [
  { b: a.name, w: 'the agent' },
  { b: P(a.supervisor).name, w: 'its supervisor' },
  { b: P(a.deputy).name, w: 'deputy, when Ana is away' },
  { b: 'Anyone affected', w: 'a reader, a record’s keeper' },
  { b: P(DATA.gateway.admin).name, w: 'deployment admin' }
];
const C = { does: ['does', 'Does'], pen: ['does pencil', 'Drafts'], ans: ['answers', 'Answers for'], stop: ['stop', 'May stop'], cant: ['cant', 'Can’t'], hold: ['hold', 'Stands by'], go: ['answers', 'Says go'], chk: ['does', 'Checks'], acc: ['answers', 'Accepts'], flag: ['stop', 'May flag'] };
/* each row: an action, then a cell per column */
const ROWS = [
  { w: 'Read a survey report', r: 'on its floors', c: ['does', 'ans', 'chk', 'cant', 'cant'] },
  { w: 'Draft a detail for Data Atlas', r: 'rungs 1 and 2', c: ['pen', 'ans', 'chk', 'cant', 'cant'] },
  { w: 'Accept a detail into Data Atlas', r: 'Triage', c: ['cant', 'acc', 'acc', 'cant', 'cant'], ceil: 1 },
  { w: 'File a report in Vessel surveys', r: 'rung 3, same readers', c: ['does', 'ans', 'chk', 'flag', 'cant'] },
  { w: 'Withdraw a superseded report', r: 'can’t be undone', c: ['hold', 'go', 'go', 'flag', 'cant'], ceil: 1 },
  { w: 'Tell a reader something changed', r: 'reaches people', c: ['hold', 'go', 'go', 'cant', 'cant'], ceil: 1 },
  { w: 'Choose between disagreeing sources', r: 'a judgement', c: ['cant', 'acc', 'acc', 'flag', 'cant'], ceil: 1 },
  { w: 'Undo its own work', r: `within ${DATA.undoDays} days`, c: ['cant', 'does', 'does', 'cant', 'cant'] },
  { w: 'Flag its work as wrong', r: 'anyone who sees it', c: ['cant', 'does', 'does', 'flag', 'does'] },
  { w: 'Pause this kind of work', r: 'reversible, says who and why', c: ['cant', 'stop', 'stop', 'stop', 'stop'] },
  { w: 'Change its rung', r: 'a recorded decision', c: ['cant', 'acc', 'cant', 'cant', 'cant'], ceil: 1 },
  { w: 'Turn the model gateway on or off', r: 'for every app', c: ['cant', 'cant', 'cant', 'cant', 'does'] }
];
function render() {
  $('#app').innerHTML = topHTML(['Admin', 'Agents', 'How agents work', 'Who answers'], [['↑ ↓', 'an action'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">Delegation, as nursing teaches it: the one who delegates stays accountable</p><h1 class="title">Who answers for what</h1></div>
    <div class="rights">${RIGHTS.map((r, i) => `<div class="right dep" style="--i:${i}"><b>${r.b}</b><span>${r.w}</span> · <em>${r.em}</em></div>`).join('')}</div>
    <div class="scroll"><table>
      <thead><tr><th>Action</th>${COLS.map((c, j) => `<th class="${S.col === j ? 'col-hot' : ''}"><b>${c.b}</b>${c.w}</th>`).join('')}</tr></thead>
      <tbody>${ROWS.map((r, i) => `<tr class="dep ${r.ceil ? 'ceil' : ''} ${S.hot === i ? 'hot' : ''}" style="--i:${i}" data-i="${i}"><th>${r.w}<span class="r">${r.r}${r.ceil ? ' · on the ceiling' : ''}</span></th>${r.c.map((k, j) => `<td class="${S.col === j ? 'col-hot' : ''}"><span class="c ${C[k][0]}">${C[k][1]}</span></td>`).join('')}</tr>`).join('')}</tbody>
    </table>
    <p class="key" style="margin-top:var(--space-3)"><span class="c answers">Answers for</span> only ever a person: every row with an answer has a name in it. <span class="c hold">Stands by</span> the agent holds and a person says go. <span class="c does pencil">Drafts</span> pencil. Rows edged in grey are on the ceiling.</p>
    <p class="tk">ADR 0014 terms: supervisor = grant.supervisor (new) · deputy = grant.deputy (new) · stands by = checkpoint kind standby (new) · stop = run cancel (has) · undo = agent.undo within the undo window (new)</p></div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('tbody tr').forEach(tr => tr.onmouseenter = () => { if (S.hot !== +tr.dataset.i) { S.hot = +tr.dataset.i; render(); } });
}
function replay() {
  clearLater(); S.hot = -1; S.col = -1; settle(); render();
  /* the moment: the supervisor's column lights: every "answers for" lands on a person */
  later(() => { S.col = 1; render(); }, MOMENT());
  later(() => { S.col = -1; render(); }, MOMENT() + ms('--motion-still'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.hot = ((S.hot < 0 ? -1 : S.hot) + (e.key === 'ArrowDown' ? 1 : ROWS.length - 1)) % ROWS.length; render(); }
});
replay();
</script>
</body>
</html>
