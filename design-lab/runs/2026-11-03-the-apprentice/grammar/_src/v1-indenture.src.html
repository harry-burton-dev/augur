<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Apprentice sheet · V1 · The indenture</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: the agent's indenture. One page that binds an agent to a person, clause by clause, annotated ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,var(--measure-card));gap:var(--space-5);max-width:calc(var(--measure-wide) + var(--measure-card) + var(--space-5));margin:0 auto}
.paper{min-height:0;padding:var(--space-5) var(--space-6);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);position:relative}
.paper::before{content:"";position:absolute;inset:var(--space-2);border:1px solid var(--hairline);border-radius:calc(var(--radius-inset) - var(--space-1));pointer-events:none}
.head{display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-3)}
.head .title{font-size:var(--type-heading);line-height:var(--leading-heading)}
.cl{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);padding:var(--space-2) 0;border-top:1px solid var(--hairline);position:relative}
.cl .no{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.cl .tx{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.cl .tx b{font-weight:500;color:var(--light)}
.cl.hot{background:linear-gradient(90deg,var(--x-proposed-lit-wash),transparent 70%)}
.kinds{display:grid;grid-template-columns:max-content auto auto;justify-content:start;gap:2px var(--space-4);margin-top:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small)}
.kinds .c{color:var(--ink-muted);white-space:nowrap}
.ceil{columns:2;column-gap:var(--space-5);margin:var(--space-1) 0 0;padding:0;list-style:none;font-size:var(--type-small);line-height:var(--leading-small)}
.ceil li{break-inside:avoid;padding-left:var(--space-4);position:relative;margin-bottom:2px}
.ceil li.more{display:none;color:var(--ink-muted)}
.ceil li::before{content:"";position:absolute;left:0;top:calc(var(--leading-small) / 2 - 1px);width:var(--space-2);height:2px;background:var(--x-proposed-ceiling)}
.sig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);margin-top:var(--space-3)}
.sig div{border-top:1px solid var(--hairline-strong);padding-top:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.sig b{display:block;font-weight:400;color:var(--ink);font-style:italic}
.margin{min-height:0;display:flex;flex-direction:column;gap:var(--space-2);padding-top:var(--space-5)}
.note{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);padding:var(--space-2) var(--space-3);border-left:1px solid var(--hairline-strong);border-radius:0 var(--radius-key) var(--radius-key) 0}
.note .no{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.note b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.note span.d{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.adr{display:flex;align-items:center;gap:var(--space-1);margin-top:2px;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.adr.add{color:var(--x-proposed-lit)}
.note.hot{border-left-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.legend{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.paper{padding:var(--space-4) var(--space-5)}.ceil li:nth-child(n+9):not(.more){display:none}.ceil li.more{display:block}.margin .note span.d{display:block;display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Apprentice sheet · V1</b> the indenture: one page binds an agent to a person, clause by clause · guild indentures, clinical delegation, ADR 0014</div>
<script>
/*@DATA@*/
/*@LIB@*/
const AG = 'a1', a = A(AG);
const S = { hot: -1 };
/* each clause: the words on the indenture, and the margin note that names it in the grammar and in ADR 0014 */
const CLAUSES = () => [
  { g: 'Supervisor', d: 'A named person answers for its work. No supervisor, no work: if the post is empty, it pauses.',
    adr: 'needs: a supervisor and a deputy in the grants at start', add: true,
    html: `<b>${a.name}</b> works under <b>${P(a.supervisor).name}</b>, ${P(a.supervisor).role}, who answers for its work. <b>${P(a.deputy).name}</b> stands in when ${first(a.supervisor)} is away.` },
  { g: 'Errand', d: 'What it is for, in a sentence anyone affected can read.',
    adr: 'has: the manifest agents block', add: false,
    html: `It ${a.does}. It runs ${a.schedule}.` },
  { g: 'Scope', d: 'Where it may read, propose and act, floor by floor. Outside is drawn, never hidden.',
    adr: 'has: grants at start, per floor', add: false,
    html: `It may read on ${DATA.floorOrder.map(f => `<span class="fword" data-tier="${f}">${F(f).name}</span>`).join(', ')}, and propose and file only on <span class="fword" data-tier="${a.floor}">${F(a.floor).name}</span>.` },
  { g: 'Rung', d: 'One of four, per kind of work. The kind sets the cap; the record sets the rung.',
    adr: 'needs: a level per kind of work, and its cap', add: true,
    html: `Its rung for each kind of work:<div class="kinds">${DATA.kinds.slice(0, 5).map(k => `<span>${k.w}</span>${lvl(k.level, k.cap)}<span class="c">cap ${k.cap}</span>`).join('')}</div>` },
  { g: 'Ceiling', d: 'What no agent does alone at any rung. AUGUR’s list, the same in every deployment.',
    adr: 'needs: a fixed list of standby actions', add: true,
    html: `Whatever its rung, it stands by for a person before it would:<ul class="ceil">${DATA.ceiling.map(c => `<li>${c.w}</li>`).join('')}<li class="more">and ${DATA.ceiling.length - 8} more on AUGUR’s list (wider window)</li></ul>` },
  { g: 'Marks', d: 'Its work is pencil, signed with its mark, until a person accepts it. Accepted work keeps the mark.',
    adr: 'needs: proposedBy and acceptedBy on every piece', add: true,
    html: `Its work carries its mark ${mm(AG)} and stays in pencil until a person accepts it. Accepted work keeps the mark ${mm(AG, true)} and the name of who accepted it.` },
  { g: 'Limits', d: 'Model calls a day, from the gateway. When they run out it stops and says so.',
    adr: 'has: budgets, and the gateway’s daily limit', add: false,
    html: `It may make <b>${a.calls.limit}</b> model calls a day (${DATA.gateway.resets}). When the model gateway is off, it waits and loses nothing.` },
  { g: 'Diary', d: 'A daily record of what it did, held and couldn’t do, checked by its supervisor.',
    adr: 'needs: a site diary, built from the run’s steps', add: true,
    html: `It keeps a diary of each day: what it did, what it held for a person, and what it couldn’t do and why. ${first(a.supervisor)} checks it.` }
];
function render() {
  const cl = CLAUSES();
  $('#app').innerHTML = topHTML(['Admin', 'Agents', a.name, 'Indenture'], [['↑ ↓', 'clause'], ...STD]) +
  `<main class="main"><div class="wrap">
    <article class="paper scroll" aria-label="Indenture of ${a.name}">
      <div class="head">${mm(AG, true, true)}<div><p class="eyebrow">Indenture · ${F(a.floor).word} floor · ${DATA.org}</p><h1 class="title">${a.name}</h1></div></div>
      ${cl.map((c, i) => `<div class="cl ${S.hot === i ? 'hot' : ''}" data-i="${i}"><span class="no">${i + 1}.</span><div class="tx">${c.html}</div></div>`).join('')}
      <div class="sig">${a.history.map(h => `<div><b>${P(h.by).name}</b>${h.w}, ${h.d}</div>`).join('')}</div>
    </article>
    <aside class="margin scroll" aria-label="What each clause is">
      <p class="eyebrow">The grammar, clause by clause</p>
      ${cl.map((c, i) => `<div class="note dep ${S.hot === i ? 'hot' : ''}" style="--i:${i}" data-i="${i}"><span class="no">${i + 1}</span><span><b>${c.g}</b><span class="d">${c.d}</span><span class="adr ${c.add ? 'add' : ''}">${I(c.add ? 'plus' : 'check', 12)} ADR 0014 ${c.adr}</span></span></div>`).join('')}
      <p class="legend">${I('plus', 12)} green: what ADR 0014 needs to add. ${cl.filter(c => c.add).length} of ${cl.length} clauses.</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('[data-i]').forEach(el => el.onmouseenter = () => { if (S.hot !== +el.dataset.i) { S.hot = +el.dataset.i; render(); } });
}
function replay() {
  clearLater(); S.hot = -1; settle(); render();
  /* the moment: the margin fills, then the clauses that ADR 0014 lacks light one after another, once */
  const add = CLAUSES().map((c, i) => c.add ? i : -1).filter(i => i >= 0);
  add.forEach((i, k) => later(() => { S.hot = i; render(); }, MOMENT() + k * ms('--motion-calm')));
  later(() => { S.hot = -1; render(); }, MOMENT() + add.length * ms('--motion-calm') + ms('--motion-run'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); clearLater(); const n = CLAUSES().length; S.hot = ((S.hot < 0 ? -1 : S.hot) + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; render(); }
});
replay();
</script>
</body>
</html>
