<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Apprentice sheet · V3 · The life of a piece of work</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; listed as
   "needs token" in each notes.md. Carried marks first, then new.
   --------------------------------------------------------------- */
:root{
  /* carried: not yours to see (135 degree hatch), quiet, micro type, the lit next step */
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-quiet: .62;
  --x-proposed-type-micro: .6875rem;
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* carried: sources disagree, a warning-tinted edge, never red */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  /* carried: pencil (reference desk), what a model or an agent wrote until a person accepts it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  /* carried: a visible repair (wear and time) */
  --x-proposed-seam: color-mix(in srgb, var(--info) 70%, var(--ink));
  --x-proposed-seam-wash: color-mix(in srgb, var(--info) 8%, transparent);
  /* NEW: standby, the lamp an agent lights when it holds before something it can't undo.
     Steady, never pulsing. Warm white, so it doesn't read as the Team floor's amber */
  --x-proposed-standby: color-mix(in srgb, var(--warning) 45%, var(--light));
  --x-proposed-standby-wash: color-mix(in srgb, var(--warning) 10%, transparent);
  /* NEW: the ceiling, what no agent does alone: a solid bar, never a hatch (hatch means "not yours to see") */
  --x-proposed-ceiling: color-mix(in srgb, var(--ink) 55%, transparent);
  /* NEW: the maker's mark, an agent's monogram, at text size */
  --x-proposed-mark-size: 1.375rem;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
h1,h2,h3,p{margin:0}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.lite{color:var(--light)}
.small{font-size:var(--type-small);line-height:var(--leading-small)}
.meta{font-size:var(--type-meta);line-height:var(--leading-meta)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.hints .on{color:var(--x-proposed-lit)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.title{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0}
.h{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);letter-spacing:var(--tracking-tight)}
.lead{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)}
.rule{height:1px;background:linear-gradient(90deg,var(--hairline-strong),transparent)}
.pane{background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);backdrop-filter:blur(var(--surface-blur))}
.inset{background:var(--surface-inset);border:1px solid var(--hairline);border-radius:var(--radius-inset)}

/* floors */
[data-tier="department"]{--fc:var(--floor-department-high);--fl:var(--floor-department-low)}
[data-tier="team"]{--fc:var(--floor-team-high);--fl:var(--floor-team-low)}
[data-tier="org"]{--fc:var(--floor-org-high);--fl:var(--floor-org-low)}
[data-tier="you"]{--fc:var(--floor-you-high);--fl:var(--floor-you-low)}
.fchip{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap}
.fchip::before{content:"";width:var(--space-4);height:2px;background:var(--fc);border-radius:1px}
.fword{color:var(--fc)}

/* two registers: ADR 0014 words one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* the maker's mark: an agent's monogram, dotted while its work is pencil, solid once a person accepts it */
.mm{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:var(--x-proposed-mark-size);height:var(--x-proposed-mark-size);padding:0 var(--space-1);border:1px dotted var(--x-proposed-pencil);border-radius:var(--radius-key);font:500 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink);background:var(--x-proposed-pencil-wash);vertical-align:1px}
.mm.ink{border-style:solid;border-color:var(--hairline-strong);background:none}
.mm.lg{--x-proposed-mark-size:2.25rem;font-size:var(--type-meta);border-radius:var(--radius-key)}
.who{display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap}

/* pencil and ink */
.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key)}
.pencil .pt,.pt.pen{font-style:italic;color:var(--ink)}
.pencil.inked{border-style:solid;border-color:var(--hairline-strong);background:none}
.pencil.inked .pt{font-style:normal}
.pen{font-style:italic}

/* the seam: a visible repair */
.seam{border-left:2px solid var(--x-proposed-seam);background:var(--x-proposed-seam-wash);padding:var(--space-1) var(--space-3)}
.struck{text-decoration:line-through;text-decoration-color:var(--x-proposed-seam);color:var(--ink-muted)}

/* standby lamp: steady, lit while an agent holds; out on go */
.lamp{display:inline-block;flex:none;width:var(--space-3);height:var(--space-3);border-radius:50%;border:1px solid var(--x-proposed-standby);background:transparent;vertical-align:-1px;transition:background var(--motion-base) var(--ease-standard),box-shadow var(--motion-base) var(--ease-standard)}
.lamp.on{background:var(--x-proposed-standby);box-shadow:0 0 var(--space-3) color-mix(in srgb,var(--x-proposed-standby) 60%,transparent)}
.lamp.go{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit);box-shadow:0 0 var(--space-3) color-mix(in srgb,var(--x-proposed-lit) 50%,transparent)}
.lamp.off{border-color:var(--hairline-strong)}

/* the ladder, at word size: four rungs, the cap drawn as a short bar above the highest rung it may reach */
.rungs{display:inline-flex;align-items:flex-end;gap:2px;height:var(--space-4);vertical-align:-3px;position:relative}
.rungs i{width:var(--space-2);border-radius:1px;background:var(--hairline-strong)}
.rungs i:nth-child(1){height:25%}.rungs i:nth-child(2){height:50%}.rungs i:nth-child(3){height:75%}.rungs i:nth-child(4){height:100%}
.rungs i.on{background:var(--ink)}
.rungs i.at{background:var(--light)}
.rungs i.capped{background:none;outline:1px dashed var(--hairline);outline-offset:-1px}
.lvl{display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);white-space:nowrap;transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard)}
.btn:hover{background:var(--surface-raised)}
.btn.sm{height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-3);font-size:var(--type-small)}
.btn.go{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.btn.hold{border-color:var(--x-proposed-standby);color:var(--light);background:var(--x-proposed-standby-wash)}
.btn[aria-disabled="true"]{opacity:var(--x-proposed-quiet);cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--surface-raised);border-color:var(--ink-muted);color:var(--light)}

/* marks for other ways to be */
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);white-space:nowrap}
.mk-disagree{display:inline-block;width:var(--space-4);height:var(--space-3);border-left:2px solid var(--x-proposed-disagree);border-right:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);flex:none;vertical-align:-1px}

/* app frame */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--slate-deep) 70%,transparent);min-width:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.crumb b{font-weight:400;color:var(--light)}
.crumb svg{opacity:var(--x-proposed-quiet);flex:none}
.top .hints{margin-left:auto;justify-content:flex-end}
.main{min-height:0;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));overflow:hidden}

/* the mode line (now, next, stops), from aviation's flight mode annunciator */
.mode{display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,1fr) auto;align-items:stretch;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small);min-width:0}
.mode > div{padding:var(--space-2) var(--space-3);border-left:1px solid var(--hairline);min-width:0}
.mode > div:first-child{border-left:0;display:flex;align-items:center;gap:var(--space-2)}
.mode .ml{display:block;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.mode .mv{display:block;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode .mv b{font-weight:500;color:var(--light)}
.mode .boxed{outline:1px solid var(--x-proposed-lit);outline-offset:-3px;border-radius:var(--radius-key)}
.mode.v{grid-template-columns:minmax(0,1fr)}
.mode.v > div{border-left:0;border-top:1px solid var(--hairline)}
.mode.v > div:first-child{border-top:0}
.mode.held .now .mv b{color:var(--x-proposed-standby)}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}
.x-cap{max-width:calc(100vw - 2 * var(--edge-tight))}

/* ---- V3: every state a piece of agent work can be in, the four paths through them, and the mark each state wears ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-3)}
.intro{display:flex;align-items:end;justify-content:space-between;gap:var(--space-5)}
.intro > p{max-width:var(--measure-read);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.paths{display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:var(--space-2);min-height:0}
.path{display:grid;grid-template-columns:minmax(150px,var(--measure-rail)) minmax(0,1fr);gap:var(--space-4);align-items:center;padding:var(--space-2) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);text-align:left;width:100%;transition:border-color var(--motion-base) var(--ease-standard)}
.path.hot{border-color:var(--hairline-strong);background:var(--surface-raised)}
.path h3{margin:0;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.path .k{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.flow{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.arrow{color:var(--ink-muted);flex:none;opacity:var(--x-proposed-quiet)}
.st{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline);background:var(--slate-deep);transition:box-shadow var(--motion-base) var(--ease-standard),border-color var(--motion-base) var(--ease-standard)}
.st b{font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.st .w{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.st .spec{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);min-height:var(--space-5)}
.st .who{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.st .who.p{color:var(--x-proposed-lit)}
.st.lit{border-color:var(--x-proposed-lit);box-shadow:0 0 0 1px var(--x-proposed-lit) inset}
.alts{flex:1.6 1 0;min-width:0;display:grid;gap:var(--space-1)}
.alts .st{flex:none;padding:var(--space-1) var(--space-3);flex-direction:row;align-items:center;gap:var(--space-3)}
.alts .st .w{flex:1;min-width:0}
.alts .st .spec{min-height:0;flex:none}
.pv{padding:0 var(--space-2);border-radius:var(--radius-key)}
.foot{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.foot span{display:inline-flex;align-items:center;gap:var(--space-2)}
@media (max-width:1400px){.st .w{display:none}.title{font-size:var(--type-heading);line-height:var(--leading-heading)}.intro > p{max-width:var(--measure-glance)}.path{grid-template-columns:var(--measure-drawer) minmax(0,1fr)}}
</style>

<script>
/* Sample data. Every name, label, count, date and floor below is deployment data:
   nothing in the markup or the scripts repeats any of it. One object for the whole run. */
const DATA = {
  org: 'Westmere Port Authority',
  me: 'p1',
  today: 'Mon 9 Nov', now: '09:04', awaySince: 'Fri 6 Nov, 17:10',
  /* floors, top first. reach = people who can read something kept on this floor */
  floors: {
    org:        { name: 'Westmere Port Authority', word: 'Org',        reach: 640 },

    p3: { name: 'Rhiannon Price', role: 'Harbourmaster',             floor: 'department' },

  /* the ladder of autonomy. Four rungs; no rung above 3: a person is always the master */
  ladder: [
    { n: 0, short: 'Shadow', name: 'Shadow',            guild: 'on trial',           alone: 'Nothing it does is kept. Its work is set beside what people did, to compare.',
      check: 'Nobody checks: nothing is kept', sv: 4, tech: 'shadow run · read grants only · outputs compared, then discarded' },
    { n: 1, short: 'Each time', name: 'Asks each time',    guild: 'apprentice',         alone: 'Reads and drafts. Each piece waits in pencil for a person.',
      check: 'A person accepts each piece', sv: 5, tech: 'one Triage proposal or Inbox checkpoint per piece' },
    { n: 2, short: 'Batch', name: 'Asks for the batch', guild: 'journeyman',        alone: 'Drafts a run’s work as one batch, in pencil.',
      check: 'A person checks a sample, then signs the batch', sv: 5, tech: 'one checkpoint per run · sample drawn by AUGUR, across kinds · batch accept records the sample' },
    { n: 3, short: 'Acts', name: 'Acts, then shows',  guild: 'trusted journeyman', alone: 'Does reversible work in its own area at once, marked as its work.',

  ],
  undoDays: 14,
  /* minutes a person spends: checking one piece one by one, checking one sample item, signing a batch */
  minutes: { each: 1, sample: 1.5, sign: .5 },

  permitWeeks: 12,
  /* Sheridan and Verplank's ten levels, and where each sits in AUGUR */

    { n: 3, w: 'Narrows the options', use: 'not used' },
    { n: 4, w: 'Suggests one', use: 'Shadow' },
    { n: 5, w: 'Does it if a person approves', use: 'Asks each time, Asks for the batch' },
    { n: 6, w: 'Does it unless a person vetoes in time', use: 'never: silence is not a yes' },
    { n: 7, w: 'Does it, then tells', use: 'Acts, then shows' },

    { n: 9, w: 'Tells only if it decides to', use: 'never' },
    { n: 10, w: 'Ignores the person', use: 'never' }
  ],
  /* what no agent does alone, at any rung. AUGUR's list, not a setting */
  ceiling: [
    { w: 'Delete, purge or withdraw anything',            why: 'it can’t be undone',            tech: 'DELETE, purge, withdraw' },
    { w: 'Publish, share or send what people will read',   why: 'it reaches other people',       tech: 'publish, share, mail relay' },
    { w: 'Tell anyone but its supervisor',                 why: 'it reaches other people',       tech: 'notify, inboxItem to others' },
    { w: 'Accept a proposal, its own or another agent’s',  why: 'a person signs every fact',     tech: 'Triage accept' },
    { w: 'Choose between sources that disagree',           why: 'that is a judgement',           tech: 'resolve dispute' },
    { w: 'Change an intent’s state, owner or deadline',    why: 'that is a commitment',          tech: 'Mandate intent write' },
    { w: 'Approve anything',                               why: 'approvals are people’s',        tech: 'approval decide' },
    { w: 'Change its own scope, level or grants',          why: 'trust is a person’s decision',  tech: 'grant write' },
    { w: 'Work on a floor it isn’t granted, or open restricted records', why: 'outside its scope', tech: 'workspace grant check' },
    { w: 'Act as a person',                                why: 'it always signs as itself',     tech: 'on-behalf-of tokens' }
  ],

  /* agents: each is an app (ADR 0014), working under a person */
  agents: {
    a1: { name: 'Survey reader', mark: 'SR', floor: 'team', supervisor: 'p1', deputy: 'p2',
      does: 'reads vessel survey reports as they arrive in Artifacts and proposes what they say to Data Atlas',
      level: 2, since: 'Wed 4 Nov', calls: { used: 212, limit: 500 }, schedule: 'each night at 22:00, and when a report arrives',

      now:  { w: 'Reading', what: 'Lloyd’s Register annual survey, MV Kittiwake', step: 'page 3 of 7', tech: 'run r-2291 · step extract 4 of 9' },
      next: [ { w: 'Propose', what: 'what it read, to Triage, as this morning’s batch', when: 'when the report is read' },
              { w: 'Stop', what: 'when no reports are left, or at 500 model calls', when: '' } ],
      app: 'survey-reader', manifest: 'agents.survey-reader',
      history: [ { d: '26 Oct', w: 'bound it', by: 'p1' }, { d: 'Wed 4 Nov', w: 'widened class survey details to rung 2', by: 'p1', why: 'Replay on October: 173 of 180 agree; the 7 are understood.' }, { d: 'Fri 6 Nov', w: 'narrowed Nordhavn Class to rung 1', by: 'p1', why: 'Read net tonnage as gross on 6 of 9 certificates.' } ] },
    a2: { name: 'Filing clerk', mark: 'FC', floor: 'team', supervisor: 'p2', deputy: 'p1',
      does: 'files incoming certificates into the Vessel surveys library and tags each with its vessel',
      level: 3, since: '12 Oct', calls: { used: 40, limit: 200 }, schedule: 'when a document arrives in Incoming',
      now:  { w: 'Holding', what: 'withdraw 3 superseded certificates', step: 'waits for Tom Okoye’s go', tech: 'run r-2290 · checkpoint standby' },
      next: [ { w: 'File', what: 'the next certificate that arrives', when: 'on arrival' } ],

function commonKeys(e, rerender, replay) {

const AG = 'a1', a = A(AG), sup = first(a.supervisor);
const S = { path: -1, step: -1 };
/* who moves each state on: the agent or a person. A person is green, because only a person makes work final */
const ag = `<span class="who">${a.name}</span>`, agOf = id => `<span class="who">${A(id).name}</span>`, pe = w => `<span class="who p">${w}</span>`;
const pen = t => `<span class="pencil pv pen">${t}</span>`, ink = t => `<span class="pencil inked pv">${t}</span>`;
const PATHS = () => [
  { h: 'Propose', k: `Rungs 1 and 2: details, links and new things for Data Atlas`, tech: 'Triage proposal · proposedBy agent · acceptedBy person',
    flow: [
      { b: 'Drafted', w: 'Read from a source, with its workings', who: ag, spec: `${mm(AG)} ${pen('3,412')}` },
      { b: rungWord(), w: 'One by one at rung 1; as a batch with a sample at rung 2', who: ag, spec: `${mm(AG)} ${pen('3,412')} <span class="muted">in Triage</span>` }],
    alts: [
      { b: 'Accepted', w: 'Becomes ink and keeps the mark', who: pe(sup), spec: `${mm(AG, true)} ${ink('3,412')}` },
      { b: 'Changed', w: 'Ink with the person’s value; the change is kept as feedback', who: pe(sup), spec: `${mm(AG, true)} ${ink('3,421')}` },
      { b: 'Rejected', w: 'Struck, with one reason from a fixed list', who: pe(sup), spec: `<span class="struck">3,412</span> <span class="muted">wrong value</span>` }] },
  { h: 'Act, then show', k: `Rung 3: reversible work in its own area, like filing`, tech: 'agent writes under its grants · undo window ' + DATA.undoDays + ' days · diary countersign',
    flow: [
      { b: 'Done', w: `Done at once, marked as its work, undo for ${DATA.undoDays} days`, who: agOf('a2'), spec: `${mm('a2')} ${pen('filed')}` },
      { b: 'In the diary', w: 'Listed with the day’s work; a sample is drawn to check', who: agOf('a2'), spec: `${I('notebook-pen', 14)} <span class="muted">sample 2 of 11</span>` }],
    alts: [
      { b: 'Countersigned', w: 'The day is signed; the work stays undoable until its window ends', who: pe(first(A('a2').supervisor)), spec: `${mm('a2', true)} ${ink('filed')}` },
      { b: 'Undone', w: 'Put back as it was, and the diary says who undid it and why', who: pe('anyone with the right'), spec: `${I('undo-2', 14)} <span class="muted">put back</span>` }] },
  { h: 'Stand by', k: `Any rung: what is on the ceiling list`, tech: 'checkpoint kind standby · Inbox item owned by the supervisor · never defaults to go',
    flow: [
      { b: 'Prepared', w: 'Does every reversible part first, and says so', who: agOf('a3'), spec: `${mm('a3')} ${pen('draft saved')}` },
      { b: 'Standing by', w: 'Holds with the exact consequence; the lamp is lit', who: agOf('a3'), spec: `<span class="lamp on"></span> <span class="muted">waits for a person</span>` }],
    alts: [
      { b: 'Go', w: 'A person says go; it does exactly what it showed', who: pe(first(A('a3').supervisor)), spec: `<span class="lamp go"></span> ${ink('published')}` },
      { b: 'Held', w: 'A person says not yet, or hands it on; nothing happens', who: pe('a person'), spec: `<span class="lamp on"></span> <span class="muted">held, handed on</span>` },
      { b: 'Lapsed', w: 'No answer by its time: it is not done. Silence is never a go', who: '<span class="who">nobody</span>', spec: `<span class="lamp off"></span> <span class="muted">not done</span>` }] },
  { h: 'Repair', k: `When accepted work turns out wrong`, tech: 'audit agent.repair · seam on the record · lot recall by rule and run',
    flow: [
      { b: 'Found wrong', w: 'Anyone who sees it can flag it; the finder is named', who: pe('anyone'), spec: `${mm(AG, true)} <span class="pencil inked pv">2,890</span> ${I('flag', 14)}` },
      { b: 'Recalled', w: 'Everything made the same way is pulled for checking', who: pe(sup), spec: `${I('layers', 14)} <span class="muted">9 made the same way</span>` }],
    alts: [
      { b: 'Repaired', w: 'The right value goes in with a seam: who, when, why', who: pe(sup), spec: `<span class="seam"><span class="struck">2,890</span> 5,140</span>` },
      { b: 'Rung reviewed', w: 'A person decides the rung for that kind of work, with a reason', who: pe(sup), spec: `${lvl(1, 2, false)} <span class="muted">Nordhavn only</span>` }] }
];
function rungWord() { return 'Waits'; }
function stHTML(s, i, j) { const lit = S.path === i && S.step === j; return `<div class="st ${lit ? 'lit' : ''}"><span class="who">${''}</span><b>${s.b}</b><span class="w">${s.w}</span><span class="spec">${s.spec}</span>${s.who ? `<span>${s.who}</span>` : ''}</div>`; }
function render() {
  $('#app').innerHTML = topHTML(['Admin', 'Agents', 'How agents work', 'A piece of work'], [['1–4', 'trace a path'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div class="intro"><div><p class="eyebrow">Every state a piece of agent work can be in</p><h1 class="title">The life of a piece of work</h1></div>
      <p>Four paths. The agent moves work only as far as pencil, a held lamp or a done-but-undoable act. Every move to something final is a person’s, named on the work.</p></div>
    <div class="paths">${PATHS().map((p, i) => `<button class="path dep ${S.path === i ? 'hot' : ''}" style="--i:${i}" data-p="${i}">
      <span><h3>${i + 1}. ${p.h}</h3><span class="k">${p.k}</span><span class="tk">${p.tech}</span></span>
      <span class="flow">${p.flow.map((s, j) => stHTML(s, i, j) + `<span class="arrow">${I('arrow-right', 16)}</span>`).join('')}
        <span class="alts">${p.alts.map((s, j) => stHTML(s, i, p.flow.length + j)).join('')}</span></span></button>`).join('')}</div>
    <div class="foot"><span>${mm(AG)} pencil: its work, not yet accepted</span><span>${mm(AG, true)} ink: accepted, keeps its mark</span><span><span class="lamp on"></span> standing by</span><span><span class="seam">seam</span> a visible repair</span><span><span class="who p">green</span> only a person</span></div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.path').forEach(b => b.onclick = () => trace(+b.dataset.p));
}
function trace(i) {
  clearLater(); S.path = i; S.step = 0; render();
  const n = PATHS()[i].flow.length + 1;
  for (let k = 1; k < n; k++) later(() => { S.step = k; render(); }, k * ms('--motion-calm'));
}
function replay() { clearLater(); S.path = -1; S.step = -1; settle(); render(); later(() => trace(0), MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (/^[1-4]$/.test(e.key)) trace(+e.key - 1);
});
replay();
</script>
</body>
</html>
