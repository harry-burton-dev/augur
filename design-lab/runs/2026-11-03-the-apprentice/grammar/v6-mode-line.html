<!doctype html>
<html lang="en-GB">
<head>

<title>Apprentice sheet · V6 · Now and next</title>

<style>
/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; listed as
   "needs token" in each notes.md. Carried marks first, then new.
   --------------------------------------------------------------- */
:root{
  /* carried: not yours to see (135 degree hatch), quiet, micro type, the lit next step */
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-quiet: .62;
  --x-proposed-type-micro: .6875rem;
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* carried: sources disagree, a warning-tinted edge, never red */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  /* carried: pencil (reference desk), what a model or an agent wrote until a person accepts it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  /* carried: a visible repair (wear and time) */
  --x-proposed-seam: color-mix(in srgb, var(--info) 70%, var(--ink));
  --x-proposed-seam-wash: color-mix(in srgb, var(--info) 8%, transparent);
  /* NEW: standby, the lamp an agent lights when it holds before something it can't undo.
     Steady, never pulsing. Warm white, so it doesn't read as the Team floor's amber */
  --x-proposed-standby: color-mix(in srgb, var(--warning) 45%, var(--light));
  --x-proposed-standby-wash: color-mix(in srgb, var(--warning) 10%, transparent);
  /* NEW: the ceiling, what no agent does alone: a solid bar, never a hatch (hatch means "not yours to see") */
  --x-proposed-ceiling: color-mix(in srgb, var(--ink) 55%, transparent);
  /* NEW: the maker's mark, an agent's monogram, at text size */
  --x-proposed-mark-size: 1.375rem;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
h1,h2,h3,p{margin:0}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.lite{color:var(--light)}
.small{font-size:var(--type-small);line-height:var(--leading-small)}
.meta{font-size:var(--type-meta);line-height:var(--leading-meta)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.hints .on{color:var(--x-proposed-lit)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.title{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0}
.h{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);letter-spacing:var(--tracking-tight)}
.lead{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)}
.rule{height:1px;background:linear-gradient(90deg,var(--hairline-strong),transparent)}
.pane{background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);backdrop-filter:blur(var(--surface-blur))}
.inset{background:var(--surface-inset);border:1px solid var(--hairline);border-radius:var(--radius-inset)}

/* floors */
[data-tier="department"]{--fc:var(--floor-department-high);--fl:var(--floor-department-low)}
[data-tier="team"]{--fc:var(--floor-team-high);--fl:var(--floor-team-low)}
[data-tier="org"]{--fc:var(--floor-org-high);--fl:var(--floor-org-low)}
[data-tier="you"]{--fc:var(--floor-you-high);--fl:var(--floor-you-low)}
.fchip{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap}
.fchip::before{content:"";width:var(--space-4);height:2px;background:var(--fc);border-radius:1px}
.fword{color:var(--fc)}

/* two registers: ADR 0014 words one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* the maker's mark: an agent's monogram, dotted while its work is pencil, solid once a person accepts it */
.mm{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:var(--x-proposed-mark-size);height:var(--x-proposed-mark-size);padding:0 var(--space-1);border:1px dotted var(--x-proposed-pencil);border-radius:var(--radius-key);font:500 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink);background:var(--x-proposed-pencil-wash);vertical-align:1px}
.mm.ink{border-style:solid;border-color:var(--hairline-strong);background:none}
.mm.lg{--x-proposed-mark-size:2.25rem;font-size:var(--type-meta);border-radius:var(--radius-key)}
.who{display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap}

/* pencil and ink */
.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key)}
.pencil .pt,.pt.pen{font-style:italic;color:var(--ink)}
.pencil.inked{border-style:solid;border-color:var(--hairline-strong);background:none}
.pencil.inked .pt{font-style:normal}
.pen{font-style:italic}

/* the seam: a visible repair */
.seam{border-left:2px solid var(--x-proposed-seam);background:var(--x-proposed-seam-wash);padding:var(--space-1) var(--space-3)}
.struck{text-decoration:line-through;text-decoration-color:var(--x-proposed-seam);color:var(--ink-muted)}

/* standby lamp: steady, lit while an agent holds; out on go */
.lamp{display:inline-block;flex:none;width:var(--space-3);height:var(--space-3);border-radius:50%;border:1px solid var(--x-proposed-standby);background:transparent;vertical-align:-1px;transition:background var(--motion-base) var(--ease-standard),box-shadow var(--motion-base) var(--ease-standard)}
.lamp.on{background:var(--x-proposed-standby);box-shadow:0 0 var(--space-3) color-mix(in srgb,var(--x-proposed-standby) 60%,transparent)}
.lamp.go{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit);box-shadow:0 0 var(--space-3) color-mix(in srgb,var(--x-proposed-lit) 50%,transparent)}
.lamp.off{border-color:var(--hairline-strong)}

/* the ladder, at word size: four rungs, the cap drawn as a short bar above the highest rung it may reach */
.rungs{display:inline-flex;align-items:flex-end;gap:2px;height:var(--space-4);vertical-align:-3px;position:relative}
.rungs i{width:var(--space-2);border-radius:1px;background:var(--hairline-strong)}
.rungs i:nth-child(1){height:25%}.rungs i:nth-child(2){height:50%}.rungs i:nth-child(3){height:75%}.rungs i:nth-child(4){height:100%}
.rungs i.on{background:var(--ink)}
.rungs i.at{background:var(--light)}
.rungs i.capped{background:none;outline:1px dashed var(--hairline);outline-offset:-1px}
.lvl{display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);white-space:nowrap;transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard)}
.btn:hover{background:var(--surface-raised)}
.btn.sm{height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-3);font-size:var(--type-small)}
.btn.go{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.btn.hold{border-color:var(--x-proposed-standby);color:var(--light);background:var(--x-proposed-standby-wash)}
.btn[aria-disabled="true"]{opacity:var(--x-proposed-quiet);cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--surface-raised);border-color:var(--ink-muted);color:var(--light)}

/* marks for other ways to be */
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);white-space:nowrap}
.mk-disagree{display:inline-block;width:var(--space-4);height:var(--space-3);border-left:2px solid var(--x-proposed-disagree);border-right:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);flex:none;vertical-align:-1px}

/* app frame */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--slate-deep) 70%,transparent);min-width:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.crumb b{font-weight:400;color:var(--light)}
.crumb svg{opacity:var(--x-proposed-quiet);flex:none}
.top .hints{margin-left:auto;justify-content:flex-end}
.main{min-height:0;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));overflow:hidden}

/* the mode line (now, next, stops), from aviation's flight mode annunciator */
.mode{display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,1fr) auto;align-items:stretch;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small);min-width:0}
.mode > div{padding:var(--space-2) var(--space-3);border-left:1px solid var(--hairline);min-width:0}
.mode > div:first-child{border-left:0;display:flex;align-items:center;gap:var(--space-2)}
.mode .ml{display:block;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.mode .mv{display:block;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode .mv b{font-weight:500;color:var(--light)}
.mode .boxed{outline:1px solid var(--x-proposed-lit);outline-offset:-3px;border-radius:var(--radius-key)}
.mode.v{grid-template-columns:minmax(0,1fr)}
.mode.v > div{border-left:0;border-top:1px solid var(--hairline)}
.mode.v > div:first-child{border-top:0}
.mode.held .now .mv b{color:var(--x-proposed-standby)}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}
.x-cap{max-width:calc(100vw - 2 * var(--edge-tight))}

/* ---- V6: the flight mode annunciator for an agent. Engaged, armed, limits, and a box round anything that just changed ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-4)}
.fma{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--slate-deep);overflow:hidden}
.fma > div{position:relative;padding:var(--space-3) var(--space-4);border-left:1px solid var(--hairline-strong);min-width:0}
.fma > div:first-child{border-left:0}
.fma .ml{display:block;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-bottom:var(--space-1)}
.fma .big{display:block;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.fma .armed{color:var(--info)}
.fma .held{color:var(--x-proposed-standby)}
.fma .stopped{color:var(--ink-muted)}
.fma .sm{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);margin-top:var(--space-1)}
.fma .sm.m{color:var(--ink-muted)}
.fma .box{position:absolute;inset:var(--space-1);border:1.5px solid var(--light);border-radius:var(--radius-key);pointer-events:none;opacity:0;transition:opacity var(--motion-quick) linear}
.fma .changed .box{opacity:1}
.why{display:flex;align-items:center;gap:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);min-height:var(--target-sm)}
.why b{font-weight:400;color:var(--light)}
.lower{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--space-6);min-height:0}
.tape{min-height:0;display:flex;flex-direction:column;gap:var(--space-1)}
.ev{display:grid;grid-template-columns:calc(var(--space-7) + var(--space-3)) var(--space-4) minmax(0,1fr);gap:var(--space-3);align-items:start;padding:var(--space-3);border-radius:var(--radius-key);text-align:left;width:100%;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ev .t{font-family:var(--font-mono)}
.ev b{display:block;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.ev.cur{background:var(--surface-raised);color:var(--ink)}
.ev.cur b{color:var(--light)}
.ev.future{opacity:var(--x-proposed-quiet)}
.q{display:grid;gap:var(--space-2);align-content:start}
.qa{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-4);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline)}
.qa i{font-style:italic;color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta)}
.qa span{font:400 var(--x-proposed-type-micro)/1.8 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.qa p{grid-column:1 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.fma .big{font-size:var(--type-lead);line-height:var(--leading-lead)}.qa p{display:none}}
</style>

<script>

function commonKeys(e, rerender, replay) {

const KIND_ICON = { batch: 'layers', held: 'hand', outside: 'fence', done: 'check', standby: 'circle-pause', disagree: 'split', limit: 'gauge' };

const AG = 'a1', a = A(AG);
/* a night of mode changes, from the diary. Each step sets the five cells; "ch" names the cells that changed */
const d = id => DATA.diary.find(x => x.id === id);
const STEPS = () => [
  { t: 'Sun 22:00', now: ['Reading', '', 'report 1 of 11, MV Gannet II'], next: ['Propose', 'tonight’s batch, when all 11 are read'], stop: [`${a.calls.limit} calls`, 'or no reports left'], used: 289, ch: ['now'], why: `Started on schedule: ${a.schedule}.` },
  { t: 'Sun 22:31', now: ['Reading', '', 'report 5 of 11 · 1 set aside for you'], next: ['Propose', 'tonight’s batch, without the one set aside'], stop: [`${a.calls.limit} calls`, 'or no reports left'], used: 402, ch: ['now', 'next'], why: `${d('d8').text}. ${d('d8').why[0].toUpperCase() + d('d8').why.slice(1)}, so it set it aside for ${first(a.supervisor)} and went on.` },
  { t: 'Sun 22:51', now: ['Stopped', 'stopped', `${d('d9').n} reports not read`], next: ['Read', `again at ${d('d9').resumed}`], stop: ['limit reached', `${a.calls.limit} of ${a.calls.limit} calls`], used: 500, ch: ['now', 'next', 'stop'], why: `${d('d9').text[0].toUpperCase() + d('d9').text.slice(1)}. ${d('d9').why[0].toUpperCase() + d('d9').why.slice(1)}.` },
  { t: 'Mon 00:00', now: ['Reading', '', `the ${d('d9').n} reports left`], next: ['Propose', 'them as one batch'], stop: [`${a.calls.limit} calls`, 'new day'], used: 0, ch: ['now', 'stop'], why: `The day’s calls reset at ${DATA.gateway.resets}, so it went back to what it couldn’t finish.` },
  { t: 'Mon 00:40', now: ['Waiting', '', `a batch of ${d('d10').n} for ${first(a.supervisor)}`], next: ['Read', 'the next report that arrives'], stop: [`${a.calls.limit} calls`, ''], used: 168, ch: ['now', 'next'], why: `Proposed ${d('d10').n} details as one batch. ${first(a.supervisor)} checks ${d('d10').sample} of them, then signs.` },
  { t: DATA.today.split(' ')[0] + ' ' + DATA.now, now: [a.now.w, '', a.now.what], next: [a.next[0].w, a.next[0].what], stop: [`${a.calls.limit} calls`, a.next[1].what], used: a.calls.used, ch: ['now'], why: `A report arrived at 08:58. It reads reports as they arrive.` }
];
const S = { i: 0, boxed: [] };
const G_STEP = () => ({ t: 'now', now: ['Paused', 'stopped', 'the model gateway is off'], next: ['Read', `when ${P(DATA.gateway.admin).name} turns it on`], stop: ['—', 'nothing is lost'], used: a.calls.used, ch: ['now', 'next'], why: `The model gateway is off for every app. ${P(DATA.gateway.admin).name}, ${P(DATA.gateway.admin).role.toLowerCase()}, can turn it on in Admin. Work already done stays as it is.` });
function cell(key, label, big, sm, cls = '', m = '') {
  return `<div class="${S.boxed.includes(key) ? 'changed' : ''}"><span class="ml">${label}</span><span class="big ${cls}">${big}</span><span class="sm ${m}">${sm}</span><span class="box"></span></div>`;
}
function render() {
  const st = STATE.gateway ? STEPS()[S.i] : G_STEP();
  $('#app').innerHTML = topHTML(['Data Atlas', 'Triage', a.name], [['← →', 'step the night'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="fma" aria-live="polite" aria-label="${a.name} mode line">
      ${cell('agent', 'Agent', `${a.name}`, `${mm(AG)} works under ${P(a.supervisor).name}`)}
      ${cell('now', 'Now', st.now[0], st.now[2], st.now[1])}
      ${cell('next', 'Next', st.next[0], st.next[1], 'armed')}
      ${cell('stop', 'Stops at', st.stop[0], st.stop[1], '', 'm')}
      ${cell('rung', 'Rung', lvl(a.level, 3, false) + ' ' + a.level, `${L(a.level).name} · <span class="num">${st.used} of ${a.calls.limit}</span> calls`)}
    </section>
    <p class="why">${I('message-square-quote', 16)}<span><b>Why it changed, at ${st.t}:</b> ${st.why}</span></p>
    <div class="lower">
      <div class="tape scroll" role="list" aria-label="The night, step by step"><p class="eyebrow" style="margin-bottom:var(--space-2)">The night, as the line showed it</p>
        ${STEPS().map((x, i) => `<button class="ev ${STATE.gateway && i === S.i ? 'cur' : ''} ${i > S.i ? 'future' : ''}" data-i="${i}" role="listitem"><span class="t">${x.t}</span>${I(/set aside/.test(x.now[2]) ? 'circle-pause' : x.now[1] === 'stopped' ? 'gauge' : x.now[0] === 'Waiting' ? 'layers' : 'book-open', 16)}<span><b>${x.now[0]}: ${x.now[2]}</b>then ${x.next[0].toLowerCase()} ${x.next[1]}</span></button>`).join('')}
      </div>
      <div class="q"><p class="eyebrow">Four questions people ask of automation, and the cell that answers each</p>
        ${[['What is it doing?', 'Now', 'Engaged mode, in words. “Holding” and “Stopped” are modes too, never blanks.'],
           ['What will it do next?', 'Next', 'Armed mode, in blue: what it will do when the current step ends, so nothing it does is a surprise.'],
           ['When will it stop?', 'Stops at', 'The limit that will stop it, from the gateway and its schedule.'],
           ['Why did it do that?', 'the box', 'A changed cell is boxed once, for a few seconds, with the reason under the line. Then the box goes: calm at rest.']]
          .map(([q, c, p]) => `<div class="qa"><i>${q}</i><span>${c}</span><p>${p}</p></div>`).join('')}
        <p class="tk">run status · next step (from the agent loop) · stop conditions (budget, schedule) · audit of each mode change</p>
      </div>
    </div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.ev').forEach(b => b.onclick = () => go(+b.dataset.i));
}
function go(i) {
  clearLater(); S.i = Math.max(0, Math.min(STEPS().length - 1, i)); S.boxed = (STATE.gateway ? STEPS()[S.i] : G_STEP()).ch; render();
  later(() => { S.boxed = []; render(); }, ms('--motion-hold'));
}
function replay() { clearLater(); S.i = 0; S.boxed = []; settle(); render(); later(() => go(1), MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, () => go(S.i), replay)) { markKeys(); return; }
  if (e.key === 'ArrowRight') go(S.i + 1); else if (e.key === 'ArrowLeft') go(S.i - 1);
});
replay();
</script>
</body>
</html>
