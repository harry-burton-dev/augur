<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Standby and go · V1 · The cue light</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: the stage manager's cue light. The agent lights a steady lamp; "standing by" answers it; only "go" puts it out ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,var(--measure-decision));gap:var(--space-6)}
.band{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-pill);background:var(--surface-inset);font-size:var(--type-small);color:var(--ink-muted);width:fit-content}
.band b{font-weight:400;color:var(--ink)}
.band .cue{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);color:var(--ink)}
.band .cue.on{border-color:var(--x-proposed-standby);color:var(--light)}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.notice{padding:var(--space-4) var(--space-5);max-width:var(--measure-read)}
.notice h2{margin:0 0 var(--space-2);font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);font-style:italic}
.notice p{font-style:italic;color:var(--ink);line-height:var(--leading-body)}
.notice .pos{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);margin-top:var(--space-3);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4);max-width:var(--measure-wide)}
.lists h3{margin:0 0 var(--space-2);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.lists li{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);margin-bottom:var(--space-2)}
.lists ul{margin:0;padding-left:var(--space-4)}
.lists li span{display:block;color:var(--ink-muted)}
.call{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.box{padding:var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);display:grid;gap:var(--space-3)}
.box.on{border-color:var(--x-proposed-standby)}
.box.go{border-color:var(--x-proposed-lit)}
.big{display:flex;align-items:center;gap:var(--space-3)}
.big .lamp{width:var(--space-5);height:var(--space-5)}
.big b{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.proto{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.proto i{font-style:normal;font-family:var(--font-mono);color:var(--ink)}
.proto .now{color:var(--light)}
.btns{display:flex;gap:var(--space-2);flex-wrap:wrap}
@media (max-width:1400px){.lists li span{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Standby and go · V1</b> the cue light: a steady lamp, "standing by" answers it, only "go" puts it out · stage management calling, cue lights</div>
<script>
/*@DATA@*/
/*@LIB@*/
const SB = DATA.standby, AG = SB.agent, a = A(AG); ME = SB.me;
const S = { st: 'off' }; /* off → on (standby called) → ack (standing by) → go | held */
const STEPS = [['off', 'Dark', 'Nothing waits. The lamp is off.'], ['on', 'Standby', `${a.name} lights the lamp: it is ready and holding.`], ['ack', 'Standing by', `${first(ME)} answers: I’m here, I’m reading it. Not a yes.`], ['go', 'Go', 'Only go puts the lamp out and lets it act.']];
function render() {
  const st = S.st, ir = SB.irreversible;
  $('#app').innerHTML = topHTML(['Mandate', 'Harbour log', SB.title], [['S', 'standing by'], ['G', 'go'], ['H', 'hold'], ['T', 'ADR words'], ['R', 'replay']], 'department') +
  `<main class="main"><div class="wrap">
    <section class="left">
      <div class="band">${I('waves', 14)} <b>${F('department').name}</b> · the shell’s band<span class="cue ${st === 'on' || st === 'ack' ? 'on' : ''}"><span class="lamp ${st === 'on' || st === 'ack' ? 'on' : st === 'go' ? 'go' : 'off'}"></span>${mm(AG)} ${st === 'off' ? 'no cue' : st === 'go' ? 'gone' : st === 'held' ? 'held' : 'standby'}</span></div>
      <div><p class="eyebrow">${mm(AG)} Drafted by ${a.name} at ${SB.raisedAt} · pencil until it goes</p></div>
      <article class="notice ${st === 'go' ? 'pencil inked' : 'pencil'}"><h2>${SB.title}: ${SB.subject}</h2><p>${SB.body}</p><div class="pos"><span>Charted</span><span>${SB.position.charted}</span><span>Reported</span><span>${SB.position.reported}</span></div></article>
      <div class="lists"><div><h3>Done already · can be undone</h3><ul>${SB.done.map(d => `<li>${d.w}</li>`).join('')}</ul></div>
        <div><h3>On go · can’t be undone</h3><ul>${ir.map(d => `<li>${d.w} <span>${fmt(d.reach)} ${d.ext ? 'addresses' : 'people'} · ${d.undoWord}</span><span class="tk">${d.tech}</span></li>`).join('')}</ul></div></div>
    </section>
    <aside class="call">
      <div class="box ${st === 'on' || st === 'ack' ? 'on' : st === 'go' ? 'go' : ''}">
        <div class="big"><span class="lamp ${st === 'on' || st === 'ack' ? 'on' : st === 'go' ? 'go' : 'off'}"></span><b>${st === 'off' ? 'No cue' : st === 'on' ? 'Standby' : st === 'ack' ? 'Standing by' : st === 'go' ? 'Gone' : 'Held'}</b></div>
        <p class="small">${st === 'off' ? 'Nothing is waiting for you.' : st === 'go' ? `${first(ME)} said go at ${DATA.now}. Published to ${fmt(ir[0].reach)} people and emailed ${fmt(ir[1].reach)}. Written in the diary.` : st === 'held' ? `Held by ${first(ME)}. Nothing was published. The draft stays; ${a.name} has moved on.` : `${a.name} holds before ${ir.length} steps that can’t be undone. Go by <b>${SB.goBy}</b> for ${SB.goByWhy}.`}</p>
        ${st === 'on' || st === 'ack' ? `<div class="btns">${st === 'on' ? `<button class="btn hold" data-s="ack">${I('hand', 14)} Standing by <span class="kbd">S</span></button>` : ''}<button class="btn go" data-s="go">${I('play', 14)} Go <span class="kbd">G</span></button><button class="btn" data-s="held">${I('pause', 14)} Hold <span class="kbd">H</span></button></div>` : ''}
      </div>
      <div class="proto">${STEPS.map(([k, w, d]) => `<i class="${k === st ? 'now' : ''}">${w}</i><span class="${k === st ? 'now' : ''}">${d}</span>`).join('')}</div>
      <p class="small muted">The lamp is steady, never blinking, and there is one per waiting standby. “Standing by” tells ${a.name} a person has it, so it stops asking anyone else; it is never a yes. A standby nobody answers lapses: it is not done.</p>
      <p class="tk">checkpoint kind standby · Inbox item (open) · standing by = Inbox item claimed · go = done · hold = declined · lapse = expired, not done</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('[data-s]').forEach(b => b.onclick = () => { S.st = b.dataset.s; render(); });
}
function replay() { clearLater(); S.st = 'off'; settle(); render(); later(() => { S.st = 'on'; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'r') return replay();
  if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); return markKeys(); }
  if (S.st === 'on' && k === 's') { S.st = 'ack'; render(); }
  else if ((S.st === 'on' || S.st === 'ack') && k === 'g') { S.st = 'go'; render(); }
  else if ((S.st === 'on' || S.st === 'ack') && k === 'h') { S.st = 'held'; render(); }
});
replay();
</script>
</body>
</html>
