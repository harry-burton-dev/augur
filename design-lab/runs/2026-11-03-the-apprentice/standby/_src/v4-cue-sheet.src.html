<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Standby and go · V4 · The cue sheet</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: the prompt book's cue sheet. Each step that can't be undone is its own numbered cue, in order, with its own standby and go ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
table{width:100%;border-collapse:separate;border-spacing:0 var(--space-2)}
th{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:0 var(--space-4)}
td{padding:var(--space-3) var(--space-4);background:var(--surface-inset);vertical-align:middle;font-size:var(--type-meta);line-height:var(--leading-meta)}
td:first-child{border-radius:var(--radius-inset) 0 0 var(--radius-inset)}
td:last-child{border-radius:0 var(--radius-inset) var(--radius-inset) 0}
td .q{font:200 var(--type-title-s)/1 var(--font-sans);color:var(--light)}
td b{font-weight:400;color:var(--light)}
td .s{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
td .n{font-family:var(--font-mono);color:var(--light)}
tr.cur td{background:var(--surface-raised)}
tr.done td{opacity:var(--x-proposed-quiet)}
tr.wait td{opacity:.8}
.st{display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap}
.foot{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.foot b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){td{padding:var(--space-2) var(--space-3)}td .s{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Standby and go · V4</b> the cue sheet: each step that can't be undone is its own cue, in order, with its own go · the prompt book, calling a show</div>
<script>
/*@DATA@*/
/*@LIB@*/
const SB = DATA.standby, AG = SB.agent, a = A(AG); ME = SB.me;
/* cues: the notice's two steps, in order; then the floor's other standby (another supervisor's, shown, not yours) */
const CUES = () => [
  ...SB.irreversible.map((d, i) => ({ q: i + 1, agent: AG, w: d.w, reach: d.reach, ext: d.ext, undo: d.undoWord, who: SB.me, goBy: SB.goBy, after: i ? 1 : 0, tech: d.tech })),
  ...SB.others.map((o, i) => ({ q: SB.irreversible.length + i + 1, agent: o.agent, w: o.w, reach: o.reach, undo: o.undoWord, who: o.waits, goBy: o.goBy, since: o.since }))
];
const S = { cur: 0, st: {} }; /* st[q] = on | go | held */
function stateOf(c) { return S.st[c.q] || (c.who !== ME ? 'theirs' : c.after && S.st[c.after] !== 'go' ? 'wait' : 'on'); }
function render() {
  const cs = CUES();
  $('#app').innerHTML = topHTML(['Inbox', 'Cue sheet'], [['↑ ↓', 'cue'], ['G', 'go'], ['H', 'hold'], ['R', 'replay'], ['T', 'ADR words']], 'department') +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">Standbys for ${P(ME).name} and the floors below · ${DATA.today}</p><h1 class="title">Cue sheet</h1></div>
    <div class="scroll"><table><thead><tr><th>Cue</th><th>Agent</th><th>On go</th><th>Reaches</th><th>Undo</th><th>Go by</th><th>Who says go</th><th>State</th></tr></thead>
      <tbody>${cs.map((c, i) => { const st = stateOf(c); return `<tr class="${S.cur === i ? 'cur' : ''} ${st === 'go' ? 'done' : ''} ${st === 'wait' || st === 'theirs' ? 'wait' : ''}" data-i="${i}">
        <td><span class="q">Q${c.q}</span></td><td>${mm(c.agent)} ${A(c.agent).name}</td><td><b>${c.w}</b><span class="s">${c.after ? `after Q${c.after} has gone` : c.since ? `standing by since ${c.since}` : `raised ${SB.raisedAt}`}</span><span class="tk">${c.tech || ''}</span></td>
        <td><span class="n">${fmt(c.reach)}</span> <span class="s">${c.ext ? 'outside addresses' : 'people'}</span></td><td>${c.undo}</td><td>${c.goBy ? `<span class="n">${c.goBy}</span>` : '<span class="muted">no deadline</span>'}</td><td>${P(c.who).name}</td>
        <td><span class="st"><span class="lamp ${st === 'on' ? 'on' : st === 'go' ? 'go' : st === 'theirs' ? 'on' : 'off'}"></span>${st === 'on' ? (S.cur === i ? `<button class="btn sm go" data-go="${c.q}">Go <span class="kbd">G</span></button><button class="btn sm" data-hold="${c.q}">Hold</button>` : 'standing by') : st === 'go' ? `gone ${DATA.now}` : st === 'held' ? 'held' : st === 'theirs' ? `${first(c.who)}’s` : `waits for Q${c.after}`}</span></td></tr>`; }).join('')}</tbody></table></div>
    <div class="foot"><span><b>One cue, one step that can’t be undone.</b> Publishing (which can be withdrawn) and emailing (which can’t) are two cues, so you can let the first go and hold the second.</span><span><b>No “go all”.</b> Cues are called one at a time, in order.</span><span>Another supervisor’s cue is shown, never yours to call.</span></div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('tr[data-i]').forEach(r => r.onclick = () => { S.cur = +r.dataset.i; render(); });
  $$('[data-go]').forEach(b => b.onclick = e => { e.stopPropagation(); go(+b.dataset.go); });
  $$('[data-hold]').forEach(b => b.onclick = e => { e.stopPropagation(); S.st[+b.dataset.hold] = 'held'; render(); });
}
function go(q) { S.st[q] = 'go'; const cs = CUES(); const nx = cs.findIndex(c => stateOf(c) === 'on'); if (nx >= 0) S.cur = nx; render(); }
function replay() { clearLater(); S.cur = 0; S.st = {}; settle(); render(); later(() => go(1), MOMENT() + ms('--motion-run')); }
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), cs = CUES(), c = cs[S.cur];
  if (k === 'r') return replay();
  if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); return; }
  if (e.key === 'ArrowDown') { S.cur = (S.cur + 1) % cs.length; render(); }
  if (e.key === 'ArrowUp') { S.cur = (S.cur - 1 + cs.length) % cs.length; render(); }
  if (k === 'g' && stateOf(c) === 'on') go(c.q);
  if (k === 'h' && stateOf(c) === 'on') { S.st[c.q] = 'held'; render(); }
});
replay();
</script>
</body>
</html>
