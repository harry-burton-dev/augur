<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Standby and go · V2 · In the Letterbox</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: a standby with a deadline is urgent, so it opens in the Letterbox (PDR-009). The bars carry what can't be undone and when it must go ---- */
.under{height:100%;padding:var(--space-4) var(--edge);display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-5);transition:filter var(--motion-slow) var(--ease-standard)}
.lb-on .under{filter:saturate(.4) blur(2px)}
.log{display:grid;gap:var(--space-1);align-content:start}
.log .r{display:grid;grid-template-columns:calc(var(--space-7)) minmax(0,1fr);gap:var(--space-3);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);font-size:var(--type-small);color:var(--ink)}
.log .r .t{font-family:var(--font-mono);color:var(--ink-muted)}
.bar{position:fixed;left:0;right:0;z-index:var(--layer-overlay);display:flex;align-items:center;gap:var(--space-5);padding:0 var(--space-7);color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta);transition:height var(--motion-slow) var(--ease-out)}
.bar.top{top:0;background:linear-gradient(var(--scrim),color-mix(in srgb,var(--scrim) 85%,transparent));border-bottom:1px solid var(--hairline)}
.bar.bot{bottom:0;background:linear-gradient(color-mix(in srgb,var(--scrim) 85%,transparent),var(--scrim));border-top:1px solid var(--hairline)}
.bar b{font-weight:400;color:var(--light)}
.bar .k{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.bar .it{display:flex;align-items:center;gap:var(--space-2)}
.frame{position:fixed;left:0;right:0;z-index:var(--layer-overlay);display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,var(--measure-card));gap:var(--space-6);align-items:center;padding:var(--space-4) var(--space-8);transition:opacity var(--motion-slow) var(--ease-out)}
.frame .head{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.frame h1{margin:0;font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.frame .notice{padding:var(--space-3) var(--space-4);font-style:italic;color:var(--ink);font-size:var(--type-body);line-height:var(--leading-body);max-width:var(--measure-read)}
.act{display:grid;gap:var(--space-3)}
.act .btns{display:flex;gap:var(--space-2);flex-wrap:wrap}
.act p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.off .bar,.off .frame{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){.bar{transition:none}}
@media (max-width:1400px){.frame{padding:var(--space-3) var(--space-6)}.bar{padding:0 var(--space-5);gap:var(--space-4);font-size:var(--type-small)}}
</style>
</head>
<body class="pre off">
<div class="app" id="app"></div>
<div class="x-cap"><b>Standby and go · V2</b> in the Letterbox: a standby with a deadline opens 2.39:1; the bars say what can't be undone and when · PDR-009, the cinematic urgent path</div>
<script>
/*@DATA@*/
/*@LIB@*/
const SB = DATA.standby, AG = SB.agent, a = A(AG); ME = SB.me;
const S = { open: false, st: 'on' };
function fit() {
  const ratio = parseFloat(css('--letterbox-ratio')), minBar = parseFloat(css('--letterbox')) / 100 * innerHeight;
  const fh = Math.min(innerWidth / ratio, innerHeight - minBar * 2), bh = (innerHeight - fh) / 2;
  $$('.bar').forEach(b => b.style.height = (S.open ? bh : 0) + 'px');
  const f = $('.frame'); if (f) { f.style.top = bh + 'px'; f.style.height = fh + 'px'; }
}
function render() {
  const ir = SB.irreversible;
  document.body.classList.toggle('off', !S.open); document.body.classList.toggle('lb-on', S.open);
  $('#app').innerHTML = topHTML(['Mandate', 'Harbour log'], [['G', 'go'], ['H', 'hold'], ['O', 'hand on'], ['T', 'ADR words'], ['R', 'replay']], 'department') +
  `<div class="under"><div class="log"><p class="eyebrow" style="margin-bottom:var(--space-2)">Harbour log · ${DATA.today}</p>
      ${SB.log.map(l => `<div class="r"><span class="t">${l.t}</span><span>${l.w}</span></div>`).join('')}
      <div class="r"><span class="t">08:52</span><span>${mm(AG)} ${a.name} drafted ${SB.title} and stands by for ${P(ME).name}.</span></div></div>
    <div>${modeHTML(AG, { v: true })}</div></div>
  <div class="bar top" role="status"><span class="k">Stands by</span>${ir.map(d => `<span class="it">${I(d.ext ? 'mail' : 'send', 16)} <span>${d.w.split(' ').slice(0, 3).join(' ')} · <b>${fmt(d.reach)}</b> ${d.ext ? 'addresses' : 'people'} · ${d.undoWord.split(':')[0]}</span></span>`).join('')}</div>
  <section class="frame" role="dialog" aria-label="${a.name} stands by: ${SB.title}">
    <div><div class="head"><span class="lamp ${S.st === 'go' ? 'go' : 'on'}"></span>${mm(AG)}<p class="eyebrow">${a.name} · works under ${P(ME).name} · raised ${SB.raisedAt}</p></div>
      <h1>${SB.title}</h1><p class="notice pencil ${S.st === 'go' ? 'inked' : ''}">${SB.body}</p></div>
    <div class="act">${S.st === 'go' ? `<p class="lite" style="font-size:var(--type-meta)">Gone at ${DATA.now}. The bars close; it is in ${a.name}’s diary.</p>` : S.st === 'handed' ? `<p class="lite" style="font-size:var(--type-meta)">Handed on to ${P(SB.deputy).name}. The lamp moves to her; you can still see it.</p>` : `
      <div class="btns"><button class="btn go" data-s="go">${I('play', 14)} Go <span class="kbd">G</span></button><button class="btn" data-s="held">${I('pause', 14)} Hold <span class="kbd">H</span></button><button class="btn" data-s="handed">${I('user-round', 14)} Hand on to ${first(SB.deputy)} <span class="kbd">O</span></button></div>
      <p>Everything it could do without you is done and can be undone. Go does exactly the two things in the bar above, nothing more.</p>`}
      <p class="tk">urgent = standby with goBy before the supervisor’s next look · PDR-009 Letterbox · Inbox item stays open until go, hold or lapse</p></div>
  </section>
  <div class="bar bot"><span class="k">Go by</span><span class="it">${I('clock', 16)} <b>${SB.goBy}</b> for ${SB.goByWhy}</span><span class="it">${I('hourglass', 16)} lapses at <b>${SB.expires}</b>: not done</span><span class="it">${I('user-round', 16)} deputy ${P(SB.deputy).name}</span></div>`;
  Icons.hydrate(document.body); markKeys(); fit();
  $$('[data-s]').forEach(b => b.onclick = () => act(b.dataset.s));
}
function act(s) { S.st = s; render(); later(() => { S.open = false; render(); }, s === 'held' ? ms('--motion-calm') : ms('--motion-still')); }
addEventListener('resize', fit);
function replay() { clearLater(); S.open = false; S.st = 'on'; settle(); render(); later(() => { S.open = true; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'r') return replay();
  if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); return; }
  if (!S.open || S.st !== 'on') return;
  if (k === 'g') act('go'); else if (k === 'h') act('held'); else if (k === 'o') act('handed');
});
replay();
</script>
</body>
</html>
