<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Standby and go · V5 · Silence is not a go</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: what happens if nobody answers. The standby's own clock: raised, go by, asks the deputy, lapses. It fails safe, like a signal returning to danger ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-5)}
.clock{position:relative;height:calc(var(--space-8) + var(--space-5));margin:0 calc(var(--measure-rail) / 2)}
.axis{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--hairline-strong)}
.lit{position:absolute;top:calc(50% - 1px);height:4px;background:var(--x-proposed-standby);border-radius:2px;transition:width var(--motion-run) var(--ease-out)}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:var(--space-1)}
.mk .dot{width:var(--space-4);height:var(--space-4);border-radius:50%;background:var(--slate-deep);border:2px solid var(--ink-muted)}
.mk .t{position:absolute;bottom:calc(100% + var(--space-2));font:400 var(--type-meta)/1 var(--font-mono);color:var(--light);white-space:nowrap}
.mk .w{position:absolute;top:calc(100% + var(--space-2));width:calc(var(--measure-rail) - var(--space-4));text-align:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.mk .w b{display:block;font-weight:400;color:var(--ink);font-size:var(--type-meta)}
.mk.past .dot{border-color:var(--x-proposed-standby);background:var(--x-proposed-standby)}
.mk.end .dot{border-color:var(--ink);border-radius:var(--radius-key)}
.now{position:absolute;top:0;bottom:0;border-left:1.5px solid var(--x-proposed-lit)}
.now span{position:absolute;bottom:0;left:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-lit)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);align-content:start;padding-top:var(--space-5)}
.col{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:grid;gap:var(--space-2);align-content:start}
.col h3{margin:0;font-weight:400;font-size:var(--type-meta);color:var(--light);display:flex;gap:var(--space-2);align-items:center}
.col b{font-weight:400;color:var(--ink)}
.col.safe{border-color:var(--x-proposed-lit)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Standby and go · V5</b> silence is not a go: the standby's own clock, a deputy asked, then it lapses, not done · fail-safe signalling, the inverted dead man's switch</div>
<script>
/*@DATA@*/
/*@LIB@*/
const SB = DATA.standby, AG = SB.agent, a = A(AG); ME = SB.me;
const hm = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const T0 = hm(SB.raisedAt), T1 = hm(SB.expires) + 20, X = t => (hm(t) - T0) / (T1 - T0) * 100;
/* the deputy is asked halfway between raised and go-by: a rule, not a choice */
const ASK = (() => { const m = Math.round((hm(SB.raisedAt) + hm(SB.goBy)) / 2); return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; })();
const MARKS = () => [
  { t: SB.raisedAt, b: 'Standby', w: `${a.name} lights the lamp for ${first(ME)}` },
  { t: ASK, b: 'Asks the deputy too', w: `${P(SB.deputy).name} sees it as well; either can say go` },
  { t: SB.goBy, b: 'Go by', w: SB.goByWhy },
  { t: SB.expires, b: 'Lapses', w: 'not done; the draft stays; it says so in the diary', end: true }
];
const S = { now: SB.raisedAt };
function render() {
  const n = hm(S.now);
  $('#app').innerHTML = topHTML(['Inbox', SB.title, 'If nobody answers'], [['← →', 'move the clock'], ['R', 'replay'], ['T', 'ADR words']], 'department') +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">${mm(AG)} ${a.name} · ${SB.title}</p><h1 class="title">Silence is not a go</h1></div>
    <div class="clock" role="img" aria-label="Raised ${SB.raisedAt}, deputy asked ${ASK}, go by ${SB.goBy}, lapses ${SB.expires}">
      <div class="axis"></div><div class="lit" style="left:0;width:${Math.min(100, X(S.now))}%"></div>
      ${MARKS().map(m => `<div class="mk ${hm(m.t) <= n ? 'past' : ''} ${m.end ? 'end' : ''}" style="left:${X(m.t)}%"><span class="t">${m.t}</span><span class="dot"></span><span class="w"><b>${m.b}</b>${m.w}</span></div>`).join('')}
      <div class="now" style="left:${X(S.now)}%"><span>now ${S.now}</span></div>
    </div>
    <div class="cols">
      <div class="col"><h3>${I('hand', 16)} If someone answers</h3><span><b>Go</b> does exactly what it showed. <b>Hold</b> stops it; the draft stays. <b>Hand on</b> passes the lamp to a named person; the clock keeps running.</span></div>
      <div class="col"><h3>${I('user-round', 16)} If ${first(ME)} doesn’t</h3><span>At <b>${ASK}</b>, halfway to the go-by time, ${P(SB.deputy).name} is asked as well. That is a rule set when the standby is raised, so nobody has to remember. Asking another person is the only thing the clock does by itself.</span></div>
      <div class="col safe"><h3>${I('octagon-pause', 16)} If nobody does</h3><span>At <b>${SB.expires}</b> it <b>lapses</b>: nothing is published or sent. The notice stays as a draft, the lamp goes out, and the diary says “lapsed, not done”. The cost is written now, while there is time: ${SB.goByWhy} goes without the notice; the harbour log entry stands.</span></div>
    </div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
const STEPS = () => [SB.raisedAt, ASK, SB.goBy, SB.expires];
function replay() { clearLater(); S.now = SB.raisedAt; settle(); render(); STEPS().slice(1).forEach((t, i) => later(() => { S.now = t; render(); }, MOMENT() + i * ms('--motion-calm'))); }
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), st = STEPS(), i = st.indexOf(S.now);
  if (k === 'r') return replay();
  if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); return; }
  if (e.key === 'ArrowRight' && i < st.length - 1) { S.now = st[i + 1]; render(); }
  if (e.key === 'ArrowLeft' && i > 0) { S.now = st[i - 1]; render(); }
});
replay();
</script>
</body>
</html>
