<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Standby and go · V6 · Time out</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: the surgical time out. The agent fills a short checklist in pencil; the person confirms each line in ink; go arms on the last ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-6)}
.split{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.part{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline)}
.part h3{margin:0 0 var(--space-2);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:center}
.part li{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);margin-bottom:var(--space-1)}
.part ul{margin:0;padding-left:var(--space-4)}
.part li span{color:var(--ink-muted);font-size:var(--type-small)}
.part.hard{border-color:var(--x-proposed-standby);background:var(--x-proposed-standby-wash)}
.to{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.to h2{margin:0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.ck{display:grid;grid-template-columns:var(--target-sm) minmax(0,1fr);gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);text-align:left;width:100%}
.ck .box{display:grid;place-items:center;width:var(--target-sm);height:var(--target-sm);border:1px dotted var(--x-proposed-pencil);border-radius:var(--radius-key);color:var(--x-proposed-lit)}
.ck.ok .box{border:1px solid var(--x-proposed-lit)}
.ck b{display:block;font-weight:400;font-size:var(--type-meta);color:var(--light)}
.ck .v{font-size:var(--type-small);line-height:var(--leading-small);font-style:italic;color:var(--ink)}
.ck.ok .v{font-style:normal}
.ck .by{font-size:var(--x-proposed-type-micro);color:var(--ink-muted);font-family:var(--font-mono)}
.ck:hover{background:var(--surface-raised)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Standby and go · V6</b> time out: the agent fills the checklist in pencil, the person confirms each line, go arms on the last · WHO surgical safety checklist</div>
<script>
/*@DATA@*/
/*@LIB@*/
const SB = DATA.standby, AG = SB.agent, a = A(AG); ME = SB.me;
const S = { ok: [] };
function render() {
  const all = S.ok.length === SB.checks.length;
  $('#app').innerHTML = topHTML(['Inbox', SB.title, 'Time out'], [['1–4', 'confirm a line'], ['Enter', 'go'], ['R', 'replay'], ['T', 'ADR words']], 'department') +
  `<main class="main"><div class="wrap">
    <section class="split"><p class="eyebrow">${mm(AG)} ${a.name} split the work in two</p><h1 class="title">Before go</h1>
      <div class="part"><h3>${I('check', 14)} Done already · can be undone</h3><ul>${SB.done.map(d => `<li>${d.w}</li>`).join('')}</ul></div>
      <div class="part hard"><h3><span class="lamp on"></span> On go · can’t be undone</h3><ul>${SB.irreversible.map(d => `<li>${d.w} <span>· ${fmt(d.reach)} ${d.ext ? 'addresses' : 'people'} · ${d.undoWord}</span></li>`).join('')}</ul></div>
      <p class="small muted">An agent does every reversible part of a job itself and stops at the first step it can’t take back. The standby is as small as it can be.</p>
    </section>
    <section class="to"><p class="eyebrow">Time out · ${SB.checks.length} lines · go by ${SB.goBy}</p><h2>Said out loud, before the cut</h2>
      ${SB.checks.map((c, i) => { const ok = S.ok.includes(i); return `<button class="ck dep ${ok ? 'ok' : ''}" style="--i:${i}" data-i="${i}"><span class="box">${ok ? I('check', 18) : `<span class="kbd">${i + 1}</span>`}</span><span><b>${c.w}</b><span class="v">${c.v}</span><br><span class="by">${ok ? `confirmed by ${first(ME)}` : `filled in by ${a.name}, in pencil`}</span></span></button>`; }).join('')}
      <div style="display:flex;gap:var(--space-2);margin-top:var(--space-2)"><button class="btn ${all ? 'go' : ''}" ${all ? '' : 'aria-disabled="true"'}>${I('play', 14)} Go <span class="kbd">Enter</span></button><button class="btn">${I('pause', 14)} Hold</button><button class="btn">${I('user-round', 14)} Hand on to ${first(SB.deputy)}</button></div>
      <p class="small muted">${all ? 'All four confirmed. Go is armed.' : `${SB.checks.length - S.ok.length} to confirm. The last line, “if it’s wrong”, is the one people skip: it is the undo plan for a thing that can’t be undone.`}</p>
      <p class="tk">standby.checks[] filled by the agent (pencil) · each confirmed by a person (ink) · go accepted only when all are confirmed</p>
    </section></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.ck').forEach(b => b.onclick = () => toggle(+b.dataset.i));
}
function toggle(i) { S.ok = S.ok.includes(i) ? S.ok.filter(x => x !== i) : [...S.ok, i]; render(); }
function replay() { clearLater(); S.ok = []; settle(); render(); [0, 1, 2].forEach(i => later(() => { S.ok = [...S.ok, i]; render(); }, MOMENT() + i * ms('--motion-slow'))); }
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'r') return replay();
  if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); return; }
  if (/^[1-4]$/.test(k)) toggle(+k - 1);
});
replay();
</script>
</body>
</html>
