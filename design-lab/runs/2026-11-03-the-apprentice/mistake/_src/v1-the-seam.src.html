<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>A mistake · V1 · The seam</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: the repair stays on the record as a seam: the wrong value struck, the right one in, and the whole chain named ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,var(--measure-card));gap:var(--space-6);max-width:calc(var(--measure-wide) + var(--measure-card) + var(--space-6));margin:0 auto}
.rec{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.rec h1{margin:0;font-weight:200;font-size:var(--type-title);line-height:var(--leading-title);color:var(--light)}
.f{display:grid;grid-template-columns:minmax(160px,var(--measure-rail)) minmax(0,1fr);gap:var(--space-4);align-items:start;padding:var(--space-2) var(--space-3);font-size:var(--type-body);line-height:var(--leading-body);border-bottom:1px solid var(--hairline)}
.f .k{font-size:var(--type-meta);color:var(--ink-muted)}
.f .src{font-size:var(--type-small);color:var(--ink-muted)}
.f.seamed{border-bottom:0}
.seamv{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap;transition:background var(--motion-calm) var(--ease-out)}
.seamv .new{font-size:var(--type-heading);color:var(--light)}
.thread{margin:var(--space-2) 0 0;display:grid;gap:0;border-left:2px solid var(--x-proposed-seam);padding-left:var(--space-4)}
.st{position:relative;display:grid;grid-template-columns:calc(var(--space-8) + var(--space-3)) minmax(0,1fr);gap:var(--space-3);padding:var(--space-1) 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:opacity var(--motion-calm) var(--ease-out)}
.st::before{content:"";position:absolute;left:calc(var(--space-4) * -1 - var(--space-1) - 1px);top:calc(var(--leading-small) / 2 - var(--space-1) / 2);width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--slate-deep);border:2px solid var(--x-proposed-seam)}
.st .t{font-family:var(--font-mono);color:var(--ink-muted)}
.st.wait{opacity:0}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding-top:var(--space-6)}
.box{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:grid;gap:var(--space-2)}
.box h3{margin:0;font-weight:400;font-size:var(--type-meta);color:var(--light)}
.box b{font-weight:400;color:var(--ink)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>A mistake · V1</b> the seam: the wrong value struck, the right one in, the whole chain named on the record · visible repair, kintsugi, errata</div>
<script>
/*@DATA@*/
/*@LIB@*/
const MK = DATA.mistake, f = MK.fact, AG = 'a1', a = A(AG), B = MK.batch;
const S = { n: 0 };
const THREAD = () => [
  { t: B.day, w: `${mm(AG, true)} ${a.name} read <span class="struck">${f.wrong}</span> from a Nordhavn Class certificate: ${f.what}.` },
  { t: B.day, w: `${P(B.signedBy).name} signed a batch of ${B.n}; the sample of ${B.sample} held ${B.nordhavnInSample} Nordhavn certificate, in the new layout.` },
  { t: MK.found.at, w: `${P(MK.found.who).name} flagged it: ${MK.found.how}` },
  { t: MK.repairedAt, w: `${P(a.supervisor).name} put in ${f.right}, from the same certificate’s GT column, and ${MK.siblings.filter(s => s.proposed !== s.right).length - 1} more like it (see the recall).` }
];
function render() {
  const e = DATA.mistake.siblings[0];
  $('#app').innerHTML = topHTML(['Data Atlas', 'Vessels', f.entity], [['R', 'replay'], ['T', 'ADR words'], ['G', 'gateway off']]) +
  `<main class="main"><div class="wrap">
    <section class="rec scroll"><div><p class="eyebrow">Vessel · kept on ${F('team').name}</p><h1>${f.entity}</h1></div>
      ${MK.record.slice(0, 1).map(r => `<div class="f"><span class="k">${r.k}</span><span>${r.v} <span class="src">${r.src}</span></span></div>`).join('')}
      <div class="f seamed"><span class="k">${f.k}</span><span><span class="seamv ${S.n ? 'seam' : ''}">${S.n ? `<span class="struck">${f.wrong}</span><span class="new">${f.right}</span>` : `<span class="new">${f.wrong}</span> ${mm(AG, true)}`}<span class="src">${S.n ? `repaired by ${first(a.supervisor)} · found by ${first(MK.found.who)}` : `accepted ${B.day}`}</span></span>
        ${S.n ? `<div class="thread">${THREAD().map((x, i) => `<div class="st ${i < S.n ? '' : 'wait'}"><span class="t">${x.t}</span><span>${x.w}</span></div>`).join('')}</div>` : ''}</span></div>
      ${MK.record.slice(1).map(r => `<div class="f"><span class="k">${r.k}</span><span>${r.v} <span class="src">${r.src}</span></span></div>`).join('')}
      <p class="small muted" style="margin-top:var(--space-3)">The seam stays for good. Anyone who reads ${f.entity}’s tonnage sees it was once wrong, who made it, who found it, and who fixed it. It is never edited away.</p>
      <p class="tk">detail.history: proposed (agent, run, batch) → accepted (person, sample) → disputed (person) → repaired (person, reason) · audit agent.repair</p>
    </section>
    <aside class="side">
      <div class="box"><h3>Who did what</h3><span>${mm(AG, true)} <b>${a.name}</b> made it. <b>${P(B.signedBy).name}</b> accepted it in a batch. <b>${P(MK.found.who).name}</b> found it. <b>${P(a.supervisor).name}</b> repaired it.</span><span>Nobody is blamed on the record: it says what happened, in order.</span></div>
      <div class="box"><h3>Why it made sense to the agent</h3><span>${MK.why}</span></div>
      <div class="box"><h3>Made the same way</h3><span><b>${MK.siblings.length}</b> tonnages from Nordhavn Class certificates since ${MK.lot.since}. <b>${MK.siblings.filter(s => s.proposed !== s.right).length}</b> were wrong; each has its own seam.</span></div>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.n = 0; settle(); render(); [1, 2, 3, 4].forEach(k => later(() => { S.n = k; render(); }, MOMENT() + (k - 1) * ms('--motion-slow'))); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) markKeys(); });
replay();
</script>
</body>
</html>
