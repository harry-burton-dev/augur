<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>A mistake · V3 · The review</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: a short blameless review. What happened, why it made sense, what caught it, why the checks didn't, what changes ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,var(--measure-card));gap:var(--space-6);max-width:calc(var(--measure-wide) + var(--measure-card) + var(--space-6));margin:0 auto}
.form{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.q{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr);gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--hairline)}
.q .n{font:200 var(--type-title-s)/1 var(--font-sans);color:var(--light)}
.q h3{margin:0 0 var(--space-1);font-weight:400;font-size:var(--type-meta);color:var(--light)}
.q p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.q p + p{margin-top:var(--space-1)}
.q .ink{color:var(--ink)}
.q .pen{color:var(--ink)}
.q .by{display:block;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted);margin-top:var(--space-1)}
.chg{display:grid;gap:var(--space-1);margin-top:var(--space-1)}
.chg label{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.chg input{accent-color:var(--green);margin-top:var(--space-1)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding-top:var(--space-7)}
.box{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:grid;gap:var(--space-2)}
.box h3{margin:0;font-weight:400;font-size:var(--type-meta);color:var(--light)}
.box b{font-weight:400;color:var(--ink)}
.q.hot{background:linear-gradient(90deg,var(--x-proposed-lit-wash),transparent 60%)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>A mistake · V3</b> the review: what happened, why it made sense, what caught it, why the checks didn't, what changes · just culture, M&amp;M, CHIRP</div>
<script>
/*@DATA@*/
/*@LIB@*/
const MK = DATA.mistake, f = MK.fact, AG = 'a1', a = A(AG), B = MK.batch, wrong = MK.siblings.filter(s => s.proposed !== s.right).length;
const S = { hot: -1 };
const QS = () => [
  { h: 'What happened', p: [`${a.name} proposed ${f.k.toLowerCase()} ${f.wrong} for ${f.entity}: ${f.what}. ${wrong} of ${MK.siblings.length} Nordhavn Class tonnages since ${MK.lot.since} were wrong the same way.`], by: 'counted from the recall' },
  { h: 'Why it made sense', p: [MK.why], by: `from ${a.name}’s workings for each of the ${MK.siblings.length}` },
  { h: 'What caught it', p: [`${P(MK.found.who).name}, ${MK.found.at}. ${MK.found.how}`], by: 'from the flag' },
  { h: 'Why the checks didn’t', p: [`The batch on ${B.day} was ${B.n} details with a sample of ${B.sample}. The sample held ${B.nordhavnInSample} Nordhavn certificate, in the new layout, so it passed.`, `Read twice didn’t help: the pattern reader also took the first number under “NT | GT”. Two readers with the same wrong idea agree.`], by: 'from the batch and both readings' },
  { h: 'What changes', p: [], by: `${P(a.supervisor).name} decides; ticked items are the record`, changes: [
    ['Draw the sample across issuers and their layouts, not across issuers alone', true],
    ['Teach the pattern reader the column headings, not the column order', true],
    [`Narrow ${MK.lot.rule} to “asks each time” (see the scope review)`, true],
    ['Retrain or replace the model', false]] }
];
function render() {
  $('#app').innerHTML = topHTML(['Admin', 'Agents', a.name, 'Review of Fri 6 Nov'], [['↑ ↓', 'question'], ['R', 'replay'], ['T', 'ADR words']]) +
  `<main class="main"><div class="wrap">
    <section class="form scroll"><div><p class="eyebrow">${mm(AG)} Review · written ${MK.narrowedAt} · open to everyone it touched</p><h1 class="title">What we learned</h1></div>
      ${QS().map((q, i) => `<div class="q dep ${S.hot === i ? 'hot' : ''}" style="--i:${i}"><span class="n">${i + 1}</span><div><h3>${q.h}</h3>${q.p.map(t => `<p>${t}</p>`).join('')}${q.changes ? `<div class="chg">${q.changes.map(([w, on]) => `<label><input type="checkbox" ${on ? 'checked' : ''}> ${w}</label>`).join('')}</div>` : ''}<span class="by">${q.by}</span></div></div>`).join('')}
    </section>
    <aside class="side">
      <div class="box"><h3>No one is blamed</h3><span>Not ${a.name}: it did what its method said. Not <b>${P(B.signedBy).name}</b>: the sample signed was the one AUGUR drew. The review is about the method and the checks.</span></div>
      <div class="box"><h3>Who sees it</h3><span>${P(MK.found.who).name}, who found it; the owners of the ${MK.used.filter(u => !u.dup).length} places the wrong numbers were used; anyone who opens a seam on the ${wrong} vessels.</span></div>
      <div class="box"><h3>Written by template</h3><span>Questions 1 to 4 are counted and quoted from the records, never written by the model. Question 5 is a person’s.</span></div>
      <p class="tk">review = audit query over the lot + the batch + both readings · changes become grant and sampling settings</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
}
function replay() { clearLater(); S.hot = -1; settle(); render(); later(() => { S.hot = 3; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === 'ArrowDown') { S.hot = (S.hot + 1) % QS().length; render(); }
  if (e.key === 'ArrowUp') { S.hot = (S.hot - 1 + QS().length) % QS().length; render(); }
});
replay();
</script>
</body>
</html>
