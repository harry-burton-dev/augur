<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>While you were away · V1 · The site diary</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: the clerk of works' diary. One ruled page per day, the same headings every day, a countersign box at the foot ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3)}
.head{display:flex;align-items:end;justify-content:space-between;gap:var(--space-5)}
.head > div{flex:1 1 auto;min-width:0}
.head > p{flex:0 1 var(--measure-read);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);max-width:var(--measure-read)}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3);min-height:0}
.day{display:grid;grid-template-rows:auto minmax(0,1fr) auto;border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);min-height:0;overflow:hidden}
.day header{display:flex;justify-content:space-between;align-items:baseline;padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--hairline-strong)}
.day header h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);margin:0}
.day header span{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.body{padding:var(--space-2) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.sec .sh{font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid var(--hairline);margin-bottom:var(--space-1);display:flex;justify-content:space-between}
.ln{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);padding:2px 0}
.ln .why{display:block;color:var(--ink-muted)}
.ln .n{font-family:var(--font-mono);color:var(--light)}
.ln.none{color:var(--ink-muted);font-style:italic}
.sign{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4);border-top:1px dashed var(--hairline-strong);min-height:var(--target-md)}
.sign .s{flex:1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.sign .s b{display:block;font-weight:400;font-style:italic;color:var(--light);font-size:var(--type-meta)}
.day.signed .sign{border-top-style:solid}
.day.open{border-color:var(--x-proposed-lit)}
.summary{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.summary span{display:inline-flex;gap:var(--space-2);align-items:center}
.summary b{font-weight:400;color:var(--light);font-family:var(--font-mono)}
@media (max-width:1400px){.ln .why{display:none}.head > p{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>While you were away · V1</b> the site diary: a ruled page a day, same headings, countersigned · clerk of works' site diary, ship's deck log</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { signed: {}, open: null };
const DAYS = ['Fri', 'Sat', 'Sun', 'Mon'];
const sections = [
  { h: 'Done', kinds: ['done'], none: 'Nothing done alone' },
  { h: 'Waiting for you', kinds: ['batch', 'held', 'disagree'], none: 'Nothing waiting' },
  { h: 'Stood by', kinds: ['standby'], none: 'Nothing held before an irreversible step' },
  { h: 'Couldn’t do', kinds: ['limit', 'outside'], none: 'Nothing it couldn’t do' }
];
function line(d) {
  const hasN = /\d/.test(d.text) || /^(a |an |MV )/.test(d.text);
  return `<div class="ln">${mm(d.agent)}<span><span class="muted">${d.t.split(' ')[1]}</span> ${d.kind === 'batch' ? `<span class="n">${d.n}</span> ${d.text}, check ${d.sample}` : hasN ? d.text : `<span class="n">${d.n}</span> ${d.text}`}${d.why ? `<span class="why">${d.why}${d.ask ? ` · ask ${P(d.ask).name}` : ''}${d.waits ? ` · waits for ${P(d.waits).name}` : ''}${d.undoUntil ? ` · undo until ${d.undoUntil}` : ''}${d.resumed ? ` · resumed ${d.resumed}` : ''}</span>` : ''}<span class="tk">${d.run} · ${d.tech}</span></span></div>`;
}
function dayHTML(day, i) {
  const es = DATA.diary.filter(d => d.day === day);
  const calls = day === 'Sun' ? `${A('a1').calls.limit} of ${A('a1').calls.limit} calls` : day === 'Mon' ? `${A('a1').calls.used} calls so far` : 'within limits';
  const signed = S.signed[day], isOpen = day === DATA.today.split(' ')[0];
  return `<section class="day dep ${signed ? 'signed' : ''} ${S.open === day ? 'open' : ''}" style="--i:${i}">
    <header><h2>${day}</h2><span>${STATE.gateway ? 'gateway on' : 'gateway off'} · ${calls}</span></header>
    <div class="body scroll">${sections.map(s => { const xs = es.filter(e => s.kinds.includes(e.kind)); return `<div class="sec"><div class="sh"><span>${s.h}</span><span>${xs.length ? sum(xs, x => x.n) : '—'}</span></div>${xs.length ? xs.map(line).join('') : `<div class="ln none"><span></span><span>${s.none}</span></div>`}</div>`; }).join('')}</div>
    <div class="sign">${I('signature', 18)}<span class="s">${signed ? `<b>${P(DATA.me).name}</b>checked ${signed}` : isOpen ? 'Still running · can be signed tonight' : 'Not yet signed'}</span>${!signed && !isOpen ? `<button class="btn sm" data-sign="${day}">I’ve read ${day}</button>` : ''}</div>
  </section>`;
}
function render() {
  const a1 = A('a1');
  $('#app').innerHTML = topHTML(['Home', 'Agents on ' + F('team').name, 'Diary'], [['S', 'sign the oldest'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div class="head"><div><p class="eyebrow">While you were away · ${DATA.awaySince} to ${DATA.today}, ${DATA.now}</p><h1 class="title">Site diary</h1></div>
      <p>Two agents worked on ${F('team').name}. Each day has the same four headings, in the same order, whether or not anything happened under them. A day is closed when someone has checked it.</p></div>
    <div class="summary dep" style="--i:0"><span>${I('layers', 16)}<b>${D.n('batch')}</b> details in ${D.of('batch').length} batches, check ${sum(D.of('batch'), d => d.sample)}</span><span>${I('hand', 16)}<b>${D.n('held') + D.n('disagree')}</b> one by one</span><span>${I('circle-pause', 16)}<b>${D.n('standby')}</b> standing by for ${P(D.of('standby')[0].waits).name}</span><span>${I('check', 16)}<b>${D.n('done')}</b> done, can be undone</span><span>${I('gauge', 16)}<b>${D.n('limit') + D.n('outside')}</b> couldn’t do</span></div>
    <div class="days">${DAYS.map(dayHTML).join('')}</div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('[data-sign]').forEach(b => b.onclick = () => sign(b.dataset.sign));
}
function sign(day) { S.signed[day] = `${DATA.today}, ${DATA.now}`; S.open = DAYS.find(d => !S.signed[d] && d !== DATA.today.split(' ')[0]) || null; render(); }
function replay() {
  clearLater(); S.signed = {}; S.open = null; settle(); render();
  /* the moment: the oldest unsigned day is lit as the place to start */
  later(() => { S.open = 'Fri'; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key.toLowerCase() === 's') { const d = DAYS.find(d => !S.signed[d] && d !== DATA.today.split(' ')[0]); if (d) sign(d); }
});
replay();
</script>
</body>
</html>
