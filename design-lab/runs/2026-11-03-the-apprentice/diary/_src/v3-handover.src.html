<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>While you were away · V3 · The handover</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: the agent hands over like a nurse at the end of a shift. SBAR in ink, the recommendation in pencil, then a read-back ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,var(--measure-card));gap:var(--space-6);max-width:calc(var(--measure-wide) + var(--measure-card) + var(--space-6));margin:0 auto}
.card{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.who{display:flex;align-items:center;gap:var(--space-3)}
.sbar{display:grid;gap:var(--space-2)}
.blk{display:grid;grid-template-columns:calc(var(--space-7) + var(--space-4)) minmax(0,1fr);gap:var(--space-4);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);transition:opacity var(--motion-calm) var(--ease-out)}
.blk.wait{opacity:0}
.blk .L{font:200 var(--type-title-s)/1 var(--font-sans);color:var(--light)}
.blk .L span{display:block;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-top:var(--space-1)}
.blk p{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink)}
.blk p + p{margin-top:var(--space-1)}
.blk b{font-weight:400;color:var(--light);font-family:var(--font-mono)}
.blk.rec{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash)}
.blk.rec ol{margin:0;padding-left:var(--space-4);font-style:italic;font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink)}
.blk.rec .pl{font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted);margin-bottom:var(--space-1);display:flex;gap:var(--space-2);align-items:center}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding-top:var(--space-7)}
.rb{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset)}
.rb h3{margin:0 0 var(--space-2);font-weight:400;font-size:var(--type-meta);color:var(--light)}
.rb ul{list-style:none;margin:0 0 var(--space-3);padding:0;display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small)}
.rb li{display:flex;gap:var(--space-2);align-items:baseline}
.rb li b{font-weight:400;font-family:var(--font-mono);color:var(--light)}
.rb.done{border-color:var(--x-proposed-lit)}
.rb .ok{display:flex;gap:var(--space-2);align-items:center;color:var(--x-proposed-lit);font-size:var(--type-small)}
.side .note{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.side{padding-top:0}.blk p,.blk.rec ol{font-size:var(--type-meta);line-height:var(--leading-meta)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>While you were away · V3</b> the handover: situation, background, assessment in ink; recommendation in pencil; then a read-back · SBAR, I-PASS</div>
<script>
/*@DATA@*/
/*@LIB@*/
const AG = 'a1', a = A(AG), sup = P(a.supervisor);
const S = { shown: 0, read: false };
const d = id => DATA.diary.find(x => x.id === id);
const waitN = D.n('batch', AG) + D.n('held', AG) + D.n('disagree', AG);
function render() {
  const g = STATE.gateway;
  $('#app').innerHTML = topHTML(['Home', a.name, 'Handover'], [['Space', 'read back'], ...STD]) +
  `<main class="main"><div class="wrap">
    <section class="card">
      <div class="who">${mm(AG, false, true)}<div><p class="eyebrow">Handover · ${DATA.awaySince} to ${DATA.today}, ${DATA.now}</p><h1 class="title">${a.name} to ${first(a.supervisor)}</h1></div></div>
      <div class="sbar">
        <div class="blk ${S.shown > 0 ? '' : 'wait'}"><span class="L">S<span>Situation</span></span><div>
          <p><b>${waitN}</b> details wait for you: <b>${D.n('batch', AG)}</b> in <b>${D.of('batch', AG).length}</b> batches (check <b>${sum(D.of('batch', AG), x => x.sample)}</b>), <b>${D.n('held', AG)}</b> one by one, <b>${D.n('disagree', AG)}</b> where sources disagree.</p>
          <p>It is ${a.now.w.toLowerCase()} ${a.now.what}, ${a.now.step}. Next it will ${a.next[0].w.toLowerCase()} ${a.next[0].what}.</p><p class="tk">${a.now.tech}</p></div></div>
        <div class="blk ${S.shown > 1 ? '' : 'wait'}"><span class="L">B<span>Background</span></span><div>
          <p>It read <b>${D.reports(AG)}</b> reports in ${new Set(DATA.diary.filter(x => x.agent === AG).map(x => x.run)).size} runs. Class survey details are at rung ${K('k1').level}, ${L(K('k1').level).name.toLowerCase()}, since ${a.since}. Nordhavn Class details went back to rung ${K('k2').level} on Friday after the tonnage mistake.</p></div></div>
        <div class="blk ${S.shown > 2 ? '' : 'wait'}"><span class="L">A<span>Assessment</span></span><div>
          <p>Within its orders, with two exceptions: <b>${d('d9').n}</b> reports waited overnight because it reached <b>${a.calls.limit}</b> model calls on Sunday, and <b>${d('d3').n}</b> survey was outside its scope (${d('d3').text}; ask ${P(d('d3').ask).name}).</p>
          <p>Nothing on the floor has a deadline before ${DATA.today}. One standby is not its own: ${A(d('d7').agent).name} waits for ${P(d('d7').waits).name}.</p></div></div>
        <div class="blk rec ${S.shown > 3 ? '' : 'wait'}"><span class="L">R<span>Recommends</span></span><div>
          ${g ? `<p class="pl">${I('pencil', 12)} Drafted by ${a.name}: an order to work in, not a decision</p>
          <ol>${DATA.handoverRec.map(r => `<li>${r.w}</li>`).join('')}</ol>`
          : `<p class="pl">${I('file-text', 12)} Model gateway is off · the order from the template: oldest first</p><ol><li>${D.of('batch', AG).map(x => `${x.day}’s batch`).join(', then ')}.</li><li>Then the ${D.n('held', AG) + D.n('disagree', AG)} one by one, oldest first.</li></ol>`}
          <p class="tk">recommendation: askModel × 1 over the diary · every item points at a diary line</p></div></div>
      </div>
    </section>
    <aside class="side">
      <div class="rb ${S.read ? 'done' : ''}"><h3>Read back</h3>
        <ul><li>${I('layers', 14)} <span><b>${D.n('batch', AG)}</b> in batches, check ${sum(D.of('batch', AG), x => x.sample)}</span></li><li>${I('hand', 14)} <span><b>${D.n('held', AG) + D.n('disagree', AG)}</b> one by one</span></li><li>${I('fence', 14)} <span><b>${d('d3').n}</b> for ${P(d('d3').ask).name}</span></li><li>${I('circle-pause', 14)} <span>${A(d('d7').agent).name}’s standby is ${first(d('d7').waits)}’s</span></li></ul>
        ${S.read ? `<p class="ok">${I('check', 14)} ${sup.name} has the handover, ${DATA.now}. Kept in the diary.</p>` : `<button class="btn go" data-read>${I('check', 14)} I have it <span class="kbd">Space</span></button>`}
      </div>
      <p class="note">In SBAR the receiver says back what matters. Here the read-back is four counted lines, not free text; accepting the handover doesn’t accept any of the work.</p>
      <p class="note">The recommendation is the only pencil on the page. It orders the work; it never decides it. With the gateway off (G) it falls back to oldest first.</p>
    </aside></div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $('[data-read]') && ($('[data-read]').onclick = () => { S.read = true; render(); });
}
function replay() {
  clearLater(); S.shown = 0; S.read = false; settle(); render();
  /* the moment: the handover is given in its order, S, B, A, R */
  [0, 1, 2, 3].forEach(i => later(() => { S.shown = i + 1; render(); }, MOMENT() * .5 + i * ms('--motion-slow')));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === ' ') { e.preventDefault(); clearLater(); S.shown = 4; S.read = true; render(); }
});
replay();
</script>
</body>
</html>
