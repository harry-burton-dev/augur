<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>While you were away · V4 · One time scale</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: the absence on one time scale. A lane per agent, runs as bands, marks where it did or held something, a now line and what is armed next ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.chart{position:relative;min-height:0;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);padding:var(--space-5) var(--space-5) var(--space-4) calc(var(--measure-rail) * .7)}
.axis{position:absolute;left:calc(var(--measure-rail) * .7);right:var(--space-5);top:var(--space-2);height:calc(100% - var(--space-2) * 2)}
.night{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--shade) 22%,transparent);border-radius:var(--radius-key)}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--hairline)}
.tick span{position:absolute;top:0;left:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.nowl{position:absolute;top:0;bottom:0;border-left:1.5px solid var(--x-proposed-lit)}
.nowl span{position:absolute;bottom:0;left:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--x-proposed-lit);white-space:nowrap}
.lanes{position:relative;height:100%;display:grid;grid-template-rows:repeat(2,minmax(0,1fr));gap:var(--space-4);padding-top:var(--space-5)}
.lane{position:relative}
.lane .nm{position:absolute;right:calc(100% + var(--space-4));top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:var(--space-2);white-space:nowrap;font-size:var(--type-meta)}
.lane .nm .muted{display:block;font-size:var(--type-small)}
.lane .base{position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--hairline)}
.band{position:absolute;top:calc(50% - var(--space-2));height:var(--space-4);border-radius:var(--space-1);background:color-mix(in srgb,var(--ink) 18%,transparent);border:1px solid var(--hairline-strong)}
.gap{position:absolute;top:calc(50% - var(--space-2));height:var(--space-4);background:var(--x-proposed-unseen);border:1px dashed var(--hairline-strong);border-radius:var(--space-1)}
.standing{position:absolute;top:calc(50% - 1px);height:2px;background:var(--x-proposed-standby);opacity:.7}
.armed{position:absolute;top:calc(50% - var(--space-2));height:var(--space-4);border:1px dashed var(--info);border-radius:var(--space-1);color:var(--info);font:400 var(--x-proposed-type-micro)/var(--space-4) var(--font-mono);padding:0 var(--space-2);white-space:nowrap;overflow:hidden}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:var(--target-sm);height:var(--target-sm);display:grid;place-items:center;border-radius:50%;background:var(--slate-deep);border:1px solid var(--hairline-strong);color:var(--ink);transition:transform var(--motion-base) var(--ease-out)}
.mk.up{margin-top:calc(var(--space-6) * -1)}
.mk.dn{margin-top:var(--space-6)}
.mk.sel{border-color:var(--light);color:var(--light);box-shadow:0 0 0 3px color-mix(in srgb,var(--light) 18%,transparent)}
.mk.standby{border-color:var(--x-proposed-standby);color:var(--x-proposed-standby)}
.mk.done{border-style:dotted}
.mk .c{position:absolute;top:calc(100% - var(--space-2));right:calc(var(--space-2) * -1);font:500 var(--x-proposed-type-micro)/1 var(--font-mono);background:var(--slate);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:2px var(--space-1);color:var(--light)}
.detail{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-4);align-items:center;padding:var(--space-3) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);min-height:calc(var(--target-md) + var(--space-5))}
.detail h3{margin:0;font-weight:400;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.detail p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:var(--space-2)}
.sw{display:inline-block;width:var(--space-5);height:var(--space-3);border-radius:2px}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>While you were away · V4</b> one time scale: runs as bands, marks, a now line, what is armed next · Marey's train graph, the now line</div>
<script>
/*@DATA@*/
/*@LIB@*/
const DAYI = { Fri: 0, Sat: 1, Sun: 2, Mon: 3 };
const hrs = s => { const [d, t] = s.split(/,?\s+/); const [h, m] = t.split(':').map(Number); return DAYI[d] * 24 + h + m / 60; };
const T0 = hrs(DATA.awaySince.replace(/ \d+ \w+/, '')), T1 = hrs(DATA.today.split(' ')[0] + ' ' + DATA.now);
const X = t => ((t - T0) / (T1 - T0) * 100);
const LANES = ['a1', 'a2'];
const ENTRIES = DATA.diary.map((e, i) => ({ ...e, h: hrs(e.t), i }));
const S = { sel: 0, shown: false };
/* stagger marks that sit close in time: base, above, below */
const OFF = {};
['a1', 'a2'].forEach(aid => { let prev = null; ENTRIES.filter(e => e.agent === aid).sort((x, y) => x.h - y.h).forEach(e => { OFF[e.i] = prev && e.h - prev.h < 1.6 ? (OFF[prev.i] + 1) % 3 : 0; prev = e; }); });
const hasN = t => /\d/.test(t) || /^(a |an |MV )/.test(t);
/* run bands: from a run's first entry to its last, plus the time it took (approximate) */
function bands(aid) {
  const by = {};
  ENTRIES.filter(e => e.agent === aid).forEach(e => { by[e.run] = by[e.run] || [e.h, e.h]; by[e.run][1] = Math.max(by[e.run][1], e.h); });
  return Object.entries(by).map(([r, [s, e]]) => ({ r, s, e: Math.min(e + (aid === 'a2' ? .3 : .7), T1) }));
}
function nights() { const out = []; for (let d = 0; d < 4; d++) { const s = Math.max(T0, d * 24 - 2), e = Math.min(T1, d * 24 + 7); if (e > s) out.push([s, e]); } return out; }
function render() {
  const e = ENTRIES[S.sel], lim = ENTRIES.find(x => x.kind === 'limit'), sb = ENTRIES.find(x => x.kind === 'standby');
  $('#app').innerHTML = topHTML(['Home', 'Agents on ' + F('team').name, 'While you were away'], [['← →', 'mark'], ...STD]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">${DATA.awaySince} to ${DATA.today}, ${DATA.now} · one scale, no gaps left out</p><h1 class="title">While you were away</h1></div>
    <div class="chart"><div class="axis">
      ${nights().map(([s, n]) => `<div class="night" style="left:${X(s)}%;width:${X(n) - X(s)}%"></div>`).join('')}
      ${[0, 1, 2, 3].flatMap(d => [0, 12].map(h => d * 24 + h)).filter(t => t > T0 && t < T1).map(t => `<div class="tick" style="left:${X(t)}%"><span>${Object.keys(DAYI)[Math.floor(t / 24)]} ${String(t % 24).padStart(2, '0')}:00</span></div>`).join('')}
      <div class="nowl" style="left:100%"><span style="left:auto;right:var(--space-1)">now ${DATA.now}</span></div>
      <div class="lanes">${LANES.map(aid => `<div class="lane"><span class="nm">${mm(aid)}<span>${A(aid).name}<span class="muted">${lvl(A(aid).level, 3, false)} under ${first(A(aid).supervisor)}</span></span></span><div class="base"></div>
        ${bands(aid).map(b => `<div class="band" style="left:${X(b.s)}%;width:${Math.max(.6, X(b.e) - X(b.s))}%" title="run ${b.r}"></div>`).join('')}
        ${aid === lim.agent ? `<div class="gap" style="left:${X(lim.h)}%;width:${X(hrs(lim.resumed)) - X(lim.h)}%" title="${lim.text}"></div>` : ''}
        ${aid === sb.agent ? `<div class="standing" style="left:${X(sb.h)}%;width:${100 - X(sb.h)}%"></div>` : ''}
        ${aid === 'a1' ? `<div class="armed" style="left:calc(100% - var(--space-8));width:var(--space-8)">next: ${A(aid).next[0].w.toLowerCase()}</div>` : ''}
        ${ENTRIES.filter(x => x.agent === aid).map(x => { const k = OFF[x.i]; return `<button class="mk dep ${x.kind} ${k === 1 ? 'up' : k === 2 ? 'dn' : ''} ${S.sel === x.i ? 'sel' : ''}" style="left:${X(x.h)}%;--i:${x.i}" data-i="${x.i}" aria-label="${x.t}: ${x.text}">${x.kind === 'standby' ? '<span class="lamp on"></span>' : I(KIND_ICON[x.kind], 16)}<span class="c">${x.n}</span></button>`; }).join('')}
      </div>`).join('')}</div>
    </div></div>
    <div>
      <div class="detail">${mm(e.agent)}<div><p class="eyebrow">${e.t} · ${KIND_WORD[e.kind]} · run ${e.run}</p><h3>${e.kind === 'batch' ? `${e.n} details: ${e.text}` : hasN(e.text) ? e.text[0].toUpperCase() + e.text.slice(1) : `${e.n} ${e.text}`}</h3><p>${e.why ? e.why[0].toUpperCase() + e.why.slice(1) + '.' : e.kind === 'batch' ? `${e.reports} reports read; check ${e.sample} of the ${e.n}, then sign the batch.` : ''}${e.ask ? ` Ask ${P(e.ask).name}.` : ''}${e.waits ? ` Waits for ${P(e.waits).name}${e.waits !== DATA.me ? ', not you' : ''}.` : ''}${e.undoUntil ? ` Undo until ${e.undoUntil}.` : ''}${e.resumed ? ` Resumed ${e.resumed}.` : ''}</p><p class="tk">${e.tech}</p></div>
        ${['batch', 'held', 'disagree'].includes(e.kind) ? `<button class="btn go">${I('arrow-right', 14)} Open in Triage</button>` : e.kind === 'done' ? `<button class="btn">${I('undo-2', 14)} Undo</button>` : e.kind === 'outside' ? `<button class="btn">${I('send', 14)} Tell ${first(e.ask)}</button>` : '<span></span>'}</div>
      <div class="legend" style="margin-top:var(--space-3)"><span><i class="sw" style="background:color-mix(in srgb,var(--ink) 18%,transparent);border:1px solid var(--hairline-strong)"></i>a run</span><span><i class="sw" style="background:var(--x-proposed-unseen);border:1px dashed var(--hairline-strong)"></i>couldn’t work: limit reached</span><span><i class="sw" style="height:2px;background:var(--x-proposed-standby)"></i>standing by since then</span><span><i class="sw" style="border:1px dashed var(--info)"></i>armed: what it will do next</span><span><i class="sw" style="background:color-mix(in srgb,var(--shade) 22%,transparent)"></i>night</span></div>
    </div>
  </div></main>`;
  Icons.hydrate($('#app')); markKeys();
  $$('.mk').forEach(b => b.onclick = () => { S.sel = +b.dataset.i; render(); });
}
function replay() { clearLater(); S.sel = 0; settle(); render(); later(() => { S.sel = ENTRIES.find(x => x.kind === 'standby').i; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { markKeys(); return; }
  if (e.key === 'ArrowRight') { S.sel = Math.min(ENTRIES.length - 1, S.sel + 1); render(); }
  if (e.key === 'ArrowLeft') { S.sel = Math.max(0, S.sel - 1); render(); }
});
replay();
</script>
</body>
</html>
