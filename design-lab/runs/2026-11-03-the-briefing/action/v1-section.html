<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Briefing · Action V1 · The section</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; listed as
   "needs token" in notes.md. Marks carried from the catalogue run.
   --------------------------------------------------------------- */
:root{
  /* six ways to be empty (catalogue run): corner ticks for not known yet */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  /* stale: 45 degree hatch */
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  /* not yours to see: 135 degree hatch plus a lock */
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* sources disagree: a warning-tinted edge, never red */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  /* quiet lines, doesn't-apply text (wear and time) */
  --x-proposed-quiet: .62;
  /* mono numerals in data */
  --x-proposed-type-micro: .6875rem;
  /* the lit next step (light language) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* pencil (reference desk): what a model wrote, until a person accepts it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  /* reach: how far a light falls through floors below where a thing is kept */
  --x-proposed-reach-wash: 14%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.lite{color:var(--light)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.hints .on{color:var(--x-proposed-lit)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* floors */
[data-tier="department"]{--fc:var(--floor-department-high);--fl:var(--floor-department-low)}
[data-tier="team"]{--fc:var(--floor-team-high);--fl:var(--floor-team-low)}
[data-tier="org"]{--fc:var(--floor-org-high);--fl:var(--floor-org-low)}
[data-tier="you"]{--fc:var(--floor-you-high);--fl:var(--floor-you-low)}
.fchip{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap}
.fchip::before{content:"";width:var(--space-4);height:2px;background:var(--fc);border-radius:1px}
.fword{color:var(--fc)}

/* two registers: technical line one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* six ways to be empty, the two this surface meets most */
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);vertical-align:1px;white-space:nowrap}
.mk-unseen{display:inline-flex;align-items:center;justify-content:center;width:var(--space-4);height:var(--space-3);background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:2px;color:var(--ink-muted);flex:none}
.mk-disagree{display:inline-block;width:var(--space-4);height:var(--space-3);border-left:2px solid var(--x-proposed-disagree);border-right:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);flex:none;vertical-align:-1px}
.mk-gap{display:inline-block;width:var(--space-5);height:var(--space-4);vertical-align:-3px;
  --t:var(--space-1);
  background:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--t) no-repeat}
.mk-break{width:var(--space-5);height:var(--space-3);vertical-align:-1px}
.mk-break path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}

/* pencil and ink */
.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3)}
.pencil .pt{font-style:italic;color:var(--ink)}
.pencil .pl{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);margin:0 0 var(--space-1)}
.pencil.inked{border-style:solid;border-color:var(--hairline-strong);background:none}
.pencil.inked .pt{font-style:normal}
.pencil.off{border-style:dashed;border-color:var(--hairline)}
.pencil.off .pt{font-style:normal}
.pbtn{display:inline-flex;align-items:center;gap:var(--space-1);height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink);margin-left:auto}

/* confidence word, with the yardstick at word size */
.cw{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--light);white-space:nowrap;vertical-align:1px}
.cw .yd{display:inline-grid;grid-template-columns:repeat(7,var(--space-1));gap:1px}
.cw .yd i{height:var(--space-2);background:var(--hairline-strong);border-radius:1px}
.cw .yd i.on{background:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard)}
.btn:hover{background:var(--surface-raised)}
.btn.go{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.btn[aria-disabled="true"]{opacity:var(--x-proposed-quiet);cursor:not-allowed}

/* app frame */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--slate-deep) 70%,transparent);min-width:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.crumb b{font-weight:400;color:var(--light)}
.crumb svg{opacity:var(--x-proposed-quiet);flex:none}
.top .hints{margin-left:auto;justify-content:flex-end}
.main{min-height:0;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));overflow:hidden}

/* the finding: headline (ink, template), bottom line (pencil), claims (ink) */
.fd-h{margin:var(--space-1) 0 var(--space-3);font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);letter-spacing:var(--tracking-tight)}
.fd-h .spk{vertical-align:-4px;margin-left:var(--space-2)}
.claims{list-style:none;margin:var(--space-3) 0 0;padding:0;display:grid;gap:var(--space-2)}
.claims li{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.claims li > svg{margin-top:2px;color:var(--ink-muted)}
.claims .bs{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:2px}
.claims .bs b{font-weight:400;color:var(--ink);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap)}
.claims li.judge .ct{font-style:normal}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}

/* isotype figures: counted, never scaled; a part figure is cut, not shrunk */
.figs{display:flex;flex-wrap:wrap;gap:1px;color:var(--ink)}
.fig{display:inline-flex;clip-path:inset(0 calc((1 - var(--part)) * 100%) 0 0)}
.ck{white-space:nowrap}
.ck-all{color:var(--ink)}
.ck-part{color:var(--x-proposed-disagree)}
.ck-none{color:var(--ink-muted);background:var(--x-proposed-unseen);padding:0 var(--space-1);border-radius:2px}
.x-cap{max-width:calc(100vw - 2 * var(--edge-tight))}

/* ---- V1: a building section. The thing is placed on a floor; its light falls through the floors under it ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(340px,30%) minmax(0,1fr);gap:var(--space-5)}
.left{min-height:0;padding-right:var(--space-2)}
.right{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.verbs{display:flex;gap:var(--space-2);flex-wrap:wrap}
.verb{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink-muted);font-size:var(--type-meta)}
.verb[aria-pressed="true"]{color:var(--light);border-color:var(--ink-muted);background:var(--surface-raised)}
.targets{display:flex;gap:var(--space-2);flex-wrap:wrap;min-height:var(--target-sm)}
.tg{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--hairline);font-size:var(--type-small);color:var(--ink-muted)}
.tg::before{content:"";width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--fc)}
.tg[aria-pressed="true"]{color:var(--light);border-color:var(--fc);background:color-mix(in srgb,var(--fc) 10%,transparent)}
.tg .kbd{margin-left:var(--space-1)}

.section{flex:0 1 auto;min-height:0;overflow:auto;scrollbar-width:thin;display:grid;grid-auto-rows:minmax(0,auto);align-content:start;gap:0;border-top:1px solid var(--hairline-strong);position:relative}
.slab{position:relative;display:grid;grid-template-columns:calc(var(--measure-rail) - var(--space-6)) minmax(0,1fr) minmax(0,1.15fr);gap:var(--space-4);padding:var(--space-3) var(--space-3) var(--space-3) var(--space-4);border-bottom:1px solid var(--hairline-strong);transition:background var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
.slab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--fc);opacity:var(--x-proposed-quiet)}
/* the slab's floor line, like the cut floor plate in a section */
.slab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--fc),transparent);opacity:.5}
.slab.dark{opacity:.5}
.slab.lit{background:linear-gradient(180deg,color-mix(in srgb,var(--fc) var(--x-proposed-reach-wash),transparent),color-mix(in srgb,var(--fc) calc(var(--x-proposed-reach-wash) / 3),transparent))}
.slab.src{box-shadow:inset 0 2px 0 var(--fc)}
.slab .who h3{margin:0;font-weight:300;font-size:var(--type-body);line-height:var(--leading-body);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.slab .who p{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.slab .who .state{margin-top:var(--space-2);color:var(--ink)}
.slab .who .state b{font-weight:400;color:var(--fc)}
.slab .people{min-width:0}
.slab .people .figs{color:var(--ink-muted)}
.slab.lit .people .figs{color:var(--light)}
.slab .people .n{font:400 var(--type-lead)/var(--leading-lead) var(--font-mono);color:var(--light)}
.slab .people .n small{font:400 var(--type-small)/1 var(--font-sans);color:var(--ink-muted);margin-left:var(--space-2)}
.slab .recs{min-width:0}
.rgrid{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);margin-top:var(--space-1)}
.rg{display:flex;flex-direction:column;gap:2px}
.rg .cells{display:flex;flex-wrap:wrap;gap:2px;max-width:calc(var(--space-8) + var(--space-5))}
.cell{width:var(--space-2);height:var(--space-2);border-radius:1px;background:var(--ink)}
.cell.no{background:var(--x-proposed-unseen);outline:1px solid var(--hairline);outline-offset:-1px}
.rg .lab{display:flex;align-items:center;gap:var(--space-1);font-size:var(--x-proposed-type-micro);line-height:1.3;color:var(--ink-muted);max-width:calc(var(--space-8) + var(--space-5))}
.rs{display:flex;align-items:center;gap:var(--space-1);font-size:var(--x-proposed-type-micro);line-height:1.3;color:var(--ink-muted);flex-basis:45%;min-width:0;white-space:nowrap}
.rs .cell{margin-right:var(--space-1)}
.recs .sum{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:0}
.recs .sum b{font-weight:400;color:var(--ink)}
.slab.dark .recs .cells{filter:saturate(0)}
.legend{margin-bottom:auto;display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:var(--space-2)}

.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-4);align-items:center;padding:var(--space-3) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane)}
.verdict p{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.verdict p.big{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);font-weight:300}
.verdict p.big b{font-weight:400}
.verdict .warn{color:var(--x-proposed-disagree)}
.left .eyebrow + .fd-h{font-size:var(--type-lead);line-height:var(--leading-lead)}
@media (max-width:1400px){.slab{grid-template-columns:calc(var(--measure-rail) - var(--space-7)) minmax(0,.8fr) minmax(0,1.2fr)}.left .claims li:nth-child(n+4){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Action · V1</b> the section: placed on a floor, its light falls through the floors under it · architectural section, Isotype</div>
<script>
/* Sample data. Every name, label, count and floor below is deployment data:
   nothing in the markup or the scripts repeats any of it. */
const DATA = {
  org: 'Ridgeway Regional Services',
  me: 'p1',
  myFloor: 'team',
  today: '3 Nov 2026',
  /* floors, top first. reach = people who can read something kept on this floor
     (everyone on it and on the floors under it). */
  floors: {
    org:        { name: 'Ridgeway Regional Services', word: 'Org',        reach: 1180, under: '6 departments' },
    department: { name: 'Fleet and Facilities',       word: 'Department', reach: 34,   under: '3 teams' },
    team:       { name: 'North depot crew',           word: 'Team',       reach: 9,    under: '' }
  },
  floorOrder: ['org', 'department', 'team'],
  people: {
    p1: { name: 'Sam Okafor',    role: 'Depot coordinator',   floor: 'team' },
    p2: { name: 'Priya Nair',    role: 'Fleet lead',          floor: 'department' },
    p3: { name: 'Jo Barnes',     role: 'North depot keeper',  floor: 'team' },
    p4: { name: 'Dana Whitlock', role: 'Contracts manager',   floor: 'org' },
    p5: { name: 'Health and safety desk', role: 'Keeps incident reports', floor: 'org' }
  },
  /* the finding, as Data Atlas and the briefing builder hold it */
  finding: {
    id: 'F-0412',
    subject: 'North depot vans',
    /* the headline is built from a template and the counts: ink */
    headline: { tpl: '{n} of {of} {subject} are overdue for inspection, up from {was} in {wasWhen}.', n: 7, of: 18, was: 2, wasWhen: 'August' },
    /* the bottom line may be drafted by the model: pencil until a person accepts it */
    bottomLine: {
      model: 'Book Kestrel’s missed October visit this month, or about 9 vans may be off the road by December.',
      template: '{n} of {of} {subject} are overdue for inspection. Kestrel’s October visit has not been rebooked.'
    },
    series: [ { m: 'Jun', v: 1 }, { m: 'Jul', v: 2 }, { m: 'Aug', v: 2 }, { m: 'Sep', v: 4 }, { m: 'Oct', v: 5 }, { m: 'Nov', v: 7 } ],
    forecast: { m: 'Dec', v: 9 },
    checked: 'today 09:12',
    recipe: {
      plain: 'vans at the North depot whose next inspection is past its date',
      tech: 'count(Vehicle ∩ basedAt=Site:north-depot ∩ nextInspection < today())'
    }
  },
  /* records behind the finding, grouped. kept = how many are kept on each floor */
  groups: [
    { id: 'vans',   label: 'North depot vans',            icon: 'truck',           app: 'Data Atlas', kept: { department: 11, team: 7 },  keeper: 'p3', tech: 'Vehicle' },
    { id: 'insp',   label: 'inspection records',          icon: 'clipboard-check', app: 'Data Atlas', kept: { department: 16, team: 30 }, keeper: 'p3', tech: 'InspectionEvent' },
    { id: 'log',    label: 'Depot inspection log',        icon: 'file-text',       app: 'Artifacts',  kept: { team: 1 },                  keeper: 'p3', tech: 'document' },
    { id: 'report', label: 'Kestrel report, October',     icon: 'file-text',       app: 'Artifacts',  kept: { department: 1 },            keeper: 'p2', tech: 'document' },
    { id: 'con',    label: 'Kestrel servicing contract',  icon: 'scroll-text',     app: 'Data Atlas', kept: { org: 1 },                   keeper: 'p4', tech: 'Contract' },
    { id: 'inc',    label: 'Incident report on NV-14',    icon: 'triangle-alert',  app: 'Data Atlas', kept: { org: 1 },                   keeper: 'p5', restricted: true, tech: 'Incident (restricted)' }
  ],
  /* the claims of the briefing. kind count = ink fact; judge = a judgement with a yardstick word */
  claims: [
    { id: 'c1', kind: 'count', text: '7 of 18 North depot vans are overdue for inspection.', basis: ['vans', 'insp', 'log'],
      sources: 'Two sources agree on 7; Kestrel’s report says 5 (it counts two booked vans as done).', disagree: true },
    { id: 'c2', kind: 'count', text: 'That is up from 2 in August.', basis: ['insp'], sources: 'From 46 inspection records.' },
    { id: 'c3', kind: 'count', text: 'Kestrel’s October visit was cancelled and has not been rebooked.', basis: ['con', 'report'], sources: 'The contract and Kestrel’s own report agree.' },
    { id: 'c4', kind: 'judge', text: 'If no visit is booked, 9 vans will be overdue by December.', basis: ['vans'], word: 4,
      sources: 'From the due dates of 18 vans. Two more fall due on 21 Nov.' },
    { id: 'c5', kind: 'count', text: 'One of the overdue vans also has an open incident report.', basis: ['inc'], sources: 'Kept by the Health and safety desk.' }
  ],
  /* the probability yardstick (UK PHIA), plain word first */
  yardstick: [
    { w: 'Remote chance', r: '≤5%' }, { w: 'Highly unlikely', r: '10–20%' }, { w: 'Unlikely', r: '25–35%' },
    { w: 'Realistic possibility', r: '40–50%' }, { w: 'Likely', r: '55–75%' }, { w: 'Highly likely', r: '80–90%' }, { w: 'Almost certain', r: '≥95%' }
  ],
  /* where a briefing can go (Artifacts libraries) */
  libraries: [
    { id: 'L1', name: 'North depot notes',       floor: 'team' },
    { id: 'L2', name: 'Fleet briefings',         floor: 'department' },
    { id: 'L3', name: 'Board papers',            floor: 'org', approval: 'p2', approvalWhy: 'Board papers need the Department lead’s approval (set by your admin).' }
  ],
  /* what a finding can feed (Mandate intents) */
  intents: [
    { id: 'I1', title: 'Keep every fleet vehicle roadworthy', owner: 'p2', floor: 'department', due: '31 Mar 2027', followers: 6, bound: 'vans', state: 'On track' },
    { id: 'I2', title: 'Renew the Kestrel servicing contract', owner: 'p4', floor: 'org', due: '15 Jan 2027', followers: 4, bound: 'con', state: 'On track' },
    { id: 'I3', title: 'Monthly safety walk-round at each depot', owner: 'p3', floor: 'team', due: '30 Nov 2026', followers: 3, bound: 'vans', state: 'Due soon' }
  ],
  /* watching: what makes the count move, and how Data Atlas and the events service see it */
  watch: {
    now: 7, max: 18,
    presets: [ { id: 'any', plain: 'whenever the count changes' }, { id: 'above', plain: 'when it goes above', n: 8 }, { id: 'zero', plain: 'when it is back to', n: 0 } ],
    triggers: [
      { icon: 'clipboard-check', plain: 'A new inspection is recorded', who: 'Data Atlas', tech: 'atlas.observation.recorded · kind=InspectionEvent', has: true },
      { icon: 'clock',           plain: 'A due date passes overnight', who: 'events service clock', needs: 'a clock in the events service', tech: 'events.schedule · daily 00:05 · re-run recipe', has: false },
      { icon: 'file-text',       plain: 'A source is withdrawn in Artifacts', who: 'Artifacts', tech: 'document.withdrawn → evidence marked', has: true },
      { icon: 'split',           plain: 'The disagreement is settled in Triage', who: 'Data Atlas Triage', needs: 'Data Atlas to announce when Triage settles a disagreement', tech: 'atlas.triage.resolved · detail=nextInspection', has: false },
      { icon: 'history',         plain: 'Nothing new arrives for 21 days', who: 'events service clock', needs: 'the events service to notice when nothing arrives', tech: 'events.silence · window=21d', has: false }
    ]
  }
};

/* ---- shared helpers (same in every variant) ---- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const I = (n, size = 16, stroke = 1.5) => Icons.svg(n, { size, stroke });
const RANK = Object.fromEntries(DATA.floorOrder.map((f, i) => [f, i]));
const P = id => DATA.people[id];
const F = id => DATA.floors[id];
const G = id => DATA.groups.find(g => g.id === id);
const fmt = n => n.toLocaleString('en-GB');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ms = v => parseFloat(css(v)) || 0;
const fill = (tpl, o) => tpl.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? DATA.finding[k] ?? '');

/* access: a reader on floor r opens what is kept on r or on the floors above it */
const canOpen = (keptOn, reader) => RANK[keptOn] <= RANK[reader];
const total = g => Object.values(g.kept).reduce((a, b) => a + b, 0);
const openN = (g, reader) => g.restricted ? 0 : Object.entries(g.kept).reduce((a, [f, n]) => a + (canOpen(f, reader) ? n : 0), 0);
const allTotal = () => DATA.groups.reduce((a, g) => a + total(g), 0);
const allOpen = reader => DATA.groups.reduce((a, g) => a + openN(g, reader), 0);
/* who to ask about what a reader can't open in a group */
const askFor = g => P(g.keeper).name;
/* a claim is checkable by a reader if every record behind it opens, partly if some do */
function checkable(c, reader) {
  const o = c.basis.map(G).map(g => openN(g, reader) / total(g));
  if (o.every(x => x === 1)) return 'all';
  if (o.some(x => x > 0)) return 'part';
  return 'none';
}
const CHECK_WORD = { all: 'they can check it', part: 'they can check part of it', none: 'they can’t open what’s behind it' };

/* the probability yardstick at word size */
function cw(i) {
  const y = DATA.yardstick[i];
  return `<span class="cw" title="${y.w}: ${y.r}"><span class="yd" aria-hidden="true">${DATA.yardstick.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</span>${y.w}<span class="tk">&nbsp;· ${y.r} · probability yardstick</span></span>`;
}

/* sparkline at word size; the forecast point is a judgement, so it is dotted */
function spark(w = 96, h = 22, withForecast = true) {
  const s = DATA.finding.series, f = DATA.finding.forecast;
  const pts = withForecast ? [...s, f] : s;
  const max = Math.max(...pts.map(p => p.v)), n = pts.length - 1;
  const X = i => 2 + i * (w - 4) / n, Y = v => h - 2 - v * (h - 4) / max;
  const ink = s.map((p, i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const last = s.length - 1;
  const fc = withForecast ? `<line x1="${X(last)}" y1="${Y(s[last].v)}" x2="${X(n)}" y2="${Y(f.v)}" stroke="var(--ink-muted)" stroke-dasharray="1.5 2.5" stroke-width="1.25"/><circle cx="${X(n)}" cy="${Y(f.v)}" r="2" fill="none" stroke="var(--ink-muted)"/>` : '';
  return `<svg class="spk" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Overdue each month: ${s.map(p => p.m + ' ' + p.v).join(', ')}${withForecast ? ', ' + f.m + ' likely ' + f.v : ''}"><polyline points="${ink}" fill="none" stroke="var(--ink)" stroke-width="1.25" stroke-linejoin="round"/><circle cx="${X(last)}" cy="${Y(s[last].v)}" r="2.25" fill="var(--light)"/>${fc}</svg>`;
}

/* isotype: repeated figures, never a scaled one. returns markup and the key */
function figures(n, opts = {}) {
  const per = n > 60 ? 20 : 1, k = Math.ceil(n / per);
  const sz = opts.size || 14;
  let out = '';
  for (let i = 0; i < k; i++) {
    const part = (i === k - 1 && n % per) ? (n % per) / per : 1;
    out += `<span class="fig" style="--part:${part}">${I(opts.icon || 'user-round', sz, 1.5)}</span>`;
  }
  return { html: `<span class="figs" role="img" aria-label="${fmt(n)} people">${out}</span>`, key: per === 1 ? 'each figure is one person' : `each figure is ${per} people` };
}

/* the finding, as one block (headline ink, bottom line pencil, claims ink) */
const STATE = { tech: false, gateway: true, accepted: false };
function headlineHTML() {
  const h = DATA.finding.headline;
  return fill(h.tpl, h);
}
function bottomLineHTML() {
  const b = DATA.finding.bottomLine, h = DATA.finding.headline;
  if (!STATE.gateway) {
    return `<div class="pencil off" data-bl><p class="pl">${I('file-text', 12)} Model gateway is off · bottom line from the template, no number changes</p><p class="pt" style="margin:0">${fill(b.template, h)}</p></div>`;
  }
  if (STATE.accepted) {
    return `<div class="pencil inked" data-bl><p class="pl">${I('pen-line', 12)} Bottom line · drafted by the model, accepted by ${P(DATA.me).name}</p><p class="pt" style="margin:0">${b.model}</p></div>`;
  }
  return `<div class="pencil" data-bl><p class="pl">${I('pencil', 12)} Bottom line · drafted by the model, not yet accepted <button class="pbtn" data-accept>${I('check', 12)} Accept <span class="kbd">A</span></button></p><p class="pt" style="margin:0">${b.model}</p><p class="tk">every number in it comes from the claims below; the model may only choose words</p></div>`;
}
function claimsHTML(reader) {
  return `<ul class="claims">${DATA.claims.map((c, i) => {
    const chk = reader ? checkable(c, reader) : null;
    const ic = c.kind === 'judge' ? 'scale' : 'circle-dot';
    const basis = c.basis.map(G).map(g => `<b>${g.label}</b>`).join(', ');
    return `<li class="dep ${c.kind}" style="--i:${i}">${I(ic, 14)}<span><span class="ct">${c.text}</span> ${c.kind === 'judge' ? cw(c.word) : ''}${c.disagree ? ' <span class="mk-disagree" title="sources disagree"></span>' : ''}
      <span class="bs">${c.sources} From ${basis}.${chk ? ` <span class="ck ck-${chk}">${CHECK_WORD[chk]}</span>` : ''}</span></span></li>`;
  }).join('')}</ul>`;
}
function findingHTML(opts = {}) {
  return `<p class="eyebrow">Finding · ${DATA.finding.subject} · checked ${DATA.finding.checked}</p>
    <h2 class="fd-h">${headlineHTML()} ${spark()}</h2>
    ${bottomLineHTML()}
    ${opts.claims === false ? '' : claimsHTML(opts.reader)}`;
}

/* top bar */
function topHTML(crumbs, hints) {
  const me = P(DATA.me), fl = F(DATA.myFloor);
  return `<header class="top"><p class="brand">AUGUR</p>
    <nav class="crumb" aria-label="Where you are">${crumbs.map((c, i) => (i ? I('chevron-right', 14) : '') + (i === crumbs.length - 1 ? `<b>${c}</b>` : `<span>${c}</span>`)).join('')}</nav>
    <span class="fchip" data-tier="${DATA.myFloor}">${fl.name} · ${fl.word}</span>
    <div class="hints">${hints.map(([k, w, id]) => `<span ${id ? `id="${id}"` : ''}><span class="kbd">${k}</span>${w}</span>`).join('')}</div></header>`;
}

/* keys shared by every variant */
function commonKeys(e, rerender, replay) {
  const k = e.key.toLowerCase();
  if (e.metaKey || e.ctrlKey || e.altKey) return false;
  if (k === 'r') { replay(); return true; }
  if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); $('#h-t')?.classList.toggle('on', STATE.tech); return true; }
  if (k === 'g') { STATE.gateway = !STATE.gateway; $('#h-g')?.classList.toggle('on', !STATE.gateway); rerender(); return true; }
  if (k === 'a') { STATE.accepted = !STATE.accepted; rerender(); return true; }
  return false;
}
document.addEventListener('click', e => { if (e.target.closest('[data-accept]')) { STATE.accepted = true; window.__rerender && window.__rerender(); } });

/* timers for the auto demo, cleared on replay */
let TIMERS = [];
const later = (fn, t) => TIMERS.push(setTimeout(fn, reduced ? Math.min(t, 50) : t));
const clearLater = () => { TIMERS.forEach(clearTimeout); TIMERS = []; };

const V = { verb: 'publish', target: { publish: 'L1', feed: 'I1', watch: 'any' } };
const VERBS = [
  { id: 'publish', key: 'P', plain: 'Publish as a briefing', icon: 'send', app: 'Artifacts' },
  { id: 'feed', key: 'F', plain: 'Feed an intent', icon: 'target', app: 'Mandate' },
  { id: 'watch', key: 'W', plain: 'Watch for change', icon: 'binoculars', app: 'Data Atlas' }
];
/* people on each floor who are not already counted on a floor under it */
const own = f => { const i = RANK[f], below = DATA.floorOrder[i + 1]; return F(f).reach - (below ? F(below).reach : 0); };

function targets() {
  if (V.verb === 'publish') return DATA.libraries.map(l => ({ id: l.id, label: l.name, floor: l.floor }));
  if (V.verb === 'feed') return DATA.intents.map(t => ({ id: t.id, label: t.title, floor: t.floor }));
  return DATA.watch.presets.map(p => ({ id: p.id, label: 'Tell me ' + p.plain + (p.n !== undefined ? ' ' + p.n : ''), floor: DATA.myFloor }));
}
/* which floor the thing is kept on, and who on each floor gets it */
function plan() {
  const t = V.target[V.verb];
  if (V.verb === 'publish') {
    const l = DATA.libraries.find(x => x.id === t);
    return { kept: l.floor, place: l, readers: f => RANK[f] >= RANK[l.floor] ? own(f) : 0 };
  }
  if (V.verb === 'feed') {
    const it = DATA.intents.find(x => x.id === t);
    /* an intent's readers: its owner and followers, on the intent's floor */
    return { kept: it.floor, place: it, readers: f => f === it.floor ? it.followers + 1 : 0 };
  }
  return { kept: DATA.myFloor, place: null, readers: f => f === DATA.myFloor ? 1 : 0 };
}

function slabHTML(f, p) {
  const n = p.readers(f), lit = n > 0, fl = F(f);
  const reader = f;
  const groups = DATA.groups.map(g => {
    const o = lit ? openN(g, reader) : 0, tt = total(g);
    if (tt === 1) return `<div class="rs"><i class="cell ${o ? '' : 'no'}"></i>${I(g.icon, 11)}${g.label}</div>`;
    return `<div class="rg"><span class="cells">${Array.from({ length: tt }, (_, i) => `<i class="cell ${i < o ? '' : 'no'}"></i>`).join('')}</span><span class="lab">${I(g.icon, 11)}${g.label}</span></div>`;
  }).join('');
  const o = allOpen(reader), tt = allTotal();
  const fig = figures(n || own(f), { size: 13 });
  let state;
  if (p.kept === f) state = `<p class="state">${I('map-pin', 12)} <b>Kept here</b></p>`;
  else if (lit) state = `<p class="state">Reads it from ${F(p.kept).word === fl.word ? 'here' : 'the ' + F(p.kept).word + ' floor'}</p>`;
  else state = `<p class="state muted">${RANK[f] < RANK[p.kept] ? 'Above where it’s kept: won’t see it' : 'Not told'}</p>`;
  let sum;
  if (!lit) sum = `<p class="sum">Nobody here gets it.</p>`;
  else {
    const hidden = DATA.groups.filter(g => openN(g, reader) < total(g));
    const who = [...new Set(hidden.map(askFor))].join(' or ');
    sum = `<p class="sum">They can open <b>${o} of ${tt}</b> records behind it.${o < tt ? ` In their copy the rest show as locked, “ask ${who}”.` : ''}</p>`;
  }
  return `<section class="slab dep ${lit ? 'lit' : 'dark'} ${p.kept === f ? 'src' : ''}" data-tier="${f}" style="--i:${RANK[f]}">
    <div class="who"><h3>${fl.word}</h3><p>${fl.name}</p>${state}</div>
    <div class="people"><div class="n">${lit ? fmt(n) : '0'}<small>${lit ? (V.verb === 'watch' ? 'just you' : 'can read it') : 'of ' + fmt(own(f)) + ' here'}</small></div>${lit ? fig.html : ''}<p class="tk">${lit ? fig.key : ''}${lit ? ` · reader floor ≥ ${p.kept}` : ''}</p></div>
    <div class="recs">${sum}<div class="rgrid">${groups}</div></div></section>`;
}

function verdictHTML(p) {
  let big, small, btn;
  const sumReach = DATA.floorOrder.reduce((a, f) => a + p.readers(f), 0);
  if (V.verb === 'publish') {
    const l = p.place;
    const minOpen = allOpen(l.floor);
    big = `Publish to <b>${l.name}</b>: <b>${fmt(sumReach)}</b> ${sumReach === 1 ? 'person' : 'people'} can read it. Some of them can open only <b>${minOpen} of ${allTotal()}</b> records behind it.`;
    small = minOpen < allTotal() / 2 ? `<span class="warn">${I('triangle-alert', 12)} Your sentences carry numbers from records most of them can’t open. Publishing tells them anyway.</span>` : 'Every claim keeps its link to the records; readers who can’t open one see whom to ask.';
    btn = l.approval ? `<button class="btn" aria-disabled="false">${I('user-round', 14)} Ask ${P(l.approval).name} to approve</button>` : `<button class="btn go">${I('send', 14)} Publish</button>`;
    if (l.approval) small += `<br>${l.approvalWhy}`;
  } else if (V.verb === 'feed') {
    const it = p.place;
    big = `Feed <b>${it.title}</b>: ${P(it.owner).name} and ${it.followers} followers see this finding as evidence.`;
    small = `It does not change the intent’s state; ${P(it.owner).name} decides that. Due ${it.due}.`;
    btn = `<button class="btn go">${I('target', 14)} Feed it</button>`;
  } else {
    big = `Only <b>you</b> are told, and nobody else can see the watch.`;
    small = `The watch counts only what you can open: ${allOpen(DATA.myFloor)} of ${allTotal()} records.`;
    btn = `<button class="btn go">${I('binoculars', 14)} Watch</button>`;
  }
  return `<div class="verdict dep" style="--i:4"><div><p class="big">${big}</p><p>${small}</p></div>${btn}</div>`;
}

function render() {
  const p = plan();
  $('#app').innerHTML = topHTML(['Data Atlas', DATA.finding.subject, 'Finding ' + DATA.finding.id],
    [['P', 'publish'], ['F', 'feed'], ['W', 'watch'], ['1–3', 'where'], ['A', 'accept'], ['T', 'admin words', 'h-t'], ['G', 'model off', 'h-g'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div class="left scroll">${findingHTML()}</div>
      <div class="right">
        <div class="verbs" role="group" aria-label="What to do with it">${VERBS.map(v => `<button class="verb" data-verb="${v.id}" aria-pressed="${V.verb === v.id}">${I(v.icon, 14)} ${v.plain} <span class="kbd">${v.key}</span><span class="tk">&nbsp;${v.app}</span></button>`).join('')}</div>
        <div class="targets" role="group" aria-label="Where">${targets().map((t, i) => `<button class="tg" data-tier="${t.floor}" data-t="${t.id}" aria-pressed="${V.target[V.verb] === t.id}">${t.label}<span class="kbd">${i + 1}</span></button>`).join('')}</div>
        <div class="section" aria-label="Who will see it, floor by floor">${DATA.floorOrder.map(f => slabHTML(f, p)).join('')}</div>
        <div class="legend"><span><i class="cell"></i> a record they can open</span><span><i class="cell no"></i> one they can’t (kept on a floor below, or restricted)</span><span>${I('user-round', 13)} one person</span></div>
        ${verdictHTML(p)}
      </div></div></main>`;
  Icons.hydrate($('#app'));
  $$('.verb').forEach(b => b.onclick = () => { V.verb = b.dataset.verb; render(); });
  $$('.tg').forEach(b => b.onclick = () => { V.target[V.verb] = b.dataset.t; render(); });
}
window.__rerender = render;

function replay() {
  clearLater();
  Object.assign(V, { verb: 'publish', target: { publish: 'L1', feed: 'I1', watch: 'any' } });
  STATE.accepted = false;
  document.body.classList.add('pre'); render();
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('pre')));
  /* the moment: the briefing moves up a floor, and its light falls through two floors */
  later(() => { V.target.publish = 'L2'; render(); }, ms('--motion-run'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const k = e.key.toLowerCase();
  const v = VERBS.find(x => x.key.toLowerCase() === k);
  if (v) { V.verb = v.id; render(); return; }
  const ts = targets(); const n = parseInt(k, 10);
  if (n >= 1 && n <= ts.length) { V.target[V.verb] = ts[n - 1].id; render(); }
});
replay();
</script>
</body>
</html>
