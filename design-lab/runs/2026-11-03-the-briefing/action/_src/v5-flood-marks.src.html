<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Briefing · Action V5 · Flood marks</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: watch for change as a gauge staff. Past levels are flood marks, your marks are levels you paint ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(300px,24%) minmax(320px,26%) minmax(0,1fr);gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.col > h2:not(.fd-h){margin:0;font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.col .lede{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.left .fd-h{font-size:var(--type-lead);line-height:var(--leading-lead)}

/* the staff: one row per van, counted not scaled */
.staff{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--space-6) minmax(0,1fr);position:relative}
.rows{grid-column:2;display:flex;flex-direction:column-reverse;border-left:1px solid var(--hairline-strong);border-right:1px solid var(--hairline-strong)}
.rw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--hairline);color:var(--ink-muted);position:relative}
.rw.over{color:var(--light);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.rw .num{position:absolute;right:calc(100% + var(--space-2));font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.rw .num{display:none;white-space:nowrap}
.rw:last-child .num{display:block;opacity:1}
.marks{position:absolute;inset:0;pointer-events:none}
/* past levels: flood marks cut into the wall, ink, never lit */
.fm{position:absolute;right:calc(50% + var(--space-6) / 2);display:flex;align-items:center;gap:var(--space-2);transform:translateY(50%);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.fm::after{content:"";width:var(--space-5);height:1px;background:var(--ink-muted)}
.fm.now{color:var(--light)}
.fm.now::after{background:var(--light);height:2px}
.fm.fc{color:var(--ink-muted);font-style:italic}
.fm.fc::after{background:none;border-top:1px dotted var(--ink-muted)}
/* your marks: painted lines across the staff, with who is told */
.tw{position:absolute;left:calc(50% - var(--space-6) / 2 - var(--space-2));right:0;transform:translateY(-50%);display:flex;align-items:center;gap:var(--space-2);pointer-events:auto;transition:bottom var(--motion-calm) var(--ease-out)}
.tw .line{width:calc(var(--space-6) + var(--space-4));height:2px;background:var(--c);box-shadow:0 0 var(--glow-blur) color-mix(in srgb,var(--c) 40%,transparent)}
.tw .lab{display:flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--light);background:var(--surface-pane);border:1px solid var(--hairline-strong);border-left:2px solid var(--c);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2)}
.tw .lab small{color:var(--ink-muted);font-size:var(--x-proposed-type-micro)}
.tw button{display:inline-flex;border-radius:var(--radius-key);color:var(--ink-muted);padding:2px}
.tw button:hover{color:var(--light)}
.tw.sel .lab{box-shadow:0 0 0 var(--focus-ring) var(--c)}
.stafffoot{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:0}

/* what makes it move */
.trig{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.trig li{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-1) var(--space-2);padding:var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.trig li > svg{margin-top:2px;color:var(--ink-muted)}
.trig li .w{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.trig li.missing{background:var(--x-proposed-unseen) left top / var(--space-2) 100% no-repeat;padding-left:var(--space-4);border-style:dashed;color:var(--ink-muted)}
.trig li.missing .w b{font-weight:400;color:var(--ink)}
.says{display:flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;margin-top:2px}
.says.yes{color:var(--x-proposed-lit)}
.says.no{color:var(--ink-muted)}

/* notices and reach */
.notice{border:1px solid var(--hairline-strong);border-left:2px solid var(--c);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);background:var(--surface-pane)}
.notice p{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.notice .nh{display:flex;justify-content:space-between;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.notice .why{color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);margin-top:var(--space-1)}
.notice .why b{font-weight:400;color:var(--ink)}
.reach{display:grid;gap:var(--space-2)}
.who{display:grid;grid-template-columns:2px minmax(0,1fr) auto;gap:0 var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta)}
.who::before{content:"";grid-row:span 2;background:var(--fc)}
.who b{font-weight:400;color:var(--light)}
.who span.s{grid-column:2 / span 2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.who .r{font-family:var(--font-mono);color:var(--light)}
.addmark{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink-muted);font-size:var(--type-meta);align-self:flex-start}
.goarea{margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr);justify-items:end;gap:var(--space-3);align-items:center;border-top:1px solid var(--hairline-strong);padding-top:var(--space-3)}
.goarea p{justify-self:stretch;margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(260px,22%) minmax(300px,30%) minmax(0,1fr)}.left .claims{display:none}.trig li{padding:var(--space-1) var(--space-2)}.notice.second{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Action · V5</b> flood marks: past levels cut in, your levels painted on, what makes it rise said plainly · tide gauge staffs, flood marks, flood warning levels</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* your marks: a level, and who is told when the count passes it */
const W = { marks: [ { id: 'm1', at: 12, who: DATA.me, c: '--floor-team-high' } ], sel: 'm1' };
const TELL_LEAD = { who: 'p2', c: '--floor-department-high' };

function staffHTML() {
  const max = DATA.watch.max, now = DATA.watch.now;
  const rows = Array.from({ length: max }, (_, i) => `<div class="rw ${i < now ? 'over' : ''}" title="${i + 1}">${I('truck', 14)}<span class="num">${i + 1 === max ? max + " vans" : ""}</span></div>`).join('');
  const pct = v => (v / max * 100);
  const past = DATA.finding.series.slice(0, -1);
  /* a month whose level equals another's shares its mark */
  const seen = {};
  const fms = past.map(p => { seen[p.v] = (seen[p.v] ? seen[p.v] + ' · ' : '') + p.m; return p; })
    .filter((p, i, a) => a.findIndex(q => q.v === p.v) === i)
    .map(p => `<span class="fm" style="bottom:${pct(p.v) - pct(.5)}%">${seen[p.v]} ${p.v}</span>`).join('');
  const nowM = `<span class="fm now" style="bottom:${pct(now) - pct(.5)}%">Now ${now}</span>`;
  const fc = DATA.finding.forecast;
  const fcM = `<span class="fm fc" style="bottom:${pct(fc.v) - pct(.5)}%">${fc.m}, likely ${fc.v}</span>`;
  const tws = W.marks.map(m => {
    const p = P(m.who);
    return `<div class="tw ${W.sel === m.id ? 'sel' : ''}" style="bottom:${pct(m.at)}%;--c:var(${m.c})" data-m="${m.id}"><span class="line"></span><span class="lab">${I('bell', 12)} Tell ${m.who === DATA.me ? 'me' : p.name} above ${m.at}
      <button data-up="${m.id}" aria-label="Raise">${I('chevron-up', 14)}</button><button data-dn="${m.id}" aria-label="Lower">${I('chevron-down', 14)}</button></span></div>`;
  }).join('');
  return `<div class="staff" role="group" aria-label="Overdue vans, one row per van"><div class="rows">${rows}</div><div class="marks">${fms}${nowM}${fcM}${tws}</div></div>`;
}
function crossing(at) {
  if (at < DATA.watch.now) return `It is already above ${at}: you’d be told at once.`;
  if (at < DATA.finding.forecast.v) return `Two more vans fall due on 21 Nov. Unless they are inspected, it passes ${at} that night${DATA.watch.triggers.some(t => t.icon === "clock" && !t.has) ? ", but AUGUR can’t notice a date passing yet: you’d hear when the next inspection is recorded" : ""}.`;
  if (at < DATA.watch.max) return `Nothing due so far would take it above ${at}.`;
  return `It can’t go above ${at}: there are ${DATA.watch.max} vans.`;
}
function trigHTML() {
  return `<ul class="trig">${DATA.watch.triggers.map(t => `<li class="${t.has ? '' : 'missing'}">${I(t.icon, 14)}<span>${t.plain}
    <span class="w">${t.has ? `${t.who} sends this today.` : `<b>AUGUR can’t notice this yet.</b> It needs ${t.needs}.`}</span>
    <span class="says ${t.has ? 'yes' : 'no'}">${t.has ? I('check', 11) + ' checked' : I('lock', 11) + ' not checked yet'}</span><span class="tk">${t.tech}</span></span></li>`).join('')}</ul>`;
}
function rightHTML() {
  const m = W.marks.find(x => x.id === W.sel) || W.marks[0];
  const lead = W.marks.find(x => x.who === TELL_LEAD.who);
  const p2 = P(TELL_LEAD.who);
  return `<div class="col"><h2>Who is told</h2><p class="lede">Before you set it: who gets a notice, on which floor, and what the watch can see.</p>
    <div class="reach">${W.marks.map(x => { const p = P(x.who); const fl = p.floor; return `<div class="who" data-tier="${fl}"><b>${x.who === DATA.me ? 'You' : p.name}, above ${x.at}</b><span class="r">1</span><span class="s">${x.who === DATA.me ? 'Nobody else can see your watch.' : `${p.role}, ${F(fl).word} floor. ${p.name.split(' ')[0]} can open ${allOpen(fl)} of ${allTotal()} records behind the count and is told it’s your watch.`}</span></div>`; }).join('')}</div>
    ${lead ? '' : `<button class="addmark" data-lead>${I('user-plus', 14)} Add a higher mark that tells ${p2.name} <span class="kbd">L</span></button>`}
    <p class="eyebrow" style="margin-top:var(--space-2)">What a notice would say</p>
    <div class="notice" style="--c:var(${m.c})"><div class="nh"><span>${DATA.finding.subject}</span><span>example</span></div><p>${m.at < DATA.watch.now ? `${DATA.watch.now} overdue, above your mark of ${m.at}.` : `${m.at + 1} overdue, above ${m.who === DATA.me ? "your" : "the"} mark of ${m.at}.`}</p>
      <p class="why"><b>Why it moved:</b> ${m.at < DATA.finding.forecast.v ? (DATA.watch.triggers.some(t => t.icon === 'clock' && !t.has) ? 'an inspection recorded on 24 Nov showed two vans passed their date on 21 Nov (a date passed, noticed late).' : 'two due dates passed overnight (a date passed).') : 'new inspection records show more vans past their date (something happened).'}</p></div>
    <div class="notice second" style="--c:var(--hairline-strong)"><div class="nh"><span>${DATA.finding.subject}</span><span>example</span></div><p>Still ${DATA.watch.now}, but on a different basis.</p>
      <p class="why"><b>Why:</b> Kestrel’s October report was withdrawn in Artifacts, so the count rests on two sources, not three (a source was withdrawn). Nothing about the vans changed.</p></div>
    <div class="goarea"><p>${crossing(m.at)}</p><button class="btn go">${I('binoculars', 14)} Set ${W.marks.length === 1 ? 'the mark' : W.marks.length + ' marks'}</button></div></div>`;
}
function render() {
  $('#app').innerHTML = topHTML(['Data Atlas', DATA.finding.subject, 'Watch'],
    [['↑ ↓', 'move mark'], ['Tab', 'next mark'], ['L', 'tell lead'], ['A', 'accept'], ['T', 'admin words', 'h-t'], ['G', 'model off', 'h-g'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
      <div class="col left scroll">${findingHTML()}</div>
      <div class="col"><h2>The level</h2><p class="lede">One row is one van. Past months are cut in at the level they reached. Paint a mark where you want to be told.</p>${staffHTML()}
        <p class="stafffoot">Counts ${DATA.finding.recipe.plain}.<span class="tk">${DATA.finding.recipe.tech}</span></p></div>
      <div class="col" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-5);align-content:stretch">
        <div class="col"><h2>What moves it</h2><p class="lede">The watch checks again when one of these happens. ${DATA.watch.triggers.filter(t => !t.has).length} of them can’t be noticed yet, and say so.</p>${trigHTML()}</div>
        ${rightHTML()}</div>
    </div></main>`;
  Icons.hydrate($('#app'));
  $$('[data-up]').forEach(b => b.onclick = () => move(b.dataset.up, 1));
  $$('[data-dn]').forEach(b => b.onclick = () => move(b.dataset.dn, -1));
  $$('.tw').forEach(b => b.addEventListener('click', () => { W.sel = b.dataset.m; render(); }));
  $('[data-lead]') && ($('[data-lead]').onclick = addLead);
}
window.__rerender = render;
function move(id, d) { const m = W.marks.find(x => x.id === id); m.at = Math.max(0, Math.min(DATA.watch.max - 1, m.at + d)); W.sel = id; render(); }
function addLead() { if (W.marks.some(x => x.who === TELL_LEAD.who)) return; const top = Math.max(...W.marks.map(x => x.at)); W.marks.push({ id: 'm2', at: Math.min(DATA.watch.max - 1, top + 2), who: TELL_LEAD.who, c: TELL_LEAD.c }); W.sel = 'm2'; render(); }

function replay() {
  clearLater();
  W.marks = [{ id: 'm1', at: 12, who: DATA.me, c: '--floor-team-high' }]; W.sel = 'm1'; STATE.accepted = false;
  document.body.classList.add('pre'); render();
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('pre')));
  /* the moment: the mark is lowered to just above today's level, and the lead's mark goes in above it */
  const t = ms('--motion-run'), step = ms('--motion-quick');
  for (let k = 1; k <= 4; k++) later(() => move('m1', -1), t + step * k);
  later(addLead, t + step * 4 + ms('--motion-calm'));
  later(() => { W.sel = 'm1'; render(); }, t + step * 4 + ms('--motion-calm') * 2);
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); move(W.sel, e.key === 'ArrowUp' ? 1 : -1); }
  else if (e.key === 'Tab' && W.marks.length > 1 && !e.target.closest('button')) { e.preventDefault(); const i = W.marks.findIndex(x => x.id === W.sel); W.sel = W.marks[(i + 1) % W.marks.length].id; render(); }
  else if (e.key.toLowerCase() === 'l') addLead();
});
replay();
</script>
</body>
</html>
