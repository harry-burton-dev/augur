<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Briefing · V6 · The appreciation in the letterbox</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*COMMON_CSS*/
#wrap{height:100vh;display:flex;flex-direction:column}
.lb{flex:1;min-height:0;display:grid;grid-template-rows:1fr auto 1fr;position:relative}
.bar{display:flex;align-items:center;gap:var(--space-4);padding:0 var(--edge);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.bar.t{background:linear-gradient(to bottom,var(--scrim),transparent);align-items:flex-end;padding-bottom:var(--space-2)}
.bar.b{background:linear-gradient(to top,var(--scrim),transparent);align-items:flex-start;padding-top:var(--space-2);flex-wrap:wrap;align-content:flex-start}
.pre .bar.t{opacity:0;transform:translateY(calc(var(--travel-near) * -1))}
.pre .bar.b{opacity:0;transform:translateY(var(--travel-near))}
@media (prefers-reduced-motion: reduce){.pre .bar.t,.pre .bar.b{transform:none}}
.bar b{font-weight:400;color:var(--ink)}
.bar .due{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light)}
.bar .sp{margin-left:auto}
.bar .em{display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap}
.frame{aspect-ratio:var(--letterbox-ratio);max-height:calc(100vh - var(--band-top) - 2 * var(--space-7));width:100%;margin:0 auto;border-top:1px solid var(--hairline-strong);border-bottom:1px solid var(--hairline-strong);padding:var(--space-4) var(--edge);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.6fr);gap:var(--space-5);min-height:0}
.aim h1{margin:var(--space-1) 0 var(--space-3);font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.aim .bl{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.aim .blbox{padding:var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);margin-top:var(--space-2)}
.aim .blbox.penlane{border:var(--x-proposed-pencil-edge)}
.aim .blbox.penlane .bl{font-style:italic;color:var(--x-proposed-pencil)}
.aim .for{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.aim .for b{font-weight:400;color:var(--ink);border-bottom:2px solid var(--x-proposed-reader)}
.coa{display:grid;grid-template-columns:var(--measure-rail) repeat(3,minmax(0,1fr));align-content:start;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.coa .rh{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);padding:var(--space-2) var(--space-3) var(--space-2) 0;border-bottom:1px solid var(--hairline)}
.coa .c{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);border-left:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:background var(--motion-base) var(--ease-out)}
.coa .hd{padding:var(--space-2) var(--space-3) var(--space-3);border-left:1px solid var(--hairline);border-bottom:1px solid var(--hairline-strong)}
.coa .hd b{display:block;font-weight:400;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.coa .hd .tag{margin-top:var(--space-1);min-height:var(--leading-small)}
.coa .no{color:var(--x-proposed-disagree)}
.coa .yes{color:var(--ink)}
.coa .big{font:400 var(--type-meta)/var(--leading-meta) var(--font-mono);color:var(--light)}
.col-sug{background:var(--x-proposed-pencil-wash)}
.col-sug.hd{outline:var(--x-proposed-pencil-edge);outline-offset:-1px}
.col-pick{background:var(--x-proposed-lit-wash)}
.col-pick.hd{box-shadow:inset 0 2px 0 var(--x-proposed-lit)}
.pick{margin-top:var(--space-2)}
.cons{grid-column:1 / -1;margin-top:var(--space-3);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-3);border:1px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:var(--radius-key);background:var(--x-proposed-lit-wash);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.cons b{font-weight:400;color:var(--ink)}
.cons ul{margin:0;padding:0;list-style:none;display:flex;gap:var(--space-1) var(--space-4);flex-wrap:wrap}
.cons li{display:inline-flex;align-items:center;gap:var(--space-2)}
.hidden{display:none}
.spark{margin-left:var(--space-1)}
</style>
</head>
<body>
<div id="wrap">
  <div id="band"></div>
  <div class="lb">
    <div class="bar t" id="bt"></div>
    <section class="frame" id="frame" aria-label="The decision"></section>
    <div class="bar b" id="bb"></div>
  </div>
</div>
<div id="dr"></div>
<div class="x-cap"><b>One-minute briefing · V6</b> the appreciation: aim, courses open, the choice, framed because a deadline is near · military appreciation, PDR-009 letterbox, small multiples</div>
<script>
/*DATA*/
/*COMMON_JS*/
const T = DATA.topic, I = DATA.intent, D = DATA.draft;
const SUG = 'o2'; /* the course the assistant's draft points to */
let pick = null;
function rows() {
  const facts = { o1: ['k1', 'k3'], o2: ['k1', 'k4'], o3: ['k4'] };
  return [
    ['Cost', o => `<span class="big">${o.cost}</span><br><span class="muted">${o.costD}</span>`],
    [`In place by ${C.ends}?`, o => o.inTime === 'yes' ? `<span class="yes">${ic('check', 14)} yes</span>` : `<span class="no">${ic('x', 14)} no</span>`],
    ['What it risks', o => o.risk],
    ['What we don’t know', o => o.unknown ? `<ul class="elist">${emptyLi(EM(o.unknown))}</ul>` : `<span class="muted">${mark('none')} open questions</span>`],
    ['It rests on', o => facts[o.id].map(f => chip(f, `fact ${DATA.claims.indexOf(CL(f)) + 1}`)).join(' ') + (o.id === 'o1' ? spark(48, 12) : '')]
  ];
}
function render() {
  $('#band').innerHTML = band();
  $('#dr').innerHTML = drawer();
  $('#bt').innerHTML = `<span>${ic('target', 16)}</span><span><b>${I.title}</b> · ${DATA.apps.mandate}, owned by ${P(I.owner).name}<span class="tk"> · ${I.id}</span></span><span class="sp">Recommendation due</span><span class="due">${I.askDue}</span><span>${I.askDays} days</span><span>· decision ${I.due}</span>`;
  $('#bb').innerHTML = `<span class="eyebrow">What this can’t see</span>${['unseen', 'gap', 'stale', 'noRecord'].map(id => { const e = EM(id); return `<span class="em">${mark(e.mark)}${e.says}${e.who ? ` · ${e.mark === 'unseen' ? 'ask' : ''} ${P(e.who).short}` : ''}</span>`; }).join('')}
`;
  draw();
}
function draw() {
  const blTxt = STATE.gw ? D.bottom.filter(p => !p.unsupported).map(p => p.claim ? `<button class="ref" data-claim="${p.claim}">${p.t}</button>` : p.t).join('') : fill(D.template);
  const opts = DATA.options;
  const cls = o => (pick ? (pick === o.id ? 'col-pick' : '') : (STATE.gw && o.id === SUG ? 'col-sug' : ''));
  $('#frame').innerHTML = `<div class="aim dep" style="--i:0"><p class="eyebrow">Aim</p><h1>${T.question}</h1><p class="for">For <b>${P(T.reader).name}</b> · from ${P(T.author).name}, ${T.written}</p>
      <p class="eyebrow" style="margin-top:var(--space-4)">${pick ? 'Recommendation' : 'Bottom line'}</p>
      <div class="blbox ${STATE.gw && !pick ? 'penlane' : ''}"><p class="bl">${pick ? `${P(DATA.me).short} recommends <b style="font-weight:400;color:var(--light)">${OPT(pick).name}</b>${STATE.gw && pick === SUG ? D.bottom.filter(p => !p.unsupported && !p.rec).map(p => p.claim ? `<button class="ref" data-claim="${p.claim}">${p.t}</button>` : p.t).join('') : `. <span class="gapbox" style="display:block;margin-top:var(--space-1);padding:0 var(--space-2);color:var(--ink-muted)">the reasons: you write them</span>`}` : blTxt}</p>
      <p style="margin:var(--space-2) 0 0">${pick ? `<span class="inktag">${ic('pen-line', 12)} ink · chosen by ${P(DATA.me).name}${STATE.gw && pick === SUG ? `, as ${GW.plain} drafted` : ''}</span>` : STATE.gw ? `<span class="pentag">${ic('pencil', 12)} pencil · ${GW.plain} leans to course 2</span>` : `<span class="gapbox" style="display:block;padding:var(--space-1) var(--space-2);font-size:var(--type-small);color:var(--ink-muted)">your recommendation: pick a course</span>`}</p></div><div class="hints" style="margin-top:var(--space-4)"><span><span class="kbd">1</span>–<span class="kbd">3</span> recommend a course</span><span><span class="kbd">G</span> assistant</span><span><span class="kbd">T</span> technical words</span><span><span class="kbd">R</span> replay</span></div></div>
    <div class="coa dep" style="--i:1" role="table" aria-label="Courses open"><div class="rh" style="border-bottom-color:var(--hairline-strong)">Courses open</div>
      ${opts.map((o, i) => `<div class="hd ${cls(o)}"><b>${i + 1} · ${o.name}</b><div class="tag">${pick === o.id ? `<span class="inktag">${ic('pen-line', 12)} recommended</span>` : !pick && STATE.gw && o.id === SUG ? `<span class="pentag">${ic('pencil', 12)} ${GW.plain}’s draft</span>` : ''}</div>
        <button class="btn pick ${pick === o.id ? 'primary' : ''}" data-pick="${o.id}" ${o.inTime === 'no' ? 'title="Allowed, but it leaves a gap in service"' : ''}>${ic('pen-line', 14)} ${pick === o.id ? 'Recommended' : 'Recommend this'} <span class="kbd">${i + 1}</span></button></div>`).join('')}
      ${rows().map(([h, f]) => `<div class="rh">${h}</div>${opts.map(o => `<div class="c ${cls(o)}">${f(o)}</div>`).join('')}`).join('')}
      <div class="cons ${pick ? '' : 'hidden'}" id="cons">${ic('send', 18)}<div><b>Send to ${P(T.reader).name} (${FL(P(T.reader).floor).name})</b> and this happens:
        <ul><li>${ic('file-text', 14)} the briefing is kept in ${DATA.apps.artifacts}, on ${FL(T.floor).name}</li><li>${ic('target', 14)} it is added to ${I.title} in ${DATA.apps.mandate}</li>${pick === 'o2' ? `<li>${ic('message-circle-question', 14)} ${P(EM('ask').who).name} is asked whether Clearway would take a six-month extension</li>` : ''}<li>${ic('eye', 14)} the four facts are watched; you hear if one changes before ${I.due}</li></ul></div><button class="btn primary">${ic('send', 14)} Send</button></div>
    </div>`;
  Icons.hydrate($('#frame'));
}
function choose(id) { pick = pick === id ? null : id; draw(); }
HOOKS.gw.push(() => { if ($('#frame')) draw(); });
document.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b) choose(b.dataset.pick); });
document.addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return; const n = +e.key; if (n >= 1 && n <= DATA.options.length) choose(DATA.options[n - 1].id); });
boot(() => { pick = null; render(); }, () => { later(() => choose(SUG), ms('--motion-hold') / 3); });
</script>
</body>
</html>
