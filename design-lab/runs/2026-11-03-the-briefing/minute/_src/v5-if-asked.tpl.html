<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Briefing · V5 · If asked</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*COMMON_CSS*/
#wrap{height:100vh;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,var(--measure-read)) minmax(0,var(--measure-read));justify-content:center;gap:var(--space-6);padding:var(--space-5) var(--edge) 0}
.col{min-height:0;overflow:auto;padding-bottom:var(--space-7);scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
h1{margin:var(--space-1) 0 var(--space-1);font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.for{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:0 0 var(--space-4)}
.for b{font-weight:400;color:var(--ink);border-bottom:2px solid var(--x-proposed-reader)}
.card{border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);padding:var(--space-4);margin-bottom:var(--space-4);background:var(--surface-inset)}
.card.penlane{border:var(--x-proposed-pencil-edge);background:var(--x-proposed-pencil-wash)}
.card .bl{margin:var(--space-2) 0 var(--space-3);font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.card.penlane .bl{font-style:italic;color:var(--x-proposed-pencil)}
.card .row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.card .row > span:first-child{margin-right:auto}
.heads{list-style:none;margin:0 0 var(--space-4);padding:0;display:grid;gap:var(--space-2)}
.heads li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline;font-size:var(--type-body);line-height:var(--leading-body);color:var(--light)}
.heads .n{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.heads .how{font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.ask{font-size:var(--type-body);line-height:var(--leading-body);color:var(--light);border-top:1px solid var(--hairline);padding-top:var(--space-3);margin:0}
.ask small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:var(--space-1)}
.qh{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-2)}
.qh .lede{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:0}
.qs{list-style:none;margin:0;padding:0;border-top:1px solid var(--hairline)}
.q{border-bottom:1px solid var(--hairline)}
.q > button{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2);align-items:center;width:100%;padding:var(--space-3) var(--space-1);font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink);border-radius:var(--radius-key)}
.q > button:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.q.pq > button .qt{font-style:italic;color:var(--x-proposed-pencil)}
.q > button .qi{color:var(--ink-muted);display:inline-flex}
.q > button .by{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.q.pq > button .by{color:var(--x-proposed-pencil)}
.q .chev{transition:transform var(--motion-base) var(--ease-out);display:inline-flex}
.q.open .chev{transform:rotate(90deg)}
.a{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--motion-base) var(--ease-out)}
.q.open .a{grid-template-rows:1fr}
.a > div{overflow:hidden}
.a .in{padding:0 var(--space-1) var(--space-3) calc(var(--space-5) + var(--space-3))}
.a p{margin:0 0 var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.a .meta{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.a .ansby{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);margin-top:var(--space-2)}
.a .none{padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-radius:2px}
.a .none b{font-weight:400;color:var(--ink)}
.a .elist{margin-top:var(--space-1)}
.iso{display:inline-flex;color:var(--ink)}
.iso.f{color:var(--warning)}
.iso.g{background:var(--x-proposed-gap);color:transparent}
.rule{margin-top:var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-left:2px solid var(--hairline-strong);padding-left:var(--space-3)}
.rule b{font-weight:400;color:var(--ink)}
</style>
</head>
<body>
<div id="wrap">
  <div id="band"></div>
  <div class="stage">
    <div class="col" id="brief"></div>
    <div class="col" id="qa"></div>
  </div>
</div>
<div id="dr"></div>
<div class="x-cap"><b>One-minute briefing · V5</b> if asked: the questions a lead will ask, answered from records before they’re asked · press-office Q&amp;A briefs, staff “anticipated questions”, BLUF</div>
<script>
/*DATA*/
/*COMMON_JS*/
const T = DATA.topic, I = DATA.intent, D = DATA.draft;
let inked = false, open = new Set();
function brief() {
  const blTxt = STATE.gw ? D.bottom.filter(p => !p.unsupported).map(p => p.claim ? `<button class="ref" data-claim="${p.claim}">${p.t}</button>` : p.t).join('')
    : `${fill(D.template)} <span class="gapbox" style="display:block;margin-top:var(--space-2);height:var(--leading-lead);font-size:var(--type-small);color:var(--ink-muted);padding:0 var(--space-2)">your recommendation: you write it</span>`;
  $('#brief').innerHTML = `<p class="eyebrow dep" style="--i:0">${T.kind} for decision · ${T.written}</p><h1 class="dep" style="--i:0">${T.title}</h1>
    <p class="for dep" style="--i:0">For <b>${P(T.reader).name}</b>, ${P(T.reader).role} · from ${P(T.author).name}</p>
    <div class="card dep ${STATE.gw && !inked ? 'penlane' : ''}" style="--i:1"><p class="eyebrow">Bottom line</p><p class="bl">${blTxt}</p>
      <div class="row">${STATE.gw ? (inked ? `<span class="inktag">${ic('pen-line', 12)} Inked by ${P(DATA.me).name} · drafted by ${GW.plain}</span>` : `<span class="pentag">${ic('pencil', 12)} pencil · drafted by ${GW.plain}</span><button class="btn primary" id="bink">${ic('pen-line', 14)} Ink it <span class="kbd">I</span></button>`) : `<span class="inktag">${GW.offWhy}</span>`}</div></div>
    <p class="eyebrow dep" style="--i:2;margin-bottom:var(--space-2)">The four facts it rests on</p>
    <ul class="heads">${DATA.claims.map((c, i) => `<li class="dep" style="--i:${i + 2}"><span class="n">${i + 1}</span><span>${c.head}</span><span class="how">${sure(c.sure)}</span></li>`).join('')}</ul>
    <p class="ask dep" style="--i:7">${fill(D.ask)}<small>${ic('target', 12)} ${I.title} · ${DATA.apps.mandate}, due ${I.due}</small></p>
    <div class="rule dep" style="--i:8">The brief is the four headlines. Everything else waits on the right, as answers to the questions ${P(T.reader).short} is likely to ask, so the page stays a minute long and nothing is thrown away.</div>`;
}
function answer(q) {
  if (q.a && CL(q.a)) {
    const c = CL(q.a);
    let pic = '';
    if (c.id === 'k1') pic = spark(96, 20, { them: true });
    if (c.id === 'k2') pic = V.map(v => `<span class="iso ${v.r === 'fail' ? 'f' : v.r === 'gap' ? 'g' : ''}">${ic('truck', 14)}</span>`).join('');
    const em = DATA.empties.filter(e => e.for === c.id && ['noRecord', 'gap', 'none'].includes(e.id));
    return `<p>${say(c.id)} ${pic}</p>${c.disagree ? `<p style="color:var(--x-proposed-disagree);font-size:var(--type-small);line-height:var(--leading-small)">${mark('dis')} ${DATA.theirs.who} counts ${DATA.theirs.n} for ${monthName(DATA.theirs.m)}; we show both.</p>` : ''}
      <div class="meta"><span>${yard(c.sure)} ${sure(c.sure)}: ${c.sureWhy}.</span> ${chip(c.id)}</div>${em.length ? `<ul class="elist">${em.map(emptyLi).join('')}</ul>` : ''}
      <p class="ansby">Answer filled from records by template · never written by ${GW.plain}</p>`;
  }
  if (q.a && EM(q.a)) { const e = EM(q.a); return `<div class="none" style="background:var(--surface-inset);border:1px solid var(--hairline)"><ul class="elist">${emptyLi(e)}</ul></div><p class="ansby">The honest answer is where it’s kept and whom to ask. A count stays “some”.</p>`; }
  if (q.a && OPT(q.a)) { const o = OPT(q.a); return `<p>The contract ends on ${C.ends}. A retender alone ${o.inTime === 'no' ? 'would not finish in time' : 'would finish in time'}: ${o.risk}.</p><div class="meta"><span>${sure(CL('k4').sure)}: rests on fact 4.</span> ${chip('k4')}</div><p class="ansby">Answer filled from fact 4 and the contract by template</p>`; }
  return `<div class="none gapbox"><b>Nothing in the records answers this.</b> It is not known yet. ${q.who ? `${P(q.who).name}, ${P(q.who).role}, could find out.` : ''} ${GW.Plain} suggested the question; it may not answer it.</div>
    <div class="meta" style="margin-top:var(--space-2)"><button class="btn">${ic('send', 14)} Ask ${q.who ? P(q.who).short : 'someone'}</button><button class="btn" >${ic('x', 14)} Drop the question</button></div>`;
}
function qa() {
  const qs = D.questions.filter(q => STATE.gw || q.by !== 'model');
  $('#qa').innerHTML = `<div class="qh dep" style="--i:2"><p class="eyebrow">If ${P(T.reader).short} asks</p><p class="lede">${qs.length} questions ready · <span class="kbd">↑</span><span class="kbd">↓</span> move, <span class="kbd">Space</span> open</p></div>
    <ul class="qs">${qs.map((q, i) => `<li class="q dep ${q.by === 'model' ? 'pq' : ''} ${open.has(i) ? 'open' : ''}" style="--i:${i + 3}" data-q="${i}"><button aria-expanded="${open.has(i)}" data-qb="${i}"><span class="qi">${ic(q.by === 'model' ? 'circle-help' : 'message-circle-question', 18)}</span><span class="qt">${q.q}</span><span class="by">${q.by === 'model' ? `pencil · ${GW.plain}` : `${P(DATA.me).short}`} <span class="chev">${ic('chevron-right', 14)}</span></span></button><div class="a"><div><div class="in">${answer(q)}</div></div></div></li>`).join('')}</ul>
    <div class="rule dep" style="--i:11"><b>Who writes what.</b> ${P(DATA.me).short} or ${GW.plain} may suggest a question; ${GW.plain}’s stay in pencil until kept. An answer is always filled from records by template, or says which way it is empty. With ${GW.plain} off (<span class="kbd">G</span>) its questions go and every answer stays the same.</div>
    <div class="hints" style="margin-top:var(--space-3)"><span><span class="kbd">I</span> ink</span><span><span class="kbd">G</span> assistant</span><span><span class="kbd">T</span> technical words</span><span><span class="kbd">R</span> replay</span></div>`;
}
function render() { $('#band').innerHTML = band(); $('#dr').innerHTML = drawer(); brief(); qa(); Icons.hydrate(); }
function toggle(i, v) { const li = $(`.q[data-q="${i}"]`); if (!li) return; const on = v == null ? !open.has(i) : v; on ? open.add(i) : open.delete(i); li.classList.toggle('open', on); li.querySelector('button').setAttribute('aria-expanded', on); }
HOOKS.gw.push(() => { if ($('#qa')) { open.clear(); brief(); qa(); Icons.hydrate(); } });
document.addEventListener('click', e => { const b = e.target.closest('[data-qb]'); if (b) toggle(+b.dataset.qb); if (e.target.closest('#bink')) { inked = true; brief(); Icons.hydrate(); } });
document.addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'i' || e.key === 'I') { if (STATE.gw && !inked) { inked = true; brief(); Icons.hydrate(); } }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { const bs = $$('[data-qb]'); const k = bs.indexOf(document.activeElement); const n = e.key === 'ArrowDown' ? Math.min(k + 1, bs.length - 1) : Math.max(k - 1, 0); if (bs[n]) { e.preventDefault(); bs[n].focus(); } } });
boot(() => { inked = false; open = new Set(); render(); }, () => {
  later(() => toggle(0, true), ms('--motion-calm'));
  later(() => toggle(4, true), ms('--motion-calm') * 2);
  later(() => toggle(6, true), ms('--motion-calm') * 3);
});
</script>
</body>
</html>
