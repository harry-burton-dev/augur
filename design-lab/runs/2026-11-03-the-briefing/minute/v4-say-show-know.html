<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Briefing · V4 · Say, show, know</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ===== Shared CSS for the one-minute briefing (built into every page) ===== */
:root{
  /* pencil and ink (reference desk): the ink of anything the assistant drafted and nobody has inked */
  --x-proposed-pencil: color-mix(in srgb, var(--info) 42%, var(--ink-muted));
  /* the dotted edge of a pencil lane; dots = "drafted, not checked" */
  --x-proposed-pencil-edge: 1px dotted var(--x-proposed-pencil);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--info) 5%, transparent);
  /* a phrase in a draft with no record behind it */
  --x-proposed-unbacked: color-mix(in srgb, var(--danger) 55%, var(--ink-muted));
  /* six ways to be empty (catalogue): corner ticks, 45° stale hatch, 135° not-yours hatch */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-proposed-gap-tick: var(--space-2);
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* sources disagree: a warning-tinted edge, never red */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  --x-proposed-quiet: .62;
  /* the floor the briefing is kept on (Team here) and its reader's floor (Department) */
  --x-proposed-here: var(--floor-team-high);
  --x-proposed-reader: var(--floor-department-high);
  --x-proposed-type-micro: .6875rem;
  /* the lit next step (light language) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* paper: the briefing sheet sits one step lighter than the ground */
  --x-proposed-sheet: color-mix(in srgb, var(--slate) 82%, var(--ink) 4%);
}
:root, .mk-gap, .gapbox{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.quiet{opacity:var(--x-proposed-quiet)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* two registers: technical words one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.show-tech .tk{display:inline}
.show-tech div.tk,.show-tech p.tk{display:block}

/* top band */
.band{display:flex;align-items:center;gap:var(--space-4);height:var(--band-top);padding:0 var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--surface-bar) 70%,transparent)}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0}
.crumbs{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);color:var(--ink-muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{font-weight:400;color:var(--light)}
.crumbs .sep{opacity:var(--x-proposed-quiet);display:inline-flex}
.floortag{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.floortag::before{content:"";width:var(--space-4);height:2px;background:var(--fc,var(--x-proposed-here))}
.toggles{margin-left:auto;display:flex;gap:var(--space-2);align-items:center}
.sw{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.sw .ss{font-family:var(--font-mono);color:var(--ink)}
.sw[aria-checked="false"] .ss{color:var(--ink-muted)}
[data-tier="department"]{--fc:var(--floor-department-high)}
[data-tier="team"]{--fc:var(--floor-team-high)}
[data-tier="org"]{--fc:var(--floor-org-high)}
[data-tier="you"]{--fc:var(--floor-you-high)}

/* ===== pencil and ink ===== */
.pen{font-style:italic;color:var(--x-proposed-pencil)}
.penlane{border:var(--x-proposed-pencil-edge);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);position:relative}
.pentag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-pencil);white-space:nowrap}
.inktag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);white-space:nowrap}
.unbacked{text-decoration:line-through wavy var(--x-proposed-unbacked) 1px;color:var(--x-proposed-unbacked)}
.unbacked-note{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--x-proposed-unbacked)}
.cut{transition:opacity var(--motion-calm) var(--ease-out),max-height var(--motion-calm) var(--ease-out)}
/* a phrase that points at a claim */
.ref{color:inherit;text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap);border-radius:2px}
.ref:hover{text-decoration-color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:3px var(--space-2);white-space:nowrap;vertical-align:2px;transition:color var(--motion-quick),border-color var(--motion-quick),background var(--motion-quick)}
.chip:hover,.chip.on{color:var(--light);border-color:var(--ink-muted);background:var(--surface-raised)}
.chip.dis{border-color:color-mix(in srgb,var(--warning) 40%,transparent);color:var(--x-proposed-disagree)}

/* confidence word (yardstick) */
.sure{font-style:normal;color:var(--light);border-bottom:1px solid var(--hairline-strong)}
.yard{display:inline-grid;grid-template-columns:repeat(7,var(--space-2));gap:1px;vertical-align:middle}
.yard i{display:block;height:var(--space-1);background:var(--hairline-strong);border-radius:1px}
.yard i.on{background:var(--ink)}

/* ===== six ways to be empty ===== */
.mk{display:inline-block;vertical-align:middle;flex:none}
.mk-gap{background:var(--x-proposed-gap);width:var(--space-5);height:var(--space-4);--x-proposed-gap-tick:var(--space-1)}
.gapbox{background:var(--x-proposed-gap);border-radius:2px}
.mk-none{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink);border-bottom:1px solid var(--ink-muted);padding:0 1px}
.mk-na{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.mk-stale{background:var(--x-proposed-stale);width:var(--space-5);height:var(--space-3);border-radius:2px}
.mk-break{width:var(--space-5);height:var(--space-3)}
.mk-break path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.mk-unseen{display:inline-flex;align-items:center;justify-content:center;width:var(--space-5);height:var(--space-4);background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:2px;color:var(--ink-muted)}
.mk-dis{width:var(--space-4);height:var(--space-3);border-left:2px solid var(--x-proposed-disagree);border-right:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash)}
.elist{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.elist li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-3);align-items:start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.elist li .mk{margin-top:2px}
.elist li b{font-weight:400;color:var(--ink)}
.elist li .who{color:var(--ink)}

/* sparkline at word size */
.spark{display:inline-block;vertical-align:-2px;overflow:visible}
.spark .ln{fill:none;stroke:var(--ink);stroke-width:1.25}
.spark .hole{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2;stroke-width:1}
.spark .end{fill:var(--light)}
.spark .them{fill:none;stroke:var(--x-proposed-disagree);stroke-width:1}

/* ===== records drawer (the third height) ===== */
.drawer{position:fixed;top:var(--band-top);right:0;bottom:0;width:calc(var(--measure-drawer) + var(--space-6));z-index:var(--layer-overlay);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));-webkit-backdrop-filter:blur(var(--surface-blur));border-left:1px solid var(--hairline-strong);box-shadow:var(--shadow-overlay);transform:translateX(100%);transition:transform var(--motion-base) var(--ease-out);display:flex;flex-direction:column}
.drawer.open{transform:none}
@media (prefers-reduced-motion: reduce){.drawer{transform:none;opacity:0;pointer-events:none;transition:opacity var(--motion-base)}.drawer.open{opacity:1;pointer-events:auto}}
.drawer header{padding:var(--space-4) var(--space-4) var(--space-3);border-bottom:1px solid var(--hairline)}
.drawer h2{margin:var(--space-1) 0 var(--space-1);font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.drawer .say{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.drawer .x{position:absolute;right:var(--space-3);top:var(--space-3);width:var(--target-sm);height:var(--target-sm);display:grid;place-items:center;border-radius:var(--radius-key);color:var(--ink-muted)}
.drawer .body{flex:1;min-height:0;padding:var(--space-3) var(--space-4) var(--space-6)}
.drawer h3{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:var(--space-4) 0 var(--space-2)}
.drawer h3:first-child{margin-top:0}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);padding:var(--space-1) 0;border-bottom:1px solid var(--hairline);color:var(--ink)}
.rec .id{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.rec .d{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.rec.more{color:var(--ink-muted);font-style:italic;grid-template-columns:1fr}
.rec.dis{border-left:2px solid var(--x-proposed-disagree);padding-left:var(--space-2);background:var(--x-proposed-disagree-wash)}
.rec.gaprow .gapbox{display:block;height:var(--leading-small)}
.srcl{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.srcl div{display:flex;gap:var(--space-2);align-items:center}
.srcl b{font-weight:400;color:var(--ink)}
.mhead{display:flex;justify-content:space-between;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);margin:var(--space-3) 0 var(--space-1)}

/* deposit once (the moment) */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}
.fade{transition:opacity var(--motion-calm) var(--ease-out)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink);white-space:nowrap;transition:background var(--motion-quick),border-color var(--motion-quick)}
.btn:hover{background:var(--surface-raised);border-color:var(--ink-muted)}
.btn.primary{color:var(--light);border-color:color-mix(in srgb,var(--green) 55%,transparent);background:color-mix(in srgb,var(--green) 10%,transparent)}
.btn.pencil{color:var(--x-proposed-pencil);border:var(--x-proposed-pencil-edge)}
.btn[disabled]{opacity:var(--x-proposed-quiet);cursor:not-allowed}
.next{box-shadow:0 0 0 var(--focus-ring) var(--x-proposed-lit);background:var(--x-proposed-lit-wash)!important}

/* gateway off: pencil vanishes, its slot says who writes it */
.nogw .gw-on{display:none!important}
.gw-off{display:none!important}
.nogw .gw-off{display:revert!important}

#wrap{height:100vh;display:flex;flex-direction:column}
.main{flex:1;min-height:0;overflow:auto;padding:var(--space-4) var(--edge) var(--space-7);scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.head{display:flex;align-items:flex-end;gap:var(--space-4);margin-bottom:var(--space-3)}
.head h1{margin:var(--space-1) 0 0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.head .for{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.head .for b{font-weight:400;color:var(--ink);border-bottom:2px solid var(--x-proposed-reader)}
.heights{margin-left:auto;display:flex;gap:2px;border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px}
.heights button{height:calc(var(--target-sm) - var(--space-1));padding:0 var(--space-3);border-radius:2px;font-size:var(--type-small);color:var(--ink-muted);display:inline-flex;align-items:center;gap:var(--space-2)}
.heights button[aria-pressed="true"]{background:var(--surface-raised);color:var(--light)}
.script{display:grid;grid-template-columns:var(--space-7) minmax(0,1.25fr) minmax(0,1fr) minmax(0,1.1fr);border-top:1px solid var(--hairline-strong)}
.h2-only .script{grid-template-columns:var(--space-7) minmax(0,1.25fr) minmax(0,1fr)}
.h1-only .script{grid-template-columns:var(--space-7) minmax(0,1fr)}
.h2-only .c-know,.h1-only .c-know,.h1-only .c-show{display:none}
.colh{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline-strong);display:flex;gap:var(--space-2);align-items:center}
.colh b{font-weight:400;color:var(--ink)}
.row{display:contents}
.cell{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);min-width:0;transition:background var(--motion-base) var(--ease-out),opacity var(--motion-base) var(--ease-out)}
.cell.c-who{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);padding-left:0;display:flex;flex-direction:column;gap:var(--space-1)}
.cell.c-who .rn{font-size:var(--type-small);color:var(--ink)}
.cell.c-say p{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.cell.c-say .hd{color:var(--light)}
.cell.c-show,.cell.c-know{border-left:1px solid var(--hairline)}
.row.penrow .c-say p{font-style:italic;color:var(--x-proposed-pencil)}
.row.lit .cell{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.row.lit .c-who .rn{color:var(--x-proposed-lit)}
.pre .cell{opacity:0}
.cell{transition-delay:calc(var(--i,0) * var(--motion-instant))}
.blrow .c-say p{font-size:var(--type-lead);line-height:var(--leading-lead)}
/* show: small pictures */
.pic{display:block;width:100%;max-width:calc(var(--measure-card) - var(--space-6));height:auto;overflow:visible}
.pic text{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--ink-muted)}
.pic .b{fill:var(--ink)}
.pic .b.l{fill:var(--light)}
.pic .hole{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.pic .them{fill:none;stroke:var(--x-proposed-disagree);stroke-width:1.5}
.pic .them-t{fill:var(--x-proposed-disagree)}
.pic .ax{stroke:var(--hairline-strong)}
.pic .end{stroke:var(--light);stroke-dasharray:3 2}
.pic .nc{fill:var(--x-proposed-disagree-wash);stroke:var(--x-proposed-disagree);stroke-dasharray:3 2}
.isos{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.iso{display:inline-flex;color:var(--ink)}
.iso.f{color:var(--warning)}
.iso.g{background:var(--x-proposed-gap);color:transparent}
.pcap{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:var(--space-1) 0 0}
/* know */
.k1l{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.mrec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);margin-top:var(--space-1)}
.mrec .id,.mrec .d{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.mrec.dis{border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);padding-left:var(--space-2)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-1)}
.split div{border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);padding:var(--space-1) var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.split b{display:block;font:400 var(--type-meta)/var(--leading-meta) var(--font-mono);color:var(--light)}
.arrows{display:flex;gap:var(--space-2);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted)}
.arrows .ref{color:var(--ink)}
.elist li{font-size:var(--type-small)}
.foot{display:flex;gap:var(--space-3);align-items:center;margin-top:var(--space-3);flex-wrap:wrap}
</style>
</head>
<body>
<div id="wrap">
  <div id="band"></div>
  <main class="main" id="main"></main>
</div>
<div id="dr"></div>
<div class="x-cap"><b>One-minute briefing · V4</b> say, show, know: every line at three heights, side by side · two-column TV scripts, Bret Victor’s ladder, Tufte</div>
<script>
/* ===== Sample data. Every name, word, count, date and sentence template on these pages comes from here.
   A different deployment brings its own floors, people, kinds, documents, intents and templates;
   nothing below is drawn for one trade. ===== */
const DATA = {
  deployment: 'Regional services (sample)',
  today: '3 Nov 2026',
  readWpm: 200, /* reading speed used for "time to read"; an org setting, not a constant */
  budgetS: 60,  /* the one-minute budget; a deployment can set its own */
  floors: {
    waste: { name: 'Waste and Streets', tier: 'team' },
    ops:   { name: 'Operations', tier: 'department' },
    cs:    { name: 'Customer Services', tier: 'team' },
    fleet: { name: 'Fleet', tier: 'team' },
    org:   { name: 'Whole organisation', tier: 'org' }

const YI = w => DATA.yardstick.findIndex(y => y.w === w);

/* ----- the empty marks ----- */
function wavy(w) { w = w || 28; let d = ''; for (let x = 0, i = 0; x <= w; x += 4, i++) d += `${i ? 'L' : 'M'}${x},${i % 2 ? 2 : 8}`;
  return `<svg class="mk mk-break" viewBox="0 0 ${w} 10" preserveAspectRatio="none" aria-hidden="true"><path d="${d}"/></svg>`; }
function mark(kind) {
  if (kind === 'gap') return '<span class="mk mk-gap" aria-hidden="true"></span>';

/* ----- word-sized pictures ----- */
function spark(w, h, opts) {
  w = w || 64; h = h || 16; opts = opts || {};
  const max = Math.max(...M.map(m => m.n), DATA.theirs.n), n = M.length;
  const X = i => (i / (n - 1)) * (w - 4) + 2, Y = v => h - 2 - (v / max) * (h - 4);
  let pts = M.map((m, i) => [X(i), Y(m.n)]);
  let ln = '', hole = '';
  for (let i = 0; i < n - 1; i++) {
    const seg = `M${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)}L${pts[i + 1][0].toFixed(1)},${pts[i + 1][1].toFixed(1)}`;
    if (M[i].hole || M[i + 1].hole) hole += seg; else ln += seg;
  }
  const last = pts[n - 1];
  const them = opts.them ? `<circle class="them" cx="${last[0]}" cy="${Y(DATA.theirs.n).toFixed(1)}" r="2"/>` : '';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Missed collections by month: ${M.map(m => m.m + ' ' + m.n).join(', ')}"><path class="ln" d="${ln}"/><path class="hole" d="${hole}"/>${them}<circle class="end" cx="${last[0]}" cy="${last[1].toFixed(1)}" r="2"/></svg>`;
}
const iso = (name, n, cls, size) => Array.from({ length: n }, () => `<span class="iso ${cls || ''}">${ic(name, size || 14)}</span>`).join('');

/* ----- the records behind each claim (the third height) ----- */
function incidents() {
  const out = []; let id = 1031;
  M.forEach((m, mi) => { for (let i = 0; i < m.n; i++) {
    let day = 1 + Math.floor((i + 0.5) * (29 / m.n));
    if (m.hole) { /* the log lost 8–21 Aug: push those days out of the hole */ if (day >= 8 && day <= 21) day = day < 15 ? 7 - (i % 6) : 22 + (i % 8); }
    out.push({ id: `INC-26-${id++}`, m: m.m, day: Math.max(1, day), street: DATA.streets[(i * 3 + mi) % DATA.streets.length] }); } });
  return out;
}

const STATE = { gw: GW.on, tech: false };
const HOOKS = { gw: [], tech: [], open: [] };
function setGW(v) { STATE.gw = v; document.body.classList.toggle('nogw', !v); const b = $('#swg'); if (b) { b.setAttribute('aria-checked', v); b.querySelector('.ss').textContent = v ? 'on' : 'off'; } HOOKS.gw.forEach(f => f(v)); }
function setTech(v) { STATE.tech = v; document.body.classList.toggle('show-tech', v); const b = $('#swt'); if (b) { b.setAttribute('aria-checked', v); b.querySelector('.ss').textContent = v ? 'on' : 'off'; } HOOKS.tech.forEach(f => f(v)); }
function band(extra) {
  const t = DATA.topic;
  return `<header class="band"><p class="brand">AUGUR</p><nav class="crumbs" aria-label="Where you are">${DATA.apps.artifacts}<span class="sep">${ic('chevron-right', 14)}</span>${t.library}<span class="sep">${ic('chevron-right', 14)}</span><b>${t.title}</b></nav><span class="floortag" data-tier="${FL(t.floor).tier}">Kept on ${FL(t.floor).name}</span>${extra || ''}<div class="toggles"><button class="sw" id="swg" role="switch" aria-checked="true">${ic('circle-dashed', 14)}<span>${GW.Plain}</span><span class="ss">on</span><span class="kbd">G</span></button><button class="sw" id="swt" role="switch" aria-checked="false">${ic('code', 14)}<span>Technical words</span><span class="ss">off</span><span class="kbd">T</span></button></div></header>`;
}
function wire() {
  document.addEventListener('click', e => { if (e.target.closest('#swg')) setGW(!STATE.gw); if (e.target.closest('#swt')) setTech(!STATE.tech); const c = e.target.closest('[data-claim]'); if (c) { OPEN === c.dataset.claim ? closeRecords() : openRecords(c.dataset.claim); } if (e.target.closest('#dx')) closeRecords(); });
  document.addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'g' || e.key === 'G') setGW(!STATE.gw);
    if (e.key === 't' || e.key === 'T') setTech(!STATE.tech);
    if (e.key === 'Escape') closeRecords(); });
}
/* timers for the auto-demo; R replays from the start */
const TIMERS = [];
const later = (fn, t) => TIMERS.push(setTimeout(fn, RM ? Math.min(t, ms('--motion-base')) : t));
function boot(reset, demo) {
  const w = $('#wrap');
  const run = () => { TIMERS.splice(0).forEach(clearTimeout); closeRecords(); setGW(GW.on); setTech(false); reset(); Icons.hydrate(); w.classList.add('pre'); later(() => { w.classList.remove('pre'); demo(); }, ms('--motion-run')); };
  document.addEventListener('keydown', e => { if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey) run(); });
  wire();
  run();
}

const T = DATA.topic, I = DATA.intent, D = DATA.draft;
let H = 3, head = -1, inked = false;
function picK1() {
  const w = 240, h = 52, n = M.length, max = DATA.months.reduce((a, m) => Math.max(a, m.n), 0), bw = 28, gap = (w - n * bw) / (n - 1);
  let s = `<line class="ax" x1="0" y1="${h - 10}" x2="${w}" y2="${h - 10}"/>`;
  M.forEach((m, i) => { const x = i * (bw + gap), bh = (m.n / max) * (h - 16);
    s += `<rect class="b ${i === n - 1 ? 'l' : ''}" x="${x}" y="${h - 10 - bh}" width="${bw}" height="${bh}" rx="1"/>`;
    if (m.hole) s += `<rect class="hole" x="${x}" y="${h - 10 - bh - 8}" width="${bw}" height="6"/>`;
    s += `<text x="${x + bw / 2}" y="${h}" text-anchor="middle">${m.m}</text>`; });
  const lx = (n - 1) * (bw + gap), ty = h - 10 - (DATA.theirs.n / max) * (h - 16);
  s += `<line class="them" x1="${lx - 3}" y1="${ty}" x2="${lx + bw + 3}" y2="${ty}"/><text class="them-t" x="${lx - 5}" y="${ty + 3}" text-anchor="end">${DATA.theirs.n}?</text>`;
  return `<svg class="pic" viewBox="0 0 ${w} ${h}" role="img" aria-label="Missed collections by month">${s}</svg>`;
}
function picK3() {
  const w = 240, h = 52, mx = O.value;
  return `<svg class="pic" viewBox="0 0 ${w} ${h}" role="img" aria-label="Cost now and offered"><text x="0" y="14">now</text><rect class="b" x="44" y="6" width="${(C.value / mx) * 190}" height="10" rx="1"/><text x="0" y="36">offered</text><rect class="b l" x="44" y="28" width="190" height="10" rx="1"/></svg>`;
}
function picK4() {
  const mo = ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May'], w = 240, h = 52, cw = w / mo.length, m = CL('k4').months;
  let s = mo.map((x, i) => `<text x="${i * cw + cw / 2}" y="${h}" text-anchor="middle">${x}</text>`).join('');
  s += `<rect class="b" x="0" y="6" width="${3 * cw}" height="8" rx="1"/><rect class="nc" x="${3 * cw}" y="6" width="${(m - 3) * cw}" height="8"/>`;
  s += `<rect class="b l" x="0" y="24" width="${m * cw}" height="8" rx="1" opacity=".55"/><line class="end" x1="${3 * cw}" y1="0" x2="${3 * cw}" y2="${h - 10}"/>`;
  return `<svg class="pic" viewBox="0 0 ${w} ${h}" role="img" aria-label="Contract and retender timeline">${s}</svg>`;
}
const pics = {
  k1: () => picK1() + `<p class="pcap">One bar a month; the dashed box marks two lost weeks; the line marks ${DATA.theirs.who}.</p>`,
  k2: () => `<div class="isos">${V.map(v => `<span class="iso ${v.r === 'fail' ? 'f' : v.r === 'gap' ? 'g' : ''}" title="${v.id}">${ic('truck', 18)}</span>`).join('')}</div><p class="pcap">One truck a vehicle: amber failed, corners not inspected yet.</p>`,
  k3: () => picK3() + `<p class="pcap">£${C.value}m now, £${O.value}m offered.</p>`,
  k4: () => picK4() + `<p class="pcap">Top: the contract, then no contract. Under it: six months of retendering.</p>`
};
function know(c) {
  let r = `<div class="k1l">${yard(c.sure)} ${sure(c.sure)} ${chip(c.id)}</div>`;
  if (c.id === 'k1') {
    const last = INC.filter(x => x.m === 'Oct').slice(-1)[0];
    r += `<div class="split"><div><b>${VARS.last}</b>our incident log, ${monthName(DATA.theirs.m)}</div><div><b>${DATA.theirs.n}</b>${DATA.theirs.who}</div></div>`;
    r += `<div class="mrec"><span class="id">${last.id}</span><span>Missed collection, ${last.street}</span><span class="d">${last.day} Oct</span></div>`;
  } else if (c.id === 'k2') {
    V.filter(v => v.r !== 'pass').forEach(v => r += `<div class="mrec"><span class="id">${v.id}</span><span>${v.r === 'fail' ? 'Failed: ' + v.why : `<span class="gapbox" style="display:inline-block;width:var(--space-5);height:var(--space-3);vertical-align:-1px"></span> ${P(v.who).name}, by ${v.by}`}</span><span class="d">Oct</span></div>`);
  } else {
    c.src.filter(s => s.doc).forEach(s => r += `<div class="mrec"><span class="id">${s.doc}</span><span>${DATA.docs[s.doc].title}</span><span class="d">${DATA.docs[s.doc].date.slice(0, 6)}</span></div>`);
  }
  return r;
}
function blText() {
  if (!STATE.gw) return `${fill(D.template)} <span class="gapbox" style="display:inline-block;width:var(--measure-card);height:var(--leading-lead);vertical-align:bottom;font-size:var(--type-small);color:var(--ink-muted);padding:0 var(--space-2)">your recommendation: you write it</span>`;
  return D.bottom.filter(p => !p.unsupported).map(p => p.claim ? `<button class="ref" data-claim="${p.claim}">${p.t}</button>` : p.t).join('');
}
function render() {
  $('#band').innerHTML = band();
  $('#dr').innerHTML = drawer();
  const rows = [];
  rows.push({ cls: 'blrow ' + (STATE.gw && !inked ? 'penrow' : ''), who: STATE.gw ? (inked ? `<span class="inktag">${ic('pen-line', 12)} inked by ${P(DATA.me).short}</span><span>drafted by ${GW.plain}</span>` : `<span class="pentag">${ic('pencil', 12)} pencil</span><span>${GW.plain}</span>`) : `<span>template + you</span>`, rn: 'Bottom line',
    say: `<p>${blText()}</p>`, show: `<div class="arrows">Rests on ${D.bottom.filter(p => p.claim && !p.unsupported).map(p => `<button class="ref" data-row="${p.claim}">fact ${DATA.claims.indexOf(CL(p.claim)) + 1}</button>`).join(' and ')}; a bottom line has no picture of its own.</div>`,
    know: `<div class="k1l">${STATE.gw ? (inked ? 'Inked: it now reads as yours, and still says who drafted it.' : `Not counted, not sent until inked. One phrase was struck: nothing in the records said it.`) : GW.offWhy}</div>${STATE.gw && !inked ? `<div class="foot" style="margin-top:var(--space-2)"><button class="btn primary" id="bink">${ic('pen-line', 14)} Ink it <span class="kbd">I</span></button></div>` : ''}` });
  DATA.claims.forEach((c, i) => rows.push({ id: c.id, cls: '', who: `<span>template</span><span>from records</span>`, rn: `Fact ${i + 1}`,
    say: `<p><span class="hd">${c.head}.</span> ${say(c.id)}</p>`, show: pics[c.id](), know: know(c) }));
  rows.push({ cls: '', who: `<span>template</span><span>from the gaps</span>`, rn: 'Not known',
    say: `<p>We can’t yet see ${DATA.empties.filter(e => ['unseen', 'gap', 'ask'].includes(e.id)).length} things that matter here.</p>`,
    show: `<ul class="elist">${['unseen', 'gap', 'ask'].map(id => emptyLi(EM(id))).join('')}</ul>`,
    know: `<ul class="elist">${['noRecord', 'stale', 'none'].map(id => emptyLi(EM(id))).join('')}</ul>` });
  rows.push({ cls: '', who: `<span>template</span><span>from ${DATA.apps.mandate}</span>`, rn: 'Decision',
    say: `<p class="hd">${fill(D.ask)}</p>`, show: `<div class="k1l">${ic('target', 14)} ${I.title}<span class="tk"> · ${I.id}</span></div><div class="pcap">${DATA.apps.mandate}, owned by ${P(I.owner).name}, due ${I.due} (${I.daysLeft} days)</div>`,
    know: `<div class="k1l">The recommendation is due ${I.askDue}, in ${I.askDays} days.</div>` });
  $('#main').innerHTML = `<div class="head"><div><p class="eyebrow">${T.kind} for decision · ${T.written}</p><h1>${T.title}</h1><p class="for">For <b>${P(T.reader).name}</b>, ${P(T.reader).role}, from ${P(T.author).name}</p></div>
    <div class="heights" role="group" aria-label="How much to show">${[[1, 'Say'], [2, 'Say and show'], [3, 'All three']].map(([n, l]) => `<button aria-pressed="${H === n}" data-h="${n}">${l} <span class="kbd">${n}</span></button>`).join('')}</div></div>
    <div class="script" id="script"><div class="colh"></div><div class="colh">Say <b>· the sentence ${P(T.reader).short} reads</b></div><div class="colh c-show">Show <b>· the picture</b></div><div class="colh c-know">Know <b>· the records and how sure</b></div>
    ${rows.map((r, i) => `<div class="row ${r.cls}" data-r="${i}" ${r.id ? `data-rid="${r.id}"` : ''}><div class="cell c-who" style="--i:${i}"><span class="rn">${r.rn}</span>${r.who}</div><div class="cell c-say" style="--i:${i}">${r.say}</div><div class="cell c-show" style="--i:${i + 1}">${r.show}</div><div class="cell c-know" style="--i:${i + 2}">${r.know}</div></div>`).join('')}</div>
    <div class="foot hints"><span><span class="kbd">↑</span><span class="kbd">↓</span> read head</span><span><span class="kbd">Enter</span> all records for a fact</span><span><span class="kbd">1</span>–<span class="kbd">3</span> how many heights</span><span><span class="kbd">I</span> ink</span><span><span class="kbd">G</span> assistant</span><span><span class="kbd">T</span> technical words</span><span><span class="kbd">R</span> replay</span></div>`;
  document.body.classList.toggle('h2-only', H === 2); document.body.classList.toggle('h1-only', H === 1);
  lightRow(head);
  Icons.hydrate();
}
function lightRow(i) { head = i; $$('.row').forEach(r => r.classList.toggle('lit', +r.dataset.r === i)); }
function setH(n) { H = n; render(); }
HOOKS.gw.push(() => { if ($('#script')) render(); });
document.addEventListener('click', e => {
  const h = e.target.closest('[data-h]'); if (h) setH(+h.dataset.h);
  if (e.target.closest('#bink')) { inked = true; render(); }
  const r = e.target.closest('[data-row]'); if (r) { const el = $(`.row[data-rid="${r.dataset.row}"]`); if (el) lightRow(+el.dataset.r); }
});
document.addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (['1', '2', '3'].includes(e.key)) setH(+e.key);
  if (e.key === 'ArrowDown') { e.preventDefault(); lightRow(Math.min(head + 1, $$('.row').length - 1)); }
  if (e.key === 'ArrowUp') { e.preventDefault(); lightRow(Math.max(head - 1, 0)); }
  if (e.key === 'Enter') { const el = $(`.row[data-r="${head}"]`); if (el && el.dataset.rid) openRecords(el.dataset.rid); }
  if (e.key === 'i' || e.key === 'I') { if (STATE.gw && !inked) { inked = true; render(); } } });
boot(() => { H = 3; head = -1; inked = false; render(); }, () => {
  const step = ms('--motion-calm') / 2;
  [0, 1].forEach((r, k) => later(() => lightRow(r), step * (k + 1)));
});
</script>
</body>
