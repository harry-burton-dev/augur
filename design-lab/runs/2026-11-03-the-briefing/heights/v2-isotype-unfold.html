<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Heights · V2 · The symbol unfolds</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens (all mixes of kit tokens; listed as "needs token"
   in notes.md). Shared by all six variants of "the fact at three heights".
   --------------------------------------------------------------- */
:root{
  /* not known yet: four corner ticks (catalogue --mark-gap) */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-proposed-gap-tick: var(--space-2);
  /* stale hatch 45deg, not-yours hatch 135deg (catalogue) */
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* sources disagree: warning-tinted edge, never red (catalogue) */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  --x-proposed-quiet: .62;
  --x-proposed-here: var(--floor-department-high);
  --x-proposed-type-micro: .6875rem;
  /* pencil (reference desk): anything a model wrote, until a person accepts it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 72%, var(--info));
  --x-proposed-pencil-wash: color-mix(in srgb, var(--info) 6%, transparent);
  /* NEW in this run. Overdue is a need, so it is the one lit state: a softened danger, never pure red */
  --x-proposed-overdue: color-mix(in srgb, var(--danger) 78%, var(--ink));
  --x-proposed-overdue-wash: color-mix(in srgb, var(--danger) 9%, transparent);
  /* NEW. In date is history, so it is ink at rest, no light */
  --x-proposed-settled: color-mix(in srgb, var(--ink-muted) 58%, transparent);
  /* NEW. "Your place": the thread that survives a change of height (light language: the lit path) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* NEW. One isotype symbol: the unit cell every height counts in */
  --x-proposed-unit: calc(var(--space-6) + var(--space-2));
  /* NEW. Rack focus on the far plane (focal planes, cinematic run) */
  --x-proposed-rack-blur: calc(var(--glow-blur) / 6);
}
:root, .mk-gap, .cell[data-state="gap"]{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints > span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* two registers */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* ---------- frame: top band with the entity, floor and register ---------- */
.frame{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:var(--space-4) var(--edge) 0}
.band{display:flex;align-items:center;gap:var(--space-4);padding-bottom:var(--space-3);border-bottom:1px solid var(--hairline)}
.band .crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);min-width:0}
.band .crumb b{font-weight:400;color:var(--light)}
.band .crumb .sep{opacity:var(--x-proposed-quiet);display:inline-flex}
.band .fl{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-left:auto;white-space:nowrap}
.band .fl::before{content:"";width:var(--space-5);height:2px;background:var(--x-proposed-here)}
.band .fl b{font-weight:400;color:var(--ink)}
.techbtn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.techbtn[aria-pressed="true"]{color:var(--light);border-color:var(--ink-muted);background:var(--surface-raised)}
.foot{display:flex;align-items:center;justify-content:flex-start;gap:var(--space-4);padding:var(--space-3) 0 calc(var(--space-5) + var(--space-3))}

/* ---------- the states, as one unit cell (isotype: the same symbol, repeated) ---------- */
.cell{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--u,var(--x-proposed-unit));height:var(--u,var(--x-proposed-unit));border-radius:var(--radius-key);color:var(--slate-deep);transition:box-shadow var(--motion-base) var(--ease-out),opacity var(--motion-base) var(--ease-out),filter var(--motion-base) var(--ease-out)}
.cell svg{width:calc(var(--u,var(--x-proposed-unit)) * .5);height:calc(var(--u,var(--x-proposed-unit)) * .5)}
.cell[data-state="overdue"]{background:var(--x-proposed-overdue)}
.cell[data-state="disputed"]{background:linear-gradient(90deg,var(--x-proposed-overdue) 0 50%,var(--x-proposed-disagree-wash) 50%);box-shadow:inset 0 0 0 2px var(--x-proposed-disagree);color:var(--slate-deep)}
.cell[data-state="disputed"] svg{color:var(--light)}
.cell[data-state="soon"]{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.cell[data-state="ok"]{background:var(--x-proposed-settled);color:var(--slate-deep)}
.cell[data-state="gap"]{background:var(--x-proposed-gap);color:var(--ink-muted)}
.cell[data-state="hidden"]{background:var(--x-proposed-unseen),var(--surface-inset);box-shadow:inset 0 0 0 1px var(--hairline);color:var(--ink-muted)}
.cell[data-state="na"]{color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.cell.lit{box-shadow:0 0 0 var(--focus-gap) var(--slate-deep),0 0 0 calc(var(--focus-gap) + 2px) var(--x-proposed-lit)}
.cell[data-state="disputed"].lit{box-shadow:inset 0 0 0 2px var(--x-proposed-disagree),0 0 0 var(--focus-gap) var(--slate-deep),0 0 0 calc(var(--focus-gap) + 2px) var(--x-proposed-lit)}
.cell[data-state="soon"].lit{box-shadow:inset 0 0 0 1.5px var(--ink),0 0 0 var(--focus-gap) var(--slate-deep),0 0 0 calc(var(--focus-gap) + 2px) var(--x-proposed-lit)}
.cell.s{--u:var(--space-4);border-radius:2px}
.cell.s svg{display:none}
.cell.m{--u:calc(var(--space-5) + var(--space-1))}

/* the empties as inline marks (catalogue) */
.mk-break{display:inline-block;width:var(--space-5);height:var(--space-3);vertical-align:-1px}
.mk-break path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-meta)}
.tag-dis{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-disagree);border:1px solid color-mix(in srgb,var(--x-proposed-disagree) 40%,transparent);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.fork .alt{border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);padding:var(--space-1) var(--space-2);border-radius:0 2px 2px 0}
.fork .alt b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.fork .alt span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

/* confidence word: the yardstick word is a word, set in small caps-ish mono; never a percentage alone */
.conf{display:inline-flex;align-items:baseline;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-proposed-disagree);white-space:nowrap}

/* pencil: a model's text, its own lane, dotted edge, italic, until a person accepts it */
.pencil{border:1px dashed var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);color:var(--x-proposed-pencil);font-style:italic;font-size:var(--type-meta);line-height:var(--leading-meta)}
.pencil .pby{display:flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);font-style:normal;letter-spacing:var(--tracking-soft);text-transform:uppercase}
.pencil .plinks{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2);font-style:normal;font-size:var(--type-small);margin-top:var(--space-1)}
.pencil .plinks button{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap)}
.pencil.off{border-style:solid;border-color:var(--hairline);background:none;color:var(--ink-muted);font-style:normal}

/* refs inside a sentence: words that are handles onto the picture and the records */
.ref{color:var(--light);border-bottom:1px solid var(--hairline-strong);border-radius:2px;padding:0 1px;transition:background var(--motion-base) var(--ease-out),border-color var(--motion-base) var(--ease-out)}
.ref:hover{border-bottom-color:var(--ink-muted)}
.ref.lit{background:var(--x-proposed-lit-wash);border-bottom:2px solid var(--x-proposed-lit)}
.ref.ov{color:color-mix(in srgb,var(--x-proposed-overdue) 60%,var(--light))}

/* rack focus: the far plane blurs and loses colour, never a black scrim */
.far{filter:blur(var(--x-proposed-rack-blur)) saturate(.4);opacity:.55}
@media (prefers-reduced-motion: reduce){.far{filter:saturate(.4)}}

/* records: a quiet table */
.rt{width:100%;border-collapse:collapse;font-size:var(--type-meta);line-height:var(--leading-meta)}
.rt th{text-align:left;font-weight:400;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline-strong);white-space:nowrap}
.rt td{padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline);color:var(--ink);white-space:nowrap;vertical-align:top}
.rt td.k{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.rt td.src{white-space:normal;color:var(--ink-muted);font-size:var(--type-small)}
.rt tr.lit td{background:var(--x-proposed-lit-wash)}
.rt tr.lit td:first-child{box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.rt tr.brk td{color:var(--ink-muted);font-size:var(--type-small);border-bottom-style:dashed}

/* deposit once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){
  .pre .dep{transform:none}
  .dep{transition-delay:0ms}
  *{scroll-behavior:auto!important}
}
.cell.s{--x-proposed-gap-tick:var(--space-1)}
.nw{white-space:nowrap}

/* ===================== this variant ===================== */
.v2{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--measure-drawer) + var(--space-4));gap:var(--space-6);min-height:0;padding-top:var(--space-5)}
.chartcol{display:flex;flex-direction:column;min-height:0;min-width:0}
.finding{margin:var(--space-2) 0 0;font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-tight);color:var(--light);max-width:40ch}
.finding .ref.ov{color:color-mix(in srgb,var(--x-proposed-overdue) 55%,var(--light))}
.sub{margin:var(--space-2) 0 var(--space-5);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);max-width:90ch}
.sub b{font-weight:400;color:var(--ink)}
.iso{position:relative;flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--space-2);align-items:end;border-bottom:1px solid var(--hairline-strong);padding-bottom:var(--space-2);transition:filter var(--motion-slow) var(--ease-out),opacity var(--motion-slow) var(--ease-out)}
.col{display:flex;flex-direction:column-reverse;align-items:center;gap:var(--space-2);min-height:calc(var(--x-proposed-unit) * 4)}
.col .sym{border-radius:var(--radius-key)}
.col .cell{--u:var(--x-proposed-unit)}
.col .cell[data-state="norecord"]{box-shadow:inset 0 0 0 1px var(--hairline-strong);color:var(--ink-muted)}
.col .cell[data-state="norecord"] svg{display:none}
.col .cell[data-state="norecord"] .mk-break{display:block;width:calc(var(--space-5) + var(--space-2))}
.col .zero{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);padding-bottom:var(--space-1)}
.col.lost{align-self:stretch;justify-content:center;border-left:1px dashed var(--hairline-strong);border-right:1px dashed var(--hairline-strong);background:color-mix(in srgb,var(--ink) 2%,transparent)}
.col.lost .why{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:center;padding:0 var(--space-1)}
.col.lost .mk-break{width:calc(var(--space-6) + var(--space-2));height:var(--space-4)}
.col.today{border-left:1px solid var(--hairline);padding-left:var(--space-2)}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--space-2);padding-top:var(--space-2);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);text-align:center}
.months .t{color:var(--light)}
.iso.open .cols,.iso.open .months{filter:blur(var(--x-proposed-rack-blur)) saturate(.4);opacity:.45}
@media (prefers-reduced-motion: reduce){.iso.open .cols,.iso.open .months{filter:saturate(.4)}}

/* the unfolded record, grown from its symbol */
.card{position:absolute;z-index:var(--layer-overlay);width:calc(var(--measure-read) - var(--space-4));max-height:100%;overflow:auto;background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);padding:var(--space-4);transform-origin:var(--ox) var(--oy);transition:transform var(--motion-slow) var(--ease-out),opacity var(--motion-slow) var(--ease-out)}
.card.from{transform:scale(.12);opacity:0}
@media (prefers-reduced-motion: reduce){.card.from{transform:none}}
.card .top{display:flex;gap:var(--space-3);align-items:center;margin-bottom:var(--space-2)}
.card .top .cell{--u:var(--space-6)}
.card h2{margin:0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.card .when{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.card .say{margin:0 0 var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.card .say b{font-weight:400;color:var(--light)}
.card .lane{display:flex;gap:var(--space-1);align-items:center;margin:var(--space-3) 0;font-size:var(--type-small);color:var(--ink-muted)}
.card .lane .cell{--u:var(--space-4);border-radius:2px}
.card .lane .cell svg{display:none}
.card .lane .cell[data-state="none"]{box-shadow:inset 0 0 0 1px var(--hairline)}
.card .lane .cell[data-state="norecord"]{box-shadow:inset 0 0 0 1px var(--hairline-strong);background:none}
.card .lane .cell.lit{box-shadow:0 0 0 2px var(--x-proposed-lit)}
.card .close{position:absolute;top:var(--space-3);right:var(--space-3);display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);color:var(--ink-muted)}
.vis{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.vis li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline)}
.vis li b{font-weight:400;color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta)}
.vis li .id{font-family:var(--font-mono)}
.vis li svg{margin-top:var(--space-1)}

/* the transformer's note: why this picture, what one symbol is, what was left out */
.tnote{border-left:1px solid var(--hairline);padding-left:var(--space-4);overflow:auto;min-height:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.tnote h3{margin:0 0 var(--space-2);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.tnote section{margin-bottom:var(--space-4)}
.tnote p{margin:0 0 var(--space-2)}
.tnote b{font-weight:400;color:var(--ink)}
.tnote .one{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.tnote .one .cell{--u:var(--space-5)}
.tnote .left{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.tnote .left li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);align-items:start}
.tnote .left .cell{--u:var(--space-5)}
.tnote .left .cell svg{width:var(--space-3);height:var(--space-3)}
.ikey{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-5);margin:var(--space-2) 0 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ikey span{display:inline-flex;align-items:center;gap:var(--space-2)}
.iso{grid-template-rows:minmax(0,1fr) auto auto}

</style>
</head>
<body>
<div class="frame pre" id="wrap">
  <header class="band" id="band"></header>
  <div class="v2">
    <main class="chartcol">
      <p class="eyebrow dep" id="q"></p>
      <h1 class="finding dep" id="finding" style="--i:1"></h1>
      <p class="sub dep" id="sub" style="--i:2"></p>
      <div class="iso dep" id="iso" style="--i:3"></div>
    </main>
    <aside class="tnote dep" id="tnote" style="--i:4"></aside>
  </div>
  <div class="foot"><div class="hints">
    <span><span class="kbd">&larr;</span><span class="kbd">&rarr;</span><span class="kbd">&uarr;</span><span class="kbd">&darr;</span> move between symbols</span>
    <span><span class="kbd">enter</span> unfold to its record</span>
    <span><span class="kbd">esc</span> fold back</span>
    <span><span class="kbd">T</span> technical words</span>
    <span><span class="kbd">R</span> replay</span>
  </div></div>
</div>
<div class="x-cap"><b>Heights · V2</b> the symbol unfolds: an Isotype count over time; each symbol opens into its record · Neurath, OWID</div>

<script>
/* ======================================================================
   Sample data for one deployment (Vale Regional Services). Every name,
   label, count, date, sentence part and reason on the page comes from
   here. In AUGUR it would come from Data Atlas (the site, its inspection
   regime, each visit as an entity with observations from sources),
   Artifacts (the reports those observations were read from) and Mandate
   (intents bound to the site). Swap this object and the page redraws.
   Counts are never typed in: the page counts DATA.regime and DATA.visits.
   ====================================================================== */
const DATA = {
  app: 'Data Atlas',

function headlineParts() {

  if (p) parts.push(', and ', { t: 'probably a ' + ORD[n + 1], ref: 'state:disputed' });
  parts.push('. The oldest is ', { t: oldest.name.toLowerCase(), ref: 'item:' + oldest.id }, ', ', { t: oldest.late + ' days late', ref: 'item:' + oldest.id }, '.');

  if (COUNT.soon) parts.push({ t: cap(word(COUNT.soon)) + ' more ' + (COUNT.soon === 1 ? 'is' : 'are') + ' due in the next fortnight', ref: 'state:soon' });
  const rest = [];
  if (COUNT.gap) rest.push({ t: word(COUNT.gap) + ' is not known yet', ref: 'state:gap' });
  if (COUNT.hidden) rest.push({ t: word(COUNT.hidden) + ' is kept where you can’t see it', ref: 'state:hidden' });
  if (rest.length) { parts.push('; '); rest.forEach((x, i) => { if (i) parts.push(' and '); parts.push(x); }); }

function partsHTML(parts, cls = 'ref') {
  /* punctuation after a handle is kept on its line, so a line never starts with a comma */
  let out = '';

    if (typeof p === 'string') { out += esc(p); continue; }
    const btn = `<button class="${cls} ${p.cls || ''}" data-ref="${p.ref}">${esc(p.t)}</button>`;
    const nx = parts[i + 1], m = typeof nx === 'string' && nx.match(/^[,.;:]+/);

}

/* ---------- one item's records: its visits, the lost stretch, the dispute, the empty ---------- */
function visitRows(r) {
  const out = [];
  const nr = D.noRecord;
  r.visits.forEach((v, i) => {
    const prev = r.visits[i - 1];
    if (prev && prev.date < nr.from && v.date > nr.to && days(prev.date, v.date) > r.months * 30 * 1.5)
      out.push({ brk: true });
    out.push(v);
  });
  return out;
}
function visitsHTML(r) {
  if (r.state === 'gap') return `<p class="say"><span class="cell s" data-state="gap"></span> ${esc(D.states.gap.plain)}. ${esc(cap(r.fillWhy))}. <b>${esc(r.fill)}</b> could fill it.</p>`;
  if (r.state === 'hidden') return `<p class="say"><span class="unseen">${ico('lock', 12)} kept on ${esc(floorOf(r.keptOn).name)}</span> Its visits exist, on a floor you can’t open. Ask <b>${esc(r.ask)}</b>.</p>`;
  if (r.state === 'na') return `<p class="say">${esc(D.states.na.plain)}. ${esc(r.naWhy)}</p>`;
  const rows = visitRows(r).slice().reverse().map(v => v.brk
    ? `<li class="brk">${BREAK}<span><b>No record</b> ${esc(fmtS(D.noRecord.from))} to ${esc(fmtS(D.noRecord.to))}: ${esc(D.noRecord.why)}. A visit was due in this stretch; nobody can say whether it happened.</span></li>`
    : `<li data-visit="${v.id}">${ico(v.disputed ? 'git-fork' : 'file-text', 14)}<span><b>${esc(fmt(v.date))} · ${esc(v.result)}</b> ${esc(v.by)} <span class="id">${esc(v.id)}</span><br>from <i>${esc(v.src)}</i>, in Artifacts<span class="tk">observation · prov:wasDerivedFrom → artifacts/${esc(v.id.toLowerCase())}</span></span></li>`).join('');

  <p class="say"><span class="conf">${esc(r.confidence)}</span> ${esc(r.confidenceOf)}: the person on site outranks the supplier’s own report until someone checks the hoist tag.</p>`;

/* ---------- the state of one inspection at a past date, worked out from its visits ---------- */
const addMonths = (s, m) => { const d = dt(s); d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); };
const inLost = s => s >= D.noRecord.from && s <= D.noRecord.to;
function statusAt(r, d) {
  if (!r.months || !['overdue','disputed','soon','ok'].includes(r.state)) return null;
  const vs = r.visits.filter(v => v.date <= d);
  const last = vs.filter(v => !v.disputed).pop();
  if (!last) return null;
  const due = addMonths(last.date, r.months);
  if (due >= d) return { st: 'ok', due };
  if (inLost(due)) return { st: 'norecord', due };
  if (vs.some(v => v.disputed && v.date > due)) return { st: 'disputed', due, late: days(due, d) };
  return { st: 'overdue', due, late: days(due, d) };
}
/* month ends for the last twelve months, then today */
function monthEnds() {
  const t = TODAY, out = [];
  for (let i = 11; i >= 1; i--) { const e = new Date(t.getFullYear(), t.getMonth() - i + 1, 0, 12); out.push({ d: e.toISOString().slice(0, 10), m: MON[e.getMonth()], y: e.getFullYear() }); }
  out.push({ d: D.today, m: 'Today', y: t.getFullYear(), today: true });
  return out.map(c => ({ ...c, lost: inLost(c.d), items: D.regime.map(r => ({ r, s: statusAt(r, c.d) })).filter(x => x.s && x.s.st !== 'ok') }));
}

function drawIso() {
  const cols = COLS.map((c, ci) => {
    if (c.lost) return `<div class="col lost" data-c="${ci}">${BREAK}<span class="why">No record</span><span class="tk">record.gap</span></div>`;
    const syms = c.items.map((x, k) => {
      const r = x.r, st = x.s.st;
      const label = st === 'norecord' ? `${r.name}: can’t say, its due date fell in the lost stretch` : `${r.name}: ${D.states[st].one} at ${c.today ? 'today' : 'the end of ' + c.m}`;
      return `<button class="sym" data-c="${ci}" data-k="${k}" aria-label="${esc(label)}"><span class="cell" data-state="${st}" data-id="${r.id}">${st === 'norecord' ? BREAK : ico(r.icon, 20)}</span></button>`;
    }).join('');
    return `<div class="col ${c.today ? 'today' : ''}" data-c="${ci}">${syms || '<span class="zero">none</span>'}</div>`;
  }).join('');
  const months = COLS.map(c => `<span class="${c.today ? 't' : ''}">${esc(c.m)}${c.m === 'Jan' ? ' ' + c.y : ''}</span>`).join('');
  $('#iso').innerHTML = `<div class="cols" id="cols">${cols}</div><div class="months">${months}</div><p class="ikey"><span><span class="cell s" data-state="overdue"></span>overdue at that month end</span><span><span class="cell s" data-state="disputed"></span>probably overdue: sources disagree</span><span>${BREAK}can’t say: it fell due in the stretch with no record</span></p>`;
  Icons.hydrate($('#iso'));
}
function drawNote() {
  const left = D.regime.filter(r => ['gap','hidden','na'].includes(r.state));
  const unit = { name: 'x', state: 'overdue', icon: 'clipboard-list', id: 'unit' };
  $('#tnote').innerHTML = `
  <section><h3>Why this picture</h3><p>The question was “is it getting worse?”, so the picture counts over time. A chart picker would have offered a pie; a pie can’t show a trend.</p><span class="tk">template: count-over-time · isotype · unit = 1 entity</span></section>
  <section><h3>One symbol is</h3><p class="one">${cellHTML(unit)} one inspection, overdue that month</p><p>Its picture says which inspection. Symbols are repeated, never made bigger, so you can count them.</p></section>
  <section><h3>Not in the picture</h3><ul class="left">${left.map(r => `<li>${cellHTML(r)}<span><b>${esc(r.name)}</b>: ${esc(D.states[r.state].one)}. ${esc(r.state === 'gap' ? r.fill + ' could fill it.' : r.state === 'hidden' ? 'Ask ' + r.ask + '.' : r.naWhy)}</span></li>`).join('')}</ul></section>
  <section><h3>Made by</h3><p>The picture is drawn by the “count over time” template from the records; nobody typed a number. <b>${esc(D.viewer.name)}</b> chose it for this question.</p></section>`;
  Icons.hydrate($('#tnote'));
}

function lane(r, ci) {
  return `<div class="lane"><span>${esc(r.name)}, each month:</span>${COLS.map((c, i) => {
    if (c.lost) return `<span class="cell" data-state="norecord" title="no record"></span>`;
    const x = c.items.find(y => y.r.id === r.id);
    return `<span class="cell ${i === ci ? 'lit' : ''}" data-state="${x ? x.s.st : 'none'}" title="${esc(c.m)}"></span>`;
  }).join('')}</div>`;
}
function openCard(ci, k) {
  closeCard(true);
  const c = COLS[ci], x = c.items[k]; if (!x) return;
  SEL = { c: ci, k }; OPEN = true;
  const r = x.r, st = x.s.st;
  const iso = $('#iso'), sym = $(`.sym[data-c="${ci}"][data-k="${k}"]`);
  const ir = iso.getBoundingClientRect(), sr = sym.getBoundingClientRect();
  const when = c.today ? 'today' : 'at the end of ' + c.m + ' ' + c.y;
  let say;
  if (st === 'overdue') say = `${when === 'today' ? 'Today' : cap(when)}, <b>${esc(r.name.toLowerCase())}</b> ${c.today ? 'are' : 'were'} <b>${x.s.late} days overdue</b>. Due ${esc(fmt(x.s.due))}; no visit recorded since.`;
  else if (st === 'disputed') say = `${cap(when)}, <b>${esc(r.name.toLowerCase())}</b> were due on ${esc(fmt(x.s.due))}. Two sources disagree about whether the visit happened.`;
  else say = `${cap(when)}, we can’t say. <b>${esc(r.name)}</b> fell due on ${esc(fmt(x.s.due))}, inside the stretch with no record. It may have been done.`;
  const card = document.createElement('div');
  card.className = 'card from'; card.setAttribute('role', 'dialog'); card.setAttribute('aria-label', r.name + ', ' + when);
  /* place the card beside its symbol, inside the chart */
  const w = Math.min(ir.width, parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--measure-read')) - MS('--space-4'));
  let left = sr.left - ir.left + sr.width + MS('--space-4');
  if (left + w > ir.width) left = Math.max(0, sr.left - ir.left - w - MS('--space-4'));
  card.style.left = left + 'px'; card.style.top = '0px';
  card.style.setProperty('--ox', (sr.left - ir.left - left + sr.width / 2) + 'px');
  card.style.setProperty('--oy', (sr.top - ir.top + sr.height / 2) + 'px');
  card.innerHTML = `<button class="close" id="fold">${ico('chevrons-down-up', 14)} <span class="kbd">esc</span> fold</button>
    <div class="top">${cellHTML({ ...r, state: st === 'norecord' ? 'gap' : st })}<div><h2>${esc(r.name)}</h2><p class="when">${esc(cap(when))} · ${esc(r.every)} · by ${esc(r.by)}</p><span class="tk">${esc(r.id)} · statusAt(${esc(c.d)})</span></div></div>
    <p class="say">${say}</p>
    ${lane(r, ci)}
    <p class="eyebrow" style="margin-bottom:var(--space-2)">The records</p>
    ${visitsHTML(r)}`;
  iso.appendChild(card); Icons.hydrate(card);
  iso.classList.add('open');
  $$('.sym').forEach(b => b.setAttribute('tabindex', '-1'));
  requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove('from')));
  $('#fold').focus({ preventScroll: true });
}
function closeCard(quick) {
  const card = $('.card'); if (!card) return;
  OPEN = false; $('#iso').classList.remove('open');
  $$('.sym').forEach(b => b.removeAttribute('tabindex'));
  if (quick || REDUCE) card.remove();
  else { card.classList.add('from'); setTimeout(() => card.remove(), MS('--motion-slow')); }
  if (SEL && !quick) { const s = $(`.sym[data-c="${SEL.c}"][data-k="${SEL.k}"]`); if (s) s.focus({ preventScroll: true }); }
}
function focusSym(ci, k) {
  const s = $(`.sym[data-c="${ci}"][data-k="${k}"]`); if (s) { SEL = { c: ci, k }; s.focus({ preventScroll: true }); }
}
function move(dc, dk) {
  if (OPEN) closeCard(true);
  let { c, k } = SEL || { c: COLS.length - 1, k: 0 };
  if (dc) { let i = c; do { i = (i + dc + COLS.length) % COLS.length; } while (!COLS[i].items.length || COLS[i].lost); c = i; k = Math.min(k, COLS[c].items.length - 1); }
  if (dk) k = Math.max(0, Math.min(COLS[c].items.length - 1, k + dk));
  focusSym(c, k);
}
document.addEventListener('click', e => {
  if (e.target.closest('#fold')) { closeCard(); return; }
  const s = e.target.closest('.sym'); if (s) { openCard(+s.dataset.c, +s.dataset.k); return; }
  const rf = e.target.closest('.ref[data-col]'); if (rf) { const ci = +rf.dataset.col; COLS[ci].items.length ? focusSym(ci, 0) : null; return; }
  if (OPEN && !e.target.closest('.card')) closeCard();
});
KEYS.ArrowRight = () => move(1, 0); KEYS.ArrowLeft = () => move(-1, 0);
KEYS.ArrowUp = () => move(0, 1); KEYS.ArrowDown = () => move(0, -1);
KEYS.Enter = () => { if (SEL && !OPEN) openCard(SEL.c, SEL.k); };
KEYS.Escape = () => closeCard();

async function demo(id) {
  const ci = COLS.length - 1;
  const k = COLS[ci].items.findIndex(x => x.r.id === oldest.id);
  focusSym(ci, k); await wait('--motion-calm'); if (!demoAlive(id)) return;
  openCard(ci, k);
}
function boot() {
  closeCard(true); SEL = null;
  drawIso(); drawNote();
  $('#wrap').classList.add('pre');
  requestAnimationFrame(() => requestAnimationFrame(() => $('#wrap').classList.remove('pre')));
  startDemo(demo);
}
window.replay = boot;
boot();

</script>
</body>
</html>
