<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Heights · V6 · The lead's questions</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens (all mixes of kit tokens; listed as "needs token"
   in notes.md). Shared by all six variants of "the fact at three heights".
   --------------------------------------------------------------- */
:root{
  /* not known yet: four corner ticks (catalogue --mark-gap) */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-proposed-gap-tick: var(--space-2);
  /* stale hatch 45deg, not-yours hatch 135deg (catalogue) */
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* sources disagree: warning-tinted edge, never red (catalogue) */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  --x-proposed-quiet: .62;
  --x-proposed-here: var(--floor-department-high);
  --x-proposed-type-micro: .6875rem;
  /* pencil (reference desk): anything a model wrote, until a person accepts it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 72%, var(--info));
  --x-proposed-pencil-wash: color-mix(in srgb, var(--info) 6%, transparent);
  /* NEW in this run. Overdue is a need, so it is the one lit state: a softened danger, never pure red */
  --x-proposed-overdue: color-mix(in srgb, var(--danger) 78%, var(--ink));
  --x-proposed-overdue-wash: color-mix(in srgb, var(--danger) 9%, transparent);
  /* NEW. In date is history, so it is ink at rest, no light */
  --x-proposed-settled: color-mix(in srgb, var(--ink-muted) 58%, transparent);
  /* NEW. "Your place": the thread that survives a change of height (light language: the lit path) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* NEW. One isotype symbol: the unit cell every height counts in */
  --x-proposed-unit: calc(var(--space-6) + var(--space-2));
  /* NEW. Rack focus on the far plane (focal planes, cinematic run) */
  --x-proposed-rack-blur: calc(var(--glow-blur) / 6);
}
:root, .mk-gap, .cell[data-state="gap"]{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints > span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* two registers */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* ---------- frame: top band with the entity, floor and register ---------- */
.frame{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:var(--space-4) var(--edge) 0}
.band{display:flex;align-items:center;gap:var(--space-4);padding-bottom:var(--space-3);border-bottom:1px solid var(--hairline)}
.band .crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);min-width:0}
.band .crumb b{font-weight:400;color:var(--light)}
.band .crumb .sep{opacity:var(--x-proposed-quiet);display:inline-flex}
.band .fl{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-left:auto;white-space:nowrap}
.band .fl::before{content:"";width:var(--space-5);height:2px;background:var(--x-proposed-here)}
.band .fl b{font-weight:400;color:var(--ink)}
.techbtn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.techbtn[aria-pressed="true"]{color:var(--light);border-color:var(--ink-muted);background:var(--surface-raised)}
.foot{display:flex;align-items:center;justify-content:flex-start;gap:var(--space-4);padding:var(--space-3) 0 calc(var(--space-5) + var(--space-3))}

/* ---------- the states, as one unit cell (isotype: the same symbol, repeated) ---------- */
.cell{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--u,var(--x-proposed-unit));height:var(--u,var(--x-proposed-unit));border-radius:var(--radius-key);color:var(--slate-deep);transition:box-shadow var(--motion-base) var(--ease-out),opacity var(--motion-base) var(--ease-out),filter var(--motion-base) var(--ease-out)}
.cell svg{width:calc(var(--u,var(--x-proposed-unit)) * .5);height:calc(var(--u,var(--x-proposed-unit)) * .5)}
.cell[data-state="overdue"]{background:var(--x-proposed-overdue)}
.cell[data-state="disputed"]{background:linear-gradient(90deg,var(--x-proposed-overdue) 0 50%,var(--x-proposed-disagree-wash) 50%);box-shadow:inset 0 0 0 2px var(--x-proposed-disagree);color:var(--slate-deep)}
.cell[data-state="disputed"] svg{color:var(--light)}
.cell[data-state="soon"]{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.cell[data-state="ok"]{background:var(--x-proposed-settled);color:var(--slate-deep)}
.cell[data-state="gap"]{background:var(--x-proposed-gap);color:var(--ink-muted)}
.cell[data-state="hidden"]{background:var(--x-proposed-unseen),var(--surface-inset);box-shadow:inset 0 0 0 1px var(--hairline);color:var(--ink-muted)}
.cell[data-state="na"]{color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.cell.lit{box-shadow:0 0 0 var(--focus-gap) var(--slate-deep),0 0 0 calc(var(--focus-gap) + 2px) var(--x-proposed-lit)}
.cell[data-state="disputed"].lit{box-shadow:inset 0 0 0 2px var(--x-proposed-disagree),0 0 0 var(--focus-gap) var(--slate-deep),0 0 0 calc(var(--focus-gap) + 2px) var(--x-proposed-lit)}
.cell[data-state="soon"].lit{box-shadow:inset 0 0 0 1.5px var(--ink),0 0 0 var(--focus-gap) var(--slate-deep),0 0 0 calc(var(--focus-gap) + 2px) var(--x-proposed-lit)}
.cell.s{--u:var(--space-4);border-radius:2px}
.cell.s svg{display:none}
.cell.m{--u:calc(var(--space-5) + var(--space-1))}

/* the empties as inline marks (catalogue) */
.mk-break{display:inline-block;width:var(--space-5);height:var(--space-3);vertical-align:-1px}
.mk-break path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-meta)}
.tag-dis{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-disagree);border:1px solid color-mix(in srgb,var(--x-proposed-disagree) 40%,transparent);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.fork .alt{border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);padding:var(--space-1) var(--space-2);border-radius:0 2px 2px 0}
.fork .alt b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.fork .alt span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

/* confidence word: the yardstick word is a word, set in small caps-ish mono; never a percentage alone */
.conf{display:inline-flex;align-items:baseline;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-proposed-disagree);white-space:nowrap}

/* pencil: a model's text, its own lane, dotted edge, italic, until a person accepts it */
.pencil{border:1px dashed var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);color:var(--x-proposed-pencil);font-style:italic;font-size:var(--type-meta);line-height:var(--leading-meta)}
.pencil .pby{display:flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);font-style:normal;letter-spacing:var(--tracking-soft);text-transform:uppercase}
.pencil .plinks{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2);font-style:normal;font-size:var(--type-small);margin-top:var(--space-1)}
.pencil .plinks button{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap)}
.pencil.off{border-style:solid;border-color:var(--hairline);background:none;color:var(--ink-muted);font-style:normal}

/* refs inside a sentence: words that are handles onto the picture and the records */
.ref{color:var(--light);border-bottom:1px solid var(--hairline-strong);border-radius:2px;padding:0 1px;transition:background var(--motion-base) var(--ease-out),border-color var(--motion-base) var(--ease-out)}
.ref:hover{border-bottom-color:var(--ink-muted)}
.ref.lit{background:var(--x-proposed-lit-wash);border-bottom:2px solid var(--x-proposed-lit)}
.ref.ov{color:color-mix(in srgb,var(--x-proposed-overdue) 60%,var(--light))}

/* rack focus: the far plane blurs and loses colour, never a black scrim */
.far{filter:blur(var(--x-proposed-rack-blur)) saturate(.4);opacity:.55}
@media (prefers-reduced-motion: reduce){.far{filter:saturate(.4)}}

/* records: a quiet table */
.rt{width:100%;border-collapse:collapse;font-size:var(--type-meta);line-height:var(--leading-meta)}
.rt th{text-align:left;font-weight:400;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline-strong);white-space:nowrap}
.rt td{padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline);color:var(--ink);white-space:nowrap;vertical-align:top}
.rt td.k{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.rt td.src{white-space:normal;color:var(--ink-muted);font-size:var(--type-small)}
.rt tr.lit td{background:var(--x-proposed-lit-wash)}
.rt tr.lit td:first-child{box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.rt tr.brk td{color:var(--ink-muted);font-size:var(--type-small);border-bottom-style:dashed}

/* deposit once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){
  .pre .dep{transform:none}
  .dep{transition-delay:0ms}
  *{scroll-behavior:auto!important}
}
.cell.s{--x-proposed-gap-tick:var(--space-1)}
.nw{white-space:nowrap}

/* ===================== this variant ===================== */
.v6{display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) calc(var(--measure-drawer) + var(--space-6));gap:var(--space-6);min-height:0;padding-top:var(--space-5)}
.talk{display:flex;flex-direction:column;min-height:0;min-width:0}
.bl{margin:var(--space-2) 0 var(--space-3);font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light);max-width:46ch}
.bl .ref{color:var(--light)}
.bl .ref.ov{color:color-mix(in srgb,var(--x-proposed-overdue) 55%,var(--light))}
.qs{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-4)}
.qs button{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);font-size:var(--type-meta);color:var(--ink);transition:background var(--motion-base) var(--ease-out),color var(--motion-base) var(--ease-out)}
.qs button:hover{background:var(--surface-raised)}
.qs button .kbd{border-color:var(--hairline)}
.qs button[aria-pressed="true"]{color:var(--ink-muted);border-style:dashed}
.qs button.pq{border-style:dashed;border-color:var(--x-proposed-pencil);color:var(--x-proposed-pencil)}
.qs .h{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}
.answers{flex:1;min-height:0;overflow:auto;padding-right:var(--space-3)}
.ans{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-5)) minmax(0,1fr);gap:var(--space-4);padding:var(--space-3) 0;border-top:1px solid var(--hairline);transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.ans.fresh{opacity:0;transform:translateY(var(--space-2))}
@media (prefers-reduced-motion: reduce){.ans.fresh{transform:none}}
.ans .aq{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.ans .aq b{display:block;font-weight:400;color:var(--ink);font-size:var(--type-body);line-height:var(--leading-body)}
.ans .aq .ht{font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase}
.ans .say{margin:0 0 var(--space-2);font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink)}
.ans .say b{font-weight:400;color:var(--light)}
.ans .say .conf{margin-right:var(--space-1)}
.rowc{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4)}
.rowc .u{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.rowc .u .cell{--u:calc(var(--space-5) + var(--space-1))}
.rowc .u .cell svg{width:var(--space-4);height:var(--space-4)}
.rowc .u span span{display:block;color:var(--ink-muted);font-family:var(--font-mono);font-size:var(--x-proposed-type-micro)}
.vis{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.vis li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.vis li b{font-weight:400;color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta)}
.vis li .id{font-family:var(--font-mono)}
.vis li svg{margin-top:var(--space-1)}
.mini{display:grid;grid-template-columns:repeat(12,var(--space-6));gap:var(--space-1);align-items:end}
.mini .c{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;min-height:calc(var(--space-4) * 4 + 6px)}
.mini .c .cell{--u:var(--space-4);border-radius:2px}
.mini .c .cell svg{display:none}
.mini .c.lost{border-left:1px dashed var(--hairline-strong);border-right:1px dashed var(--hairline-strong);justify-content:center}
.mini .c.lost .mk-break{width:var(--space-5)}
.mini .m{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);text-align:center}
.peers{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:2px var(--space-3);align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.peers .row{display:flex;gap:2px}
.peers .row .cell{--u:var(--space-3);border-radius:2px}
.peers .row .cell svg{display:none}
.peers .here{color:var(--light)}
.peers .say2{color:var(--ink-muted)}
.peers .lockbar{width:calc((var(--space-3) + 2px) * 11 - 2px);height:var(--space-3);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.act{display:grid;gap:var(--space-1);padding:var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:left}
.act:hover{background:var(--surface-raised)}
.act b{display:flex;align-items:center;gap:var(--space-2);font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.act .reach{color:var(--ink)}
.pencil .acc{display:flex;gap:var(--space-2);margin-top:var(--space-2);font-style:normal}
.pencil .acc button{height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink)}

/* the briefing it becomes */
.brief{border-left:1px solid var(--hairline);padding-left:var(--space-4);min-height:0;overflow:auto;display:flex;flex-direction:column;gap:var(--space-3)}
.brief h3{margin:0;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.brief .bluf{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.brief .bluf b{font-weight:400;color:var(--light)}
.brief ol{margin:0;padding-left:var(--space-4);display:grid;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.brief ol li b{font-weight:400;color:var(--ink)}
.brief ol li.p b{color:var(--x-proposed-pencil);font-style:italic}
.brief .empty{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3)}
.brief .go{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-md);padding:0 var(--space-4);border-radius:var(--radius-key);background:var(--surface-raised);border:1px solid var(--hairline-strong);color:var(--light);font-size:var(--type-meta)}
.brief .note{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:0}
.brief .note b{font-weight:400;color:var(--ink)}
.gw{display:inline-flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-pencil)}
.gw.off{color:var(--ink-muted)}

</style>
</head>
<body>
<div class="frame pre" id="wrap">
  <header class="band" id="band"></header>
  <div class="v6">
    <main class="talk">
      <p class="eyebrow dep" id="q"></p>
      <p class="bl dep" id="bl" style="--i:1"></p>
      <div class="qs dep" id="qs" style="--i:2" role="toolbar" aria-label="Ask the next question"></div>
      <div class="answers scroll" id="answers" aria-live="polite"></div>
    </main>
    <aside class="brief dep" id="brief" style="--i:3"></aside>
  </div>
  <div class="foot"><div class="hints">
    <span><span class="kbd">1</span>&ndash;<span class="kbd">6</span> ask a question</span>
    <span><span class="kbd">G</span> model gateway on or off</span>
    <span><span class="kbd">T</span> technical words</span>
    <span><span class="kbd">R</span> replay</span>
  </div></div>

/* ---------- shared helpers: dates, counts, the template sentence, marks, keys ---------- */
const D = DATA;
const $ = (s, r = document) => r.querySelector(s);

const MS = n => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)) || 0;

const MONTH = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const WORDS = ['no','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const ORD = ['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth','eleventh','twelfth'];

/* ---------- one item's records: its visits, the lost stretch, the dispute, the empty ---------- */
function visitRows(r) {
  const out = [];

    ? `<li class="brk">${BREAK}<span><b>No record</b> ${esc(fmtS(D.noRecord.from))} to ${esc(fmtS(D.noRecord.to))}: ${esc(D.noRecord.why)}. A visit was due in this stretch; nobody can say whether it happened.</span></li>`

/* ---------- the state of one inspection at a past date, worked out from its visits ---------- */
const addMonths = (s, m) => { const d = dt(s); d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); };
const inLost = s => s >= D.noRecord.from && s <= D.noRecord.to;
function statusAt(r, d) {
  if (!r.months || !['overdue','disputed','soon','ok'].includes(r.state)) return null;
  const vs = r.visits.filter(v => v.date <= d);
  const last = vs.filter(v => !v.disputed).pop();
  if (!last) return null;
  const due = addMonths(last.date, r.months);
  if (due >= d) return { st: 'ok', due };
  if (inLost(due)) return { st: 'norecord', due };
  if (vs.some(v => v.disputed && v.date > due)) return { st: 'disputed', due, late: days(due, d) };

}
/* month ends for the last twelve months, then today */
function monthEnds() {
  const t = TODAY, out = [];
  for (let i = 11; i >= 1; i--) { const e = new Date(t.getFullYear(), t.getMonth() - i + 1, 0, 12); out.push({ d: e.toISOString().slice(0, 10), m: MON[e.getMonth()], y: e.getFullYear() }); }
  out.push({ d: D.today, m: 'Today', y: t.getFullYear(), today: true });
  return out.map(c => ({ ...c, lost: inLost(c.d), items: D.regime.map(r => ({ r, s: statusAt(r, c.d) })).filter(x => x.s && x.s.st !== 'ok') }));

  { id: 'which', q: 'Which ones?', ht: 'picture', tech: 'aggregate · by state', a: ansWhich, line: () => `${byState('overdue').map(r => r.name).join(', ')}; hoists disputed` },
  { id: 'how', q: 'How do you know?', ht: 'records', tech: 'observations · sources', a: ansHow, line: () => `${D.visits.length} visits from reports in Artifacts; one dispute` },
  { id: 'since', q: 'Since when?', ht: 'picture over time', tech: 'count over time', a: ansSince, line: () => 'none at the end of August; rising since' },
  { id: 'usual', q: 'Is that unusual?', ht: 'one step up', tech: 'peer set', a: ansUsual, line: () => 'the most of the five sites you can see' },
  { id: 'why', q: 'Why?', ht: 'pencil', tech: 'model gateway · proposal', a: ansWhy, line: () => GW ? 'a proposed reason, not yet accepted' : 'records that may explain it', pencil: true },
  { id: 'now', q: 'What now?', ht: 'use it', tech: 'publish · bind · watch', a: ansNow, line: () => 'brief, feed the intent, or watch' }
];

function ansWhich() {
  const groups = ['overdue', 'disputed', 'soon'].map(s => byState(s).map(r => `<span class="u">${cellHTML(r)}<span>${esc(r.name)}<span>${esc(shortStatus(r))}</span></span></span>`).join('')).join('');
  const rest = D.regime.filter(r => !['overdue', 'disputed', 'soon'].includes(r.state));
  return `<p class="say">These ${word(COUNT.overdue)} are overdue, <b>workshop hoists</b> probably are, and ${word(COUNT.soon)} fall due within a fortnight.</p>
  <div class="rowc">${groups}</div>
  <p class="say" style="margin-top:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)">The other ${word(rest.length)}: ${rest.map(r => `${cellHTML(r, 's')} ${esc(r.name.toLowerCase())} (${esc(shortStatus(r))})`).join(', ')}.</p>`;
}
function ansHow() {
  const ov = byState('overdue').concat(byState('disputed'));
  const docs = new Set(D.visits.map(v => v.src)).size;
  const hoist = byState('disputed')[0];
  return `<p class="say"><span class="conf">Almost certain</span> for ${word(COUNT.overdue)}: from <b>${D.visits.length} visits</b> read from <b>${docs} reports</b> in Artifacts, no visit is recorded after each due date. <span class="conf">${esc(hoist.confidence)}</span> for the hoists: two sources disagree.</p>
  <ul class="vis">${ov.filter(r => r.state === 'overdue').map(r => { const v = r.visits[r.visits.length - 1]; return `<li>${ico('file-text', 14)}<span><b>${esc(r.name)}: last visit ${esc(fmt(v.date))}</b> ${esc(v.by)} <span class="id">${esc(v.id)}</span> · from <i>${esc(v.src)}</i></span></li>`; }).join('')}</ul>
  <div class="fork" style="margin-top:var(--space-2)">${hoist.sides.map(s => `<div class="alt"><b>${esc(s.says)}</b><span>${esc(s.from)}</span><span>${esc(s.gradeWord)}<span class="tk"> · grade ${s.grade}</span></span></div>`).join('')}</div>`;
}
function ansSince() {
  const z = COLS.slice(0, -1).filter(c => !c.lost && !c.items.some(x => x.s.st === 'overdue' || x.s.st === 'disputed')).pop();
  return `<p class="say">None was overdue at the end of <b>${esc(MONTH[MON.indexOf(z.m)])}</b>. Since then, ${COLS.filter(c => c.d > z.d).map(c => `${c.today ? 'today' : c.m} ${c.items.filter(x => x.s.st === 'overdue').length}`).join(', ')}.</p>
  <div class="mini">${COLS.map(c => c.lost ? `<div class="c lost">${BREAK}</div>` : `<div class="c">${c.items.map(x => `<span class="cell" data-state="${x.s.st}"></span>`).join('')}</div>`).join('')}
  ${COLS.map(c => `<span class="m">${esc(c.today ? 'now' : c.m)}</span>`).join('')}</div>
  <p class="say" style="margin-top:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)">${BREAK} No record ${esc(fmtS(D.noRecord.from))} to ${esc(fmtS(D.noRecord.to))}: ${esc(D.noRecord.why)}.</p>`;
}
function ansUsual() {
  const seen = D.peers.filter(p => !p.locked);
  return `<p class="say">Yes. Of the ${word(seen.length)} sites you can see, ${esc(D.entity.name)} has the most. One more site is kept where you can’t see it.</p>
  <div class="peers">${D.peers.map(p => p.locked
    ? `<span>${esc(p.name)}</span><span class="lockbar"></span><span class="say2"><span class="unseen">${ico('lock', 12)} ${esc(floorOf(p.keptOn).name)}</span> ask ${esc(p.ask)}</span>`
    : `<span class="${p.here ? 'here' : ''}">${esc(p.name)}</span><span class="row">${p.cells.map(c => `<span class="cell" data-state="${c}"></span>`).join('')}</span><span class="say2">${late(p.cells) ? word(late(p.cells)) : 'none'}</span>`).join('')}</div>`;
}
function linkFor(id) {
  if (id === D.contract.id) return `${ico('file-text', 12)} ${esc(D.contract.id)} ${esc(D.contract.name)} with ${esc(D.contract.with)}, ended ${esc(fmt(D.contract.ended))}${D.contract.renewed ? '' : ', not renewed'}`;
  const v = V(id); if (v) return `${ico('file-text', 12)} ${esc(v.id)} last extinguisher service, ${esc(fmt(v.date))}`;
  const m = D.intents.find(i => i.id === id); if (m) return `${ico('target', 12)} ${esc(m.id)} “${esc(m.title)}”, ${esc(m.owner)}${m.due ? ', due ' + esc(fmt(m.due)) + (m.due < D.today ? ', past its deadline' : '') : ''}`;
  return esc(id);
}
function ansWhy() {
  const links = D.pencil.links.map(l => `<button>${linkFor(l)}</button>`).join('');
  if (!GW) return `<div class="pencil off"><span class="pby">${ico('pen-line', 12)} model gateway is off: no proposed reason</span>These records may explain it. Nothing here was counted differently.<div class="plinks">${links}</div></div>`;
  return `<div class="pencil"><span class="pby">${ico('pencil', 12)} proposed by the ${esc(D.pencil.by)} · not yet accepted</span>${esc(D.pencil.text)}
  <div class="plinks">${links}</div>
  <div class="acc"><button>Accept as a note</button><button>Set aside</button></div></div>
  <p class="say" style="margin-top:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)">A reason is the only thing a model may write here. It never changes a count, and it stays in pencil until a person accepts it.</p>`;
}
function ansNow() {
  const m = D.intents[0];
  return `<div class="acts">
    <button class="act"><b>${ico('book-open', 16)} Brief ${esc(D.lead.name.split(' ')[0])}</b>Publish these answers as a briefing in Artifacts.<span class="reach">Reach: ${esc(D.lead.name)} first, then ${esc(floorOf('facilities').name)} (${D.reach.department} people)</span></button>
    <button class="act"><b>${ico('target', 16)} Feed the intent</b>Attach the finding to “${esc(m.title)}”.<span class="reach">Reach: ${esc(m.owner)}, owner, on the ${esc(floorOf(m.floor).word)}</span></button>
    <button class="act"><b>${ico('bell-plus', 16)} Watch for change</b>Tell me when the count of overdue inspections here changes.<span class="reach">Reach: only you. Checked when a visit is recorded</span></button>
  </div>`;
}

function drawQs() {
  $('#qs').innerHTML = QS.map((q, i) => `<button data-q="${q.id}" class="${q.pencil ? 'pq' : ''}" aria-pressed="${ASKED.includes(q.id)}"><span class="kbd">${i + 1}</span>${esc(q.q)}<span class="h">${esc(q.ht)}</span></button>`).join('');
}
function drawBrief() {
  const items = ASKED.map(id => QS.find(q => q.id === id));
  $('#brief').innerHTML = `<h3>Your briefing, so far</h3>
  <p class="bluf"><b>Bottom line.</b> ${esc(headlineParts().map(p => typeof p === 'string' ? p : p.t).join(''))}</p>
  ${items.length ? `<ol>${items.map(q => `<li class="${q.pencil ? 'p' : ''}"><b>${esc(q.q)}</b> ${esc(q.line())}</li>`).join('')}</ol>` : `<p class="empty">Ask a question on the left. Each one you ask becomes a section here, in the order a lead reads it.</p>`}
  <button class="go">${ico('send', 16)} Make it a briefing in Artifacts</button>
  <p class="note">Ink sections are built from records by template. ${ASKED.includes('why') ? `The <b>Why?</b> section goes in as pencil unless you accept it.` : ''}</p>
  <p class="gw ${GW ? '' : 'off'}">${ico(GW ? 'sparkles' : 'pen-line', 12)} model gateway ${GW ? 'on' : 'off'} <span class="kbd">G</span></p>`;
  Icons.hydrate($('#brief'));
}
function ask(id, quiet) {
  const q = QS.find(x => x.id === id); if (!q) return;
  if (!ASKED.includes(id)) ASKED.push(id);
  let el = $(`.ans[data-q="${id}"]`);
  const html = `<div class="aq"><b>${esc(q.q)}</b><span class="ht">${esc(q.ht)}</span><span class="tk">${esc(q.tech)}</span></div><div class="aa">${q.a()}</div>`;
  if (el) el.innerHTML = html;
  else { el = document.createElement('section'); el.className = 'ans fresh'; el.dataset.q = id; el.innerHTML = html; $('#answers').appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('fresh'))); }
  Icons.hydrate(el);
  if (!quiet) el.scrollIntoView({ block: 'nearest', behavior: REDUCE ? 'auto' : 'smooth' });
  drawQs(); drawBrief();
}
function setGW(on) { GW = on; if (ASKED.includes('why')) ask('why', true); drawBrief(); }

$('#band').innerHTML = bandHTML();
$('#q').textContent = D.fact.question;
$('#bl').innerHTML = partsHTML(headlineParts());
document.addEventListener('click', e => {
  const b = e.target.closest('.qs button'); if (b) { ask(b.dataset.q); return; }
  const rf = e.target.closest('.bl .ref'); if (rf) ask(rf.dataset.ref === 'state:disputed' ? 'how' : 'which');
});
QS.forEach((q, i) => KEYS[String(i + 1)] = () => ask(q.id));
KEYS.g = () => setGW(!GW);

async function demo(id) {
  ask('which'); await wait('--motion-spin'); if (!demoAlive(id)) return;
  ask('how'); await wait('--motion-spin'); if (!demoAlive(id)) return;
  ask('why');
}
window.replay = () => { ASKED.length = 0; $('#answers').innerHTML = ''; drawQs(); drawBrief(); startDemo(demo); };
drawQs(); drawBrief();
requestAnimationFrame(() => requestAnimationFrame(() => $('#wrap').classList.remove('pre')));
startDemo(demo);

</script>
</body>
</html>
