<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Heights · V4 · The detail dial</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens (all mixes of kit tokens; listed as "needs token"
   in notes.md). Shared by all six variants of "the fact at three heights".
   --------------------------------------------------------------- */
:root{
  /* not known yet: four corner ticks (catalogue --mark-gap) */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-proposed-gap-tick: var(--space-2);
  /* stale hatch 45deg, not-yours hatch 135deg (catalogue) */
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* sources disagree: warning-tinted edge, never red (catalogue) */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  --x-proposed-quiet: .62;
  --x-proposed-here: var(--floor-department-high);
  --x-proposed-type-micro: .6875rem;
  /* pencil (reference desk): anything a model wrote, until a person accepts it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 72%, var(--info));
  --x-proposed-pencil-wash: color-mix(in srgb, var(--info) 6%, transparent);
  /* NEW in this run. Overdue is a need, so it is the one lit state: a softened danger, never pure red */
  --x-proposed-overdue: color-mix(in srgb, var(--danger) 78%, var(--ink));
  --x-proposed-overdue-wash: color-mix(in srgb, var(--danger) 9%, transparent);
  /* NEW. In date is history, so it is ink at rest, no light */
  --x-proposed-settled: color-mix(in srgb, var(--ink-muted) 58%, transparent);
  /* NEW. "Your place": the thread that survives a change of height (light language: the lit path) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* NEW. One isotype symbol: the unit cell every height counts in */
  --x-proposed-unit: calc(var(--space-6) + var(--space-2));
  /* NEW. Rack focus on the far plane (focal planes, cinematic run) */
  --x-proposed-rack-blur: calc(var(--glow-blur) / 6);
}
:root, .mk-gap, .cell[data-state="gap"]{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints > span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* two registers */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* ---------- frame: top band with the entity, floor and register ---------- */
.frame{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:var(--space-4) var(--edge) 0}
.band{display:flex;align-items:center;gap:var(--space-4);padding-bottom:var(--space-3);border-bottom:1px solid var(--hairline)}
.band .crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);min-width:0}
.band .crumb b{font-weight:400;color:var(--light)}
.band .crumb .sep{opacity:var(--x-proposed-quiet);display:inline-flex}
.band .fl{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-left:auto;white-space:nowrap}
.band .fl::before{content:"";width:var(--space-5);height:2px;background:var(--x-proposed-here)}
.band .fl b{font-weight:400;color:var(--ink)}
.techbtn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.techbtn[aria-pressed="true"]{color:var(--light);border-color:var(--ink-muted);background:var(--surface-raised)}
.foot{display:flex;align-items:center;justify-content:flex-start;gap:var(--space-4);padding:var(--space-3) 0 calc(var(--space-5) + var(--space-3))}

/* ---------- the states, as one unit cell (isotype: the same symbol, repeated) ---------- */
.cell{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--u,var(--x-proposed-unit));height:var(--u,var(--x-proposed-unit));border-radius:var(--radius-key);color:var(--slate-deep);transition:box-shadow var(--motion-base) var(--ease-out),opacity var(--motion-base) var(--ease-out),filter var(--motion-base) var(--ease-out)}
.cell svg{width:calc(var(--u,var(--x-proposed-unit)) * .5);height:calc(var(--u,var(--x-proposed-unit)) * .5)}
.cell[data-state="overdue"]{background:var(--x-proposed-overdue)}
.cell[data-state="disputed"]{background:linear-gradient(90deg,var(--x-proposed-overdue) 0 50%,var(--x-proposed-disagree-wash) 50%);box-shadow:inset 0 0 0 2px var(--x-proposed-disagree);color:var(--slate-deep)}
.cell[data-state="disputed"] svg{color:var(--light)}
.cell[data-state="soon"]{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.cell[data-state="ok"]{background:var(--x-proposed-settled);color:var(--slate-deep)}
.cell[data-state="gap"]{background:var(--x-proposed-gap);color:var(--ink-muted)}
.cell[data-state="hidden"]{background:var(--x-proposed-unseen),var(--surface-inset);box-shadow:inset 0 0 0 1px var(--hairline);color:var(--ink-muted)}
.cell[data-state="na"]{color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.cell.lit{box-shadow:0 0 0 var(--focus-gap) var(--slate-deep),0 0 0 calc(var(--focus-gap) + 2px) var(--x-proposed-lit)}
.cell[data-state="disputed"].lit{box-shadow:inset 0 0 0 2px var(--x-proposed-disagree),0 0 0 var(--focus-gap) var(--slate-deep),0 0 0 calc(var(--focus-gap) + 2px) var(--x-proposed-lit)}
.cell[data-state="soon"].lit{box-shadow:inset 0 0 0 1.5px var(--ink),0 0 0 var(--focus-gap) var(--slate-deep),0 0 0 calc(var(--focus-gap) + 2px) var(--x-proposed-lit)}
.cell.s{--u:var(--space-4);border-radius:2px}
.cell.s svg{display:none}
.cell.m{--u:calc(var(--space-5) + var(--space-1))}

/* the empties as inline marks (catalogue) */
.mk-break{display:inline-block;width:var(--space-5);height:var(--space-3);vertical-align:-1px}
.mk-break path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-meta)}
.tag-dis{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-disagree);border:1px solid color-mix(in srgb,var(--x-proposed-disagree) 40%,transparent);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.fork .alt{border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);padding:var(--space-1) var(--space-2);border-radius:0 2px 2px 0}
.fork .alt b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.fork .alt span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

/* confidence word: the yardstick word is a word, set in small caps-ish mono; never a percentage alone */
.conf{display:inline-flex;align-items:baseline;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-proposed-disagree);white-space:nowrap}

/* pencil: a model's text, its own lane, dotted edge, italic, until a person accepts it */
.pencil{border:1px dashed var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);color:var(--x-proposed-pencil);font-style:italic;font-size:var(--type-meta);line-height:var(--leading-meta)}
.pencil .pby{display:flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);font-style:normal;letter-spacing:var(--tracking-soft);text-transform:uppercase}
.pencil .plinks{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2);font-style:normal;font-size:var(--type-small);margin-top:var(--space-1)}
.pencil .plinks button{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap)}
.pencil.off{border-style:solid;border-color:var(--hairline);background:none;color:var(--ink-muted);font-style:normal}

/* refs inside a sentence: words that are handles onto the picture and the records */
.ref{color:var(--light);border-bottom:1px solid var(--hairline-strong);border-radius:2px;padding:0 1px;transition:background var(--motion-base) var(--ease-out),border-color var(--motion-base) var(--ease-out)}
.ref:hover{border-bottom-color:var(--ink-muted)}
.ref.lit{background:var(--x-proposed-lit-wash);border-bottom:2px solid var(--x-proposed-lit)}
.ref.ov{color:color-mix(in srgb,var(--x-proposed-overdue) 60%,var(--light))}

/* rack focus: the far plane blurs and loses colour, never a black scrim */
.far{filter:blur(var(--x-proposed-rack-blur)) saturate(.4);opacity:.55}
@media (prefers-reduced-motion: reduce){.far{filter:saturate(.4)}}

/* records: a quiet table */
.rt{width:100%;border-collapse:collapse;font-size:var(--type-meta);line-height:var(--leading-meta)}
.rt th{text-align:left;font-weight:400;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline-strong);white-space:nowrap}
.rt td{padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline);color:var(--ink);white-space:nowrap;vertical-align:top}
.rt td.k{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.rt td.src{white-space:normal;color:var(--ink-muted);font-size:var(--type-small)}
.rt tr.lit td{background:var(--x-proposed-lit-wash)}
.rt tr.lit td:first-child{box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.rt tr.brk td{color:var(--ink-muted);font-size:var(--type-small);border-bottom-style:dashed}

/* deposit once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){
  .pre .dep{transform:none}
  .dep{transition-delay:0ms}
  *{scroll-behavior:auto!important}
}
.cell.s{--x-proposed-gap-tick:var(--space-1)}
.nw{white-space:nowrap}

/* ===================== this variant ===================== */
.v4{display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:calc(var(--measure-rail) - var(--space-4)) minmax(0,1fr);gap:var(--space-6);min-height:0;padding-top:var(--space-5)}
.dial{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.dialbox{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-3);height:calc(var(--space-8) * 2.4)}
#dial{writing-mode:vertical-lr;width:var(--space-5);height:100%;margin:0;accent-color:var(--x-proposed-lit);cursor:pointer}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-between}
.stops button{display:block;width:100%;padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.stops button span:not(.tk){display:block;font-size:var(--type-small);line-height:var(--leading-small);opacity:var(--x-proposed-quiet)}
.stops button[aria-current="true"]{color:var(--light);background:var(--surface-raised)}
.held{border-top:1px solid var(--hairline);padding-top:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.held b{display:block;font-weight:400;color:var(--x-proposed-lit);font-size:var(--type-meta);line-height:var(--leading-meta);margin:var(--space-1) 0}

.board{display:flex;flex-direction:column;min-height:0;min-width:0}
.bl{margin:0 0 var(--space-4);font-weight:300;color:var(--ink);transition:font-size var(--motion-slow) var(--ease-out),line-height var(--motion-slow) var(--ease-out);font-size:var(--type-title);line-height:var(--leading-title);max-width:34ch}
.bl.small{font-size:var(--type-lead);line-height:var(--leading-lead);max-width:none}
.bl .ref{color:var(--light)}
.bl .ref.ov{color:color-mix(in srgb,var(--x-proposed-overdue) 55%,var(--light))}
.stage{position:relative;flex:1;min-height:0}
@media (prefers-reduced-motion: reduce){.bl{transition:none}}

/* the big number at stop 1 */
.num{position:absolute;left:0;top:0;display:flex;align-items:baseline;gap:var(--space-4);transition:opacity var(--motion-slow) var(--ease-out)}
.num b{font-weight:200;font-size:calc(var(--type-hero) * 1.6);line-height:1;color:color-mix(in srgb,var(--x-proposed-overdue) 60%,var(--light))}
.num > span{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink-muted);max-width:28ch}
.num > span b{font-size:inherit;line-height:inherit;font-weight:400;color:var(--ink)}
.stage[data-stop="0"] .num{opacity:1}
.stage:not([data-stop="0"]) .num{opacity:0;pointer-events:none}

/* one element per inspection, kept across every stop (object constancy) */
.it{position:absolute;display:grid;grid-template-columns:calc(var(--measure-rail) - var(--space-4)) minmax(0,1fr);align-items:center;border-radius:var(--radius-key);transition:left var(--motion-slow) var(--ease-out),top var(--motion-slow) var(--ease-out),width var(--motion-slow) var(--ease-out),height var(--motion-slow) var(--ease-out),opacity var(--motion-slow) var(--ease-out),background var(--motion-slow) var(--ease-out),box-shadow var(--motion-base) var(--ease-out);overflow:hidden;cursor:pointer}
@media (prefers-reduced-motion: reduce){.it{transition:opacity var(--motion-base) linear,background var(--motion-base) linear}}
.it .nm{padding:0 var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:var(--space-2);align-items:center;transition:opacity var(--motion-base) var(--ease-out)}
.it .nm svg{color:var(--ink-muted);flex:none}
.it .ln{position:relative;height:100%;transition:opacity var(--motion-base) var(--ease-out)}
.it .ln svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* stop 2: the bar. each element is a cell */
.stage[data-stop="1"] .it{grid-template-columns:0 0}
.stage[data-stop="1"] .it .nm,.stage[data-stop="1"] .it .ln,.stage[data-stop="0"] .it .nm,.stage[data-stop="0"] .it .ln{opacity:0}
.stage[data-stop="1"] .it[data-state="overdue"],.stage[data-stop="0"] .it[data-state="overdue"]{background:var(--x-proposed-overdue)}
.stage[data-stop="1"] .it[data-state="disputed"]{background:linear-gradient(90deg,var(--x-proposed-overdue) 0 50%,var(--x-proposed-disagree-wash) 50%);box-shadow:inset 0 0 0 2px var(--x-proposed-disagree)}
.stage[data-stop="1"] .it[data-state="soon"]{box-shadow:inset 0 0 0 1.5px var(--ink)}
.stage[data-stop="1"] .it[data-state="ok"]{background:var(--x-proposed-settled)}
.stage[data-stop="1"] .it[data-state="gap"]{background:var(--x-proposed-gap)}
.stage[data-stop="1"] .it[data-state="hidden"]{background:var(--x-proposed-unseen),var(--surface-inset);box-shadow:inset 0 0 0 1px var(--hairline)}
.stage[data-stop="1"] .it[data-state="na"]{box-shadow:inset 0 0 0 1px var(--hairline);opacity:var(--x-proposed-quiet)}
.stage[data-stop="0"] .it{opacity:0}
/* stops 3 and 4: lanes */
.stage[data-stop="2"] .it,.stage[data-stop="3"] .it{border-bottom:1px solid var(--hairline);border-radius:0}
.it.lit{box-shadow:0 0 0 2px var(--x-proposed-lit)}
.stage[data-stop="2"] .it.lit,.stage[data-stop="3"] .it.lit{background:var(--x-proposed-lit-wash);box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.ln .late{fill:var(--x-proposed-overdue)}
.ln .fine{fill:var(--x-proposed-settled)}
.ln .due{stroke:var(--ink);stroke-width:1.5}
.ln .v{fill:var(--light)}
.ln .vd{fill:none;stroke:var(--x-proposed-disagree);stroke-width:1.5}
.ln text{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--ink-muted)}
.ln text.d{fill:var(--ink)}
.ln .vl{opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.stage[data-stop="3"] .ln .vl{opacity:1}
.ln .say{position:absolute;left:var(--space-2);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);white-space:nowrap}
.ln .gapbox{position:absolute;inset:var(--space-1) 0;background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-1)}
.ln .hidbox{position:absolute;inset:var(--space-1) 0;background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:2px}

/* stage furniture for lanes: axis, today, the lost stretch */
.furn{position:absolute;inset:0;pointer-events:none;transition:opacity var(--motion-slow) var(--ease-out)}
.stage[data-stop="0"] .furn,.stage[data-stop="1"] .furn{opacity:0}
.furn .ax{position:absolute;top:0;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);transform:translateX(-50%)}
.furn .today{position:absolute;top:var(--space-4);bottom:0;border-left:1px solid var(--x-proposed-lit)}
.furn .today span{position:absolute;top:calc(var(--space-4) * -1);right:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--x-proposed-lit);white-space:nowrap}
.furn .lost{position:absolute;top:var(--space-4);bottom:0;background:repeating-linear-gradient(90deg,transparent 0 3px,color-mix(in srgb,var(--ink) 4%,transparent) 3px 4px);border-left:1px dashed var(--hairline-strong);border-right:1px dashed var(--hairline-strong)}
.furn .lost span{position:absolute;bottom:calc(var(--space-5) * -1);left:0;right:0;text-align:center;font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
/* group labels under the bar at stop 2 */
.glab{position:absolute;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);transition:opacity var(--motion-base) var(--ease-out);white-space:nowrap}
.glab b{display:block;font:200 var(--type-title-s)/1 var(--font-sans);color:var(--light)}
.stage:not([data-stop="1"]) .glab{opacity:0}
.stage.tight .ln text.id{display:none}
.stage.tight .ln text.vl{dominant-baseline:auto}

</style>
</head>
<body>
<div class="frame pre" id="wrap">
  <header class="band" id="band"></header>
  <div class="v4">

  ],

  /* sites like this one, for comparison (counted the same way) */
  peers: [
    { name: 'Northgate Depot', here: true, cells: ['overdue','overdue','overdue','disputed','soon','soon','ok','ok','gap','hidden','na'] },
    { name: 'Hilltop Recycling Centre', cells: ['overdue','overdue','soon','ok','ok','ok','ok','ok','ok','na','na'] },

  ],

/* ---------- shared helpers: dates, counts, the template sentence, marks, keys ---------- */
const D = DATA;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* every wait comes from a motion token, never a magic number */
const MS = n => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)) || 0;
const wait = n => new Promise(r => setTimeout(r, typeof n === 'string' ? MS(n) : n));
const DAY = 864e5;
const dt = s => new Date(s + 'T12:00:00');
const TODAY = dt(D.today);
const MONTH = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = s => { if (!s) return ''; const d = dt(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtS = s => { const d = dt(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const days = (a, b) => Math.round((dt(b) - dt(a)) / DAY);
const WORDS = ['no','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const ORD = ['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth','eleventh','twelfth'];
const word = n => WORDS[n] || String(n);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const ico = (n, size = 16, stroke = 1.75) => Icons.svg(n, { size, stroke });

/* derive from the records: late days, days to go, the visits of each item */
D.regime.forEach(r => {
  r.visits = D.visits.filter(v => v.of === r.id).sort((a, b) => a.date < b.date ? -1 : 1);
  if (r.due) { r.late = days(r.due, D.today); r.togo = -r.late; }
});
const R = id => D.regime.find(r => r.id === id);
const V = id => D.visits.find(v => v.id === id);
const ORDER = Object.keys(D.states);
const byState = st => D.regime.filter(r => r.state === st);
const COUNT = Object.fromEntries(ORDER.map(s => [s, byState(s).length]));
const overdueSorted = byState('overdue').sort((a, b) => b.late - a.late);
const oldest = overdueSorted[0];
const floorOf = k => D.floors[k];

/* ---------- the bottom line, built by template from the counts (never by a model) ---------- */
/* returns an array of parts: strings, or {t, ref, cls} handles onto the picture and records */
function headlineParts() {
  const n = COUNT.overdue, p = COUNT.disputed, e = D.entity.name;
  const parts = [e + ' has ', { t: word(n) + ' ' + D.fact.noun[n === 1 ? 0 : 1] + ' overdue', ref: 'state:overdue', cls: 'ov' }];
  if (p) parts.push(', and ', { t: 'probably a ' + ORD[n + 1], ref: 'state:disputed' });
  parts.push('. The oldest is ', { t: oldest.name.toLowerCase(), ref: 'item:' + oldest.id }, ', ', { t: oldest.late + ' days late', ref: 'item:' + oldest.id }, '.');
  return parts;
}
function secondParts() {
  const parts = [];
  if (COUNT.soon) parts.push({ t: cap(word(COUNT.soon)) + ' more ' + (COUNT.soon === 1 ? 'is' : 'are') + ' due in the next fortnight', ref: 'state:soon' });
  const rest = [];
  if (COUNT.gap) rest.push({ t: word(COUNT.gap) + ' is not known yet', ref: 'state:gap' });
  if (COUNT.hidden) rest.push({ t: word(COUNT.hidden) + ' is kept where you can’t see it', ref: 'state:hidden' });
  if (rest.length) { parts.push('; '); rest.forEach((x, i) => { if (i) parts.push(' and '); parts.push(x); }); }
  parts.push('.');
  return parts;
}
function partsHTML(parts, cls = 'ref') {
  /* punctuation after a handle is kept on its line, so a line never starts with a comma */
  let out = '';
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (typeof p === 'string') { out += esc(p); continue; }
    const btn = `<button class="${cls} ${p.cls || ''}" data-ref="${p.ref}">${esc(p.t)}</button>`;
    const nx = parts[i + 1], m = typeof nx === 'string' && nx.match(/^[,.;:]+/);
    if (m) { out += `<span class="nw">${btn}${esc(m[0])}</span>`; parts = parts.slice(); parts[i + 1] = nx.slice(m[0].length); }
    else out += btn;
  }
  return out;
}
/* which regime items a ref points at */
function refItems(ref) {
  const [k, v] = ref.split(':');
  if (k === 'state') return byState(v).map(r => r.id);
  if (k === 'item') return [v];
  return [];
}
/* one plain line per item, by template */
function itemLine(r) {
  switch (r.state) {
    case 'overdue': return `${r.name}: due ${fmt(r.due)}, ${r.late} days late. Last done ${fmt(r.last)} by ${r.by}.`;
    case 'disputed': return `${r.name}: due ${fmt(r.due)}. Two sources disagree about whether it was done.`;
    case 'soon': return `${r.name}: due ${fmt(r.due)}, in ${r.togo} days. Last done ${fmt(r.last)}.`;
    case 'ok': return `${r.name}: in date until ${fmt(r.due)}. Last done ${fmt(r.last)}.`;
    case 'gap': return `${r.name}: not known yet. ${cap(r.fillWhy)}. ${r.fill} could fill it.`;
    case 'hidden': return `${r.name}: kept on ${floorOf(r.keptOn).name}, a floor you can’t open. Ask ${r.ask}.`;
    case 'na': return `${r.name}: doesn’t apply. ${r.naWhy}`;
  }
  return r.name;
}
function shortStatus(r) {
  switch (r.state) {
    case 'overdue': return r.late + ' days late';
    case 'disputed': return 'sources disagree';
    case 'soon': return 'due in ' + r.togo + ' days';
    case 'ok': return 'until ' + fmtS(r.due);
    case 'gap': return 'not known yet';
    case 'hidden': return 'ask ' + r.ask.split(',')[0];
    case 'na': return 'doesn’t apply';
  }
}
function cellHTML(r, cls = '') {
  const st = r.state;
  const ic = st === 'hidden' ? 'lock' : st === 'na' ? 'minus' : r.icon;
  return `<span class="cell ${cls}" data-state="${st}" data-id="${r.id}" title="${esc(r.name + ': ' + D.states[st].plain)}">${ico(ic, 20, 1.75)}</span>`;
}
const BREAK = `<svg class="mk-break" viewBox="0 0 28 12" aria-hidden="true"><path d="M1 6 q3.5 -5 7 0 t7 0 t7 0 t6 0"/></svg>`;
function stateKey(states = ORDER) {
  return states.filter(s => COUNT[s]).map(s => `<span class="kitem"><span class="cell s" data-state="${s}"></span>${esc(D.states[s].plain)}<span class="tk">${esc(D.states[s].tech)}</span></span>`).join('');
}

/* the top band: where you are, on which floor, and the register switch */
function bandHTML(extra = '') {
  const f = floorOf(D.entity.floor);
  return `<div class="crumb"><span>${esc(D.app)}</span><span class="sep">${ico('chevron-right', 14)}</span><span>Sites</span><span class="sep">${ico('chevron-right', 14)}</span><b>${esc(D.entity.name)}</b><span class="tk">${esc(D.entity.id)} · ${esc(D.entity.kindTech)}</span></div>
  ${extra}<span class="fl"><span>Kept on <b>${esc(f.name)}</b>, ${esc(f.word.toLowerCase())}</span></span>
  <button class="techbtn" id="techbtn" aria-pressed="false"><span class="kbd">T</span> technical words</button>`;
}

/* keys: R replay, T register, plus each variant's own */
const KEYS = {};
function setTech(on) {
  document.body.classList.toggle('tech', on);
  const b = $('#techbtn'); if (b) b.setAttribute('aria-pressed', on ? 'true' : 'false');
}
document.addEventListener('click', e => { if (e.target.closest('#techbtn')) setTech(!document.body.classList.contains('tech')); });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches && e.target.matches('input,textarea')) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 't') { setTech(!document.body.classList.contains('tech')); return; }
  if (k === 'r' && window.replay) { window.replay(); return; }
  if (KEYS[k]) { e.preventDefault(); KEYS[k](e); }
});
/* the demo is cancelled by any person's key or click, so it never fights them */
let DEMO = 0;
const demoAlive = id => id === DEMO;
document.addEventListener('pointerdown', e => { if (e.isTrusted) DEMO++; }, true);
document.addEventListener('keydown', e => { if (e.isTrusted && !['r','R'].includes(e.key)) DEMO++; }, true);
function startDemo(fn) {
  const id = ++DEMO;
  setTimeout(() => { if (demoAlive(id)) fn(id); }, MS('--motion-run'));
}

/* ---------- one item's records: its visits, the lost stretch, the dispute, the empty ---------- */
function visitRows(r) {
  const out = [];
  const nr = D.noRecord;
  r.visits.forEach((v, i) => {
    const prev = r.visits[i - 1];
    if (prev && prev.date < nr.from && v.date > nr.to && days(prev.date, v.date) > r.months * 30 * 1.5)
      out.push({ brk: true });
    out.push(v);
  });
  return out;
}
function visitsHTML(r) {
  if (r.state === 'gap') return `<p class="say"><span class="cell s" data-state="gap"></span> ${esc(D.states.gap.plain)}. ${esc(cap(r.fillWhy))}. <b>${esc(r.fill)}</b> could fill it.</p>`;
  if (r.state === 'hidden') return `<p class="say"><span class="unseen">${ico('lock', 12)} kept on ${esc(floorOf(r.keptOn).name)}</span> Its visits exist, on a floor you can’t open. Ask <b>${esc(r.ask)}</b>.</p>`;
  if (r.state === 'na') return `<p class="say">${esc(D.states.na.plain)}. ${esc(r.naWhy)}</p>`;
  const rows = visitRows(r).slice().reverse().map(v => v.brk
    ? `<li class="brk">${BREAK}<span><b>No record</b> ${esc(fmtS(D.noRecord.from))} to ${esc(fmtS(D.noRecord.to))}: ${esc(D.noRecord.why)}. A visit was due in this stretch; nobody can say whether it happened.</span></li>`
    : `<li data-visit="${v.id}">${ico(v.disputed ? 'git-fork' : 'file-text', 14)}<span><b>${esc(fmt(v.date))} · ${esc(v.result)}</b> ${esc(v.by)} <span class="id">${esc(v.id)}</span><br>from <i>${esc(v.src)}</i>, in Artifacts<span class="tk">observation · prov:wasDerivedFrom → artifacts/${esc(v.id.toLowerCase())}</span></span></li>`).join('');
  let dis = '';
  if (r.state === 'disputed') dis = `<div class="fork" style="margin:var(--space-2) 0 var(--space-3)">${r.sides.map(s => `<div class="alt"><b>${esc(s.says)}</b><span>${esc(s.from)}</span><span>${esc(s.gradeWord)}<span class="tk"> · grade ${s.grade}</span></span></div>`).join('')}</div>
  <p class="say"><span class="conf">${esc(r.confidence)}</span> ${esc(r.confidenceOf)}: the person on site outranks the supplier’s own report until someone checks the hoist tag.</p>`;
  return dis + `<ul class="vis">${rows}</ul>`;
}

/* ---------- the state of one inspection at a past date, worked out from its visits ---------- */
const addMonths = (s, m) => { const d = dt(s); d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); };
const inLost = s => s >= D.noRecord.from && s <= D.noRecord.to;
function statusAt(r, d) {
  if (!r.months || !['overdue','disputed','soon','ok'].includes(r.state)) return null;
  const vs = r.visits.filter(v => v.date <= d);
  const last = vs.filter(v => !v.disputed).pop();
  if (!last) return null;
  const due = addMonths(last.date, r.months);
  if (due >= d) return { st: 'ok', due };
  if (inLost(due)) return { st: 'norecord', due };
  if (vs.some(v => v.disputed && v.date > due)) return { st: 'disputed', due, late: days(due, d) };
  return { st: 'overdue', due, late: days(due, d) };
}
/* month ends for the last twelve months, then today */
function monthEnds() {
  const t = TODAY, out = [];
  for (let i = 11; i >= 1; i--) { const e = new Date(t.getFullYear(), t.getMonth() - i + 1, 0, 12); out.push({ d: e.toISOString().slice(0, 10), m: MON[e.getMonth()], y: e.getFullYear() }); }
  out.push({ d: D.today, m: 'Today', y: t.getFullYear(), today: true });
  return out.map(c => ({ ...c, lost: inLost(c.d), items: D.regime.map(r => ({ r, s: statusAt(r, c.d) })).filter(x => x.s && x.s.st !== 'ok') }));
}

/* ===================== this variant ===================== */
/* V4 the detail dial: one control for height. The same eleven elements (one per
   inspection) move from a number, to one bar, to a lane each, to every visit. */
const STOPS = [
  { w: 'One number', s: 'the bottom line', tech: 'scalar' },
  { w: 'One bar', s: 'eleven cells, by state', tech: 'part-to-whole · count by state' },
  { w: 'A line each', s: 'due dates and lateness', tech: 'timeline per entity' },
  { w: 'Every visit', s: 'each record, with its source', tech: 'observations · prov' }
];
const SEQ = ORDER.flatMap(s => byState(s).sort((a, b) => (b.late || 0) - (a.late || 0)));
let STOP = 0, HOLD = oldest.id;
/* time domain for lanes: from the first visit, with room, to a month past today */
const firstVisit = D.visits.map(v => v.date).sort()[0];
const DOM0 = addMonths(firstVisit, -1), DOM1 = addMonths(D.today, 1);
const SPAN = days(DOM0, DOM1);
const pct = d => Math.max(0, Math.min(100, 100 * days(DOM0, d) / SPAN));

$('#band').innerHTML = bandHTML();
$('#stops').innerHTML = STOPS.map((s, i) => `<li><button data-stop="${i}">${esc(s.w)}<span>${esc(s.s)}</span><span class="tk">${esc(s.tech)}</span></button></li>`).join('');

function laneSVG(r) {
  if (r.state === 'gap') return `<div class="gapbox"></div><div class="say">Not known yet: none ever recorded. <b>${esc(r.fill)}</b>&nbsp;could fill it.</div>`;
  if (r.state === 'hidden') return `<div class="hidbox"></div><div class="say"><span class="unseen">${ico('lock', 12)} ${esc(floorOf(r.keptOn).name)}</span> Kept on a floor you can’t open. Ask ${esc(r.ask)}.</div>`;
  if (r.state === 'na') return `<div class="say">Doesn’t apply. ${esc(r.naWhy)}</div>`;
  const vs = r.visits.filter(v => !v.disputed);
  let s = '';
  if (!vs.length && r.last) {
    s += `<rect class="fine" x="0%" y="46%" width="${pct(D.today)}%" height="8%"/><text class="vl" x="0.5%" y="88%">last done ${esc(fmt(r.last))}, before this view; due ${esc(fmt(r.due))}</text>`;
    return `<svg aria-hidden="true">${s}</svg>`;
  }
  vs.forEach((v, i) => {
    const nx = vs[i + 1], due = addMonths(v.date, r.months), stop = nx ? nx.date : D.today;
    const fineEnd = due < stop ? due : stop;
    s += `<rect class="fine" x="${pct(v.date)}%" y="46%" width="${Math.max(0, pct(fineEnd) - pct(v.date))}%" height="8%"/>`;
    if (due < stop && !inLost(due)) s += `<rect class="late" x="${pct(due)}%" y="30%" width="${Math.max(0, pct(stop) - pct(due))}%" height="40%"/>`;
  });
  r.visits.forEach(v => {
    s += v.disputed ? `<circle class="vd" cx="${pct(v.date)}%" cy="50%" r="5"/>` : `<circle class="v" cx="${pct(v.date)}%" cy="50%" r="3.5"/>`;
    s += `<text class="vl ${v.disputed ? '' : 'd'}" x="${pct(v.date)}%" dx="6" y="22%">${esc(fmtS(v.date))}${v.disputed ? ', disputed' : ''}</text><text class="vl id" x="${pct(v.date)}%" dx="6" y="92%">${esc(v.id)}</text>`;
  });
  s += `<line class="due" x1="${pct(r.due)}%" x2="${pct(r.due)}%" y1="20%" y2="80%"/>`;
  return `<svg aria-hidden="true">${s}</svg>`;
}
function build() {
  const st = $('#stage');
  const n = COUNT.overdue, p = COUNT.disputed;
  const months = []; for (let m = 0; m <= 14; m += 2) { const d = addMonths(DOM0, m); if (d <= DOM1) months.push(d); }
  st.innerHTML = `<div class="num"><b>${n}</b><span>${esc(D.fact.noun[1])} overdue${p ? `, and <b>probably a ${ORD[n + 1]}</b>` : ''}, of ${word(D.regime.length)} at ${esc(D.entity.name)}. <span class="conf">Almost certain</span> for ${word(n)}, <span class="conf">${esc(byState('disputed')[0].confidence)}</span> for the ${ORD[n + 1]}.</span></div>
    <div class="furn" id="furn">${months.map(d => `<span class="ax" data-d="${d}">${esc(MON[dt(d).getMonth()])}${dt(d).getMonth() === 0 ? ' ' + dt(d).getFullYear() : ''}</span>`).join('')}
      <div class="lost" id="lost"><span>${BREAK} no record</span></div><div class="today" id="today"><span>today, ${esc(fmtS(D.today))}</span></div></div>
    ${ORDER.filter(s => COUNT[s]).map(s => `<div class="glab" data-g="${s}"><b>${COUNT[s]}</b>${esc(D.states[s].plain)}</div>`).join('')}
    ${SEQ.map(r => `<div class="it" data-id="${r.id}" data-state="${r.state}" role="button" tabindex="0" aria-label="${esc(itemLine(r))}"><div class="nm">${ico(r.icon, 14)}<span>${esc(r.name)}</span></div><div class="ln">${laneSVG(r)}</div></div>`).join('')}`;
  Icons.hydrate(st);
}
function layout() {
  const st = $('#stage'), W = st.clientWidth, H = st.clientHeight;
  const nameW = MS('--measure-rail') - MS('--space-4'), laneW = W - nameW, axH = MS('--space-5');
  st.dataset.stop = STOP;
  const N = SEQ.length;
  if (STOP <= 1) {
    const BW = Math.min(W, MS('--measure-wide') * 1.2), gap = MS('--space-1'), cw = (BW - gap * (N - 1)) / N, ch = MS('--space-7');
    SEQ.forEach((r, i) => Object.assign($(`.it[data-id="${r.id}"]`).style, STOP === 0
      ? { left: (i * MS('--space-2')) + 'px', top: (MS('--type-hero') * 1.6 * 16 + MS('--space-5')) + 'px', width: MS('--space-2') + 'px', height: MS('--space-2') + 'px' }
      : { left: i * (cw + gap) + 'px', top: '0px', width: cw + 'px', height: ch + 'px' }));
    /* group labels sit under the first cell of each group */
    ORDER.filter(s => COUNT[s]).forEach(s => { const i = SEQ.findIndex(r => r.state === s); const g = $(`.glab[data-g="${s}"]`); g.style.left = i * (cw + gap) + 'px'; g.style.top = ch + MS('--space-3') + 'px'; });
  } else {
    const rowH = Math.min(STOP === 2 ? MS('--space-6') : MS('--space-7'), (H - axH - MS('--space-5')) / N);
    SEQ.forEach((r, i) => Object.assign($(`.it[data-id="${r.id}"]`).style, { left: '0px', top: axH + i * rowH + 'px', width: W + 'px', height: rowH - 2 + 'px' }));
  }
  $$('#furn .ax').forEach(a => { a.style.left = nameW + laneW * pct(a.dataset.d) / 100 + 'px'; });
  const t = $('#today'); t.style.left = nameW + laneW * pct(D.today) / 100 + 'px';
  const lo = $('#lost'); lo.style.left = nameW + laneW * pct(D.noRecord.from) / 100 + 'px'; lo.style.width = laneW * (pct(D.noRecord.to) - pct(D.noRecord.from)) / 100 + 'px';
  const rowH = STOP <= 1 ? 0 : Math.min(STOP === 2 ? MS('--space-6') : MS('--space-7'), (H - axH - MS('--space-5')) / N);
  [lo, t].forEach(e => { e.style.top = axH + 'px'; e.style.bottom = 'auto'; e.style.height = N * rowH + 'px'; });
  st.classList.toggle('tight', rowH < MS('--space-6'));
}
function setStop(s) {
  STOP = Math.max(0, Math.min(3, s));
  const d = $('#dial'); d.value = STOP; d.setAttribute('aria-valuetext', STOPS[STOP].w);
  $$('.stops button').forEach(b => b.setAttribute('aria-current', +b.dataset.stop === STOP ? 'true' : 'false'));
  const bl = $('#bl');
  bl.classList.toggle('small', STOP > 0);
  bl.innerHTML = STOP === 0 ? partsHTML(headlineParts()) : partsHTML(headlineParts()) + ' ' + partsHTML(secondParts());
  layout(); light();
}
function light() {
  $$('.it').forEach(e => e.classList.toggle('lit', e.dataset.id === HOLD));
  const r = R(HOLD);
  $('#held').innerHTML = `<p class="eyebrow">Held</p><b>${esc(r.name)}</b>${esc(itemLine(r))}`;
  $$('.bl .ref').forEach(b => b.classList.toggle('lit', refItems(b.dataset.ref).includes(HOLD)));
}
function step(d) { const i = SEQ.findIndex(r => r.id === HOLD); HOLD = SEQ[(i + d + SEQ.length) % SEQ.length].id; light(); }

$('#dial').addEventListener('input', e => setStop(+e.target.value));
document.addEventListener('click', e => {
  const b = e.target.closest('.stops button'); if (b) { setStop(+b.dataset.stop); return; }
  const it = e.target.closest('.it'); if (it) { HOLD = it.dataset.id; light(); if (STOP < 3) setStop(STOP + 1); return; }
  const rf = e.target.closest('.bl .ref'); if (rf) { HOLD = refItems(rf.dataset.ref)[0]; light(); }
});
KEYS.ArrowDown = () => setStop(STOP + 1);
KEYS.ArrowUp = () => setStop(STOP - 1);
KEYS.ArrowRight = () => step(1); KEYS.ArrowLeft = () => step(-1);
['1','2','3','4'].forEach((k, i) => KEYS[k] = () => setStop(i));
addEventListener('resize', layout);

async function demo(id) {
  setStop(1); await wait('--motion-spin'); if (!demoAlive(id)) return;
  setStop(2); await wait('--motion-still'); if (!demoAlive(id)) return;
  setStop(3);
}
window.replay = () => { HOLD = oldest.id; setStop(0); startDemo(demo); };
build(); setStop(0);
requestAnimationFrame(() => requestAnimationFrame(() => $('#wrap').classList.remove('pre')));
startDemo(demo);

</script>
</body>
</html>
