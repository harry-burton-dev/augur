<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Briefing · Combined V2 · From question to briefing</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; listed as
   "needs token" in notes.md. Marks carried from the catalogue run.
   --------------------------------------------------------------- */
:root{
  /* six ways to be empty (catalogue run): corner ticks for not known yet */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  /* stale: 45 degree hatch */
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  /* not yours to see: 135 degree hatch plus a lock */
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* sources disagree: a warning-tinted edge, never red */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  /* quiet lines, doesn't-apply text (wear and time) */
  --x-proposed-quiet: .62;
  /* mono numerals in data */
  --x-proposed-type-micro: .6875rem;
  /* the lit next step (light language) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* pencil (reference desk): what a model wrote, until a person accepts it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  /* reach: how far a light falls through floors below where a thing is kept */
  --x-proposed-reach-wash: 14%;
  /* data ink (picture run): the series a finding is about, and its context */
  --x-proposed-data: color-mix(in srgb, var(--ink) 92%, var(--light));
  --x-proposed-data-ctx: color-mix(in srgb, var(--ink-muted) 55%, transparent);
  /* a phrase that points at nothing (minute run) */
  --x-proposed-unbacked: color-mix(in srgb, var(--danger) 55%, var(--ink-muted));
  /* NEW (b-screens): a seam where a published number changed after it went out */
  --x-proposed-seam: color-mix(in srgb, var(--info) 70%, var(--ink));
  --x-proposed-seam-wash: color-mix(in srgb, var(--info) 8%, transparent);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.lite{color:var(--light)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.hints .on{color:var(--x-proposed-lit)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* floors */
[data-tier="department"]{--fc:var(--floor-department-high);--fl:var(--floor-department-low)}
[data-tier="team"]{--fc:var(--floor-team-high);--fl:var(--floor-team-low)}
[data-tier="org"]{--fc:var(--floor-org-high);--fl:var(--floor-org-low)}
[data-tier="you"]{--fc:var(--floor-you-high);--fl:var(--floor-you-low)}
.fchip{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap}
.fchip::before{content:"";width:var(--space-4);height:2px;background:var(--fc);border-radius:1px}
.fword{color:var(--fc)}

/* two registers: technical line one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* six ways to be empty, the two this surface meets most */
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);vertical-align:1px;white-space:nowrap}
.mk-unseen{display:inline-flex;align-items:center;justify-content:center;width:var(--space-4);height:var(--space-3);background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:2px;color:var(--ink-muted);flex:none}
.mk-disagree{display:inline-block;width:var(--space-4);height:var(--space-3);border-left:2px solid var(--x-proposed-disagree);border-right:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);flex:none;vertical-align:-1px}
.mk-gap{display:inline-block;width:var(--space-5);height:var(--space-4);vertical-align:-3px;
  --t:var(--space-1);
  background:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--t) no-repeat}
.mk-break{width:var(--space-5);height:var(--space-3);vertical-align:-1px}
.mk-break path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}

/* pencil and ink */
.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3)}
.pencil .pt{font-style:italic;color:var(--ink)}
.pencil .pl{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);margin:0 0 var(--space-1)}
.pencil.inked{border-style:solid;border-color:var(--hairline-strong);background:none}
.pencil.inked .pt{font-style:normal}
.pencil.off{border-style:dashed;border-color:var(--hairline)}
.pencil.off .pt{font-style:normal}
.pbtn{white-space:nowrap;display:inline-flex;align-items:center;gap:var(--space-1);height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink);margin-left:auto}

/* confidence word, with the yardstick at word size */
.cw{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--light);white-space:nowrap;vertical-align:1px}
.cw .yd{display:inline-grid;grid-template-columns:repeat(7,var(--space-1));gap:1px}
.cw .yd i{height:var(--space-2);background:var(--hairline-strong);border-radius:1px}
.cw .yd i.on{background:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard)}
.btn:hover{background:var(--surface-raised)}
.btn.go{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.btn[aria-disabled="true"]{opacity:var(--x-proposed-quiet);cursor:not-allowed}

/* app frame */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--slate-deep) 70%,transparent);min-width:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.crumb b{font-weight:400;color:var(--light)}
.crumb svg{opacity:var(--x-proposed-quiet);flex:none}
.top .hints{margin-left:auto;justify-content:flex-end}
.main{min-height:0;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));overflow:hidden}

/* the finding: headline (ink, template), bottom line (pencil), claims (ink) */
.fd-h{margin:var(--space-1) 0 var(--space-3);font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);letter-spacing:var(--tracking-tight)}
.fd-h .spk{vertical-align:-4px;margin-left:var(--space-2)}
.claims{list-style:none;margin:var(--space-3) 0 0;padding:0;display:grid;gap:var(--space-2)}
.claims li{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.claims li > svg{margin-top:2px;color:var(--ink-muted)}
.claims .bs{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:2px}
.claims .bs b{font-weight:400;color:var(--ink);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap)}
.claims li.judge .ct{font-style:normal}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}

/* isotype figures: counted, never scaled; a part figure is cut, not shrunk */
.figs{display:flex;flex-wrap:wrap;gap:1px;color:var(--ink)}
.fig{display:inline-flex;clip-path:inset(0 calc((1 - var(--part)) * 100%) 0 0)}
.ck{white-space:nowrap}
.ck-all{color:var(--ink)}
.ck-part{color:var(--x-proposed-disagree)}
.ck-none{color:var(--ink-muted);background:var(--x-proposed-unseen);padding:0 var(--space-1);border-radius:2px}
.x-cap{max-width:calc(100vw - 2 * var(--edge-tight))}

/* ---- b-screens: pictures at word size and full size ---- */
.sym{display:inline-flex;flex-wrap:wrap;gap:var(--g,0);vertical-align:-3px;color:var(--ink-muted);margin:0 2px 0 var(--space-1)}
.sym>span{display:inline-flex;opacity:.3}
.sym>span.on{color:var(--light);opacity:1}
.sym>span.new{box-shadow:0 1px 0 var(--x-proposed-seam)}
.sym.big{max-width:none}
.wsz{vertical-align:-3px;margin:0 2px 0 var(--space-1)}
svg.full{display:block;overflow:visible}
svg.full .ax{font:400 10px/1 var(--font-mono);fill:var(--ink-muted)}
svg.full .lb{font:400 10px/1 var(--font-mono);fill:var(--ink)}
svg.full .vl{font:400 11px/1 var(--font-mono);fill:var(--light)}
.seamline{stroke:var(--x-proposed-seam);stroke-width:1;stroke-dasharray:1 2}
.tiles-w{display:inline-grid;grid-template-columns:repeat(3,5px);grid-template-rows:repeat(3,5px);gap:1px;vertical-align:-2px;margin:0 var(--space-1)}
.tiles-w i{background:var(--hairline-strong);border-radius:1px}
.tiles-w i.on{background:var(--light)}
.tiles-w i.lo{background:var(--ink-muted)}
.tiles-w i.h{background:var(--x-proposed-unseen)}
.tiles-w i.x{background:none;border:1px solid var(--hairline)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,auto);gap:var(--space-1)}
.tile{display:grid;gap:2px;padding:var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);min-height:calc(var(--space-7) - var(--space-2))}
.tile b{font-weight:400;color:var(--ink)}
.tile em{font:400 var(--type-meta)/1 var(--font-mono);font-style:normal;color:var(--light)}
.tile.mine{border-color:var(--x-proposed-data)}
.tile .tb{display:block;height:2px;background:var(--hairline);border-radius:1px}
.tile .tb i{display:block;height:100%;background:var(--x-proposed-data)}
.tile.h{background:var(--x-proposed-unseen);border-color:var(--hairline)}
.tile.h span{display:inline-flex;gap:var(--space-1);align-items:center}
.tile.x{border-style:dashed;border-color:var(--hairline);opacity:var(--x-proposed-quiet)}
.recs{display:inline-flex;gap:2px;vertical-align:1px;margin:0 var(--space-1)}
.rec{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:2px;padding:2px var(--space-1);color:var(--light)}
.rt{width:100%;border-collapse:collapse;font:400 var(--type-small)/var(--leading-small) var(--font-mono)}
.rt th{font-weight:400;text-align:left;color:var(--ink-muted);border-bottom:1px solid var(--hairline-strong);padding:var(--space-1) var(--space-2) var(--space-1) 0}
.rt td{padding:var(--space-1) var(--space-2) var(--space-1) 0;border-bottom:1px solid var(--hairline);color:var(--ink-muted)}
.rt tr.on td{color:var(--light)}
.ruler{display:grid;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.ruler ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--hairline-strong)}
.ruler li{display:grid;grid-template-columns:calc(var(--space-7) + var(--space-5)) minmax(0,1fr);gap:var(--space-2);align-items:center;padding:2px 0 2px var(--space-2);color:var(--ink-muted)}
.ruler li.on .rw{color:var(--light)}
.ruler .chip{display:inline-block;border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:0 var(--space-2);color:var(--ink);margin-right:var(--space-1)}
.ruler .lifted,.ruler .below{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1) var(--space-2);color:var(--ink)}
.ruler .lifted b{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light)}
.ruler .q{flex-basis:100%;color:var(--ink-muted);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono)}
.unbacked{text-decoration:line-through wavy var(--x-proposed-unbacked) 1px;color:var(--x-proposed-unbacked)}
.cw .yd{grid-template-columns:repeat(5,var(--space-1))}
.lock{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}

/* ---- V2: the briefing is built by answering the lead's questions in order ---- */
.main{display:grid;grid-template-columns:minmax(208px,15%) minmax(0,1fr) minmax(320px,27%);gap:var(--space-5)}
/* rail: the questions, and the minute */
.rail{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.qs{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.qs button{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr) auto;gap:var(--space-2);align-items:center;width:100%;padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.qs button:hover{background:var(--surface-raised)}
.qs button.done{color:var(--ink)}
.qs button.sel{background:var(--x-proposed-lit-wash);color:var(--light)}
.qs .n{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.qs .s{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.qs .s.over{color:var(--x-proposed-disagree)}
.meter{border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.meter .big{display:flex;align-items:baseline;gap:var(--space-2);margin:var(--space-1) 0 var(--space-2)}
.meter .big b{font:300 var(--type-title-s)/1 var(--font-mono);color:var(--light)}
.meter .big span{font-size:var(--type-small);color:var(--ink-muted)}
.bar{position:relative;display:flex;height:var(--space-2);gap:1px;background:var(--surface-inset);border-radius:1px}
.bar i{display:block;height:100%;background:var(--ink-muted);transition:flex-basis var(--motion-calm) var(--ease-out)}
.bar i.bl{background:var(--light)}
.bar i.pen{background:none;border:1px dotted var(--x-proposed-pencil)}
.bar i.cut{background:var(--x-proposed-lit)}
.bar .lim{position:absolute;top:calc(var(--space-1) * -1);bottom:calc(var(--space-1) * -1);width:1px;background:var(--light)}
.meter p{margin:var(--space-2) 0 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.keys{margin-top:auto;display:grid;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
/* the sheet */
.sheet{min-height:0;display:flex;flex-direction:column;background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-4) var(--space-5) var(--space-3);overflow:auto}
.sh-h{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap;border-bottom:1px solid var(--hairline);padding-bottom:var(--space-2)}
.sh-h h1{margin:0;font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.sh-h p{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.sh-h p b{font-weight:400;color:var(--ink);border-bottom:2px solid var(--fc)}
.row{display:grid;grid-template-columns:calc(var(--space-8) - var(--space-2)) minmax(0,1fr);gap:var(--space-3);padding:var(--space-2) 0 calc(var(--space-2) - 2px);border-bottom:1px solid var(--hairline);position:relative}
.row .sd{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding-top:2px}
.row .sd b{display:block;font-weight:400;color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta)}
.row .sd .t{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono)}
.row .sd .t.over{color:var(--x-proposed-disagree)}
.row.sel::before{content:"";position:absolute;left:calc(var(--space-3) * -1);top:var(--space-2);bottom:var(--space-2);width:2px;background:var(--x-proposed-lit)}
.row .body{font-size:var(--type-meta);line-height:calc(var(--leading-meta) + 2px);color:var(--ink);margin:0}
.row .body .ln{transition:opacity var(--motion-calm) var(--ease-out)}
.row .body .ln.going{opacity:0}
.row .body .kp{display:inline-flex;vertical-align:-1px;margin-left:2px;color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.row.wait .body{color:var(--ink-muted)}
.row .ans{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.row.wait .ans{display:none}
.row:not(.wait) .waiting{display:none}
.row.fresh .ans{animation:dep var(--motion-calm) var(--ease-out)}
@keyframes dep{from{opacity:0;transform:translateY(var(--space-1))}}
@media (prefers-reduced-motion: reduce){.row.fresh .ans{animation-name:fade}@keyframes fade{from{opacity:0}}}
.row .num{font-family:var(--font-mono);font-size:calc(var(--type-meta) * .95);color:var(--light)}
/* bottom line block */
.bl{padding:var(--space-2) 0 var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.bl .eh{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
.bl .eh .t{margin-left:auto;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.bl .txt{margin:0;font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.bl .pencil .txt{font-style:italic;color:var(--ink)}
.bl .pencil.inked .txt{font-style:normal;color:var(--light)}
.ph{transition:opacity var(--motion-calm) var(--ease-out)}

<body>

<div class="x-cap"><b>Briefing · Combined V2</b> from question to briefing · BLUF, the lead’s questions, Tufte, the minute meter</div>
<script>
/* Shared sample for the b-screens (v2, v3). Every name, label, count, date and floor
   below is deployment data: the markup and scripts repeat none of it. Counts are worked
   out from `vans` and `groups`; nothing in the briefing is typed in by hand. */
const DATA = {
  org: 'Ridgeway Regional Services',
  me: 'p1',
  myFloor: 'team',
  myTeam: 'north',
  today: '2026-11-03',
  readWpm: 200,          /* reading speed, an org setting */

  floors: {
    org:        { name: 'Ridgeway Regional Services', word: 'Org',        reach: 1180 },
    department: { name: 'Fleet and Facilities',       word: 'Department', reach: 34 },
    team:       { name: 'North depot crew',           word: 'Team',       reach: 9 }
  },
  floorOrder: ['org', 'department', 'team'],

  people: {
    p1: { name: 'Sam Okafor',    role: 'Depot coordinator',  floor: 'team', team: 'north' },

    p3: { name: 'Jo Barnes',     role: 'North depot keeper', floor: 'team', team: 'north' },
    p4: { name: 'Dana Whitlock', role: 'Contracts manager',  floor: 'org' },
    p5: { name: 'Health and safety desk', role: 'Keeps incident reports', floor: 'org' },
    p6: { name: 'Ana Ruiz',      role: 'Westfield keeper',   floor: 'team', team: 'west' }
  },
  /* the lead the briefing is for */
  reader: 'p2',
  subject: 'North depot vans',
  /* the 18 vans; next inspection due. Overdue = due before today. Worked out, never stored. */
  vans: [
    ['NV-01', '2027-01-14'], ['NV-02', '2026-10-01'], ['NV-03', '2026-10-22', '2026-11-07'], ['NV-04', '2027-02-02'],
    ['NV-05', '2026-12-09'], ['NV-06', '2027-03-18'], ['NV-07', '2026-10-08'], ['NV-08', '2027-01-27'],
    ['NV-09', '2026-10-15'], ['NV-10', '2027-02-21'], ['NV-11', '2026-11-05'], ['NV-12', '2026-10-25'],
    ['NV-13', '2027-04-06'], ['NV-14', '2026-09-23'], ['NV-15', '2026-11-05'], ['NV-16', '2026-12-30'],
    ['NV-17', '2026-10-30'], ['NV-18', '2027-03-03']
  ].map(([id, due, inspected]) => ({ id, due, inspected })), /* inspected: the date an inspection will be recorded (used by the week jump) */
  /* month-end counts from the inspection records; Sep lost to the depot log outage */
  series: [ { m: 'Jun', v: 1 }, { m: 'Jul', v: 2 }, { m: 'Aug', v: 2 }, { m: 'Sep', v: null }, { m: 'Oct', v: 5 } ],
  noRecord: { from: '8 Sep', to: '21 Sep', what: 'the depot log', who: 'p3' },
  /* depots for "Where?": one equal tile each, placed roughly where they are */
  depots: [
    { id: 'north', name: 'North', of: 18, mine: true, col: 2, row: 1 },
    { id: 'west',  name: 'Westfield', hidden: true, keeper: 'p6', team: 'west', col: 1, row: 2 },
    { id: 'east',  name: 'East', n: 0, of: 9, col: 3, row: 2 },
    { id: 'south', name: 'South', n: 1, of: 12, col: 2, row: 3 },
    { id: 'harbour', name: 'Harbour store', none: 'keeps no vans', col: 3, row: 3 }
  ],
  /* sources with their Data Atlas grades (NATO letter + digit). derivedFrom = not independent */
  sources: {
    log:      { label: 'Depot inspection log',     grade: 'B2', app: 'Artifacts' },
    insp:     { label: 'inspection records',       grade: 'A2', app: 'Data Atlas', derivedFrom: 'log' },
    report:   { label: 'Kestrel report, October',  grade: 'C3', app: 'Artifacts' },
    contract: { label: 'Kestrel servicing contract', grade: 'B2', app: 'Data Atlas' },
    email:    { label: 'Kestrel email, 30 Oct',    grade: 'F6', app: 'Artifacts' }
  },
  kestrel: { name: 'Kestrel', says: 5, booked: 2 },
  /* judgements: each takes a word worked out from its observations; counts take none */
  claims: {
    cause:    { text: 'Kestrel cancelled its October visit and has not rebooked it', obs: [['contract', 'for'], ['report', 'for']] },
    forecast: { text: 'the vans falling due will be overdue unless a visit is booked', obs: [['insp', 'for'], ['email', 'against']] },
    count:    { text: 'the overdue count', obs: [['log', 'for'], ['insp', 'for'], ['report', 'against']], count: true }
  },
  gap: { what: 'whether Kestrel can come before {dueSoon}', who: 'p4' },
  /* the lead's questions, in order. Each picks its picture by the question; budget in seconds */
  budget: 60,
  /* lines are sentence templates (ink). keep = can never be cut; cut = moves into "if asked" under that question */
  questions: [
    { id: 'what',  q: 'What happened?',  asks: 'how many, out of how many', form: 'count', budget: 9,  never: 'scaled', lines: [
      { tpl: '{overdue} of {fleet} {subject} are overdue for inspection {pic}.' },
      { tpl: '{kestrelName}’s report says {kestrelSays} {dis}: it counts {booked} booked vans as done. {decider} decides.', keep: 'disagree' } ] },
    { id: 'big',   q: 'How big?',        asks: 'which is worst, and by how much', form: 'bars', budget: 6, never: 'cutbars', lines: [
      { tpl: 'The worst, {worstId}, is {worstDays} days late; {fortnightW} are over a fortnight late {pic}.' },
      { tpl: 'The other {restW} are {restMin} to {restMax} days late.', cut: 'And the others?' } ] },
    { id: 'worse', q: 'Getting worse?',  asks: 'a change over time', form: 'line', budget: 9, never: 'dual', lines: [
      { tpl: 'Yes: up from {aug} in August to {overdue} now {pic}.' },
      { tpl: '{nrWhatC} has no record from {nrFrom} to {nrTo} {brk}, so September is missing, not zero.', keep: 'norecord' },
      { tpl: 'It was {jun} in June and {jul} in July: the rise began after August.', cut: 'Since when?' } ] },
    { id: 'where', q: 'Where?',          asks: 'which places', form: 'tiles', budget: 9, never: 'choropleth', lines: [
      { tpl: 'Almost all of it is here {pic}: {southName} has {southN} of {southOf}, {eastName} {eastN} of {eastOf}.' },
      { tpl: '{westName}’s vans are kept by {westTeam}: {westUnseen}.', keep: 'unseen' },
      { tpl: '{harbourName} {harbourNone}.', cut: 'What about {harbourName}?' } ] },
    { id: 'sure',  q: 'How sure?',       asks: 'how good the sources are', form: 'none', budget: 10, never: 'gauge', lines: [
      { tpl: 'The cause below is {w:cause}; the forecast {w:forecast}, so the briefing is no surer than {weakest}.' },
      { tpl: 'Counts take no word: they are recorded, and cover all {fleet} vans except {nrFrom} to {nrTo}.', cut: 'Do the counts cover everything?' },
      { tpl: 'Not known yet {gap}: {gapWhat}. {gapWho} could find out.', keep: 'gap' } ] },
    { id: 'next',  q: 'What next?',      asks: 'what falls due, and when', form: 'records', budget: 9, never: 'pie', lines: [
      { tpl: '{kestrelName} cancelled its October visit and has not rebooked it {w:cause}.' },
      { tpl: '{dueSoonW} more fall due on {dueSoon} {pic}: {forecast} overdue unless a visit is booked {w:forecast}.' } ] }
  ],
  decider: 'p2',
  keepWhy: { disagree: 'a disagreement is never cut', norecord: 'no record is never cut', unseen: 'what readers can’t see is never cut', gap: 'a gap is never cut' },
  bottomBudget: 8,
  /* the six pictures, each answering one plain question, plus no picture and the records */
  forms: {
    count:   { name: 'Count with symbols', plain: 'one van symbol per van, the overdue ones lit; symbols repeat, they never grow', tech: 'isotype unit chart · 1 symbol = 1 Vehicle' },
    bars:    { name: 'Bars, longest first', plain: 'one bar per overdue van, from zero, longest first', tech: 'horizontal bar · sorted desc · x from 0' },
    line:    { name: 'A line over time', plain: 'month-end counts, from zero; a month with no record is a break, not a dip', tech: 'line · y from 0 · null → gap' },
    tiles:   { name: 'One tile per site', plain: 'every depot the same size, placed roughly where it is, so big places don’t win', tech: 'tile grid · equal area · coarse position' },
    small:   { name: 'Small multiples on one scale', plain: 'one small picture per place, all on the same scale', tech: 'facets · shared y' },
    before:  { name: 'Before and after', plain: 'two values either side of a known event; cause stays at “possible”', tech: 'slope · event from Artifacts/Mandate' },
    none:    { name: 'No picture', plain: 'the words are the answer; a picture would add nothing', tech: 'text only' },
    records: { name: 'The records', plain: 'the rows themselves, because the lead will act on them by name', tech: 'table · Vehicle where due ≤ +7d' }
  },
  never: {
    pie:        { name: 'A pie', why: 'nothing here is a part of a whole' },
    '3d':       { name: 'Anything in 3D', why: 'depth bends the sizes you compare' },
    dual:       { name: 'Two scales on one chart', why: 'the crossing point is made by whoever picks the scales' },
    gauge:      { name: 'A gauge or dial', why: 'it pretends to a precision the words don’t have' },
    scaled:     { name: 'A bigger van for a bigger number', why: 'the eye reads area, so 7 looks like 49' },
    cutbars:    { name: 'Bars that don’t start at zero', why: 'a cut axis turns a small difference into a big one' },
    stacked:    { name: 'Stacked areas', why: 'only the bottom layer has a straight floor to read from' },
    choropleth: { name: 'A map shaded by raw counts', why: 'the biggest depot always looks worst' }
  },
  /* the model's draft of the bottom line: pencil. Each phrase points at a part, or at nothing */
  draft: [
    { t: 'Book Kestrel’s missed October visit this week', ref: 'next', line: 0 },
    { t: ', or {forecast} of {fleet} vans will be overdue by {dueSoon}', ref: 'next', line: 1 },
    { t: '; the worst is already {worstDays} days late', ref: 'big', line: 0 },
    { t: ', and Kestrel has never missed a visit before', ref: null },
    { t: '.', ref: 'punct' }
  ],
  templateBottom: '{overdue} of {fleet} {subject} are overdue; {forecast} will be by {dueSoon} unless a visit is booked.',
  /* questions the model suggested a reader may ask: it may suggest, never answer */
  suggested: [ { q: 'Could another firm do the inspections sooner?', answer: 'gap', who: 'p4' } ],
  /* the five-word yardstick (confidence run): worked out by one rule, never typed */
  yardstick: ['Almost certain', 'Very likely', 'Likely', 'Possible', 'Unlikely'],

  /* ---- acting on it (v3) ---- */
  groups: [
    { id: 'vans',   label: 'North depot vans',           icon: 'truck',           kept: { department: 11, team: 7 },  keeper: 'p3' },
    { id: 'insp',   label: 'inspection records',         icon: 'clipboard-check', kept: { department: 16, team: 30 }, keeper: 'p3' },
    { id: 'log',    label: 'Depot inspection log',       icon: 'file-text',       kept: { team: 1 },                  keeper: 'p3' },
    { id: 'report', label: 'Kestrel report, October',    icon: 'file-text',       kept: { department: 1 },            keeper: 'p2' },
    { id: 'con',    label: 'Kestrel servicing contract', icon: 'scroll-text',     kept: { org: 1 },                   keeper: 'p4' },
    { id: 'inc',    label: 'Incident report on NV-14',   icon: 'triangle-alert',  kept: { org: 1 },                   keeper: 'p5', restricted: true }
  ],
  /* which records each part of the briefing rests on */
  basis: { what: ['vans', 'insp', 'log'], big: ['vans', 'insp'], worse: ['insp', 'log'], where: ['vans'], sure: ['report', 'con'], next: ['con', 'report', 'vans'] },
  libraries: [
    { id: 'L1', name: 'North depot notes', floor: 'team' },
    { id: 'L2', name: 'Fleet briefings',   floor: 'department' },
    { id: 'L3', name: 'Board papers',      floor: 'org', approval: 'p2' }
  ],
  intents: [
    { id: 'I1', ref: 'M-42', title: 'Keep every fleet vehicle roadworthy',    owner: 'p2', floor: 'department', followers: 6 },
    { id: 'I2', ref: 'M-17', title: 'Renew the Kestrel servicing contract',   owner: 'p4', floor: 'org', followers: 4 },
    { id: 'I3', ref: 'M-58', title: 'Monthly safety walk-round at each depot', owner: 'p3', floor: 'team', followers: 3 }
  ],
  /* one reader per floor the briefing reaches, for the proofs */
  proofReaders: { team: 'p3', department: 'p6', org: 'p4' },
  watchPresets: [ { id: 'any', plain: 'for any change' }, { id: 'above', plain: 'for more than', n: 8 }, { id: 'zero', plain: 'until it is back to', n: 0 } ],
  /* what would move the watched answer; reason = one of the five */
  triggers: [
    { icon: 'clipboard-check', plain: 'An inspection is recorded', reason: 'happened', has: true, tech: 'atlas.observation.recorded · kind=InspectionEvent' },
    { icon: 'history',         plain: 'A past inspection is entered late', reason: 'past', has: true, tech: 'atlas.observation.recorded · observedAt < now' },
    { icon: 'file-x',          plain: 'A source is withdrawn in Artifacts', reason: 'past', has: true, tech: 'artifacts.document.withdrawn → evidence marked' },
    { icon: 'calendar-clock',  plain: 'A due date passes', reason: null, has: false, needs: 'a clock in the events service: a date passing makes no event today', tech: 'events.schedule · nightly re-run of the recipe' },
    { icon: 'key-round',       plain: 'What you can open changes', reason: 'access', has: false, needs: 're-checking your access on every run', tech: 'identity.membership.changed → re-evaluate' },
    { icon: 'split',           plain: 'Someone settles 7 or 5', reason: 'settled', has: false, needs: 'Data Atlas to announce what Triage settles', tech: 'atlas.triage.resolved · detail=nextInspection' },
    { icon: 'book-a',          plain: 'An admin redefines “overdue”', reason: 'meaning', has: false, needs: 'the studio to announce changes to a definition', tech: 'atlas.ontology.changed · term=nextInspection' }
  ],
  /* the five reasons an answer moves (reference desk run) */
  reasons: {
    happened: 'Something happened',
    past:     'We learned about the past',
    access:   'What you can see changed',
    settled:  'A disagreement was settled',
    meaning:  'A word changed meaning'
  },
  recipe: { plain: 'vans at the North depot whose next inspection is past its date', tech: 'count(Vehicle ∩ basedAt=Site:north-depot ∩ nextInspection < today())' },
  /* who recorded the inspection the week jump finds */
  weekEvent: { van: 'NV-03', by: 'p3', on: '2026-11-07' }
};

/* ---- shared helpers for the b-screens ---- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const I = (n, size = 16, stroke = 1.5) => Icons.svg(n, { size, stroke });
const P = id => DATA.people[id];
const F = id => DATA.floors[id];
const fmt = n => n.toLocaleString('en-GB');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const RANK = Object.fromEntries(DATA.floorOrder.map((f, i) => [f, i]));
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const D = s => new Date(s + 'T00:00:00Z');
const dayStr = d => `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;
const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const NUMW = ['none', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const word = n => NUMW[n] ?? fmt(n);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---- the answer, worked out from the vans on a given day (one query feeds every height) ---- */
function answer(day = DATA.today) {
  const vans = DATA.vans.map(v => {
    /* an inspection recorded on or before `day` moves the due date six months on */
    const done = v.inspected && v.inspected <= day;
    const due = done ? addDays(v.inspected, 182) : v.due;
    return { ...v, due, done, late: daysBetween(due, day) };
  });
  const overdue = vans.filter(v => v.late > 0).sort((a, b) => b.late - a.late);
  const ahead = vans.filter(v => v.late <= 0).sort((a, b) => a.due.localeCompare(b.due));
  const nextDate = ahead[0].due;
  const dueSoon = ahead.filter(v => v.due === nextDate);
  const rest = overdue.filter(v => v.late <= 14);
  const north = DATA.depots.find(d => d.mine);
  return {
    day, vans, overdue, dueSoon,
    overdueN: overdue.length, fleet: DATA.vans.length,
    dueSoonN: dueSoon.length, dueSoonDay: dayStr(D(nextDate)),
    forecast: overdue.length + dueSoon.length,
    worst: overdue[0], fortnight: overdue.filter(v => v.late > 14).length,
    rest: rest.length, restMin: Math.min(...rest.map(v => v.late)), restMax: Math.max(...rest.map(v => v.late)),
    north: { ...north, n: overdue.length }
  };
}
let A = answer();
const SLOTS = () => ({
  overdue: A.overdueN, fleet: A.fleet, subject: DATA.subject, forecast: A.forecast, dueSoon: A.dueSoonDay,
  worstDays: A.worst.late, kestrelSays: DATA.kestrel.says
});
const fill = (tpl, o = SLOTS()) => tpl.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');

/* ---- confidence: one rule over grades and agreement (confidence run). Never typed. ---- */
const strength = g => { const l = g[0], d = +g[1]; return (l <= 'B' && d <= 2) ? 'strong' : (l <= 'C' && d <= 3) ? 'fair' : 'weak'; };
const WEIGHT = { strong: 3, fair: 2, weak: 1 };
const ORDER = { strong: 0, fair: 1, weak: 2 };
const root = id => DATA.sources[id].derivedFrom ? root(DATA.sources[id].derivedFrom) : id;
function side(obs) {
  /* copies of one origin count once, at the best grade among them */
  const by = {};
  obs.forEach(id => { const r = root(id), s = strength(DATA.sources[id].grade); if (!by[r] || ORDER[s] < ORDER[by[r]]) by[r] = s; });
  const list = Object.values(by);
  const best = list.sort((a, b) => ORDER[a] - ORDER[b])[0];
  return { n: list.length, best, w: list.reduce((a, s) => a + WEIGHT[s], 0) };
}
function rungOf(s) {
  if (!s.n) return null;
  if (s.n >= 2 && s.best === 'strong') return 0;
  if ((s.n === 1 && s.best === 'strong') || (s.n >= 2 && s.best === 'fair')) return 1;
  if ((s.n === 1 && s.best === 'fair') || s.n >= 2) return 2;
  return 3;
}
function derive(id) {
  const c = DATA.claims[id];
  const f = side(c.obs.filter(o => o[1] === 'for').map(o => o[0]));
  const a = side(c.obs.filter(o => o[1] === 'against').map(o => o[0]));
  let kind = 'word', rung = rungOf(f), why;

      <p class="eyebrow">${reader.name}’s questions, in order</p>
      <ol class="qs">${Q.map((q, i) => { const p = PL[q.id], t = S.cutDone ? p.now : p.full, on = i < S.answered;
        return `<li><button class="${on ? 'done' : ''} ${sel === q.id ? 'sel' : ''}" data-sel="${q.id}"><span class="n">${i + 1}</span><span>${q.q}</span><span class="s ${on && r1(t) > q.budget ? 'over' : ''}">${on ? r1(t) + ' s' : '·'}</span></button></li>`; }).join('')}
        <li><button class="${S.draft ? 'done' : ''} ${sel === 'bl' ? 'sel' : ''}" data-sel="bl"><span class="n">B</span><span>Bottom line</span><span class="s">${S.inked ? r1(blS) + ' s' : S.draft ? 'pencil' : '·'}</span></button></li></ol>
      <div class="meter"><p class="eyebrow" style="margin:0">Reading time</p>
        <div class="big"><b>${r1(tot)}</b><span>s of ${DATA.budget} s for ${reader.name.split(' ')[0]}</span></div>
        <div class="bar" aria-hidden="true">${blS ? `<i class="bl" style="flex:0 0 ${blS / Math.max(tot + penS, DATA.budget) * 100}%"></i>` : ''}${segs}${penS ? `<i class="pen" style="flex:0 0 ${penS / Math.max(tot + penS, DATA.budget) * 100}%"></i>` : ''}<span class="lim" style="left:${Math.min(100, DATA.budget / Math.max(tot + penS, DATA.budget) * 100)}%"></span></div>
        <p>${cutS ? `${r1(cutS)} s moved into <b style="font-weight:400;color:var(--ink)">If asked</b>, not deleted.` : 'Each part has its own seconds.'} ${penS ? `The pencil line (${r1(penS)} s) counts once it is inked.` : ''} A gap, a disagreement or what readers can’t see is never cut.</p>
        <p class="tk">${DATA.readWpm} words a minute · +${DATA.pictureSec} s per word-size picture · budget is an org setting</p></div>
      <div class="keys"><span><span class="kbd">1</span>–<span class="kbd">6</span> picture · <span class="kbd">B</span> bottom line</span><span><span class="kbd">V</span> records</span><span><span class="kbd">S</span> strike · <span class="kbd">I</span> ink</span><span><span class="kbd">G</span> model gateway ${STATE.gateway ? 'on' : 'off'}</span></div>
    </aside>
    <article class="sheet" aria-label="The briefing">
      <header class="sh-h" data-tier="${P(DATA.reader).floor}"><h1>${DATA.subject}</h1><p>Briefing for <b>${reader.name}</b>, ${reader.role} · from ${me.name} · ${dayStr(D(DATA.today))}</p></header>
      ${blHTML()}
      ${rows}
      ${ifa}
      <div class="check"><span class="${agree ? 'ok' : ''}">${I(agree ? 'check' : 'x', 12)} Same digits at every height: headline ${A.overdueN} · picture ${lit} lit · records ${recs} rows</span><span>Numbers in the answers: ${nums}${STATE.gateway ? '' : ' (unchanged with the model off)'}</span><span class="tk">one query: ${DATA.recipe.tech}</span></div>
    </article>
    <aside class="margin" aria-label="The picture">${marginHTML(PL)}</aside>
  </main>`;
  document.body.classList.toggle('tech', STATE.tech);
  $('#h-t')?.classList.toggle('on', STATE.tech);
  $('#h-g')?.classList.toggle('on', !STATE.gateway);
  S.fresh = null;
}
function marginHTML(PL) {
  if (S.sel === 'bl') {
    if (!STATE.gateway) return `<p class="eyebrow">Bottom line · model gateway off</p><p class="m-title">The pencil slot is empty, and nothing else moved.</p><p class="m-note">The bottom line falls back to its template, filled from the same answers. Every number, word and picture on the sheet is the same as with the model on.</p>`;
    if (!S.draft) return `<p class="eyebrow">Bottom line</p><p class="m-note">The model drafts it once the six answers are in. It may only point at them.</p>`;
    const ph = draftPhrases().filter(p => p.ref !== 'punct');
    return `<p class="eyebrow">Bottom line · what each phrase points at</p>
      <p class="m-title">${S.inked ? 'Inked.' : ph.some(p => p.ref === null) ? 'One phrase points at nothing, so it can’t be inked yet.' : 'Every phrase points at a fact.'}</p>
      <ul class="m-list">${ph.map(p => `<li class="${p.ref ? '' : 'bad'}">${I(p.ref ? 'corner-down-right' : 'x', 14)}<span>“${fill(p.t).replace(/^[,;\s]+/, '')}”<span class="r">${p.ref ? '→ ' + Q[QI(p.ref)].q + ' · ' + textOf(PL[p.ref].lines[p.line].html) : '→ nothing. No record says this. Strike it, or add a record that says so.'}</span></span></li>`).join('')}</ul>
      <div class="m-sec"><p class="m-note">The model may write only this line, and only from the answers. It chose no number, no word and no picture: those are ink, from templates. It may suggest what ${P(DATA.reader).name.split(' ')[0]} will ask (in <b>If asked</b>), never answer it.</p></div>`;
  }
  const q = Q.find(x => x.id === S.sel);
  if (!q) return `<p class="eyebrow">The picture</p><p class="m-note">Each answer gets the picture its question asks for. Nobody picks a chart.</p>`;
  const f = DATA.forms[q.form], nv = DATA.never[q.never], p = PL[q.id];
  const others = Object.entries(DATA.forms).filter(([k]) => !['none', 'records'].includes(k)).map(([, v]) => v.name);
  return `<p class="eyebrow">${q.q} · the picture</p>
    <div class="chain"><u>${q.q.replace('?', '')}</u> ${I('arrow-right', 12)} asks ${q.asks} ${I('arrow-right', 12)} <b>${f.name}</b></div>
    <p class="m-title">${textOf(p.kept[0].html)}</p>
    ${q.form === 'none' ? `<div class="fig-box">${picNone(true)}</div>` : `<div class="fig-box">${picture(q.form, true)}</div>`}
    <p class="m-note"><b>Why this picture.</b> ${f.plain}.<span class="tk">${f.tech}</span></p>
    <p class="m-note"><b>Not offered for this question.</b> <s>${nv.name}</s>: ${nv.why}.</p>
    <div class="m-sec"><p class="m-note"><b>This part.</b> ${r1(p.full)} s as written, ${r1(p.now)} s after cuts, of ${q.budget} s. ${p.cut.length ? `Moved into If asked: “${textOf(p.cut[0].html).slice(0, 60)}…”` : 'Nothing cut.'} ${p.kept.some(l => l.keep) ? `Kept whatever the time: ${p.kept.filter(l => l.keep).map(l => DATA.keepWhy[l.keep]).join('; ')}.` : ''}</p></div>
    <div class="m-sec"><p class="m-note"><b>The records.</b> From ${DATA.basis[q.id].map(id => `${fmt(total(Gp(id)))} ${Gp(id).label}`).join(', ')}. <span class="kbd">V</span> ${S.records ? 'hides' : 'opens'} them here.</p>
    ${S.records ? `<table class="rt"><thead><tr><th>Van</th><th>Due</th><th>State</th></tr></thead><tbody>${A.vans.slice().sort((a, b) => b.late - a.late).slice(0, 9).map(v => `<tr class="${v.late > 0 ? 'on' : ''}"><td>${v.id}</td><td>${dayStr(D(v.due))}</td><td>${v.late > 0 ? v.late + ' days late' : 'in ' + (-v.late) + ' days'}</td></tr>`).join('')}</tbody></table>` : ''}</div>
    <p class="m-note tk">offered: ${others.join(' · ')} · no picture · the records</p>`;
}

/* ---- the moment ---- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2400); }
function play() {
  clearLater();
  Object.assign(S, { answered: 0, cutDone: false, going: false, draft: false, struck: false, inked: false, sel: null, records: false, landed: new Set() });
  render();
  Q.forEach((q, i) => later(() => { S.answered = i + 1; S.sel = q.id; S.fresh = q.id; render(); }, 1200 + i * 280));
  later(() => { S.sel = 'worse'; S.going = true; render(); }, 1200 + 6 * 280);
  later(() => { S.going = false; S.cutDone = true; render(); }, 1200 + 6 * 280 + 380);
  later(() => { S.draft = true; render(); }, 3250);
  later(() => { S.sel = 'bl'; render(); }, 3500);
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'r') { STATE.gateway = true; play(); return; }
  if (/^[1-6]$/.test(k)) { S.sel = Q[+k - 1].id; render(); return; }
  if (k === 'b') { S.sel = 'bl'; render(); return; }
  if (k === 'v') { S.records = !S.records; if (S.sel === 'bl' || !S.sel) S.sel = 'what'; render(); return; }
  if (k === 't') { STATE.tech = !STATE.tech; render(); return; }
  if (k === 'g') { STATE.gateway = !STATE.gateway; S.sel = 'bl'; render(); toast(STATE.gateway ? 'Model gateway on: the pencil slot is back.' : 'Model gateway off: the draft is gone. No number changed.'); return; }
  if (k === 's') act('strike');
  if (k === 'i') act('ink');
});
function act(a) {
  if (!S.draft || !STATE.gateway) return;
  if (a === 'strike' && !S.struck) { S.struck = true; S.sel = 'bl'; render(); }
  if (a === 'ink') {
    if (!S.struck && DATA.draft.some(p => p.ref === null)) { toast('One phrase points at nothing. Strike it first (S).'); return; }
    S.inked = true; S.sel = 'bl'; render();
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-sel]'); if (b) { S.sel = b.dataset.sel; render(); return; }
  const a = e.target.closest('[data-act]'); if (a) act(a.dataset.act);
  const r = e.target.closest('.row[data-q]'); if (r && !e.target.closest('button')) { S.sel = r.dataset.q; render(); }
});
play();
</script>
</body>
</html>
