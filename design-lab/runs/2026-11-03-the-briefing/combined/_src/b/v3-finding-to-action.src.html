<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Briefing · Combined V3 · Finding to action</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: the finished briefing goes out, and is watched ---- */
.main{display:grid;grid-template-columns:minmax(300px,23%) minmax(0,1fr) minmax(312px,23%);gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
/* left: the briefing as it will go out */
.brief{display:block;min-height:0;overflow:auto;background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4)}
.brief h2{margin:var(--space-1) 0 var(--space-2);font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.brief .stamp{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);margin:0 0 var(--space-2)}
.brief .stamp.sent{color:var(--x-proposed-lit)}
.bl3{margin:0 0 var(--space-2)}
.bl3 .txt{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.pencil .txt{font-style:italic}
.pencil.inked .txt{font-style:normal;color:var(--light)}
.bl3 .who{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-1);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted)}
.brief .sub{margin:0 0 var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.parts{list-style:none;margin:0;padding:0;display:grid}
.parts li{padding:var(--space-1) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.parts li b{display:block;font-weight:400;color:var(--ink-muted);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft)}
.parts .num{font-family:var(--font-mono);color:var(--light)}
/* the seam: a published number that has moved since */
.seam{margin:var(--space-1) 0 var(--space-2);padding:var(--space-2) var(--space-3);border-left:2px dashed var(--x-proposed-seam);background:var(--x-proposed-seam-wash);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);animation:dep var(--motion-calm) var(--ease-out)}
.seam b{font-weight:400;color:var(--light)}
.seam .now{font:400 var(--type-lead)/1 var(--font-mono);color:var(--light)}
.seam .lab{display:block;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--x-proposed-seam);letter-spacing:var(--tracking-soft)}
.was{text-decoration:line-through;text-decoration-color:var(--x-proposed-seam);color:var(--ink-muted)}
@keyframes dep{from{opacity:0;transform:translateY(var(--space-1))}}
@media (prefers-reduced-motion: reduce){@keyframes dep{from{opacity:0}}}
/* centre: the order in a sentence */
.para{display:grid;gap:var(--space-3);margin:0}
.sent{position:relative;margin:0;font-weight:300;font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-1));color:var(--ink-muted)}
.sent .no{display:inline-flex;align-items:center;justify-content:center;width:var(--space-5);height:var(--space-5);margin-right:var(--space-2);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink);vertical-align:2px}
.slot{position:relative;display:inline;color:var(--light);border-bottom:1px dashed var(--ink-muted);border-radius:2px;padding:0 2px;font-weight:400}
.slot::after{content:"▾";font-size:var(--type-small);color:var(--ink-muted);margin-left:var(--space-1);vertical-align:2px}
.slot[aria-expanded="true"]{background:var(--surface-raised);border-bottom-color:var(--x-proposed-lit)}
.val{color:var(--light);font-weight:400}
.val.n{font-family:var(--font-mono);font-size:calc(var(--type-lead) * .9)}
.val.warn{color:var(--x-proposed-disagree)}
.fl{color:var(--fc);font-weight:400;white-space:nowrap}
.sent.pv::before{content:"";position:absolute;left:calc(var(--space-3) * -1);top:var(--space-1);bottom:var(--space-1);width:2px;background:var(--x-proposed-lit)}
.sent.pv .val{color:var(--x-proposed-lit)}
.sent .tk{font-size:var(--x-proposed-type-micro);font-weight:400;margin-top:2px}
.sw{position:relative}
.pop{position:absolute;top:calc(100% + var(--space-1));z-index:var(--layer-menu);left:var(--space-5);min-width:calc(var(--measure-decision) + var(--space-5));padding:var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));box-shadow:var(--shadow-overlay);font-size:var(--type-meta);line-height:var(--leading-meta);animation:dep var(--motion-base) var(--ease-out)}
.pop .ph{margin:0 var(--space-2) var(--space-1);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.opt{display:grid;grid-template-columns:2px minmax(0,1fr) auto;gap:0 var(--space-3);width:100%;padding:var(--space-2);border-radius:var(--radius-key);color:var(--ink)}
.opt::before{content:"";grid-row:span 2;background:var(--fc);border-radius:1px}
.opt:hover,.opt.hot{background:var(--surface-raised)}
.opt b{font-weight:400;color:var(--light)}
.opt .r{text-align:right;font:400 var(--type-meta)/var(--leading-meta) var(--font-mono);color:var(--light);white-space:nowrap}
.opt .s{grid-column:2 / span 2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.meterx{display:inline-block;width:var(--space-7);height:var(--space-1);border-radius:1px;background:var(--x-proposed-unseen);vertical-align:2px;margin-right:var(--space-1);overflow:hidden}
.meterx i{display:block;height:100%;background:var(--ink)}
.go{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-4);align-items:center;border-top:1px solid var(--hairline-strong);border-bottom:1px solid var(--hairline);padding:var(--space-2) 0}
.go p{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.go p b{font-weight:400;color:var(--ink)}
.go p.block{color:var(--ink)}
.go p.block .mk-gap{margin-right:var(--space-1)}
.go p.done{color:var(--x-proposed-lit)}
/* proofs */
.proofs{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:var(--space-2);min-height:0;overflow:auto}
.proof{display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small);animation:dep var(--motion-calm) var(--ease-out) both;animation-delay:calc(var(--i) * var(--motion-instant))}
.proof header{display:grid;gap:2px;padding-bottom:var(--space-1);border-bottom:1px solid var(--hairline)}
.proof header b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.proof header .where{color:var(--ink-muted)}
.proof header .opn{font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted)}
.proof .hl{margin:0;color:var(--ink)}
.proof .pbl{margin:0;color:var(--ink-muted);display:flex;gap:var(--space-1);align-items:flex-start}
.proof .pbl.ink{color:var(--light)}
.proof ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.proof li{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);padding-left:var(--space-2);border-left:2px solid transparent;color:var(--ink)}
.proof li.part,.proof li.none{border-left-color:var(--x-proposed-disagree)}
.proof li .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proof li .k{flex:none;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proof li .k.ok{color:var(--ink)}
.proof li .unseen{font-size:var(--x-proposed-type-micro)}
.proof .askline{margin:0;display:flex;gap:var(--space-1);align-items:flex-start;color:var(--ink-muted)}
.proof .askline svg{flex:none;margin-top:2px}
.proof .sentmark{margin-top:auto;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--x-proposed-lit)}
/* right: the watch */
.watch{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:var(--space-3)}
.recipe{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.recipe b{font-weight:400;color:var(--ink)}
.trig{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.trig li{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);padding:var(--space-1) var(--space-2);border:1px solid transparent;border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.trig li svg{margin-top:1px;color:var(--ink-muted)}
.trig li .st{display:block;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--x-proposed-lit)}
.trig li.cant{border:1px dashed var(--hairline-strong);color:var(--ink-muted)}
.trig li.cant .st{color:var(--ink-muted)}
.trig li.fired{background:var(--x-proposed-lit-wash);border-color:var(--x-proposed-lit)}
.trig li.missed{border-color:var(--x-proposed-seam)}
.trig li.missed .st{color:var(--x-proposed-seam)}
.week{display:grid;gap:var(--space-1)}
.days{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));margin-top:var(--space-4);border-top:1px solid var(--hairline-strong);padding-top:var(--space-1)}
.days span{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);text-align:center;position:relative}
.days span.today{color:var(--light)}
.days span .ev{position:absolute;left:50%;top:calc(var(--space-4) * -1 - 2px);transform:translateX(-50%);width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--x-proposed-lit)}
.days span .ev.none{background:none;border:1px dashed var(--x-proposed-seam)}
.cursor{position:absolute;top:calc(var(--space-2) * -1);bottom:0;width:1px;background:var(--light);transition:left var(--motion-run) var(--ease-standard)}
.legend{display:grid;gap:2px;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.legend span{display:flex;align-items:center;gap:var(--space-2)}
.legend i{flex:none;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--x-proposed-lit)}
.legend i.none{background:none;border:1px dashed var(--x-proposed-seam)}
.notice{padding:var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-raised);display:grid;gap:var(--space-2);animation:dep var(--motion-calm) var(--ease-out)}
.notice h3{margin:0;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.notice p{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.reasons{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.reasons span{padding:0 var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-pill);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.reasons span.on{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.toast{position:fixed;right:var(--edge);bottom:calc(var(--edge) + var(--space-5));padding:var(--space-2) var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--surface-overlay);font-size:var(--type-small);color:var(--ink);opacity:0;transition:opacity var(--motion-base) var(--ease-out);pointer-events:none;z-index:var(--layer-toast)}
.toast.on{opacity:1}
@media (max-width:1400px){
  .main{grid-template-columns:minmax(260px,22%) minmax(0,1fr) minmax(280px,24%);gap:var(--space-4)}
  .sent{font-size:var(--type-body);line-height:var(--leading-body)}
  .val.n{font-size:var(--type-body)}
  .proofs{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status"></div>
<div class="x-cap"><b>Briefing · Combined V3</b> finding to action · the order in a sentence, printer’s proofs, flood marks, five reasons an answer moves</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* ---- state ---- */
const S = { lines: { lib: 'L2', intent: 'I1', when: 'any' }, open: null, hot: 0, preview: null, inked: false, sent: false, week: false, shown: false };
const PUB = answer(DATA.today);
const LATER = addDays(DATA.today, 7);
const lib = () => DATA.libraries.find(l => l.id === (S.preview?.k === 'lib' ? S.preview.id : S.lines.lib));
const intent = () => DATA.intents.find(t => t.id === (S.preview?.k === 'intent' ? S.preview.id : S.lines.intent));
const preset = () => DATA.watchPresets.find(p => p.id === (S.preview?.k === 'when' ? S.preview.id : S.lines.when));
const peopleWord = n => `${fmt(n)} ${n === 1 ? 'person' : 'people'}`;
const orList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' or ' + a[a.length - 1];
const asks = pid => [...new Set(DATA.groups.filter(g => openN(g, pid) < total(g)).map(g => P(g.keeper).name))];
const floorsFrom = f => DATA.floorOrder.slice(RANK[f]);
const readerLabel = f => f === 'team' ? DATA.teams[DATA.myTeam] : f === 'department' ? `outside ${DATA.teams[DATA.myTeam]}` : `on the ${F(f).word} floor`;
const pencilOn = () => STATE.gateway && !S.inked;

/* ---- the three sentences: choices underlined, consequences computed (ink) ---- */
function optList(k) {
  if (k === 'lib') return DATA.libraries.map(l => { const lo = Math.min(...floorsFrom(l.floor).map(f => allOpen(DATA.proofReaders[f])));
    return { id: l.id, tier: l.floor, w: l.name, r: peopleWord(F(l.floor).reach), o: lo, s: `${F(l.floor).word} floor · ${l.approval ? 'needs ' + P(l.approval).name + '’s approval' : 'goes straight in'}` }; });
  if (k === 'intent') return DATA.intents.map(t => ({ id: t.id, tier: t.floor, w: `${t.ref} · ${t.title}`, r: peopleWord(t.followers + 1), o: allOpen(t.owner), s: `${P(t.owner).name} owns it · ${F(t.floor).word} floor` }));
  return DATA.watchPresets.map(p => ({ id: p.id, tier: DATA.myFloor, w: p.plain + (p.n !== undefined ? ' ' + p.n : ''), r: 'just you', o: null, s: p.id === 'any' ? 'every time the answer moves, with its reason' : p.id === 'above' ? `the count is ${PUB.overdueN} now` : 'only when every van is inspected' }));
}
function slot(k, label) { return `<button class="slot" data-k="${k}" aria-haspopup="listbox" aria-expanded="${S.open === k}">${label}</button>`; }
function sentences() {
  const L = lib(), fl = F(L.floor), lows = floorsFrom(L.floor).map(f => ({ f, pid: DATA.proofReaders[f], n: allOpen(DATA.proofReaders[f]) }));
  const low = lows.reduce((a, b) => b.n < a.n ? b : a);
  const T = allTotal();
  const s1 = `<span class="no">1</span>Publish it to ${slot('lib', L.name)}. <span class="val n">${fmt(fl.reach)}</span> <span class="val">people</span> on the <span class="fl" data-tier="${L.floor}">${fl.word} floor</span> and under it can read it. Readers ${readerLabel(low.f)} can open <span class="val n ${low.n < T / 2 ? 'warn' : ''}">${low.n} of ${T}</span> records behind it; their copy says to ask <span class="val">${orList(asks(low.pid))}</span> for the rest.${L.approval ? ` <span class="val warn">It waits for ${P(L.approval).name}’s approval.</span>` : ''}
    <span class="tk">reach(library=${L.id}) · floor rule: kept on a floor or above · restricted records open to nobody here</span>`;
  const t = intent(), on = allOpen(t.owner);
  const s2 = `<span class="no">2</span>Feed it to ${slot('intent', t.ref + ' · ' + t.title)}. <span class="val">${P(t.owner).name}</span> owns it and <span class="val n">${t.followers}</span> <span class="val">people</span> follow it; they see it as evidence, and ${P(t.owner).name.split(' ')[0]} can open <span class="val n ${on < T / 2 ? 'warn' : ''}">${on} of ${T}</span>.
    <span class="tk">mandate.intent.evidence.add(${t.ref}) · owner floor ${t.floor}</span>`;
  const can = DATA.triggers.filter(x => x.has).length;
  const p = preset();
  const s3 = `<span class="no">3</span>Watch it ${slot('when', p.plain + (p.n !== undefined ? ' ' + p.n : ''))}. Only <span class="val">you</span> are told. AUGUR can notice <span class="val n">${can} of ${DATA.triggers.length}</span> things that would move it; the other ${word(DATA.triggers.length - can)} are marked on the right.
    <span class="tk">watch = saved recipe + your access, re-run on each event; never the number</span>`;
  const pv = k => S.preview && S.preview.k === k ? 'pv' : '';
  return [['lib', s1], ['intent', s2], ['when', s3]].map(([k, s]) => `<div class="sw"><p class="sent ${pv(k)}">${s}</p>${S.open === k ? popHTML(k) : ''}</div>`).join('');
}
function popHTML(k) {
  const T = allTotal();
  return `<div class="pop" role="listbox" id="pop"><p class="ph">${k === 'lib' ? 'Which library · who can read it · the least any reader opens' : k === 'intent' ? 'Which intent · who sees it · what its owner opens' : 'When to tell you'}</p>
    ${optList(k).map((o, i) => `<button class="opt ${i === S.hot ? 'hot' : ''}" role="option" aria-selected="${i === S.hot}" data-opt="${o.id}" data-tier="${o.tier}"><b>${o.w}</b><span class="r">${o.r}</span>
      <span class="s">${o.o !== null ? `<span class="meterx"><i style="width:${(o.o / T * 100).toFixed(0)}%"></i></span>opens ${o.o} of ${T} · ` : ''}${o.s}</span></button>`).join('')}</div>`;
}

/* ---- proofs: each reader's own copy, side by side ---- */
function partStatus(qid, pid) {
  const gs = DATA.basis[qid].map(Gp), o = gs.map(g => openN(g, pid) / total(g));
  const who = [...new Set(gs.filter(g => openN(g, pid) < total(g)).map(g => P(g.keeper).name))];
  return { st: o.every(x => x === 1) ? 'all' : o.some(x => x > 0) ? 'part' : 'none', who };
}
function proofs() {
  const L = lib(), t = intent();
  const readers = floorsFrom(L.floor).reverse().map(f => ({ pid: DATA.proofReaders[f], where: `in ${L.name}`, f }));
  readers.push({ pid: t.owner, where: `in Mandate, ${t.ref}, evidence`, f: P(t.owner).floor, owner: true });
  const T = allTotal(); const keep = A; A = PUB; const PL = PLANS(); A = keep;
  return readers.map((r, i) => {
    const p = P(r.pid), n = allOpen(r.pid);
    const bl = pencilOn() ? `<p class="pbl">${mkGap()} <span>Bottom line won’t go out until ${P(DATA.me).name.split(' ')[0]} inks it.</span></p>` : `<p class="pbl ink">${blPlain()}</p>`;
    return `<article class="proof" style="--i:${i}" aria-label="${p.name}'s copy"><header><b>${p.name}</b><span class="fchip" data-tier="${p.floor === 'team' && p.team !== DATA.myTeam ? 'department' : p.floor}">${p.team ? DATA.teams[p.team] : F(p.floor).name}</span>
      <span class="where">${r.where}</span><span class="opn">you see: opens ${n} of ${T}</span></header>
      <p class="hl">${textOf(PL.what.lines[0].html)}</p>${bl}
      <ul>${DATA.questions.map(q => { const s = partStatus(q.id, r.pid);
        return `<li class="${s.st}"><span class="lbl">${q.q}</span>${s.st === 'all' ? `<span class="k ok" title="they can open the records">${I('link', 11)}</span>` : s.st === 'part' ? `<span class="k">some locked</span>` : unseen('locked')}</li>`; }).join('')}</ul>
      ${asks(r.pid).length ? `<p class="askline">${I('lock', 11)} Their copy says: for what’s locked, ask ${orList(asks(r.pid))}.</p>` : ''}
      ${S.sent ? `<span class="sentmark">${I('check', 11)} sent ${dayStr(D(DATA.today))}</span>` : ''}</article>`;
  }).join('');
}

/* ---- the briefing, with its pencil line and, a week on, its seam ---- */
const DRAFT = () => DATA.draft.filter(p => p.ref !== null);
const blPlain = () => STATE.gateway ? DRAFT().map(p => fill(p.t, slotsPub())).join('') : fill(DATA.templateBottom, slotsPub());
let slotsPub = () => { const keep = A; A = PUB; const o = SLOTS(); A = keep; return o; };
function briefHTML() {
  const keep = A; A = PUB; const PL = PLANS();
  const now = answer(LATER);
  const bl = pencilOn()
    ? `<div class="bl3 pencil"><p class="pl">${I('pencil', 12)} Bottom line · pencil, drafted by the model</p><p class="txt">${blPlain()}</p><p class="who">every phrase points at a fact <button class="pbtn" data-act="ink">${I('pen-line', 12)} Ink it <span class="kbd">I</span></button></p></div>`
    : `<div class="bl3 pencil ${STATE.gateway ? 'inked' : 'off'}"><p class="txt">${blPlain()}</p><p class="who">${I(STATE.gateway ? 'pen-line' : 'file-text', 12)} ${STATE.gateway ? `Inked by ${P(DATA.me).name} · drafted by the model` : 'Model gateway off · from the template, ink'}</p></div>`;
  const head = textOf(PL.what.lines[0].html);
  const seam = S.week ? `<div class="seam" role="note"><span class="lab">SEAM · ${dayStr(D(LATER))} · ${DATA.reasons.happened.toUpperCase()}</span>
      <span class="now">${now.overdueN}</span> of ${now.fleet} now ${picCount(now, false, PUB)}<br>This copy went out saying <b>${PUB.overdueN}</b>. Readers see both, and the seam, until you republish (P).</div>` : '';
  const html = `<p class="eyebrow">Briefing · ${DATA.subject} · for ${P(DATA.reader).name}</p>
    <p class="stamp ${S.sent ? 'sent' : ''}">${I(S.sent ? 'check' : 'file-text', 12)} ${S.sent ? `Published ${dayStr(D(DATA.today))} to ${lib().name} · fed to ${intent().ref}` : 'Ready · not sent'}</p>
    <h2>${S.week ? head.replace(String(PUB.overdueN), `<span class="was">${PUB.overdueN}</span>`) : head}</h2>${seam}${bl}
    ${PL.what.kept.slice(1).map(l => `<p class="sub">${l.html}</p>`).join('')}<ul class="parts">${DATA.questions.slice(1).map(q => { let h = PL[q.id].kept.map(l => l.html).join(' ');
      if (S.week && q.id === 'worse') h = h.replace(/<svg class="wsz"[\s\S]*?<\/svg>/, picLine(PUB, false, { m: dayStr(D(LATER)), v: now.overdueN }));
      return `<li><b>${q.q}</b>${h}</li>`; }).join('')}</ul>`;
  A = keep; return html;
}

/* ---- the watch ---- */
function watchHTML() {
  const days = Array.from({ length: 8 }, (_, i) => addDays(DATA.today, i));
  const passed = new Set(PUB.dueSoon.map(v => v.due));
  const ev = DATA.weekEvent.on;
  const cur = S.week ? 7 : 0;
  const now = answer(LATER);
  return `<p class="eyebrow">The watch · ${P(DATA.me).name.split(' ')[0]}’s · ${S.sent ? 'set' : 'not set until you send'}</p>
    <p class="recipe">It re-runs one question, <b>“${DATA.recipe.plain}”</b>, under your access, and keeps the question, never the number.<span class="tk">${DATA.recipe.tech}</span></p>
    <p class="eyebrow" style="margin-top:var(--space-1)">What would move it</p>
    <ul class="trig">${DATA.triggers.map(x => { const fired = S.week && x.reason === 'happened', missed = S.week && !x.has && !x.reason;
      return `<li class="${x.has ? '' : 'cant'} ${fired ? 'fired' : ''} ${missed ? 'missed' : ''}">${I(x.icon, 14)}<span>${x.plain}
        <span class="st">${x.has ? `AUGUR notices${x.reason ? ' · ' + DATA.reasons[x.reason].toLowerCase() : ''}` : `can’t notice yet: needs ${x.needs}`}</span><span class="tk">${x.tech}</span></span></li>`; }).join('')}</ul>
    <div class="week"><p class="eyebrow">Jump a week <span class="kbd">W</span></p>
      <div class="days">${days.map((d, i) => `<span class="${i === cur ? 'today' : ''}">${passed.has(d) ? '<i class="ev none"></i>' : ''}${d === ev ? '<i class="ev"></i>' : ''}${D(d).getUTCDate()}</span>`).join('')}<i class="cursor" style="left:calc(${(cur + .5) / 8 * 100}%)"></i></div>
      <div class="legend"><span><i class="none"></i>${dayStr(D([...passed][0]))}: ${word(PUB.dueSoonN)} due dates pass. No event, so nobody is told.</span><span><i></i>${dayStr(D(ev))}: an inspection is recorded. An event.</span></div></div>
    ${S.week ? `<section class="notice" aria-label="Notice"><h3>${DATA.subject}: ${now.overdueN} of ${now.fleet} overdue, was ${PUB.overdueN}</h3>
      <div class="reasons">${Object.entries(DATA.reasons).map(([k, w]) => `<span class="${k === 'happened' ? 'on' : ''}">${w}</span>`).join('')}</div>
      <p><b style="font-weight:400;color:var(--light)">${DATA.reasons.happened}.</b> ${P(DATA.weekEvent.by).name} recorded ${DATA.weekEvent.van}’s inspection on ${dayStr(D(ev))} (one fewer). The re-run also counted ${orList(PUB.dueSoon.map(v => v.id)).replace(' or ', ' and ')}, whose dates passed on ${dayStr(D([...passed][0]))} (${word(PUB.dueSoonN)} more): AUGUR couldn’t notice that on the day, so you hear it ${word(daysBetween([...passed][0], ev))} days late.</p>
      <p class="tk">notice.reason=happened · trigger=atlas.observation.recorded · rerun diff: −${DATA.weekEvent.van} +${PUB.dueSoon.map(v => v.id).join(' +')}</p></section>` : ''}`;
}

/* ---- render ---- */
function render() {
  A = answer(S.week ? LATER : DATA.today);
  const blocked = pencilOn();
  const go = S.sent
    ? `<p class="done">${I('check', 12)} Done ${dayStr(D(DATA.today))} by ${P(DATA.me).name}. This paragraph stays with the briefing as the record of what was done.</p><span></span>`
    : blocked
      ? `<p class="block">${mkGap()}The bottom line is still in pencil, so nothing goes out. Ink it (<b>I</b>), or turn the model off (<b>G</b>) to send the template line.</p><button class="btn" aria-disabled="true">${I('send', 14)} Send <span class="kbd">↵</span></button>`
      : `<p><b>3 things</b> will happen, in this order. Each reader gets the copy shown below.</p><button class="btn go" data-act="send">${I('send', 14)} Send <span class="kbd">↵</span></button>`;
  $('#app').innerHTML = topHTML(['Artifacts', DATA.libraries[0].name, DATA.subject],
    [['1 2 3', 'choose'], ['I', 'ink'], ['↵', 'send'], ['W', 'a week on'], ['T', 'admin words', 'h-t'], ['G', 'model off', 'h-g'], ['R', 'replay']]) +
  `<main class="main">
    <section class="col brief" aria-label="The briefing">${briefHTML()}</section>
    <section class="col" aria-label="What to do with it" style="position:relative">
      <p class="eyebrow">What to do with it · choose the underlined words</p>
      <div class="para" id="para">${sentences()}</div>
      <div class="go">${go}</div>
      <p class="eyebrow">Proofs · each reader’s own copy, before it goes</p>
      <div class="proofs">${S.shown ? proofs() : ''}</div>
    </section>
    <aside class="col watch" aria-label="The watch">${watchHTML()}</aside>
  </main>`;
  document.body.classList.toggle('tech', STATE.tech);
  $('#h-t')?.classList.toggle('on', STATE.tech);
  $('#h-g')?.classList.toggle('on', !STATE.gateway);
}

/* ---- the moment ---- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2600); }
function openSlot(k) { S.open = k; const ids = optList(k).map(o => o.id); S.hot = ids.indexOf(S.lines[k]); S.preview = { k, id: S.lines[k] }; render(); }
function hot(i) { const o = optList(S.open); S.hot = (i + o.length) % o.length; S.preview = { k: S.open, id: o[S.hot].id }; render(); }
function choose() { if (!S.open) return; S.lines[S.open] = optList(S.open)[S.hot].id; S.open = null; S.preview = null; render(); }
function play() {
  clearLater();
  Object.assign(S, { lines: { lib: 'L2', intent: 'I1', when: 'any' }, open: null, preview: null, inked: false, sent: false, week: false, shown: false });
  STATE.gateway = true;
  render();
  later(() => openSlot('lib'), 1200);
  later(() => hot(0), 1550);
  later(() => hot(2), 1900);
  later(() => hot(1), 2250);
  later(() => { choose(); S.shown = true; render(); }, 2650);
}
function send() {
  if (S.sent) return;
  if (pencilOn()) { toast('The bottom line is still in pencil. Ink it first (I).'); return; }
  S.sent = true; render();
}
function weekOn() {
  if (!S.sent) { toast('Nothing is watched yet: send first.'); return; }
  if (S.week) return;
  S.week = true; render();
  $('.notice')?.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
  $('.seam')?.scrollIntoView({ block: 'nearest' });
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (S.open) {
    if (k === 'arrowdown') { e.preventDefault(); hot(S.hot + 1); return; }
    if (k === 'arrowup') { e.preventDefault(); hot(S.hot - 1); return; }
    if (k === 'enter') { e.preventDefault(); choose(); return; }
    if (k === 'escape') { S.open = null; S.preview = null; render(); return; }
  }
  if (k === 'r') { play(); return; }
  if (k === '1') return openSlot('lib');
  if (k === '2') return openSlot('intent');
  if (k === '3') return openSlot('when');
  if (k === 'i') { if (STATE.gateway && !S.inked) { S.inked = true; S.shown = true; render(); } return; }
  if (k === 'enter') { e.preventDefault(); send(); return; }
  if (k === 'w') { weekOn(); return; }
  if (k === 'p' && S.week) { toast('Republished: the copy now says the new number, and keeps a note of the old one.'); return; }
  if (k === 't') { STATE.tech = !STATE.tech; render(); return; }
  if (k === 'g') { STATE.gateway = !STATE.gateway; render(); toast(STATE.gateway ? 'Model gateway on: the pencil line is back.' : 'Model gateway off: the template line goes out. No number changed.'); return; }
});
document.addEventListener('click', e => {
  const s = e.target.closest('.slot'); if (s) { S.open === s.dataset.k ? (S.open = null, S.preview = null, render()) : openSlot(s.dataset.k); return; }
  const o = e.target.closest('[data-opt]'); if (o) { S.hot = optList(S.open).findIndex(x => x.id === o.dataset.opt); choose(); return; }
  const a = e.target.closest('[data-act]');
  if (a?.dataset.act === 'ink') { S.inked = true; render(); }
  if (a?.dataset.act === 'send') send();
});
play();
</script>
</body>
</html>
