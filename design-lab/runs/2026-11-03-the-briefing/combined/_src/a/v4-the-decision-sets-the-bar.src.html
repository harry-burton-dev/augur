<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The decision sets the bar</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
:root{
  /* NEW: one cell of the card-size yardstick (wider than the word-size stick so two answers can sit over it) */
  --x-proposed-yard-cell: calc(var(--space-5) + var(--space-1));
}
.app{height:100vh;display:flex;flex-direction:column}
.dec{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-5);align-items:end;padding:var(--space-3) var(--edge) var(--space-2)}
.intent{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.intent b{font-weight:400;color:var(--ink)}
.intent .id{font-family:var(--font-mono);color:var(--ink)}
.dec h1{font-weight:200;font-size:var(--type-heading);line-height:var(--leading-heading);letter-spacing:var(--tracking-caps);text-transform:uppercase;margin:var(--space-1) 0 2px;color:var(--light)}
.verdict{margin:0;font-size:var(--type-lead);line-height:var(--leading-lead);font-weight:300;color:var(--ink);max-width:80ch}
.verdict b{font-weight:400;color:var(--light)}
.verdict .n{font-family:var(--font-mono);color:var(--light)}
.std{display:flex;flex-direction:column;gap:var(--space-1);align-items:flex-end}
.ladder{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;width:calc(var(--measure-glance) + var(--space-6))}
.ladder span{display:flex;align-items:flex-end;min-height:calc(var(--space-6) - var(--space-2));padding:var(--space-1);border:1px solid var(--hairline);background:var(--surface-inset);font-size:var(--x-proposed-type-micro);line-height:1.3;color:var(--ink-muted);letter-spacing:var(--tracking-soft);text-transform:uppercase;transition:color var(--motion-base),background var(--motion-base),border-color var(--motion-base)}
.ladder span.ok{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.ladder span.bar{color:var(--light);border-color:var(--x-proposed-lit);box-shadow:inset 0 -2px 0 var(--x-proposed-lit)}
.ladder span.pv{border-style:dashed;border-color:var(--x-proposed-pencil-edge)}
.std .note{display:flex;gap:var(--space-2);align-items:flex-start;margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:right;max-width:calc(var(--measure-glance) + var(--space-6))}
.std .note b{font-weight:400;color:var(--ink)}
.prop{flex:none;display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-pencil);border:1px dashed var(--x-proposed-pencil-edge);border-radius:var(--radius-key);padding:0 var(--space-1)}

/* the bottom line: the model's one pencil slot */
.bline{flex:none;margin:0 var(--edge) var(--space-3);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,var(--measure-decision));gap:var(--space-5);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-left:2px dotted var(--x-proposed-pencil-edge);border-radius:var(--radius-key);background:var(--x-proposed-pencil-wash)}
.bline.inked{border-left:2px solid var(--hairline-strong);background:var(--surface-inset)}
.bline .txt{margin:var(--space-1) 0 0;font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);font-style:italic;color:var(--x-proposed-pencil)}
.bline.inked .txt{font-style:normal;color:var(--ink)}
.bline .slot-w{font-style:normal;font-family:var(--font-sans);text-transform:uppercase;letter-spacing:var(--tracking-soft);font-size:var(--type-meta);color:var(--light);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:0 var(--space-1);white-space:nowrap}
.bline .ref{border-bottom:1px dotted var(--x-proposed-pencil-edge)}
.bline .ref sup{font:400 var(--x-proposed-type-micro)/0 var(--font-mono);font-style:normal;color:var(--ink-muted);margin-left:1px}
.bline .side{display:flex;flex-direction:column;gap:var(--space-1);justify-content:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.bline .side b{font-weight:400;color:var(--ink)}
.bline .side .w{color:var(--light);text-transform:uppercase;letter-spacing:var(--tracking-soft)}
.bline .acts{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink);font-size:var(--type-small);line-height:var(--leading-small);white-space:nowrap}
.btn:disabled{color:var(--ink-muted);border-style:dashed;opacity:.8}
.btn.lit{border-color:var(--x-proposed-lit);color:var(--light)}

/* the three columns */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--space-5) minmax(0,1fr) var(--space-4) minmax(0,1.08fr);padding:0 var(--edge)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-1)}
.col > header{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2);padding-bottom:var(--space-1)}
.col > header h2{margin:0;font-weight:300;font-size:var(--type-meta);line-height:var(--leading-meta);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink)}
.col > header h2 b{font-family:var(--font-mono);font-weight:400;color:var(--light);margin-right:var(--space-2)}
.col > header span{font-size:var(--type-small);color:var(--ink-muted)}
.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-1) var(--space-1) var(--space-2)}
.barline{position:relative;display:flex;justify-content:center}
.barline::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px solid var(--x-proposed-lit);transform-origin:top;transition:transform var(--motion-calm) var(--ease-out)}
.pre .barline::before,.barline.wait::before{transform:scaleY(0)}
.barline span{position:relative;writing-mode:vertical-rl;background:var(--slate-deep);padding:var(--space-3) var(--space-1);margin-top:var(--space-6);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--x-proposed-lit);white-space:nowrap;height:max-content}
.sep{border-left:1px dashed var(--hairline-strong);margin:0 auto}

.card{display:grid;gap:var(--space-1);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);background:var(--surface-pane);border:1px solid var(--hairline);text-align:left;width:100%;will-change:transform;transition:opacity var(--motion-calm) var(--ease-out)}
.card.hide{opacity:0}
.card .t{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2)}
.card .lab{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink)}
.card .lab s{color:var(--ink-muted)}
.card .ta{display:inline-flex;align-items:center;gap:var(--space-2)}
.card .num{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.card .say{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.card .sm{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.card .sm b{font-weight:400;color:var(--ink)}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);border-top:1px solid var(--hairline);padding-top:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.card .foot b{font-weight:400;color:var(--ink)}
.c-below .card{background:transparent;border-style:dashed}
.card.k-dispute{border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash)}
.card.k-dispute .lab{color:var(--x-proposed-disagree)}
.card.k-gap{background:var(--x-proposed-gap);border-color:transparent;--x-proposed-gap-tick:var(--space-2)}
.card.k-stale{background:linear-gradient(90deg,var(--surface-pane) 70%,transparent),var(--x-proposed-stale)}
.card.k-hidden{background:linear-gradient(90deg,var(--surface-inset) 70%,transparent),var(--x-proposed-unseen)}
.card.k-count{border-left:2px solid var(--hairline-strong)}
.card.lowered{box-shadow:inset 0 0 0 1px var(--x-proposed-lit)}
.card.focus{box-shadow:0 0 0 1px var(--x-proposed-lit),0 0 var(--space-4) var(--x-proposed-lit-wash)}
.blank{display:inline-block;background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-1);padding:0 var(--space-2);color:var(--ink-muted);line-height:1.35}
.blank.lk{background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px}

/* the card-size yardstick: a word sits ON it, two answers lift OFF it, a gap sits BELOW it */
.yard{display:grid;grid-template-columns:repeat(7,var(--x-proposed-yard-cell));column-gap:2px;align-items:end;justify-content:start;position:relative}
.yard .c{grid-row:3;height:var(--space-1);border-radius:1px;background:var(--hairline)}
.yard .c.on{background:currentColor}
.yard .bm{grid-row:1 / 4;justify-self:start;align-self:stretch;width:0;border-left:2px solid var(--x-proposed-lit);margin-left:-2px;position:relative;z-index:1}
.yard.lift .c{background:transparent;outline:1px dashed var(--hairline-strong);outline-offset:-1px}
.yard .pill{grid-row:1;justify-self:center;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--x-proposed-disagree);border:1px solid var(--x-proposed-disagree);border-radius:var(--radius-pill);padding:0 var(--space-1);white-space:nowrap;background:var(--slate-deep)}
.yard .brk{grid-row:2;height:var(--space-2);border:1px solid var(--x-proposed-disagree);border-bottom:0;margin:0 calc(var(--x-proposed-yard-cell) / 2);opacity:.8}
.yard.below .c{background:transparent;outline:1px dashed var(--hairline);outline-offset:-1px}
.yard .under{grid-row:4;grid-column:1 / 5;margin-top:var(--space-1);height:var(--space-3);background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-1);font-size:var(--x-proposed-type-micro);line-height:var(--space-3);color:var(--ink-muted);padding:0 var(--space-2);white-space:nowrap}
.yard .c.was{background:var(--x-proposed-stale);outline:1px solid var(--hairline-strong)}
.yard.locked .c{background:var(--x-proposed-unseen)}
.ywrap{display:flex;align-items:flex-end;gap:var(--space-3)}
.ywrap{flex-wrap:wrap;row-gap:var(--space-1)}
.ywrap .yl{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.tech .yl .tk{display:block}
.cov{display:inline-flex;height:var(--space-2);width:calc(var(--x-proposed-yard-cell) * 6);border:1px solid var(--hairline-strong);border-radius:2px;overflow:hidden;background:var(--x-proposed-unseen)}
.cov i{background:var(--ink-muted)}
.low{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);color:var(--ink-muted);border:1px solid var(--hairline);border-radius:var(--radius-key);padding:0 var(--space-2)}
.low:hover{color:var(--ink);border-color:var(--hairline-strong)}

/* lowering a word: a person may only go down, and must say why */
.lowp{display:grid;gap:var(--space-1);padding:var(--space-2);margin-top:var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--surface-raised)}
.lowp .opts{display:flex;gap:2px;flex-wrap:wrap}
.lowp .opts button{font-size:var(--x-proposed-type-micro);line-height:1.4;letter-spacing:var(--tracking-soft);text-transform:uppercase;padding:2px var(--space-1);border:1px solid var(--hairline);border-radius:2px;color:var(--ink)}
.lowp .opts button:disabled{color:var(--ink-muted);opacity:.6;border-style:dashed}
.lowp .opts button[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--light)}
.lowp textarea{font:inherit;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);background:var(--surface-inset);border:1px solid var(--hairline-strong);border-radius:2px;padding:var(--space-1) var(--space-2);resize:none;height:calc(var(--space-6) - var(--space-2))}
.lowp .row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.signed{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-left:2px solid var(--x-proposed-lit);padding-left:var(--space-2)}
.signed b{font-weight:400;color:var(--ink)}

/* reach before act */
.reach{flex:none;display:flex;align-items:center;gap:var(--space-3);margin:var(--space-2) var(--edge) calc(var(--space-6) - var(--space-2));padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.reach b{font-weight:400;color:var(--ink)}
.reach p{margin:0;flex:1}
.reach .fchip{--fc:var(--floor-department-high)}
</style>
</head>
<body>
<div class="app pre" id="app">
  <header class="top">
    <span class="brand">AUGUR</span>
    <span class="crumb" id="crumb"></span>
    <span class="fchip" id="fchip"></span>
    <div class="hints" id="hints"></div>
  </header>
  <section class="dec dep" style="--i:0">
    <div>
      <p class="intent" id="intent"></p>
      <h1 id="title"></h1>
      <p class="verdict" id="verdict" aria-live="polite"></p>
    </div>
    <div class="std">
      <p class="eyebrow">The bar this decision asks for</p>
      <div class="ladder" id="ladder" aria-label="Standard of proof"></div>
      <p class="note" id="note"></p>
    </div>
  </section>
  <section class="bline dep" style="--i:1" id="bline"></section>
  <div class="cols dep" style="--i:2">
    <section class="col c-clear"><header><h2 id="h-clear"></h2><span>rely on these</span></header><div class="list scroll" id="l-clear"></div></section>
    <div class="barline" id="barline"><span id="barlab"></span></div>
    <section class="col c-below"><header><h2 id="h-below"></h2><span>use them, and say the word</span></header><div class="list scroll" id="l-below"></div></section>
    <div class="sep"></div>
    <section class="col c-need"><header><h2 id="h-need"></h2><span>no bar can be met until someone acts</span></header><div class="list scroll" id="l-need"></div></section>
  </div>
  <section class="reach dep" style="--i:3" id="reach"></section>
</div>
<div class="x-cap"><b>Briefing · Combined V4</b> the decision sets the bar · standards of proof, PHIA yardstick, IPCC evidence × agreement, pencil and ink · <b>proposed for Mandate</b></div>
<script>
/*@JS*/

const D = DATA.decision;
const st = { tech: false, gw: true, lowered: false, lowOpen: false, struck: true, inked: false, preview: null, sorted: false };
const app = $('#app');
const Y = DATA.yardstick;
const yword = i => Y[i];
const ywordL = i => Y[i].toLowerCase();

/* ---- every claim gets its place by rule ---- */
function placed(c) {
  const p = { ...c };
  if (c.kind === 'count') {
    const rows = q().filter(r => r.site === c.of), over = rows.filter(r => r.s === 'overdue').length;
    p.n = over; p.settled = rows.filter(r => r.s === 'overdue' || r.s === 'done').length; p.of = rows.length;
    p.text = c.say.replace('{n}', over); p.col = 'clear'; return p;
  }
  if (['dispute', 'gap', 'stale', 'hidden'].includes(c.kind)) { p.col = 'need'; return p; }
  p.rule = wordOf(c.src); p.w = p.rule;
  if (st.lowered && D.lower.claim === c.id) { p.w = D.lower.to; p.lowered = true; }
  p.col = p.w >= bar() ? 'clear' : 'below';
  return p;
}
const bar = () => st.preview ?? D.bar;
const claims = () => D.claims.map((c, i) => ({ ...placed(c), num: i + 1 }));

/* ---- the card-size yardstick ---- */
function yard(p) {
  const b = bar(), bm = `<span class="bm" style="grid-column:${b + 1}" title="the bar: ${esc(ywordL(b))}"></span>`;
  const cells = (cls = i => '') => Y.map((_, i) => `<span class="c ${cls(i)}" style="grid-column:${i + 1}"></span>`).join('');
  if (p.kind === 'dispute') {
    const a = p.sides.map(s => s.alone), lo = Math.min(...a), hi = Math.max(...a);
    return `<div class="ywrap"><span class="yard lift">${p.sides.map(s => `<span class="pill" style="grid-column:${s.alone + 1}">${esc(s.says.split(' ')[0])}</span>`).join('')}<span class="brk" style="grid-column:${lo + 1} / ${hi + 2}"></span>${cells()}${bm}</span><span class="yl">two answers, lifted off the scale<br>no word</span></div>`;
  }
  if (p.kind === 'gap') return `<div class="ywrap"><span class="yard below">${cells()}${bm}<span class="under">nothing to weigh</span></span><span class="yl">below the scale<br>no word</span></div>`;
  if (p.kind === 'stale') return `<div class="ywrap"><span class="yard">${cells(i => i === p.was ? 'was' : '')}${bm}</span><span class="yl">was ${esc(ywordL(p.was))}<br>checked ${esc(p.checked)}</span></div>`;
  if (p.kind === 'hidden') return `<div class="ywrap"><span class="yard locked">${cells()}${bm}</span><span class="yl">can’t be weighed<br>from this floor</span></div>`;
  return `<div class="ywrap"><span class="yard">${cells(i => i <= p.w ? 'on' : '')}${bm}</span><span class="yl">${p.w >= b ? 'at or over the bar' : `${b - p.w} step${b - p.w > 1 ? 's' : ''} under the bar`}<span class="tk">${esc(DATA.yardTech[p.w])}</span></span></div>`;
}
const srcLine = src => src.map(s => `${esc(s.from)} (<b>${esc(DATA.grades[s.g].plain)}</b>)`).join(', ');

function card(p) {
  const k = p.kind || 'word';
  let lab, body = '', foot = '';
  if (k === 'count') {
    lab = `<span class="recorded">${ic('check', 11)} recorded</span>`;
    body = `<p class="say" style="margin:0">${esc(p.text)}</p><div class="ywrap"><span class="cov" aria-hidden="true"><i style="width:${p.settled / p.of * 100}%"></i></span><span class="yl">settled ${p.settled} of ${p.of} · a count takes no word</span></div>
      <p class="sm" style="margin:0">From the inspections briefing’s own query. The other ${p.of - p.settled} can only add, so it is “at least”.</p>`;
  } else if (k === 'word') {
    lab = p.lowered ? `<span class="cw" style="color:var(--light)"><s>${esc(yword(p.rule))}</s> ${esc(yword(p.w))}</span>` : `<span class="cw">${esc(yword(p.w))}</span>`;
    body = `<p class="say" style="margin:0">${esc(p.say)}</p>${yard(p)}<p class="sm" style="margin:0">${srcLine(p.src)}. ${p.src.length > 1 ? 'They agree.' : 'Nothing to check it against.'}</p>`;
    if (p.lowered) body += `<p class="signed">Lowered by <b>${esc(D.lower.by)}</b>, ${esc(D.lower.on)}: “${esc(D.lower.reason)}” <button class="btn" data-undo style="margin-left:var(--space-1)">${ic('undo-2', 12)} Undo <span class="kbd">L</span></button></p>`;
    else foot = `<div class="foot"><span>The word comes from the rule. You may lower it, never raise it.</span><button class="low" data-low="${p.id}">${ic('arrow-down', 12)} Lower</button></div>`;
    if (st.lowOpen && p.id === D.lower.claim && !p.lowered) foot += lowPanel(p);
  } else if (k === 'dispute') {
    lab = `${ic('git-compare', 13)} Two answers`;
    body = `<p class="say" style="margin:0">${esc(p.say)} <b>${p.sides.map(s => esc(s.says)).join('</b> or <b>')}</b>.</p>${yard(p)}<p class="sm" style="margin:0">${p.sides.map(s => `${esc(s.says)}: ${esc(s.from)} (<b>${esc(DATA.grades[s.g].plain)}</b>)`).join(' · ')}. They weigh about the same, so nobody can pick one yet. Decides: <b>${esc(p.who)}</b>.</p>`;
  } else if (k === 'gap') {
    lab = `${ic('square-dashed', 13)} Not known yet`;
    body = `<p class="say" style="margin:0">${esc(p.say)} <span class="blank">${esc(p.blank)}</span>${esc(p.after)}</p>${yard(p)}<p class="sm" style="margin:0">${esc(p.why)} Could fill it: <b>${esc(p.who)}</b>.</p>`;
  } else if (k === 'stale') {
    lab = `${ic('hourglass', 13)} Out of date`;
    body = `<p class="say" style="margin:0"><span class="mk-stale">${esc(p.say)}</span></p>${yard(p)}<p class="sm" style="margin:0">It was ${esc(ywordL(p.was))} when checked in ${esc(p.checked)}. It should be checked every ${esc(p.every)}. Could check it: <b>${esc(p.who)}</b>.</p>`;
  } else if (k === 'hidden') {
    lab = `${ic('lock', 13)} Not yours to see`;
    body = `<p class="say" style="margin:0">${esc(p.say)} <span class="blank lk">${esc(p.blank)}</span>${esc(p.after)}</p>${yard(p)}<p class="sm" style="margin:0">Kept on ${esc(DATA.floors[p.keptOn].name)}, a floor you can’t open. Ask: <b>${esc(p.who)}</b>.</p>`;
  }
  const act = p.act ? `<button class="btn">${ic(p.kind === 'dispute' ? 'gavel' : 'send', 12)} ${esc(p.act)}</button>` : '';
  return `<article class="card k-${k}${p.lowered ? ' lowered' : ''}" data-id="${p.id}" tabindex="0"><div class="t"><span class="lab">${lab}</span><span class="ta">${act}<span class="num">${p.num}</span></span></div>${body}${foot}</article>`;
}
function lowPanel(p) {
  const to = st.lowTo ?? Math.min(DATA_LOWER_TO, p.rule - 1);
  return `<div class="lowp" role="group" aria-label="Lower the word"><div class="row"><span>Lower to</span><span>raising takes another source</span></div>
    <div class="opts">${Y.map((w, i) => `<button data-to="${i}" ${i >= p.rule ? 'disabled' : ''} aria-pressed="${i === to}">${esc(w)}</button>`).reverse().join('')}</div>
    <textarea id="why" aria-label="Why you are lowering it" placeholder="Say why. The reason is kept with the word.">${esc(st.lowWhy ?? '')}</textarea>
    <div class="row"><span>Signed by ${esc(D.lower.by)}</span><button class="btn lit" data-confirm>${ic('arrow-down', 12)} Lower to ${esc(ywordL(to))}</button></div></div>`;
}

/* ---- the bottom line: pencil, with the word slot filled by rule ---- */
function bottomLine(list) {
  const el = $('#bline'), by = Object.fromEntries(list.map(p => [p.id, p]));
  const pointed = D.pencil.filter(x => x.ref).map(x => by[x.ref]);
  const weighed = pointed.filter(p => p.w !== undefined);
  const weakest = weighed.reduce((a, b) => (b.w < a.w ? b : a));
  const unbacked = pointed.filter(p => p.w === undefined);
  if (!st.gw) {
    el.className = 'bline inked';
    const clear = list.filter(p => p.col === 'clear').length;
    el.innerHTML = `<div><p class="pen-lane" style="color:var(--ink-muted)">${ic('file-text', 12)} Bottom line · from the template · the assistant is off</p>
      <p class="txt">The briefing rests on ${list.length} claims; ${clear} clear the bar. Your recommendation: <span class="blank">you write it</span></p></div>
      <div class="side"><span>No number on this page changed when the assistant went off.</span><span>Words, sorting and the verdict are rules, not the model.</span></div>`;
    return { ready: false, weakest };
  }
  const txt = D.pencil.map(x => {
    if (x.slot) return `<span class="slot-w" title="filled by rule: no surer than its weakest claim">${esc(ywordL(weakest.w))}</span>`;
    if (!x.ref) return esc(x.t);
    const p = by[x.ref];
    if (p.w === undefined && st.struck) return `<span class="unbacked" title="points at a claim with no word: ${esc(p.kind)}">${esc(x.t)}</span>`;
    if (p.w === undefined) return '';
    return `<span class="ref">${esc(x.t)}<sup>${p.num}</sup></span>`;
  }).join('').replace(/, and \.$/, '.');
  const blocked = st.struck && unbacked.length;
  el.className = 'bline' + (st.inked ? ' inked' : '');
  el.innerHTML = `<div><p class="pen-lane"${st.inked ? ' style="color:var(--ink-muted)"' : ''}>${ic(st.inked ? 'pen-line' : 'pencil', 12)} Bottom line · ${st.inked ? `drafted by the assistant, inked by ${esc(DATA.author.name)}` : 'pencil · drafted by the assistant'}</p><p class="txt">${txt}</p><span class="tk">slot word = min(word of each claim the line points at) · a phrase pointing at a claim with no word is struck and blocks inking</span></div>
    <div class="side"><span>No surer than its weakest claim (${weakest.num}): <b>${esc(weakest.say.replace(/\.$/, ''))}</b>, <span class="w">${esc(ywordL(weakest.w))}</span>.</span>
    ${blocked ? `<span>Struck: “${esc(D.pencil.find(x => x.ref === unbacked[0].id).t)}” points at <b>${esc(unbacked[0].say.split(' ').slice(0, 2).join(' '))} …</b> (${unbacked[0].num}), which is not known yet. It can’t be inked while it stays.</span>` : ''}
    <span class="acts">${blocked ? `<button class="btn" data-strike>${ic('x', 12)} Take it out <span class="kbd">X</span></button>` : ''}<button class="btn${!blocked && !st.inked ? ' lit' : ''}" data-ink ${blocked || st.inked ? 'disabled' : ''}>${ic('pen-line', 12)} ${st.inked ? 'Inked' : 'Ink it'} <span class="kbd">I</span></button></span></div>`;
  return { ready: st.inked, weakest };
}

/* ---- render ---- */
function render() {
  const list = claims(), b = bar();
  const cols = { clear: [], below: [], need: [] };
  list.forEach(p => cols[p.col].push(p));
  const need = cols.need.length, below = cols.below.length;
  const due = dayY(D.intent.due);
  $('#verdict').innerHTML = need || below
    ? `<b>Not ready to decide.</b> <span class="n">${need}</span> things need someone before ${due}; <span class="n">${below}</span> claim${below === 1 ? ' is' : 's are'} below the bar, so the briefing must say how sure ${below === 1 ? 'it is' : 'they are'}.`
    : `<b>Ready to decide.</b> Every claim clears the bar.`;
  $('#ladder').innerHTML = Y.map((w, i) => `<span class="${i >= b ? 'ok' : ''}${i === b ? ' bar' : ''}${st.preview !== null && i === b ? ' pv' : ''}">${esc(w)}</span>`).join('');
  $('#note').innerHTML = st.preview !== null
    ? `<span class="prop">${ic('eye', 11)} preview</span><span>Only a preview of the sort. The decision still asks for <b>${esc(ywordL(D.bar))}</b>.</span>`
    : `<span class="prop">${ic('pencil', 11)} proposed</span><span>“${esc(D.kind)}” asks for <b>${esc(ywordL(D.bar))} or surer</b>. ${esc(D.barProposed)}</span>`;
  $('#barlab').textContent = `the bar · ${ywordL(b)} or surer`;
  $('#h-clear').innerHTML = `<b>${cols.clear.length}</b>Clear the bar`;
  $('#h-below').innerHTML = `<b>${below}</b>Below the bar`;
  $('#h-need').innerHTML = `<b>${need}</b>Needs someone first`;
  ['clear', 'below', 'need'].forEach(k => $('#l-' + k).innerHTML = cols[k].map(card).join(''));
  if (!st.sorted) $$('.card').forEach(c => c.classList.add('hide'));
  const bl = bottomLine(list);
  // reach before act: what the intent's readers can open behind each claim
  const of = D.reach.floor, ok = list.filter(p => p.kind === 'count' || ((p.src || [{ keptOn: p.keptOn || 'fac' }]).every(s => canOpen(of, s.keptOn || 'fac')))).length;
  const locked = list.filter(p => !(p.kind === 'count' || ((p.src || [{ keptOn: p.keptOn || 'fac' }]).every(s => canOpen(of, s.keptOn || 'fac')))));
  $('#reach').innerHTML = `${ic('send', 16)}<p>Feeding <b>${esc(D.intent.id)}</b> puts this in front of <b>${esc(D.reach.readers)}</b> on the ${esc(DATA.floors[of].name)} ${esc(DATA.floors[of].word)}. Their copy opens what <b>${ok} of ${list.length}</b> claims rest on; for ${locked.map(p => `(${p.num})`).join(' and ')} it says whom to ask. ${bl.ready ? 'It can go.' : 'The bottom line is still in pencil, so it can’t go yet.'}</p><span class="fchip"><i></i>${esc(DATA.floors[of].name)} · ${esc(DATA.floors[of].word)}</span><button class="btn" ${bl.ready ? '' : 'disabled'}>${ic('send', 12)} Feed the intent</button>`;
  wire();
  Icons.hydrate(document.body);
}
function wire() {
  $$('[data-low]').forEach(b => b.onclick = () => { st.sorted = true; if (st.lowered) st.lowered = false; D.lower.claim = b.dataset.low; st.lowTo = undefined; st.lowOpen = true; st.lowWhy = ''; render(); $('#why') && $('#why').focus(); });
  $$('[data-to]').forEach(b => b.onclick = () => { st.lowTo = +b.dataset.to; st.lowWhy = $('#why').value; render(); });
  $$('[data-confirm]').forEach(b => b.onclick = () => { st.lowWhy = $('#why').value; if (!st.lowWhy.trim()) { $('#why').focus(); $('#why').placeholder = 'A reason is needed: it stays with the word.'; return; } lower(true); });
  $$('[data-undo]').forEach(b => b.onclick = () => lower(false));
  $$('[data-strike]').forEach(b => b.onclick = strike);
  $$('[data-ink]').forEach(b => b.onclick = ink);
}
/* FLIP: cards keep their identity while they move between columns */
function flip(change) {
  const before = new Map($$('.card').map(c => [c.dataset.id, c.getBoundingClientRect()]));
  change();
  if (RM) return;
  $$('.card').forEach(c => {
    const a = before.get(c.dataset.id); if (!a) return;
    const z = c.getBoundingClientRect(), dx = a.left - z.left, dy = a.top - z.top;
    if (!dx && !dy) return;
    c.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: ms('--motion-calm'), easing: cssVar('--ease-standard') });
  });
}
function lower(on) {
  flip(() => { if (on) { const c = D.claims.find(x => x.id === D.lower.claim); D.lower.to = st.lowTo ?? Math.min(DATA_LOWER_TO, wordOf(c.src) - 1); D.lower.reason = st.lowWhy || D.lower.reason; } st.lowered = on; st.lowOpen = false; render(); });
  const c = $(`.card[data-id="${D.lower.claim}"]`); if (c) { c.classList.add('focus'); later(() => c.classList.remove('focus'), ms('--motion-still')); }
}
function strike() { st.struck = false; render(); }
function ink() { if (!st.struck) { st.inked = true; render(); } }

function head() {
  $('#crumb').innerHTML = `${ic('landmark', 14)} Mandate ${ic('chevron-right', 12)} ${esc(DATA.floors.fac.name)} intents ${ic('chevron-right', 12)} <b>${esc(D.intent.id)}</b> ${ic('chevron-right', 12)} <b>Briefing</b>`;
  const fc = $('#fchip'); fc.style.setProperty('--fc', floorColour('sc')); fc.innerHTML = `<i></i>${esc(DATA.floors.sc.name)} · ${esc(DATA.floors.sc.word)}`;
  $('#intent').innerHTML = `${ic('target', 13)} Feeds the intent <span class="id">${esc(D.intent.id)}</span> <b>${esc(D.intent.title)}</b> · owner <b>${esc(D.intent.owner)}</b> · due <b>${esc(dayY(D.intent.due))}</b> · kind <b>${esc(D.kind)}</b>`;
  $('#title').textContent = D.question;
  hints($('#hints'), [['L', 'lower a word'], ['X I', 'strike, ink'], ['B', 'try another bar'], ['T', 'technical words'], ['G', 'assistant off'], ['R', 'replay']]);
}
function replay() {
  clearLater();
  Object.assign(st, { lowered: false, lowOpen: false, struck: true, inked: false, preview: null, sorted: false, lowTo: undefined, lowWhy: undefined });
  D.lower.reason = DATA_LOWER_REASON; D.lower.claim = DATA_LOWER_CLAIM; D.lower.to = DATA_LOWER_TO;
  app.classList.add('pre'); $('#barline').classList.add('wait'); render();
  requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('pre')));
  later(() => { st.sorted = true; $('#barline').classList.remove('wait'); $$('.card').forEach((c, i) => later(() => c.classList.remove('hide'), i * ms('--motion-instant'))); }, 1200);
  const seeIt = () => { const el = $('.lowp'); if (el) el.scrollIntoView({ block: 'nearest' }); };
  later(() => { st.lowOpen = true; st.lowWhy = ''; render(); seeIt(); }, 2200);
  later(() => { st.lowWhy = DATA_LOWER_REASON; render(); seeIt(); }, 2700);
  later(() => lower(true), 3200);
}
const DATA_LOWER_REASON = D.lower.reason, DATA_LOWER_CLAIM = D.lower.claim, DATA_LOWER_TO = D.lower.to;
head();
onKeys({
  l: () => { st.sorted = true; if (st.lowered) lower(false); else { st.lowWhy = st.lowWhy || DATA_LOWER_REASON; lower(true); } },
  x: () => { st.sorted = true; strike(); },
  i: () => { st.sorted = true; ink(); },
  b: () => { st.sorted = true; const opts = [null, 6, 4]; st.preview = opts[(opts.indexOf(st.preview) + 1) % opts.length]; flip(render); },
  t: () => { st.tech = !st.tech; document.body.classList.toggle('tech', st.tech); },
  g: () => { st.sorted = true; st.gw = !st.gw; render(); },
  r: replay
});
replay();
</script>
</body>
