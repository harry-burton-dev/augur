<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Briefing · Combined V3 · Finding to action</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; listed as
   "needs token" in notes.md. Marks carried from the catalogue run.
   --------------------------------------------------------------- */
:root{
  /* six ways to be empty (catalogue run): corner ticks for not known yet */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  /* stale: 45 degree hatch */
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  /* not yours to see: 135 degree hatch plus a lock */
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* sources disagree: a warning-tinted edge, never red */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  /* quiet lines, doesn't-apply text (wear and time) */
  --x-proposed-quiet: .62;
  /* mono numerals in data */
  --x-proposed-type-micro: .6875rem;
  /* the lit next step (light language) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* pencil (reference desk): what a model wrote, until a person accepts it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  /* reach: how far a light falls through floors below where a thing is kept */
  --x-proposed-reach-wash: 14%;
  /* data ink (picture run): the series a finding is about, and its context */
  --x-proposed-data: color-mix(in srgb, var(--ink) 92%, var(--light));
  --x-proposed-data-ctx: color-mix(in srgb, var(--ink-muted) 55%, transparent);
  /* a phrase that points at nothing (minute run) */
  --x-proposed-unbacked: color-mix(in srgb, var(--danger) 55%, var(--ink-muted));
  /* NEW (b-screens): a seam where a published number changed after it went out */
  --x-proposed-seam: color-mix(in srgb, var(--info) 70%, var(--ink));
  --x-proposed-seam-wash: color-mix(in srgb, var(--info) 8%, transparent);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.lite{color:var(--light)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.hints .on{color:var(--x-proposed-lit)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* floors */
[data-tier="department"]{--fc:var(--floor-department-high);--fl:var(--floor-department-low)}
[data-tier="team"]{--fc:var(--floor-team-high);--fl:var(--floor-team-low)}
[data-tier="org"]{--fc:var(--floor-org-high);--fl:var(--floor-org-low)}
[data-tier="you"]{--fc:var(--floor-you-high);--fl:var(--floor-you-low)}
.fchip{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap}
.fchip::before{content:"";width:var(--space-4);height:2px;background:var(--fc);border-radius:1px}
.fword{color:var(--fc)}

/* two registers: technical line one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* six ways to be empty, the two this surface meets most */
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);vertical-align:1px;white-space:nowrap}
.mk-unseen{display:inline-flex;align-items:center;justify-content:center;width:var(--space-4);height:var(--space-3);background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:2px;color:var(--ink-muted);flex:none}
.mk-disagree{display:inline-block;width:var(--space-4);height:var(--space-3);border-left:2px solid var(--x-proposed-disagree);border-right:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);flex:none;vertical-align:-1px}
.mk-gap{display:inline-block;width:var(--space-5);height:var(--space-4);vertical-align:-3px;
  --t:var(--space-1);
  background:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--t) no-repeat}
.mk-break{width:var(--space-5);height:var(--space-3);vertical-align:-1px}
.mk-break path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}

/* pencil and ink */
.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3)}
.pencil .pt{font-style:italic;color:var(--ink)}
.pencil .pl{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);margin:0 0 var(--space-1)}
.pencil.inked{border-style:solid;border-color:var(--hairline-strong);background:none}
.pencil.inked .pt{font-style:normal}
.pencil.off{border-style:dashed;border-color:var(--hairline)}
.pencil.off .pt{font-style:normal}
.pbtn{white-space:nowrap;display:inline-flex;align-items:center;gap:var(--space-1);height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink);margin-left:auto}

/* confidence word, with the yardstick at word size */
.cw{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--light);white-space:nowrap;vertical-align:1px}
.cw .yd{display:inline-grid;grid-template-columns:repeat(7,var(--space-1));gap:1px}
.cw .yd i{height:var(--space-2);background:var(--hairline-strong);border-radius:1px}
.cw .yd i.on{background:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard)}
.btn:hover{background:var(--surface-raised)}
.btn.go{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.btn[aria-disabled="true"]{opacity:var(--x-proposed-quiet);cursor:not-allowed}

/* app frame */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--slate-deep) 70%,transparent);min-width:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.crumb b{font-weight:400;color:var(--light)}
.crumb svg{opacity:var(--x-proposed-quiet);flex:none}
.top .hints{margin-left:auto;justify-content:flex-end}
.main{min-height:0;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));overflow:hidden}

/* the finding: headline (ink, template), bottom line (pencil), claims (ink) */
.fd-h{margin:var(--space-1) 0 var(--space-3);font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);letter-spacing:var(--tracking-tight)}
.fd-h .spk{vertical-align:-4px;margin-left:var(--space-2)}
.claims{list-style:none;margin:var(--space-3) 0 0;padding:0;display:grid;gap:var(--space-2)}
.claims li{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.claims li > svg{margin-top:2px;color:var(--ink-muted)}
.claims .bs{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:2px}
.claims .bs b{font-weight:400;color:var(--ink);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap)}
.claims li.judge .ct{font-style:normal}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}

/* isotype figures: counted, never scaled; a part figure is cut, not shrunk */
.figs{display:flex;flex-wrap:wrap;gap:1px;color:var(--ink)}
.fig{display:inline-flex;clip-path:inset(0 calc((1 - var(--part)) * 100%) 0 0)}
.ck{white-space:nowrap}
.ck-all{color:var(--ink)}
.ck-part{color:var(--x-proposed-disagree)}
.ck-none{color:var(--ink-muted);background:var(--x-proposed-unseen);padding:0 var(--space-1);border-radius:2px}
.x-cap{max-width:calc(100vw - 2 * var(--edge-tight))}

/* ---- b-screens: pictures at word size and full size ---- */
.sym{display:inline-flex;flex-wrap:wrap;gap:var(--g,0);vertical-align:-3px;color:var(--ink-muted);margin:0 2px 0 var(--space-1)}
.sym>span{display:inline-flex;opacity:.3}
.sym>span.on{color:var(--light);opacity:1}
.sym>span.new{box-shadow:0 1px 0 var(--x-proposed-seam)}
.sym.big{max-width:none}
.wsz{vertical-align:-3px;margin:0 2px 0 var(--space-1)}
svg.full{display:block;overflow:visible}
svg.full .ax{font:400 10px/1 var(--font-mono);fill:var(--ink-muted)}
svg.full .lb{font:400 10px/1 var(--font-mono);fill:var(--ink)}
svg.full .vl{font:400 11px/1 var(--font-mono);fill:var(--light)}
.seamline{stroke:var(--x-proposed-seam);stroke-width:1;stroke-dasharray:1 2}
.tiles-w{display:inline-grid;grid-template-columns:repeat(3,5px);grid-template-rows:repeat(3,5px);gap:1px;vertical-align:-2px;margin:0 var(--space-1)}
.tiles-w i{background:var(--hairline-strong);border-radius:1px}
.tiles-w i.on{background:var(--light)}
.tiles-w i.lo{background:var(--ink-muted)}
.tiles-w i.h{background:var(--x-proposed-unseen)}
.tiles-w i.x{background:none;border:1px solid var(--hairline)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,auto);gap:var(--space-1)}
.tile{display:grid;gap:2px;padding:var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);min-height:calc(var(--space-7) - var(--space-2))}
.tile b{font-weight:400;color:var(--ink)}
.tile em{font:400 var(--type-meta)/1 var(--font-mono);font-style:normal;color:var(--light)}
.tile.mine{border-color:var(--x-proposed-data)}
.tile .tb{display:block;height:2px;background:var(--hairline);border-radius:1px}
.tile .tb i{display:block;height:100%;background:var(--x-proposed-data)}
.tile.h{background:var(--x-proposed-unseen);border-color:var(--hairline)}
.tile.h span{display:inline-flex;gap:var(--space-1);align-items:center}
.tile.x{border-style:dashed;border-color:var(--hairline);opacity:var(--x-proposed-quiet)}
.recs{display:inline-flex;gap:2px;vertical-align:1px;margin:0 var(--space-1)}
.rec{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:2px;padding:2px var(--space-1);color:var(--light)}
.rt{width:100%;border-collapse:collapse;font:400 var(--type-small)/var(--leading-small) var(--font-mono)}
.rt th{font-weight:400;text-align:left;color:var(--ink-muted);border-bottom:1px solid var(--hairline-strong);padding:var(--space-1) var(--space-2) var(--space-1) 0}
.rt td{padding:var(--space-1) var(--space-2) var(--space-1) 0;border-bottom:1px solid var(--hairline);color:var(--ink-muted)}
.rt tr.on td{color:var(--light)}
.ruler{display:grid;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.ruler ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--hairline-strong)}
.ruler li{display:grid;grid-template-columns:calc(var(--space-7) + var(--space-5)) minmax(0,1fr);gap:var(--space-2);align-items:center;padding:2px 0 2px var(--space-2);color:var(--ink-muted)}
.ruler li.on .rw{color:var(--light)}
.ruler .chip{display:inline-block;border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:0 var(--space-2);color:var(--ink);margin-right:var(--space-1)}
.ruler .lifted,.ruler .below{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1) var(--space-2);color:var(--ink)}
.ruler .lifted b{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light)}
.ruler .q{flex-basis:100%;color:var(--ink-muted);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono)}
.unbacked{text-decoration:line-through wavy var(--x-proposed-unbacked) 1px;color:var(--x-proposed-unbacked)}
.cw .yd{grid-template-columns:repeat(5,var(--space-1))}
.lock{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}

/* ---- V3: the finished briefing goes out, and is watched ---- */
.main{display:grid;grid-template-columns:minmax(300px,23%) minmax(0,1fr) minmax(312px,23%);gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
/* left: the briefing as it will go out */
.brief{display:block;min-height:0;overflow:auto;background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4)}
.brief h2{margin:var(--space-1) 0 var(--space-2);font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.brief .stamp{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);margin:0 0 var(--space-2)}
.brief .stamp.sent{color:var(--x-proposed-lit)}
.bl3{margin:0 0 var(--space-2)}
.bl3 .txt{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.pencil .txt{font-style:italic}
.pencil.inked .txt{font-style:normal;color:var(--light)}
.bl3 .who{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-1);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted)}
.brief .sub{margin:0 0 var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.parts{list-style:none;margin:0;padding:0;display:grid}
.parts li{padding:var(--space-1) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.parts li b{display:block;font-weight:400;color:var(--ink-muted);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft)}
.parts .num{font-family:var(--font-mono);color:var(--light)}
/* the seam: a published number that has moved since */
.seam{margin:var(--space-1) 0 var(--space-2);padding:var(--space-2) var(--space-3);border-left:2px dashed var(--x-proposed-seam);background:var(--x-proposed-seam-wash);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);animation:dep var(--motion-calm) var(--ease-out)}
.seam b{font-weight:400;color:var(--light)}
.seam .now{font:400 var(--type-lead)/1 var(--font-mono);color:var(--light)}
.seam .lab{display:block;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--x-proposed-seam);letter-spacing:var(--tracking-soft)}
.was{text-decoration:line-through;text-decoration-color:var(--x-proposed-seam);color:var(--ink-muted)}
@keyframes dep{from{opacity:0;transform:translateY(var(--space-1))}}
@media (prefers-reduced-motion: reduce){@keyframes dep{from{opacity:0}}}
/* centre: the order in a sentence */
.para{display:grid;gap:var(--space-3);margin:0}
.sent{position:relative;margin:0;font-weight:300;font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-1));color:var(--ink-muted)}
.sent .no{display:inline-flex;align-items:center;justify-content:center;width:var(--space-5);height:var(--space-5);margin-right:var(--space-2);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink);vertical-align:2px}
.slot{position:relative;display:inline;color:var(--light);border-bottom:1px dashed var(--ink-muted);border-radius:2px;padding:0 2px;font-weight:400}
.slot::after{content:"▾";font-size:var(--type-small);color:var(--ink-muted);margin-left:var(--space-1);vertical-align:2px}
.slot[aria-expanded="true"]{background:var(--surface-raised);border-bottom-color:var(--x-proposed-lit)}
.val{color:var(--light);font-weight:400}
.val.n{font-family:var(--font-mono);font-size:calc(var(--type-lead) * .9)}
.val.warn{color:var(--x-proposed-disagree)}
.fl{color:var(--fc);font-weight:400;white-space:nowrap}
.sent.pv::before{content:"";position:absolute;left:calc(var(--space-3) * -1);top:var(--space-1);bottom:var(--space-1);width:2px;background:var(--x-proposed-lit)}
.sent.pv .val{color:var(--x-proposed-lit)}
.sent .tk{font-size:var(--x-proposed-type-micro);font-weight:400;margin-top:2px}
.sw{position:relative}
.pop{position:absolute;top:calc(100% + var(--space-1));z-index:var(--layer-menu);left:var(--space-5);min-width:calc(var(--measure-decision) + var(--space-5));padding:var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));box-shadow:var(--shadow-overlay);font-size:var(--type-meta);line-height:var(--leading-meta);animation:dep var(--motion-base) var(--ease-out)}
.pop .ph{margin:0 var(--space-2) var(--space-1);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.opt{display:grid;grid-template-columns:2px minmax(0,1fr) auto;gap:0 var(--space-3);width:100%;padding:var(--space-2);border-radius:var(--radius-key);color:var(--ink)}
.opt::before{content:"";grid-row:span 2;background:var(--fc);border-radius:1px}
.opt:hover,.opt.hot{background:var(--surface-raised)}
.opt b{font-weight:400;color:var(--light)}
.opt .r{text-align:right;font:400 var(--type-meta)/var(--leading-meta) var(--font-mono);color:var(--light);white-space:nowrap}
.opt .s{grid-column:2 / span 2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

const DATA = {

    { id: 'west',  name: 'Westfield', hidden: true, keeper: 'p6', team: 'west', col: 1, row: 2 },

  sources: {

  },
  kestrel: { name: 'Kestrel', says: 5, booked: 2 },
  /* judgements: each takes a word worked out from its observations; counts take none */
  claims: {
    cause:    { text: 'Kestrel cancelled its October visit and has not rebooked it', obs: [['contract', 'for'], ['report', 'for']] },
    forecast: { text: 'the vans falling due will be overdue unless a visit is booked', obs: [['insp', 'for'], ['email', 'against']] },

  budget: 60,

  questions: [
    { id: 'what',  q: 'What happened?',  asks: 'how many, out of how many', form: 'count', budget: 9,  never: 'scaled', lines: [

    { id: 'big',   q: 'How big?',        asks: 'which is worst, and by how much', form: 'bars', budget: 6, never: 'cutbars', lines: [
      { tpl: 'The worst, {worstId}, is {worstDays} days late; {fortnightW} are over a fortnight late {pic}.' },

  ],
  decider: 'p2',
  keepWhy: { disagree: 'a disagreement is never cut', norecord: 'no record is never cut', unseen: 'what readers can’t see is never cut', gap: 'a gap is never cut' },
  bottomBudget: 8,
  /* the six pictures, each answering one plain question, plus no picture and the records */
  forms: {
    count:   { name: 'Count with symbols', plain: 'one van symbol per van, the overdue ones lit; symbols repeat, they never grow', tech: 'isotype unit chart · 1 symbol = 1 Vehicle' },
    bars:    { name: 'Bars, longest first', plain: 'one bar per overdue van, from zero, longest first', tech: 'horizontal bar · sorted desc · x from 0' },
    line:    { name: 'A line over time', plain: 'month-end counts, from zero; a month with no record is a break, not a dip', tech: 'line · y from 0 · null → gap' },

    small:   { name: 'Small multiples on one scale', plain: 'one small picture per place, all on the same scale', tech: 'facets · shared y' },
    before:  { name: 'Before and after', plain: 'two values either side of a known event; cause stays at “possible”', tech: 'slope · event from Artifacts/Mandate' },
    none:    { name: 'No picture', plain: 'the words are the answer; a picture would add nothing', tech: 'text only' },
    records: { name: 'The records', plain: 'the rows themselves, because the lead will act on them by name', tech: 'table · Vehicle where due ≤ +7d' }
  },
  never: {

    gauge:      { name: 'A gauge or dial', why: 'it pretends to a precision the words don’t have' },

    cutbars:    { name: 'Bars that don’t start at zero', why: 'a cut axis turns a small difference into a big one' },

    { t: 'Book Kestrel’s missed October visit this week', ref: 'next', line: 0 },

  groups: [
    { id: 'vans',   label: 'North depot vans',           icon: 'truck',           kept: { department: 11, team: 7 },  keeper: 'p3' },

  reasons: {

/* ---- shared helpers for the b-screens ---- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const I = (n, size = 16, stroke = 1.5) => Icons.svg(n, { size, stroke });
const P = id => DATA.people[id];
const F = id => DATA.floors[id];
const fmt = n => n.toLocaleString('en-GB');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const RANK = Object.fromEntries(DATA.floorOrder.map((f, i) => [f, i]));
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const D = s => new Date(s + 'T00:00:00Z');
const dayStr = d => `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;
const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const NUMW = ['none', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const word = n => NUMW[n] ?? fmt(n);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---- the answer, worked out from the vans on a given day (one query feeds every height) ---- */
function answer(day = DATA.today) {

  const s2 = `<span class="no">2</span>Feed it to ${slot('intent', t.ref + ' · ' + t.title)}. <span class="val">${P(t.owner).name}</span> owns it and <span class="val n">${t.followers}</span> <span class="val">people</span> follow it; they see it as evidence, and ${P(t.owner).name.split(' ')[0]} can open <span class="val n ${on < T / 2 ? 'warn' : ''}">${on} of ${T}</span>.
    <span class="tk">mandate.intent.evidence.add(${t.ref}) · owner floor ${t.floor}</span>`;
  const can = DATA.triggers.filter(x => x.has).length;
  const p = preset();
  const s3 = `<span class="no">3</span>Watch it ${slot('when', p.plain + (p.n !== undefined ? ' ' + p.n : ''))}. Only <span class="val">you</span> are told. AUGUR can notice <span class="val n">${can} of ${DATA.triggers.length}</span> things that would move it; the other ${word(DATA.triggers.length - can)} are marked on the right.
    <span class="tk">watch = saved recipe + your access, re-run on each event; never the number</span>`;
  const pv = k => S.preview && S.preview.k === k ? 'pv' : '';
  return [['lib', s1], ['intent', s2], ['when', s3]].map(([k, s]) => `<div class="sw"><p class="sent ${pv(k)}">${s}</p>${S.open === k ? popHTML(k) : ''}</div>`).join('');
}
function popHTML(k) {
  const T = allTotal();
  return `<div class="pop" role="listbox" id="pop"><p class="ph">${k === 'lib' ? 'Which library · who can read it · the least any reader opens' : k === 'intent' ? 'Which intent · who sees it · what its owner opens' : 'When to tell you'}</p>
    ${optList(k).map((o, i) => `<button class="opt ${i === S.hot ? 'hot' : ''}" role="option" aria-selected="${i === S.hot}" data-opt="${o.id}" data-tier="${o.tier}"><b>${o.w}</b><span class="r">${o.r}</span>
      <span class="s">${o.o !== null ? `<span class="meterx"><i style="width:${(o.o / T * 100).toFixed(0)}%"></i></span>opens ${o.o} of ${T} · ` : ''}${o.s}</span></button>`).join('')}</div>`;
}

/* ---- proofs: each reader's own copy, side by side ---- */
function partStatus(qid, pid) {
  const gs = DATA.basis[qid].map(Gp), o = gs.map(g => openN(g, pid) / total(g));
  const who = [...new Set(gs.filter(g => openN(g, pid) < total(g)).map(g => P(g.keeper).name))];
  return { st: o.every(x => x === 1) ? 'all' : o.some(x => x > 0) ? 'part' : 'none', who };
}
function proofs() {
  const L = lib(), t = intent();
  const readers = floorsFrom(L.floor).reverse().map(f => ({ pid: DATA.proofReaders[f], where: `in ${L.name}`, f }));
  readers.push({ pid: t.owner, where: `in Mandate, ${t.ref}, evidence`, f: P(t.owner).floor, owner: true });
  const T = allTotal(); const keep = A; A = PUB; const PL = PLANS(); A = keep;
  return readers.map((r, i) => {
    const p = P(r.pid), n = allOpen(r.pid);
    const bl = pencilOn() ? `<p class="pbl">${mkGap()} <span>Bottom line won’t go out until ${P(DATA.me).name.split(' ')[0]} inks it.</span></p>` : `<p class="pbl ink">${blPlain()}</p>`;
    return `<article class="proof" style="--i:${i}" aria-label="${p.name}'s copy"><header><b>${p.name}</b><span class="fchip" data-tier="${p.floor === 'team' && p.team !== DATA.myTeam ? 'department' : p.floor}">${p.team ? DATA.teams[p.team] : F(p.floor).name}</span>
      <span class="where">${r.where}</span><span class="opn">you see: opens ${n} of ${T}</span></header>
      <p class="hl">${textOf(PL.what.lines[0].html)}</p>${bl}
      <ul>${DATA.questions.map(q => { const s = partStatus(q.id, r.pid);
        return `<li class="${s.st}"><span class="lbl">${q.q}</span>${s.st === 'all' ? `<span class="k ok" title="they can open the records">${I('link', 11)}</span>` : s.st === 'part' ? `<span class="k">some locked</span>` : unseen('locked')}</li>`; }).join('')}</ul>
      ${asks(r.pid).length ? `<p class="askline">${I('lock', 11)} Their copy says: for what’s locked, ask ${orList(asks(r.pid))}.</p>` : ''}
      ${S.sent ? `<span class="sentmark">${I('check', 11)} sent ${dayStr(D(DATA.today))}</span>` : ''}</article>`;
  }).join('');
}

/* ---- the briefing, with its pencil line and, a week on, its seam ---- */
const DRAFT = () => DATA.draft.filter(p => p.ref !== null);
const blPlain = () => STATE.gateway ? DRAFT().map(p => fill(p.t, slotsPub())).join('') : fill(DATA.templateBottom, slotsPub());
let slotsPub = () => { const keep = A; A = PUB; const o = SLOTS(); A = keep; return o; };
function briefHTML() {
  const keep = A; A = PUB; const PL = PLANS();
  const now = answer(LATER);
  const bl = pencilOn()
    ? `<div class="bl3 pencil"><p class="pl">${I('pencil', 12)} Bottom line · pencil, drafted by the model</p><p class="txt">${blPlain()}</p><p class="who">every phrase points at a fact <button class="pbtn" data-act="ink">${I('pen-line', 12)} Ink it <span class="kbd">I</span></button></p></div>`
    : `<div class="bl3 pencil ${STATE.gateway ? 'inked' : 'off'}"><p class="txt">${blPlain()}</p><p class="who">${I(STATE.gateway ? 'pen-line' : 'file-text', 12)} ${STATE.gateway ? `Inked by ${P(DATA.me).name} · drafted by the model` : 'Model gateway off · from the template, ink'}</p></div>`;
  const head = textOf(PL.what.lines[0].html);
  const seam = S.week ? `<div class="seam" role="note"><span class="lab">SEAM · ${dayStr(D(LATER))} · ${DATA.reasons.happened.toUpperCase()}</span>
      <span class="now">${now.overdueN}</span> of ${now.fleet} now ${picCount(now, false, PUB)}<br>This copy went out saying <b>${PUB.overdueN}</b>. Readers see both, and the seam, until you republish (P).</div>` : '';
  const html = `<p class="eyebrow">Briefing · ${DATA.subject} · for ${P(DATA.reader).name}</p>
    <p class="stamp ${S.sent ? 'sent' : ''}">${I(S.sent ? 'check' : 'file-text', 12)} ${S.sent ? `Published ${dayStr(D(DATA.today))} to ${lib().name} · fed to ${intent().ref}` : 'Ready · not sent'}</p>
    <h2>${S.week ? head.replace(String(PUB.overdueN), `<span class="was">${PUB.overdueN}</span>`) : head}</h2>${seam}${bl}
    ${PL.what.kept.slice(1).map(l => `<p class="sub">${l.html}</p>`).join('')}<ul class="parts">${DATA.questions.slice(1).map(q => { let h = PL[q.id].kept.map(l => l.html).join(' ');
      if (S.week && q.id === 'worse') h = h.replace(/<svg class="wsz"[\s\S]*?<\/svg>/, picLine(PUB, false, { m: dayStr(D(LATER)), v: now.overdueN }));
      return `<li><b>${q.q}</b>${h}</li>`; }).join('')}</ul>`;
  A = keep; return html;
}

/* ---- the watch ---- */
function watchHTML() {
  const days = Array.from({ length: 8 }, (_, i) => addDays(DATA.today, i));
  const passed = new Set(PUB.dueSoon.map(v => v.due));
  const ev = DATA.weekEvent.on;
  const cur = S.week ? 7 : 0;
  const now = answer(LATER);
  return `<p class="eyebrow">The watch · ${P(DATA.me).name.split(' ')[0]}’s · ${S.sent ? 'set' : 'not set until you send'}</p>
    <p class="recipe">It re-runs one question, <b>“${DATA.recipe.plain}”</b>, under your access, and keeps the question, never the number.<span class="tk">${DATA.recipe.tech}</span></p>
    <p class="eyebrow" style="margin-top:var(--space-1)">What would move it</p>
    <ul class="trig">${DATA.triggers.map(x => { const fired = S.week && x.reason === 'happened', missed = S.week && !x.has && !x.reason;
      return `<li class="${x.has ? '' : 'cant'} ${fired ? 'fired' : ''} ${missed ? 'missed' : ''}">${I(x.icon, 14)}<span>${x.plain}
        <span class="st">${x.has ? `AUGUR notices${x.reason ? ' · ' + DATA.reasons[x.reason].toLowerCase() : ''}` : `can’t notice yet: needs ${x.needs}`}</span><span class="tk">${x.tech}</span></span></li>`; }).join('')}</ul>
    <div class="week"><p class="eyebrow">Jump a week <span class="kbd">W</span></p>
      <div class="days">${days.map((d, i) => `<span class="${i === cur ? 'today' : ''}">${passed.has(d) ? '<i class="ev none"></i>' : ''}${d === ev ? '<i class="ev"></i>' : ''}${D(d).getUTCDate()}</span>`).join('')}<i class="cursor" style="left:calc(${(cur + .5) / 8 * 100}%)"></i></div>
      <div class="legend"><span><i class="none"></i>${dayStr(D([...passed][0]))}: ${word(PUB.dueSoonN)} due dates pass. No event, so nobody is told.</span><span><i></i>${dayStr(D(ev))}: an inspection is recorded. An event.</span></div></div>
    ${S.week ? `<section class="notice" aria-label="Notice"><h3>${DATA.subject}: ${now.overdueN} of ${now.fleet} overdue, was ${PUB.overdueN}</h3>
      <div class="reasons">${Object.entries(DATA.reasons).map(([k, w]) => `<span class="${k === 'happened' ? 'on' : ''}">${w}</span>`).join('')}</div>
      <p><b style="font-weight:400;color:var(--light)">${DATA.reasons.happened}.</b> ${P(DATA.weekEvent.by).name} recorded ${DATA.weekEvent.van}’s inspection on ${dayStr(D(ev))} (one fewer). The re-run also counted ${orList(PUB.dueSoon.map(v => v.id)).replace(' or ', ' and ')}, whose dates passed on ${dayStr(D([...passed][0]))} (${word(PUB.dueSoonN)} more): AUGUR couldn’t notice that on the day, so you hear it ${word(daysBetween([...passed][0], ev))} days late.</p>
      <p class="tk">notice.reason=happened · trigger=atlas.observation.recorded · rerun diff: −${DATA.weekEvent.van} +${PUB.dueSoon.map(v => v.id).join(' +')}</p></section>` : ''}`;
}

/* ---- render ---- */
function render() {
  A = answer(S.week ? LATER : DATA.today);
  const blocked = pencilOn();
  const go = S.sent
    ? `<p class="done">${I('check', 12)} Done ${dayStr(D(DATA.today))} by ${P(DATA.me).name}. This paragraph stays with the briefing as the record of what was done.</p><span></span>`
    : blocked
      ? `<p class="block">${mkGap()}The bottom line is still in pencil, so nothing goes out. Ink it (<b>I</b>), or turn the model off (<b>G</b>) to send the template line.</p><button class="btn" aria-disabled="true">${I('send', 14)} Send <span class="kbd">↵</span></button>`
      : `<p><b>3 things</b> will happen, in this order. Each reader gets the copy shown below.</p><button class="btn go" data-act="send">${I('send', 14)} Send <span class="kbd">↵</span></button>`;
  $('#app').innerHTML = topHTML(['Artifacts', DATA.libraries[0].name, DATA.subject],
    [['1 2 3', 'choose'], ['I', 'ink'], ['↵', 'send'], ['W', 'a week on'], ['T', 'admin words', 'h-t'], ['G', 'model off', 'h-g'], ['R', 'replay']]) +
  `<main class="main">
    <section class="col brief" aria-label="The briefing">${briefHTML()}</section>
    <section class="col" aria-label="What to do with it" style="position:relative">
      <p class="eyebrow">What to do with it · choose the underlined words</p>
      <div class="para" id="para">${sentences()}</div>
      <div class="go">${go}</div>
      <p class="eyebrow">Proofs · each reader’s own copy, before it goes</p>
      <div class="proofs">${S.shown ? proofs() : ''}</div>
    </section>
    <aside class="col watch" aria-label="The watch">${watchHTML()}</aside>
  </main>`;
  document.body.classList.toggle('tech', STATE.tech);
  $('#h-t')?.classList.toggle('on', STATE.tech);
  $('#h-g')?.classList.toggle('on', !STATE.gateway);
}

/* ---- the moment ---- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2600); }
function openSlot(k) { S.open = k; const ids = optList(k).map(o => o.id); S.hot = ids.indexOf(S.lines[k]); S.preview = { k, id: S.lines[k] }; render(); }
function hot(i) { const o = optList(S.open); S.hot = (i + o.length) % o.length; S.preview = { k: S.open, id: o[S.hot].id }; render(); }
function choose() { if (!S.open) return; S.lines[S.open] = optList(S.open)[S.hot].id; S.open = null; S.preview = null; render(); }
function play() {
  clearLater();
  Object.assign(S, { lines: { lib: 'L2', intent: 'I1', when: 'any' }, open: null, preview: null, inked: false, sent: false, week: false, shown: false });
  STATE.gateway = true;
  render();
  later(() => openSlot('lib'), 1200);
  later(() => hot(0), 1550);
  later(() => hot(2), 1900);
  later(() => hot(1), 2250);
  later(() => { choose(); S.shown = true; render(); }, 2650);
}
function send() {
  if (S.sent) return;
  if (pencilOn()) { toast('The bottom line is still in pencil. Ink it first (I).'); return; }
  S.sent = true; render();
}
function weekOn() {
  if (!S.sent) { toast('Nothing is watched yet: send first.'); return; }
  if (S.week) return;
  S.week = true; render();
  $('.notice')?.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
  $('.seam')?.scrollIntoView({ block: 'nearest' });
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (S.open) {
    if (k === 'arrowdown') { e.preventDefault(); hot(S.hot + 1); return; }
    if (k === 'arrowup') { e.preventDefault(); hot(S.hot - 1); return; }
    if (k === 'enter') { e.preventDefault(); choose(); return; }
    if (k === 'escape') { S.open = null; S.preview = null; render(); return; }
  }
  if (k === 'r') { play(); return; }
  if (k === '1') return openSlot('lib');
  if (k === '2') return openSlot('intent');
  if (k === '3') return openSlot('when');
  if (k === 'i') { if (STATE.gateway && !S.inked) { S.inked = true; S.shown = true; render(); } return; }
  if (k === 'enter') { e.preventDefault(); send(); return; }
  if (k === 'w') { weekOn(); return; }
  if (k === 'p' && S.week) { toast('Republished: the copy now says the new number, and keeps a note of the old one.'); return; }
  if (k === 't') { STATE.tech = !STATE.tech; render(); return; }
  if (k === 'g') { STATE.gateway = !STATE.gateway; render(); toast(STATE.gateway ? 'Model gateway on: the pencil line is back.' : 'Model gateway off: the template line goes out. No number changed.'); return; }
});
document.addEventListener('click', e => {
  const s = e.target.closest('.slot'); if (s) { S.open === s.dataset.k ? (S.open = null, S.preview = null, render()) : openSlot(s.dataset.k); return; }
  const o = e.target.closest('[data-opt]'); if (o) { S.hot = optList(S.open).findIndex(x => x.id === o.dataset.opt); choose(); return; }
  const a = e.target.closest('[data-act]');
  if (a?.dataset.act === 'ink') { S.inked = true; render(); }
  if (a?.dataset.act === 'send') send();
});
play();
</script>
</body>
</html>
