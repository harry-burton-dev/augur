<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Confidence · V1 · The yardstick beside the page</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">

<style>
/* ---------------------------------------------------------------
   Proposed tokens (all mixes of kit tokens; "needs token" in notes.md)
   --------------------------------------------------------------- */
:root{
  /* six ways to be empty (catalogue shortlist), carried as they were */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-proposed-gap-tick: var(--space-2);
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* sources disagree: a warning-tinted edge, never red (catalogue) */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  --x-proposed-quiet: .62;
  --x-proposed-here: var(--floor-department-high);
  --x-proposed-type-micro: .6875rem;
  /* pencil (reference desk): what a model wrote, until a person accepts it. Cooler ink, dotted edge. */
  --x-proposed-pencil: color-mix(in srgb, var(--info) 30%, var(--ink-muted));
  --x-proposed-pencil-edge: color-mix(in srgb, var(--info) 45%, transparent);
  /* NEW, the yardstick: ink by rung. Brightness only steps down; it never turns to a traffic light. */
  --x-proposed-rung-0: var(--light);
  --x-proposed-rung-1: var(--ink);
  --x-proposed-rung-2: color-mix(in srgb, var(--ink) 80%, var(--ink-muted));
  --x-proposed-rung-3: var(--ink-muted);
  --x-proposed-rung-4: color-mix(in srgb, var(--ink-muted) 80%, transparent);
  /* NEW, the yardstick cell: one position on the word-size scale */
  --x-proposed-stick-cell: var(--space-2);
  /* the lit thing you are looking at (light language) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
}
:root, .mk-gap{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
h1{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-caps);text-transform:uppercase;margin:var(--space-1) 0;color:var(--light)}
h2{font-weight:300;font-size:var(--type-meta);line-height:var(--leading-meta);letter-spacing:var(--tracking-caps);text-transform:uppercase;margin:0;color:var(--ink)}
.lede{margin:0;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.muted{color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints > span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* two registers */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.tech .tk{display:block}
body:not(.tech) .tk{display:none!important}
.tech span.tk{display:inline}

/* top bar */
.top{display:flex;align-items:center;gap:var(--space-3);height:var(--band-top);padding:0 var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--surface-bar) 70%,transparent)}
.top .crumb{flex:1 1 0;text-overflow:ellipsis;display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-meta);color:var(--ink-muted);min-width:0;white-space:nowrap;overflow:hidden}
.top .crumb b{font-weight:400;color:var(--light)}
.top .crumb svg{opacity:var(--x-proposed-quiet);flex:none}
.top .floor{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink);padding:var(--space-1) var(--space-3);border:1px solid color-mix(in srgb,var(--x-proposed-here) 45%,transparent);border-radius:var(--radius-pill)}
.top .floor i,.top .floor .fd{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--x-proposed-here)}
.top .sp{flex:0 0 var(--space-3)}
.top .hints{justify-content:flex-end;flex-wrap:nowrap;flex:none}
.tgl[aria-pressed="true"]{color:var(--light);border-color:var(--ink-muted);background:var(--surface-raised)}
.tgl{display:inline-flex;gap:var(--space-1);align-items:center;padding:var(--space-1) var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink-muted);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono)}

/* ===== the confidence word: plain word first, glyph after ===== */
.cw{display:inline-flex;align-items:center;gap:var(--space-2);font:400 var(--type-small)/var(--leading-small) var(--font-sans);letter-spacing:var(--tracking-soft);text-transform:uppercase;white-space:nowrap;vertical-align:baseline}
.cw svg{flex:none}
.cw.r0{color:var(--x-proposed-rung-0)} .cw.r1{color:var(--x-proposed-rung-1)} .cw.r2{color:var(--x-proposed-rung-2)} .cw.r3{color:var(--x-proposed-rung-3)} .cw.r4{color:var(--x-proposed-rung-4)}
.cw.k-dispute{color:var(--x-proposed-disagree)}
.cw.k-gap{color:var(--ink-muted)}
.cw.k-stale{color:var(--ink-muted)}
.cw.k-stale .cw-w{background:var(--x-proposed-stale);padding:0 var(--space-1);border-radius:2px}
.cw.k-hidden{color:var(--ink-muted)}
/* the word-size yardstick (Tufte: a picture at word size) */
.stick{display:inline-flex;gap:2px;align-items:center}
.st-c{width:var(--x-proposed-stick-cell);height:var(--space-2);border-radius:1px;background:var(--hairline)}
.st-c.on{background:currentColor}
.st-c.was{background:var(--x-proposed-stale);outline:1px solid var(--hairline-strong)}
.st-c.two{background:transparent;outline:1px solid var(--x-proposed-disagree);outline-offset:-1px}
.stick.k-gap,.stick.k-hidden{gap:0}

/* six ways to be empty, the ones this surface uses */
.mk-gap{display:inline-block;background:var(--x-proposed-gap);width:calc(var(--space-6) + var(--space-4));height:calc(var(--space-4) + var(--space-1));vertical-align:middle}
.mk-gap.s{width:calc(var(--space-5) + var(--space-2));height:var(--space-3);--x-proposed-gap-tick:var(--space-1)}
.mk-unseen{display:inline-flex;align-items:center;justify-content:center;width:calc(var(--space-5) + var(--space-2));height:var(--space-3);background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:2px;color:var(--ink-muted)}
.slot{display:inline-block;background:var(--x-proposed-gap);padding:0 var(--space-2);color:var(--ink-muted);font-style:normal;line-height:1.35;--x-proposed-gap-tick:var(--space-1)}
.unseen-v{display:inline-block;background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);line-height:1.35}
.stale-v{background:var(--x-proposed-stale);padding:0 var(--space-1);border-radius:2px}

/* pencil: what a model wrote (dotted edge, italic, own lane) */
.pencil{margin:0;padding:var(--space-2) var(--space-3) var(--space-2) var(--space-4);border-left:2px dotted var(--x-proposed-pencil-edge);font-style:italic;color:var(--x-proposed-pencil);font-size:var(--type-lead);line-height:var(--leading-lead);font-weight:300}
.pen-lane{display:flex;gap:var(--space-1);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;font-style:normal;color:var(--x-proposed-pencil);margin-bottom:var(--space-1)}
.pen-floor{margin:var(--space-1) 0 0 var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.pen-floor svg{vertical-align:-2px;margin-right:var(--space-1)}
.pen-floor b{font-weight:400;color:var(--ink)}
.inkline{margin:0;padding:var(--space-2) var(--space-3) var(--space-2) var(--space-4);border-left:2px solid var(--hairline-strong);color:var(--ink);font-size:var(--type-lead);line-height:var(--leading-lead);font-weight:300}
sup{line-height:0}
.cite{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);font-style:normal;color:var(--ink);border:1px solid var(--hairline-strong);border-radius:2px;padding:1px 3px;margin-left:2px;vertical-align:super}
.cite:hover{color:var(--light);border-color:var(--ink-muted)}

/* records list */
.srcs{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.src{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.src b{display:block;font-weight:400;color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta)}
.src-m,.src-g{display:block}
.src-g{color:var(--ink)}
.src-i{display:inline-flex;align-items:center;justify-content:center;width:var(--space-5);height:var(--space-5);border-radius:var(--radius-pill);color:var(--ink)}
.s-strong .src-i{background:var(--surface-raised);border:1px solid var(--ink-muted);color:var(--light)}
.s-fair .src-i{border:1px solid var(--hairline-strong)}
.s-weak .src-i{border:1px dashed var(--hairline-strong);color:var(--ink-muted)}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}

.app{height:100vh;display:flex;flex-direction:column}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--measure-glance) - var(--space-6));gap:var(--space-5);padding:var(--space-4) var(--edge) var(--space-6)}
.page{min-height:0;padding-right:var(--space-3)}
.qline{margin:0 0 var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.qline b{font-weight:400;color:var(--ink)}
.sec{margin-top:var(--space-4)}
.sec h2{display:flex;gap:var(--space-2);align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:var(--space-1);margin-bottom:var(--space-1)}
.sec h2 small{font:400 var(--type-small)/1 var(--font-sans);letter-spacing:0;text-transform:none;color:var(--ink-muted)}
.row{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-7) + var(--space-3)) minmax(0,1fr) var(--space-5);gap:var(--space-3);align-items:baseline;width:100%;padding:var(--space-2) var(--space-2);border-radius:var(--radius-key);transition:background var(--motion-base) var(--ease-out),box-shadow var(--motion-base) var(--ease-out)}
.row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.row.sel{background:var(--x-proposed-lit-wash);box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.row .say{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink)}
.row .say b{font-weight:400;color:var(--light)}
.row .n{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);text-align:right}
.row .sub{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:2px}
.row.k-dispute .say b.alt{border-bottom:2px solid var(--x-proposed-disagree)}
.or{color:var(--ink-muted);font-style:italic;padding:0 var(--space-1)}
.row .wcell{display:flex;flex-direction:column;gap:2px}
/* ruler */
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.panel{background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4)}
.ruler{position:relative;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--space-7) + var(--space-5)) var(--space-6);gap:0 var(--space-2)}
.rung{display:contents}
.rung .lab{padding:var(--space-1) 0;border-top:1px solid var(--hairline)}
.rung .lab b{display:block;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);letter-spacing:var(--tracking-soft);text-transform:uppercase}
.rung .lab span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rung .band{margin:var(--space-1) 0;border-radius:var(--radius-key);background:color-mix(in srgb,var(--ink) 5%,transparent);display:flex;flex-wrap:wrap;gap:var(--space-1);align-content:center;padding:var(--space-1)}
.rung:nth-child(1) .lab b{color:var(--x-proposed-rung-0)} .rung:nth-child(2) .lab b{color:var(--x-proposed-rung-1)} .rung:nth-child(3) .lab b{color:var(--x-proposed-rung-2)} .rung:nth-child(4) .lab b{color:var(--x-proposed-rung-3)} .rung:nth-child(5) .lab b{color:var(--x-proposed-rung-4)}
.rung .lane{position:relative}
.dot{display:inline-flex;align-items:center;justify-content:center;width:var(--space-5);height:var(--space-5);border-radius:var(--radius-pill);font:400 var(--type-small)/1 var(--font-mono);background:var(--surface-raised);border:1px solid var(--ink-muted);color:var(--light);transition:transform var(--motion-calm) var(--ease-spring),opacity var(--motion-base) var(--ease-out),box-shadow var(--motion-base)}
.pre .dot,.dot.wait{opacity:0;transform:translateY(calc(var(--space-5) * -1))}
@media (prefers-reduced-motion: reduce){.pre .dot,.dot.wait{transform:none}}
.dot.sel{box-shadow:0 0 0 var(--focus-ring) var(--x-proposed-lit),0 0 var(--glow-blur) color-mix(in srgb,var(--green) 40%,transparent)}
.dot.was{background:var(--x-proposed-stale);border:1px dashed var(--ink-muted);color:var(--ink-muted)}
.dot.two{background:transparent;border-color:var(--x-proposed-disagree);color:var(--x-proposed-disagree)}
.brk{position:absolute;left:var(--space-2);width:var(--space-3);border:2px solid var(--x-proposed-disagree);border-left:0;border-radius:0 var(--radius-key) var(--radius-key) 0}
.brk-l{position:absolute;left:calc(var(--space-5) + var(--space-1));font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--x-proposed-disagree);white-space:normal;width:var(--space-7)}
.lanehead{font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft);text-transform:uppercase;padding-bottom:var(--space-1)}
.off{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-3)}
.offc{border-radius:var(--radius-key);padding:var(--space-2);display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.offc b{display:block;font-weight:400;color:var(--ink);letter-spacing:var(--tracking-soft);text-transform:uppercase}
.offc.gap{background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-2)}
.offc.hid{background:var(--x-proposed-unseen);border:1px solid var(--hairline)}
.offc .dot{flex:none}
.offc.gap .dot{background:transparent;border:1px dashed var(--ink-muted);color:var(--ink-muted)}
.offc.hid .dot{background:var(--surface-inset);border:1px solid var(--hairline-strong);color:var(--ink-muted)}
/* how we know */
.how{flex:1;min-height:0}
.how .hw{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-2)}

.how .nx b{font-weight:400;color:var(--ink)}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.fork > div{border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);padding:var(--space-1) var(--space-2);border-radius:0 2px 2px 0}
.fork > div > b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);margin-bottom:var(--space-1)}

<body>
<div class="app pre" id="app">
  <header class="top">
    <span class="crumb" id="crumb"></span>
    <span class="floor" id="floor"></span>
    <span class="sp"></span>
    <div class="hints" id="hints"></div>
  </header>
  <div class="body">
    <article class="page scroll" id="page"></article>
    <aside class="side">
      <section class="panel dep" style="--i:2" aria-label="The yardstick">
        <p class="eyebrow" style="margin-bottom:var(--space-2)">The yardstick · same words for every briefing</p>
        <div class="ruler" id="ruler"></div>
        <div class="off" id="off"></div>
      </section>
      <section class="panel how scroll dep fade" style="--i:4" id="how" aria-live="polite"></section>
    </aside>
  </div>
</div>
<div class="x-cap"><b>Confidence · V1</b> the yardstick beside the page: every claim leads with its word and lands on one fixed ruler · UK PHIA yardstick, Sherman Kent</div>
<script>
/* ======================================================================
   Sample data for one deployment (Vale Regional Services). Every name,
   word, count, grade and sentence on the page comes from here. In AUGUR
   it would come from Data Atlas (entities, details, observations with
   NATO-style grades, facts, floors), Artifacts (the briefing and its
   source documents) and Mandate (the intent the briefing feeds).
   The confidence WORD is never stored: derive() works it out from the
   grades and agreement with one fixed rule, the same for every reader.
   ====================================================================== */
const DATA = {
  org: 'Vale Regional Services',
  app: 'Artifacts',
  library: 'Facilities briefings',
  today: '3 Nov 2026',
  viewer: { name: 'Sam Okafor', role: 'Operator', floor: 'Facilities', tier: 'department', word: 'Department floor' },
  reader: { name: 'Jo Reyes', role: 'Head of Facilities' },
  briefing: {
    title: 'North waste round: renew Calder Waste?',
    status: 'Draft',
    question: 'Should we renew the North round contract with Calder Waste when it ends?',
    intent: { id: 'INT-208', title: 'Decide on the North waste contract', owner: 'Jo Reyes', due: '15 Dec 2026', kind: 'Renew or end a contract',
      /* the standard of proof this kind of decision asks for (set per decision kind in Mandate) */
      standard: 1 }
  },

  /* The yardstick: five rungs, a fixed rule each. Plain word on top, the rule beside it,
     the technical rule one step down (T). Words are fixed org-wide so every reader learns them once. */
  yardstick: [
    { id: 'ac', word: 'Almost certain', say: 'almost certain', rule: 'Two or more sources agree, one of them a source we usually trust. None disagree.', tech: '≥2 independent · best strong · 0 against', phia: '95–100%' },
    { id: 'vl', word: 'Very likely',    say: 'very likely',    rule: 'One source we usually trust, or two fair ones that agree. None disagree.', tech: '1 strong, or ≥2 with best fair · 0 against', phia: '80–90%' },
    { id: 'l',  word: 'Likely',         say: 'likely',         rule: 'One fair source, or two weak ones that agree.', tech: '1 fair, or ≥2 weak · 0 against', phia: '55–75%' },
    { id: 'p',  word: 'Possible',       say: 'possible',       rule: 'One weak or ungraded source, and nothing yet to check it against.', tech: '1 weak or ungraded · 0 for, 0 against', phia: '40–50%' },

/* ======================== the one rule ======================== */
const W = { strong: 3, fair: 2, weak: 1 };
function strength(g) {
  if (!g) return 'weak';
  const r = g[0], c = +g[1];
  if ('AB'.includes(r) && c <= 2) return 'strong';
  if ('ABC'.includes(r) && c <= 3) return 'fair';
  return 'weak';
}
function sideInfo(side) {
  const st = side.sources.map(s => strength(DATA.sources[s].grade));
  const best = st.includes('strong') ? 'strong' : st.includes('fair') ? 'fair' : 'weak';
  const n = st.length, w = st.reduce((a, s) => a + W[s], 0);
  let rung;
  if (n >= 2 && best === 'strong') rung = 0;
  else if ((n === 1 && best === 'strong') || (n >= 2 && best === 'fair')) rung = 1;
  else if ((n === 1 && best === 'fair') || (n >= 2 && best === 'weak')) rung = 2;
  else rung = 3;
  return { n, best, w, rung };
}
/* weigh any set of sides with the one rule (used for claims, and for a claim's history) */
function weigh(sides, stale) {
  let r;
  if (!sides || !sides.length) return { kind: 'gap', word: DATA.outside.gap.word };
  if (sides.length === 1) {
    const s = sideInfo(sides[0]);
    r = stale ? { kind: 'stale', was: s.rung, word: DATA.outside.stale.word, sides: [s] }
              : { kind: 'fact', rung: s.rung, word: DATA.yardstick[s.rung].word, sides: [s] };
  } else {
    const a = sideInfo(sides[0]), b = sideInfo(sides[1]);
    const ratio = Math.max(a.w, b.w) / Math.min(a.w, b.w);
    if (ratio < 2) r = { kind: 'dispute', word: DATA.outside.dispute.word, sides: [a, b], ratio };
    else if (a.w > b.w) r = { kind: 'fact', rung: Math.min(a.rung + 1, 3), sides: [a, b], ratio, lean: 0 };
    else r = { kind: 'fact', rung: 4, sides: [a, b], ratio, lean: 1 };
    if (r.kind === 'fact') r.word = DATA.yardstick[r.rung].word;
  }
  return r;
}
const CACHE = {};
function derive(c) {
  if (typeof c === 'string') c = DATA.claims.find(x => x.id === c);

  else if (c.hidden) r = { kind: 'hidden', word: DATA.outside.hidden.word };

}
/* why this word, as a template sentence (ink, never a model) */
function why(c) {

  if (d.kind === 'gap') return `Nobody has said yet. ${c.who} could fill it: ${c.how}.`;
  if (d.kind === 'hidden') return `It is kept on the ${c.floor} floor, which you can’t open. Ask ${c.ask}.`;
  if (d.kind === 'stale') return `On ${c.stale.asOf} it was ${Y[d.was].say}. It should be checked every ${c.stale.review}, and nothing newer has come in.`;
  if (d.kind === 'dispute') return `${cap(nm(d.sides[0].n))} ${d.sides[0].n===1?'says':'say'} ${c.sides[0].value}; ${nm(d.sides[1].n)} ${d.sides[1].n===1?'says':'say'} ${c.sides[1].value}. They weigh about the same, so nobody can pick yet.`;
  const s = d.sides[0];
  if (d.lean === 1) return `${cap(nm(s.n))} says so (${DATA.grades.strength[s.best]}). ${cap(nm(d.sides[1].n))} with twice the weight say ${c.sides[1].value}.`;
  if (d.lean === 0) return `${cap(nm(s.n))} agree, but ${nm(d.sides[1].n)} disagree${d.sides[1].n === 1 ? 's' : ''}, so it drops one word.`;
  const best = DATA.grades.strength[s.best];

}

  if (d.kind === 'stale') return { say: `A current certificate would bring it back`, who: c.stale.who, act: 'Ask' };
  if (d.kind === 'dispute') return { say: `${c.decides} decides which is right, or a third source settles it`, who: c.decides, act: 'Ask to decide' };

  if (d.rung === 0) return { say: `Nothing more is needed`, who: null, act: null };
  const s = d.sides[0];
  if (d.rung === 3) return { say: `A second source, or a graded one, would make it likely`, who: null, act: 'Find a source' };

  const Y = DATA.yardstick, ds = ORDER.map(derive);
  $('ruler').innerHTML = Y.map((y, r) => `<div class="rung"><div class="lab"><b>${y.word}</b><span>${y.rule}</span><span class="tk">${y.tech} · PHIA ${y.phia}</span></div>
    <div class="band" data-r="${r}">${ds.filter(d => d.kind === 'fact' && d.rung === r).map(d => `<span class="dot wait" data-c="${d.id}">${num(d.id)}</span>`).join('')}${ds.filter(d => d.kind === 'stale' && d.was === r).map(d => `<span class="dot was wait" data-c="${d.id}" title="was ${y.say}">${num(d.id)}</span>`).join('')}</div>
    <div class="lane" data-r="${r}">${r === 0 ? '<div class="lanehead">disagree</div>' : ''}</div></div>`).join('');
  // dispute: a bracket in its own lane, joining the rungs each side would reach alone
  ds.filter(d => d.kind === 'dispute').forEach(d => {
    requestAnimationFrame(() => {
      const lanes = [...$('ruler').querySelectorAll('.lane')];
      const a = lanes[d.sides[0].rung], b = lanes[d.sides[1].rung], R = $('ruler').getBoundingClientRect();
      const top = a.getBoundingClientRect().top - R.top + a.offsetHeight / 2, bot = b.getBoundingClientRect().top - R.top + b.offsetHeight / 2;
      const lane = lanes[0];
      const x = `<div class="brk" style="top:${top - (lane.getBoundingClientRect().top - R.top)}px;height:${bot - top}px"></div>`;
      lane.insertAdjacentHTML('beforeend', `${x}<span class="dot two wait" data-c="${d.id}" style="position:absolute;left:0;top:${(top + bot) / 2 - (lane.getBoundingClientRect().top - R.top) - 14}px">${num(d.id)}</span>`);
    });
  });
  const gap = ds.filter(d => d.kind === 'gap'), hid = ds.filter(d => d.kind === 'hidden');
  $('off').innerHTML = `<div class="offc gap">${gap.map(d => `<span class="dot wait" data-c="${d.id}">${num(d.id)}</span>`).join('')}<span><b>${DATA.outside.gap.word}</b>Nothing to weigh, so no word. Never read as “unlikely”.</span></div>
    <div class="offc hid">${hid.map(d => `<span class="dot wait" data-c="${d.id}">${Icons.svg('lock',{size:12})}</span>`).join('')}<span><b>${DATA.outside.hidden.word}</b>It exists; you can’t weigh it from here.</span></div>`;
}
function bind(){
  document.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => select(b.dataset.c)));
}
function select(id, quiet){
  sel = id;
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('sel', r.dataset.c === id));
  document.querySelectorAll('.dot').forEach(r => r.classList.toggle('sel', r.dataset.c === id));
  const c = claim(id), d = derive(c), nx = next(c), how = $('how');
  const fill = () => {
    let body = '';
    if (d.kind === 'dispute') body = `<div class="fork">${c.sides.map(s => `<div><b>${s.value}</b><ul class="srcs">${s.sources.map(srcRow).join('')}</ul></div>`).join('')}</div>`;
    else if (c.sides) body = c.sides.map((s, i) => `${c.sides.length > 1 ? `<p class="eyebrow" style="margin:var(--space-2) 0 var(--space-1)">${i ? 'Against' : 'For'}: ${s.value}</p>` : ''}<ul class="srcs">${s.sources.map(srcRow).join('')}</ul>`).join('');
    else body = d.kind === 'gap' ? `<p><span class="mk-gap"></span> ${c.detail}: expected as ${c.shape}.</p>` : `<p><span class="unseen-v">${Icons.svg('lock',{size:12})} ${c.detail}</span></p>`;
    how.innerHTML = `<div class="hw"><span class="eyebrow">How we know · claim ${num(id)}</span>${word(d, { tech: false })}</div>
      <p>${why(c)}</p>${body}<p class="nx">${Icons.svg('arrow-up',{size:14})} <span>What would change it: <b>${nx.say}</b>.</span></p>`;
  };
  if (quiet || reduce) { fill(); return; }
  how.classList.add('out'); setTimeout(() => { fill(); how.classList.remove('out'); }, ms('--motion-base'));
}
function play(){
  clearLater();
  $('app').classList.add('pre');
  sel = 'c1'; render();
  later(() => $('app').classList.remove('pre'), ms('--motion-instant'));
  later(() => {
    document.querySelectorAll('.dot.wait').forEach((d, i) => later(() => d.classList.remove('wait'), i * ms('--motion-instant')));
  }, ms('--motion-run'));
  later(() => select('c4'), ms('--motion-run') * 2);
}
window.onGw = () => { bottomLine($('bl')); bind(); };
document.addEventListener('keydown', e => {
  if (baseKeys(e, play)) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const i = ORDER.indexOf(sel), j = Math.max(0, Math.min(ORDER.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
    select(ORDER[j]);
    const r = document.querySelector(`.row[data-c="${ORDER[j]}"]`); if (r) { r.focus({ preventScroll: true }); r.scrollIntoView({ block: 'nearest' }); }
  }
});
play();
</script>
</body>
</html>
