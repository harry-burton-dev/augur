<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Confidence · V4 · The bar this decision sets</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
.app{height:100vh;display:flex;flex-direction:column}
.body{flex:1;min-height:0;padding:var(--space-4) var(--edge) var(--space-6);display:flex;flex-direction:column;gap:var(--space-3)}
.dec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-5);align-items:end;padding-bottom:var(--space-3);border-bottom:1px solid var(--hairline)}
.dec h1{font-size:var(--type-heading);line-height:var(--leading-heading)}
.intent{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.intent b{font-weight:400;color:var(--ink)}
.intent .id{font-family:var(--font-mono);color:var(--ink)}
.verdict{margin:var(--space-2) 0 0;font-size:var(--type-lead);line-height:var(--leading-lead);font-weight:300;color:var(--ink);max-width:80ch}
.verdict b{font-weight:400;color:var(--light)}
.std{display:flex;flex-direction:column;gap:var(--space-1);align-items:flex-end}
.std .eyebrow{text-align:right}
.ladder{display:flex;gap:2px}
.ladder button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:calc(var(--space-8) - var(--space-3));padding:var(--space-1) var(--space-2);border:1px solid var(--hairline);background:var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);letter-spacing:var(--tracking-soft);text-transform:uppercase;transition:background var(--motion-base),color var(--motion-base),border-color var(--motion-base)}
.ladder button:first-child{border-radius:var(--radius-key) 0 0 var(--radius-key)}
.ladder button:last-child{border-radius:0 var(--radius-key) var(--radius-key) 0}
.ladder button .kbd{font-size:var(--x-proposed-type-micro)}
.ladder button.ok{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.ladder button.bar{color:var(--light);border-color:var(--x-proposed-lit);box-shadow:inset 0 -2px 0 var(--x-proposed-lit)}
.std .note{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:right;max-width:52ch}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--space-6) minmax(0,1fr) var(--space-5) minmax(0,1.08fr)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.col > header{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2);padding-bottom:var(--space-1)}
.col > header h2 b{font-family:var(--font-mono);font-weight:400;color:var(--light);margin-right:var(--space-2)}
.col > header span{font-size:var(--type-small);color:var(--ink-muted)}
.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-1)}
.barline{position:relative;display:flex;justify-content:center;align-items:flex-start}
.barline::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px solid var(--x-proposed-lit);transform-origin:top;transition:transform var(--motion-calm) var(--ease-out)}
.pre .barline::before,.barline.wait::before{transform:scaleY(0)}
.barline span{position:relative;writing-mode:vertical-rl;background:var(--slate-deep);padding:var(--space-3) var(--space-1);margin-top:var(--space-6);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--x-proposed-lit);white-space:nowrap;transition:opacity var(--motion-calm)}
.barline.wait span{opacity:0}
.sep{border-left:1px dashed var(--hairline-strong);margin:0 auto}
.card{display:grid;gap:var(--space-1);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);background:var(--surface-pane);border:1px solid var(--hairline);text-align:left;width:100%;will-change:transform}
.card .say{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.card .say b{font-weight:400;color:var(--light)}
.card .sm{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.card .top2{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2)}
.card .n{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.c-below .card{background:transparent;border-style:dashed}
.c-below .card .say{color:var(--ink)}
.c-need .card.k-dispute{border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash)}
.c-need .card.k-gap{background:var(--x-proposed-gap);border-color:transparent;--x-proposed-gap-tick:var(--space-2)}
.c-need .card.k-stale{background:linear-gradient(90deg,var(--surface-pane) 70%,transparent),var(--x-proposed-stale)}
.c-need .card.k-hidden{background:linear-gradient(90deg,var(--surface-inset) 70%,transparent),var(--x-proposed-unseen)}
.who{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);border-top:1px solid var(--hairline);padding-top:var(--space-1);margin-top:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.who b{font-weight:400;color:var(--ink)}
.ask{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink);white-space:nowrap}
</style>
</head>
<body>
<div class="app pre" id="app">
  <header class="top">
    <span class="crumb" id="crumb"></span>
    <span class="floor" id="floor"></span>
    <span class="sp"></span>
    <div class="hints" id="hints"></div>
  </header>
  <div class="body">
    <section class="dec dep" style="--i:0">
      <div>
        <p class="intent" id="intent"></p>
        <h1 id="title"></h1>
        <p class="verdict" id="verdict"></p>
      </div>
      <div class="std">
        <p class="eyebrow">The bar this decision asks for</p>
        <div class="ladder" id="ladder" role="radiogroup" aria-label="Standard of proof"></div>
        <p class="note" id="note"></p>
      </div>
    </section>
    <div class="cols dep" style="--i:1">
      <section class="col c-clear"><header><h2 id="h-clear"></h2><span>rely on these</span></header><div class="list scroll" id="l-clear"></div></section>
      <div class="barline wait" id="barline"><span id="barlab"></span></div>
      <section class="col c-below"><header><h2 id="h-below"></h2><span>use them, and say the word</span></header><div class="list scroll" id="l-below"></div></section>
      <div class="sep"></div>
      <section class="col c-need"><header><h2 id="h-need"></h2><span>no bar can be met: someone must act</span></header><div class="list scroll" id="l-need"></div></section>
    </div>
  </div>
</div>
<div class="x-cap"><b>Confidence · V4</b> the bar this decision sets: clear, below the bar, needs someone first · standards of proof</div>
<script>
/*@JS*/
const $ = id => document.getElementById(id);
const num = id => DATA.claims.indexOf(claim(id)) + 1;
const I = DATA.briefing.intent, Y = DATA.yardstick;
let bar = I.standard, shown = false;
/* for a decision, an outweighed claim is restated as what the better sources say */
function view(d) {
  const c = d.claim;
  if (d.kind === 'fact' && d.lean === 1) {
    const s = d.sides[1];
    return { rung: Math.min(s.rung + 1, 3), say: c.against.replace('show', 'show only'), sub: `${c.say.replace(/<\/?b>/g, '')} That is ${Y[4].say}.` };
  }
  return { rung: d.rung, say: d.kind === 'dispute' ? c.say.replace('{v}', `<b>${c.sides[0].value}</b> or <b>${c.sides[1].value}</b>`) : sayValue(c).replace('<b>£10m</b>', '<b class="stale-v">£10m</b>'), sub: '' };
}
function lane(d) {
  if (d.kind !== 'fact') return 'need';
  return view(d).rung <= bar ? 'clear' : 'below';
}
function card(d) {
  const c = d.claim, v = view(d), nx = next(c);
  const w = d.kind === 'fact' && d.lean === 1 ? word({ kind: 'fact', rung: v.rung, word: Y[v.rung].word }) : word(d);
  const whoLine = d.kind === 'fact' ? '' : `<span class="who"><span>${d.kind === 'dispute' ? 'Decides' : d.kind === 'hidden' ? 'Ask' : 'Could fill it'}: <b>${(nx.who || '').split(',')[0]}</b></span><span class="ask">${Icons.svg(d.kind === 'dispute' ? 'gavel' : 'send', { size: 12 })} ${nx.act}</span></span>`;
  return `<button class="card k-${d.kind}" data-c="${d.id}"><span class="top2">${w}<span class="n">${num(d.id)}</span></span><span class="say">${v.say}</span>${v.sub ? `<span class="sm">${v.sub}</span>` : ''}${v.sub ? '' : `<span class="sm">${why(c)}</span>`}${whoLine}</button>`;
}
function render(animate) {
  const before = {};
  if (animate) document.querySelectorAll('.card').forEach(n => before[n.dataset.c] = n.getBoundingClientRect());
  $('crumb').innerHTML = `${Icons.svg('library-big', { size: 14 })} ${DATA.app} <span>/</span> ${DATA.library} <span>/</span> <b>${DATA.briefing.title}</b>`;
  $('floor').innerHTML = `<span class="fd"></span>${DATA.viewer.floor} · ${DATA.viewer.word}`;
  $('hints').innerHTML = hints([['1 2 3 4', 'try another bar'], ['T', 'technical words'], ['G', 'assistant off'], ['R', 'replay']]);
  $('intent').innerHTML = `${Icons.svg('target', { size: 14 })} Feeds the intent <span class="id">${I.id}</span> <b>${I.title}</b> · owner <b>${I.owner}</b> · due <b>${I.due}</b>`;
  $('title').textContent = DATA.briefing.title;
  $('ladder').innerHTML = Y.slice(0, 4).map((y, r) => `<button role="radio" aria-checked="${r === bar}" class="${r === bar ? 'bar' : r < bar ? 'ok' : ''}" data-r="${r}"><span class="kbd">${r + 1}</span>${y.word}</button>`).join('');
  $('note').innerHTML = `Mandate sets <b>${Y[I.standard].say}</b> for “${I.kind}”. ${bar === I.standard ? '' : 'You are previewing another bar; the briefing still asks for ' + Y[I.standard].say + '.'}<span class="tk">intent.kind.standard = ${Y[I.standard].id}</span>`;
  const ds = ['c1', 'c2', 'c9', 'c10', 'c5', 'c3', 'c4', 'c6', 'c8', 'c7'].map(derive);
  const L = { clear: [], below: [], need: [] };
  ds.forEach(d => L[shown ? lane(d) : (d.kind === 'fact' ? 'clear' : 'need')].push(d));
  ['clear', 'below', 'need'].forEach(k => $('l-' + k).innerHTML = L[k].map(card).join(''));
  $('h-clear').innerHTML = `<b>${L.clear.length}</b>Clear the bar`;
  $('h-below').innerHTML = `<b>${L.below.length}</b>Below the bar`;
  $('h-need').innerHTML = `<b>${L.need.length}</b>Needs someone first`;
  $('barlab').textContent = `The bar · ${Y[bar].say} or surer`;
  $('barline').classList.toggle('wait', !shown);
  const ready = L.need.length === 0;
  $('verdict').innerHTML = shown ? (ready ? `<b>Ready to decide.</b> Everything rests on claims that clear the bar.` : `<b>Not ready to decide.</b> ${L.need.length} things need someone before ${I.due.replace(/ \d{4}$/, '')}; ${L.below.length} claims are below the bar, so the briefing must say how sure they are.`) : `<span class="muted">Sorting the claims against the bar…</span>`;
  $('ladder').querySelectorAll('button').forEach(b => b.addEventListener('click', () => setBar(+b.dataset.r)));
  if (animate && !reduce) {
    document.querySelectorAll('.card').forEach(n => {
      const a = before[n.dataset.c]; if (!a) return;
      const b = n.getBoundingClientRect();
      n.animate([{ transform: `translate(${a.left - b.left}px,${a.top - b.top}px)` }, { transform: 'none' }], { duration: ms('--motion-calm'), easing: getComputedStyle(document.documentElement).getPropertyValue('--ease-out').trim() });
    });
  }
}
function setBar(r) { bar = r; shown = true; render(true); }
function play() {
  clearLater(); bar = I.standard; shown = false; $('app').classList.add('pre'); render(false);
  later(() => $('app').classList.remove('pre'), ms('--motion-instant'));
  later(() => { shown = true; render(true); }, ms('--motion-run'));
}
window.onGw = on => { /* the verdict and the sorting are templates; nothing here changes without the assistant */
  const v = $('verdict'); v.querySelector('.gwn')?.remove();
  if (!on) v.insertAdjacentHTML('beforeend', ` <span class="muted gwn" style="font-size:var(--type-small)">${Icons.svg('power-off', { size: 12 })} Assistant off: nothing changed; this sentence is a template.</span>`);
};
document.addEventListener('keydown', e => {
  if (baseKeys(e, play)) return;
  if (['1', '2', '3', '4'].includes(e.key)) setBar(+e.key - 1);
});
play();
</script>
</body>
</html>
