<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Confidence · V1 · The yardstick beside the page</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
.app{height:100vh;display:flex;flex-direction:column}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--measure-glance) - var(--space-6));gap:var(--space-5);padding:var(--space-4) var(--edge) var(--space-6)}
.page{min-height:0;padding-right:var(--space-3)}
.qline{margin:0 0 var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.qline b{font-weight:400;color:var(--ink)}
.sec{margin-top:var(--space-4)}
.sec h2{display:flex;gap:var(--space-2);align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:var(--space-1);margin-bottom:var(--space-1)}
.sec h2 small{font:400 var(--type-small)/1 var(--font-sans);letter-spacing:0;text-transform:none;color:var(--ink-muted)}
.row{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-7) + var(--space-3)) minmax(0,1fr) var(--space-5);gap:var(--space-3);align-items:baseline;width:100%;padding:var(--space-2) var(--space-2);border-radius:var(--radius-key);transition:background var(--motion-base) var(--ease-out),box-shadow var(--motion-base) var(--ease-out)}
.row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.row.sel{background:var(--x-proposed-lit-wash);box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.row .say{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink)}
.row .say b{font-weight:400;color:var(--light)}
.row .n{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);text-align:right}
.row .sub{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:2px}
.row.k-dispute .say b.alt{border-bottom:2px solid var(--x-proposed-disagree)}
.or{color:var(--ink-muted);font-style:italic;padding:0 var(--space-1)}
.row .wcell{display:flex;flex-direction:column;gap:2px}
/* ruler */
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.panel{background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4)}
.ruler{position:relative;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--space-7) + var(--space-5)) var(--space-6);gap:0 var(--space-2)}
.rung{display:contents}
.rung .lab{padding:var(--space-1) 0;border-top:1px solid var(--hairline)}
.rung .lab b{display:block;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);letter-spacing:var(--tracking-soft);text-transform:uppercase}
.rung .lab span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rung .band{margin:var(--space-1) 0;border-radius:var(--radius-key);background:color-mix(in srgb,var(--ink) 5%,transparent);display:flex;flex-wrap:wrap;gap:var(--space-1);align-content:center;padding:var(--space-1)}
.rung:nth-child(1) .lab b{color:var(--x-proposed-rung-0)} .rung:nth-child(2) .lab b{color:var(--x-proposed-rung-1)} .rung:nth-child(3) .lab b{color:var(--x-proposed-rung-2)} .rung:nth-child(4) .lab b{color:var(--x-proposed-rung-3)} .rung:nth-child(5) .lab b{color:var(--x-proposed-rung-4)}
.rung .lane{position:relative}
.dot{display:inline-flex;align-items:center;justify-content:center;width:var(--space-5);height:var(--space-5);border-radius:var(--radius-pill);font:400 var(--type-small)/1 var(--font-mono);background:var(--surface-raised);border:1px solid var(--ink-muted);color:var(--light);transition:transform var(--motion-calm) var(--ease-spring),opacity var(--motion-base) var(--ease-out),box-shadow var(--motion-base)}
.pre .dot,.dot.wait{opacity:0;transform:translateY(calc(var(--space-5) * -1))}
@media (prefers-reduced-motion: reduce){.pre .dot,.dot.wait{transform:none}}
.dot.sel{box-shadow:0 0 0 var(--focus-ring) var(--x-proposed-lit),0 0 var(--glow-blur) color-mix(in srgb,var(--green) 40%,transparent)}
.dot.was{background:var(--x-proposed-stale);border:1px dashed var(--ink-muted);color:var(--ink-muted)}
.dot.two{background:transparent;border-color:var(--x-proposed-disagree);color:var(--x-proposed-disagree)}
.brk{position:absolute;left:var(--space-2);width:var(--space-3);border:2px solid var(--x-proposed-disagree);border-left:0;border-radius:0 var(--radius-key) var(--radius-key) 0}
.brk-l{position:absolute;left:calc(var(--space-5) + var(--space-1));font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--x-proposed-disagree);white-space:normal;width:var(--space-7)}
.lanehead{font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft);text-transform:uppercase;padding-bottom:var(--space-1)}
.off{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-3)}
.offc{border-radius:var(--radius-key);padding:var(--space-2);display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.offc b{display:block;font-weight:400;color:var(--ink);letter-spacing:var(--tracking-soft);text-transform:uppercase}
.offc.gap{background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-2)}
.offc.hid{background:var(--x-proposed-unseen);border:1px solid var(--hairline)}
.offc .dot{flex:none}
.offc.gap .dot{background:transparent;border:1px dashed var(--ink-muted);color:var(--ink-muted)}
.offc.hid .dot{background:var(--surface-inset);border:1px solid var(--hairline-strong);color:var(--ink-muted)}
/* how we know */
.how{flex:1;min-height:0}
.how .hw{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-2)}
.how p{margin:0 0 var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.how .nx{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-2);margin-top:var(--space-2)}
.how .nx b{font-weight:400;color:var(--ink)}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.fork > div{border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);padding:var(--space-1) var(--space-2);border-radius:0 2px 2px 0}
.fork > div > b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);margin-bottom:var(--space-1)}
.fade{transition:opacity var(--motion-base) var(--ease-out)}
.fade.out{opacity:0}
</style>
</head>
<body>
<div class="app pre" id="app">
  <header class="top">
    <span class="crumb" id="crumb"></span>
    <span class="floor" id="floor"></span>
    <span class="sp"></span>
    <div class="hints" id="hints"></div>
  </header>
  <div class="body">
    <article class="page scroll" id="page"></article>
    <aside class="side">
      <section class="panel dep" style="--i:2" aria-label="The yardstick">
        <p class="eyebrow" style="margin-bottom:var(--space-2)">The yardstick · same words for every briefing</p>
        <div class="ruler" id="ruler"></div>
        <div class="off" id="off"></div>
      </section>
      <section class="panel how scroll dep fade" style="--i:4" id="how" aria-live="polite"></section>
    </aside>
  </div>
</div>
<div class="x-cap"><b>Confidence · V1</b> the yardstick beside the page: every claim leads with its word and lands on one fixed ruler · UK PHIA yardstick, Sherman Kent</div>
<script>
/*@JS*/
const ORDER = ['c1','c2','c5','c10','c3','c9','c4','c6','c8','c7'];
let sel = 'c1';
const $ = id => document.getElementById(id);
function num(id){ return DATA.claims.indexOf(claim(id)) + 1; }
function render(){
  $('crumb').innerHTML = `${Icons.svg('library-big',{size:14})} ${DATA.app} <span>/</span> ${DATA.library} <span>/</span> <b>${DATA.briefing.title}</b>`;
  $('floor').innerHTML = `<span class="fd"></span>${DATA.viewer.floor} · ${DATA.viewer.word}`;
  $('hints').innerHTML = hints([['↑ ↓','claim'],['T','technical words'],['G','assistant off'],['R','replay']]);
  const known = ORDER.filter(id => derive(id).kind === 'fact');
  const open = ORDER.filter(id => derive(id).kind !== 'fact');
  $('page').innerHTML = `
    <p class="eyebrow dep" style="--i:0">Briefing · ${DATA.briefing.status} · for ${DATA.reader.name}, ${DATA.reader.role}</p>
    <h1 class="dep" style="--i:0">${DATA.briefing.title}</h1>
    <p class="qline dep" style="--i:1">The question: <b>${DATA.briefing.question}</b></p>
    <div class="dep" style="--i:1" id="bl"></div>
    <section class="sec dep" style="--i:2"><h2>What we know <small>${known.length} claims, each with its word</small></h2>${known.map(row).join('')}</section>
    <section class="sec dep" style="--i:3"><h2>What is open <small>not on the yardstick: nothing settled, or nothing to weigh</small></h2>${open.map(row).join('')}</section>`;
  bottomLine($('bl'));
  rulerDraw();
  bind();
  select(sel, true);
}
function row(id){
  const c = claim(id), d = derive(c);
  let say = sayValue(c), sub = '';
  if (d.kind === 'dispute') say = c.say.replace('{v}', `<b class="alt">${c.sides[0].value}</b><span class="or">or</span><b class="alt">${c.sides[1].value}</b>`);
  if (d.kind === 'fact' && d.lean === 1) sub = c.against;
  if (d.kind === 'stale') say = say.replace('<b>£10m</b>', '<b class="stale-v">£10m</b>');
  if (d.kind === 'gap') sub = `Expected, and nobody has said. ${c.who} could fill it.`;
  if (d.kind === 'hidden') sub = `Kept on the ${c.floor} floor. Ask ${c.ask}.`;
  if (d.kind === 'stale') sub = `Certificate dated ${c.stale.asOf}; the cover ran out ${c.sides[0].value.split('until ')[1]}.`;
  if (d.kind === 'dispute') sub = `Two sources of about the same weight. ${c.decides.split(',')[0]} decides.`;
  return `<button class="row k-${d.kind}" data-c="${id}"><span class="wcell">${word(d)}</span><span class="say">${say}${sub ? `<span class="sub">${sub}</span>` : ''}</span><span class="n">${num(id)}</span></button>`;
}
function rulerDraw(){
  const Y = DATA.yardstick, ds = ORDER.map(derive);
  $('ruler').innerHTML = Y.map((y, r) => `<div class="rung"><div class="lab"><b>${y.word}</b><span>${y.rule}</span><span class="tk">${y.tech} · PHIA ${y.phia}</span></div>
    <div class="band" data-r="${r}">${ds.filter(d => d.kind === 'fact' && d.rung === r).map(d => `<span class="dot wait" data-c="${d.id}">${num(d.id)}</span>`).join('')}${ds.filter(d => d.kind === 'stale' && d.was === r).map(d => `<span class="dot was wait" data-c="${d.id}" title="was ${y.say}">${num(d.id)}</span>`).join('')}</div>
    <div class="lane" data-r="${r}">${r === 0 ? '<div class="lanehead">disagree</div>' : ''}</div></div>`).join('');
  // dispute: a bracket in its own lane, joining the rungs each side would reach alone
  ds.filter(d => d.kind === 'dispute').forEach(d => {
    requestAnimationFrame(() => {
      const lanes = [...$('ruler').querySelectorAll('.lane')];
      const a = lanes[d.sides[0].rung], b = lanes[d.sides[1].rung], R = $('ruler').getBoundingClientRect();
      const top = a.getBoundingClientRect().top - R.top + a.offsetHeight / 2, bot = b.getBoundingClientRect().top - R.top + b.offsetHeight / 2;
      const lane = lanes[0];
      const x = `<div class="brk" style="top:${top - (lane.getBoundingClientRect().top - R.top)}px;height:${bot - top}px"></div>`;
      lane.insertAdjacentHTML('beforeend', `${x}<span class="dot two wait" data-c="${d.id}" style="position:absolute;left:0;top:${(top + bot) / 2 - (lane.getBoundingClientRect().top - R.top) - 14}px">${num(d.id)}</span>`);
    });
  });
  const gap = ds.filter(d => d.kind === 'gap'), hid = ds.filter(d => d.kind === 'hidden');
  $('off').innerHTML = `<div class="offc gap">${gap.map(d => `<span class="dot wait" data-c="${d.id}">${num(d.id)}</span>`).join('')}<span><b>${DATA.outside.gap.word}</b>Nothing to weigh, so no word. Never read as “unlikely”.</span></div>
    <div class="offc hid">${hid.map(d => `<span class="dot wait" data-c="${d.id}">${Icons.svg('lock',{size:12})}</span>`).join('')}<span><b>${DATA.outside.hidden.word}</b>It exists; you can’t weigh it from here.</span></div>`;
}
function bind(){
  document.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => select(b.dataset.c)));
}
function select(id, quiet){
  sel = id;
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('sel', r.dataset.c === id));
  document.querySelectorAll('.dot').forEach(r => r.classList.toggle('sel', r.dataset.c === id));
  const c = claim(id), d = derive(c), nx = next(c), how = $('how');
  const fill = () => {
    let body = '';
    if (d.kind === 'dispute') body = `<div class="fork">${c.sides.map(s => `<div><b>${s.value}</b><ul class="srcs">${s.sources.map(srcRow).join('')}</ul></div>`).join('')}</div>`;
    else if (c.sides) body = c.sides.map((s, i) => `${c.sides.length > 1 ? `<p class="eyebrow" style="margin:var(--space-2) 0 var(--space-1)">${i ? 'Against' : 'For'}: ${s.value}</p>` : ''}<ul class="srcs">${s.sources.map(srcRow).join('')}</ul>`).join('');
    else body = d.kind === 'gap' ? `<p><span class="mk-gap"></span> ${c.detail}: expected as ${c.shape}.</p>` : `<p><span class="unseen-v">${Icons.svg('lock',{size:12})} ${c.detail}</span></p>`;
    how.innerHTML = `<div class="hw"><span class="eyebrow">How we know · claim ${num(id)}</span>${word(d, { tech: false })}</div>
      <p>${why(c)}</p>${body}<p class="nx">${Icons.svg('arrow-up',{size:14})} <span>What would change it: <b>${nx.say}</b>.</span></p>`;
  };
  if (quiet || reduce) { fill(); return; }
  how.classList.add('out'); setTimeout(() => { fill(); how.classList.remove('out'); }, ms('--motion-base'));
}
function play(){
  clearLater();
  $('app').classList.add('pre');
  sel = 'c1'; render();
  later(() => $('app').classList.remove('pre'), ms('--motion-instant'));
  later(() => {
    document.querySelectorAll('.dot.wait').forEach((d, i) => later(() => d.classList.remove('wait'), i * ms('--motion-instant')));
  }, ms('--motion-run'));
  later(() => select('c4'), ms('--motion-run') * 2);
}
window.onGw = () => { bottomLine($('bl')); bind(); };
document.addEventListener('keydown', e => {
  if (baseKeys(e, play)) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const i = ORDER.indexOf(sel), j = Math.max(0, Math.min(ORDER.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
    select(ORDER[j]);
    const r = document.querySelector(`.row[data-c="${ORDER[j]}"]`); if (r) { r.focus({ preventScroll: true }); r.scrollIntoView({ block: 'nearest' }); }
  }
});
play();
</script>
</body>
</html>
