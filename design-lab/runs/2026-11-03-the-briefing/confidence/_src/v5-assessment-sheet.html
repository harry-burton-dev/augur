<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Confidence · V5 · The assessment sheet</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
.app{height:100vh;display:flex;flex-direction:column}
.desk{flex:1;min-height:0;padding:var(--space-4) var(--edge) var(--space-6);display:flex;justify-content:center}
.sheet{width:100%;max-width:calc(var(--measure-wide) + var(--measure-glance));min-height:0;display:flex;flex-direction:column;background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);box-shadow:var(--shadow-raised)}
.mast{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);padding:var(--space-2) var(--space-5);border-bottom:1px solid var(--hairline);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.mast .fl{display:inline-flex;align-items:center;gap:var(--space-2);color:var(--ink)}
.mast .fl i{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--x-proposed-here)}
.inner{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
.colL,.colR{min-height:0;padding:var(--space-4) var(--space-5)}
.colR{border-left:1px solid var(--hairline)}
.sheet h1{font-size:var(--type-heading);line-height:var(--leading-heading);margin:0 0 var(--space-1)}
.byline{margin:0 0 var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.byline b{font-weight:400;color:var(--ink)}
/* the yardstick printed on the sheet, not in a footnote */
.yk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;margin:0 0 var(--space-4)}
.yk div{padding:var(--space-1) var(--space-2);background:color-mix(in srgb,var(--ink) 5%,transparent);font-size:var(--x-proposed-type-micro);line-height:1.35;color:var(--ink-muted)}
.yk div:first-child{border-radius:var(--radius-key) 0 0 var(--radius-key)}
.yk div:last-child{border-radius:0 var(--radius-key) var(--radius-key) 0}
.yk b{display:block;font-weight:400;font-size:var(--type-small);letter-spacing:var(--tracking-soft);text-transform:uppercase}
.yk div.used{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.sec{margin:0 0 var(--space-4)}
.sec > h2{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:var(--space-1);margin-bottom:var(--space-2)}
.sec > h2 small{font:400 var(--type-small)/1 var(--font-sans);text-transform:none;letter-spacing:0;color:var(--ink-muted)}
ol.kj{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2);counter-reset:kj}
.kj li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline;font-size:var(--type-body);line-height:var(--leading-body)}
.kj .no{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
/* the stamp: the word, in ink, set by the rule */
.stamp{font-weight:400;letter-spacing:var(--tracking-soft);text-transform:uppercase;font-size:var(--type-meta);padding:0 var(--space-1);border-radius:2px;box-shadow:inset 0 0 0 1px currentColor;transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-spring);display:inline-block}
.stamp.r0{color:var(--x-proposed-rung-0)} .stamp.r1{color:var(--x-proposed-rung-1)} .stamp.r2{color:var(--x-proposed-rung-2)} .stamp.r3{color:var(--x-proposed-rung-3)} .stamp.r4{color:var(--x-proposed-rung-4)}
.stamp.wait{opacity:0;transform:scale(1.25)}
@media (prefers-reduced-motion: reduce){.stamp.wait{transform:none}}
.lead{color:var(--ink)}
.prose{color:var(--ink)}
.prose.pen{font-style:italic;color:var(--x-proposed-pencil);border-bottom:1px dotted var(--x-proposed-pencil-edge)}
.cites{white-space:nowrap}
.side{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);grid-column:2 / 3}
.pen-key{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:var(--space-2) 0 0}
.pen-key .prose.pen{font-size:var(--type-small)}
.pen-key .stamp{font-size:var(--type-small)}
/* alternative view: the dispute, boxed, both sides equal */
.alt{border:1px solid color-mix(in srgb,var(--warning) 35%,transparent);border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3)}
.alt .cw{margin-bottom:var(--space-1)}
.alt p{margin:0 0 var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.alt .two{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.alt .two b{display:block;font-weight:400;color:var(--light);font-size:var(--type-lead);line-height:var(--leading-lead)}
.alt .two span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.alt .dec{display:flex;justify-content:space-between;align-items:center;margin-top:var(--space-2);padding-top:var(--space-2);border-top:1px solid color-mix(in srgb,var(--warning) 20%,transparent);font-size:var(--type-small);color:var(--ink-muted)}
.alt .dec b{font-weight:400;color:var(--ink)}
/* gaps: ruled lines left to fill */
.gl{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-3)}
.gl li{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-1);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.gl .fillin{display:block;height:calc(var(--space-5) + var(--space-1));background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-2);font-size:var(--type-small);line-height:calc(var(--space-5) + var(--space-1));padding:0 var(--space-3);color:var(--ink-muted)}
.gl .who{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.gl .who b{font-weight:400;color:var(--ink)}
.gl li.k-stale .fillin{background:var(--x-proposed-stale);border-radius:2px;color:var(--ink)}
.gl li.k-hidden .fillin{background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px}
.foot{display:flex;justify-content:space-between;gap:var(--space-4);padding:var(--space-2) var(--space-5);border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.foot b{font-weight:400;color:var(--ink)}
</style>
</head>
<body>
<div class="app pre" id="app">
  <header class="top">
    <span class="crumb" id="crumb"></span>
    <span class="floor" id="floor"></span>
    <span class="sp"></span>
    <div class="hints" id="hints"></div>
  </header>
  <div class="desk">
    <article class="sheet dep" style="--i:0">
      <div class="mast" id="mast"></div>
      <div class="inner">
        <div class="colL scroll" id="colL"></div>
        <div class="colR scroll" id="colR"></div>
      </div>
      <div class="foot" id="foot"></div>
    </article>
  </div>
</div>
<div class="x-cap"><b>Confidence · V5</b> the assessment sheet: stamped words, the yardstick on the page, disputes boxed, gaps as lines · JIC, PHIA</div>
<script>
/*@JS*/
const $ = id => document.getElementById(id);
const num = id => DATA.claims.indexOf(claim(id)) + 1;
const Y = DATA.yardstick;
const OPEN = ['It is almost certain that', 'It is very likely that', 'It is likely that', 'It is possible that', 'It is unlikely that'];
function lower(s) { return s.charAt(0).toLowerCase() + s.slice(1); }
function cites(c) { const ids = c.sides ? uniq(c.sides.flatMap(s => s.sources)) : []; return `<button class="cite" data-c="${c.id}" title="${ids.map(i => DATA.sources[i].name).join('; ')}">${num(c.id)}</button>`; }
function render(stamped) {
  $('crumb').innerHTML = `${Icons.svg('library-big', { size: 14 })} ${DATA.app} <span>/</span> ${DATA.library} <span>/</span> <b>${DATA.briefing.title}</b>`;
  $('floor').innerHTML = `<span class="fd"></span>${DATA.viewer.floor} · ${DATA.viewer.word}`;
  $('hints').innerHTML = hints([['G', 'assistant off'], ['T', 'technical words'], ['R', 'replay']]);
  $('mast').innerHTML = `<span class="fl"><i></i>${DATA.viewer.floor} · ${DATA.viewer.word}</span><span>Assessment · ${DATA.briefing.status}</span><span>For ${DATA.reader.name} · ${DATA.today}</span>`;
  const ds = DATA.claims.map(derive);
  const facts = ds.filter(d => d.kind === 'fact').sort((a, b) => a.rung - b.rung);
  const usedR = uniq(facts.map(d => d.rung));
  $('colL').innerHTML = `
    <h1>${DATA.briefing.title}</h1>
    <p class="byline">Prepared by <b>${DATA.viewer.name}</b> for <b>${DATA.reader.name}</b>, ${DATA.reader.role}. Feeds <b>${DATA.briefing.intent.id}</b>, due ${DATA.briefing.intent.due}.</p>
    <div class="yk" aria-label="The yardstick used on this sheet">${Y.map((y, r) => `<div class="${usedR.includes(r) ? 'used' : ''}"><b class="stamp r${r}" style="box-shadow:none;padding:0">${y.word}</b>${y.rule}<span class="tk">${y.tech}</span></div>`).join('')}</div>
    <section class="sec"><h2>Key judgements <small>surest first · the word is set by the rule, never by the writer</small></h2>
      <ol class="kj">${facts.map(d => {
        const c = d.claim, pen = UI.gw && DATA.drafts[c.id];
        const prose = pen ? `<span class="prose pen">${DATA.drafts[c.id]}</span>` : `<span class="prose">${lower(c.say.replace(/<\/?b>/g, ''))}</span>`;
        return `<li><span class="no">${num(c.id)}</span><span><span class="stamp r${d.rung}${stamped ? '' : ' wait'}" title="${Y[d.rung].rule}">${OPEN[d.rung]}</span> ${prose}<sup class="cites">${cites(c)}</sup>${d.lean === 1 ? `<span class="side" style="display:block">${c.against}</span>` : ''}</span><span></span></li>`;
      }).join('')}</ol>
      <p class="pen-key"><span><span class="stamp r1" style="font-size:var(--type-small)">It is very likely that</span> ink: the rule</span><span><span class="prose pen">the rest of the sentence</span> pencil: drafted by the assistant, until ${DATA.viewer.name} accepts it</span></p>
    </section>`;
  const disp = ds.filter(d => d.kind === 'dispute'), gaps = ds.filter(d => ['gap', 'stale', 'hidden'].includes(d.kind));
  $('colR').innerHTML = `
    <section class="sec"><h2>Where sources disagree <small>no judgement until someone decides</small></h2>
      ${disp.map(d => { const c = d.claim; return `<div class="alt">${word(d)}<p>${c.detail} (${c.about}). Both answers stand; neither is the briefing’s view.<sup>${cites(c)}</sup></p>
        <div class="two">${c.sides.map(s => `<div><b>${s.value}</b><span>${s.sources.map(i => `${DATA.sources[i].name} · ${DATA.grades.strength[strength(DATA.sources[i].grade)]}`).join('<br>')}</span></div>`).join('')}</div>
        <div class="dec"><span>Decides: <b>${c.decides}</b></span><span>${DATA.outside.dispute.word.toLowerCase()} ≠ unsure: each side alone would be ${Y[d.sides[0].rung].say} and ${Y[d.sides[1].rung].say}</span></div></div>`; }).join('')}
    </section>
    <section class="sec"><h2>What we don’t know <small>left blank on purpose, with who could fill it</small></h2>
      <ul class="gl">${gaps.map(d => { const c = d.claim, nx = next(c);
        const fill = d.kind === 'gap' ? `${Icons.svg('square-dashed', { size: 12 })} not known yet: expected as ${c.shape}` : d.kind === 'stale' ? `${c.sides[0].value} · was ${Y[d.was].say} on ${c.stale.asOf}` : `${Icons.svg('lock', { size: 12 })} not yours to see: on the ${c.floor} floor`;
        return `<li class="k-${d.kind}"><span>${c.about}: ${lower(c.detail)}<sup>${cites(c)}</sup></span><span class="fillin">${fill}</span><span class="who">${d.kind === 'hidden' ? 'Ask' : 'Could fill it'}: <b>${nx.who}</b></span></li>`; }).join('')}</ul>
    </section>`;
  const pens = UI.gw ? facts.filter(d => DATA.drafts[d.id]).length : 0;
  $('foot').innerHTML = `<span>${UI.gw ? `<b>${pens}</b> sentences are in pencil, drafted by the assistant; none is accepted yet.` : `${Icons.svg('power-off', { size: 12 })} Assistant off: every sentence is the claim’s own template. No word, number or source changed.`}</span><span>Every judgement links to its records. <b>${facts.length}</b> judgements · <b>${disp.length}</b> dispute · <b>${gaps.length}</b> blanks</span>`;
}
function play() {
  clearLater(); $('app').classList.add('pre'); render(false);
  later(() => $('app').classList.remove('pre'), ms('--motion-instant'));
  later(() => document.querySelectorAll('.kj .stamp.wait').forEach((s, i) => later(() => s.classList.remove('wait'), i * ms('--motion-quick'))), ms('--motion-run'));
}
window.onGw = () => render(true);
document.addEventListener('keydown', e => { baseKeys(e, play); });
play();
</script>
</body>
</html>
