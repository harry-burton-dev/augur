<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Confidence · V3 · Counted sources</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
:root{
  /* NEW: one counted source, the Isotype unit. Same size everywhere so counts compare across briefings. */
  --x-proposed-unit: calc(var(--space-5) - var(--space-1));
}
.app{height:100vh;display:flex;flex-direction:column}
.body{flex:1;min-height:0;padding:var(--space-4) var(--edge) var(--space-6);display:flex;flex-direction:column;gap:var(--space-3)}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-5);align-items:end}
.head h1{font-size:var(--type-heading);line-height:var(--leading-heading)}
.key{display:flex;gap:var(--space-4);align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset)}
.key b{font-weight:400;color:var(--ink)}
.key > span{display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap}
.sum{margin:0;font-size:var(--type-lead);line-height:var(--leading-lead);font-weight:300;color:var(--ink)}
.sum b{font-weight:400;color:var(--light)}
.sheet{flex:1;min-height:0;position:relative}
.grid{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--measure-rail) - var(--space-5)) 1px calc(var(--measure-rail) - var(--space-5)) var(--measure-rail);column-gap:0}
.colh{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding:0 var(--space-3) var(--space-2);border-bottom:1px solid var(--hairline)}
.colh.for{text-align:right}
.spine{background:var(--hairline-strong)}
.r{display:contents}
.r > *{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);display:flex;align-items:center;min-height:calc(var(--space-6) + var(--space-1));transition:background var(--motion-base) var(--ease-out)}
.r > .spine{padding:0;border-bottom:0}
.r:hover > *:not(.spine){background:color-mix(in srgb,var(--ink) 3%,transparent)}
.r.sel > *:not(.spine){background:var(--x-proposed-lit-wash)}
.r.sel > .say{box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.say{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink);gap:var(--space-3)}
.say .n{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);width:var(--space-4);flex:none}
.say b{font-weight:400;color:var(--light)}
.say .against{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.say .against b{color:var(--ink)}
.for{justify-content:flex-end}
.figs{display:flex;gap:var(--space-1);align-items:center}
.for .figs{flex-direction:row-reverse}
.fig{display:inline-flex;align-items:center;justify-content:center;width:var(--x-proposed-unit);height:var(--x-proposed-unit);border-radius:var(--radius-pill);transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-spring)}
.fig.strong{background:var(--light);color:var(--slate-deep)}
.fig.fair{border:1.5px solid var(--ink);color:var(--ink)}
.fig.weak{border:1.5px dashed var(--ink-muted);color:var(--ink-muted)}
.fig.stale{background:var(--x-proposed-stale);border:1px solid var(--hairline-strong);color:var(--ink-muted)}
.fig.slot{background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-1);border-radius:0;color:var(--ink-muted);font:400 var(--type-small)/1 var(--font-mono)}
.fig.wait{opacity:0;transform:scale(.6)}
@media (prefers-reduced-motion: reduce){.fig.wait{transform:none}}
.figs .lab{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:0 var(--space-2);white-space:nowrap}
.hidblk{flex:1;align-self:stretch;margin:var(--space-1) 0;border-radius:var(--radius-key);background:var(--x-proposed-unseen);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.r.k-hidden .for,.r.k-hidden .ag{padding:0}
.r.k-hidden .for .hidblk{border-right:0;border-radius:var(--radius-key) 0 0 var(--radius-key);margin-left:var(--space-3)}
.r.k-hidden .ag .hidblk{border-left:0;border-radius:0 var(--radius-key) var(--radius-key) 0;margin-right:var(--space-3)}
.r.k-dispute .spine{background:var(--x-proposed-disagree);box-shadow:0 0 0 1px var(--x-proposed-disagree)}
.r.k-dispute .for,.r.k-dispute .ag{background:var(--x-proposed-disagree-wash)}
.wd{justify-content:flex-start}
.wd .cw{white-space:normal}
.divider > *{border-bottom:1px solid var(--hairline-strong)!important;min-height:0!important;padding-top:var(--space-4)!important;font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.divider > .spine{padding:0!important}
/* records under a row */
.recs{grid-column:1 / -1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4);padding:var(--space-3) var(--space-4) var(--space-3) calc(var(--space-4) + var(--space-5));border-bottom:1px solid var(--hairline);background:var(--surface-inset);overflow:hidden;transition:opacity var(--motion-base) var(--ease-out)}
.recs .wy{grid-column:1 / -1;margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.recs .wy span{color:var(--ink-muted)}
.recs .side .eyebrow{margin-bottom:var(--space-2)}
</style>
</head>
<body>
<div class="app pre" id="app">
  <header class="top">
    <span class="crumb" id="crumb"></span>
    <span class="floor" id="floor"></span>
    <span class="sp"></span>
    <div class="hints" id="hints"></div>
  </header>
  <div class="body">
    <div class="head dep" style="--i:0">
      <div>
        <p class="eyebrow">Briefing · ${status}</p>
        <h1 id="title"></h1>
        <p class="sum" id="sum"></p>
        <p class="lede" id="gwl"></p>
      </div>
      <div class="key" id="key" aria-label="How to read the figures"></div>
    </div>
    <div class="sheet scroll dep" style="--i:1"><div class="grid" id="grid"></div></div>
  </div>
</div>
<div class="x-cap"><b>Confidence · V3</b> counted sources: one figure per source, for and against, the word read off the count · Neurath’s Isotype</div>
<script>
/*@JS*/
const $ = id => document.getElementById(id);
const num = id => DATA.claims.indexOf(claim(id)) + 1;
const ORDER = ['c1','c2','c9','c10','c3','c5','c4','c8','c6','c7'];
let sel = null;
function figs(sources, stale) {
  return sources.map(id => { const s = DATA.sources[id], st = strength(s.grade); return `<span class="fig wait ${stale ? 'stale' : st}" title="${s.name}: ${DATA.grades.strength[st]}">${Icons.svg(s.icon, { size: 12, stroke: 2 })}</span>`; }).join('');
}
function render() {
  document.querySelector('.head .eyebrow').textContent = `Briefing · ${DATA.briefing.status} · for ${DATA.reader.name} · how sure, counted`;
  $('crumb').innerHTML = `${Icons.svg('library-big', { size: 14 })} ${DATA.app} <span>/</span> ${DATA.library} <span>/</span> <b>${DATA.briefing.title}</b>`;
  $('floor').innerHTML = `<span class="fd"></span>${DATA.viewer.floor} · ${DATA.viewer.word}`;
  $('hints').innerHTML = hints([['↑ ↓', 'claim'], ['enter', 'its records'], ['T', 'technical words'], ['G', 'assistant off'], ['R', 'replay']]);
  $('title').textContent = DATA.briefing.title;
  const ds = ORDER.map(derive);
  const settled = ds.filter(d => d.kind === 'fact' && d.rung <= 2).length;
  $('sum').innerHTML = `<b>${settled}</b> of ${ds.length} claims rest on sources that agree. <b>${ds.filter(d => d.kind === 'dispute').length}</b> has sources that disagree, <b>${ds.filter(d => d.kind === 'gap').length}</b> has none yet, and <b>${ds.filter(d => d.kind === 'stale').length}</b> is out of date.`;
  $('key').innerHTML = `<span><span class="fig strong">${Icons.svg('file-text', { size: 12, stroke: 2 })}</span><b>a source we usually trust</b></span><span><span class="fig fair">${Icons.svg('file-text', { size: 12, stroke: 2 })}</span>fair</span><span><span class="fig weak">${Icons.svg('user-round', { size: 12, stroke: 2 })}</span>weak or ungraded</span><span><span class="fig slot">?</span>expected, none yet</span><span class="tk">strong A–B/1–2 · fair ≤C/3 · weak else</span>`;
  let h = `<div class="colh">Claim</div><div class="colh for">Sources for</div><div class="spine"></div><div class="colh">Sources against</div><div class="colh">So we say</div>`;
  ds.forEach((d, i) => {
    const c = d.claim;
    if (i && d.kind !== 'fact' && ds[i - 1].kind === 'fact') h += `<div class="r divider"><div>Not settled, or nothing to weigh: these get no word on the yardstick</div><div></div><div class="spine"></div><div></div><div></div></div>`;
    let say = sayValue(c), f = '', a = '';
    if (d.kind === 'dispute') { say = c.say.replace('{v}', `<b>${c.sides[0].value}</b> or <b>${c.sides[1].value}</b>`); f = `<div class="figs"><span class="lab">${c.sides[0].value}</span>${figs(c.sides[0].sources)}</div>`; a = `<div class="figs">${figs(c.sides[1].sources)}<span class="lab">${c.sides[1].value}</span></div>`; }
    else if (d.kind === 'gap') { f = `<div class="figs"><span class="lab">${c.who.split(',')[0]} could say</span><span class="fig slot wait">?</span></div>`; }
    else if (d.kind === 'hidden') { f = `<div class="hidblk">${Icons.svg('lock', { size: 12 })} on the ${c.floor} floor</div>`; a = `<div class="hidblk">ask ${c.ask.split(',')[0]}</div>`; }
    else { f = `<div class="figs">${figs(c.sides[0].sources, d.kind === 'stale')}${d.kind === 'stale' ? `<span class="lab">${c.stale.asOf}</span>` : ''}</div>`; if (c.sides[1]) { a = `<div class="figs">${figs(c.sides[1].sources)}</div>`; say += `<span class="against">${c.against}</span>`; } }
    if (d.kind === 'stale') say = say.replace('<b>£10m</b>', '<b class="stale-v">£10m</b>');
    h += `<div class="r k-${d.kind}" data-c="${d.id}" tabindex="-1"><button class="say" data-c="${d.id}"><span class="n">${num(d.id)}</span><span>${say}</span></button><div class="for">${f}</div><div class="spine"></div><div class="ag">${a}</div><div class="wd">${word(d)}</div></div>`;
  });
  $('grid').innerHTML = h;
  document.querySelectorAll('button.say').forEach(b => b.addEventListener('click', () => toggle(b.dataset.c)));
}
function toggle(id) {
  document.querySelectorAll('.recs').forEach(n => n.remove());
  document.querySelectorAll('.r').forEach(r => r.classList.toggle('sel', r.dataset.c === id && sel !== id));
  if (sel === id) { sel = null; return; }
  sel = id;
  const c = claim(id), d = derive(c), nx = next(c), row = document.querySelector(`.r[data-c="${id}"]`);
  let sides = '';
  if (c.sides) sides = c.sides.map((s, i) => `<div class="side"><p class="eyebrow">${i ? 'Against' : 'For'} · ${s.value}</p><ul class="srcs">${s.sources.map(srcRow).join('')}</ul></div>`).join('');
  else sides = `<div class="side"><p class="eyebrow">${d.word}</p><p class="lede">${d.kind === 'gap' ? `Expected as ${c.shape}. Nobody has said.` : `Kept on the ${c.floor} floor.`}</p></div>`;
  const last = row.lastElementChild;
  last.insertAdjacentHTML('afterend', `<div class="recs"><p class="wy">${why(c)} <span>${nx.say}.</span></p>${sides}</div>`);
  // display:contents rows can't hold the panel, so it follows the row's last cell in the grid
}
function play() {
  clearLater(); sel = null; $('app').classList.add('pre'); render();
  later(() => $('app').classList.remove('pre'), ms('--motion-instant'));
  later(() => document.querySelectorAll('.fig.wait').forEach((f, i) => later(() => f.classList.remove('wait'), i * ms('--motion-instant'))), ms('--motion-run'));
  later(() => toggle('c4'), ms('--motion-run') * 2 + ms('--motion-base'));
}
window.onGw = on => { $('gwl').innerHTML = on ? '' : `${Icons.svg('power-off', { size: 12 })} The assistant is off. Nothing here changed: the sentence above is a template, the figures and words come from the records.`; };
document.addEventListener('keydown', e => {
  if (baseKeys(e, play)) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const i = sel ? ORDER.indexOf(sel) : -1, j = Math.max(0, Math.min(ORDER.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
    toggle(ORDER[j]); document.querySelector(`button.say[data-c="${ORDER[j]}"]`).focus();
  }
});
play();
</script>
</body>
</html>
