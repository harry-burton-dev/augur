<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Briefing · Grammar V3 · The ladder of heights</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens (all mixes of kit tokens; "needs token" in notes.md)
   --------------------------------------------------------------- */
:root{
  /* type for numerals and keys in data; earlier runs asked for it too */
  --x-proposed-type-micro: .6875rem;
  /* quiet lines: what was left out, doesn't apply */
  --x-proposed-quiet: .62;
  /* the floor the briefing is kept on (Team here): the bottom line's rule */
  --x-proposed-here: var(--floor-team-high);
  /* pencil (pencil and ink, reference desk): anything a model wrote, until a person accepts it */
  --x-proposed-pencil-ink: color-mix(in srgb, var(--info) 42%, var(--ink-muted));
  --x-proposed-pencil-edge: 1px dotted var(--x-proposed-pencil-ink);
  /* data ink: history and context quiet, the finding lit (time is matter, light is need) */
  --x-proposed-data-ink: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-data-finding: var(--light);
  /* an event on a time axis: a dashed hairline */
  --x-proposed-event: var(--hairline-strong);
  /* yardstick cells: filled and empty */
  --x-proposed-yard-on: var(--ink);
  --x-proposed-yard-off: var(--hairline-strong);
  /* a tally: the count of records behind a claim, as a small chip */
  --x-proposed-tally-edge: var(--hairline-strong);
  /* sources disagree: a warning-tinted edge, never red */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  /* the lit path (light language) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* six ways to be empty, from the catalogue run */
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-proposed-gap-tick: var(--space-1);
}
:root, .mk-gap{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
h1{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;margin:var(--space-1) 0;color:var(--light)}
h2{font-weight:300;font-size:var(--type-body);line-height:var(--leading-body);letter-spacing:var(--tracking-caps);text-transform:uppercase;margin:0;color:var(--light)}
.lede{margin:0;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.hints .on{color:var(--light)}
.fh{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0 0 var(--space-1)}

/* two registers: the technical line one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.tech .tk{display:block}
.tech span.tk{display:inline;margin-left:var(--space-1)}

/* floor colours */
[data-tier="department"]{--fc:var(--floor-department-high)}
[data-tier="team"]{--fc:var(--floor-team-high)}
[data-tier="org"]{--fc:var(--floor-org-high)}
[data-tier="you"]{--fc:var(--floor-you-high)}

/* ===== bottom line ===== */
.bl{margin:0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);max-width:var(--measure-read);border-left:2px solid var(--x-proposed-here);padding-left:var(--space-3)}
.bl .so{display:block;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)}
/* a number in a sentence: ink, always (facts and counts are ink) */
.n{font-variant-numeric:tabular-nums;font-weight:400;color:var(--light)}
/* the tally: how many records stand behind a claim; opens them */
.tally{display:inline-flex;align-items:center;gap:2px;vertical-align:.18em;margin-left:2px;font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted);border:1px solid var(--x-proposed-tally-edge);border-radius:var(--radius-key);padding:0 var(--space-1);letter-spacing:0}
button.tally:hover{color:var(--light);border-color:var(--ink-muted)}

/* ===== confidence word: the word, then the yardstick at word size ===== */
.cw{display:inline-flex;align-items:baseline;gap:var(--space-1);white-space:nowrap;color:var(--ink);font-style:normal;border-bottom:1px solid var(--hairline-strong)}
.yd{display:inline-grid;grid-auto-flow:column;gap:1px;align-self:center}
.yd i{display:block;width:var(--space-1);height:calc(var(--space-2) + 2px);background:var(--x-proposed-yard-off);border-radius:1px}
.yd i.on{background:var(--x-proposed-yard-on)}
.cw.cant{color:var(--ink-muted);border-bottom-style:dashed}
.rec-word{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink);border:1px solid var(--hairline-strong);border-radius:2px;padding:0 var(--space-1);vertical-align:.12em}

/* ===== pencil: what a model wrote, until a person accepts it ===== */
.pencil{color:var(--x-proposed-pencil-ink);font-style:italic;border:var(--x-proposed-pencil-edge);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2)}
.pencil-lab{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;font-style:normal;color:var(--x-proposed-pencil-ink)}
.gate-off .pencil-only{display:none!important}
.gate-only{display:none}
.gate-off .gate-only{display:inline-flex}

/* ===== workings ===== */
.wk{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-1)}
.wk li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.wk .no{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.wk .ct{font:400 var(--type-small)/1 var(--font-mono);color:var(--light);font-variant-numeric:tabular-nums}
.wk li.out{color:var(--ink-muted)}
.wk li.out .ct{color:var(--ink-muted)}

/* ===== six ways to be empty (catalogue run) ===== */
.mk{display:inline-block;vertical-align:middle;flex:none}
.mk-gap{background:var(--x-proposed-gap);width:var(--space-5);height:var(--space-4)}
.mk-stale{background:var(--x-proposed-stale);width:var(--space-4);height:var(--space-3);border-radius:2px}
.mk-break{width:var(--space-5);height:var(--space-3)}
.mk-break path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.mk-unseen{display:inline-flex;align-items:center;justify-content:center;width:var(--space-4);height:var(--space-3);background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:2px;color:var(--ink-muted)}
.mk-none{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink);border-bottom:1px solid var(--ink-muted);padding:0 1px}
.mk-na{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.mk-disagree{width:var(--space-4);height:var(--space-3);border-left:2px solid var(--x-proposed-disagree);border-right:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash)}
.emp{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);align-items:start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.emp .mk{margin-top:1px;justify-self:start}
.emp b{font-weight:400;color:var(--ink)}

/* ===== pictures ===== */
svg.chart{display:block;overflow:visible}
svg.chart text{font-family:var(--font-mono);font-size:var(--x-proposed-type-micro);fill:var(--ink-muted)}
svg.chart .axis{stroke:var(--hairline-strong);stroke-width:1}
svg.chart .ev{stroke:var(--x-proposed-event);stroke-dasharray:3 3}
svg.chart .b0{fill:var(--x-proposed-data-ink)}
svg.chart .b1{fill:var(--x-proposed-data-finding)}
svg.chart .nr path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.ptitle{margin:0 0 var(--space-2);font-weight:400;font-size:var(--type-body);line-height:var(--leading-body);color:var(--light)}
.psub{margin:0 0 var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
/* isotype: one symbol = N records; a part symbol is cut, never shrunk */
.iso{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.iso .s{display:inline-flex;color:var(--x-proposed-data-ink);overflow:hidden;flex:none}
.iso .s.f{color:var(--x-proposed-data-finding)}
/* sparkline at word size */
.spark{display:inline-block;vertical-align:-2px}
.spark .b0{fill:var(--x-proposed-data-ink)}
.spark .b1{fill:var(--x-proposed-data-finding)}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out),filter var(--motion-slow) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}
/* rack focus: far plane blurs and desaturates; no black scrim */
.racked{filter:blur(calc(var(--space-1) / 2)) saturate(.4);opacity:.45}
@media (prefers-reduced-motion: reduce){.racked{filter:none;opacity:.35}}

.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));gap:var(--space-4)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5)}
.top .lede{max-width:84ch}
.body{display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr) calc(var(--measure-drawer) + var(--space-5));gap:var(--space-5);min-height:0}
/* the ladder */
.ladder{position:relative;display:flex;flex-direction:column;gap:var(--space-2);min-height:0}
.rails{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) 0;flex:1;max-height:calc(var(--measure-decision) + var(--space-5))}
.rails::before,.rails::after{content:"";position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--hairline-strong)}
.rails::before{left:var(--space-2)}.rails::after{left:calc(var(--space-5) + var(--space-1))}
.rung{position:relative;display:grid;grid-template-columns:calc(var(--space-6) - var(--space-1)) minmax(0,1fr);gap:var(--space-2);align-items:start;padding:var(--space-2) var(--space-2) var(--space-2) 0;border-radius:var(--radius-key);color:var(--ink-muted);transition:color var(--motion-slow)}
.rung .bar{margin-top:var(--space-3);margin-left:var(--space-2);height:2px;width:calc(var(--space-5) - var(--space-3) + 2px);background:var(--hairline-strong);transition:background var(--motion-slow),box-shadow var(--motion-slow)}
.rung b{display:block;font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.rung small{display:block;font-size:var(--type-small);line-height:var(--leading-small)}
.rung[aria-current=true]{color:var(--light)}
.rung[aria-current=true] .bar{background:var(--light);box-shadow:0 0 var(--glow-blur) color-mix(in srgb,var(--light) 40%,transparent)}
.rung .k{position:absolute;right:0;top:var(--space-2)}
.parts{display:grid;gap:var(--space-1);border-top:1px solid var(--hairline);padding-top:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.parts div{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2)}
.parts svg{margin-top:2px}
.parts b{font-weight:400;color:var(--ink)}
/* the stage: anchor fixed, the height around it moves */
.stage{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-3);min-height:0;border:1px solid var(--hairline);border-radius:var(--radius-card);background:var(--surface-pane);padding:var(--space-4) var(--space-5);overflow:hidden}
.anchor{display:flex;align-items:baseline;gap:var(--space-3);border-bottom:1px solid var(--hairline);padding-bottom:var(--space-3)}
.anchor .big{font-weight:200;font-size:var(--type-display);line-height:var(--leading-display);color:var(--light);font-variant-numeric:tabular-nums}
.anchor .unit{white-space:nowrap;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)}
.anchor .was{white-space:nowrap;font-size:var(--type-meta);color:var(--ink-muted)}
.anchor .pin{margin-left:auto;display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink-muted)}
.view{position:relative;min-height:0}
.lvl{position:absolute;inset:0;display:flex;flex-direction:column;gap:var(--space-3);transition:opacity var(--motion-slow) var(--ease-out),transform var(--motion-slow) var(--ease-out),filter var(--motion-slow) var(--ease-out)}
.lvl.above{opacity:0;transform:translateY(calc(var(--travel-near) * -1));filter:blur(calc(var(--space-1) / 2));pointer-events:none}
.lvl.below{opacity:0;transform:translateY(var(--travel-near));filter:blur(calc(var(--space-1) / 2));pointer-events:none}
@media (prefers-reduced-motion: reduce){.lvl.above,.lvl.below{transform:none;filter:none}}
.hl{margin:0;font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light);max-width:28ch}
.hl .spark{vertical-align:baseline}
.hl2{margin:0;font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink);max-width:56ch}
/* unit chart: one cell per record */
.units{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:var(--space-1);align-items:end;position:relative;border-bottom:1px solid var(--hairline-strong);padding-top:var(--space-4)}
.wcol{display:flex;flex-direction:row;flex-wrap:wrap-reverse;align-content:flex-start;gap:1px;height:100%;width:calc(var(--k) * (var(--cell) + 1px));justify-self:center;position:relative}
.u{width:var(--cell);height:var(--cell);border-radius:1px;border:1px solid var(--x-proposed-data-ink)}
.u.nar{background:var(--x-proposed-data-ink)}
.u.f{border-color:var(--x-proposed-data-finding)}
.u.f.nar{background:var(--x-proposed-data-finding)}
.wcol .nr{position:absolute;bottom:var(--space-2);left:50%;transform:translateX(-50%)}
.wlabels{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);text-align:center}
.avg{position:absolute;border-top:1px dashed var(--light);pointer-events:none}
.avg span{position:absolute;right:0;top:calc(var(--space-5) * -1);font-size:var(--type-small);color:var(--light);white-space:nowrap;background:var(--slate-deep);border-radius:2px;padding:0 var(--space-1)}
.avg.b{border-top-color:var(--ink-muted)}
.avg.b span{color:var(--ink-muted);right:auto;left:0}
.ev{position:absolute;top:0;bottom:0;border-left:1px dashed var(--x-proposed-event)}
.ev span{position:absolute;top:0;left:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink);white-space:nowrap}
.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.legend span{display:inline-flex;gap:var(--space-1);align-items:center}
.legend .u{--cell:var(--space-2)}
/* records */
.recwrap{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.recs{width:100%;border-collapse:collapse;font-size:var(--type-small);line-height:var(--leading-small)}
.recs th{position:sticky;top:0;background:var(--slate-deep);text-align:left;font-weight:400;color:var(--ink-muted);border-bottom:1px solid var(--hairline-strong);padding:var(--space-1) var(--space-2)}
.recs td{border-bottom:1px solid var(--hairline);padding:2px var(--space-2);color:var(--ink);white-space:nowrap}
.recs td.m{font-family:var(--font-mono);color:var(--ink-muted)}
.recs tr.grp td{color:var(--light);background:var(--surface-inset);font-family:var(--font-mono);font-size:var(--x-proposed-type-micro);letter-spacing:var(--tracking-soft)}
.recs .nb{display:inline-block;width:var(--space-2);height:var(--space-2);border-radius:1px;background:var(--light);vertical-align:0}
/* the sum check: every height agrees, to the digit */
.check{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.check b{font-weight:400;color:var(--light)}
.check .ok{display:inline-flex;align-items:center;gap:var(--space-1);color:var(--success)}
.check .cur{color:var(--light);border-bottom:1px solid var(--light)}
/* grammar for this height */
.gram{display:flex;flex-direction:column;gap:var(--space-3);min-height:0;overflow:auto;padding-right:var(--space-2);scrollbar-width:thin}
.gram h2{display:flex;align-items:center;gap:var(--space-2)}
.gram dl{margin:0;display:grid;gap:var(--space-2)}
.gram dt{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.gram dd{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.gram dd.rc{font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.gram dd.nv{display:flex;gap:var(--space-2);color:var(--ink)}
.gram dd.nv svg{flex:none;margin-top:var(--space-1);color:var(--x-proposed-disagree)}
.gram .emps{display:grid;gap:var(--space-1);border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.gram .pen{font-size:var(--type-small);line-height:var(--leading-small)}
@media (max-width: 1400px){ .anchor .pin{display:none} }
@media (max-height: 820px){ .parts div:nth-child(n+2){display:none} .parts{display:none} .anchor .big{font-size:var(--type-title);line-height:var(--leading-title)} .gram dd.rc{display:none} .hl{font-size:var(--type-heading);line-height:var(--leading-heading)} }
</style>
</head>
<body>
<div class="app pre" id="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="eb"></p>
      <h1>One fact, three heights</h1>
      <p class="lede" id="lede"></p>

/* ---------- shared helpers (common.js) ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = getComputedStyle(document.documentElement);
const tok = n => parseFloat(css.getPropertyValue(n)) || 0;
const ic = (n, s = 16, w = 1.5) => Icons.svg(n, { size: s, stroke: w });
let TIMERS = [];
const later = (f, t) => TIMERS.push(setTimeout(f, RM ? Math.min(t, 1) : t));
const clearTimers = () => { TIMERS.forEach(clearTimeout); TIMERS = []; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = s => s[0].toUpperCase() + s.slice(1);

/* ---------- the numbers every height must agree on ---------- */
const S0 = (() => {
  const ev = DATA.event.week;
  const before = DATA.weeks.filter(w => w.wk < ev && w.count != null);
  const after = DATA.weeks.filter(w => w.wk >= ev && w.count != null);
  const last4 = after.slice(-4);
  const sum = a => a.reduce((t, w) => t + w.count, 0);
  const recs = DATA.records;
  const recAfter = recs.filter(r => r[2] >= ev), recBefore = recs.filter(r => r[2] < ev);
  const recLast4 = recs.filter(r => last4.some(w => w.wk === r[2]));
  const narrowShare = a => Math.round(100 * a.filter(r => r[4]).length / a.length);
  return {
    before: Math.round(sum(before) / before.length), beforeSum: sum(before), beforeN: before.length, beforeExact: sum(before) / before.length,
    after: Math.round(sum(last4) / last4.length), afterSum: sum(last4), afterN: last4.length, afterExact: sum(last4) / last4.length,
    total: recs.length, recAfter: recAfter.length, recBefore: recBefore.length, recLast4: recLast4.length,
    narrowBefore: narrowShare(recBefore), narrowAfter: narrowShare(recAfter),
    missing: DATA.weeks.filter(w => w.count == null), last4, max: Math.max(...DATA.weeks.map(w => w.count || 0))
  };
})();
const fill = s => s.replace(/\{(\w+)\}/g, (m, k) => k === 'eventDate' ? DATA.event.date : k === 'gapDates' ? DATA.gapDates : (k in S0 ? S0[k] : m));

/* ---------- confidence words ---------- */
const YI = w => DATA.yardstick.findIndex(y => y.w === w);
const yard = w => { const i = YI(w); return `<span class="yd" aria-hidden="true">${DATA.yardstick.map((y, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</span>`; };
const cw = w => w ? `<span class="cw" title="${esc(w)}: ${DATA.yardstick[YI(w)].lo} to ${DATA.yardstick[YI(w)].hi} in 100 on the yardstick">${esc(w.toLowerCase())}${yard(w)}</span>` : `<span class="cw cant">${esc(DATA.cantSay.toLowerCase())}</span>`;
const wordFor = (e, a) => DATA.grid[e][a];
const recWord = () => `<span class="rec-word">${ic('database', 11)}recorded</span>`;
const tally = (n, label = 'records') => `<button class="tally" title="${n} ${label}: open them">${ic('rows-3', 10)}${n}</button>`;
const claimWord = c => c.kind === 'count' ? recWord() : cw(wordFor(c.evidence, c.agreement));

/* ---------- marks: the six ways to be empty ---------- */

  gap: '<span class="mk mk-gap" aria-hidden="true"></span>',

  norecord: '<svg class="mk mk-break" viewBox="0 0 28 12" aria-hidden="true"><path d="M0 6 q3.5 -5 7 0 t7 0 t7 0 t7 0"/></svg>',

};
const emp = k => { const e = DATA.empties[k]; return `<div class="emp">${MK[k]}<span><b>${esc(e.plain)}.</b> ${esc(fill(e.line))}<span class="tk">${esc(e.tech)}</span></span></div>`; };

/* ---------- pictures ---------- */
/* weekly columns from zero; the week with no record is a wavy break, never a dip */
function weekChart({ w = 520, h = 160, labels = true, title = '', every = 2 } = {}) {
  const W = DATA.weeks, n = W.length, pad = labels ? 22 : 2, top = 12;
  const bw = (w - 2) / n, max = Math.ceil(S0.max / 10) * 10, y = v => top + (h - top - pad) * (1 - v / max);
  let s = `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}">`;
  if (labels) [0, max / 2, max].forEach(v => { s += `<line class="axis" x1="0" x2="${w}" y1="${y(v)}" y2="${y(v)}" opacity="${v ? .4 : 1}"/><text x="${w + 6}" y="${y(v) + 4}">${v}</text>`; });
  W.forEach((wk, i) => {
    const x = 1 + i * bw;
    if (wk.count == null) s += `<g class="nr"><path d="M${x + bw * .1} ${y(0) - 6} q${bw * .2} -6 ${bw * .4} 0 t${bw * .4} 0"/></g>`;
    else s += `<rect class="${wk.wk >= DATA.event.week ? 'b1' : 'b0'} bar" data-wk="${wk.wk}" x="${x + bw * .14}" width="${bw * .72}" y="${y(wk.count)}" height="${y(0) - y(wk.count)}" rx="1"/>`;
    const near = W[i - 1] && W[i - 1].count == null || W[i + 1] && W[i + 1].count == null;
    if (labels && ((i % every === 0 && !near) || wk.count == null)) s += `<text x="${x + bw / 2}" y="${h - 6}" text-anchor="middle">${wk.count == null ? 'none kept' : 'w' + wk.wk}</text>`;
  });
  const ex = 1 + DATA.weeks.findIndex(x => x.wk === DATA.event.week) * bw;
  s += `<line class="ev" x1="${ex}" x2="${ex}" y1="0" y2="${y(0)}"/>`;
  if (labels) s += `<text x="${ex + 4}" y="${top - 2}" style="fill:var(--ink)">${esc(DATA.event.date)}</text>`;
  return s + '</svg>';
}
function spark(w = 64, h = 14) {
  const W = DATA.weeks, bw = w / W.length;
  let s = `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
  W.forEach((wk, i) => { if (wk.count != null) { const bh = Math.max(1, h * wk.count / S0.max); s += `<rect class="${wk.wk >= DATA.event.week ? 'b1' : 'b0'}" x="${i * bw + .5}" width="${bw - 1}" y="${h - bh}" height="${bh}"/>`; } });
  return s + '</svg>';
}
/* isotype row: one symbol per `per` records; the last one is cut to its share, never shrunk */
function iso(count, per, size = 16, finding = false) {
  let out = '';
  const full = Math.floor(count / per), part = (count % per) / per;
  for (let i = 0; i < full; i++) out += `<span class="s${finding ? ' f' : ''}" style="width:${size}px">${ic(DATA.kind.icon, size)}</span>`;
  if (part > 0) out += `<span class="s${finding ? ' f' : ''}" style="width:${Math.max(2, Math.round(size * part))}px">${ic(DATA.kind.icon, size)}</span>`;
  return `<span class="iso" role="img" aria-label="${count} ${DATA.kind.many}">${out}</span>`;
}

/* ---------- sentences: templates filled from the numbers, never typed ---------- */
const bottomLine = () => ({
  s1: `${cap(DATA.kind.many)} in ${DATA.area} rose from <span class="n">${S0.before}</span> to <span class="n">${S0.after}</span> ${DATA.kind.per} after ${esc(DATA.event.label)} on ${esc(DATA.event.date)}.`,
  s2: `That is ${cw(wordFor(DATA.claims[1].evidence, DATA.claims[1].agreement))} because the new rounds skip the narrow streets, and it puts the ${DATA.intent.target}-a-week target out of reach.`
});
/* the picture's title is its finding, worded by rule from the ratio */
const changeWord = () => { const r = S0.afterExact / S0.beforeExact; return r >= 3 ? 'more than tripled' : r >= 2 ? 'more than doubled' : r > 1.1 ? 'rose' : r < .9 ? 'fell' : 'held steady'; };
const pictureTitle = () => `${cap(DATA.kind.many)} ${changeWord()} after ${esc(DATA.event.date)}`;
const steps = () => [
  [`Took every ${DATA.kind.one} in the ${DATA.log}, ${DATA.span}`, S0.total, ''],
  [`Split them at ${DATA.event.date}, when ${DATA.event.label}`, `${S0.recBefore} | ${S0.recAfter}`, ''],
  [`Averaged the ${S0.beforeN} weeks before and the last ${S0.afterN} weeks with records`, `${S0.before} → ${S0.after}`, ''],
  [`Left out week ${S0.missing.map(w => w.wk).join(', ')}: depot logs were down ${DATA.gapDates}`, 'no record', 'out'],
  ['Counted the share on narrow streets, before and after', `${S0.narrowBefore}% → ${S0.narrowAfter}%`, '']
];
const stepsHTML = () => `<ol class="wk">${steps().map((s, i) => `<li class="${s[2]}"><span class="no">${String(i + 1).padStart(2, '0')}</span><span>${esc(s[0])}</span><span class="ct">${s[2] === 'out' ? MK.norecord : esc(s[1])}</span></li>`).join('')}</ol>`;
function setTech(on) { document.body.classList.toggle('tech', on); $$('[data-key=t]').forEach(e => e.classList.toggle('on', on)); }
function setGate(off) { document.body.classList.toggle('gate-off', off); $$('[data-key=g]').forEach(e => e.classList.toggle('on', off)); }

const H = [
  { id: 'headline', name: 'Headline', says: 'The bottom line, with a picture at word size',
    carries: 'The number, what it is compared with, when it changed, and the confidence word for any judgement.',
    drawn: 'One sentence at title size, with a sparkline inside it at the height of the words; the second sentence quieter.',
    recipe: 'h: --type-title-s / 300 / --light; spark: 64 × 14, --x-proposed-data-ink and --x-proposed-data-finding',
    never: 'A number you can’t reach by stepping down. The sparkline never carries a claim the sentence doesn’t say.' },
  { id: 'picture', name: 'Picture', says: 'One mark per record, so the picture is the records, drawn small',
    carries: 'Every record as one cell, grouped by week; the two averages the headline compares; the event; the week with no record.',
    drawn: 'A unit chart: one square per record, filled when on a narrow street. Averages are dashed lines labelled in words.',
    recipe: 'cell: --space-2, 1px edge; before --x-proposed-data-ink, since the event --x-proposed-data-finding; event: dashed --x-proposed-event',
    never: 'A cell that isn’t a record, a week with no record drawn as a low week, or an average over weeks it doesn’t say.' },
  { id: 'records', name: 'Records', says: 'The rows behind the number, grouped as the picture groups them',
    carries: 'The rows the headline counted, in the groups the picture drew, each with its id, so anyone can check one.',
    drawn: 'A plain table, newest group first, a group line with its count; the rest of the records are one step away in Data Atlas.',
    recipe: 'rows --type-small, ids --font-mono --ink-muted; group lines --surface-inset; sticky head --slate-deep',
    never: 'Rows the headline didn’t count, or a count in a group line that differs from its rows.' }
];
const ST = { h: 0 };
function render() {
  $('#eb').textContent = `Briefing sheet · grammar · height · ${DATA.org}`;
  $('#lede').innerHTML = `A briefing can be read at three heights: the headline, the picture, the records. Moving between them keeps the number pinned where it is, so you never lose your place, and every height must add up to the same digits.`;
  $('#rails').innerHTML = H.map((h, i) => `<button class="rung" data-h="${i}"><span class="bar"></span><span><b>${h.name}</b><small>${esc(h.says)}</small></span><span class="k kbd">${i + 1}</span></button>`).join('');
  const where = { bottom: 'is the headline', picture: 'is the middle rung', workings: 'are the steps between picture and records', height: 'is the ladder itself', confidence: 'stays the same at every height' };
  $('#parts').innerHTML = `<span class="fh">The five parts on the ladder</span>` + DATA.parts.map(p => `<div>${ic(p.icon, 13)}<span><b>${esc(p.name)}</b> ${esc(where[p.id])}</span></div>`).join('');
  $('#anchor').innerHTML = `<span class="big">${S0.after}</span><span class="unit">${esc(DATA.kind.many)} ${esc(DATA.kind.per)}</span><span class="was">up from ${S0.before} before ${esc(DATA.event.date)}</span><span class="pin">${ic('pin', 11)}pinned at every height</span>`;
  const b = bottomLine();
  const weeks = DATA.weeks;
  $('#view').innerHTML = `
    <div class="lvl" data-l="0">
      <p class="hl">${b.s1.replace(`>${S0.after}</span>`, `>${S0.after}</span> ${spark(72, 18)}`)}</p>
      <p class="hl2">${b.s2}</p>
      <p class="pencil pencil-only hl2" style="font-size:var(--type-meta);line-height:var(--leading-meta);max-width:60ch"><span class="pencil-lab">${ic('pencil-line', 11)}suggested wording · assistant · not accepted</span><br>The North is missing far more bins since the rounds changed, mostly on the narrow streets.</p>
      <div class="emps" style="display:grid;gap:var(--space-1);margin-top:auto">${emp('norecord')}</div>
    </div>
    <div class="lvl" data-l="1">
      <p class="ptitle" style="margin:0">${pictureTitle()}, mostly on narrow streets</p>
      <div class="units" id="units" style="--n:${weeks.length}">${weeks.map(w => `<div class="wcol" data-wk="${w.wk}">${w.count == null ? `<span class="nr">${MK.norecord}</span>` : DATA.records.filter(r => r[2] === w.wk).map(r => `<i class="u ${r[4] ? 'nar' : ''} ${w.wk >= DATA.event.week ? 'f' : ''}" title="${r[0]} · ${esc(r[3])}"></i>`).join('')}</div>`).join('')}</div>
      <div class="wlabels" style="--n:${weeks.length}">${weeks.map(w => `<span>${w.count == null ? 'none' : 'w' + w.wk}</span>`).join('')}</div>
      <div class="legend"><span><i class="u f nar"></i>one record, narrow street</span><span><i class="u f"></i>one record, other street</span><span><i class="u nar"></i>before ${esc(DATA.event.date)}</span><span>${MK.norecord} no record, ${esc(DATA.gapDates)}</span></div>
    </div>
    <div class="lvl" data-l="2">
      <div class="recwrap"><table class="recs"><thead><tr>${[0, 1, 3, 5, 6, 7].map(i => `<th>${DATA.recordFields[i]}</th>`).join('')}<th>Narrow</th></tr></thead><tbody>
      ${S0.last4.slice().reverse().map(w => { const rs = DATA.records.filter(r => r[2] === w.wk).reverse(); return `<tr class="grp"><td colspan="7">WEEK ${w.wk} · ${rs.length} RECORDS · ${rs.filter(r => r[4]).length} ON NARROW STREETS</td></tr>` + rs.map(r => `<tr><td class="m">${r[0]}</td><td>${r[1].slice(5)}</td><td>${esc(r[3])}</td><td>${r[5]}</td><td class="m">${r[6]}</td><td>${r[7]}</td><td>${r[4] ? '<i class="nb" title="narrow street"></i>' : ''}</td></tr>`).join(''); }).join('')}
      </tbody></table></div>
    </div>`;
  Icons.hydrate();
  $$('.rung').forEach(r => r.onclick = () => go(+r.dataset.h));
  sizeUnits();
  update();
}
function sizeUnits() {
  const u = $('#units'); if (!u) return;
  const lvl = u.closest('.lvl'); const was = lvl.style.cssText; lvl.style.opacity = 0; lvl.classList.remove('above', 'below');
  const h = u.clientHeight - tok('--space-4'), colW = u.clientWidth / DATA.weeks.length - tok('--space-1');
  // fit the tallest week: k cells wide, rows bottom-up, so height stays linear in the count
  let cell = 14, k = 2;
  for (; cell > 3; cell--) { k = Math.ceil(S0.max / Math.floor(h / (cell + 1))); if (k * (cell + 1) <= colW) break; }
  u.style.setProperty('--cell', cell + 'px'); u.style.setProperty('--k', k);
  lvl.style.cssText = was;
  $$('.avg,.ev', u).forEach(e => e.remove());
  const yOf = v => u.clientHeight - (v / k) * (cell + 1);
  const colX = wk => { const c = $(`.wcol[data-wk="${wk}"]`, u); return [c.offsetLeft, c.offsetLeft + c.offsetWidth]; };
  const a = colX(S0.last4[0].wk)[0], z = colX(S0.last4[S0.last4.length - 1].wk)[1];
  u.insertAdjacentHTML('beforeend', `<div class="avg" style="left:${a}px;width:${z - a}px;top:${yOf(S0.afterExact)}px"><span>${S0.after} a week, last ${S0.afterN} weeks</span></div>`);
  const before = DATA.weeks.filter(w => w.wk < DATA.event.week);
  const b0 = colX(before[0].wk)[0], b1 = colX(before[before.length - 1].wk)[1];
  u.insertAdjacentHTML('beforeend', `<div class="avg b" style="left:${b0}px;width:${b1 - b0}px;top:${yOf(S0.beforeExact)}px"><span>${S0.before} a week before</span></div>`);
  const ex = colX(DATA.event.week)[0] - tok('--space-1') / 2;
  u.insertAdjacentHTML('beforeend', `<div class="ev" style="left:${ex}px"><span>${esc(DATA.event.date)}</span></div>`);
}
function update() {
  $$('.rung').forEach((r, i) => r.setAttribute('aria-current', i === ST.h));
  $$('.lvl').forEach((l, i) => { l.classList.toggle('above', i < ST.h); l.classList.toggle('below', i > ST.h); l.setAttribute('aria-hidden', i !== ST.h); });
  const h = H[ST.h];
  $('#gram').innerHTML = `<h2>${ic(['align-left', 'chart-column', 'rows-3'][ST.h], 16)}At the ${h.name.toLowerCase()} height</h2>
    <dl><dt>It carries</dt><dd>${esc(h.carries)}</dd><dt>Drawn as</dt><dd>${esc(h.drawn)}</dd><dt>Recipe</dt><dd class="rc">${esc(h.recipe)}</dd><dt>Never claims</dt><dd class="nv">${ic('ban', 13)}<span>${esc(h.never)}</span></dd></dl>
    <div class="emps"><span class="fh">What stays the same at every height</span>
      <p style="margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)">The cause keeps its word, ${cw(wordFor(DATA.claims[1].evidence, DATA.claims[1].agreement))}, at every height; at the records height each source also shows its grade.</p>
      ${emp('norecord')}
      <p class="pen pencil-only" style="margin:0;color:var(--ink-muted)">A model may suggest how to say the headline (pencil). It never sets the number or the word, and nothing it writes appears below the headline.</p>
    </div>`;
  Icons.hydrate($('#gram'));
  $('#check').innerHTML = `<span>${ic('scale', 12)} same digits:</span>
    <span class="${ST.h === 0 ? 'cur' : ''}">headline <b>${S0.after}</b></span><span>=</span>
    <span class="${ST.h === 1 ? 'cur' : ''}">picture <b>${S0.afterSum}</b> cells ÷ ${S0.afterN} weeks = ${S0.afterExact.toFixed(1)}</span><span>=</span>
    <span class="${ST.h === 2 ? 'cur' : ''}">records <b>${S0.recLast4}</b> rows ÷ ${S0.afterN}</span>
    <span class="ok">${ic('check', 12)}${S0.afterSum === S0.recLast4 ? 'they agree' : 'they differ'}</span>`;
  Icons.hydrate($('#check'));
}
function go(n) { ST.h = Math.max(0, Math.min(2, n)); update(); }
function boot() {
  clearTimers(); setTech(false); setGate(false); ST.h = 0;
  const w = $('#wrap'); w.classList.add('pre'); render();
  later(() => w.classList.remove('pre'), tok('--motion-instant'));
  later(() => go(1), tok('--motion-run'));
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowdown') { e.preventDefault(); clearTimers(); go(ST.h + 1); }
  else if (k === 'arrowup') { e.preventDefault(); clearTimers(); go(ST.h - 1); }
  else if (['1', '2', '3'].includes(k)) { clearTimers(); go(+k - 1); }
  else if (k === 't') setTech(!document.body.classList.contains('tech'));
  else if (k === 'g') setGate(!document.body.classList.contains('gate-off'));
  else if (k === 'r') boot();
});
addEventListener('resize', sizeUnits);
boot();
</script>
</body>
</html>
