<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Briefing · Grammar V5 · The appreciation</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@COMMON_CSS*/
:root{
  /* lane marks: who wrote a line. Records and people are ink; the assistant is pencil */
  --x-proposed-lane-w: var(--space-7);
}
.app{height:100vh;display:grid;grid-template-columns:calc(var(--measure-drawer) + var(--space-2)) minmax(0,1fr);gap:var(--space-6);padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1))}
.side{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.side .lede{max-width:none}
.gpart{display:flex;flex-direction:column;gap:var(--space-2);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.gpart h2{display:flex;align-items:center;gap:var(--space-2)}
.gpart dl{margin:0;display:grid;gap:var(--space-1)}
.gpart dt{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-top:var(--space-1)}
.gpart dd{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.gpart dd.rc{font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.gpart dd.nv{display:flex;gap:var(--space-2)}
.gpart dd.nv svg{flex:none;margin-top:2px;color:var(--x-proposed-disagree)}
.side .hints{margin-top:auto;flex-direction:column;align-items:flex-start}
.ndc{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border:1px solid var(--hairline);border-radius:var(--radius-key);padding:var(--space-2)}
.ndc b{font-weight:400;color:var(--light);font-family:var(--font-mono)}
/* the paper */
.paper{min-height:0;display:flex;flex-direction:column;border:1px solid var(--hairline-strong);border-radius:var(--radius-card);background:var(--surface-pane);box-shadow:var(--shadow-raised);overflow:hidden}
.phead{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,var(--x-proposed-lane-w));align-items:end;gap:0;padding:var(--space-3) 0 var(--space-2) var(--space-5);border-bottom:1px solid var(--hairline-strong)}
.phead .t{display:flex;flex-direction:column;gap:2px}
.phead .t b{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.phead .t span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.lanehd{display:flex;flex-direction:column;align-items:center;gap:2px;font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);letter-spacing:0;text-transform:uppercase;color:var(--ink-muted);text-align:center}
.lanehd.pen{color:var(--x-proposed-pencil-ink)}
.pbody{flex:1;min-height:0;overflow:auto;position:relative;scrollbar-width:thin}
.lanes{position:absolute;top:0;bottom:0;right:0;width:calc(var(--x-proposed-lane-w) * 3);display:grid;grid-template-columns:repeat(3,1fr);pointer-events:none}
.lanes i{border-left:1px solid var(--hairline)}
.lanes i.pen{border-left:1px dotted var(--x-proposed-pencil-ink);background:color-mix(in srgb,var(--info) 3%,transparent)}
.para{position:relative;display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) calc(var(--x-proposed-lane-w) * 3);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);cursor:pointer;transition:background var(--motion-base),filter var(--motion-slow),opacity var(--motion-slow)}
.para.sel{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.para .pn{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);text-align:right;padding-right:var(--space-3)}
.para.sel .pn{color:var(--light)}
.para h3{grid-column:2;margin:0 0 var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.ln{grid-column:2 / 4;display:grid;grid-template-columns:minmax(0,1fr) repeat(3,var(--x-proposed-lane-w));align-items:baseline;transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.ln > .tx{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);padding:2px var(--space-3) 2px 0}
.ln.big > .tx{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.ln .dc{display:flex;justify-content:center;align-self:center}
.ln .dot{display:block;justify-self:center;align-self:center;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill)}
.ln .dot.rec{background:var(--ink)}
.ln .dot.per{background:var(--x-proposed-here)}
.ln .dot.pen{border:var(--x-proposed-pencil-edge);background:transparent}
.ln.pen > .tx{color:var(--x-proposed-pencil-ink);font-style:italic}
.ln.pen > .tx .box{display:block;border:var(--x-proposed-pencil-edge);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2)}
.ln .acc{display:flex;gap:var(--space-2);align-items:center;margin-top:var(--space-1);font-style:normal}
.acc button{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink)}
.acc button:hover{color:var(--light);border-color:var(--ink-muted)}
.ln .was{display:block;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);font-style:normal}
.ln.gone{opacity:0;transform:translateX(var(--travel-near))}
.ln .src{font-size:var(--type-small);color:var(--ink-muted)}
.ln .gr{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:2px;padding:1px var(--space-1);color:var(--ink);margin-right:2px}
.ln .dis{border-left:2px solid var(--x-proposed-disagree);background:var(--x-proposed-disagree-wash);padding:0 var(--space-1)}
.ln .emp{font-size:var(--type-meta);line-height:var(--leading-meta)}
.act{display:inline-flex;align-items:center;gap:var(--space-2);margin:2px var(--space-2) 2px 0;padding:var(--space-1) var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.act small{color:var(--ink-muted)}
.pfoot{display:flex;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) var(--space-5);border-top:1px solid var(--hairline-strong);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.pfoot span{display:inline-flex;gap:var(--space-2);align-items:center}
.pfoot .dot{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);display:inline-block}
.pfoot .dot.rec{background:var(--ink)}.pfoot .dot.per{background:var(--x-proposed-here)}.pfoot .dot.pen{border:var(--x-proposed-pencil-edge)}
.gate-off .lanes i.pen{background:transparent}
@media (max-height: 820px){ .side .hints{flex-direction:row} .side{gap:var(--space-3)} .gpart dd.rc{display:none} .side .lede{display:none} .ln.big > .tx{font-size:var(--type-body);line-height:var(--leading-body)} .para{padding:var(--space-1) 0} }
</style>
</head>
<body>
<div class="app pre" id="wrap">
  <aside class="side dep" style="--i:0">
    <div>
      <p class="eyebrow" id="eb"></p>
      <h1>The appreciation</h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="ndc" id="ndc"></div>
    <div class="gpart" id="gpart"></div>
    <div class="hints">
      <span><span class="kbd">&uarr;</span><span class="kbd">&darr;</span> a paragraph and its rules</span>
      <span><span class="kbd">A</span> accept the pencilled wording</span>
      <span data-key="g"><span class="kbd">G</span> assistant off: the pencil lane empties</span>
      <span data-key="t"><span class="kbd">T</span> technical words</span>
      <span><span class="kbd">R</span> replay</span>
    </div>
  </aside>
  <article class="paper dep" style="--i:1">
    <header class="phead" id="phead"></header>
    <div class="pbody" id="pbody"></div>
    <footer class="pfoot" id="pfoot"></footer>
  </article>
</div>
<div class="x-cap"><b>Briefing grammar · V5</b> the appreciation: fixed paragraph order, a lane for who wrote each line · staff appreciation, BLUF, pencil and ink</div>
<script>
/*@DATA*/
const ST = { sel: 0, accepted: false };
const PEN_TEXT = 'Marta: since Greenway started we are missing far more bins than before, mostly on the narrow streets the old crews walked.';
const SECTIONS = [
  { part: 'bottom', title: 'Bottom line' },
  { part: 'workings', title: 'What we know', sub: 'from the records' },
  { part: 'confidence', title: 'What we judge', sub: 'a word from the yardstick, by rule' },
  { part: 'workings', title: 'What we don’t know', sub: 'each gap with its kind of empty' },
  { part: 'height', title: 'What it means for you', sub: 'where this can go next, reach first' }
];
const RULES = {
  0: { drawn: 'Two sentences, filled from the numbers by template. A model may pencil a wording beside them for the reader; it adds no claim.', never: DATA.parts[0].never, recipe: DATA.parts[0].recipe },
  1: { drawn: 'Counts and what the sources say, each with its tally of records. A source that disagrees is shown beside, not averaged in.', never: 'A judgement. Nothing here takes a confidence word: it is recorded.', recipe: DATA.parts[2].recipe },
  2: { drawn: 'Each judgement, its word, and the sources with their grades. Where the grid allows no word, it says what would settle it.', never: DATA.parts[4].never, recipe: DATA.parts[4].recipe },
  3: { drawn: 'Every gap that touches the bottom line, drawn with its mark, with who could fill it or whom to ask.', never: '“Nothing found” when the truth is “not looked”, “no record” or “not yours to see”.', recipe: 'the six empty marks at --space-5; plain word in --ink, the sentence in --ink-muted' },
  4: { drawn: 'The ways on: a briefing in Artifacts, the intent it feeds in Mandate, or a watch. Each says who would see it before you choose.', never: 'An action that reaches more people than it says, or one taken without the reader choosing it.', recipe: 'buttons --target-sm, reach in --ink-muted under the verb; no colour by app' }
};
function line(lane, html, cls = '') { return `<div class="ln ${cls}"><span class="tx">${html}</span>${['rec', 'per', 'pen'].map(l => `<span class="dc">${l === lane ? `<span class="dot ${l}" title="${{ rec: 'from the records', per: 'a person, by rule', pen: 'the assistant, pencil' }[l]}"></span>` : ''}</span>`).join('')}</div>`; }
function body() {
  const b = bottomLine();
  const c1 = DATA.claims[1], c2 = DATA.claims[2];
  const srcs = c => c.sources.map(s => `<span class="gr">${s[0]}</span>${esc(s[1])}`).join(' · ') + ' · ' + c.against.map(s => `<span class="dis"><span class="gr">${s[0]}</span>${esc(s[1])}: ${esc(s[2])}</span>`).join('');
  const sec = [
    [line('rec', b.s1, 'big'), line('per', b.s2.replace(/^That is/, 'That is'), 'big'),
      ST.accepted ? line('per', `${esc(PEN_TEXT)}<span class="was">drafted by the assistant · accepted by ${esc(DATA.viewer.name)}, ${esc(DATA.today)} · adds no claim</span>`, 'acc-line')
        : line('pen', `<span class="box"><span class="pencil-lab">${ic('pencil-line', 11)}suggested wording for ${esc(DATA.reader.split(',')[0])}</span><br>${esc(PEN_TEXT)}<span class="acc"><button id="acceptBtn">${ic('check', 13)}Accept wording</button><span class="src">links to ¶2.1 and ¶3.1; no new numbers</span></span></span>`, 'pen pencil-only')],
    [line('rec', `<span class="n">${S0.total}</span> ${esc(DATA.kind.many)} in the ${esc(DATA.log)}, ${esc(DATA.span)} ${tally(S0.total)} ${recWord()}`),
      line('rec', `<span class="n">${S0.beforeSum}</span> in the ${S0.beforeN} weeks before ${esc(DATA.event.date)}, <span class="n">${S0.afterSum}</span> in the last ${S0.afterN} weeks with records ${tally(S0.afterSum)}`),
      line('rec', `<span class="n">${S0.narrowAfter}%</span> of them on narrow streets since, against <span class="n">${S0.narrowBefore}%</span> before ${tally(S0.recAfter)}`),
      line('rec', `<span class="dis">Greenway’s own report says 18 a week in October</span> <span class="src">· grade C, reported, not checked · shown beside, not averaged in</span>`)],
    [line('per', `${esc(c1.text)} ${claimWord(c1)}<br><span class="src">${srcs(c1)}</span><span class="tk">evidence ${c1.evidence} × agreement ${c1.agreement}</span>`),
      line('per', `${esc(c2.text)} ${claimWord(c2)}<br><span class="src">${srcs(c2)} · would settle it: two weeks of logs after the recovery plan starts</span>`)],
    [line('rec', emp('norecord')), line('rec', emp('gap')), line('rec', emp('hidden')), line('rec', emp('stale'))],
    [line('per', DATA.actions.map(a => `<button class="act">${ic(a.icon, 14)}<span>${esc(a.verb)} <small>· ${esc(a.app)} · reaches ${esc(a.reach)}</small></span></button>`).join(''))]
  ];
  return `<div class="lanes"><i></i><i></i><i class="pen pencil-only"></i></div>` + SECTIONS.map((s, i) => `<section class="para dep" style="--i:${i + 2}" data-i="${i}"><span class="pn">${i + 1}</span><h3>${esc(s.title)}${s.sub ? ' · ' + esc(s.sub) : ''}</h3>${sec[i].join('')}</section>`).join('');
}
function render() {
  $('#eb').textContent = `Briefing sheet · grammar · ${DATA.org}`;
  $('#lede').innerHTML = `A staff appreciation’s order, kept fixed: the bottom line, what we know, what we judge, what we don’t know, what it means. Three lanes on the right say who wrote each line: the records, a person by rule, or the assistant in pencil.`;
  $('#phead').innerHTML = `<span class="t"><b>${esc(DATA.topic)}</b><span>For ${esc(DATA.reader)} · ${esc(DATA.today)} · kept on ${esc(DATA.floors[DATA.viewer.floor].name)}</span></span>
    <span class="lanehd">${ic('database', 13)}records</span><span class="lanehd">${ic('user-round', 13)}person</span><span class="lanehd pen pencil-only">${ic('pencil-line', 13)}assistant</span>`;
  $('#pbody').innerHTML = body();
  $('#pfoot').innerHTML = `<span><i class="dot rec"></i>from the records: ink, filled by template</span><span><i class="dot per"></i>a person, by rule: ink, signed</span><span class="pencil-only"><i class="dot pen"></i>the assistant: pencil until accepted, never counted</span>`;
  Icons.hydrate();
  wire();
  update();
}
function update() {
  $$('.para').forEach(p => p.classList.toggle('sel', +p.dataset.i === ST.sel));
  const r = RULES[ST.sel], part = DATA.parts.find(p => p.id === SECTIONS[ST.sel].part);
  $('#gpart').innerHTML = `<p class="fh">¶${ST.sel + 1} · ${esc(SECTIONS[ST.sel].title)}</p><h2>${ic(part.icon, 15)}${esc(part.name)}</h2>
    <dl><dt>Drawn as</dt><dd>${esc(r.drawn)}</dd><dt>Recipe</dt><dd class="rc">${esc(r.recipe)}</dd><dt>Never claims</dt><dd class="nv">${ic('ban', 12)}<span>${esc(r.never)}</span></dd></dl>`;
  Icons.hydrate($('#gpart'));
  const off = document.body.classList.contains('gate-off');
  $('#ndc').innerHTML = `${ic('scale', 14)}<span>Numbers on this paper: <b>${countInk()}</b> · ${off ? 'assistant off: ' : ''}the same with the assistant on or off</span>`;
  Icons.hydrate($('#ndc'));
}
/* numbers in ink only: pencil lines never hold one */
function countInk() { return $$('.ln:not(.pen) .n, .ln:not(.pen) .tally').length; }
function wire() {
  $$('.para').forEach(p => p.onclick = e => { if (e.target.closest('button')) return; ST.sel = +p.dataset.i; update(); });
  const a = $('#acceptBtn'); if (a) a.onclick = accept;
}
function accept() { if (ST.accepted || document.body.classList.contains('gate-off')) return; const l = $('.ln.pen'); if (l) l.classList.add('gone'); later(() => { ST.accepted = true; $('#pbody').innerHTML = body(); Icons.hydrate($('#pbody')); $$('.dep', $('#pbody')).forEach(d => d.style.transitionDelay = '0ms'); wire(); update(); }, tok('--motion-calm')); }
function boot() {
  clearTimers(); setTech(false); setGate(false); ST.sel = 0; ST.accepted = false;
  const w = $('#wrap'); w.classList.add('pre'); render();
  later(() => w.classList.remove('pre'), tok('--motion-instant'));
  later(() => { const b = $('#acceptBtn'); if (b) b.classList.add('lit'); b && (b.style.boxShadow = '0 0 0 var(--focus-ring) var(--x-proposed-lit)'); }, tok('--motion-run'));
  later(accept, tok('--motion-run') + tok('--motion-still'));
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowdown') { e.preventDefault(); ST.sel = Math.min(SECTIONS.length - 1, ST.sel + 1); update(); }
  else if (k === 'arrowup') { e.preventDefault(); ST.sel = Math.max(0, ST.sel - 1); update(); }
  else if (k === 'a') accept();
  else if (k === 't') setTech(!document.body.classList.contains('tech'));
  else if (k === 'g') { setGate(!document.body.classList.contains('gate-off')); update(); }
  else if (k === 'r') boot();
});
boot();
</script>
</body>
</html>
