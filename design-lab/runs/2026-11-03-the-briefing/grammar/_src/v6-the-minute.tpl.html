<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Briefing · Grammar V6 · The minute</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@COMMON_CSS*/
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));gap:var(--space-4)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5)}
.top .lede{max-width:84ch}
.body{display:grid;grid-template-columns:minmax(0,calc(var(--measure-read) + var(--space-8) + var(--space-5))) minmax(0,1fr);gap:var(--space-6);min-height:0}
.read{display:grid;grid-template-columns:var(--space-8) minmax(0,1fr);gap:var(--space-5);min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent;padding-bottom:var(--space-5);align-items:start}
/* the time ruler: lengths from word counts */
.ruler{position:relative;align-self:stretch}
.ruler .seg{position:absolute;left:0;right:0;border-top:1px solid var(--hairline-strong);display:flex;flex-direction:column;align-items:flex-end;padding-right:var(--space-3);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);transition:color var(--motion-base)}
.ruler .seg b{font-weight:400;color:var(--ink);font-size:var(--type-small)}
.ruler .seg.on{color:var(--light)}
.ruler .seg.on b{color:var(--light)}
.ruler .seg.after{border-top-style:dashed}
.ruler .axis{position:absolute;right:0;top:0;bottom:0;border-right:1px solid var(--hairline-strong)}
.ruler .end{position:absolute;right:0;left:0;border-top:1px solid var(--light);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--light);text-align:right;padding-right:var(--space-3);letter-spacing:var(--tracking-soft);text-transform:uppercase}
.ruler .ph{position:absolute;right:calc(var(--space-1) * -1);width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--x-proposed-lit);box-shadow:0 0 var(--glow-blur) var(--x-proposed-lit);transform:translateY(-50%);opacity:0;transition:opacity var(--motion-base)}
.playing .ruler .ph{opacity:1}
/* the briefing, read top to bottom */
.sheet{position:relative;display:flex;flex-direction:column;min-height:0}
.blk{padding:var(--space-2) 0;border-top:1px solid var(--hairline);transition:filter var(--motion-slow) var(--ease-out),opacity var(--motion-slow) var(--ease-out)}
.blk:first-child{border-top:0;padding-top:0}
.blk .fh{display:flex;justify-content:space-between}
.sheet .bl{font-size:var(--type-lead);line-height:var(--leading-lead)}
.sheet .bl .so{font-size:var(--type-body);line-height:var(--leading-body)}
.sheet .ptitle{margin-bottom:var(--space-1)}
.sheet .wk li{font-size:var(--type-small);line-height:var(--leading-small)}
.acts{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.act{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.act small{color:var(--ink-muted)}
.blk.after{border-top:1px dashed var(--hairline-strong);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);display:flex;gap:var(--space-2);align-items:center}
.blk.after b{font-weight:400;color:var(--ink)}
.cwline{margin:var(--space-1) 0 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
/* budgets */
.budget{display:flex;flex-direction:column;gap:var(--space-2);min-height:0;overflow:auto;scrollbar-width:thin;padding-right:var(--space-2)}
.total{display:flex;align-items:baseline;gap:var(--space-3);border-bottom:1px solid var(--hairline);padding-bottom:var(--space-2)}
.total .big{font-weight:200;font-size:var(--type-title);line-height:var(--leading-title);color:var(--light);font-variant-numeric:tabular-nums}
.total span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-2) var(--space-2);border-radius:var(--radius-key);transition:background var(--motion-base)}
.brow.on{background:var(--surface-raised)}
.brow h2{font-size:var(--type-meta);line-height:var(--leading-meta);display:flex;align-items:center;gap:var(--space-2)}
.brow .tm{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink);white-space:nowrap}
.brow .tm.over{color:var(--x-proposed-disagree)}
.brow .meter{grid-column:1 / -1;position:relative;height:var(--space-1);background:var(--hairline);border-radius:1px}
.brow .meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-muted);border-radius:1px}
.brow .meter i.over{background:var(--x-proposed-disagree)}
.brow .meter b{position:absolute;top:calc(var(--space-1) * -1);bottom:calc(var(--space-1) * -1);border-left:1px solid var(--light)}
.brow p{grid-column:1 / -1;margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.brow p.nv{display:flex;gap:var(--space-1)}
.brow p.nv svg{flex:none;margin-top:2px;color:var(--x-proposed-disagree)}
.brow p.nv b{font-weight:400;color:var(--ink)}
.brow .rc{font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);opacity:var(--x-proposed-quiet)}
@media (max-height: 820px){ .brow .rc{display:none} .sheet .ptitle{display:none} .brow{padding:var(--space-1) var(--space-2)} }
</style>
</head>
<body>
<div class="app pre" id="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="eb"></p>
      <h1>The reader’s minute</h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="hints">
      <span><span class="kbd">space</span> read it through, ten times fast</span>
      <span><span class="kbd">1</span>&ndash;<span class="kbd">5</span> one part</span>
      <span data-key="c"><span class="kbd">C</span> cut to the minute</span>
      <span data-key="g"><span class="kbd">G</span> assistant off</span>
      <span data-key="t"><span class="kbd">T</span> technical words</span>
      <span><span class="kbd">R</span> replay</span>
    </div>
  </header>
  <div class="body">
    <div class="read" id="read"><div class="ruler dep" style="--i:0" id="ruler"></div>
    <article class="sheet dep" style="--i:1" id="sheet"></article></div>
    <aside class="budget dep" style="--i:2" id="budget"></aside>
  </div>
</div>
<div class="x-cap"><b>Briefing grammar · V6</b> the reader’s minute: each part has a time budget measured from its words · newspaper inverted pyramid, BLUF, reading-time estimates</div>
<script>
/*@DATA*/
const M = DATA.minute;
const ST = { on: null, t: 0, cut: false };
const CUT = { steps: [0, 2, 3], empties: ['hidden'] };
const PARTS = [
  { id: 'bottom', name: 'Bottom line', icon: 'align-left', grammar: 'bottom', note: 'Read first, whole, by everyone.' },
  { id: 'picture', name: 'Picture', icon: 'chart-column', grammar: 'picture', note: 'One look; the title already said the finding.' },
  { id: 'workings', name: 'How we know', icon: 'list-ordered', grammar: 'workings', note: 'Read when someone asks “how do you know?”. Ends with the confidence word.' },
  { id: 'missing', name: 'What’s missing', icon: 'circle-dashed', grammar: 'confidence', note: 'Only the gaps that touch the bottom line.' },
  { id: 'next', name: 'What next', icon: 'corner-down-right', grammar: 'height', note: 'Where this can go, reach first.' }
];
function blocks() {
  const b = bottomLine();
  const c = DATA.claims[1];
  return {
    bottom: `<p class="bl">${b.s1} <span class="so">${b.s2}</span></p><p class="pencil pencil-only" style="margin:var(--space-2) 0 0;font-size:var(--type-small)"><span class="pencil-lab">${ic('pencil-line', 11)}suggested wording · assistant · not in the minute until accepted</span><br>Marta, we are missing far more bins since Greenway started, mostly on the narrow streets.</p>`,
    picture: `<p class="ptitle">${pictureTitle()}</p><div class="pbox"></div>`,
    workings: `${ST.cut ? `<ol class="wk">${steps().map((s, i) => CUT.steps.includes(i) ? `<li class="${s[2]}"><span class="no">${String(i + 1).padStart(2, '0')}</span><span>${esc(s[0])}</span><span class="ct">${s[2] === 'out' ? MK.norecord : esc(s[1])}</span></li>` : '').join('')}</ol><p class="cwline">${steps().length - CUT.steps.length} more steps, one step away</p>` : stepsHTML()}<p class="cwline">Cause: ${esc(c.text.toLowerCase().replace(/\.$/, ''))} — ${cw(wordFor(c.evidence, c.agreement))}, ${c.sources.length} sources agree, ${c.against.length} disagrees.</p>`,
    missing: `<div style="display:grid;gap:var(--space-1)">${(ST.cut ? CUT.empties : ['hidden', 'gap']).map(emp).join('')}</div>`,
    next: `<div class="acts">${DATA.actions.map(a => `<button class="act">${ic(a.icon, 14)}<span>${esc(a.verb)} <small>· reaches ${esc(a.reach)}</small></span></button>`).join('')}</div>`
  };
}
const words = el => { const c = el.cloneNode(true); $$('.pencil-only, .tk, svg', c).forEach(e => e.parentNode.removeChild(e)); return (c.textContent.trim().match(/\S+/g) || []).length; };
let SEC = [];
function measure() {
  SEC = PARTS.map(p => { const el = $(`.blk[data-p="${p.id}"]`); const w = words(el); const s = Math.round(w / (M.wpm / 60)) + (p.id === 'picture' ? M.pictureSeconds : 0); return { ...p, words: w, s, budget: M.budget[p.id] }; });
}
function render() {
  $('#eb').textContent = `Briefing sheet · grammar · ${DATA.org}`;
  $('#lede').innerHTML = `A manager gives a briefing a minute. Each part gets a share of it, measured from its own words at ${M.wpm} words a minute, so the sheet can say when a part runs long, and what to cut. The records come after the minute, one step away.`;
  const B = blocks();
  $('#sheet').innerHTML = PARTS.map((p, i) => `<section class="blk" data-p="${p.id}"><p class="fh"><span>${i + 1} · ${esc(p.name)}</span></p>${B[p.id]}</section>`).join('') +
    `<section class="blk after" data-p="records">${ic('rows-3', 14)}<span><b>After the minute:</b> the ${S0.recLast4} records behind ${S0.after} a week, the ${S0.total} behind the whole picture, one step away in ${esc(DATA.app.atlas)}.</span></section>`;
  Icons.hydrate($('#sheet'));
  const pb = $('.pbox'); pb.innerHTML = weekChart({ w: Math.min(pb.clientWidth, 560) - 28, h: innerHeight < 820 ? 72 : 96, labels: true, every: 3, title: pictureTitle() });
  measure();
  drawRuler();
  drawBudget();
  Icons.hydrate();
  $$('.blk[data-p]').forEach(b => b.onclick = () => focusPart(ST.on === b.dataset.p ? null : b.dataset.p));
}
function drawRuler() {
  const r = $('#ruler'), sh = $('#sheet');
  let html = '<span class="axis"></span>', t = 0;
  SEC.forEach(s => { const el = $(`.blk[data-p="${s.id}"]`); html += `<div class="seg" data-p="${s.id}" style="top:${el.offsetTop}px;height:${el.offsetHeight}px"><b>${t}s</b>${s.s}s</div>`; t += s.s; });
  const rec = $('.blk.after');
  html += `<div class="end" style="top:${rec.offsetTop}px">${t}s · the minute</div><div class="ph" id="ph"></div>`;
  r.innerHTML = html;
}
function drawBudget() {
  const total = SEC.reduce((a, s) => a + s.s, 0), over = SEC.filter(s => s.s > s.budget);
  const g = id => DATA.parts.find(p => p.id === id);
  $('#budget').innerHTML = `<div class="total"><span class="big">${total}s</span><span>to read, from ${SEC.reduce((a, s) => a + s.words, 0)} words and one picture.<br>${total <= 60 ? 'Inside the minute.' : 'Over the minute by ' + (total - 60) + 's.'} ${over.length ? `${esc(over.map(o => o.name).join(', '))} ${over.length > 1 ? 'run' : 'runs'} long: cut there first${ST.cut ? '' : ' (C)'}.` : 'Every part within its budget.'}${ST.cut ? ' Cut lines wait one step away; nothing is deleted.' : ''}<span class="tk">reading speed ${M.wpm} wpm · picture ${M.pictureSeconds}s · budgets from the deployment</span></span></div>` +
    SEC.map((s, i) => { const gp = g(s.grammar); const mx = Math.max(s.s, s.budget) * 1.15; return `<div class="brow" data-p="${s.id}">
      <h2>${ic(s.icon, 14)}${i + 1} · ${esc(s.name)}</h2><span class="tm ${s.s > s.budget ? 'over' : ''}">${s.s}s of ${s.budget}s</span>
      <span class="meter"><i class="${s.s > s.budget ? 'over' : ''}" style="width:${s.s / mx * 100}%"></i><b style="left:${s.budget / mx * 100}%"></b></span>
      <p>${esc(s.note)} ${s.id === 'picture' ? '' : `${s.words} words.`}</p>
      <p class="nv">${ic('ban', 12)}<span><b>Never claims:</b> ${esc(s.id === 'missing' ? '“nothing found” when it means “not looked”, “no record” or “not yours to see”.' : s.id === 'next' ? 'a reach smaller than the truth, or an action taken before the reader chooses it.' : gp.never)}</span></p>
      <p class="rc">${esc(s.id === 'missing' ? 'six empty marks at --space-5; plain word --ink, sentence --ink-muted' : s.id === 'next' ? 'buttons --target-sm, the reach in --ink-muted after the verb; no colour by app' : gp.recipe)}</p></div>`; }).join('');
}
function focusPart(id) {
  ST.on = id;
  $$('.blk').forEach(b => b.classList.toggle('racked', !!id && b.dataset.p !== id));
  $$('.seg').forEach(b => b.classList.toggle('on', b.dataset.p === id));
  $$('.brow').forEach(b => b.classList.toggle('on', b.dataset.p === id));
}
/* read it through at ten times speed: the playhead walks the ruler, focus follows */
function play() {
  clearTimers();
  const segs = SEC.map(s => ({ s, el: $(`.seg[data-p="${s.id}"]`) }));
  $('#wrap').classList.add('playing');
  const ph = $('#ph');
  let t = 0;
  segs.forEach(({ s, el }) => {
    const top = el.offsetTop, h = el.offsetHeight, dur = s.s * 100;
    const steps = Math.max(2, Math.round(dur / tok('--motion-quick')));
    for (let k = 0; k <= steps; k++) later(() => { ph.style.top = (top + h * k / steps) + 'px'; if (k === 0) focusPart(s.id); }, t + dur * k / steps);
    t += dur;
  });
  later(() => { focusPart(null); $('#wrap').classList.remove('playing'); }, t + tok('--motion-calm'));
}
function boot() {
  clearTimers(); setTech(false); setGate(false); ST.cut = false; $$('[data-key=c]').forEach(e => e.classList.toggle('on', false)); focusPart(null); $('#wrap').classList.remove('playing');
  const w = $('#wrap'); w.classList.add('pre'); render();
  later(() => w.classList.remove('pre'), tok('--motion-instant'));
  later(play, tok('--motion-run'));
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); play(); }
  else if (k >= '1' && k <= '5') { clearTimers(); $('#wrap').classList.remove('playing'); focusPart(PARTS[+k - 1].id); }
  else if (k === 'escape' || k === '0') { clearTimers(); focusPart(null); }
  else if (k === 'c') { ST.cut = !ST.cut; $$('[data-key=c]').forEach(e => e.classList.toggle('on', ST.cut)); render(); }
  else if (k === 't') setTech(!document.body.classList.contains('tech'));
  else if (k === 'g') { setGate(!document.body.classList.contains('gate-off')); measure(); drawRuler(); drawBudget(); Icons.hydrate($('#budget')); }
  else if (k === 'r') boot();
});
addEventListener('resize', () => { render(); });
boot();
</script>
</body>
</html>
