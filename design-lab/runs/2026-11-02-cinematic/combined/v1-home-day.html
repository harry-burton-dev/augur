<style>
/* ======================================================================
   Proposed tokens. Every one is "needs token" in notes-v1.md.
   ====================================================================== */
:root{
  --x-far-blur: 6px;            /* needs token: out-of-focus plane while an active surface is up (rack focus) */
  --x-far-saturate: .35;        /* needs token: saturation kept on that plane */
  --x-far-scale: .995;          /* needs token: depth decoupling, the lens refocusing closer */
  --x-dof-step: 3px;            /* needs token: blur per plane of distance from the focal plane */
  --x-dof-saturate: .55;        /* needs token: saturation per plane of distance */
  --x-ambient-blur: .4px;       /* needs token: soft focus on ambient telemetry (kept low for legibility) */
  --x-ambient-opacity: .82;     /* needs token: ambient presence; above .8 so ink-muted text still passes AA */
  --x-type-micro: .6875rem;     /* needs token: 11px mono caps and numerals */
  --x-ribbon-h: calc(var(--space-7) + var(--space-2));   /* needs token: ambient ribbon height (two lines of body) */
  --x-pattern-unavailable: repeating-linear-gradient(135deg, transparent 0 6px, var(--hairline) 6px 7px);   /* needs token: shadow hatch */
  --x-pattern-over-danger: repeating-linear-gradient(135deg, color-mix(in srgb, var(--danger) 55%, transparent) 0 3px, transparent 3px 6px);   /* needs token: "past its limit" hatch */
  --x-pattern-over-warning: repeating-linear-gradient(135deg, color-mix(in srgb, var(--warning) 50%, transparent) 0 3px, transparent 3px 6px);
  /* the letterbox frame (PDR-009): full width, height from --letterbox-ratio */
  --lb-h: min(100vh, calc(100vw / var(--letterbox-ratio)));
  --lb-bar: calc((100vh - var(--lb-h)) / 2);
  /* geometry of the three planes */
  --near-l: var(--space-7);
  --near-w: min(calc(var(--measure-wide) - var(--space-8) - var(--space-4)), 50vw);
  --lens-w: calc(var(--space-8) + var(--space-5));
  --mid-w: min(calc(var(--measure-card) + var(--space-8) + var(--space-2)), 31vw);
}

/* ---------- ground ---------- */
body{background:
  radial-gradient(80% 60% at 14% 112%, color-mix(in srgb,var(--floor-you-low) 42%,transparent), transparent 70%),
  radial-gradient(60% 50% at 92% -12%, color-mix(in srgb,var(--green) 9%,transparent), transparent 70%),
  radial-gradient(120% 90% at 50% 40%, var(--slate), var(--slate-deep))}
button{font:inherit;color:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.micro{font:400 var(--x-type-micro)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
kbd{font:500 var(--x-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);letter-spacing:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ======================================================================
   STAGE: everything that steps back when focus moves to an active surface
   ====================================================================== */
#stage{position:fixed;inset:0;transform:translateZ(0);transform-origin:50% 45%;will-change:filter,transform;
  transition:filter var(--motion-calm) var(--ease-standard),transform var(--motion-calm) var(--ease-standard),opacity var(--motion-calm) var(--ease-standard)}
body.attn #stage{filter:blur(var(--x-far-blur)) saturate(var(--x-far-saturate));transform:translateZ(0) scale(var(--x-far-scale))}
body.briefing #stage{filter:blur(calc(var(--x-far-blur) * 1.5)) saturate(var(--x-far-saturate));transform:translateZ(0) scale(var(--x-far-scale));opacity:.55}

/* ---------- top band (shell) ---------- */
.band{position:absolute;left:0;right:0;top:0;height:var(--band-top);display:flex;align-items:center;padding:0 var(--edge);z-index:3;
  background:linear-gradient(to bottom,color-mix(in srgb,var(--slate-deep) 70%,transparent),transparent)}
.band .app{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding-top:var(--space-2)}
.band .app i{display:block;width:var(--space-6);height:3px;border-radius:var(--radius-pill);background:var(--floor-you-high);opacity:.8}
.band .app b{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;padding-left:var(--tracking-title)}
.band .right{margin-left:auto;display:flex;align-items:center;gap:var(--space-4)}
.band .clock{text-align:right}
.band .clock b{display:block;font:400 var(--type-meta)/var(--leading-meta) var(--font-sans);letter-spacing:var(--tracking-soft);color:var(--ink)}
.ib{width:var(--target-sm);height:var(--target-sm);display:grid;place-items:center;border-radius:var(--radius-key);border:1px solid var(--hairline);background:var(--surface-inset);color:var(--ink-muted);cursor:pointer}
.ib:hover{color:var(--ink);border-color:var(--hairline-strong)}

/* floor control: altitude window box (Floors V1), with traffic above and below */
.floor{display:flex;align-items:stretch;height:var(--target-md);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--surface-pane);
  box-shadow:inset var(--space-1) 0 0 0 var(--floor-you-high);cursor:pointer;padding:0;text-align:left;--fc:var(--floor-you-high)}
.floor:hover{border-color:color-mix(in srgb,var(--fc) 60%,var(--hairline-strong))}
.floor .nm{display:flex;flex-direction:column;justify-content:center;padding:0 var(--space-4) 0 calc(var(--space-4) + var(--space-1))}
.floor .nm em{font-style:normal;color:var(--fc);font:400 var(--x-type-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase}
.floor .nm span{font-size:var(--type-meta);line-height:var(--leading-meta)}
.floor .tf{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 var(--space-3);border-left:1px solid var(--hairline);font:400 var(--x-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.floor .tf>span{display:flex;align-items:center;gap:var(--space-1);min-height:var(--space-4);border-radius:2px;padding:0 2px}
.floor .tf b{font-weight:400;color:var(--ink);min-width:1ch}
.floor .tf svg{color:var(--ink-muted)}
.dia{display:inline-block;width:var(--space-2);height:var(--space-2);transform:rotate(45deg);background:var(--c);box-shadow:0 0 var(--space-2) color-mix(in srgb,var(--c) 60%,transparent);margin:0 2px}
.dia.off{background:none;outline:1px solid var(--hairline-strong);box-shadow:none}
.dg{display:inline-flex;align-items:center;gap:0;cursor:help;padding:2px;border-radius:2px}
.dg:hover,.dg:focus-visible{background:color-mix(in srgb,var(--ink) 10%,transparent)}

/* key hints */
.hints{position:absolute;right:var(--edge);top:calc(var(--band-top) + var(--space-1));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-2) var(--space-3);letter-spacing:var(--tracking-caps);z-index:3;max-width:calc(100vw - var(--near-l) - var(--near-w) - var(--space-5))}
.hints span{display:flex;align-items:center;gap:var(--space-1)}

/* ======================================================================
   PLANES (Home V2): near = Needs you, mid = New, far = Worth knowing
   ====================================================================== */
.plane{position:absolute;inset:var(--band-top) 0 var(--x-ribbon-h) 0;pointer-events:none;will-change:filter,opacity;transform:translateZ(0);
  transition:filter var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out),translate var(--motion-calm) var(--ease-out)}
.plane>*{pointer-events:auto}
.plane[data-d="0"]{filter:none;opacity:1}
.plane[data-d="1"]{filter:blur(var(--x-dof-step)) saturate(var(--x-dof-saturate));opacity:.6}
.plane[data-d="2"]{filter:blur(calc(var(--x-dof-step) * 2)) saturate(calc(var(--x-dof-saturate) * .5));opacity:.36}
.plane[data-d="2"]>*{pointer-events:none}
.plane:not([data-d="0"]) .row,.plane:not([data-d="0"]) .chip,.plane:not([data-d="0"]) .w{cursor:zoom-in}
.eyebrow{display:flex;align-items:center;gap:var(--space-3);margin:0 0 var(--space-4)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--hairline)}

/* far: worth knowing, a wall of type */
#far .wall{position:absolute;inset:var(--space-6) calc(var(--lens-w) + var(--space-5)) var(--space-5) var(--space-6);display:flex;flex-wrap:wrap;align-content:space-between;gap:var(--space-5) var(--space-6);pointer-events:none}
#far .w{pointer-events:auto;background:none;border:0;padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);text-align:left;cursor:pointer;
  font:200 var(--type-title-s)/1 var(--font-sans);letter-spacing:var(--tracking-soft);color:color-mix(in srgb,var(--ink) 55%,transparent);white-space:nowrap}
#far .w small{display:block;font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-top:var(--space-2)}
#far[data-d="0"] .w{color:var(--ink)}
#far[data-d="0"] .w:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
#far .w.shadow{color:color-mix(in srgb,var(--ink) 40%,transparent);background:var(--x-pattern-unavailable);border:1px dashed var(--hairline-strong)}
#far .w.shadow small{color:var(--ink-muted);white-space:normal;max-width:var(--measure-card);line-height:1.5}

#mid .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}

.chip .t{font:400 var(--type-meta)/var(--leading-meta) var(--font-sans);letter-spacing:var(--tracking-soft)}
.chip .n{margin-top:auto;font:200 var(--type-heading)/1 var(--font-sans);color:var(--ink)}

  b.setAttribute('aria-label', `Floor: ${f.level}, ${f.name}. ${sum(above)} need you from floors above, ${sum(below)} from below. Open floors`);

/* ---------- ambient ribbon: Tufte sparklines inside a sentence ---------- */
function spark(vals, o = {}) {
  const w = o.w || PX('space-7') - PX('space-3'), h = o.h || PX('space-4');
  const lo = Math.min(...vals, o.band ? o.band[0] : Infinity), hi = Math.max(...vals, o.band ? o.band[1] : -Infinity);
  const x = i => (i / (vals.length - 1)) * w, y = v => h - ((v - lo) / ((hi - lo) || 1)) * h;
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const band = o.band ? `<rect x="0" y="${y(o.band[1])}" width="${w}" height="${Math.max(1, y(o.band[0]) - y(o.band[1]))}" style="fill:var(--ink-muted)" opacity=".16"/>` : '';
  const mi = vals.indexOf(Math.min(...vals)), ma = vals.lastIndexOf(Math.max(...vals));
  const ext = o.ext ? `<circle cx="${x(mi)}" cy="${y(vals[mi])}" r="1.6" style="fill:var(--ink-muted)"/><circle cx="${x(ma)}" cy="${y(vals[ma])}" r="1.6" style="fill:var(--ink-muted)"/>` : '';
  return `<svg class="sp" width="${o.full ? '100%' : w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${band}
    <polyline points="${pts}" fill="none" style="stroke:var(--ink)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${ext}
    <circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="${o.r || 2}" style="fill:${o.end || 'var(--ink)'}"/></svg>`;
}
const progress = p => { const w = PX('space-6'); return `<svg class="sp" width="${w}" height="${PX('space-3')}" aria-hidden="true"><rect x="0" y="5" width="${w}" height="2" style="fill:var(--hairline-strong)"/><rect x="0" y="4" width="${w * p}" height="4" style="fill:var(--ink)"/></svg>`; };
function phrase(p) {
  if (p.locked) return `<button class="ph locked" data-id="${p.id}" aria-label="${esc(p.tpl)}. ${esc(p.reason + ' ' + p.who)}">${esc(p.tpl)}${ic('circle-slash', 14)}</button>`;
  const g = p.series ? spark(p.series, { band: p.band, end: p.warn ? 'var(--warning)' : null }) : p.progress != null ? progress(p.progress) : p.ember != null ? `<i class="ember" style="--age:${p.ember}"></i>` : '';
  return `<button class="ph ${p.warn ? 'warn' : ''}" data-id="${p.id}">${esc(p.tpl).replace('{v}', `<b>${esc(p.v)}</b>`)}${g}</button>`;
}
function renderRibbon() {

  $$('.ph').forEach(b => { b.onmouseenter = b.onfocus = () => macro(b.dataset.id); });
  $('#ribbon').onmouseleave = () => macro(null);
  $('#ribbon').addEventListener('focusout', e => { if (!$('#ribbon').contains(e.relatedTarget)) macro(null); });
}
function macro(id) {
  const m = $('#macro');
  if (!id || S.overlay) { m.classList.remove('on'); return; }

  m.innerHTML = DATA.ribbon.map(p => {

    const s = p.series;
    return `<div class="mm ${p.id === id ? 'lit' : ''}"><h4>${esc(p.label)}</h4><div class="big">${esc(p.v)}</div>
      ${s ? spark(s, { band: p.band, full: true, w: 160, h: PX('space-6'), ext: true, r: 2.5, end: p.warn ? 'var(--warning)' : null }) + `<div class="rg"><span>−24 h</span><span>${Math.min(...s)}–${Math.max(...s)}</span></div>`
        : p.ember != null ? `<p>No sync for ${esc(p.v)}. The light cools as it goes stale.</p>` : `<p>${Math.round(p.progress * 100)}% of the wait until the window.</p>`}</div>`;
  }).join('') + `<div class="foot">${esc(L.macroFoot)}</div>`;
  m.classList.add('on');

/* ======================================================================
   Focus: rack between planes, cursor, lift
   ====================================================================== */
function rack(k, user) {
  S.plane = k;
  $$('.plane').forEach(p => p.dataset.d = Math.abs(+p.dataset.plane - k));
  markLens(); paintCursor(user);
}
function items(p) { return p === 0 ? $$('#list .row') : p === 1 ? $$('#news .chip') : $$('#wall .w'); }
function paintCursor(focus) {
  $$('.row.cur,.chip.cur,#far .w.cur').forEach(e => { e.classList.remove('cur', 'glint'); e.tabIndex = -1; });
  const els = items(S.plane); if (!els.length) return;
  S.cur[S.plane] = Math.max(0, Math.min(S.cur[S.plane], els.length - 1));
  const el = els[S.cur[S.plane]]; el.classList.add('cur'); el.tabIndex = 0;
  if (!reduce) { el.classList.remove('glint'); void el.offsetWidth; el.classList.add('glint'); }
  if (focus) el.focus({ preventScroll: true });
}
function move(d) {
  const n = items(S.plane).length; if (!n) return;
  S.cur[S.plane] = (S.cur[S.plane] + d + n) % n; paintCursor(true);
}
function clickItem(p, k) {
  if (S.overlay === 'brief') return;
  if (S.plane !== p) { S.cur[p] = k; rack(p, true); return; }   // first click on a soft plane pulls focus to it
  S.cur[p] = k; paintCursor(true); open(p, k);
}
function lift(el) {
  if (!el) return;
  const b = el.getBoundingClientRect(), c = el.cloneNode(true);
  c.classList.remove('glint'); c.removeAttribute('tabindex');
  Object.assign(c.style, { left: b.left + 'px', top: b.top + 'px', width: b.width + 'px', height: b.height + 'px' });
  $('#lift').replaceChildren(c); el.style.visibility = 'hidden'; S.lifted = el;
}
function unlift() { $('#lift').replaceChildren(); if (S.lifted) S.lifted.style.visibility = ''; S.lifted = null; }

/* ======================================================================
   Drawer (rack focus attenuation; the opened item stays lit)
   ====================================================================== */
function itemAt(p, k) { return p === 0 ? S.needs[k] : p === 1 ? S.news[k] : S.ambient[k]; }
function fullTape(t, warn) {
  if (!t) return '';
  const over = t.now > t.limit, endLim = t.limit >= .99;
  return `<div class="tape ${warn ? 'warn' : ''}" aria-hidden="true"><span class="rail"></span><span class="el" style="width:${Math.min(t.now, t.limit) * 100}%"></span>
    ${over ? `<span class="ov" style="left:${t.limit * 100}%;width:${(t.now - t.limit) * 100}%"></span>` : ''}
    <span class="mk start micro">${esc(t.a)}</span><span class="mk lim micro ${endLim ? 'end' : ''}" style="left:${t.limit * 100}%">${esc(t.limitL)}</span>
    <span class="mk now micro ${t.now > .9 ? 'end' : ''}" style="left:${t.now * 100}%">Now</span></div>`;
}
function actsHTML(acts) {
  return acts.map((a, i) => a.off
    ? `<button class="btn" aria-disabled="true" data-i="${i}">${ic('lock', 16)}${esc(a.l)}</button><div class="btn-why">${esc(a.off)} Ask <b>${esc(a.who)}</b>.</div>`
    : `<button class="btn ${a.primary ? 'primary' : ''}" data-i="${i}">${esc(a.l)}${a.k ? `<kbd>${esc(a.k)}</kbd>` : ''}</button>`).join('');
}
function open(p, k) {
  closeMenu(true);
  const n = itemAt(p, k); if (!n) return;
  S.drawerFor = { p, k, id: n.id };
  const trail = p === 0 ? [DATA.app, L.near, n.app] : p === 1 ? [DATA.app, L.mid, n.app] : [DATA.app, L.far];

  // a phrase in the ribbon changes (flicker), then a New item escalates into Needs you (focus pull)
  const p = DATA.ribbon.find(r => r.id === DATA.demo.change), b = $(`.ph[data-id="${p.id}"]`);
  if (b) { b.querySelector('b').textContent = DATA.demo.changeV; if (!reduce) { b.classList.add('flicker'); } $('#sent').classList.add('sharp'); later(T('still'), () => { $('#sent').classList.remove('sharp'); b.classList.remove('flicker'); }); }
  later(T('slow'), () => escalate(DATA.demo.escalate));
}
function run(full) {
  reset();
  if (full) store.del(DATA.session.key);
  if (shouldBrief()) { brief(true); return; }
  // already briefed this session: the lens hunts, racks in, then the escalation plays
  later(T('slow'), () => rack(2));
  later(T('slow') + T('calm'), () => rack(0, true));
  later(T('slow') + T('calm') + T('run'), demoEscalation);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const k = e.key;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.overlay === 'brief') {
    e.preventDefault();
    if (k === 'r' || k === 'R') return run(true);
    if (k === 'Enter' && S.phase === 3) { const top = actionable()[0]; return release(() => open(0, S.needs.indexOf(top))); }
    if (k === 'Tab' && S.phase === 3) { const bs = $$('#frame .btn,#backT button'); const i = bs.indexOf(document.activeElement); bs[(i + (e.shiftKey ? -1 : 1) + bs.length) % bs.length].focus(); return; }
    return release();   // any other key skips to Home
  }
  if (k === 'u' || k === 'U') { if (S.undo) return doUndo(); }
  if (S.overlay === 'menu') {
    const bs = $$('#menu button');
    if (k === 'Escape') return closeMenu();
    if (k === 'ArrowDown' || k === 'ArrowUp' || k === 'j' || k === 'k') { e.preventDefault(); const i = bs.indexOf(document.activeElement); bs[(i + (k === 'ArrowDown' || k === 'j' ? 1 : -1) + bs.length) % bs.length].focus(); return; }
    if (k === 'Enter' || k === ' ') { if (document.activeElement?.closest('#menu')) { e.preventDefault(); menuAct(+document.activeElement.dataset.i); } return; }
    const hit = S.menuActs.findIndex(it => it && it.k && it.k.toLowerCase() === k.toLowerCase() && it.k.length === 1);
    if (hit >= 0) { e.preventDefault(); menuAct(hit); }
    return;
  }
  if (S.overlay === 'drawer') {
    if (k === 'Escape') return closeDrawer();
    const d = S.drawerFor; const n = d && itemAt(d.p, d.k);
    if (d && d.p === 0 && n && n.actions && !n.done && k.length === 1) {
      const i = n.actions.findIndex(a => !a.off && a.k && a.k.toLowerCase() === k.toLowerCase());
      if (i >= 0) { e.preventDefault(); drawerAct($(`#drawer .btn[data-i="${i}"]`)); }
    }
    return;
  }
  if (S.overlay === 'floor') { if (k === 'Escape' || k === 'f' || k === 'F') closeFloors(); if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); const bs = $$('#floors .fr'); const i = bs.indexOf(document.activeElement); bs[(i + (k === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length].focus(); } return; }
  if (k === 'r' || k === 'R') return run(true);
  if (k === 'b' || k === 'B') return brief(false);
  if (k === 'f' || k === 'F') return openFloors();
  if (k === '1' || k === '2' || k === '3') return rack(+k - 1, true);
  if (k === 'j' || k === 'ArrowDown' || k === 'ArrowRight') { e.preventDefault(); return move(1); }
  if (k === 'k' || k === 'ArrowUp' || k === 'ArrowLeft') { e.preventDefault(); return move(-1); }
  if (k === 'Enter') { if (document.activeElement?.closest('.ribbon,.band,.lens')) return; e.preventDefault(); return open(S.plane, S.cur[S.plane]); }
  if (k === ' ') { if (document.activeElement?.closest('.ribbon,.band,.lens')) return; e.preventDefault(); return escalate(S.plane === 1 ? S.news[S.cur[1]]?.id : null); }
  if (k === 'ContextMenu' || (k === 'F10' && e.shiftKey)) { e.preventDefault(); return showMenu(S.plane, S.cur[S.plane]); }
});
$('#floorBtn').onclick = e => { e.stopPropagation(); openFloors(); };
$('#brief').addEventListener('click', e => { if (S.phase && S.phase < 3) release(); });

// a slight parallax on the far planes; off under reduced motion
if (!reduce) addEventListener('mousemove', e => {
  if (S.overlay) return;
  const dx = e.clientX / innerWidth - .5, dy = e.clientY / innerHeight - .5;
  $$('.plane').forEach(p => { const z = +p.dataset.plane; p.style.translate = `${-dx * z * PX('space-2')}px ${-dy * z * PX('space-1')}px`; });
});

renderBand();
run(false);
</script>
</body>
