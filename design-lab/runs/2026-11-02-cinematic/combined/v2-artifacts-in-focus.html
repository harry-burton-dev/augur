/* =====================================================================
   Proposed tokens (not in kit-common yet; every one is "needs token" in notes-v2.md)
   ===================================================================== */
:root{
  /* Focal planes: depth = distance from the focal plane (focus V1). One set for the whole app. */
  --x-focus-far-blur: 6px;        /* proposed --focus-far-blur (radial used 6, focus used 8: settled on 6, see notes) */
  --x-focus-far-saturate: .45;    /* proposed --focus-far-saturate */
  --x-focus-far-dim: .82;         /* proposed --focus-far-dim: brightness(), never a black scrim */
  --x-focus-far-scale: .995;      /* proposed --focus-far-scale (Harry's 0.995) */
  --x-focus-deep-blur: 14px;      /* proposed --focus-deep-blur */
  --x-focus-deep-saturate: .3;    /* proposed --focus-deep-saturate */
  --x-focus-deep-dim: .72;        /* proposed --focus-deep-dim */
  --x-focus-deep-scale: .99;      /* proposed --focus-deep-scale (never below .99) */
  --x-focus-near-blur: 1.5px;     /* proposed --focus-near-blur: ambient items at rest (dark cockpit) */
  --x-motion-rack: var(--motion-slow);       /* proposed --motion-rack: menu, drawer, palette */
  --x-motion-pull: var(--motion-calm);       /* proposed --motion-pull: escalation pull and letterbox */
  --x-focus-idle-wait: var(--motion-run);    /* proposed --focus-idle-wait: quiet input before a pull */
  /* Lit path (focus V2) */
  --x-path-dim-1: .64;            /* proposed --path-dim-1 */
  --x-path-dim-2: .44;            /* proposed --path-dim-2 */
  --x-path-dim-3: .3;             /* proposed --path-dim-3 (hover and focus always restore 1) */
  --x-path-soft: .6px;            /* proposed --path-soft */
  /* RadialMenu geometry and timing (radial V1 + V5 + V6) */
  --x-radial-hub: var(--target-md);                          /* cancel zone radius, 48 */
  --x-radial-r: calc(var(--space-8) + var(--space-3));       /* verb ring outer radius, 128 */
  --x-radial-gap: var(--space-1);                            /* gap between rings */
  --x-radial-band: var(--space-6);                           /* target ring thickness, 44 */
  --x-radial-dwell: var(--motion-quick);                     /* rest before a consequence pull */
  --x-radial-hold: var(--motion-run);                        /* hold to confirm a danger action */
  --x-radial-stagger: calc(var(--motion-instant) / 4);       /* wedge open stagger */
  --x-radial-reach: 3;                                       /* bearing selects out to 3 × radius */
  --x-trail: var(--green);
}
@property --hz{syntax:'<color>';inherits:true;initial-value:transparent}
@property --hz-lo{syntax:'<color>';inherits:true;initial-value:transparent}

.mono{font-family:var(--font-mono)}

/* =====================================================================
   Planes: ground, work, active, decision. One filter per plane wrapper.
   ===================================================================== */
.plane{position:fixed;inset:0;transform:translateZ(0);transform-origin:var(--fx,50%) var(--fy,50%);
  transition:filter var(--x-motion-rack) var(--ease-standard),transform var(--x-motion-rack) var(--ease-standard)}
.plane.slow{transition-duration:var(--x-motion-pull)}
.plane.racking{will-change:filter,transform}
#p-ground{z-index:var(--layer-ground)}

#p-active{z-index:2;pointer-events:none}

.plane[data-depth="1"]{filter:blur(var(--x-focus-far-blur)) saturate(var(--x-focus-far-saturate)) brightness(var(--x-focus-far-dim));transform:translateZ(0) scale(var(--x-focus-far-scale))}
.plane[data-depth="2"]{filter:blur(var(--x-focus-deep-blur)) saturate(var(--x-focus-deep-saturate)) brightness(var(--x-focus-deep-dim));transform:translateZ(0) scale(var(--x-focus-deep-scale))}

.plane[data-depth="1"] *,.plane[data-depth="2"] *{animation-play-state:paused!important}

/* ground: water + horizon (light language: the floor's colour on the horizon) */
.water{position:absolute;inset:0;background:radial-gradient(70% 45% at 55% 110%, color-mix(in srgb, var(--navy) 50%, transparent), transparent 70%)}
.horizon{position:absolute;left:0;right:0;bottom:0;height:55%;
  background:radial-gradient(55% 70% at 58% 100%, color-mix(in srgb, var(--hz) 24%, transparent), color-mix(in srgb, var(--hz-lo) 20%, transparent) 45%, transparent 78%);
  transition:--hz var(--motion-run) var(--ease-standard),--hz-lo var(--motion-run) var(--ease-standard)}
.horizon::after{content:"";position:absolute;left:24%;right:12%;bottom:var(--space-3);height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb, var(--hz) 55%, transparent),transparent)}

/* =====================================================================
   The app: rail · tree · About
   ===================================================================== */
.app{position:absolute;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr) var(--measure-drawer);transition:grid-template-columns var(--motion-base) var(--ease-standard)}
.app.rail-collapsed{grid-template-columns:var(--space-7) minmax(0,1fr) var(--measure-drawer)}
.app.about-collapsed{grid-template-columns:var(--measure-rail) minmax(0,1fr) var(--space-6)}
.app.rail-collapsed.about-collapsed{grid-template-columns:var(--space-7) minmax(0,1fr) var(--space-6)}

.rail{position:relative;display:flex;flex-direction:column;gap:var(--space-1);padding:var(--edge-tight) var(--edge-tight) var(--space-5);background:color-mix(in srgb, var(--slate-deep) 70%, transparent);border-right:1px solid var(--hairline);min-width:0;overflow:hidden}
.tile{display:flex;align-items:stretch;height:var(--space-7);border-radius:var(--radius-key);background:var(--surface-raised);overflow:hidden;box-shadow:inset 3px 0 0 var(--navy);margin-bottom:var(--space-4);flex:none}
.tile-icon{width:var(--space-7);flex:none;display:grid;place-items:center;background:color-mix(in srgb, var(--ink) 78%, transparent);color:var(--slate-deep)}
.tile-text{display:flex;flex-direction:column;justify-content:center;padding:0 var(--space-3);min-width:0}
.tile-name{font-size:var(--type-meta);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.tile-owner{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.nav{position:relative;display:flex;align-items:center;gap:var(--space-3);height:var(--target-md);padding:0 var(--space-3);border-radius:var(--radius-key);color:var(--ink);text-align:left;white-space:nowrap;flex:none;
  transition:background var(--motion-quick),color var(--motion-quick),opacity var(--motion-base),filter var(--motion-base),box-shadow var(--motion-base)}
.nav:hover{background:var(--surface-inset)}
.nav-ic{display:grid;color:var(--ink-muted)}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav-count{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.nav.lit{background:var(--surface-raised);color:var(--light)} .nav.lit .nav-ic{color:var(--x-trail)}
.nav[data-d="1"]{opacity:var(--x-path-dim-1)} .nav[data-d="2"]{opacity:var(--x-path-dim-2)}
.nav[data-d]:hover,.nav[data-d]:focus-visible{opacity:1}
/* dark cockpit: "Needs you" sits soft while nothing escalates */
.nav.ambient{filter:blur(var(--x-focus-near-blur)) saturate(.6);opacity:.72}
.nav.ambient:hover,.nav.ambient:focus-visible{filter:none;opacity:1}
.nav.armed{filter:none!important;opacity:1!important;box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--warning) 55%, transparent)}
.nav.armed .nav-count,.nav.armed .nav-ic{color:var(--warning)}
.nav.snoozed{filter:none!important;opacity:1!important;color:var(--warning)}
.nav.snoozed .nav-label::after{content:attr(data-snooze);display:block;font-size:var(--type-small);line-height:1;color:var(--ink-muted)}
/* beacon: one sweep, never a loop (light language) */
.beacon{position:absolute;inset:0;border-radius:var(--radius-key);border:1px solid var(--warning);pointer-events:none;animation:beacon var(--motion-ping) var(--ease-ping) 2 both}
@keyframes beacon{from{transform:scale(1);opacity:.8}to{transform:scale(1.06,1.45);opacity:0}}
.rail-section{margin:var(--space-4) var(--space-3) var(--space-1)}
.rec{position:relative;display:flex;align-items:center;border-radius:var(--radius-key);flex:none;transition:background var(--motion-quick),opacity var(--motion-base)}
.rec:hover{background:var(--surface-inset)}
.rec-btn{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-3);font-size:var(--type-meta);color:var(--ink-muted);text-align:left;white-space:nowrap}
.rec-btn .lucide{color:var(--ink-muted)}
.rec:hover .rec-btn{color:var(--ink)}
.rail-foot{margin-top:auto;display:flex;justify-content:flex-end}
.icon-btn{display:inline-grid;place-items:center;width:var(--target-sm);height:var(--target-sm);border-radius:var(--radius-key);color:var(--ink-muted);transition:background var(--motion-quick),color var(--motion-quick)}
.icon-btn:hover{background:var(--surface-inset);color:var(--ink)}
.rail-collapsed .tile-text,.rail-collapsed .nav-label,.rail-collapsed .nav-count,.rail-collapsed .rail-section,.rail-collapsed .rec{display:none}
.rail-collapsed .tile{width:var(--target-md);height:var(--target-md)}
.rail-collapsed .tile-icon{width:var(--target-md)}
.rail-collapsed .rail-foot{justify-content:center}

.main{position:relative;min-width:0;display:flex;flex-direction:column;padding:var(--space-4) var(--space-5) 0;overflow:hidden}
.mast{text-align:center}
.mast-owner{display:inline-flex;align-items:center;gap:var(--space-3)}
.mast-owner::before,.mast-owner::after{content:"";width:var(--space-5);height:1px;background:var(--hairline-strong)}
.mast-title{font-size:var(--type-title-s);line-height:var(--leading-title-s);font-weight:300;letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0}
.toolbar{display:flex;gap:var(--space-2);align-items:center;margin:var(--space-3) 0 var(--space-2)}
.search{flex:1;display:flex;align-items:center;gap:var(--space-3);height:var(--target-md);padding:0 var(--space-4);background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink-muted);min-width:0}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--ink-muted)}
.search:focus-within{border-color:var(--hairline-strong)}
.tbtn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-md);padding:0 var(--space-4);border-radius:var(--radius-key);background:var(--surface-inset);border:1px solid var(--hairline);color:var(--ink);white-space:nowrap}
.tbtn:hover{background:var(--surface-raised)}
.tbtn.add{background:color-mix(in srgb, var(--green) 16%, transparent);border-color:color-mix(in srgb, var(--green) 45%, transparent);color:var(--light)}
@media (max-width:1360px){.tbtn .tb-l{display:none}.tbtn{padding:0 var(--space-3)}}

/* streak strip: counts are light, from Harry's mockup (anamorphic, so horizontal) */
.strip{display:flex;align-items:center;gap:var(--space-4) var(--space-5);height:var(--target-sm);margin:0 var(--space-3) var(--space-2);flex:none}
.sig{display:inline-flex;align-items:center;gap:var(--space-2);white-space:nowrap}
.sig b{font:300 var(--type-lead)/1 var(--font-sans);color:var(--ink);min-width:1ch;text-align:right}
.streak{position:relative;display:block;height:1px;width:calc(var(--n) * var(--space-3));background:linear-gradient(90deg,transparent,var(--c) 50%,transparent)}
.streak::after{content:"";position:absolute;left:50%;top:50%;width:var(--space-1);height:var(--space-1);margin:calc(var(--space-1) / -2);border-radius:50%;background:var(--light);box-shadow:0 0 var(--space-2) 1px var(--c),0 0 var(--space-5) var(--space-1) color-mix(in srgb, var(--c) 40%, transparent)}
.streak::before{content:"";position:absolute;left:50%;top:50%;width:1px;height:var(--space-4);margin:calc(var(--space-4) / -2) 0 0;background:linear-gradient(transparent,color-mix(in srgb, var(--c) 60%, transparent),transparent)}
.sig.flick b{animation:flick var(--motion-run) steps(1,end) 1}
.state{margin-left:auto;display:flex;gap:var(--space-2);align-items:center;font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.state .lamp{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--hairline-strong)}
.state.wait{color:var(--warning)} .state.wait .lamp{background:var(--warning);box-shadow:0 0 var(--space-2) var(--warning)}

/* ---------- the tree: open in place, neighbours fall off by distance, ancestors pin ---------- */
.tree-wrap{flex:1;position:relative;overflow:auto;padding:0 0 var(--space-8);scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.tree-in{position:relative}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.node{--lvl:0;position:relative}
.nrow{position:relative;display:flex;align-items:center;height:var(--target-sm);padding:0 var(--space-1) 0 calc(var(--space-2) + var(--lvl) * var(--space-5));border-radius:var(--radius-key);color:var(--ink);
  transition:opacity var(--motion-base) var(--ease-standard),filter var(--motion-base) var(--ease-standard),background var(--motion-quick)}
.nrow:hover,.nrow:focus-within{opacity:1!important;filter:none!important;background:var(--surface-inset)}
.nbtn{flex:1;min-width:0;height:100%;display:grid;grid-template-columns:var(--space-4) var(--space-5) minmax(0,1fr) auto;align-items:center;gap:var(--space-2);text-align:left;border-radius:var(--radius-key)}
.nbtn .chev{display:grid;color:var(--ink-muted);transition:transform var(--motion-base) var(--ease-standard)}
.node.open > .nrow .chev{transform:rotate(90deg)}
.nbtn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbtn .ico{display:grid;color:var(--ink-muted)}
.nbtn .right{display:flex;align-items:center;gap:var(--space-3);white-space:nowrap}
.meta{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}
.chip{--fc:var(--ink-muted);display:inline-flex;align-items:center;gap:var(--space-1);height:var(--space-5);padding:0 var(--space-2);border-radius:var(--radius-pill);font-size:var(--type-small);white-space:nowrap;border:1px solid color-mix(in srgb, var(--fc) 40%, transparent);color:var(--fc)}
.chip::before{content:"";width:var(--space-2);height:var(--space-2);border-radius:50%;background:currentColor}
.more{flex:none;width:var(--space-5);height:var(--space-5);display:grid;place-items:center;border-radius:var(--radius-key);color:var(--ink-muted);opacity:0;transition:opacity var(--motion-quick)}
[data-obj]:hover > .more,[data-obj]:focus-within > .more{opacity:1}
.more:hover{background:var(--surface-raised);color:var(--ink)}
.node[data-kind="library"] > .nrow{height:var(--target-md)}
.node[data-kind="library"] > .nrow .lbl{letter-spacing:var(--tracking-soft)}
.nrow[data-d="1"]{opacity:var(--x-path-dim-1)}
.nrow[data-d="2"]{opacity:var(--x-path-dim-2);filter:blur(var(--x-path-soft)) saturate(.6)}
.nrow[data-d="3"]{opacity:var(--x-path-dim-3);filter:blur(calc(var(--x-path-soft) * 2)) saturate(.4)}
.node.path > .nrow{position:sticky;top:calc(var(--lvl) * var(--target-sm) + min(var(--lvl), 1) * (var(--target-md) - var(--target-sm)));z-index:calc(10 - var(--lvl));background:color-mix(in srgb, var(--slate-deep) 92%, transparent);color:var(--light)}
.node.path > .nrow .ico{color:var(--x-trail)}
.node.path > .nrow .lbl{text-shadow:0 0 var(--space-3) color-mix(in srgb, var(--x-trail) 45%, transparent)}
.node.end > .nrow{background:color-mix(in srgb, var(--x-trail) 10%, var(--slate-deep))}
.trail{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:20}
.trail path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.trail .glow{stroke:var(--x-trail);stroke-width:var(--space-1);opacity:.28;filter:blur(var(--space-1))}
.trail .core{stroke:var(--x-trail);stroke-width:var(--focus-ring)}
.trail circle{fill:var(--x-trail)}
/* light language on rows */
.nrow.bloom{isolation:isolate}
.nrow.bloom::before{content:"";position:absolute;inset:calc(var(--space-1) * -1) 0;border-radius:var(--radius-inset);background:radial-gradient(closest-side,color-mix(in srgb, var(--green) 22%, transparent),transparent);z-index:-1;animation:breathe var(--motion-still) var(--ease-standard) infinite alternate}
@keyframes breathe{from{opacity:calc(1 - var(--breathe) * 3)}to{opacity:1}}
.needs{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--green)}
.ember{--age:.6;display:inline-flex;align-items:center;gap:var(--space-2);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.ember i{display:block;width:var(--space-2);height:var(--space-2);border-radius:50%;background:color-mix(in srgb, var(--warning) calc((1 - var(--age)) * 100%), var(--ink-muted));box-shadow:0 0 calc((1 - var(--age)) * var(--space-4)) color-mix(in srgb, var(--warning) calc((1 - var(--age)) * 80%), transparent)}
.nrow.shadow{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hairline) 6px 7px);cursor:not-allowed}
.nrow.shadow .lbl{color:var(--ink-muted)}
.nrow .why{font-size:var(--type-small);color:var(--ink-muted)}
.nrow .why b{font-weight:400;color:var(--ink)}
.flick{animation:flick var(--motion-run) steps(1,end) 1}
@keyframes flick{0%{background:transparent}6%{background:color-mix(in srgb, var(--info) 30%, transparent)}12%{background:transparent}18%{background:color-mix(in srgb, var(--info) 20%, transparent)}24%,100%{background:transparent}}

/* opened in place */
.card{position:relative;margin:var(--space-2) var(--space-3) var(--space-3) calc(var(--space-2) + var(--lvl) * var(--space-5) + var(--space-6));padding:var(--space-4) var(--space-5);border-radius:var(--radius-inset);background:var(--surface-raised);border:1px solid color-mix(in srgb, var(--x-trail) 30%, var(--hairline));box-shadow:var(--shadow-raised);display:grid;gap:var(--space-3);max-width:var(--measure-wide);
  animation:open var(--motion-slow) var(--ease-out) both}
@keyframes open{from{opacity:0;transform:translateY(calc(var(--space-2) * -1))}}
.card h2{margin:0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.card p{margin:0;color:var(--ink);max-width:var(--measure-prose);font-size:var(--type-meta);line-height:var(--leading-meta)}
.card .sub{display:flex;gap:var(--space-3);align-items:center}
.status{font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.card .work{display:flex;gap:var(--space-2);align-items:center}
.note{flex:1;display:flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);background:var(--surface-inset);border:1px solid var(--hairline);color:var(--ink-muted);min-width:0}
.note input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-size:var(--type-meta)}
.note input::placeholder{color:var(--ink-muted)}
.note:focus-within{border-color:color-mix(in srgb, var(--x-trail) 45%, transparent)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);background:var(--surface-inset);font-size:var(--type-meta);white-space:nowrap}
.btn:hover{background:var(--surface-raised)}
.btn.go{background:color-mix(in srgb, var(--green) 16%, transparent);border-color:color-mix(in srgb, var(--green) 45%, transparent);color:var(--light)}

/* ---------- About ---------- */
.about{position:relative;min-width:0;border-left:1px solid var(--hairline);background:color-mix(in srgb, var(--slate-deep) 60%, transparent);padding:var(--space-4) var(--space-4) var(--space-6);overflow:hidden;display:flex;flex-direction:column;gap:var(--space-3)}
.about-head{display:flex;align-items:center;justify-content:space-between}
.about h3{margin:0;font-weight:400;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.about .kind{margin:0;font-size:var(--type-meta);color:var(--ink-muted)}
.about .sec{margin-top:var(--space-2)}
.trace{display:flex;flex-direction:column;gap:var(--space-1);font-size:var(--type-meta);border-left:var(--focus-ring) solid var(--x-trail);padding-left:var(--space-3)}
.trace span{color:var(--ink-muted)} .trace span:last-child{color:var(--light)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) var(--space-4);font-size:var(--type-meta);margin:0}
.facts dt{color:var(--ink-muted)} .facts dd{margin:0;text-align:right}
.links{display:flex;flex-direction:column;gap:var(--space-1);font-size:var(--type-meta)}
.links span{display:flex;gap:var(--space-2);align-items:center;color:var(--ink)}
.links .lucide{color:var(--ink-muted)}
.about-collapsed .about{padding:var(--space-4) var(--space-1);align-items:center}
.about-collapsed .about > :not(.about-head){display:none}
.about-collapsed .about-head .eyebrow{display:none}
/* the visibility ladder: who sees it, floor by floor (self-contained so it clones cleanly) */
.ladder{position:relative;isolation:isolate;display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-2) var(--space-3) var(--space-2) var(--space-5);border-radius:var(--radius-inset);background:var(--surface-inset);border:1px solid var(--hairline)}
.ladder::before{content:"";position:absolute;left:calc(var(--space-3) + var(--space-1) / 2);top:var(--space-4);bottom:var(--space-4);width:1px;background:var(--hairline-strong)}
.rung{--fc:var(--ink-muted);position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-2);height:var(--target-sm);font-size:var(--type-meta);color:var(--ink-muted)}
.rung .dot{position:absolute;left:calc(var(--space-3) * -1 - var(--space-1) / 2);top:50%;width:var(--space-2);height:var(--space-2);margin-top:calc(var(--space-1) * -1);border-radius:50%;border:1px solid var(--hairline-strong);background:var(--slate-deep)}
.rung .nm small{display:block;font-size:var(--type-small);line-height:1;color:var(--ink-muted)}
.rung .n{font:400 var(--type-small)/1 var(--font-mono)}
.rung.reach{color:var(--ink)} .rung.reach .dot{background:var(--fc);border-color:var(--fc);box-shadow:0 0 var(--space-2) var(--fc)}
.rung.preview{color:var(--light)} .rung.preview .dot{background:var(--pv);border-color:var(--pv);box-shadow:0 0 var(--space-3) var(--pv)}
.rung.preview .n{color:var(--pv)}
.rung.preview::after{content:"";position:absolute;inset:0 calc(var(--space-2) * -1) 0 calc(var(--space-4) * -1);border-radius:var(--radius-key);background:color-mix(in srgb, var(--pv) 12%, transparent);z-index:-1}
.ladder.previewing{isolation:isolate}

/* =====================================================================
   Active plane: lifted clones, the radial menu, the escalation card
   ===================================================================== */
#lift{position:fixed;inset:0;pointer-events:none}
#lift > *{position:fixed;margin:0;pointer-events:none;box-sizing:border-box}
#lift .lifted{animation:liftup var(--motion-base) var(--ease-out) both;background:var(--surface-raised);box-shadow:var(--shadow-overlay),0 0 0 1px var(--hairline-strong);border-radius:var(--radius-key);color:var(--light)}
#lift .lifted.card{border-radius:var(--radius-inset)}
#lift .lifted .more{opacity:0}
@keyframes liftup{from{transform:none;box-shadow:none}to{transform:translateY(calc(var(--space-1) / -2))}}
#lift .pulled{animation:pullin var(--motion-slow) var(--ease-out) both;box-shadow:0 0 0 1px var(--pc,var(--hairline-strong)),var(--shadow-raised);background:color-mix(in srgb, var(--pc) 8%, var(--slate-deep));border-radius:var(--radius-key)}
#lift .pulled.ladder{border-radius:var(--radius-inset)}
#lift .pulled .more{opacity:0}

      wait: t => new Promise((res, rej) => setTimeout(() => id === runId ? res() : rej(new Error('cancelled')), t)),

      click() { g.classList.remove('down'); void g.offsetWidth; g.classList.add('down'); },
      to: (x, y, dur, step) => new Promise((res, rej) => {
        const x0 = pos.x, y0 = pos.y, t0 = performance.now(), d = reduced() ? 1 : dur;
        const f = now => { if (id !== runId) return rej(new Error('cancelled')); const t = Math.min(1, (now - t0) / d), e = ease(t); c.at(x0 + (x - x0) * e, y0 + (y - y0) * e); if (step) step(pos.x, pos.y); t < 1 ? requestAnimationFrame(f) : res(); };
        requestAnimationFrame(f);
      }),
      until: async (fn, max) => { const t0 = performance.now(); while (!fn()) { alive(); if (performance.now() - t0 > max) return; await c.wait(ms('--motion-instant')); } },
      alive,
    };
    return c;
  }
  async function script(c) {
    const T = n => ms(n);
    /* 1. Right-click the open document at the end of the lit path */
    const row = $(`#tree .nrow[data-obj="${D.demo.object}"]`); let r = row.getBoundingClientRect();
    const x = r.left + Math.min(r.width * .42, px('--measure-decision')), y = r.top + r.height / 2;
    await c.to(x, y, T('--motion-calm')); c.click(); Menu.open(OBJ[D.demo.object], row, x, y, 'mouse'); await c.wait(T('--motion-slow'));
    /* 2. Point at Publish: the floors sweep out */
    await c.to(...Menu.at(D.demo.verb), T('--motion-slow'), Menu.track); await c.wait(T('--motion-slow'));
    /* 3. Push out to Department: the visibility ladder steps forward, the horizon turns lavender */
    await c.to(...Menu.atTarget(D.demo.target), T('--motion-slow'), Menu.track); await c.wait(T('--motion-still') - T('--motion-calm'));
    /* 4. Org: unavailable, says why, offers to ask */
    await c.to(...Menu.atTarget(D.demo.blocked), T('--motion-base'), Menu.track); await c.wait(T('--motion-shimmer'));
    /* 5. Back to the centre and cancel */
    await c.to(...Menu.centre(), T('--motion-slow'), Menu.track); await c.wait(T('--motion-base')); c.click(); Menu.close(); await c.wait(T('--motion-calm'));
    /* 6. Work: write a note. An approval escalates mid-typing and waits for a pause. */
    const note = $('#note'); r = note.getBoundingClientRect();
    await c.to(r.left + px('--space-8'), r.top + r.height / 2, T('--motion-calm')); c.click(); note.focus({ preventScroll: true });
    const text = D.demo.note;
    for (let i = 0; i < text.length; i++) { c.alive(); note.value += text[i]; Esc.input(); if (i === 8) Esc.arm(); await c.wait(T('--motion-instant')); }
    await c.until(() => Esc.phase === 'pulled', T('--motion-hold'));
    await c.wait(T('--motion-run'));
    /* 7. Open the decision in the 2.39:1 letterbox */
    const open = $('#esc-card [data-a="open"]'); if (!open) return; r = open.getBoundingClientRect();
    await c.to(r.left + r.width / 2, r.top + r.height / 2, T('--motion-calm')); c.click(); await c.wait(T('--motion-quick')); Esc.decide(); await c.wait(T('--motion-still') + T('--motion-run'));
    /* 8. Approve: focus releases, the count drops, the change flickers once */
    const ok = $('[data-a="approve"]'); r = ok.getBoundingClientRect();
    await c.to(r.left + r.width / 2, r.top + r.height / 2, T('--motion-calm')); c.click(); await c.wait(T('--motion-quick')); Esc.done();
  }
  function reset() {
    if (Menu.isOpen()) Menu.close(true);
    Esc.reset();
    const p = structuredClone(PRISTINE); D.tree = p.tree; D.nav = p.nav; D.loose = p.loose; index();
    deleted.clear(); path = [...D.initialPath]; lastLen = 0;
    renderApp(); render();
  }
  function run(first) {
    const id = ++runId; setOn(true);
    if (!first) reset();
    const c = ctx(id); c.at(pos.x, pos.y);
    (async () => { await c.wait(first ? ms('--motion-run') : ms('--motion-calm')); g.classList.add('on'); await script(c); })()
      .catch(e => { if (!/cancelled/.test(e.message)) console.error(e); })
      .finally(() => { if (id === runId) { setOn(false); setTimeout(() => id === runId && g.classList.remove('on'), ms('--motion-spin')); } });
  }
  const stop = () => { if (on) { runId++; setOn(false); g.classList.remove('on'); } };
  addEventListener('pointerdown', e => { if (e.isTrusted) stop(); }, true);
  /* only a hand that actually moves stops the demo (browsers send synthetic moves when layout shifts under a resting cursor) */
  addEventListener('pointermove', e => { if (!e.isTrusted) return; const moved = real && Math.hypot(e.clientX - real.x, e.clientY - real.y) > 2; real = { x: e.clientX, y: e.clientY }; if (moved) stop(); }, true);
  addEventListener('wheel', e => { if (e.isTrusted) stop(); }, true);
  addEventListener('keydown', e => {
    if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey && !e.target.closest('input, textarea')) { e.preventDefault(); e.stopImmediatePropagation(); run(false); return; }
    if (e.isTrusted) stop();
  }, true);
  return { run, stop, reset };
})();

/* boot */
index(); renderApp(); render(); wire();
Demo.run(true);
</script>
