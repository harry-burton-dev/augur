html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 40%, var(--slate), var(--slate-deep));color:var(--ink);font-family:var(--font-sans);font-size:var(--type-body);line-height:var(--leading-body);-webkit-font-smoothing:antialiased;overflow:hidden}

// ---------- Shared helpers for the telemetry explorations ----------
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ROOT = getComputedStyle(document.documentElement);
const tok = n => ROOT.getPropertyValue('--' + n).trim();
const T = n => parseFloat(tok('motion-' + n));            // a motion token in ms
const PX = n => parseFloat(tok(n));                         // a distance token in px
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtK = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(Math.round(n));
const fmtN = n => Math.round(n).toLocaleString('en-GB');
const svc = id => DATA.services.find(s => s.id === id);
const floorVar = f => `var(--floor-${f}-high)`;
let _timers = [];
const later = (ms, fn) => { const id = setTimeout(fn, ms); _timers.push(id); return id; };
const clearLater = () => { _timers.forEach(clearTimeout); _timers = []; };
const say = m => { $('#live').textContent = m; };
const T0 = performance.now();
const clock = (offsetSec = 0) => {
  const [h, m] = DATA.now.split(':').map(Number);
  const s = Math.floor((performance.now() - T0) / 1000) + offsetSec + 1;
  const tot = h * 3600 + m * 60 + s, p = n => String(n).padStart(2, '0');
  return `${p(Math.floor(tot / 3600) % 24)}:${p(Math.floor(tot / 60) % 60)}:${p(tot % 60)}`;
};

function renderStage() {
  const S = DATA.shell;
  $('#sRail').innerHTML = `<div class="s-tile"><div class="ic"><i data-lucide="library" data-size="22"></i></div>
    <div class="nm"><b>${esc(S.app.toUpperCase())}</b><small>${esc(S.person)}</small></div></div>
    <ul class="s-nav">${S.rail.map(r => `<li><i data-lucide="${r.icon}" data-size="18"></i><span>${esc(r.label)}</span><em>${r.n}</em></li>`).join('')}</ul>
    <div class="s-eyebrow">Recent</div>
    <ul class="s-nav s-recent">${S.recent.map(r => `<li><i data-lucide="file" data-size="16"></i><span>${esc(r)}</span></li>`).join('')}</ul>`;
  $('#sMain').innerHTML = `<div class="s-head"><small>${esc(S.person)}</small><h1>${esc(S.app)}</h1></div>
    <div class="s-search"><i data-lucide="search" data-size="16"></i><span>${esc(S.search)}</span><kbd>/</kbd></div>
    ${S.sections.map(s => `<section class="s-sec ${s.act ? 'act' : ''}"><h2>${esc(s.label)}</h2>
      <div class="s-panel"><div class="s-count">${s.n}<div class="s-needle"></div></div>
      <div class="s-rows">${s.rows.map(r => `<div class="s-row"><i data-lucide="file-text" data-size="16"></i>
        <div><span>${esc(r.t)}</span> <span class="m">· ${esc(r.m)}</span></div><span class="s">${esc(r.s)}</span></div>`).join('')}</div></div></section>`).join('')}`;
  Icons.hydrate($('#stage'));
}

// ---------- Hand-off to the alert system: letterbox + rack focus ----------
let _hot = null, _returnFocus = null;
function handoff(c) {
  _returnFocus = c.returnTo || document.activeElement;
  const a = $('#alert'), sev = c.sev || 'danger';
  a.innerHTML = `<div class="alert-in"><div>
      <div class="a-eyebrow ${sev}">${sev === 'warning' ? Icons.svg('triangle-alert', { size: 14 }) : Icons.svg('octagon-alert', { size: 14 })}${esc(c.eyebrow)}</div>
      <h2 class="a-title" id="aTitle">${esc(c.title)}</h2>
      <p class="a-detail" id="aDetail">${esc(c.detail)}</p>
      <div class="a-acts">${c.actions.map((x, i) => `<button class="btn ${x.primary ? 'primary ' + sev : ''}" data-act="${i}">${x.icon ? Icons.svg(x.icon, { size: 16 }) : ''}${esc(x.label)}${x.key ? `<span class="k">${esc(x.key)}</span>` : ''}</button>`).join('')}</div>
      <p class="a-why">${Icons.svg('info', { size: 14 })}<span>${esc(c.why)}</span></p>
    </div><div class="a-ev" id="aEv">${c.evidence || ''}</div></div>`;
  $$('[data-act]', a).forEach(b => b.onclick = () => {
    const x = c.actions[+b.dataset.act];
    if (x.back) return stepBack();
    b.innerHTML = `${Icons.svg('check', { size: 16 })}${esc(x.done || 'Done')}`;
    say(x.done || 'Done'); later(T('calm'), stepBack);
  });
  $('#lbTagT').textContent = c.tagT || ''; $('#lbTagTR').textContent = c.tagTR || `${DATA.shell.floor.name} / ${DATA.shell.app}`;
  $('#lbTagB').textContent = c.tagB || '';
  _hot = c.hot || null; if (_hot) _hot.classList.add('hot');
  document.body.classList.add('lbox', 'rack');
  say(`${c.eyebrow}. ${c.title}`);
  c.after && c.after($('#aEv'));
  later(T('base'), () => { const p = $('.btn.primary', a); p && p.focus({ preventScroll: true }); });
}
function stepBack(silent) {
  const was = document.body.classList.contains('lbox');
  document.body.classList.remove('lbox', 'rack', 'rack-soft');
  if (_hot) _hot.classList.remove('hot'); _hot = null;
  if (was && !silent) { V.onStepBack && V.onStepBack(); if (_returnFocus && _returnFocus.focus) _returnFocus.focus({ preventScroll: true }); }
}

// ---------- Demo choreography: ambient → change (sharpen) → limit crossed (hand-off) ----------
let V = null;
function replay() {
  clearLater(); stepBack(true); V.state = 0; V.reset();
  later(T('run'), () => { V.state = 1; V.change(); });
  later(T('run') + T('spin'), () => { V.state = 2; V.cross(); });
}
function boot(v) {
  V = v; renderStage(); V.init(); Icons.hydrate();
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    if (e.key === 'r' || e.key === 'R') replay();
    else if (e.key === 'Escape') { if (document.body.classList.contains('lbox')) stepBack(); else V.escape && V.escape(); }
    else if (e.key === ' ' && !(e.target.closest && e.target.closest('button,[role=button]'))) {
      e.preventDefault(); clearLater();
      if (V.state === 0) { V.state = 1; V.change(); } else if (V.state === 1) { V.state = 2; V.cross(); } else replay();
    } else V.key && V.key(e);
  });
  replay();
}

// ---------- V4 sentence ----------
const INK = tok('ink'), MUTED = tok('ink-muted'), DANGER = tok('danger'), HAIR = tok('hairline-strong');
function spark(vals, o = {}) {        // a word-sized graphic: Tufte's grey normal band, the line, an end dot
  const w = o.w || PX('space-7') - PX('space-3'), h = o.h || PX('space-4'), lo = Math.min(...vals, o.band ? o.band[0] : Infinity), hi = Math.max(...vals, o.band ? o.band[1] : -Infinity);
  const x = i => (i / (vals.length - 1)) * w, y = v => h - ((v - lo) / ((hi - lo) || 1)) * h;
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const band = o.band ? `<rect x="0" y="${y(o.band[1])}" width="${w}" height="${Math.max(1, y(o.band[0]) - y(o.band[1]))}" fill="${MUTED}" opacity=".14"/>` : '';
  const mi = vals.indexOf(Math.min(...vals)), ma = vals.lastIndexOf(Math.max(...vals));
  const ext = o.ext ? `<circle cx="${x(mi)}" cy="${y(vals[mi])}" r="1.6" fill="${MUTED}"/><circle cx="${x(ma)}" cy="${y(vals[ma])}" r="1.6" fill="${MUTED}"/>` : '';
  return `<svg class="sp" width="${o.full ? '100%' : w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${band}
    <polyline points="${pts}" fill="none" stroke="${o.color || INK}" stroke-width="${o.sw || 1}" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${ext}
    <circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="${o.r || 2}" fill="${o.end || o.color || INK}"/></svg>`;
}
const progress = (p, w = PX('space-6')) => `<svg class="sp" width="${w}" height="${PX('space-3')}" aria-hidden="true"><rect x="0" y="5" width="${w}" height="2" fill="${HAIR}"/><rect x="0" y="4" width="${w * p}" height="4" fill="${INK}"/></svg>`;
const people = () => `<svg class="sp" width="${DATA.presence.length * 10}" height="${PX('space-3')}" aria-hidden="true">${DATA.presence.map((p, i) => `<circle cx="${i * 10 + 4}" cy="6" r="3" style="fill:${floorVar(p.floor)}"/>`).join('')}</svg>`;
function phraseHTML(p) {
  const L = DATA.locked;
  if (p.locked) return `<button class="ph locked" data-id="${p.id}" aria-label="${esc(L.label)}: locked. ${esc(L.reason)}">${esc(L.label.toLowerCase())}${Icons.svg('lock', { size: 14 })}<i>locked</i></button>`;
  const g = p.series ? spark(p.series, { band: p.band }) : p.progress != null ? progress(p.progress) : p.people ? people() : '';
  return `<button class="ph" data-id="${p.id}">${p.tpl.replace('{v}', `<b data-v>${esc(p.v)}</b>`).replace('{w}', `<b>${esc(p.w || '')}</b>`)}${g}</button>`;
}
function renderSentence() {
  $('#sent').innerHTML = DATA.sentence.map((p, i, a) => `<span class="pw">${phraseHTML(p)}${i < a.length - 1 ? '<span class="sep">·</span>' : ''}</span>`).join(' ');
  $('#when').innerHTML = `<b>${DATA.now}</b>last 24 h`;
  $$('.ph').forEach(b => { b.onmouseenter = b.onfocus = () => macro(b.dataset.id); });
  $('#band').onmouseleave = () => macro(null);
  $('#band').addEventListener('focusout', e => { if (!$('#band').contains(e.relatedTarget)) macro(null); });
}
function macro(id) {
  const m = $('#macro'), L = DATA.locked;
  if (!id) { m.classList.remove('on'); document.body.classList.remove('rack-soft'); return; }
  m.innerHTML = DATA.sentence.map(p => {
    if (p.locked) return `<div class="mm locked ${p.id === id ? 'lit' : ''}"><h4>${Icons.svg('lock', { size: 12 })} ${esc(L.label)}</h4><p>${esc(L.reason)} ${esc(L.who)}</p></div>`;
    const s = p.series;
    return `<div class="mm ${p.id === id ? 'lit' : ''}"><h4>${esc(p.label)}</h4><div class="big">${esc(p.v)}${p.w ? ` <small>${esc(p.w)}</small>` : ''}</div>
      ${s ? spark(s, { band: p.band, full: true, w: 160, h: PX('space-6'), ext: true, r: 2.5 }) + `<div class="rg"><span>−24 h</span><span>${Math.min(...s)}–${Math.max(...s)}</span></div>`
          : p.progress != null ? progress(p.progress, 140) + `<div class="rg"><span>${Math.round(p.progress * 100)}% baked</span><span>${esc(DATA.upgrade.window)}</span></div>`
          : `<div class="rg">${DATA.presence.map(x => esc(x.n)).join(' · ')}</div>`}</div>`;
  }).join('') + `<div class="foot">Grey band: the normal range for this hour of day. Dots: lowest, highest and now.</div>`;
  m.classList.add('on'); document.body.classList.add('rack-soft');
}
const phrase = id => $(`.ph[data-id="${id}"]`);
function setV(id, v) { const p = DATA.sentence.find(x => x.id === id); p.v = v; if (p.series) { p.series = [...p.series.slice(1), v]; } const el = phrase(id); el.outerHTML = phraseHTML(p); renderSentenceHooks(); return phrase(id); }
function renderSentenceHooks() { $$('.ph').forEach(b => { b.onmouseenter = b.onfocus = () => macro(b.dataset.id); }); }
const ORIG = JSON.parse(JSON.stringify(DATA.sentence));
boot({
  init() { renderSentence(); },
  reset() { DATA.sentence = JSON.parse(JSON.stringify(ORIG)); renderSentence(); macro(null); $('#band').classList.remove('sharp'); },
  change() {
    const el = setV(DATA.change.id, DATA.change.v); el.classList.add('sharp'); $('#band').classList.add('sharp');
    say(`${DATA.change.v} approvals waiting`); later(T('hold'), () => { el.classList.remove('sharp'); $('#band').classList.remove('sharp'); });
  },
  cross() {
    const X = DATA.crossing, el = setV(X.id, X.v); el.classList.add('crit'); $('#band').classList.add('sharp');
    const p = DATA.sentence.find(x => x.id === X.id), max = Math.max(...X.queue.map(q => q.h));
    later(T('calm'), () => {
      const from = el.getBoundingClientRect();
      handoff({
        ...X, hot: $('#band'), returnTo: el, title: '', tagT: `From the summary line · ${clock()}`, tagB: `Approvals · last 24 h · limit ${X.limitH} h`,
        evidence: `<table class="agetab"><thead><tr><th>Waiting for you</th><th>From</th><th class="age">Age · limit ${X.limitH} h</th></tr></thead><tbody>
          ${X.queue.map(q => `<tr class="${q.h > X.limitH ? 'over' : ''}"><td>${esc(q.t)}</td><td class="m">${esc(q.from)}</td>
            <td class="age"><div class="agebar"><i class="${q.h > X.limitH ? 'over' : ''}" style="width:${(q.h / max) * 80}%"></i><u style="left:${(X.limitH / max) * 80}%"></u><span>${q.h} h</span></div></td></tr>`).join('')}</tbody></table>`,
        after() {
          const t = $('#aTitle');
          t.innerHTML = esc(X.title).replace('{v}', X.v).replace('{spark}', spark(p.series, { band: p.band, w: PX('space-7'), h: PX('space-5'), color: tok('light'), end: DANGER, r: 3, sw: 1.5 }));
          if (REDUCED) return;
          const to = t.getBoundingClientRect(), f = document.createElement('p');      // the phrase flies up and grows into the headline
          f.className = 'fly'; f.textContent = el.textContent; Object.assign(f.style, { left: from.left + 'px', top: from.top + 'px' });
          document.body.append(f); t.style.opacity = 0;
          const k = PX('type-title-s') / PX('type-lead') || 1.6;
          requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transform = `translate(${to.left - from.left}px,${to.top - from.top}px) scale(${k})`; f.style.opacity = 0; }));
          later(T('slow'), () => { t.style.transition = `opacity ${T('slow')}ms`; t.style.opacity = 1; });
          later(T('calm'), () => f.remove());
        }
      });
    });
  },
  onStepBack() { $('#band').classList.remove('sharp'); }
});
