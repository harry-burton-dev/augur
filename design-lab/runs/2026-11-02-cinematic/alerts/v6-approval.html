function renderHints(list){
  const h=document.createElement('div');h.className='hints';h.setAttribute('aria-hidden','true');
  h.innerHTML=list.map(([k,l])=>`<span><span class="kbd">${esc(k)}</span>${esc(l)}</span>`).join('')+`<span><span class="kbd">M</span>reduced motion <b id="rm-state">${RM.on?'on':'off'}</b></span>`;
  document.body.appendChild(h);
}
document.addEventListener('keydown',e=>{if((e.key==='m'||e.key==='M')&&!e.metaKey&&!e.ctrlKey){setRM(!RM.on)}});

/* ---------- sample data ---------- */
const DATA={
  app:{name:'Artifacts',person:'Harry Burton',icon:'library',search:'Find a document, folder or library',recentLabel:'Recent',
    nav:[{icon:'folder',label:'Your collections',count:3},{icon:'users',label:'Shared libraries',count:4}],
    recent:[{label:'Policy index'},{label:'Weekly report · 23 Oct'}],
    bands:[
      {key:'actions',label:'Actions',tone:'var(--green)',rows:[{title:'Records retention policy v4',meta:'Publish to Finance',tag:'Approve'},{title:'Sam Okafor · Team admin',meta:'Field Ops',tag:'Approve'},{title:'Q4 board pack',meta:'Due Fri',tag:'Review'}]},
      {key:'new',label:'New',rows:[{title:'Travel policy 2027 draft',meta:'Ana Sousa · 2h'},{title:'Incident review · 28 Oct',meta:'Tom Reyes · 5h'}]},
      {key:'upcoming',label:'Upcoming',rows:[{title:'Annual access review',meta:'15 Nov'},{title:'Library clean-up',meta:'22 Nov'}]}
    ]},
  floors:[{id:'you',label:'You',c:'var(--floor-you-high)'},{id:'team',label:'Team',c:'var(--floor-team-high)'},{id:'department',label:'Department',c:'var(--floor-department-high)'},{id:'org',label:'Org',c:'var(--floor-org-high)'}],
  queueLabel:'{n} approvals waiting for you',
  items:[
    {kind:'Publish',eyebrow:'Approval · publish to a Department',title:'Records retention policy v4',
     question:'Publish it to Finance, replacing v3 for everyone there?',from:'team',to:'department',
     confirm:'Hold to publish',holdKey:'Hold Enter',
     provenance:[{who:'Ana Sousa',what:'Drafted v4 in Records team library',when:'28 Oct'},{who:'Tom Reyes',what:'Reviewed · 2 comments resolved',when:'30 Oct'},{who:'Legal check',what:'Passed · retention periods match the 2026 schedule',when:'31 Oct'},{who:'Ana Sousa',what:'Asked to publish to Finance',when:'1 Nov'},{who:'You',what:'Finance approver',when:'now',you:true}],
     diff:{label:'v3 → v4',add:'+412',del:'−96',note:'3 sections changed'},
     reach:{n:214,label:'people in Finance will see it'},
     consequence:[{icon:'file-text',text:'Replaces v3 in 3 Finance libraries; v3 stays in history.'},{icon:'bell',text:'Everyone in Finance is told; reading due 15 Nov.'},{icon:'undo-2',text:'You can withdraw it for 30 days. Readers keep the copy they read.',cls:'undo'}],
     alts:[{id:'return',label:'Return with a note',icon:'undo-2'},{id:'later',label:'Decide later',icon:'clock'}],
     disabled:{label:'Publish to the whole Org',why:'You approve for Finance only. Org publishing needs an Org approver: Priya Nair can.'},
     done:'Published to Finance · {n} people told'},
    {kind:'Access',eyebrow:'Approval · give someone admin',title:'Sam Okafor as Field Ops admin',
     question:'Make Sam an admin of the Field Ops team for one year?',from:'you',to:'team',
     confirm:'Hold to grant',holdKey:'Hold Enter',
     provenance:[{who:'Sam Okafor',what:'Asked to be Field Ops admin',when:'31 Oct'},{who:'Ana Sousa',what:'Team lead · endorsed the request',when:'1 Nov'},{who:'Policy check',what:'Two-step sign-in is on for Sam',when:'1 Nov'},{who:'You',what:'Department admin for Field Ops',when:'now',you:true}],
     reach:{n:38,label:'people in Field Ops he can manage'},
     consequence:[{icon:'user-round',text:'Can add and remove Field Ops members.'},{icon:'check',text:'Can approve publishing to the Field Ops team.'},{icon:'x',text:'Cannot see other teams’ or Department libraries.',cls:'no'},{icon:'undo-2',text:'Ends on 2 Nov 2027. You can remove it any time.',cls:'undo'}],
     alts:[{id:'return',label:'Decline with a note',icon:'undo-2'},{id:'later',label:'Decide later',icon:'clock'}],
     disabled:{label:'Grant with no end date',why:'Org policy ends Team admin grants after one year. Priya Nair (Org owner) can change the policy.'},
     done:'Sam is a Field Ops admin until 2 Nov 2027'}
  ]
};
/* ---------- render ---------- */
const app=$('#app'),lb=$('#lb'),tri=$('#tri');
renderApp(app,DATA.app);
let cur=0,focusP='dec',holdT=null,state='idle';
const F=id=>DATA.floors.find(f=>f.id===id);
function draw(){
  const it=DATA.items[cur],to=F(it.to);ROOT.style.setProperty('--floor',to.c);
  const fi=DATA.floors.map(f=>f.id),a=fi.indexOf(it.from),b=fi.indexOf(it.to);
  tri.innerHTML=`
  <section class="plane side resolve" data-p="prov" aria-label="Provenance">
    <h4>${ico('git-branch',14)}How it got here<span class="kbd">←</span></h4>
    <ol class="chain">${it.provenance.map(p=>`<li class="${p.you?'you':''}"><span class="dot">${p.you?'':ico('check',10,2)}</span><span class="w">${esc(p.who)}</span><span class="t">${esc(p.when)}</span><span class="d">${esc(p.what)}</span></li>`).join('')}</ol>
    ${it.diff?`<div class="diff">${esc(it.diff.label)} · <b>${it.diff.add}</b> <i>${it.diff.del}</i> words · ${esc(it.diff.note)}</div>`:''}
  </section>
  <section class="plane dec resolve" data-p="dec">
    <div class="ladder">${DATA.floors.map((f,i)=>`<span class="${i===a?'from':i===b?'to':i>a&&i<b?'mid':''}" style="--fl:${f.c}">${esc(f.label)}</span>`).join('')}</div>
    <div class="eyebrow">${esc(it.eyebrow)}</div>
    <h2 id="d-title">${esc(it.title)}</h2>
    <p class="q" id="d-q">${esc(it.question)}</p>
    <button type="button" class="btn primary hold" id="hold">${ico('check',16)}${esc(it.confirm)} <span class="lbl2">· ${esc(it.holdKey)}</span><span class="fill"></span></button>
    <div class="alt">${it.alts.map(x=>`<button type="button" class="btn" data-act="${x.id}">${ico(x.icon,15)}${esc(x.label)}</button>`).join('')}</div>
    <div class="alt"><button type="button" class="btn" aria-disabled="true" aria-describedby="d-why">${ico('lock',15)}${esc(it.disabled.label)}</button></div>
    <div class="why" id="d-why">${ico('lock',14)}<span><b>${esc(it.disabled.label)}</b> is unavailable. ${esc(it.disabled.why)}</span></div>
  </section>
  <section class="plane side resolve" data-p="cons" aria-label="Consequence">
    <h4>${ico('arrow-up-right',14)}What happens if you approve<span class="kbd">→</span></h4>
    <div class="reach"><span class="n">${it.reach.n}</span><span class="l">${esc(it.reach.label)}</span></div>
    <div class="dots" id="dots">${'<i></i>'.repeat(it.reach.n)}</div>
    <ul class="cons">${it.consequence.map(c=>`<li class="${c.cls||''}">${ico(c.icon,15)}<span>${esc(c.text)}</span></li>`).join('')}</ul>
  </section>`;
  tri.dataset.f=focusP='dec';
  $('#bar-top').innerHTML=`<span><b>Approval ${cur+1} of ${DATA.items.length}</b></span><span>${esc(it.kind)}</span><span><span class="kbd">1</span><span class="kbd">2</span> switch</span><span class="sp"></span><span style="color:${to.c}">${esc(F(it.from).label)} → ${esc(to.label)}</span>`;
  $('#bar-bot').innerHTML=`<span><span class="kbd">←</span> provenance</span><span><span class="kbd">→</span> consequence</span><span class="sp"></span><span><span class="kbd">Enter</span> hold to confirm</span><span><span class="kbd">Esc</span> step back · stays in Actions</span>`;
  const h=$('#hold');h.addEventListener('pointerdown',startHold);['pointerup','pointerleave'].forEach(e=>h.addEventListener(e,cancelHold));
  $('#chip').innerHTML=`${ico('stamp',15)}${esc(DATA.queueLabel.replace('{n}',DATA.items.length-cur))}<span class="kbd">Enter</span>`;
}
function rack(p){focusP=p;tri.dataset.f=p}
function open(){state='open';draw();lb.classList.add('on');app.classList.add('back');$('#chip').style.visibility='hidden';
  later(()=>{lb.classList.add('in');$('#hold').focus({preventScroll:true})},RM.on?0:T('base'))}
function stepBack(){if(state!=='open')return;state='back';cancelHold();lb.classList.remove('in');later(()=>{lb.classList.remove('on');app.classList.remove('back');$('#chip').style.visibility='visible'},RM.on?0:T('base'))}
/* hold to confirm: confirmation through motion, and a hold you can let go of */
function startHold(){if(state!=='open'||holdT)return;rack('dec');const h=$('#hold');h.classList.add('holding');holdT=setTimeout(confirmIt,T('run'))}
function cancelHold(){clearTimeout(holdT);holdT=null;const h=$('#hold');h&&h.classList.remove('holding')}
function confirmIt(){holdT=null;const it=DATA.items[cur];state='done';rack('cons');
  const dots=$$('#dots i'),step=T('calm')/dots.length;dots.forEach((d,i)=>later(()=>d.classList.add('on'),RM.on?0:i*step));
  later(()=>{$('#d-title').textContent=it.done.replace('{n}',it.reach.n);$('#d-q').textContent='';$('#hold').innerHTML=`${ico('check',16)}Done`;rack('dec')},T('calm')+T('base'));
  later(()=>{if(cur<DATA.items.length-1){cur++;state='open';lb.classList.remove('in');later(()=>{draw();lb.classList.add('in');$('#hold').focus({preventScroll:true})},T('base'))}else{state='open';stepBack()}},T('still'));
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.repeat){if(state==='open'&&(!e.target.closest('.btn')||e.target.id==='hold')){e.preventDefault();startHold()}else if(state!=='open'&&state!=='done'){e.preventDefault();open()}}
  else if(e.key==='ArrowLeft'&&state==='open'){rack(focusP==='cons'?'dec':'prov')}
  else if(e.key==='ArrowRight'&&state==='open'){rack(focusP==='prov'?'dec':'cons')}
  else if((e.key==='1'||e.key==='2')&&state==='open'){cur=+e.key-1;draw();lb.classList.add('in')}
  else if(e.key==='Escape'){stepBack()}
  else if(e.key==='r'||e.key==='R')replay();
});
document.addEventListener('keyup',e=>{if(e.key==='Enter')cancelHold()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='later')stepBack();if(b.dataset.act==='return'){$('#d-q').textContent='Returned to the requester with your note.'}});
$('#chip').addEventListener('click',open);
function replay(){clearLater();cancelHold();cur=0;state='idle';lb.classList.remove('on','in');app.classList.remove('back');draw();$('#chip').style.visibility='visible';
  later(open,T('run'));later(()=>rack('prov'),T('run')+T('run'));later(()=>rack('cons'),T('run')*3);later(()=>rack('dec'),T('run')*4+T('calm'))}
renderHints([['R','replay'],['← →','rack focus']]);
Icons.hydrate();replay();
</script>
</body>
</html>
