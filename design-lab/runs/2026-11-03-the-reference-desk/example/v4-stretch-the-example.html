<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask by example · V4 · Stretch the example</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ======================================================================
   Proposed tokens (mixes of kit tokens; listed in notes.md as "needs token")
   ====================================================================== */
:root{
  --x-proposed-type-micro:.6875rem;                                            /* --type-micro: mono numerals in data (also wear-and-time, catalogue) */
  --x-proposed-quiet:.62;                                                      /* --opacity-quiet: left-out and unavailable things */
  --x-proposed-here:var(--floor-department-high);                              /* the floor this page sits on (Department) */
  --x-proposed-here-soft:color-mix(in srgb,var(--floor-department-high) 16%,transparent);
  --x-proposed-lit:color-mix(in srgb,var(--green) 80%,var(--light));           /* a record the answer keeps (catalogue: lit) */
  --x-proposed-lit-wash:color-mix(in srgb,var(--green) 9%,transparent);
  --x-proposed-beacon:var(--light);                                            /* the example itself: the light language's beacon */
  --x-proposed-beacon-glow:color-mix(in srgb,var(--light) 55%,transparent);
  /* --mark-guess: what the model gateway proposed. Never solid, never upright: dotted edge, italic, its own hue */
  --x-proposed-guess:color-mix(in srgb,var(--info) 72%,var(--ink));
  --x-proposed-guess-wash:color-mix(in srgb,var(--info) 8%,transparent);
  /* six ways to be empty (catalogue grammar), the ones this surface meets */
  --x-proposed-gap-ink:color-mix(in srgb,var(--ink-muted) 78%,transparent);
  --x-proposed-gap-tick:var(--space-1);
  --x-proposed-hatch:color-mix(in srgb,var(--ink-muted) 34%,transparent);
  --x-proposed-stale:repeating-linear-gradient(45deg,transparent 0 calc(var(--space-1) - 1px),var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-unseen:repeating-linear-gradient(135deg,transparent 0 calc(var(--space-1) - 1px),var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
}
:root,.mk-gap{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.micro{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.ic{display:inline-flex;vertical-align:middle}
.ic svg{width:1em;height:1em}

/* ---- app frame ---- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr)}
.rail{background:color-mix(in srgb,var(--slate-deep) 70%,transparent);border-right:1px solid var(--hairline);padding:var(--edge) var(--edge-tight) calc(var(--space-6) + var(--space-1));display:flex;flex-direction:column;gap:var(--space-1);min-height:0}
.rail .an{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light);padding:var(--space-2);margin-bottom:var(--space-3)}
.nav{display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-meta);border-radius:var(--radius-key)}
.nav.on{background:var(--surface-raised);color:var(--ink)}
.nav.off{opacity:var(--x-proposed-quiet);cursor:help}
.nav .n{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono)}
.rail .gw{margin-top:auto;padding:var(--space-2);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border:1px dashed color-mix(in srgb,var(--x-proposed-guess) 50%,transparent)}
.rail .gw b{font-weight:400;color:var(--ink)}
.rail .gw .row{display:flex;gap:var(--space-2);align-items:center;color:var(--x-proposed-guess);margin-bottom:var(--space-1)}
body.model-off .rail .gw{border-color:var(--hairline-strong)}
body.model-off .rail .gw .row{color:var(--ink-muted)}
.rail .fl{padding:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rail .fl i.bar{display:block;width:var(--space-5);height:2px;border-radius:1px;background:var(--x-proposed-here);margin-bottom:var(--space-2);box-shadow:0 0 var(--glow-blur) var(--x-proposed-here)}
.rail .fl b{font-weight:400;color:var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) var(--space-2);align-items:center;padding:var(--space-2);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted)}
.main{position:relative;padding:var(--edge) var(--space-6) calc(var(--space-6) + var(--space-2));overflow:hidden;display:flex;flex-direction:column;min-height:0;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-4)}
.head h1{margin:var(--space-2) 0 var(--space-1);font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.head .sub{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);max-width:var(--measure-read)}
.head .sub b{font-weight:400;color:var(--ink)}
.head .tools{display:flex;gap:var(--space-2);flex:none}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);background:var(--surface-inset);white-space:nowrap}
.btn:hover{background:var(--surface-raised)}
.btn.on{border-color:var(--x-proposed-here);color:var(--light)}
.btn .kbd{margin-left:var(--space-1)}

/* ---- two registers: the admin word one step down ---- */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);letter-spacing:0}
body.tech .tk{display:block}
body.tech span.tk{display:inline;margin-left:var(--space-2)}

/* ---- facts versus guesses ---- */
.fact{font-style:normal}
.guess{font-style:italic;color:var(--x-proposed-guess);text-decoration:underline dotted color-mix(in srgb,var(--x-proposed-guess) 70%,transparent);text-underline-offset:3px}
.gtag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);font-style:normal;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-proposed-guess);border:1px dashed color-mix(in srgb,var(--x-proposed-guess) 60%,transparent);border-radius:var(--radius-key);padding:0 var(--space-1);background:var(--x-proposed-guess-wash);white-space:nowrap}
.gtag svg{width:.9em;height:.9em}
.rtag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:0 var(--space-1);white-space:nowrap}
.rtag svg{width:.9em;height:.9em}
body.model-off .gw-only{opacity:var(--x-proposed-quiet)}
.offwhy{display:none;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
body.model-off .offwhy{display:block}
body.model-off .gw-hide{display:none!important}

/* ---- the empty marks (catalogue) ---- */
.mk-gap{display:inline-block;background:var(--x-proposed-gap);min-width:calc(var(--space-5) + var(--space-2));height:var(--space-4);vertical-align:-3px}
.mk-gap.w{white-space:nowrap;padding:0 var(--space-1);height:auto;line-height:var(--leading-small);color:var(--ink-muted);font-size:var(--type-small)}
.mk-stale{background:var(--x-proposed-stale);padding:0 var(--space-1);border-radius:2px}
.mk-none{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink);border-bottom:1px solid var(--ink-muted);padding:0 1px}
.unseen{background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:flex-start}
.unseen b{font-weight:400;color:var(--ink)}

/* ---- the clarification: one neutral question, both answers priced ---- */
.clar{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.clar .q{color:var(--ink)}
.opt{display:inline-flex;align-items:center;gap:var(--space-2);height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);font-size:var(--type-small);color:var(--ink-muted);transition:border-color var(--motion-base) var(--ease-standard),color var(--motion-base) var(--ease-standard)}
.opt .c{font-family:var(--font-mono);color:var(--ink)}
.opt.on{border-color:var(--x-proposed-here);color:var(--light);background:var(--x-proposed-here-soft)}

/* ---- the workings strip: each step says whether it needed the model ---- */
.work{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2);align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.work .st{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-2);border-radius:var(--radius-key);background:var(--surface-inset);border:1px solid var(--hairline)}
.work .st.g{border:1px dashed color-mix(in srgb,var(--x-proposed-guess) 60%,transparent);color:var(--x-proposed-guess);font-style:italic}
body.model-off .work .st.g{opacity:var(--x-proposed-quiet);text-decoration:line-through}
.work svg{width:.95em;height:.95em;flex:none}
.asof{font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}

/* ---- count ---- */
.count{display:flex;align-items:baseline;gap:var(--space-3)}
.count .n{font:200 var(--type-display)/1 var(--font-sans);color:var(--light);font-variant-numeric:tabular-nums;min-width:1.2ch}
.count .l{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.count .l b{font-weight:400;color:var(--ink)}
.pulse{animation:pulse var(--motion-calm) var(--ease-out)}
@keyframes pulse{from{color:var(--x-proposed-lit);text-shadow:0 0 var(--glow-blur) var(--x-proposed-lit)}}

.x-cap{max-width:calc(100% - var(--space-6));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:var(--motion-quick)!important;animation-name:fadein!important;transition-property:opacity!important;transition-duration:var(--motion-quick)!important}
  @keyframes fadein{from{opacity:0}}
}
@media (max-width:1400px){ .main{padding-left:var(--space-5);padding-right:var(--space-5)} }

/* ---- V4: the example is a point; stretch a net around it and watch others fall in ---- */
.cols{display:grid;grid-template-columns:var(--measure-card) minmax(0,1fr);gap:var(--space-5);flex:1;min-height:0}
.ctl{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.ex{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);color:var(--ink-muted)}
.ex b{font-weight:400;color:var(--light)}
.ex .dot{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--x-proposed-beacon);box-shadow:0 0 var(--glow-blur) var(--x-proposed-beacon-glow);flex:none}
.knob h3{margin:0 0 var(--space-1);display:flex;justify-content:space-between;align-items:baseline;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.knob h3 .v{font-family:var(--font-sans);text-transform:none;letter-spacing:0;font-size:var(--type-meta);color:var(--light)}
.ruler{position:relative;height:var(--target-sm);border-bottom:1px solid var(--hairline-strong)}
.ruler .net{position:absolute;top:var(--space-2);bottom:0;background:var(--x-proposed-here-soft);border:1px solid var(--x-proposed-here);border-bottom:0;border-radius:var(--radius-key) var(--radius-key) 0 0;transition:left var(--motion-slow) var(--ease-standard),width var(--motion-slow) var(--ease-standard)}
.ruler .me{position:absolute;bottom:calc(var(--space-1) * -1);width:var(--space-2);height:var(--space-2);margin-left:calc(var(--space-1) * -1);border-radius:var(--radius-pill);background:var(--x-proposed-beacon);box-shadow:0 0 var(--glow-blur) var(--x-proposed-beacon-glow)}
.ruler .snap{position:absolute;top:0;bottom:calc(var(--space-2) * -1);width:1px;background:var(--hairline-strong)}
.ticks{position:relative;height:var(--space-5);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.ticks span{position:absolute;top:var(--space-2);transform:translateX(-50%);white-space:nowrap}
.snaps{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-1)}
.kinds{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.kinds .opt .c{color:var(--ink-muted)}
.kinds .opt.on .c{color:var(--light)}
.plot{position:relative;min-height:0;display:flex;flex-direction:column}
.plot svg{width:100%;flex:1;min-height:0}
.plot .ax{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--ink-muted)}
.plot .grid line{stroke:var(--hairline)}
.plot .netr{fill:var(--x-proposed-here-soft);stroke:var(--x-proposed-here);stroke-width:1;transition:x var(--motion-slow) var(--ease-standard),y var(--motion-slow) var(--ease-standard),width var(--motion-slow) var(--ease-standard),height var(--motion-slow) var(--ease-standard)}
.plot .d{transition:opacity var(--motion-slow) var(--ease-standard)}
.plot .d circle{fill:var(--ink-muted);transition:fill var(--motion-slow) var(--ease-standard)}
.plot .d.out{opacity:.35}
.plot .d.kindout{opacity:.18}
.plot .d.in circle{fill:var(--x-proposed-lit)}
.plot .d.me circle{fill:var(--x-proposed-beacon);filter:drop-shadow(0 0 var(--space-2) var(--x-proposed-beacon-glow))}
.plot .d text{font:400 var(--type-small) var(--font-sans);fill:var(--ink);opacity:0;transition:opacity var(--motion-slow) var(--ease-standard)}
.plot .d.in text,.plot .d.me text{opacity:1}
.plot .d.me text{fill:var(--light)}
.plot .gut rect{fill:none;stroke:var(--hairline-strong);stroke-dasharray:3 3}
.plot .gut text{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--ink-muted)}
.plot .gut .g circle{fill:none;stroke:var(--ink-muted)}
.plot .gut .g.in circle{stroke:var(--x-proposed-lit)}
.plot .gut .g text{font:400 var(--type-small) var(--font-sans);fill:var(--ink)}
.side{display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-2)}
.list{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.list b{font-weight:400;color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--hairline)}
@media (max-width:1400px){.cols{grid-template-columns:var(--measure-drawer) minmax(0,1fr)}}
</style>

<div class="app" id="app"></div>
<div class="x-cap"><b>Ask by example · V4</b> the example is a point; stretch a net round it and others fall in · Shneiderman's HomeFinder and FilmFinder, a fishing net</div>
<script>
/* ---- Sample data: ONE object. Every name, label, count and date on the page comes from here. ---- */
const DATA = {

    { id: 's12', name: 'Riverbank Compost',       does: 'Green waste collection and composting', kind: 'grounds', region: 'North', value: 44,  lastHeard: '2026-01-15', src: 'Invoice, Accounts payable', contracts: 1, incidents: 0, meaning: .82 },
    { id: 's6',  name: 'Moorside Grounds',        does: 'Grounds maintenance and gritting',   kind: 'grounds',   region: 'North', value: 120, lastHeard: '2026-02-25', src: 'Winter plan meeting', contracts: 1, incidents: 0, meaning: .31 },
    { id: 's13', name: 'Ashby Bins',              does: 'Wheelie bin supply and repair',      kind: 'equipment', region: 'North', value: 30,  lastHeard: '2026-02-28', src: 'Delivery note', contracts: 1, incidents: 0, meaning: .52 },
    { id: 's16', name: 'Holm Road Salt',          does: 'Road salt supply',                   kind: 'grounds',   region: 'North', value: 52,  lastHeard: '2026-03-12', src: 'Order confirmation', contracts: 1, incidents: 0, meaning: .18 },
    { id: 's7',  name: 'Tarn Fleet Hire',         does: 'Van and lorry hire',                 kind: 'fleet',     region: 'North', value: 260, lastHeard: '2026-10-02', src: 'Fleet desk email', contracts: 3, incidents: 1, meaning: .27 },
    { id: 's9',  name: 'Pennine Fuel Cards',      does: 'Fuel cards for the fleet',           kind: 'fuel',      region: 'North', value: 180, lastHeard: '2025-12-19', src: 'Statement, Accounts payable', contracts: 1, incidents: 0, meaning: .08 },
    { id: 's14', name: 'Wolds Drainage',          does: 'Drain and gully clearance',          kind: 'grounds',   region: 'East',  value: 70,  lastHeard: '2026-04-30', src: 'Job sheet', contracts: 1, incidents: 0, meaning: .44 },
    { id: 's10', name: 'Dale Cleaning Co',        does: 'Office and depot cleaning',          kind: 'cleaning',  region: 'West',  value: 64,  lastHeard: null, gapWho: 'Sam Ortiz, Procurement desk', contracts: 1, incidents: 0, meaning: .22 },
    { id: 's8',  name: 'Harrow & Lyle Catering',  does: 'Canteen and event catering',         kind: 'catering',  region: 'South', value: 75,  lastHeard: '2026-05-11', src: 'Menu review', contracts: 1, incidents: 0, meaning: .05 },
    { id: 's11', name: 'Kestrel IT Support',      does: 'Desktop and network support',        kind: 'it',        region: 'West',  value: 90,  lastHeard: '2026-10-28', src: 'Service desk ticket', contracts: 1, incidents: 0, incidentsChecked: 'Duty desk, 1 Nov', meaning: .02 },
    { id: 's15', name: 'Summit Security',         does: 'Guarding and alarm response',        kind: 'security',  region: 'South', value: 110, lastHeard: '2026-07-07', src: 'Contract variation', contracts: 1, incidents: 0, meaning: .06 },
    { id: 's17', name: 'Eastgate Waste Ltd',      does: 'Bulky waste collection',             kind: 'waste',     region: 'East',  value: 58,  lastHeard: null, gapWho: 'Sam Ortiz, Procurement desk', contracts: 1, incidents: 0, meaning: .88 }
  ],
  // suppliers kept on a floor this person can't open: counted as "some", never a number
  hidden: { floor: 'Finance', ask: 'Priya Nair, finance lead', what: 'suppliers paid only by Finance' },
  // where the example came from, and what uses it
  usedBy: {

  // what the model gateway returns for words that are not a kind (sample; a guess until the person accepts it)

/* ---- shared helpers for the ask-by-example variants ---- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ms = n => parseFloat(cssv(n)) || 0;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const D = DATA;
const S = { model: D.model.on, tech: false };
function fdate(iso, y) { if (!iso) return ''; const [Y, M, d] = iso.slice(0, 10).split('-'); return (+d) + ' ' + MON[+M - 1] + (y ? ' ' + Y : ''); }
function money(k) { return '£' + k + 'k'; }
function nowText() { const t = D.now; return fdate(t, true) + ', ' + t.slice(11, 16); }
function ic(name, size) { return Icons.svg(name, { size: size || 16, stroke: 1.5 }); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const byId = id => D.suppliers.find(s => s.id === id);
const det = k => D.details[k];
function lab(k) { return det(k).label + '<span class="tk">' + esc(det(k).tech) + '</span>'; }
/* a step tag: works from the record, or needs the model gateway */
function rtag(t) { return '<span class="rtag">' + ic('database', 11) + (t || 'from the record') + '</span>'; }
function gtag(t) { return '<span class="gtag">' + ic('bot', 11) + (t || 'model’s guess') + '</span>'; }
/* the not-known-yet value for a missing last-heard */
function heard(s, short) {
  if (!s.lastHeard) return '<span class="mk-gap w" title="Not known yet. ' + esc(s.gapWho) + ' could fill it.">not known yet</span>';
  return '<span class="fact">' + fdate(s.lastHeard, !short) + '</span>';
}
let timers = [];
function later(t, fn) { timers.push(setTimeout(fn, REDUCE ? Math.min(t, ms('--motion-base')) + timers.length : t)); }
function clearLater() { timers.forEach(clearTimeout); timers = []; }

function rail(active) {
  const items = [
    ['book-open', 'What we keep'], ['message-circle-question', 'Ask'], ['bookmark', 'Saved questions', D.saved.count], ['inbox', 'Triage', 3], ['lock', 'Studio']
  ];
  return '<aside class="rail"><div class="an">' + esc(D.app) + '</div>' +
    items.map(([i, l, n]) => '<button class="nav' + (l === active ? ' on' : '') + (i === 'lock' ? ' off' : '') + '"' + (i === 'lock' ? ' title="Admins change the structure in the studio. Ask ' + esc(D.people.admin) + '."' : '') + '>' + ic(i) + '<span>' + l + '</span>' + (n ? '<span class="n">' + n + '</span>' : '') + '</button>').join('') +
    '<div class="gw" id="gwbox"></div>' +
    '<div class="fl"><i class="bar"></i><b>' + esc(D.floor.name) + '</b>, a ' + esc(D.floor.kind.toLowerCase()) + '. ' + esc(D.floor.note) + '</div>' +
    '<div class="keys" id="keys"></div></aside>';
}
function gwbox() {
  const b = $('#gwbox'); if (!b) return;
  b.innerHTML = S.model
    ? '<div class="row">' + ic('bot', 14) + '<span>Model gateway on</span></div>Steps it does are marked <span class="gtag">guess</span>. ' + D.model.callsLeft + ' asks left today.'
    : '<div class="row">' + ic('bot', 14) + '<span>Model gateway off</span></div>' + esc(D.model.offWhy) + ' <b>' + esc(D.model.whoCan) + '</b> Everything marked ' + rtag('record') + ' still works.';
}
function keys(list) {
  if (!$('#keys')) return;
  const all = list.concat([['M', 'model gateway on / off'], ['T', 'technical words'], ['R', 'replay']]);
  $('#keys').innerHTML = all.map(k => '<span class="kbd">' + k[0] + '</span><span>' + k[1] + '</span>').join('');
}
/* boot: draws the frame, wires M T R, plays the demo ~1.2 s after load */
function boot(o) {
  document.body.classList.toggle('model-off', !S.model);
  const play = () => { clearLater(); o.reset(); if (!$('#keys').innerHTML) keys(o.keys || []); gwbox(); later(ms('--motion-run'), o.demo); };
  document.addEventListener('keydown', e => {
    if (e.target.matches('input')) { if (e.key === 'Escape') e.target.blur(); return; }
    const k = e.key.toLowerCase();
    if (k === 'r') play();
    else if (k === 'm') { S.model = !S.model; document.body.classList.toggle('model-off', !S.model); gwbox(); o.render && o.render(); }
    else if (k === 't') { S.tech = !S.tech; document.body.classList.toggle('tech', S.tech); const b = $('#tbtn'); b && b.classList.toggle('on', S.tech); }
    else o.key && o.key(k, e);
  });
  const tb = $('#tbtn'); tb && tb.addEventListener('click', () => document.dispatchEvent(new KeyboardEvent('keydown', { key: 't' })));
  Icons.hydrate(document.body);
  play();
}

const EX = byId('s1');
const T0 = Date.parse('2025-11-01'), T1 = Date.parse(D.now.slice(0, 10));
const V0 = Math.log(20), V1 = Math.log(320);
let line, vlo, vhi, kinds;
function reset() { line = Date.parse(EX.lastHeard) + 864e5; vlo = EX.value * .8; vhi = EX.value * 1.25; kinds = { [EX.kind]: true }; draw(); }
const tx = t => (t - T0) / (T1 - T0), vy = v => (Math.log(v) - V0) / (V1 - V0);
const inNet = s => s.lastHeard && Date.parse(s.lastHeard) < line && s.value >= vlo && s.value <= vhi;
function lineText() { const sp = D.spring.find(o => Date.parse(o.date) === line); return sp ? sp.label : 'since ' + fdate(new Date(line).toISOString()); }
function draw() {
  const W = 840, H = 470, L = 56, R = 170, TP = 16, B = 34, pw = W - L - R, ph = H - TP - B;
  const X = t => L + tx(t) * pw, Y = v => TP + (1 - vy(v)) * ph;
  const shown = D.suppliers.filter(s => kinds[s.kind]);
  const lit = shown.filter(s => s.id !== EX.id && inNet(s));
  const months = []; for (let m = 0; m <= 12; m += 2) { const d = new Date(T0); d.setMonth(d.getMonth() + m); months.push(d); }
  const vals = [25, 50, 100, 200, 300];
  const pts = D.suppliers.filter(s => s.lastHeard).map(s => {
    const c = s.id === EX.id ? 'me' : !kinds[s.kind] ? 'kindout' : inNet(s) ? 'in' : 'out';
    return `<g class="d ${c}" transform="translate(${X(Date.parse(s.lastHeard)).toFixed(1)},${Y(s.value).toFixed(1)})"><title>${esc(s.name)}: ${D.kinds[s.kind]}, ${money(s.value)}, heard ${fdate(s.lastHeard, true)}</title><circle r="${c === 'me' ? 6 : 4.5}"/><text x="9" y="4">${esc(s.name)}</text></g>`;
  }).join('');
  const unk = D.suppliers.filter(s => !s.lastHeard);
  const gx = L + pw + 24;
  const gut = `<g class="gut"><rect x="${gx}" y="${TP}" width="${R - 30}" height="${ph}" rx="4"/><text x="${gx + 8}" y="${TP + 18}">NOT KNOWN YET</text><text x="${gx + 8}" y="${TP + 34}">no date to place</text>${unk.map(s => `<g class="g ${kinds[s.kind] && s.value >= vlo && s.value <= vhi ? 'in' : ''}" transform="translate(${gx + 14},${Y(s.value).toFixed(1)})" opacity="${kinds[s.kind] ? 1 : .3}"><circle r="4.5" stroke-dasharray="2 2"/><text x="9" y="4">${esc(s.name.split(' ')[0])}</text></g>`).join('')}</g>`;
  const springs = D.spring.map(o => `<line x1="${X(Date.parse(o.date))}" x2="${X(Date.parse(o.date))}" y1="${TP}" y2="${TP + ph}" stroke="var(--hairline-strong)" stroke-dasharray="2 4"/><text class="ax" x="${X(Date.parse(o.date)) + 4}" y="${TP + 12 + D.spring.indexOf(o) * 14}">${o.label.replace('since ', '')}</text>`).join('');
  const kc = k => D.suppliers.filter(s => s.kind === k && inNet(s)).length;
  $('#app').innerHTML = rail('Ask') + `<main class="main">
    <header class="head"><div><div class="eyebrow">${esc(D.app)} · ask by example</div><h1>Stretch the example</h1>
      <div class="sub"><b>${esc(EX.name)}</b> is the bright point. Stretch the net around it: <b>wider in time, wider in money, more kinds</b>. Others fall in as you go, and nothing outside the net disappears.</div></div>
      <div class="tools"><button class="btn" id="tbtn">${ic('code-xml')} Technical words <span class="kbd">T</span></button></div></header>
    <div class="cols">
      <section class="ctl">
        <div class="ex"><span class="dot"></span><span>Example: <b>${esc(EX.name)}</b>, ${D.kinds[EX.kind]}, ${EX.region}</span></div>
        <div class="knob"><h3>${lab('lastHeard')}<span class="v">${'before ' + fdate(new Date(line).toISOString())}</span></h3>
          <div class="ruler"><div class="net" style="left:0;width:${(tx(line) * 100).toFixed(1)}%"></div>${D.spring.map(o => '<span class="snap" style="left:' + (tx(Date.parse(o.date)) * 100).toFixed(1) + '%"></span>').join('')}<span class="me" style="left:${(tx(Date.parse(EX.lastHeard)) * 100).toFixed(1)}%"></span></div>
          <div class="ticks">${[0, 4, 8, 12].map(m => { const d = new Date(T0); d.setMonth(d.getMonth() + m); return '<span style="left:' + (tx(+d) * 100) + '%">' + MON[d.getMonth()] + '</span>'; }).join('')}</div>
          <div class="clar"><span class="q">“Since spring” could stop at</span></div>
          <div class="snaps">${D.spring.map((o, i) => '<button class="opt' + (Date.parse(o.date) === line ? ' on' : '') + '" data-snap="' + o.id + '">' + o.long.replace(/^./, c => c.toUpperCase()) + ' <span class="c">' + D.suppliers.filter(s => kinds[s.kind] && s.lastHeard && Date.parse(s.lastHeard) < Date.parse(o.date) && s.value >= vlo && s.value <= vhi).length + '</span></button>').join('')}</div></div>
        <div class="knob"><h3>${lab('value')}<span class="v">${money(Math.round(vlo))} to ${money(Math.round(vhi))}</span></h3>
          <div class="ruler"><div class="net" style="left:${(vy(vlo) * 100).toFixed(1)}%;width:${((vy(vhi) - vy(vlo)) * 100).toFixed(1)}%"></div><span class="me" style="left:${(vy(EX.value) * 100).toFixed(1)}%"></span></div>
          <div class="ticks">${vals.map(v => '<span style="left:' + (vy(v) * 100) + '%">' + money(v) + '</span>').join('')}</div></div>
        <div class="knob"><h3>${lab('kind')}<span class="v">${Object.keys(kinds).filter(k => kinds[k]).map(k => D.kinds[k]).join(', ')}</span></h3>
          <div class="kinds">${Object.keys(D.kinds).filter(k => D.suppliers.some(s => s.kind === k)).map(k => '<button class="opt' + (kinds[k] ? ' on' : '') + '" data-kind="' + k + '">' + D.kinds[k] + ' <span class="c">' + (kinds[k] ? kc(k) : '+' + kc(k)) + '</span></button>').join('')}</div></div>
      </section>
      <section class="plot">
        <div class="count"><span class="n" id="n">${lit.length + 1}</span><span class="l"><b>in the net, with the example</b><br>${shown.length - lit.length - 1} of ${Object.keys(kinds).filter(k => kinds[k]).length > 1 ? 'these kinds' : 'the same kind'} outside it · ${unk.filter(s => kinds[s.kind]).length} can't be placed in time</span></div>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Suppliers by when we last heard from them and what they are worth">
          <g class="grid">${months.map(d => `<line x1="${X(+d)}" x2="${X(+d)}" y1="${TP}" y2="${TP + ph}"/>`).join('')}${vals.map(v => `<line x1="${L}" x2="${L + pw}" y1="${Y(v)}" y2="${Y(v)}"/>`).join('')}</g>
          ${months.map(d => `<text class="ax" x="${X(+d)}" y="${H - 12}" text-anchor="middle">${+d >= T1 - 864e5 * 3 ? 'today' : MON[d.getMonth()] + (d.getMonth() === 0 ? ' ' + d.getFullYear() : '')}</text>`).join('')}
          ${vals.map(v => `<text class="ax" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${money(v)}</text>`).join('')}
          
          ${springs}
          <rect class="netr" rx="4" x="${L}" y="${Y(vhi)}" width="${X(line) - L}" height="${Y(vlo) - Y(vhi)}"/>
          ${pts}${gut}
        </svg>
        <div class="side"><div class="list">${lit.length ? 'In the net with the example: ' + lit.map(s => '<b>' + esc(s.name) + '</b>').join(', ') + '.' : 'Only the example so far.'}</div>
          <div class="unseen">${ic('lock', 14)}<span>Some ${esc(D.hidden.what)} sit on <b>${esc(D.hidden.floor)}</b>, outside this picture. Ask <b>${esc(D.hidden.ask)}</b>.</span></div></div>
      </section>
    </div>
    <div class="foot"><div class="work"><span class="micro">workings</span><span class="st">${ic('database')}${D.suppliers.length} ${esc(D.kind.many)}, your floor and above</span><span class="st">${ic('calendar')}latest note before ${fdate(new Date(line).toISOString())}</span><span class="st">${ic('scale')}${money(Math.round(vlo))}–${money(Math.round(vhi))}</span><span class="rtag">${ic('database', 11)}no step needs the model gateway</span></div><div class="asof">asked ${nowText()} · <span class="kbd">S</span> save</div></div>
  </main>`;
  Icons.hydrate($('#app')); keys([['← →', 'stretch in time'], ['↑ ↓', 'stretch in money'], ['K', 'next kind'], ['1 2', 'which spring']]); gwbox();
  $$('[data-snap]').forEach(b => b.addEventListener('click', () => snap(b.dataset.snap)));
  $$('[data-kind]').forEach(b => b.addEventListener('click', () => { kinds[b.dataset.kind] = !kinds[b.dataset.kind]; draw(); }));
}
function snap(id) { line = Date.parse(D.spring.find(o => o.id === id).date); draw(); $('#n').classList.add('pulse'); }
function widen(f) { vlo = Math.max(20, vlo / f); vhi = Math.min(320, vhi * f); draw(); }
function demo() {
  const st = ms('--motion-slow');
  const target = Date.parse(D.spring[0].date), start = line, n = 4;
  for (let i = 1; i <= n; i++) later(st * i, () => { line = start + (target - start) * i / n; draw(); });
  later(st * (n + 1), () => snap('season'));
  later(st * (n + 2) + ms('--motion-base'), () => widen(2));
  later(st * (n + 3) + ms('--motion-base'), () => { widen(1.5); $('#n').classList.add('pulse'); });
  later(st * (n + 3) + ms('--motion-run') * 2, () => { kinds.grounds = true; draw(); $('#n').classList.add('pulse'); });
}
boot({ reset, demo, render: draw, key: (k, e) => {
  if (e.key === 'ArrowRight') { line += 7 * 864e5; draw(); } else if (e.key === 'ArrowLeft') { line -= 7 * 864e5; draw(); }
  else if (e.key === 'ArrowUp') widen(1.25); else if (e.key === 'ArrowDown') widen(.8);
  else if (k === '1') snap('season'); else if (k === '2') snap('fy');
  else if (k === 'k') { const ks = Object.keys(D.kinds).filter(x => !kinds[x] && D.suppliers.some(s => s.kind === x)); if (ks.length) { kinds[ks[0]] = true; draw(); } }
} });
</script>
