<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask by example · V1 · Sketch a row</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*COMMON_CSS*/
/* ---- V1: Zloof's skeleton table. The first row is a sketch you write in ---- */
.said{font:200 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--ink-muted);margin:0 0 var(--space-2);max-width:var(--measure-wide)}
.said b{font-weight:300;color:var(--light);border-bottom:2px solid var(--x-proposed-here)}
.said b.g{color:var(--x-proposed-guess);font-style:italic;border-bottom:2px dotted var(--x-proposed-guess)}
.said .from{display:block;font:400 var(--type-small)/var(--leading-small) var(--font-sans);color:var(--ink-muted)}
.said .from q{color:var(--ink)}
.grid{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--type-meta)}
.grid col.c-name{width:24%}.grid col.c-kind{width:20%}.grid col.c-region{width:12%}.grid col.c-value{width:13%}.grid col.c-heard{width:17%}.grid col.c-inc{width:14%}
.grid th{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:0 var(--space-2) var(--space-1);vertical-align:bottom}
.grid th .tk{text-transform:none}
.sk td{padding:var(--space-1);vertical-align:top}
.cell{position:relative;display:flex;align-items:center;height:var(--target-sm);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);background:var(--surface-inset);padding:0 var(--space-2);transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard)}
.cell input{width:100%;background:none;border:0;outline:0;font:400 var(--type-meta)/1 var(--font-sans);color:var(--light)}
.cell input::placeholder{color:var(--ink-muted);opacity:var(--x-proposed-quiet);font-style:italic}
.cell.set{border-style:solid;border-color:var(--x-proposed-here);background:var(--x-proposed-here-soft)}
.cell.g{border-style:dashed;border-color:var(--x-proposed-guess);background:var(--x-proposed-guess-wash)}
.cell:focus-within{border-color:var(--focus)}
.under{min-height:var(--space-5);padding:var(--space-1) var(--space-1) 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.under .opt{margin:var(--space-1) var(--space-1) 0 0}
.under .acc{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.rows td{padding:0 var(--space-2);height:calc(var(--target-sm) - var(--space-1));border-bottom:1px solid var(--hairline);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows tr{transition:opacity var(--motion-slow) var(--ease-standard)}
.rows tr.keep td:first-child{box-shadow:inset 2px 0 0 var(--x-proposed-lit);color:var(--light)}
.rows tr.keep td.hit{color:var(--x-proposed-lit)}
.rows tr.keep td.hitg{color:var(--x-proposed-guess);font-style:italic}
.opt{white-space:nowrap}
.rows tr.ex td:first-child::after{content:' · example';font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.rows .mono{font-size:var(--type-small)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,var(--measure-card));gap:var(--space-5);flex:1;min-height:0}
.left{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.side{display:flex;flex-direction:column;gap:var(--space-3);min-height:0;font-size:var(--type-small);line-height:var(--leading-small)}
.grp{border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.grp h3{margin:0 0 var(--space-1);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:center}
.grp h3 .n{color:var(--ink)}
.grp p{margin:0;color:var(--ink-muted)}
.grp p b{font-weight:400;color:var(--ink)}
.grp .why{color:var(--ink);text-decoration:line-through;text-decoration-color:var(--ink-muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--hairline)}
.hide-out .rows tr.out{display:none}
@media (max-width:1400px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,var(--measure-drawer))}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="x-cap"><b>Ask by example · V1</b> sketch the row you want, blank means any · Zloof's QBE, dynamic queries, spreadsheet filter row</div>
<script>
/*DATA*/
/*COMMON_JS*/
const COLS = [
  { k: 'name', w: 'c-name', label: 'supplier', tech: 'rdfs:label', ph: 'any supplier' },
  { k: 'kind', w: 'c-kind', ph: 'anything they do' },
  { k: 'region', w: 'c-region', ph: 'anywhere' },
  { k: 'value', w: 'c-value', ph: 'any amount' },
  { k: 'lastHeard', w: 'c-heard', ph: 'any time' },
  { k: 'incidents', w: 'c-inc', ph: 'any number' }
];
let sk, spring, accepted;
function reset() { sk = { name: '', kind: '', region: '', value: '', lastHeard: '', incidents: '' }; spring = null; accepted = false; draw(); }

/* reading one cell: exact words first, then spelling, then (only if on) the model gateway */
function readKind(v) {
  v = v.trim().toLowerCase(); if (!v) return null;
  const k = Object.keys(D.kinds).find(k => D.kinds[k].toLowerCase() === v);
  if (k) return { kind: k, how: 'rec' };
  const g = D.modelWords[v];
  if (accepted && g) return { kind: g, how: 'acc', words: v };
  if (S.model && g) return { kind: g, how: 'guess', words: v };
  const w = v.split(/\s+/).filter(x => x.length > 2).map(x => x.replace(/s$/, ''));
  return { spell: w, how: 'spell', words: v };
}
function readHeard(v) {
  v = v.trim().toLowerCase(); if (!v) return null;
  if (/spring/.test(v)) return spring ? { before: spring.date, how: 'rec', said: spring.label } : { ask: true };
  const m = v.match(/before (\d{1,2}) (\w{3})/); if (m) { const mi = MON.findIndex(x => x.toLowerCase() === m[2]) + 1; return { before: '2026-' + String(mi).padStart(2, '0') + '-' + m[1].padStart(2, '0'), how: 'rec' }; }
  return { bad: true };
}
function test(s) {
  const r = { keep: true, out: null, unknown: null, hit: {} };
  const kv = readKind(sk.kind);
  if (kv) {
    if (kv.kind) { if (s.kind !== kv.kind) { r.keep = false; r.out = r.out || 'kind'; } else r.hit.kind = 1; }
    else if (kv.spell) { const t = (s.does + ' ' + s.name).toLowerCase(); if (!kv.spell.some(w => t.includes(w))) { r.keep = false; r.out = r.out || 'kind'; } else r.hit.kind = 1; }
  }
  const rg = sk.region.trim();
  if (rg) { const not = /^not /i.test(rg), name = rg.replace(/^not /i, '').toLowerCase(); const ok = (s.region.toLowerCase() === name) !== not; if (!ok) { r.keep = false; r.out = r.out || 'region'; } else r.hit.region = 1; }
  const hv = readHeard(sk.lastHeard);
  if (hv && hv.before) {
    if (!s.lastHeard) { if (r.keep) { r.keep = false; r.unknown = 'lastHeard'; } }
    else if (s.lastHeard >= hv.before) { r.keep = false; r.out = r.out || 'lastHeard'; } else r.hit.lastHeard = 1;
  }
  if (r.out) r.unknown = null;
  return r;
}
function cellState(k) {
  if (k === 'kind') { const kv = readKind(sk.kind); return !kv ? '' : kv.how === 'guess' ? 'g' : 'set'; }
  if (k === 'lastHeard') { const h = readHeard(sk.lastHeard); return !h ? '' : h.ask ? 'g' : 'set'; }
  return sk[k] ? 'set' : '';
}
function under(k) {
  if (k === 'kind') {
    const kv = readKind(sk.kind); if (!kv) return '';
    if (kv.how === 'guess') return gtag() + ' “' + esc(kv.words) + '” is not a kind here. It reads like <b class="guess">' + D.kinds[kv.kind] + '</b>. <button class="acc" data-act="accept">Use waste</button>';
    if (kv.how === 'acc') return 'You chose <b>' + D.kinds[kv.kind] + '</b> for “' + esc(kv.words) + '”';
    if (kv.how === 'spell') return rtag('spelling') + ' No kind called “' + esc(kv.words) + '”; matched by spelling in their own words.' + (D.modelWords[kv.words] ? '<span class="offwhy">With the model gateway on, it would suggest a kind.</span>' : '');
    return rtag() + ' a kind of supplier';
  }
  if (k === 'lastHeard') {
    const h = readHeard(sk.lastHeard); if (!h) return '';
    if (h.ask || spring) {
      return '<span class="q">Spring from when?</span><br>' + D.spring.map(o => { const n = countWith(o); return '<button class="opt' + (spring && spring.id === o.id ? ' on' : '') + '" data-spring="' + o.id + '">' + o.label + ' <span class="c">' + n + '</span></button>'; }).join('');
    }
    if (h.bad) return 'Try “before spring” or “before 1 Mar”.';
  }
  return '';
}
function countWith(o) { const keep = spring; spring = o; const n = D.suppliers.filter(s => test(s).keep).length; spring = keep; return n; }

function draw() {
  const res = D.suppliers.map(s => ({ s, r: test(s) }));
  const keep = res.filter(x => x.r.keep), out = res.filter(x => !x.r.keep && !x.r.unknown), unk = res.filter(x => x.r.unknown);
  const ordered = keep.concat(unk, out);
  const kv = readKind(sk.kind), hv = readHeard(sk.lastHeard);
  // the sentence the sketch says
  const parts = [];
  parts.push(kv ? (kv.kind ? '<b' + (kv.how === 'guess' ? ' class="g"' : '') + '>' + D.kinds[kv.kind] + '</b> suppliers' : 'suppliers whose own words mention <b>' + esc(kv.words) + '</b>') : 'all suppliers');
  if (sk.region) parts.push(/^not /i.test(sk.region) ? 'outside <b>' + esc(sk.region.slice(4)) + '</b>' : 'in the <b>' + esc(sk.region) + '</b>');
  if (hv && hv.before) parts.push('last heard from <b>before ' + fdate(hv.before) + '</b>');
  else if (hv && hv.ask) parts.push('last heard from before <b class="g">spring (which?)</b>');
  const any = Object.values(sk).some(Boolean);
  $('#app').innerHTML = rail('Ask') + `<main class="main">
    <header class="head"><div><div class="eyebrow">${esc(D.app)} · ask by example</div><h1>Sketch a row</h1>
      <div class="sub">Write what you want in the dashed row, the way you'd fill in a spreadsheet. <b>Blank means any.</b> The list moves as you type; nothing is thrown away, what's left out says why.</div></div>
      <div class="tools"><button class="btn" id="tbtn">${ic('code-xml')} Technical words <span class="kbd">T</span></button></div></header>
    <div class="said">${any ? 'Show me ' + parts.join(', ') + '.' : 'Show me all suppliers.'}<span class="from">You asked: <q>${esc(D.question)}</q></span></div>
    <div class="cols"><div class="left">
    <table class="grid"><colgroup>${COLS.map(c => '<col class="' + c.w + '">').join('')}</colgroup>
      <thead><tr>${COLS.map(c => '<th>' + (c.label ? c.label + '<span class="tk">' + c.tech + '</span>' : lab(c.k)) + '</th>').join('')}</tr></thead>
      <tbody class="sk"><tr>${COLS.map(c => '<td><div class="cell ' + cellState(c.k) + '"><input data-k="' + c.k + '" value="' + esc(sk[c.k]) + '" placeholder="' + c.ph + '" aria-label="' + (c.label || det(c.k).label) + '"></div><div class="under">' + under(c.k) + '</div></td>').join('')}</tr></tbody>
      <tbody class="rows">${ordered.slice(0, 13).map(({ s, r }) => `<tr class="${r.keep ? 'keep' : 'out'}${s.id === 's1' ? '' : ''}" style="opacity:${r.keep ? 1 : 'var(--x-proposed-quiet)'}">
        <td>${esc(s.name)}</td><td class="${r.hit.kind ? (kv && kv.how === 'guess' ? 'hitg' : 'hit') : ''}">${D.kinds[s.kind]}</td><td class="${r.hit.region ? 'hit' : ''}">${s.staleRegion ? '<span class="mk-stale" title="Last checked 2023">' + s.region + '</span>' : s.region}</td><td class="mono">${money(s.value)}</td><td class="mono ${r.hit.lastHeard ? 'hit' : ''}">${heard(s, true)}</td><td class="mono">${s.incidents || (s.incidentsChecked ? '<span class="mk-none" title="Checked by ' + s.incidentsChecked + '">none</span>' : '0')}</td></tr>`).join('')}
      </tbody></table>
      ${ordered.length > 13 ? '<div class="micro" style="padding:var(--space-2)">' + (ordered.length - 13) + ' more left out, listed on the right</div>' : ''}
    </div>
    <aside class="side">
      <div class="count"><span class="n" id="n">${keep.length}</span><span class="l"><b>${D.kind.many} match</b><br>of ${D.suppliers.length} you can see</span></div>
      ${grp('Left out, and by which cell', out)}
      ${unk.length ? `<div class="grp"><h3><span class="mk-gap" style="min-width:var(--space-4)"></span>Can't tell <span class="n">${unk.length}</span></h3><p>${unk.map(x => '<b>' + esc(x.s.name) + '</b>').join(', ')}: nobody has recorded when we last heard from them. <b>${esc(unk[0].s.gapWho)}</b> could fill it.</p></div>` : ''}
      <div class="unseen">${ic('lock', 14)}<span>Some ${esc(D.hidden.what)} are kept on the <b>${esc(D.hidden.floor)}</b> floor and aren't counted here. Ask <b>${esc(D.hidden.ask)}</b>.</span></div>
    </aside></div>
    <div class="foot"><div class="work">${working(kv, hv)}</div><div class="asof">asked ${nowText()} · <span class="kbd">S</span> save question</div></div>
  </main>`;
  Icons.hydrate($('#app')); keys([['tab', 'next cell'], ['1 2', 'which spring'], ['A', 'accept guess']]); gwbox();
  wire();
}
function grp(title, list) {
  if (!list.length) return '';
  const by = {}; list.forEach(x => (by[x.r.out] = by[x.r.out] || []).push(x.s.name));
  return '<div class="grp"><h3>' + title + ' <span class="n">' + list.length + '</span></h3>' + Object.keys(by).map(k => '<p><span class="why">' + det(k).label + '</span> · ' + by[k].slice(0, 6).map(esc).join(', ') + (by[k].length > 6 ? ' and ' + (by[k].length - 6) + ' more' : '') + '</p>').join('') + '</div>';
}
function working(kv, hv) {
  const st = [];
  st.push('<span class="st">' + ic('database') + 'your floor and above</span>');
  if (kv) st.push(kv.how === 'guess' ? '<span class="st g">' + ic('bot') + '“' + esc(kv.words) + '” read as waste</span>' : kv.how === 'acc' ? '<span class="st">' + ic('user-round-check') + 'waste, your choice</span>' : kv.how === 'spell' ? '<span class="st">' + ic('spell-check') + 'spelling: “' + esc(kv.words) + '”</span>' : '<span class="st">' + ic('database') + 'kind is ' + D.kinds[kv.kind] + '</span>');
  if (hv && hv.before) st.push('<span class="st">' + ic('calendar') + 'latest note before ' + fdate(hv.before) + '</span>');
  return '<span class="micro">workings</span>' + st.join('');
}
function wire() {
  $$('.cell input').forEach(i => i.addEventListener('input', () => { sk[i.dataset.k] = i.value; if (i.dataset.k === 'kind') accepted = false; const k = i.dataset.k, p = i.selectionStart; draw(); const n = $('input[data-k="' + k + '"]'); n.focus(); n.setSelectionRange(p, p); }));
  $$('[data-spring]').forEach(b => b.addEventListener('click', () => pickSpring(b.dataset.spring)));
  const a = $('[data-act="accept"]'); a && a.addEventListener('click', accept);
}
function pickSpring(id) { spring = D.spring.find(o => o.id === id); draw(); $('#n').classList.add('pulse'); }
function accept() { accepted = true; sk.kind = sk.kind; draw(); $('#n').classList.add('pulse'); }
function type(k, text, done) {
  let i = 0; const step = ms('--motion-instant');
  const go = () => { sk[k] = text.slice(0, ++i); draw(); if (i < text.length) later(step, go); else done && done(); };
  go();
}
function demo() {
  type('lastHeard', 'before spring', () => later(ms('--motion-calm'), () => { pickSpring('season');
    later(ms('--motion-run') + ms('--motion-calm'), () => type('kind', 'bin lorries', () => { $('#n').classList.add('pulse');
      later(ms('--motion-run') * 2, () => accept()); })); }));
}
boot({ reset, demo, render: draw, keys: [], key: (k) => { if (k === '1') pickSpring('season'); if (k === '2') pickSpring('fy'); if (k === 'a') accept(); } });
</script>
</body>
</html>
