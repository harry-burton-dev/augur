<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question sheet · V2 · Leiden marks</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*COMMON_CSS*/
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--space-5);align-items:start}
/* the edition: the question sheet set like an edited inscription */
.ed{border-radius:var(--radius-inset);background:var(--surface-pane);border:1px solid var(--hairline);box-shadow:var(--shadow-raised);padding:var(--space-3) var(--space-5) var(--space-3) var(--space-4)}
.ln{display:grid;grid-template-columns:calc(var(--space-8) - var(--space-4)) var(--space-5) minmax(0,1fr);gap:var(--space-2);align-items:baseline;padding:var(--space-1) 0}
.ln .pt{font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:right}
.ln .no{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);opacity:var(--x-quiet);text-align:right}
.ln .tx{font-weight:300;font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-1));color:var(--ink)}
.ln.sm .tx{font-size:var(--type-body);line-height:calc(var(--leading-body) + var(--space-1))}
.ln.first{border-top:1px solid var(--hairline)}
.ln .tx .q{color:var(--light)}
/* the marks: each appears as the edition is made */
.mk{transition:opacity var(--motion-calm) var(--ease-out),color var(--motion-calm) var(--ease-out)}
.raw .mk.br{opacity:0}
.br{font-family:var(--font-mono);color:var(--ink-muted);font-weight:400}
.sup{color:var(--x-proposed-guess-ink);text-decoration:underline dashed var(--x-proposed-guess-ink) 1px;text-underline-offset:5px}
.sup .br{color:var(--x-proposed-guess-ink)}
.raw .sup{color:inherit;text-decoration-color:transparent}
.exp{color:var(--ink-muted)}
.ud{text-decoration:underline dotted var(--ink) 2px;text-underline-offset:5px}
.raw .ud{text-decoration-color:transparent}
.lost{color:var(--ink-muted);letter-spacing:var(--tracking-label);font-family:var(--font-mono);font-size:var(--type-meta)}
.wh{background:var(--x-shadow);border-radius:var(--radius-key);padding:0 var(--space-1);color:var(--ink-muted)}
.wh svg{vertical-align:-2px}
.cn{background:var(--x-gap);padding:0 var(--space-3);color:var(--ink-muted)}
.n{font-family:var(--font-mono);font-size:var(--type-meta);color:var(--light)}
.sep{color:var(--ink-muted);opacity:var(--x-quiet)}
.alt{display:none}
.nogw .sup .g{display:none}
.nogw .alt{display:inline;color:var(--ink);text-decoration:none}
.nogw .sup{text-decoration:none;color:var(--ink)}
.nogw .sup.drop{display:none}
/* apparatus: variant readings under a rule, keyed to lines */
.app{margin-top:var(--space-2);border-top:1px solid var(--hairline-strong);padding-top:var(--space-2);display:grid;gap:2px;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.app b{font-weight:400;color:var(--ink)}
.app .c{color:var(--light)}
.colo{margin-top:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4)}
.colo b{font-weight:400;color:var(--ink)}
/* conventions */
.conv{width:100%;border-collapse:collapse}
.conv th{font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:0 var(--space-2) var(--space-1) 0;vertical-align:bottom}
.conv td{border-top:1px solid var(--hairline);padding:var(--space-1) var(--space-2) var(--space-1) 0;vertical-align:top;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.conv td.sg{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);white-space:nowrap}
.conv td.m b{display:block;font-weight:400;color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta)}
.conv td.w{white-space:nowrap}
.conv th:nth-child(3){white-space:nowrap}
.conv .lo{display:none;font-family:var(--font-mono);opacity:var(--x-quiet)}
.show-tech .conv .lo{display:block}
.conv tr.isg td.w{color:var(--x-proposed-guess-ink)}
.nev{margin-top:var(--space-3);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2) var(--space-3)}
.nev div{border-top:1px solid var(--hairline-strong);padding-top:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.nev b{display:block;font-weight:400;color:var(--ink)}
.offnote{gap:var(--space-2);align-items:flex-start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--warning);margin-top:var(--space-2)}
@media (max-width:1400px){
  .main{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--space-4)}
  .ln .tx{font-size:var(--type-body);line-height:calc(var(--leading-body) + var(--space-1))}
  .ln.sm .tx{font-size:var(--type-meta);line-height:calc(var(--leading-meta) + var(--space-1))}
  .ln{grid-template-columns:var(--space-7) var(--space-4) minmax(0,1fr);padding:2px 0}
  .ed{padding:var(--space-2) var(--space-4) var(--space-2) var(--space-2)}
  .nev{grid-template-columns:minmax(0,1fr);gap:var(--space-1)}
  .nev div{display:grid;grid-template-columns:var(--space-8) minmax(0,1fr);gap:var(--space-2)}
  .conv td.m b{font-size:var(--type-small);line-height:var(--leading-small)}
  .conv td:nth-child(3){display:none}.conv th:nth-child(3){display:none}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top"><div><span class="eyebrow" id="eyebrow"></span><h1 id="h1"></h1><p class="lede" id="lede"></p></div><div id="tg"></div></div>
  <div class="main">
    <div class="dep" style="--i:0"><div class="ed raw" id="ed"></div></div>
    <div class="dep" style="--i:1"><table class="conv" id="conv"></table><div class="offnote" id="off"></div><div class="nev" id="nev"></div></div>
  </div>
</div>
<div class="hints"><span><span class="kbd">G</span> assistant<span class="hl"> on/off</span></span><span><span class="kbd">T</span><span class="hl"> technical</span> words</span><span><span class="kbd">R</span> replay</span></div>
<div class="x-cap"><b>Question sheet · V2</b> Leiden marks: an edition of the question · epigraphers’ Leiden conventions, the apparatus criticus</div>
<script>
/*DATA*/
const SHEET = {
  eyebrow: 'The reference desk · question sheet · Leiden marks',
  title: 'An edition of the question',
  lede: 'Epigraphers print what is on the stone and mark, sign by sign, what the editor supplied, expanded, doubted or found lost. The question sheet is set the same way, so the eye can tell your words, the record and the assistant’s guesses apart in one line.',
  heads: ['Sign', 'Means', 'Who supplies it'],
  partsShort: { question: 'Asked', reading: 'Read as', workings: 'Workings', answer: 'Answer', gap: 'Gaps', saved: 'Kept' }
};
/*COMMON_JS*/
/* marks */
const B = t => `<span class="mk br">${t}</span>`;
const sup = (t, alt, drop) => `<span class="mk sup${drop ? ' drop' : ''}"><span class="g">${B('⟨')}${t}${B('⟩')}</span>${alt ? `<span class="alt">${alt}</span>` : ''}</span>`;
const exp = (w, t) => `${w}<span class="mk exp">${B('(')}${t}${B(')')}</span>`;
const ud = t => `<span class="mk ud">${t}</span>`;
const lost = () => `<span class="mk lost">[ . . . ]</span>`;
const wh = t => `<span class="mk wh">${B('⟦')}${ic('lock', 12)} ${t}${B('⟧')}</span>`;
const cn = t => `<span class="mk cn">${t}</span>`;
const N = n => `<span class="n">${n}</span>`;
const S = ' <span class="sep">·</span> ';
const CONV = [
  { sg: () => `<span class="q">“which suppliers”</span>`, m: 'Your words', d: 'As typed. Kept for good.', lo: 'the text on the stone', w: 'You' },
  { sg: () => `spring${B('(')}<span class="exp">1 Mar</span>${B(')')}`, m: 'Expanded', d: 'A word the org glossary or the record resolves.', lo: '( ) resolved abbreviation', w: 'Glossary or record' },
  { sg: () => `<span class="sup">${B('⟨')}running${B('⟩')}</span>`, m: 'Supplied by the assistant', d: 'A guess, not in your words or the record. Never counted until you accept it.', lo: '⟨ ⟩ editor’s supplement', w: 'The assistant', g: true },
  { sg: () => ud('5'), m: 'Less sure', d: 'From the record, but matched by spelling, not by key.', lo: 'underdot: doubtful letter', w: 'Data Atlas' },
  { sg: () => `<span class="lost">[ . . . ]</span>`, m: 'No record', d: 'Lost for a stretch of time; says when and why.', lo: '[ ] lacuna', w: 'Data Atlas' },
  { sg: () => wh('Finance'), m: 'Not yours to see', d: 'It exists, kept on another floor; says whom to ask.', lo: '⟦ ⟧ erasure', w: 'Data Atlas' },
  { sg: () => cn('&nbsp;'), m: 'Not known yet', d: 'Should be there; nobody has recorded it. Says who could.', lo: 'no Leiden sign: the catalogue’s corner ticks', w: 'Data Atlas' },
  { sg: () => `<span class="lost">vac.</span>`, m: 'None', d: 'Someone checked and there is none.', lo: 'vacat: left blank on purpose', w: 'Data Atlas' }
];
function line(no, pt, tx, cls) { return `<div class="ln ${cls || ''}"><span class="pt">${pt}</span><span class="no">${no}</span><span class="tx">${tx}</span></div>`; }
function render() {
  $('#eyebrow').textContent = SHEET.eyebrow; $('#h1').textContent = SHEET.title; $('#lede').textContent = SHEET.lede; $('#tg').innerHTML = toggles();
  const r = ANS.rows, me = P(Q.by), s = DATA.steps;
  const rowT = x => x.noRecord ? `${x.name} ${lost()}` : x.maybe ? `${x.name} ${x.last.replace(' 2026', '')} ${sup('perhaps ' + x.maybe.date.replace(' 2026', ''), '', true)}` : `${x.name} ${x.last.replace(' 2026', '')}`;
  const L = SHEET.partsShort;
  $('#ed').innerHTML =
      line(1, L.question, `<span class="q">“${Q.words}”</span>`)
    + line(2, L.reading, `Suppliers ${sup('with a running contract', '', true)} with no ${sup('email, delivery note or meeting note', 'email, delivery note or meeting note <span class="sep">(you picked)</span>')} ${exp('since spring', '1 March 2026')}`, 'first')
    + line(3, L.workings, `${N(s[0].n)} suppliers${S}${sup('less ' + s[1].out + ', contracts ended', '', true)} ${N(s[1].n)}${S}${N(fmt(s[2].n))} records in 3 sources and ${wh('invoices')}`, 'sm first')
    + line(4, '', `${N(34)} matched by key, ${ud(N(5))} by spelling${S}${sup('1 by meaning, not counted', '<span class="sep">1 email unmatched, waiting in Triage</span>')}${S}${N(9)} left`, 'sm')
    + line(5, L.answer, `${N(ANS.n)} suppliers: ${r.slice(0, 5).map(rowT).join(', ')},`, 'sm first')
    + line(6, '', `${r.slice(5).map(rowT).join(', ')}.`, 'sm')
    + line(7, L.gap, `${wh('Invoices, kept on Finance: ask ' + P('priya').name)}${S}Carrow ${lost()} before Jan 2026${S}Tamsin, contact person ${cn('Procurement')}`, 'sm first')
    + `<div class="app" id="app">
        <div><b>2</b> since spring] <span class="c">since 1 March</span> ${me.name.split(' ')[1]} 9 : since 1 April (financial year) 12 : since 31 May 17</div>
        <div><b>2</b> with a running contract] supplied by the assistant, accepted by ${me.name.split(' ')[1]} : <i>om.</i> 22</div>
        <div><b>2</b> email, delivery note or meeting note] supplied by the assistant, accepted : <i>add.</i> invoices ${ic('lock', 11)} not yours to search</div>
        <div><b>6</b> Easterby 20 Feb] ⟨perhaps 12 Apr⟩ one email signed “the cleaning crew”, matched by meaning only</div>
      </div>
      <div class="colo"><span><b>${SAV.name}</b></span><span>edition of ${SAV.saved}, ${me.name}</span><span>collated again ${SAV.runs.slice(1).map(x => x.at).join(', ')}</span><span>answer last changed <b>${SAV.changed}</b></span><span>shared with <b>${FL(SAV.shared).name}</b></span><span>${B('⟨ ⟩')} supplied once; reruns never ask the assistant</span></div>`;
  $('#conv').innerHTML = `<thead><tr><th>${SHEET.heads[0]}</th><th>${SHEET.heads[1]}</th><th>${SHEET.heads[2]}</th></tr></thead><tbody>`
    + CONV.map(c => `<tr class="${c.g ? 'isg' : ''}"><td class="sg">${c.sg()}</td><td class="m"><b>${c.m}</b>${c.d}<span class="lo">${c.lo}</span></td><td class="w">${c.w}</td></tr>`).join('') + '</tbody>';
  $('#off').innerHTML = `${ic('circle-alert', 14)}<span>${GW.offWhy} No ⟨ ⟩ appear: you picked what counts, nothing was added, and the one unmatched email waits in Triage. Nobody suggests running contracts: the sentence offers it as a filter, with its count. Guesses never counted, so the rows are the same.</span>`;
  $('#nev').innerHTML = DATA.parts.map(p => `<div><b>${p.plain}</b>never claims ${p.never}</div>`).join('');
  $$('#ed .mk').forEach((m, i) => m.style.transitionDelay = `calc(var(--motion-instant) * ${i})`);
  Icons.hydrate(document.body);
}
render();
function reset() { $('#ed').classList.add('raw'); }
function demo() { later(() => $('#ed').classList.remove('raw'), ms('--motion-base')); }
boot(reset, demo);
</script>
</body>
</html>
