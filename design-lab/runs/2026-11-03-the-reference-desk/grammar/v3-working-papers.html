<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question sheet · V3 · Working papers</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens for the question sheet. Each is a mix of kit tokens and
   is listed as "needs token" in notes.md.
   --------------------------------------------------------------- */
:root{
  /* --x-proposed-guess-ink: the ink of anything the assistant (model gateway) proposed and nobody has confirmed.
     A cool, quieter ink than a fact; never the only carrier (always with the dashed line and a word). */
  --x-proposed-guess-ink: color-mix(in srgb, var(--info) 42%, var(--ink-muted));
  /* --x-proposed-guess-line: the dashed rule under or around a guess. Dashes = "drawn, not surveyed". */
  --x-proposed-guess-line: 1px dashed var(--x-proposed-guess-ink);
  /* --x-proposed-yours: the person's own words, kept verbatim. */
  --x-proposed-yours: var(--light);
  /* carried from the catalogue: six ways to be empty */
  --x-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-gap-tick: var(--space-2);
  --x-gap:
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left top / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left top / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right top / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right top / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left bottom / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) left bottom / 1px var(--x-gap-tick) no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right bottom / var(--x-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-gap-ink),var(--x-gap-ink)) right bottom / 1px var(--x-gap-tick) no-repeat;
  --x-hatch: color-mix(in srgb, var(--ink-muted) 26%, transparent);
  --x-stale: repeating-linear-gradient(45deg, transparent 0 var(--space-2), var(--x-hatch) var(--space-2) calc(var(--space-2) + 1px));
  --x-shadow: repeating-linear-gradient(135deg, transparent 0 var(--space-2), var(--hairline-strong) var(--space-2) calc(var(--space-2) + 1px));
  --x-quiet: .62;
}
body{overflow:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.wrap{max-width:calc(var(--measure-wide) * 1.75);margin:0 auto;padding:var(--space-4) var(--edge) var(--space-7)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
h1{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;margin:var(--space-1) 0 var(--space-1);color:var(--light)}
h2{margin:0;font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.lede{margin:0;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta);max-width:100ch}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.sm{font-size:var(--type-small);line-height:var(--leading-small)}
.lab{font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.tech{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);opacity:var(--x-quiet)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5);margin-bottom:var(--space-4)}
.toggles{display:flex;gap:var(--space-2);flex:none}
#tg{flex:none}
.sw{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);min-height:var(--target-sm);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);background:var(--surface-pane);font-size:var(--type-meta);color:var(--ink);white-space:nowrap}
.sw .ss{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
#swg[aria-checked="false"] .ss{color:var(--warning)}

/* --- the three voices: your words, the record, a guess --- */
.yours{color:var(--x-proposed-yours)}
.yours::before{content:'“'}.yours::after{content:'”'}
.ref{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);vertical-align:super;margin-left:2px}
.guess{color:var(--x-proposed-guess-ink);text-decoration:underline dashed var(--x-proposed-guess-ink) 1px;text-underline-offset:4px}
.gtag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--type-small)/1 var(--font-mono);color:var(--x-proposed-guess-ink);border:var(--x-proposed-guess-line);border-radius:var(--radius-pill);padding:2px var(--space-2);white-space:nowrap;vertical-align:middle}
.rtag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:2px var(--space-2);white-space:nowrap;vertical-align:middle}

/* --- six ways to be empty (from the catalogue) --- */
.gapslot{background:var(--x-gap);padding:var(--space-1) var(--space-3);display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:var(--type-small);line-height:var(--leading-small)}
.gapslot .gl{color:var(--ink-muted)} .gapslot .gw{color:var(--ink)}
.staleage{background:var(--x-stale);padding:0 var(--space-1);border-radius:var(--radius-key);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.shadowslot{background:var(--x-shadow),var(--surface-inset);border:1px solid var(--hairline);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);line-height:var(--leading-small)}
.shadowslot svg{flex:none}
.wavy{display:inline-block;vertical-align:middle}
.floorEdge{border-left:2px solid var(--fc)}
[data-tier="department"]{--fc:var(--floor-department-high)}
[data-tier="team"]{--fc:var(--floor-team-high)}
[data-tier="org"]{--fc:var(--floor-org-high)}
[data-tier="you"]{--fc:var(--floor-you-high)}
.fdot{display:inline-block;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--fc);vertical-align:1px}

/* --- assistant off (G): whatever needed it says so, and the route that works without it shows --- */
.offnote{display:none}
.nogw .offnote{display:flex}
.nogw .needs-gw{opacity:var(--x-quiet)}

/* deposit animation: parts arrive in order, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-quick))}
.pre .dep{opacity:0;transform:translateY(calc(var(--space-1) * -1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}}
.hints{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:999;display:flex;gap:var(--space-3);align-items:center;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);background:var(--scrim);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key)}
.kbd{font:400 var(--type-small)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink)}
@media (max-width:1400px){.hints .hl{display:none}.hints{gap:var(--space-2)}}
.gw-off{display:none!important}
.nogw .gw-on{display:none!important}
.nogw .gw-off{display:inline-flex!important}
.gw-off-g{display:none!important}
.nogw .gw-off-g{display:grid!important}
.gw-off-f{display:none!important}
.nogw .gw-off-f{display:inline-flex!important}

.main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--space-5);align-items:start}
.paper{border-radius:var(--radius-inset);background:var(--surface-pane);border:1px solid var(--hairline);box-shadow:var(--shadow-raised);padding:var(--space-3) var(--space-4)}
/* working-paper header: index, title, prepared / reviewed */
.wph{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-4);align-items:start;padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.idx{font:400 var(--type-heading)/1 var(--font-mono);color:var(--light);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2)}
.wph .t{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.wph .q{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.sig{display:grid;grid-template-columns:auto auto auto;gap:0 var(--space-3);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.sig b{font-weight:400;color:var(--ink)}
.sig .g{color:var(--x-proposed-guess-ink)}
/* the ledger */
.led{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:var(--space-1)}
.led th{font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:var(--space-1) var(--space-2) var(--space-1) 0;vertical-align:bottom}
.led td{padding:3px var(--space-2) 3px 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);vertical-align:top}
.led col.r{width:calc(var(--space-6) - var(--space-2))} .led col.n{width:var(--space-7)} .led col.k{width:var(--space-6)} .led col.p{width:calc(var(--space-8) + var(--space-2))} .led col.a{width:var(--space-7)}
.led td.ref{font-family:var(--font-mono);color:var(--ink-muted)}
.led td.num{font-family:var(--font-mono);text-align:right;color:var(--light)}
.led tr.sec td{border-top:1px solid var(--hairline-strong);padding-top:var(--space-2);font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.led tr.tot td.num{border-bottom:3px double var(--ink);font-size:var(--type-meta)}
.led tr.tot td{font-size:var(--type-meta);line-height:var(--leading-meta)}
.led .o{color:var(--ink-muted)}
.led .yours{color:var(--light)}
.led tr.isg td.st{color:var(--x-proposed-guess-ink)}
.led td.by{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led tr.isg td.by{color:var(--x-proposed-guess-ink)}
.led td.ag{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink)}
/* tickmarks: stamped in order */
.tk{display:inline-flex;align-items:center;justify-content:center;width:calc(var(--space-4) + var(--space-1));height:calc(var(--space-4) + var(--space-1));border-radius:var(--radius-key);color:var(--light);transition:opacity var(--motion-quick) var(--ease-out),transform var(--motion-quick) var(--ease-out)}
.tk.g{border:var(--x-proposed-guess-line);color:var(--x-proposed-guess-ink)}
.tk.l{color:var(--ink-muted)}
.unt .tk{opacity:0;transform:scale(1.4)}
@media (prefers-reduced-motion: reduce){.unt .tk{transform:none}}
.ag .pend{color:var(--ink-muted);opacity:var(--x-quiet)}
.only-off{display:none}
.nogw .only-off{display:table-row}
.nogw .only-on{display:none}
.nogw .sig .g{text-decoration:line-through}
/* right: legend, schedule, open items */
.side{display:flex;flex-direction:column;gap:var(--space-4)}
.leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-1) var(--space-3)}
.leg div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);align-items:start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.leg b{display:block;font-weight:400;color:var(--ink)}
.leg .tech{display:none}
.show-tech .leg .tech{display:block}
.sch{width:100%;border-collapse:collapse;table-layout:fixed}
.sch td{padding:2px var(--space-2) 2px 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);vertical-align:middle}
.sch col.t{width:var(--space-5)}
.sch td.nm{color:var(--light)}
.sch td.d{color:var(--ink)}
.sch td.s{font-family:var(--font-mono);color:var(--ink-muted)}
.oi{display:grid;gap:var(--space-1)}
.oi div{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) calc(var(--space-8) + var(--space-4));gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);border-top:1px solid var(--hairline);padding-top:var(--space-1)}
.oi .w{color:var(--ink-muted)}
.oi .w b{display:block;font-weight:400;color:var(--ink)}
.h3{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-1)}
.nv{display:block;font-family:var(--font-sans);text-transform:none;letter-spacing:0;color:var(--ink-muted);opacity:var(--x-quiet)}
.nvl{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);opacity:var(--x-quiet);margin:0 0 var(--space-1)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-1) var(--space-4)}
.rules div{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rules b{font-weight:400;color:var(--ink)}
.offnote{gap:var(--space-2);align-items:flex-start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--warning)}
@media (max-width:1400px){
  .main{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--space-4)}
  .lede{max-width:72ch}
  .led col.p{width:var(--space-8)}
  .led td{padding:2px var(--space-2) 2px 0}
  .leg{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px var(--space-2)}
  .leg div span:not(:first-child){font-size:var(--type-small)}
  .side{gap:var(--space-3)}
  .sch tr:nth-child(n+2):nth-child(-n+6){display:none}
  .led td .o{display:none}
  .led tr.sec td{padding-top:var(--space-1)}
  .oi div{grid-template-columns:var(--space-5) minmax(0,1fr) var(--space-8)}
  .lede{font-size:var(--type-small);line-height:var(--leading-small)}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top"><div><span class="eyebrow" id="eyebrow"></span><h1 id="h1"></h1><p class="lede" id="lede"></p></div><div id="tg"></div></div>
  <div class="main">
    <div class="dep" style="--i:0"><div class="paper unt" id="paper"></div></div>
    <div class="side">
      <div class="dep" style="--i:1"><div class="h3"><h2 id="lgh"></h2></div><div class="leg" id="leg"></div></div>
      <div class="dep" style="--i:2"><div class="h3"><span class="lab" id="schh"></span><span class="sm muted" id="schd"></span></div><div id="schn"></div><table class="sch" id="sch"></table></div>
      <div class="dep" style="--i:3"><div class="h3"><span class="lab" id="oih"></span></div><div id="oin"></div><div class="oi" id="oi"></div></div>
      <div class="offnote" id="off"></div>
    </div>
  </div>
</div>
<div class="hints"><span><span class="kbd">G</span> assistant<span class="hl"> on/off</span></span><span><span class="kbd">T</span><span class="hl"> technical</span> words</span><span><span class="kbd">R</span> replay</span></div>
<div class="x-cap"><b>Question sheet · V3</b> working papers: ticked, initialled, agreed · auditors’ tickmarks and open items</div>
<script>
/* ===== Sample data: every word, name, count and date on these sheets comes from here.
   A different deployment brings its own kinds, sources, people and glossary; nothing below is drawn for one trade. ===== */
const DATA = {
  deployment: 'Regional services (sample)',
  today: '3 Nov 2026',
  floors: {
    ops:         { name: 'Operations', tier: 'department' },
    procurement: { name: 'Procurement', tier: 'team' },
    finance:     { name: 'Finance', tier: 'team' },
    org:         { name: 'Whole organisation', tier: 'org' }
  },
  people: {
    me:    { name: 'Sam Achebe', role: 'duty officer', floor: 'ops' },
    jo:    { name: 'Jo Reyes', role: 'procurement desk', floor: 'procurement' },
    priya: { name: 'Priya Nair', role: 'finance lead', floor: 'finance' },
    dev:   { name: 'Dev Patel', role: 'Operations colleague', floor: 'ops' }
  },
  apps: { atlas: 'Data Atlas', artifacts: 'Artifacts', mandate: 'Mandate' },
  /* The model gateway, in both registers. on = the admin has turned it on. */
  gateway: { plain: 'the assistant', Plain: 'The assistant', tech: 'model gateway · askModel', on: true,
    offWhy: 'The assistant is off for this organisation. Admins turn it on in Admin.',
    offStill: 'Questions still work: you pick the reading from a sentence, and Data Atlas matches by keys, names and spelling.' },
  /* Words the organisation has defined once, for everyone (an admin keeps the glossary; no model needed to find them). */
  glossary: [
    { word: 'spring', means: '1 March to 31 May', by: 'Org glossary' },
    { word: 'financial year', means: 'starts 1 April', by: 'Org glossary' }
  ],
  /* The question, as the person typed it, cut into the parts it was read by. */
  question: {
    words: 'which suppliers have we not heard from since spring?',
    by: 'me', floor: 'ops', first: '20 Oct 2026, 09:14',
    parts: [
      { t: 'which suppliers', reads: 'Suppliers', how: 'name', tech: 'kind = Supplier (cco:Organization)' },
      { t: 'have we not heard from', reads: 'no email, delivery note or meeting note', how: 'guess', tech: 'NOT EXISTS contact(source ∈ s1,s2,s3)', alt: 'pick what counts as contact' },
      { t: 'since spring', reads: 'since 1 March 2026', how: 'glossary', tech: 'contact.date ≥ 2026-03-01', alt: 'pick a date' }
    ],
    /* What the assistant added that the person never said. */
    added: { says: 'only suppliers with a running contract', how: 'guess', tech: 'has Contract(status = running)', left: 13 },
    reading: 'Suppliers with a running contract that have had no email, delivery note or meeting note from us since 1 March 2026.',
    readingTech: 'Supplier ∧ ∃Contract(running) ∧ ¬∃Contact(date ≥ 2026-03-01, src ∈ {s1,s2,s3})'
  },
  /* Clarifications: each one neutral, each choice with the count it would leave (counts come from the record, never the model). */
  clarify: [
    { id: 'when', ask: 'Since spring: from when?', why: 'Spring is in the org glossary as 1 March to 31 May. “Since” could mean either end.', raisedBy: 'glossary',
      opts: [ { l: 'Since 1 March', d: 'spring began', n: 9, pick: true }, { l: 'Since 1 April', d: 'your financial year', n: 12 }, { l: 'Since 31 May', d: 'spring ended', n: 17 }, { l: 'Another date', d: '', n: null } ] },
    { id: 'contact', ask: 'Heard from: which records count?', why: 'Data Atlas keeps four kinds of record that link a supplier to us.', raisedBy: 'guess',
      opts: [ { l: 'Emails', d: 'Supplier correspondence', n: 1204, pick: true, src: 's1' }, { l: 'Delivery notes', d: 'at our sites', n: 3310, pick: true, src: 's2' }, { l: 'Meeting notes', d: 'Operations', n: 212, pick: true, src: 's3' }, { l: 'Invoices', d: 'kept on Finance', n: null, locked: true, src: 's4' } ] },
    { id: 'running', ask: 'Only suppliers we still have a contract with?', why: 'You didn’t say this. The assistant suggests it: 13 suppliers’ contracts have ended.', raisedBy: 'guess',
      opts: [ { l: 'Yes, running contracts only', d: '', n: 9, pick: true }, { l: 'No, include ended contracts', d: '', n: 22 } ] }
  ],
  /* Where "heard from" is looked for. */
  sources: [
    { id: 's1', name: 'Supplier correspondence', what: 'emails', app: 'artifacts', floor: 'procurement', n: 1204, from: 'Jan 2026', zone: 'A' },
    { id: 's2', name: 'Delivery notes', what: 'delivery notes', app: 'atlas', floor: 'ops', n: 3310, from: 'Apr 2024', zone: 'A' },
    { id: 's3', name: 'Meeting notes', what: 'meeting notes', app: 'artifacts', floor: 'ops', n: 212, from: 'Sep 2025', zone: 'B' },
    { id: 's4', name: 'Invoices', what: 'invoices', app: 'atlas', floor: 'finance', n: null, from: null, zone: 'U', locked: true, who: 'priya' }
  ],
  /* The workings, step by step. by = who did it: you, the record (Data Atlas, no model) or a guess (model gateway). */
  steps: [
    { k: 'start',  say: 'Start with every supplier you can read', n: 61, by: 'record', how: 'kept on Whole organisation', tech: 'kind = Supplier · floors: org' },
    { k: 'keep',   say: 'Keep those with a running contract', n: 48, out: 13, outWhy: 'contract ended', by: 'guess', ok: 'me', how: 'the assistant suggested it; you said yes', tech: '∃ Contract(status = running)' },
    { k: 'look',   say: 'Look for an email, delivery note or meeting note since 1 March', n: 4726, unit: 'records searched', by: 'record', how: '3 sources; invoices not searched', tech: 'src ∈ {s1,s2,s3} · date ≥ 2026-03-01' },
    { k: 'match',  say: 'Match each record to its supplier', n: 39, unit: 'suppliers heard from', by: 'record', how: '34 by company number, 5 by name spelling', tech: 'key match 34 · trigram ≥ 0.82 ×5' },
    { k: 'maybe',  say: 'One email might be from Easterby Cleaning', n: 1, unit: 'not counted', by: 'guess', how: 'matched by meaning, not confirmed', tech: 'pgvector cosine 0.71 · unconfirmed' },
    { k: 'left',   say: 'Left: suppliers with no contact since 1 March', n: 9, by: 'record', how: '48 − 39', tech: 'set difference' }
  ],
  /* The answer: rows from the record. sure = rests on the record alone. */
  answer: {
    n: 9, of: 48, sureN: 7,
    sure: 'Sure for 7 of 9. Two rest on less: see their notes.',
    rows: [
      { name: 'Linden Grounds', last: '8 Dec 2025', via: 'delivery note', src: 's2', ends: 'Aug 2027' },
      { name: 'Moorside Tyres', last: '27 Jan 2026', via: 'meeting note', src: 's3', ends: 'Mar 2027' },
      { name: 'Fenwick Lifts', last: '2 Feb 2026', via: 'delivery note', src: 's2', ends: 'Jan 2028' },
      { name: 'Tamsin Print & Post', last: '11 Feb 2026', via: 'email', src: 's1', ends: 'Dec 2026', gap: 'Contact person', gapWho: 'jo' },
      { name: 'Coldwell Waste Partners', last: '14 Feb 2026', via: 'email', src: 's1', ends: 'Mar 2027' },
      { name: 'Ridgeway Electrical', last: '19 Feb 2026', via: 'email', src: 's1', ends: 'Jun 2027' },
      { name: 'Easterby Cleaning Co', last: '20 Feb 2026', via: 'email', src: 's1', ends: 'Sep 2027', maybe: { date: '12 Apr 2026', what: 'an email signed “the cleaning crew”', score: 'a likely match by meaning' } },
      { name: 'Pellow Security', last: '25 Feb 2026', via: 'email', src: 's1', ends: 'Feb 2027' },
      { name: 'Carrow IT Supplies', last: null, via: null, ends: 'Nov 2027', noRecord: { before: 'Jan 2026', why: 'Supplier correspondence starts in January 2026' } }
    ],
    /* a few of the 39 heard from since 1 March, for sheets that show what was left out */
    heard: [
      { name: 'Blyth Winter Services', last: '6 May 2026', via: 'meeting note', src: 's3' },
      { name: 'Hallam Haulage Ltd', last: '14 Sep 2026', via: 'delivery note', src: 's2', spell: true },
      { name: 'Northgate Fuels', last: '22 Oct 2026', via: 'email', src: 's1' }
    ],
    axis: { from: '1 Sep 2025', to: '3 Nov 2026' }
  },
  /* What the answer can't see, and who could fill it. kind = one of the six ways to be empty. */
  gaps: [
    { kind: 'shadow', say: 'Invoices are kept on Finance. Some of these 9 may have invoiced since March.', who: 'priya', ask: 'Ask Priya Nair, finance lead' },
    { kind: 'norecord', say: 'No emails before January 2026, so Carrow IT Supplies may never have written.', who: 'jo', ask: 'Jo Reyes can say when Carrow last wrote' },
    { kind: 'gap', say: 'Contact person not known yet for Tamsin Print & Post.', who: 'jo', ask: 'Procurement can add it' }
  ],
  /* The question kept as an object. */
  saved: {
    name: 'Suppliers not heard from since spring',
    by: 'me', saved: '20 Oct 2026', shared: 'ops', reruns: 'every Monday, 07:00, and whenever it’s opened',
    reads: 'the data as it is now; every run is kept, so any run opens as it was',
    modelUsed: 'once, on 20 Oct, to read your words. Reruns use the reading you confirmed and never ask it again.',
    changed: '27 Oct 2026',
    runs: [
      { at: '20 Oct', n: 10, note: 'first asked' },
      { at: '27 Oct', n: 9, note: 'Northgate Fuels emailed on 22 Oct', changed: true },
      { at: '3 Nov', n: 9, note: 'no change' }
    ],
    keeps: ['your words, as typed', 'the reading you confirmed', 'each choice you made', 'the sources and floors it read', 'when each run happened and what it found']
  },
  /* The six parts of a question sheet. never = what each must never claim. */
  parts: [
    { id: 'question', plain: 'Question', tech: 'query text + reading', icon: 'message-circle-question',
      set: 'Your words, verbatim, in quotes. Under them, the reading: the same question in the record’s words.',
      never: 'to be understood before you confirm the reading. Your words are never rewritten in place.' },
    { id: 'clarify', plain: 'Clarification', tech: 'disambiguation', icon: 'split',
      set: 'One neutral question at a time, two to four choices, each with the count it would leave, and “something else”.',
      never: 'a right answer. It never leads, and never asks what the record can answer itself.' },
    { id: 'workings', plain: 'Workings', tech: 'query plan, in plain words', icon: 'list-checks',
      set: 'Numbered steps in the order they ran, each with its count, who did it, and what it left out.',
      never: 'to be complete beyond its sources. Nothing left out goes unsaid.' },
    { id: 'answer', plain: 'Answer', tech: 'result set', icon: 'list',
      set: 'Rows from the record, each with where it came from. A count first, and how sure, in words.',
      never: 'more certainty than its weakest step, or a guess as a fact. Zero is said with what was checked.' },
    { id: 'gap', plain: 'Gap', tech: 'coverage note', icon: 'square-dashed',
      set: 'One of the six ways to be empty, with what it means for this answer and who could fill it.',
      never: '“nothing found” when it means “not looked” or “not yours to see”.' },
    { id: 'saved', plain: 'Saved question', tech: 'stored query + run log', icon: 'bookmark',
      set: 'A name, your words, the confirmed reading, who it’s shared with, when it reruns, when its answer last changed.',
      never: 'that today’s answer is the one it was saved with. It never asks the assistant again.' }
  ],
  /* Who can do a step. */
  actors: {
    me:     { plain: 'You', tech: 'person', icon: 'user' },
    record: { plain: 'Data Atlas', tech: 'query engine · keys, names, spelling', icon: 'database' },
    guess:  { plain: 'The assistant', tech: 'model gateway', icon: 'circle-dashed' },
    glossary: { plain: 'Org glossary', tech: 'deployment config · glossary', icon: 'book-a' }
  }
};

const SHEET = {
  eyebrow: 'The reference desk · question sheet · working papers',
  title: 'Working papers',
  lede: 'An auditor ticks each line against its evidence and initials who prepared it. Here every line says who did it: you, Data Atlas from the record, or the assistant. A line the assistant prepared keeps its dashed box for good; once you agree it, your initials sit beside it. Until then it reaches no total.',
  index: 'Q-1',
  heads: ['Ref', 'Line', 'Count', 'Tick', 'Prepared by', 'Agreed'],
  legendTitle: 'Tickmarks', schTitle: 'Schedule A · the answer', oiTitle: 'Open items · what we couldn’t look at',
  ticks: [
    { i: 'quote', b: 'Your words', d: 'As typed; nobody may edit them.', t: 'PBC: provided by client' },
    { i: 'check', b: 'Agreed to the record', d: 'Data Atlas found it, with a source.', t: 'traced to source' },
    { i: 'check-check', b: 'Agreed by key', d: 'Matched on company number.', t: 'identity key match' },
    { i: 'spell-check', b: 'Agreed by spelling', d: 'Matched on the name; less sure.', t: 'pg_trgm similarity' },
    { i: 'sigma', b: 'Counted', d: 'Total of the lines above.', t: 'footed' },
    { i: 'user-check', b: 'You chose', d: 'A choice you made; its other options kept.', t: 'client decision' },
    { i: 'circle-dashed', b: 'The assistant’s guess', d: 'Dashed box; counts nothing until agreed.', t: 'model gateway · unverified', g: true },
    { i: 'lock', b: 'Not examined', d: 'Not yours to see; whom to ask.', t: 'scope limitation' }
  ]
};
/* ===== Shared helpers (generated into every sheet) ===== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const ms = n => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)) || 0;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ic = (n, s) => Icons.svg(n, { size: s || 16, stroke: 1.5 });
const FL = id => DATA.floors[id];
const P = id => DATA.people[id];
const SRC = id => DATA.sources.find(s => s.id === id);
const PART = id => DATA.parts.find(p => p.id === id);
const A = id => DATA.actors[id];
const fmt = n => n == null ? 'some' : n.toLocaleString('en-GB');
const Q = DATA.question, ANS = DATA.answer, SAV = DATA.saved, GW = DATA.gateway;
const srcNo = id => DATA.sources.findIndex(s => s.id === id) + 1;

/* the empty marks, drawn small enough to sit in a line */
const mGap = (label, who) => `<span class="gapslot"><span class="gl">${label}</span>${who ? `<span class="gw">${who}</span>` : ''}</span>`;
const mShadow = text => `<span class="shadowslot">${ic('lock', 14)}<span>${text}</span></span>`;
function mWavy(w) { w = w || 28; let d = ''; for (let x = 0, i = 0; x <= w; x += 4, i++) d += `${i ? 'L' : 'M'}${x},${i % 2 ? 2 : 8}`;
  return `<svg class="wavy" width="${w}" height="10" viewBox="0 0 ${w} 10" aria-hidden="true"><path d="${d}" style="fill:none;stroke:var(--ink-muted);stroke-width:1"/></svg>`; }
const mNoRecord = text => `<span style="display:inline-flex;align-items:center;gap:var(--space-2)">${mWavy()}<span class="muted">${text}</span>${mWavy()}</span>`;

/* the assistant (model gateway) on or off, and technical words, as page state */
const STATE = { gw: GW.on, tech: false };
const HOOKS = { gw: [], tech: [] };
function setGW(v) { STATE.gw = v; document.body.classList.toggle('nogw', !v); const b = $('#swg'); if (b) { b.setAttribute('aria-checked', v); b.querySelector('.ss').textContent = v ? 'on' : 'off'; } HOOKS.gw.forEach(f => f(v)); }
function setTech(v) { STATE.tech = v; document.body.classList.toggle('show-tech', v); const b = $('#swt'); if (b) { b.setAttribute('aria-checked', v); b.querySelector('.ss').textContent = v ? 'on' : 'off'; } HOOKS.tech.forEach(f => f(v)); }
function toggles() {
  return `<div class="toggles"><button class="sw" id="swg" role="switch" aria-checked="true">${ic('circle-dashed', 14)}<span>${GW.Plain}</span><span class="ss">on</span><span class="kbd">G</span></button>
    <button class="sw" id="swt" role="switch" aria-checked="false">${ic('code', 14)}<span>Technical words</span><span class="ss">off</span><span class="kbd">T</span></button></div>`;
}
function wireToggles() {
  const g = $('#swg'), t = $('#swt');
  if (g) g.addEventListener('click', () => setGW(!STATE.gw));
  if (t) t.addEventListener('click', () => setTech(!STATE.tech));
  document.addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'g' || e.key === 'G') setGW(!STATE.gw);
    if (e.key === 't' || e.key === 'T') setTech(!STATE.tech); });
}
/* timers for the auto-demo; R replays from the start */
const TIMERS = [];
const later = (fn, t) => TIMERS.push(setTimeout(fn, t));
function boot(reset, demo) {
  const w = $('#wrap');
  const run = () => { TIMERS.splice(0).forEach(clearTimeout); setGW(GW.on); setTech(false); reset(); w.classList.add('pre'); later(() => { w.classList.remove('pre'); demo(); }, ms('--motion-run')); };
  document.addEventListener('keydown', e => { if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) run(); });
  wireToggles();
  run();
}

const me = P(Q.by), ini = n => n.split(' ').map(w => w[0]).join('');
const tk = (i, cls) => `<span class="tk ${cls || ''}">${ic(i, 14)}</span>`;
function row(ref, st, n, tick, by, ag, cls) { return `<tr class="${cls || ''}"><td class="ref">${ref}</td><td class="st">${st}</td><td class="num">${n == null ? '' : n}</td><td>${tick}</td><td class="by">${by}</td><td class="ag">${ag}</td></tr>`; }
const sec = id => `<tr class="sec"><td colspan="6">${PART(id).plain}<span class="nv">never claims ${PART(id).never}</span></td></tr>`;
const nv = id => `<div class="nvl">${PART(id).plain} never claims ${PART(id).never}</div>`;
function render() {
  $('#eyebrow').textContent = SHEET.eyebrow; $('#h1').textContent = SHEET.title; $('#lede').textContent = SHEET.lede; $('#tg').innerHTML = toggles();
  const c = DATA.clarify, s = DATA.steps, AS = A('guess').plain, DA = A('record').plain, MI = ini(me.name);
  const pick = cl => cl.opts.find(o => o.pick);
  const others = cl => cl.opts.filter(o => !o.pick && o.n != null).map(o => `${o.l[0].toLowerCase() + o.l.slice(1)} ${o.n}`).join(', ');
  $('#paper').innerHTML = `<div class="wph"><span class="idx">${SHEET.index}</span><div><div class="t">${SAV.name}</div><div class="q">Shared with ${FL(SAV.shared).name} · reruns ${SAV.reruns} · answer last changed ${SAV.changed}</div>${nv('saved')}</div>
      <div class="sig"><span>Prepared</span><b>${MI}</b><span>${SAV.saved.replace(' 2026', '')}</span><span>Draft reading</span><span class="g">${AS}</span><span>${SAV.saved.replace(' 2026', '')} only</span><span>Rerun</span><b>${DA}</b><span>${DATA.today.replace(' 2026', '')}</span></div></div>
    <table class="led"><colgroup><col class="r"><col><col class="n"><col class="k"><col class="p"><col class="a"></colgroup>
    <thead><tr>${SHEET.heads.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>
    ${sec('question')}
    ${row('Q', `<span class="yours">${Q.words}</span>`, null, tk('quote'), me.name, MI)}
    ${row('Q.1', `Read as: ${Q.reading}`, null, tk('circle-dashed', 'g'), AS + ' · draft', MI, 'isg only-on')}
    ${row('Q.1', `Read as: Suppliers with no [you pick: what counts] since [you pick: a date]`, null, tk('user-check'), 'You, from a sentence', MI, 'only-off')}
    ${sec('clarify')}
    ${row('C.1', `${c[0].ask} <span class="o">· ${pick(c[0]).l}; also ${others(c[0])}</span>`, pick(c[0]).n, tk('user-check'), 'Org glossary', MI)}
    ${row('C.2', `${c[1].ask} <span class="o">· emails, delivery notes, meeting notes; invoices locked</span>`, null, tk('circle-dashed', 'g'), AS, MI, 'isg only-on')}
    ${row('C.2', `${c[1].ask} <span class="o">· you ticked emails, delivery notes, meeting notes; invoices locked</span>`, null, tk('user-check'), DA + ' · links', MI, 'only-off')}
    ${row('C.3', `${c[2].ask} <span class="o">· you didn’t say this; ${others(c[2])}</span>`, pick(c[2]).n, tk('circle-dashed', 'g'), AS, MI, 'isg only-on')}
    ${sec('workings')}
    ${row('W.1', s[0].say, s[0].n, tk('check'), DA, '')}
    ${row('W.2', s[1].say + ` <span class="o">· ${s[1].out} left out: ${s[1].outWhy}</span>`, s[1].n, tk('check'), DA + ', C.3', '', 'only-on')}
    ${row('W.3', s[2].say + ` <span class="o">· ${s[2].how}</span>`, fmt(s[2].n), tk('check'), DA, '')}
    ${row('W.4', s[3].say + ` <span class="o">· 34 by key, 5 by spelling</span>`, s[3].n, tk('check-check'), DA, '')}
    ${row('W.5', s[4].say + ` <span class="o">· ${s[4].how}</span>`, '(1)', tk('circle-dashed', 'g'), AS, '<span class="pend">open</span>', 'isg only-on')}
    ${row('W.5', `One email matched nobody <span class="o">· waits in Triage</span>`, '(1)', tk('lock', 'l'), DA, '', 'only-off')}
    ${row('A', `${PART('answer').plain}: ${s[5].say} <span class="o">· see Schedule A</span>`, ANS.n, tk('sigma'), DA, '', 'tot')}
    </tbody></table>`;
  $('#lgh').textContent = SHEET.legendTitle;
  $('#leg').innerHTML = SHEET.ticks.map(t => `<div>${tk(t.i, t.g ? 'g' : '')}<span><b>${t.b}</b>${t.d}<span class="tech">${t.t}</span></span></div>`).join('');
  $('#schh').textContent = SHEET.schTitle; $('#schd').textContent = ANS.sure;
  $('#sch').innerHTML = `<colgroup><col class="t"><col><col><col></colgroup>` + ANS.rows.map(x => `<tr><td>${x.noRecord ? tk('check', 'l') : x.maybe ? `<span class="gw-on">${tk('circle-dashed', 'g')}</span><span class="gw-off-f">${tk('check')}</span>` : tk('check')}</td><td class="nm">${x.name}</td>
    <td class="d">${x.last ? x.last : mNoRecord('no record')}</td><td class="s">${x.maybe ? `<span class="guess gw-on">${x.maybe.date}?</span><span class="gw-off">${x.via}</span>` : x.noRecord ? 'before ' + x.noRecord.before : x.via}</td></tr>`).join('');
  $('#oih').textContent = SHEET.oiTitle; $('#schn').innerHTML = nv('answer'); $('#oin').innerHTML = nv('gap');
  $('#oi').innerHTML = DATA.gaps.map((g, i) => `<div><span class="mono muted">O.${i + 1}</span><span>${g.say}</span><span class="w"><b>${P(g.who).name}</b>${g.kind === 'shadow' ? 'not yours to see' : g.kind === 'norecord' ? 'no record' : 'not known yet'}</span></div>`).join('');
  $('#off').innerHTML = `${ic('circle-alert', 14)}<span>${GW.offWhy} No dashed boxes: you pick the reading and what counts; C.3 is never asked, so the answer would include ended contracts unless you add that filter.</span>`;
  /* stamping order */
  $$('#paper .tk').forEach((t, i) => t.style.transitionDelay = `calc(var(--motion-quick) * ${i})`);
  Icons.hydrate(document.body);
}
render();
function reset() { $('#paper').classList.add('unt'); }
function demo() { later(() => $('#paper').classList.remove('unt'), ms('--motion-instant')); }
boot(reset, demo);
</script>
</body>
</html>
