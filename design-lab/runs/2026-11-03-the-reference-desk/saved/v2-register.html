<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved · V2 · The register</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens: all mixes of kit tokens; listed as "needs token"
   in notes.md. Shared by the six saved-question variants.
   --------------------------------------------------------------- */
:root{
  --x-proposed-type-micro:.6875rem;                       /* --type-micro: mono numerals in data (catalogue and wear-and-time asked too) */
  --x-proposed-quiet:.62;                                 /* --time-past-dim: quiet lines, doesn't-apply text */
  /* a model's guess: an info-tinted DASHED edge and italic words; a fact is never dashed */
  --x-proposed-guess:color-mix(in srgb,var(--info) 72%,var(--ink));
  --x-proposed-guess-wash:color-mix(in srgb,var(--info) 7%,transparent);
  /* "as it was then": a sepia cast, like an old print; "now" stays plain light */
  --x-proposed-then:color-mix(in srgb,var(--warning) 42%,var(--ink-muted));
  --x-proposed-then-wash:color-mix(in srgb,var(--warning) 6%,transparent);
  /* rows that joined or left an answer since the run before */
  --x-proposed-join:color-mix(in srgb,var(--success) 70%,var(--ink));
  --x-proposed-join-wash:color-mix(in srgb,var(--success) 7%,transparent);
  --x-proposed-leave:var(--ink-muted);
  /* the lit next step (light language) */
  --x-proposed-lit:color-mix(in srgb,var(--green) 80%,var(--light));
  --x-proposed-lit-wash:color-mix(in srgb,var(--green) 9%,transparent);
  /* the floor you are on (Facilities, a Department) */
  --x-proposed-here:var(--floor-department-high);
  /* six ways to be empty (catalogue): hatches and the corner-tick gap */
  --x-proposed-hatch:color-mix(in srgb,var(--ink-muted) 34%,transparent);
  --x-proposed-unseen:repeating-linear-gradient(135deg,transparent 0 calc(var(--space-1) - 1px),var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-gap-ink:color-mix(in srgb,var(--ink-muted) 78%,transparent);
  --x-proposed-gap-tick:var(--space-1);
}
:root,.mk-gap{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.micro{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
h1,h2,h3{margin:0}
.ttl{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.h3{font-weight:300;font-size:var(--type-body);line-height:var(--leading-body);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.lede{margin:0;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.lede b{font-weight:400;color:var(--ink)}
.small{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.small b{font-weight:400;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-raised)}
.btn[aria-pressed="true"]{background:var(--surface-raised);color:var(--light);border-color:var(--ink-muted)}
.btn.primary{border-color:var(--x-proposed-lit);color:var(--light)}
.btn[disabled]{opacity:var(--x-proposed-quiet);cursor:not-allowed}

/* two registers: the technical line sits one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:block}

/* floor edges */
[data-tier="department"]{--fc:var(--floor-department-high)}
[data-tier="team"]{--fc:var(--floor-team-high)}
[data-tier="org"]{--fc:var(--floor-org-high)}
[data-tier="you"]{--fc:var(--floor-you-high)}
.fl{display:inline-flex;align-items:center;gap:var(--space-1);white-space:nowrap}
.fl::before{content:"";width:var(--space-3);height:2px;border-radius:1px;background:var(--fc)}

/* top band, shared */
.band{display:flex;align-items:center;gap:var(--space-4);height:calc(var(--target-md) + var(--space-3));padding:0 var(--edge);border-bottom:1px solid var(--hairline);background:var(--surface-bar)}
.band .brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.band .crumb{font-size:var(--type-meta);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:center;white-space:nowrap;min-width:0}
.band .crumb b{font-weight:400;color:var(--ink)}
.band .where{margin-left:auto;display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.band .where b{font-weight:400;color:var(--ink)}
.band .hints{justify-content:flex-end}

/* the question said in a sentence */
.sent{margin:0;font-weight:300;font-size:var(--type-heading);line-height:calc(var(--leading-heading) + var(--space-2));color:var(--ink-muted)}
.sent .b{white-space:nowrap;color:var(--light);border-bottom:2px solid var(--x-proposed-here);padding:0 2px;border-radius:2px}
.sent .b.model{border-bottom-style:dashed;border-bottom-color:var(--x-proposed-guess)}
.said{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.said q{color:var(--ink);font-style:italic}

/* how a step was worked out */
.how{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.how.model{color:var(--x-proposed-guess);border-style:dashed;border-color:var(--x-proposed-guess);background:var(--x-proposed-guess-wash)}
.how.you{color:var(--ink)}

/* a model's guess, never drawn like a fact */
.guess{font-style:italic;color:var(--x-proposed-guess);border:1px dashed var(--x-proposed-guess);background:var(--x-proposed-guess-wash);border-radius:2px;padding:0 var(--space-1)}
.gtag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-guess);border:1px dashed var(--x-proposed-guess);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}

/* six ways to be empty: the two used here */
.mk{display:inline-block;vertical-align:middle;flex:none}
.mk-gap{background:var(--x-proposed-gap);width:calc(var(--space-5) - var(--space-1));height:var(--space-4);vertical-align:-1px}
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.unseenbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-2);align-items:start;padding:var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--x-proposed-unseen),var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.unseenbox b{font-weight:400;color:var(--ink)}
.unseenbox svg{margin-top:2px}

/* time: then and now */
.then{color:var(--x-proposed-then)}
.tag-then{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-then);border:1px solid color-mix(in srgb,var(--warning) 30%,transparent);background:var(--x-proposed-then-wash);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.tag-now{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--light);border:1px solid var(--hairline-strong);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}

/* answer rows, shared */
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 var(--space-3);align-items:baseline;padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.row .nm{color:var(--light);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lc{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.row .sub{grid-column:1 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.row.join{background:var(--x-proposed-join-wash);box-shadow:inset 2px 0 0 var(--x-proposed-join)}
.row.leave .nm{color:var(--x-proposed-leave);text-decoration:line-through;text-decoration-color:var(--ink-muted)}
.row.leave{opacity:.8}
.row.dep-guess .nm::after{content:"";}

/* deposit once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i,0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}

/* toast, shared */
.toast{position:fixed;right:var(--edge);bottom:var(--edge);z-index:var(--layer-toast);max-width:var(--measure-card);display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-2);padding:var(--space-3);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);opacity:0;transform:translateY(var(--space-2));transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out);pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast b{font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
@media (prefers-reduced-motion: reduce){.toast{transform:none}}

/* ================= v2: register ================= */
.app{height:100vh;display:flex;flex-direction:column}
.wrap2{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--measure-drawer) + var(--space-7));gap:var(--space-5);padding:var(--space-4) var(--edge) calc(var(--space-7) + var(--space-2))}
.left{min-width:0;min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.qhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-4);align-items:end}
.qhead .sent{font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-1))}
.qhead .said{grid-column:1 / -1}
.regwrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset);scrollbar-width:thin}
table.reg{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--type-meta);line-height:var(--leading-meta)}
.reg th,.reg td{border-bottom:1px solid var(--hairline);padding:0}
.reg thead th{position:sticky;top:0;z-index:2;background:var(--slate-deep);font-weight:400;vertical-align:bottom;border-bottom:1px solid var(--hairline-strong)}
.reg .sup{position:sticky;left:0;z-index:1;font-weight:400;background:var(--slate-deep);text-align:left;padding:var(--space-1) var(--space-3);white-space:nowrap;color:var(--ink);min-width:calc(var(--measure-rail) - var(--space-4));border-right:1px solid var(--hairline)}
.reg thead .sup{z-index:3;color:var(--ink-muted);font-size:var(--type-small)}
.colh{display:grid;gap:2px;justify-items:center;width:100%;padding:var(--space-2) var(--space-1);font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink-muted);border-radius:var(--radius-key) var(--radius-key) 0 0}
.colh .d{color:var(--ink)}
.colh .w{display:inline-flex;gap:2px;align-items:center}
.colh .chg{display:inline-flex;gap:2px;color:var(--x-proposed-join)}
.colh.then{color:var(--x-proposed-then);background:var(--x-proposed-then-wash)}
.colh.then .d{color:var(--x-proposed-then)}
.colh.theirs{background:var(--x-proposed-unseen)}
.colh[aria-pressed="true"]{background-color:var(--surface-raised);box-shadow:inset 0 -2px 0 var(--light)}
.cell{width:100%;height:calc(var(--target-sm) - var(--space-1));display:flex;align-items:center;justify-content:center;border-left:1px solid var(--hairline)}
.cell:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.cell[aria-pressed="true"]{background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--light)}
.m{display:inline-block;flex:none}
.m-in{width:var(--space-3);height:var(--space-3);background:var(--light);border-radius:1px}
.m-in.then{background:var(--x-proposed-then)}
.m-guess{width:var(--space-3);height:var(--space-3);border:1px dashed var(--x-proposed-guess);background:var(--x-proposed-guess-wash)}
.m-in.withguess{box-shadow:0 0 0 2px var(--slate-deep),0 0 0 3px var(--x-proposed-guess)}
.m-heard{width:var(--space-3);height:1px;background:var(--ink-muted)}
.m-na{width:2px;height:2px;border-radius:var(--radius-pill);background:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.m-gap{width:var(--space-3);height:var(--space-3);background:var(--x-proposed-gap)}
.cell.hid{background:var(--x-proposed-unseen)}
.cell.join{box-shadow:inset 2px 0 0 var(--x-proposed-join)}
.cell.fill{animation:fill var(--motion-slow) var(--ease-out) both;animation-delay:calc(var(--i,0) * var(--motion-instant))}
@keyframes fill{from{opacity:0}}
tr.sel .sup{color:var(--light);box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
tr.sel td{background:color-mix(in srgb,var(--ink) 3%,transparent)}
tfoot td{position:sticky;bottom:0;background:var(--slate-deep);border-top:1px solid var(--hairline-strong);border-bottom:0}
tfoot .tot{text-align:center;font:200 var(--type-lead)/1 var(--font-sans);color:var(--light);padding:var(--space-2) 0}
tfoot .tot.then{color:var(--x-proposed-then)}
tfoot .tot.hid{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted);background:var(--x-proposed-unseen)}
tr.grp td{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding:var(--space-2) var(--space-3) var(--space-1);background:var(--slate-deep)}
.key{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.key span{display:inline-flex;gap:var(--space-2);align-items:center;white-space:nowrap}

/* right: the mark explains itself, and the watch */
.right{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:var(--space-4);border-left:1px solid var(--hairline);padding-left:var(--space-4);scrollbar-width:thin}
.explain h3{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);margin:var(--space-1) 0 var(--space-2)}
.story{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2);position:relative}
.story::before{content:"";position:absolute;left:calc(var(--space-2) - 1px);top:var(--space-2);bottom:var(--space-2);border-left:1px solid var(--hairline-strong)}
.story li{position:relative;display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.story li .dot{justify-self:center;margin-top:var(--space-1);width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--slate-deep);border:1px solid var(--ink-muted)}
.story li.in .dot{background:var(--light);border-color:var(--light)}
.story li.chg .dot{background:var(--x-proposed-join);border-color:var(--x-proposed-join)}
.story li b{font-weight:400;color:var(--ink)}
.story li .rs{display:block;margin-top:2px}
.src{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-2);padding:var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:var(--space-2)}
.src b{font-weight:400;color:var(--ink)}
.src svg{margin-top:2px}
.watch h3{margin:0 0 var(--space-2)}
.opts{display:grid;gap:var(--space-1)}
.opt{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline;padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:left;width:100%}
.opt .r{width:var(--space-3);height:var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--ink-muted);align-self:center}
.opt[aria-checked="true"]{background:var(--surface-raised);color:var(--ink)}
.opt[aria-checked="true"] .r{background:var(--light);border-color:var(--light);box-shadow:inset 0 0 0 2px var(--slate-deep)}
.opt .n{font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.opt b{font-weight:400;color:var(--ink)}
.watchnote{margin:var(--space-2) 0 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

</style>
</head>
<body>
<div class="app pre" id="wrap">
  <header class="band">
    <span class="brand" id="brand"></span>
    <span class="crumb" id="crumb"></span>
    <span class="where" id="where"></span>
    <div class="hints">
      <span><span class="kbd">&uarr;</span><span class="kbd">&darr;</span> supplier</span>
      <span><span class="kbd">&larr;</span><span class="kbd">&rarr;</span> run</span>
      <span><span class="kbd">A</span> add “as it was asked”</span>
      <span><span class="kbd">W</span> watch for</span>
      <span><span class="kbd">P</span> be Priya</span>
      <span><span class="kbd">T</span> technical</span>
      <span><span class="kbd">R</span> replay</span>
    </div>
  </header>
  <main class="wrap2">
    <section class="left" aria-label="The register of runs">
      <div class="qhead dep">
        <p class="said" id="said"></p>
        <p class="sent" id="sent"></p>
        <span class="small" id="lastchg"></span>
      </div>
      <div class="regwrap dep" style="--i:2"><table class="reg" id="reg"></table></div>
      <div class="key dep" id="key" style="--i:3"></div>
    </section>

const $ = (s, el = document) => el.querySelector(s);

/* ---------- the answer, computed: (who reruns it, the data as it was on asOf) ---------- */
function answer(who, asOf, opts = {}) {
  const sees = P(who).sees;
  const can = src => sees.includes(SRC(src).floor);
  const out = { who, asOf, rows: [], never: [], heard: [], ended: [], hidden: Object.keys(DATA.sources).filter(k => !can(k)) };
  DATA.suppliers.forEach(s => {
    const known = (s.contractLogged || s.contract[0]) <= asOf;
    const running = known && s.contract[0] <= asOf && asOf <= s.contract[1];
    if (!running) { out.ended.push({ s, why: s.contract[0] > asOf ? 'its contract had not started' : 'its contract ended ' + fmt(s.contract[1]) }); return; }
    const vis = s.contacts.filter(c => can(c.src) && (c.logged || c.on) <= asOf);
    const facts = vis.filter(c => !c.guess || opts.guesses);
    const guesses = vis.filter(c => c.guess && !opts.guesses);
    const last = facts.sort((a, b) => a.on < b.on ? 1 : -1)[0];
    if (!last) { out.never.push({ s }); return; }
    const g = guesses.find(c => c.on >= Q.cutoff);
    if (last.on < Q.cutoff) out.rows.push({ s, last, guess: g || null });
    else out.heard.push({ s, last });
  });
  return out;
}
const ids = a => a.rows.map(r => r.s.id);
function diff(a, b) {
  const A = ids(a), B = ids(b);
  return { joined: B.filter(x => !A.includes(x)), left: A.filter(x => !B.includes(x)), same: B.filter(x => A.includes(x)) };
}
/* Why did one supplier's place differ between run a and run b? */
function why(id, a, b) {
  const s = SUP(id);
  const startA = s.contract[0] <= a.asOf && (s.contractLogged || s.contract[0]) <= a.asOf;
  const startB = s.contract[0] <= b.asOf && (s.contractLogged || s.contract[0]) <= b.asOf;
  if (startA !== startB) return { r: 'world', text: `Its contract started on ${fmt(s.contract[0])}.` };
  const seesA = P(a.who).sees, seesB = P(b.who).sees;
  const late = s.contacts.find(c => c.logged && c.logged > a.asOf && c.logged <= b.asOf && seesB.includes(SRC(c.src).floor));
  if (late && seesA.join() === seesB.join()) return { r: 'learned', text: `A ${c2(late)} on ${fmt(late.on)} was logged on ${fmt(late.logged)}${late.by ? ' by ' + late.by : ''}.`, c: late };
  const only = s.contacts.find(c => seesA.includes(SRC(c.src).floor) !== seesB.includes(SRC(c.src).floor) && c.on >= Q.cutoff);
  if (only) {
    const holder = seesA.includes(SRC(only.src).floor) ? a.who : b.who;
    return { r: 'access', text: `${SRC(only.src).plain} are kept on ${F(SRC(only.src).floor).name}. ${P(holder).first} can open them; ${P(holder === a.who ? b.who : a.who).first} can’t.`, c: only, holder };
  }
  const onlyAny = s.contacts.find(c => seesA.includes(SRC(c.src).floor) !== seesB.includes(SRC(c.src).floor));
  if (onlyAny) {
    const holder = seesA.includes(SRC(onlyAny.src).floor) ? a.who : b.who;
    return { r: 'access', text: `Its only contact is in ${SRC(onlyAny.src).plain.toLowerCase()}, kept on ${F(SRC(onlyAny.src).floor).name}, which ${P(holder === a.who ? b.who : a.who).first} can’t open.`, c: onlyAny, holder };
  }
  return { r: 'world', text: 'Something in the record changed.' };
}
const c2 = c => c.via;
const reasonTag = r => `<span class="how">${ic(DATA.reasons[r].icon, 11)}${esc(DATA.reasons[r].plain)}</span>`;

/* the question said in a sentence; blanks show who filled them and how */

}

  const g = r.guess ? `<span class="sub"><span class="gtag">${ic('cpu', 10)}guess</span> <span class="guess">${esc(r.guess.via)} ${fmtS(r.guess.on)}?</span> a meeting note says ${esc(r.guess.guess.said)}, ${esc(r.guess.guess.why)}. Not counted until someone confirms it.</span>` : '';

}

function lastMap(a) { const m = {}; [...a.rows, ...a.heard].forEach(x => m[x.s.id] = x.last.on); a.never.forEach(x => m[x.s.id] = null); return m; }

function status(s, col) {
  if (!mine(col)) return { k: 'hid' };

  if (a.never.find(x => x.s.id === s.id)) return { k: 'never' };
  const h = a.heard.find(x => x.s.id === s.id);
  if (h) return { k: 'heard', row: h };
  return { k: 'na', why: a.ended.find(x => x.s.id === s.id).why };
}

    const who = c.by === 'watch' ? 'watch' : P(c.by).first;
    const cls = c.kind === 'then' ? 'then' : !mine(c) ? 'theirs' : '';
    return `<th><button class="colh ${cls}" data-c="${i}" aria-pressed="${i === S.c}"><span class="d">${fmtS(c.at)}</span><span>${c.time}</span><span class="w">${ic(c.by === 'watch' ? 'eye' : !mine(c) ? 'lock' : 'user-round', 10)}${esc(who)}</span>${c.kind === 'then' ? `<span>data ${fmtS(c.asOf)}</span>` : ch ? `<span class="chg">${ic('git-compare', 10)}changed</span>` : `<span>&nbsp;</span>`}</button></th>`;
  }).join('')}</tr></thead>`;
  const groups = [['With a contract running today', s => s.contract[0] <= DATA.today && DATA.today <= s.contract[1]], ['No contract running today', s => !(s.contract[0] <= DATA.today && DATA.today <= s.contract[1])]];
  let body = '<tbody>'; let ri = 0; S.order = [];
  groups.forEach(([g, f]) => {
    const list = DATA.suppliers.filter(f); if (!list.length) return;
    body += `<tr class="grp"><td colspan="${cols.length + 1}">${esc(g)}</td></tr>`;
    list.forEach(s => {
      S.order.push(s.id);
      body += `<tr class="${ri === S.r ? 'sel' : ''}" data-r="${ri}"><th class="sup" scope="row">${esc(s.name)}</th>${cols.map((c, i) => {
        const st = status(s, c);
        const p = prevOwn(i); const joined = p && mine(c) && st.k === 'in' && status(s, p).k !== 'in';
        return `<td><button class="cell ${st.k === 'hid' ? 'hid' : ''} ${joined ? 'join' : ''} ${i === S.fillCol ? 'fill' : ''}" style="--i:${ri}" data-r="${ri}" data-c="${i}" aria-pressed="${ri === S.r && i === S.c}" aria-label="${esc(s.name)}, ${fmtS(c.at)}: ${st.k}">${mark(st, c)}</button></td>`;
      }).join('')}</tr>`;
      ri++;
    });
  });
  body += '</tbody>';
  const foot = `<tfoot><tr><td class="sup">Found</td>${cols.map(c => mine(c) ? `<td class="tot ${c.kind === 'then' ? 'then' : ''}">${c.a.rows.length}</td>` : `<td class="tot hid">theirs</td>`).join('')}</tr></tfoot>`;
  $('#reg').innerHTML = head + body + foot;
  $$('#reg .cell').forEach(b => b.onclick = () => { S.r = +b.dataset.r; S.c = +b.dataset.c; S.fillCol = -1; drawReg(); explain(); });
  $$('#reg .colh').forEach(b => b.onclick = () => { S.c = +b.dataset.c; S.fillCol = -1; drawReg(); explain(); });
  Icons.hydrate($('#reg'));
  const lc = [...S.cols].map((c, i) => [c, i]).filter(([c, i]) => mine(c) && c.kind !== 'then' && prevOwn(i) && WATCH[0].test(prevOwn(i).a, c.a)).pop();
  $('#lastchg').innerHTML = lc ? `${ic('git-compare', 12)} answer last changed <b>${fmt(lc[0].at)}</b>` : '';
  Icons.hydrate($('#lastchg'));
  $('#key').innerHTML = `<span><span class="m m-in"></span>in the answer</span><span><span class="m m-in withguess"></span>in it, but a guess could take it out</span><span><span class="m m-heard"></span>heard from since ${fmtS(Q.cutoff)}</span><span><span class="m m-gap"></span>no contact logged (not known yet)</span><span><span class="m m-na"></span>no contract running that day (doesn’t apply)</span><span><span class="m m-in then"></span>the data as it was when asked</span><span><span class="m" style="width:var(--space-4);height:var(--space-3);background:var(--x-proposed-unseen);border:1px solid var(--hairline)"></span>someone else’s run: not yours to see</span><span>The watch checks every morning; mornings when nothing it read changed are folded away.</span>`;
}

function explain() {
  const s = SUP(S.order[S.r]); const col = S.cols[S.c]; const el = $('#explain');
  if (!mine(col)) {
    const t = P(col.by);
    el.innerHTML = `<p class="eyebrow">${fmt(col.at)} · ${col.time}</p><h3>${esc(t.name)} reran it</h3>
      <p class="lede">From ${fl(t.floor)}, with ${esc(t.first)}’s own access. Each person’s register shows only their own marks: ${esc(t.first)} can open floors you can’t, and you can open floors ${esc(t.first)} can’t, so ${esc(t.first)}’s marks are ${esc(t.first)}’s.</p>
      <div class="src">${ic('info', 13)}<span>What travelled with the share: the question, its sentence, its steps and who chose each word. <b>Not your marks.</b></span></div>
      ${unseenHtml(S.viewer)}`;
    Icons.hydrate(el); return;
  }
  /* the supplier's story across this reader's runs */
  let prev = null; const items = [];
  S.cols.forEach((c, i) => {
    if (!mine(c)) return;
    const st = status(s, c);
    const lbl = `<b>${fmtS(c.at)} ${c.time}</b>${c.kind === 'then' ? ' <span class="tag-then">data as of ' + fmtS(c.asOf) + '</span>' : ''}`;
    const say = { in: st.row ? `in the answer: last heard ${fmt(st.row.last.on)} (${st.row.last.via}, ${SRC(st.row.last.src).plain.toLowerCase()})` : '', heard: st.row ? `not in it: heard from ${fmt(st.row.last.on)} (${st.row.last.via})` : '', never: 'listed apart: no contact logged at all', na: `not counted: ${st.why || ''}` }[st.k];
    let chg = '';
    if (prev && c.kind !== 'then' && status(s, prev).k !== st.k && (st.k === 'in' || status(s, prev).k === 'in')) {
      const w = why(s.id, prev.a, c.a); chg = `<span class="rs">${reasonTag(w.r)} ${esc(w.text)}</span>`;
    }
    if (c.kind === 'then') {
      const nowSt = status(s, S.cols.filter(x => mine(x) && x.kind !== 'then').at(-1));
      if (nowSt.k !== st.k) chg = `<span class="rs">${ic('history', 11)} Rerun with the data as it was on ${fmtS(c.asOf)}, so it reads as it did then.</span>`;
    }
    items.push(`<li class="${st.k === 'in' ? 'in' : ''} ${chg ? 'chg' : ''} ${i === S.c ? 'cur' : ''}"><span class="dot"></span><span>${lbl} · ${esc(say)}${chg}</span></li>`);
    if (c.kind !== 'then') prev = c;
  });
  const st = status(s, col);
  const c0 = st.row && st.row.last;
  const g = st.row && st.row.guess;
  el.innerHTML = `<p class="eyebrow">One line of the register</p><h3>${esc(s.name)}</h3><ol class="story">${items.join('')}</ol>
    ${c0 ? `<div class="src">${ic(SRC(c0.src).app === 'Artifacts' ? 'file-text' : 'database', 13)}<span>Last contact on this run: <b>${esc(c0.via)}, ${fmt(c0.on)}</b> · ${esc(SRC(c0.src).plain)} in ${esc(SRC(c0.src).app)}, kept on ${fl(SRC(c0.src).floor)}${c0.logged ? `<br>logged ${fmt(c0.logged)}${c0.by ? ' by ' + esc(c0.by) : ''}` : ''}<span class="tk">${esc(SRC(c0.src).tech)}</span></span></div>` : ''}
    ${g ? `<div class="src">${ic('cpu', 13)}<span><span class="gtag">guess</span> <span class="guess">${esc(g.via)}, ${fmt(g.on)}?</span> A meeting note says ${esc(g.guess.said)}. The model matched it ${esc(g.guess.why)}. It is not counted, so ${esc(s.name)} stays in the answer until someone settles it.<br><span class="actions" style="display:flex;gap:var(--space-2);margin-top:var(--space-2)"><button class="btn">${ic('check', 12)}It’s them</button><button class="btn">${ic('x', 12)}Not them</button></span><span class="tk">${esc(DATA.how.model.tech)}</span></span></div>` : ''}`;
  Icons.hydrate(el);
}

function drawWatch() {
  const own = S.cols.filter(c => mine(c) && c.kind !== 'then');
  $('#watch').innerHTML = `<h3 class="h3">Tell ${S.viewer === 'sam' ? 'me' : 'me'} when</h3><div class="opts" role="radiogroup" aria-label="Tell me when">${WATCH.map((w, i) => {
    const hits = own.slice(1).filter((c, j) => w.test(own[j].a, c.a));
    return `<button class="opt" role="radio" aria-checked="${i === S.watch}" data-w="${i}"><span class="r"></span><span>${esc(w.plain)}</span><span class="n">${hits.length}× since ${fmtS(own[0].at)}</span></button>`;
  }).join('')}</div>
  <p class="watchnote">Checked ${esc(Q.watch.cadence)} with ${esc(P(S.viewer).first)}’s own access. The count beside each choice is how often it would have told you since it was asked: a preview before you choose. It says so with ${esc(Q.watch.tell)}.</p>`;
  $$('#watch .opt').forEach(b => b.onclick = () => { S.watch = +b.dataset.w; drawWatch(); });
}

function addThen() {
  if (S.cols.some(c => c.kind === 'then' && owner(c) === S.viewer)) return;
  const c = { at: DATA.today, time: '09:30', by: S.viewer, asOf: Q.asked, kind: 'then' };
  S.cols.push({ ...c, a: answer(c.by, c.asOf) }); S.c = S.cols.length - 1; S.fillCol = S.c;
  drawReg(); explain();
  toast(`${ic('history', 14)}<span><b>Rerun with the data as it was on ${fmt(Q.asked)}</b><br>Records logged after that day are left out, even when they are about earlier days. No model was asked.</span>`);
}
function setViewer(v) {
  S.viewer = v; S.fillCol = -1;
  S.c = S.cols.map((c, i) => [c, i]).filter(([c]) => mine(c)).pop()[1];
  header(); drawReg(); explain(); drawWatch();
}
onKey = k => {
  const n = S.order ? S.order.length : 0;
  if (k === 'arrowdown') { S.r = Math.min(n - 1, S.r + 1); S.fillCol = -1; drawReg(); explain(); return true; }
  if (k === 'arrowup') { S.r = Math.max(0, S.r - 1); S.fillCol = -1; drawReg(); explain(); return true; }
  if (k === 'arrowright') { S.c = Math.min(S.cols.length - 1, S.c + 1); S.fillCol = -1; drawReg(); explain(); return true; }
  if (k === 'arrowleft') { S.c = Math.max(0, S.c - 1); S.fillCol = -1; drawReg(); explain(); return true; }
  if (k === 'a') { addThen(); return true; }
  if (k === 'w') { S.watch = (S.watch + 1) % WATCH.length; drawWatch(); return true; }
  if (k === 'p') { setViewer(S.viewer === 'sam' ? 'priya' : 'sam'); return true; }
  return false;
};
function boot() {
  clearTimers(); setTech(false);
  S.viewer = 'sam'; S.watch = 0; S.fillCol = -1;
  S.cols = DATA.runs.slice(0, -2).map(r => ({ ...r, a: answer(r.by, r.asOf) }));
  S.r = 0; S.c = S.cols.length - 1;
  const w = $('#wrap'); w.classList.add('pre');
  header(); drawReg(); explain(); drawWatch();
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.remove('pre')));
  /* the moment: this morning's column is taken like a register, then Priya's run arrives as a column Sam can't read */
  const add = r => { S.cols.push({ ...r, a: answer(r.by, r.asOf) }); S.fillCol = S.cols.length - 1; };
  later(() => { add(DATA.runs.at(-2)); S.c = S.fillCol; drawReg(); drawWatch(); }, tok('--motion-run'));
  later(() => { add(DATA.runs.at(-1)); drawReg(); }, tok('--motion-run') + tok('--motion-spin'));
  later(() => { S.r = S.order.indexOf('halden'); S.c = S.cols.length - 2; S.fillCol = -1; drawReg(); explain(); }, tok('--motion-run') + tok('--motion-spin') + tok('--motion-slow'));
}
Icons.hydrate();
boot();

</script>
</body>
</html>
