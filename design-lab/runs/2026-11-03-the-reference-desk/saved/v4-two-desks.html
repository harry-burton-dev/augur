<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved · V4 · Two desks</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens: all mixes of kit tokens; listed as "needs token"
   in notes.md. Shared by the six saved-question variants.
   --------------------------------------------------------------- */
:root{
  --x-proposed-type-micro:.6875rem;                       /* --type-micro: mono numerals in data (catalogue and wear-and-time asked too) */
  --x-proposed-quiet:.62;                                 /* --time-past-dim: quiet lines, doesn't-apply text */
  /* a model's guess: an info-tinted DASHED edge and italic words; a fact is never dashed */
  --x-proposed-guess:color-mix(in srgb,var(--info) 72%,var(--ink));
  --x-proposed-guess-wash:color-mix(in srgb,var(--info) 7%,transparent);
  /* "as it was then": a sepia cast, like an old print; "now" stays plain light */
  --x-proposed-then:color-mix(in srgb,var(--warning) 42%,var(--ink-muted));
  --x-proposed-then-wash:color-mix(in srgb,var(--warning) 6%,transparent);
  /* rows that joined or left an answer since the run before */
  --x-proposed-join:color-mix(in srgb,var(--success) 70%,var(--ink));
  --x-proposed-join-wash:color-mix(in srgb,var(--success) 7%,transparent);
  --x-proposed-leave:var(--ink-muted);
  /* the lit next step (light language) */
  --x-proposed-lit:color-mix(in srgb,var(--green) 80%,var(--light));
  --x-proposed-lit-wash:color-mix(in srgb,var(--green) 9%,transparent);
  /* the floor you are on (Facilities, a Department) */
  --x-proposed-here:var(--floor-department-high);
  /* six ways to be empty (catalogue): hatches and the corner-tick gap */
  --x-proposed-hatch:color-mix(in srgb,var(--ink-muted) 34%,transparent);
  --x-proposed-unseen:repeating-linear-gradient(135deg,transparent 0 calc(var(--space-1) - 1px),var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-gap-ink:color-mix(in srgb,var(--ink-muted) 78%,transparent);
  --x-proposed-gap-tick:var(--space-1);
}
:root,.mk-gap{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.micro{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
h1,h2,h3{margin:0}
.ttl{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.h3{font-weight:300;font-size:var(--type-body);line-height:var(--leading-body);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.lede{margin:0;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.lede b{font-weight:400;color:var(--ink)}
.small{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.small b{font-weight:400;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-raised)}
.btn[aria-pressed="true"]{background:var(--surface-raised);color:var(--light);border-color:var(--ink-muted)}
.btn.primary{border-color:var(--x-proposed-lit);color:var(--light)}
.btn[disabled]{opacity:var(--x-proposed-quiet);cursor:not-allowed}

/* two registers: the technical line sits one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:block}

/* floor edges */
[data-tier="department"]{--fc:var(--floor-department-high)}
[data-tier="team"]{--fc:var(--floor-team-high)}
[data-tier="org"]{--fc:var(--floor-org-high)}
[data-tier="you"]{--fc:var(--floor-you-high)}
.fl{display:inline-flex;align-items:center;gap:var(--space-1);white-space:nowrap}
.fl::before{content:"";width:var(--space-3);height:2px;border-radius:1px;background:var(--fc)}

/* top band, shared */
.band{display:flex;align-items:center;gap:var(--space-4);height:calc(var(--target-md) + var(--space-3));padding:0 var(--edge);border-bottom:1px solid var(--hairline);background:var(--surface-bar)}
.band .brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.band .crumb{font-size:var(--type-meta);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:center;white-space:nowrap;min-width:0}
.band .crumb b{font-weight:400;color:var(--ink)}
.band .where{margin-left:auto;display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.band .where b{font-weight:400;color:var(--ink)}
.band .hints{justify-content:flex-end}

/* the question said in a sentence */
.sent{margin:0;font-weight:300;font-size:var(--type-heading);line-height:calc(var(--leading-heading) + var(--space-2));color:var(--ink-muted)}
.sent .b{white-space:nowrap;color:var(--light);border-bottom:2px solid var(--x-proposed-here);padding:0 2px;border-radius:2px}
.sent .b.model{border-bottom-style:dashed;border-bottom-color:var(--x-proposed-guess)}
.said{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.said q{color:var(--ink);font-style:italic}

/* how a step was worked out */
.how{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.how.model{color:var(--x-proposed-guess);border-style:dashed;border-color:var(--x-proposed-guess);background:var(--x-proposed-guess-wash)}
.how.you{color:var(--ink)}

/* a model's guess, never drawn like a fact */
.guess{font-style:italic;color:var(--x-proposed-guess);border:1px dashed var(--x-proposed-guess);background:var(--x-proposed-guess-wash);border-radius:2px;padding:0 var(--space-1)}
.gtag{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-guess);border:1px dashed var(--x-proposed-guess);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}

/* six ways to be empty: the two used here */
.mk{display:inline-block;vertical-align:middle;flex:none}
.mk-gap{background:var(--x-proposed-gap);width:calc(var(--space-5) - var(--space-1));height:var(--space-4);vertical-align:-1px}
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.unseenbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-2);align-items:start;padding:var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--x-proposed-unseen),var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.unseenbox b{font-weight:400;color:var(--ink)}
.unseenbox svg{margin-top:2px}

/* time: then and now */
.then{color:var(--x-proposed-then)}
.tag-then{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-then);border:1px solid color-mix(in srgb,var(--warning) 30%,transparent);background:var(--x-proposed-then-wash);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.tag-now{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--light);border:1px solid var(--hairline-strong);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}

/* answer rows, shared */
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 var(--space-3);align-items:baseline;padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.row .nm{color:var(--light);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lc{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.row .sub{grid-column:1 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.row.join{background:var(--x-proposed-join-wash);box-shadow:inset 2px 0 0 var(--x-proposed-join)}
.row.leave .nm{color:var(--x-proposed-leave);text-decoration:line-through;text-decoration-color:var(--ink-muted)}
.row.leave{opacity:.8}
.row.dep-guess .nm::after{content:"";}

/* deposit once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i,0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}

/* toast, shared */
.toast{position:fixed;right:var(--edge);bottom:var(--edge);z-index:var(--layer-toast);max-width:var(--measure-card);display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-2);padding:var(--space-3);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);opacity:0;transform:translateY(var(--space-2));transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out);pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast b{font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
@media (prefers-reduced-motion: reduce){.toast{transform:none}}

/* ================= v4: two-desks ================= */
:root{--x-proposed-far-blur:calc(var(--space-1) * .75);} /* focal planes: the far plane's blur in a rack focus (cinematic focus/ grammar) */
.app{height:100vh;display:flex;flex-direction:column}
.wrap4{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--edge) calc(var(--space-7) + var(--space-1))}
.carried{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--space-5);align-items:start}
.carried .sent{font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-1))}
.access{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.fbox{padding:var(--space-2);border:1px solid var(--hairline);border-top:2px solid var(--fc);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.fbox b{display:block;font-weight:400;color:var(--ink)}
.fbox .who{display:flex;gap:var(--space-1);margin-top:var(--space-1);flex-wrap:wrap}
.chip{display:inline-flex;gap:var(--space-1);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:0 var(--space-2);color:var(--ink)}
.chip.no{color:var(--ink-muted);border-style:dashed;background:var(--x-proposed-unseen)}
.review{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-left:2px solid var(--hairline-strong);padding-left:var(--space-2)}
.review b{font-weight:400;color:var(--ink)}

.desks{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--measure-drawer) - var(--space-5)) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:0}
.desk{min-height:0;display:flex;flex-direction:column;border:1px solid var(--hairline);border-top:2px solid var(--fc);border-radius:var(--radius-key);background:var(--surface-pane);padding:var(--space-3);transition:filter var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out)}
/* rack focus (focal planes): the far desk blurs and desaturates, no black scrim */
.desks[data-focus="sam"] .desk.priya,.desks[data-focus="priya"] .desk.sam{filter:blur(var(--x-proposed-far-blur)) saturate(.35);opacity:.72}
.desks[data-focus="sam"] .gut,.desks[data-focus="priya"] .gut{opacity:.35}
@media (prefers-reduced-motion: reduce){.desk{transition:opacity var(--motion-base)}.desks[data-focus] .desk{filter:none}}
.dh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--space-3);align-items:end;padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.dh .p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light);display:flex;gap:var(--space-2);align-items:center}
.dh .s{grid-column:1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.dh .n{grid-row:1 / span 2;grid-column:2;font:200 var(--type-title-s)/1 var(--font-sans);color:var(--light)}
.dlist{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.dr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-2);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.dr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-muted)}
.dr .v{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap;display:inline-flex;gap:var(--space-2);align-items:center}
.dr.in .nm{color:var(--light)}
.dr.in .nm::before{content:"";display:inline-block;width:var(--space-2);height:var(--space-2);margin-right:var(--space-2);background:var(--light);border-radius:1px;vertical-align:1px}
.dr.heard .nm{text-decoration:line-through;text-decoration-color:var(--hairline-strong)}
.dr.differs{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.dr.wait{opacity:0}
.dr.arrive{animation:arrive var(--motion-base) var(--ease-out) both}
@keyframes arrive{from{opacity:0;transform:translateX(var(--space-2))}}
@media (prefers-reduced-motion: reduce){.dr.arrive{animation:none}}
.dfoot{display:grid;gap:var(--space-2);padding-top:var(--space-2)}
.gut{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:0 var(--space-2);transition:opacity var(--motion-calm) var(--ease-out)}
.gut .gh{flex:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:var(--space-2);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);text-align:center}
.gut .gl{flex:1;min-height:0;overflow:hidden;position:relative}

.gr{height:var(--target-sm);display:flex;align-items:center;justify-content:center;border-bottom:1px solid transparent;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:center}
.gr .dx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1);align-items:center;text-align:left;width:100%;padding:2px var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--surface-overlay);opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.gr .dx.on{opacity:1}
.gr .dx span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr .eq{opacity:var(--x-proposed-quiet)}
.gr .dx::before,.gr .dx::after{content:none}
.legend4{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);font-size:var(--type-small);color:var(--ink-muted)}
.legend4 span{display:inline-flex;gap:var(--space-2);align-items:center}
.tip{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.tip b{font-weight:400;color:var(--ink)}

</style>
</head>
<body>
<div class="app pre" id="wrap">
  <header class="band">
    <span class="brand" id="brand"></span>
    <span class="crumb" id="crumb"></span>
    <span class="where" id="where"></span>
    <div class="hints">
      <span><span class="kbd">S</span> focus Sam’s desk</span>
      <span><span class="kbd">P</span> focus Priya’s desk</span>
      <span><span class="kbd">C</span> compare both</span>
      <span><span class="kbd">T</span> technical</span>
      <span><span class="kbd">R</span> replay</span>
    </div>
  </header>
  <main class="wrap4">
    <section class="carried dep" aria-label="What the share carried">
      <div>
        <p class="said" id="said"></p>
        <p class="sent" id="sent"></p>
        <p class="review" id="review"></p>
      </div>
      <div><p class="eyebrow" style="margin-bottom:var(--space-1)">Who can open which floor</p><div class="access" id="access"></div></div>
    </section>
    <section class="desks dep" id="desks" data-focus="sam" style="--i:2" aria-label="Two desks"></section>
    <div class="legend4 dep" id="legend" style="--i:3"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="x-cap"><b>Saved questions · V4</b> the same question rerun on another floor, rack-focused side by side · split screen, diff tools, focal planes</div>
<script>
/* ======================================================================
   Sample data for one deployment (Vale Regional Services). Every name,
   label, date, count, sentence and reason on the page comes from here or
   is computed from it by answer() below. In AUGUR it would come from
   Data Atlas (suppliers, contracts, contact events and the floor each is
   kept on), Artifacts (meeting notes), identity (who sees which floor)
   and the saved question itself. Swap this object and the page redraws.
   ====================================================================== */
const DATA = {
  app: 'Data Atlas',
  org: 'Vale Regional Services',
  today: '2026-11-03',
  /* Records on floors you can't open: say "some", never a number (catalogue decision, still Harry's call). */
  hiddenCount: 'some',
  floors: {
    you:        { name: 'Your own floor', tier: 'you', word: 'You' },
    depot:      { name: 'Depot operations', tier: 'team', word: 'Team floor', lead: 'Marta Kowal', people: 16, above: 'facilities' },
    facilities: { name: 'Facilities', tier: 'department', word: 'Department floor', lead: 'Ade Bello', people: 38, above: 'org' },
    finance:    { name: 'Finance', tier: 'department', word: 'Department floor', lead: 'Priya Nair', people: 22, above: 'org' },
    org:        { name: 'Vale Regional Services', tier: 'org', word: 'Org floor', people: 412 }
  },
  /* Who sees what: a floor shows what's kept on it and on the floors above, never below or beside. */

/* ---------- the answer, computed: (who reruns it, the data as it was on asOf) ---------- */
function answer(who, asOf, opts = {}) {
  const sees = P(who).sees;
  const can = src => sees.includes(SRC(src).floor);
  const out = { who, asOf, rows: [], never: [], heard: [], ended: [], hidden: Object.keys(DATA.sources).filter(k => !can(k)) };
  DATA.suppliers.forEach(s => {
    const known = (s.contractLogged || s.contract[0]) <= asOf;
    const running = known && s.contract[0] <= asOf && asOf <= s.contract[1];
    if (!running) { out.ended.push({ s, why: s.contract[0] > asOf ? 'its contract had not started' : 'its contract ended ' + fmt(s.contract[1]) }); return; }
    const vis = s.contacts.filter(c => can(c.src) && (c.logged || c.on) <= asOf);
    const facts = vis.filter(c => !c.guess || opts.guesses);
    const guesses = vis.filter(c => c.guess && !opts.guesses);
    const last = facts.sort((a, b) => a.on < b.on ? 1 : -1)[0];
    if (!last) { out.never.push({ s }); return; }
    const g = guesses.find(c => c.on >= Q.cutoff);
    if (last.on < Q.cutoff) out.rows.push({ s, last, guess: g || null });
    else out.heard.push({ s, last });
  });
  return out;
}
const ids = a => a.rows.map(r => r.s.id);
function diff(a, b) {
  const A = ids(a), B = ids(b);
  return { joined: B.filter(x => !A.includes(x)), left: A.filter(x => !B.includes(x)), same: B.filter(x => A.includes(x)) };
}
/* Why did one supplier's place differ between run a and run b? */
function why(id, a, b) {
  const s = SUP(id);
  const startA = s.contract[0] <= a.asOf && (s.contractLogged || s.contract[0]) <= a.asOf;
  const startB = s.contract[0] <= b.asOf && (s.contractLogged || s.contract[0]) <= b.asOf;
  if (startA !== startB) return { r: 'world', text: `Its contract started on ${fmt(s.contract[0])}.` };
  const seesA = P(a.who).sees, seesB = P(b.who).sees;
  const late = s.contacts.find(c => c.logged && c.logged > a.asOf && c.logged <= b.asOf && seesB.includes(SRC(c.src).floor));
  if (late && seesA.join() === seesB.join()) return { r: 'learned', text: `A ${c2(late)} on ${fmt(late.on)} was logged on ${fmt(late.logged)}${late.by ? ' by ' + late.by : ''}.`, c: late };
  const only = s.contacts.find(c => seesA.includes(SRC(c.src).floor) !== seesB.includes(SRC(c.src).floor) && c.on >= Q.cutoff);
  if (only) {
    const holder = seesA.includes(SRC(only.src).floor) ? a.who : b.who;
    return { r: 'access', text: `${SRC(only.src).plain} are kept on ${F(SRC(only.src).floor).name}. ${P(holder).first} can open them; ${P(holder === a.who ? b.who : a.who).first} can’t.`, c: only, holder };
  }
  const onlyAny = s.contacts.find(c => seesA.includes(SRC(c.src).floor) !== seesB.includes(SRC(c.src).floor));
  if (onlyAny) {
    const holder = seesA.includes(SRC(onlyAny.src).floor) ? a.who : b.who;
    return { r: 'access', text: `Its only contact is in ${SRC(onlyAny.src).plain.toLowerCase()}, kept on ${F(SRC(onlyAny.src).floor).name}, which ${P(holder === a.who ? b.who : a.who).first} can’t open.`, c: onlyAny, holder };
  }
  return { r: 'world', text: 'Something in the record changed.' };
}
const c2 = c => c.via;
const reasonTag = r => `<span class="how">${ic(DATA.reasons[r].icon, 11)}${esc(DATA.reasons[r].plain)}</span>`;

/* the question said in a sentence; blanks show who filled them and how */
function sentenceHtml() {

    ? `<span class="b ${Q.clar[p.b].how === 'model' ? 'model' : ''}" data-b="${p.b}" title="${esc(Q.clar[p.b].said)} → ${esc(Q.clar[p.b].chose)}">${esc(p.t)}</span>`
    : esc(p.t)).join(' ') + '.';
}
/* "not yours to see", said once, never per row: no count, no names */
function unseenHtml(who) {

}

const A = {};
function union() {
  const ids = [];
  WHO.forEach(w => [...A[w].rows, ...A[w].never].forEach(r => { if (!ids.includes(r.s.id)) ids.push(r.s.id); }));
  return DATA.suppliers.filter(s => ids.includes(s.id)).map(s => s.id);
}
function cell(w, id) {
  const a = A[w];
  const r = a.rows.find(x => x.s.id === id); if (r) return { k: 'in', v: `${fmtS(r.last.on)} ${r.last.on.slice(2, 4)} · ${r.last.via}`, g: r.guess };
  if (a.never.find(x => x.s.id === id)) return { k: 'never', v: 'no contact logged' };
  const h = a.heard.find(x => x.s.id === id); if (h) return { k: 'heard', v: `heard ${fmtS(h.last.on)}` };
  return { k: 'na', v: 'no contract' };
}
function drawDesks() {
  WHO.forEach(w => A[w] = answer(w, DATA.today));
  const U = union();
  const desk = (w, i) => {
    const p = P(w), run = RUN[w];
    const rows = U.map((id, j) => {
      const c = cell(w, id), o = cell(WHO[1 - i], id);
      const wait = w === 'priya' && j >= S.shown ? 'wait' : (w === 'priya' && j === S.shown - 1 ? 'arrive' : '');
      return `<div class="dr ${c.k} ${c.k !== o.k ? 'differs' : ''} ${wait}"><span class="nm">${c.k === 'never' ? '<span class="mk mk-gap" style="margin-right:var(--space-2)"></span>' : ''}${esc(SUP(id).name)}</span><span class="v">${c.g ? `<span class="gtag">${ic('cpu', 10)}guess</span>` : ''}${esc(c.v)}</span></div>`;
    }).join('');
    const ready = w === 'sam' || S.shown >= U.length;
    return `<div class="desk ${w}" data-tier="${F(p.floor).tier}">
      <div class="dh"><span class="p">${ic('user-round', 14)}${esc(p.name)} · ${fl(p.floor)}</span><span class="s">${run.by === 'watch' ? 'the watch reran it for Sam' : esc(p.first) + ' reran it'} on ${fmt(run.at)}, ${run.time}, with ${esc(p.first)}’s own access</span><span class="n">${ready ? A[w].rows.length : '…'}</span></div>
      <div class="dlist">${rows}</div>
      <div class="dfoot">${unseenHtml(w)}</div></div>`;
  };
  const gut = `<div class="gut"><div class="gh">why they differ</div><div class="gl">${U.map(id => {
    const a = cell('sam', id), b = cell('priya', id);
    if (a.k === b.k) return `<div class="gr"><span class="eq">${ic('equal', 12)}</span></div>`;
    const inA = a.k === 'in';
    const w = inA ? why(id, A.sam, A.priya) : why(id, A.priya, A.sam);
    const holder = w.holder ? P(w.holder).first : '';
    const src = w.c ? SRC(w.c.src) : null;
    return `<div class="gr"><span class="dx ${S.marks ? 'on' : ''}" title="${esc(w.text)}">${ic(DATA.reasons[w.r].icon, 12)}<span>${src ? `${esc(src.plain)}: only ${esc(holder)}` : esc(DATA.reasons[w.r].plain)}</span></span></div>`;
  }).join('')}</div></div>`;
  $('#desks').innerHTML = desk('sam', 0) + gut + desk('priya', 1);
  $('#desks').dataset.focus = S.focus;
  Icons.hydrate($('#desks'));
  /* keep the gutter scrolled with the desks */
  const lists = $$('.dlist'); const gl = $('.gl');
  /* line the gutter up with the first desk row, and end it where the list ends */
  const d0 = $('.dlist .dr'), r0 = $('.gl .gr'), gh = $('.gh'), dl = $('.dlist');
  if (d0 && r0) { const off = d0.getBoundingClientRect().top - r0.getBoundingClientRect().top; gh.style.height = (gh.offsetHeight + off) + 'px'; gl.style.height = dl.clientHeight + 'px'; gl.style.flex = 'none'; }
  lists.forEach(l => l.onscroll = () => { lists.forEach(o => { if (o !== l) o.scrollTop = l.scrollTop; }); gl.scrollTop = l.scrollTop; });
}
function legend() {
  $('#legend').innerHTML = `<span><span class="m" style="display:inline-block;width:var(--space-2);height:var(--space-2);background:var(--light)"></span>in that person’s answer</span><span><span class="mk mk-gap"></span>no contact logged that they can see</span><span style="text-decoration:line-through">heard from since ${fmtS(Q.cutoff)}</span><span>${ic('lock', 12)}<span>the gutter only ever says <b style="font-weight:400;color:var(--ink)">different access</b>: same question, same day</span></span><span>Neither desk names rows the other can’t open: each says <i>${esc(DATA.hiddenCount)}</i> and whom to ask.</span>`;
  Icons.hydrate($('#legend'));
}
function focus(f) { S.focus = f; $('#desks').dataset.focus = f; }
onKey = k => {
  if (k === 's') { focus('sam'); return true; }
  if (k === 'p') { focus('priya'); return true; }
  if (k === 'c') { focus('both'); S.marks = true; $$('.dx').forEach(d => d.classList.add('on')); return true; }
  return false;
};
function boot() {
  clearTimers(); setTech(false);
  S.focus = 'sam'; S.shown = 0; S.marks = false;
  WHO.forEach(w => A[w] = answer(w, DATA.today));
  const w = $('#wrap'); w.classList.add('pre');
  header(); drawDesks(); legend();
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.remove('pre')));
  /* the moment: focus pulls to Priya's desk a week after the share; her rerun fills line by line; then both sharpen and the gutter says why */
  const n = union().length;
  later(() => focus('priya'), tok('--motion-run'));
  for (let j = 1; j <= n; j++) later(() => { S.shown = j; drawDesks(); }, tok('--motion-run') + tok('--motion-slow') + j * tok('--motion-instant'));
  later(() => { S.marks = true; S.focus = 'both'; drawDesks(); }, tok('--motion-run') + tok('--motion-slow') + n * tok('--motion-instant') + tok('--motion-calm'));
}
Icons.hydrate();
boot();

</script>
