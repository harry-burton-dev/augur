<div class="app pre" id="wrap">
  <header class="band">
    <span class="brand" id="brand"></span>
    <span class="crumb" id="crumb"></span>
    <span class="where" id="where"></span>
    <div class="hints">
      <span><span class="kbd">&uarr;</span><span class="kbd">&darr;</span> supplier</span>
      <span><span class="kbd">&larr;</span><span class="kbd">&rarr;</span> run</span>
      <span><span class="kbd">A</span> add “as it was asked”</span>
      <span><span class="kbd">W</span> watch for</span>
      <span><span class="kbd">P</span> be Priya</span>
      <span><span class="kbd">T</span> technical</span>
      <span><span class="kbd">R</span> replay</span>
    </div>
  </header>
  <main class="wrap2">
    <section class="left" aria-label="The register of runs">
      <div class="qhead dep">
        <p class="said" id="said"></p>
        <p class="sent" id="sent"></p>
        <span class="small" id="lastchg"></span>
      </div>
      <div class="regwrap dep" style="--i:2"><table class="reg" id="reg"></table></div>
      <div class="key dep" id="key" style="--i:3"></div>
    </section>
    <aside class="right dep" style="--i:4" aria-label="Why this mark">
      <section class="explain" id="explain" aria-live="polite"></section>
      <section class="watch" id="watch"></section>
    </aside>
  </main>
</div>
