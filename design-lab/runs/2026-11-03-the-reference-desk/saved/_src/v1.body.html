<div class="app pre" id="wrap">
  <header class="band">
    <span class="brand" id="brand"></span>
    <span class="crumb" id="crumb"></span>
    <span class="where" id="where"></span>
    <div class="hints">
      <span><span class="kbd">enter</span> rerun now</span>
      <span><span class="kbd">A</span> as asked</span>
      <span><span class="kbd">N</span> now</span>
      <span><span class="kbd">&uarr;</span><span class="kbd">&darr;</span> stamps</span>
      <span><span class="kbd">P</span> be Priya</span>
      <span><span class="kbd">T</span> technical</span>
      <span><span class="kbd">R</span> replay</span>
    </div>
  </header>
  <main class="desk">
    <section class="col" aria-label="The question card">
      <div class="colhead"><h2 class="h3">The card</h2><span class="small">kept like a book: same card for everyone</span></div>
      <article class="card dep" id="card"></article>
    </section>
    <section class="col" aria-label="The date-due slip">
      <div class="colhead"><h2 class="h3">The slip</h2><span class="small" id="slipwho"></span></div>
      <p class="lastchg dep" id="lastchg" style="--i:2"></p>
      <div class="slip dep" style="--i:3"><div class="sliphead"><span>run · who · data as of</span><span>found</span></div><ol class="stamps" id="stamps"></ol></div>
    </section>
    <section class="col" aria-label="The answer at this address">
      <div class="colhead"><h2 class="h3">The answer</h2><div class="seg" role="group" aria-label="Which data"><button class="thenbtn" id="bthen"></button><button id="bnow"></button></div></div>
      <div class="ans dep" id="ans" style="--i:4"></div>
    </section>
  </main>
</div>
