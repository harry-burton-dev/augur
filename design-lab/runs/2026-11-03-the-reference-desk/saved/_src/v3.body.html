<div class="app pre" id="wrap">
  <header class="band">
    <span class="brand" id="brand"></span>
    <span class="crumb" id="crumb"></span>
    <span class="where" id="where"></span>
    <div class="hints">
      <span><span class="kbd">&larr;</span><span class="kbd">&rarr;</span> move “what we knew” a day</span>
      <span><span class="kbd">A</span> as asked</span>
      <span><span class="kbd">N</span> now</span>
      <span><span class="kbd">P</span> Priya’s access</span>
      <span><span class="kbd">T</span> technical</span>
      <span><span class="kbd">R</span> replay</span>
    </div>
  </header>
  <main class="wrap3">
    <section class="left" aria-label="Two clocks">
      <p class="said dep" id="said"></p>
      <p class="sent dep" id="sent"></p>
      <div class="clocks dep" id="clocks" style="--i:2"></div>
      <div class="chart dep" id="chart" style="--i:3"></div>
      <div class="legend dep" id="legend" style="--i:4"></div>
    </section>
    <aside class="right dep" style="--i:5" id="right" aria-live="polite"></aside>
  </main>
</div>
