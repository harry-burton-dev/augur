<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<title>Workings · V5 · The edges of the answer</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ======================================================================
   Proposed tokens (mixes of kit tokens; listed as "needs token" in notes.md)
   ====================================================================== */
:root{
  --x-proposed-type-micro:.6875rem;                                        /* mono numerals in data (catalogue, wear and time asked too) */
  --x-proposed-here:var(--floor-department-high);                           /* the floor this page sits on */
  --x-proposed-here-soft:color-mix(in srgb,var(--floor-department-high) 16%,transparent);
  --x-proposed-quiet:.62;                                                    /* doesn't-apply and left-out lines */
  /* --mark-guess: a model's guess is drawn in dots, never in a colour. Facts are solid. */
  --x-proposed-guess-ink:color-mix(in srgb,var(--ink) 70%,transparent);
  --x-proposed-guess-dots:radial-gradient(circle,var(--x-proposed-guess-ink) 0 1px,transparent 1.5px) 0 100% / var(--space-1) 3px repeat-x;
  --x-proposed-guess-wash:radial-gradient(circle,color-mix(in srgb,var(--ink) 9%,transparent) 0 1px,transparent 1.5px) 0 0 / var(--space-1) var(--space-1);
  /* six ways to be empty (catalogue): corner ticks for not known yet */
  --x-proposed-gap-ink:color-mix(in srgb,var(--ink-muted) 78%,transparent);
  --x-proposed-gap-tick:var(--space-2);
  /* 45° stale hatch, 135° not-yours-to-see hatch */
  --x-proposed-hatch:color-mix(in srgb,var(--ink-muted) 34%,transparent);
  --x-proposed-stale:repeating-linear-gradient(45deg,transparent 0 calc(var(--space-1) - 1px),var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-unseen:repeating-linear-gradient(135deg,transparent 0 calc(var(--space-1) - 1px),var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* the answer's own light: the lit path, used once per screen */
  --x-proposed-lit:color-mix(in srgb,var(--green) 80%,var(--light));
  --x-proposed-lit-wash:color-mix(in srgb,var(--green) 9%,transparent);
}
:root,.mk-gap{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
html{height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.micro{font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);padding:2px var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink);letter-spacing:0;min-width:1.5em;text-align:center;text-transform:none}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.ico{display:inline-flex;vertical-align:-3px}

/* ---- app frame ---- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr)}
.rail{background:color-mix(in srgb,var(--slate-deep) 70%,transparent);border-right:1px solid var(--hairline);padding:var(--edge) var(--edge-tight);display:flex;flex-direction:column;gap:var(--space-1);min-height:0}
.rail .an{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light);padding:var(--space-2);margin-bottom:var(--space-4)}
.nav{display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-meta);border-radius:var(--radius-key)}
.nav.on{background:var(--surface-raised);color:var(--ink)}
.nav .n{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono)}
.rail .foot{margin-top:auto;padding:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rail .foot b{font-weight:400;color:var(--ink)}
.rail .foot .fl{display:block;width:var(--space-5);height:2px;border-radius:1px;background:var(--x-proposed-here);margin-bottom:var(--space-2);box-shadow:0 0 var(--glow-blur) var(--x-proposed-here)}
.keys{display:flex;flex-direction:column;gap:var(--space-1);margin:var(--space-3) 0 calc(var(--space-6) + var(--space-1));padding:var(--space-2);font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted);border-top:1px solid var(--hairline)}
.keys span{display:flex;gap:var(--space-2);align-items:center}
.main{position:relative;padding:var(--edge) var(--space-6) calc(var(--space-6) + var(--space-3));overflow:hidden;display:flex;flex-direction:column;min-height:0;min-width:0}
@media (max-width:1400px){.main{padding-left:var(--space-5);padding-right:var(--space-5)}}

/* ---- the question, in the person's words, then said in a sentence ---- */
.asked{display:flex;align-items:baseline;gap:var(--space-3);font-size:var(--type-meta);color:var(--ink-muted);margin:var(--space-1) 0 var(--space-2)}
.asked q{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink);quotes:"“" "”"}
.said{font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--ink);letter-spacing:var(--tracking-tight);max-width:calc(var(--measure-wide) + var(--space-8))}
.said .w{font:inherit;color:var(--light);border-bottom:1px dashed var(--hairline-strong);border-radius:var(--radius-key) var(--radius-key) 0 0;padding:0 2px;transition:background var(--motion-quick) var(--ease-standard)}
.said .w:hover,.said .w[aria-expanded="true"]{background:var(--surface-raised)}
.said .w.guess-src{border-bottom:0;background:var(--x-proposed-guess-dots);padding-bottom:3px}
.said .w.fresh{animation:fresh var(--motion-calm) var(--ease-out)}
@keyframes fresh{from{color:var(--x-proposed-lit);text-shadow:0 0 var(--glow-blur) var(--x-proposed-lit)}}

/* ---- who set each step: you, the desk, a model ---- */
.by{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.by.model{color:var(--ink);background:var(--x-proposed-guess-dots);padding-bottom:4px}
/* a model's guess: dotted, upright, with the bot mark and the word "guess" */
.guess{background:var(--x-proposed-guess-dots);padding-bottom:3px}
.guess-box{border:1px dotted var(--x-proposed-guess-ink);background-image:var(--x-proposed-guess-wash)}
.gw-off .needs-gw{opacity:var(--x-proposed-quiet)}
.gw-note{display:none}
.gw-off .gw-note{display:inline}

/* ---- the six ways to be empty (from the catalogue), used where they arise ---- */
.mk{display:inline-block;vertical-align:middle;flex:none}
.mk-gap{background:var(--x-proposed-gap);width:var(--space-5);height:var(--space-4);--x-proposed-gap-tick:var(--space-1)}
.mk-stale{background:var(--x-proposed-stale);width:var(--space-5);height:var(--space-3);border-radius:2px}
.mk-unseen{background:var(--x-proposed-unseen);width:var(--space-5);height:var(--space-3);border-radius:2px}
.mk-norec{width:var(--space-5);height:var(--space-3);background:
  radial-gradient(circle at 50% 0,transparent 3px,var(--ink-muted) 3px 4px,transparent 4px) 0 0 / var(--space-2) 6px repeat-x;opacity:.8}
.mk-guess{width:var(--space-5);height:var(--space-3);background:var(--x-proposed-guess-wash);border:1px dotted var(--x-proposed-guess-ink);border-radius:2px}

/* ---- popover of choices: each shows what the answer would become ---- */
.pop{position:absolute;z-index:var(--layer-overlay);width:var(--measure-decision);padding:var(--space-2);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);font:400 var(--type-meta)/var(--leading-meta) var(--font-sans);color:var(--ink);letter-spacing:0;animation:popin var(--motion-base) var(--ease-out) both}
@keyframes popin{from{opacity:0;transform:translateY(calc(var(--space-1) * -1))}}
.pop .ph{display:flex;justify-content:space-between;gap:var(--space-3);padding:var(--space-1) var(--space-2) var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.opt{width:100%;display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2);align-items:center;min-height:var(--target-sm);padding:0 var(--space-2);border-radius:var(--radius-key)}
.opt:hover,.opt:focus-visible{background:var(--surface-raised)}
.opt .c{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.opt .c b{color:var(--ink);font-weight:400}
.opt small{display:block;color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.opt[aria-checked="true"]{color:var(--light)}
.opt[aria-checked="true"] .tick{color:var(--x-proposed-lit)}
.opt .tick{color:transparent;display:flex}
.opt[disabled]{opacity:var(--x-proposed-quiet);cursor:help}
.pop .pf{padding:var(--space-2);border-top:1px solid var(--hairline);margin-top:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

/* ---- two registers: technical words one step down, with T ---- */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:.8;white-space:pre-wrap}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* ---- buttons and chips ---- */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);background:var(--surface-inset);white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-raised)}
.btn[aria-pressed="true"]{color:var(--light);border-color:var(--ink-muted);background:var(--surface-raised)}
.toolbar{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.stamp{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.stamp b{color:var(--ink);font-weight:400}

/* the head every variant shares */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-5)}
.head .toolbar{flex:none;padding-top:var(--space-1)}
@media (prefers-reduced-motion: reduce){*{animation-duration:var(--motion-instant)!important;transition-duration:var(--motion-instant)!important}}

/* ---- V5: each step is a fence; show the cases nearest it on both sides, and what moving it would do ---- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:calc(var(--measure-card) - var(--space-4)) minmax(0,1fr);gap:var(--space-5);margin-top:var(--space-4)}
.ans{min-height:0;display:flex;flex-direction:column;background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-card);padding:var(--space-4);backdrop-filter:blur(var(--surface-blur))}
.ans .top{display:flex;align-items:baseline;gap:var(--space-3);padding-bottom:var(--space-3);border-bottom:1px solid var(--hairline-strong)}
.ans .top .n{font:200 var(--type-display)/1 var(--font-sans);color:var(--light)}
.ans .top .t{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.ans ul{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.ans li{display:flex;justify-content:space-between;gap:var(--space-2);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta);transition:opacity var(--motion-base) var(--ease-standard)}
.ans li .d{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.ans li.ghost-in{border:1px dashed var(--x-proposed-lit);border-radius:var(--radius-key);padding-left:var(--space-2);padding-right:var(--space-2);color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash);animation:popin var(--motion-base) var(--ease-out) both}
.ans li.ghost-out{opacity:.4;text-decoration:line-through;text-decoration-color:var(--ink-muted)}
.ans li.less .d{color:var(--warning)}
.ans .pv{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-2) 0;min-height:var(--space-6)}
.ans .pv b{color:var(--x-proposed-lit);font-weight:400}
.edges{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:var(--space-3);padding-right:var(--space-1);scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.fence{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);background:var(--surface-inset);border:1px solid var(--hairline);animation:popin var(--motion-base) var(--ease-out) both;transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard)}
.fence.model{border-style:dotted;border-color:var(--x-proposed-guess-ink);background-image:var(--x-proposed-guess-wash)}
.fence.hot{border-color:var(--x-proposed-lit);background-color:color-mix(in srgb,var(--x-proposed-lit) 5%,var(--surface-inset))}
.fence h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3);font:400 var(--type-meta)/var(--leading-meta) var(--font-sans);color:var(--ink)}
.fence h3 .no{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);margin-right:var(--space-2)}
.fence h3 .w{color:var(--light);border-bottom:1px dashed var(--hairline-strong);padding:0 2px}
.fence h3 .w.guess{border-bottom:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) var(--space-6) minmax(0,1fr);margin-top:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.side{display:flex;flex-direction:column;gap:var(--space-1)}
.side .lab{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-bottom:var(--space-1)}
.side.in{text-align:right;align-items:flex-end}
.side.in .lab{color:var(--x-proposed-lit)}
.side.out{align-items:flex-start}
.case{color:var(--ink)}
.case small{display:block;color:var(--ink-muted)}
.case.g{background:var(--x-proposed-guess-dots);padding-bottom:3px}
.post{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-1)}
.post::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px solid var(--x-proposed-lit);opacity:.7}
.post .on{position:relative;background:var(--slate-deep);padding:2px var(--space-1);border-radius:var(--radius-key);font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted);text-align:center;max-width:calc(var(--space-6) + var(--space-5))}
.none{color:var(--ink-muted);font-style:italic}
.alts{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2);margin-top:var(--space-3);padding-top:var(--space-2);border-top:1px solid var(--hairline)}
.alt{display:inline-flex;align-items:center;gap:var(--space-1);min-height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-2);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);font-size:var(--type-small);color:var(--ink-muted)}
.alt b{font-weight:400;color:var(--ink)}
.alt:hover,.alt:focus-visible,.alt.try{color:var(--light);border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.alt[disabled]{opacity:.5;cursor:help}
.onfence{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);margin-top:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.onfence span{display:inline-flex;gap:var(--space-2);align-items:center}
.onfence b{color:var(--ink);font-weight:400}
.techq{display:none;margin:var(--space-2) 0 0;padding:var(--space-2) var(--space-3);background:var(--surface-inset);border-radius:var(--radius-key);font:400 var(--x-proposed-type-micro)/1.55 var(--font-mono);color:var(--ink-muted);white-space:pre}
.tech .techq{display:block}
@media (max-height:840px){.said{font-size:var(--type-lead);line-height:var(--leading-lead)}.ans .top .n{font-size:var(--type-title)}}
</style>

<body>
<div class="app" id="app"></div>
<div class="x-cap"><b>Workings · V5</b> the edges: every step shown by the cases nearest its line, and what moving it would do · distinguishing cases, edge testing</div>
<script>
/* Sample data for one deployment: a regional services organisation.
   Swap this object and every name, label, date, count, keeper and reason follows. */
const DATA = {
  app: "Data Atlas", today: "2026-11-03",
  floor: { name: "Regional Services", type: "department", above: "the Org" },
  person: { name: "Priya Shah", role: "Procurement officer" },
  asked: { words: "which suppliers have we not heard from since spring?", at: "2026-11-03 10:14" },
  kind: { one: "supplier", many: "suppliers", tech: "cco:Organization" },
  /* what the desk asked back, and who settled each answer */
  since: { value: "2026-03-01", by: "you", asked: "Since spring: which day?",
    options: [
      { v: "2026-03-01", label: "1 March", why: "spring by the calendar" },
      { v: "2026-03-20", label: "20 March", why: "the equinox" },
      { v: "2026-04-01", label: "1 April", why: "the start of the financial year" } ] },
  statuses: [
    { id: "live", label: "running", on: true },
    { id: "paused", label: "paused", on: false },
    { id: "finished", label: "finished", on: false } ],
  /* "heard from" is read by the model gateway as these kinds of contact; the person confirmed it */
  heard: { said: "heard from", by: "model", confirmed: "you", fallback: "Without the model, the desk shows this list with nothing ticked and asks you to tick what counts." },
  kinds: [
    { id: "invoice", label: "invoice", many: "invoices", icon: "receipt", on: true, src: "inv" },
    { id: "email", label: "email", many: "emails", icon: "mail", on: true, src: "inbox" },
    { id: "meeting", label: "meeting", many: "meetings", icon: "users", on: true, src: "notes" },
    { id: "call", label: "call", many: "calls", icon: "phone", on: true, src: "calls" },
    { id: "mention", label: "mention in a document", many: "mentions in documents", icon: "file-text", on: false, src: "docs" } ],
  /* how a contact record is linked to a supplier; only "meaning" uses the model gateway */
  matches: [
    { id: "key", label: "company number", icon: "hash", model: false, tech: "key match: companyNumber" },
    { id: "name", label: "exact name", icon: "equal", model: false, tech: "label = label" },
    { id: "spelling", label: "close spelling", icon: "spell-check", model: false, tech: "pg_trgm similarity ≥ 0.8" },
    { id: "meaning", label: "meaning", icon: "bot", model: true, tech: "pgvector cosine ≥ 0.86 via model gateway" } ],
  sources: {
    inv: { name: "Invoices ledger", keeper: "Finance", from: "2023-04-01" },
    inbox: { name: "Procurement inbox", keeper: "Procurement desk", from: "2026-01-05" },
    notes: { name: "Supplier meetings, a library in Artifacts", keeper: "Procurement desk", from: "2024-01-01" },
    calls: { name: "Call log", keeper: "Procurement desk", from: "2025-06-01", gap: ["2026-08-12", "2026-09-02"] },
    docs: { name: "Site reports in Artifacts", keeper: "Estates desk", from: "2024-01-01" } },
  /* contacts: [kind, date, how it was matched, what the record says] */
  suppliers: [
    { id: 1, name: "Northgate Haulage", status: "live", c: [["invoice", "2026-09-14", "key", "Invoice NH-2231"], ["email", "2026-06-02", "name", "Re: route changes"]] },

    '<div class="pv">' + (T ? (d.joined.length ? '<b>' + names(d.joined) + '</b> would join. ' : '') + (d.left.length ? names(d.left) + ' would leave. ' : '') + 'Enter or click to make it so.' : 'Point at any what-if on the right to see the answer move before you choose.') + '</div></section>';

  const F = [];
  const before = R.answer.filter(r => r.last).sort((a, b) => b.last.date.localeCompare(a.last.date))[0];
  const after = R.heard.slice().sort((a, b) => a.by.date.localeCompare(b.by.date))[0];
  F.push({ step: "since", rule: 'Nothing from them since <button class="w" data-step="since">' + E.dayY(P.since) + '</button>', by: "you",
    inn: before ? [[before.s.name, E.cap(E.K[before.last.kind].label) + ' ' + E.day(before.last.date) + ', ' + E.daysBetween(before.last.date, P.since) + ' days before']] : [],
    out: after ? [[after.s.name, E.cap(E.K[after.by.kind].label) + ' ' + E.day(after.by.date) + ', ' + E.daysBetween(P.since, after.by.date) + ' days after']] : [] });
  const kIn = R.answer.filter(r => r.notes.length).map(r => [r.s.name, r.notes[0]]);
  const kOut = R.heard.filter(r => r.usable.filter(c => c.date >= P.since && !c.model).every(c => c.kind === r.by.kind) && ["call", "meeting"].includes(r.by.kind)).slice(0, 2).map(r => [r.s.name, "Only " + E.an(E.K[r.by.kind].label) + ", " + E.day(r.by.date)]);
  F.push({ step: "kinds", model: true, rule: '<button class="w guess" data-step="kinds">' + E.esc(E.list(DATA.kinds.filter(k => P.kinds.has(k.id)).map(k => k.many), "or")) + '</button> count as hearing from them', by: "model", inn: kIn, out: kOut });
  const mOut = R.heard.filter(r => r.by.match === "spelling").map(r => [r.s.name, r.by.text]).concat(R.maybe.map(r => [r.s.name, r.by.text, "g"]));
  F.push({ step: "match", model: P.gateway, rule: 'A contact is theirs if it matches by <button class="w" data-step="match">' + E.esc(E.list(DATA.matches.filter(m => P.match.has(m.id) && (!m.model || P.gateway)).map(m => m.label), "or")) + '</button>', by: "desk", inn: [], out: mOut,
    fence: P.gateway ? null : [I("power-off", 12) + " model gateway off: nothing matched by meaning"] });
  F.push({ step: "status", rule: 'Only <button class="w" data-step="status">' + E.esc(E.list(DATA.statuses.filter(s => P.status.has(s.id)).map(s => s.label), "or")) + '</button> contracts', by: "you", inn: [], out: R.outStatus.map(r => [r.s.name, r.why + (r.s.c[0] ? "; last heard " + E.dayShortY(r.s.c[0][1]) : "")]) });
  const onF = R.answer.filter(r => r.sure === "less").map(r => '<span>' + I("circle-help", 14) + '<b>' + E.esc(r.s.name) + '</b> ' + E.esc(r.doubt) + '</span>')
    .concat(R.unknown.map(r => '<span><span class="mk mk-gap"></span><b>' + E.esc(r.s.name) + '</b> no contact ever recorded; ' + E.esc(DATA.gapKeeper.name) + ' could add one</span>'))
    .concat(['<span><span class="mk mk-unseen"></span><b>' + E.cap(DATA.hidden.count) + ' on ' + E.esc(DATA.hidden.floor) + '</b> not yours to see; ask ' + E.esc(DATA.hidden.ask) + '</span>']);
  h += '<section class="edges" aria-label="The edges of each step">';
  F.slice(0, shown).forEach((f, i) => {
    const A = alts(f.step, P);
    const side = (arr, cls) => arr.length ? arr.map(c => '<span class="case' + (c[2] === "g" ? " g" : "") + '">' + (c[2] === "g" ? I("bot", 12) + ' ' : '') + E.esc(c[0]) + '<small>' + E.esc(c[1]) + '</small></span>').join("") : '<span class="none">' + (cls === "in" ? "none close" : "none close") + '</span>';
    h += '<div class="fence' + (f.model ? " model" : "") + (trying && trying.step === (f.step) || (trying && trying.step === "gw" && f.step === "match") ? " hot" : "") + '" style="animation-delay:calc(var(--motion-instant) * ' + (shown === 99 ? 0 : i) + ')"><h3><span><span class="no">' + (i + 1) + '</span>' + f.rule + '</span>' + UI.byChip(f.by) + '</h3>' +
      '<div class="split"><div class="side in"><span class="lab">just inside</span>' + side(f.inn, "in") + '</div><div class="post">' + (f.fence ? '<span class="on">' + f.fence[0] + '</span>' : '') + '</div><div class="side out"><span class="lab">just outside</span>' + side(f.out, "out") + '</div></div>' +
      (A.length ? '<div class="alts">' + A.map((a, j) => { if (a.step === "gw") { const Q = E.clone(P); Q.gateway = !Q.gateway; const dd = E.diff(R, E.run(Q)); a.joined = dd.joined; a.left = dd.left; } const isTry = trying && trying.step === a.step && trying.v === a.v; return '<button class="alt' + (isTry ? " try" : "") + '" data-try="' + a.step + '|' + a.v + '" data-label="' + E.esc(a.label) + '">' + (a.model ? I("bot", 12) : '') + E.esc(a.label) + ': ' + (a.joined.length ? '<b>+' + a.joined.length + '</b>' : '') + (a.left.length ? ' <b>−' + a.left.length + '</b>' : '') + (!a.joined.length && !a.left.length ? 'no change' : '') + '</button>'; }).join("") + '</div>' : '') + '</div>';
  });
  if (shown >= 5) h += '<div class="fence"><h3><span><span class="no">5</span>On the fence: the record can’t settle these</span>' + UI.byChip("desk") + '</h3><div class="onfence">' + onF.join("") + '</div></div>';
  h += '</section></div>';
  main.innerHTML = h;
  E.hydrate(main);
}
function tryAlt(el) { if (!el) { trying = null; render(); return; } const [step, v] = el.dataset.try.split("|"); trying = { step, v, label: el.dataset.label }; render(); const b = main.querySelector('[data-try="' + el.dataset.try + '"]'); if (b && document.activeElement !== b && el === document.activeElement) b.focus(); }
function commit() { if (!trying) return; const b = E.run(P); if (trying.step === "gw") P.gateway = !P.gateway; else UI.apply(P, trying.step, trying.v); trying = null; render(); }
main.addEventListener("mouseover", e => { const a = e.target.closest(".alt"); if (a && !(trying && a.dataset.try === trying.step + "|" + trying.v)) { runId++; const [step, v] = a.dataset.try.split("|"); trying = { step, v, label: a.dataset.label }; render(); } });
main.addEventListener("mouseleave", () => { if (trying) { trying = null; render(); } });
main.addEventListener("focusin", e => { const a = e.target.closest(".alt"); if (a) { const [step, v] = a.dataset.try.split("|"); if (!(trying && trying.step === step && trying.v === v)) { trying = { step, v, label: a.dataset.label }; render(); const b = main.querySelector('[data-try="' + a.dataset.try + '"]'); if (b) b.focus(); } } });
main.addEventListener("click", e => {
  const a = e.target.closest(".alt"); if (a) { const [step, v] = a.dataset.try.split("|"); trying = { step, v, label: a.dataset.label }; commit(); return; }
  if (e.target.closest("#gw")) { P.gateway = !P.gateway; trying = null; render(); return; }
  if (e.target.closest("#tb")) { document.body.classList.toggle("tech"); return; }
  const w = e.target.closest("[data-step]"); if (w) { const f = main.querySelector('.alt[data-try^="' + w.dataset.step + '|"]'); if (f) f.focus(); }
});
let runId = 0;
async function demo() {
  const me = ++runId; P = E.defaults(); trying = null; shown = 0; render();
  await E.wait(E.ms("--motion-run")); if (me !== runId) return;
  for (let i = 1; i <= 5; i++) { shown = i; render(); await E.wait(E.ms("--motion-instant")); if (me !== runId) return; }
  shown = 99; render();
  await E.wait(E.ms("--motion-calm")); if (me !== runId) return;
  const a = main.querySelector('.alt[data-try^="since|2026-03-20"]') || main.querySelector(".alt");
  if (a) { trying = { step: a.dataset.try.split("|")[0], v: a.dataset.try.split("|")[1], label: a.dataset.label }; render(); }
}
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "r") demo();
  else if (k === "g") { P.gateway = !P.gateway; trying = null; render(); }
  else if (k === "t") document.body.classList.toggle("tech");
  else if (k === "escape") { trying = null; render(); }
  else if (k === "enter" && trying && !e.target.closest(".alt")) commit();
});
demo();
</script>
