<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workings · V6 · Two hands</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
/* ---- V6: the answer worked twice, from the record alone and with a model's help; only the difference needs a person ---- */
.lane{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--space-2);margin-top:var(--space-4)}
.ls{position:relative;padding:var(--space-2) var(--space-3);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);animation:popin var(--motion-base) var(--ease-out) both;min-width:0}
.ls b{display:block;color:var(--ink);font-weight:400;margin-bottom:2px}
.ls .tag{display:flex;align-items:center;gap:var(--space-1);margin-top:var(--space-1);font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono)}
.ls.model{border-style:dotted;border-color:var(--x-proposed-guess-ink);background-image:var(--x-proposed-guess-wash)}
.ls.model .tag{color:var(--ink)}
.ls.off{opacity:var(--x-proposed-quiet)}
.ls .no{position:absolute;top:var(--space-2);right:var(--space-3);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:var(--space-4);background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-card);padding:var(--space-3) var(--space-4);backdrop-filter:blur(var(--surface-blur))}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:var(--space-4)}
.ch{display:flex;align-items:baseline;gap:var(--space-2);padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.ch .n{font:200 var(--type-title)/1 var(--font-sans);color:var(--light);font-variant-numeric:tabular-nums}
.ch .t{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ch .t b{display:block;color:var(--ink);font-weight:400;font-size:var(--type-meta)}
.ch.mid{justify-content:center;text-align:center;align-items:center;flex-direction:column;gap:0}
.ch.mid .t{max-width:var(--measure-decision)}
.ch.right{justify-content:flex-end;text-align:right}
.rows{overflow:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.agree{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:var(--space-4);align-items:center;min-height:calc(var(--target-sm) - var(--space-1));border-bottom:1px solid var(--hairline);font-size:var(--type-meta)}
.agree .bar{grid-column:1 / 4;display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);padding:0 var(--space-2)}
.agree .bar .mid{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--hairline-strong),transparent)}
.agree .d{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.agree.less .d{color:var(--warning)}
.dis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:var(--space-4);align-items:stretch;padding:var(--space-3) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta);transition:background var(--motion-base) var(--ease-standard)}
.dis.hot{background:linear-gradient(90deg,transparent,var(--x-proposed-here-soft),transparent)}
.dis .l,.dis .r{padding:var(--space-1) var(--space-2)}
.dis .l small,.dis .r small{display:block;color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.dis .l{color:var(--light)}
.dis .r{text-align:right;color:var(--ink-muted)}
.dis .r .nm{background:var(--x-proposed-guess-dots);padding-bottom:3px;color:var(--ink)}
.dis .l .tag,.dis .r .tag{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.dis .l .tag{color:var(--x-proposed-lit)}
.ev{padding:var(--space-2) var(--space-3);border:1px dotted var(--x-proposed-guess-ink);border-radius:var(--radius-inset);background-image:var(--x-proposed-guess-wash);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ev b{color:var(--ink);font-weight:400}
.ev .q{display:block;color:var(--ink);margin:var(--space-1) 0}
.ev .acts{display:flex;gap:var(--space-2);margin-top:var(--space-2);flex-wrap:wrap}
.ev .acts .btn{height:calc(var(--target-sm) - var(--space-2));font-size:var(--type-small)}
.ev .done{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-2);color:var(--ink)}
.ev.rej{border-style:solid;border-color:var(--hairline);background-image:none}
.grp{display:flex;align-items:center;gap:var(--space-2);margin:var(--space-3) 0 var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.grp .ln{flex:1;height:1px;background:var(--hairline)}
.grp button{color:var(--ink);text-transform:none;letter-spacing:0;text-decoration:underline dotted var(--hairline-strong);text-underline-offset:3px}
.unk{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.unk b{color:var(--ink);font-weight:400}
.gwlog{display:flex;justify-content:space-between;gap:var(--space-1) var(--space-3);flex-wrap:wrap;padding-top:var(--space-2);margin-top:var(--space-2);border-top:1px solid var(--hairline);font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.gwlog b{color:var(--ink);font-weight:400}
.techq{display:none;margin:var(--space-2) 0 0;padding:var(--space-2) var(--space-3);background:var(--surface-inset);border-radius:var(--radius-key);font:400 var(--x-proposed-type-micro)/1.55 var(--font-mono);color:var(--ink-muted);white-space:pre}
.tech .techq{display:block}
@media (max-height:840px){.said{font-size:var(--type-lead);line-height:var(--leading-lead)}.lane .ls{padding:var(--space-1) var(--space-2)}.ls .tag{display:none}.dis{padding:var(--space-2) 0}}
@media (max-width:1400px){.ls b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="x-cap"><b>Workings · V6</b> two hands: worked from the record alone and with a model's help; only the difference needs you · double reading, tracked changes</div>
<script>
/*@JS*/
/* ================= V6 ================= */
let P = E.defaults(), decided = {}, hot = null, shownLane = 99, showHeard = false;
const app = document.getElementById("app");
app.innerHTML = UI.rail([["R", "replay"], ["↑ ↓", "next difference"], ["C", "confirm the match"], ["N", "not them"], ["G", "model gateway on/off"], ["T", "technical words"]]) + '<main class="main" id="main"></main>';
const main = document.getElementById("main"), I = UI.I;
const TODAY_CALLS = 14, LIMIT = 500;   /* sample: model gateway calls Data Atlas made today, and its daily allowance */
function render() {
  const Pm = E.clone(P); Pm.gateway = true;
  const Pr = E.clone(P); Pr.gateway = false;
  const Rm = E.run(Pm), Rr = E.run(Pr);
  /* a person's ruling on a match: "not them" makes both hands agree; "confirm" proposes it to Triage */
  const rejected = new Set(Object.keys(decided).filter(k => decided[k] === "no").map(Number));
  const ansM = Rm.answer.map(r => r.s.id).concat(Rm.maybe.filter(r => rejected.has(r.s.id)).map(r => r.s.id));
  const nm = ansM.length, nr = Rr.answer.length;
  const ks = DATA.kinds.filter(k => P.kinds.has(k.id));
  let h = '<div class="head"><div><p class="eyebrow">' + E.esc(DATA.app) + ' · Ask · worked twice</p><div class="asked">' + I("quote", 14) + '<q>' + E.esc(DATA.asked.words) + '</q></div><div class="said">' + E.sentence(P) + '</div></div>' +
    '<div class="toolbar"><button class="btn" id="gw" aria-pressed="' + P.gateway + '">' + I(P.gateway ? "bot" : "power-off") + (P.gateway ? "Model on" : "Model off") + '</button><button class="btn" id="tb">' + I("code") + 'Technical</button><button class="btn">' + I("bookmark-plus") + 'Save question</button></div></div><div class="techq">' + E.esc(E.tech(P)) + '</div>';
  /* the lane: every step, and whether it needs the model gateway */
  const L = [
    { b: "Where to look", t: DATA.floor.name + " and " + DATA.floor.above, m: false, tag: "floors and access" },
    { b: "Contracts that count", t: E.cap(E.list(DATA.statuses.filter(s => P.status.has(s.id)).map(s => s.label), "or")), m: false, tag: "you chose" },
    { b: "“" + DATA.heard.said + "” means", t: E.cap(E.list(ks.map(k => k.many), "or")), m: true, tag: P.gateway ? "a model read it; you confirmed" : "you ticked them" },
    { b: "Since spring", t: E.dayY(P.since), m: false, tag: "asked back; you chose" },
    { b: "Linking contacts", t: "Number, name, spelling" + (P.gateway ? " + meaning" : ""), m: "part", tag: P.gateway ? "meaning uses the model" : "no model" },
    { b: "Saying the answer", t: "Sentences from the steps", m: false, tag: "a template, never a model" }
  ];
  h += '<div class="lane" aria-label="Steps">' + L.slice(0, shownLane).map((s, i) => '<div class="ls' + (s.m && P.gateway ? " model" : "") + '" style="animation-delay:calc(var(--motion-instant) * ' + (shownLane === 99 ? 0 : i) + ')"><span class="no">' + (i + 1) + '</span><b>' + E.esc(s.b) + '</b>' + E.esc(s.t) + '<span class="tag">' + (s.m && P.gateway ? I("bot", 12) : I("badge-check", 12)) + E.esc(s.tag) + '</span></div>').join("") + '</div>';
  /* the two answers */
  h += '<section class="body"><div class="cols"><div class="ch"><span class="n">' + nr + '</span><span class="t"><b>From the record alone</b>numbers, names and spelling; no model</span></div>' +
    '<div class="ch mid"><span class="t"><b>' + (P.gateway ? 'Where the two differ' : 'The model gateway is off') + '</b>' + (P.gateway ? 'Only these need a person. Each is a model’s guess until confirmed in Triage.' : 'Only the record is used. An admin turns the gateway on in Admin; nothing else here changes.') + '</span></div>' +
    '<div class="ch right"><span class="t"><b>With the model’s help</b>adds matching by meaning</span><span class="n">' + (P.gateway ? nm : '–') + '</span></div></div><div class="rows">';
  const agreed = Rr.answer.filter(r => ansM.includes(r.s.id) || !P.gateway);
  const diffs = P.gateway ? Rr.answer.filter(r => !Rm.answer.find(x => x.s.id === r.s.id)) : [];
  if (diffs.length) {
    h += '<div class="grp">' + I("bot", 12) + ' ' + diffs.length + ' differ<span class="ln"></span></div>';
    diffs.forEach(r => {
      const m = Rm.all.find(x => x.s.id === r.s.id), dec = decided[r.s.id];
      h += '<div class="dis' + (hot === r.s.id ? " hot" : "") + '" data-id="' + r.s.id + '"><div class="l"><span class="tag">in the answer</span><br>' + E.esc(r.s.name) + '<small>Last ' + E.esc(E.K[r.last.kind].label) + ' the record can link: ' + E.dayShortY(r.last.date) + '</small></div>' +
        '<div class="ev' + (dec === "no" ? " rej" : "") + '"><b>' + I("bot", 12) + ' The model matched ' + E.an(E.K[m.by.kind].label) + ' of ' + E.dayShortY(m.by.date) + ' to them by meaning.</b><span class="q">' + E.esc(m.by.text) + '</span>No company number or name in it matches the record.' +
        (dec === "yes" ? '<div class="done">' + I("inbox", 14) + 'Sent to Triage as a proposal. Still a guess here until ' + E.esc(DATA.gapKeeper.desk) + ' accepts it.</div>' : dec === "no" ? '<div class="done">' + I("x", 14) + 'You said not them. Both hands now agree; the model won’t be asked again for this email.</div>' :
          '<div class="acts"><button class="btn" data-dec="yes" data-id="' + r.s.id + '">' + I("check", 14) + 'It’s them: propose</button><button class="btn" data-dec="no" data-id="' + r.s.id + '">' + I("x", 14) + 'Not them</button></div>') + '</div>' +
        '<div class="r">' + (dec === "no" ? '<span class="tag" style="color:var(--x-proposed-lit)">in the answer</span><br>' + E.esc(r.s.name) + '<small>by your ruling</small>' : '<span class="tag">not in the answer</span><br><span class="nm">' + E.esc(r.s.name) + '</span><small>heard from ' + E.day(m.by.date) + ', by a guess</small>') + '</div></div>';
    });
  }
  h += '<div class="grp">' + I("badge-check", 12) + ' ' + agreed.length + ' both agree: not heard from<span class="ln"></span></div>';
  h += agreed.filter(r => !diffs.includes(r)).map(r => '<div class="agree' + (r.sure === "less" ? " less" : "") + '"><div class="bar"><span>' + E.esc(r.s.name) + '</span><span class="mid"></span><span class="d" title="' + E.esc(r.doubt || "") + '">' + (r.sure === "less" ? I("circle-help", 12) + ' less sure · ' : '') + E.esc(r.why.replace("Last: ", "last ")) + '</span></div></div>').join("");
  if (Rr.unknown.length) h += '<div class="grp">Neither can tell<span class="ln"></span></div>' + Rr.unknown.map(r => '<div class="unk"><span class="mk mk-gap"></span><span><b>' + E.esc(r.s.name) + '</b>: no contact of any kind recorded. ' + E.esc(DATA.gapKeeper.name) + ' could add one.</span></div>').join("");
  h += '<div class="grp">' + Rm.heard.length + ' both agree: heard from <button id="sh">' + (showHeard ? 'hide' : 'show') + '</button><span class="ln"></span></div>';
  if (showHeard) h += Rm.heard.map(r => '<div class="agree"><div class="bar"><span class="muted">' + E.esc(r.s.name) + '</span><span class="mid"></span><span class="d">' + E.esc(r.why) + '</span></div></div>').join("");
  h += '</div><div class="gwlog"><span>' + UI.gwChip(P.gateway) + '</span><span>' + (P.gateway ? 'This answer asked the model gateway <b>' + (Rm.maybe.length + 1) + ' times</b> (reading “' + E.esc(DATA.heard.said) + '”, then matching) · logged in the audit log before each call · ' + E.esc(DATA.app) + ' has used <b>' + TODAY_CALLS + ' of ' + LIMIT + '</b> today' : 'No calls to the model gateway') + '</span><span>' + E.cap(DATA.hidden.count) + ' on ' + E.esc(DATA.hidden.floor) + ': not yours to see, ask ' + E.esc(DATA.hidden.ask) + '</span></div></section>';
  main.innerHTML = h;
  E.hydrate(main);
}
main.addEventListener("click", e => {
  const d = e.target.closest("[data-dec]"); if (d) { decided[+d.dataset.id] = d.dataset.dec; hot = +d.dataset.id; render(); return; }
  if (e.target.closest("#sh")) { showHeard = !showHeard; render(); return; }
  if (e.target.closest("#gw")) { P.gateway = !P.gateway; render(); return; }
  if (e.target.closest("#tb")) { document.body.classList.toggle("tech"); return; }
  const r = e.target.closest(".dis"); if (r) { hot = +r.dataset.id; render(); }
});
let runId = 0;
async function demo() {
  const me = ++runId; P = E.defaults(); decided = {}; hot = null; showHeard = false; shownLane = 0; render();
  await E.wait(E.ms("--motion-run")); if (me !== runId) return;
  for (let i = 1; i <= 6; i++) { shownLane = i; render(); await E.wait(E.ms("--motion-instant")); if (me !== runId) return; }
  shownLane = 99;
  const ids = [...main.querySelectorAll(".dis")].map(x => +x.dataset.id);
  if (!ids.length) return;
  hot = ids[0]; render();
  await E.wait(E.ms("--motion-calm")); if (me !== runId) return;
  decided[ids[0]] = "yes"; hot = ids[1] || ids[0]; render();
}
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  const ids = [...main.querySelectorAll(".dis")].map(x => +x.dataset.id);
  if (k === "r") demo();
  else if (k === "g") { P.gateway = !P.gateway; render(); }
  else if (k === "t") document.body.classList.toggle("tech");
  else if ((k === "arrowdown" || k === "arrowup") && ids.length) { let i = ids.indexOf(hot); i = k === "arrowdown" ? Math.min(ids.length - 1, i + 1) : Math.max(0, i - 1); hot = ids[i]; render(); e.preventDefault(); }
  else if ((k === "c" || k === "n") && hot != null && ids.includes(hot)) { decided[hot] = k === "c" ? "yes" : "no"; render(); }
});
demo();
</script>
</body>
</html>
