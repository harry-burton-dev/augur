<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workings · V1 · The method card</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
/* ---- V1: the answer on the left, the method on the right, one numbered line per step ---- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:var(--space-6);margin-top:var(--space-4)}
@media (max-width:1400px){.body{gap:var(--space-5)}}
.col{min-height:0;display:flex;flex-direction:column}
.total{display:flex;align-items:baseline;gap:var(--space-3);padding-bottom:var(--space-3);border-bottom:1px solid var(--hairline-strong)}
.total .n{font:200 var(--type-display)/1 var(--font-sans);color:var(--light);font-variant-numeric:tabular-nums;min-width:var(--space-7)}
.total .t{font-size:var(--type-lead);line-height:var(--leading-lead)}
.total .t small{display:block;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto var(--space-5);gap:var(--space-3);align-items:center;min-height:var(--target-sm);padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.row .nm{color:var(--ink);min-width:0}
.row .nm small{display:block;color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.row .lc{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap;display:flex;gap:var(--space-1);align-items:center}
.row .sr2{display:flex;justify-content:flex-end;color:var(--ink-muted);cursor:help}
.row.joined{background:var(--x-proposed-lit-wash);box-shadow:inset 2px 0 0 var(--x-proposed-lit);animation:fresh var(--motion-calm) var(--ease-out)}
.row.less .sr2{color:var(--warning)}
.grp{margin:var(--space-4) 0 var(--space-1);display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3)}
.grp .micro b{color:var(--ink);font-weight:400}
.row.maybe{border:1px dotted var(--x-proposed-guess-ink);background-image:var(--x-proposed-guess-wash);border-radius:var(--radius-key);margin-bottom:var(--space-1)}
.row.unknown .nm small{color:color-mix(in srgb,var(--ink) 80%,transparent)}
.change{display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-inset);background:var(--surface-inset);border:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.change b{color:var(--ink);font-weight:400}
.change .btn{height:calc(var(--target-sm) - var(--space-2));margin-left:auto}
.change[hidden]{display:none}

.method{position:relative;background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-card);padding:var(--space-4) var(--space-5);min-height:0;display:flex;flex-direction:column;backdrop-filter:blur(var(--surface-blur))}
.method h2{margin:0 0 var(--space-2);font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);display:flex;justify-content:space-between}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;overflow:auto;min-height:0}
.st{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--hairline)}
.st:last-child{border-bottom:0}
.st .no{font:200 var(--type-heading)/1 var(--font-sans);color:var(--ink-muted);grid-row:span 3}
.st .q{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.st .set{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink)}
.st .set .w{color:var(--light);border-bottom:1px dashed var(--hairline-strong);padding:0 2px;border-radius:var(--radius-key) var(--radius-key) 0 0}
.st .set .w:hover,.st .set .w[aria-expanded="true"]{background:var(--surface-raised)}
.st .set .w.guess{border-bottom:0}
.st .eff{grid-column:2 / 4;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center}
.st .eff b{color:var(--ink);font-weight:400}
.st .eff button{color:var(--ink);text-decoration:underline dotted var(--hairline-strong);text-underline-offset:3px}
.st .r{align-self:start;padding-top:2px}
.st.model .no{color:var(--ink)}
.st.lit{background:linear-gradient(90deg,var(--x-proposed-lit-wash),transparent 70%)}
.st.lit .no{color:var(--x-proposed-lit)}
.left{grid-column:2 / 4;margin:var(--space-1) 0 0;padding:var(--space-2) var(--space-3);border-left:1px solid var(--hairline-strong);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:none}
.left.open{display:block}
.left div{display:flex;justify-content:space-between;gap:var(--space-3)}
.left div span:first-child{color:var(--ink)}
.res{display:flex;gap:var(--space-2);flex-wrap:wrap}
.sbar{display:flex;height:var(--space-2);border-radius:var(--radius-pill);overflow:hidden;gap:2px;margin:var(--space-1) 0;grid-column:2 / 4}
.sbar i{display:block;height:100%}
.sbar .a{background:var(--x-proposed-lit)}
.sbar .m{background:var(--x-proposed-guess-wash);border:1px dotted var(--x-proposed-guess-ink)}
.sbar .u{background:var(--x-proposed-gap);background-color:var(--surface-inset)}
.sbar .h{background:color-mix(in srgb,var(--ink-muted) 30%,transparent)}
.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--hairline)}
.legend span{display:inline-flex;align-items:center;gap:var(--space-2)}
.techq{display:none;margin:var(--space-2) 0 0;padding:var(--space-2) var(--space-3);background:var(--surface-inset);border-radius:var(--radius-key);font:400 var(--x-proposed-type-micro)/1.55 var(--font-mono);color:var(--ink-muted);white-space:pre}
.tech .techq{display:block}
@media (max-height:840px){.said{font-size:var(--type-lead);line-height:var(--leading-lead)}.total .n{font-size:var(--type-title)}.st{padding:var(--space-2) 0}.legend{display:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="x-cap"><b>Workings · V1</b> the method card: one numbered line per step, each changeable · recipe cards, "explain the SQL", dynamic queries</div>
<script>
/*@JS*/
/* ================= V1 ================= */
let P = E.defaults(), open = null, openLeft = null, lastChange = null, lit = null;
const app = document.getElementById("app");
app.innerHTML = UI.rail([["R", "replay"], ["1–5", "open a step"], ["G", "model gateway on/off"], ["T", "technical words"], ["Esc", "close"]]) +
  '<main class="main" id="main"></main>';
const main = document.getElementById("main");
const I = UI.I;
const sureIcon = r => r.sure === "less" ? '<span class="sr2" title="' + E.esc(r.doubt) + '">' + I("circle-help", 16) + '</span>' : '<span class="sr2" title="Recorded contacts, no model">' + I("badge-check", 16) + '</span>';
function contactsBy(R) { const c = {}; for (const row of R.all) if (row.usable) for (const u of row.usable) c[u.match] = (c[u.match] || 0) + 1; return c; }
function ignoredKinds(R) { const o = []; for (const row of R.all) if (row.ignored) for (const g of row.ignored) if (g.skip === "kind") o.push([row.s.name, E.cap(E.K[g.kind].label) + ", " + E.day(g.date)]); return o; }
function render() {
  const R = E.run(P), base = R.answer.length;
  const cb = contactsBy(R), ign = ignoredKinds(R);
  const totalLinked = Object.values(cb).reduce((a, b) => a + b, 0);
  let h = '<div class="head"><div><p class="eyebrow">' + E.esc(DATA.app) + ' · Ask · answer with its workings</p>' +
    '<div class="asked">' + I("quote", 14) + '<q>' + E.esc(DATA.asked.words) + '</q></div>' +
    '<div class="said" id="said">' + E.sentence(P) + '</div></div>' +
    '<div class="toolbar"><button class="btn" id="gw" aria-pressed="' + P.gateway + '">' + I(P.gateway ? "bot" : "power-off") + (P.gateway ? "Model on" : "Model off") + '</button><button class="btn" id="tb" aria-pressed="' + document.body.classList.contains("tech") + '">' + I("code") + 'Technical</button><button class="btn">' + I("bookmark-plus") + 'Save question</button></div></div>';
  h += '<div class="techq">' + E.esc(E.tech(P)) + '</div>';
  /* left: the answer */
  h += '<div class="body"><section class="col" aria-label="Answer"><div class="total"><span class="n" id="num" data-v="' + base + '">' + base + '</span><span class="t">' + (base === 1 ? DATA.kind.one : DATA.kind.many) + ' we haven’t heard from' +
    '<small>' + (R.maybe.length ? R.maybe.length + ' more if the model’s matches are wrong · ' : '') + (R.unknown.length ? R.unknown.length + ' we can’t tell · ' : '') + E.cap(DATA.hidden.count) + ' on ' + E.esc(DATA.hidden.floor) + ' not yours to see</small></span></div>';
  h += '<div class="change" id="chg"' + (lastChange ? '' : ' hidden') + '>' + (lastChange || '') + '</div>';
  h += '<div class="scroll" style="min-height:0;flex:1"><ul class="rows">' + R.answer.map(r => '<li class="row' + (r.sure === "less" ? " less" : "") + (lit && lit.has(r.s.id) ? " joined" : "") + '"><span class="nm">' + E.esc(r.s.name) + (r.doubt ? '<small>' + E.esc(r.doubt) + '</small>' : r.notes.length ? '<small>' + E.esc(r.notes.join("; ")) + '</small>' : '') + '</span><span class="lc">' + (r.last ? I(E.K[r.last.kind].icon, 13) + E.esc(r.why.replace("Last: ", "last ")) : 'nothing that counts') + '</span>' + sureIcon(r) + '</li>').join("") + '</ul>';
  if (R.maybe.length) h += '<div class="grp"><span class="micro">' + I("bot", 12) + ' Heard from, but only by a model’s match: <b>' + R.maybe.length + '</b></span><span class="by model">' + I("bot", 12) + 'guess</span></div><ul class="rows">' + R.maybe.map(r => '<li class="row maybe"><span class="nm">' + E.esc(r.s.name) + '<small>' + E.esc(r.by.text) + '</small></span><span class="lc">' + I(E.K[r.by.kind].icon, 13) + E.day(r.by.date) + '</span><button class="sr2" title="Confirm or reject this match: it goes to Triage">' + I("scale", 16) + '</button></li>').join("") + '</ul>';
  if (R.unknown.length) h += '<div class="grp"><span class="micro">Can’t tell: <b>' + R.unknown.length + '</b></span></div><ul class="rows">' + R.unknown.map(r => '<li class="row unknown"><span class="nm">' + E.esc(r.s.name) + '<small>No contact of any kind recorded since they became a supplier in ' + E.dayShortY(r.s.since).replace(/^\d+ /, "") + '. ' + E.esc(DATA.gapKeeper.name) + ' (' + E.esc(DATA.gapKeeper.desk) + ') could add one.</small></span><span class="mk mk-gap" title="Not known yet"></span><span class="sr2">' + I("user-round-plus", 16) + '</span></li>').join("") + '</ul>';
  h += '</div></section>';
  /* right: the method */
  const st = [
    { id: "floor", q: "Where to look", set: '<button class="w" data-step="floor">' + E.esc(DATA.floor.name) + ' and ' + E.esc(DATA.floor.above) + '</button>', by: "desk", eff: '<span><b>' + R.visible + '</b> suppliers kept here</span><span class="mk mk-unseen"></span><span>' + E.cap(DATA.hidden.count) + ' on ' + E.esc(DATA.hidden.floor) + ', ask ' + E.esc(DATA.hidden.ask) + '</span>' },
    { id: "status", q: UI.QUESTION.status, set: 'Those with a <button class="w" data-step="status">' + E.list(DATA.statuses.filter(s => P.status.has(s.id)).map(s => s.label), "or") + ' contract</button>', by: "you", eff: '<span>leaves <b>' + R.inScope + '</b></span>' + (R.outStatus.length ? '<button data-left="status">' + R.outStatus.length + ' left out, why</button>' : ''), left: R.outStatus.map(r => [r.s.name, r.why]) },
    { id: "kinds", q: UI.QUESTION.kinds, set: '<button class="w guess" data-step="kinds">' + E.esc(E.list(DATA.kinds.filter(k => P.kinds.has(k.id)).map(k => (/^[aeiou]/.test(k.label) ? "an " : "a ") + k.label), "or")) + '</button> from them', by: "model", model: true, eff: '<span>read from “' + E.esc(DATA.heard.said) + '” by a model; you confirmed</span>' + (ign.length ? '<button data-left="kinds">' + ign.length + ' contact doesn’t count</button>' : ''), left: ign },
    { id: "match", q: UI.QUESTION.match, set: '<button class="w" data-step="match">By ' + E.esc(E.list(DATA.matches.filter(m => P.match.has(m.id) && (!m.model || P.gateway)).map(m => m.label), "or")) + '</button>', by: "desk", model: P.gateway && P.match.has("meaning"), eff: '<span><b>' + totalLinked + '</b> contacts linked</span>' + DATA.matches.filter(m => cb[m.id]).map(m => '<span class="' + (m.model ? 'guess' : '') + '">' + I(m.icon, 12) + ' ' + cb[m.id] + ' by ' + m.label + '</span>').join("") + (!P.gateway ? '<span>' + I("power-off", 12) + ' meaning: model gateway off</span>' : '') },
    { id: "since", q: DATA.since.asked, set: 'Nothing on or after <button class="w" data-step="since">' + E.dayY(P.since) + '</button>', by: "you", eff: '<span>asked back: “since spring” could be ' + E.list(DATA.since.options.map(o => o.label), "or") + '</span>' },
  ];
  h += '<section class="method" aria-label="How the desk got there" id="method"><h2><span>How the desk got there</span><span>' + UI.gwChip(P.gateway) + '</span></h2><ol class="steps">';
  st.forEach((s, i) => {
    h += '<li class="st' + (s.model ? " model" : "") + (lastChange && lastChange.includes('data-step-done="' + s.id + '"') ? " lit" : "") + '" data-id="' + s.id + '"><span class="no">' + (i + 1) + '</span><span class="q">' + E.esc(s.q) + '</span><span class="r">' + UI.byChip(s.by) + '</span><span class="set" style="grid-column:2 / 4">' + s.set + '</span><span class="eff">' + s.eff + '</span>' +
      (s.left ? '<div class="left' + (openLeft === s.id ? " open" : "") + '">' + s.left.map(l => '<div><span>' + E.esc(l[0]) + '</span><span>' + E.esc(l[1]) + '</span></div>').join("") + '</div>' : '') + '</li>';
  });
  const tot = R.inScope;
  h += '<li class="st"><span class="no">=</span><span class="q">What that leaves</span><span class="r"></span><span class="set" style="grid-column:2 / 4">Of ' + tot + ': <b style="font-weight:400;color:var(--x-proposed-lit)">' + R.answer.length + ' not heard from</b>, ' + R.heard.length + ' heard from' + (R.maybe.length ? ', ' + R.maybe.length + ' only by a guess' : '') + (R.unknown.length ? ', ' + R.unknown.length + ' can’t tell' : '') + '</span>' +
    '<span class="sbar" aria-hidden="true"><i class="a" style="flex:' + R.answer.length + '"></i><i class="m" style="flex:' + R.maybe.length + '"></i><i class="u" style="flex:' + R.unknown.length + '"></i><i class="h" style="flex:' + R.heard.length + '"></i></span></li>';
  h += '</ol><div class="legend"><span>' + I("badge-check", 14) + 'from the record</span><span><span class="mk mk-guess"></span>a model’s guess</span><span><span class="mk mk-gap"></span>not known yet</span><span><span class="mk mk-unseen"></span>not yours to see</span></div></section></div>';
  main.innerHTML = h;
  if (open) pop();
  E.hydrate(main);
}
function pop() {
  document.querySelectorAll(".pop").forEach(p => p.remove());
  const a = [...main.querySelectorAll('.method [data-step="' + open + '"]')][0]; if (!a) return;
  a.setAttribute("aria-expanded", "true");
  const base = E.run(P).answer.length;
  const el = document.createElement("div"); el.className = "pop"; el.setAttribute("role", "menu"); el.innerHTML = UI.popHTML(open, P, base);
  main.appendChild(el); UI.place(el, a, main); E.hydrate(el);
}
function choose(step, v) {
  const before = E.run(P); UI.apply(P, step, v); const after = E.run(P); const df = E.diff(before, after);
  lit = new Set(df.joined.map(x => x.s.id));
  const names = r => E.list(r.map(x => x.s.name));
  lastChange = '<span data-step-done="' + step + '">' + I("history", 14) + '</span><span>You changed step ' + (E.steps.findIndex(s => s.id === step) + 1) + '. ' + (df.joined.length ? '<b>' + names(df.joined) + '</b> joined. ' : '') + (df.left.length ? '<b>' + names(df.left) + '</b> left. ' : '') + (!df.joined.length && !df.left.length ? 'The answer didn’t move.' : '') + '</span><button class="btn" id="undo">' + I("undo-2", 14) + 'Undo</button>';
  undoStack.push(before.P || null);
  render(); const n = document.getElementById("num"); n.dataset.v = before.answer.length; UI.roll(n, after.answer.length);
}
let undoStack = [], snapshots = [];
main.addEventListener("click", e => {
  const w = e.target.closest("[data-step]");
  if (w && w.closest(".method,.said") && !w.classList.contains("opt")) { const s = w.dataset.step; open = open === s ? null : s; render(); return; }
  const o = e.target.closest(".opt"); if (o && !o.disabled) { snapshots.push(E.clone(P)); if (o.dataset.step === "since") open = null; choose(o.dataset.step, o.dataset.v); return; }
  const l = e.target.closest("[data-left]"); if (l) { openLeft = openLeft === l.dataset.left ? null : l.dataset.left; render(); return; }
  if (e.target.closest("#undo")) { if (snapshots.length) { P = snapshots.pop(); lastChange = null; lit = null; render(); } return; }
  if (e.target.closest("#gw")) { toggleGw(); return; }
  if (e.target.closest("#tb")) { document.body.classList.toggle("tech"); render(); return; }
  if (!e.target.closest(".pop") && open) { open = null; render(); }
});
function toggleGw() { snapshots.push(E.clone(P)); const b = E.run(P); P.gateway = !P.gateway; const a = E.run(P); const df = E.diff(b, a); lit = new Set(df.joined.map(x => x.s.id)); lastChange = '<span data-step-done="match">' + I("bot", 14) + '</span><span>Model gateway ' + (P.gateway ? 'on' : 'off') + '. ' + (df.joined.length ? '<b>' + E.list(df.joined.map(x => x.s.name)) + '</b> joined: only a guess said we’d heard from them. ' : df.left.length ? '<b>' + E.list(df.left.map(x => x.s.name)) + '</b> left. ' : '') + 'Every other step works without a model.</span><button class="btn" id="undo">' + I("undo-2", 14) + 'Undo</button>'; render(); const n = document.getElementById("num"); n.dataset.v = b.answer.length; UI.roll(n, a.answer.length); }
let runId = 0;
async function demo() {
  const me = ++runId; P = E.defaults(); open = null; openLeft = null; lastChange = null; lit = null; snapshots = []; render();
  await E.wait(E.ms("--motion-run")); if (me !== runId) return;
  open = "since"; render();
  await E.wait(E.ms("--motion-run")); if (me !== runId) return;
  snapshots.push(E.clone(P)); open = null; choose("since", "2026-04-01");
}
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  const k = e.key.toLowerCase();
  if (k === "r") demo();
  else if (k === "g") toggleGw();
  else if (k === "t") { document.body.classList.toggle("tech"); render(); }
  else if (/^[1-5]$/.test(k)) { open = E.steps[+k - 1].id; render(); const o = document.querySelector(".pop .opt:not([disabled])"); if (o) o.focus(); }
  else if (k === "escape") { open = null; render(); }
});
demo();
</script>
</body>
</html>
