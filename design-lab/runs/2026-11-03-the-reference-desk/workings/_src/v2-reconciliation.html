<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workings · V2 · The reconciliation</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
/* ---- V2: the answer as a reconciliation: start with all, take out each group, check the sum ---- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:var(--space-6);margin-top:var(--space-4)}
@media (max-width:1400px){.body{gap:var(--space-5)}}
.ledger{position:relative;background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-card);padding:var(--space-4) var(--space-5);min-height:0;display:flex;flex-direction:column;backdrop-filter:blur(var(--surface-blur))}
.lh{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) calc(var(--space-8) + var(--space-4)) calc(var(--space-7) + var(--space-2));gap:var(--space-3);padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline-strong)}
.lh span{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.lh span:last-child{text-align:right}
.lines{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.ln{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) calc(var(--space-8) + var(--space-4)) calc(var(--space-7) + var(--space-2));gap:var(--space-1) var(--space-3);align-items:baseline;padding:var(--space-2) 0;font-size:var(--type-meta);line-height:var(--leading-meta);animation:tape var(--motion-base) var(--ease-out) both}
@keyframes tape{from{opacity:0;transform:translateY(calc(var(--space-1) * -1))}}
.ln .cb{align-self:center;display:flex}
.ln .cb input{appearance:none;width:var(--space-4);height:var(--space-4);border:1px solid var(--hairline-strong);border-radius:3px;margin:0;display:grid;place-items:center;cursor:pointer;background:var(--surface-inset)}
.ln .cb input:checked{background:var(--surface-raised);border-color:var(--ink-muted)}
.ln .cb input:checked::after{content:"";width:var(--space-2);height:var(--space-1);border-left:1.5px solid var(--light);border-bottom:1.5px solid var(--light);transform:rotate(-45deg) translate(1px,-1px)}
.ln .cb input:disabled{opacity:.4;cursor:help}
.ln .tx{color:var(--ink);min-width:0}
.ln .tx .less{color:var(--ink-muted)}
.ln .tx .w{color:var(--light);border-bottom:1px dashed var(--hairline-strong);padding:0 2px;border-radius:var(--radius-key) var(--radius-key) 0 0}
.ln .tx .w:hover,.ln .tx .w[aria-expanded="true"]{background:var(--surface-raised)}
.ln .tx .w.guess{border-bottom:0}
.ln .tx small{display:block;color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.ln .tx .who{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);margin-top:var(--space-1)}
.ln .tx .who button{font-size:var(--type-small);color:var(--ink-muted);text-decoration:underline dotted var(--hairline-strong);text-underline-offset:3px}
.ln .by{justify-self:start}
.ln .amt{font:300 var(--type-lead)/1 var(--font-mono);text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.ln.sub{border-top:1px solid var(--hairline-strong);margin-top:var(--space-1)}
.ln.sub .amt{color:var(--light)}
.ln.total{border-top:3px double var(--ink-muted);margin-top:var(--space-2);padding-top:var(--space-3)}
.ln.total .tx{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.ln.total .amt{font:200 var(--type-display)/1 var(--font-sans);color:var(--x-proposed-lit);text-shadow:0 0 var(--glow-blur) var(--x-proposed-lit-wash)}
.ln.off .amt{text-decoration:line-through;text-decoration-color:var(--ink-muted);color:var(--ink-muted)}
.ln.off .tx{color:var(--ink-muted)}
.ln.model{background-image:var(--x-proposed-guess-wash);border:1px dotted var(--x-proposed-guess-ink);border-radius:var(--radius-key);padding-left:var(--space-2);padding-right:var(--space-2);margin:var(--space-1) calc(var(--space-2) * -1)}
.ln.hid .amt{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.ln.hid .tx{color:var(--ink-muted)}
.names{grid-column:2 / 5;display:none;flex-wrap:wrap;gap:var(--space-1) var(--space-2);margin-top:var(--space-1)}
.names.open{display:flex}
.names span{font-size:var(--type-small);line-height:var(--leading-small);padding:2px var(--space-2);border-radius:var(--radius-pill);background:var(--surface-inset);border:1px solid var(--hairline);color:var(--ink)}
.names span i{font-style:normal;color:var(--ink-muted)}
.check{margin-top:auto;padding-top:var(--space-3);border-top:1px solid var(--hairline);display:flex;justify-content:space-between;gap:var(--space-3);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.check b{color:var(--ink);font-weight:400}

.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.side h2{margin:0;font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.who-list{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.who-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.who-list li small{grid-column:1 / 3;color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.who-list li .d{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.who-list li.g{border:1px dotted var(--x-proposed-guess-ink);background-image:var(--x-proposed-guess-wash);border-radius:var(--radius-key);padding-left:var(--space-2);padding-right:var(--space-2)}
.who-list li.u{background:var(--x-proposed-gap);padding-left:var(--space-2);padding-right:var(--space-2);--x-proposed-gap-tick:var(--space-2)}
.who-list li.j{box-shadow:inset 2px 0 0 var(--x-proposed-lit);background-color:var(--x-proposed-lit-wash);padding-left:var(--space-2)}
.sure{padding:var(--space-3);border-radius:var(--radius-inset);background:var(--surface-inset);border:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.sure b{color:var(--ink);font-weight:400}
.sure p{margin:0 0 var(--space-2)}
.sure p:last-child{margin:0}
.techq{display:none;margin:var(--space-2) 0 0;padding:var(--space-2) var(--space-3);background:var(--surface-inset);border-radius:var(--radius-key);font:400 var(--x-proposed-type-micro)/1.55 var(--font-mono);color:var(--ink-muted);white-space:pre}
.tech .techq{display:block}
@media (max-height:840px){.said{font-size:var(--type-lead);line-height:var(--leading-lead)}.ln{padding:var(--space-1) 0}.ln.total .amt{font-size:var(--type-title)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="x-cap"><b>Workings · V2</b> the reconciliation: take each group out on its own line, the sum checks · bank reconciliation, the adding-machine tape</div>
<script>
/*@JS*/
/* ================= V2 ================= */
let P = E.defaults(), open = null, openNames = null, shownLines = 99, trustGuess = true, unknownOut = true, joined = new Set();
const app = document.getElementById("app");
app.innerHTML = UI.rail([["R", "replay"], ["1–5", "change a step"], ["Space", "tick or untick a line"], ["G", "model gateway on/off"], ["T", "technical words"], ["Esc", "close"]]) + '<main class="main" id="main"></main>';
const main = document.getElementById("main"), I = UI.I;
let prevTotal = null;
function totals(R) { return R.answer.length + (trustGuess ? 0 : R.maybe.length) + (unknownOut ? 0 : R.unknown.length); }
function render() {
  const R = E.run(P), total = totals(R);
  const kindsHeard = {}; R.heard.forEach(r => kindsHeard[r.by.kind] = (kindsHeard[r.by.kind] || 0) + 1);
  const ks = DATA.kinds.filter(k => P.kinds.has(k.id));
  let h = '<div class="head"><div><p class="eyebrow">' + E.esc(DATA.app) + ' · Ask · answer with its workings</p><div class="asked">' + I("quote", 14) + '<q>' + E.esc(DATA.asked.words) + '</q></div><div class="said">' + E.sentence(P) + '</div></div>' +
    '<div class="toolbar"><button class="btn" id="gw" aria-pressed="' + P.gateway + '">' + I(P.gateway ? "bot" : "power-off") + (P.gateway ? "Model on" : "Model off") + '</button><button class="btn" id="tb">' + I("code") + 'Technical</button><button class="btn">' + I("bookmark-plus") + 'Save question</button></div></div><div class="techq">' + E.esc(E.tech(P)) + '</div>';
  const L = [];
  L.push({ cls: "", cb: '', tx: E.cap(DATA.kind.many) + ' kept on <button class="w" data-step="floor">' + E.esc(DATA.floor.name) + ' and ' + E.esc(DATA.floor.above) + '</button>', by: "desk", amt: R.visible, names: null });
  L.push({ cls: "hid", cb: '<span class="mk mk-unseen" title="Not yours to see"></span>', tx: 'Not counted: ' + DATA.hidden.count + ' kept on ' + E.esc(DATA.hidden.floor) + '<small>A floor you can’t open. ' + E.esc(DATA.hidden.ask) + ' can rerun this question there.</small>', by: "", amt: DATA.hidden.count });
  L.push({ id: "status", cls: "", cb: '<input type="checkbox" checked disabled title="This is the question itself: change which contracts count instead">', tx: '<span class="less">Less: </span>those without a <button class="w" data-step="status">' + E.esc(E.list(DATA.statuses.filter(s => P.status.has(s.id)).map(s => s.label), "or")) + ' contract</button>', by: "you", amt: '(' + R.outStatus.length + ')', names: R.outStatus.map(r => [r.s.name, r.why]) });
  L.push({ cls: "sub", cb: '', tx: E.cap(DATA.kind.many) + ' we still use', by: "", amt: R.inScope });
  L.push({ id: "heard", cls: "", cb: '<input type="checkbox" checked disabled title="This is the question itself">', tx: '<span class="less">Less: </span>heard from since <button class="w" data-step="since">' + E.dayY(P.since) + '</button>, by <button class="w guess" data-step="kinds">' + E.esc(E.list(ks.map(k => k.label), "or")) + '</button>' + '<small>' + DATA.kinds.filter(k => kindsHeard[k.id]).map(k => kindsHeard[k.id] + ' by ' + (kindsHeard[k.id] === 1 ? k.label : k.many)).join(' · ') + '</small>', by: "you", amt: '(' + R.heard.length + ')', names: R.heard.map(r => [r.s.name, r.why]) });
  L.push({ id: "guess", cls: "model" + (trustGuess ? "" : " off"), cb: '<input type="checkbox" data-line="guess"' + (trustGuess ? " checked" : "") + (P.gateway ? "" : " disabled") + ' aria-label="Take out suppliers heard from only by a model’s match">', tx: '<span class="less">Less: </span>heard from only by <button class="w guess" data-step="match">a model’s match by meaning</button>' + (P.gateway ? '<small>' + (trustGuess ? 'Ticked: you trust the guess. Untick and they stay in the answer.' : 'Unticked: these stay in the answer until someone confirms the match in Triage.') + '</small>' : '<small>' + I("power-off", 12) + ' The model gateway is off, so nothing was matched by meaning. An admin turns it on in Admin.</small>'), by: "model", amt: '(' + R.maybe.length + ')', names: R.maybe.map(r => [r.s.name, r.by.text]) });
  L.push({ id: "unknown", cls: unknownOut ? "" : "off", cb: '<input type="checkbox" data-line="unknown"' + (unknownOut ? " checked" : "") + ' aria-label="Take out suppliers we can’t tell about">', tx: '<span class="less">Less: </span>no contact ever recorded, so we can’t tell<small>' + (unknownOut ? 'Ticked: kept out of the answer, listed on the right. ' : 'Unticked: counted as not heard from. ') + E.esc(DATA.gapKeeper.name) + ' could add their contacts.</small>', by: "desk", amt: '(' + R.unknown.length + ')', names: R.unknown.map(r => [r.s.name, "supplier since " + E.dayShortY(r.s.since)]) });
  L.push({ cls: "total", cb: '', tx: 'Not heard from since ' + E.dayY(P.since), by: "", amt: '<span id="num" data-v="' + (prevTotal ?? total) + '">' + (prevTotal ?? total) + '</span>' });
  h += '<div class="body"><section class="ledger" aria-label="How the answer adds up"><div class="lh"><span></span><span>Line</span><span>Set by</span><span>' + E.esc(DATA.kind.many) + '</span></div><ol class="lines">';
  L.slice(0, shownLines).forEach((l, i) => {
    h += '<li class="ln ' + l.cls + '" style="animation-delay:calc(var(--motion-instant) * ' + (shownLines === 99 ? 0 : i) + ')"><span class="cb">' + l.cb + '</span><span class="tx">' + l.tx + (l.names && l.names.length ? '<span class="who"><button data-names="' + l.id + '">' + (openNames === l.id ? 'hide names' : 'who') + '</button></span>' : '') + '</span><span>' + (l.by ? UI.byChip(l.by, true) : '') + '</span><span class="amt">' + l.amt + '</span>' +
      (l.names ? '<span class="names' + (openNames === l.id ? ' open' : '') + '">' + l.names.map(n => '<span>' + E.esc(n[0]) + ' <i>· ' + E.esc(n[1]) + '</i></span>').join("") + '</span>' : '') + '</li>';
  });
  h += '</ol><div class="check"><span>Check: ' + R.visible + ' − ' + R.outStatus.length + ' − ' + R.heard.length + ' − ' + (trustGuess ? R.maybe.length : 0) + ' − ' + (unknownOut ? R.unknown.length : 0) + ' = <b>' + total + '</b></span><span>' + UI.gwChip(P.gateway) + '</span></div></section>';
  /* right: who the number is */
  const rows = R.answer.map(r => ({ r, cls: "" })).concat(trustGuess ? [] : R.maybe.map(r => ({ r, cls: "g" }))).concat(unknownOut ? [] : R.unknown.map(r => ({ r, cls: "u" })));
  h += '<aside class="side"><h2>The ' + total + '</h2><ul class="who-list">' + rows.map(({ r, cls }) => '<li class="' + cls + (joined.has(r.s.id) ? ' j' : '') + '"><span>' + E.esc(r.s.name) + '</span><span class="d">' + (cls === "g" ? I("bot", 12) + ' guess: ' + E.day(r.by.date) : cls === "u" ? 'no record' : r.last ? E.day(r.last.date) + ' ' + E.dayShortY(r.last.date).slice(-4) : '') + '</span>' + (r.doubt ? '<small>' + I("circle-help", 12) + ' ' + E.esc(r.doubt) + '</small>' : cls === "g" ? '<small>In the answer until the match is confirmed. ' + E.esc(r.by.text) + '</small>' : '') + '</li>').join("") + '</ul>';
  const less = R.answer.filter(r => r.sure === "less").length;
  h += '<div class="sure"><p><b>How sure.</b> ' + (R.answer.length - less) + ' rest on records alone' + (less ? ', ' + less + ' less so: a source they use had a gap' : '') + '.</p>' + (P.gateway && R.maybe.length ? '<p>' + I("bot", 12) + ' ' + R.maybe.length + ' depend on a model’s guess (dotted). ' + (trustGuess ? 'The answer trusts it; untick to see the answer without it.' : 'The answer doesn’t trust it.') + '</p>' : '') + (unknownOut && R.unknown.length ? '<p><span class="mk mk-gap"></span> ' + E.esc(E.list(R.unknown.map(r => r.s.name))) + ': not known yet.</p>' : '') + '</div></aside></div>';
  main.innerHTML = h;
  if (open) pop();
  E.hydrate(main);
  if (prevTotal != null && prevTotal !== total) { UI.roll(document.getElementById("num"), total); }
  prevTotal = total;
}
function pop() {
  const a = main.querySelector('.ledger [data-step="' + open + '"]') || main.querySelector('.said [data-step="' + open + '"]'); if (!a) return;
  a.setAttribute("aria-expanded", "true");
  const el = document.createElement("div"); el.className = "pop"; el.setAttribute("role", "menu"); el.innerHTML = UI.popHTML(open, P, totals(E.run(P)));
  main.appendChild(el); UI.place(el, a, main); E.hydrate(el);
}
function mark(fn) { const b = E.run(P), bt = totals(b), ids = new Set(listIds(b)); fn(); const a = E.run(P); joined = new Set(listIds(a).filter(x => !ids.has(x))); render(); }
function listIds(R) { return R.answer.map(r => r.s.id).concat(trustGuess ? [] : R.maybe.map(r => r.s.id)).concat(unknownOut ? [] : R.unknown.map(r => r.s.id)); }
main.addEventListener("click", e => {
  const o = e.target.closest(".opt"); if (o) { if (!o.disabled) { const st = o.dataset.step; if (st === "since") open = null; mark(() => UI.apply(P, st, o.dataset.v)); } return; }
  const w = e.target.closest("[data-step]"); if (w) { open = open === w.dataset.step ? null : w.dataset.step; render(); return; }
  const n = e.target.closest("[data-names]"); if (n) { openNames = openNames === n.dataset.names ? null : n.dataset.names; render(); return; }
  if (e.target.closest("#gw")) { mark(() => P.gateway = !P.gateway); return; }
  if (e.target.closest("#tb")) { document.body.classList.toggle("tech"); return; }
  if (!e.target.closest(".pop") && open) { open = null; render(); }
});
main.addEventListener("change", e => {
  const l = e.target.dataset.line; if (!l) return;
  mark(() => { if (l === "guess") trustGuess = e.target.checked; if (l === "unknown") unknownOut = e.target.checked; });
});
let runId = 0;
async function demo() {
  const me = ++runId; P = E.defaults(); open = null; openNames = null; trustGuess = true; unknownOut = true; joined = new Set(); prevTotal = null;
  shownLines = 0; render();
  await E.wait(E.ms("--motion-run")); if (me !== runId) return;
  for (let i = 1; i <= 8; i++) { shownLines = i; render(); await E.wait(E.ms("--motion-instant")); if (me !== runId) return; }
  shownLines = 99;
  await E.wait(E.ms("--motion-calm")); if (me !== runId) return;
  openNames = "guess"; mark(() => trustGuess = false);
}
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "r") demo();
  else if (k === "g") mark(() => P.gateway = !P.gateway);
  else if (k === "t") document.body.classList.toggle("tech");
  else if (/^[1-5]$/.test(k)) { open = E.steps[+k - 1].id; render(); const o = document.querySelector(".pop .opt:not([disabled])"); if (o) o.focus(); }
  else if (k === "escape") { open = null; render(); }
});
demo();
</script>
</body>
</html>
