<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workings · V4 · The line you move</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
/* ---- V4: every supplier is a row of contacts on a time line; "since" is a line you drag ---- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--measure-card) - var(--space-5));gap:var(--space-5);margin-top:var(--space-4)}
.chart{position:relative;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-card);padding:var(--space-3) var(--space-4) var(--space-2);backdrop-filter:blur(var(--surface-blur))}
.grid{display:grid;grid-template-columns:calc(var(--measure-rail) - var(--space-6)) minmax(0,1fr) calc(var(--space-8) + var(--space-3));column-gap:var(--space-3)}
.axis{position:relative;height:var(--space-6)}
.axis .t{position:absolute;bottom:0;transform:translateX(-50%);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap;padding-bottom:var(--space-1)}
.axis .t::after{content:"";position:absolute;left:50%;bottom:calc(var(--space-1) * -1);height:var(--space-1);border-left:1px solid var(--hairline-strong)}
.axis .opt2{position:absolute;bottom:0;width:var(--space-3);height:var(--space-4);margin-left:calc(var(--space-3) / -2);border-left:1px dashed var(--ink-muted);border-radius:0;transform:translateX(50%)}
.axis .opt2:hover,.axis .opt2.on{border-left-color:var(--x-proposed-lit)}
.hdr{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);align-self:end;padding-bottom:var(--space-1)}
.rows{position:relative;display:grid;grid-auto-rows:minmax(0,1fr);min-height:0}
.r{display:grid;grid-template-columns:subgrid;grid-column:1 / 4;align-items:center;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:1;min-height:0}
.r .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-muted);transition:color var(--motion-base) var(--ease-standard)}
.r .tr{position:relative;height:100%}
.r .fate{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:var(--space-1)}
.r.ans .nm{color:var(--light)}
.r.ans .fate{color:var(--x-proposed-lit)}
.r.ans{background:linear-gradient(90deg,var(--x-proposed-lit-wash),transparent 40%)}
.r.maybe .nm{background:var(--x-proposed-guess-dots);padding-bottom:3px;color:var(--ink)}
.r.out{opacity:var(--x-proposed-quiet)}
.r.out .fate{font-style:normal}
.r.unk .tr{background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-2);margin:3px 0;height:calc(100% - 6px)}
.r.unk .nm{color:var(--ink)}
.r.hid .tr{background:var(--x-proposed-unseen);margin:3px 0;height:calc(100% - 6px);border-radius:2px}
.r.less .fate{color:var(--warning)}
.r.joined .nm{animation:fresh var(--motion-calm) var(--ease-out)}
/* a contact on the line: solid for a record, dotted ring for a model's match, hollow for one that doesn't count */
.dot{position:absolute;top:50%;width:var(--space-2);height:var(--space-2);margin:calc(var(--space-1) * -1) 0 0 calc(var(--space-1) * -1);border-radius:50%;background:var(--ink);transition:left var(--motion-base) var(--ease-standard)}
.dot.g{background:var(--x-proposed-guess-wash);border:1.5px dotted var(--ink);width:calc(var(--space-2) + 4px);height:calc(var(--space-2) + 4px);margin:calc(var(--space-1) * -1 - 2px) 0 0 calc(var(--space-1) * -1 - 2px)}
.dot.x{background:transparent;border:1px solid var(--ink-muted)}
.dot.off{background:transparent;border:1px dashed var(--ink-muted);opacity:.6}
.r.ans .dot:not(.x):not(.off){background:var(--x-proposed-lit)}
.gapband{position:absolute;top:0;bottom:0;background:radial-gradient(circle at 50% 0,transparent 3px,color-mix(in srgb,var(--ink-muted) 40%,transparent) 3px 4px,transparent 4px) 0 0 / var(--space-2) 6px repeat-x,color-mix(in srgb,var(--ink-muted) 6%,transparent);pointer-events:none}
.gaplab{position:absolute;bottom:calc(100% + 2px);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap;transform:translateX(-10%)}
.since{position:absolute;top:calc(var(--space-6) * -1);bottom:0;width:var(--target-sm);margin-left:calc(var(--target-sm) / -2);cursor:ew-resize;z-index:2;touch-action:none}
.since::before{content:"";position:absolute;left:50%;top:var(--space-5);bottom:0;border-left:2px solid var(--x-proposed-lit);box-shadow:0 0 var(--glow-blur) var(--x-proposed-lit)}
.since .lab{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;font:400 var(--type-small)/1 var(--font-mono);color:var(--slate-deep);background:var(--x-proposed-lit);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key)}
.since:focus-visible{outline:none}
.since:focus-visible .lab{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.leftcount{position:absolute;top:var(--space-1);right:calc(100% + var(--space-3));text-align:right;white-space:nowrap;font-size:var(--type-small);color:var(--ink-muted);pointer-events:none}
.leftcount b{display:block;font:200 var(--type-title)/1 var(--font-sans);color:var(--light)}
.key4{display:flex;gap:var(--space-4);flex-wrap:wrap;padding-top:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.key4 span{display:inline-flex;gap:var(--space-2);align-items:center}
.key4 .dot{position:static;margin:0}

.ctl{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.card{padding:var(--space-3);border-radius:var(--radius-inset);background:var(--surface-inset);border:1px solid var(--hairline)}
.card h3{margin:0 0 var(--space-2);display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);font:400 var(--type-small)/var(--leading-small) var(--font-sans);color:var(--ink)}
.card.model{border-style:dotted;border-color:var(--x-proposed-guess-ink);background-image:var(--x-proposed-guess-wash)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);min-height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-2);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);font-size:var(--type-small);color:var(--ink-muted)}
.chip[aria-pressed="true"]{color:var(--light);background:var(--surface-raised);border-color:var(--ink-muted)}
.chip .pv{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.chip[disabled]{opacity:.5;cursor:help}
.chip.g{border-style:dotted}
.card p{margin:var(--space-2) 0 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.sum .n{font:200 var(--type-display)/1 var(--font-sans);color:var(--light)}
.sum .t{font-size:var(--type-meta);color:var(--ink)}
.techq{display:none;margin:var(--space-2) 0 0;padding:var(--space-2) var(--space-3);background:var(--surface-inset);border-radius:var(--radius-key);font:400 var(--x-proposed-type-micro)/1.55 var(--font-mono);color:var(--ink-muted);white-space:pre}
.tech .techq{display:block}
@media (max-height:840px){.said{font-size:var(--type-lead);line-height:var(--leading-lead)}.sum .n{font-size:var(--type-title)}}
@media (max-width:1400px){.body{grid-template-columns:minmax(0,1fr) calc(var(--measure-rail) + var(--space-5))}.grid{grid-template-columns:calc(var(--measure-rail) - var(--space-7)) minmax(0,1fr) calc(var(--space-8) - var(--space-2))}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="x-cap"><b>Workings · V4</b> the line you move: every contact on a time line, drag "since" · Shneiderman's dynamic queries, strip plots</div>
<script>
/*@JS*/
/* ================= V4 ================= */
let P = E.defaults(), prev = null, joined = new Set();
const T0 = "2025-08-01", T1 = DATA.today;
const app = document.getElementById("app");
app.innerHTML = UI.rail([["R", "replay"], ["← →", "move the line a day"], ["⇧ ← →", "a week"], ["1 2 3", "the dates asked back"], ["G", "model gateway on/off"], ["T", "technical words"]]) + '<main class="main" id="main"></main>';
const main = document.getElementById("main"), I = UI.I;
const span = E.d(T1) - E.d(T0);
const xp = s => Math.max(0, Math.min(100, (E.d(s) - E.d(T0)) / span * 100));
const iso = t => { const x = new Date(t); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
function shell() {
  main.innerHTML = '<div class="head"><div><p class="eyebrow">' + E.esc(DATA.app) + ' · Ask · answer with its workings</p><div class="asked">' + I("quote", 14) + '<q>' + E.esc(DATA.asked.words) + '</q></div><div class="said" id="said"></div></div>' +
    '<div class="toolbar"><button class="btn" id="gw">' + '</button><button class="btn" id="tb">' + I("code") + 'Technical</button><button class="btn">' + I("bookmark-plus") + 'Save question</button></div></div><div class="techq" id="techq"></div>' +
    '<div class="body"><section class="chart" aria-label="Every contact on a time line"><div class="grid"><span class="hdr">' + E.esc(DATA.kind.many) + '</span><div class="axis" id="axis"></div><span class="hdr">last that counts</span></div><div class="grid rows" id="rows"></div><div class="key4" id="foot"></div></section><aside class="ctl" id="ctl"></aside></div>';
}
function order(R) {
  const key = r => r.fate === "unknown" ? "0" : r.fate === "status" ? "9" + r.s.name : (r.last ? r.last.date : "1");
  const inScope = R.all.filter(r => r.fate !== "status").sort((a, b) => key(a).localeCompare(key(b)));
  return inScope.concat(R.all.filter(r => r.fate === "status"));
}
let rowOrder = null;
function render() {
  const R = E.run(P), n = R.answer.length;
  document.getElementById("said").innerHTML = E.sentence(P);
  document.getElementById("techq").textContent = E.tech(P);
  const gw = document.getElementById("gw"); gw.setAttribute("aria-pressed", P.gateway); gw.innerHTML = I(P.gateway ? "bot" : "power-off") + (P.gateway ? "Model on" : "Model off");
  /* axis: months, plus the three dates the desk asked back */
  let ax = "";
  for (let m = new Date(E.d(T0)); m <= E.d(T1); m.setMonth(m.getMonth() + 1)) { if (m.getMonth() % 2 === 0 || m.getMonth() === 0) ax += '<span class="t" style="left:' + xp(iso(m)) + '%">' + m.toLocaleString("en-GB", { month: "short" }) + (m.getMonth() === 0 ? " " + m.getFullYear() : "") + '</span>'; }
  DATA.since.options.forEach((o, i) => { ax += '<button class="opt2' + (P.since === o.v ? " on" : "") + '" data-since="' + o.v + '" style="left:' + xp(o.v) + '%;top:' + (i * 0) + 'px" title="' + E.esc(o.label + ': ' + o.why) + '" aria-label="' + E.esc(o.label) + '"></button>'; });
  document.getElementById("axis").innerHTML = ax;
  /* rows: keep order stable while dragging */
  const byId = Object.fromEntries(R.all.map(r => [r.s.id, r]));
  if (!rowOrder) rowOrder = order(R).map(r => r.s.id);
  const gap = DATA.sources.calls.gap;
  let h = '';
  rowOrder.forEach((id, i) => {
    const r = byId[id];
    const cls = { answer: "ans", maybe: "maybe", unknown: "unk", status: "out", heard: "" }[r.fate] + (r.sure === "less" ? " less" : "") + (joined.has(id) ? " joined" : "");
    let dots = "";
    for (const c of r.s.c) {
      const [kind, date, match, text] = c; const u = r.usable && r.usable.find(x => x.date === date && x.kind === kind);
      const ig = r.ignored && r.ignored.find(x => x.date === date && x.kind === kind);
      const k = E.K[kind], m = E.M[match];
      const cl = r.fate === "status" ? "x" : ig ? (ig.skip === "gateway" ? "off" : "x") : m.model ? "g" : "";
      dots += '<span class="dot ' + cl + '" style="left:' + xp(date) + '%" title="' + E.esc(E.cap(k.label) + ", " + E.dayShortY(date) + " · linked by " + m.label + (m.model ? " (a model’s guess)" : "") + (ig ? " · doesn’t count here" : "") + " · " + text) + '"></span>';
    }
    const fate = r.fate === "answer" ? (r.sure === "less" ? I("circle-help", 12) + ' less sure' : 'not heard from') : r.fate === "maybe" ? I("bot", 12) + ' guess: ' + E.day(r.by.date) : r.fate === "unknown" ? 'can’t tell' : r.fate === "status" ? E.ST[r.s.status].label + ', left out' : E.day(r.by.date) + ' ' + E.esc(E.K[r.by.kind].label);
    h += '<div class="r ' + cls + '" title="' + E.esc(r.doubt || r.why) + '"><span class="nm">' + E.esc(r.s.name) + '</span><span class="tr">' + (r.fate === "unknown" ? '' : dots) + (i === 0 ? '<span class="gapband" style="left:' + xp(gap[0]) + '%;width:' + (xp(gap[1]) - xp(gap[0])) + '%;height:' + (rowOrder.length + 1) + '00%"></span>' : '') + '</span><span class="fate">' + fate + '</span></div>';
  });
  h += '<div class="r hid"><span class="nm">' + E.cap(DATA.hidden.count) + ' on ' + E.esc(DATA.hidden.floor) + '</span><span class="tr" title="Not yours to see"></span><span class="fate">' + I("lock", 12) + ' ask ' + E.esc(DATA.hidden.ask) + '</span></div>';
  h += '<div class="since" id="since" role="slider" tabindex="0" aria-label="Since" aria-valuetext="' + E.dayY(P.since) + '" style="left:calc(' + xp(P.since) + '% * 1)"><span class="lab">since ' + E.dayShortY(P.since) + ' · ' + n + ' to the left</span></div>';
  const rows = document.getElementById("rows"); rows.innerHTML = h;
  /* the since line lives in the track column: position it over column 2 */
  const tr = rows.querySelector(".r .tr"), sl = document.getElementById("since");
  if (tr) { const rr = rows.getBoundingClientRect(), tb = tr.getBoundingClientRect(); sl.style.left = (tb.left - rr.left + tb.width * xp(P.since) / 100) + "px"; }
  document.getElementById("foot").innerHTML = '<span><span class="dot"></span>a contact in the record</span><span><span class="dot g"></span>linked only by a model’s guess</span><span><span class="dot x"></span>doesn’t count</span><span><span class="mk mk-norec"></span>no record kept (' + E.esc(DATA.sources.calls.name.toLowerCase()) + ', ' + E.day(gap[0]) + '–' + E.day(gap[1]) + ')</span><span><span class="mk mk-gap"></span>not known yet</span><span><span class="mk mk-unseen"></span>not yours to see</span>';
  /* controls: every step, each choice shows what it would do */
  const base = n;
  const chip = (step, o) => '<button class="chip' + (o.model ? " g" : "") + '" data-step="' + step + '" data-v="' + o.v + '" aria-pressed="' + !!o.on + '"' + (o.disabled ? ' disabled title="' + E.esc(o.why || o.sub || "") + '"' : '') + '>' + (o.icon ? I(o.icon, 12) : '') + E.esc(o.label.replace(/^By /, "").replace(/ contracts$/, "")) + (o.n != null && o.n !== base && !o.disabled ? '<span class="pv">' + (o.n > base ? "+" : "") + (o.n - base) + '</span>' : '') + '</button>';
  let c = '<div class="card sum"><span class="n">' + n + '</span> <span class="t">' + (n === 1 ? DATA.kind.one : DATA.kind.many) + ' not heard from</span><p>' + (R.maybe.length ? R.maybe.length + ' more if the model’s matches are wrong. ' : '') + (R.unknown.length ? R.unknown.length + ' can’t tell. ' : '') + R.answer.filter(r => r.sure === "less").length + ' less sure: the call log gap.</p></div>';
  c += '<div class="card"><h3>Since when ' + UI.byChip("you", true) + '</h3><div class="chips">' + UI.options("since", P).map(o => chip("since", o)).join("") + '</div><p>Or drag the line. “Since spring” was asked back; you chose.</p></div>';
  c += '<div class="card model"><h3>What counts as hearing from them ' + UI.byChip("model", true) + '</h3><div class="chips">' + UI.options("kinds", P).map(o => chip("kinds", o)).join("") + '</div><p>' + I("bot", 12) + ' A model read “' + E.esc(DATA.heard.said) + '” this way; you confirmed.</p></div>';
  c += '<div class="card"><h3>Linked to a supplier by ' + UI.byChip("desk", true) + '</h3><div class="chips">' + UI.options("match", P).map(o => chip("match", o)).join("") + '</div><p>' + (P.gateway ? 'Only “meaning” asks the model gateway; the rest work without it.' : I("power-off", 12) + ' The model gateway is off: meaning can’t be used. Admin turns it on.') + '</p></div>';
  c += '<div class="card"><h3>Contracts that count ' + UI.byChip("you", true) + '</h3><div class="chips">' + UI.options("status", P).map(o => chip("status", o)).join("") + '</div></div>';
  document.getElementById("ctl").innerHTML = c;
  E.hydrate(main);
}
function change(fn, keepOrder) { const b = E.run(P); fn(); const a = E.run(P); joined = new Set(E.diff(b, a).joined.map(x => x.s.id)); if (!keepOrder) rowOrder = null; render(); }
shell();
main.addEventListener("click", e => {
  const s = e.target.closest("[data-since]"); if (s) { change(() => P.since = s.dataset.since, true); return; }
  const c = e.target.closest(".chip"); if (c && !c.disabled) { change(() => UI.apply(P, c.dataset.step, c.dataset.v), c.dataset.step === "since"); return; }
  if (e.target.closest("#gw")) { change(() => P.gateway = !P.gateway); return; }
  if (e.target.closest("#tb")) { document.body.classList.toggle("tech"); return; }
});
/* dragging the line */
let drag = false;
function setFromX(clientX) {
  const tr = document.querySelector(".r .tr"); if (!tr) return; const b = tr.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (clientX - b.left) / b.width)); const v = iso(E.d(T0).getTime() + p * span);
  if (v !== P.since) change(() => P.since = v, true);
}
main.addEventListener("pointerdown", e => { if (e.target.closest("#since")) { drag = true; e.target.closest("#since").setPointerCapture(e.pointerId); runId++; } });
main.addEventListener("pointermove", e => { if (drag) setFromX(e.clientX); });
main.addEventListener("pointerup", () => { drag = false; });
function nudge(days) { const t = E.d(P.since).getTime() + days * 864e5; change(() => P.since = iso(Math.min(E.d(T1).getTime(), Math.max(E.d(T0).getTime(), t))), true); const s = document.getElementById("since"); if (s) s.focus(); }
let runId = 0;
async function demo() {
  const me = ++runId; P = E.defaults(); joined = new Set(); rowOrder = null; render();
  await E.wait(E.ms("--motion-run")); if (me !== runId) return;
  /* slide the line from 1 March to 1 April, a few days at a time */
  const from = E.d(P.since).getTime(), to = E.d(DATA.since.options[2].v).getTime(), steps = 10;
  for (let i = 1; i <= steps; i++) { if (me !== runId) return; change(() => P.since = iso(from + (to - from) * i / steps), true); await E.wait(E.ms("--motion-instant")); }
}
addEventListener("resize", render);
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "r") demo();
  else if (k === "g") change(() => P.gateway = !P.gateway);
  else if (k === "t") document.body.classList.toggle("tech");
  else if (k === "arrowleft" || k === "arrowright") { runId++; nudge((k === "arrowleft" ? -1 : 1) * (e.shiftKey ? 7 : 1)); e.preventDefault(); }
  else if (/^[1-3]$/.test(k)) { runId++; change(() => P.since = DATA.since.options[+k - 1].v, true); }
});
demo();
</script>
</body>
</html>
