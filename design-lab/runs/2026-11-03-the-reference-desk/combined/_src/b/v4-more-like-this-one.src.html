<style>

.st8.g .id{color:var(--x-proposed-pencil)}
.st8.g b{color:var(--x-proposed-pencil);font-weight:400}
.gapw{display:inline-block;background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-1);padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small)}
.far{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-2) 0 0 var(--space-3)}
.far b{font-weight:400;color:var(--ink)}
.bal{border-top:1px solid var(--hairline);padding-top:var(--space-2);margin-top:var(--space-2);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);display:flex;gap:var(--space-1) var(--space-3);flex-wrap:wrap}
.bal b{font-weight:400;color:var(--ink)}
.bal .ok{color:var(--x-proposed-lit)}

/* keep it: the example frozen as it was */
.keep{min-height:0;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:var(--space-3);background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4)}

.kl li > span:first-child{color:var(--ink-muted);padding-top:1px}

.frozen{border:1px solid color-mix(in srgb,var(--x-proposed-then) 50%,transparent);background:var(--x-proposed-then-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.frozen .eyebrow{color:var(--x-proposed-then)}
.saved{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-lit)}
.later{border-top:1px solid var(--hairline);padding-top:var(--space-3);display:grid;gap:var(--space-2)}
.later .what{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.later .what .rz{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:2px;padding:0 var(--space-1);color:var(--ink-muted);white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.way{display:grid;gap:var(--space-1);align-content:start;padding:var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.way[aria-pressed="true"]{border-color:var(--ink-muted);background:var(--surface-raised)}
.way.then[aria-pressed="true"]{border-color:color-mix(in srgb,var(--x-proposed-then) 60%,transparent);background:var(--x-proposed-then-wash)}
.way .h{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase}
.way.then .h{color:var(--x-proposed-then)}
.way .big{font:200 var(--type-heading)/1 var(--font-sans);color:var(--light)}
.way b{font-weight:400;color:var(--ink)}
.diff{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.diff .j{color:var(--x-proposed-lit)}
.diff .l{color:var(--ink);text-decoration:line-through;text-decoration-color:var(--ink-muted)}

  .q{font-size:var(--type-heading);line-height:var(--leading-heading);min-height:calc(var(--leading-heading) * 2)}
  .st8{font-size:var(--type-small);line-height:var(--leading-small)}
}

<body class="pre">
<div class="app">
  <div id="chrome"></div>
  <section class="sent dep" style="--i:0" id="sent"></section>
  <main class="main">
    <div class="grid">
      <section class="card dep" style="--i:1" aria-label="The example" id="card"></section>
      <section class="ans dep" style="--i:2" aria-label="The answer"><div class="rows" id="rows"></div><div class="bal" id="bal"></div></section>
      <aside class="keep dep" style="--i:3" aria-label="Keep this question" id="keep"></aside>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="x-cap"><b>Reference desk · Combined V4</b> more like this one: pin what matters, the answer returns in the sentence, kept as it was · QBE, HomeFinder, keys</div>
<script>
/*@DATA@*/
/*@COMMON_JS@*/
const Q = DATA.q2;
const ME = P(DATA.me);
const C = Q.contracts;
const byId = id => C.find(c => c.id === id);
const EX0 = byId(Q.example);                       // the example as it was when asked
const EXNOW = Object.assign({}, EX0, { ends: Q.later.ends });   // and as it is a week later
const CX = byId(Q.counter);
const TODAY = DATA.today;
const yr = iso => iso ? +iso.slice(0, 4) : null;
const money = v => '£' + v + 'k';
const longDay = iso => day(iso) + (yr(iso) === 2026 ? ' 2026' : '');
const DET = Q.details;
const ORDER = ['svc', 'sub', 'area', 'ends', 'value', 'sup', 'words'];

/* pin options for each detail; each choice is a rule Data Atlas runs (no model), except "alike by meaning" */
const yearWord = ex => yr(ex.ends) === yr(TODAY) ? 'this year' : yr(ex.ends) === yr(TODAY) + 1 ? 'next year' : 'in ' + yr(ex.ends);
const OPTS = {
  svc:   [{ id: 'same', say: ex => ex.svc, t: (c, ex) => c.svc === ex.svc }, { id: 'any', say: () => 'any work', t: () => true }],
  sub:   [{ id: 'same', say: ex => ex.sub + ' waste', t: (c, ex) => c.sub === ex.sub }, { id: 'any', say: () => 'any kind', t: () => true }],
  area:  [{ id: 'same', say: ex => 'the ' + ex.area, t: (c, ex) => c.area === ex.area }, { id: 'any', say: () => 'anywhere', t: () => true }],
  ends:  [{ id: 'same', say: ex => 'on ' + day(ex.ends), t: (c, ex) => c.ends == null ? null : c.ends === ex.ends },
          { id: 'year', say: ex => yearWord(ex), t: (c, ex) => c.ends == null ? null : (yr(c.ends) === yr(ex.ends) && c.ends >= TODAY) },
          { id: 'any', say: () => 'any time', t: () => true }],
  value: [{ id: 'same', say: ex => money(ex.value), t: (c, ex) => c.value === ex.value }, { id: 'near', say: ex => 'about ' + money(ex.value), t: (c, ex) => c.value >= ex.value / 2 && c.value <= ex.value * 2 }, { id: 'any', say: () => 'any amount', t: () => true }],
  sup:   [{ id: 'same', say: ex => ex.sup, t: (c, ex) => c.sup === ex.sup }, { id: 'any', say: () => 'any supplier', t: () => true }],
  words: [{ id: 'meaning', say: () => 'alike by meaning', model: true, t: () => true }, { id: 'any', say: () => 'not used', t: () => true }],
};
const opt = (k, id) => OPTS[k].find(o => o.id === id);

let PINS, COUNTER, SAVED, LATER, USE_NOW;
function reset() {
  PINS = { svc: 'any', sub: 'any', area: 'any', ends: 'any', value: 'any', sup: 'any', words: 'any' };
  COUNTER = false; SAVED = false; LATER = false; USE_NOW = false;
}
const anyPinned = () => ORDER.some(k => PINS[k] !== 'any');

/* judge one contract against the example: in / cant / aside / out, and which pinned details differ */
function judge(c, ex, pins) {
  const diffs = []; let unk = false;
  for (const k of ORDER) {
    if (k === 'words' || pins[k] === 'any') continue;
    const r = opt(k, pins[k]).t(c, ex);
    if (r === null) unk = true; else if (!r) diffs.push(k);
  }
  if (COUNTER && c.id !== CX.id && c.sub && c.sub === CX.sub && !diffs.length) return { j: 'aside', diffs };
  if (COUNTER && c.id === CX.id) return { j: 'aside', diffs };
  if (diffs.length) return { j: 'out', diffs };
  return { j: unk ? 'cant' : 'in', diffs };
}
function answer(ex, pins) {
  const res = C.filter(c => c.id !== ex.id).map(c => Object.assign({ c }, judge(c, ex, pins)));
  const g = j => res.filter(r => r.j === j);
  const near = g('out').filter(r => r.diffs.length === 1), far = g('out').filter(r => r.diffs.length > 1);
  // the model's lane: alike by meaning, passing every pinned rule except "what it's for". Never counted.
  const pencil = pins.words === 'meaning' && GW ? res.filter(r => r.c.meaning >= .7 && r.diffs.length === 1 && r.diffs[0] === 'svc') : [];
  return { all: res, in: g('in'), cant: g('cant'), aside: g('aside'), near, far, pencil };
}
const countIf = (k, id) => { const p = Object.assign({}, PINS, { [k]: id }); return answer(EX0, p).in.length; };

/* ---------- the sentence (built from the pins by one template, never by the model) ---------- */
function clauses(ex, pins) {
  const out = [];
  const svc = pins.svc === 'same' ? (pins.sub === 'same' ? ex.sub + ' ' + ex.svc : ex.svc) : (pins.sub === 'same' ? ex.sub + ' waste' : null);
  if (svc) out.push(`<span class="w pw">${esc(svc)}</span>`);
  if (pins.area === 'same') out.push(`in <span class="w pw">the ${esc(ex.area)}</span>`);
  if (pins.ends !== 'any') out.push(`ending <span class="w pw">${esc(opt('ends', pins.ends).say(ex))}</span>`);
  if (pins.value !== 'any') out.push(`worth <span class="w pw">${esc(opt('value', pins.value).say(ex))}</span>`);
  if (pins.sup === 'same') out.push(`with <span class="w pw">${esc(ex.sup)}</span>`);
  return out;
}
function sentence(ex, pins, n) {
  if (!anyPinned()) {
    // nothing pinned yet: the record's own sentence, every word a pin
    const w = (k, s) => `<button class="w" data-pinword="${k}">${esc(s)}</button>`;
    return `<span class="ex">${esc(ex.id)}</span> is a ${w('sub', ex.sub)} ${w('svc', ex.svc)} contract with ${w('sup', ex.sup)} in ${w('area', 'the ' + ex.area)}, worth ${w('value', money(ex.value) + ' a year')}, ending ${w('ends', longDay(ex.ends))}.`;
  }
  const cl = clauses(ex, pins);
  let s = `<span class="n" id="cnt">${n}</span> more ${n === 1 ? Q.kind.one : Q.kind.many} like ${esc(ex.id)}${cl.length ? ': ' + cl.join(', ') : ''}`;
  if (COUNTER) s += `, but not <span class="w not">${esc(CX.sub)}</span> like ${esc(CX.id)}`;
  if (pins.words === 'meaning' && GW) s += `<span class="pencil-only">, <span class="pc">and alike in their own words</span></span>`;
  return s + '.';
}
function techLine(ex, pins) {
  const w = [];
  if (pins.svc === 'same') w.push(`${DET.svc.tech} = ${ex.svc}`);
  if (pins.sub === 'same') w.push(`${DET.sub.tech} = ${ex.sub}`);
  if (pins.area === 'same') w.push(`${DET.area.tech.split(' ')[0]} = ${ex.area}`);
  if (pins.ends === 'same') w.push(`${DET.ends.tech} = ${ex.ends}`);
  if (pins.ends === 'year') w.push(`year(${DET.ends.tech}) = ${yr(ex.ends)} AND ${DET.ends.tech} ≥ ${TODAY}`);
  if (pins.value === 'near') w.push(`${DET.value.tech.split(' ')[0]} BETWEEN ${ex.value / 2}k AND ${ex.value * 2}k`);
  if (pins.value === 'same') w.push(`${DET.value.tech.split(' ')[0]} = ${ex.value}k`);
  if (pins.sup === 'same') w.push(`${DET.sup.tech.split(' ')[0]} = "${ex.sup}"`);
  if (COUNTER) w.push(`${DET.sub.tech} ≠ ${CX.sub}`);
  return `${Q.kind.tech} WHERE ${w.join(' AND ') || 'true'} · example ${ex.id} frozen at ${TODAY}T10:42${pins.words === 'meaning' && GW ? ' · model lane: cosine(rdfs:comment) ≥ .7, not counted' : ''}`;
}
function drawSentence() {
  const ex = LATER && USE_NOW ? EXNOW : EX0;
  const A = answer(ex, PINS);
  const loose = anyPinned() ? ORDER.filter(k => k !== 'words' && PINS[k] === 'any' && !(k === 'sub' && PINS.svc === 'any')).map(k => `<span class="lw">${esc(opt(k, 'any').say(ex))}</span>`) : [];
  $('#sent').innerHTML = `<div class="sl">
    <p class="eyebrow">${esc(ME.n)} · ask by example · from contract ${esc(ex.id)} · ${anyPinned() ? 'pin what matters; the rest loosens' : 'the record’s own sentence: pin the words that matter'}</p>
    <h1 class="q fresh">${sentence(ex, PINS, A.in.length)}</h1>
    ${loose.length ? `<p class="loose"><span>Loosened:</span>${loose.join('<span>·</span>')}${A.cant.length ? `<span>· ${A.cant.length} can’t tell</span>` : ''}</p>` : '<p class="loose"><span>Nothing pinned yet. Every detail is the example’s own.</span></p>'}
    <p class="tk">${esc(techLine(ex, PINS))}</p></div>${unlikeHtml()}`;
  $$('#sent [data-unlike]').forEach(b => b.addEventListener('click', counter));
  Icons.hydrate($('#sent'));
  $$('[data-pinword]').forEach(b => b.addEventListener('click', () => pin(b.dataset.pinword, b.dataset.pinword === 'ends' ? 'year' : 'same')));
}

/* ---------- the card: the example, every detail with a pin, and "not like that one" ---------- */
function drawCard() {
  const ex = EX0;
  const val = { svc: ex.svc, sub: ex.sub, area: ex.area, ends: longDay(ex.ends), value: money(ex.value) + ' a year', sup: ex.sup, words: '“' + ex.words + '”' };
  const rows = ORDER.map(k => {
    const os = OPTS[k].map(o => {
      if (o.model) {
        const dis = !GW;
        return `<button class="pin pg" data-k="${k}" data-o="${o.id}" aria-pressed="${PINS[k] === o.id}" ${dis ? 'disabled title="' + esc(DATA.gateway.offWhy) + '"' : ''}>${ic(dis ? 'circle-slash' : 'pencil-line', 11)}${esc(o.say(ex))}${dis ? '' : ' <span class="c">guess</span>'}</button>`;
      }
      return `<button class="pin" data-k="${k}" data-o="${o.id}" aria-pressed="${PINS[k] === o.id}">${o.id === 'any' ? 'any' : o.id === 'same' ? (k === 'ends' ? 'same day' : 'same') : o.id === 'year' ? 'same year' : 'about this'} <span class="c">${countIf(k, o.id)}</span></button>`;
    }).join('');
    const off = k === 'words' && !GW;
    return `<div class="dt"><div class="lb"><span>${esc(DET[k].label)}</span><span class="tk">${esc(DET[k].tech)}</span></div>
      <div class="vr"><div class="v${k === 'words' ? ' pcv' : ''}">${esc(val[k])}</div>
      <div class="pins">${os}</div></div>
      ${off ? `<div class="why">Alike by meaning needs the model gateway. ${esc(P(DATA.gateway.admin).n)} can turn it on. Every other pin works without it.</div>` : ''}</div>`;
  }).join('');
  $('#card').innerHTML = `
    <div class="excard"><p class="eyebrow">the example · ${esc(Q.kind.one)}</p><h2>${esc(EX0.id)}<small>kept by ${esc(P(EX0.keeper).n)}</small></h2>${rows}</div>`;
  $$('#card .pin').forEach(b => b.addEventListener('click', () => pin(b.dataset.k, b.dataset.o)));
  Icons.hydrate($('#card'));
}

function unlikeHtml() {
  const apart = `<div class="apart">
      <div><span>kind of waste: <span class="u">${esc(EX0.sub)}</span> · ${esc(CX.sub)}</span><span class="ichip">tells them apart</span></div>
      <div><span>worth: ${money(EX0.value)} · ${money(CX.value)}</span><span class="ichip">too close</span></div>
      <div class="pencil-only"><span class="pencil">their words read differently</span><span class="pchip">${ic('pencil-line', 10)}model</span></div></div>`;
  return `<button class="unlike${COUNTER ? ' on' : ''}" data-unlike aria-pressed="${COUNTER}">
      <p class="eyebrow">not like that one</p>
      ${COUNTER ? `<div class="cx">${ic('ban', 13)} ${esc(CX.id)} · ${esc(CX.sup)} · ${esc(CX.sub)} waste</div><div>Your pins can’t tell it from ${esc(EX0.id)}. The record can:</div>${apart}`
        : `<div>Point at a ${esc(Q.kind.one)} it should <b>not</b> be like; the desk finds what tells them apart. <span class="kbd">N</span></div>`}
    </button>`;
}

/* ---------- the answer, in the same sentence ---------- */
function rowSentence(c, ex, diffs) {
  const d = (k, html) => diffs.includes(k) ? `<span class="df">${html}</span>` : (PINS[k] !== 'any' ? `<b>${html}</b>` : html);
  const ends = c.ends ? (c.ends < TODAY ? 'ended ' + day(c.ends) : 'ending ' + longDay(c.ends)) : `ending <span class="gapw" title="Not known yet. ${esc(P(c.keeper).n)} could fill it.">not known yet · ${esc(P(c.keeper).n)}</span>`;
  const kind = c.svc === 'waste' ? (c.sub + ' waste') : c.svc;
  return `<span class="id">${esc(c.id)}</span>${d('svc', esc(kind))}, ${d('area', 'in the ' + esc(c.area))}, ${d('ends', ends)} · ${d('sup', 'with ' + esc(c.sup))}, ${d('value', money(c.value))}` +
    (diffs.length ? `<span class="dfw">differs in ${diffs.map(k => DET[k].label).join(' and ')}</span>` : '');
}
function drawAnswer() {
  const ex = LATER && USE_NOW ? EXNOW : EX0;
  if (!anyPinned()) {
    $('#rows').innerHTML = `<div class="hint0">This is ${esc(ex.id)} as the record says it. <b>Pin the details that matter</b> on the card, or click a word in the sentence. Each pin shows how many ${esc(Q.kind.many)} it would leave before you choose it. Nothing here needs the model.</div>`;
    $('#bal').innerHTML = `<span>${C.length} ${esc(Q.kind.many)} you can see · some on ${esc(F(Q.hiddenSome.floor).n)}</span>`;
    return;
  }
  const A = answer(ex, PINS);
  const grp = (h, n, list, cls) => list.length ? `<div class="gh"><b>${n}</b>${h}</div>` + list.map(r => `<div class="st8 ${cls}">${rowSentence(r.c, ex, r.diffs)}</div>`).join('') : '';
  let html = `<div class="gh">the example</div><div class="st8 me">${rowSentence(ex, ex, [])}</div>`;
  html += grp('alike in every pinned way', A.in.length, A.in, 'in');
  html += grp('can’t tell', A.cant.length, A.cant, 'unk');
  if (A.pencil.length) html += `<div class="pencil-only"><div class="gh" style="color:var(--x-proposed-pencil)"><span class="pchip">${ic('pencil-line', 10)}the model’s lane</span> alike by meaning · a guess, not counted, not saved</div>` +
    A.pencil.map(r => `<div class="st8 g">${rowSentence(r.c, ex, r.diffs)} <span class="dfw">“${esc(r.c.words)}”</span></div>`).join('') +
    `<p class="far">The record puts them under “differ in one way”: not ${esc(EX0.svc)}. If one should be, <b>propose it to Triage</b>; only then is it a fact, marked as the model’s proposal.</p></div>`;
  html += grp('set aside by your counter-example', A.aside.length, A.aside, 'aside');
  html += grp('differ in one way', A.near.length, A.near, 'out');
  if (A.far.length) html += `<p class="far"><b>${A.far.length}</b> differ in two or more ways: ${A.far.slice(0, 6).map(r => esc(r.c.id)).join(', ')}${A.far.length > 6 ? '…' : ''}</p>`;
  $('#rows').innerHTML = html;
  const tot = 1 + A.in.length + A.cant.length + A.aside.length + A.near.length + A.far.length;
  $('#bal').innerHTML = `<span>1 example + <b>${A.in.length}</b> alike + <b>${A.cant.length}</b> can’t tell${COUNTER ? ` + <b>${A.aside.length}</b> set aside` : ''} + <b>${A.near.length}</b> one way + <b>${A.far.length}</b> more</span><span class="ok">= ${tot} of ${C.length} ✓</span><span>some on ${esc(F(Q.hiddenSome.floor).n)}: ask ${esc(P(Q.hiddenSome.ask).n)}</span>${A.pencil.length ? `<span class="pencil-only pencil">+ ${A.pencil.length} guesses, outside the sum</span>` : ''}`;
  Icons.hydrate($('#rows'));
}

/* ---------- keep it ---------- */
function drawKeep() {
  const A0 = answer(EX0, PINS), An = answer(EXNOW, PINS);
  const ids = a => a.in.map(r => r.c.id);
  const was = ids(A0), now = ids(An);
  const joins = now.filter(x => !was.includes(x)), leaves = was.filter(x => !now.includes(x));
  const frozen = `${esc(EX0.sub)} ${esc(EX0.svc)} · the ${esc(EX0.area)} · ends ${longDay(EX0.ends)} · ${money(EX0.value)} · ${esc(EX0.sup)}`;
  const meaning = PINS.words === 'meaning';
  $('#keep').innerHTML = `
    <h2>${ic('bookmark', 16)}Keep this question</h2>
    <div class="frozen"><p class="eyebrow">the example, frozen as it was · ${esc(DATA.askedAt)}</p>${esc(EX0.id)}: ${frozen}${COUNTER ? `<br>not like ${esc(CX.id)} as it was: ${esc(CX.sub)}` : ''}</div>
    <ul class="kl">
      <li><span>${ic('quote', 12)}</span><span><b>the sentence</b>, as pinned${PINS.ends === 'year' ? `; “this year” fixed as ${yr(EX0.ends)}` : ''}</span></li>
      <li><span>${ic('pin', 12)}</span><span><b>the pins</b>, each a rule Data Atlas runs</span></li>
      <li><span>${ic('clock', 12)}</span><span><b>when asked</b> and <b>whose access</b>: ${esc(ME.n)}’s. Each reader reruns with their own.</span></li>
      ${meaning ? `<li class="pencil-only"><span style="color:var(--x-proposed-pencil)">${ic('pencil-off', 12)}</span><span class="pencil" style="text-decoration:none">alike by meaning: not kept. A rerun never calls the model.</span></li>` : ''}
      <li class="no"><span>${ic('x', 12)}</span><span><b>the rows</b>: never kept, never shared</span></li>
    </ul>
    ${SAVED ? `<p class="saved">${ic('check', 12)}saved as ${esc(Q.id)} · ${esc(DATA.askedAt)}</p>` : `<button class="btn primary" id="save" ${anyPinned() ? '' : 'disabled'}>${ic('bookmark', 14)}Save the question <span class="kbd">S</span></button>`}
    ${LATER ? `<div class="later">
      <p class="eyebrow">${esc(Q.later.day)} · you open ${esc(Q.id)}</p>
      <p class="what">${esc(EX0.id)} has changed since you asked: ${esc(Q.later.what)} (${esc(P(Q.later.who).n)}). <span class="rz">${esc(DATA.reasons5[Q.later.reason])}</span></p>
      <div class="two">
        <button class="way then" data-way="then" aria-pressed="${!USE_NOW}"><span class="h">as it was · kept</span><span class="big">${was.length}</span><span>ending <b>${esc(yearWord(EX0))}</b> (${yr(EX0.ends)})</span><span>${was.map(esc).join(', ')}</span></button>
        <button class="way" data-way="now" aria-pressed="${USE_NOW}"><span class="h">as it is now</span><span class="big">${now.length}</span><span>ending <b>${esc(yearWord(EXNOW))}</b> (${yr(EXNOW.ends)})</span><span>${now.map(esc).join(', ')}</span></button>
      </div>
      <p class="diff">${was.length === now.length ? '<b>Same count, different rows.</b> ' : ''}${leaves.map(x => `<span class="l">${esc(x)}</span>`).join(', ')} ${leaves.length ? 'would leave' : ''}${joins.length ? '; ' + joins.map(x => `<span class="j">${esc(x)}</span>`).join(', ') + ' would join' : ''}. The kept question stays as it was unless you choose. <span class="kbd">N</span> as it is now · <span class="kbd">B</span> as it was</p>
    </div>` : (SAVED ? `<p class="why">A week later, press <span class="kbd">W</span>.</p>` : '')}`;
  const s = $('#save'); if (s) s.addEventListener('click', save);
  $$('[data-way]').forEach(b => b.addEventListener('click', () => { USE_NOW = b.dataset.way === 'now'; drawAll(); }));
  Icons.hydrate($('#keep'));
}

function drawAll() { drawSentence(); drawCard(); drawAnswer(); drawKeep(); }
function pin(k, o) {
  if (OPTS[k].find(x => x.id === o && x.model) && !GW) return;
  PINS[k] = PINS[k] === o && o !== 'any' ? 'any' : o;
  drawAll();
}
function counter() { COUNTER = !COUNTER; drawAll(); }
function save() { if (!anyPinned()) return; SAVED = true; drawAll(); }
function weekLater() { if (!SAVED) save(); LATER = true; drawAll(); }

function chrome() {
  $('#chrome').innerHTML = topBand(`Contracts · <b>${esc(EX0.id)}</b> · More like this one`);
  $('#foot').innerHTML = hints([['1–7', 'pin a detail'], ['N', 'not like that one'], ['S', 'save'], ['W', 'a week later'], ['G', 'model gateway'], ['T', 'technical words'], ['R', 'replay']]);
}
function demo() {
  clearTimers(); reset(); document.body.classList.add('pre'); drawAll();
  const c = MS('--motion-calm'), t0 = 1200;
  later(() => document.body.classList.remove('pre'), t0);
  later(() => pin('svc', 'same'), t0 + c);
  later(() => pin('area', 'same'), t0 + c * 2);
  later(() => pin('ends', 'year'), t0 + c * 3);
  later(() => counter(), t0 + c * 4);
  later(() => pin('words', 'meaning'), t0 + c * 5);
  later(() => save(), t0 + c * 6);
  later(() => weekLater(), t0 + c * 7);
}
chrome();
gwHooks.push(() => { if (PINS) drawAll(); });
reset();
wireCommon(demo, (k) => {
  const n = +k; if (n >= 1 && n <= 7) { const key = ORDER[n - 1]; const os = OPTS[key]; const i = os.findIndex(o => o.id === PINS[key]); pin(key, os[(i + 1) % os.length].id); }
  if (k === 'n') { if (LATER) { USE_NOW = true; drawAll(); } else counter(); }
  if (k === 'b' && LATER) { USE_NOW = false; drawAll(); }
  if (k === 's') save();
  if (k === 'w') weekLater();
});
demo();
</script>
</body>
</html>
