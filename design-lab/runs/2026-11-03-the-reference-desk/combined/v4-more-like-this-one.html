<style>
/* ---------------------------------------------------------------
   Proposed tokens (all mixes of kit tokens; listed under "needs token" in notes)
   --------------------------------------------------------------- */
:root{
  /* pencil: anything the model gateway proposes. Graphite with a little info-blue; dotted, italic, its own lane. */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, var(--info));
  --x-proposed-pencil-wash: color-mix(in srgb, var(--info) 6%, transparent);
  /* six ways to be empty (from the catalogue run) */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 80%, transparent);
  --x-proposed-gap-tick: var(--space-2);
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 40%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-quiet: .62;
  /* the floor you are on (Department here) */
  --x-proposed-here: var(--floor-department-high);
  --x-proposed-here-wash: color-mix(in srgb, var(--floor-department-high) 10%, transparent);
  /* lit: what just changed, or what is kept */
  --x-proposed-lit: var(--green);
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 12%, transparent);
  /* the example record: the light language's beacon */
  --x-proposed-beacon: var(--light);
  --x-proposed-beacon-glow: color-mix(in srgb, var(--light) 30%, transparent);
  /* sepia: "as it was" (from the saved surface) */
  --x-proposed-then: color-mix(in srgb, var(--warning) 55%, var(--ink-muted));
  --x-proposed-then-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  --x-proposed-type-micro: .6875rem;
}
:root, .mk-gap, .gapbox, .c-gap{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.lt{color:var(--light)}
.small{font-size:var(--type-small);line-height:var(--leading-small)}
.meta{font-size:var(--type-meta);line-height:var(--leading-meta)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* ---------- chrome ---------- */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:0 var(--edge)}
.top{display:flex;align-items:center;gap:var(--space-3);height:var(--target-md);border-bottom:1px solid var(--hairline)}

.floorchip{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.floorchip .fl{display:inline-block;width:var(--space-4);height:2px;background:var(--x-proposed-here)}
.floorchip b{font-weight:400;color:var(--ink)}
.crumb{font-size:var(--type-small);color:var(--ink-muted)}
.crumb b{font-weight:400;color:var(--ink)}
.top .sp{flex:1}
.chipbtn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink-muted)}
.chipbtn[aria-pressed="true"]{color:var(--light);border-color:var(--ink-muted);background:var(--surface-raised)}

.qhead{padding:var(--space-3) 0;border-bottom:1px solid var(--hairline);display:grid;gap:var(--space-1)}

.readas{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-1) var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.readas b{font-weight:400;color:var(--ink)}
.main{min-height:0;padding:var(--space-4) 0 var(--space-2)}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:var(--space-4);min-height:calc(var(--space-6) + var(--space-3));padding-left:calc(var(--measure-glance) + var(--space-5))}
.hints{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}

/* two registers: the technical word one step down */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:.8}
.tech .tk{display:block}
.tech span.tk{display:inline;margin-left:var(--space-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-muted);color:var(--light)}
.btn.primary{border-color:color-mix(in srgb,var(--x-proposed-here) 60%,transparent);background:var(--x-proposed-here-wash);color:var(--light)}
.btn[disabled]{opacity:var(--x-proposed-quiet);cursor:not-allowed}

/* ---------- ink and pencil ---------- */
/* ink: from the record, upright, solid. pencil: the model gateway's, dotted and italic, never counted. */
.pencil{color:var(--x-proposed-pencil);font-style:italic;text-decoration:underline dotted var(--x-proposed-pencil);text-underline-offset:var(--focus-gap);text-decoration-thickness:1px}
.pchip{display:inline-flex;align-items:center;gap:var(--space-1);font:italic 400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-pencil);border:1px dotted var(--x-proposed-pencil);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.ichip{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink-muted);border:1px solid var(--hairline-strong);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.pbox{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key)}
.plane{border-left:1px dotted var(--x-proposed-pencil);padding-left:var(--space-3)}
/* provenance never washes out: an agreed guess keeps a dotted top edge and says who proposed it */
.prov{font:italic 400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--x-proposed-pencil)}
/* G off: pencil goes; nothing else moves */
.gwoff .pencil-only{display:none!important}
.gw-off-only{display:none}
.gwoff .gw-off-only{display:revert}

/* ---------- six ways to be empty ---------- */
.mk{display:inline-block;vertical-align:middle;flex:none}
.mk-gap{background:var(--x-proposed-gap);width:var(--space-4);height:var(--space-3);--x-proposed-gap-tick:var(--space-1)}
.gapbox{background:var(--x-proposed-gap)}
.mk-none{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink);border-bottom:1px solid var(--ink-muted);padding:0 1px}
.mk-na{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.mk-stale{background:var(--x-proposed-stale);width:var(--space-4);height:var(--space-3);border-radius:2px}
.mk-break{width:var(--space-4);height:var(--space-3)}
.mk-break path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.mk-unseen{display:inline-flex;align-items:center;justify-content:center;width:var(--space-4);height:var(--space-3);background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:2px;color:var(--ink-muted)}
.mk-ok{width:var(--space-4);height:var(--space-3);background:var(--ink);border-radius:2px;opacity:.8}
.mk-noplace{width:var(--space-4);height:var(--space-3);background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-1);border:1px dashed var(--hairline-strong);border-radius:2px}
.unseen{display:inline-flex;align-items:center;gap:var(--space-2);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.unseen b{font-weight:400;color:var(--ink)}
.some{font-family:var(--font-mono);font-size:var(--x-proposed-type-micro);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink-muted)}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}
.x-cap{max-width:calc(var(--measure-glance) + var(--space-4))}

.app{grid-template-rows:auto auto minmax(0,1fr) auto}
/* the sentence: the record's own, loosening into a question; the count sits inside it */
.sent{padding:var(--space-4) 0 var(--space-3);border-bottom:1px solid var(--hairline);display:grid;grid-template-columns:minmax(0,1fr) clamp(calc(var(--measure-rail) + var(--space-6)), 23vw, calc(var(--measure-drawer) + var(--space-6)));gap:var(--space-5);align-items:start}
.sl{display:grid;gap:var(--space-2);min-width:0}
.q{font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);color:var(--ink-muted);letter-spacing:var(--tracking-tight);max-width:calc(var(--measure-wide) + var(--space-8) + var(--space-7));min-height:calc(var(--leading-title-s) * 2)}
.q .n{color:var(--light);font-variant-numeric:tabular-nums;font-weight:300}
.q .w{color:var(--light);border-bottom:2px solid var(--x-proposed-beacon-glow);padding:0 2px;transition:color var(--motion-base) var(--ease-standard),border-color var(--motion-base) var(--ease-standard)}
.q .w.pw{border-bottom-color:var(--x-proposed-here)}
.q button.w:hover{background:var(--surface-raised)}
.q .w.not{color:var(--light);border-bottom:2px solid var(--danger)}
.q .pc{color:var(--x-proposed-pencil);font-style:italic;border-bottom:2px dotted var(--x-proposed-pencil)}
.q .ex{color:var(--light)}
.loose{display:flex;gap:var(--space-1) var(--space-2);flex-wrap:wrap;align-items:baseline;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.loose .lw{color:var(--x-proposed-here);border-bottom:1px dashed var(--x-proposed-here)}
.sent .tk{font-size:var(--type-small)}
.fresh{animation:fresh var(--motion-calm) var(--ease-out)}
@keyframes fresh{from{opacity:.25}}

.grid{height:100%;display:grid;grid-template-columns:clamp(calc(var(--measure-rail) + var(--space-6)), 22vw, calc(var(--measure-drawer) + var(--space-5))) minmax(0,1fr) clamp(calc(var(--measure-rail) + var(--space-6)), 23vw, calc(var(--measure-drawer) + var(--space-6)));gap:var(--space-5);min-height:0}
.colh{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0 0 var(--space-2)}

/* the example card: every detail, with a pin */
.card{min-height:0;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:var(--space-3)}
.excard{border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);box-shadow:0 0 var(--space-5) color-mix(in srgb,var(--x-proposed-beacon) 6%,transparent);padding:var(--space-3)}
.excard h2{font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light);margin:var(--space-1) 0 var(--space-2)}
.excard h2 small{font-size:var(--type-small);color:var(--ink-muted);font-weight:400;margin-left:var(--space-2)}
.dt{display:grid;gap:2px;padding:var(--space-1) 0 var(--space-2);border-top:1px solid var(--hairline)}
.dt .vr{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
.dt .lb{display:flex;justify-content:space-between;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

.pin .c{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.pin:hover{color:var(--ink);border-color:var(--ink-muted)}
.pin[aria-pressed="true"]{color:var(--light);border-color:var(--x-proposed-here);background:var(--x-proposed-here-wash)}

.pin.pg{border-style:dotted;border-color:var(--x-proposed-pencil);color:var(--x-proposed-pencil);font-style:italic}
.pin.pg[aria-pressed="true"]{background:var(--x-proposed-pencil-wash);color:var(--x-proposed-pencil)}

.unlike.on{border-style:solid;border-color:color-mix(in srgb,var(--danger) 45%,transparent)}

.apart{display:grid;gap:2px}
.apart div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2)}
.apart .u{color:var(--light)}

/* the answer: in the same sentence */
.ans{min-height:0;display:flex;flex-direction:column}
.rows{min-height:0;overflow:auto;scrollbar-width:thin;flex:1}
.gh{display:flex;align-items:baseline;gap:var(--space-2);margin:var(--space-3) 0 var(--space-1);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.gh:first-child{margin-top:0}
.gh b{font-weight:400;color:var(--ink)}
.st8{padding:var(--space-1) 0 var(--space-1) var(--space-3);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);animation:fresh var(--motion-slow) var(--ease-out) both}
.st8 .id{color:var(--light);font-family:var(--font-mono);font-size:var(--type-small);margin-right:var(--space-1)}
.st8 b{font-weight:400;color:var(--ink)}
.st8 .df{color:var(--ink);text-decoration:underline dotted var(--ink-muted);text-underline-offset:var(--focus-gap)}

.st8.aside{opacity:var(--x-proposed-quiet);box-shadow:inset 2px 0 0 color-mix(in srgb,var(--danger) 45%,transparent)}

.st8.g .id{color:var(--x-proposed-pencil)}

.gapw{display:inline-block;background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-1);padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small)}
.far{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-2) 0 0 var(--space-3)}

.bal{border-top:1px solid var(--hairline);padding-top:var(--space-2);margin-top:var(--space-2);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);display:flex;gap:var(--space-1) var(--space-3);flex-wrap:wrap}

.frozen{border:1px solid color-mix(in srgb,var(--x-proposed-then) 50%,transparent);background:var(--x-proposed-then-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}

.saved{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-lit)}
.later{border-top:1px solid var(--hairline);padding-top:var(--space-3);display:grid;gap:var(--space-2)}

function roll(el, to) {

  if (RM || isNaN(from) || from === to) { el.textContent = to; return; }

  }
  const A = answer(ex, PINS);
  const grp = (h, n, list, cls) => list.length ? `<div class="gh"><b>${n}</b>${h}</div>` + list.map(r => `<div class="st8 ${cls}">${rowSentence(r.c, ex, r.diffs)}</div>`).join('') : '';
  let html = `<div class="gh">the example</div><div class="st8 me">${rowSentence(ex, ex, [])}</div>`;
  html += grp('alike in every pinned way', A.in.length, A.in, 'in');
  html += grp('can’t tell', A.cant.length, A.cant, 'unk');
  if (A.pencil.length) html += `<div class="pencil-only"><div class="gh" style="color:var(--x-proposed-pencil)"><span class="pchip">${ic('pencil-line', 10)}the model’s lane</span> alike by meaning · a guess, not counted, not saved</div>` +
    A.pencil.map(r => `<div class="st8 g">${rowSentence(r.c, ex, r.diffs)} <span class="dfw">“${esc(r.c.words)}”</span></div>`).join('') +
    `<p class="far">The record puts them under “differ in one way”: not ${esc(EX0.svc)}. If one should be, <b>propose it to Triage</b>; only then is it a fact, marked as the model’s proposal.</p></div>`;
  html += grp('set aside by your counter-example', A.aside.length, A.aside, 'aside');
  html += grp('differ in one way', A.near.length, A.near, 'out');
  if (A.far.length) html += `<p class="far"><b>${A.far.length}</b> differ in two or more ways: ${A.far.slice(0, 6).map(r => esc(r.c.id)).join(', ')}${A.far.length > 6 ? '…' : ''}</p>`;
  $('#rows').innerHTML = html;
  const tot = 1 + A.in.length + A.cant.length + A.aside.length + A.near.length + A.far.length;
  $('#bal').innerHTML = `<span>1 example + <b>${A.in.length}</b> alike + <b>${A.cant.length}</b> can’t tell${COUNTER ? ` + <b>${A.aside.length}</b> set aside` : ''} + <b>${A.near.length}</b> one way + <b>${A.far.length}</b> more</span><span class="ok">= ${tot} of ${C.length} ✓</span><span>some on ${esc(F(Q.hiddenSome.floor).n)}: ask ${esc(P(Q.hiddenSome.ask).n)}</span>${A.pencil.length ? `<span class="pencil-only pencil">+ ${A.pencil.length} guesses, outside the sum</span>` : ''}`;
  Icons.hydrate($('#rows'));
}

/* ---------- keep it ---------- */
function drawKeep() {
  const A0 = answer(EX0, PINS), An = answer(EXNOW, PINS);
  const ids = a => a.in.map(r => r.c.id);
  const was = ids(A0), now = ids(An);
  const joins = now.filter(x => !was.includes(x)), leaves = was.filter(x => !now.includes(x));
  const frozen = `${esc(EX0.sub)} ${esc(EX0.svc)} · the ${esc(EX0.area)} · ends ${longDay(EX0.ends)} · ${money(EX0.value)} · ${esc(EX0.sup)}`;
  const meaning = PINS.words === 'meaning';
  $('#keep').innerHTML = `
    <h2>${ic('bookmark', 16)}Keep this question</h2>
    <div class="frozen"><p class="eyebrow">the example, frozen as it was · ${esc(DATA.askedAt)}</p>${esc(EX0.id)}: ${frozen}${COUNTER ? `<br>not like ${esc(CX.id)} as it was: ${esc(CX.sub)}` : ''}</div>
    <ul class="kl">
      <li><span>${ic('quote', 12)}</span><span><b>the sentence</b>, as pinned${PINS.ends === 'year' ? `; “this year” fixed as ${yr(EX0.ends)}` : ''}</span></li>
      <li><span>${ic('pin', 12)}</span><span><b>the pins</b>, each a rule Data Atlas runs</span></li>
      <li><span>${ic('clock', 12)}</span><span><b>when asked</b> and <b>whose access</b>: ${esc(ME.n)}’s. Each reader reruns with their own.</span></li>
      ${meaning ? `<li class="pencil-only"><span style="color:var(--x-proposed-pencil)">${ic('pencil-off', 12)}</span><span class="pencil" style="text-decoration:none">alike by meaning: not kept. A rerun never calls the model.</span></li>` : ''}
      <li class="no"><span>${ic('x', 12)}</span><span><b>the rows</b>: never kept, never shared</span></li>
    </ul>
    ${SAVED ? `<p class="saved">${ic('check', 12)}saved as ${esc(Q.id)} · ${esc(DATA.askedAt)}</p>` : `<button class="btn primary" id="save" ${anyPinned() ? '' : 'disabled'}>${ic('bookmark', 14)}Save the question <span class="kbd">S</span></button>`}
    ${LATER ? `<div class="later">
      <p class="eyebrow">${esc(Q.later.day)} · you open ${esc(Q.id)}</p>
      <p class="what">${esc(EX0.id)} has changed since you asked: ${esc(Q.later.what)} (${esc(P(Q.later.who).n)}). <span class="rz">${esc(DATA.reasons5[Q.later.reason])}</span></p>
      <div class="two">
        <button class="way then" data-way="then" aria-pressed="${!USE_NOW}"><span class="h">as it was · kept</span><span class="big">${was.length}</span><span>ending <b>${esc(yearWord(EX0))}</b> (${yr(EX0.ends)})</span><span>${was.map(esc).join(', ')}</span></button>
        <button class="way" data-way="now" aria-pressed="${USE_NOW}"><span class="h">as it is now</span><span class="big">${now.length}</span><span>ending <b>${esc(yearWord(EXNOW))}</b> (${yr(EXNOW.ends)})</span><span>${now.map(esc).join(', ')}</span></button>
      </div>
      <p class="diff">${was.length === now.length ? '<b>Same count, different rows.</b> ' : ''}${leaves.map(x => `<span class="l">${esc(x)}</span>`).join(', ')} ${leaves.length ? 'would leave' : ''}${joins.length ? '; ' + joins.map(x => `<span class="j">${esc(x)}</span>`).join(', ') + ' would join' : ''}. The kept question stays as it was unless you choose. <span class="kbd">N</span> as it is now · <span class="kbd">B</span> as it was</p>
    </div>` : (SAVED ? `<p class="why">A week later, press <span class="kbd">W</span>.</p>` : '')}`;
  const s = $('#save'); if (s) s.addEventListener('click', save);
  $$('[data-way]').forEach(b => b.addEventListener('click', () => { USE_NOW = b.dataset.way === 'now'; drawAll(); }));
  Icons.hydrate($('#keep'));
}

function drawAll() { drawSentence(); drawCard(); drawAnswer(); drawKeep(); }
function pin(k, o) {
  if (OPTS[k].find(x => x.id === o && x.model) && !GW) return;
  PINS[k] = PINS[k] === o && o !== 'any' ? 'any' : o;
  drawAll();
}
function counter() { COUNTER = !COUNTER; drawAll(); }
function save() { if (!anyPinned()) return; SAVED = true; drawAll(); }
function weekLater() { if (!SAVED) save(); LATER = true; drawAll(); }

function chrome() {
  $('#chrome').innerHTML = topBand(`Contracts · <b>${esc(EX0.id)}</b> · More like this one`);
  $('#foot').innerHTML = hints([['1–7', 'pin a detail'], ['N', 'not like that one'], ['S', 'save'], ['W', 'a week later'], ['G', 'model gateway'], ['T', 'technical words'], ['R', 'replay']]);
}
function demo() {
  clearTimers(); reset(); document.body.classList.add('pre'); drawAll();
  const c = MS('--motion-calm'), t0 = 1200;
  later(() => document.body.classList.remove('pre'), t0);
  later(() => pin('svc', 'same'), t0 + c);
  later(() => pin('area', 'same'), t0 + c * 2);
  later(() => pin('ends', 'year'), t0 + c * 3);
  later(() => counter(), t0 + c * 4);
  later(() => pin('words', 'meaning'), t0 + c * 5);
  later(() => save(), t0 + c * 6);
  later(() => weekLater(), t0 + c * 7);
}
chrome();
gwHooks.push(() => { if (PINS) drawAll(); });
reset();
wireCommon(demo, (k) => {
  const n = +k; if (n >= 1 && n <= 7) { const key = ORDER[n - 1]; const os = OPTS[key]; const i = os.findIndex(o => o.id === PINS[key]); pin(key, os[(i + 1) % os.length].id); }
  if (k === 'n') { if (LATER) { USE_NOW = true; drawAll(); } else counter(); }
  if (k === 'b' && LATER) { USE_NOW = false; drawAll(); }
  if (k === 's') save();
  if (k === 'w') weekLater();
});
demo();
</script>
