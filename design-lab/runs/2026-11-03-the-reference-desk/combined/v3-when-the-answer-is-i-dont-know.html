<style>
/* ---------------------------------------------------------------
   Proposed tokens (all mixes of kit tokens; listed under "needs token" in notes)
   --------------------------------------------------------------- */
:root{
  /* pencil: anything the model gateway proposes. Graphite with a little info-blue; dotted, italic, its own lane. */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, var(--info));
  --x-proposed-pencil-wash: color-mix(in srgb, var(--info) 6%, transparent);
  /* six ways to be empty (from the catalogue run) */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 80%, transparent);
  --x-proposed-gap-tick: var(--space-2);
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 40%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-quiet: .62;
  /* the floor you are on (Department here) */
  --x-proposed-here: var(--floor-department-high);
  --x-proposed-here-wash: color-mix(in srgb, var(--floor-department-high) 10%, transparent);
  /* lit: what just changed, or what is kept */
  --x-proposed-lit: var(--green);
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 12%, transparent);
  /* the example record: the light language's beacon */
  --x-proposed-beacon: var(--light);
  --x-proposed-beacon-glow: color-mix(in srgb, var(--light) 30%, transparent);
  /* sepia: "as it was" (from the saved surface) */
  --x-proposed-then: color-mix(in srgb, var(--warning) 55%, var(--ink-muted));
  --x-proposed-then-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  --x-proposed-type-micro: .6875rem;
}
:root, .mk-gap, .gapbox, .c-gap{
  --x-proposed-gap:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--x-proposed-gap-tick) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--x-proposed-gap-tick) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--x-proposed-gap-tick) no-repeat;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.lt{color:var(--light)}
.small{font-size:var(--type-small);line-height:var(--leading-small)}
.meta{font-size:var(--type-meta);line-height:var(--leading-meta)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}

/* ---------- chrome ---------- */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:0 var(--edge)}
.top{display:flex;align-items:center;gap:var(--space-3);height:var(--target-md);border-bottom:1px solid var(--hairline)}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.floorchip{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.floorchip .fl{display:inline-block;width:var(--space-4);height:2px;background:var(--x-proposed-here)}
.floorchip b{font-weight:400;color:var(--ink)}
.crumb{font-size:var(--type-small);color:var(--ink-muted)}
.crumb b{font-weight:400;color:var(--ink)}
.top .sp{flex:1}
.chipbtn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);color:var(--ink-muted)}
.chipbtn[aria-pressed="true"]{color:var(--light);border-color:var(--ink-muted);background:var(--surface-raised)}
.gwchip{border-style:dotted;border-color:var(--x-proposed-pencil);color:var(--x-proposed-pencil);font-style:italic}
.gwchip.off{border-style:solid;border-color:var(--hairline-strong);color:var(--ink-muted);background:var(--surface-inset);font-style:normal}

.qhead{padding:var(--space-3) 0;border-bottom:1px solid var(--hairline);display:grid;gap:var(--space-1)}
.qwords{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);margin:0;letter-spacing:var(--tracking-tight)}
.qwords::before{content:"\201C";color:var(--ink-muted)}
.qwords::after{content:"\201D";color:var(--ink-muted)}
.readas{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-1) var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.readas b{font-weight:400;color:var(--ink)}
.main{min-height:0;padding:var(--space-4) 0 var(--space-2)}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:var(--space-4);min-height:calc(var(--space-6) + var(--space-3));padding-left:calc(var(--measure-glance) + var(--space-5))}
.hints{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}

/* two registers: the technical word one step down */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:.8}
.tech .tk{display:block}
.tech span.tk{display:inline;margin-left:var(--space-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);min-height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-muted);color:var(--light)}
.btn.primary{border-color:color-mix(in srgb,var(--x-proposed-here) 60%,transparent);background:var(--x-proposed-here-wash);color:var(--light)}
.btn[disabled]{opacity:var(--x-proposed-quiet);cursor:not-allowed}

/* ---------- ink and pencil ---------- */
/* ink: from the record, upright, solid. pencil: the model gateway's, dotted and italic, never counted. */
.pencil{color:var(--x-proposed-pencil);font-style:italic;text-decoration:underline dotted var(--x-proposed-pencil);text-underline-offset:var(--focus-gap);text-decoration-thickness:1px}
.pchip{display:inline-flex;align-items:center;gap:var(--space-1);font:italic 400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--x-proposed-pencil);border:1px dotted var(--x-proposed-pencil);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.ichip{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink-muted);border:1px solid var(--hairline-strong);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.pbox{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key)}
.plane{border-left:1px dotted var(--x-proposed-pencil);padding-left:var(--space-3)}
/* provenance never washes out: an agreed guess keeps a dotted top edge and says who proposed it */
.prov{font:italic 400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--x-proposed-pencil)}
/* G off: pencil goes; nothing else moves */
.gwoff .pencil-only{display:none!important}
.gw-off-only{display:none}
.gwoff .gw-off-only{display:revert}

/* ---------- six ways to be empty ---------- */
.mk{display:inline-block;vertical-align:middle;flex:none}
.mk-gap{background:var(--x-proposed-gap);width:var(--space-4);height:var(--space-3);--x-proposed-gap-tick:var(--space-1)}
.gapbox{background:var(--x-proposed-gap)}
.mk-none{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink);border-bottom:1px solid var(--ink-muted);padding:0 1px}
.mk-na{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.mk-stale{background:var(--x-proposed-stale);width:var(--space-4);height:var(--space-3);border-radius:2px}
.mk-break{width:var(--space-4);height:var(--space-3)}
.mk-break path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.mk-unseen{display:inline-flex;align-items:center;justify-content:center;width:var(--space-4);height:var(--space-3);background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:2px;color:var(--ink-muted)}
.mk-ok{width:var(--space-4);height:var(--space-3);background:var(--ink);border-radius:2px;opacity:.8}
.mk-noplace{width:var(--space-4);height:var(--space-3);background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-1);border:1px dashed var(--hairline-strong);border-radius:2px}
.unseen{display:inline-flex;align-items:center;gap:var(--space-2);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.unseen b{font-weight:400;color:var(--ink)}
.some{font-family:var(--font-mono);font-size:var(--x-proposed-type-micro);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink-muted)}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}
.x-cap{max-width:calc(var(--measure-glance) + var(--space-4))}

.grid{height:100%;display:grid;grid-template-columns:minmax(0,1fr) clamp(var(--measure-decision), 35vw, var(--measure-glance));gap:var(--space-5);min-height:0}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}

/* the lead: the base first, then the count, then the sentence */
.lead{display:flex;align-items:flex-end;gap:var(--space-6);flex-wrap:wrap}
.big{display:flex;align-items:baseline;gap:var(--space-2)}
.big .n{font-weight:200;font-size:var(--type-display);line-height:var(--leading-display);color:var(--light);font-variant-numeric:tabular-nums}
.big .of{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--ink-muted)}
.big .l{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);max-width:calc(var(--space-8) * 2)}
.big .l b{font-weight:400;color:var(--ink)}
.big.ans .n{font-size:var(--type-title);line-height:var(--leading-title)}
.say{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink);max-width:var(--measure-wide)}
.say b{font-weight:400;color:var(--light)}

/* the strip: one cell per record, in its empty mark */
.stripwrap{display:grid;gap:var(--space-1)}
.lanehead{display:flex;gap:var(--space-2);align-items:center;font:italic 400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--x-proposed-pencil)}
.strip{display:flex;align-items:flex-end;gap:var(--space-3)}
.side{display:flex;flex-direction:column;gap:var(--space-1);flex:var(--n) 1 0}
.side .grps{display:flex;gap:var(--space-2);align-items:flex-end}
.grp{display:flex;flex-direction:column;justify-content:flex-end;gap:var(--space-1);flex:var(--n) 1 0;min-width:var(--space-7)}
.grp .gl{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted)}
.grp .gl b{display:block;font-size:var(--type-meta);line-height:var(--leading-meta);font-weight:400;color:var(--ink)}
.cols{display:flex;gap:2px}
.col{flex:1;min-width:2px;display:flex;flex-direction:column;gap:2px}
.ln{height:var(--space-2);display:flex;justify-content:center;align-items:center}
.ln i{display:block;width:var(--space-2);height:var(--space-2);border-radius:50%;border:1px dotted var(--x-proposed-pencil)}
.cell{height:var(--space-6);border-radius:2px;position:relative;transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out),box-shadow var(--motion-calm) var(--ease-out)}
.pre .cell{opacity:0;transform:scaleY(.2)}
.c-heard{background:color-mix(in srgb,var(--ink) 26%,transparent)}
.c-silent{background:var(--light)}
.c-none{background:var(--light);box-shadow:inset 0 calc(var(--space-1) * -1) 0 var(--ink-muted)}
.c-gap{background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-1)}
.c-stale{background:var(--x-proposed-stale)}
.c-norecord svg{position:absolute;inset:0;width:100%;height:100%}
.c-norecord path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.c-na{background:color-mix(in srgb,var(--ink-muted) 14%,transparent);opacity:var(--x-proposed-quiet)}
.c-hidden{background:var(--x-proposed-unseen);-webkit-mask:linear-gradient(90deg,var(--shade),transparent);mask:linear-gradient(90deg,var(--shade),transparent)}
.cell.new{box-shadow:0 0 0 1px var(--x-proposed-lit),0 0 var(--space-3) var(--x-proposed-lit-wash)}
.cell.fromg::after{content:"";position:absolute;left:0;right:0;top:calc(var(--space-1) * -1);border-top:1px dotted var(--x-proposed-pencil)}
.ub{display:block;border-top:1px solid var(--ink);padding-top:var(--space-1);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.ub b{font-weight:400;color:var(--light)}
.ub.dk{border-top:1px dashed var(--ink-muted)}
.ub.out{border-top-color:var(--hairline)}
.balance{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);display:flex;gap:var(--space-2) var(--space-4);flex-wrap:wrap}
.balance b{font-weight:400;color:var(--ink)}
.balance .ok{color:var(--x-proposed-lit)}

/* as answers come back: one column per day, the base rising */
.back{border-top:1px solid var(--hairline);padding-top:var(--space-3);margin-bottom:var(--space-3);display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-5);min-height:0;flex:1}
.days{display:flex;gap:var(--space-2);align-items:flex-end}
.dy{display:grid;justify-items:center;gap:var(--space-1);width:calc(var(--space-6) + var(--space-3));padding:var(--space-1) 0;border-radius:var(--radius-key)}
.dy:hover{background:var(--surface-inset)}
.dy .bar{position:relative;width:var(--space-4);height:calc(var(--space-7) + var(--space-3));background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-1);border-radius:2px;overflow:hidden}
.dy .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);opacity:.8;transition:height var(--motion-calm) var(--ease-out)}
.dy .v{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink);white-space:nowrap}
.dy .d{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.dy.fut{opacity:.35}
.dy.fut .bar i{height:0!important}
.dy.cur{background:var(--surface-raised);box-shadow:inset 0 -2px 0 var(--x-proposed-here)}
.dy.cur .v{color:var(--light)}
.log{min-height:0;overflow:auto;scrollbar-width:thin;display:grid;align-content:start;gap:var(--space-1)}
.log h3{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-bottom:var(--space-1)}
.lg{display:grid;grid-template-columns:calc(var(--space-7) - var(--space-2)) minmax(0,1fr) auto;gap:var(--space-3);align-items:baseline;padding:var(--space-1) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.lg .w{font-family:var(--font-mono);font-size:var(--x-proposed-type-micro)}
.lg b{font-weight:400;color:var(--ink)}
.lg.today b{color:var(--light)}
.lg .rz{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);border:1px solid var(--hairline-strong);border-radius:2px;padding:0 var(--space-1);white-space:nowrap}
.lg .rz.g{border-style:dotted;border-color:var(--x-proposed-pencil);color:var(--x-proposed-pencil);font-style:italic}
.lg .prov{display:block}
.empty{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

/* the slip: "I don't know", with reasons and their errands */
.slip{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-4) var(--space-4) var(--space-3)}
.slip .idk{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3)}
.slip .idk h2{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light);letter-spacing:var(--tracking-tight)}
.slip .idk .stamp{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);border:1px solid var(--hairline-strong);border-radius:2px;padding:var(--space-1) var(--space-2);text-align:center;white-space:nowrap}
.slip .sub{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:var(--space-1)}
.slip .lede{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rs{list-style:none;margin:0;padding:0;display:grid;gap:2px;min-height:0;overflow:auto;scrollbar-width:thin;flex:1}
.r{display:grid;grid-template-columns:var(--space-4) var(--space-5) minmax(0,1fr) auto;gap:0 var(--space-2);align-items:start;width:100%;padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small)}
.r:hover{background:var(--surface-inset)}
.r.sel{background:var(--surface-raised);box-shadow:inset 2px 0 0 var(--x-proposed-here)}
.r.off{opacity:var(--x-proposed-quiet)}
.r .body.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .tick{width:var(--space-3);height:var(--space-3);border:1px solid var(--hairline-strong);border-radius:2px;display:flex;align-items:center;justify-content:center;margin-top:2px;color:var(--ink)}
.r .mkc{display:flex;justify-content:center;padding-top:3px}
.r .t{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.r .t .ct{font-family:var(--font-mono);font-size:var(--type-small);color:var(--light);margin-left:var(--space-1)}
.r .er{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap;padding-top:2px}
.r .er.done{color:var(--x-proposed-lit)}
.r .er.never{color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.r .body{grid-column:3 / -1}

function roll(el, to) {

      pv: () => `<div class="to">${Object.entries(k0).map(([k, a]) => `<span><b>${esc(P(k).n)}</b> · ${a.length} ${plural(a.length, 'question', 'questions')}</span>`).join('')}</div>
        <div class="q">“When did we last hear from <b>${esc(g1.n)}</b>?” <span class="opts" style="display:inline-flex"><span>a date</span><span>none since Feb</span><span>don’t know</span></span></div>
        <div class="hint pbox pencil-only"><span class="pchip">${ic('pencil-line', 10)}hint · the model</span> <span class="pencil">${esc(g1.guess.v)}</span> <span class="small muted">from ${esc(g1.guess.from)}. A hint, not an answer; not counted.</span></div>
        <div class="gw-off-only small muted">Without the model gateway the question goes without a hint. Nothing else changes.</div>
        <div class="st">${SENT ? (gapLeft.length ? `Still open: ${gapLeft.map(s => esc(s.n) + ' (' + esc(P(s.keeper).n.split(' ')[0]) + ')').join(', ')}` : '<b>All answered.</b>') : 'Each answer goes through Triage and becomes a fact with its keeper’s name on it.'}</div>` },
    { id: 'stale', st: 'stale', on: staleLeft > 0, t: 'Out of date', ct: staleLeft, say: 'Last contact was in winter, but the contractor reports were last read in May and June.', tk: 'source.lastRead < 90d',
      er: { kind: 'Triage job', icon: 'book-open-check', status: !SENT ? 'preview' : staleLeft ? 'asked' : 'done ' + Q.returns[3].label.split(' ').slice(1).join(' '), done: SENT && !staleLeft },
      pv: () => `<div class="to"><span><b>${esc(P('lena').n)}</b> · read 3 contractor reports again</span></div><div class="q">“Corvane monthly reports, from June: read again for Holloway Scaffolding, Ivel Asbestos Survey and Kelso Deep Clean.”</div>
        <div class="hint pbox pencil-only"><span class="pchip">${ic('pencil-line', 10)}hint · the model</span> <span class="pencil">Kelso: invoiced in July?</span> <span class="small muted">a payee “Kelso DC Ltd” looks like the same company</span></div>` },
    { id: 'norecord', st: 'norecord', on: true, t: 'No record', ct: t.norecord, say: `Their last contact fell in the window that was lost: ${esc(Q.lost)}.`, tk: 'source.gap(2026-01..2026-04) · permanent',
      er: { kind: 'Nobody can close this', icon: 'circle-slash', status: 'marked', never: true },
      pv: () => `<div class="tpl">Marked on the answer as not closable, so nobody is asked and nobody asks again. The range keeps them: “up to ${t.silent + t.dk}”.</div>` },
    { id: 'hidden', st: 'hidden', on: t.hidden > 0, t: 'Not yours to see', ct: t.hidden ? 'some' : 0, say: t.hidden ? `Some suppliers are kept on the ${esc(F(Q.hiddenFloor).n)} team floor. I can’t say how many.` : `${esc(P(Q.hiddenAsk).n)} let this question read them on ${Q.returns[r9].label}.`, tk: 'acl: floor=finance · count withheld',
      er: { kind: 'Share request', icon: 'key-round', status: !SENT ? 'preview' : D >= r9 ? 'granted ' + Q.returns[r9].label.split(' ').slice(1).join(' ') : 'asked', done: SENT && D >= r9 },
      pv: () => `<div class="to"><span><b>${esc(P(Q.hiddenAsk).n)}</b> · ${esc(P(Q.hiddenAsk).role)}</span></div><div class="q">“Let question ${esc(Q.id)} read ${esc(F(Q.hiddenFloor).n)}’s suppliers and when we last heard from them. Only this question; you can stop it any time.”</div><div class="st">Shares the question, not the answer. Others who rerun it use their own access.</div>` },
    { id: 'noplace', st: 'noplace', on: true, t: 'No place for it', ct: 'emails', say: esc(Q.noPlace.why), tk: 'ontology: Supplier has no property contact.email',
      er: { kind: 'Mandate ask', icon: 'flag', status: !SENT ? 'preview' : D >= r12 ? 'taken ' + Q.returns[r12].label.split(' ').slice(1).join(' ') : 'asked', done: SENT && D >= r12 },
      pv: () => `<div class="to"><span><b>${esc(P(Q.noPlace.to).n)}</b> · ${esc(P(Q.noPlace.to).role)}, through Mandate</span></div>
        <div class="tpl">Please give suppliers a place for “${esc(Q.noPlace.detail)}”. Asked because of: “${esc(Q.words)}” (${esc(Q.id)}).</div>
        <div class="hint pbox pencil-only"><span class="pchip">${ic('pencil-line', 10)}draft · the model · edit it</span> <span class="pencil">We email most cleaning and pest firms, so “heard from” misses them.</span></div>
        <div class="st">Changes no number today. Changes ${esc(Q.noPlace.gain)}.</div>` },
    { id: 'na', st: 'na', on: false, t: 'Doesn’t apply', ct: t.na, say: 'Their contracts ended before 1 March. Outside the base, not a gap.', tk: 'contract.end < 2026-03-01' },
  ];
}
function drawSlip() {
  const t = TALLY[D];
  const R = reasons();
  $('#idkh').textContent = t.dk ? `I don’t know, for ${t.dk}.` : 'I can say for all of them.';
  $('#idks').textContent = (t.hidden ? 'And some more I can’t see. ' : 'Every supplier is now visible to this question. ') + 'That is an answer too: fixed reasons, ticked where they apply, each with its errand.';
  $('#stamp').innerHTML = SENT ? `errands sent<br>${esc(Q.returns[0].label)}` : 'not answered<br>yet';
  $('#rs').innerHTML = R.map((r, i) => `<li><button class="r${r.on ? '' : ' off'}${SEL === r.id ? ' sel' : ''}" data-r="${r.id}" aria-pressed="${SEL === r.id}">
      <span class="tick" aria-label="${r.on ? 'applies' : 'does not apply'}">${r.on ? ic('check', 10) : ''}</span><span class="mkc">${mark(r.st)}</span>
      <span class="t">${esc(r.t)}${r.ct !== '' && r.ct !== 0 ? `<span class="ct">· ${r.ct}</span>` : ''}</span>
      ${r.er ? `<span class="er${r.er.done ? ' done' : ''}${r.er.never ? ' never' : ''}">${ic(r.er.icon, 11)}${esc(r.er.kind)} · ${esc(r.er.status)}</span>` : '<span></span>'}
      <span class="body${SEL === r.id ? '' : ' one'}" title="${esc(r.say.replace(/<[^>]+>/g, ''))}">${r.say}<span class="tk">${esc(r.tk)}</span></span>
      ${SEL === r.id && r.pv ? `<div class="pv">${r.pv()}</div>` : ''}
    </button></li>`).join('');
  $$('#rs .r').forEach(b => b.addEventListener('click', () => { SEL = b.dataset.r; drawSlip(); }));
  const up = t.covered + t.gap + t.stale;
  $('#conseq').innerHTML = SENT
    ? `<p>${t.dk || t.hidden ? `Still open: <b>${t.gap} not known yet</b>${t.norecord ? `, <b>${t.norecord} no record</b> (nobody can close)` : ''}.` : 'Nothing open.'} Kept; answered again as each errand lands.</p><span class="sent">${ic('check', 12)}4 sent · 1 marked</span>`
    : `<p>If every errand comes back: covers up to <b>${up} of ${t.applies}</b>, plus Finance’s. Still open after: <b>${t.norecord} no record</b>. The Mandate ask moves no number now.</p><button class="btn primary" id="send">${ic('send', 14)}Send 4 errands <span class="kbd">S</span></button>`;
  const sb = $('#send'); if (sb) sb.addEventListener('click', send);
  Icons.hydrate($('.slip'));
}

function drawAll() { drawLead(); drawStrip(); drawDays(); drawSlip(); }
function go(d) {
  const prev = TALLY[D];
  D = Math.max(0, Math.min(Q.returns.length - 1, d));
  drawAll();
  if (prev.covered !== TALLY[D].covered) { $('#nCov').textContent = prev.covered; roll($('#nCov'), TALLY[D].covered); }
}
function send() { if (SENT) return; SENT = true; drawAll(); }

function reset() {
  clearTimers(); D = 0; SENT = false; SEL = 'gap';
  document.body.classList.add('pre');
  drawAll();
}
function demo() {
  reset();
  const c = MS('--motion-calm');
  later(() => document.body.classList.remove('pre'), 1200);
  later(send, 1200 + c * 2);
  for (let i = 1; i < Q.returns.length; i++) later(() => go(i), 1200 + c * 2 + c * i);
}
chrome();
reset();
wireCommon(demo, (k, e) => {
  if (k === 's') send();
  if (e.key === 'ArrowRight' && SENT) go(D + 1);
  if (e.key === 'ArrowLeft' && SENT) go(D - 1);
  const n = +k; if (n >= 1 && n <= 7) { SEL = reasons()[n - 1].id; drawSlip(); }
});
gwHooks.push(() => {});
demo();
</script>
</body>
