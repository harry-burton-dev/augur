<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Reference desk · Can't answer V4 · Hand it on</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@COMMON_CSS@*/
.grid{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-5);min-height:0}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.lead{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);margin:0}
.lead-sub{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.lead-sub b{font-weight:400;color:var(--ink)}
/* before and after: the same strip twice, the second showing what the asks would fill */
.ba{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-5)) minmax(0,1fr) calc(var(--space-7) + var(--space-5));gap:var(--space-2) var(--space-3);align-items:center}
.ba .lab{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ba .lab b{display:block;font-weight:400;color:var(--ink);font-size:var(--type-meta);line-height:var(--leading-meta)}
.ba .pc{font:400 var(--type-lead)/1 var(--font-mono);color:var(--light);text-align:right}
.ba .pc small{display:block;font-size:var(--x-proposed-type-micro);color:var(--ink-muted);margin-top:var(--space-1)}
.strip{display:flex;gap:2px;height:calc(var(--space-5) + var(--space-1))}
.cell{flex:1;min-width:2px;border-radius:2px;transition:background var(--motion-slow) var(--ease-out),box-shadow var(--motion-slow) var(--ease-out)}
.c-ok{background:color-mix(in srgb,var(--ink) 55%,transparent)}
.c-gap{background:var(--x-proposed-gap);--x-proposed-gap-tick:var(--space-1)}
.c-stale{background:var(--x-proposed-stale)}
.c-norecord{background:none;border-top:1px dashed var(--ink-muted);border-bottom:1px dashed var(--ink-muted)}
.c-will{background:var(--x-proposed-here-wash);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--x-proposed-here) 70%,transparent)}
.c-hidden{background:var(--x-proposed-unseen);flex:3;-webkit-mask:linear-gradient(90deg,var(--shade),transparent);mask:linear-gradient(90deg,var(--shade),transparent)}
.c-hidden.will{background:var(--x-proposed-here-wash)}
/* the round: one card per person, the small questions they'd get */
.round{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--measure-rail) + var(--space-6)),1fr));gap:var(--space-3);overflow:auto;min-height:0;align-content:start}
.pcard{background:var(--surface-inset);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-3);display:grid;gap:var(--space-2);align-content:start;transition:opacity var(--motion-base) var(--ease-out)}
.pcard.dim{opacity:var(--x-proposed-quiet)}
.pcard h3{margin:0;display:flex;align-items:baseline;gap:var(--space-2);font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.pcard h3 span{font-size:var(--type-small);color:var(--ink-muted);margin-left:auto;font-family:var(--font-mono)}
.pcard .role{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:calc(var(--space-2) * -1)}
.qs{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-1)}
.qs li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);align-items:start}
.qs li .mk{margin-top:2px}
.qs li.off{opacity:var(--x-proposed-quiet);text-decoration:line-through;text-decoration-color:var(--ink-muted)}
.qs .hint{grid-column:2;display:flex;gap:var(--space-1);align-items:baseline;flex-wrap:wrap;color:var(--x-proposed-pencil)}
.gwoff .qs .hint{display:none}

.right{min-height:0;display:flex;flex-direction:column;gap:var(--space-2);background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-4);overflow:auto}
.right h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);margin:0}
.fix{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr) auto;gap:var(--space-1) var(--space-2);align-items:start;text-align:left;width:100%;padding:var(--space-2);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.fix:hover{background:var(--surface-inset)}
.fix .box{width:var(--space-4);height:var(--space-4);border:1px solid var(--hairline-strong);border-radius:2px;display:grid;place-items:center;color:var(--slate-deep);margin-top:2px}
.fix[aria-checked="true"] .box{background:var(--x-proposed-here);border-color:var(--x-proposed-here)}
.fix[aria-checked="false"] .box svg{opacity:0}
.fix b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.fix .kind{font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.conseq{border-top:1px solid var(--hairline);padding-top:var(--space-3);margin-top:auto;display:grid;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.conseq p b{font-weight:400;color:var(--light)}
.draft{padding:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--x-proposed-pencil)}
.gwoff .draft{border-style:solid;border-color:var(--hairline);color:var(--ink);background:none}
</style>
</head>
<body class="pre">
<div class="app">
  <div id="chrome"></div>
  <main class="main">
    <div class="grid">
      <section class="left">
        <div class="dep" style="--i:0">
          <p class="eyebrow">Hand it on</p>
          <h2 class="lead" id="lead"></h2>
          <p class="lead-sub" id="leadsub"></p>
        </div>
        <div class="ba dep" style="--i:1" id="ba"></div>
        <p class="eyebrow dep" style="--i:2">What each person would be asked · one round, small questions</p>
        <div class="round" id="round"></div>
      </section>
      <aside class="right dep" style="--i:3" id="right" aria-live="polite"></aside>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="x-cap"><b>Can't answer · V4</b> hand it on: a gap becomes a round of small asks, previewed · referral slips, consequence preview</div>
<script>
/*@DATA@*/
/*@COMMON_JS@*/
const Q = DATA.q1;
$('#chrome').outerHTML = chrome(Q, `<span class="ichip">${ic('calendar', 11)}since spring = ${esc(Q.since.pick)}</span>`);
$('#foot').innerHTML = hints([['1–4', 'tick an ask'], ['Enter', 'hand them on'], ['G', 'model gateway'], ['T', 'technical words'], ['R', 'replay']]);
const on = { ask: false, reread: false, keep: false, access: false };
let sent = false;

const ORDER = ['ok', 'gap', 'stale', 'norecord'];
const rowsOf = () => applies().slice().sort((a, b) => ORDER.indexOf(a.st === 'none' ? 'ok' : a.st) - ORDER.indexOf(b.st === 'none' ? 'ok' : b.st));
const fills = s => (s.st === 'gap' && on.ask) || (s.st === 'stale' && on.reread);
function after() { return answered().length + applies().filter(fills).length; }

function render() {
  const ap = applies().length, now = answered().length, aft = after();
  $('#lead').textContent = `For ${ap - now} suppliers I can’t say yet. Here is who could, and what asking would change.`;
  $('#leadsub').innerHTML = `Today the answer is <b>${silentKnown().length}</b> suppliers. Nothing is sent until you press <b>Hand them on</b>, and every ask carries your question word for word.`;
  const strip = will => rowsOf().map(s => `<span class="cell ${will && fills(s) ? 'c-will' : (s.st === 'none' ? 'c-ok' : 'c-' + s.st)}" title="${esc(s.n)}"></span>`).join('') + `<span class="cell c-hidden${will && on.access ? ' will' : ''}" title="some suppliers you can’t see"></span>`;
  $('#ba').innerHTML = `
    <span class="lab"><b>Now</b>covered</span><div class="strip" role="img" aria-label="now ${now} of ${ap}">${strip(false)}</div><span class="pc">${pct(now, ap)}%<small>${now} of ${ap}</small></span>
    <span class="lab"><b>If they answer</b>preview</span><div class="strip" role="img" aria-label="after ${aft} of ${ap}">${strip(true)}</div><span class="pc">${pct(aft, ap)}%<small>${aft} of ${ap}${on.access ? ' + some' : ''}</small></span>`;
  // the round, by person
  const by = {};
  applies().filter(s => s.st === 'gap' || s.st === 'stale').forEach(s => (by[s.keeper] = by[s.keeper] || []).push(s));
  const cards = Object.keys(by).map(k => {
    const L = by[k], live = L.filter(fills).length;
    return `<div class="pcard${live ? '' : ' dim'}"><h3>${esc(P(k).n)}<span>${live} of ${L.length}</span></h3><p class="role">${esc(P(k).role)}, ${esc(F(P(k).floor).n)}</p><ul class="qs">${L.map(s => `<li class="${fills(s) ? '' : 'off'}">${mark(s.st)}<span>${s.st === 'gap' ? `When did we last hear from <b style="font-weight:400;color:var(--light)">${esc(s.n)}</b>?` : `Read ${esc(s.n)}’s reports since ${esc(s.read)} again.`}</span>${s.guess ? `<span class="hint"><span class="pchip">${ic('pencil-line', 10)}hint · model</span><span class="pencil">${esc(s.guess.v)}?</span><span class="muted">${esc(s.guess.from)}</span></span>` : ''}</li>`).join('')}</ul></div>`;
  });
  if (on.access) cards.push(`<div class="pcard"><h3>${esc(P('dev').n)}<span>1</span></h3><p class="role">${esc(P('dev').role)}, ${esc(F('finance').n)}</p><ul class="qs"><li>${mark('hidden')}<span>May ${esc(DATA.me.n.split(' ')[0])} see which suppliers you keep, for this question only?</span></li></ul></div>`);
  if (on.keep) cards.push(`<div class="pcard"><h3>${esc(P('tom').n)}<span>1</span></h3><p class="role">${esc(P('tom').role)}, ${esc(F(P('tom').floor).n)}</p><ul class="qs"><li><span class="mk" style="color:var(--ink-muted)">${ic('flag', 14)}</span><span>A Mandate ask: keep a last-contact date for every live supplier.</span></li></ul></div>`);
  $('#round').innerHTML = cards.join('');
  right();
}
function right() {
  const n = id => Q.fixes.find(f => f.id === id);
  const people = new Set(); let qs = 0;
  applies().filter(fills).forEach(s => { people.add(s.keeper); qs++; });
  if (on.access) { people.add('dev'); qs++; }
  if (on.keep) { people.add('tom'); qs++; }
  const ap = applies().length;
  const left = applies().length - after();
  $('#right').innerHTML = `<h2>Asks</h2>` +
    Q.fixes.map((f, i) => `<button class="fix" role="checkbox" aria-checked="${on[f.id]}" data-fix="${f.id}"><span class="box">${ic('check', 12)}</span><span><b>${esc(f.title)}</b>${esc(f.what)}</span><span class="kind">${esc(f.kind)} <span class="kbd">${i + 1}</span></span></button>`).join('') +
    `<div class="conseq">
      <p class="eyebrow">If you hand these on</p>
      <p>${qs ? `<b>${qs} short ${qs === 1 ? 'question' : 'questions'}</b> to <b>${people.size} ${people.size === 1 ? 'person' : 'people'}</b>. If all are answered, this covers <b>${after()} of ${ap}</b> (${pct(after(), ap)}%).` : 'Tick an ask to see who it goes to and what it would change.'}</p>
      <p>${left ? `Still open after: ${applies().filter(s => s.st === 'norecord').length} with no record, which nobody can close${!on.reread ? ', and the 3 out of date' : ''}${!on.ask ? ', and the 7 not known yet' : ''}.` : ''}${on.access ? '' : ' Some stay not yours to see.'}</p>
      ${on.keep ? `<div class="draft pbox">${GW ? `<span class="pchip">${ic('pencil-line', 10)}drafted by the model · edit it</span>` : `<span class="ichip">${ic('file-text', 10)}from the template</span>`}<br>${GW ? 'Please keep a last-contact date for every live supplier, so a question like this one has no gaps next time.' : `Keep “last contact” for Supplier. Asked because: “${esc(Q.words)}”`}</div>` : ''}
      <button class="btn primary" id="send" ${qs ? '' : 'disabled'}>${ic(sent ? 'check' : 'send', 14)}${sent ? 'Handed on · your question will re-answer as each lands' : 'Hand them on'}</button>
    </div>`;
  $$('#right [data-fix]').forEach(b => b.addEventListener('click', () => toggle(b.dataset.fix)));
  $('#send').addEventListener('click', send);
}
function toggle(id) { on[id] = !on[id]; sent = false; render(); }
function send() { if (!Object.values(on).some(Boolean)) return; sent = true; right(); }
function play() {
  clearTimers(); Object.keys(on).forEach(k => on[k] = false); sent = false;
  document.body.classList.add('pre'); render();
  later(() => document.body.classList.remove('pre'), 1200);
  later(() => toggle('ask'), 1900);
  later(() => toggle('reread'), 2500);
}
wireCommon(play);
gwHooks.push(() => render());
addEventListener('keydown', e => {
  const k = +e.key; if (k >= 1 && k <= 4) toggle(Q.fixes[k - 1].id);
  if (e.key === 'Enter' && !e.target.closest('button')) send();
});
play();
</script>
</body>
</html>
