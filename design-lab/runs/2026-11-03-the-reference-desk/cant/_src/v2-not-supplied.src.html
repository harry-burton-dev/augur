<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Reference desk · Can't answer V2 · Not supplied, yet</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@COMMON_CSS@*/
.grid{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-5);min-height:0}
/* the slip: an inter-library loan "unfilled" notice, answering with reasons */
.slip{min-height:0;overflow:auto;background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-4) var(--space-5);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-auto-rows:min-content;gap:var(--space-3) var(--space-5);position:relative}
.slip .head{grid-column:1/-1;display:flex;gap:var(--space-4);flex-wrap:wrap;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);border-bottom:1px dashed var(--hairline-strong);padding-bottom:var(--space-2)}
.slip .head b{font-weight:400;color:var(--ink)}
.idk{font-weight:200;font-size:var(--type-display);line-height:var(--leading-display);color:var(--light);margin:0}
.idk-sub{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink);max-width:62ch}
.stamp{align-self:start;justify-self:end;border:1px solid var(--ink-muted);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);text-align:center;transition:opacity var(--motion-slow) var(--ease-out),transform var(--motion-slow) var(--ease-spring)}
.stamp b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);letter-spacing:var(--tracking-caps)}
.pre .stamp{opacity:0;transform:scale(1.08)}
.reasons{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-1) var(--space-5)}
.reasons h3,.near h3{grid-column:1/-1;margin:0 0 var(--space-1)}
.rs{display:grid;grid-template-columns:var(--space-4) var(--space-5) minmax(0,1fr);gap:var(--space-2);align-items:start;padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rs .box{width:var(--space-4);height:var(--space-4);border:1px solid var(--hairline-strong);border-radius:2px;display:grid;place-items:center;color:var(--light);margin-top:2px}
.rs.on .box{border-color:var(--ink)}
.rs .box svg{opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.rs.on.ticked .box svg{opacity:1}
.rs .m{padding-top:var(--space-1)}
.rs b{display:block;font-weight:400;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.rs.on b{color:var(--light)}
.rs:not(.on){opacity:var(--x-proposed-quiet)}
.near{grid-column:1/-1;border-top:1px dashed var(--hairline-strong);padding-top:var(--space-3);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4)}
.nbox{padding:var(--space-3);display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.nbox .big{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--x-proposed-pencil)}
.nbox.ink{border:1px solid var(--hairline);border-radius:var(--radius-key)}
.nbox.ink .big{color:var(--ink)}
.nbox .row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.gwoff .nbox.pb{border-style:solid;border-color:var(--hairline);background:var(--x-proposed-unseen)}
.gwoff .nbox.pb .big{color:var(--ink-muted)}

.routes{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.routes h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);margin:0}
.routes .lede{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-bottom:var(--space-1)}
.route{display:grid;gap:var(--space-1);text-align:left;width:100%;padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);transition:background var(--motion-base) var(--ease-out),border-color var(--motion-base) var(--ease-out)}
.rhead{display:grid;gap:var(--space-1);width:100%;border-radius:var(--radius-key)}
.route .btn{justify-self:start}
.route:hover{border-color:var(--hairline-strong)}
.route .rt{display:flex;align-items:center;gap:var(--space-2);color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.route .rt .kbd{margin-left:auto}
.route .kind{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.route .fx{color:var(--ink)}
.route.sel{border-color:color-mix(in srgb,var(--x-proposed-here) 60%,transparent);background:var(--x-proposed-here-wash)}
.route .more{display:none;border-top:1px solid var(--hairline);margin-top:var(--space-1);padding-top:var(--space-2)}
.route.sel .more{display:grid;gap:var(--space-2)}
.draft{padding:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--x-proposed-pencil)}
.gwoff .draft{border-style:solid;border-color:var(--hairline);color:var(--ink);background:none}
.draft .pchip{margin-bottom:var(--space-1)}
.keep{margin-top:auto;display:flex;align-items:flex-start;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.keep b{font-weight:400;color:var(--ink)}
</style>
</head>
<body class="pre">
<div class="app">
  <div id="chrome"></div>
  <main class="main">
    <div class="grid">
      <article class="slip" id="slip"></article>
      <aside class="routes" id="routes" aria-live="polite"></aside>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="x-cap"><b>Can't answer · V2</b> not supplied, yet: "I don't know" as a full answer with reasons · inter-library loan unfilled-request codes</div>
<script>
/*@DATA@*/
/*@COMMON_JS@*/
const Q = DATA.q2;
$('#chrome').outerHTML = chrome(Q, `<span class="ichip">${ic('calendar', 11)}next month = December 2026</span>`);
$('#foot').innerHTML = hints([['1–3', 'what would answer it'], ['G', 'model gateway'], ['T', 'technical words'], ['R', 'replay']]);
const K = P(Q.keeper), A = P(Q.admin);
let sel = null;

function slip() {
  const reasons = Q.reasons.map((r, i) => `<div class="rs dep${r.on ? ' on' : ''}" style="--i:${i + 3}" data-r="${i}">
      <span class="box" role="img" aria-label="${r.on ? 'applies' : 'does not apply'}">${ic('check', 12)}</span>
      <span class="m">${r.st === 'ok' ? `<span class="mk mk-ok" style="opacity:.4"></span>` : mark(r.st)}</span>
      <span><b>${esc(r.t)}</b>${esc(r.say)}${r.st === 'hidden' && r.on ? ` Ask ${esc(K.n)}.` : ''}</span></div>`).join('');
  $('#slip').innerHTML = `
    <div class="head"><span>Enquiry <b>0142</b></span><span>for <b>${esc(DATA.me.n)}</b></span><span>${esc(DATA.askedAt)}</span><span>looked in <b>${esc(DATA.app)}</b>, <b>Artifacts</b>, <b>Mandate</b></span></div>
    <div class="dep" style="--i:0"><p class="idk">I don’t know.</p></div>
    <div class="stamp" id="stamp" aria-label="Not answered yet">Not answered<b>yet</b>3 Nov 2026</div>
    <p class="idk-sub dep" style="--i:1;grid-column:1/-1">Nothing I can see records when a van’s MOT is due. That is an answer too: here is why, what I found nearby, and what would make this answerable next time.</p>
    <div class="reasons"><h3 class="eyebrow dep" style="--i:2">Why not · the reasons that apply are ticked</h3>${reasons}</div>
    <div class="near">
      <h3 class="eyebrow">The nearest I can give, not an answer</h3>
      <div class="nbox ink dep" style="--i:9">
        <span class="row"><span class="mk mk-stale"></span><span class="ichip">from the record</span></span>
        <span class="big">${Q.doc.rows} of ${Q.vans} vans</span>
        <span>are in ${esc(Q.doc.n)} (${esc(Q.doc.lib)}, ${esc(Q.doc.date)}). Matched by registration number. Out of date by 20 months.</span>
      </div>
      <div class="nbox pbox pb dep" style="--i:10" id="guess"></div>
    </div>`;
  guess();
}
function guess() {
  const g = $('#guess'); if (!g) return;
  g.innerHTML = GW
    ? `<span class="row"><span class="pchip">${ic('pencil-line', 10)}guess · model</span></span>
       <span class="big pencil">about ${Q.nearest} vans</span>
       <span>The model read the free-text “${esc(Q.doc.col)}” column and thinks ${Q.nearest} vans had their MOT in December 2024 or 2025. A guess from an old copy: not counted, not saved.</span>`
    : `<span class="row"><span class="ichip">${ic('circle-slash', 10)}model gateway off</span></span>
       <span class="big">${Q.spelled} rows say “MOT”</span>
       <span>Without the model I can only match the word: ${Q.spelled} rows of the “${esc(Q.doc.col)}” column spell out “MOT” with a month. ${esc(DATA.gateway.offWhy)}</span>`;
}
const ROUTES = [
  { t: `Ask ${K.n.split(' ')[0]} today`, kind: 'Message', ic: 'message-square', fx: `Quickest. ${K.n}, ${K.role}, keeps the ${Q.diary}.`, more: () => `<span>Your question goes with it, word for word. The answer comes back to you, not into ${esc(DATA.app)}, so the next person asks again.</span><button class="btn primary">${ic('send', 14)}Send to ${esc(K.n.split(' ')[0])}</button>` },
  { t: 'Read the old register into Data Atlas', kind: 'Triage job', ic: 'list-checks', fx: `${Q.doc.rows} proposals wait in Triage for ${K.n.split(' ')[0]} to confirm.`, more: () => `<span>Each row becomes a proposal: “Van ABC has MOT due …”. Nothing is a fact until ${esc(K.n.split(' ')[0])} confirms it. Fills ${Q.doc.rows} of ${Q.vans}; the other ${Q.vans - Q.doc.rows} show as not known yet.</span><button class="btn primary">${ic('list-checks', 14)}Make the Triage job</button>` },
  { t: 'Ask for MOT dates to be kept', kind: 'Mandate ask', ic: 'flag', fx: `${A.n}, ${A.role}, adds “MOT due” to vans.`, more: () => `<div class="draft pbox">${GW ? `<span class="pchip">${ic('pencil-line', 10)}drafted by the model · edit it</span>` : `<span class="ichip">${ic('file-text', 10)}from the template</span>`}<br>${GW ? 'Please keep an “MOT due” date for every van, so the depot can see which are due each month without asking Fleet.' : `Keep “MOT due” for Vehicle. Asked because: “${esc(Q.words)}”`}</div><span>Once added, all ${Q.vans} vans show it as not known yet, and ${esc(K.n.split(' ')[0])} is asked to fill them.</span><button class="btn primary">${ic('flag', 14)}Send the ask</button>` },
];
function routes() {
  $('#routes').innerHTML = `<h2>What would answer it</h2><p class="lede">Three ways, quickest first. Each says who it goes to and what it changes.</p>` +
    ROUTES.map((r, i) => `<div class="route dep${sel === i ? ' sel' : ''}" style="--i:${i + 11}">
      <button class="rhead" data-route="${i}" aria-expanded="${sel === i}">
      <span class="kind">${esc(r.kind)}</span>
      <span class="rt">${ic(r.ic, 16)}${esc(r.t)}<span class="kbd">${i + 1}</span></span>
      <span class="fx">${esc(r.fx)}</span></button>
      <div class="more">${sel === i ? r.more() : ''}</div></div>`).join('') +
    `<p class="keep dep" style="--i:14">${ic('bookmark', 16)}<span><b>Your question is kept.</b> When any of these lands, I’ll answer it again and tell you what changed.</span></p>`;
  $$('#routes [data-route]').forEach(b => b.addEventListener('click', () => pick(+b.dataset.route)));
}
function pick(i) { sel = sel === i ? null : i; routes(); }

function play() {
  clearTimers(); sel = null;
  document.body.classList.add('pre'); slip(); routes();
  later(() => document.body.classList.remove('pre'), 1200);
  Q.reasons.forEach((r, i) => later(() => { const el = $(`.rs[data-r="${i}"]`); el && el.classList.add('ticked'); }, 1700 + i * 120));
  later(() => pick(2), 2600);
}
wireCommon(play);
gwHooks.push(() => { guess(); if (sel !== null) routes(); });
addEventListener('keydown', e => { const n = +e.key; if (n >= 1 && n <= 3) pick(n - 1); });
play();
</script>
</body>
</html>
