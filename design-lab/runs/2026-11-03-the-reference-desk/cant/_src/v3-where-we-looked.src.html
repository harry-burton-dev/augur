<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Reference desk · Can't answer V3 · Where I looked</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@COMMON_CSS@*/
.grid{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-5);min-height:0}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.verdict{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light);margin:0}
.verdict-sub{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink);max-width:80ch}
.verdict-sub b{font-weight:400;color:var(--light)}
/* the search chart: places down, months across, like a search-and-rescue sector plot */
.chart{display:grid;grid-template-columns:minmax(calc(var(--measure-rail) + var(--space-5)),1.1fr) repeat(var(--m),minmax(0,1fr));gap:3px;align-items:stretch;overflow:auto;min-height:0}
.chart .mh{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);text-align:center;padding-bottom:var(--space-1);letter-spacing:var(--tracking-soft)}
.chart .pl{display:grid;gap:2px;padding:var(--space-1) var(--space-2) var(--space-1) 0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);border-radius:var(--radius-key)}
.chart .pl span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
.chart .pl.sel{box-shadow:inset 2px 0 0 var(--x-proposed-here);padding-left:var(--space-2);background:var(--x-proposed-here-wash)}
.c{position:relative;border-radius:2px;min-height:calc(var(--space-5) + var(--space-3));display:grid;place-items:center;color:var(--ink-muted);transition:opacity var(--motion-quick) var(--ease-out)}
.pre .c{opacity:0}
.c.s{background:color-mix(in srgb,var(--ink) 16%,transparent)}
.c.f{background:color-mix(in srgb,var(--ink) 16%,transparent)}
.c.f::after{content:"";width:var(--space-4);height:var(--space-4);border-radius:var(--radius-pill);border:1px dashed var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash)}
.c.t{background:var(--x-proposed-stale)}
.c.w svg{width:100%;height:60%}
.c.w path{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.c.h{background:var(--x-proposed-unseen);border:1px solid var(--hairline)}
.c.n{border:1px dotted var(--hairline-strong);opacity:var(--x-proposed-quiet)}
.c.sp{background:color-mix(in srgb,var(--ink) 8%,transparent);border:1px dashed var(--ink-muted)}
.c.now{box-shadow:inset 0 -2px 0 var(--ink-muted)}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.legend span{display:inline-flex;gap:var(--space-2);align-items:center}
.legend i{display:inline-block;width:var(--space-4);height:var(--space-3);border-radius:2px}
.legend i.f{background:none}
.legend i.f::after{width:var(--space-3);height:var(--space-3)}

.right{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-4);overflow:auto}
.right h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);margin:0}
.right .lede{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.turn{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-1) var(--space-2);padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.turn b{font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta);display:block}
.turn .btn{grid-column:2;justify-self:start;margin-top:var(--space-1)}
.turn.sel{background:var(--x-proposed-here-wash);box-shadow:inset 2px 0 0 var(--x-proposed-here);padding-left:var(--space-2);margin-left:calc(var(--space-2) * -1);border-radius:0 var(--radius-key) var(--radius-key) 0}
.hit{padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.hit q{color:var(--x-proposed-pencil)}
</style>
</head>
<body class="pre">
<div class="app">
  <div id="chrome"></div>
  <main class="main">
    <div class="grid">
      <section class="left">
        <p class="eyebrow">The answer</p>
        <h2 class="verdict dep" style="--i:0" id="verdict"></h2>
        <p class="verdict-sub dep" style="--i:1" id="vsub"></p>
        <div class="chart" id="chart"></div>
        <div class="legend" id="legend"></div>
      </section>
      <aside class="right" id="right" aria-live="polite"></aside>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="x-cap"><b>Can't answer · V3</b> where I looked: not found is not the same as none · search-and-rescue sector plots, an archaeologist's trench plan</div>
<script>
/*@DATA@*/
/*@COMMON_JS@*/
const Q = DATA.q3;
$('#chrome').outerHTML = chrome(Q, `<span class="ichip">${ic('calendar', 11)}this year = 1 Jan to today</span>`);
$('#foot').innerHTML = hints([['↑ ↓', 'pick a place'], ['G', 'model gateway'], ['T', 'technical words'], ['R', 'replay']]);
const M = Q.months.length;
let sel = 5;

/* a cell's code, with the model gateway taken into account */
function code(p, i) {
  let c = p.cells[i];
  if (c === 's' && p.found && p.found[i] !== undefined) c = 'f';
  if (p.how === 'meaning' && !GW) c = c === 'f' ? 'sp' : (c === 's' ? 'sp' : c);
  return c;
}
const CW = { s: 'looked, nothing', f: 'looked, maybe', t: 'out of date', w: 'no record', h: 'not yours to see', n: 'doesn’t apply', sp: 'spelling only' };
function tally() {
  let looked = 0, all = 0, cant = 0;
  Q.places.forEach(p => { for (let i = 0; i < M; i++) { const c = code(p, i); if (c === 'n') continue; all++; if (['s', 'f', 'sp'].includes(c)) looked++; else cant++; } });
  return { looked, all, cant };
}
function howChip(p) {
  if (p.how === 'meaning') return GW ? `<span class="pchip">${ic('pencil-line', 10)}by meaning · model</span>` : `<span class="ichip">${ic('circle-slash', 10)}spelling only</span>`;
  if (p.how === 'keys') return `<span class="ichip">by keys</span>`;
  if (p.how === 'words') return `<span class="ichip">by spelling</span>`;
  return '';
}
function render() {
  const t = tally();
  $('#verdict').textContent = 'No report of damp found. That isn’t the same as none.';
  $('#vsub').innerHTML = `Across these seven places I checked <b>${t.looked} of ${t.all}</b> months this year (<b>${pct(t.looked, t.all)}%</b>) and found no report. ${GW ? 'One note in June <b>might</b> be about damp: that is the model’s reading, in pencil. ' : 'Without the model I matched the word “damp” only, so a note that says “condensation” would be missed. '}The other ${t.cant} I couldn’t look in, and each says why.`;
  const head = `<span></span>` + Q.months.map(m => `<span class="mh">${esc(m)}</span>`).join('');
  const rows = Q.places.map((p, r) => {
    let cells = '';
    for (let i = 0; i < M; i++) {
      const c = code(p, i);
      const inner = c === 'w' ? '<svg viewBox="0 0 28 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 2 L6 10 L10 2 L14 10 L18 2 L22 10 L26 2"/></svg>' : (c === 'h' && i === 0 ? ic('lock', 12) : '');
      cells += `<span class="c ${c}${i === M - 1 ? ' now' : ''}" title="${esc(p.n)}, ${esc(Q.months[i])}: ${CW[c]}" role="img" aria-label="${esc(Q.months[i])}: ${CW[c]}" style="transition-delay:calc(${i} * var(--motion-instant) + ${r} * var(--motion-instant) / 2)">${inner}</span>`;
    }
    return `<button class="pl${sel === r ? ' sel' : ''}" data-p="${r}">${esc(p.n)}<span>${esc(p.where)} ${howChip(p)}</span></button>${cells}`;
  }).join('');
  $('#chart').style.setProperty('--m', M);
  $('#chart').innerHTML = head + rows;
  $$('#chart [data-p]').forEach(b => b.addEventListener('click', () => { sel = +b.dataset.p; render(); }));
  $('#legend').innerHTML = [['s', 'looked, found nothing'], ...(GW ? [['f', 'looked, found something maybe']] : [['sp', 'looked by spelling only']]), ['t', 'out of date'], ['w', 'no record'], ['h', 'not yours to see'], ['n', 'doesn’t apply']]
    .map(([c, w]) => c === 'f' ? `<span><i style="border:1px dashed var(--x-proposed-pencil);border-radius:var(--radius-pill);background:var(--x-proposed-pencil-wash);width:var(--space-3);height:var(--space-3)"></i>${w}</span>` : `<span><i class="c ${c}" style="min-height:0;opacity:1">${c === 'w' ? '<svg viewBox="0 0 28 12" preserveAspectRatio="none" aria-hidden="true" style="height:100%"><path d="M2 2 L6 10 L10 2 L14 10 L18 2 L22 10 L26 2"/></svg>' : ''}</i>${w}</span>`).join('');
  right();
}
function right() {
  const turns = [
    { r: 5, m: mark('hidden'), t: `Ask ${P('joy').n} to look`, s: `The home keeps its own maintenance log on the ${F('upton').n} floor. If ${P('joy').n.split(' ')[0]} looks and finds nothing, this becomes <b style="display:inline;font-size:inherit">none: ${esc(P('joy').n)} checked</b>, a fact.`, b: `${ic('message-square', 14)}Ask ${P('joy').n.split(' ')[0]} to check`, p: true },
    { r: 3, m: mark('stale'), t: 'Read Corvane’s reports since June', s: `Last read in May. ${P('lena').n} keeps them; a Triage job would read the six since.`, b: `${ic('list-checks', 14)}Make a Triage job` },
    { r: 4, m: mark('norecord'), t: 'January to March phone log', s: 'Lost when the depot inbox moved. Nobody can look there now, so the answer can never be complete for those months.', b: null },
    { r: 6, m: mark('na'), t: 'Site survey', s: 'Done once a year, in September; it only counts for that month.', b: null },
  ];
  const hit = Q.places[2];
  $('#right').innerHTML = `<h2>To turn “not found” into “none”</h2><p class="lede">A search that finds nothing is only as good as where it looked. These would close the rest, most useful first.</p>` +
    turns.map(x => `<div class="turn${sel === x.r ? ' sel' : ''}">${x.m}<span><b>${esc(x.t)}</b>${x.s}</span>${x.b ? `<button class="btn${x.p ? ' primary' : ''}">${x.b}</button>` : ''}</div>`).join('') +
    (GW ? `<div class="hit pbox"><span class="pchip">${ic('pencil-line', 10)}maybe · model</span><br>Inspection notes, June: <q>${esc(hit.found['5'])}</q>. The model thinks this could be damp. Not counted as a report until someone says so. <br><button class="btn" style="margin-top:var(--space-2)">${ic('file-text', 14)}Open the note</button></div>`
        : `<div class="hit" style="border:1px solid var(--hairline);border-radius:var(--radius-key)"><span class="ichip">${ic('circle-slash', 10)}model gateway off</span><br>Inspection notes were matched by spelling only: “damp”, “mould”, “mold”. ${esc(DATA.gateway.offWhy)}</div>`);
}
function play() {
  clearTimers(); sel = 5;
  document.body.classList.add('pre'); render();
  later(() => document.body.classList.remove('pre'), 1200);
}
wireCommon(play);
gwHooks.push(() => render());
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { sel = Math.min(Q.places.length - 1, sel + 1); render(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); render(); e.preventDefault(); }
});
play();
</script>
</body>
</html>
