  $$('[data-gw]').forEach(b => b.addEventListener('click', () => setGateway(!GW)));
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.matches('input,textarea')) return;
    const k = e.key.toLowerCase();
    if (k === 'r') { replay(); }
    if (k === 't') { setTech(!document.body.classList.contains('tech')); }
    if (k === 'g') { setGateway(!GW); }
  });
  setGateway(GW);
}

const Q = DATA.q1;
$('#chrome').outerHTML = chrome(Q, `<span class="ichip">${ic('calendar', 11)}since spring = ${esc(Q.since.pick)}</span>`);
$('#foot').innerHTML = hints([['1–6', 'pick a row'], ['G', 'model gateway'], ['T', 'technical words'], ['R', 'replay']]);

/* the groups, in the order the strip reads */
const GROUPS = [
  { id: 'silent', st: 'ok', label: 'not heard from', list: () => SUP().filter(s => s.st === 'ok' && s.silent), cls: 'c-silent', covered: true },
  { id: 'none', st: 'none', label: 'checked: none', list: () => byState('none'), cls: 'c-none', covered: true },
  { id: 'heard', st: 'ok', label: 'heard from', list: () => SUP().filter(s => s.st === 'ok' && !s.silent), cls: 'c-heard', covered: true },
  { id: 'gap', st: 'gap', label: 'not known yet', list: () => byState('gap'), cls: 'c-gap' },
  { id: 'stale', st: 'stale', label: 'out of date', list: () => byState('stale'), cls: 'c-stale' },
  { id: 'norecord', st: 'norecord', label: 'no record', list: () => byState('norecord'), cls: 'c-norecord' },
  { id: 'na', st: 'na', label: 'doesn’t apply', list: () => byState('na'), cls: 'c-na' },
  { id: 'hidden', st: 'hidden', label: 'not yours to see', list: () => byState('hidden'), cls: 'c-hidden' },
];
const ROWS = [
  { g: 'gap', say: n => `<b>Not known yet.</b><span>Nobody has recorded when we last heard from them. Their contract managers could say.</span>`, act: 'Ask them' },
  { g: 'stale', say: n => `<b>Out of date.</b><span>Their last contact was before March, but their reports were last read in May or June.</span>`, act: 'Read again' },
  { g: 'norecord', say: n => `<b>No record.</b><span>The depot inbox for January to April was lost when it moved. Nobody can close this.</span>`, act: 'Why' },
  { g: 'hidden', say: () => `<b>Not yours to see.</b><span>Kept on the Finance team floor. I can’t say how many. Ask ${esc(P('dev').n)}.</span>`, act: 'Ask for access' },
  { g: 'na', say: n => `<b>Don’t apply.</b><span>Their contracts ended before 1 March, so the question doesn’t fit them.</span>`, act: 'Include' },
  { g: 'none', say: n => `<b>Checked: none.</b><span>${esc(P('priya').n)} checked and counted them in. A person said so; it is a fact.</span>`, act: 'See' },
];
const G = id => GROUPS.find(g => g.id === id);
let sel = null;

function render() {
  const ans = silentKnown().length, ap = applies().length, cov = answered().length;
  $('#n').textContent = ans;
  $('#w').textContent = `suppliers we haven’t heard from since ${Q.since.pick}`;
  $('#sub').innerHTML = `<b>${G('silent').list().length}</b> from their last invoice, meeting note or call, and <b>${byState('none').length}</b> that ${esc(P('priya').n)} checked. <b>Maybe more:</b> this answer doesn’t cover every supplier.`;
  $('#say').innerHTML = `It covers <b>${cov} of the ${ap} suppliers</b> it applies to (<b>${pct(cov, ap)}%</b>). For <b>${ap - cov}</b> I can’t say yet, and there are <b>some</b> I can’t see.`;
  $('#strip').innerHTML = GROUPS.map((g, gi) => {
    const L = g.list(), n = g.id === 'hidden' ? 4 : L.length;
    const cells = g.id === 'hidden' ? `<span class="cell ${g.cls}" style="transition-delay:calc(${gi} * var(--motion-quick))"></span>`
      : L.map((s, i) => `<span class="cell ${g.cls}" title="${esc(s.n)}: ${esc(whyLine(s))}" style="transition-delay:calc(${gi} * var(--motion-quick) + ${i} * var(--motion-instant) / 4)">${g.id === 'norecord' ? '<svg viewBox="0 0 10 40" preserveAspectRatio="none" aria-hidden="true"><path d="M5 0 L9 8 L1 16 L9 24 L1 32 L5 40"/></svg>' : ''}</span>`).join('');
    return `<div class="grp${sel === g.id ? ' sel' : ''}" style="--n:${n}" data-g="${g.id}"><span class="gl"><b>${g.id === 'hidden' ? 'some' : L.length}</b> ${esc(g.label)}</span><div class="cells" role="img" aria-label="${g.id === 'hidden' ? 'some' : L.length} ${esc(g.label)}">${cells}</div>${braceFor(g)}</div>`;
  }).join('');
  $('#rows').innerHTML = ROWS.map((r, i) => {
    const g = G(r.g), n = g.list().length;
    return `<li><button data-row="${r.g}" class="${sel === r.g ? 'sel' : ''}" aria-pressed="${sel === r.g}"><span>${mark(g.st)}</span><span class="ct">${r.g === 'hidden' ? 'some' : n}</span><span class="tx">${r.say(n)}</span><span class="act">${esc(r.act)}<span class="kbd">${i + 1}</span></span></button></li>`;
  }).join('');
  $$('#rows [data-row]').forEach(b => b.addEventListener('click', () => pick(b.dataset.row)));
  renderRight();
}
function braceFor(g) {
  const kind = g.covered ? 'cov' : ['gap', 'stale', 'norecord'].includes(g.id) ? 'cant' : 'out';
  const lab = g.id === 'silent' ? `covered <b>${answered().length}</b>` : g.id === 'gap' ? `can’t say <b>${applies().length - answered().length}</b>` : g.id === 'na' ? 'outside the base' : '&nbsp;';
  return `<span class="ub ${kind}">${lab}</span>`;
}
function renderRight() {
  const R = $('#right');
  const steps = `<div class="wk"><p class="eyebrow" style="margin-bottom:var(--space-1)">How I got here</p><ul class="steps">
    <li><span>“Since spring” read as ${esc(Q.since.pick)}<span class="sx">${esc(Q.since.why)}; ${esc(Q.since.alt)} if you mean ${esc(Q.since.altWhy)}</span></span><span class="ichip">without model</span></li>
    <li><span>“Heard from” = ${Q.heard.kinds.map(esc).join(', ')}<span class="sx">words the desk knows, kept by ${esc(P(Q.heard.keptBy).n)}</span></span><span class="ichip">without model</span></li>
    <li><span>Counted ${applies().length} suppliers, ${answered().length} answered<span class="sx">matched by keys and names</span></span><span class="ichip">without model</span></li>
    <li class="gw"><span>Read minutes and plans for likely contact<span class="sx on">${SUP().filter(s => s.guess).length} guesses in pencil, not counted</span><span class="sx off">off: ${esc(DATA.gateway.offWhy)}</span></span><span class="pchip">${ic('pencil-line', 10)}model</span></li>
  </ul></div>`;
  if (!sel) { R.innerHTML = `<h2>${ic('book-open', 18)}Pick a row</h2><p class="lede">Each row says why the answer stops short there, who could fill it, and what it would take.</p><div style="flex:1"></div>${steps}`; return; }
  const g = G(sel), L = g.list();
  const head = { gap: 'Who could fill these', stale: 'Out of date', norecord: 'No record', hidden: 'Not yours to see', na: 'Don’t apply', none: 'Checked: none' }[sel];
  let list = '';
  if (sel === 'hidden') {
    list = `<li><span class="unseen">${ic('lock', 12)}some suppliers</span><span>Kept on the ${esc(F('finance').n)} team floor, which you can’t open. I won’t say how many, because the count itself is theirs to share.</span><span>Ask <b style="display:inline;font-size:inherit">${esc(P('dev').n)}</b>, ${esc(P('dev').role)}.</span></li>`;
  } else {
    list = L.map(s => `<li><b>${esc(s.n)}</b><span>${whyLine(s)}.</span>${s.guess ? `<span class="g pencil-only"><span class="pchip">${ic('pencil-line', 10)}guess</span><span class="pencil">${esc(s.guess.v)}</span><span>from ${esc(s.guess.from)}; not counted</span></span>` : ''}</li>`).join('');
  }
  const acts = {
    gap: `<button class="btn primary">${ic('list-checks', 14)}Make a Triage job · ${L.length} questions</button><button class="btn">${ic('message-square', 14)}Ask ${esc(P('marcus').n.split(' ')[0])}</button>`,
    stale: `<button class="btn primary">${ic('refresh-cw', 14)}Ask ${esc(P('lena').n.split(' ')[0])} to read them again</button>`,
    norecord: `<button class="btn" disabled title="No record can't be closed">${ic('ban', 14)}Nobody can close this</button>`,
    hidden: `<button class="btn primary">${ic('key-round', 14)}Ask ${esc(P('dev').n.split(' ')[0])} for access</button>`,
    na: `<button class="btn">${ic('plus', 14)}Count ended contracts too</button>`,
    none: `<button class="btn">${ic('file-text', 14)}See ${esc(P('priya').n.split(' ')[0])}’s check</button>`,
  }[sel];
  R.innerHTML = `<h2>${mark(g.st)}${esc(head)}</h2><p class="lede">${esc(E(g.st).line)}</p><ul class="who">${list}</ul><div class="acts">${acts}</div>${steps}`;
}
function pick(id) { sel = sel === id ? null : id; render(); }

function play() {
  clearTimers(); sel = null;
  document.body.classList.add('pre'); render();
  later(() => document.body.classList.remove('pre'), 1200);
  later(() => { sel = 'gap'; render(); }, 2600);
}
wireCommon(play);
gwHooks.push(() => renderRight());
addEventListener('keydown', e => { const n = +e.key; if (n >= 1 && n <= ROWS.length) pick(ROWS[n - 1].g); });
play();
</script>
</body>
</html>
