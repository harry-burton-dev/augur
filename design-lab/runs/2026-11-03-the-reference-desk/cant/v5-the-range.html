}
function wireCommon(replay) {
  $$('[data-tech]').forEach(b => b.addEventListener('click', () => setTech(!document.body.classList.contains('tech'))));
  $$('[data-gw]').forEach(b => b.addEventListener('click', () => setGateway(!GW)));
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.matches('input,textarea')) return;
    const k = e.key.toLowerCase();
    if (k === 'r') { replay(); }
    if (k === 't') { setTech(!document.body.classList.contains('tech')); }
    if (k === 'g') { setGateway(!GW); }
  });
  setGateway(GW);
}

const Q = DATA.q1;
$('#chrome').outerHTML = chrome(Q, `<span class="ichip">${ic('calendar', 11)}since spring = ${esc(Q.since.pick)}</span>`);
let sel = null;

const cert = () => silentKnown();
const poss = () => applies().filter(s => ['gap', 'stale', 'norecord'].includes(s.st));
const out = () => applies().filter(s => s.st === 'ok' && !s.silent);
/* ways to narrow, by who could answer; no record can't be narrowed */
function ways() {
  const by = {};
  poss().filter(s => s.st !== 'norecord').forEach(s => (by[s.keeper] = by[s.keeper] || []).push(s));
  const W = Object.keys(by).map(k => ({ id: k, t: `Ask ${P(k).n}`, s: `${P(k).role}. ${by[k].filter(x => x.st === 'gap').length} not known yet, ${by[k].filter(x => x.st === 'stale').length} out of date.`, L: by[k] }))
    .sort((a, b) => b.L.length - a.L.length);
  W.push({ id: 'norecord', t: 'The lost inbox', s: 'January to April. Nobody can close these, so the range never gets narrower than this.', L: byState('norecord'), fixed: true });
  return W;
}
function render() {
  const c = cert().length, p = poss().length, o = out().length, n = c + p + o;
  const g = SUP().filter(s => s.guess).length;
  $('#range').innerHTML = `<span class="n">${c}</span><span class="dash">to</span><span class="n">${c + p}</span><span class="w">suppliers we haven’t heard from since ${esc(Q.since.pick)}</span>`;
  $('#rsub').innerHTML = `<b>At least ${c}</b>, from the record. <b>Up to ${p} more</b> I can’t rule in or out. And <b>some</b> I can’t see, which could lift the top end.`;
  const L = $('#line'); L.style.setProperty('--n', n);
  const order = [...cert().map(s => ['cert', s]), ...poss().map(s => ['poss', s]), ...out().map(s => ['out', s])];
  const hl = sel ? (ways().find(w => w.id === sel) || { L: [] }).L : [];
  const slots = order.map(([k, s], i) => {
    const cls = k === 'cert' ? `cert${s.st === 'none' ? ' nn' : ''}` : k === 'out' ? 'out' : s.st;
    const inner = s.st === 'norecord' ? '<svg viewBox="0 0 10 40" preserveAspectRatio="none" aria-hidden="true"><path d="M5 0 L9 8 L1 16 L9 24 L1 32 L5 40"/></svg>' : '';
    return `<span class="slot ${cls}${hl.includes(s) ? ' hl' : ''}" style="grid-column:${i + 1};transition-delay:calc(${i} * var(--motion-instant) / 3)" title="${esc(s.n)}: ${esc(whyLine(s))}">${inner}</span>`;
  }).join('');
  // the model's guess, in its own lane above, never on the line of facts
  const gx = c + p - g;
  L.innerHTML = `
    <span class="ptick pencil-only" style="grid-column:${gx + 1} / span ${Math.min(10, n - gx)}"><span><span class="pchip">${ic('pencil-line', 10)}guess · model</span>about ${gx}: it thinks ${g} of the ${p} were heard from</span></span>
    <span class="brk cert" style="grid-column:1 / span ${c}"><b>certain ${c}</b></span>
    <span class="brk poss" style="grid-column:${c + 1} / span ${p};transition-delay:var(--motion-base)"><b>can’t say ${p}</b></span>
    ${slots}
    <span class="tail" style="grid-column:${n + 1}" title="some kept on the Finance team floor">${ic('lock', 12)}</span>
    <span class="axis" style="grid-column:1 / span ${c}"><b>0</b> to <b>${c}</b> · from the record</span>
    <span class="axis" style="grid-column:${c + 1} / span ${p}"><b>${c + p}</b> at most, as far as I can see</span>
    <span class="axis" style="grid-column:${c + p + 1} / span ${o}">${o} heard from: ruled out</span>
    <span class="axis" style="grid-column:${n + 1}"><span class="some">some</span> hidden</span>`;
  $('#narrow').innerHTML = ways().map((w, i) => {
    const k = w.L.length;
    return `<button class="nr${sel === w.id ? ' sel' : ''}${w.fixed ? ' fixed' : ''}" data-w="${w.id}"><span><b>${esc(w.t)}</b>${esc(w.s)}</span><span class="shr" role="img" aria-label="narrows by ${w.fixed ? 0 : k}"><i style="width:${w.fixed ? 0 : 100 * k / p}%"></i></span><span class="by">${w.fixed ? 'never' : '−' + k} <span class="kbd">${i + 1}</span></span></button>`;
  }).join('');
  $$('#narrow [data-w]').forEach(b => b.addEventListener('click', () => pick(b.dataset.w)));
  side();
}
function side() {
  const g = SUP().filter(s => s.guess);
  $('#side').innerHTML = `<h3 class="eyebrow">Ink and pencil</h3>
    <div class="card"><span class="ichip">${ic('file-text', 10)}from the record</span><span><b>The line is ink.</b> Every slot on it is a supplier, and its mark says why it sits where it does: answered, not known yet, out of date or no record. Counted without the model.</span></div>
    ${GW ? `<div class="card pbox"><span class="pchip">${ic('pencil-line', 10)}guess · model</span><span><b>The tick above the line is pencil.</b> The model read minutes, plans and a payments export, and thinks ${g.map(s => esc(s.n)).join(', ')} were heard from. It never moves the line; confirming one does.</span></div>`
         : `<div class="card"><span class="ichip">${ic('circle-slash', 10)}model gateway off</span><span><b>No pencil lane.</b> The range is the same without the model: ${cert().length} to ${cert().length + poss().length}. ${esc(DATA.gateway.offWhy)}</span></div>`}`;
}
function pick(id) { const w = ways().find(x => x.id === id); if (w && w.fixed) { sel = sel === id ? null : id; } else sel = sel === id ? null : id; render(); }
function play() {
  clearTimers(); sel = null;
  document.body.classList.add('pre'); render();
  later(() => document.body.classList.remove('pre'), 1200);
  later(() => pick(ways()[0].id), 2700);
}
$('#foot').innerHTML = hints([['1–' + ways().length, 'pick a way to narrow it'], ['G', 'model gateway'], ['T', 'technical words'], ['R', 'replay']]);
wireCommon(play);
gwHooks.push(() => side());
addEventListener('keydown', e => { const n = +e.key; const W = ways(); if (n >= 1 && n <= W.length) pick(W[n - 1].id); });
play();
</script>
</body>
