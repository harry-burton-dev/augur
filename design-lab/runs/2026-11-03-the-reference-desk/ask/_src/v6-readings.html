<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The ask · V6 · Readings side by side</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
/* ---- V6: don't ask, show. Three readings of the question side by side; the rows that differ are the question ---- */
.askline{display:flex;align-items:center;gap:var(--space-3);border-bottom:1px solid var(--hairline-strong);padding:0 0 var(--space-2);margin-bottom:var(--space-3)}
.askline input{flex:1;background:none;border:0;outline:0;font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light);min-width:0}
.lede{margin:0 0 var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.lede b{font-weight:400;color:var(--ink)}
.reads{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4)}
.rd{min-height:0;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-radius:var(--radius-card);border:1px solid var(--hairline);background:var(--surface-pane);transition:opacity var(--motion-calm) var(--ease-standard),border-color var(--motion-calm) var(--ease-standard)}
.rd.model{border:1px dashed color-mix(in srgb,var(--info) 35%,transparent)}
.rd.chosen{border:1px solid var(--x-proposed-here);box-shadow:0 0 var(--glow-blur) var(--x-proposed-here-soft)}
.rd.other{opacity:var(--x-proposed-quiet)}
.rd .h{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2)}
.rd .h .nm{font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.rd .s{margin:0;font:300 var(--type-meta)/var(--leading-meta) var(--font-sans);min-height:calc(var(--leading-meta) * 3)}
.rd.model:not(.chosen) .s{color:var(--x-proposed-guess);font-style:italic}
.rd.model:not(.chosen) .s .ph.set{color:var(--x-proposed-guess);border-bottom:1px dashed color-mix(in srgb,var(--info) 45%,transparent)}
.rd .n{display:flex;align-items:baseline;gap:var(--space-2);border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.rd .n b{font:200 var(--type-title)/1 var(--font-sans);color:var(--light)}
.rd .n span{font-size:var(--type-small);color:var(--ink-muted)}
.rd .rows{flex:1;min-height:0}
.rd .row{min-height:calc(var(--target-sm) - var(--space-2));font-size:var(--type-small)}
.rd .row.diff{box-shadow:inset 2px 0 0 var(--x-proposed-loose)}
.rd .row.diff .d{color:var(--x-proposed-loose)}
.rd .row.same{color:var(--ink-muted)}
.rd .pick{display:flex;gap:var(--space-2)}
.sep{margin-top:var(--space-3);margin-bottom:var(--space-2);display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:var(--space-2) var(--space-4);align-items:start;padding-top:var(--space-3);border-top:1px solid var(--hairline-strong)}
.sep .t{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.sep .c{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.sep .c q{color:var(--x-proposed-loose)}
.sep .c b{font-weight:400;color:var(--ink)}
.sep .c.same q{color:var(--ink-muted)}
@media (max-height:840px){.rd .s{min-height:calc(var(--leading-meta) * 3);font-size:var(--type-small);line-height:var(--leading-small)}.rd .n b{font-size:var(--type-title-s)}.lede{margin-bottom:var(--space-2)}}
</style>
</head>
<body>
<div class="app"><div id="rail"></div><main class="main" id="main"></main></div>
<div id="keys"></div>
<div class="x-cap"><b>The ask · V6</b> readings side by side and the rows they disagree on · "explain the SQL" studies, Query by Example</div>
<script>
/*@DATA*/
/*@ENGINE*/
const ic = Shell.ic, W = Q.WORDS;
const SENT = ['invoice', 'delivery', 'letter'], ANY = DATA.contacts.filter(c => !c.far).map(c => c.id), ALL = DATA.contacts.map(c => c.id);
/* with the gateway: the model drafts readings in plain words (guesses). Without it: the narrowest, middle and widest
   choices the record allows. Either way the rows and counts come from the record. */
const MODEL = [
  { c: { since: W.since.opts[1].id, via: new Set(SENT), kind: 'live', who: 'here' } },
  { c: { since: W.since.opts[2].id, via: new Set(SENT), kind: 'live', who: 'all' } },
  { c: { since: W.since.opts[0].id, via: new Set(ANY), kind: 'all', who: 'all' } }
];
const RULE = [
  { c: { since: W.since.opts[0].id, via: new Set(['invoice']), kind: 'live', who: 'here' }, tag: 'narrowest' },
  { c: { since: W.since.opts[1].id, via: new Set(SENT), kind: 'live', who: 'all' }, tag: 'middle' },
  { c: { since: W.since.opts[2].id, via: new Set(ALL), kind: 'all', who: 'all' }, tag: 'widest' }
];
const st = { gw: DATA.gateway.on, chosen: -1, shown: true };
document.getElementById('rail').outerHTML = Shell.rail();
document.getElementById('keys').innerHTML = Shell.keys([['A B C', 'take a reading'], ['E', 'edit the one you took'], ['K', 'keep all three'], ['G', 'model gateway on/off'], ['T', 'technical words'], ['R', 'replay']]);
function readings() {
  const src = st.gw ? MODEL : RULE;
  /* smallest answer first: order by size, never by how likely the model thinks it is */
  return src.map(x => Object.assign({}, x, { r: Q.run(x.c) })).sort((a, b) => a.r.quiet.length - b.r.quiet.length);
}
function render() {
  const R = readings();
  const sets = R.map(x => new Set(x.r.quiet.map(q => q.s.id)));
  const inAll = id => sets.every(s => s.has(id));
  const L = 'ABC';
  const card = (x, i) => {
    const model = st.gw, chosen = st.chosen === i, other = st.chosen >= 0 && !chosen;
    const rows = x.r.quiet.map(q => { const d = !inAll(q.s.id); const where = sets.map((s, k) => s.has(q.s.id) ? L[k] : null).filter(Boolean).join(', ');
      return `<li class="row ${d ? 'diff' : 'same'}"><span>${Q.esc(q.s.name)}</span><span class="d">${d ? `only in ${where}` : q.any ? (q.last ? Q.fmt(q.last, true) : 'nothing counted') : `${Shell.never()} none recorded`}</span></li>`; }).join('');
    const diffs = x.r.quiet.filter(q => !inAll(q.s.id)).length;
    return `<section class="rd ${model ? 'model' : ''} ${chosen ? 'chosen' : ''} ${other ? 'other' : ''}" aria-label="Reading ${L[i]}">
      <div class="h"><span class="nm">Reading ${L[i]}</span>${chosen ? Shell.via('you', 'you took this') : model ? Shell.via('model', 'model’s reading') : Shell.via('rule', 'from the choices')}</div>
      <p class="s">${Q.sentenceHtml(x.c)}</p><p class="tk">${Q.esc(Q.tech(x.c))}</p>
      <div class="n"><b>${x.r.quiet.length}</b><span>suppliers · ${diffs} not in every reading</span></div>
      <ul class="rows scroll">${rows}${x.r.unseen ? `<li class="row same"><span class="unseen">${ic('lock', 11)}some on ${Q.esc(DATA.elsewhere[0].name)}</span><span class="d">ask ${Q.esc(DATA.elsewhere[0].ask)}</span></li>` : ''}</ul>
      <div class="pick"><button class="btn ${chosen ? '' : 'primary'}" data-pick="${i}"><span class="kbd">${L[i]}</span>${chosen ? 'Taken' : 'This one'}</button>${chosen ? `<button class="btn">${ic('pencil')}Change one word</button>` : ''}</div></section>`;
  };
  /* what separates the readings, word by word */
  const sep = Q.ORDER.map(w => { const vals = R.map(x => Q.phrase(x.c, w)); const same = vals.every(v => v === vals[0]);
    return `<div class="c ${same ? 'same' : ''}"><q>${Q.esc(W[w].word)}</q> ${same ? 'reads the same in all three' : vals.map((v, k) => `<br><b>${L[k]}</b> ${Q.esc(v)}`).join('')}</div>`; }).join('');
  document.getElementById('main').innerHTML = `<div class="top"><div><p class="eyebrow">${Q.esc(DATA.floor.name)} · front page</p><h1>Ask</h1></div>${contentsHtml()}</div>
    <div class="askline">${ic('search', 18)}<input aria-label="Ask in your own words" value="${Q.esc(DATA.question)}">${Shell.gatewayLine(st.gw)}</div>
    ${st.shown ? `<p class="lede"><span>Your question can be read more than one way, and the answers differ. <b>Here are three, smallest answer first, none marked as right.</b> The rows edged in amber are where they disagree.</span>
      ${st.gw ? `<span>${Shell.via('model', 'readings worded by the model')} ${Shell.via('record', 'rows and counts from the record')}</span>` : `<span>${Shell.via('rule', 'three spread-apart sets of the record’s own choices')}</span>`}</p>
    <div class="reads">${R.map(card).join('')}</div>
    <div class="sep"><span class="t">What separates them</span>${sep}</div>` : ''}`;
  document.body.classList.toggle('tech', !!st.tech);
}
document.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; Demo.stop(); if (b.dataset.pick) { st.chosen = st.chosen === +b.dataset.pick ? -1 : +b.dataset.pick; render(); } });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'r') { replay(); return; }
  Demo.stop();
  if (k === 'g') { st.gw = !st.gw; st.chosen = -1; render(); }
  else if (k === 't') { st.tech = !st.tech; render(); }
  else if ('abc'.includes(k)) { st.chosen = 'abc'.indexOf(k); render(); }
  else if (k === 'k') { st.chosen = -1; render(); }
});
function replay() {
  Object.assign(st, { chosen: -1, shown: false }); render();
  Demo.play([[Tok.ms('--motion-run'), () => { st.shown = true; render(); }], [Tok.ms('--motion-calm') * 2, () => { st.chosen = 1; render(); }]]);
}
replay();
</script>
</body>
</html>
