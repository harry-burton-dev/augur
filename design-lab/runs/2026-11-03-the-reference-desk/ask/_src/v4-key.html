<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The ask · V4 · The key</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS*/
/* ---- V4: an identification key. Couplets ordered by how much they split; a choice that changes nothing is skipped and says so ---- */
.askline{display:flex;align-items:center;gap:var(--space-3);border-bottom:1px solid var(--hairline-strong);padding:0 0 var(--space-2);margin-bottom:var(--space-5)}
.askline input{flex:1;background:none;border:0;outline:0;font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light);min-width:0}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,min(calc(var(--measure-glance) - var(--space-4)),40%));gap:var(--space-6)}
.key{min-height:0;position:relative}
.key h2,.spec h2{margin:0 0 var(--space-3);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);display:flex;justify-content:space-between;gap:var(--space-3)}
.cpl{display:grid;grid-template-columns:calc(var(--space-5) + var(--space-1)) minmax(0,1fr);gap:0 var(--space-2);padding:var(--space-2) 0 var(--space-3);position:relative}
.cpl + .cpl{border-top:1px solid var(--hairline)}
.cpl .no{font:200 var(--type-heading)/1 var(--font-sans);color:var(--ink-muted);padding-top:var(--space-1)}
.cpl.now .no{color:var(--light)}
.cpl .w{margin:0 0 var(--space-1);font-size:var(--type-small);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:center}
.cpl .w q{color:var(--x-proposed-loose)}
.lead{display:grid;grid-template-columns:var(--space-4) auto minmax(var(--space-4),1fr) auto calc(var(--space-7) - var(--space-2));align-items:baseline;gap:var(--space-2);width:100%;min-height:var(--target-sm);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);color:var(--ink);font-size:var(--type-body)}
.lead:hover{background:var(--surface-raised)}
.lead .l{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.lead .dots{border-bottom:1px dotted var(--hairline-strong);transform:translateY(calc(var(--space-1) * -1))}
.lead .c{font:400 var(--type-meta)/1 var(--font-mono);color:var(--ink)}
.lead .to{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);text-align:right;white-space:nowrap}
.lead small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.lead .t{text-align:left}
/* the lit path: the chosen lead glows, the others step back */
.cpl.done .lead{color:var(--ink-muted)}
.cpl.done .lead .c{color:var(--ink-muted)}
.cpl.done .lead.on{color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.cpl.done .lead.on .c,.cpl.done .lead.on .l{color:var(--x-proposed-lit)}
.cpl.later{opacity:var(--x-proposed-quiet)}
.cpl.same .lead{color:var(--ink-muted)}
.cpl.same .note{grid-column:2;font-size:var(--type-small);color:var(--ink-muted);margin:0;display:flex;gap:var(--space-2);align-items:center}
.how{margin:var(--space-3) 0 0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:flex;gap:var(--space-2);align-items:flex-start;max-width:var(--measure-read)}
.spec{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-5);border:1px solid var(--hairline);border-radius:var(--radius-card);background:var(--surface-pane)}
.spec .s{margin:0;font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--ink-muted)}
.spec .n{display:flex;align-items:baseline;gap:var(--space-3);margin:0}
.spec .n b{font:200 var(--type-title)/1 var(--font-sans);color:var(--light)}
.spec .n span{font-size:var(--type-meta);color:var(--ink-muted)}
.spec .rows{flex:1;min-height:0}
.row.unseenrow{background:var(--x-proposed-unseen);color:var(--ink-muted)}
.spec .acts{display:flex;gap:var(--space-2)}
@media (max-height:840px){.lead small{display:none}.cpl{padding-bottom:var(--space-2)}}
</style>
</head>
<body>
<div class="app"><div id="rail"></div><main class="main" id="main"></main></div>
<div id="keys"></div>
<div class="x-cap"><b>The ask · V4</b> the key: couplets ordered by how much they split, no model · identification keys, Twenty Questions</div>
<script>
/*@DATA*/
/*@ENGINE*/
const ic = Shell.ic, W = Q.WORDS;
/* each loose word as a couplet: two or three leads, each a plain-words choice */
const LEADS = {
  via: [{ t: 'Only things they sent', sub: 'an invoice, a delivery note or a filed letter', v: ['invoice', 'delivery', 'letter'] }, { t: 'Anything that names them', sub: 'incidents and site visits too', v: ['invoice', 'delivery', 'letter', 'incident', 'contract', 'visit'] }],
  kind: [{ t: 'Only suppliers with a contract live today', v: 'live' }, { t: 'Every supplier on record', v: 'all' }],
  since: W.since.opts.map(o => ({ t: `From ${o.label}`, sub: o.sub, v: o.id })),
  who: [{ t: `Only what ${DATA.floor.name} keeps`, v: 'here' }, { t: 'Everything you can see', sub: 'the Org’s and your teams’ too', v: 'all' }]
};
const st = { c: {}, path: [], gw: DATA.gateway.on };
document.getElementById('rail').outerHTML = Shell.rail();
document.getElementById('keys').innerHTML = Shell.keys([['a b c', 'take a lead'], ['⌫', 'back one couplet'], ['G', 'model gateway on/off'], ['T', 'technical words'], ['R', 'replay']]);
const withLead = (c, w, L) => Object.assign({}, c, { [w]: w === 'via' ? new Set(L.v) : L.v });
const splits = (c, w) => LEADS[w].map(L => Q.count(withLead(c, w, L)));
/* the next couplet is the one whose leads split the answer most: worked out from the record, no model */
function plan() {
  let c = Object.assign({}, st.c); const order = st.path.map(p => p.w);
  const rest = Q.ORDER.filter(w => !order.includes(w));
  const ranked = rest.map(w => { const n = splits(c, w); return { w, n, spread: Math.max(...n) - Math.min(...n) }; }).sort((a, b) => b.spread - a.spread);
  return ranked;
}
function cplHtml(w, i, state, n, chosen) {
  const word = W[w].word;
  if (state === 'same') return `<div class="cpl same"><span class="no">${i}</span><div><p class="w">${ic('equal', 13)}<q>${Q.esc(word)}</q> makes no difference here: every lead leaves ${n[0]}</p>
    ${LEADS[w].map((L, k) => `<button class="lead" data-w="${w}" data-k="${k}"><span class="l">${'abc'[k]}</span><span class="t">${Q.esc(L.t)}</span><span class="dots"></span><span class="c">${n[k]}</span><span class="to">same</span></button>`).join('')}</div></div>`;
  return `<div class="cpl ${state}"><span class="no">${i}</span><div><p class="w">for <q>${Q.esc(word)}</q>${state === 'now' ? ` · ${Shell.via('record', 'split counted from the record')}` : ''}</p>
    ${LEADS[w].map((L, k) => `<button class="lead ${chosen === k ? 'on' : ''}" data-w="${w}" data-k="${k}"><span class="l">${i}${'abc'[k]}</span><span class="t">${Q.esc(L.t)}${L.sub ? `<small>${Q.esc(L.sub)}</small>` : ''}</span><span class="dots"></span><span class="c">${n[k]}</span><span class="to">${state === 'later' ? '' : chosen === k ? 'taken' : i < Q.ORDER.length ? `go to ${i + 1}` : 'answer'}</span></button>`).join('')}</div></div>`;
}
function render() {
  let html = '', c = {};
  st.path.forEach((p, i) => { html += cplHtml(p.w, i + 1, p.same ? 'same' : 'done', splits(c, p.w), p.k); c = withLead(c, p.w, LEADS[p.w][p.k]); });
  const ranked = plan();
  ranked.forEach((r, j) => { html += cplHtml(r.w, st.path.length + j + 1, j === 0 ? 'now' : 'later', r.n, -1); });
  const r = Q.run(st.c), sameN = st.path.filter(p => p.same).length;
  const rows = r.quiet.map(x => `<li class="row ${x.any ? '' : 'never'}"><span>${Q.esc(x.s.name)}</span><span class="d">${x.last ? `last ${Q.fmt(x.last, true)}` : x.any ? `nothing counted · last anything ${Q.fmt(x.any, true)}` : `${Shell.never()} no contact recorded`}</span></li>`).join('')
    + (r.unseen ? `<li class="row unseenrow"><span>${ic('lock', 12)} Some kept on ${Q.esc(DATA.elsewhere[0].name)}</span><span class="d">ask ${Q.esc(DATA.elsewhere[0].ask)}</span></li>` : '');
  document.getElementById('main').innerHTML = `<div class="top"><div><p class="eyebrow">${Q.esc(DATA.floor.name)} · front page</p><h1>Ask</h1></div>${contentsHtml()}</div>
    <div class="askline">${ic('search', 18)}<input aria-label="Ask in your own words" value="${Q.esc(DATA.question)}">${Shell.gatewayLine(st.gw)}</div>
    <div class="cols"><section class="key scroll"><h2><span>Key to your question</span><span>${st.path.length} of ${Q.ORDER.length} · ${sameN ? `${sameN} made no difference` : 'no step needs a model'}</span></h2>${html}
      <p class="how">${ic('info', 14)}<span>Each couplet is one loose word in your question. The next one is the one that splits the answer most, so you choose least. Built from the record by ${Shell.via('rule', 'name and spelling')} and ${Shell.via('record', 'counts')}; ${st.gw ? `the model gateway is on but this page doesn’t use it.` : 'the model gateway is off and nothing here changes.'}</span></p></section>
    <aside class="spec" aria-live="polite"><h2><span>Keyed out so far</span></h2><p class="s">${Q.sentenceHtml(st.c)}</p><p class="tk">${Q.esc(Q.tech(st.c))}</p>
      <p class="n"><b>${r.quiet.length}</b><span>suppliers</span></p><ul class="rows scroll">${rows}</ul>
      <div class="acts"><button class="btn primary">${ic('arrow-right')}Open the answer</button><button class="btn">${ic('bookmark')}Save the key</button></div></aside></div>`;
  document.body.classList.toggle('tech', !!st.tech);
}
function take(w, k) {
  const at = st.path.findIndex(p => p.w === w);
  if (at >= 0) { st.path = st.path.slice(0, at); rebuild(); }
  const n = splits(st.c, w); const same = n.every(x => x === n[0]);
  st.path.push({ w, k, same }); rebuild();
  /* a couplet that can't change the answer is taken for you, and says so */
  const nx = plan()[0]; if (nx && nx.spread === 0) { st.path.push({ w: nx.w, k: LEADS[nx.w].length - 1, same: true }); rebuild(); }
  render();
}
function rebuild() { let c = {}; st.path.forEach(p => { c = withLead(c, p.w, LEADS[p.w][p.k]); }); st.c = c; }
document.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; Demo.stop(); if (b.dataset.w) take(b.dataset.w, +b.dataset.k); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'r') { replay(); return; }
  Demo.stop();
  if (k === 'g') { st.gw = !st.gw; render(); }
  else if (k === 't') { st.tech = !st.tech; render(); }
  else if (k === 'backspace') { st.path.pop(); while (st.path.length && st.path[st.path.length - 1].same) st.path.pop(); rebuild(); render(); }
  else if (/^[abc]$/.test(k)) { const nx = plan()[0]; if (nx && LEADS[nx.w][' abc'.indexOf(k) - 1]) take(nx.w, 'abc'.indexOf(k)); }
});
function replay() {
  Object.assign(st, { c: {}, path: [] }); render();
  const beat = Tok.ms('--motion-slow');
  Demo.play([
    [Tok.ms('--motion-run'), () => { const nx = plan()[0]; take(nx.w, nx.w === 'since' ? 1 : 0); }],
    [beat, () => { const nx = plan()[0]; nx && take(nx.w, nx.w === 'since' ? 1 : 0); }]
  ]);
}
replay();
</script>
</body>
</html>
