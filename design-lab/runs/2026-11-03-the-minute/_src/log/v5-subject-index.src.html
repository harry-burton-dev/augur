<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Log V5 · The subject index</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: the log as a back-of-book index: subjects, locators that carry their status, and see-also ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3)}
.hd{display:flex;align-items:end;justify-content:space-between;gap:var(--space-5)}
.hd p.l{max-width:var(--measure-read);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.az{display:flex;gap:var(--space-1);flex-wrap:wrap}
.az button{font:400 var(--type-small)/1 var(--font-mono);width:var(--space-5);height:var(--space-5);border-radius:var(--radius-key);color:var(--ink)}
.az button[disabled]{color:var(--ink-muted);opacity:.4;cursor:default}
.az button.on{background:var(--surface-raised);color:var(--light)}
.idx{min-height:0;columns:3 var(--measure-card);column-gap:var(--space-6);padding:var(--space-4) var(--space-5)}
.lt{break-after:avoid;font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--ink-muted);margin:var(--space-3) 0 var(--space-1)}
.lt:first-child{margin-top:0}
.en{break-inside:avoid;padding:var(--space-1) var(--space-2);margin:0 calc(var(--space-2) * -1);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta);transition:background var(--motion-calm) var(--ease-out)}
.en.hot{background:var(--x-proposed-lit-wash)}
.en b{font-weight:400;color:var(--light)}
.loc{display:inline-flex;align-items:center;gap:2px;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink);margin-left:var(--space-1);white-space:nowrap}
.loc .dm{height:var(--space-3)}
.loc.st-reversed,.loc.st-spent,.loc.st-lapsed,.loc.st-amended{color:var(--ink-muted)}
.loc.st-reversed{text-decoration:none;background:var(--x-proposed-stale);padding:0 2px;border-radius:2px}
.sub{display:block;padding-left:var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.see{display:block;padding-left:var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);font-style:italic}
.see button{font-style:italic;color:var(--ink);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap)}
.key{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted)}
@media (max-width:1400px){.idx{columns:2 var(--measure-card);padding:var(--space-3) var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>The decision log · V5</b> the subject index: every subject a heading, every locator a decision that carries its status, with see-also · back-of-book indexes, law digests</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* the index is built from the decisions' catchwords; see-also from subjects that share decisions */
function build() {
  const m = {};
  Object.entries(DATA.decisions).forEach(([id, d]) => (d.subjects || []).forEach(s => { (m[s] = m[s] || []).push(id); }));
  const subs = Object.keys(m).sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
  const see = s => subs.filter(t => t !== s && m[t].filter(id => m[s].includes(id)).length >= 2);
  return { m, subs, see };
}
const S = { hot: 'Kestrel' };
function render() {
  const { m, subs, see } = build();
  const letters = [...new Set(subs.map(s => s[0].toUpperCase()))];
  let html = '', last = '';
  subs.forEach((s, i) => {
    const L = s[0].toUpperCase(); if (L !== last) { html += `<p class="lt" id="L-${L}">${L}</p>`; last = L; }
    const ids = m[s].sort((a, b) => ts(meetingOf(a).date) - ts(meetingOf(b).date));
    const live = ids.filter(id => ['in force', 'review'].includes(statusAt(id)));
    html += `<div class="en dep ${S.hot === s ? 'hot' : ''}" style="--i:${Math.min(i, 12)}" id="e-${i}"><b>${s}</b>${ids.map(id => { const st = statusAt(id); return `<span class="loc ${ST[st].cls}" title="${Dn(id).title} · ${ST[st].w}">${id}<i class="dm ${ST[st].cls}"></i></span>`; }).join(',')}
      ${ids.length > 2 ? `<span class="sub">in force: ${live.length ? live.map(id => `${id}, ${Dn(id).title.toLowerCase()}`).join('; ') : 'none'}</span>` : ''}
      ${see(s).length ? `<span class="see">see also ${see(s).map(t => `<button data-s="${t}">${t}</button>`).join(', ')}</span>` : ''}</div>`;
  });
  $('#app').innerHTML = topHTML(['Mandate', B.short, 'Decisions', 'Index'], [['A–Z', 'jump'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
    <div class="hd"><div><p class="eyebrow">The decision log · ${Object.keys(DATA.decisions).length} decisions · ${subs.length} subjects</p><p class="h1">Index</p></div><p class="l">A book’s index sends a reader to the right page by subject, not by the words used. Each locator is a decision and carries its status, so “Kestrel” shows at a glance which of its decisions still stand.</p></div>
    <div class="az">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L => `<button ${letters.includes(L) ? '' : 'disabled'} data-l="${L}" class="${S.hot && S.hot[0].toUpperCase() === L ? 'on' : ''}">${L}</button>`).join('')}</div>
    <section class="idx pane scroll" aria-label="Index">${html}</section>
    </div></main>`;
  Icons.hydrate($('#app'));
  $$('.see button').forEach(b => b.onclick = () => { S.hot = b.dataset.s; render(); });
  $$('.az button').forEach(b => b.onclick = () => $('#L-' + b.dataset.l)?.scrollIntoView({ block: 'start' }));
}
function replay() {
  clearLater(); S.hot = null; render(); settle();
  /* the moment: one subject is looked up; its entry lights, with its see-also */
  later(() => { S.hot = DATA.decisions['D-118'].subjects[0]; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (/^[a-z]$/i.test(e.key) && !['r', 't', 'g'].includes(e.key.toLowerCase())) $('#L-' + e.key.toUpperCase())?.scrollIntoView({ block: 'start' });
});
replay();
</script>
</body>
</html>
