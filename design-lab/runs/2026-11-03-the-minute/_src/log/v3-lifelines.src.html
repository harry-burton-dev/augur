<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Log V3 · Lifelines</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: the year as a strip. Each decision is a line from when it was made until it ended; a reversal hands on to its successor ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-3)}
.hd{display:flex;align-items:end;justify-content:space-between;gap:var(--space-5)}
.hd p.l{max-width:var(--measure-read);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.chart{min-height:0;padding:var(--space-3) var(--space-4)}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .lab2{font:400 var(--type-small) var(--font-sans);fill:var(--ink)}
.chart .lab2.q{fill:var(--ink-muted)}
.chart .idl{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--ink-muted)}
.chart .mo{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--ink-muted)}
.chart .gl{stroke:var(--hairline)}
.chart .mtl{stroke:color-mix(in srgb,var(--floor-department-high) 30%,transparent);stroke-dasharray:2 3}
.chart .ln{stroke:var(--light);stroke-width:3;stroke-linecap:round}
.chart .ln.review{stroke:var(--x-proposed-warn)}
.chart .ln.ended{stroke:var(--ink-muted);stroke-width:2}
.chart .ln.lapsed{stroke:var(--ink-muted);stroke-width:2;stroke-dasharray:2 3}
.chart .start{fill:var(--light)}
.chart .hand{fill:none;stroke:var(--ink-muted);stroke-width:1;stroke-dasharray:3 3}
.chart .handa{fill:var(--ink-muted)}
.chart .now{stroke:var(--light);stroke-width:1}
.chart .nowt{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--light)}
.chart .hot rect.bg{fill:var(--x-proposed-lit-wash)}
.chart rect.bg{fill:transparent}
.key{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);align-items:center}
.key span{display:inline-flex;align-items:center;gap:var(--space-2)}
.key i{display:inline-block;width:var(--space-5);height:3px;border-radius:1px;background:var(--light)}
.key i.r{background:var(--x-proposed-warn)} .key i.e{background:var(--ink-muted);height:2px} .key i.l{background:repeating-linear-gradient(90deg,var(--ink-muted) 0 2px,transparent 2px 5px);height:2px}
.key i.h{background:repeating-linear-gradient(90deg,var(--ink-muted) 0 3px,transparent 3px 6px);height:1px}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>The decision log · V3</b> lifelines: each decision a line from when it was made until it ended; a reversal hands on to its successor · Marey, one-now, the line of a question</div>
<script>
/*@DATA@*/
/*@LIB@*/
const FROM = '2025-11-01', TO = '2026-12-31';
const S = { upto: NOW, hot: 'D-118' };
function endOf(id) { const d = Dn(id); return d.reversedOn || d.amendedOn || d.lapsedOn || d.spentOn || null; }
function svg() {
  const el = $('#chart'), W = el.clientWidth - 32, H = el.clientHeight - 24, L = Math.min(330, W * .26), x = scaleX(FROM, TO, W - L - 10), X = d => L + x(d);
  const ids = Object.keys(DATA.decisions).sort((a, b) => ts(meetingOf(a).date) - ts(meetingOf(b).date) || a.localeCompare(b));
  const rh = Math.min(28, (H - 30) / ids.length), Y = i => 26 + i * rh + rh / 2;
  const up = S.upto, o = [];
  for (let y = 2025, m = 11; y < 2027; m === 12 ? (y++, m = 1) : m++) { const d = `${y}-${String(m).padStart(2, '0')}-01`; o.push(`<line class="gl" x1="${X(d)}" x2="${X(d)}" y1="14" y2="${H}"/><text class="mo" x="${X(d) + 3}" y="10">${dt(d.slice(0, 7), 'short')}${m === 1 ? ' ' + y : ''}</text>`); }
  DATA.meetings.forEach(m => o.push(`<line class="mtl" x1="${X(m.date)}" x2="${X(m.date)}" y1="18" y2="${H}"/>`));
  ids.forEach((id, i) => {
    const d = Dn(id), made = d.inForce || meetingOf(id).date, end = endOf(id), y = Y(i);
    o.push(`<g class="${S.hot === id ? 'hot' : ''}" data-id="${id}"><rect class="bg" x="0" y="${y - rh / 2}" width="${W}" height="${rh}"/><text class="idl" x="0" y="${y + 4}">${id}</text><text class="lab2 ${end && le(end, up) ? 'q' : ''}" x="52" y="${y + 4}">${d.title.length > 38 ? d.title.slice(0, 37) + '…' : d.title}</text>`);
    if (!le(made, up)) { o.push('</g>'); return; }
    const stop = end && le(end, up) ? end : up;
    /* the line, with its "worth revisiting" stretches in warning */
    const marks = [made, ...(d.revisitIf || []).filter(t => t.tripped).map(t => t.tripped), d.affirmedOn, stop].filter(Boolean).filter(t => le(t, stop)).sort((a, b) => ts(a) - ts(b));
    for (let k = 0; k < marks.length - 1; k++) { const s = statusAt(id, marks[k]); const cls = s === 'review' ? 'review' : end && le(end, up) ? (d.lapsedOn ? 'lapsed' : 'ended') : ''; o.push(`<line class="ln ${cls}" x1="${X(marks[k])}" x2="${Math.max(X(marks[k]) + 2, X(marks[k + 1]))}" y1="${y}" y2="${y}"/>`); }
    o.push(`<circle class="start" cx="${X(made)}" cy="${y}" r="3"/>`);
    /* handing on: a reversal or an amendment draws to its successor's start */
    const succ = d.reversedBy || d.amendedBy;
    if (succ && end && le(end, up)) { const j = ids.indexOf(succ), y2 = Y(j); o.push(`<path class="hand" d="M${X(end)},${y} L${X(end) + 6},${y} L${X(end) + 6},${y2 - 5}"/><path class="handa" d="M${X(end) + 2},${y2 - 7} L${X(end) + 10},${y2 - 7} L${X(end) + 6},${y2 - 2} Z"/>`); }
    o.push('</g>');
  });
  o.push(`<line class="now" x1="${X(NOW)}" x2="${X(NOW)}" y1="14" y2="${H}"/><text class="nowt" x="${X(NOW) + 4}" y="${H}">now</text>`);
  return o.join('');
}
function render() {
  const ids = Object.keys(DATA.decisions), inforce = ids.filter(id => ['in force', 'review'].includes(statusAt(id))).length;
  $('#app').innerHTML = topHTML(['Mandate', B.short, 'Decisions'], [['↑ ↓', 'a decision'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
    <div class="hd"><div><p class="eyebrow">The decision log · ${ids.length} decisions · ${inforce} in force today</p><p class="h1">Lifelines</p></div><p class="l">Each decision is a line from the meeting that made it until it ended. Warning stretches are where a line set at the table was crossed. When one decision reverses or amends another, the old line hands on to the new one.</p></div>
    <section class="chart pane" id="chart"><svg id="svg" role="img" aria-label="Lifelines of ${ids.length} decisions from November 2025 to December 2026"></svg></section>
    <div class="key"><span><i></i>in force</span><span><i class="r"></i>worth revisiting</span><span><i class="e"></i>ended: complete, amended or reversed</span><span><i class="l"></i>lapsed on its own date</span><span><i class="h"></i>handed on to its successor</span><span class="mono">${S.hot ? `${S.hot} · ${Dn(S.hot).title} · ${ST[statusAt(S.hot)].w.toLowerCase()}` : ''}</span></div>
    </div></main>`;
  Icons.hydrate($('#app'));
  $('#svg').innerHTML = svg();
  $$('#svg g[data-id]').forEach(g => g.onmouseenter = () => { if (S.hot === g.dataset.id) return; S.hot = g.dataset.id; render(); });
}
addEventListener('resize', () => { $('#svg').innerHTML = svg(); });
function replay() {
  clearLater(); S.upto = '2025-11-01'; render(); settle();
  /* the moment: the year draws once, left to right, and stops at now */
  const n = 10; for (let i = 1; i <= n; i++) later(() => { const t = ts('2025-11-01') + (ts(NOW) - ts('2025-11-01')) * i / n; S.upto = new Date(t).toISOString().slice(0, 10); render(); }, MOMENT() + i * ms('--motion-instant') * 1.5);
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const ids = Object.keys(DATA.decisions).sort((a, b) => ts(meetingOf(a).date) - ts(meetingOf(b).date) || a.localeCompare(b)), i = ids.indexOf(S.hot);
  if (e.key === 'ArrowDown') { e.preventDefault(); S.hot = ids[Math.min(ids.length - 1, i + 1)]; render(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); S.hot = ids[Math.max(0, i - 1)]; render(); }
});
replay();
</script>
</body>
</html>
