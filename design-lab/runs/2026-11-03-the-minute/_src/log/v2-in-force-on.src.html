<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Log V2 · In force on a date</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: the log opened at a date shows exactly what was in force then, and what changed since ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3) var(--space-5)}
.ttl{grid-column:1 / -1;display:flex;align-items:end;justify-content:space-between;gap:var(--space-4)}
.addr{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);border:1px solid var(--hairline);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2)}
.addr b{font-weight:400;color:var(--light)}
.rail{grid-column:1 / -1;position:relative;height:var(--space-7);margin:0 var(--space-3)}
.rail .base{position:absolute;left:0;right:0;top:var(--space-5);height:1px;background:var(--hairline-strong)}
.rail .mt{position:absolute;top:calc(var(--space-5) - var(--space-1));width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--slate-deep);border:1px solid var(--floor-department-high);transform:translateX(-50%)}
.rail .ml{position:absolute;top:calc(var(--space-5) + var(--space-2));font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);transform:translateX(-50%)}
.rail .cur{position:absolute;top:0;bottom:var(--space-2);width:2px;background:var(--x-proposed-lit);transform:translateX(-50%);transition:left var(--motion-base) var(--ease-out)}
.rail .cur span{position:absolute;top:0;left:var(--space-2);font:400 var(--type-small)/1 var(--font-mono);color:var(--x-proposed-lit);white-space:nowrap}
.rail .now{position:absolute;top:var(--space-3);bottom:var(--space-2);width:1px;background:var(--light)}
.inforce{min-height:0;padding:var(--space-3) var(--space-4)}
.row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.row .t{color:var(--light)}
.row .r{font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.row.new{background:var(--x-proposed-lit-wash)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-3) var(--space-4)}
.side .ch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.side .ch b{font-weight:400;color:var(--light)}
.n{font:300 var(--type-title-s)/1 var(--font-mono);color:var(--light)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,1fr) 300px}.row .r{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>The decision log · V2</b> in force on a date: the log opened at any date shows what was in force then, and what has changed since · point-in-time legislation, time as an address</div>
<script>
/*@DATA@*/
/*@LIB@*/
const FROM = '2025-11-01', TO = NOW;
const S = { at: '2026-08-01' };
const all = () => Object.keys(DATA.decisions);
const inForceAt = at => all().filter(id => ['in force', 'review'].includes(statusAt(id, at)));
function changesBetween(a, b) {
  /* every status change of every decision between two dates, from the record's own dates */
  const out = [];
  all().forEach(id => { const d = Dn(id), made = d.inForce || meetingOf(id).date;
    [[made, 'made'], [d.amendedOn, 'amended'], [d.reversedOn, 'reversed'], [d.spentOn, 'complete'], [d.lapsedOn, 'lapsed']].forEach(([on, w]) => { if (on && ts(on) > ts(a) && le(on, b)) out.push([on, id, w]); }); });
  return out.sort((x, y) => ts(x[0]) - ts(y[0]));
}
function render() {
  const X = scaleX(FROM, TO, 100), list = inForceAt(S.at), ch = changesBetween(S.at, NOW), nowList = inForceAt(NOW);
  const gone = list.filter(id => !nowList.includes(id)), added = nowList.filter(id => !list.includes(id));
  $('#app').innerHTML = topHTML(['Mandate', B.short, 'Decisions'], [['← →', 'meeting to meeting'], ['End', 'today'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: S.at }) +
    `<main class="main"><div class="wrap">
    <div class="ttl"><div><p class="eyebrow">The decision log · ${B.name}</p><p class="h1">In force on ${dt(S.at)}</p></div><span class="addr">mandate / ${B.code.toLowerCase()} / decisions <b>@ ${S.at}</b></span></div>
    <div class="rail" aria-label="Meetings">${'<span class="base"></span>'}${DATA.meetings.map(m => `<span class="mt" style="left:${X(m.date)}%" title="${m.no}"></span><span class="ml" style="left:${X(m.date)}%">${dt(m.date, 'short')}</span>`).join('')}<span class="now" style="left:100%"></span><span class="cur" style="left:${X(S.at)}%"><span>${dt(S.at, 'short')}</span></span></div>
    <section class="inforce pane scroll" aria-label="Decisions in force"><p class="lab" style="margin-bottom:var(--space-2)"><span class="n">${list.length}</span> decisions in force on ${dt(S.at)}</p>
      ${list.sort().map((id, i) => { const d = Dn(id), st = statusAt(id, S.at), today = statusAt(id); return `<div class="row dep" style="--i:${i}">${did(id)}<i class="dm ${ST[st].cls}"></i><span class="t">${d.title}</span><span class="r">${dt(meetingOf(id).date, 'short')}${today !== st ? ` · <span class="late">today: ${ST[today].w.toLowerCase()}${d.reversedBy ? ' by ' + d.reversedBy : ''}</span>` : ''}</span></div>`; }).join('')}</section>
    <aside class="side pane scroll"><p class="lab">Since ${dt(S.at, 'short')}</p><p class="small muted">${gone.length} no longer in force, ${added.length} new. ${ch.length} changes in all.</p>
      ${ch.map(([on, id, w]) => `<div class="ch"><span class="mono muted">${dt(on, 'short')}</span><span>${did(id)} <b>${w}</b> · ${Dn(id).title}</span></div>`).join('')}
      <p class="small muted" style="margin-top:auto">Copy the address to show someone exactly what was decided and in force on that day, for an audit, a complaint or a handover.</p></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
}
const MDATES = () => DATA.meetings.map(m => m.date).concat([NOW]);
function replay() {
  clearLater(); S.at = '2026-04-15'; render(); settle();
  /* the moment: the log moves to 1 August, the middle of the in-house trial */
  later(() => { S.at = '2026-08-01'; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const md = MDATES();
  if (e.key === 'ArrowRight') { S.at = md.find(d => ts(d) > ts(S.at)) || NOW; render(); }
  if (e.key === 'ArrowLeft') { S.at = [...md].reverse().find(d => ts(d) < ts(S.at)) || md[0]; render(); }
  if (e.key === 'End') { S.at = NOW; render(); }
});
replay();
</script>
</body>
</html>
