<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Log V4 · Ask the log</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: ask the log a question; the answer is built from the records, with its workings; the model may only summarise, in pencil ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-5);max-width:calc(var(--measure-wide) * 1.55);margin:0 auto}
.main2{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.box{display:flex;align-items:center;gap:var(--space-3);min-height:calc(var(--target-md) + var(--space-2));padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-inset);font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.box .caret{display:inline-block;width:2px;height:1.1em;background:var(--light);vertical-align:-3px;margin-left:1px}
.chips{display:flex;gap:var(--space-2);flex-wrap:wrap}
.chips button{font-size:var(--type-small);padding:var(--space-1) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-pill);color:var(--ink-muted)}
.chips button:hover{color:var(--ink);border-color:var(--hairline-strong)}
.ans{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-5)}
.ans .lead{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.ans .lead .n{font-family:var(--font-mono)}
.hitrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:var(--space-3);align-items:start;padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.hitrow .w{color:var(--ink)}
.hitrow .w b{display:block;font-weight:400;color:var(--light)}
.hitrow .w span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.hitrow mark{background:color-mix(in srgb,var(--info) 22%,transparent);color:var(--light);border-radius:2px;padding:0 1px}
.hitrow .r{font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.hitrow.now{box-shadow:inset 2px 0 0 var(--x-proposed-lit);padding-left:var(--space-3)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.work{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline)}
.work ol{margin:var(--space-2) 0 0;padding-left:var(--space-4);display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small)}
.work ol li span{color:var(--ink-muted)}
.pencil .pt{font-size:var(--type-meta);line-height:var(--leading-meta)}
.pre-a .ans > *:not(.wait){opacity:0}
.wait{color:var(--ink-muted);font-size:var(--type-meta)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,1fr) 300px;gap:var(--space-4)}.ans{padding:var(--space-3)}.box{font-size:var(--type-body)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>The decision log · V4</b> ask the log: the answer is built from the records with its workings; the model may only summarise, in pencil · the reference desk, the answer has a base</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* sample questions; model = what the model gateway would draft (pencil). The question is parsed into a subject and a time sense by fixed rules, shown in the workings; no model needed */
const QS = [
  { q: 'What did we decide about Kestrel, and is it still in force?', subj: 'Kestrel', when: 'today', model: 'Inspections moved in-house in May as a trial, which was reversed today: from 1 December an outside contractor does them again.' },
  { q: 'What did we decide about fuel cards?', subj: 'fuel cards', when: 'today', model: 'Fuel card spend over £500 needs two signatures; the Westbrook account was closed in January.' },
  { q: 'What was in force about inspections on 1 August?', subj: 'inspections', when: '2026-08-01', model: 'On 1 August our own fitters were inspecting North depot vans under a six-month trial; one of its revisit lines had just been crossed.' }
];
const S = { i: 0, typed: 99, shown: true };
function answer(Q) {
  const at = Q.when === 'today' ? NOW : Q.when, s = Q.subj.toLowerCase();
  const hits = Object.keys(DATA.decisions).filter(id => { const d = Dn(id); return (d.subjects || []).some(x => x.toLowerCase() === s) || (d.words + d.title).toLowerCase().includes(s); })
    .filter(id => le(meetingOf(id).date, at)).sort((a, b) => ts(meetingOf(b).date) - ts(meetingOf(a).date));
  const live = hits.filter(id => ['in force', 'review'].includes(statusAt(id, at)));
  return { at, hits, live };
}
const mk = (t, s) => t.replace(new RegExp(s, 'ig'), m => `<mark>${m}</mark>`);
function render() {
  const Q = QS[S.i], A = answer(Q), qtext = Q.q.slice(0, S.typed);
  const lead = !A.hits.length ? `No decision mentions ${Q.subj}.` :
    `${A.hits.length} decision${A.hits.length > 1 ? 's' : ''} mention${A.hits.length > 1 ? '' : 's'} ${Q.subj}. ${A.live.length ? `${A.live.length === 1 ? 'One is' : A.live.length + ' are'} in force ${Q.when === 'today' ? 'today' : 'on ' + dt(A.at)}: ${A.live.map(id => id).join(', ')}.` : `None is in force ${Q.when === 'today' ? 'today' : 'on ' + dt(A.at)}.`}`;
  const live0 = A.live[0] ? Dn(A.live[0]) : null;
  $('#app').innerHTML = topHTML(['Mandate', B.short, 'Decisions', 'Ask'], [['1 2 3', 'questions'], ['G', 'model off', 'h-g'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap ${S.shown ? '' : 'pre-a'}">
    <section class="main2"><div><p class="eyebrow">The decision log · ${B.name}</p><p class="h1">Ask the log</p></div>
      <div class="box">${I('search', 20)}<span>${qtext}${S.typed < Q.q.length ? '<span class="caret"></span>' : ''}</span></div>
      <div class="chips">${QS.map((x, i) => `<button data-i="${i}">${i + 1} · ${x.q}</button>`).join('')}</div>
      <div class="ans pane scroll">${S.shown ? `<p class="lead">${lead}</p>
        ${live0 ? `<p class="small muted">In force ${Q.when === 'today' ? 'now' : 'then'}: “${live0.plain || live0.words}”</p>` : ''}
        ${A.hits.map((id, i) => { const d = Dn(id), st = statusAt(id, A.at); return `<div class="hitrow dep ${A.live.includes(id) ? 'now' : ''}" style="--i:${i}">${did(id)}<i class="dm ${ST[st].cls}"></i><span class="w"><b>${mk(d.title, Q.subj)}</b><span>${mk(d.words, Q.subj)}</span></span><span class="r">${dt(meetingOf(id).date, 'short')} · ${ST[st].w.toLowerCase()}${st === 'reversed' ? ' by ' + d.reversedBy : st === 'amended' ? ' by ' + d.amendedBy : ''}</span></div>`; }).join('')}` : `<p class="wait">Reading ${Object.keys(DATA.decisions).length} decisions…</p>`}</div></section>
    <aside class="side"><div class="work"><p class="lab">How this was answered</p><ol>
      <li>Subject: <b style="font-weight:400" class="lite">${Q.subj}</b> <span>· a catchword on ${Object.keys(DATA.decisions).filter(id => (Dn(id).subjects || []).some(x => x.toLowerCase() === Q.subj.toLowerCase())).length}, or in the words</span></li>
      <li>When: <b style="font-weight:400" class="lite">${Q.when === 'today' ? 'today' : dt(Q.when)}</b> <span>· from “${Q.when === 'today' ? 'still' : 'on'}”</span></li>
      <li>Status of each, read on that date <span>· from the records, never stored</span></li>
      <li>Only decisions you can open <span>· all ${Object.keys(DATA.decisions).length} of this body’s</span></li></ol><p class="tk">decisions where subject ∋ "${Q.subj}" or words ~ "${Q.subj}", status_at(${A.at})</p></div>
      ${STATE.gateway && S.shown && live0 ? `<div class="pencil"><p class="pl">${I('pencil', 12)} In short · drafted by the model · not part of the answer</p><p class="pt">${Q.model}<span class="ptr">${A.hits.slice(0, 2).join(', ')}</span></p></div>` : !STATE.gateway ? `<div class="work"><p class="small muted">${I('file-text', 12)} The model is off. The answer above is unchanged: it never came from the model.</p></div>` : ''}
      <p class="small muted" style="margin-top:auto">Every sentence on the left is built from the records by a template, so it reads the same in every deployment and turns the same way when a decision changes.</p></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
  $$('.chips button').forEach(b => b.onclick = () => { S.i = +b.dataset.i; S.typed = 99; S.shown = true; render(); });
}
function replay() {
  clearLater(); S.i = 0; S.typed = 0; S.shown = false; render(); settle();
  /* the moment: the question is typed, then the answer arrives with its workings */
  const q = QS[0].q, step = Math.max(1, Math.ceil(q.length / 12));
  for (let k = 1; k <= 12; k++) later(() => { S.typed = Math.min(q.length, k * step); render(); }, k * ms('--motion-instant'));
  later(() => { S.typed = 99; S.shown = true; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const n = +e.key; if (n >= 1 && n <= QS.length) { S.i = n - 1; S.typed = 99; S.shown = true; render(); }
});
replay();
</script>
</body>
</html>
