<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Log V6 · The minute book</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: the minute book. Each meeting a page, confirmed by the next; corrections stay as seams; today's page is a draft ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-3)}
.spread{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:var(--radius-card);border:1px solid var(--hairline-strong);overflow:hidden;background:var(--surface-pane)}
.page{min-height:0;padding:var(--space-5) var(--space-6);display:flex;flex-direction:column;gap:var(--space-3);transition:opacity var(--motion-calm) var(--ease-out)}
.page + .page{border-left:1px solid var(--hairline-strong);box-shadow:inset var(--space-4) 0 var(--space-5) calc(var(--space-4) * -1) var(--shade)}
.turn .page{opacity:0}
.page .no{display:flex;justify-content:space-between;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.page h2{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.page p.pres{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.it{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.it .n{font-family:var(--font-mono);color:var(--ink-muted)}
.it .d{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:2px}
.corr{display:block;margin-top:var(--space-1);border-left:2px solid var(--info);padding-left:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.corr s{color:var(--ink-muted)}
.corr b{font-weight:400;color:var(--ink)}
.stamp{margin-top:auto;display:flex;align-items:center;gap:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.stamp .sig{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;padding:var(--space-1) var(--space-2);border:1px solid var(--x-proposed-lit);color:var(--x-proposed-lit);border-radius:var(--radius-key)}
.stamp .sig.draft{border-style:dashed;border-color:var(--x-proposed-warn);color:var(--x-proposed-warn)}
.tabs{display:flex;gap:var(--space-1);align-items:end;overflow:hidden}
.tab{flex:1;min-width:0;display:grid;gap:2px;padding:var(--space-1) var(--space-2);border:1px solid var(--hairline);border-top:2px solid var(--ink-muted);border-radius:0 0 var(--radius-key) var(--radius-key);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);text-align:left;white-space:nowrap;overflow:hidden}
.tab b{font-weight:400;color:var(--ink)}
.tab.conf{border-top-color:var(--x-proposed-lit)}
.tab.draft{border-top-color:var(--x-proposed-warn);border-style:dashed}
.tab[aria-current="true"]{background:var(--surface-raised)}
@media (max-width:1400px){.page{padding:var(--space-4)}.tab span.y{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>The decision log · V6</b> the minute book: each meeting a page, confirmed by the next; corrections stay as seams; today’s page is still a draft · minute books, visible repair</div>
<script>
/*@DATA@*/
/*@LIB@*/
const MS = DATA.meetings;
const S = { i: 5, turning: false };
function items(m) {
  const ds = Object.keys(DATA.decisions).filter(id => Dn(id).meeting === m.id);
  const prev = MS[MS.indexOf(m) - 1];
  const out = [];
  if (prev) out.push({ n: 1, t: `Minutes of ${dt(prev.date, 'short')}`, d: prev.confirmed === m.date ? `Confirmed as a true record${(prev.corrections || []).length ? `, with ${prev.corrections.length} correction` : ''}.` : 'Not taken.', corr: prev.confirmed === m.date ? (prev.corrections || []) : [] });
  ds.forEach(id => out.push({ n: Dn(id).item, t: Dn(id).title, id }));
  return out.sort((a, b) => a.n - b.n);
}
function pageHTML(m) {
  if (!m) return `<div class="page"><p class="muted">The end of the book so far.</p></div>`;
  const conf = m.confirmed, own = m.corrections || [];
  return `<div class="page"><p class="no"><span>${m.no}</span><span>${dt(m.date)}</span></p><h2>${B.name}</h2>
    <p class="pres">Present: ${m.present.map(p => P(p).name).join(', ')}. Apologies: ${m.apologies.map(p => P(p).name).join(', ') || 'none'}.${m.note ? ' ' + m.note.charAt(0).toUpperCase() + m.note.slice(1) + '.' : ''}</p>
    ${items(m).map(x => `<div class="it"><span class="n">${x.n}</span><span>${x.t}${x.id ? ` ${did(x.id)} <i class="dm ${ST[statusAt(x.id)].cls}" title="${ST[statusAt(x.id)].w}"></i>` : ''}
      ${x.id ? `<span class="d">${Dn(x.id).words}</span>` : x.d ? `<span class="d">${x.d}</span>` : ''}
      ${(x.corr || []).map(c => `<span class="corr">Item ${c.item}: <s>${c.was}</s> → <b>${c.now}</b>. Asked by ${P(c.by).name}. ${c.why}</span>`).join('')}
      ${x.id ? own.filter(c => c.item === x.n).map(c => `<span class="corr">Corrected on ${dt(c.on, 'short')}: <s>${c.was}</s> → <b>${c.now}</b></span>`).join('') : ''}</span></div>`).join('')}
    <div class="stamp">${conf ? `<span class="sig">Confirmed</span><span>as a true record on ${dt(conf)} · signed ${P(B.chair).name}, chair</span>` : `<span class="sig draft">Draft</span><span>Agreed item by item in the room. The next meeting confirms it; until then a member may ask for a correction.</span>`}</div></div>`;
}
function render() {
  const L = MS[S.i], R = MS[S.i + 1];
  $('#app').innerHTML = topHTML(['Mandate', B.short, 'Minute book'], [['← →', 'turn'], ['End', 'today'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
    <div><p class="eyebrow">The decision log · ${MS.length} meetings · ${MS.filter(m => m.confirmed).length} confirmed</p><p class="h1">The minute book</p></div>
    <section class="spread ${S.turning ? 'turn' : ''}" aria-label="Pages">${pageHTML(L)}${pageHTML(R)}</section>
    <nav class="tabs" aria-label="Meetings">${MS.map((m, i) => `<button class="tab ${m.confirmed ? 'conf' : 'draft'}" data-i="${i}" aria-current="${i === S.i || i === S.i + 1}"><b>${dt(m.date, 'short')}</b><span class="y">${m.no}</span></button>`).join('')}</nav>
    </div></main>`;
  Icons.hydrate($('#app'));
  $$('.tab').forEach(b => b.onclick = () => turn(Math.min(+b.dataset.i, MS.length - 2)));
}
function turn(i) {
  if (i === S.i) return;
  S.turning = true; render();
  later(() => { S.i = i; S.turning = false; render(); }, ms('--motion-calm'));
}
function replay() {
  clearLater(); S.i = 4; S.turning = false; render(); settle();
  /* the moment: the page turns to May and June: D-118 on the left, and June confirming May's minute with a correction */
  later(() => turn(5), MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowRight') turn(Math.min(MS.length - 2, S.i + 1));
  if (e.key === 'ArrowLeft') turn(Math.max(0, S.i - 1));
  if (e.key === 'End') turn(MS.length - 2);
});
replay();
</script>
</body>
</html>
