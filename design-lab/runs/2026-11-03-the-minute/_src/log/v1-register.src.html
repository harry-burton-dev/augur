<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Log V1 · The register</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: the register of decisions: every decision of the body, by meeting, with its status; a sentence that counts ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3);max-width:calc(var(--measure-wide) * 1.5);margin:0 auto}
.find{display:grid;grid-template-columns:minmax(0,var(--measure-glance)) minmax(0,1fr);gap:var(--space-5);align-items:center}
.box{display:flex;align-items:center;gap:var(--space-2);height:var(--target-md);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-inset)}
.box input{flex:1;min-width:0;background:none;border:0;color:var(--light);font:400 var(--type-body)/1 var(--font-sans)}
.box input:focus-visible{outline:none}
.box:focus-within{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.facet{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.facet button{color:var(--light);border-bottom:1px dashed var(--ink-muted)}
.facet button[aria-pressed="true"]{color:var(--x-proposed-lit);border-bottom-color:var(--x-proposed-lit)}
.list{min-height:0;padding:0 var(--space-4) var(--space-3)}
.mt{display:grid;grid-template-columns:var(--space-8) minmax(0,1fr);gap:var(--space-4);padding:var(--space-3) 0;border-bottom:1px solid var(--hairline)}
.mt .d{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.mt .d b{display:block;font-weight:400;color:var(--ink)}
.mt .d .draft{color:var(--x-proposed-warn)}
.row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-1) 0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.row .t{color:var(--light)}
.row.is-reversed .t,.row.is-spent .t,.row.is-lapsed .t,.row.is-amended .t{color:var(--ink)}
.row .r{font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.row mark{background:color-mix(in srgb,var(--info) 22%,transparent);color:var(--light);border-radius:2px;padding:0 1px}
.none{padding:var(--space-4) 0;color:var(--ink-muted)}
@media (max-width:1400px){.find{grid-template-columns:1fr;gap:var(--space-2)}.row .r{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>The decision log · V1</b> the register: every decision of the body, by meeting, with its status, found by words or by state · registers of resolutions, said in a sentence</div>
<script>
/*@DATA@*/
/*@LIB@*/
const YEAR = '2026';
const S = { q: '', st: null };
const all = () => Object.keys(DATA.decisions).filter(id => meetingOf(id).date.startsWith(YEAR));
const hit = id => { const d = Dn(id), q = S.q.trim().toLowerCase(); if (!q) return true; return (d.title + ' ' + d.words + ' ' + (d.subjects || []).join(' ') + ' ' + id).toLowerCase().includes(q); };
const mark = t => { const q = S.q.trim(); if (!q) return t; return t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), m => `<mark>${m}</mark>`); };
function render() {
  const ids = all(), shown = ids.filter(id => hit(id) && (!S.st || statusAt(id) === S.st));
  const counts = {}; ids.filter(hit).forEach(id => { const s = statusAt(id); counts[s] = (counts[s] || 0) + 1; });
  const order = ['in force', 'review', 'amended', 'reversed', 'spent', 'lapsed'];
  const facet = order.filter(s => counts[s]).map(s => `<button data-st="${s}" aria-pressed="${S.st === s}">${counts[s]} ${ST[s].w.toLowerCase()}</button>`);
  const meetings = DATA.meetings.filter(m => m.date.startsWith(YEAR) && shown.some(id => Dn(id).meeting === m.id)).reverse();
  $('#app').innerHTML = topHTML(['Mandate', B.short, 'Decisions'], [['/', 'search'], ['Esc', 'clear'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
    <div><p class="eyebrow">The decision log · ${B.name} · ${YEAR}</p><p class="h1">The register</p></div>
    <div class="find"><label class="box">${I('search', 18)}<input id="q" value="${S.q}" placeholder="Find a decision by its words, a subject or a number" aria-label="Find a decision"></label>
      <p class="facet">${S.q ? `“${S.q}” is in ` : ''}${ids.filter(hit).length} of ${ids.length} decisions this year: ${facet.slice(0, -1).join(', ')}${facet.length > 1 ? ' and ' : ''}${facet.slice(-1)}.${S.st ? ` Showing ${ST[S.st].w.toLowerCase()} only.` : ''}</p></div>
    <section class="list pane scroll" aria-label="Decisions by meeting">${meetings.length ? meetings.map((m, mi) => `<div class="mt dep" style="--i:${mi}"><p class="d"><b>${dt(m.date, 'short')}</b>${m.no}<br>${m.confirmed ? `confirmed ${dt(m.confirmed, 'short')}` : `<span class="draft">draft minute</span>`}</p>
      <div>${shown.filter(id => Dn(id).meeting === m.id).map(id => { const st = statusAt(id), d = Dn(id); return `<div class="row is-${st === 'reversed' ? 'reversed' : st}">${did(id)}<i class="dm ${ST[st].cls}" title="${ST[st].w}"></i><span class="t">${mark(d.title)}</span><span class="r">${st === 'reversed' ? `reversed by ${d.reversedBy}` : st === 'amended' ? `amended by ${d.amendedBy}` : ST[st].w.toLowerCase()}${(d.actions || []).length ? ` · ${d.actions.length} actions` : ''}</span></div>`; }).join('')}</div></div>`).join('') : `<p class="none">No decision this year uses those words. <button class="btn sm" data-clear>Clear</button></p>`}</section>
    </div></main>`;
  Icons.hydrate($('#app'));
  const q = $('#q'); q.oninput = () => { S.q = q.value; const p = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
  $$('.facet button').forEach(b => b.onclick = () => { S.st = S.st === b.dataset.st ? null : b.dataset.st; render(); });
  $('[data-clear]')?.addEventListener('click', () => { S.q = ''; render(); });
}
function replay() {
  clearLater(); S.q = ''; S.st = null; render(); settle();
  /* the moment: someone types a subject; the register and the sentence answer together */
  const word = DATA.decisions['D-118'].subjects[0];
  [...word].forEach((c, i) => later(() => { S.q = word.slice(0, i + 1); render(); }, MOMENT() + i * ms('--motion-instant')));
}
document.addEventListener('keydown', e => {
  if (e.target.id === 'q') { if (e.key === 'Escape') { S.q = ''; render(); } return; }
  if (commonKeys(e, render, replay)) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') { S.q = ''; S.st = null; render(); }
});
replay();
</script>
</body>
</html>
