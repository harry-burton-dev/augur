<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Grammar V3 · Decided versus said</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: every sentence of an item sorted into lanes: what binds, what supports, what is only said ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-3)}
.intro{display:flex;align-items:end;justify-content:space-between;gap:var(--space-5)}
.intro p.l{max-width:var(--measure-wide);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.board{min-height:0;display:grid;grid-template-columns:130px repeat(6,minmax(0,1fr));grid-auto-rows:min-content;column-gap:var(--space-2);row-gap:var(--space-2);padding:var(--space-3) var(--space-4)}
.lh{position:sticky;top:0;z-index:1;padding:var(--space-2) var(--space-2) var(--space-2);border-bottom:1px solid var(--hairline-strong);background:var(--slate-deep)}
.lh b{display:flex;align-items:center;gap:var(--space-2);font-weight:400;font-size:var(--type-meta);color:var(--light)}
.lh span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.lh.bind b{color:var(--x-proposed-lit)}
.lane-bg{grid-row:1 / span 40;border-left:1px solid var(--hairline)}
.when{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);padding:var(--space-2) 0;white-space:nowrap}
.when .who{font-family:var(--font-sans)}
.chip{position:relative;padding:var(--space-2);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);background:var(--surface-inset);border:1px solid var(--hairline);transition:transform var(--motion-calm) var(--ease-out),opacity var(--motion-calm) var(--ease-out),border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard)}
.chip.from{transform:translateX(calc(var(--off) * -1));opacity:.35}
.chip.l-decided{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.chip.l-said{background:none;border-style:dashed;color:var(--ink-muted);font-style:italic}
.chip.l-assumed{border-left:2px solid var(--ink-muted)}
.chip.failed{border-color:var(--x-proposed-warn);background:var(--x-proposed-warn-wash)}
.chip .now{display:block;margin-top:var(--space-1);font-style:normal;color:var(--x-proposed-warn)}
.chip .tag{display:block;margin-top:2px;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted);font-style:normal}
.foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.foot b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){.board{grid-template-columns:110px repeat(6,minmax(0,1fr))}.lh span{display:none}.chip .tag{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Minute sheet · V3</b> decided versus said: each sentence of an item sorted into what binds and what is only context · ratio and obiter, Hansard, ADRs</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = Dn('D-118');
const LANES = [
  ['put', 'Put to the meeting', 'motions and amendments, until voted', 'hand'],
  ['decided', 'Decided', 'binds, has a status, is searchable as a decision', 'stamp'],
  ['because', 'Because', 'reasons, each pointing at a record', 'link'],
  ['will', 'Will do', 'one owner, one date', 'circle-dot'],
  ['assumed', 'Assumed', 'not known yet; watched', 'eye'],
  ['said', 'Said, not decided', 'context; never listed as a decision', 'message-square']
];
/* the item, in the order it was said. Each sentence names its lane; nothing here is typed twice */
const H = DATA.heard;
const ROWS = [
  { t: H[0].t, by: D.motion.by, lane: 'put', text: D.motion.text, tag: 'motion · seconded by ' + P(D.motion.seconded).name },
  { t: H[0].t, by: H[0].by, lane: 'because', text: D.because[0].text, tag: 'rests on ' + D.because[0].on.map(o => '#' + evN('D-118', o)).join(' ') },
  { t: H[1].t, by: H[1].by, lane: 'said', text: D.dissent[0].text, tag: 'noted at his request' },
  { t: H[1].t, by: D.amendment.by, lane: 'put', text: 'Amendment: “' + D.amendment.text + '”', tag: 'accepted by the mover' },
  { t: H[2].t, by: H[2].by, lane: 'decided', text: 'Review at the November meeting.', tag: 'revisit if · a date' },
  { t: H[3].t, by: H[3].by, lane: 'said', text: D.obiter[2].text, tag: 'led to an action' },
  { t: H[3].t, by: Ac('A-301').owner, lane: 'will', text: Ac('A-301').text, tag: 'A-301 · by ' + dt(Ac('A-301').due, 'short') },
  { t: H[4].t, by: H[4].by, lane: 'assumed', text: D.evidence.find(e => e.kind === 'assume').label + '.', tag: 'the plan depends on it', failed: true },
  { t: H[4].t, by: Ac('A-302').owner, lane: 'will', text: Ac('A-302').text, tag: 'A-302 · by ' + dt(Ac('A-302').due, 'short') },
  { t: H[5].t, by: H[5].by, lane: 'decided', text: 'Revisit if ' + D.revisitIf[0].text + '.', tag: 'revisit if · watched' },
  { t: H[5].t, by: D.obiter[0].by, lane: 'said', text: D.obiter[0].text, tag: 'not decided' },
  { t: '10:50', by: Ac('A-303').owner, lane: 'will', text: Ac('A-303').text, tag: 'A-303 · not present: asked to accept' },
  { t: '10:52', by: B.chair, lane: 'decided', text: D.words, tag: 'resolution · ' + D.vote.for.length + ' for, ' + D.vote.abstain.length + ' abstained', res: true }
];
const S = { sorted: false, as: meetingOf('D-118').date };
function render() {
  const li = Object.fromEntries(LANES.map((l, i) => [l[0], i]));
  const today = S.as === NOW;
  $('#app').innerHTML = topHTML(['Mandate', 'Decisions', 'Decided versus said'], [['S', 'sort / unsort'], ['A', 'as at today', 'h-a'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: S.as }) +
    `<main class="main"><div class="wrap">
    <div class="intro"><div><p class="eyebrow">Minute sheet · ${meetingOf('D-118').no}, item ${D.item}</p><h1 class="h1">Decided versus said</h1></div>
    <p class="l">A court report keeps what was decided (and the reasons it needed) apart from what was said along the way. A minute can do the same. Every sentence of item ${D.item} sits in one lane. Only the green lane binds and carries a status; the assumed lane is what the decision quietly depends on, so it is watched.</p></div>
    <section class="board pane scroll" aria-label="Item ${D.item}, sorted">
      <div class="lh"><b>${I("clock", 14)} When, who</b><span>in the order said</span></div>
      ${LANES.map(([k, w, d, ic]) => `<div class="lh ${k === 'decided' ? 'bind' : ''}"><b>${I(ic, 14)} ${w}</b><span>${d}</span><span class="tk">lane=${k}</span></div>`).join('')}
      ${(() => { const T = [...new Set(ROWS.map(r => r.t))]; return T.map((t, g) => `<div class="when dep" style="--i:${g};grid-row:${g + 2}">${t}<br>${[...new Set(ROWS.filter(r => r.t === t).map(r => r.by))].map(b => who(b)).join('<br>')}</div>`).join(''); })()}
      ${ROWS.map((r, i) => {
        const g = [...new Set(ROWS.map(x => x.t))].indexOf(r.t);
        const col = li[r.lane] + 2, failed = r.failed && today;
        const nowTxt = failed ? `<span class="now">${D.evidence.find(e => e.kind === 'assume').now}. This is what the reversal turned on.</span>` : '';
        return `<div class="chip dep l-${r.lane} ${failed ? 'failed' : ''} ${S.sorted ? '' : 'from'}" style="--i:${i};grid-row:${g + 2};grid-column:${col};--off:calc(${col - 2} * 100% + ${col - 2} * var(--space-2))">${r.res ? `<b style="font-weight:400">Resolved:</b> ` : ''}${r.text}${nowTxt}<span class="tag">${r.tag}</span></div>`;
      }).join('')}
    </section>
    <div class="foot"><p><b>Searchable as a decision:</b> the decided lane only. A search for “in-house” finds ${did('D-118')}, not Marcus’s remark about the south depot.</p><p><b>Watched:</b> the assumed lane and every “revisit if”. ${today ? `<span class="late">One assumption failed and one line was crossed.</span>` : 'Nothing has moved yet.'}</p><p><b>Told:</b> each owner in the will-do lane gets one Inbox item. Sam was not present, so his waits for him to accept it.</p></div>
    </div></main>`;
  Icons.hydrate($('#app'));
  $('#h-a')?.classList.toggle('on', today);
}
function replay() {
  clearLater(); S.sorted = false; S.as = meetingOf('D-118').date; render(); settle();
  /* the moment: the sentences, as said, slide into their lanes; then the assumption is read on today's date */
  later(() => { S.sorted = true; $$('.chip').forEach(c => c.classList.remove('from')); }, MOMENT());
  later(() => { S.as = NOW; render(); }, MOMENT() + ms('--motion-run') + ms('--motion-calm'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const k = e.key.toLowerCase();
  if (k === 's') { S.sorted = !S.sorted; render(); }
  if (k === 'a') { S.as = S.as === NOW ? meetingOf('D-118').date : NOW; render(); }
});
replay();
</script>
</body>
</html>
