<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Grammar V1 · Specimen minute</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: one agreed minute, every part numbered and named ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,var(--measure-card));gap:var(--space-5)}
.sheet{position:relative;min-height:0;padding:var(--space-4) var(--space-5);display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:var(--space-3) var(--space-5);align-content:start}
.sheet .full{grid-column:1 / -1}
.part{position:relative;border-radius:var(--radius-key);padding:var(--space-1) var(--space-2) var(--space-1) var(--space-5);margin-left:calc(var(--space-2) * -1);transition:background var(--motion-base) var(--ease-standard),box-shadow var(--motion-base) var(--ease-standard)}
.part .n{position:absolute;left:0;top:var(--space-1);display:inline-flex;align-items:center;justify-content:center;min-width:calc(var(--space-4) + 2px);padding:0 2px;height:calc(var(--space-4) + 2px);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.part.hot{background:var(--x-proposed-lit-wash);box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.part.hot .n,.call.hot .n{border-color:var(--x-proposed-lit);color:var(--light)}
.hd{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap}
.hd .h1{font-size:var(--type-heading);line-height:var(--leading-heading);letter-spacing:var(--tracking-caps)}
.k{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-right:var(--space-2)}
.sheet p,.sheet li{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.sheet ol,.sheet ul{margin:0;padding-left:var(--space-4)}
.item{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);font-weight:400}
.sheet p.res{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.obi p{color:var(--ink-muted);font-style:italic}
.acts{list-style:none;padding:0!important;display:grid;gap:var(--space-1)}
.acts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 var(--space-2);align-items:start}
.acts li > span:last-child{grid-column:2}
.acts .when{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.stamp{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.stamp .ptr2{color:var(--ink-muted);font-size:var(--type-small)}
.calls{min-height:0;display:flex;flex-direction:column;gap:var(--space-1);padding-top:var(--space-1)}
.calls .h1{font-size:var(--type-heading);line-height:var(--leading-heading);margin-bottom:var(--space-2)}
.call{position:relative;display:block;width:100%;padding:var(--space-1) var(--space-2) var(--space-1) var(--space-6);border-radius:var(--radius-key);color:var(--ink)}
.call:hover,.call.hot{background:var(--surface-raised)}
.call .n{position:absolute;left:var(--space-2);top:calc(var(--space-1) + 2px);display:inline-flex;align-items:center;justify-content:center;min-width:calc(var(--space-4) + 2px);padding:0 2px;height:calc(var(--space-4) + 2px);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.call b{display:block;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.call span.d{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.call .tk{margin-top:2px}
@media (max-width:1400px){.sheet{padding:var(--space-3) var(--space-4);gap:var(--space-2) var(--space-4)}.sheet p.res{font-size:var(--type-body);line-height:var(--leading-body)}.call span.d{display:none}.call.hot span.d{display:block}.obi p:nth-child(n+3){display:none}.evl{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Minute sheet · V1</b> specimen minute: one agreed item, every part named · board minutes, company secretary practice</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = Dn('D-118'), MT = meetingOf('D-118'), S = { hot: 4, as: MT.date };
const PARTS = [
  ['Heading', 'Which body, which meeting, which floor. It is the address of everything below: ' + B.code + ' ' + MT.no.split(' ')[1] + ', item ' + D.item + '.', 'body · meeting.no · floor'],
  ['Present', 'Who could decide. Quorum is the body’s own setting (' + B.quorum + '). Apologies are recorded, never left out.', 'meeting.present[] · quorum'],
  ['Motion', 'What was put to the meeting, by whom, seconded by whom, and any amendment. It is not yet a decision.', 'motion{by, seconded, text}'],
  ['Resolution', 'The fixed form of words. Agreed once and never edited: any change is a new decision that points back.', 'decision.words (immutable)'],
  ['Because', 'The reasons, each with a pointer to what it rests on: a fact, a paper, an intent.', 'because[].on → evidence refs'],
  ['Vote and dissent', 'For, against, abstained, by name. A member may ask for their view to be noted.', 'vote{for, against, abstain} · dissent[]'],
  ['Said in discussion', 'What was said but not decided. It explains the decision; it never binds and is never listed as one.', 'obiter[] (not a decision)'],
  ['Actions', 'One owner, one date, one state, each traceable back to the decision.', 'action{owner, due, state, from}'],
  ['Revisit if', 'What would reopen it, stated at the table and watched against the records.', 'revisitIf[] → watches'],
  ['Status', 'It sits beside the words, not in them: in force, worth revisiting, amended, reversed, complete or lapsed.', 'statusAt(decision, date)'],
  ['Confirmed', 'The next meeting agrees the minute is a true record. Until then it is a draft.', 'meeting.confirmed']
];
const ev = id => D.evidence.find(e => e.id === id);
const src = e => e.src.startsWith('doc') ? docT(e.src) : e.src.startsWith('M-') ? 'intent ' + e.src : e.src.startsWith('A-') ? 'action ' + e.src : e.src === 'query' ? 'a Data Atlas query' : e.src;
function part(n, html, cls = '') { return `<div class="part dep ${cls} ${S.hot === n ? 'hot' : ''}" data-p="${n}" style="--i:${n}"><span class="n">${n + 1}</span>${html}</div>`; }
function render() {
  const st = statusAt('D-118', S.as);
  const present = MT.present.map(p => p === B.chair ? `${P(p).name} (chair)` : P(p).name);
  const left =
    part(0, `<div class="hd"><span class="h1">${B.name}</span></div><p class="muted">${MT.no} · ${dt(MT.date)}, ${MT.start} to ${MT.end} · <span class="fchip" data-tier="${B.floor}">${DATA.floors[B.floor].name}</span></p>`, 'full') +
    part(1, `<p><span class="k">Present</span>${list(present)}. <span class="k">In attendance</span>${P(B.secretary).name} (minutes). <span class="k">Apologies</span>${MT.apologies.map(p => P(p).name).join(', ') || 'none'}. Quorum ${B.quorum}: met.</p>`, 'full') +
    `<div>` +
    `<p class="item dep" style="--i:2">${D.item}. ${DATA.agenda.find(a => a.no === D.item).title}</p>` +
    part(2, `<p><span class="k">Motion</span>moved by ${who(D.motion.by)}, seconded by ${who(D.motion.seconded)}. <span class="k">Amendment</span>${who(D.amendment.by)} moved “${D.amendment.text}”; the mover accepted it.</p>`) +
    part(3, `<p class="res"><span class="rv">Resolved</span>${D.words} ${did('D-118')}</p>`) +
    part(4, `<ol>${D.because.map(b => `<li>${b.text}${b.on.map(o => `<span class="ptr">${evN('D-118', o)}</span>`).join('')}</li>`).join('')}</ol><p class="small muted evl" style="margin-top:var(--space-1)">${D.evidence.map((e, i) => `<span class="ptr">${i + 1}</span> ${e.label} (${src(e)})`).slice(0, 4).join(' · ')} · <span class="muted">+${D.evidence.length - 4} more</span></p>`) +
    `</div><div>` +
    part(5, `<p><span class="k">For</span>${D.vote.for.length} · <span class="k">Against</span>${D.vote.against.length} · <span class="k">Abstained</span>${D.vote.abstain.length} (${D.vote.abstain.map(p => P(p).name).join(', ')})</p>${D.dissent.map(d => `<p class="small">Noted at ${first(d.by)}’s request: “${d.text}”</p>`).join('')}`) +
    part(6, `<div class="obi"><p class="k" style="font-style:normal">Said in discussion · not decided</p>${D.obiter.map(o => `<p>${first(o.by)}: ${o.text}</p>`).join('')}</div>`) +
    part(7, `<ul class="acts">${D.actions.map(a => { const x = Ac(a); return `<li>${amHTML(actionAt(a, S.as) ? actionAt(a, S.as).shown : 'given', 14)}<span class="when">${a} · ${who(x.owner)} · by ${dt(x.due, 'short')}</span><span>${x.text}</span></li>`; }).join('')}</ul>`) +
    part(8, `<p><span class="k">Revisit if</span>${D.revisitIf.map(t => t.text).join('; or ')}.</p>`) +
    part(9, `<div class="stamp">${stHTML(st)}<span class="ptr2">${st === 'reversed' ? `on ${dt(D.reversedOn)} by ${did(D.reversedBy)} · the words above are unchanged` : st === 'in force' ? `since ${dt(D.inForce)}` : st === 'review' ? `a revisit line was crossed` : ''}</span></div>`) +
    part(10, `<p class="small muted">${MT.confirmed && le(MT.confirmed, S.as) ? `Confirmed as a true record on ${dt(MT.confirmed)} · signed by ${P(B.chair).name}, chair` : `Draft · to be confirmed at the next meeting`}</p>`) +
    `</div>`;
  $('#app').innerHTML = topHTML(['Mandate', 'Decisions', 'Minute sheet'],
    [['↑ ↓', 'parts'], ['A', 'as at today', 'h-a'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: S.as }) +
    `<main class="main"><div class="wrap"><section class="sheet pane scroll" aria-label="Specimen minute">${left}</section>
    <aside class="calls scroll"><p class="eyebrow">The parts of a minute</p><h1 class="h1">Minute sheet</h1>
    ${PARTS.map(([t, d, k], i) => `<button class="call dep ${S.hot === i ? 'hot' : ''}" data-c="${i}" style="--i:${i}"><span class="n">${i + 1}</span><b>${t}</b><span class="d">${d}</span><span class="tk">${k}</span></button>`).join('')}</aside></div></main>`;
  Icons.hydrate($('#app'));
  $('#h-a')?.classList.toggle('on', S.as !== MT.date);
  $$('.call').forEach(b => { b.onmouseenter = b.onfocus = () => hot(+b.dataset.c); });
  $$('.part').forEach(b => { b.onmouseenter = () => hot(+b.dataset.p); });
}
function hot(n) { S.hot = n; $$('.part').forEach(p => p.classList.toggle('hot', +p.dataset.p === n)); $$('.call').forEach(c => c.classList.toggle('hot', +c.dataset.c === n)); }
function replay() {
  clearLater(); S.hot = -1; S.as = MT.date; render(); settle();
  /* the moment: the resolution lights, then its status is read on today's date: reversed, words untouched */
  later(() => hot(3), MOMENT());
  later(() => { S.as = NOW; render(); hot(9); }, MOMENT() + ms('--motion-run'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); hot(Math.min(PARTS.length - 1, S.hot + 1)); }
  if (e.key === 'ArrowUp') { e.preventDefault(); hot(Math.max(0, S.hot - 1)); }
  if (e.key.toLowerCase() === 'a') { S.as = S.as === NOW ? MT.date : NOW; const h = S.hot; render(); hot(h); }
});
replay();
</script>
</body>
</html>
