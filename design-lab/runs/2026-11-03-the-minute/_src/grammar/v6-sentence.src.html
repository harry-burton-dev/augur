<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Grammar V6 · The decision in a sentence</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: a decision is one sentence with slots; every slot says where its words came from ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-6)}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.sent{font-weight:300;font-size:var(--type-heading);line-height:calc(var(--leading-heading) + var(--space-3));color:var(--ink-muted);max-width:var(--measure-wide)}
.sl{color:var(--light);font-weight:400;border-bottom:2px solid var(--sc, var(--hairline-strong));padding:0 2px;border-radius:2px;transition:opacity var(--motion-calm) var(--ease-out),background var(--motion-base) var(--ease-standard)}
.pre-fill .sl{opacity:0}
.sl.f{opacity:1}
.sl.s-record{--sc:var(--info)}
.sl.s-agreed{--sc:var(--x-proposed-lit)}
.sl.s-typed{--sc:var(--ink)}
.sl.s-pencil{--sc:var(--x-proposed-pencil);border-bottom-style:dotted;font-style:italic;color:var(--ink);background:var(--x-proposed-pencil-wash)}
.sl.gap{border:0}
.sl .mk-gap{font-size:var(--type-lead);font-weight:300}
.sl.hot{background:var(--surface-raised)}
.res-s{color:var(--x-proposed-agreed)}
.ptr{font-size:var(--type-small)}
.gate{margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-4);align-items:center;border-top:1px solid var(--hairline-strong);padding-top:var(--space-3);max-width:var(--measure-wide)}
.gate p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.gate p b{font-weight:400;color:var(--x-proposed-warn)}
.gate p b.ok{color:var(--x-proposed-lit)}
.key{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4)}
.key .row{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr);gap:var(--space-3);align-items:start}
.key .sw{height:0;border-bottom:2px solid var(--sc);margin-top:var(--space-3)}
.key .sw.s-pencil{border-bottom-style:dotted}
.key b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta)}
.key span.d{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.key .s-record{--sc:var(--info)} .key .s-agreed{--sc:var(--x-proposed-lit)} .key .s-typed{--sc:var(--ink)} .key .s-pencil{--sc:var(--x-proposed-pencil)}
.rules{border-top:1px solid var(--hairline);padding-top:var(--space-3);display:grid;gap:var(--space-2)}
.rules p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
@media (max-width:1400px){.sent{font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-3))}.wrap{gap:var(--space-5)}.sl .mk-gap{font-size:var(--type-body)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Minute sheet · V6</b> the decision in a sentence: every slot says where it came from; a missing date blocks it · said in a sentence, pencil and ink</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = Dn('D-118'), MT = meetingOf('D-118');
const S = { n: 99, filled: false, hot: null };
/* the slots, in reading order. src: record (computed from AUGUR's records), agreed (the room assented to these words),
   typed (the secretary wrote them), pencil (the model heard them; a person must accept) */
function slots() {
  const acts = D.actions.map(Ac);
  const heardDate = { 'A-302': 'pencil' }; /* Jo said "by the end of June"; the model heard it */
  return [
    ['On ', ['record', dt(MT.date)]], [' the ', ['record', B.name]], [' decided ', ['agreed', D.words.replace(/^That /, 'that '), 'res-s']],
    [' because ', ['typed', `${D.because.length} reasons${D.because.map((_, i) => `<span class="ptr">${i + 1}</span>`).join('')}`]], ['. It rests on ', ['record', `${D.evidence.length} records in 3 apps`]], ['. ', null],
    ...acts.flatMap((a, i) => {
      const date = a.owner === 'p8' && !S.filled ? ['gap', 'no date'] : [heardDate[D.actions[i]] && STATE.gateway ? 'pencil' : 'record', dt(a.due, 'short')];
      if (!STATE.gateway && heardDate[D.actions[i]]) date[0] = 'typed';
      return [[i ? '; ' : '', ['record', P(a.owner).name]], [' will ', ['typed', a.text.charAt(0).toLowerCase() + a.text.slice(1)]], [' by ', date]];
    }),
    ['. It stays in force unless ', ['agreed', D.revisitIf[0].text]], [', ', ['agreed', D.revisitIf[1].text]], [', or ', ['agreed', D.revisitIf[2].text.replace('the trial ends: ', '')]], ['.', null]
  ];
}
function render() {
  const sl = slots(), gaps = sl.filter(([, s]) => s && s[0] === 'gap').length, pencils = sl.filter(([, s]) => s && s[0] === 'pencil').length;
  let k = 0;
  const html = sl.map(([pre, s]) => pre + (s ? `<span class="sl s-${s[0]} ${s[0] === 'gap' ? 'gap' : ''} ${k < S.n ? 'f' : ''} ${s[2] || ''}" data-s="${s[0]}" style="--k:${k++}">${s[0] === 'gap' ? `<span class="mk-gap">${s[1]}</span>` : s[1]}</span>` : '')).join('');
  $('#app').innerHTML = topHTML(['Mandate', 'Decisions', 'In a sentence'], [['F', 'fill the date'], ['G', 'model off', 'h-g'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap"><section class="left"><div><p class="eyebrow">Minute sheet · ${MT.no}, item ${D.item}</p><h1 class="h1">In a sentence</h1></div>
      <p class="sent ${S.n === 0 ? 'pre-fill' : ''}">${html}</p>
      <div class="gate"><p>${gaps ? `<b>Can’t be recorded yet.</b> An action needs one owner and one date. ${P('p8').name} is not here, so the date can’t be agreed in the room: set one he can refuse, or ask him first.` : pencils ? `<b>${pencils} part in pencil.</b> The model heard “${DATA.heard[4].text.split('. ')[1]}” and wrote the date. ${P(B.secretary).name} accepts it or types her own.` : `<b class="ok">Ready to record.</b> Every slot is ink. Recording sends each owner one Inbox item and starts the watches.`}</p>
      <button class="btn ${gaps ? '' : 'go'}" ${gaps ? 'aria-disabled="true"' : ''}>${I('stamp', 16)} Record</button></div></section>
    <aside class="key pane scroll"><p class="eyebrow">Where each slot came from</p>
      ${[['record', 'From records', 'Dates, names, the body and the counts come from AUGUR, never typed.'], ['agreed', 'Agreed in the room', 'The words of the resolution and its revisit lines. Read back and assented to.'], ['typed', 'Typed by the secretary', 'Reasons and actions in the secretary’s words.'], ['pencil', 'Heard by the model', 'Pencil until the secretary accepts it. Turn the model off (G) and the slot is hers to type: nothing in the record changes.']]
        .map(([s, w, d]) => `<div class="row"><span class="sw s-${s}"></span><span><b>${w}</b><span class="d">${d}</span></span></div>`).join('')}
      <div class="rules"><p class="lab">What the sentence needs</p><p>One “decided” slot, agreed. At least one reason. Every action: one owner, one date. At least one “unless”: a decision with no revisit line stays in force until someone remembers it.</p><p class="tk">required: words, because[≥1], actions[].{owner,due}, revisitIf[≥1]</p></div></aside></div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.n = 0; S.filled = false; render(); settle();
  /* the moment: the slots fill in reading order; the one without a date stays a gap and blocks the record */
  const total = slots().filter(([, s]) => s).length;
  for (let i = 1; i <= total; i++) later(() => { S.n = i; render(); }, MOMENT() + i * ms('--motion-instant'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'f') { S.filled = !S.filled; render(); }
});
replay();
</script>
</body>
</html>
