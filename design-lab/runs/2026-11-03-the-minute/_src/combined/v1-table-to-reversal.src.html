<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Combined V1 · From the table to the reversal</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V1: one decision followed from the meeting, through three actions, to its reversal six months later ---- */
.wrap{height:100%;display:grid;grid-template-columns:var(--measure-card) minmax(0,1fr) var(--measure-card);grid-template-rows:minmax(0,1fr) auto;gap:var(--space-4) var(--space-5)}
.rec{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4)}
.rec .t{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.rec .w{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:opacity var(--motion-calm) var(--ease-out)}
.rec.rev .w,.rec.rev .t{opacity:var(--x-proposed-reversed)}
.rec.rev{background:var(--x-proposed-stale) left top / var(--space-2) 100% no-repeat,var(--surface-pane)}
.rec .ln{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);align-items:center;font-size:var(--type-small);line-height:var(--leading-small)}
.rec .succ{padding:var(--space-2) var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--surface-pane);font-size:var(--type-small);line-height:var(--leading-small)}
.scene{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-5)}
.scene .when{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap}
.scene .when .d{font:300 var(--type-heading)/var(--leading-heading) var(--font-mono);color:var(--light)}
.scene h2{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light)}
.scene .body{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.scene .p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);max-width:var(--measure-wide)}
.box{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline-strong);background:var(--surface-inset);display:grid;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.box.lit{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.box.warn{border-color:var(--x-proposed-warn);background:var(--x-proposed-warn-wash)}
.box .k{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.faces{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.row2{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);align-items:start;font-size:var(--type-small);line-height:var(--leading-small)}
.acts{min-height:0;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4)}
.act{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-2);padding:var(--space-3);border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-inset);transition:border-color var(--motion-base) var(--ease-out)}
.act.late{border-color:var(--x-proposed-warn)}
.act.chg{border-color:var(--x-proposed-lit)}
.act .t{font-size:var(--type-small);line-height:var(--leading-small);color:var(--light)}
.act .m{grid-column:2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.q4{grid-column:2;display:flex;gap:2px;margin-top:var(--space-1)}
.q4 i{flex:1;height:3px;border-radius:1px;background:var(--hairline)}
.q4 i.on{background:var(--ink)}
.q4 i.res{background:var(--x-proposed-lit)}
.q4 i.gone{background:var(--x-proposed-stale)}
.rail{grid-column:1 / -1;position:relative;height:calc(var(--space-7) + var(--space-2));margin:0 var(--space-3)}
.rail .base{position:absolute;left:0;right:0;top:var(--space-5);height:1px;background:var(--hairline-strong)}
.rail .tick{position:absolute;top:calc(var(--space-5) + var(--space-1));font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);transform:translateX(-50%)}
.rail .band{position:absolute;top:calc(var(--space-5) - 3px);height:6px;border-radius:3px}
.rail .band.force{background:color-mix(in srgb,var(--light) 30%,transparent)}
.rail .band.review{background:var(--x-proposed-warn)}
.rail button.sc{position:absolute;top:calc(var(--space-5) - var(--space-2));transform:translateX(-50%);width:var(--space-4);height:var(--space-4);border-radius:var(--radius-pill);border:1px solid var(--ink-muted);background:var(--slate-deep)}
.rail button.sc.seen{border-color:var(--light);background:var(--light)}
.rail button.sc.cur{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit);box-shadow:0 0 0 var(--focus-gap) var(--x-proposed-lit-wash)}
.rail .sl{position:absolute;top:0;transform:translateX(-50%);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);white-space:nowrap}
.rail .sl.cur{color:var(--light)}
.rail .nowl{position:absolute;top:var(--space-3);height:var(--space-5);width:1px;background:var(--light)}
.fade{animation:fade var(--motion-calm) var(--ease-out)}
@keyframes fade{from{opacity:0}}
@media (max-width:1400px){.wrap{grid-template-columns:260px minmax(0,1fr) 260px;gap:var(--space-3) var(--space-4)}.scene{padding:var(--space-3) var(--space-4)}.scene h2{font-size:var(--type-heading);line-height:var(--leading-heading)}.rail .sl{font-size:var(--x-proposed-type-micro)}.rec,.acts{padding:var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V1</b> from the table to the reversal: one decision, three actions, six months, one record that never loses a word · live V1 V4 V5, actions V3 V4, revisit V1 V2 V3 V6</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = Dn('D-118'), R = Dn('D-131'), M5 = meetingOf('D-118'), M11 = meetingOf('D-131');
const FROM = '2026-05-01', TO = '2026-11-30';
/* six scenes, each a date. Every status, count and state on screen is read from the records on that date */
const SCENES = [
  { on: M5.date, w: 'At the table', title: 'Agreed in the room',
    body: () => `<p class="p">Item ${D.item} of ${M5.no}. The motion came from Priya’s paper, Ade’s amendment made it a trial, and the chair asked for a line to come back on. ${P(B.secretary).name} read it back and each person present answered.</p>
      <div class="box lit"><p class="k">Resolved · ${did('D-118')} · agreed 10:52 by the ${M5.present.length} present</p><p style="color:var(--light)">${D.plain}</p>
      <div class="faces">${M5.present.map(p => face(p, p === 'p5' ? '' : 'yes')).join('')}<span class="small muted">${P('p5').name} abstained, and asked for a note: “${D.dissent[0].text}”</span></div></div>
      <div class="box"><p class="k">Revisit if · set at the table</p>${D.revisitIf.map(t => `<div class="row2">${I('eye', 14)}<span>${t.text}</span><span></span></div>`).join('')}</div>
      <div class="box"><p class="k">Assumed · not known yet</p><div class="row2">${I('circle-help', 14)}<span>${D.evidence.find(e => e.kind === 'assume').label}, said ${P('p3').name}</span><span class="muted">watched</span></div></div>` },
  { on: '2026-06-23', w: 'A date moves', title: 'One action closed, one moved',
    body: () => `<p class="p">At matters arising on 9 Jun the chair closed Dana’s notice to Kestrel. Two weeks later Jo asked to move her date: no qualified applicants. The chair agreed; the old date stays as a seam.</p>
      <div class="box"><p class="k">${I('calendar-clock', 12)} Date moved · A-302</p><p><span class="seam"><s>${dt(Ac('A-302').due, 'short')}</s> ${dt(Ac('A-302').moves[0].to, 'short')}</span> · agreed by ${P('p1').name} · “${Ac('A-302').moves[0].why}”</p></div>
      <div class="box"><p class="k">The decision, unchanged</p><p>${stHTML(statusAt('D-118', '2026-06-23'))} · its words are as agreed; a moved date is not a change to the decision.</p></div>` },
  { on: '2026-08-01', w: 'A line is crossed', title: 'The assumption fails',
    body: () => `<p class="p">On 1 August no fitter is in post. The second line set at the table is crossed, so the decision is marked “worth revisiting” and the chair is asked once. In September the meeting keeps the trial going with one fitter (D-128), and says why.</p>
      <div class="box warn"><p class="k">${I('eye', 12)} Line crossed · ${dt(D.revisitIf[1].tripped, 'short')}</p><p>${D.revisitIf[1].text} · fitters in post: ${seriesAt('fitters', '2026-08-01')} ${spark('fitters', { at: '2026-08-01', line: 2, op: '<', w: 80, h: 18 })}</p></div>
      <div class="box"><p class="k">Kept · ${did('D-128')} · ${dt(D.affirmedOn, 'short')}</p><p>${Dn('D-128').words}</p></div>` },
  { on: D.revisitIf[0].tripped, w: 'Another line', title: 'Five vans overdue',
    body: () => `<p class="p">October’s count is ${seriesAt('overdue', D.revisitIf[0].tripped)} of 18, over the line of ${D.revisitIf[0].at}. The watch marks the decision again; nothing is reversed by a watch. At the October meeting the chair brings the review forward to 3 November (D-130).</p>
      <div class="box warn"><p class="k">${I('eye', 12)} Line crossed · ${dt(D.revisitIf[0].tripped, 'short')}</p><p>${D.revisitIf[0].text} ${spark('overdue', { at: D.revisitIf[0].tripped, line: 4, w: 96, h: 20 })}</p></div>
      <div class="box"><p class="k">${I('inbox', 12)} One item, to ${P(B.chair).name} only</p><p>A line you set for D-118 has been crossed. Put it on the next agenda, bring the review forward, or note it and keep it.</p></div>` },
  { on: M11.date, w: 'Before the vote', title: 'The wake',
    body: () => `<p class="p">Item ${R.item} of ${M11.no}. Before the vote the room sees everything in AUGUR that rests on D-118, and what reversing it would do to each.</p>
      <div class="box">${DATA.wake.map(w => `<div class="row2">${I(w.kind === 'action' ? 'circle-dot' : w.kind === 'doc' ? 'file-text' : w.kind === 'intent' ? 'target' : 'stamp', 14)}<span><b style="font-weight:400;color:var(--light)">${w.kind === 'action' ? w.ref : w.kind === 'doc' ? docT(w.ref) : w.kind === 'intent' ? 'Intent ' + w.ref : w.ref}</b> · ${w.say}</span><span class="muted">${{ spent: 'done', overtaken: 'withdrawn', kept: 'kept', cites: 'update', rests: 'changes' }[w.effect]}</span></div>`).join('')}</div>` },
  { on: M11.date, w: 'Reversed', title: 'Kept, with seams',
    body: () => `<p class="p">The meeting reverses D-118 with D-131. Nothing is deleted: D-118 keeps its words, reasons, actions and history and points forward. Four people get one Inbox item each, with the reason; everyone else who relied on it sees a seam when they next look.</p>
      <div class="box lit"><p class="k">Resolved · ${did('D-131')} · ${R.vote.for.length} for</p><p style="color:var(--light)">${R.plain}</p></div>
      <div class="box"><p class="k">Seams</p><div class="row2">${I('file-text', 14)}<span>${docT('doc-proc')}: cites ${did('D-118')} → reversed · ${P('p3').name} updates it by ${dt(Ac('A-313').due, 'short')}</span><span></span></div><div class="row2">${I('target', 14)}<span>Intent M-42: forecast <s class="muted">${DATA.intents['M-42'].forecast.with}</s> ${DATA.intents['M-42'].forecast.without}</span><span></span></div></div>
      <div class="box"><p class="k">${I('inbox', 12)} Told · one Inbox item each, with the reason</p><div class="faces">${[...new Set([...R.actions.map(a => Ac(a).owner), DATA.docs['doc-budget'].by])].map(p => face(p)).join('')}<span class="small muted">new actions for Dana, Priya and Jo; Jo’s A-302 withdrawn with thanks; Ade asked to re-run the budget monitor. Nobody else is sent anything.</span></div></div>` }
];
const S = { i: 5, play: false };
function actsHTML(at, prevAt) {
  const ids = [...D.actions, ...(le(R.inForce, at) && S.i === 5 ? R.actions : [])];
  return ids.map(id => { const a = Ac(id), s = actionAt(id, at); if (!s) return ''; const p = prevAt ? actionAt(id, prevAt) : null;
    const k = { given: 1, accepted: 2, part: 2, done: 3, discharged: 4, overtaken: -1 }[s.s];
    return `<div class="act ${s.late ? 'late' : ''} ${p && p.shown !== s.shown ? 'chg' : ''} ${!p && prevAt ? 'chg' : ''}">${amHTML(s.shown, 16)}<span class="t">${a.text}</span>
      <span class="m">${id} · ${who(a.owner)} · ${s.late ? `<span class="late">${s.late} days late</span>` : AS[s.shown].s}${s.due !== a.due && s.open ? ` · <span class="seam"><s>${dt(a.due, 'short')}</s> ${dt(s.due, 'short')}</span>` : ''}</span>
      <span class="q4" aria-hidden="true">${[1, 2, 3, 4].map(n => `<i class="${k === -1 ? 'gone' : n <= k ? (k === 4 ? 'res' : 'on') : ''}"></i>`).join('')}</span></div>`; }).join('');
}
function render() {
  const sc = SCENES[S.i], at = sc.on, prev = S.i ? SCENES[S.i - 1].on : null;
  const st = S.i === 4 ? statusAt('D-118', '2026-11-02') : statusAt('D-118', at);
  const X = scaleX(FROM, TO, 100);
  const bands = [[D.inForce, D.revisitIf[1].tripped, 'force'], [D.revisitIf[1].tripped, D.affirmedOn, 'review'], [D.affirmedOn, D.revisitIf[0].tripped, 'force'], [D.revisitIf[0].tripped, D.reversedOn, 'review']];
  $('#app').innerHTML = topHTML(['Mandate', B.short, 'D-118'], [['← →', 'scene'], ['P', 'play from the start'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: at }) +
    `<main class="main"><div class="wrap">
    <section class="rec pane ${st === 'reversed' ? 'rev' : ''}" aria-label="The record"><p class="eyebrow">The record</p><p class="lab">${did('D-118')} ${stHTML(st)}</p><p class="t">${D.title}</p><p class="w">${D.words}</p>
      <div class="ln">${I('layers', 14)}<span>rests on ${D.evidence.length} records</span><span class="muted">${D.evidence.filter(e => e.series && seriesAt(e.series, at) !== seriesAt(e.series, D.inForce)).length} moved</span></div>
      <div class="ln">${I('eye', 14)}<span>${D.revisitIf.length} revisit lines</span><span class="${D.revisitIf.some(t => t.tripped && le(t.tripped, at)) ? 'late' : 'muted'}">${D.revisitIf.filter(t => t.tripped && le(t.tripped, at)).length} crossed</span></div>
      <div class="ln">${I('circle-dot', 14)}<span>${D.actions.length} actions</span><span class="muted">${D.actions.filter(a => { const x = actionAt(a, S.i === 4 ? '2026-11-02' : at); return x && x.open; }).length} open</span></div>
      ${st === 'reversed' ? `<div class="succ fade">${I('corner-down-right', 14)} Reversed by ${did('D-131')} on ${dt(D.reversedOn, 'short')}. The words above are as agreed on ${dt(M5.date, 'short')}.</div>` : ''}
      <p class="small muted" style="margin-top:auto">The same record at every step. Only its status and the counts beside it move, and they are read from dates, never typed.</p></section>
    <section class="scene pane scroll fade" aria-live="polite"><div class="when"><span class="d">${dt(at)}</span><span class="lab">${S.i + 1} of ${SCENES.length} · ${sc.w}</span></div><h2>${sc.title}</h2><div class="body">${sc.body()}</div></section>
    <section class="acts pane scroll" aria-label="Actions"><p class="eyebrow">Its actions · asked, accepted, answered, closed</p>${actsHTML(S.i === 4 ? '2026-11-02' : at, prev)}</section>
    <div class="rail" aria-label="Six months">${'<span class="base"></span>'}${bands.map(([a, b, k]) => `<span class="band ${k}" style="left:${X(a)}%;width:${X(b) - X(a)}%"></span>`).join('')}
      ${[5, 6, 7, 8, 9, 10, 11].map(m => { const d = `2026-${String(m).padStart(2, '0')}-01`; return `<span class="tick" style="left:${X(d)}%">${dt(d.slice(0, 7), 'short')}</span>`; }).join('')}
      ${SCENES.map((s, i) => `<span class="sl ${i === S.i ? 'cur' : ''}" style="left:${X(s.on) + (i === 4 ? -3 : i === 5 ? 3 : 0)}%">${s.w}</span><button class="sc ${i < S.i ? 'seen' : ''} ${i === S.i ? 'cur' : ''}" style="left:${X(s.on) + (i === 4 ? -1 : i === 5 ? 1 : 0)}%" data-i="${i}" aria-label="${s.w}, ${dt(s.on)}"></button>`).join('')}
      <span class="nowl" style="left:${X(NOW)}%"></span></div>
    </div></main>`;
  Icons.hydrate($('#app'));
  $$('.rail button.sc').forEach(b => b.onclick = () => { S.play = false; clearLater(); S.i = +b.dataset.i; render(); });
}
function play() { clearLater(); S.play = true; S.i = 0; render(); SCENES.forEach((_, i) => i && later(() => { S.i = i; render(); }, i * ms('--motion-hold'))); }
function replay() {
  clearLater(); S.i = 0; render(); settle();
  /* the moment: from the table to six months later, in one step. P plays every scene at reading pace */
  later(() => { S.i = SCENES.length - 1; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowRight') { clearLater(); S.i = Math.min(SCENES.length - 1, S.i + 1); render(); }
  if (e.key === 'ArrowLeft') { clearLater(); S.i = Math.max(0, S.i - 1); render(); }
  if (e.key.toLowerCase() === 'p') play();
});
replay();
</script>
</body>
</html>
