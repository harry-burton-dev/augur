<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Combined V3 · Minuting live</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V3: minuting as it could ship: the agenda is the form, the model hears in pencil, actions need one owner and one date, the room agrees ---- */
.wrap{height:100%;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr) var(--measure-card);gap:var(--space-5)}
.rail{min-height:0;display:flex;flex-direction:column;gap:var(--space-1)}
.ai{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-2);padding:var(--space-2);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ai.done{color:var(--ink)}
.ai.cur{background:var(--surface-raised);color:var(--light);box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.ai .dec{grid-column:2;font-size:var(--x-proposed-type-micro)}
.ai .bar{grid-column:2;height:var(--space-1);background:var(--hairline);border-radius:1px;overflow:hidden}
.ai .bar i{display:block;height:100%;background:var(--ink-muted)}
.form{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-5)}
.slot{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-5)) minmax(0,1fr);gap:var(--space-4);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.slot .sh{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--type-meta);color:var(--light)}
.slot .sh span{display:block;font-size:var(--x-proposed-type-micro);line-height:1.4;color:var(--ink-muted);font-family:var(--font-mono)}
.slot .b{font-size:var(--type-meta);line-height:var(--leading-meta)}
.draft{padding:var(--space-3);border-radius:var(--radius-key);transition:border-color var(--motion-calm) var(--ease-out),background var(--motion-calm) var(--ease-out)}
.draft.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash)}
.draft.pencil .w{font-style:italic}
.draft.ink{border:1px solid var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.draft .w{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.draft .pl{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);margin-bottom:var(--space-1)}
.acts{display:grid;gap:var(--space-1)}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);align-items:start;font-size:var(--type-small);line-height:var(--leading-small)}
.act .t{color:var(--light)}
.act .d{font-family:var(--font-mono);white-space:nowrap;color:var(--ink)}
.act.ask .t::after{content:" · asked, not here";color:var(--ink-muted)}
.room{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.ring{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.pp{display:grid;justify-items:center;gap:2px;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:center}
.pp .face{width:var(--target-md);height:var(--target-md);transition:border-color var(--motion-base) var(--ease-out),box-shadow var(--motion-base) var(--ease-out)}
.pp.wait .face{border-style:dashed}
.pp.note .face{border-color:var(--x-proposed-warn)}
.pp.yes .r{color:var(--x-proposed-lit)} .pp.note .r{color:var(--x-proposed-warn)}
.room .q{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.room p.s{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.heard{padding:var(--space-2) var(--space-3);border:1px dotted var(--x-proposed-pencil);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.heard i{font-style:italic;color:var(--ink)}
.go{display:flex;gap:var(--space-2);align-items:center;margin-top:auto}
@media (max-width:1400px){.wrap{grid-template-columns:200px minmax(0,1fr) 280px;gap:var(--space-4)}.form{padding:var(--space-3)}.slot{grid-template-columns:var(--space-8) minmax(0,1fr)}.draft .w{font-size:var(--type-body);line-height:var(--leading-body)}.slot .sh span{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V3</b> minuting live: the agenda is the form, the model hears in pencil, actions need one owner and one date, the room agrees · live V1 V2 V4 V5, grammar V6</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = '2026-05-12';
const MT = meetingOf('D-118'), D = Dn('D-118');
const ANS = [['p3', 'yes'], ['p1', 'yes'], ['p4', 'yes'], ['p2', 'yes'], ['p5', 'note']];
const S = { n: 99 };
function render() {
  const got = Object.fromEntries(ANS.slice(0, S.n)), all = MT.present.every(p => got[p]);
  const ag = DATA.agenda;
  const draftCls = all ? 'ink' : STATE.gateway ? 'pencil' : '';
  const lab = all ? `${I('stamp', 12)} Agreed 10:52 by the ${MT.present.length} present · ${did('D-118')}` : STATE.gateway ? `${I('pencil', 12)} Drafted from what was heard (${DATA.heard[0].t} to ${DATA.heard[5].t}) · being read back by ${P(B.chair).name}` : `${I('keyboard', 12)} Typed by ${P(B.secretary).name} · being read back`;
  $('#app').innerHTML = topHTML(['Mandate', B.short, MT.no, 'Live'], [['Space', 'next answer'], ['G', 'model off', 'h-g'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: NOW }) +
    `<main class="main"><div class="wrap">
    <aside class="rail"><p class="eyebrow" style="margin-bottom:var(--space-2)">Agenda · ${MT.no}</p>${ag.map((a, i) => `<div class="ai ${i < 3 ? 'done' : i === 3 ? 'cur' : ''}"><span class="mono">${a.no}</span><span>${a.title}</span>${a.decision && i < 3 ? `<span class="dec">${did(a.decision)} agreed</span>` : ''}${i === 3 ? `<span class="bar"><i style="width:${Math.min(100, 12 / a.min * 100)}%"></i></span>` : ''}</div>`).join('')}
      <p class="small muted" style="margin-top:auto">10:52 · item ${D.item}: 12 of ${ag[3].min} min</p></aside>
    <section class="form pane scroll" aria-label="Item ${D.item}"><div><p class="eyebrow">Now · item ${D.item} · paper: ${docT(ag[3].paper)}</p><p class="h2">${ag[3].title}</p></div>
      <div class="slot"><div class="sh">${I('hand', 16)}<div>Motion<span>from the paper</span></div></div><div class="b">Moved ${who(D.motion.by)}, seconded ${who(D.motion.seconded)}; amended by ${who(D.amendment.by)} “${D.amendment.text}”.</div></div>
      <div class="slot"><div class="sh">${I('stamp', 16)}<div>Resolution<span>read back, then agreed</span></div></div><div class="draft ${draftCls}"><p class="pl">${lab}</p><p class="w">${D.plain}</p><p class="tk">words: ${D.words}</p></div></div>
      <div class="slot"><div class="sh">${I('circle-dot', 16)}<div>Actions<span>one owner, one date</span></div></div><div class="acts">${D.actions.map(id => { const a = Ac(id), here = MT.present.includes(a.owner); return `<div class="act ${here ? '' : 'ask'}">${amHTML(here ? 'accepted' : 'given', 14)}<span class="t">${a.text} · ${who(a.owner)}</span><span class="d">${dt(a.due, 'short')}</span></div>`; }).join('')}</div></div>
      <div class="slot"><div class="sh">${I('eye', 16)}<div>Revisit if<span>watched from today</span></div></div><div class="b">${D.revisitIf.map(t => t.text).join('; or ')}.<br><span class="small muted">Assumed: ${D.evidence.find(e => e.kind === 'assume').label.toLowerCase()} (${P('p3').name}). Watched too.</span></div></div>
      <div class="go">${all ? `<span class="small" style="color:var(--x-proposed-lit)">${I('check', 14)} Recorded. ${D.actions.length} Inbox items sent; ${D.revisitIf.length - 1} watches started.</span>` : `<span class="small muted">The item closes when everyone present has answered.</span>`}</div></section>
    <aside class="room"><p class="eyebrow">In the room · ${MT.present.length} of ${B.members.length} · quorum ${B.quorum}</p><p class="q">Is this what we decided?</p>
      <div class="ring">${MT.present.map(p => { const a = got[p]; return `<div class="pp ${a === 'yes' ? 'yes' : a === 'note' ? 'note' : 'wait'}">${face(p, a === 'yes' ? 'yes' : '')}<span>${first(p)}</span><span class="r">${a === 'yes' ? 'yes' : a === 'note' ? 'yes, with a note' : 'waiting'}</span></div>`; }).join('')}${MT.apologies.map(p => `<div class="pp">${face(p, 'off')}<span>${first(p)}</span><span class="r">apologies</span></div>`).join('')}</div>
      ${got.p5 === 'note' ? `<p class="s" style="border-left:2px solid var(--x-proposed-warn);padding-left:var(--space-2);color:var(--ink)">Noted at Ade’s request: ${D.dissent[0].text}</p>` : ''}
      ${STATE.gateway ? `<div class="heard">${I('mic', 12)} Heard, kept 30 days for checking: <i>“${DATA.heard[4].text}”</i> · ${P('p3').name}, ${DATA.heard[4].t}</div>` : `<div class="heard">${I('mic-off', 12)} The model is off. Nothing is heard; the minute is typed. Nothing in the record changes.</div>`}
      <p class="s">“Yes” confirms the minute, not the vote: ${P('p5').name} abstained and still says it is what was decided.</p></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.n = 0; render(); settle();
  /* the moment: answers come in; the pencil resolution inks and takes its number when everyone present has answered */
  ANS.forEach((_, i) => later(() => { S.n = i + 1; render(); }, MOMENT() + i * ms('--motion-slow')));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === ' ') { e.preventDefault(); S.n = S.n >= ANS.length ? 0 : S.n + 1; render(); }
});
replay();
</script>
</body>
</html>
