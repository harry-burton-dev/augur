<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Combined V2 · The decision record</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V2: the decision record as it could ship in Mandate: words fixed, then and now, its actions, and who has relied on it ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4)}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2) var(--space-5);align-items:start}
.head .ln{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.head .t{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light)}
.head .res{grid-column:1;font-size:var(--type-body);line-height:var(--leading-body);max-width:calc(var(--measure-wide) + var(--space-8))}
.head.rev .t,.head.rev .res{opacity:var(--x-proposed-reversed)}
.head .meta{grid-column:1 / -1;display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.head .meta b{font-weight:400;color:var(--ink)}
.as{display:flex;gap:var(--space-1);align-items:center}
.as button{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);padding:2px var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key)}
.as button[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--light)}
.banner{grid-column:1 / -1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta);border:1px solid var(--hairline-strong);background:var(--x-proposed-stale) left top / var(--space-2) 100% no-repeat,var(--surface-inset)}
.banner.review{border-color:var(--x-proposed-warn);background:var(--x-proposed-warn-wash)}
.banner b{font-weight:400;color:var(--light)}
.cols{min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.95fr);gap:var(--space-4)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) var(--space-4)}
.col h3{display:flex;align-items:center;gap:var(--space-2);margin:0 0 var(--space-1);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.ev{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr) auto;gap:var(--space-1) var(--space-2);align-items:baseline;padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.ev .n{font:500 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--info)}
.ev .l{color:var(--ink)}
.ev .v{font-family:var(--font-mono);white-space:nowrap;color:var(--ink)}
.ev .v s{color:var(--ink-muted)}
.ev .v .x{color:var(--x-proposed-warn)}
.ev .why{grid-column:2 / -1;color:var(--ink-muted)}
.ev .why.x{color:var(--x-proposed-warn)}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-1) var(--space-2);align-items:start;padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.act .t{color:var(--light)}
.act .s{white-space:nowrap;color:var(--ink-muted)}
.act .m{grid-column:2 / -1;color:var(--ink-muted)}
.q4{grid-column:2 / -1;display:flex;gap:2px}
.q4 i{flex:1;height:3px;border-radius:1px;background:var(--hairline)}
.q4 i.on{background:var(--ink)} .q4 i.res{background:var(--x-proposed-lit)} .q4 i.gone{background:var(--x-proposed-stale)}
.tr{display:grid;grid-template-columns:calc(var(--space-7) + var(--space-5)) minmax(0,1fr);gap:var(--space-1) var(--space-2);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.tr .sig{font:400 var(--type-label)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.sig.followed{color:var(--x-proposed-lit)} .sig.questioned{color:var(--x-proposed-warn)} .sig.cites{color:var(--info)} .sig.reversed{color:var(--ink)}
.tr .seam{grid-column:2;margin-top:2px}
.cite{margin-top:auto;padding-top:var(--space-2);border-top:1px solid var(--hairline-strong);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.cref{display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);white-space:nowrap;color:var(--ink)}
.cref.st-reversed{background:var(--x-proposed-stale)} .cref.st-review{border-color:var(--x-proposed-warn)}
.who2{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:var(--space-2)}
@media (max-width:1400px){.head .t{font-size:var(--type-heading);line-height:var(--leading-heading)}.head .res{font-size:var(--type-meta);line-height:var(--leading-meta)}.cols{gap:var(--space-3)}.col{padding:var(--space-2) var(--space-3)}.ev .why{display:none}.ev .why.x{display:block}.act .m{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V2</b> the decision record: words fixed, status beside them, then and now, its actions as open questions, and who has relied on it · record V1 V2 V3, grammar V4, actions V3, revisit V3</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = Dn('D-118'), MT = meetingOf('D-118');
const ASAT = [MT.date, '2026-10-20', DATA.today];
const S = { as: DATA.today };
const LINE = { e4: D.revisitIf[0], e3: D.revisitIf[1] };
const nowOf = (e, at) => at === MT.date ? e.then : e.series === 'cost' ? `£${seriesAt('cost', at)}` : e.series === 'overdue' ? `${seriesAt('overdue', at)} of 18` : e.series === 'fitters' ? `${seriesAt('fitters', at)} of 2` : e.now;
function treatment(at) {
  const out = [];
  Object.entries(DATA.decisions).forEach(([id, d]) => { const on = meetingOf(id).date; if (!le(on, at)) return;
    if (d.affirms === 'D-118') out.push([on, 'followed', did(id) + ' ' + d.title]);
    if (d.relates === 'D-118') out.push([on, id === 'D-130' ? 'questioned' : 'cites', did(id) + ' ' + d.title]);
    if (d.reverses === 'D-118') out.push([on, 'reversed', did(id) + ' ' + d.title]); });
  Object.entries(DATA.docs).forEach(([id, doc]) => { if ((doc.cites || []).includes('D-118') && le(doc.date, at)) out.push([doc.date, 'cites', `${doc.title} <span class="muted">· ${doc.app}</span>`, statusAt('D-118', at) === 'reversed' ? `<span class="seam">seam: cites a reversed decision · ${P(doc.by).name} to update</span>` : '']); });
  return out.sort((a, b) => ts(a[0]) - ts(b[0]));
}
function render() {
  const at = S.as, st = statusAt('D-118', at), succ = Dn(D.reversedBy);
  const banner = st === 'reversed' ? `<div class="banner dep">${I('corner-down-right', 18)}<span><b>Reversed on ${dt(D.reversedOn)} by ${did(D.reversedBy)}.</b> ${succ.plain} The words below are as agreed; they are not edited.</span><button class="btn sm">Open ${D.reversedBy}</button></div>`
    : st === 'review' ? `<div class="banner review dep">${I('eye', 18)}<span><b>Worth revisiting.</b> ${D.revisitIf.filter(t => t.tripped && le(t.tripped, at)).length} lines set at the table have been crossed. It stays in force until the meeting decides; it is on the agenda for 3 Nov.</span><button class="btn sm">See the agenda</button></div>` : '';
  const tr = treatment(at);
  $('#app').innerHTML = topHTML(['Mandate', 'Decisions', B.short, 'D-118'], [['A', 'as at'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: at }) +
    `<main class="main"><div class="wrap">
    <header class="head ${st === 'reversed' ? 'rev' : ''}"><div class="ln">${did('D-118')}${stHTML(st)}<span class="small muted">${Kd(D.kind).name} · asks for ${Kd(D.kind).bar} or surer</span></div>
      <span class="as">${ASAT.map(d => `<button data-d="${d}" aria-pressed="${d === at}">${d === DATA.today ? 'today' : dt(d, 'short')}</button>`).join('')}</span>
      <h1 class="t">${D.title}</h1><span></span>
      <p class="res"><span class="rv">Resolved</span>${D.words}</p><span></span>
      <div class="meta"><span>${B.name} · <b>${MT.no}</b>, item ${D.item}, ${dt(MT.date)}</span><span>${D.vote.for.length} for, ${D.vote.abstain.length} abstained · noted: ${P(D.dissent[0].by).name}</span><span>minute confirmed <b>${dt(MT.confirmed, 'short')}</b></span><span>said, not decided: ${D.obiter.length} remarks</span></div>
      ${banner}</header>
    <div class="cols">
      <section class="col pane scroll" aria-label="What it rests on"><h3>${I('layers', 14)} What it rests on · then${at !== MT.date ? ` · on ${dt(at, 'short')}` : ''}</h3>
        ${D.evidence.map((e, i) => { const nv = nowOf(e, at), moved = nv !== e.then, ln = LINE[e.id], x = ln && ln.tripped && le(ln.tripped, at);
          return `<div class="ev"><span class="n">${i + 1}</span><span class="l">${e.label}${e.kind === 'assume' ? ' <span class="muted">· assumed</span>' : e.word ? ` <span class="muted">· ${e.word}</span>` : ''}</span><span class="v">${moved ? `<s>${e.then}</s> <span class="${x ? 'x' : ''}">${nv}</span>` : e.then} ${e.series && at !== MT.date ? spark(e.series, { at, line: ln ? ln.at : null, op: ln ? ln.op : null, w: 56, h: 16 }) : ''}</span>
          <span class="why ${x ? 'x' : ''}">${x ? 'crossed: ' + ln.text : moved ? 'moved · no line was set' : e.app}</span></div>`; }).join('')}
        <div class="ev"><span class="n">${I('eye', 12)}</span><span class="l">Review at the November meeting</span><span class="v muted">${dt(D.revisitIf[2].date, 'short')}</span></div></section>
      <section class="col pane scroll" aria-label="What follows"><h3>${I('circle-dot', 14)} What follows · asked, accepted, answered, closed</h3>
        ${D.actions.map(id => { const a = Ac(id), s = actionAt(id, at), k = { given: 1, accepted: 2, part: 2, done: 3, discharged: 4, overtaken: -1 }[s.s];
          return `<div class="act">${amHTML(s.shown, 16)}<span class="t">${a.text}</span><span class="s">${s.late ? `<span class="late">${s.late}d late</span>` : AS[s.shown].s}</span>
          <span class="m">${id} · ${who(a.owner)} · by ${dt(s.due, 'short')}${s.due !== a.due ? ` <span class="seam"><s>${dt(a.due, 'short')}</s> moved ${(a.moves || []).filter(m => le(m.on, at)).length}×</span>` : ''}</span>
          <span class="q4">${[1, 2, 3, 4].map(n => `<i class="${k === -1 ? 'gone' : n <= k ? (k === 4 ? 'res' : 'on') : ''}"></i>`).join('')}</span></div>`; }).join('')}
        <p class="who2">Only ${P(B.chair).name}, who asked, can close an action. Owners say done; he closes, at matters arising or here.</p></section>
      <section class="col pane scroll" aria-label="Who has relied on it"><h3>${I('link', 14)} Who has relied on it · ${tr.length}</h3>
        ${tr.map(r => `<div class="tr"><span class="sig ${r[1]}">${r[1]}</span><span>${r[2]}</span>${r[3] ? r[3] : ''}</div>`).join('')}
        <p class="cite">Cite it anywhere and the citation reads the record: ${(() => { const s = statusAt('D-118', at); return `<span class="cref ${ST[s].cls}">${did('D-118')}<i class="dm ${ST[s].cls}"></i>${ST[s].w.toLowerCase()}${s === 'reversed' ? ' → ' + D.reversedBy : ''}</span>`; })()}</p></section>
    </div></div></main>`;
  Icons.hydrate($('#app'));
  $$('.as button').forEach(b => b.onclick = () => { S.as = b.dataset.d; render(); });
}
function replay() {
  clearLater(); S.as = '2026-10-20'; render(); settle();
  /* the moment: the record is read on today's date. The banner, statuses and citations change; the words don't */
  later(() => { S.as = DATA.today; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'a') { S.as = ASAT[(ASAT.indexOf(S.as) + 1) % ASAT.length]; render(); }
});
replay();
</script>
</body>
</html>
