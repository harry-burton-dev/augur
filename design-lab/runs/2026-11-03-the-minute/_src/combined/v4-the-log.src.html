<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Combined V4 · The floor’s decision log</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V4: one log, three ways in: ask it, open it at a date, or read it by meeting; answers built from records ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3) var(--space-5)}
.ask{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-4);align-items:center}
.box{display:flex;align-items:center;gap:var(--space-3);height:calc(var(--target-md) + var(--space-1));padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-inset);font-size:var(--type-lead);color:var(--light)}
.box input{flex:1;min-width:0;background:none;border:0;color:var(--light);font:400 var(--type-lead)/1 var(--font-sans)}
.box input:focus-visible{outline:none}
.box:focus-within{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.as{display:flex;gap:var(--space-1);align-items:center}
.as button{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);padding:2px var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key)}
.as button[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--light)}
.over{grid-column:1 / -1;position:relative;height:calc(var(--space-7) + var(--space-3));padding:0 var(--space-3)}
.over svg{width:100%;height:100%;overflow:visible;display:block}
.over .area{fill:color-mix(in srgb,var(--light) 10%,transparent);stroke:var(--ink-muted);stroke-width:1}
.over .mt{fill:var(--floor-department-high)}
.over .mo{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--ink-muted)}
.over .cur{stroke:var(--x-proposed-lit);stroke-width:2}
.over .curl{font:400 var(--type-small) var(--font-mono);fill:var(--x-proposed-lit)}
.over .rev{fill:var(--ink)}
.over .lbl{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--ink-muted)}
.list{min-height:0;padding:var(--space-3) var(--space-4)}
.ansl{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);margin-bottom:var(--space-2)}
.mtg{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-4)) minmax(0,1fr);gap:var(--space-4);padding:var(--space-2) 0;border-top:1px solid var(--hairline)}
.mtg .d{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.mtg .d .draft{color:var(--x-proposed-warn)}
.row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:2px 0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.row .t{color:var(--light)}
.row.dim .t{color:var(--ink-muted)}
.row .r{font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.row mark{background:color-mix(in srgb,var(--info) 22%,transparent);color:var(--light);border-radius:2px}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-3) var(--space-4)}
.side ol{margin:0;padding-left:var(--space-4);display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small)}
.side ol span{color:var(--ink-muted)}
.side .ch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,1fr) 280px;gap:var(--space-3) var(--space-4)}.row .r{display:none}.box,.box input{font-size:var(--type-body)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V4</b> the floor’s decision log: ask it, open it at a date, or read it by meeting; every answer built from the records · log V1 V2 V3 V4</div>
<script>
/*@DATA@*/
/*@LIB@*/
const FROM = '2025-11-01', TO = NOW;
const ASAT = ['2026-08-01', DATA.today];
const S = { q: '', as: DATA.today };
const ids = () => Object.keys(DATA.decisions);
const hit = id => { const q = S.q.trim().toLowerCase(); if (!q) return true; const d = Dn(id); return ((d.subjects || []).join(' ') + ' ' + d.title + ' ' + d.words).toLowerCase().includes(q); };
const live = (id, at) => ['in force', 'review'].includes(statusAt(id, at));
const mk = t => { const q = S.q.trim(); return q ? t.replace(new RegExp(q, 'ig'), m => `<mark>${m}</mark>`) : t; };
function overview() {
  const el = $('#over'); const W = el.clientWidth - 24, H = el.clientHeight - 18, x = scaleX(FROM, TO, W), days0 = days(FROM, TO);
  const pts = []; let max = 1;
  for (let k = 0; k <= 60; k++) { const d = new Date(ts(FROM) + days0 * 864e5 * k / 60).toISOString().slice(0, 10); const n = ids().filter(id => live(id, d) && hit(id)).length; max = Math.max(max, n); pts.push([d, n]); }
  const Y = n => H - 14 - n / max * (H - 26);
  const area = `M${x(FROM)},${Y(0)} ` + pts.map(([d, n]) => `L${x(d)},${Y(n)}`).join(' ') + ` L${x(TO)},${Y(0)} Z`;
  const ends = ids().filter(hit).filter(id => Dn(id).reversedOn).map(id => `<circle class="rev" cx="${x(Dn(id).reversedOn)}" cy="${Y(0) - 4}" r="2.5"/><text class="lbl" x="${x(Dn(id).reversedOn) - 4}" y="${Y(0) - 10}" text-anchor="end">${id} reversed</text>`).join('');
  return `<path class="area" d="${area}"/>${DATA.meetings.map(m => `<circle class="mt" cx="${x(m.date)}" cy="${H - 6}" r="2"/>`).join('')}${['2025-12-01', '2026-03-01', '2026-06-01', '2026-09-01'].map(d => `<text class="mo" x="${x(d)}" y="${H + 8}">${dt(d, 'month')}</text>`).join('')}${ends}
    <line class="cur" x1="${x(S.as)}" x2="${x(S.as)}" y1="0" y2="${H - 2}"/><text class="curl" x="${x(S.as) - 6}" y="12" text-anchor="end">${dt(S.as, 'short')} · ${ids().filter(id => live(id, S.as) && hit(id)).length} in force</text>`;
}
function render() {
  const at = S.as, H = ids().filter(id => hit(id) && le(meetingOf(id).date, at)), L = H.filter(id => live(id, at));
  const q = S.q.trim();
  const ans = q ? `${H.length} decision${H.length === 1 ? '' : 's'} mention ${q}${at !== NOW ? ` by ${dt(at)}` : ''}. ${L.length ? `In force ${at === NOW ? 'today' : 'then'}: ${L.join(', ')}.` : `None ${at === NOW ? 'is' : 'was'} in force.`}`
    : `${L.length} decisions in force ${at === NOW ? 'today' : 'on ' + dt(at)}, of ${H.length} made${at === NOW ? '' : ' by then'}.`;
  const ms2 = DATA.meetings.filter(m => le(m.date, at) && H.some(id => Dn(id).meeting === m.id)).reverse();
  const since = ids().filter(id => { const d = Dn(id); return [d.reversedOn, d.amendedOn, d.lapsedOn].some(o => o && ts(o) > ts(at)) && hit(id); });
  $('#app').innerHTML = topHTML(['Mandate', B.short, 'Decisions'], [['/', 'ask'], ['A', 'as at'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: at }) +
    `<main class="main"><div class="wrap">
    <div class="ask"><label class="box">${I('search', 20)}<input id="q" value="${S.q}" placeholder="Ask about a subject: what did we decide about…" aria-label="Ask the log"></label><span class="as"><span class="lab">as at</span>${ASAT.map(d => `<button data-d="${d}" aria-pressed="${d === at}">${d === NOW ? 'today' : dt(d, 'short')}</button>`).join('')}</span></div>
    <div class="over" id="over" aria-label="Decisions in force over time"><svg id="svg"></svg></div>
    <section class="list pane scroll" aria-label="Decisions"><p class="ansl">${ans}</p>
      ${ms2.map(m => `<div class="mtg"><p class="d">${dt(m.date, 'short')} · ${m.no}<br>${m.confirmed && le(m.confirmed, at) ? 'confirmed' : '<span class="draft">draft</span>'}</p><div>${H.filter(id => Dn(id).meeting === m.id).map(id => { const st = statusAt(id, at), d = Dn(id); return `<div class="row ${live(id, at) ? '' : 'dim'}">${did(id)}<i class="dm ${ST[st].cls}"></i><span class="t">${mk(d.title)}</span><span class="r">${ST[st].w.toLowerCase()}${st === 'reversed' ? ' by ' + d.reversedBy : st === 'amended' ? ' by ' + d.amendedBy : ''}</span></div>`; }).join('')}</div></div>`).join('')}</section>
    <aside class="side pane scroll"><p class="lab">How this was answered</p><ol><li>Subject: ${q ? `<b style="font-weight:400" class="lite">${q}</b> <span>· catchwords and words</span>` : '<span>none: every decision</span>'}</li><li>As at: <b style="font-weight:400" class="lite">${dt(at)}</b> <span>· status read on that date</span></li><li><span>Only decisions you can open</span></li></ol>
      ${at !== NOW ? `<p class="lab" style="margin-top:var(--space-2)">Changed since ${dt(at, 'short')}</p>${since.map(id => `<div class="ch">${did(id)}<span>${Dn(id).reversedOn ? 'reversed ' + dt(Dn(id).reversedOn, 'short') + ' by ' + Dn(id).reversedBy : Dn(id).amendedOn ? 'amended' : 'lapsed'}</span></div>`).join('') || '<p class="small muted">nothing</p>'}` : ''}
      <p class="small muted" style="margin-top:auto">The answer is built from the records by a template, never by the model, so it reads the same in every deployment. The shape above is how many of this body’s decisions stood on each day.</p></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
  $('#svg').innerHTML = overview();
  const qi = $('#q'); qi.oninput = () => { S.q = qi.value; const p = qi.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
  $$('.as button').forEach(b => b.onclick = () => { S.as = b.dataset.d; render(); });
}
addEventListener('resize', () => { $('#svg').innerHTML = overview(); });
function replay() {
  clearLater(); S.q = ''; S.as = DATA.today; render(); settle();
  /* the moment: a subject is asked; the answer sentence, the list and the shape above all narrow to it */
  const w = DATA.decisions['D-118'].subjects[1];
  [...w].forEach((c, i) => later(() => { S.q = w.slice(0, i + 1); render(); }, MOMENT() + i * ms('--motion-instant')));
}
document.addEventListener('keydown', e => {
  if (e.target.id === 'q') { if (e.key === 'Escape') { S.q = ''; render(); } return; }
  if (commonKeys(e, render, replay)) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  if (e.key.toLowerCase() === 'a') { S.as = ASAT[(ASAT.indexOf(S.as) + 1) % ASAT.length]; render(); }
});
replay();
</script>
</body>
</html>
