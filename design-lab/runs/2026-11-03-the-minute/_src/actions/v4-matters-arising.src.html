<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Actions V4 · Matters arising</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: actions are asked about at the next meeting, not chased by pings. Owners write their update before it ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--space-5)}
.paper{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-5)}
.paper .hd p.s{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:var(--space-1)}
.ma{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--hairline)}
.ma .n{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.ma .t{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.ma .st{font-size:var(--type-small);line-height:var(--leading-meta);white-space:nowrap;text-align:right}
.ma .up{grid-column:2 / -1;font-size:var(--type-small);line-height:var(--leading-small);padding:var(--space-2) var(--space-3);border-left:2px solid var(--hairline-strong);background:var(--surface-inset);border-radius:0 var(--radius-key) var(--radius-key) 0;transition:border-color var(--motion-calm) var(--ease-out)}
.ma .up b{font-weight:400;color:var(--ink-muted)}
.ma .up.new{border-left-color:var(--x-proposed-lit)}
.ma .up.none{border-left-style:dashed;color:var(--ink-muted);background:none}
.ma .ask{grid-column:2 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ma .ask b{font-weight:400;color:var(--ink)}
.owner{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-5)}
.cal{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-inset);border:1px solid var(--hairline-strong);font-size:var(--type-meta);line-height:var(--leading-meta)}
.cal b{font-weight:400;color:var(--light)}
.form textarea{width:100%;min-height:calc(var(--space-8));resize:none;background:var(--surface-inset);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink);font:400 var(--type-meta)/var(--leading-meta) var(--font-sans);padding:var(--space-2) var(--space-3)}
.form textarea:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.form .row{display:flex;gap:var(--space-2);align-items:center;margin-top:var(--space-2);flex-wrap:wrap}
.owner p.r{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.paper,.owner{padding:var(--space-3) var(--space-4)}.wrap{gap:var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Actions · V4</b> matters arising: open actions are asked about at the next meeting, in the owner’s own words, not chased · board practice, the edition’s rhythm</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = '2026-10-09';
const NEXT = DATA.meetings.find(m => ts(m.date) > ts(NOW)), PREV = [...DATA.meetings].reverse().find(m => ts(m.date) <= ts(NOW));
const DUE_UPDATE = (() => { const t = new Date(ts(NEXT.date) - 2 * 864e5); return t.toISOString().slice(0, 10); })();
/* owners' updates, in their own words, written before the meeting */
const UPDATES = {
  'A-308': { on: '2026-10-07', text: 'Supplier’s quote accepted. Install booked for 10 Nov, so it should land just before the date.' },
  'A-302': { on: null, text: 'One fitter started 9 Sep. The second post is re-advertised at grade 6 (D-125) and closes 20 Oct. Two good applicants so far.' }
};
const S = { sent: false };
function items() {
  return Object.keys(DATA.actions).filter(id => { const s = actionAt(id); return s && Ac(id).setBy === B.chair && s.s !== 'discharged'; })
    .map(id => ({ id, a: Ac(id), s: actionAt(id) })).sort((x, y) => ts(x.a.set) - ts(y.a.set));
}
function render() {
  const its = items(), me = 'p3';
  const upd = id => id === 'A-302' ? (S.sent ? { ...UPDATES[id], on: NOW } : null) : UPDATES[id];
  $('#app').innerHTML = topHTML(['Mandate', B.short, NEXT.no, 'Agenda'], [['Enter', 'send the update'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: NOW }) +
    `<main class="main"><div class="wrap">
    <section class="paper pane scroll" aria-label="Matters arising"><div class="hd"><p class="eyebrow">The chair’s paper · ${NEXT.no}, ${dt(NEXT.date)} · item 2</p><p class="h2">Matters arising</p>
      <p class="s">Every action this meeting has set that is not yet closed, oldest first, with its owner’s own update. The chair reads them out; nobody is chased between meetings.</p></div>
      ${its.map((r, i) => { const u = upd(r.id); const ask = r.s.s === 'done' ? `<b>Close it?</b> Done since ${dt(r.s.on, 'short')}, never closed.` : r.s.late ? `<b>Ask:</b> it is ${r.s.late} days late.` : days(NOW, r.s.due) < 30 ? `<b>Ask:</b> due ${dt(r.s.due, 'short')}, in ${days(NOW, r.s.due)} days. Will it land?` : `Due ${dt(r.s.due, 'short')}. Nothing to ask yet.`;
        return `<div class="ma dep" style="--i:${i}"><span class="n">${r.id}</span><span class="t">${r.a.text}</span><span class="st">${amHTML(r.s.shown, 14)} ${who(r.a.owner)}</span>
          ${r.s.s === 'done' ? `<div class="up"><b>${first(r.a.owner)}, ${dt(r.s.on, 'short')}:</b> ${r.s.note || 'done'}</div>` : u ? `<div class="up ${r.id === 'A-302' ? 'new' : ''}"><b>${first(r.a.owner)}, ${dt(u.on, 'short')}:</b> ${u.text}</div>` : `<div class="up none">No update yet. Due ${dt(DUE_UPDATE, 'short')}.</div>`}
          <span class="ask">${ask} From ${did(r.a.from)}${r.s.due !== r.a.due ? ` · <span class="seam"><s>${dt(r.a.due, 'short')}</s> moved ${(r.a.moves || []).length}×</span>` : ''}</span></div>`; }).join('')}
    </section>
    <section class="owner pane" aria-label="Owner's view"><p class="eyebrow">The owner’s view · ${P(me).name}</p><p class="h2">You’ll be asked about this</p>
      <div class="cal">${I('calendar', 18)}<span><b>${NEXT.no}, ${dt(NEXT.date)}</b> · ${B.short}, matters arising. Please send your update by <b>${dt(DUE_UPDATE)}</b>.</span></div>
      <p class="r">${Ac('A-302').text} · ${'A-302'} · from ${did('D-118')} · due ${dt(dueAt('A-302'), 'short')}</p>
      <div class="form"><textarea aria-label="Your update" ${S.sent ? 'readonly' : ''}>${UPDATES['A-302'].text}</textarea>
        <div class="row">${S.sent ? `<span class="small" style="color:var(--x-proposed-lit)">${I('check', 14)} Sent ${dt(NOW, 'short')}. It is on the chair’s paper in your words.</span>` : `<button class="btn go sm" data-send>${I('send', 12)} Send update <span class="kbd">Enter</span></button><button class="btn sm">${I('calendar-clock', 12)} Ask to move the date</button>`}</div></div>
      <p class="r" style="margin-top:auto">One reminder, ${days(DUE_UPDATE, NEXT.date) + 2} days before the meeting, if no update has been written. No other notices. If the action is late, the meeting is where that is said, with the reason you gave.</p></section>
    </div></main>`;
  Icons.hydrate($('#app'));
  $('[data-send]')?.addEventListener('click', () => { S.sent = true; render(); });
}
function replay() {
  clearLater(); S.sent = false; render(); settle();
  /* the moment: Jo sends her update; it lands on the chair's paper in her words */
  later(() => { S.sent = true; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'Enter' && !e.target.closest('textarea')) { S.sent = true; render(); }
});
replay();
</script>
</body>
</html>
