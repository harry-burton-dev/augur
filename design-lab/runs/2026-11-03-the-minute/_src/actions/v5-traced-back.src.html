<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Actions V5 · Traced back</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: every action carries its chain: why it exists, who asked, what it serves. Owner reads up; chair reads down ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:var(--space-5)}
.inbox{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-5)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--x-proposed-warn);border-radius:var(--radius-inset);background:var(--surface-inset)}
.item .t{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.item .m{grid-column:2 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.chain{display:grid;gap:0;margin-left:var(--space-3)}
.lk{position:relative;display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-3);padding:var(--space-2) 0 var(--space-3);transition:opacity var(--motion-calm) var(--ease-out)}
.lk::before{content:"";position:absolute;left:calc(var(--space-2) + 1px);top:var(--space-6);bottom:0;width:1px;background:var(--hairline-strong)}
.lk:last-child::before{display:none}
.lk .ic{display:inline-flex;align-items:center;justify-content:center;width:var(--space-5);height:var(--space-5);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);color:var(--ink);background:var(--slate-deep)}
.lk b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.lk span.d{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.lk .k{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.chain.pre-c .lk{opacity:0}
.tree{min-height:0;padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-2)}
.node{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);align-items:center;font-size:var(--type-meta);line-height:var(--leading-meta);padding:var(--space-1) 0}
.node.l0{font-size:var(--type-body);color:var(--light);margin-top:var(--space-2)}
.node.l1{margin-left:var(--space-5);padding-left:var(--space-3);border-left:1px solid var(--hairline-strong)}
.node.l2{margin-left:calc(var(--space-5) * 2);padding-left:var(--space-3);border-left:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.node .r{font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.node.hot{background:var(--x-proposed-warn-wash)}
.node.gone{opacity:var(--x-proposed-quiet)}
@media (max-width:1400px){.inbox,.tree{padding:var(--space-3)}.item .t{font-size:var(--type-body);line-height:var(--leading-body)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Actions · V5</b> traced back: the owner reads up from the action to the intent it serves; the chair reads down from intents to actions · hierarchy without containers</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = '2026-11-02';
const ID = 'A-302', A = Ac(ID), D = Dn(A.from), MT = meetingOf(A.from);
const INTENT_OF = { 'D-118': 'M-42', 'D-120': 'M-42', 'D-124': 'M-42', 'D-129': 'M-42', 'D-117': null };
const S = { chain: true };
function render() {
  const s = actionAt(ID), st = statusAt(A.from);
  const chain = [
    ['circle-dot', 'Your action', A.text, `${ID} · due ${dt(s.due, 'short')} · ${s.late ? s.late + ' days late' : AS[s.shown].s}`],
    ['user-round', 'Asked by', `${P(A.setBy).name}, ${P(A.setBy).role}`, `on ${dt(A.set)}, at ${MT.no}. Only he can close it.`],
    ['stamp', 'Because of', `${did(A.from)} ${D.title}`, `${ST[st].w}${st === 'review' ? ': a line set at the table has been crossed' : ''}. ${D.plain}`],
    ['eye', 'It depends on you', D.evidence.find(e => e.kind === 'assume').label, `The decision assumed this. Today: ${D.evidence.find(e => e.kind === 'assume').now}.`],
    ['target', 'Which serves', `Intent M-42: ${intentT('M-42')}`, `${P(DATA.intents['M-42'].owner).name}’s intent on the ${DATA.floors[DATA.intents['M-42'].floor].word} floor, due ${dt(DATA.intents['M-42'].due, 'short')}`]
  ];
  const decs = Object.keys(INTENT_OF).filter(d => INTENT_OF[d] === 'M-42');
  $('#app').innerHTML = topHTML(['Inbox'], [['T', 'record fields', 'h-t'], ['R', 'replay']], { as: NOW, floor: 'team' }) +
    `<main class="main"><div class="wrap">
    <section class="inbox pane scroll" aria-label="Owner's view"><p class="eyebrow">The owner’s view · ${P(A.owner).name}’s Inbox</p>
      <div class="item dep">${amHTML(s.shown, 20)}<span class="t">${A.text}</span><span class="late">${s.late} days late</span><span class="m">from ${did(A.from)} · asked by ${P(A.setBy).name} · <span class="seam"><s>${dt(A.due, 'short')}</s> ${dt(s.due, 'short')} · moved ${A.moves.length}×</span></span></div>
      <p class="lab" style="margin-top:var(--space-2)">Why this is yours</p>
      <div class="chain ${S.chain ? '' : 'pre-c'}">${chain.map(([ic, k, b, d], i) => `<div class="lk" style="transition-delay:calc(${i} * var(--motion-instant))"><span class="ic">${I(ic, 14)}</span><span><span class="k">${k}</span><b>${b}</b><span class="d">${d}</span></span></div>`).join('')}</div>
      <p class="small muted">Read upwards, an action says why it matters. Here that is the honest part: the decision rests on this action’s assumption, and that assumption has not held.</p></section>
    <section class="tree pane scroll" aria-label="Chair's view"><p class="eyebrow">The chair’s view · from what was asked to who is doing it</p><p class="h2">${P(B.chair).name}’s tree</p>
      <div class="node l0 dep">${I('target', 16)}<span>Intent M-42 · ${intentT('M-42')}</span><span class="r">due ${dt(DATA.intents['M-42'].due, 'short')}</span></div>
      ${decs.filter(d => le(meetingOf(d).date, NOW)).map((d, i) => `<div class="node l1 dep" style="--i:${i}">${`<i class="dm ${ST[statusAt(d)].cls}"></i>`}<span>${did(d)} ${Dn(d).title}</span><span class="r">${ST[statusAt(d)].w}</span></div>
        ${Object.keys(DATA.actions).filter(id => Ac(id).from === d && actionAt(id)).map(id => { const x = actionAt(id); return `<div class="node l2 ${id === ID ? 'hot' : ''} ${x.s === 'discharged' ? 'gone' : ''}">${amHTML(x.shown, 14)}<span>${Ac(id).text}</span><span class="r">${who(Ac(id).owner, { initials: true })} · ${x.late ? `<span class="late">${x.late}d late</span>` : AS[x.shown].s}</span></div>`; }).join('')}`).join('')}
      <div class="node l0 dep" style="--i:6">${I('circle-help', 16)}<span>Not linked to an intent</span><span class="r">${Object.keys(INTENT_OF).filter(d => !INTENT_OF[d]).length} decision</span></div>
      ${Object.keys(INTENT_OF).filter(d => !INTENT_OF[d]).map(d => `<div class="node l1 dep">${`<i class="dm ${ST[statusAt(d)].cls}"></i>`}<span>${did(d)} ${Dn(d).title}</span><span class="r">${ST[statusAt(d)].w} · no intent: which does it serve?</span></div>`).join('')}
      <p class="tk">mandate.decision.answers → intent Ref · inbox.item.ref → decision Ref</p></section>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.chain = false; render(); settle();
  /* the moment: the chain unfolds upward from the action to the intent */
  later(() => { S.chain = true; $('.chain').classList.remove('pre-c'); }, MOMENT());
}
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
replay();
</script>
</body>
</html>
