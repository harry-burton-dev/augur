<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Actions V6 · One now line</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: every action on the floor on one time scale and one now line; the owner's view is the same board, lit for them ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-3)}
.hd{display:flex;align-items:end;justify-content:space-between;gap:var(--space-4)}
.pick{display:flex;gap:var(--space-1);flex-wrap:wrap}
.pick button{font-size:var(--type-small);padding:2px var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-pill);color:var(--ink-muted)}
.pick button[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--light)}
.board{min-height:0;position:relative;display:grid;grid-template-columns:minmax(260px,24%) minmax(0,1fr);grid-auto-rows:min-content;padding:var(--space-3) var(--space-4)}
.ax{position:sticky;top:0;z-index:2;height:var(--space-5);background:var(--slate-deep)}
.ax span{position:absolute;bottom:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.lbl{display:flex;align-items:center;gap:var(--space-2);min-height:var(--space-6);font-size:var(--type-small);line-height:var(--leading-small);padding-right:var(--space-3);border-bottom:1px solid var(--hairline);transition:opacity var(--motion-base) var(--ease-out)}
.lbl .t{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl.g{min-height:var(--space-5);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);border-bottom-color:var(--hairline-strong)}
.lbl.g .did{text-transform:none}
.lane{position:relative;min-height:var(--space-6);border-bottom:1px solid var(--hairline);transition:opacity var(--motion-base) var(--ease-out)}
.lane.g{min-height:var(--space-5);border-bottom-color:var(--hairline-strong)}
.dim{opacity:.28}
.bar{position:absolute;top:calc(var(--space-3) - 1px);height:var(--space-4);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);background:var(--surface-raised)}
.bar.mine{border-color:var(--light)}
.bar.done{background:none;border-style:solid;opacity:var(--x-proposed-quiet)}
.bar.gone{background:none;border-style:dotted}
.over{position:absolute;top:calc(var(--space-3) + var(--space-2) - 1px);height:2px;background:repeating-linear-gradient(90deg,var(--x-proposed-warn) 0 var(--space-1),transparent var(--space-1) var(--space-2))}
.old{position:absolute;top:calc(var(--space-3) + 1px);width:1px;height:calc(var(--space-4) - 4px);background:var(--info)}
.mark{position:absolute;top:calc(var(--space-3));transform:translateX(-50%);display:inline-flex}
.nowl{position:absolute;top:0;bottom:0;width:1px;background:var(--light);z-index:1;pointer-events:none}
.nowl span{position:sticky;top:0;display:block;transform:translateX(var(--space-1));font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--light);white-space:nowrap}
.foot{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.board{grid-template-columns:200px minmax(0,1fr)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Actions · V6</b> one now line: every action on the floor on one scale; late is a distance you can see; the owner’s view is the same board, lit for them · one-now, Gantt baselines</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = '2026-11-02';
const FROM = '2026-05-01', TO = '2026-12-15';
const OWNERS = ['all', ...new Set(Object.values(DATA.actions).map(a => a.owner))];
const S = { me: 'all' };
function render() {
  const X = scaleX(FROM, TO, 100);
  const ids = Object.keys(DATA.actions).filter(id => actionAt(id));
  const decs = [...new Set(ids.map(id => Ac(id).from))].sort();
  const late = ids.filter(id => actionAt(id).late), openN = ids.filter(id => actionAt(id).open).length;
  const lit = id => S.me === 'all' || Ac(id).owner === S.me;
  let rows = '';
  decs.forEach(d => {
    const mine = ids.filter(id => Ac(id).from === d), any = mine.some(lit);
    rows += `<div class="lbl g ${any ? '' : 'dim'}">${did(d)} <span class="t">${Dn(d).title}</span></div><div class="lane g ${any ? '' : 'dim'}"></div>`;
    mine.forEach(id => {
      const a = Ac(id), s = actionAt(id), en = s.open ? s.due : s.on, cls = s.s === 'overtaken' ? 'gone' : !s.open ? 'done' : '';
      rows += `<div class="lbl ${lit(id) ? '' : 'dim'}">${amHTML(s.shown, 14)}<span class="t" title="${a.text}">${a.text}</span></div>
        <div class="lane ${lit(id) ? '' : 'dim'}"><span class="bar ${cls} ${S.me !== 'all' && lit(id) ? 'mine' : ''}" style="left:${X(a.set)}%;width:${Math.max(.4, X(s.due) - X(a.set))}%" title="${id} · ${P(a.owner).name}"></span>
        ${(a.moves || []).filter(m => le(m.on, NOW)).map(m => `<span class="old" style="left:${X(m.from)}%" title="was due ${dt(m.from, 'short')}: ${m.why}"></span>`).join('')}
        ${s.late ? `<span class="over" style="left:${X(s.due)}%;width:${X(NOW) - X(s.due)}%"></span>` : ''}
        ${!s.open ? `<span class="mark" style="left:${X(s.on)}%">${amHTML(s.shown, 14)}</span>` : ''}</div>`;
    });
  });
  const who2 = S.me === 'all' ? P(B.chair).name + ' (chair): everyone' : P(S.me).name;
  const myOpen = S.me === 'all' ? openN : ids.filter(id => Ac(id).owner === S.me && actionAt(id).open).length;
  $('#app').innerHTML = topHTML(['Mandate', B.short, 'Actions'], [['O', 'next owner'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: NOW }) +
    `<main class="main"><div class="wrap">
    <div class="hd"><div><p class="eyebrow">One now line · ${who2}</p><p class="h1">Actions</p></div>
      <p class="foot" style="max-width:var(--measure-read)">${myOpen} open. ${late.filter(lit).length ? `<span class="late">${late.filter(lit).map(id => `${id} is ${actionAt(id).late} days past its date`).join('; ')}.</span>` : 'Nothing late.'} Bars run from when an action was set to its date. Thin blue ticks are dates it used to have; the dashes past a bar are how late it is.</p>
      <div class="pick">${OWNERS.map(p => `<button data-p="${p}" aria-pressed="${p === S.me}">${p === 'all' ? 'Everyone' : first(p)}</button>`).join('')}</div></div>
    <section class="board pane scroll" id="board"><div class="ax" style="grid-column:1"></div><div class="ax" style="grid-column:2">${[5, 6, 7, 8, 9, 10, 11, 12].map(m => { const d = `2026-${String(m).padStart(2, '0')}-01`; return `<span style="left:${X(d)}%">${dt(d.slice(0, 7), 'short')}</span>`; }).join('')}</div>
      ${rows}<span class="nowl" id="nowl"><span>now · ${dt(NOW, 'short')}</span></span></section>
    </div></main>`;
  Icons.hydrate($('#app'));
  $$('.pick button').forEach(b => b.onclick = () => { S.me = b.dataset.p; render(); });
  /* the now line is drawn once, by the board, not by each row */
  const bd = $('#board'), ax = $('.ax[style*="column:2"]'), r0 = bd.getBoundingClientRect(), r1 = ax.getBoundingClientRect();
  $('#nowl').style.left = (r1.left - r0.left + r1.width * X(NOW) / 100) + 'px';
}
addEventListener('resize', render);
function replay() {
  clearLater(); S.me = 'all'; render(); settle();
  /* the moment: the chair's board becomes Jo's: the same board, lit for her */
  later(() => { S.me = 'p3'; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'o') { S.me = OWNERS[(OWNERS.indexOf(S.me) + 1) % OWNERS.length]; render(); }
});
replay();
</script>
</body>
</html>
