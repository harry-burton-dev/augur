<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Record V6 · A decision’s life</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: one decision's whole life on one time scale; any date on it is an address ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5)}
.ttl{grid-column:1 / -1;display:flex;align-items:end;justify-content:space-between;gap:var(--space-5)}
.addr{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);border:1px solid var(--hairline);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2)}
.addr b{font-weight:400;color:var(--light)}
.tl{min-height:0;position:relative;padding:var(--space-3) var(--space-4)}
.tl svg{display:block;width:100%;height:100%;overflow:visible}
.tl .lane{font:400 var(--type-small) var(--font-sans);fill:var(--ink)}
.tl .lane2{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--ink-muted)}
.tl .mo{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--ink-muted)}
.tl .grid{stroke:var(--hairline)}
.tl .band-force{fill:color-mix(in srgb,var(--light) 22%,transparent)}
.tl .band-review{fill:var(--x-proposed-warn-wash);stroke:var(--x-proposed-warn);stroke-width:1}
.tl .band-rev{fill:url(#hatch)}
.tl .life{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.tl .life.open{stroke:var(--ink)}
.tl .life.late{stroke:var(--x-proposed-warn);stroke-dasharray:3 3}
.tl .life.gone{stroke:var(--ink-muted);stroke-dasharray:1 3}
.tl .due{fill:none;stroke:var(--ink-muted)}
.tl .due.old{stroke-dasharray:2 2}
.tl .done{fill:var(--light)}
.tl .closed{fill:var(--x-proposed-lit)}
.tl .ser{fill:none;stroke:var(--ink);stroke-width:1.25}
.tl .tw{stroke:var(--x-proposed-warn);stroke-dasharray:3 3}
.tl .twl{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--x-proposed-warn)}
.tl .over{fill:var(--x-proposed-warn)}
.tl .mt{fill:var(--slate-deep);stroke:var(--floor-department-high)}
.tl .mtl{font:400 var(--x-proposed-type-micro) var(--font-mono);fill:var(--ink)}
.tl .now{stroke:var(--light);stroke-width:1}
.tl .cur{stroke:var(--x-proposed-lit);stroke-width:2}
.tl .curl{font:400 var(--type-small) var(--font-mono);fill:var(--x-proposed-lit)}
.rec{min-height:0;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.rec .res{font-size:var(--type-body);line-height:var(--leading-body)}
.rec ul{margin:0;padding:0;list-style:none;display:grid;gap:var(--space-1)}
.rec li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);align-items:start}
.rec .ev{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-2)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,1fr) 300px}.rec{padding:var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>A decision record · V6</b> a decision’s life on one time scale; any date is an address you can open and share · one-now, time as an address, Marey</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = Dn('D-118'), MT = meetingOf('D-118');
const FROM = '2026-05-01', TO = '2026-12-15';
const S = { at: MT.date };
const EVENTS = [[MT.date, 'Agreed at ' + MT.no], [MT.confirmed, 'Minute confirmed'], [D.revisitIf[1].tripped, 'Line crossed: one fitter, not two'], [D.affirmedOn, 'Kept by ' + D.affirmedBy], [D.revisitIf[0].tripped, 'Line crossed: 5 vans overdue'], ['2026-10-13', 'Review brought forward (D-130)'], [D.reversedOn, 'Reversed by ' + D.reversedBy]];
function svg() {
  const el = $('#tl'), W = el.clientWidth - 2 * 16, H = el.clientHeight - 2 * 12, L = 150, x = scaleX(FROM, TO, W - L), X = d => L + x(d);
  const rowH = Math.min(84, (H - 40) / 7.4), y0 = 22; const Y = i => y0 + i * rowH;
  const out = [`<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="transparent"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--x-proposed-hatch)" stroke-width="2"/></pattern></defs>`];
  for (let m = 5; m <= 12; m++) { const d = `2026-${String(m).padStart(2, '0')}-01`; out.push(`<line class="grid" x1="${X(d)}" x2="${X(d)}" y1="${y0 - 8}" y2="${H}"/><text class="mo" x="${X(d) + 4}" y="${y0 - 10}">${dt(d.slice(0, 7), 'short')}</text>`); }
  /* lane 0: status bands */
  const segs = [[MT.date, D.revisitIf[1].tripped, 'force'], [D.revisitIf[1].tripped, D.affirmedOn, 'review'], [D.affirmedOn, D.revisitIf[0].tripped, 'force'], [D.revisitIf[0].tripped, D.reversedOn, 'review'], [D.reversedOn, TO, 'rev']];
  out.push(`<text class="lane" x="0" y="${Y(0) + 14}">${D.id || 'D-118'} status</text>`);
  segs.forEach(([a, b, k]) => { if (le(a, S.at)) { const bb = le(b, S.at) ? b : S.at; out.push(`<rect class="band-${k}" x="${X(a)}" y="${Y(0)}" width="${Math.max(1, X(bb) - X(a))}" height="${rowH * .5}" rx="2"/>`); } });
  /* lanes 1-3: actions */
  D.actions.forEach((id, i) => {
    const a = Ac(id), y = Y(i + 1) + rowH * .3, s = actionAt(id, S.at);
    out.push(`<text class="lane" x="0" y="${y + 4}">${id} · ${first(a.owner)}</text>`);
    if (!s) return;
    const endH = a.history.filter(([d]) => le(d, S.at)); const last = endH[endH.length - 1][0];
    const end = s.open ? S.at : last;
    out.push(`<line class="life ${s.shown === 'overtaken' ? 'gone' : s.late ? 'late' : ''}" x1="${X(a.set)}" x2="${X(end)}" y1="${y}" y2="${y}"/>`);
    [a.due, ...(a.moves || []).filter(m => le(m.on, S.at)).map(m => m.to)].forEach((d, k, arr) => out.push(`<rect class="due ${k < arr.length - 1 ? 'old' : ''}" x="${X(d) - 4}" y="${y - 4}" width="8" height="8" transform="rotate(45 ${X(d)} ${y})"/>`));
    a.history.filter(([d, st]) => le(d, S.at) && (st === 'done' || st === 'discharged')).forEach(([d, st]) => out.push(`<circle class="${st === 'done' ? 'done' : 'closed'}" cx="${X(d)}" cy="${y}" r="4"/>`));
  });
  /* lanes 4-5: what it rests on, with the revisit lines */
  [['overdue', D.revisitIf[0], 'vans overdue'], ['fitters', D.revisitIf[1], 'fitters in post']].forEach(([k, t, w], i) => {
    const s = DATA.series[k], y = Y(4 + i), h = rowH * .8, max = k === 'overdue' ? 8 : 2.4, Yv = v => y + h - v / max * h;
    out.push(`<text class="lane" x="0" y="${y + h / 2}">${w}</text><text class="lane2" x="0" y="${y + h / 2 + 14}">revisit if ${t.op} ${t.at}</text>`);
    out.push(`<line class="tw" x1="${L}" x2="${W}" y1="${Yv(t.at)}" y2="${Yv(t.at)}"/>`);
    const pts = s.points.filter(([m]) => le(m + '-15', S.at) || m === S.at.slice(0, 7));
    if (pts.length) out.push(`<polyline class="ser" points="${pts.map(([m, v], j) => { const d0 = m + '-01', d1 = j < pts.length - 1 ? pts[j + 1][0] + '-01' : (le(m + '-28', S.at) ? m + '-28' : S.at); return `${X(le(d0, FROM) ? FROM : d0)},${Yv(v)} ${X(d1)},${Yv(v)}`; }).join(' ')}"/>`);
    if (t.tripped && le(t.tripped, S.at)) out.push(`<circle class="over" cx="${X(t.tripped)}" cy="${Yv(k === 'overdue' ? 5 : 0)}" r="3.5"/>`);
  });
  /* lane 6: meetings, with what each decided about it */
  const my = Y(6) + rowH * .4;
  out.push(`<text class="lane" x="0" y="${my + 4}">${B.short}</text>`);
  DATA.meetings.filter(m => le(FROM, m.date)).forEach(m => { const ds = Object.entries(DATA.decisions).filter(([id, d]) => d.meeting === m.id && (id === 'D-118' || d.affirms === 'D-118' || d.relates === 'D-118' || d.reverses === 'D-118')).map(([id]) => id);
    out.push(`<circle class="mt" cx="${X(m.date)}" cy="${my}" r="4"/>${ds.length ? `<text class="mtl" x="${X(m.date)}" y="${my + 18}" text-anchor="middle">${ds.join(' ')}</text>` : ''}`); });
  /* now and the chosen date */
  out.push(`<line class="now" x1="${X(NOW)}" x2="${X(NOW)}" y1="${y0 - 8}" y2="${H}"/><text class="mo" x="${X(NOW) + 4}" y="${H}" style="fill:var(--light)">now</text>`);
  out.push(`<line class="cur" x1="${X(S.at)}" x2="${X(S.at)}" y1="${y0 - 14}" y2="${H}"/><text class="curl" x="${X(S.at) - 4}" y="${H}" text-anchor="end">${dt(S.at, 'short')}</text>`);
  return out.join('');
}
function render() {
  const at = S.at, st = statusAt('D-118', at), acts = D.actions.map(a => [a, actionAt(a, at)]);
  const ev = EVENTS.filter(([d]) => le(d, at)).pop();
  $('#app').innerHTML = topHTML(['Mandate', 'Decisions', 'D-118', 'Life'], [['← →', 'a week'], ['Home End', 'first, today'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: at }) +
    `<main class="main"><div class="wrap">
    <div class="ttl"><div><p class="eyebrow">${did('D-118')} · one decision, one time scale</p><p class="h2">${D.title}</p></div><span class="addr">mandate / decisions / D-118 <b>@ ${at}</b></span></div>
    <section class="tl pane" id="tl" aria-label="The decision's life"><svg id="svg" role="img" aria-label="Status, actions, the records it rests on and the meetings, May to December 2026"></svg></section>
    <aside class="rec pane scroll"><p class="lab">The record, as it read on ${dt(at)}</p>${stHTML(st)}<p class="res">${D.plain}</p>
      <ul>${acts.map(([a, s]) => `<li>${amHTML(s.shown, 14)}<span>${Ac(a).text}</span><span class="${s.late ? 'late' : 'muted'}">${s.late ? s.late + ' days late' : AS[s.shown].s}</span></li>`).join('')}</ul>
      <ul>${D.revisitIf.map(t => { const x = t.tripped && le(t.tripped, at); return `<li>${x ? `<span class="am am-overdue">${I('circle-alert', 14)}</span>` : `<span class="am am-given">${I('circle', 14)}</span>`}<span>${t.text}</span><span class="${x ? 'late' : 'muted'}">${x ? 'crossed' : 'watched'}</span></li>`; }).join('')}</ul>
      <p class="ev">Last event: <span class="lite">${ev ? `${dt(ev[0], 'short')} · ${ev[1]}` : ''}</span>. Copy the address above to send someone this decision as it stood on this date.</p></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
  $('#svg').innerHTML = svg();
}
const step = (d, n) => { const t = new Date(ts(d) + n * 864e5); return t.toISOString().slice(0, 10); };
const clamp = d => ts(d) < ts(MT.date) ? MT.date : ts(d) > ts(NOW) ? NOW : d;
addEventListener('resize', () => { $('#svg').innerHTML = svg(); });
function replay() {
  clearLater(); S.at = MT.date; render(); settle();
  /* the moment: the chosen date travels from the day it was agreed to today, once, and stops */
  const n = 12; for (let i = 1; i <= n; i++) later(() => { S.at = clamp(step(MT.date, Math.round(days(MT.date, NOW) * i / n))); render(); }, MOMENT() + i * ms('--motion-instant') * 1.5);
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowRight') { S.at = clamp(step(S.at, 7)); render(); }
  if (e.key === 'ArrowLeft') { S.at = clamp(step(S.at, -7)); render(); }
  if (e.key === 'Home') { S.at = MT.date; render(); }
  if (e.key === 'End') { S.at = NOW; render(); }
});
replay();
</script>
</body>
</html>
