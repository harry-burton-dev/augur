<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Record V1 · The record page</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: the decision record as a page: an ADR for operators, with its status beside the words ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4);max-width:calc(var(--measure-wide) * 1.6);margin:0 auto}
.head{display:grid;gap:var(--space-2)}
.head .ln{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.head .t{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light)}
.banner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);background:var(--x-proposed-stale),var(--surface-inset);border:1px solid var(--hairline-strong);font-size:var(--type-meta);line-height:var(--leading-meta)}
.banner.review{background:var(--x-proposed-warn-wash);border-color:var(--x-proposed-warn)}
.banner b{font-weight:400;color:var(--light)}
.is-reversed .res{opacity:var(--x-proposed-reversed)}
.meta{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.meta b{font-weight:400;color:var(--ink)}
.cols{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.sec h3{display:flex;align-items:center;gap:var(--space-2);margin:0 0 var(--space-2);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.sec ol,.sec ul{margin:0;padding-left:var(--space-4);display:grid;gap:var(--space-1)}
.sec li,.sec p{font-size:var(--type-meta);line-height:var(--leading-meta)}
.ev{list-style:none;padding:0!important}
.ev li{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline}
.ev .n{font:500 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--info)}
.ev .v{font-family:var(--font-mono);font-size:var(--type-small);color:var(--ink);white-space:nowrap}
.ev .v s{color:var(--ink-muted)}
.ev .moved{color:var(--x-proposed-warn)}
.ev .src{grid-column:2 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.acts{list-style:none;padding:0!important}
.acts li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);align-items:start}
.acts .s{font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.acts .o{grid-column:2 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.lines li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);align-items:center;list-style:none}
.lines{padding:0!important}
.lines .x{font-size:var(--type-small);white-space:nowrap}
.hist{list-style:none;padding:0!important}
.hist li{display:grid;grid-template-columns:var(--space-7) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small)!important}
.hist .d{font-family:var(--font-mono);color:var(--ink-muted)}
.as{display:flex;gap:var(--space-1)}
.as button{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);padding:2px var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key)}
.as button[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--light)}
@media (max-width:1400px){.head .t{font-size:var(--type-heading);line-height:var(--leading-heading)}.head .res{font-size:var(--type-body);line-height:var(--leading-body)}.cols{gap:var(--space-4)}.obi{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>A decision record · V1</b> the record page: words fixed, status beside them, what it rests on and what follows · ADRs, board minutes</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = Dn('D-118'), MT = meetingOf('D-118');
const ASAT = [['2026-05-12', 'the day'], ['2026-10-20', '20 Oct'], [DATA.today, 'today']];
const S = { as: DATA.today };
const SRC = e => e.src.startsWith('doc') ? `${docT(e.src)} · ${e.app}` : e.src.startsWith('M-') ? `intent ${e.src} · Mandate` : e.src.startsWith('A-') ? `action ${e.src}` : e.src === 'query' ? 'a saved question · Data Atlas' : `${e.src} · ${e.app}`;
function nowVal(e, at) { if (at === MT.date) return e.then; if (e.series) { const v = seriesAt(e.series, at); return e.series === 'overdue' ? `${v} of 18` : e.series === 'cost' ? `£${v}` : e.kind === 'assume' ? (v >= 2 ? '2 in post' : `${v} in post`) : v; } return e.now; }
function render() {
  const at = S.as, st = statusAt('D-118', at), succ = Dn(D.reversedBy);
  const banner = st === 'reversed' ? `<div class="banner dep">${I('corner-down-right', 18)}<span><b>Reversed on ${dt(D.reversedOn)} by ${did(D.reversedBy)}.</b> ${succ.plain} The words below are as agreed on ${dt(MT.date)}; they are not edited.</span><button class="btn sm">Open ${D.reversedBy}</button></div>`
    : st === 'review' ? `<div class="banner review dep">${I('eye', 18)}<span><b>Worth revisiting.</b> A line set at the table was crossed on ${dt(D.revisitIf[0].tripped)}: ${D.revisitIf[0].text}. It stays in force until the meeting decides.</span><button class="btn sm">On the agenda · 3 Nov</button></div>` : '';
  $('#app').innerHTML = topHTML(['Mandate', 'Decisions', B.short, 'D-118'], [['A', 'as at'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: at }) +
    `<main class="main"><div class="wrap ${st === 'reversed' ? 'is-reversed' : ''}">
    <header class="head"><div class="ln">${did('D-118')}${stHTML(st, st === 'in force' ? ` <span class="muted" style="text-transform:none;letter-spacing:0">since ${dt(D.inForce)}</span>` : '')}<span class="meta"><span>${Kd(D.kind).name}</span><span>asks for <b>${Kd(D.kind).bar} or surer</b></span></span>
      <span class="as" style="margin-left:auto">${ASAT.map(([d, w]) => `<button data-d="${d}" aria-pressed="${d === at}">${w === 'today' ? 'today' : dt(d, 'short')}</button>`).join('')}</span></div>
      <h1 class="t">${D.title}</h1>
      <p class="res"><span class="rv">Resolved</span>${D.words}</p>
      <div class="meta"><span>Decided by <b>${B.name}</b></span><span><b>${MT.no}</b>, item ${D.item}, ${dt(MT.date)}</span><span>Minute confirmed <b>${dt(MT.confirmed)}</b></span><span class="fchip" data-tier="${B.floor}">${DATA.floors[B.floor].name}</span></div>
      ${banner}</header>
    <div class="cols">
      <div class="col scroll">
        <section class="sec dep" style="--i:1"><h3>${I('link', 14)} Why</h3><ol>${D.because.map(b => `<li>${b.text}${b.on.map(o => `<span class="ptr">${evN('D-118', o)}</span>`).join('')}</li>`).join('')}</ol></section>
        <section class="sec dep" style="--i:2"><h3>${I('layers', 14)} What it rests on · then${at !== MT.date ? ' and on ' + dt(at, 'short') : ''}</h3><ul class="ev">${D.evidence.map((e, i) => { const nv = nowVal(e, at), moved = nv !== e.then; return `<li><span class="n">${i + 1}</span><span>${e.label}</span><span class="v">${moved ? `<s>${e.then}</s> <span class="moved">${nv}</span>` : e.then}</span><span class="src">${SRC(e)}${e.word ? ` · ${e.word}` : ''}${e.kind === 'assume' ? ' · an assumption, not a fact' : ''}</span></li>`; }).join('')}</ul></section>
        <section class="sec obi dep" style="--i:3"><h3>${I('message-square', 14)} Said in discussion · not decided</h3>${D.obiter.map(o => `<p class="muted"><i>${o.text}</i> ${P(o.by).name}</p>`).join('')}</section>
      </div>
      <div class="col scroll">
        <section class="sec dep" style="--i:4"><h3>${I('circle-dot', 14)} What follows · ${D.actions.length} actions</h3><ul class="acts">${D.actions.map(a => { const x = Ac(a), s = actionAt(a, at); return `<li>${amHTML(s.shown, 16)}<span>${x.text}</span><span class="s">${AS[s.shown].s}${s.late ? `, <span class="late">${s.late} days</span>` : ''}</span><span class="o">${a} · ${who(x.owner)} · by ${dt(s.due, 'short')}${s.due !== x.due ? ` <span class="seam"><s>${dt(x.due, 'short')}</s> moved ${(x.moves || []).filter(m => le(m.on, at)).length}×</span>` : ''}</span></li>`; }).join('')}</ul></section>
        <section class="sec dep" style="--i:5"><h3>${I('eye', 14)} Revisit if</h3><ul class="lines">${D.revisitIf.map(t => { const x = t.tripped && le(t.tripped, at); return `<li>${x ? `<span class="am am-overdue">${I('circle-alert', 16)}</span>` : `<span class="am am-given">${I('circle', 16)}</span>`}<span>${t.text}</span><span class="x ${x ? 'late' : 'muted'}">${x ? 'crossed ' + dt(t.tripped, 'short') : t.series ? spark(t.series, { line: t.at, op: t.op, at, w: 64, h: 16 }) : dt(t.date, 'short')}</span></li>`; }).join('')}</ul></section>
        <section class="sec dep" style="--i:6"><h3>${I('users', 14)} Who decided</h3><p>${D.vote.for.length} for, ${D.vote.against.length} against, ${D.vote.abstain.length} abstained (${D.vote.abstain.map(p => P(p).name)}). ${MT.apologies.map(p => P(p).name)} sent apologies.</p>${D.dissent.map(d => `<p class="muted">Noted at ${first(d.by)}’s request: “${d.text}”</p>`).join('')}</section>
        <section class="sec dep" style="--i:7"><h3>${I('history', 14)} History</h3><ul class="hist">${[[MT.date, `Agreed at ${MT.no}`], [MT.confirmed, 'Minute confirmed as a true record'], [D.revisitIf[1].tripped, 'Line crossed: ' + D.revisitIf[1].text], [D.affirmedOn, `Kept by ${D.affirmedBy}: the trial continues with one fitter`], [D.revisitIf[0].tripped, 'Line crossed: ' + D.revisitIf[0].text], ['2026-10-13', 'Review brought forward to 3 Nov by D-130'], [D.reversedOn, `Reversed by ${D.reversedBy}`]].filter(([d]) => le(d, at)).map(([d, w]) => `<li><span class="d">${dt(d, 'short')}</span><span>${w}</span></li>`).join('')}</ul></section>
      </div></div></div></main>`;
  Icons.hydrate($('#app'));
  $$('.as button').forEach(b => b.onclick = () => { S.as = b.dataset.d; render(); });
}
function replay() {
  clearLater(); S.as = '2026-10-20'; render(); settle();
  /* the moment: the record is read on today's date. The banner and status change; the words don't */
  later(() => { S.as = DATA.today; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'a') { const i = ASAT.findIndex(x => x[0] === S.as); S.as = ASAT[(i + 1) % ASAT.length][0]; render(); }
});
replay();
</script>
</body>
</html>
