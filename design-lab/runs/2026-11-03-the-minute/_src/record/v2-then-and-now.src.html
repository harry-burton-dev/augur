<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Record V2 · Then and now</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: the decision as a hinge between what it rested on then and what those records say now ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.top2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:var(--space-5);align-items:end}
.top2 .c{text-align:center}
.top2 .r{text-align:right}
.hinge{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline-strong);background:var(--surface-pane);text-align:left}
.hinge .res{font-size:var(--type-body);line-height:var(--leading-body)}
.rows{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);grid-auto-rows:min-content;gap:0 var(--space-5)}
.rows > div{padding:var(--space-3) 0;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:var(--space-3)}
.then{justify-content:flex-end;text-align:right}
.lbl{justify-content:center;text-align:center;flex-direction:column;gap:2px!important}
.lbl b{font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.lbl span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.val{font:400 var(--type-lead)/var(--leading-lead) var(--font-mono);color:var(--ink);white-space:nowrap}
.then .val{color:var(--ink-muted)}
.now .val{transition:color var(--motion-base) var(--ease-out)}
.now.moved .val{color:var(--light)}
.now.crossed .val{color:var(--x-proposed-warn)}
.now .why{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.now.crossed .why{color:var(--x-proposed-warn)}
.ptr2{font:500 var(--type-small)/1 var(--font-mono);color:var(--info);margin-right:var(--space-1)}
.arrow{color:var(--ink-muted);flex:none}
.rows .wait .val{opacity:.3}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-4);align-items:center;padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--x-proposed-warn);background:var(--x-proposed-warn-wash)}
.verdict p{font-size:var(--type-meta);line-height:var(--leading-meta)}
.verdict b{font-weight:400;color:var(--light)}
.verdict.calm{border-color:var(--hairline-strong);background:none}
@media (max-width:1400px){.val{font-size:var(--type-body)}.lbl span{display:none}.top2,.rows{gap:0 var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>A decision record · V2</b> then and now: the decision as a hinge between what it rested on and what those records say today · the workings show, wear and time</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = Dn('D-118'), MT = meetingOf('D-118');
const S = { as: '2026-10-20', n: 99 };
function nowOf(e, at) {
  if (e.series) { const v = seriesAt(e.series, at); return e.series === 'overdue' ? `${v} of 18` : e.series === 'cost' ? `£${v}` : `${v} of 2`; }
  return e.now;
}
const LINE = { e4: D.revisitIf[0], e3: D.revisitIf[1] };
function render() {
  const at = S.as, st = statusAt('D-118', at);
  const rows = D.evidence.map((e, i) => {
    const show = i < S.n, nv = nowOf(e, at), moved = nv !== e.then && show;
    const line = LINE[e.id], crossed = show && line && line.tripped && le(line.tripped, at);
    const why = !show ? '' : crossed ? `crossed the line set at the table: ${line.text}` : e.kind === 'assume' ? 'assumed; now known' : moved ? (e.id === 'e2' ? 'actual cost, July to October' : 'moved; no line was set for it') : 'unchanged';
    return `<div class="then dep" style="--i:${i}"><span class="val">${e.then}</span></div>
      <div class="lbl dep" style="--i:${i}"><b><span class="ptr2">${i + 1}</span>${e.label}</b><span>${e.app}${e.word ? ' · ' + e.word : ''}${e.kind === 'assume' ? ' · an assumption' : ''}</span></div>
      <div class="now ${show ? '' : 'wait'} ${moved ? 'moved' : ''} ${crossed ? 'crossed' : ''}"><span class="val" style="${String(show ? nv : e.then).length > 12 ? 'font-size:var(--type-meta);white-space:normal' : ''}">${show ? nv : e.then}</span>${show && e.series ? spark(e.series, { at, line: line ? line.at : null, op: line ? line.op : null, w: 80, h: 20 }) : ''}<span class="why">${why}</span></div>`;
  }).join('');
  const nCross = D.revisitIf.filter(t => t.tripped && le(t.tripped, at)).length;
  $('#app').innerHTML = topHTML(['Mandate', 'Decisions', 'D-118', 'Then and now'], [['A', 'as at today'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: at }) +
    `<main class="main"><div class="wrap">
    <div class="top2"><div class="r"><p class="eyebrow">When it was decided</p><p class="h2">${dt(MT.date)}</p></div>
      <div class="hinge dep"><p class="lab" style="margin-bottom:var(--space-1)">${did('D-118')} ${stHTML(st)}</p><p class="res">${D.plain}</p></div>
      <div><p class="eyebrow">What those records say on</p><p class="h2">${dt(at)}</p></div></div>
    <section class="rows scroll" aria-label="What it rests on, then and now">${rows}</section>
    ${S.n >= D.evidence.length ? (st === 'reversed' ? `<div class="verdict calm">${I('corner-down-right', 20)}<p><b>Reversed on ${dt(D.reversedOn)} by ${did(D.reversedBy)}.</b> The meeting read this page: its ${Dn(D.reversedBy).because.length} reasons for reversing are the rows that moved.</p><button class="btn sm">Open ${D.reversedBy}</button></div>`
      : `<div class="verdict">${I('eye', 20)}<p><b>Worth revisiting.</b> ${nCross} lines set at the table have been crossed, the assumption it needed did not hold, and its cost has risen by £${seriesAt('cost', at) - 112} a van. Nothing changes until the meeting decides: it is on the agenda for 3 Nov (brought forward by D-130).</p><button class="btn sm">Open the agenda</button></div>`) : ''}
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.as = '2026-10-20'; S.n = 0; render(); settle();
  /* the moment: each record's value today replaces its value on the day, one row at a time */
  D.evidence.forEach((_, i) => later(() => { S.n = i + 1; render(); }, MOMENT() + i * ms('--motion-base')));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'a') { S.as = S.as === DATA.today ? '2026-10-20' : DATA.today; S.n = 99; render(); }
});
replay();
</script>
</body>
</html>
