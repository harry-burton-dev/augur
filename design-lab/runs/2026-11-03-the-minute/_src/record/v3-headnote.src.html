<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Record V3 · Headnote and treatment</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: the decision as a law report headnote, with a citator: how every later record has treated it ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,var(--measure-glance));gap:var(--space-6)}
.report{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);max-width:var(--measure-wide)}
.cite{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.flag{display:inline-flex;align-items:center;gap:var(--space-2);padding:2px var(--space-2);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;transition:background var(--motion-calm) var(--ease-out),color var(--motion-calm) var(--ease-out)}
.flag.good{color:var(--light)}
.flag.q{color:var(--x-proposed-warn);border-color:var(--x-proposed-warn);background:var(--x-proposed-warn-wash)}
.flag.bad{color:var(--ink);background:var(--x-proposed-stale)}
.report h1{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light)}
.catch{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2);font-size:var(--type-meta);color:var(--ink-muted);font-style:italic}
.catch button{font-style:italic;color:var(--ink);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap)}
.para{display:grid;grid-template-columns:var(--space-7) minmax(0,1fr);gap:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta)}
.para > span:first-child{font:400 var(--type-label)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.para.held > span:last-child{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.para.obi > span:last-child{color:var(--ink-muted);font-style:italic}
.cit{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4)}
.cit h2{display:flex;justify-content:space-between;align-items:baseline}
.tr{display:grid;grid-template-columns:var(--space-7) auto minmax(0,1fr);gap:var(--space-1) var(--space-3);align-items:start;padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);transition:opacity var(--motion-calm) var(--ease-out)}
.tr.hide{opacity:0}
.tr .d{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.tr .sig{font:400 var(--type-label)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;white-space:nowrap}
.tr .sig.followed{color:var(--x-proposed-lit)} .tr .sig.questioned{color:var(--x-proposed-warn)} .tr .sig.reversed{color:var(--ink)} .tr .sig.cites{color:var(--info)} .tr .sig.amends{color:var(--ink-muted)}
.tr .w{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.tr .w .muted{display:block}
.legend{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,1fr) 340px;gap:var(--space-4)}.report h1{font-size:var(--type-heading);line-height:var(--leading-heading)}.para.held > span:last-child{font-size:var(--type-body);line-height:var(--leading-body)}.para{grid-template-columns:var(--space-6) minmax(0,1fr)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>A decision record · V3</b> headnote and treatment: held, said, and how every later record has treated it · law reports, citators, ratio and obiter</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = Dn('D-118'), MT = meetingOf('D-118');
/* how later records treated D-118: computed from their own links (amends, affirms, relates, reverses, cites) */
function treatment() {
  const out = [];
  Object.entries(DATA.decisions).forEach(([id, d]) => {
    const on = meetingOf(id).date;
    if (d.affirms === 'D-118') out.push([on, 'followed', id, 'kept the trial going with one fitter', d.title]);
    if (d.relates === 'D-118') out.push([on, id === 'D-130' ? 'questioned' : 'cites', id, id === 'D-130' ? 'brought the review forward after a line was crossed' : 're-advertised the second fitter post', d.title]);
    if (d.reverses === 'D-118') out.push([on, 'reversed', id, d.plain, d.title]);
  });
  Object.entries(DATA.docs).forEach(([id, doc]) => { if ((doc.cites || []).includes('D-118')) out.push([doc.date, 'cites', doc.title, `${doc.app}, written by ${P(doc.by).name}`, null]); });
  return out.sort((a, b) => ts(a[0]) - ts(b[0]));
}
const S = { n: 99 };
function flag(rows) {
  const last = rows.slice(0, S.n).map(r => r[1]);
  if (last.includes('reversed')) return `<span class="flag bad">${I('corner-down-right', 14)} Reversed</span>`;
  if (last.includes('questioned')) return `<span class="flag q">${I('eye', 14)} Questioned</span>`;
  return `<span class="flag good">${I('check', 14)} Good</span>`;
}
function render() {
  const rows = treatment();
  $('#app').innerHTML = topHTML(['Mandate', 'Decisions', 'D-118'], [['Space', 'next treatment'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
    <article class="report scroll">
      <p class="cite">${flag(rows)} ${did('D-118')} · ${MT.no}/${D.item} · ${B.name} · ${dt(MT.date)}</p>
      <h1>${D.title}</h1>
      <p class="catch">${D.subjects.map(s => `<button>${s}</button>`).join(' — ')}</p>
      <div class="para held dep" style="--i:1"><span>Held</span><span>${D.plain}</span></div>
      <div class="para dep" style="--i:2"><span>Because</span><span>${D.because.map(b => b.text).join(' ')}</span></div>
      <div class="para dep" style="--i:3"><span>On</span><span>${D.evidence.map((e, i) => `<span class="ptr" style="vertical-align:baseline">${i + 1}</span> ${e.label}${e.kind === 'assume' ? ' (assumed)' : ''}`).join(' · ')}</span></div>
      <div class="para dep" style="--i:4"><span>Unless</span><span>${D.revisitIf.map(t => t.text).join('; ')}.</span></div>
      <div class="para obi dep" style="--i:5"><span>Said</span><span>${D.obiter.map(o => `${o.text} (${P(o.by).name})`).join(' ')}</span></div>
      <div class="para dep" style="--i:6"><span>Dissent</span><span>${D.dissent.map(d => `${P(d.by).name}, abstaining: “${d.text}”`).join('')}</span></div>
      <div class="para dep" style="--i:7"><span>Amends</span><span>${Object.entries(DATA.decisions).filter(([, d]) => d.amendedBy === 'D-118').map(([id, d]) => `${did(id)} ${d.title} (${dt(meetingOf(id).date)})`).join('')}</span></div>
      <div class="para dep" style="--i:8"><span>Words</span><span class="muted">${D.words}</span></div>
    </article>
    <aside class="cit pane"><h2><span class="lab">Treatment · ${rows.length} later records</span><span class="small muted">oldest first</span></h2>
      <div class="scroll" style="min-height:0">${rows.map((r, i) => `<div class="tr ${i < S.n ? '' : 'hide'}"><span class="d">${dt(r[0], 'short')}</span><span class="sig ${r[1]}">${r[1]}</span><span class="w">${r[2].startsWith('D-') ? did(r[2]) + ' ' + r[4] : r[2]}<span class="muted">${r[3]}</span></span></div>`).join('')}</div>
      <p class="legend"><b class="lite" style="font-weight:400">Signals</b>, from each later record’s own link, never typed: <span style="color:var(--x-proposed-lit)">followed</span> (kept it), <span style="color:var(--x-proposed-warn)">questioned</span> (a line crossed, sent back for review), <span style="color:var(--info)">cites</span> (rests on it), amends, reversed. The flag at the top is the worst signal so far.</p>
      <p class="tk">treatment = later decisions where affirms|amends|relates|reverses = D-118, plus documents whose citations include D-118</p></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.n = 0; render(); settle();
  /* the moment: the later records arrive in date order, and the flag follows the worst of them */
  treatment().forEach((_, i) => later(() => { S.n = i + 1; render(); }, MOMENT() + i * ms('--motion-base')));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === ' ') { e.preventDefault(); S.n = S.n >= treatment().length ? 0 : S.n + 1; render(); }
});
replay();
</script>
</body>
</html>
