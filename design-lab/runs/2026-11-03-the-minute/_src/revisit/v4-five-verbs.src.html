<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Revisiting V4 · Five ways to revisit</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: keep, amend, suspend, reverse or let lapse. Each shows the record it would make and what it leaves behind ---- */
.wrap{height:100%;display:grid;grid-template-columns:var(--measure-card) minmax(0,1fr);gap:var(--space-5)}
.verbs{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.vb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px var(--space-3);align-items:start;padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);color:var(--ink);text-align:left;transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard)}
.vb b{font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.vb span.s{grid-column:2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.vb[aria-pressed="true"]{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.vb.warn span.s{color:var(--x-proposed-warn)}
.prev{min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-4) var(--space-5);padding:var(--space-4) var(--space-5)}
.prev .hd{grid-column:1 / -1}
.box{display:grid;gap:var(--space-2);align-content:start}
.recp{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px dashed var(--hairline-strong);display:grid;gap:var(--space-2)}
.recp .w{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.recp .old{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rows{display:grid;gap:var(--space-1)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small)}
.row b{font-weight:400;color:var(--ink);white-space:nowrap}
.row b.w{color:var(--x-proposed-warn)}
.rule{padding:var(--space-3);border-left:2px solid var(--hairline-strong);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.rule.ok{border-left-color:var(--x-proposed-lit)}
.gap{padding:var(--space-3);border-left:2px solid var(--x-proposed-warn);background:var(--x-proposed-warn-wash);font-size:var(--type-meta);line-height:var(--leading-meta)}
@media (max-width:1400px){.wrap{grid-template-columns:280px minmax(0,1fr);gap:var(--space-4)}.prev{grid-template-columns:1fr;padding:var(--space-3)}.recp .w{font-size:var(--type-body);line-height:var(--leading-body)}.vb span.s{display:none}.vb[aria-pressed="true"] span.s{display:block}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Revisiting · V4</b> five ways to revisit: keep, amend, suspend, reverse or let lapse, each with the record it makes and what it leaves · Robert’s Rules, rescind and amend</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = '2026-11-02';
const D = Dn('D-118'), R = Dn('D-131'), MT = meetingOf('D-131'), K = Kd(D.kind);
const open = D.actions.filter(a => actionAt(a).open);
/* each verb: the record it would make, what happens to the wake, and what the body's rules ask */
const VERBS = [
  { k: 'keep', ic: 'check', w: 'Keep it', s: 'Affirm D-118 as it is, and say why the crossed lines don’t matter.', words: 'That decision D-118 stands, and the trial continues to its review on 10 November.',
    old: 'D-118 stays in force. A new record says it was kept, and why.', wake: [['Open actions', `${open.length} stay open`, 1], ['Documents citing it', 'unchanged'], ['M-42 forecast', DATA.intents['M-42'].forecast.with], ['Revisit lines', '2 crossed lines stay crossed', 1]],
    rule: 'No notice needed. The reason must answer each crossed line.', ok: true },
  { k: 'amend', ic: 'pencil-line', w: 'Amend it', s: 'Change a term: one fitter, a contractor for the overflow, until March.', words: 'That decision D-118 is amended: the trial continues with one fitter until 31 March 2027, and overdue inspections go to an outside contractor.',
    old: 'D-118 stays in force, with a seam on its words: “amended by …”.', wake: [['Open actions', '1 withdrawn, 1 new', 0], ['Documents citing it', '2 need a note'], ['M-42 forecast', 'about 7.6%'], ['Revisit lines', 'set again for the new term']],
    rule: 'Notice on the agenda: met (D-130). The amended words are read back like new ones.', ok: true },
  { k: 'suspend', ic: 'pause', w: 'Suspend it', s: 'Pause the trial; a contractor inspects until a date, then the trial resumes.', words: 'That decision D-118 is suspended until 1 March 2027; until then van inspections at the North depot go to an outside contractor.',
    old: 'D-118 shows “suspended until 1 Mar” and comes back by itself on that date.', wake: [['Open actions', 'paused, not withdrawn'], ['Documents citing it', '2 need a note'], ['M-42 forecast', DATA.intents['M-42'].forecast.without], ['Revisit lines', 'paused']],
    rule: 'A suspension needs a date it ends. Without one it is a reversal by another name.', ok: true },
  { k: 'reverse', ic: 'corner-down-right', w: 'Reverse it', s: 'Undo it: inspections go back to a contractor; keep what is worth keeping.', words: R.words,
    old: 'D-118 keeps its whole record, hatched, and points to D-131.', wake: [['Open actions', `${open.length} withdrawn, ${R.actions.length} new`], ['Documents citing it', `${DATA.wake.filter(w => w.kind === 'doc').length} need a new edition`], ['M-42 forecast', DATA.intents['M-42'].forecast.without], ['Revisit lines', 'closed; D-131 sets its own']],
    rule: `${K.name} reversed within six months needs notice on the agenda: met, by D-130. It asks for ${K.bar} or surer: the reasons are counts, recorded.`, ok: true },
  { k: 'lapse', ic: 'hourglass', w: 'Let it lapse', s: 'Do nothing; the trial ends on its own date.', words: null,
    old: 'D-118 lapses on 10 Nov. Nothing replaces it.', wake: [['Open actions', `${open.length} stay open with no decision behind them`, 1], ['Documents citing it', 'cite a lapsed decision', 1], ['M-42 forecast', 'unknown', 1], ['Who inspects from 11 Nov', 'nobody is named', 1]],
    rule: 'Allowed, but this decision changed a contract: lapsing does not restore Kestrel’s inspections.', ok: false, gap: 'Letting it lapse leaves a gap. Kestrel is on breakdown cover only and the trial ends, so from 11 November no decision says who inspects North depot vans.' }
];
const S = { v: 3 };
function render() {
  const v = VERBS[S.v];
  $('#app').innerHTML = topHTML(['Mandate', B.short, MT.no, 'Item 3'], [['↑ ↓', 'choose'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: NOW }) +
    `<main class="main"><div class="wrap">
    <section class="verbs"><div><p class="eyebrow">${did('D-118')} ${stHTML(statusAt('D-118'))}</p><p class="h1" style="margin-bottom:var(--space-2)">Revisit</p></div>
      ${VERBS.map((x, i) => `<button class="vb dep ${x.ok ? '' : 'warn'}" style="--i:${i}" data-i="${i}" aria-pressed="${i === S.v}">${I(x.ic, 18)}<b>${x.w}</b><span class="s">${x.s}</span></button>`).join('')}
      <p class="small muted" style="margin-top:auto">Each is a motion the meeting votes on. None of them edits D-118’s words.</p></section>
    <section class="prev pane" aria-live="polite"><div class="hd"><p class="eyebrow">If the meeting chooses</p><p class="h2">${v.w}</p></div>
      <div class="box"><p class="lab">The record it would make</p>
        <div class="recp">${v.words ? `<p class="w">${v.words}</p>` : `<p class="w muted">No new record.</p>`}<p class="old">${v.old}</p></div>
        <div class="rule ${v.ok ? 'ok' : ''}">${v.rule}</div>${v.gap ? `<div class="gap">${v.gap}</div>` : ''}</div>
      <div class="box"><p class="lab">What it leaves behind</p><div class="rows">${v.wake.map(([k, w, warn]) => `<div class="row"><span>${k}</span><b class="${warn ? 'w' : ''}">${w}</b></div>`).join('')}</div>
        <p class="tk">motion.kind=${v.k} target=D-118 · body rule: ${v.k === 'reverse' ? 'notice_required_within=6mo' : 'none'}</p></div>
    </section></div></main>`;
  Icons.hydrate($('#app'));
  $$('.vb').forEach(b => b.onclick = () => { S.v = +b.dataset.i; render(); });
}
function replay() {
  clearLater(); S.v = 0; render(); settle();
  /* the moment: the preview moves down the verbs once (keep, amend, suspend) and stops on reverse */
  [1, 2, 3].forEach((v, i) => later(() => { S.v = v; render(); }, MOMENT() + i * ms('--motion-slow')));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); S.v = Math.min(VERBS.length - 1, S.v + 1); render(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); S.v = Math.max(0, S.v - 1); render(); }
});
replay();
</script>
</body>
</html>
