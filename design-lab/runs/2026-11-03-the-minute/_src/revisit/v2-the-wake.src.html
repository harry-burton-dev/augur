<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Revisiting V2 · The wake</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: before the vote, everything that rests on the decision, and what reversing it would do to each ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:var(--space-5)}
.motion{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.mcard{padding:var(--space-4);border-radius:var(--radius-inset);border:1px dashed var(--hairline-strong);background:var(--surface-pane);display:grid;gap:var(--space-2)}
.mcard .w{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.old{padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);border:1px solid var(--hairline);display:grid;gap:var(--space-1)}
.old p.t{font-size:var(--type-meta);line-height:var(--leading-meta)}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.sum div{border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.sum b{display:block;font:300 var(--type-title-s)/1 var(--font-mono);color:var(--light)}
.sum span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.wake{min-height:0;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4) var(--space-5)}
.wk{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) minmax(0,1.15fr);gap:var(--space-1) var(--space-4);align-items:start;padding:var(--space-3) 0;border-top:1px solid var(--hairline);transition:opacity var(--motion-base) var(--ease-out)}
.wk.off{opacity:.25}
.wk .ic{color:var(--ink-muted);padding-top:2px}
.wk .what b{display:block;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.wk .what span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.wk .then{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);padding-left:var(--space-3);border-left:2px solid var(--hairline-strong)}
.wk .then .eff{display:inline-block;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;margin-bottom:var(--space-1)}
.eff.kept{color:var(--x-proposed-lit)} .eff.overtaken,.eff.spent{color:var(--ink-muted)} .eff.cites,.eff.rests{color:var(--x-proposed-warn)}
.wk.on .then{border-left-color:var(--x-proposed-lit)}
.job{display:block;margin-top:var(--space-1);color:var(--ink-muted)}
.job b{font-weight:400;color:var(--ink)}
.go{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-4);align-items:center;margin-top:auto;border-top:1px solid var(--hairline-strong);padding-top:var(--space-3)}
.go p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.go b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:var(--space-4)}.wake{padding:var(--space-3)}.mcard .w{font-size:var(--type-body);line-height:var(--leading-body)}.sum b{font-size:var(--type-heading)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Revisiting · V2</b> the wake: before the vote, everything that rests on the decision and what reversing it would do to each · consequence preview, reach before act</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = '2026-11-02'; /* the morning of the meeting, before the vote */
const D = Dn('D-118'), R = Dn('D-131'), MT = meetingOf('D-131');
const ICON = { action: 'circle-dot', doc: 'file-text', intent: 'target', decision: 'stamp' };
/* the job each part of the wake turns into, if the motion is carried */
const JOB = {
  'A-301': () => `new action for <b>${P(Ac('A-311').owner).name}</b>: ${Ac('A-311').text.toLowerCase()}`,
  'A-302': () => `${P(Ac('A-302').owner).name} is told it is withdrawn, with thanks; it stops counting as late`,
  'A-303': () => `nothing to do`,
  'doc-proc': () => `<b>${P(DATA.docs['doc-proc'].by).name}</b> issues a new edition; until then its citation shows “reversed”`,
  'doc-budget': () => `<b>${P(DATA.docs['doc-budget'].by).name}</b> is asked to re-run the monitor`,
  'M-42': () => `<b>${P(DATA.intents['M-42'].owner).name}</b> sees the forecast fall; no new action`,
  'D-128': () => `ends with the trial; nothing to do`
};
const label = w => w.kind === 'action' ? `${w.ref} · ${Ac(w.ref).text}` : w.kind === 'doc' ? docT(w.ref) : w.kind === 'intent' ? `Intent ${w.ref} · ${intentT(w.ref)}` : `${w.ref} · ${Dn(w.ref).title}`;
const sub = w => w.kind === 'action' ? `${P(Ac(w.ref).owner).name} · ${AS[actionAt(w.ref).shown].s}${actionAt(w.ref).late ? `, ${actionAt(w.ref).late} days late` : ''}` : w.kind === 'doc' ? `Artifacts · by ${P(DATA.docs[w.ref].by).name} · cites D-118` : w.kind === 'intent' ? `Mandate · ${P(DATA.intents[w.ref].owner).name}` : `Mandate · ${ST[statusAt(w.ref)].w}`;
const S = { n: 99 };
function render() {
  const jobs = DATA.wake.filter(w => /<b>/.test(JOB[w.ref]()) && w.kind !== 'intent').length;
  $('#app').innerHTML = topHTML(['Mandate', B.short, MT.no, 'Item 3'], [['Space', 'next'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: MT.date }) +
    `<main class="main"><div class="wrap">
    <section class="motion"><div><p class="eyebrow">${MT.no} · item ${R.item} · before the vote</p><p class="h1">The wake</p></div>
      <div class="mcard dep"><p class="lab">${I('hand', 14)} Motion · moved ${P('p2').name}</p><p class="w">${R.words}</p></div>
      <div class="old dep" style="--i:1"><p class="lab">${did('D-118')} ${stHTML(statusAt('D-118'))}</p><p class="t">${D.plain}</p><p class="small muted">in force since ${dt(D.inForce)} · ${DATA.wake.length} things in AUGUR rest on it</p></div>
      <div class="sum dep" style="--i:2"><div><b>${jobs}</b><span>new jobs, each with one owner</span></div><div><b>${DATA.wake.filter(w => w.kind === 'doc').length}</b><span>documents that cite it</span></div><div><b>${DATA.wake.filter(w => w.kind === 'action' && actionAt(w.ref).open).length}</b><span>open action it would withdraw</span></div><div><b>${DATA.intents['M-42'].forecast.with}→${DATA.intents['M-42'].forecast.without}</b><span>M-42’s forecast saving</span></div></div></section>
    <section class="wake pane" aria-label="What rests on D-118"><p class="eyebrow">If the motion is carried · what happens to each thing that rests on ${did('D-118')}</p>
      <div class="scroll" style="min-height:0">${DATA.wake.map((w, i) => `<div class="wk ${i < S.n ? 'on' : 'off'}"><span class="ic">${I(ICON[w.kind], 18)}</span><span class="what"><b>${label(w)}</b><span>${sub(w)}</span></span>
        <span class="then"><span class="eff ${w.effect}">${{ spent: 'already done', overtaken: 'withdrawn', kept: 'kept', cites: 'needs updating', rests: 'changes', }[w.effect]}</span><br>${w.say}<span class="job">→ ${JOB[w.ref]()}</span></span></div>`).join('')}</div>
      <div class="go"><p><b>Nothing is undone silently.</b> D-118 keeps its record and points to its successor; everything above gets a seam where it cited it, and one job where someone must act. Nobody else is told.</p><button class="btn go">${I('vote', 14)} Put it to the meeting</button></div></section>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.n = 0; render(); settle();
  /* the moment: each thing that rests on the decision lights with what reversing would do to it */
  DATA.wake.forEach((_, i) => later(() => { S.n = i + 1; render(); }, MOMENT() + i * ms('--motion-base')));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === ' ') { e.preventDefault(); S.n = S.n >= DATA.wake.length ? 0 : S.n + 1; render(); }
});
replay();
</script>
</body>
</html>
