<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Revisiting V3 · Kept, with seams</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: after the reversal. The old record is kept whole and points forward; everywhere it was cited gets a seam ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--space-6)}
.pair{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.rec{padding:var(--space-4) var(--space-5);border-radius:var(--radius-inset);border:1px solid var(--hairline-strong);background:var(--surface-pane);display:grid;gap:var(--space-2)}
.rec.old{background:var(--x-proposed-stale),var(--surface-inset)}
.rec.old .res,.rec.old .t{opacity:var(--x-proposed-reversed)}
.rec .t{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.rec .res{font-size:var(--type-meta);line-height:var(--leading-meta)}
.rec .m{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.link{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-1) var(--space-5);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.link svg{color:var(--ink)}
.why{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small)}
.why li{color:var(--ink)}
.else{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.card{position:relative;padding:var(--space-3) var(--space-4) var(--space-3) calc(var(--space-4) + var(--space-1));border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--surface-inset);display:grid;gap:var(--space-2)}
.card::before{content:"";position:absolute;left:0;top:var(--space-3);bottom:var(--space-3);width:2px;background:var(--info);border-radius:1px;transform:scaleY(0);transform-origin:top;transition:transform var(--motion-calm) var(--ease-out)}
.seamed .card::before{transform:scaleY(1)}
.card .src{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.card .b{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.card .sm{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.seamed .card .sm{opacity:1}
.cref{display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);white-space:nowrap;font-size:var(--type-small);vertical-align:1px}
.cref.st-reversed{background:var(--x-proposed-stale)}
.num s{color:var(--ink-muted)}
.num b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.wrap{gap:var(--space-4)}.rec{padding:var(--space-3)}.rec .t{font-size:var(--type-lead);line-height:var(--leading-lead)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Revisiting · V3</b> kept, with seams: the reversed decision stays whole and points forward; everything that cited it shows a seam · visible repair, legal citators</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = Dn('D-118'), R = Dn('D-131');
const S = { seamed: true };
const cref = id => { const st = statusAt(id); return `<span class="cref ${ST[st].cls}">${did(id)}<i class="dm ${ST[st].cls}"></i>${ST[st].w.toLowerCase()}${st === 'reversed' ? ' → ' + Dn(id).reversedBy : ''}</span>`; };
function render() {
  const a2 = actionAt('A-302'), a13 = Ac('A-313'), f = DATA.intents['M-42'].forecast;
  $('#app').innerHTML = topHTML(['Mandate', 'Decisions', 'D-118'], [['S', 'seams on / off'], ['T', 'record fields', 'h-t'], ['R', 'replay']], { as: NOW }) +
    `<main class="main"><div class="wrap ${S.seamed ? 'seamed' : ''}">
    <section class="pair"><div><p class="eyebrow">A reversal keeps the record</p><p class="h1">Kept, with seams</p></div>
      <div class="rec old dep"><p class="lab">${did('D-118')} ${stHTML('reversed')} <span class="muted" style="text-transform:none;letter-spacing:0">on ${dt(D.reversedOn)}</span></p><p class="t">${D.title}</p><p class="res">${D.words}</p>
        <p class="m">Agreed ${dt(D.inForce)} · in force ${days(D.inForce, D.reversedOn)} days · its words, reasons, actions and history are all still here</p></div>
      <div class="link dep" style="--i:1">${I('arrow-down', 16)} reversed by ${did('D-131')} · ${I('arrow-up', 16)} reverses ${did('D-118')} · both records point at each other</div>
      <div class="rec dep" style="--i:2"><p class="lab">${did('D-131')} ${stHTML(statusAt('D-131'))} <span class="muted" style="text-transform:none;letter-spacing:0">from ${dt(R.inForce)}</span></p><p class="t">${R.title}</p><p class="res">${R.words}</p>
        <ul class="why">${R.because.map(b => `<li>${b.text}</li>`).join('')}</ul></div></section>
    <section class="else"><p class="eyebrow">Elsewhere in AUGUR · where D-118 was cited</p>
      <div class="card dep" style="--i:3"><p class="src">${I('file-text', 14)} ${docT('doc-proc')} · Artifacts · section 4</p><p class="b">Our own fitters inspect every North depot van each month, in the bay at the back of the yard, under ${cref('D-118')}.</p>
        <p class="sm">Seam · ${dt(D.reversedOn, 'short')}: the decision this section rests on was reversed. ${P(a13.owner).name} is updating it (${'A-313'}, by ${dt(a13.due, 'short')}). The text is not changed until she issues a new edition.</p></div>
      <div class="card dep" style="--i:4"><p class="src">${I('inbox', 14)} ${P(Ac('A-302').owner).name}’s Inbox</p><p class="b">${amHTML(a2.shown, 14)} ${Ac('A-302').text} · <span class="muted">${AS[a2.shown].s}</span></p>
        <p class="sm">Seam · ${dt(D.reversedOn, 'short')}: withdrawn by ${did('D-131')}. It no longer counts as late, and its history (two moved dates, one fitter hired) stays on the record. Thank you note from ${P(B.chair).name} attached.</p></div>
      <div class="card dep" style="--i:5"><p class="src">${I('target', 14)} Intent M-42 · Mandate · ${P(DATA.intents['M-42'].owner).name}</p><p class="b num">Forecast saving this year: <s>${f.with}</s> <b>${f.without}</b> of the saving asked</p>
        <p class="sm">Seam · ${dt(D.reversedOn, 'short')}: ${did(f.rests)} no longer counts. The old forecast is kept with the date it changed.</p></div>
      <p class="small muted">A seam is a thin blue edge and one line: what changed, when and why, and who is doing something about it. It stays until the thing is updated, then becomes part of its history. It is never a banner, and it never pulses.</p></section>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.seamed = false; render(); settle();
  /* the moment: the seams open on each place that cited the decision */
  later(() => { S.seamed = true; $('.wrap').classList.add('seamed'); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 's') { S.seamed = !S.seamed; render(); }
});
replay();
</script>
</body>
</html>
