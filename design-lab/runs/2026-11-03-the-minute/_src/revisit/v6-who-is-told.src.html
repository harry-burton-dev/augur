<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Revisiting V6 · Who is told, and why</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: a reversal reaches exactly the people it changes something for, each with the reason, and a receipt ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-5)}
.routes{min-height:0;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4) var(--space-5)}
.rt{display:grid;grid-template-columns:var(--space-7) minmax(160px,.7fr) minmax(0,1.4fr) minmax(170px,auto);gap:var(--space-4);align-items:center;padding:var(--space-3) 0;border-top:1px solid var(--hairline);transition:opacity var(--motion-base) var(--ease-out)}
.rt.off{opacity:.2}
.rt .ch{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.rt .ch.inbox{color:var(--light)}
.rt .ch.none{color:var(--ink-muted);opacity:var(--x-proposed-quiet)}
.rt .p{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.rt .p span.r{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rt .why{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.rt .why b{font-weight:400;color:var(--light)}
.rc{display:flex;gap:var(--space-1);align-items:center;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.rc i{display:inline-block;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong)}
.rc i.on{background:var(--ink);border-color:var(--ink)}
.rc i.act{background:var(--x-proposed-lit);border-color:var(--x-proposed-lit)}
.rc span{margin-left:var(--space-1);white-space:nowrap}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.side .tot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.side .tot div{border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.side .tot b{display:block;font:300 var(--type-title-s)/1 var(--font-mono);color:var(--light)}
.side .tot span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.side p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.side .ex{padding:var(--space-3);border-radius:var(--radius-inset);background:var(--surface-overlay);border:1px solid var(--hairline-strong);box-shadow:var(--shadow-raised)}
.side .ex b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta);margin:var(--space-1) 0}
.side .ex p{color:var(--ink)}
@media (max-width:1400px){.rt{grid-template-columns:var(--space-7) 140px minmax(0,1fr);gap:var(--space-3)}.rt .rc{grid-column:3}.routes{padding:var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Revisiting · V6</b> who is told, and why: a reversal reaches only the people it changes something for, with the reason and a receipt · the switchboard (O), recorded delivery</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = Dn('D-131'), MT = meetingOf('D-131');
/* the routing, worked out from the wake and the new decision: one row per person who could be affected */
const ROUTES = [
  { p: 'p4', ch: 'inbox', why: `You own a new action: <b>${Ac('A-311').text}</b>, by ${dt(Ac('A-311').due, 'short')}.`, rc: [1, 1, 0], note: 'accepted 11:20' },
  { p: 'p2', ch: 'inbox', why: `You own a new action: <b>${Ac('A-312').text}</b>, by ${dt(Ac('A-312').due, 'short')}. You moved the motion.`, rc: [1, 1, 1], note: 'accepted in the room' },
  { p: 'p3', ch: 'inbox', why: `One item for two changes: your action A-302 is <b>withdrawn</b>, with thanks, and you own <b>${Ac('A-313').text.toLowerCase()}</b>.`, rc: [1, 0, 0], note: 'told 10:58 · not seen' },
  { p: 'p5', ch: 'inbox', why: `You wrote <b>${docT('doc-budget')}</b>, which counts D-118’s saving. Re-run it when you can.`, rc: [1, 1, 0], note: 'seen 11:05' },
  { p: 'p1', ch: 'none', why: `You own intent M-42, whose forecast falls to ${DATA.intents['M-42'].forecast.without}. You chaired the meeting, so nothing is sent; the intent shows a seam.`, rc: [0, 0, 0], note: 'was there' },
  { p: 'p8', ch: 'none', why: `Your action A-303 (the bay) is kept. Nothing changes for you, so nothing is sent.`, rc: [0, 0, 0], note: 'no change' },
  { p: 'p7', ch: 'none', why: `You were at the meeting and own nothing it changed.`, rc: [0, 0, 0], note: 'was there' }
];
const READERS = DATA.docs['doc-proc'].readers; /* people who have opened the procedures this year: they see the seam when they next open it */
const S = { n: 99 };
function render() {
  const told = ROUTES.filter(r => r.ch === 'inbox').length;
  $('#app').innerHTML = topHTML(['Mandate', 'Decisions', 'D-131', 'Who is told'], [['Space', 'step'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
    <section class="routes pane scroll" aria-label="Routes"><div><p class="eyebrow">${did('D-131')} reverses ${did('D-118')} · recorded ${dt(MT.date, 'short')} 10:58</p><p class="h2">Who is told, and why</p></div>
      ${ROUTES.map((r, i) => `<div class="rt ${i < S.n ? '' : 'off'}"><span class="ch ${r.ch}">${r.ch === 'inbox' ? I('inbox', 14) + ' Inbox' : I('minus', 14) + ' Nothing'}</span>
        <span class="p">${face(r.p, 'sm')}<span>${P(r.p).name}<span class="r">${P(r.p).role}</span></span></span><span class="why">${r.why}</span>
        <span class="rc" title="told · seen · acted">${r.rc.map((x, k) => `<i class="${x ? (k === 2 ? 'act' : 'on') : ''}"></i>`).join('')}<span>${r.note}</span></span></div>`).join('')}
      <p class="tk">route = wake ∪ new actions − people present with no change · channel = inbox (needs) · receipt = told, seen, acted</p></section>
    <aside class="side"><div class="tot"><div><b>${told}</b><span>Inbox items, one per person</span></div><div><b>0</b><span>notices to anyone else</span></div><div><b>${READERS}</b><span>readers of the procedures: they see a seam when they next open it</span></div><div><b>${ROUTES.filter(r => r.ch === 'none').length}</b><span>affected, not sent anything, and why</span></div></div>
      <div class="ex"><p class="lab">What ${first('p3')} sees</p><b>D-118 was reversed: one action withdrawn, one new</b><p>A-302 (hire two fitters) is withdrawn by D-131. It no longer counts as late. Thank you for the fitter you hired. New: ${Ac('A-313').text}, by ${dt(Ac('A-313').due, 'short')}.</p><p class="small muted" style="margin-top:var(--space-2)">Why you: you own an action D-118 set, and one D-131 sets.</p></div>
      <p>The switchboard decides loudness: these are “needs” items in the Inbox, never toasts. If Jo hasn’t seen hers by ${dt(new Date(ts(Ac('A-313').set) + 5 * 864e5).toISOString().slice(0, 10), 'short')}, the chair sees “not seen” in his action log; nobody escalates automatically.</p></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.n = 0; render(); settle();
  /* the moment: each route is worked out in turn, with its reason; receipts come in */
  ROUTES.forEach((_, i) => later(() => { S.n = i + 1; render(); }, MOMENT() + i * ms('--motion-base')));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === ' ') { e.preventDefault(); S.n = S.n >= ROUTES.length ? 0 : S.n + 1; render(); }
});
replay();
</script>
</body>
</html>
