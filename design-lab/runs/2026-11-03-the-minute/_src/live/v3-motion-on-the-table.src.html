<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Live V3 · The motion on the table</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: the motion is an object on the table: moved, seconded, amended, put, carried, then numbered ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4);justify-items:center}
.steps{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;justify-content:center}
.steps span.s{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-pill);font-size:var(--type-small);color:var(--ink-muted)}
.steps span.s.done{color:var(--ink);border-color:var(--hairline-strong)}
.steps span.s.cur{color:var(--light);border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.steps svg{color:var(--ink-muted)}
.table{align-self:center;width:min(100%,calc(var(--measure-wide) + var(--space-8)));min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.card{position:relative;padding:var(--space-5) var(--space-6);border-radius:var(--radius-card);border:1px dashed var(--hairline-strong);background:var(--surface-pane);transition:border-color var(--motion-calm) var(--ease-out),background var(--motion-calm) var(--ease-out),box-shadow var(--motion-calm) var(--ease-out)}
.card.carried{border:1px solid var(--x-proposed-lit);box-shadow:var(--shadow-raised)}
.card .ch{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.card .ch .lab{flex:1}
.card .num{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light);border:1px solid var(--x-proposed-lit);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2);opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.card.carried .num{opacity:1}
.words{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
ins{text-decoration:none;border-bottom:2px solid var(--info);color:var(--light);background:color-mix(in srgb,var(--info) 10%,transparent);padding:0 2px;border-radius:2px}
.card.carried ins{border-bottom-color:transparent;background:none}
.who-line{display:flex;gap:var(--space-5);flex-wrap:wrap;margin-top:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.who-line b{font-weight:400;color:var(--ink)}
.vote{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.2fr);gap:var(--space-4);align-items:start}
.vcol{padding:var(--space-3);border-top:2px solid var(--hairline);min-height:calc(var(--target-sm) * 2)}
.vcol .faces{display:flex;flex-wrap:wrap;gap:var(--space-1);margin-top:var(--space-2);min-height:var(--target-sm)}
.vcol .faces .face{transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out)}
.vcol.for{border-top-color:var(--x-proposed-lit)}
.vcol .c{font:400 var(--type-title-s)/1 var(--font-mono);color:var(--light)}
.result{padding:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.result b{display:block;font-weight:400;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.result .q{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-1)}
@media (max-width:1400px){.card{padding:var(--space-4)}.words{font-size:var(--type-lead);line-height:var(--leading-lead)}.vcol .c{font-size:var(--type-heading)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Minuting live · V3</b> the motion on the table: moved, seconded, amended, put, carried, numbered · Robert’s Rules, parliamentary order papers, tracked amendments</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = '2026-05-12';
const MT = meetingOf('D-118'), D = Dn('D-118');
const STEPS = [['Moved', 'hand'], ['Seconded', 'hand'], ['Amended', 'pencil-line'], ['Put to the meeting', 'vote'], ['Carried', 'check'], ['Numbered', 'stamp']];
const S = { step: 5, voted: 99 };
/* the vote, in the order hands went up */
const ORDER = [...D.vote.for, ...D.vote.abstain];
const where = p => D.vote.for.includes(p) ? 'for' : D.vote.against.includes(p) ? 'against' : 'abstain';
function wordsHTML() {
  const base = D.motion.text.replace(/\.$/, '');
  if (S.step < 2) return base + '.';
  /* the amendment is a tracked insertion until the motion is carried */
  return base.replace('from 1 July 2026,', `from 1 July 2026, <ins title="Amendment moved by ${P(D.amendment.by).name}, accepted by the mover">${D.amendment.text},</ins>`) + '.';
}
function render() {
  const voted = ORDER.slice(0, S.step >= 3 ? S.voted : 0);
  const n = k => voted.filter(p => where(p) === k).length;
  const carried = S.step >= 4;
  $('#app').innerHTML = topHTML(['Mandate', B.short, MT.no, 'Live'], [['Space', 'next step'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
    <div class="steps">${STEPS.map(([w, ic], i) => `<span class="s ${i < S.step ? 'done' : i === S.step ? 'cur' : ''}">${I(ic, 14)} ${w}</span>${i < STEPS.length - 1 ? I('chevron-right', 14) : ''}`).join('')}</div>
    <section class="table">
      <div class="card ${carried ? 'carried' : ''}"><div class="ch"><span class="lab">${carried ? 'Resolution · carried 10:52' : 'Motion on the table · item ' + D.item}</span><span class="num">${S.step >= 5 ? 'D-118' : ''}</span></div>
        <p class="words">${carried ? '<span class="rv" style="font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-label);color:var(--ink-muted);margin-right:var(--space-2);vertical-align:3px">RESOLVED</span>' : ''}${wordsHTML()}</p>
        <div class="who-line"><span>Moved <b>${P(D.motion.by).name}</b> · 10:41</span><span>${S.step >= 1 ? `Seconded <b>${P(D.motion.seconded).name}</b>` : `<span class="mk-gap">not seconded</span>`}</span>${S.step >= 2 ? `<span>Amendment <b>${P(D.amendment.by).name}</b>, “${D.amendment.text}”, accepted by the mover · 10:44</span>` : ''}</div>
        <p class="tk">motion.state=${['moved', 'seconded', 'amended', 'put', 'carried', 'numbered'][S.step]} · words frozen at carried · id assigned at numbered</p></div>
      <div class="vote">
        ${[['for', 'For'], ['against', 'Against'], ['abstain', 'Abstained']].map(([k, w]) => `<div class="vcol ${k}"><p class="lab">${w}</p><p class="c">${S.step >= 3 ? n(k) : '·'}</p><div class="faces">${voted.filter(p => where(p) === k).map(p => face(p, k === 'for' ? 'yes' : '')).join('') || (S.step >= 3 && k === 'against' ? '<span class="small muted">nobody</span>' : '')}</div></div>`).join('')}
        <div class="result">${S.step < 3 ? `<b>Not yet put</b>${MT.present.length} members present can vote. ${P(B.secretary).name} is in attendance and does not.` :
          carried ? `<b>Carried ${n('for')}–${n('against')}, ${n('abstain')} abstained</b>${D.dissent.map(d => `${first(d.by)} asked for his reason to be noted: “${d.text}”`).join('')}` : `<b>Counting</b>${voted.length} of ${MT.present.length} hands`}
          <span class="q">${I('users', 14)} quorum ${B.quorum}: ${MT.present.length} present, met</span></div>
      </div>
    </section></div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.step = 2; S.voted = 0; render(); settle();
  /* the moment: the chair puts the motion; hands go up one by one; it is carried and numbered */
  const t = MOMENT(), q = ms('--motion-base');
  later(() => { S.step = 3; render(); }, t);
  ORDER.forEach((_, i) => later(() => { S.voted = i + 1; render(); }, t + (i + 1) * q));
  later(() => { S.step = 4; render(); }, t + (ORDER.length + 1) * q);
  later(() => { S.step = 5; render(); }, t + (ORDER.length + 2) * q);
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === ' ') { e.preventDefault(); S.step = Math.min(5, S.step + 1); S.voted = 99; render(); }
});
replay();
</script>
</body>
</html>
