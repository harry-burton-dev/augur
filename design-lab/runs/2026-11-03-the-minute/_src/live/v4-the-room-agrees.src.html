<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Live V4 · The room agrees</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: the shared screen in the room. One line at a time; each person present says "that's what we decided" ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--measure-card);gap:var(--space-5)}
.screen{position:relative;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:var(--space-5);padding:var(--space-5) var(--space-7);border-radius:var(--radius-card);background:radial-gradient(120% 90% at 50% 60%, color-mix(in srgb,var(--navy) 18%,var(--slate-deep)), var(--slate-deep));border:1px solid var(--hairline);overflow:hidden}
.far{display:grid;gap:var(--space-2);filter:blur(2px) saturate(.4);opacity:.5;font-size:var(--type-meta);line-height:var(--leading-meta)}
.far div{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2)}
.near .lab{margin-bottom:var(--space-2)}
.near .big{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light);letter-spacing:var(--tracking-tight);max-width:var(--measure-wide);transition:color var(--motion-calm) var(--ease-out)}
.near.pending .big{color:var(--ink)}
.near .state{display:inline-flex;align-items:center;gap:var(--space-2);margin-top:var(--space-3);font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.near:not(.pending) .state{color:var(--x-proposed-lit)}
.ring{display:flex;gap:var(--space-4);flex-wrap:wrap}
.pp{display:grid;justify-items:center;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);min-width:calc(var(--space-7) + var(--space-3));text-align:center}
.pp .face{width:var(--target-md);height:var(--target-md);transition:border-color var(--motion-base) var(--ease-out),box-shadow var(--motion-base) var(--ease-out)}
.pp.wait .face{border-style:dashed}
.pp.note .face{border-color:var(--x-proposed-warn);box-shadow:0 0 0 var(--focus-gap) var(--x-proposed-warn-wash)}
.pp.note span.r{color:var(--x-proposed-warn)}
.pp.yes span.r{color:var(--x-proposed-lit)}
.noted{border-left:2px solid var(--x-proposed-warn);padding-left:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);max-width:var(--measure-wide)}
.noted b{font-weight:400;color:var(--x-proposed-warn)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.device{padding:var(--space-4);border-radius:var(--radius-inset)}
.device .dh{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted);margin-bottom:var(--space-3)}
.device p.l{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light);margin-bottom:var(--space-3)}
.device .opts{display:grid;gap:var(--space-2)}
.device .opts .btn{justify-content:flex-start}
.device textarea{width:100%;min-height:calc(var(--space-7) + var(--space-3));resize:none;background:var(--surface-inset);border:1px solid var(--x-proposed-warn);border-radius:var(--radius-key);color:var(--ink);font:400 var(--type-small)/var(--leading-small) var(--font-sans);padding:var(--space-2)}
.side p.r{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.screen{padding:var(--space-4) var(--space-5)}.near .big{font-size:var(--type-heading);line-height:var(--leading-heading)}.ring{gap:var(--space-2)}.pp{min-width:var(--space-7)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Minuting live · V4</b> the room agrees: one line on the shared screen, and each person present says “that is what we decided” · agreed minutes</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = '2026-05-12';
const MT = meetingOf('D-118'), D = Dn('D-118');
/* the order answers came in; Ade agrees that this is what was decided, and asks for his concern to be noted */
const ANS = [['p3', 'yes'], ['p1', 'yes'], ['p4', 'yes'], ['p2', 'yes'], ['p5', 'note']];
const S = { n: 99 };
function render() {
  const got = Object.fromEntries(ANS.slice(0, S.n));
  const all = MT.present.every(p => got[p]);
  const noted = got.p5 === 'note';
  $('#app').innerHTML = topHTML(['Mandate', B.short, MT.no, 'Shared screen'], [['Space', 'next answer'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
    <section class="screen" aria-label="The screen in the room">
      <div class="far" aria-label="Earlier items, agreed">${DATA.agenda.slice(0, 3).map(a => `<div><span class="mono">${a.no}</span><span>${a.title}${a.decision ? ' · ' + Dn(a.decision).title : ''}</span><span>agreed</span></div>`).join('')}</div>
      <div class="near ${all ? '' : 'pending'}"><p class="lab">Item ${D.item} · ${DATA.agenda[3].title} · is this what we decided?</p>
        <p class="big">${D.plain}</p>
        <p class="state">${all ? `${I('check', 14)} Agreed by all ${MT.present.length} present · 10:52 · ${did('D-118')}` : `${I('circle-dashed', 14)} ${Object.keys(got).length} of ${MT.present.length} have answered`}</p></div>
      <div class="ring">${MT.present.map(p => { const a = got[p]; return `<div class="pp ${a === 'yes' ? 'yes' : a === 'note' ? 'note' : 'wait'}">${face(p, a === 'yes' ? 'yes' : '')}<span>${first(p)}</span><span class="r">${a === 'yes' ? 'yes' : a === 'note' ? 'yes, with a note' : 'waiting'}</span></div>`; }).join('')}
        ${MT.apologies.map(p => `<div class="pp">${face(p, 'off')}<span>${first(p)}</span><span class="r">apologies</span></div>`).join('')}</div>
      ${noted ? `<p class="noted"><b>Noted at ${first('p5')}’s request:</b> ${D.dissent[0].text}</p>` : ''}
    </section>
    <aside class="side"><p class="eyebrow">On ${P('p5').name}’s laptop</p>
      <div class="device pane"><p class="dh">${I('laptop', 14)} ${MT.no} · item ${D.item}</p><p class="l">${D.plain}</p>
        ${noted ? `<textarea aria-label="Your note" readonly>${D.dissent[0].text}</textarea><p class="r" style="margin-top:var(--space-2)">Sent. Your note goes on the minute next to the decision, with your name. It does not change the words.</p>`
        : `<div class="opts"><button class="btn">${I('check', 14)} That is what we decided</button><button class="btn">${I('message-square', 14)} Yes, and note my concern</button><button class="btn">${I('undo-2', 14)} No, that’s not what we said</button></div>`}</div>
      <p class="r">“No” sends the line back to the chair before the meeting moves on; it is not a vote. Everyone present can answer; members who sent apologies can’t.</p>
      <p class="r">${P(B.secretary).name} doesn’t answer: she wrote it. If someone’s device is off, the chair answers for them aloud and the minute says so.</p>
      <p class="tk">minute.line.assent[] = {person, yes|note|no, at} · inked when every present member has answered</p></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.n = 0; render(); settle();
  /* the moment: answers come in one by one; Ade agrees and asks for a note; the line inks */
  ANS.forEach((_, i) => later(() => { S.n = i + 1; render(); }, MOMENT() + i * ms('--motion-slow')));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === ' ') { e.preventDefault(); S.n = Math.min(ANS.length, S.n + 1); render(); }
});
replay();
</script>
</body>
</html>
