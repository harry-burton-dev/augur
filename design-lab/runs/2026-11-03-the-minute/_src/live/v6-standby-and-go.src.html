<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Live V6 · Standby and go</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: the moment a decision becomes the record is framed: standby, then go. Two steps, like a cue call ---- */
.stage{position:fixed;inset:0;z-index:var(--layer-view)}
.under{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.under .main{display:grid;grid-template-columns:var(--measure-drawer) minmax(0,1fr);gap:var(--space-5);transition:filter var(--motion-calm) var(--ease-out)}
.framed .under .main{filter:blur(3px) saturate(.5)}
.under .ag{display:grid;gap:var(--space-2);align-content:start;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.under .ag .cur{color:var(--light)}
.under .notes{display:grid;gap:var(--space-2);align-content:start;font-size:var(--type-meta);line-height:var(--leading-meta)}
.bar{position:absolute;left:0;right:0;height:0;z-index:var(--layer-overlay);display:flex;align-items:center;gap:var(--space-5);padding:0 var(--edge);overflow:hidden;transition:height var(--motion-calm) var(--ease-out);font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink)}
.bar.t{top:0;background:linear-gradient(var(--scrim),var(--scrim)),linear-gradient(var(--slate-deep),transparent)}
.bar.b{bottom:0;background:linear-gradient(var(--scrim),var(--scrim)),linear-gradient(transparent,var(--slate-deep))}
.framed .bar{height:calc((100vh - 100vw / var(--letterbox-ratio)) / 2)}
.bar .sp{margin-left:auto}
.bar b{font-weight:400;color:var(--light)}
.frame{position:absolute;left:0;right:0;top:50%;height:calc(100vw / var(--letterbox-ratio));transform:translateY(-50%);z-index:var(--layer-overlay);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;background:color-mix(in srgb,var(--slate-deep) 55%,transparent);transition:opacity var(--motion-calm) var(--ease-out)}
.framed .frame{opacity:1;pointer-events:auto}
.inner{width:min(calc(100% - 2 * var(--space-7)),calc(var(--measure-wide) + var(--space-8)));display:grid;gap:var(--space-4)}
.cue{display:flex;align-items:center;gap:var(--space-3);font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-mark);text-transform:uppercase;color:var(--x-proposed-warn)}
.cue.go{color:var(--x-proposed-lit)}
.cue i.l{display:inline-block;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:currentColor}
.words{font-weight:200;font-size:var(--type-title);line-height:var(--leading-title);color:var(--light);letter-spacing:var(--tracking-tight)}
.facts{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.facts b{font-weight:400;color:var(--ink)}
.acts{display:flex;gap:var(--space-3);align-items:center}
@media (max-width:1400px){.words{font-size:var(--type-title-s);line-height:var(--leading-title-s)}.under .main{grid-template-columns:240px minmax(0,1fr)}}
</style>
</head>
<body class="pre">
<div class="stage" id="stage"></div>
<div class="x-cap"><b>Minuting live · V6</b> standby and go: the moment words become the record is framed, then released · cue calling, PDR-009 letterbox</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = '2026-05-12';
const MT = meetingOf('D-118'), D = Dn('D-118');
const S = { framed: false, go: false };
function render() {
  document.body.classList.toggle('framed', S.framed);
  $('#stage').innerHTML = `<div class="under">${topHTML(['Mandate', B.short, MT.no, 'Live'], [['Enter', 'go'], ['Esc', 'not now'], ['S', 'standby'], ['R', 'replay']])}
    <main class="main"><div class="ag">${DATA.agenda.map((a, i) => `<span class="${i === 3 ? 'cur' : ''}">${a.no}. ${a.title}</span>`).join('')}</div>
    <div class="notes"><p class="eyebrow">Item ${D.item} · discussion</p>${DATA.heard.map(h => `<p><span class="mono muted">${h.t}</span> ${P(h.by).name}: <span class="muted">${h.text}</span></p>`).join('')}</div></main></div>
    <div class="bar t" aria-hidden="${!S.framed}"><span><b>${MT.no}</b> · item ${D.item}</span><span>${MT.present.length} present · quorum ${B.quorum} met</span><span class="sp">10:52</span></div>
    <div class="frame" role="dialog" aria-modal="true" aria-label="Standby to record a decision"><div class="inner">
      ${S.go ? `<p class="cue go"><i class="l"></i> Recorded · ${did('D-118')} · in force from today</p>` : `<p class="cue"><i class="l"></i> Standby · the chair is about to put the motion</p>`}
      <p class="words">${D.words}</p>
      <div class="facts"><span>Moved <b>${P(D.motion.by).name}</b></span><span>Seconded <b>${P(D.motion.seconded).name}</b></span><span>Amended <b>${P(D.amendment.by).name}</b>, accepted</span><span>${D.actions.length} actions · ${D.revisitIf.length} revisit lines</span></div>
      <div class="acts">${S.go ? `<span class="small muted">The frame opens again in a moment. Owners get their Inbox items; the watches start.</span>` : `<button class="btn go" data-go>${I('stamp', 16)} Carried: record it <span class="kbd">Enter</span></button><button class="btn" data-no>Not now <span class="kbd">Esc</span></button><span class="small muted">Nothing is recorded until go.</span>`}</div>
    </div></div>
    <div class="bar b" aria-hidden="${!S.framed}"><span>Standby: ${P(B.chair).name} · go: ${P(B.secretary).name}</span><span class="sp">Esc returns to the discussion · nothing is lost</span></div>`;
  Icons.hydrate($('#stage'));
  $('[data-go]')?.addEventListener('click', go);
  $('[data-no]')?.addEventListener('click', () => { S.framed = false; render(); });
}
function go() {
  S.go = true; render();
  later(() => { S.framed = false; render(); }, ms('--motion-still'));
}
function replay() {
  clearLater(); S.framed = false; S.go = false; render(); settle();
  /* the moment: the chair says "standby"; the letterbox closes in around the motion's words */
  later(() => { S.framed = true; render(); $('[data-go]')?.focus(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'Enter' && S.framed && !S.go) { e.preventDefault(); go(); }
  if (e.key === 'Escape') { S.framed = false; render(); }
  if (e.key.toLowerCase() === 's') { S.framed = true; S.go = false; render(); }
});
replay();
</script>
</body>
</html>
