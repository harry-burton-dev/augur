<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Live V5 · One owner, one date</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: an action can't be recorded with two owners or no date. Someone not in the room is asked, not told ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:var(--space-6)}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.said{padding:var(--space-3) var(--space-4);border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-inset);font-style:italic;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)}
.said .by{display:block;font-style:normal;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);margin-bottom:var(--space-1)}
.said mark{background:none;color:var(--light);border-bottom:1px dotted var(--ink-muted)}
.card{padding:var(--space-4) var(--space-5);border-radius:var(--radius-inset);display:grid;gap:var(--space-3)}
.field{display:grid;grid-template-columns:var(--space-8) minmax(0,1fr);gap:var(--space-3);align-items:center;font-size:var(--type-meta);line-height:var(--leading-meta)}
.field > span:first-child{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.field .v{color:var(--light)}
.owners{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:var(--space-2);padding:2px var(--space-2) 2px 2px;border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);color:var(--ink)}
.chip .face{width:var(--space-5);height:var(--space-5);font-size:var(--x-proposed-type-micro)}
.chip.two{border-color:var(--x-proposed-warn)}
.rule{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3);border-left:2px solid var(--x-proposed-warn);background:var(--x-proposed-warn-wash);border-radius:0 var(--radius-key) var(--radius-key) 0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.rule b{font-weight:400;color:var(--light)}
.rule .opts{display:flex;gap:var(--space-2);margin-top:var(--space-2);flex-wrap:wrap}
.tray{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:start;padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset)}
.act .t{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.act .m{grid-column:2 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.act .d{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink);white-space:nowrap}
.act.ask{border-style:dashed}
.act.new{border-color:var(--x-proposed-lit)}
.tray .foot{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:var(--space-2)}
@media (max-width:1400px){.wrap{gap:var(--space-4)}.said{font-size:var(--type-body);line-height:var(--leading-body)}.field{grid-template-columns:var(--space-7) minmax(0,1fr)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Minuting live · V5</b> one owner, one date: two names can’t be recorded, and someone not in the room is asked, not told · RAID logs</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = '2026-05-12';
const MT = meetingOf('D-118'), D = Dn('D-118');
const A1 = Ac('A-301'), A2 = Ac('A-302'), A3 = Ac('A-303');
const present = p => MT.present.includes(p);
const S = { stage: 2 }; /* 0 heard, 1 card with two owners, 2 split */
function trayHTML() {
  const rows = [['A-301', A1, 'accepted'], ['A-302', A2, 'accepted']];
  if (S.stage >= 2) rows.push(['A-303', A3, present(A3.owner) ? 'accepted' : 'given']);
  return rows.map(([id, a, st], i) => `<div class="act dep ${st === 'given' ? 'ask' : ''} ${S.stage >= 2 && i === 2 ? 'new' : ''}" style="--i:${i}">${amHTML(st, 18)}<span class="t">${a.text}</span><span class="d">by ${dt(a.due, 'short')}</span>
    <span class="m">${who(a.owner)} · ${present(a.owner) ? `in the room, accepted ${st === 'accepted' ? 'aloud' : ''}` : `<b style="font-weight:400;color:var(--ink)">not here</b>: asked in his Inbox to accept or say why not. Until then the minute shows it as asked, not agreed`} · ${id} · from ${did('D-118')}</span></div>`).join('');
}
function render() {
  const two = S.stage === 1;
  $('#app').innerHTML = topHTML(['Mandate', B.short, MT.no, 'Live', 'Actions'], [['S', 'split'], ['Space', 'next'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
    <section class="left"><div><p class="eyebrow">Item ${D.item} · an action as it is said</p><p class="h1">One owner, one date</p></div>
      <p class="said"><span class="by">10:50 · ${P('p2').name} · heard</span>“And <mark>Jo and Sam</mark> can sort out the bay, <mark>before the trial starts</mark>.”</p>
      ${S.stage >= 1 ? `<div class="card pane dep">
        <div class="field"><span>Action</span><span class="v">Fit out the inspection bay at the North depot</span></div>
        <div class="field"><span>Owner</span><span class="owners">${two ? `<span class="chip two">${face('p3')}${P('p3').name}</span><span class="chip two">${face('p8')}${P('p8').name}</span>` : `<span class="chip">${face(A3.owner)}${P(A3.owner).name}</span><span class="small muted">not in the room</span>`}</span></div>
        <div class="field"><span>By</span><span class="v">${two ? `<span class="mk-gap">before the trial starts</span> <span class="small muted">· read as ${dt('2026-07-01', 'short')}?</span>` : dt(A3.due)}</span></div>
        <div class="field"><span>From</span><span>${did('D-118')} <span class="small muted">${D.title}</span></span></div>
        ${two ? `<div class="rule">${I('split', 18)}<div><b>One action, one owner.</b> With two names, each will think the other has it, and nobody can close it. Split it, or choose who answers for it.<div class="opts"><button class="btn sm go">${I('split', 14)} Split into two <span class="kbd">S</span></button><button class="btn sm">Sam owns it, Jo helps</button><button class="btn sm">Jo owns it, Sam helps</button></div></div></div>`
        : `<p class="small muted">The room chose: Sam owns it and Jo helps (helpers are named on the action, but only the owner answers for it). “Before the trial starts” became a real date, ${dt(A3.due)}, the week before the first in-house inspections are booked.</p>`}
      </div>` : ''}
    </section>
    <section class="tray" aria-label="Actions from this item"><p class="eyebrow">Actions from item ${D.item}</p>${trayHTML()}
      <p class="foot">Each is an Inbox item for its owner, with a link back to the minute. Nobody else is notified. The chair sees them all in the action log, and the June meeting reads them out as matters arising.<span class="tk">inbox.item{owner, due, ref: mandate/decision/D-118, state}</span></p></section>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.stage = 0; render(); settle();
  /* the moment: the heard action becomes a card with two owners and a vague date; the rule asks for a split; it splits */
  later(() => { S.stage = 1; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const k = e.key.toLowerCase();
  if (k === 's') { S.stage = 2; render(); }
  if (k === ' ') { e.preventDefault(); S.stage = (S.stage + 1) % 3; render(); }
});
replay();
</script>
</body>
</html>
