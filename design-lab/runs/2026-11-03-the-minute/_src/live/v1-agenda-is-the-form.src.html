<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>The minute · Live V1 · The agenda is the form</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: the agenda is the form. Each item arrives with its slots already laid out from its paper ---- */
.wrap{height:100%;display:grid;grid-template-columns:var(--measure-drawer) minmax(0,1fr) var(--measure-rail);gap:var(--space-5)}
.rail{min-height:0;display:flex;flex-direction:column;gap:var(--space-1)}
.ai{position:relative;display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2);align-items:start;padding:var(--space-2);border-radius:var(--radius-key);color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.ai .no{font:400 var(--type-small)/var(--leading-meta) var(--font-mono)}
.ai .mins{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);white-space:nowrap}
.ai.done{color:var(--ink)}
.ai.done .mins{color:var(--ink-muted)}
.ai.cur{background:var(--surface-raised);color:var(--light);box-shadow:inset 2px 0 0 var(--x-proposed-lit)}
.ai .dec{grid-column:2 / -1;font-size:var(--type-small);line-height:var(--leading-small)}
.ai .bar{grid-column:2 / -1;height:var(--space-1);border-radius:1px;background:var(--hairline);position:relative;overflow:hidden;margin-top:var(--space-1)}
.ai .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-muted)}
.clock{margin-top:auto;border-top:1px solid var(--hairline);padding-top:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.clock b{font:400 var(--type-heading)/1 var(--font-mono);color:var(--light);display:block;margin-bottom:var(--space-1)}
.form{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-5)}
.form .h2{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap}
.paper{font-size:var(--type-small);color:var(--ink-muted)}
.slot{display:grid;grid-template-columns:var(--measure-card) minmax(0,1fr);gap:var(--space-4);border-top:1px solid var(--hairline);padding-top:var(--space-3);transition:opacity var(--motion-calm) var(--ease-out)}
.slot .sh b{display:flex;gap:var(--space-2);align-items:center;font-weight:400;color:var(--light);font-size:var(--type-meta)}
.slot .sh span{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:2px}
.slot .body{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.slot.empty .body{color:var(--ink-muted)}
.slot.wait{opacity:.45}
.prefill{border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3)}
.prefill .from{display:block;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);margin-bottom:var(--space-1)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.faces{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.side p{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.side .today{display:grid;gap:var(--space-2)}
.side .today div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.keys{display:flex;gap:var(--space-2);flex-wrap:wrap}
.keys .btn{height:calc(var(--target-sm) - var(--space-1))}
@media (max-width:1400px){.wrap{grid-template-columns:240px minmax(0,1fr) 200px;gap:var(--space-4)}.slot{grid-template-columns:200px minmax(0,1fr)}.slot .sh span{display:none}.form{padding:var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Minuting live · V1</b> the agenda is the form: each item arrives with its slots laid out from its paper · board agendas and papers</div>
<script>
/*@DATA@*/
/*@LIB@*/
NOW = '2026-05-12';
const MT = meetingOf('D-118'), D = Dn('D-118');
const S = { cur: 3, clock: '10:38', used: 3 };
const SLOTS = item => item.no === 4 ? [
  ['Motion', 'from the paper; moved and seconded in the room', 'hand', `<div class="prefill"><span class="from">${I('file-text', 12)} from “${docT(item.paper)}”, its recommendation · not yet moved</span>${D.motion.text}</div>`],
  ['Discussion', 'notes, not decisions: kept as context', 'message-square', `<span class="muted">Nothing yet. Notes typed here never become decisions.</span>`],
  ['Resolution', 'agreed words, read back before the next item', 'stamp', `<span class="mk-gap">not agreed yet</span>`],
  ['Actions', 'one owner, one date each', 'circle-dot', `<span class="mk-gap">none yet</span>`],
  ['Revisit if', 'what would bring it back here', 'eye', `<span class="mk-gap">not set</span> <span class="small muted">· asked for before the item closes</span>`]
] : item.decision && Dn(item.decision) ? [
  ['Resolution', 'agreed and read back', 'stamp', `<span class="lite">${Dn(item.decision).words}</span> ${did(item.decision)}`]
] : [
  ['Notes', 'this item has no paper and no motion', 'message-square', `<span class="mk-gap">nothing yet</span>`]
];
function render() {
  const ag = DATA.agenda, item = ag[S.cur];
  const elapsed = ag.slice(0, S.cur).reduce((a, x) => a + x.min, 0);
  $('#app').innerHTML = topHTML(['Mandate', B.short, MT.no, 'Live'], [['M', 'motion'], ['N', 'note'], ['D', 'decision'], ['A', 'action'], ['⏎', 'next item'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
    <aside class="rail" aria-label="Agenda"><p class="eyebrow" style="margin-bottom:var(--space-2)">Agenda · ${MT.no}</p>
      ${ag.map((a, i) => { const st = i < S.cur ? 'done' : i === S.cur ? 'cur' : ''; const used = i < S.cur ? a.min : i === S.cur ? S.used : 0;
        return `<div class="ai dep ${st}" style="--i:${i}"><span class="no">${a.no}</span><span>${a.title}</span><span class="mins">${i < S.cur ? '' : a.min + ' min'}</span>
        ${a.decision && i < S.cur ? `<span class="dec">${did(a.decision)} ${Dn(a.decision).title}</span>` : ''}
        ${i === S.cur ? `<span class="bar"><i style="width:${Math.min(100, used / a.min * 100)}%"></i></span>` : ''}</div>`; }).join('')}
      <div class="clock"><b>${S.clock}</b>started ${MT.start} · planned ${ag.reduce((a, x) => a + x.min, 0)} min · ${elapsed + S.used} used</div></aside>
    <section class="form pane scroll" aria-label="Item ${item.no}">
      <div><p class="eyebrow">Now · item ${item.no} of ${ag.length}</p><p class="h2">${item.title} ${item.paper ? `<span class="paper">${I('paperclip', 12)} ${docT(item.paper)} · ${P(DATA.docs[item.paper].by).name}</span>` : ''}</p></div>
      ${SLOTS(item).map(([t, d, ic, body], i) => `<div class="slot dep ${i ? 'empty' : ''}" style="--i:${i + 2}"><div class="sh"><b>${I(ic, 16)} ${t}</b><span>${d}</span></div><div class="body">${body}</div></div>`).join('')}
      <div class="keys" style="margin-top:auto"><button class="btn sm">${I('hand', 14)} Moved by… <span class="kbd">M</span></button><button class="btn sm">${I('message-square', 14)} Note <span class="kbd">N</span></button><button class="btn sm">${I('stamp', 14)} Draft resolution <span class="kbd">D</span></button><button class="btn sm">${I('circle-dot', 14)} Action <span class="kbd">A</span></button></div>
    </section>
    <aside class="side"><div><p class="eyebrow" style="margin-bottom:var(--space-2)">In the room</p><div class="faces">${MT.present.map(p => face(p)).join('')}${MT.apologies.map(p => face(p, 'off')).join('')}</div>
      <p style="margin-top:var(--space-2)">${MT.present.length} of ${B.members.length} members · quorum ${B.quorum}, met. ${MT.apologies.map(p => P(p).name).join(', ')}: apologies.</p></div>
      <div><p class="eyebrow" style="margin-bottom:var(--space-2)">Decided today</p><div class="today">${ag.slice(0, S.cur).filter(a => a.decision).map(a => `<div>${did(a.decision)}<span>${Dn(a.decision).title}<br><span class="muted">agreed, read back · ${statusAt(a.decision) === 'not yet' ? '' : 'in force'}</span></span></div>`).join('') || '<p>Nothing yet.</p>'}</div></div>
      <div><p class="eyebrow" style="margin-bottom:var(--space-2)">Minute taker</p><p>${who(B.secretary)}. Minutes are agreed item by item; the draft goes to members tonight, and the June meeting confirms it.</p></div></aside>
    </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.cur = 2; S.clock = '10:36'; S.used = 8; render(); settle();
  /* the moment: item 3 closes with its decision, and item 4 arrives with its slots already laid out from its paper */
  later(() => { S.cur = 3; S.clock = '10:38'; S.used = 0; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'Enter') { S.cur = Math.min(DATA.agenda.length - 1, S.cur + 1); S.used = 0; render(); }
});
replay();
</script>
</body>
</html>
