<!doctype html>
<html lang="en-GB">

<style>
/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; listed as
   "needs token" in the notes. Marks carried from earlier runs.
   --------------------------------------------------------------- */
:root{
  /* six ways to be empty (catalogue run): corner ticks for not known yet */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  /* stale and past: 45 degree hatch (wear and time) */
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-stale: repeating-linear-gradient(45deg, transparent 0 calc(var(--space-1) - 1px), var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1));
  /* not yours to see: 135 degree hatch */
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* worth revisiting, sources disagree, overdue: a warning edge, never red */
  --x-proposed-warn: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-warn-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  /* quiet lines (wear and time) */
  --x-proposed-quiet: .62;
  --x-proposed-type-micro: .6875rem;
  /* the lit next step (light language) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* pencil (reference desk): what a model heard or drafted, until a person accepts it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  /* NEW in this run. the agreed record: ink that the room has assented to */
  --x-proposed-agreed: var(--light);
  /* NEW. the resolution's fixed form of words: a serif-free "set" measure, a touch larger than body */
  --x-proposed-resolution-size: calc(var(--type-lead) * 1.1);
  /* NEW. a reversed decision's text: quieter, never struck through, never gone */
  --x-proposed-reversed: .55;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.lite{color:var(--light)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.hints .on{color:var(--x-proposed-lit)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
h1,h2,h3,p{margin:0}

/* floors */
[data-tier="department"]{--fc:var(--floor-department-high);--fl:var(--floor-department-low)}
[data-tier="team"]{--fc:var(--floor-team-high);--fl:var(--floor-team-low)}
[data-tier="org"]{--fc:var(--floor-org-high);--fl:var(--floor-org-low)}
[data-tier="you"]{--fc:var(--floor-you-high);--fl:var(--floor-you-low)}
.fchip{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap}
.fchip::before{content:"";width:var(--space-4);height:2px;background:var(--fc);border-radius:1px}
.who{color:var(--ink);white-space:nowrap;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--fc) 55%,transparent);text-underline-offset:var(--focus-gap);text-decoration-thickness:1px}
.face{display:inline-flex;align-items:center;justify-content:center;width:var(--target-sm);height:var(--target-sm);border-radius:var(--radius-pill);border:1px solid color-mix(in srgb,var(--fc) 60%,transparent);font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink);background:var(--surface-inset);flex:none}
.face.sm{width:calc(var(--space-5) - var(--space-1));height:calc(var(--space-5) - var(--space-1));font-size:var(--x-proposed-type-micro)}
.face.off{opacity:var(--x-proposed-quiet);border-style:dashed}
.face.yes{border-color:var(--x-proposed-lit);color:var(--light);box-shadow:0 0 0 var(--focus-gap) var(--x-proposed-lit-wash)}

/* two registers: technical line one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* ---- decision marks (the minute sheet's grammar) ---- */
.did{display:inline-block;font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:3px var(--space-1);white-space:nowrap;vertical-align:1px}
.stw{display:inline-flex;align-items:center;gap:var(--space-2);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink);white-space:nowrap}
.dm{display:inline-block;width:3px;height:1.1em;border-radius:1px;background:var(--light);flex:none}
.dm.st-force{background:var(--light)}
.dm.st-review{background:var(--x-proposed-warn)}
.dm.st-amended{background:linear-gradient(var(--light) 0 38%,transparent 38% 52%,var(--light) 52%)}
.dm.st-reversed{background:var(--x-proposed-stale);outline:1px solid var(--hairline-strong)}
.dm.st-spent{background:var(--hairline-strong)}
.dm.st-lapsed{background:repeating-linear-gradient(var(--ink-muted) 0 2px,transparent 2px 4px)}
.dm.st-motion,.dm.st-notyet{background:none;outline:1px dashed var(--ink-muted);outline-offset:-1px}
.stw.st-review{color:var(--x-proposed-warn)}
.stw.st-reversed,.stw.st-spent,.stw.st-lapsed,.stw.st-notyet{color:var(--ink-muted)}
.stw.st-force{color:var(--light)}
.is-reversed .rtxt{opacity:var(--x-proposed-reversed)}
/* the resolution: a fixed form of words */
.res{font-weight:300;font-size:var(--x-proposed-resolution-size);line-height:1.45;color:var(--x-proposed-agreed);letter-spacing:var(--tracking-tight)}
.res .rv{font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-right:var(--space-2);vertical-align:2px}
/* evidence pointer: a superscript number into what it rests on */
.ptr{font:500 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--info);vertical-align:super;margin-left:1px}
/* action marks */
.am{display:inline-flex;color:var(--ink);flex:none}
.am-given{color:var(--ink-muted)}
.am-done{color:var(--light)}
.am-discharged{color:var(--x-proposed-lit)}
.am-overtaken{color:var(--ink-muted)}
.am-overdue{color:var(--x-proposed-warn)}
.late{color:var(--x-proposed-warn);white-space:nowrap}
/* seam: a change that stays visible (wear and time) */
.seam{display:inline-flex;align-items:center;gap:var(--space-1);border-left:2px solid var(--info);padding-left:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.seam s{color:var(--ink-muted);text-decoration-color:var(--ink-muted)}
/* tripwire on a sparkline */
.spk{vertical-align:-5px;overflow:visible}
.sp-ln{stroke:var(--ink);stroke-width:1.25;stroke-linejoin:round}
.sp-dot{fill:var(--light)}
.sp-over{fill:var(--x-proposed-warn)}
.sp-tw{stroke:var(--x-proposed-warn);stroke-width:1;stroke-dasharray:2 2;opacity:.8}

/* six ways to be empty, the ones this run meets */
.mk-gap{display:inline-block;min-width:var(--space-6);padding:0 var(--space-2);color:var(--ink-muted);font-style:italic;
  --t:var(--space-1);
  background:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--t) no-repeat}
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);white-space:nowrap}

/* pencil and ink */
.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3)}
.pencil .pt{font-style:italic;color:var(--ink)}
.pencil .pl{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);margin:0 0 var(--space-1)}
.pencil.inked{border-style:solid;border-color:var(--hairline-strong);background:none}
.pencil.inked .pt{font-style:normal}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);white-space:nowrap;transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard)}
.btn:hover{background:var(--surface-raised)}
.btn.go{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.btn.sm{height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-2);font-size:var(--type-small)}
.btn[aria-disabled="true"]{opacity:var(--x-proposed-quiet);cursor:not-allowed}

/* app frame */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--slate-deep) 70%,transparent);min-width:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.crumb b{font-weight:400;color:var(--light)}
.crumb svg{opacity:var(--x-proposed-quiet);flex:none}
.asat{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap}
.asat b{font-weight:400;color:var(--light)}
.top .hints{margin-left:auto;justify-content:flex-end}
.main{min-height:0;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));overflow:hidden}
.h1{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.h2{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.lab{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.small{font-size:var(--type-small);line-height:var(--leading-small)}
.meta{font-size:var(--type-meta);line-height:var(--leading-meta)}
.pane{background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset)}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}
.x-cap{max-width:calc(100vw - 2 * var(--edge-tight));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intro .h1{white-space:nowrap}
@media (max-width:1400px){.h1{font-size:var(--type-heading);line-height:var(--leading-heading);letter-spacing:var(--tracking-label)}.intro .eyebrow{white-space:nowrap}}

/* ---- V2: what was heard (pencil) and what was agreed (ink). Nothing becomes the record until it is read back ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:var(--space-5)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.col .hd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3)}
.heard{min-height:0;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-inset)}
.hl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);transition:background var(--motion-base) var(--ease-standard)}
.hl .t{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.hl .tx{font-style:italic;color:var(--ink)}
.hl .tx b{font-style:normal;font-weight:400;color:var(--ink-muted);margin-right:var(--space-1)}
.hl.used{background:var(--surface-raised)}
.hl .n{font:500 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--info);margin-left:var(--space-1)}
.off{display:flex;flex-direction:column;gap:var(--space-2);align-items:flex-start;padding:var(--space-4);border:1px dashed var(--hairline);border-radius:var(--radius-inset);color:var(--ink-muted);font-size:var(--type-meta)}
.keep{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.minute{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-5)}
.prev{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-bottom:1px solid var(--hairline);padding-bottom:var(--space-3)}
.prev div{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2)}
.item{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.draft{position:relative;border-radius:var(--radius-key);padding:var(--space-3) var(--space-4);transition:border-color var(--motion-calm) var(--ease-out),background var(--motion-calm) var(--ease-out)}
.draft .pl{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);margin-bottom:var(--space-2)}
.draft p.s{font-size:var(--type-body);line-height:var(--leading-body);margin-bottom:var(--space-2)}
.draft.pencil p.s{font-style:italic}
.draft.typed{border:1px solid var(--hairline-strong)}
.draft.ink{border:1px solid var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.draft.ink p.s{color:var(--light)}
.draft .res{font-size:var(--type-lead);line-height:var(--leading-lead);font-style:normal!important}
.reading{display:flex;align-items:center;gap:var(--space-3);font-size:var(--type-meta);color:var(--light);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.reading .faces{display:flex;gap:var(--space-1);margin-left:auto}
.go{display:flex;gap:var(--space-2);margin-top:auto}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:var(--space-4)}.minute{padding:var(--space-3)}.prev{display:none}.draft p.s{font-size:var(--type-meta);line-height:var(--leading-meta)}.draft .res{font-size:var(--type-body);line-height:var(--leading-body)}}
</style>

  overdue:    { w: 'Past its date',           s: 'Overdue', icon: 'circle-alert', q: 'open' }
};
function dueAt(id, at = NOW) {
  const a = Ac(id); let due = a.due;
  (a.moves || []).forEach(m => { if (le(m.on, at)) due = m.to; });
  return due;
}
function actionAt(id, at = NOW) {
  const a = Ac(id);
  if (!le(a.set, at)) return null;
  let s = 'given', on = a.set, note = '';
  a.history.forEach(([d, st, n]) => { if (le(d, at) && st !== 'moved' && st !== 'overdue') { s = st; on = d; note = n || ''; } });
  const open = ['given', 'accepted', 'part'].includes(s);
  const due = dueAt(id, at);
  const late = open && ts(due) < ts(at) ? days(due, at) : 0;
  return { s, on, note, open, due, late, shown: late ? 'overdue' : s };
}
const amHTML = (st, size = 16) => `<span class="am am-${st}" title="${AS[st].w}">${I(AS[st].icon, size)}</span>`;

/* people */
const who = (id, opts = {}) => `<span class="who" data-tier="${P(id).floor}">${opts.initials ? P(id).initials : P(id).name}</span>`;
const face = (id, cls = '') => `<span class="face ${cls}" data-tier="${P(id).floor}" title="${P(id).name}, ${P(id).role}">${P(id).initials}</span>`;
const list = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

/* series and their tripwires */
function seriesAt(key, at = NOW) {
  const s = DATA.series[key]; const ym = at.slice(0, 7);
  const pts = s.points.filter(([m]) => m <= ym);
  return pts.length ? pts[pts.length - 1][1] : null;
}
function spark(key, opts = {}) {
  const s = DATA.series[key], w = opts.w || 96, h = opts.h || 22, upto = (opts.at || NOW).slice(0, 7);
  const pts = s.points.filter(([m]) => m <= upto);
  if (pts.length < 2) return '';
  const vals = s.points.map(p => p[1]).concat(opts.line != null ? [opts.line] : []);
  const max = Math.max(...vals) * 1.08, min = Math.min(0, ...vals), n = s.points.length - 1;
  const X = i => 2 + i * (w - 4) / n, Y = v => h - 2 - (v - min) * (h - 4) / (max - min);
  const ink = pts.map(([, v], i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const last = pts.length - 1, lv = pts[last][1];
  const over = opts.line != null && (opts.op === '<' ? lv < opts.line : lv > opts.line);
  const tw = opts.line != null ? `<line x1="0" x2="${w}" y1="${Y(opts.line).toFixed(1)}" y2="${Y(opts.line).toFixed(1)}" class="sp-tw"/>` : '';
  return `<svg class="spk" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${s.label}: ${pts.map(([m, v]) => dt(m, 'short') + ' ' + v).join(', ')}${opts.line != null ? '; revisit line at ' + opts.line : ''}">${tw}<polyline points="${ink}" fill="none" class="sp-ln"/><circle cx="${X(last).toFixed(1)}" cy="${Y(lv).toFixed(1)}" r="2.25" class="${over ? 'sp-over' : 'sp-dot'}"/></svg>`;
}

/* one time scale and one now line (one-now): x for an ISO date between two dates */
const scaleX = (from, to, w) => iso => (ts(iso) - ts(from)) / (ts(to) - ts(from)) * w;

/* two registers and the model gateway */
const STATE = { tech: false, gateway: true };
function topHTML(crumbs, hints, opts = {}) {
  const fl = DATA.floors[opts.floor || B.floor];
  return `<header class="top"><p class="brand">AUGUR</p>
    <nav class="crumb" aria-label="Where you are">${crumbs.map((c, i) => (i ? I('chevron-right', 14) : '') + (i === crumbs.length - 1 ? `<b>${c}</b>` : `<span>${c}</span>`)).join('')}</nav>
    <span class="fchip" data-tier="${opts.floor || B.floor}">${fl.name} · ${fl.word}</span>
    ${opts.as ? `<span class="asat">${I('calendar', 14)} as at <b>${dt(opts.as)}</b></span>` : ''}
    <div class="hints">${hints.map(([k, w, id]) => `<span ${id ? `id="${id}"` : ''}><span class="kbd">${k}</span>${w}</span>`).join('')}</div></header>`;
}
function commonKeys(e, rerender, replay) {
  const k = e.key.toLowerCase();
  if (e.metaKey || e.ctrlKey || e.altKey) return false;
  if (e.target.closest && e.target.closest('input,textarea,[contenteditable="true"]')) return false;
  if (k === 'r') { replay(); return true; }
  if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); $('#h-t')?.classList.toggle('on', STATE.tech); return true; }
  if (k === 'g') { STATE.gateway = !STATE.gateway; $('#h-g')?.classList.toggle('on', !STATE.gateway); rerender && rerender(); return true; }
  return false;
}

/* timers for the moment, cleared on replay */
let TIMERS = [];
const later = (fn, t) => TIMERS.push(setTimeout(fn, reduced ? Math.min(t, 50) : t));
const clearLater = () => { TIMERS.forEach(clearTimeout); TIMERS = []; };
const MOMENT = () => ms('--motion-run');
/* deposit once: everything with .dep settles in, then nothing moves */
function settle() { document.body.classList.add('pre'); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('pre'))); }

NOW = '2026-05-12';
const MT = meetingOf('D-118'), D = Dn('D-118'), H = DATA.heard;
/* the model's summary: each sentence names the heard lines it comes from, so it can be checked */
const SUM = [
  { text: 'Priya Nair moved that van inspections at the North depot move in-house from 1 July, seconded by Jo Barnes.', from: [0] },
  { text: 'Ade Bello asked for it to be a trial, as the costing has no figure for cover when a fitter is away. The mover agreed.', from: [1, 2] },
  { text: D.words, from: [0, 1, 2], res: true },
  { text: 'It comes back to this meeting if ' + D.revisitIf[0].text + ', and in November in any case.', from: [2, 5] }
];
const S = { step: 3 }; /* 0 heard only, 1 drafted, 2 read back, 3 agreed */
function draftHTML() {
  if (S.step < 1) return `<div class="draft" style="border:1px dashed var(--hairline)"><p class="pl">${I('pencil', 12)} No summary yet</p><p class="keep">The model drafts one when ${first(B.secretary)} closes the discussion (D).</p></div>`;
  const model = STATE.gateway;
  const cls = S.step >= 3 ? 'ink' : model ? 'pencil' : 'typed';
  const lab = S.step >= 3 ? `${I('stamp', 12)} Agreed at 10:52 by the ${MT.present.length} present · read back by ${P(B.chair).name} · now the minute`
    : model ? `${I('pencil', 12)} Drafted by the model from what it heard · ${first(B.secretary)} has not accepted it` : `${I('keyboard', 12)} Typed by ${P(B.secretary).name} · the model is off`;
  return `<div class="draft ${cls}"><p class="pl">${lab}</p>${SUM.map(s => `<p class="s ${s.res ? 'res' : ''}">${s.res ? '<span class="rv">Resolved</span>' : ''}${s.text}${model && S.step < 3 ? `<span class="ptr">${s.from.map(f => H[f].t).join(', ')}</span>` : ''}</p>`).join('')}</div>`;
}
function render() {
  const used = S.step >= 1 ? new Set(SUM.flatMap(s => s.from)) : new Set();
  $('#app').innerHTML = topHTML(['Mandate', B.short, MT.no, 'Live'], [['D', 'draft'], ['Space', 'read back'], ['A', 'agreed'], ['G', 'model off', 'h-g'], ['T', 'record fields', 'h-t'], ['R', 'replay']]) +
    `<main class="main"><div class="wrap">
    <section class="col" aria-label="What was heard"><div class="hd"><div><p class="eyebrow">Heard · item ${D.item}</p><p class="h2">What was said</p></div><span class="small muted">pencil · not the record</span></div>
      ${STATE.gateway ? `<div class="heard scroll">${H.map((h, i) => `<div class="hl dep ${used.has(i) ? 'used' : ''}" style="--i:${i}"><span class="t">${h.t}</span><span class="tx"><b>${P(h.by).name}</b>${h.text}${used.has(i) ? `<span class="n">used</span>` : ''}</span></div>`).join('')}</div>
      <p class="keep">${I('clock', 12)} What was heard is kept with the meeting for 30 days, for checking the minute, then deleted. Only the agreed minute is the record.<span class="tk">retention: heard[] 30d (body setting) · minute: permanent</span></p>`
      : `<div class="off">${I('mic-off', 20)}<p>The model gateway is off, so nothing is heard or drafted.</p><p>${P(B.secretary).name} types the minute. What the room agrees, and every part of the record, stays the same.</p></div>`}
    </section>
    <section class="minute pane scroll" aria-label="The minute"><div class="hd"><div><p class="eyebrow">The minute · ${MT.no}</p><p class="h2">What was agreed</p></div></div>
      <div class="prev">${DATA.agenda.slice(0, 3).map(a => `<div><span class="mono">${a.no}</span><span>${a.title}${a.decision ? ` · ${did(a.decision)} agreed` : ' · noted'}</span></div>`).join('')}</div>
      <p class="item">${D.item}. ${DATA.agenda[3].title}</p>
      ${draftHTML()}
      ${S.step === 2 ? `<div class="reading">${I('mic', 16)} ${P(B.chair).name} is reading it back to the room <span class="faces">${MT.present.map(p => face(p, 'sm')).join('')}</span></div>` : ''}
      ${S.step >= 3 ? `<p class="keep">${D.vote.for.length} for, ${D.vote.abstain.length} abstained (${P(D.vote.abstain[0]).name}). Numbered ${did('D-118')}. The draft of the whole minute goes to members tonight; the June meeting confirms it.</p>` : ''}
      <div class="go">${S.step === 1 ? `<button class="btn go">${I('mic', 14)} Read it back <span class="kbd">Space</span></button><button class="btn">${I('pencil', 14)} Edit first</button>` : S.step === 2 ? `<button class="btn go">${I('check', 14)} The room agrees <span class="kbd">A</span></button><button class="btn">${I('undo-2', 14)} Not quite: change it</button>` : ''}</div>
    </section></div></main>`;
  Icons.hydrate($('#app'));
}
function replay() {
  clearLater(); S.step = 0; render(); settle();
  /* the moment: the model drafts a summary that points at what it heard; the chair reads it back */
  later(() => { S.step = 1; render(); }, MOMENT());
  later(() => { S.step = 2; render(); }, MOMENT() + ms('--motion-run'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const k = e.key.toLowerCase();
  if (k === 'd') { S.step = Math.max(S.step, 1); render(); }
  if (k === ' ') { e.preventDefault(); S.step = Math.min(3, S.step + 1); render(); }
  if (k === 'a') { S.step = 3; render(); }
});
replay();
</script>
</body>
</html>
