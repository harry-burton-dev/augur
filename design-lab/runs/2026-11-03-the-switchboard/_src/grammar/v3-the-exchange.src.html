<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Routing sheet · V3 The exchange</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%;gap:var(--space-3)}
.hd{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap}
.hd .title{font-size:var(--type-heading);line-height:var(--leading-heading)}
.days{display:flex;gap:var(--space-1);margin-left:auto}
.days button{font:400 var(--type-small)/1 var(--font-mono);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink-muted)}
.days button[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.board{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);gap:var(--space-7);padding:var(--space-4) var(--space-5);min-height:0}
.board svg.cords{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:var(--space-2);position:relative;z-index:1}
.col h3{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);font-weight:400;position:absolute;top:calc(var(--space-4) * -1)}
.jack,.key,.lamp{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-key);padding:var(--space-1) var(--space-3)}
.jack .hole,.lamp .bulb{flex:none;width:var(--space-3);height:var(--space-3);border-radius:50%;border:1px solid var(--hairline-strong);background:var(--slate-deep)}
.jack{justify-content:space-between}
.jack .hole{order:2}
.lamp .bulb{transition:background var(--motion-base),box-shadow var(--motion-base)}
.lamp.lit .bulb{background:var(--x-proposed-lit);border-color:var(--x-proposed-lit);box-shadow:0 0 var(--space-3) color-mix(in srgb,var(--green) 50%,transparent)}
.lamp.heldl .bulb{background:var(--x-proposed-held),var(--slate-deep);border-color:var(--ink-muted)}
.lamp.urg .bulb{background:var(--danger);border-color:var(--danger)}
.lamp .nm{flex:1;min-width:0}
.lamp .nm small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lamp .tag{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);display:inline-flex;gap:var(--space-1);align-items:center}
.key{justify-content:flex-start;padding:var(--space-1) var(--space-2);background:var(--slate-deep)}
.key .ord{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);width:var(--space-4)}
.key .n{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.key.hit{border-color:var(--hairline-strong)}
.key.hit .n{color:var(--light)}
.key.stop{border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.key small{color:var(--ink-muted);font-size:var(--type-small)}
path.cord{fill:none;stroke-width:1.5;stroke-linecap:round;opacity:.75;transition:opacity var(--motion-base),stroke-width var(--motion-base)}
path.cord.urgent{stroke:var(--danger)}
path.cord.needs{stroke:var(--x-proposed-lit)}
path.cord.first{stroke:var(--ink)}
path.cord.record{stroke:var(--ink-muted);stroke-dasharray:3 4}
path.cord.stop{stroke:var(--x-proposed-blocked);stroke-dasharray:2 3}
path.cord.dim{opacity:.12}
path.cord.hi{opacity:1;stroke-width:2.5}
.read{display:flex;gap:var(--space-4);align-items:flex-start;min-height:calc(var(--leading-meta) * 2 + var(--space-4));padding:var(--space-3) var(--space-4)}
.read .lst{display:flex;gap:var(--space-1);flex-wrap:wrap;max-width:46%}
.read .lst button{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);padding:var(--space-1) var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink-muted)}
.read .lst button[aria-pressed="true"]{color:var(--light);border-color:var(--hairline-strong)}
.read .ex{flex:1;font-size:var(--type-meta);line-height:var(--leading-meta)}
.read .ex b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.board{gap:var(--space-6);padding:var(--space-4) var(--space-2)}.jack,.key,.lamp{font-size:var(--type-small);line-height:var(--leading-small)}.lamp .nm small{display:none}}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <div class="hd"><p class="eyebrow">Grammar</p><h1 class="title">The exchange: every notice is a cord</h1><div class="days" id="days" role="group" aria-label="Day"></div></div>
    <div class="board pane" id="board">
      <svg class="cords" id="cords" aria-hidden="true"></svg>
      <div class="col" id="apps"><h3>Apps</h3></div>
      <div class="col" id="keys"><h3>The operator’s rules, tried in order</h3></div>
      <div class="col" id="people"><h3>People</h3></div>
    </div>
    <div class="read pane" id="read"></div>
  </div></main>
</div>
<div class="x-cap"><b>Routing sheet · V3</b> the exchange: apps, the operator’s rules, people · cord switchboards and busy lamp fields</div>
<script>/*@DATA@*/
/*@LIB@*/
let day = 2, sel = null;
const people = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p9'];
$('#top').innerHTML = topHTML(['Notices', 'Routing sheet', 'Exchange'], [['1–7', 'day'], ['←→', 'notice'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
$('#days').innerHTML = DATA.week.days.map((d, i) => `<button data-d="${i}" aria-pressed="${i === day}">${d.split(' ')[0]}</button>`).join('');
$('#apps').innerHTML += Object.entries(DATA.apps).map(([id, a]) => `<div class="jack" data-app="${id}">${appTag(id)}<span class="hole"></span></div>`).join('');
$('#keys').innerHTML += RULE_ORDER.filter(k => k !== 'nobody').map((k, i) => `<div class="key" data-rule="${k}"><span class="ord">${i + 1}</span>${ruleChip(k)}<span class="n"></span></div>`).join('');
$('#people').innerHTML += people.map(p => `<div class="lamp" data-p="${p}"><span class="bulb"></span><span class="nm">${who(p)}<small>${P(p).role}</small></span><span class="tag"></span></div>`).join('');
/* a day's cords: deliveries made that day (an escalation can be days after its notice), and notices stopped that day */
const onDay = d => dayOf(d.sent) === day;
const dayRoutes = () => ALL().filter(r => r.blocked ? dayOf(r.t) === day : r.deliveries.some(onDay))
  .map(r => ({ r, t: r.blocked ? r.t : Math.min(...r.deliveries.filter(onDay).map(d => d.sent)) })).sort((a, b) => a.t - b.t).map(x => Object.assign({}, x.r, { dayT: x.t }));
function centre(el, side) { const b = $('#board').getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: (side === 'r' ? r.right : side === 'l' ? r.left : r.left + r.width / 2) - b.left, y: r.top + r.height / 2 - b.top }; }
function cordsFor(r) {
  const out = [], j = centre($(`.jack[data-app="${r.n.app}"]`), 'r');
  if (r.blocked) { const k = $(`.key[data-rule="${r.blocked.rule}"]`), kl = centre(k, 'l'); out.push({ d: `M${j.x},${j.y} C${(j.x + kl.x) / 2},${j.y} ${(j.x + kl.x) / 2},${kl.y} ${kl.x},${kl.y}`, c: 'stop', id: r.n.id }); return out; }
  for (const d of r.deliveries.filter(onDay)) {
    const lamp = $(`.lamp[data-p="${d.p}"]`); if (!lamp) continue;
    const k = $(`.key[data-rule="${d.rule}"]`), kl = centre(k, 'l'), kr = centre(k, 'r'), l = centre(lamp, 'l');
    const mx1 = (j.x + kl.x) / 2, mx2 = (kr.x + l.x) / 2;
    out.push({ d: `M${j.x},${j.y} C${mx1},${j.y} ${mx1},${kl.y} ${kl.x},${kl.y} L${kr.x},${kr.y} C${mx2},${kr.y} ${mx2},${l.y} ${l.x},${l.y}`, c: r.cls, id: r.n.id });
  }
  return out;
}
function explain(r) {
  if (!r) return `<p class="ex muted">Hover or pick a notice to follow its cord. ${dayRoutes().length} notices on ${DATA.week.days[day]}; * marks one sent on an earlier day that asked someone today.</p>`;
  const n = r.n;
  if (r.blocked) return `<div class="ex"><p>${lvl(n)} <b>${n.title}</b> · ${appTag(n.app)} · ${n.at}</p><p>${ruleChip(r.blocked.rule)} Nobody was told. ${r.blocked.why}</p></div>`;
  return `<div class="ex"><p>${lvl(n)} <b>${n.title}</b> · ${appTag(n.app)} · sent ${n.at}${dayOf(r.t) !== day ? ', still open today' : ''}</p><p>${r.deliveries.filter(onDay).map(d => `${who(d.p, { first: true })}: ${RULES[d.rule].word.toLowerCase()}${d.held ? `, told ${at(d.told)}` : ''}${d.via === 'escalation' || d.via === 'cover' ? ` (${d.via === 'cover' ? 'cover' : 'asked next'})` : ''}`).join(' · ')}</p></div>`;
}
function draw(upTo = Infinity) {
  const rs = dayRoutes(); let svg = '';
  rs.forEach((r, i) => { if (i < upTo) cordsFor(r).forEach(c => svg += `<path class="cord ${c.c} ${sel ? (c.id === sel ? 'hi' : 'dim') : ''}" d="${c.d}" data-id="${c.id}"/>`); });
  $('#cords').innerHTML = svg;
  const shown = rs.slice(0, upTo);
  $$('.key').forEach(k => { const rule = k.dataset.rule; const n = shown.reduce((a, r) => a + (r.blocked ? (r.blocked.rule === rule ? 1 : 0) : r.deliveries.filter(d => onDay(d) && d.rule === rule).length), 0); k.querySelector('.n').textContent = n || ''; k.classList.toggle('hit', n > 0); k.classList.toggle('stop', n > 0 && ['permission', 'teamoff', 'repeat'].includes(rule)); });
  $$('.lamp').forEach(l => {
    const ds = shown.flatMap(r => r.deliveries || []).filter(d => onDay(d) && d.p === l.dataset.p);
    l.classList.toggle('lit', ds.some(d => !d.held && d.rule !== 'record' && d.rule !== 'urgent'));
    l.classList.toggle('heldl', ds.length > 0 && ds.every(d => d.held || d.rule === 'record'));
    l.classList.toggle('urg', ds.some(d => d.rule === 'urgent'));
    const tags = [];
    if (DATA.rota.byDay[day] === l.dataset.p) tags.push(`${I('phone', 12)}on call`);
    if (awayAt(l.dataset.p, day * DAY + 720)) tags.push(`${I('plane', 12)}away`);
    if (!P(l.dataset.p).hours.days.includes(day)) tags.push(`${I('moon', 12)}off`);
    l.querySelector('.tag').innerHTML = tags.join(' ') + (ds.length ? ` <b class="num" style="color:var(--light);font-weight:400">${ds.length}</b>` : '');
  });
  $('#read').innerHTML = `<div class="lst">${rs.map(r => `<button data-id="${r.n.id}" aria-pressed="${r.n.id === sel}" title="${r.n.title}">${hhmm(r.dayT)}${dayOf(r.t) !== day ? '*' : ''}</button>`).join('')}</div>` + explain(rs.find(r => r.n.id === sel));
  Icons.hydrate(document.body);
}
function play() {
  clearLater(); sel = null; document.body.classList.add('pre'); draw(0);
  later(() => document.body.classList.remove('pre'), 60);
  const rs = dayRoutes(); rs.forEach((r, i) => later(() => draw(i + 1), 1200 + i * 180));
  const story = rs.find(r => (r.deliveries || []).some(d => onDay(d) && d.via === 'escalation'));
  if (story) later(() => { sel = story.n.id; draw(); }, 1200 + rs.length * 180 + 300);
}
$('#days').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; day = +b.dataset.d; $$('#days button').forEach(x => x.setAttribute('aria-pressed', x === b)); play(); });
$('#read').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (!b) return; sel = sel === b.dataset.id ? null : b.dataset.id; draw(); });
$('#read').addEventListener('mouseover', e => { const b = e.target.closest('button[data-id]'); if (b && b.dataset.id !== sel) { sel = b.dataset.id; draw(); } });
document.addEventListener('keydown', e => {
  if (commonKeys(e, play)) return;
  if (/^[1-7]$/.test(e.key)) { $(`#days button[data-d="${+e.key - 1}"]`).click(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const rs = dayRoutes(), i = rs.findIndex(r => r.n.id === sel); const j = e.key === 'ArrowRight' ? Math.min(rs.length - 1, i + 1) : Math.max(0, i - 1); sel = rs[j].n.id; draw(); }
});
addEventListener('resize', () => draw());
Icons.hydrate(document.body); play();
</script></body></html>
