<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Routing sheet · V5 The life of a notice</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-3);height:100%}
.hd{display:flex;align-items:baseline;gap:var(--space-4)}
.hd .title{font-size:var(--type-heading);line-height:var(--leading-heading)}
.dia{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto auto auto;gap:var(--space-5) var(--space-4);align-content:center;padding:var(--space-2) var(--space-2)}
.dia > svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.st{position:relative;z-index:1;background:var(--slate-deep);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);transition:border-color var(--motion-base),box-shadow var(--motion-base)}
.st h3{font-weight:400;font-size:var(--type-body);line-height:var(--leading-body);color:var(--light);display:flex;align-items:center;gap:var(--space-2)}
.st h3 svg{color:var(--ink-muted)}
.st .c{position:absolute;top:var(--space-2);right:var(--space-3);font:400 var(--type-meta)/1 var(--font-mono);color:var(--light)}
.st .you,.st .snd{margin-top:var(--space-1)}
.st .you b,.st .snd b{font-weight:400;color:var(--ink)}
.st.side{border-style:dashed}
.st.stop{border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.st.held{background:var(--x-proposed-held),var(--slate-deep)}
.st.on{border-color:var(--x-proposed-lit);box-shadow:0 0 var(--space-4) color-mix(in srgb,var(--green) 22%,transparent)}
path.ar{fill:none;stroke:var(--hairline-strong);stroke-width:1.25;marker-end:url(#ah)}
path.ar.side{stroke-dasharray:3 4}
.qa{display:grid;grid-template-columns:minmax(0,12rem) repeat(4,minmax(0,1fr));gap:var(--space-1) var(--space-3);padding:var(--space-3) var(--space-4);align-items:center;font-size:var(--type-small);line-height:var(--leading-small)}
.qa .h{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.qa .cell{display:flex;align-items:center;gap:var(--space-2);color:var(--ink-muted);opacity:0;transition:opacity var(--motion-base)}
.qa .cell.in{opacity:1}
.qa .cell b{font:400 var(--type-small)/1 var(--font-mono);color:var(--light)}
.qa .cell.no{color:var(--ink-muted)}
.qa .cell.yes svg{color:var(--x-proposed-lit)}
@media (max-width:1400px){.dia{gap:var(--space-4) var(--space-2)}.st{padding:var(--space-1) var(--space-2)}.st .snd{display:none}.st h3{font-size:var(--type-meta)}}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <div class="hd"><p class="eyebrow">Grammar</p><h1 class="title">The life of a notice: seen is not taken, taken is not done</h1></div>
    <div class="dia" id="dia"><svg id="ar" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--ink-muted)"/></marker></defs><g id="arg"></g></svg></div>
    <div class="qa pane" id="qa"></div>
  </div></main>
</div>
<div class="x-cap"><b>Routing sheet · V5</b> the life of a notice: told, seen, taken, acted · recorded delivery, question and answer, ATC handoff</div>
<script>/*@DATA@*/
/*@LIB@*/
const dd = ALL_D(), rs = ALL();
const COUNT = {
  raised: rs.length, routed: rs.length, held: dd.filter(d => d.held).length, told: dd.length, seen: dd.filter(d => d.seen != null).length,
  taken: dd.filter(d => d.taken != null).length, acted: dd.filter(d => d.acted != null).length, stopped: rs.filter(r => r.blocked).length,
  next: dd.filter(d => d.via === 'escalation' || d.via === 'cover').length, passed: dd.filter(d => d.passed != null).length, stood: dd.filter(d => d.stoodDown != null).length
};
const S = [
  { k: 'raised', c: 1, r: 2, icon: 'zap', n: 'Raised', you: 'nothing yet', snd: 'its own send' },
  { k: 'routed', c: 2, r: 2, icon: 'route', n: 'Routed', you: 'nothing yet', snd: 'who it names' },
  { k: 'held', c: 3, r: 1, icon: 'moon', n: 'Held', you: 'nothing until the hour, the edition or your return', snd: '“held”, never why', cls: 'held side' },
  { k: 'told', c: 4, r: 2, icon: 'bell', n: 'Told', you: 'the band, list, Inbox or Letterbox', snd: 'told: a count' },
  { k: 'seen', c: 5, r: 2, icon: 'eye', n: 'Seen', you: 'it is read. Nothing else changes', snd: 'seen: a count' },
  { k: 'taken', c: 6, r: 2, icon: 'hand', n: 'Taken', you: '“I have it”: the asking stops', snd: 'who has it' },
  { k: 'acted', c: 7, r: 2, icon: 'check-check', n: 'Acted', you: 'done, declined or answered', snd: 'acted, with the answer' },
  { k: 'stopped', c: 2, r: 3, icon: 'octagon-x', n: 'Stopped', you: 'nothing, ever', snd: 'why, and who can change it', cls: 'side stop' },
  { k: 'next', c: 5, r: 3, icon: 'arrow-up-right', n: 'Asked next', you: 'the next person is told', snd: 'the step reached', cls: 'side' },
  { k: 'passed', c: 4, r: 3, icon: 'forward', n: 'Passed on', you: 'with a note, to the next step', snd: 'the note', cls: 'side' },
  { k: 'stood', c: 7, r: 3, icon: 'user-check', n: 'Stood down', you: '“Tom has it”, and it leaves your Inbox', snd: 'nothing new', cls: 'side' }
];
const AR = [['raised', 'routed'], ['routed', 'told'], ['routed', 'held', 1], ['held', 'told', 1], ['told', 'seen'], ['seen', 'taken'], ['taken', 'acted'], ['routed', 'stopped', 1], ['seen', 'next', 1], ['next', 'told', 1], ['seen', 'passed', 1], ['passed', 'next', 1], ['taken', 'stood', 1]];
$('#top').innerHTML = topHTML(['Notices', 'Routing sheet', 'Life of a notice'], [['R', 'replay'], ['T', 'technical words', 'h-t']]);
$('#dia').insertAdjacentHTML('beforeend', S.map(s => `<div class="st ${s.cls || ''}" data-k="${s.k}" style="grid-column:${s.c};grid-row:${s.r}"><h3>${I(s.icon, 16)}${s.n}</h3><span class="c">${COUNT[s.k]}</span><p class="you"><b>You:</b> ${s.you}</p><p class="snd"><b>Sender:</b> ${s.snd}</p></div>`).join(''));
function arrows() {
  const b = $('#dia').getBoundingClientRect(), box = k => $(`.st[data-k="${k}"]`).getBoundingClientRect();
  $('#arg').innerHTML = AR.map(([a, z, side]) => {
    const A1 = box(a), Z = box(z); let x1, y1, x2, y2;
    if (Math.abs(A1.top - Z.top) < 4) { x1 = A1.right; y1 = A1.top + A1.height / 2; x2 = Z.left - 2; y2 = y1; }
    else if (Z.top < A1.top) { x1 = A1.left + A1.width * .75; y1 = A1.top; x2 = Z.left + Z.width * (Z.left > A1.left + 4 ? .25 : .5); y2 = Z.bottom + 2; if (Z.left > A1.right) { x1 = A1.right - 8; } }
    else { x1 = A1.left + A1.width * (A1.left < Z.left - 4 ? .75 : .5); y1 = A1.bottom; x2 = Z.left + Z.width * (Z.left > A1.left + 4 ? .25 : .5); y2 = Z.top - 2; }
    if (a === 'held') { x1 = A1.right; y1 = A1.top + A1.height / 2; x2 = Z.left + Z.width * .5; y2 = Z.top - 2; }
    if (a === 'routed' && z === 'held') { x1 = A1.left + A1.width * .5; y1 = A1.top; x2 = Z.left - 2; y2 = Z.top + Z.height / 2; }
    if (a === 'next' && z === 'told') { x1 = A1.left; y1 = A1.top + A1.height * .3; x2 = Z.right - Z.width * .2; y2 = Z.bottom + 2; }
    if (a === 'passed' && z === 'next') { x1 = A1.right; y1 = A1.top + A1.height / 2; x2 = Z.left - 2; y2 = Z.top + Z.height / 2; }
    const ox = x1 - b.left, oy = y1 - b.top, ex = x2 - b.left, ey = y2 - b.top;
    const mid = Math.abs(oy - ey) < 4 ? `L${ex},${ey}` : (Math.abs(ox - ex) < 4 ? `L${ex},${ey}` : `C${ox},${(oy + ey) / 2} ${ex},${(oy + ey) / 2} ${ex},${ey}`);
    return `<path class="ar ${side ? 'side' : ''}" d="M${ox},${oy} ${mid}"/>`;
  }).join('');
}
/* the story: one notice, four people */
const r = route('n16');
const COLS = [['told', 'Told'], ['seen', 'Seen (acknowledged)'], ['taken', 'Taken (“I have it”)'], ['acted', 'Acted']];
function qa() {
  $('#qa').innerHTML = `<span class="h">${r.n.title}</span>${COLS.map(c => `<span class="h">${c[1]}</span>`).join('')}` + r.deliveries.map(d => `<span>${who(d.p)} <span class="muted">· ${d.via === 'addressed' ? 'by name' : d.via === 'cover' ? 'cover' : 'asked next'}</span></span>` + COLS.map(([k]) => {
    const t = d[k], extra = k === 'taken' && d.passed ? ` passed on ${hhmm(d.passed)}` : k === 'acted' && d.stoodDown && !d.acted ? ` stood down ${at(d.stoodDown)}` : '';
    return `<span class="cell ${t != null ? 'yes' : 'no'}" data-t="${t ?? ''}">${t != null ? `${I('check', 14)}<b>${at(t)}</b>` : `${I('minus', 14)}${extra ? '' : 'no'}`}${extra}</span>`;
  }).join('')).join('');
}
function play() {
  clearLater(); document.body.classList.add('pre'); qa(); Icons.hydrate(document.body);
  $$('.st').forEach(s => s.classList.remove('on'));
  later(() => document.body.classList.remove('pre'), 60);
  const cells = $$('#qa .cell').sort((a, b) => (+a.dataset.t || 1e9) - (+b.dataset.t || 1e9));
  cells.forEach((c, i) => later(() => {
    c.classList.add('in'); const col = [...c.parentNode.children].indexOf(c) % 5; const k = COLS[col - 1]?.[0];
    $$('.st').forEach(s => s.classList.toggle('on', c.dataset.t && s.dataset.k === k));
  }, 1200 + i * 110));
  later(() => $$('.st').forEach(s => s.classList.remove('on')), 1200 + cells.length * 110 + 800);
}
document.addEventListener('keydown', e => commonKeys(e, play));
addEventListener('resize', arrows);
Icons.hydrate(document.body); requestAnimationFrame(arrows); play();
</script></body></html>
