<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-shot-wait" content="4200">
<title>Escalation · V6 Urgent at night</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
:root{--x-proposed-bar:max(var(--space-7),calc((100vh - 100vw / var(--letterbox-ratio)) / 2))}
body{background:var(--slate-deep)}
.far{position:fixed;inset:0;padding:var(--space-7) var(--space-8);filter:blur(var(--glow-blur)) saturate(.4);opacity:.5;pointer-events:none}
.far .ghost{height:var(--space-6);border-radius:var(--radius-key);background:var(--surface-raised);margin-bottom:var(--space-4);width:70%}
.far .ghost:nth-child(2n){width:52%}
.bar{position:fixed;left:0;right:0;height:var(--x-proposed-bar);z-index:var(--layer-overlay);display:flex;align-items:center;gap:var(--space-5);padding:0 var(--space-6);font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);transition:transform var(--motion-slow) var(--ease-out)}
.bar.t{top:0;background:linear-gradient(var(--shade),var(--scrim));transform:translateY(-100%)}
.bar.b{bottom:0;background:linear-gradient(var(--scrim),var(--shade));transform:translateY(100%);flex-direction:column;align-items:stretch;justify-content:flex-start;padding-top:var(--space-4);gap:var(--space-2)}
.open .bar{transform:none}
.bar .u{color:var(--danger)}
.bar .clk{margin-left:auto;font:300 var(--type-title-s)/1 var(--font-mono);color:var(--light);letter-spacing:0}
.sched{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;text-transform:none;letter-spacing:0}
.sched .s{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-pill);color:var(--ink-muted);font-size:var(--type-small)}
.sched .s.on{border-color:var(--danger);color:var(--light)}
.sched .s.ok{border-color:var(--x-proposed-lit);color:var(--light)}
.sched .s.down{text-decoration:line-through;text-decoration-color:var(--ink-muted)}
.frame{position:fixed;left:0;right:0;top:var(--x-proposed-bar);bottom:var(--x-proposed-bar);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.open .frame{opacity:1}
.card{width:min(calc(var(--measure-wide) + var(--space-7)),calc(100vw - 2 * var(--space-6)));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-4) var(--space-6);align-items:end}
.card .k{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--danger);grid-column:1 / -1}
.card h1{font-weight:300;font-size:var(--type-title);line-height:var(--leading-title);color:var(--light);letter-spacing:var(--tracking-tight)}
.card .why{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);margin-top:var(--space-3);max-width:var(--measure-read)}
.acts{display:flex;flex-direction:column;gap:var(--space-2);min-width:16rem}
.acts .btn{justify-content:space-between;height:var(--target-md)}
.acts .btn.lamp{border-color:var(--danger);color:var(--light);background:var(--x-proposed-urgent-wash)}
.acts .btn.lamp.ok{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.state{grid-column:1 / -1;display:flex;gap:var(--space-5);flex-wrap:wrap;padding-top:var(--space-3);border-top:1px solid var(--hairline)}
.who-b{display:none}
.view{position:fixed;top:var(--space-3);right:var(--space-4);z-index:var(--layer-toast)}
</style></head><body>
<div class="far" aria-hidden="true"><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div></div>
<div class="bar t" id="bt"></div>
<div class="frame" id="frame"><div class="card" id="card"></div></div>
<div class="bar b" id="bb"></div>
<div class="hints view"><span><span class="kbd">D</span>Dana’s view</span><span><span class="kbd">R</span>replay</span><span id="h-t"><span class="kbd">T</span>technical</span></div>
<div class="x-cap"><b>Escalation · V6</b> urgent at night: the Letterbox bars carry the schedule · PDR-009, bleep escalation, the signal is the control</div>
<script>/*@DATA@*/
/*@LIB@*/
const r = route('n39'), n = r.n, oncall = r.deliveries[0], nxt = r.deliveries.find(d => d.via === 'escalation');
let VIEW = oncall.p, NOW = r.t;
function render() {
  const me = VIEW, isOn = me === oncall.p;
  const taken = r.resolved != null && r.resolved <= NOW, nxtAsked = nxt && nxt.told <= NOW;
  const myD = r.deliveries.find(d => d.p === me);
  $('#bt').innerHTML = `<span class="u">${I('siren', 14)} Urgent</span><span>${A(n.app).name} · ${DATA.floors[n.floor].name}</span><span>${isOn ? `you are on call (${DATA.rota.name})` : `${P(oncall.p).name} is on call`}</span><span class="tk">urgency budget ${A(n.app).urgent.perWeek}/week, granted by ${P(A(n.app).urgent.grantedBy).name}</span><span class="clk">${hhmm(NOW)}</span>`;
  const sch = [
    { t: oncall.told, w: `${hhmm(oncall.told)} ${first(P(oncall.p).name)}, on call · emailed`, cls: taken ? 'ok' : 'on' },
    ...r.steps.filter(s => s.skipped).map(s => ({ t: s.at, w: `${s.who === 'lead' ? 'team lead' : 'on call'}: ${first(P(s.people[0]).name)}, already asked`, cls: 'down' })),
    nxt ? { t: nxt.sent, w: `${hhmm(nxt.sent)} ${first(P(nxt.p).name)}, Department admin${nxtAsked ? ' · emailed' : ' · if not taken'}`, cls: taken && nxtAsked ? 'down' : nxtAsked ? 'on' : '' } : null
  ].filter(Boolean);
  $('#bb').innerHTML = `<div class="sched">${sch.map(s => `<span class="s ${s.cls}">${s.w}</span>`).join(I('chevron-right', 14))}</div><div class="sched" style="color:var(--ink-muted)">${taken ? `${I('user-check', 14)} ${P(r.by).name} took it at ${hhmm(r.resolved)}.${nxtAsked ? ` ${P(nxt.p).name} was stood down.` : ''}` : `Asked again every ${DATA.urgentPolicy.wait} minutes until someone takes it. Seeing it doesn’t stop the asking; taking it does.`}</div>`;
  let head, why, acts;
  if (!isOn && !nxtAsked) { head = 'Nothing for you yet'; why = `${P(oncall.p).name} is on call. You are asked only if nobody takes it by ${hhmm(nxt.sent)}.`; acts = ''; }
  else if (!isOn && taken) { head = `${P(r.by).name} has it`; why = `You were asked at ${hhmm(nxt.told)} because nobody had taken it in ${DATA.urgentPolicy.wait} minutes. ${first(P(r.by).name)} took it at ${hhmm(r.resolved)}: you are stood down. This closes when you press Done; it never closes by itself.`; acts = `<button class="btn lamp ok">${I('check', 16)} Done <span class="kbd">Enter</span></button>`; }
  else {
    head = n.title;
    why = isOn ? `It is urgent and you are on call tonight, so it was emailed to you at ${hhmm(oncall.told)} and waits here. ${nxt ? `If nobody takes it, ${P(nxt.p).name} is asked at ${hhmm(nxt.sent)}.` : ''}` : `${P(oncall.p).name}, on call, hasn’t taken it in ${DATA.urgentPolicy.wait} minutes, so the urgent rule asks you, the Department admin.`;
    acts = taken && isOn ? `<button class="btn lamp ok">${I('hand', 16)} You have it <span class="kbd">Enter</span></button><button class="btn">${I('arrow-up-right', 16)} Open in ${A(n.app).name}</button>` : `<button class="btn lamp">${I('hand', 16)} I have it <span class="kbd">Enter</span></button><button class="btn">${I('forward', 16)} Pass it on</button><button class="btn">${I('arrow-up-right', 16)} Open in ${A(n.app).name}</button>`;
  }
  $('#card').innerHTML = `<p class="k">${isOn ? 'Urgent · you are on call' : 'Urgent · you are the next step'}</p><div><h1>${head}</h1><p class="why">${why}</p></div><div class="acts">${acts}</div>
    <div class="state">${r.deliveries.filter(d => d.told <= NOW).map(d => `<span>${who(d.p)} ${rcpt(Object.assign({}, d, { seen: d.seen != null && d.seen <= NOW ? d.seen : null, taken: d.taken != null && d.taken <= NOW ? d.taken : null, acted: d.acted != null && d.acted <= NOW ? d.acted : null }))}</span>`).join('')}</div>`;
  Icons.hydrate(document.body);
}
function play() {
  clearLater(); NOW = r.t; document.body.classList.remove('open'); render();
  later(() => document.body.classList.add('open'), 1200);
  const end = r.resolved + 1, step = reduced ? 1 : 1;
  for (let t = r.t + 1, i = 0; t <= end; t += 1, i++) later(() => { NOW = t; render(); }, 1700 + i * 120);
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, play)) return;
  if (e.key.toLowerCase() === 'd') { VIEW = VIEW === oncall.p ? nxt.p : oncall.p; render(); }
});
Icons.hydrate(document.body); play();
</script></body></html>
