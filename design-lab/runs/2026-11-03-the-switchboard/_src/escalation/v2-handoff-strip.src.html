<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escalation · V2 The handoff strip</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4);height:100%}
.hd{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap}
.bays{display:grid;gap:var(--space-3);min-height:0;align-content:center}
.bay{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:var(--space-4);align-items:center;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-inset);min-height:calc(var(--target-md) + var(--space-5))}
.bay .who{font-size:var(--type-meta)}
.bay small{display:block;font-size:var(--type-small);color:var(--ink-muted)}
.rack{position:relative;height:100%;min-height:var(--target-md)}
.strip{position:absolute;top:50%;left:0;transform:translate(0,-50%);display:grid;grid-template-columns:6.5rem minmax(0,18rem) 7rem 7rem 7.5rem;border:1px solid var(--hairline-strong);border-radius:2px;background:var(--slate-deep);font-size:var(--type-small);line-height:var(--leading-small);transition:transform var(--motion-calm) var(--ease-standard),opacity var(--motion-base),border-color var(--motion-base);box-shadow:var(--shadow-raised)}
.strip > span{padding:var(--space-1) var(--space-2);border-right:1px solid var(--hairline);display:flex;flex-direction:column;justify-content:center}
.strip > span:last-child{border-right:0}
.strip .cs{font:500 var(--type-meta)/1.2 var(--font-mono);color:var(--light);border-left:4px solid var(--x-proposed-lit)}
.strip .k{font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.strip b{font:400 var(--type-small)/1.3 var(--font-mono);color:var(--ink)}
.strip .ann{font:400 var(--type-small)/1.3 var(--font-mono);color:var(--x-proposed-lit)}
.strip.offer{transform:translate(var(--space-6),-50%) rotate(-2deg);border-color:var(--x-proposed-lit)}
.strip.ghost{opacity:.4}
.strip.done .cs{border-left-color:var(--ink-muted)}
.rule-line{font-size:var(--type-small);color:var(--ink-muted);margin-left:auto}
.steps{display:flex;gap:var(--space-1);align-items:center;flex-wrap:wrap;padding:var(--space-2) var(--space-3)}
.steps button{font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);padding:var(--space-1) var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink-muted)}
.steps button[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--light)}
.say{flex-basis:100%;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);margin-top:var(--space-2)}
.say b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.strip{grid-template-columns:5.5rem minmax(0,13rem) 6rem 6rem 6.5rem}.bay{grid-template-columns:minmax(0,10rem) minmax(0,1fr)}}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <div class="hd"><p class="eyebrow">Escalation</p><h1 class="heading">The strip stays with its owner until the next one takes it</h1><span class="rule-line">No gap between one owner and the next: offered is not handed over.</span></div>
    <div class="bays" id="bays"></div>
    <div class="pane steps" id="steps"></div>
  </div></main>
</div>
<div class="x-cap"><b>Escalation · V2</b> the handoff strip: offered, then accepted, never a gap · air traffic flight progress strips and sector handoff, the cocked strip</div>
<script>/*@DATA@*/
/*@LIB@*/
const r = route('n16'), n = r.n;
const people = r.deliveries.map(d => d.p);
/* the moments of the handoff, from the route */
const M = [];
const owner0 = r.deliveries[0].p;
M.push({ t: r.deliveries[0].told, owner: owner0, offer: [], w: `${A(n.app).name} gives the strip to <b>${P(owner0).name}</b>. He owns it.` });
r.deliveries.slice(1).forEach(d => {
  const prevOffers = M[M.length - 1].offer.filter(x => true);
  M.push({ t: d.told, owner: owner0, offer: [...prevOffers, d.p], w: d.via === 'cover' ? `${P(owner0).name} is away. The strip is <b>offered</b> to ${P(d.p).name}, his cover. ${first(P(owner0).name)} still owns it until she takes it.` : `Nobody took it${M.length > 1 ? '' : ''}. The policy <b>offers</b> it to ${P(d.p).name}. Everyone it was offered to still sees it.` });
  if (d.passed != null) M.push({ t: d.passed, owner: owner0, offer: [...prevOffers, d.p].filter(x => x !== d.p), passed: d.p, w: `${P(d.p).name} <b>passes it on</b>: “${d.note}” Her offer is withdrawn; it moves to the next step at once.` });
});
if (r.resolved != null) M.push({ t: r.resolved, owner: r.by, offer: [], w: `${P(r.by).name} <b>takes it</b>: “${r.deliveries.find(d => d.p === r.by).note}” Now he owns it. Everyone else is stood down.` });
if (r.acted) M.push({ t: r.acted.acted, owner: r.by, offer: [], done: true, w: `${P(r.acted.p).name}: <b>${r.acted.act.toLowerCase()}</b>. The strip is closed.` });
M.sort((a, b) => a.t - b.t);
let k = 0;
$('#top').innerHTML = topHTML(['Inbox', n.title, 'Handoff'], [['←→', 'step'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
$('#bays').innerHTML = people.map(p => { const d = r.deliveries.find(x => x.p === p); return `<div class="bay" data-p="${p}"><span>${who(p)}<small>${d.via === 'addressed' ? 'named' : d.via === 'cover' ? 'cover' : r.steps.find(s => s.k === d.step).who === 'rota' ? 'on call' : 'team lead'}</small></span><div class="rack"></div></div>`; }).join('');
function strip(m, p) {
  const cls = m.done ? 'done' : m.owner === p ? '' : 'offer';
  return `<div class="strip ${cls}"><span class="cs">${n.key.split(':')[1].toUpperCase()}<span class="k">${A(n.app).name}</span></span><span><b style="font-family:var(--font-sans)">${n.title}</b><span class="k">${LEVELS[n.level].word}</span></span><span><span class="k">limit</span><b>${at(tm(n.limit))}</b></span><span><span class="k">owner</span><b>${first(P(m.owner).name)}</b></span><span><span class="k">${m.done ? 'closed' : m.owner === p ? 'holds' : 'offered'}</span><span class="ann">${hhmm(m.t)} ${dayName(m.t)}</span></span></div>`;
}
function show(i) {
  k = Math.max(0, Math.min(M.length - 1, i)); const m = M[k];
  $$('.bay').forEach(b => { const p = b.dataset.p; const has = p === m.owner || m.offer.includes(p); b.querySelector('.rack').innerHTML = has ? strip(m, p) : ''; });
  $('#steps').innerHTML = M.map((x, j) => `<button data-i="${j}" aria-pressed="${j === k}">${at(x.t)}</button>`).join('') + `<p class="say">${m.w}</p>`;
}
$('#steps').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); });
/* the moment plays up to the handoff that matters: the strip offered to the lead while its owner still holds it */
const STOP = M.findIndex((m, i) => i > 0 && M[i - 1].passed);
function play() { clearLater(); document.body.classList.add('pre'); show(0); later(() => document.body.classList.remove('pre'), 60); for (let i = 1; i <= STOP; i++) later(() => show(i), 1200 + (i - 1) * 380); }
document.addEventListener('keydown', e => { if (commonKeys(e, play)) return; if (e.key === 'ArrowRight') show(k + 1); if (e.key === 'ArrowLeft') show(k - 1); });
Icons.hydrate(document.body); play();
</script></body></html>
