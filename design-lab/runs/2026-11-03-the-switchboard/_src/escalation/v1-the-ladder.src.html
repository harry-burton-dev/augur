<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escalation · V1 The ladder</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-columns:minmax(0,20rem) minmax(0,1fr);gap:var(--space-6);height:100%}
.pol{display:flex;flex-direction:column;gap:var(--space-3)}
.pol ol{margin:0;padding-left:var(--space-5);display:grid;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.pol ol li::marker{font-family:var(--font-mono);color:var(--ink-muted)}
.pol .tabs{display:flex;gap:var(--space-1)}
.pol .tabs button{font-size:var(--type-small);padding:var(--space-1) var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink-muted)}
.pol .tabs button[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--light)}
.lad{position:relative;display:flex;flex-direction:column-reverse;justify-content:center;gap:var(--space-3);padding-left:var(--space-7)}
.lad::before,.lad::after{content:"";position:absolute;top:var(--space-4);bottom:var(--space-4);width:2px;background:var(--hairline-strong)}
.lad::before{left:var(--space-4)}
.lad::after{left:calc(var(--space-6) + 2px)}
.rung{position:relative;display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr) minmax(0,15rem);gap:var(--space-4);align-items:center;padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);transition:border-color var(--motion-base),background var(--motion-base),opacity var(--motion-base)}
.rung::before{content:"";position:absolute;left:calc(var(--space-7) * -1 + var(--space-4));width:calc(var(--space-6) - var(--space-4) + 4px);top:50%;height:2px;background:var(--hairline-strong)}
.rung .st{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.rung .st b{display:block;font:400 var(--type-meta)/var(--leading-meta) var(--font-sans);letter-spacing:0;text-transform:none;color:var(--ink);margin-top:2px}
.rung .pp{font-size:var(--type-meta);line-height:var(--leading-meta)}
.rung .pp small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rung .ck{font:400 var(--type-small)/1.4 var(--font-mono);color:var(--ink-muted);text-align:right}
.rung .ck b{font-weight:400;color:var(--light)}
.rung.skip{opacity:.5;border-style:dashed}
.rung.not{opacity:.38}
.rung.now{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.rung.took{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash);box-shadow:0 0 var(--space-5) color-mix(in srgb,var(--green) 18%,transparent)}
.mark{position:absolute;left:calc(var(--space-4) - 5px);width:calc(var(--space-6) - var(--space-4) + 12px);height:var(--space-3);border-radius:var(--radius-pill);background:var(--x-proposed-lit);box-shadow:0 0 var(--space-3) var(--green);transition:top var(--motion-calm) var(--ease-standard);z-index:2}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <section class="pol">
      <p class="eyebrow">Escalation</p><h1 class="heading" id="h"></h1>
      <div class="tabs" id="tabs"></div>
      <p class="meta muted" id="lead"></p>
      <p class="eyebrow" style="margin-top:var(--space-2)">The policy everyone can read</p>
      <ol id="pol"></ol>
      <p class="small muted" id="pby"></p>
    </section>
    <section class="lad" id="lad" aria-live="polite"></section>
  </div></main>
</div>
<div class="x-cap"><b>Escalation · V1</b> the ladder: each rung a step of the policy, the item climbs until someone takes it · PagerDuty escalation levels, hospital on-call ladders</div>
<script>/*@DATA@*/
/*@LIB@*/
const EX = ['n16', 'n30'];
let cur = 0;
$('#top').innerHTML = topHTML(['Inbox', 'Escalation'], [['1–2', 'item'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
$('#tabs').innerHTML = EX.map((id, i) => `<button data-i="${i}"><span class="kbd">${i + 1}</span> ${N(id).at}</button>`).join('');
$('#pol').innerHTML = `<li>The person it names, until its limit (or ${DATA.policy.firstWait / 60} working hours).</li>` + DATA.policy.steps.map(s => `<li>${s.label[0].toUpperCase() + s.label.slice(1)}${s.wait ? `, for ${s.wait / 60} working hours` : ', and stays until someone takes it'}.</li>`).join('');
$('#pby').textContent = `${DATA.policy.name}, set by ${P(DATA.policy.setBy).name}. Working hours are the team’s: ${DATA.teamHours.from}–${DATA.teamHours.to}, ${DATA.teamHours.days.map(d => DAYS[d]).join(' ')}. Taking it stops the climb; seeing it doesn’t.`;
const LABEL = { addressed: 'Named', cover: 'Cover', rota: 'On call', lead: 'Team lead', admin: 'Department admin' };
function rungs(id) {
  const r = route(id), out = [];
  const all = ['addressed', 'cover', 'rota', 'lead', 'admin'];
  for (const w of all) {
    const st = r.steps.find(s => s.who === w);
    if (!st) {
      const reached = r.steps.length && all.indexOf(r.steps[r.steps.length - 1].who) > all.indexOf(w);
      out.push({ w, cls: reached ? 'skip' : 'not', pp: reached ? `<span class="muted">not needed: nobody was away</span>` : w === 'admin' ? `${who(Object.keys(DATA.people).find(x => P(x).admin === 'department'))}<small>not reached</small>` : `<span class="muted">not reached</span>`, ck: '' });
      continue;
    }
    if (st.skipped) { out.push({ w, cls: 'skip', pp: `${who(st.people[0])}<small>skipped: ${st.skipped === 'asked' ? 'already asked' : st.skipped}</small>`, ck: '' }); continue; }
    const ds = r.deliveries.filter(d => st.people.includes(d.p) && (d.step === st.k || (st.k === 0 && d.step === 0)));
    const d = ds[0];
    const took = r.by && st.people.includes(r.by);
    out.push({ w, cls: took ? 'took' : '', d, pp: `${who(d.p)}<small>${P(d.p).role}</small>`,
      ck: `asked <b>${at(d.told)}</b><br>${d.seen != null ? `seen ${hhmm(d.seen)}` : 'not seen'}${d.passed != null ? ` · passed on ${hhmm(d.passed)}` : ''}${d.taken != null ? ` · <b>took it ${at(d.taken)}</b>` : ''}${d.acted != null ? `<br>${d.act.toLowerCase()} ${at(d.acted)}` : ''}${st.until && !took ? `<br>next step at ${at(st.until)}` : ''}` });
  }
  return { r, out };
}
function render() {
  const { r, out } = rungs(EX[cur]);
  $$('#tabs button').forEach((b, i) => b.setAttribute('aria-pressed', i === cur));
  $('#h').textContent = r.n.title;
  $('#lead').innerHTML = `${lvl(r.n)} ${A(r.n.app).name} · raised ${at(r.t)}${r.n.limit ? ` · limit ${at(tm(r.n.limit))}` : ''}`;
  $('#lad').innerHTML = out.map((o, i) => `<div class="rung ${o.cls}" data-i="${i}"><span class="st">Step ${i + 1}<b>${LABEL[o.w]}</b></span><span class="pp">${o.pp}</span><span class="ck">${o.ck}</span></div>`).join('') + `<span class="mark" id="mark"></span>`;
  Icons.hydrate(document.body);
  return out;
}
function markTo(i) { const el = $(`.rung[data-i="${i}"]`), lb = $('#lad').getBoundingClientRect(), b = el.getBoundingClientRect(); $('#mark').style.top = (b.top - lb.top + b.height / 2 - 6) + 'px'; $$('.rung').forEach(x => x.classList.toggle('now', x === el && !x.classList.contains('took'))); }
function play() {
  clearLater(); document.body.classList.add('pre'); const out = render();
  later(() => document.body.classList.remove('pre'), 60);
  const climb = out.map((o, i) => o.d ? i : -1).filter(i => i >= 0);
  requestAnimationFrame(() => markTo(climb[0]));
  climb.forEach((i, k) => later(() => markTo(i), 1200 + k * 650));
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { cur = +b.dataset.i; play(); } });
document.addEventListener('keydown', e => { if (commonKeys(e, play)) return; if (/^[12]$/.test(e.key)) { cur = +e.key - 1; play(); } });
Icons.hydrate(document.body); play();
</script></body></html>
