<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escalation · V5 The board</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--space-3);height:100%}
.hd{display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap}
.clock{margin-left:auto;font:300 var(--type-title-s)/1 var(--font-mono);color:var(--light);display:flex;align-items:baseline;gap:var(--space-3)}
.clock small{font-size:var(--type-small);color:var(--ink-muted)}
.scrub{display:flex;gap:2px;align-items:flex-end;height:var(--space-6)}
.scrub button{flex:1;min-width:0;height:var(--space-3);background:var(--surface-raised);border-radius:1px;position:relative}
.scrub button.w{height:var(--space-4);background:color-mix(in srgb,var(--slate) 85%,var(--green) 8%)}
.scrub button.day{border-left:1px solid var(--hairline-strong)}
.scrub button[aria-pressed="true"]{background:var(--x-proposed-lit);height:var(--space-5)}
.scrub button .d{position:absolute;bottom:calc(100% + 2px);left:0;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.board{background:var(--slate-deep);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4);overflow:auto;min-height:0}
table{border-collapse:collapse;width:100%;font-size:var(--type-meta);line-height:var(--leading-meta)}
th{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline-strong)}
td{padding:var(--space-2);border-bottom:1px solid var(--hairline);vertical-align:middle}
td.mono{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);white-space:nowrap}
td.flip{animation:flip var(--motion-base) var(--ease-out)}
@keyframes flip{from{opacity:0;transform:rotateX(70deg)}to{opacity:1;transform:none}}
.stt{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;padding:2px var(--space-2);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);white-space:nowrap}
.stt.taken{color:var(--x-proposed-lit);border-color:var(--x-proposed-lit)}
.stt.held{background:var(--x-proposed-held)}
.stt.late{color:var(--x-proposed-blocked);border-color:var(--x-proposed-blocked)}
.empty{color:var(--ink-muted);font-size:var(--type-meta);padding:var(--space-5) 0;text-align:center}
.foot{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <div class="hd"><p class="eyebrow">Escalation</p><h1 class="heading" id="h"></h1><span class="clock" id="clock"></span></div>
    <div class="scrub" id="scrub" role="group" aria-label="Move the clock"></div>
    <div class="board"><table><thead><tr><th>Item</th><th>App</th><th>With</th><th>Since</th><th>Next ask</th><th>At</th><th>State</th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="foot" id="foot"></p>
  </div></main>
</div>
<div class="x-cap"><b>Escalation · V5</b> the board: every open needs-you item on the team, who has it and who is asked next, when · departures boards, ward whiteboards, PagerDuty incident lists</div>
<script>/*@DATA@*/
/*@LIB@*/
const TEAM = DATA.teams[DATA.rota.team], members = new Set(TEAM.members.concat(Object.keys(DATA.people).filter(p => P(p).admin === 'department')));
let T = tm('Wed 12:30');
const STEPS = []; for (let d = 0; d < 5; d++) for (let h = 8; h < 18; h++) STEPS.push(d * DAY + h * 60 + 30);
$('#top').innerHTML = topHTML(['Estates repairs', 'Escalation board'], [['←→', 'hour'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
$('#h').textContent = `${TEAM.name}: what is waiting on someone`;
$('#scrub').innerHTML = STEPS.map((t, i) => `<button data-i="${i}" class="${inHours(TEAMH, t) ? 'w' : ''} ${t % DAY === 8 * 60 + 30 ? 'day' : ''}" title="${at(t)}">${t % DAY === 8 * 60 + 30 ? `<span class="d">${DAYS[dayOf(t)]}</span>` : ''}</button>`).join('');
/* the state of every needs item at time T, from its route */
function at_(t) {
  return ALL().filter(r => (r.cls === 'needs' || r.cls === 'urgent') && r.t <= t && r.deliveries.some(d => members.has(d.p)) && !(r.acted && r.acted.acted <= t)).map(r => {
    const asked = r.deliveries.filter(d => d.told <= t);
    const taken = r.resolved != null && r.resolved <= t;
    const withP = taken ? [r.by] : asked.filter(d => !(d.passed != null && d.passed <= t)).map(d => d.p);
    const since = taken ? r.resolved : asked.length ? Math.max(...asked.map(d => d.told)) : null;
    const nx = taken ? null : nextAsk(r, t);
    const heldD = r.deliveries.find(d => d.held && d.told > t && d.sent <= t);
    const late = !taken && r.n.limit && tm(r.n.limit) < t;
    return { r, withP, since, nx, taken, heldD, late };
  });
}
function render(flip) {
  $$('#scrub button').forEach(b => b.setAttribute('aria-pressed', STEPS[+b.dataset.i] === T));
  $('#clock').innerHTML = `${hhmm(T)}<small>${DATA.week.days[dayOf(T)]}</small>`;
  const rows = at_(T);
  $('#rows').innerHTML = rows.length ? rows.map(x => {
    const st = x.taken ? `<span class="stt taken">${I('hand', 12)}taken</span>` : x.heldD ? `<span class="stt held">held to ${at(x.heldD.told)}</span>` : x.late ? `<span class="stt late">past limit</span>` : `<span class="stt">open</span>`;
    const nx = x.nx ? `${who(x.nx.people[0], { first: true })}` : x.taken ? '—' : '<span class="muted">nobody else</span>';
    return `<tr><td>${x.r.n.title}</td><td>${appTag(x.r.n.app)}</td><td class="${flip ? 'flip' : ''}">${x.withP.map(p => who(p, { first: true })).join(', ') || (x.heldD ? who(x.heldD.p, { first: true }) : '')}</td><td class="mono">${x.since != null ? at(x.since) : '—'}</td><td class="${flip ? 'flip' : ''}">${nx}</td><td class="mono ${flip ? 'flip' : ''}">${x.nx ? at(x.nx.at) : ''}</td><td>${st}</td></tr>`;
  }).join('') : `<tr><td colspan="7" class="empty">Nothing is waiting on anyone at ${hhmm(T)}. Checked ${rows.length} items.</td></tr>`;
  $('#foot').innerHTML = `Anyone on ${TEAM.name} can open this board. It shows who has each item and who is asked next, never why someone hasn’t answered. Times come from ${P(DATA.policy.setBy).name}’s policy and the rota.`;
  Icons.hydrate(document.body);
}
function move(k) { const i = STEPS.indexOf(T); T = STEPS[Math.max(0, Math.min(STEPS.length - 1, i + k))]; render(true); }
$('#scrub').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { T = STEPS[+b.dataset.i]; render(true); } });
function play() { clearLater(); T = tm('Wed 09:30'); document.body.classList.add('pre'); render(false); later(() => document.body.classList.remove('pre'), 60); [1, 2, 3].forEach((k, i) => later(() => move(1), 1200 + i * 350)); }
document.addEventListener('keydown', e => { if (commonKeys(e, play)) return; if (e.key === 'ArrowRight') move(1); if (e.key === 'ArrowLeft') move(-1); });
Icons.hydrate(document.body); play();
</script></body></html>
