<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My switchboard · V1 The console</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,21rem);gap:var(--space-5);height:100%}
.hd{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-3)}
.board{padding:var(--space-4) var(--space-5);display:grid;grid-template-columns:minmax(0,10rem) repeat(8,minmax(0,1fr));gap:var(--space-2) var(--space-2);align-items:center}
.board .ch-h{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);text-align:center}
.board .ch-h svg{color:var(--ink)}
.board .cls{font-size:var(--type-body);line-height:var(--leading-body);color:var(--light);display:flex;flex-direction:column}
.board .cls small{font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.lamp{position:relative;display:flex;flex-direction:column;align-items:center;gap:var(--space-1);padding:var(--space-2) var(--space-1);border-radius:var(--radius-key);border:1px solid transparent;min-height:var(--target-md);justify-content:center}
.lamp:hover{border-color:var(--hairline)}
.lamp .b{width:var(--space-4);height:var(--space-4);border-radius:50%;border:1px solid var(--hairline-strong);background:var(--slate-deep);transition:background var(--motion-base),box-shadow var(--motion-base),border-color var(--motion-base)}
.lamp.on .b{background:var(--x-proposed-lit);border-color:var(--x-proposed-lit);box-shadow:0 0 var(--space-3) color-mix(in srgb,var(--green) 55%,transparent)}
.lamp.on.u .b{background:var(--danger);border-color:var(--danger);box-shadow:0 0 var(--space-3) color-mix(in srgb,var(--danger) 45%,transparent)}
.lamp .w{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.lamp.fixed{cursor:help}
.lamp.fixed .b::after{content:"";display:block}
.lamp.fixed .w{display:inline-flex;gap:2px;align-items:center}
.lamp.never .b{background:var(--x-proposed-unseen);border-style:dashed}
.lamp.dark .b{background:var(--slate-deep);box-shadow:none;border-color:var(--hairline-strong)}
.side{display:flex;flex-direction:column;gap:var(--space-3);min-height:0}
.side .pane{padding:var(--space-3) var(--space-4)}
.read p{font-size:var(--type-meta);line-height:var(--leading-meta);margin-top:var(--space-2)}
.read p b{font-weight:400;color:var(--light)}
.tal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);margin-top:var(--space-2)}
.tal b{font:400 var(--type-lead)/1 var(--font-mono);color:var(--light);text-align:right}
.why{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);min-height:calc(var(--leading-small) * 3)}
.hrs{display:flex;align-items:center;gap:var(--space-3);font-size:var(--type-meta);margin-top:var(--space-4);grid-column:1 / -1;padding-top:var(--space-3);border-top:1px solid var(--hairline)}
.hrs b{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light)}
@media (max-width:1400px){.board{grid-template-columns:minmax(0,8rem) repeat(8,minmax(0,1fr));padding:var(--space-3)}.wrap{grid-template-columns:minmax(0,1fr) minmax(0,17rem)}}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <section>
      <div class="hd"><p class="eyebrow">My switchboard</p><h1 class="heading" id="h"></h1></div>
      <div class="pane board" id="board"></div>
    </section>
    <aside class="side">
      <div class="pane read" id="read"></div>
      <div class="pane"><p class="eyebrow">Last week, on this board</p><div class="tal" id="tal"></div></div>
      <div class="pane"><p class="eyebrow">This lamp</p><p class="why" id="why">Point at a lamp to see what it does, and who decides it if you can’t.</p></div>
    </aside>
  </div></main>
</div>
<div class="x-cap"><b>My switchboard · V1</b> the console: a lamp for each class and channel; fixed lamps say who fixed them · cord switchboard, busy lamp field</div>
<script>/*@DATA@*/
/*@LIB@*/
const ME = DATA.me, p = P(ME);
const CH = ['letterbox', 'band', 'inbox', 'list', 'toast', 'email', 'digest', 'emaildigest'];
const CL = ['urgent', 'needs', 'first', 'record'];
/* fixed: on = always, never = can't. why says who decided */
const FIX = {
  urgent: { letterbox: ['on', 'Urgent always opens the Letterbox when you are in AUGUR. Set for every deployment.'], inbox: ['on', 'Urgent waits in your Inbox until someone takes it.'], list: ['on', 'Everything is kept in your list.'], band: ['on', 'Urgent always shows in the band.'], digest: ['never', 'Urgent never waits for an edition.'], emaildigest: ['never', 'Urgent never waits for an edition.'] },
  needs: { letterbox: ['never', 'Only urgent opens the Letterbox (PDR-009).'], inbox: ['on', 'Needs you always goes to your Inbox, with its limit.'], list: ['on', 'Everything is kept in your list.'], band: ['on', 'Needs you counts in the band’s words (ADR 0044).'], email: ['never', 'Email now is for urgent only, so nobody can be paged by an app at night.'], emaildigest: ['never', 'Open items are listed in your edition in AUGUR; email copies only list news.'] },
  first: { letterbox: ['never', 'Only urgent opens the Letterbox.'], inbox: ['never', 'Only needs you goes in the Inbox.'], list: ['on', 'Everything is kept in your list.'], email: ['never', 'Email now is for urgent only.'] },
  record: { letterbox: ['never', 'Only urgent opens the Letterbox.'], inbox: ['never', 'Only needs you goes in the Inbox.'], list: ['on', 'Everything is kept in your list.'], band: ['never', 'For the record never pulses: it waits for your edition. (A change to ADR 0044.)'], toast: ['never', 'For the record never toasts.'], email: ['never', 'Email now is for urgent only.'] }
};
/* the person's own lamps come from their settings */
const S = { toast: { needs: p.toasts.includes('needs'), first: p.toasts.includes('failed') || p.toasts.includes('done'), urgent: false }, email: { urgent: p.email.urgent }, digest: { first: false, needs: true, record: true }, emaildigest: { record: p.email.digest, first: p.email.digest }, band: { first: true } };
function state(c, ch) { const f = FIX[c][ch]; if (f) return f[0]; const v = (S[ch] || {})[c]; return v ? 'mine-on' : 'mine-off'; }
$('#top').innerHTML = topHTML(['My switchboard'], [['click', 'a lamp'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
$('#h').textContent = `${p.name}: how each kind of notice may reach you`;
function board() {
  $('#board').innerHTML = `<span></span>${CH.map(ch => `<span class="ch-h">${I(CHANNELS[ch].icon, 16)}${CHANNELS[ch].word}</span>`).join('')}` +
    CL.map(c => `<span class="cls">${CLASSES[c].word}<small>${CLASSES[c].post}</small></span>` + CH.map(ch => {
      const s = state(c, ch), on = s === 'on' || s === 'mine-on';
      return `<button class="lamp dark ${s === 'on' || s === 'never' ? 'fixed' : ''} ${s === 'never' ? 'never' : ''} ${c === 'urgent' ? 'u' : ''}" data-c="${c}" data-ch="${ch}" data-on="${on}" aria-pressed="${on}" aria-label="${CLASSES[c].word} by ${CHANNELS[ch].word}: ${on ? 'on' : 'off'}${s === 'on' || s === 'never' ? ', fixed' : ''}"><span class="b"></span><span class="w">${s === 'on' ? I('lock', 10) + 'always' : s === 'never' ? I('lock', 10) + 'never' : on ? 'on' : 'off'}</span></button>`;
    }).join('')).join('') +
    `<div class="hrs">${I('sun', 16)} Live from <b>${p.hours.from}</b> to <b>${p.hours.to}</b>, ${p.hours.days.map(d => DAYS[d]).join(' ')} ${I('moon', 16)} quiet otherwise · editions at <b>${p.digest}</b> · muted: <b>${p.muted.length ? p.muted.map(a => A(a).name).join(', ') : 'nothing'}</b></div>`;
}
function readout() {
  const tonight = c => ({ urgent: S.email.urgent ? 'emails you, and opens the Letterbox when you come in' : 'waits in the Letterbox until you come in', needs: 'waits for ' + p.hours.from + ', in your Inbox', first: 'waits for ' + p.hours.from, record: S.digest.record ? `goes into your ${p.digest} edition` : 'goes into your list only' })[c];
  $('#read').innerHTML = `<p class="eyebrow">Tonight, after ${p.hours.to}</p>${CL.map(c => `<p><b>${CLASSES[c].word}</b> ${tonight(c)}.</p>`).join('')}`;
  const res = whatIf(D => { D.people[ME].toasts = [S.toast.needs ? 'needs' : null, S.toast.first ? 'failed' : null, S.toast.first ? 'done' : null].filter(Boolean); D.people[ME].email.urgent = S.email.urgent; D.people[ME].email.digest = S.emaildigest.record; }, () => {
    const ds = forPerson(ME); return { live: ds.filter(d => d.ch.includes('band') && !d.held).length, toasts: ds.filter(d => d.ch.includes('toast')).length, held: ds.filter(d => d.held).length, ed: ds.filter(d => d.rule === 'record').length, email: ds.filter(d => d.ch.includes('email') || d.ch.includes('emaildigest')).length };
  });
  $('#tal').innerHTML = `<b>${res.live}</b><span>pulsed the band while you worked</span><b>${res.toasts}</b><span>also showed a toast</span><b>${res.held}</b><span>waited for your morning</span><b>${res.ed}</b><span>went into an edition</span><b>${res.email}</b><span>reached you by email</span>`;
}
$('#board').addEventListener('click', e => {
  const b = e.target.closest('.lamp'); if (!b || b.classList.contains('fixed')) return;
  const c = b.dataset.c, ch = b.dataset.ch; S[ch] = S[ch] || {}; S[ch][c] = !S[ch][c];
  board(); light(true); readout(); Icons.hydrate(document.body);
});
$('#board').addEventListener('mouseover', e => {
  const b = e.target.closest('.lamp'); if (!b) return; const c = b.dataset.c, ch = b.dataset.ch, f = FIX[c][ch];
  $('#why').innerHTML = `<b style="color:var(--light);font-weight:400">${CLASSES[c].word} · ${CHANNELS[ch].word}</b><br>${f ? f[1] : `Yours to choose. ${b.dataset.on === 'true' ? 'On' : 'Off'} now; click to change.`}`;
});
function light(all) { $$('.lamp').forEach(l => l.classList.toggle('on', all && l.dataset.on === 'true')); $$('.lamp').forEach(l => l.classList.toggle('dark', !(all && l.dataset.on === 'true'))); }
function play() {
  clearLater(); document.body.classList.add('pre'); board(); readout(); Icons.hydrate(document.body);
  later(() => document.body.classList.remove('pre'), 60);
  CL.forEach((c, i) => later(() => $$(`.lamp[data-c="${c}"]`).forEach(l => { const on = l.dataset.on === 'true'; l.classList.toggle('on', on); l.classList.toggle('dark', !on); }), 1200 + i * 220));
}
document.addEventListener('keydown', e => commonKeys(e, play));
Icons.hydrate(document.body); play();
</script></body></html>
