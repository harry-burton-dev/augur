<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My switchboard · V4 Away and cover</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-6);height:100%}
.set{display:flex;flex-direction:column;gap:var(--space-3);min-height:0;overflow:auto}
.f{display:grid;grid-template-columns:8rem minmax(0,1fr);gap:var(--space-2) var(--space-4);font-size:var(--type-meta);line-height:var(--leading-meta);align-items:baseline}
.f dt{color:var(--ink-muted)}
.f dd{margin:0;color:var(--ink)}
.f dd b{font-weight:400;color:var(--light)}
.ok{display:inline-flex;align-items:center;gap:var(--space-1);color:var(--x-proposed-lit);font-size:var(--type-small)}
.routes{display:grid;gap:var(--space-2)}
.routes .r{display:grid;grid-template-columns:9rem minmax(0,1fr) auto;gap:var(--space-3);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta);align-items:center}
.routes .r .k{color:var(--light)}
.routes .r .n{font:400 var(--type-lead)/1 var(--font-mono);color:var(--light)}
.warn{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-left:2px solid var(--hairline-strong);padding-left:var(--space-3)}
.card{position:relative;padding:var(--space-5);background:linear-gradient(170deg,var(--surface-raised),var(--surface-inset));border:1px solid var(--hairline-strong);border-radius:var(--radius-key);display:flex;flex-direction:column;gap:var(--space-3);min-height:0;overflow:auto;box-shadow:var(--shadow-raised)}
.card .ttl{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.card .sub{font-size:var(--type-meta);color:var(--ink-muted)}
.grp h3{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:var(--space-2) 0 var(--space-1);display:flex;gap:var(--space-2);align-items:center}
.grp ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-1)}
.grp li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);padding:var(--space-1) 0;border-bottom:1px solid var(--hairline)}
.grp li small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.grp li .t{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);white-space:nowrap}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <section class="set">
      <div><p class="eyebrow">My switchboard · Away</p><h1 class="heading" id="h"></h1></div>
      <dl class="f" id="f"></dl>
      <p class="eyebrow" style="margin-top:var(--space-2)">While you were away, last week</p>
      <div class="routes" id="routes"></div>
      <p class="warn" id="warn"></p>
    </section>
    <section class="card" id="card" aria-label="While you were out"></section>
  </div></main>
</div>
<div class="x-cap"><b>My switchboard · V4</b> away is redirection: needs you goes to a cover who said yes; the rest waits on a card · Royal Mail redirection, “while you were out” cards, handover</div>
<script>/*@DATA@*/
/*@LIB@*/
const WHO = 'p4', p = P(WHO), a = p.away, cv = P(a.cover);
const back = backAt(WHO);
$('#top').innerHTML = topHTML(['My switchboard', 'Away'], [['R', 'replay'], ['T', 'technical words', 'h-t']]);
$('#h').textContent = `${p.name}, away ${dayLong(tm(a.from))} to ${dayLong(tm(a.to))}`;
$('#f').innerHTML = `<dt>Note</dt><dd>${a.note}</dd><dt>From</dt><dd><b>${at(tm(a.from))}</b> <span class="muted">(set ${a.set})</span></dd><dt>Back</dt><dd><b>${dayLong(back)}, ${hhmm(back)}</b>, your first working hour</dd>
  <dt>Cover</dt><dd>${who(a.cover)} <span class="ok">${I('check', 12)} said yes, ${a.coverAccepted}</span><span class="tk">cover must accept before away starts; until then needs you would go to the policy</span></dd>
  <dt>Urgent</dt><dd>${p.email.urgent ? 'Emails you' : 'Never reaches you while away.'} ${DATA.rota.byDay.includes(WHO) ? '' : `You aren’t on ${DATA.rota.name} this week, so urgent goes to whoever is.`}</dd>`;
const ds = forPerson(WHO), aw = ds.filter(d => d.rule === 'away');
const redirected = ALL().filter(r => r.deliveries.some(d => d.via === 'cover' && d.coverFor === WHO));
const coverOf = r => r.deliveries.find(d => d.via === 'cover' && d.coverFor === WHO);
const covered = redirected.filter(r => r.by === a.cover);
const before = ALL().filter(r => r.cls === 'needs' && r.resolved != null && r.by !== a.cover && r.deliveries.some(d => d.p === WHO) && !covered.includes(r));
const R = [
  ['Needs you', `went to ${first(cv.name)}`, redirected.length, 'plane'],
  ['Taken by your cover', `${first(cv.name)} took it`, covered.length, 'user-check'],
  ['Finished by others', 'the policy asked the next person', before.length, 'users'],
  ['Tell me', 'waits on your card', aw.filter(d => classOf(d.n) === 'first').length, 'sticky-note'],
  ['For the record', 'waits on your card', aw.filter(d => classOf(d.n) === 'record').length, 'newspaper'],
  ['Urgent', 'went to whoever was on call', ALL().filter(r => r.cls === 'urgent' && r.deliveries.some(d => d.via === 'rota')).length, 'siren']
];
$('#routes').innerHTML = R.map(([k, w, n, ic], i) => `<div class="r dep" style="--i:${i}"><span class="k">${I(ic, 14)} ${k}</span><span class="muted">${w}</span><span class="n">${n}</span></div>`).join('');
const clash = DATA.rota.byDay.map((pid, d) => ({ pid, d })).filter(x => x.pid === a.cover && x.d >= dayOf(tm(a.from)) && x.d < dayOf(tm(a.to)));
$('#warn').innerHTML = clash.length ? `${cv.name} is also on call on ${clash.map(x => DAYS[x.d]).join(', ')}. Both will reach her.` : `${first(cv.name)} isn’t on call while you’re away, so covering doesn’t stack on top of the rota. AUGUR checks this when you pick a cover.`;
/* the card: what waits for Owen on his first morning back */
function card() {
  const took = covered.map(r => ({ r, d: coverOf(r) }));
  const g = [
    ['user-check', `${first(cv.name)} covered`, took.map(({ r, d }) => `<li><span>${r.n.title}<small>${d.act ? `${d.act} by ${first(cv.name)}` : 'taken by ' + first(cv.name)}, ${at(d.acted ?? d.taken)}</small></span><span class="t">${at(r.t)}</span></li>`)],
    ['users', 'Finished by others', before.map(r => `<li><span>${r.n.title}<small>${r.acted ? `${r.acted.act} by ${P(r.acted.p).name}, ${at(r.acted.acted)}` : `${P(r.by).name} has it`}</small></span><span class="t">${at(r.t)}</span></li>`)],
    ['sticky-note', 'Waiting for you', aw.filter(d => classOf(d.n) !== 'record' && !d.coverTo).map(d => `<li><span>${d.n.title}<small>${appTag(d.n.app)}</small></span><span class="t">${at(d.sent)}</span></li>`)],
    ['newspaper', 'For the record', aw.filter(d => classOf(d.n) === 'record').map(d => `<li><span>${d.n.title}</span><span class="t">${at(d.sent)}</span></li>`)]
  ];
  $('#card').innerHTML = `<p class="eyebrow">${DATA.week.next} · ${hhmm(back)}</p><p class="ttl">While you were out</p><p class="sub">Welcome back, ${first(p.name)}. ${took.length + before.length} things were dealt with; ${aw.filter(d => classOf(d.n) !== 'record' && !d.coverTo).length} wait for you.</p>` +
    g.filter(x => x[2].length).map(([ic, h, li], i) => `<div class="grp dep" style="--i:${4 + i * 2}"><h3>${I(ic, 14)}${h}</h3><ul>${li.join('')}</ul></div>`).join('');
}
function play() { clearLater(); document.body.classList.add('pre'); card(); Icons.hydrate(document.body); later(() => document.body.classList.remove('pre'), 1200); }
document.addEventListener('keydown', e => commonKeys(e, play));
Icons.hydrate(document.body); play();
</script></body></html>
