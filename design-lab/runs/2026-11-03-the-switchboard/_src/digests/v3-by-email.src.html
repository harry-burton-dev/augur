<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digests · V3 By email</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,22rem);gap:var(--space-5);height:100%}
.client{display:grid;grid-template-rows:auto minmax(0,1fr);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);overflow:hidden;background:var(--slate-deep)}
.hdr{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--hairline);display:grid;grid-template-columns:5rem minmax(0,1fr);gap:var(--space-1) var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta)}
.hdr dt{color:var(--ink-muted)}
.hdr dd{margin:0;color:var(--ink)}
.hdr .subj{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.body{overflow:auto;padding:var(--space-5) var(--space-6);background:linear-gradient(var(--surface-inset),transparent)}
.mail{max-width:var(--measure-read);margin:0 auto;font-size:var(--type-body);line-height:var(--leading-body)}
.mail .brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin-bottom:var(--space-4)}
.mail h2{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:var(--space-4) 0 var(--space-2);border-bottom:1px solid var(--hairline);padding-bottom:var(--space-1)}
.mail .it{display:flex;justify-content:space-between;gap:var(--space-4);padding:var(--space-1) 0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.mail .it a{color:var(--info);white-space:nowrap}
.mail .it small{display:block;color:var(--ink-muted);font-size:var(--type-small)}
.mail .fine{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:var(--space-5);border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.side{display:flex;flex-direction:column;gap:var(--space-3)}
.side .pane{padding:var(--space-3) var(--space-4)}
.side ul{list-style:none;margin:var(--space-2) 0 0;padding:0;display:grid;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.side li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2)}
.side li svg{color:var(--ink-muted);margin-top:2px}
.off .client{opacity:.4;filter:saturate(.3)}
.relay{display:none;font-size:var(--type-meta);line-height:var(--leading-meta)}
.off .relay{display:block}
.relay b{font-weight:400;color:var(--x-proposed-blocked)}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <section class="client" id="client"></section>
    <aside class="side">
      <div class="pane relay" id="relay"></div>
      <div class="pane"><p class="eyebrow">What the email leaves out</p><ul id="out"></ul></div>
      <div class="pane"><p class="eyebrow">Same edition, two copies</p><p class="meta" style="margin-top:var(--space-2)" id="same"></p></div>
    </aside>
  </div></main>
</div>
<div class="x-cap"><b>Digests · V3</b> by email: the same edition through the organisation’s relay, titles and links only · ADR 0035 relay, plain-text newsletters</div>
<script>/*@DATA@*/
/*@LIB@*/
const WHO = Object.keys(DATA.people).find(p => P(p).email.digest && P(p).team), T = tm('Thu ' + P(WHO).digest), E = edition(WHO, T), p = P(WHO);
$('#top').innerHTML = topHTML(['My switchboard', 'Emailed edition'], [['E', 'relay off'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
const n = E.open.length;
const subj = n ? `${n} ${n === 1 ? 'thing waits' : 'things wait'} for you · ${DATA.week.days[dayOf(T)]}` : `Nothing waits for you · ${DATA.week.days[dayOf(T)]}`;
const link = `<a href="#" onclick="return false">Open in AUGUR</a>`;
$('#client').innerHTML = `<dl class="hdr"><dt>From</dt><dd>${DATA.relay.from} &lt;${DATA.relay.address}&gt;</dd><dt>To</dt><dd>${p.name}</dd><dt>Sent</dt><dd>${at(T)}</dd><dt>Subject</dt><dd class="subj">${subj}</dd></dl>
  <div class="body"><div class="mail"><p class="brand">AUGUR · ${DATA.org}</p><p>Good morning, ${first(p.name)}. Here is your edition since ${at(E.since)}.</p>
  <h2>Waiting on you</h2>${E.open.map(r => `<div class="it"><span>${r.n.title}<small>${A(r.n.app).name}${r.n.limit ? ` · limit ${at(tm(r.n.limit))}` : ''}</small></span>${link}</div>`).join('') || '<p>Nothing.</p>'}
  <h2>For the record</h2>${[...E.record, ...E.quietList].map(d => `<div class="it"><span>${d.n.title}<small>${A(d.n.app).name}</small></span>${link}</div>`).join('') || '<p>Nothing.</p>'}
  <h2>Today</h2><p class="it">${E.onCall ? 'You are on call.' : `${P(DATA.rota.byDay[dayOf(T)]).name} is on call.`} ${E.away.map(a => `${P(a).name} is away; ${P(P(a).away.cover).name} covers.`).join(' ')}</p>
  <p class="fine">You can’t act on anything from this email: open AUGUR to take, pass on or answer. You get this because you chose an emailed edition in My switchboard; turn it off there. Sent by ${DATA.org} through its own mail server.<span class="tk"> relay: ADR 0035 · template follows the sign-in theme (ADR 0041)</span></p></div></div>`;
$('#out').innerHTML = [['file-text', 'Details and records. Only titles and links travel; the rest stays behind sign-in.'], ['hand', 'Actions. “I have it” and “Pass it on” only work in AUGUR, where who pressed them is known.'], ['lock', 'Anything you can’t open in AUGUR is never in the email, not even its title.'], ['siren', 'Urgent. It never waits for an edition; it is emailed on its own, at once.']].map(([i, w]) => `<li>${I(i, 16)}<span>${w}</span></li>`).join('');
$('#same').textContent = `It is the ${hhmm(T)} edition ${first(p.name)} also sees on Home. Reading one marks nothing in the other: only opening an item in AUGUR counts as seen.`;
$('#relay').innerHTML = `<p class="eyebrow">If the relay is off</p><p style="margin-top:var(--space-2)"><b>Email isn’t set up on this server.</b> The edition stays on Home, and My switchboard shows the emailed edition as unavailable: “Ask ${P(Object.keys(DATA.people).find(x => (P(x).roles || []).includes('deployment-admin'))).name} to set up email (Admin, Status).”</p>`;
$$('.mail > *').forEach((x, i) => { x.classList.add('dep'); x.style.setProperty('--i', i); });
function play() { clearLater(); document.body.classList.add('pre'); document.body.classList.remove('off'); later(() => document.body.classList.remove('pre'), 1200); }
document.addEventListener('keydown', e => { if (commonKeys(e, play)) return; if (e.key.toLowerCase() === 'e') document.body.classList.toggle('off'); });
Icons.hydrate(document.body); play();
</script></body></html>
