<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digests · V6 The team bulletin</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-3);height:100%}
.hd{display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap}
.hd .r{margin-left:auto;font-size:var(--type-small);color:var(--ink-muted)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:min-content;gap:var(--space-3);overflow:auto;min-height:0;align-content:start}
.card{padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-top:2px solid var(--floor-team-high);border-radius:var(--radius-key);background:var(--surface-inset);display:flex;flex-direction:column;gap:var(--space-2)}
.card.w2{grid-column:span 2}
.card h2{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.card .big{font:200 var(--type-title)/1 var(--font-mono);color:var(--light)}
.card p{font-size:var(--type-meta);line-height:var(--leading-meta)}
.card p small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.card .row{display:flex;gap:var(--space-4);flex-wrap:wrap}
.card .row div{display:flex;flex-direction:column}
.card .row b{font:300 var(--type-heading)/1 var(--font-mono);color:var(--light)}
.card .row span{font-size:var(--type-small);color:var(--ink-muted)}
.path{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted)}
.rota{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;font-size:var(--type-small);text-align:center}
.rota span{padding:var(--space-1) 0;background:var(--surface-raised);border-radius:2px}
.rota b{display:block;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.card.warn{border-top-color:var(--x-proposed-blocked)}
.pin{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.unpinned .pin{opacity:0;transform:translateY(calc(var(--space-3) * -1)) rotate(-1deg)}
</style></head><body class="pre unpinned">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <div class="hd"><p class="eyebrow">Team bulletin</p><h1 class="heading" id="h"></h1><span class="r" id="r"></span></div>
    <div class="board" id="board"></div>
  </div></main>
</div>
<div class="x-cap"><b>Digests · V6</b> the team bulletin: one shared Friday edition for the whole team, no one’s settings in it · ward noticeboards, parish newsletters, shift handover boards</div>
<script>/*@DATA@*/
/*@LIB@*/
const TEAM = DATA.teams[DATA.rota.team], T = tm('Fri 16:00'), team = new Set(TEAM.members);
$('#top').innerHTML = topHTML([TEAM.name, 'Bulletin'], [['R', 'replay'], ['T', 'technical words', 'h-t']]);
$('#h').textContent = `${TEAM.name}, the week of notices`;
$('#r').textContent = `for everyone on ${TEAM.name} · ${at(T)} · nobody’s hours, mutes or editions appear here`;
const rs = ALL().filter(r => r.t <= T && r.deliveries.some(d => team.has(d.p)));
const byCls = c => rs.filter(r => r.cls === c).length;
const climbed = rs.filter(r => r.deliveries.some(d => (d.via === 'escalation' || d.via === 'cover') && d.told <= T));
const open = rs.filter(r => (r.cls === 'needs') && !(r.acted && r.acted.acted <= T));
const blocked = ALL().filter(r => r.t <= T && r.blocked && r.n.to.team && DATA.teams[r.n.to.team].members.some(m => team.has(m)));
const nextAway = TEAM.members.filter(p => P(p).away && tm(P(p).away.to) > WEEK_END);
const back = TEAM.members.filter(p => P(p).away && tm(P(p).away.to) <= WEEK_END + DAY);
const cards = [
  `<div class="card"><h2>Asked of the team</h2><span class="big">${rs.length}</span><div class="row"><div><b>${byCls('needs')}</b><span>needs you</span></div><div><b>${byCls('first')}</b><span>tell me</span></div><div><b>${byCls('record')}</b><span>for the record</span></div></div></div>`,
  `<div class="card"><h2>Handed on</h2><span class="big">${climbed.length}</span><p>${climbed.length} needed someone other than the first person asked, and got one.<small>Seen ≠ taken: the trail is on each item.</small></p></div>`,
  `<div class="card w2"><h2>Who stepped in</h2>${climbed.map(r => `<p>${r.n.title}<small>${r.acted && r.acted.acted <= T ? `${r.acted.act} by ${P(r.acted.p).name}` : 'still open'}</small></p><p class="path">${r.deliveries.filter(d => d.told <= T).map(d => `${who(d.p, { first: true })} ${d.via === 'cover' ? '(cover)' : d.via === 'escalation' ? '(next)' : ''}`).join(I('chevron-right', 12))}</p>`).join('')}</div>`,
  `<div class="card w2"><h2>Carried into next week</h2>${open.map(r => { const d = r.deliveries[0]; return `<p>${r.n.title}<small>with ${P(d.p).name}${d.held ? `, from ${dayLong(d.told)} ${hhmm(d.told)}` : ''}</small></p>`; }).join('') || '<p>Nothing.</p>'}</div>`,
  `<div class="card w2"><h2>Next week’s rota</h2><div class="rota">${DATA.rota.byDay.map((p, i) => `<span><b>${DAYS[i]}</b>${first(P(p).name)}</span>`).join('')}</div><p><small>${DATA.rota.name}, kept by ${P(DATA.rota.setBy).name}.${back.length ? ` ${back.map(p => P(p).name).join(', ')} back ${DATA.week.next}.` : ''}${nextAway.length ? ` Away: ${nextAway.map(p => P(p).name).join(', ')}.` : ''}</small></p></div>`,
  blocked.length ? `<div class="card w2 warn"><h2>Meant for us, never sent</h2><p>${blocked.length} × “${blocked[0].n.title}”<small>${blocked[0].blocked.why}</small></p></div>` : '',
  `<div class="card w2"><h2>The rules this week</h2><p>Needs you: ${['the person named', ...DATA.policy.steps.map(s => s.label + (s.wait ? ` (${s.wait / 60} working hours)` : ''))].join(', then ')}.<small>${DATA.policy.name}, set by ${P(DATA.policy.setBy).name}. Unchanged this week.</small></p></div>`
].filter(Boolean);
$('#board').innerHTML = cards.map((c, i) => c.replace('class="card', `style="transition-delay:calc(${i} * var(--motion-instant))" class="pin card`)).join('');
function play() { clearLater(); document.body.classList.add('pre', 'unpinned'); later(() => document.body.classList.remove('pre'), 60); later(() => document.body.classList.remove('unpinned'), 1200); }
document.addEventListener('keydown', e => commonKeys(e, play));
Icons.hydrate(document.body); play();
</script></body></html>
