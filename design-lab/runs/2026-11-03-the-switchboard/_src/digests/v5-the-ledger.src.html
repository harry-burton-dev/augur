<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digests · V5 The ledger</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.paper{max-width:var(--measure-wide);margin:0 auto;height:100%;display:flex;flex-direction:column;gap:var(--space-3)}
.hd{display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap;border-bottom:1px solid var(--hairline-strong);padding-bottom:var(--space-2)}
.hd .r{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.tabs{display:flex;gap:var(--space-1);flex-wrap:wrap}
.tabs button{font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);padding:var(--space-1) var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink-muted)}
.tabs button[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--light)}
.led{display:grid;grid-template-columns:minmax(0,1fr) 3.5rem;font-size:var(--type-meta);line-height:var(--leading-meta);overflow:auto;min-height:0}
.led .sec{grid-column:1 / -1;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding:var(--space-3) 0 var(--space-1);border-bottom:1px solid var(--hairline-strong)}
.led .l{padding:var(--space-1) 0;border-bottom:1px dotted var(--hairline);display:flex;gap:var(--space-2);align-items:baseline;min-width:0}
.led .l small{color:var(--ink-muted);font-size:var(--type-small);white-space:nowrap}
.led .c{padding:var(--space-1) 0;border-bottom:1px dotted var(--hairline);text-align:right;font:400 var(--type-meta)/var(--leading-meta) var(--font-mono);color:var(--light)}
.led .zero .c,.led .zero.l{color:var(--ink-muted)}
.led .zero.l::before{content:"";display:inline-block;width:var(--space-3);height:var(--space-3);border:1px dashed var(--ink-muted);border-radius:1px;flex:none;align-self:center}
.led .item.l{padding-left:var(--space-5);color:var(--ink)}
.led .tot{font-weight:400;color:var(--light);border-bottom:3px double var(--hairline-strong)}
.led .tot.c{border-bottom:3px double var(--hairline-strong)}
.fill .c,.fill .l{animation:none}
.ledrow{opacity:0;transition:opacity var(--motion-base)}
.ledrow.in{opacity:1}
.foot{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><article class="paper">
    <div class="hd"><p class="eyebrow">Edition</p><h1 class="heading" id="h"></h1><span class="r" id="r"></span></div>
    <div class="tabs" id="tabs"></div>
    <div class="led" id="led"></div>
    <p class="foot" id="foot"></p>
  </article></main>
</div>
<div class="x-cap"><b>Digests · V5</b> the ledger: an edition as counted lines, with every quiet source entered as zero · double-entry ledgers, the shipping forecast’s fixed order, “nothing to report”</div>
<script>/*@DATA@*/
/*@LIB@*/
const WHO = 'p3', p = P(WHO);
const days = p.hours.days.map(d => d * DAY + mins(p.digest));
let T = days[2];
$('#top').innerHTML = topHTML(['Home', 'Editions', 'Ledger'], [['←→', 'another day'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
function render() {
  const E = edition(WHO, T);
  $$('#tabs button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.t === T));
  $('#h').textContent = `${p.name} · ${dayLong(T)}`;
  $('#r').textContent = `since ${at(E.since)} · ${hhmm(T)}`;
  const rows = [];
  const sec = w => rows.push(`<span class="sec ledrow">${w}</span>`);
  const line = (w, n, cls = '', sm = '') => rows.push(`<span class="l ledrow ${cls} ${n === 0 ? 'zero' : ''}">${w}${sm ? `<small>${sm}</small>` : ''}</span><span class="c ledrow ${cls} ${n === 0 ? 'zero' : ''}">${n}</span>`);
  sec('Waiting on you'); line('Needs you, open', E.open.length); E.open.forEach(r => line(r.n.title, '', 'item', A(r.n.app).name));
  sec('Since your last edition, by app');
  Object.keys(DATA.apps).forEach(a => {
    const ds = forPerson(WHO).filter(d => d.n.app === a && d.sent > E.since && d.sent <= T);
    line(A(a).name, ds.length, '', ds.length ? '' : 'checked, nothing for you');
    ds.forEach(d => line(d.n.title, '', 'item', [...new Set([CLASSES[classOf(d.n)].word, RULES[d.rule].word])].join(' · ').toLowerCase()));
  });
  sec('Today');
  line('You are on call', E.onCall ? 1 : 0, '', E.onCall ? DATA.rota.name : 'not today');
  line('You cover someone', E.covering.length, '', E.covering.map(x => `${P(x).name}, until ${dayLong(backAt(x))}`).join('') || 'nobody');
  const total = E.open.length + forPerson(WHO).filter(d => d.sent > E.since && d.sent <= T).length;
  rows.push(`<span class="l ledrow tot">Entries</span><span class="c ledrow tot">${total}</span>`);
  $('#led').innerHTML = rows.join('');
  $('#foot').innerHTML = `Every source is entered every day, even at zero, so “nothing from Upgrade Centre” means it was checked, not that it broke. About ${readSecs($('#led').innerHTML)} seconds to read.`;
}
$('#tabs').innerHTML = days.map(t => `<button data-t="${t}">${dayName(t)} ${hhmm(t)}</button>`).join('');
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { T = +b.dataset.t; render(); $$('.ledrow').forEach(x => x.classList.add('in')); } });
function play() { clearLater(); document.body.classList.add('pre'); T = days[2]; render(); later(() => document.body.classList.remove('pre'), 60); $$('.ledrow').forEach((x, i) => later(() => x.classList.add('in'), 1200 + i * 25)); }
document.addEventListener('keydown', e => { if (commonKeys(e, play)) return; const i = days.indexOf(T); if (e.key === 'ArrowRight' && i < days.length - 1) { T = days[i + 1]; render(); $$('.ledrow').forEach(x => x.classList.add('in')); } if (e.key === 'ArrowLeft' && i > 0) { T = days[i - 1]; render(); $$('.ledrow').forEach(x => x.classList.add('in')); } });
Icons.hydrate(document.body); play();
</script></body></html>
