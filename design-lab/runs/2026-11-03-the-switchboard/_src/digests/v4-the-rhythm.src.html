<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digests · V4 The rhythm</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,22rem);gap:var(--space-5);height:100%}
.grid{display:grid;grid-template-columns:9rem minmax(0,1fr);row-gap:var(--space-2);align-content:start}
.lab{font-size:var(--type-meta);display:flex;flex-direction:column;justify-content:center}
.lab small{font-size:var(--type-small);color:var(--ink-muted)}
.lane{position:relative;height:var(--target-md);background:color-mix(in srgb,var(--slate-deep) 50%,transparent);border-radius:var(--radius-key)}
.lane .dl{position:absolute;top:0;bottom:0;width:1px;background:var(--hairline)}
.ed{position:absolute;top:50%;transform:translate(-50%,-50%) scale(0);border-radius:50%;background:var(--info);border:1px solid var(--info);opacity:.85;transition:transform var(--motion-base) var(--ease-spring);cursor:pointer}
.ed.in{transform:translate(-50%,-50%) scale(1)}
.ed.empty{background:none;border-style:dashed;border-color:var(--ink-muted)}
.ed.week{background:none;border:2px solid var(--info);border-radius:2px}
.ed.away{background:var(--x-proposed-held);border-color:var(--ink-muted)}
.ed[aria-pressed="true"]{box-shadow:0 0 0 2px var(--slate-deep),0 0 0 3px var(--focus)}
.sp{position:absolute;top:var(--space-1);bottom:var(--space-1);width:2px;background:var(--danger);opacity:0;transition:opacity var(--motion-base)}
.sp.in{opacity:1}
.axis{grid-column:2;position:relative;height:var(--space-4);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.axis span{position:absolute}
.leg{grid-column:1 / -1;display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);margin-top:var(--space-3);align-items:center}
.leg i{display:inline-block;width:var(--space-3);height:var(--space-3);border-radius:50%;margin-right:var(--space-1);vertical-align:-1px}
.peek{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);align-self:start}
.peek h2{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.peek .brief{font-size:var(--type-meta);line-height:var(--leading-meta);padding:var(--space-1) 0;border-bottom:1px solid var(--hairline)}
.peek .brief small{display:block;font-size:var(--type-small);color:var(--ink-muted)}
.peek h3{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-top:var(--space-2)}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <section><p class="eyebrow">Editions</p><h1 class="heading" style="margin-bottom:var(--space-3)">The rhythm of a week: when each person’s news arrives</h1><div class="grid" id="grid"></div></section>
    <aside class="pane peek" id="peek" aria-live="polite"></aside>
  </div></main>
</div>
<div class="x-cap"><b>Digests · V4</b> the rhythm: an edition at each person’s start, a weekly for the lead, urgent the only stop press · newspaper editions, shipping forecast times</div>
<script>/*@DATA@*/
/*@LIB@*/
const TEAM = DATA.teams[DATA.rota.team], PEOPLE = [...TEAM.members];
const pct = t => (t / WEEK_END * 100).toFixed(3) + '%';
const WEEKLY = tm('Fri 16:00');
$('#top').innerHTML = topHTML(['Home', 'Editions', 'Rhythm'], [['click', 'an edition'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
const eds = [];
PEOPLE.forEach(p => { const h = H(p), em = mins(P(p).digest); for (let d = 0; d < 7; d++) if (h.days.includes(d)) { const t = d * DAY + em, E = edition(p, t); const n = E.record.length + E.overnight.length + E.open.length + E.quietList.length; eds.push({ p, t, E, n, away: awayAt(p, t) }); } });
let sel = eds.find(e => e.p === 'p3' && dayOf(e.t) === 2) || eds[0];
let html = '';
PEOPLE.forEach(p => {
  html += `<div class="lab">${who(p)}<small>${P(p).digest} · ${P(p).email.digest ? 'also by email' : 'on Home'}</small></div><div class="lane">${[1, 2, 3, 4, 5, 6].map(d => `<span class="dl" style="left:${pct(d * DAY)}"></span>`).join('')}`;
  eds.filter(e => e.p === p).forEach((e, i) => { const sz = `calc(var(--space-3) + ${e.away ? 0 : e.n} * var(--space-1))`; html += `<button class="ed ${e.away ? 'away' : e.n ? '' : 'empty'}" data-k="${p}-${e.t}" style="left:${pct(e.t)};width:${sz};height:${sz}" aria-label="${P(p).name}, ${at(e.t)}: ${e.away ? 'away, held for the card' : e.n + ' items'}"></button>`; });
  if (p === TEAM.lead) html += `<button class="ed week" data-k="weekly" style="left:${pct(WEEKLY)};width:var(--space-4);height:var(--space-4)" aria-label="The weekly, ${at(WEEKLY)}"></button>`;
  forPerson(p).filter(d => d.rule === 'urgent').forEach(d => { html += `<span class="sp" style="left:${pct(d.told)}" title="stop press: ${d.n.title}, ${at(d.told)}"></span>`; });
  html += `</div>`;
});
html += `<div class="axis">${DATA.week.days.map((d, i) => `<span style="left:${pct(i * DAY)}">${d}</span>`).join('')}</div>`;
html += `<div class="leg"><span><i style="background:var(--info)"></i>an edition, sized by what’s in it</span><span><i style="border:1px dashed var(--ink-muted)"></i>nothing to say, and it says so</span><span><i style="border:2px solid var(--info);border-radius:2px"></i>the weekly (team lead)</span><span><i style="background:var(--danger);width:2px;border-radius:0"></i>stop press: urgent, the only thing that breaks the rhythm</span></div>`;
$('#grid').innerHTML = html;
function peek(k) {
  $$('.ed').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  if (k === 'weekly') { $('#peek').innerHTML = `<p class="eyebrow">${at(WEEKLY)} · ${P(TEAM.lead).name}</p><h2>The weekly</h2><p class="meta">What climbed, who carried the week, what is still open, and next week’s rota. See the weekly edition.</p>`; return; }
  const e = eds.find(x => `${x.p}-${x.t}` === k), E = e.E;
  const list = (h, arr, f) => arr.length ? `<h3>${h}</h3>${arr.map(f).join('')}` : '';
  $('#peek').innerHTML = `<p class="eyebrow">${dayLong(e.t)} · ${hhmm(e.t)}</p><h2>${P(e.p).name}’s edition</h2>
    ${e.away ? `<p class="meta">Away. Nothing is printed; it waits for the “while you were out” card.</p>` : ''}
    ${list('Waiting on you', E.open, r => `<div class="brief">${r.n.title}<small>${A(r.n.app).name}</small></div>`)}
    ${list('Overnight', E.overnight, d => `<div class="brief">${d.n.title}<small>came ${at(d.sent)}</small></div>`)}
    ${list('For the record', [...E.record, ...E.quietList], d => `<div class="brief">${d.n.title}<small>${A(d.n.app).name}</small></div>`)}
    ${e.n === 0 && !e.away ? `<p class="meta">Nothing since ${at(E.since)}. The edition still comes, one line long, so silence is never a missing paper.</p>` : ''}
    ${E.covering.length ? `<h3>Today</h3><div class="brief">You cover ${E.covering.map(x => P(x).name).join(', ')}<small>until ${dayLong(backAt(E.covering[0]))}</small></div>` : ''}
    ${E.onCall ? `<h3>Today</h3><div class="brief">You are on call</div>` : ''}`;
}
$('#grid').addEventListener('click', e => { const b = e.target.closest('.ed'); if (b) peek(b.dataset.k); });
function play() { clearLater(); document.body.classList.add('pre'); $$('.ed,.sp').forEach(x => x.classList.remove('in')); peek(`${sel.p}-${sel.t}`); later(() => document.body.classList.remove('pre'), 60); [...$$('.ed,.sp')].sort((a, b) => parseFloat(a.style.left) - parseFloat(b.style.left)).forEach((x, i) => later(() => x.classList.add('in'), 1200 + i * 35)); }
document.addEventListener('keydown', e => commonKeys(e, play));
Icons.hydrate(document.body); play();
</script></body></html>
