<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digests · V1 The front page</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.paper{max-width:calc(var(--measure-wide) + var(--space-8) * 2);margin:0 auto;height:100%;display:flex;flex-direction:column}
.mast{text-align:center;padding-bottom:var(--space-3);border-bottom:3px double var(--hairline-strong)}
.mast .ed{display:flex;justify-content:space-between;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.mast h1{font-weight:200;font-size:var(--type-display);line-height:var(--leading-display);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:var(--space-2) 0 var(--space-1)}
.mast p{font-size:var(--type-meta);color:var(--ink-muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:0;flex:1;min-height:0;margin-top:var(--space-3)}
.col{padding:0 var(--space-5);border-left:1px solid var(--hairline);overflow:auto;min-height:0}
.col:first-child{border-left:0;padding-left:0}
.col:last-child{padding-right:0}
.col h2{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0 0 var(--space-2);padding-bottom:var(--space-1);border-bottom:1px solid var(--hairline)}
.col h2 + *{margin-top:var(--space-2)}
.head{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light);letter-spacing:var(--tracking-tight);margin-bottom:var(--space-3)}
.story{padding:var(--space-2) 0 var(--space-3);border-bottom:1px solid var(--hairline)}
.story h3{font-weight:400;font-size:var(--type-body);line-height:var(--leading-body);color:var(--light)}
.story p{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);margin-top:var(--space-1)}
.story .by{font-size:var(--type-small);color:var(--ink-muted);margin-top:var(--space-1);display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.brief{font-size:var(--type-meta);line-height:var(--leading-meta);padding:var(--space-1) 0;border-bottom:1px solid var(--hairline)}
.brief small{display:block;font-size:var(--type-small);color:var(--ink-muted)}
.blank{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);padding:var(--space-2) 0}
.foot{display:flex;justify-content:space-between;border-top:1px solid var(--hairline);margin-top:var(--space-3);padding-top:var(--space-2);font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.sec{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.unset .sec{opacity:0;transform:translateY(var(--space-2))}
</style></head><body class="pre unset">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><article class="paper" id="paper"></article></main>
</div>
<div class="x-cap"><b>Digests · V1</b> the front page: one person’s morning edition, lead story first, honest blanks last · newspaper front pages, BLUF, the daily brief</div>
<script>/*@DATA@*/
/*@LIB@*/
const WHO = DATA.teams[DATA.rota.team].lead, T = tm('Thu ' + P(WHO).digest);
const E = edition(WHO, T), p = P(WHO);
$('#top').innerHTML = topHTML(['Home', 'Editions', `${dayLong(T)}`], [['R', 'replay'], ['T', 'technical words', 'h-t']]);
const nextOf = r => nextAsk(r, T);
function storyHTML(r) {
  const d = r.deliveries.find(x => x.p === WHO), nx = nextOf(r);
  const lim = r.n.limit ? tm(r.n.limit) : null;
  return `<div class="story"><h3>${r.n.title}</h3><p>${d.via === 'escalation' ? `It came to you ${at(d.told)} as team lead: ${hops(r, WHO).filter(h => h.t <= d.told && /passed it on|Nobody had taken/.test(h.w)).map(h => h.w.replace(/\.$/, '')).slice(-1)[0] || 'nobody had taken it'}.` : `${A(r.n.app).name} asked you ${at(d.told)}.`} ${lim ? `Its limit ${lim < T ? 'passed' : 'is'} ${at(lim)}.` : ''}</p>
    <p class="by">${lvl(r.n)} ${appTag(r.n.app)} ${nx ? `<span>· if you don’t take it, the policy asks ${P(nx.people[0]).name} ${at(nx.at)}</span>` : ''}</p></div>`;
}
const day = DATA.week.days[dayOf(T)];
const lead = E.open.length ? `${E.open.length === 1 ? 'One thing waits' : `${['', 'One', 'Two', 'Three', 'Four', 'Five'][E.open.length] || E.open.length} things wait`} for you this morning` : 'Nothing waits for you this morning';
const col1 = `<div class="sec"><h2>Waiting on you</h2><p class="head">${lead}</p>${E.open.map(storyHTML).join('')}</div>`;
const col2 = `<div class="sec"><h2>Overnight</h2>${E.overnight.length ? E.overnight.map(d => `<div class="brief">${d.n.title}<small>${A(d.n.app).name} · came ${at(d.sent)}, held for you</small></div>`).join('') : `<p class="blank">Nothing came in your quiet hours.</p>`}
  <h2 style="margin-top:var(--space-4)">Today</h2>
  <div class="brief">${E.onCall ? `You are on call (${DATA.rota.name}).` : `${P(DATA.rota.byDay[dayOf(T)]).name} is on call.`}<small>${DATA.rota.name}, kept by ${P(DATA.rota.setBy).name}</small></div>
  ${E.away.map(a => `<div class="brief">${P(a).name} is away until ${dayLong(backAt(a))}.<small>${P(P(a).away.cover).name} covers what needs him</small></div>`).join('')}
  <h2 style="margin-top:var(--space-4)">Done since yesterday</h2>${E.done.length ? E.done.map(r => `<div class="brief">${r.n.title}<small>${r.acted.act} · ${P(r.acted.p).name}, ${at(r.acted.acted)}</small></div>`).join('') : `<p class="blank">Nothing you were asked about was finished.</p>`}</div>`;
const col3 = `<div class="sec"><h2>For the record</h2>${E.record.map(d => `<div class="brief">${d.n.title}<small>${A(d.n.app).name} · ${at(d.sent)}</small></div>`).join('') || '<p class="blank">Nothing.</p>'}
  ${E.quietList.length ? `<h2 style="margin-top:var(--space-4)">From apps you muted</h2>${E.quietList.map(d => `<div class="brief">${d.n.title}<small>${A(d.n.app).name} · in your list, no pulse</small></div>`).join('')}` : ''}
  <h2 style="margin-top:var(--space-4)">Nothing from</h2><p class="blank">${E.silent.map(a => A(a).name).join(', ')}. Checked ${hhmm(T)}; each was listening.</p></div>`;
const body = col1 + col2 + col3;
$('#paper').innerHTML = `<header class="mast"><div class="ed"><span>${DATA.org}</span><span>${day} · ${hhmm(T)}</span></div><h1>Morning edition</h1><p>for ${p.name} · ${DATA.teams[p.team].name} · since ${at(E.since)}</p></header>
  <div class="cols"><section class="col">${col1}</section><section class="col">${col2}</section><section class="col">${col3}</section></div>
  <footer class="foot"><span>About ${readSecs(body)} seconds to read · ${E.open.length + E.overnight.length + E.record.length + E.done.length} items</span><span>Next edition ${at(nextEdition(WHO, T))} · change it in My switchboard</span></footer>`;
function play() { clearLater(); document.body.classList.add('pre', 'unset'); later(() => document.body.classList.remove('pre'), 60); $$('.sec').forEach((s, i) => { s.style.transitionDelay = `calc(${i} * var(--motion-base))`; }); later(() => document.body.classList.remove('unset'), 1200); }
document.addEventListener('keydown', e => commonKeys(e, play));
Icons.hydrate(document.body); play();
</script></body></html>
