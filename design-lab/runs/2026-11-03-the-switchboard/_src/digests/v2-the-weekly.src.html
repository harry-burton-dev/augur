<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digests · V2 The weekly</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.paper{max-width:calc(var(--measure-wide) + var(--space-8) * 2);margin:0 auto;height:100%;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:var(--space-3) var(--space-6)}
.mast{grid-column:1 / -1;display:flex;align-items:baseline;gap:var(--space-4);border-bottom:1px solid var(--hairline-strong);padding-bottom:var(--space-2)}
.mast h1{font-weight:200;font-size:var(--type-title);line-height:var(--leading-title);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.mast span{font-size:var(--type-meta);color:var(--ink-muted)}
.mast .r{margin-left:auto;font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.main-col,.side-col{overflow:auto;min-height:0}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3);margin-bottom:var(--space-4)}
.nums div{border-top:1px solid var(--hairline-strong);padding-top:var(--space-2)}
.nums b{display:block;font:200 var(--type-title)/1 var(--font-mono);color:var(--light)}
.nums span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
h2{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:var(--space-4) 0 var(--space-2);padding-bottom:var(--space-1);border-bottom:1px solid var(--hairline)}
h2:first-child{margin-top:0}
.story{margin-bottom:var(--space-3)}
.story h3{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.story p{font-size:var(--type-meta);line-height:var(--leading-meta);margin-top:var(--space-1)}
.story .path{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);margin-top:var(--space-1)}
.load{display:grid;grid-template-columns:7rem minmax(0,1fr) 2.5rem;gap:var(--space-1) var(--space-2);align-items:center;font-size:var(--type-small)}
.load .bar{display:flex;height:var(--space-3);gap:1px}
.load .bar i{display:block;height:100%;transform-origin:left;transform:scaleX(0);transition:transform var(--motion-calm) var(--ease-out)}
.set .load .bar i{transform:none}
.load .n{font:400 var(--type-small)/1 var(--font-mono);color:var(--light);text-align:right}
.b-needs{background:var(--x-proposed-lit)}
.b-live{background:var(--ink)}
.b-held{background:var(--x-proposed-held),var(--surface-raised)}
.b-rec{background:var(--info);opacity:.6}
.leg{display:flex;gap:var(--space-3);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);margin-top:var(--space-2)}
.leg i{display:inline-block;width:var(--space-3);height:var(--space-3);margin-right:var(--space-1);vertical-align:-1px}
.rota{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;font-size:var(--type-small);text-align:center}
.rota span{padding:var(--space-1) 0;background:var(--surface-inset);border-radius:2px}
.rota b{display:block;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);color:var(--ink-muted)}
.brief{font-size:var(--type-meta);line-height:var(--leading-meta);padding:var(--space-1) 0;border-bottom:1px solid var(--hairline)}
.brief small{display:block;font-size:var(--type-small);color:var(--ink-muted)}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><article class="paper" id="paper"></article></main>
</div>
<div class="x-cap"><b>Digests · V2</b> the weekly: a team lead’s week of routing, what climbed and who carried it · weekly news magazines, shift handover reports</div>
<script>/*@DATA@*/
/*@LIB@*/
const TEAM = DATA.teams[DATA.rota.team], LEAD = TEAM.lead, T = tm('Fri 16:00');
$('#top').innerHTML = topHTML(['Home', 'Editions', 'Weekly'], [['R', 'replay'], ['T', 'technical words', 'h-t']]);
const inWeek = r => r.t <= T;
const rs = ALL().filter(inWeek), team = new Set(TEAM.members);
const teamNeeds = rs.filter(r => r.cls === 'needs' && r.deliveries.some(d => team.has(d.p)));
const inLimit = teamNeeds.filter(r => r.resolved != null && r.resolved <= T && r.steps.filter(s => s.k > 0 && !s.skipped && s.at < r.resolved).length === 0);
const climbed = teamNeeds.filter(r => r.deliveries.some(d => d.via === 'escalation' && d.told <= T));
const covered = teamNeeds.filter(r => r.deliveries.some(d => d.via === 'cover' && d.told <= T));
const open = teamNeeds.filter(r => !(r.acted && r.acted.acted <= T));
const blockedForTeam = rs.filter(r => r.blocked && r.blocked.rule === 'permission' && DATA.teams[r.n.to.team]?.members.some(m => team.has(m)));
function story(r) {
  const ppl = r.deliveries.filter(d => d.told <= T);
  return `<div class="story"><h3>${r.n.title}</h3><p>${A(r.n.app).name} asked ${P(ppl[0].p).name} ${at(r.t)}. ${r.acted ? `${P(r.acted.p).name}: ${r.acted.act.toLowerCase()}, ${at(r.acted.acted)}, after ${dur(r.acted.acted - r.t)}.` : 'Still open.'}</p>
    <p class="path">${ppl.map(d => `${who(d.p, { first: true })} <span>${hhmm(d.told)}</span>`).join(I('chevron-right', 12))}</p></div>`;
}
const load = TEAM.members.map(p => { const ds = forPerson(p).filter(d => d.sent <= T); return { p, needs: ds.filter(d => classOf(d.n) === 'needs').length, live: ds.filter(d => classOf(d.n) !== 'needs' && d.rule === 'live').length, held: ds.filter(d => d.held).length, rec: ds.filter(d => d.rule === 'record' || d.rule === 'muted').length }; });
const maxL = Math.max(...load.map(l => l.needs + l.live + l.held + l.rec));
$('#paper').innerHTML = `<header class="mast"><h1>The weekly</h1><span>${TEAM.name} · for ${P(LEAD).name}</span><span class="r">${DATA.week.label} · ${at(T)}</span></header>
  <section class="main-col"><div class="nums dep" style="--i:2"><div><b>${teamNeeds.length}</b><span>things needed someone on the team</span></div><div><b>${inLimit.length}</b><span>taken by the first person asked</span></div><div><b>${climbed.length}</b><span>climbed the policy</span></div><div><b>${covered.length}</b><span>went to a cover</span></div></div>
    <h2>What climbed, and who stepped in</h2>${climbed.map(story).join('')}
    <h2>Still open going into next week</h2>${open.map(r => { const d = r.deliveries[0]; return `<div class="brief">${r.n.title}<small>${P(d.p).name} · ${d.held ? `held until ${dayLong(d.told)} ${hhmm(d.told)}` : `asked ${at(d.told)}`}</small></div>`; }).join('') || '<p class="brief">Nothing.</p>'}
    ${blockedForTeam.length ? `<h2>Meant for you, never sent</h2><div class="brief">${blockedForTeam.length} × “${blockedForTeam[0].n.title}”<small>${A(blockedForTeam[0].n.app).name} isn’t allowed on ${DATA.floors[blockedForTeam[0].n.floor].name}. ${P(Object.keys(DATA.people).find(id => P(id).admin === 'department')).name} can change it.</small></div>` : ''}</section>
  <aside class="side-col"><h2>Who carried the week</h2><div class="load">${load.map(l => `<span>${who(l.p, { first: true })}</span><span class="bar" style="width:${((l.needs + l.live + l.held + l.rec) / maxL * 100).toFixed(1)}%">${[['needs', l.needs], ['live', l.live], ['held', l.held], ['rec', l.rec]].filter(x => x[1]).map(([k, v]) => `<i class="b-${k}" style="flex:${v}"></i>`).join('')}</span><span class="n">${l.needs + l.live + l.held + l.rec}</span>`).join('')}</div>
    <div class="leg"><span><i class="b-needs"></i>needs you</span><span><i class="b-live"></i>told live</span><span><i class="b-held"></i>held</span><span><i class="b-rec"></i>edition or list only</span></div>
    <h2>Next week’s rota</h2><div class="rota">${DATA.rota.byDay.map((p, i) => `<span><b>${DAYS[i]}</b>${first(P(p).name)}</span>`).join('')}</div>
    <p class="brief" style="border:0"><small>${DATA.rota.name}, kept by ${P(DATA.rota.setBy).name}. Change it before ${DATA.week.next}, ${DATA.rota.handover}.</small></p>
    <h2>Away next week</h2>${TEAM.members.filter(p => P(p).away && tm(P(p).away.to) > WEEK_END).map(p => `<div class="brief">${P(p).name}<small>until ${dayLong(tm(P(p).away.to))}</small></div>`).join('') || '<p class="brief"><small>Nobody has set away.</small></p>'}</aside>`;
function play() { clearLater(); document.body.classList.add('pre'); document.body.classList.remove('set'); later(() => document.body.classList.remove('pre'), 60); later(() => document.body.classList.add('set'), 1200); }
document.addEventListener('keydown', e => commonKeys(e, play));
Icons.hydrate(document.body); play();
</script></body></html>
