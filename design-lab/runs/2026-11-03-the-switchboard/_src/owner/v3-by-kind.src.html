<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App owner · V3 By kind of notice</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:flex;flex-direction:column;gap:var(--space-4);height:100%}
table{border-collapse:collapse;width:100%;font-size:var(--type-meta);line-height:var(--leading-meta)}
th{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:var(--space-1) var(--space-3);border-bottom:1px solid var(--hairline-strong);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:var(--space-3);border-bottom:1px solid var(--hairline);vertical-align:middle}
td.num{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light)}
td small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.bar{display:flex;height:var(--space-4);width:100%;min-width:12rem;border-radius:1px;overflow:hidden;background:var(--surface-inset)}
.bar i{display:block;height:100%;transform-origin:left;transform:scaleX(0);transition:transform var(--motion-calm) var(--ease-out)}
.drawn .bar i{transform:none}
.k-live{background:var(--ink)}
.k-quiet,.k-away{background:var(--x-proposed-held),var(--surface-raised)}
.k-muted{background:var(--ink-muted);opacity:.5}
.k-urgent{background:var(--danger)}
.k-record{background:var(--info);opacity:.6}
.k-stop{background:var(--x-proposed-blocked)}
.leg{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted)}
.leg span{display:inline-flex;align-items:center;gap:var(--space-1)}
.leg i{display:inline-block;width:var(--space-4);height:var(--space-3)}
.flag{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);color:var(--x-proposed-blocked)}
.dim{color:var(--ink-muted)}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <div><p class="eyebrow">Admin · Apps · Notices</p><h1 class="heading" id="h"></h1></div>
    <div class="leg" id="leg"></div>
    <table><thead><tr><th>Kind</th><th>Level</th><th class="r">Sent</th><th>Every person it named, by route</th><th class="r">Seen</th><th class="r">Acted</th><th class="r">Time to act</th></tr></thead><tbody id="rows"></tbody></table>
    <p class="small muted" id="foot"></p>
  </div></main>
</div>
<div class="x-cap"><b>App owner · V3</b> by kind of notice: one row per kind, every person it named split by route · small multiples (Tufte), email campaign reports</div>
<script>/*@DATA@*/
/*@LIB@*/
const APP = 'repairs', app = A(APP), rs = ALL().filter(r => r.n.app === APP);
$('#top').innerHTML = topHTML(['Admin', 'Apps', app.name, 'By kind'], [['R', 'replay'], ['T', 'technical words', 'h-t']], 'department');
$('#h').textContent = `${app.name}: each kind of notice, last week`;
const K = ['live', 'quiet', 'away', 'muted', 'record', 'urgent', 'stop'];
const KW = { live: 'told live', quiet: 'held: quiet hours', away: 'held: away', muted: 'list only (muted)', record: 'edition', urgent: 'urgent', stop: 'never told' };
$('#leg').innerHTML = K.map(k => `<span><i class="k-${k}"></i>${KW[k]}</span>`).join('');
const kinds = [...new Set(rs.map(r => kindOf(r.n)))];
const med = a => { a = a.sort((x, y) => x - y); return a.length ? a[Math.floor(a.length / 2)] : null; };
const rows = kinds.map(k => {
  const g = rs.filter(r => kindOf(r.n) === k), ds = g.flatMap(r => r.deliveries);
  const c = Object.fromEntries(K.map(x => [x, x === 'stop' ? g.filter(r => r.blocked).reduce((a, r) => a + r.blocked.would, 0) : ds.filter(d => d.rule === x).length]));
  const tot = K.reduce((a, x) => a + c[x], 0);
  const needs = g.filter(r => r.cls === 'needs' || r.cls === 'urgent'), acted = needs.filter(r => r.acted);
  return { k, word: kindWord(g[0].n), g, ds, c, tot, levels: [...new Set(g.map(r => r.n.urgent ? 'urgent' : r.n.level))], seen: ds.filter(d => d.seen != null).length, needs, acted, tta: med(acted.map(r => r.acted.acted - r.t)), keyless: g.some(r => !r.n.key) };
}).sort((a, b) => b.tot - a.tot);
const maxT = Math.max(...rows.map(r => r.tot));
$('#rows').innerHTML = rows.map(x => `<tr><td>${x.word}${x.keyless ? `<small class="flag">${I('key-round', 12)} no key</small>` : ''}<span class="tk">${x.k || '(none)'}:*</span></td><td>${x.levels.map(l => lvl(l === 'urgent' ? { level: 'needs', urgent: true } : { level: l })).join(' ')}</td><td class="num r">${x.g.length}</td>
  <td><div class="bar" style="width:${(x.tot / maxT * 100).toFixed(1)}%" title="${K.filter(k => x.c[k]).map(k => `${x.c[k]} ${KW[k]}`).join(', ')}">${K.filter(k => x.c[k]).map((k, i) => `<i class="k-${k}" style="flex:${x.c[k]};transition-delay:calc(${i} * var(--motion-instant))"></i>`).join('')}</div><small>${K.filter(k => x.c[k]).map(k => `${x.c[k]} ${KW[k]}`).join(' · ')}</small></td>
  <td class="num r">${x.ds.length ? `${x.seen}<small>of ${x.ds.length}</small>` : '<span class="dim">—</span>'}</td><td class="num r">${x.needs.length ? `${x.acted.length}<small>of ${x.needs.length}</small>` : '<span class="dim">n/a</span>'}</td><td class="num r">${x.tta != null ? dur(x.tta) : '<span class="dim">—</span>'}</td></tr>`).join('');
$('#foot').textContent = `Bars are people, not notices: a notice to a team of five is five people. “Acted” counts only needs-you notices; news has nothing to act on. Seen and acted are counts: an app owner never sees who.`;
function play() { clearLater(); document.body.classList.add('pre'); document.body.classList.remove('drawn'); later(() => document.body.classList.remove('pre'), 60); later(() => document.body.classList.add('drawn'), 1200); }
document.addEventListener('keydown', e => commonKeys(e, play));
Icons.hydrate(document.body); play();
</script></body></html>
