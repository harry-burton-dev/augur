<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why was I told? · V5 The envelope</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-3);height:100%}
.hd{display:flex;align-items:baseline;gap:var(--space-3)}
.env{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:var(--space-4);min-height:0}
.e{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:linear-gradient(160deg,var(--surface-raised),var(--surface-inset));border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:var(--space-3) var(--space-4);overflow:hidden}
.e .from{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:flex;flex-direction:column;gap:2px}
.e .from .ttl{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);max-width:62%}
.stampbox{position:absolute;top:var(--space-3);right:var(--space-4);width:calc(var(--target-md) + var(--space-4));height:calc(var(--target-md) + var(--space-5));border:1px dashed var(--hairline-strong);outline:1px solid var(--hairline);outline-offset:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.1 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink);text-align:center;padding:var(--space-1)}
.stampbox.needs{color:var(--x-proposed-lit)}
.addr{align-self:center;justify-self:center;font:400 var(--type-meta)/var(--leading-meta) var(--font-mono);color:var(--light);border-left:1px solid var(--hairline-strong);padding-left:var(--space-3)}
.addr .to{color:var(--ink-muted);font-size:var(--type-small)}
.addr .you{color:var(--ink-muted)}
.addr .you b{color:var(--x-proposed-lit);font-weight:400}
.ink{position:absolute;font:500 var(--type-small)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;border:1.5px solid currentColor;border-radius:var(--radius-key);padding:var(--space-1) var(--space-2);opacity:0;transform:rotate(var(--rot)) scale(1.15);transition:opacity var(--motion-quick) var(--ease-out),transform var(--motion-quick) var(--ease-out);pointer-events:none;max-width:16rem}
.ink.in{opacity:.82;transform:rotate(var(--rot)) scale(1)}
.ink.held{color:var(--ink-muted)}
.ink.fwd{color:var(--x-proposed-lit)}
.ink.ed{color:var(--info)}
.slip{display:flex;align-items:center;gap:var(--space-3);border-top:1px dashed var(--hairline-strong);padding-top:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.slip .k{font:400 var(--type-label)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.foot{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.addr{font-size:var(--type-small);line-height:var(--leading-small)}.ink{font-size:var(--x-proposed-type-micro)}}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <div class="hd"><p class="eyebrow">Why was I told?</p><h1 class="heading">Four notices, as envelopes</h1></div>
    <div class="env" id="env"></div>
    <p class="foot" id="foot"></p>
  </div></main>
</div>
<div class="x-cap"><b>Why was I told? · V5</b> the envelope: the address, the class stamp, the post office’s marks · Royal Mail redirection and “while you were out”, recorded delivery slips</div>
<script>/*@DATA@*/
/*@LIB@*/
const ME = DATA.me, PICKS = ['n16', 'n10', 'n05', 'n38'];
$('#top').innerHTML = topHTML(['Notifications', 'Envelopes'], [['R', 'replay'], ['T', 'technical words', 'h-t']]);
function addr(d) {
  const n = d.n, to = n.to;
  if (to.rota) return `<span class="to">To:</span><br>whoever is on call<br>${DATA.teams[DATA.rota.team].name}<br><span class="you">${dayLong(d.sent)}: <b>you</b></span>`;
  if (to.team) return `<span class="to">To:</span><br>everyone on<br>${DATA.teams[to.team].name}<br><span class="you">that includes <b>you</b></span>`;
  if (d.via === 'escalation') return `<span class="to">To:</span><br>${P(to.people[0]).name}<br><span class="to">then, by the policy:</span><br>on call, ${dayLong(d.sent)}<br><span class="you"><b>you</b></span>`;
  return `<span class="to">To:</span><br>${P(to.people[0]).name}<br>${P(to.people[0]).role}`;
}
function inks(d) {
  const r = route(d.n), out = [];
  if (d.via === 'cover') out.push(['fwd', `Redirected · cover for ${first(P(d.coverFor).name)}`]);
  if (d.via === 'escalation') { const prev = r.deliveries.filter(x => x.told < d.sent); out.push(['fwd', `Not taken by ${hhmm(d.sent)} · forwarded to on call`]); }
  if (d.held) out.push(['held', `Held · quiet hours · delivered ${at(d.told)}`]);
  if (d.rule === 'record') out.push(['ed', `Second class · ${hhmm(d.edition)} edition, ${dayName(d.edition)}`]);
  if (d.rule === 'live' && d.via !== 'escalation') out.push(['held', `Delivered ${at(d.told)}`]);
  return out;
}
const ROT = ['-5deg', '4deg', '-2deg'], POS = [['42%', '18%'], ['54%', '52%'], ['30%', '60%']];
$('#env').innerHTML = PICKS.map((id, i) => {
  const r = route(id), d = r.deliveries.find(x => x.p === ME), n = d.n, c = CLASSES[classOf(n)];
  return `<article class="e dep" style="--i:${i}" data-i="${i}">
    <div class="from">${appTag(n.app)}<span class="ttl">${n.title}</span><span>${n.floor ? DATA.floors[n.floor].name : 'every floor'} · posted ${at(r.t)}</span></div>
    <div class="stampbox ${classOf(n) === 'needs' ? 'needs' : ''}">${I(c.icon, 18)}<span>${c.post}</span></div>
    <div class="addr">${addr(d)}</div>
    ${inks(d).map(([k, w], j) => `<span class="ink ${k}" style="--rot:${ROT[j % 3]};left:${POS[j % 3][0]};top:${POS[j % 3][1]}">${w}</span>`).join('')}
    <div class="slip"><span class="k">${c.receipt.length > 1 ? 'Recorded' : 'Receipt'}</span>${rcpt(d)}<span class="tk" style="margin-left:auto">${n.key || ''}</span></div>
  </article>`;
}).join('');
$('#foot').textContent = `An envelope shows the address it was sent to and the marks the routing made on the way. It never lists who else received it.`;
function play() {
  clearLater(); document.body.classList.add('pre'); $$('.ink').forEach(x => x.classList.remove('in'));
  later(() => document.body.classList.remove('pre'), 60);
  $$('.ink').forEach((x, i) => later(() => x.classList.add('in'), 1200 + i * 260));
}
document.addEventListener('keydown', e => commonKeys(e, play));
Icons.hydrate(document.body); play();
</script></body></html>
