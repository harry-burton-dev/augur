<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why was I told? · V2 The trace</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.cols{display:grid;grid-template-columns:minmax(0,26rem) minmax(0,1fr);gap:var(--space-5);height:100%}
.card{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);align-self:start}
.card .heading{font-size:var(--type-heading)}
.lim{display:flex;gap:var(--space-4);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
.lim b{display:block;font:300 var(--type-lead)/var(--leading-lead) var(--font-mono);color:var(--light)}
.acts{display:flex;gap:var(--space-2);flex-wrap:wrap}
.trace{display:flex;flex-direction:column;min-height:0}
.trace .hd{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-3)}
.hops{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;position:relative}
.hop{display:grid;grid-template-columns:7.5rem var(--space-5) minmax(0,1fr) auto;gap:var(--space-3);align-items:start;padding:var(--space-1) var(--space-3) var(--space-1) 0;border-radius:var(--radius-key);opacity:0;transform:translateX(calc(var(--space-2) * -1));transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out)}
.hop.in{opacity:1;transform:none}
.hop.in.after{opacity:.38}
.day.in.after{opacity:.38}
.hop .t{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);text-align:right}
.hop .ic{display:flex;justify-content:center;padding-top:2px;color:var(--ink-muted);position:relative}
.hop .ic::after{content:"";position:absolute;top:calc(var(--space-5) - 2px);bottom:calc(var(--space-2) * -1);left:50%;width:1px;background:var(--hairline)}
.hop:last-child .ic::after{display:none}
.hop .w{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.hop.quiet .w{color:var(--ink-muted)}
.hop.key .w{color:var(--light)}
.hop.me{background:var(--x-proposed-lit-wash)}
.hop.me .ic{color:var(--x-proposed-lit)}
.hop .here{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-proposed-lit);margin-left:var(--space-2)}
.hop .r{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-2);white-space:nowrap}
.hop .tk{grid-column:3 / span 2}
.day{grid-column:1 / -1;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);padding:var(--space-3) 0 var(--space-1);border-bottom:1px solid var(--hairline);margin-bottom:var(--space-1);opacity:0;transition:opacity var(--motion-base)}
.day.in{opacity:1}
.note{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin-top:var(--space-3);border-top:1px solid var(--hairline);padding-top:var(--space-2)}
@media (max-width:1400px){.cols{grid-template-columns:minmax(0,20rem) minmax(0,1fr)}.hop{grid-template-columns:6rem var(--space-5) minmax(0,1fr)}.hop .r{display:none}}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="cols">
    <section class="pane card" id="card"></section>
    <section class="trace">
      <div class="hd"><p class="eyebrow">How it reached you</p><span class="small muted">every hop, in order, with whose setting decided it</span></div>
      <ol class="hops" id="hops"></ol>
      <p class="note" id="note"></p>
    </section>
  </div></main>
</div>
<div class="x-cap"><b>Why was I told? · V2</b> the trace: every hop with its time and its rule · email “Received:” headers, recorded delivery tracking, flight strips</div>
<script>/*@DATA@*/
/*@LIB@*/
const ME = DATA.me, NID = 'n16';
const r = route(NID), n = r.n, mine1 = r.deliveries.find(d => d.p === ME);
$('#top').innerHTML = topHTML(['Inbox', n.title], [['←→', 'move now'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
function card(now) {
  const taken = r.resolved != null && r.resolved <= now, acted = r.acted && r.acted.acted <= now, passed = mine1.passed != null && mine1.passed <= now;
  const state = acted ? `${I('check-check', 14)} Done: ${r.acted.act.toLowerCase()} by ${P(r.acted.p).name}, ${at(r.acted.acted)}` : taken ? `${I('user-check', 14)} ${P(r.by).name} has it (${at(r.resolved)}). You were stood down.` : passed ? `${I('forward', 14)} You passed it on at ${hhmm(mine1.passed)}. It is with ${P(r.deliveries.find(d => d.sent === mine1.passed && d.via === 'escalation').p).name} now.` : `${I('hand', 14)} Open, and waiting on you`;
  const live = !taken && !passed;
  $('#card').innerHTML = `<p class="eyebrow">${A(n.app).name} · ${DATA.floors[n.floor].name}</p>${lvl(n)}<h1 class="heading">${n.title}</h1>
  <div class="lim"><span>limit<b>${at(tm(n.limit))}</b></span><span>asked you<b>${at(mine1.told)}</b></span><span>now<b>${at(now)}</b></span></div>
  <p class="meta lite">${state}</p>
  <p class="meta">${viaWords(mine1)}</p>
  <div class="acts"><button class="btn ${live ? 'go' : ''}" ${live ? '' : 'aria-disabled="true" title="Someone else has it"'}>${I('hand', 14)} I have it</button><button class="btn" ${live ? '' : 'aria-disabled="true"'}>${I('forward', 14)} Pass it on, with a note</button><button class="btn">${I('arrow-up-right', 14)} Open in ${A(n.app).name}</button></div>
  ${live ? `<p class="small muted">Passing it on asks the policy’s next step now, instead of at ${hhmm(r.steps.find(s => s.people && s.people.includes(ME)).until)}.</p>` : ''}`;
  Icons.hydrate($('#card'));
}
const HOPS = hops(r, ME);
let lastDay = -1, html = '';
HOPS.forEach((h, i) => {
  if (dayOf(h.t) !== lastDay) { lastDay = dayOf(h.t); html += `<li class="day" data-i="${i}">${dayLong(h.t)}</li>`; }
  html += `<li class="hop ${h.me ? 'me' : ''} ${h.quiet ? 'quiet' : ''} ${h.key ? 'key' : ''}" data-i="${i}"><span class="t">${hhmm(h.t)}</span><span class="ic">${I(h.icon, 16)}</span><span class="w">${h.w}${h.me && h.rule ? '<span class="here">you are here</span>' : ''}</span><span class="r">${h.rule ? ruleChip(h.rule) : ''}</span>${h.tk ? `<span class="tk">${h.tk}</span>` : ''}</li>`;
});
$('#hops').innerHTML = html;
$('#note').innerHTML = `Faded hops came after the moment you are looking at; ← and → move it. You see the earlier holders of a needs-you item because it passed through them; for news you only ever see your own hop. ${DATA.teams[DATA.rota.team].name}’s policy is ${P(DATA.policy.setBy).name}’s; anyone on the team can read it.`;
let NOW = HOPS.findIndex(h => h.me && h.rule);
function setNow(i) {
  NOW = Math.max(0, Math.min(HOPS.length - 1, i));
  $$('.hop').forEach(x => x.classList.toggle('after', +x.dataset.i > NOW));
  $$('.day').forEach(x => x.classList.toggle('after', +x.dataset.i > NOW));
  card(HOPS[NOW].t);
}
function play() {
  clearLater(); document.body.classList.add('pre'); $$('.hop,.day').forEach(x => x.classList.remove('in'));
  NOW = HOPS.findIndex(h => h.me && h.rule); setNow(NOW);
  later(() => document.body.classList.remove('pre'), 60);
  $$('.hop,.day').forEach((x, i) => later(() => x.classList.add('in'), 1200 + i * 70));
}
document.addEventListener('keydown', e => { if (commonKeys(e, play)) return; if (e.key === 'ArrowRight') setNow(NOW + 1); if (e.key === 'ArrowLeft') setNow(NOW - 1); });
Icons.hydrate(document.body); play();
</script></body></html>
