<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why was I told? · V1 The postmark</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--space-5);height:100%}
.list{display:flex;flex-direction:column;min-height:0}
.list .hd{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-2)}
.items{list-style:none;margin:0;padding:0;overflow:auto;min-height:0}
.item{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) auto;gap:0 var(--space-3);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);cursor:pointer;border-radius:var(--radius-key)}
.item:hover{background:var(--surface-inset)}
.item[aria-selected="true"]{background:var(--surface-raised)}
.item .t{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.item .ti{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .lv{text-align:right}
.pm{grid-column:2 / span 2;display:flex;align-items:center;gap:var(--space-2);margin-top:2px;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap;overflow:hidden}
.pm .ring{display:inline-flex;align-items:center;gap:var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:0 var(--space-2);color:var(--ink)}
.pm .ring.h{background:var(--x-proposed-held)}
.pm .wv{width:var(--space-6);height:var(--space-2);flex:none;opacity:.5}
.detail{padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);overflow:auto}
.frank{position:relative;border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4);display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-4);font-size:var(--type-meta);line-height:var(--leading-meta)}
.frank dt{font:400 var(--type-label)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.frank dd{margin:0;color:var(--ink)}
.frank dd b{font-weight:400;color:var(--light)}
.frank .dep{transition-delay:calc(var(--i) * var(--motion-quick))}
.because{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);font-weight:300}
.acts{display:flex;gap:var(--space-2);flex-wrap:wrap}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="cols">
    <section class="list">
      <div class="hd"><p class="eyebrow">Notifications</p><h1 class="heading">Everything that reached you last week</h1></div>
      <p class="small muted" style="margin-bottom:var(--space-2)">Each one carries its postmark: when it reached you, by which route, and why that route.</p>
      <ul class="items" id="items" role="listbox" aria-label="Notifications"></ul>
    </section>
    <section class="pane detail" id="detail" aria-live="polite"></section>
  </div></main>
</div>
<div class="x-cap"><b>Why was I told? · V1</b> the postmark: every notice carries its route in the list · postmarks and franking, the “Why am I seeing this?” menu</div>
<script>/*@DATA@*/
/*@LIB@*/
const ME = DATA.me, ds = mine(ME);
let sel = ds.findIndex(d => d.via === 'escalation');
const wave = `<svg class="wv" viewBox="0 0 44 8" aria-hidden="true"><path d="M0,4 q5.5,-4 11,0 t11,0 t11,0 t11,0" fill="none" stroke="var(--ink-muted)" stroke-width="1"/></svg>`;
const viaShort = d => ({ addressed: 'by name', team: `team · ${d.n.to.team ? DATA.teams[d.n.to.team].name : ''}`, rota: 'on call', role: 'your role', cover: `cover for ${first(P(d.coverFor || d.p).name)}`, escalation: 'asked next' })[d.via];
function postmark(d) {
  const told = d.rule === 'record' ? d.edition : d.told;
  return `<span class="ring ${d.held || d.rule === 'record' ? 'h' : ''}">${dayName(told)} ${hhmm(told)}</span>${wave}<span>${viaShort(d)}</span><span>·</span><span>${CLASSES[classOf(d.n)].word}</span>${RULES[d.rule].word !== CLASSES[classOf(d.n)].word ? `<span>·</span><span>${RULES[d.rule].word}</span>` : ""}`;
}
$('#top').innerHTML = topHTML(['Notifications'], [['↑↓', 'pick'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
$('#items').innerHTML = ds.map((d, i) => `<li class="item dep" role="option" tabindex="${i === sel ? 0 : -1}" data-i="${i}" style="--i:${i}" aria-selected="${i === sel}">
  <span class="t">${hhmm(d.sent)}<br>${dayName(d.sent)}</span><span class="ti">${d.n.title}</span><span class="lv">${lvl(d.n)}</span>
  <span class="pm">${postmark(d)}</span></li>`).join('');
function detail(d) {
  const n = d.n, r = route(n);
  const rows = [
    ['From', `${appTag(n.app)} on ${n.floor ? DATA.floors[n.floor].name : 'every floor'}`],
    ['Addressed to', addressOf(n).words],
    ['Reached you', `${viaShort(d)}${d.via === 'escalation' ? `, step ${r.steps.findIndex(s => s.k === d.step) + 1} of the team’s policy` : ''}`],
    ['Class', `${CLASSES[classOf(n)].word} <span class="muted">(${CLASSES[classOf(n)].post.toLowerCase()})</span>`],
    ['Route', `${ruleChip(d.rule)}${d.held ? ` · sent ${at(d.sent)}, held until <b>${at(d.told)}</b>` : d.rule === 'record' ? ` · in your <b>${at(d.edition)}</b> edition` : ` · <b>${at(d.told)}</b>`}`],
    ['Channels', d.ch.map(c => chip(c)).join(' ')],
    ['Receipts', rcpt(d)]
  ];
  return `<p class="eyebrow">Postmark</p>
    <h2 class="heading">${n.title}</h2>
    <p class="because">${viaWords(d)} ${ruleWords(d)}</p>
    <dl class="frank">${rows.map(([k, v], i) => `<dt class="dep" style="--i:${i}">${k}</dt><dd class="dep" style="--i:${i}">${v}</dd>`).join('')}</dl>
    <p class="tk">app: ${n.app} · level: ${n.level}${n.urgent ? ' + urgent' : ''} · key: ${n.key || '—'} · rule: ${d.rule} · via: ${d.via}${d.step ? ' · step ' + d.step : ''}</p>
    <div class="acts">${d.rule === 'muted' ? '' : `<button class="btn sm">${I('bell-off', 14)} Mute ${A(n.app).name}</button>`}<button class="btn sm">${I('sliders-horizontal', 14)} My switchboard</button>${d.via === 'rota' || d.via === 'escalation' ? `<button class="btn sm">${I('calendar-days', 14)} See the rota</button>` : ''}</div>`;
}
function pick(i, focus) {
  sel = Math.max(0, Math.min(ds.length - 1, i));
  $$('.item').forEach((x, k) => { x.setAttribute('aria-selected', k === sel); x.tabIndex = k === sel ? 0 : -1; });
  const el = $(`.item[data-i="${sel}"]`); if (focus) el.focus(); el.scrollIntoView({ block: 'nearest' });
  $('#detail').innerHTML = detail(ds[sel]); Icons.hydrate($('#detail'));
  $('#detail').classList.add('pre'); requestAnimationFrame(() => requestAnimationFrame(() => $('#detail').classList.remove('pre')));
}
$('#items').addEventListener('click', e => { const li = e.target.closest('.item'); if (li) pick(+li.dataset.i); });
function play() { clearLater(); document.body.classList.add('pre'); $('#detail').innerHTML = ''; later(() => document.body.classList.remove('pre'), 60); later(() => pick(ds.findIndex(d => d.via === 'escalation')), 1200); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, play)) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); pick(sel + 1, true); }
  if (e.key === 'ArrowUp') { e.preventDefault(); pick(sel - 1, true); }
});
Icons.hydrate(document.body); play();
</script></body></html>
