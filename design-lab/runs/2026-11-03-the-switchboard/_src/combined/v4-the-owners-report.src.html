<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Combined · V4 The app owner's report</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;gap:var(--space-3) var(--space-5);height:100%}
.hd{grid-column:1 / -1;display:flex;align-items:baseline;gap:var(--space-4)}
.nums{grid-column:1 / -1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--space-3)}
.nums div{border-top:1px solid var(--hairline-strong);padding-top:var(--space-1)}
.nums b{display:block;font:300 var(--type-heading)/1.1 var(--font-mono);color:var(--light)}
.nums span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.nums .warn b{color:var(--x-proposed-blocked)}
.box{padding:var(--space-3) var(--space-4);overflow:auto;min-height:0}
table{border-collapse:collapse;width:100%;font-size:var(--type-small);line-height:var(--leading-small);margin-top:var(--space-2)}
th{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--hairline-strong)}
td{padding:var(--space-2);border-bottom:1px solid var(--hairline);vertical-align:middle}
td.n{font-family:var(--font-mono);color:var(--light);text-align:right}
.bar{display:flex;height:var(--space-3);border-radius:1px;overflow:hidden;background:var(--surface-inset);min-width:8rem}
.bar i{display:block;height:100%;transform-origin:left;transform:scaleX(0);transition:transform var(--motion-calm) var(--ease-out)}
.drawn .bar i{transform:none}
.k-live{background:var(--ink)}.k-quiet,.k-away{background:var(--x-proposed-held),var(--surface-raised)}.k-muted{background:var(--ink-muted);opacity:.5}.k-urgent{background:var(--danger)}.k-record{background:var(--info);opacity:.6}.k-stop{background:var(--x-proposed-blocked)}
.leg{display:flex;gap:var(--space-3);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted);margin-top:var(--space-2)}
.leg i{display:inline-block;width:var(--space-3);height:var(--space-3);margin-right:var(--space-1);vertical-align:-1px}
.ret{position:relative;border:1px solid var(--hairline);border-left:3px solid var(--x-proposed-blocked);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);margin-top:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.ret.note{border-left-color:var(--hairline-strong)}
.ret small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ret .row{display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-1)}
.ret .row b{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light)}
.dry{grid-column:1 / -1;display:grid;grid-template-columns:auto repeat(3,minmax(0,12rem)) minmax(0,1fr);gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-4)}
select{font:inherit;font-size:var(--type-small);color:var(--ink);background:var(--slate-deep);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);height:calc(var(--target-sm) - var(--space-1));padding:0 var(--space-2);width:100%}
.verdict{font-size:var(--type-meta);line-height:var(--leading-meta)}
.verdict b{font-weight:400;color:var(--light)}
.verdict.stop b{color:var(--x-proposed-blocked)}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <div class="hd"><p class="eyebrow">Admin · Apps · Notices</p><h1 class="heading" id="h"></h1></div>
    <div class="nums" id="nums"></div>
    <section class="pane box"><p class="eyebrow">By kind · every person each kind named</p><table id="kinds"></table><div class="leg" id="leg"></div></section>
    <section class="pane box"><p class="eyebrow">Returned to sender</p><div id="ret"></div></section>
    <section class="pane dry"><span class="eyebrow">Dry run</span><select id="kind" aria-label="Kind"></select><select id="lev" aria-label="Level"></select><select id="addr" aria-label="Address"></select><p class="verdict" id="verdict" aria-live="polite"></p></section>
  </div></main>
</div>
<div class="x-cap"><b>Combined · V4</b> the app owner’s report: by kind, returned to sender, and a dry run before the next send · App owner V1, V2, V3, V6</div>
<script>/*@DATA@*/
/*@LIB@*/
const APP = 'repairs', app = A(APP), rs = ALL().filter(r => r.n.app === APP), ds = rs.flatMap(r => r.deliveries);
$('#top').innerHTML = topHTML(['Admin', 'Apps', app.name, 'Notices'], [['R', 'replay'], ['T', 'technical words', 'h-t']], 'department');
$('#h').textContent = `${app.name}, last week · owner ${P(app.owner).name}`;
const never = rs.filter(r => r.blocked).reduce((a, r) => a + r.blocked.would, 0);
const needs = rs.filter(r => r.cls === 'needs' || r.cls === 'urgent'), acted = needs.filter(r => r.acted);
$('#nums').innerHTML = [['Sent', rs.length], ['People told', ds.length], ['Held for hours or away', ds.filter(d => d.held).length], ['Seen', ds.filter(d => d.seen != null).length], ['Needs you acted on', `${acted.length}/${needs.length}`], ['People never told', never, 'warn']].map(([w, n, c]) => `<div class="${c || ''}"><b>${n}</b><span>${w}</span></div>`).join('');
const K = ['live', 'quiet', 'away', 'muted', 'record', 'urgent', 'stop'], KW = { live: 'told live', quiet: 'quiet hours', away: 'away', muted: 'muted', record: 'edition', urgent: 'urgent', stop: 'never told' };
const kinds = [...new Set(rs.map(r => kindOf(r.n)))].map(k => { const g = rs.filter(r => kindOf(r.n) === k), d = g.flatMap(r => r.deliveries); const c = Object.fromEntries(K.map(x => [x, x === 'stop' ? g.filter(r => r.blocked).reduce((a, r) => a + r.blocked.would, 0) : d.filter(z => z.rule === x).length])); return { w: kindWord(g[0].n), g, c, tot: K.reduce((a, x) => a + c[x], 0), seen: d.filter(z => z.seen != null).length, n: d.length }; }).sort((a, b) => b.tot - a.tot);
const maxT = Math.max(...kinds.map(k => k.tot));
$('#kinds').innerHTML = `<thead><tr><th>Kind</th><th>Sent</th><th>People, by route</th><th>Seen</th></tr></thead><tbody>${kinds.map(k => `<tr><td>${k.w}</td><td class="n">${k.g.length}</td><td><div class="bar" style="width:${(k.tot / maxT * 100).toFixed(1)}%">${K.filter(x => k.c[x]).map((x, i) => `<i class="k-${x}" style="flex:${k.c[x]};transition-delay:calc(${i} * var(--motion-instant))" title="${k.c[x]} ${KW[x]}"></i>`).join('')}</div></td><td class="n">${k.n ? `${k.seen}/${k.n}` : '—'}</td></tr>`).join('')}</tbody>`;
$('#leg').innerHTML = K.map(k => `<span><i class="k-${k}"></i>${KW[k]}</span>`).join('');
const groups = {}; rs.filter(r => r.blocked).forEach(r => { const g = r.blocked.rule + (r.n.to.team || ''); (groups[g] = groups[g] || []).push(r); });
const adminP = Object.keys(DATA.people).find(id => P(id).admin === 'department');
$('#ret').innerHTML = Object.values(groups).map(g => { const r = g[0], fixer = r.blocked.rule === 'permission' ? adminP : DATA.teams[r.n.to.team].lead; return `<div class="ret">${ruleChip(r.blocked.rule)} ${g.length} × “${r.n.title}”<small>${r.blocked.why}</small><div class="row"><b>${g.reduce((a, x) => a + x.blocked.would, 0)}</b><small>people never told</small><button class="btn sm">${I('send', 12)} Ask ${first(P(fixer).name)}</button></div></div>`; }).join('') +
  (rs.some(r => !r.n.key) ? `<div class="ret note">${I('key-round', 12)} ${rs.filter(r => !r.n.key).length} sent without a key<small>A retry would tell everyone again.</small></div>` : '');
/* the dry run, inline */
const ADDR = [['rota', 'whoever is on call', 'team', { rota: true }], ['team', `everyone on ${DATA.teams[DATA.rota.team].name}`, 'team', { team: DATA.rota.team }], ['dept', `everyone on ${DATA.floors.department.name}`, 'department', { team: 'department' }]];
$('#kind').innerHTML = Object.entries(app.kinds).map(([k, w]) => `<option value="${k}">${w}</option>`).join('');
$('#lev').innerHTML = [['needs', 'Needs you'], ['urgent', 'Urgent'], ['done', 'Done'], ['info', 'Info']].map(([k, w]) => `<option value="${k}">${w}</option>`).join('');
$('#addr').innerHTML = ADDR.map(([k, w]) => `<option value="${k}">${w}</option>`).join('');
let seq = 0;
function dry() {
  const ad = ADDR.find(a => a[0] === $('#addr').value), lv = $('#lev').value;
  const n = { id: 'dryc' + (seq++), at: 'Wed 10:00', app: APP, level: lv === 'urgent' ? 'needs' : lv, urgent: lv === 'urgent', title: 'dry run', floor: ad[2], to: ad[3], key: `${$('#kind').value}:dry${seq}`, out: {} };
  const r = route(n);
  if (r.blocked) { $('#verdict').className = 'verdict stop'; $('#verdict').innerHTML = `<b>Would reach nobody.</b> ${r.blocked.why}`; return; }
  const f = r.deliveries.filter(d => d.step === 0), held = f.filter(d => d.held || d.rule === 'record').length, more = r.deliveries.length - f.length;
  $('#verdict').className = 'verdict'; $('#verdict').innerHTML = `At Wed 10:00: <b>${f.length - held} at once</b>${held ? `, ${held} later` : ''}${more ? `; if nobody takes it, ${more} more by ${at(Math.max(...r.deliveries.map(d => d.told)))}` : ''}. ${n.urgent ? `Uses 1 of ${app.urgent.perWeek} urgent.` : ''}`;
}
$$('.dry select').forEach(s => s.addEventListener('change', dry));
function play() { clearLater(); document.body.classList.add('pre'); document.body.classList.remove('drawn'); $('#kind').value = Object.keys(app.kinds)[1]; $('#lev').value = 'info'; $('#addr').value = 'dept'; dry(); Icons.hydrate(document.body); later(() => document.body.classList.remove('pre'), 60); later(() => { document.body.classList.add('drawn'); $('#addr').value = 'team'; dry(); }, 1200); }
document.addEventListener('keydown', e => { if (e.target.closest('select')) return; commonKeys(e, play); });
Icons.hydrate(document.body); play();
</script></body></html>
