<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-shot-wait" content="4600">
<title>Combined · V1 The week replayed</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 25rem;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3) var(--space-4);height:100%}
.hd{grid-column:1 / -1;display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap}
.hd .title{font-size:var(--type-heading);line-height:var(--leading-heading)}
.clock{margin-left:auto;display:flex;align-items:baseline;gap:var(--space-3);font:300 var(--type-title-s)/1 var(--font-mono);color:var(--light)}
.clock small{font-size:var(--type-small);color:var(--ink-muted)}
.ctl{display:flex;gap:var(--space-1)}
.ctl .btn{padding:0 var(--space-3)}
.counts{grid-column:1 / -1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:var(--space-2)}
.counts div{border-top:1px solid var(--hairline-strong);padding-top:var(--space-1)}
.counts b{display:block;font:300 var(--type-heading)/1.1 var(--font-mono);color:var(--light)}
.counts span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.counts .warn b{color:var(--x-proposed-blocked)}
.counts .urg b{color:var(--danger)}
.chart{position:relative;min-height:0}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart text{font-family:var(--font-sans);font-size:var(--type-small);fill:var(--ink)}
.chart text.m{font-family:var(--font-mono);font-size:var(--x-proposed-type-micro);fill:var(--ink-muted)}
.chart .night{fill:color-mix(in srgb,var(--slate-deep) 85%,transparent)}
.chart .awayb{fill:url(#hh)}
.chart .lane{fill:color-mix(in srgb,var(--slate) 75%,var(--navy) 6%)}
.chart .oncall{stroke:var(--floor-team-high);stroke-width:2;opacity:.75}
.chart .drop{stroke:var(--ink-muted);stroke-width:1;opacity:.35}
.chart .drop.needs{stroke:var(--x-proposed-lit);opacity:.55}
.chart .drop.urgent{stroke:var(--danger);opacity:.8}
.chart .drop.stop{stroke:var(--x-proposed-blocked);stroke-dasharray:2 3;opacity:.7}
.chart .esc{stroke:var(--x-proposed-lit);stroke-width:1.5;fill:none;stroke-dasharray:3 3}
.chart .heldr{fill:url(#hh);opacity:.9}
.chart .dot{fill:var(--ink)}
.chart .dot.needs{fill:var(--x-proposed-lit)}
.chart .dot.failed{fill:var(--danger)}
.chart .dot.urgent{fill:var(--danger)}
.chart .dot.record{fill:none;stroke:var(--info);stroke-width:1.5}
.chart .dot.card{fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2}
.chart .acted{fill:none;stroke:var(--x-proposed-lit);stroke-width:1.5}
.chart .sent{stroke:var(--slate-deep);stroke-width:1}
.chart .sent.stop{fill:var(--x-proposed-blocked)}
.chart .now{stroke:var(--light);stroke-width:1;opacity:.8}
.chart .hit{cursor:pointer}
.chart .later{opacity:0}
.chart .dim{opacity:.18}
.chart .sel{opacity:1}
.side{display:flex;flex-direction:column;gap:var(--space-2);min-height:0;min-width:0;overflow:auto;overflow-x:hidden;padding:var(--space-3) var(--space-4)}
.side .rcpt{flex-wrap:wrap;gap:var(--space-1) var(--space-3)}
.side h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.rt{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.rt li{font-size:var(--type-small);line-height:var(--leading-small);padding:var(--space-2) 0;border-top:1px solid var(--hairline)}
.rt li .who{font-size:var(--type-meta)}
.rt li .r{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;margin:2px 0}
.rt li p{color:var(--ink)}
.rt li.stop{border-left:2px solid var(--x-proposed-blocked);padding-left:var(--space-2)}
.side .steps{font:400 var(--type-small)/1.5 var(--font-mono);color:var(--ink-muted)}
@media (max-width:1400px){.wrap{grid-template-columns:minmax(0,1fr) 20rem}.counts span{font-size:var(--x-proposed-type-micro)}}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <div class="hd"><p class="eyebrow">Replay</p><h1 class="title" id="h"></h1>
      <div class="ctl"><button class="btn sm" id="play">${'play'}</button><button class="btn sm" data-sp="1">1×</button><button class="btn sm" data-sp="4">4×</button><button class="btn sm" data-sp="16">16×</button></div>
      <span class="clock" id="clock"></span></div>
    <div class="counts" id="counts"></div>
    <div class="chart pane" id="chart"></div>
    <aside class="pane side" id="side" aria-live="polite"></aside>
  </div></main>
</div>
<div class="x-cap"><b>Combined · V1</b> the week replayed: every notice, every person, every route the rules took · train graphs (Marey), switchboard logs, flight progress boards</div>
<script>/*@DATA@*/
/*@LIB@*/
const TEAM = DATA.teams[DATA.rota.team];
const LANES = [...TEAM.members, ...Object.keys(DATA.people).filter(p => !TEAM.members.includes(p) && forPerson(p).length)];
const RS = ALL().sort((a, b) => a.t - b.t);
let NOW = 0, SEL = null, playing = false, speed = 4, raf = null, last = 0;
$('#top').innerHTML = topHTML([TEAM.name, 'Notices', 'Replay'], [['Space', 'play'], ['←→', 'notice'], ['1 2 3', 'speed'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
$('#h').textContent = `${DATA.week.label}: ${RS.length} notices through the routing rules`;
const G = {};
function layout() {
  const b = $('#chart').getBoundingClientRect();
  G.W = b.width; G.H = b.height; G.L = 120; G.R = 12; G.top = 30; G.appH = 34; G.stopH = 26; G.axis = 18;
  G.laneH = (G.H - G.top - G.appH - G.stopH - G.axis - 12) / LANES.length;
  G.x = t => G.L + (Math.min(t, WEEK_END) / WEEK_END) * (G.W - G.L - G.R);
  G.yApp = G.top + G.appH / 2; G.yStop = G.top + G.appH + LANES.length * G.laneH + G.stopH / 2;
  G.y = p => G.top + G.appH + LANES.indexOf(p) * G.laneH + G.laneH / 2;
}
function draw() {
  layout();
  let s = `<defs><pattern id="hh" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--ink-muted)" stroke-width="1.4" opacity=".55"/></pattern></defs>`;
  DATA.week.days.forEach((d, i) => { s += `<text class="m" x="${G.x(i * DAY) + 4}" y="12">${d}</text><line x1="${G.x(i * DAY)}" x2="${G.x(i * DAY)}" y1="16" y2="${G.H - G.axis}" stroke="var(--hairline)"/>`; });
  s += `<text x="8" y="${G.yApp + 4}">Apps</text><text x="8" y="${G.yStop + 4}" style="fill:var(--x-proposed-blocked)">Never told</text>`;
  LANES.forEach(p => {
    const y0 = G.y(p) - G.laneH / 2, h = H(p);
    s += `<rect class="lane" x="${G.L}" y="${y0 + 1}" width="${G.W - G.L - G.R}" height="${G.laneH - 2}" rx="2"/>`;
    for (let d = 0; d < 7; d++) { if (!h.days.includes(d)) s += `<rect class="night" x="${G.x(d * DAY)}" y="${y0 + 1}" width="${G.x(DAY) - G.x(0)}" height="${G.laneH - 2}"/>`; else { s += `<rect class="night" x="${G.x(d * DAY)}" y="${y0 + 1}" width="${G.x(h.from) - G.x(0)}" height="${G.laneH - 2}"/><rect class="night" x="${G.x(d * DAY + h.to)}" y="${y0 + 1}" width="${G.x(DAY - h.to) - G.x(0)}" height="${G.laneH - 2}"/>`; } }
    const a = P(p).away; if (a) s += `<rect class="awayb" x="${G.x(tm(a.from))}" y="${y0 + 1}" width="${G.x(Math.min(tm(a.to), WEEK_END)) - G.x(tm(a.from))}" height="${G.laneH - 2}"/>`;
    DATA.rota.byDay.forEach((q, d) => { if (q === p) s += `<line class="oncall" x1="${G.x(d * DAY)}" x2="${G.x((d + 1) * DAY)}" y1="${y0 + G.laneH - 2}" y2="${y0 + G.laneH - 2}"/>`; });
    s += `<text x="8" y="${G.y(p) + 4}">${P(p).name}</text>`;
  });
  RS.forEach(r => {
    const id = r.n.id, cls = r.blocked ? 'stop' : r.cls;
    if (r.blocked) s += `<g class="ev" data-id="${id}" data-t="${r.t}"><line class="drop stop" x1="${G.x(r.t)}" x2="${G.x(r.t)}" y1="${G.yApp}" y2="${G.yStop}"/><circle class="sent stop" cx="${G.x(r.t)}" cy="${G.yStop}" r="3.5"/></g>`;
    r.deliveries.forEach(d => {
      const from = d.via === 'escalation' || d.via === 'cover' ? (r.deliveries.filter(x => x.told <= d.sent && x !== d).pop() || r.deliveries[0]) : null;
      const yFrom = from ? G.y(from.p) : G.yApp;
      let g = `<line class="${from ? 'esc' : 'drop ' + cls}" x1="${G.x(d.sent)}" x2="${G.x(d.sent)}" y1="${yFrom}" y2="${G.y(d.p)}"/>`;
      if (d.held) g += `<rect class="heldr" x="${G.x(d.sent)}" y="${G.y(d.p) - 3}" width="${Math.max(1, G.x(d.told) - G.x(d.sent))}" height="6"/>`;
      if (d.rule === 'record') g += `<line class="drop" x1="${G.x(d.sent)}" x2="${G.x(d.edition)}" y1="${G.y(d.p)}" y2="${G.y(d.p)}" stroke-dasharray="1 3"/>`;
      const tt = d.rule === 'record' ? d.edition : d.told;
      g += `<circle class="dot ${d.rule === 'record' ? 'record' : d.rule === 'away' ? 'card' : r.cls === 'urgent' ? 'urgent' : r.n.level}" cx="${G.x(tt)}" cy="${G.y(d.p)}" r="${r.cls === 'needs' || r.cls === 'urgent' ? 4 : 3}"/>`;
      if (d.acted != null) g += `<circle class="acted" cx="${G.x(d.acted)}" cy="${G.y(d.p)}" r="6.5"/>`;
      s += `<g class="ev" data-id="${id}" data-t="${d.sent}">${g}</g>`;
    });
    s += `<g class="ev hit" data-id="${id}" data-t="${r.t}"><circle class="sent dot ${cls === 'stop' ? '' : cls === 'urgent' ? 'urgent' : r.n.level}" cx="${G.x(r.t)}" cy="${G.yApp}" r="5"/><title>${at(r.t)} · ${r.n.title}</title></g>`;
  });
  s += `<line class="now" id="now" x1="0" x2="0" y1="16" y2="${G.H - G.axis}"/>`;
  $('#chart').innerHTML = `<svg viewBox="0 0 ${G.W} ${G.H}" role="img" aria-label="A week of notices on ${TEAM.name}">${s}</svg>`;
  $$('#chart .hit').forEach(g => g.addEventListener('click', () => select(g.dataset.id)));
  update();
}
function counts() {
  const rs = RS.filter(r => r.t <= NOW), ds = rs.flatMap(r => r.deliveries).filter(d => d.sent <= NOW);
  const C = [['Notices', rs.length], ['Told live', ds.filter(d => d.rule === 'live' && d.told <= NOW).length], ['Held for hours', ds.filter(d => d.rule === 'quiet').length], ['Into editions', ds.filter(d => d.rule === 'record').length], ['On a card (away)', ds.filter(d => d.rule === 'away').length], ['List only (muted)', ds.filter(d => d.rule === 'muted').length], ['Asked next', ds.filter(d => d.via === 'escalation' || d.via === 'cover').length], ['Taken or acted', rs.filter(r => r.resolved != null && r.resolved <= NOW).length], ['Never told', rs.filter(r => r.blocked).length, 'warn'], ['Urgent', rs.filter(r => r.cls === 'urgent').length, 'urg']];
  $('#counts').innerHTML = C.map(([w, n, c]) => `<div class="${c || ''}"><b>${n}</b><span>${w}</span></div>`).join('');
}
function update() {
  $$('#chart .ev').forEach(g => { g.classList.toggle('later', +g.dataset.t > NOW); g.classList.toggle('dim', SEL && g.dataset.id !== SEL && +g.dataset.t <= NOW); });
  const nw = $('#now'); if (nw) { nw.setAttribute('x1', G.x(NOW)); nw.setAttribute('x2', G.x(NOW)); }
  $('#clock').innerHTML = `${hhmm(Math.min(NOW, WEEK_END - 1))}<small>${DATA.week.days[Math.min(6, dayOf(NOW))]}</small>`;
  counts();
}
function side() {
  if (!SEL) { $('#side').innerHTML = `<p class="eyebrow">Every route</p><p class="meta">Pick a notice on the Apps line, or press ← → to step through them. Each line in its route says who, by which rule, on which channel, and what they did.</p>`; return; }
  const r = route(SEL), n = r.n;
  const items = r.blocked ? `<li class="stop">${ruleChip(r.blocked.rule)}<p>${r.blocked.why}</p><p class="muted">${r.blocked.would} ${r.blocked.would === 1 ? 'person' : 'people'} would have been told.</p></li>`
    : r.deliveries.map(d => `<li><span class="r">${who(d.p)} ${ruleChip(d.rule)}</span><span class="r">${d.ch.map(c => chip(c)).join('')}</span><p>${viaWords(d).replace("and you hold it", "and holds it").replace(/\byou\b/g, first(P(d.p).name)).replace(/^You/, first(P(d.p).name))} ${d.held ? `Held until ${at(d.told)}.` : d.rule === 'record' ? `Edition ${at(d.edition)}.` : ''}</p><span class="r">${rcpt(d)}</span>${d.passed != null ? `<p class="muted">Passed on ${hhmm(d.passed)}: “${d.note}”</p>` : ''}${d.stoodDown != null ? `<p class="muted">Stood down ${at(d.stoodDown)}.</p>` : ''}</li>`).join('');
  $('#side').innerHTML = `<p class="eyebrow">${at(r.t)} · ${A(n.app).name}</p><h2>${n.title}</h2><p>${lvl(n)} <span class="small muted">${CLASSES[r.cls].word} · to ${addressOf(n).words.replace('you by name', P(n.to.people?.[0] || DATA.me).name + ' by name')}</span></p>
    ${r.steps.length > 1 ? `<p class="steps">${r.steps.map(s => s.skipped ? `${s.who}: skipped` : `${s.who === 'addressed' ? 'named' : s.who} ${s.people ? first(P(s.people[0]).name) : ''} ${hhmm(s.at)}`).join(' → ')}</p>` : ''}
    <ul class="rt">${items}</ul><p class="tk">${n.id} · key ${n.key || '—'} · ${JSON.stringify(n.to)}</p>`;
  Icons.hydrate($('#side'));
}
function select(id) { SEL = id; side(); update(); }
function step(k) { const i = RS.findIndex(r => r.n.id === SEL); const j = Math.max(0, Math.min(RS.length - 1, (i < 0 ? RS.findIndex(r => r.t > NOW) - 1 : i) + k)); const r = RS[j]; if (r.t > NOW) NOW = r.t; select(r.n.id); }
function tick(ts) { if (!playing) return; const dt = last ? ts - last : 0; last = ts; NOW = Math.min(WEEK_END, NOW + dt * speed * 0.5); const cur = RS.filter(r => r.t <= NOW).pop(); if (cur && cur.n.id !== SEL) { SEL = cur.n.id; side(); } update(); if (NOW >= WEEK_END) { playing = false; btn(); return; } raf = requestAnimationFrame(tick); }
function btn() { $('#play').innerHTML = `${I(playing ? 'pause' : 'play', 14)} ${playing ? 'pause' : 'play'}`; $$('[data-sp]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.sp === speed)); }
function setPlay(v) { playing = v; last = 0; btn(); if (v) raf = requestAnimationFrame(tick); else cancelAnimationFrame(raf); }
$('#play').addEventListener('click', () => setPlay(!playing));
$$('[data-sp]').forEach(b => b.addEventListener('click', () => { speed = +b.dataset.sp; btn(); }));
/* the moment: run the week fast to the hour the survey plan climbs, then stop on it */
function play() {
  clearLater(); setPlay(false); NOW = 0; SEL = null; document.body.classList.add('pre'); draw(); side(); btn();
  later(() => document.body.classList.remove('pre'), 60);
  const target = tm('Wed 12:30'), dur0 = reduced ? 1 : 2400, t0 = performance.now() + 1200;
  later(() => { const run = ts => { const k = Math.min(1, (ts - t0) / dur0); NOW = target * k; const cur = RS.filter(r => r.t <= NOW).pop(); SEL = cur ? cur.n.id : null; update(); if (k < 1) requestAnimationFrame(run); else { select('n16'); } }; requestAnimationFrame(run); }, 1200);
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, play)) return;
  if (e.key === ' ') { e.preventDefault(); setPlay(!playing); }
  if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1);
  if (['1', '2', '3'].includes(e.key)) { speed = [1, 4, 16][+e.key - 1]; btn(); }
});
addEventListener('resize', draw);
Icons.hydrate(document.body); play();
</script></body></html>
