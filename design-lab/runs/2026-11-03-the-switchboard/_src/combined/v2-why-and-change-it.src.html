<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Combined · V2 Why, and change it here</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-columns:22rem minmax(0,1fr) 24rem;gap:var(--space-4);height:100%}
.list{display:flex;flex-direction:column;min-height:0}
.items{list-style:none;margin:var(--space-2) 0 0;padding:0;overflow:auto;min-height:0}
.item{padding:var(--space-2) var(--space-2);border-bottom:1px solid var(--hairline);cursor:pointer;border-radius:var(--radius-key)}
.item:hover{background:var(--surface-inset)}
.item[aria-selected="true"]{background:var(--surface-raised)}
.item .ti{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{display:flex;gap:var(--space-2);align-items:center;font:400 var(--x-proposed-type-micro)/1.4 var(--font-mono);letter-spacing:var(--tracking-soft);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap;overflow:hidden}
.pm .ring{border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:0 var(--space-2);color:var(--ink)}
.pm .ring.h{background:var(--x-proposed-held)}
.mid{display:flex;flex-direction:column;gap:var(--space-3);min-height:0;overflow:auto}
.because{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.hops{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.hop{display:grid;grid-template-columns:6.5rem var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);color:var(--ink)}
.hop .t{font-family:var(--font-mono);color:var(--ink-muted);text-align:right}
.hop .ic{color:var(--ink-muted);display:flex;justify-content:center}
.hop.me{background:var(--x-proposed-lit-wash)}
.hop.me .ic{color:var(--x-proposed-lit)}
.hop.after{opacity:.4}
.chg{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);min-height:0;overflow:auto}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:center;padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline)}
.opt .w{font-size:var(--type-meta);line-height:var(--leading-meta)}
.opt .w small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.sw{width:calc(var(--space-6) - var(--space-2));height:var(--space-5);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);position:relative;background:var(--slate-deep)}
.sw::after{content:"";position:absolute;top:calc(var(--space-1) - 1px);left:calc(var(--space-1) - 1px);width:calc(var(--space-5) - var(--space-2));height:calc(var(--space-5) - var(--space-2));border-radius:50%;background:var(--ink-muted);transition:transform var(--motion-quick) var(--ease-out),background var(--motion-quick)}
.sw[aria-checked="true"]{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.sw[aria-checked="true"]::after{transform:translateX(calc(var(--space-6) - var(--space-2) - var(--space-5)));background:var(--x-proposed-lit)}
.sw[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.prev{border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);padding:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta)}
.prev.changed{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.prev .chs{display:flex;gap:var(--space-1);flex-wrap:wrap;margin:var(--space-2) 0}
.tal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.tal b{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light);text-align:right}
.tal .d{color:var(--x-proposed-lit);font-family:var(--font-mono)}
.acts{display:flex;gap:var(--space-2)}
@media (max-width:1400px){.wrap{grid-template-columns:18rem minmax(0,1fr) 20rem}.hop{grid-template-columns:5.5rem var(--space-4) minmax(0,1fr)}}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <section class="list"><p class="eyebrow">Your notifications, with postmarks</p><ul class="items" id="items" role="listbox" aria-label="Notifications"></ul></section>
    <section class="mid" id="mid" aria-live="polite"></section>
    <aside class="pane chg" id="chg"></aside>
  </div></main>
</div>
<div class="x-cap"><b>Combined · V2</b> why, and change it here: postmark, trace and a preview of your own settings on the notice in front of you · Why V1, V2, V3 · My switchboard V3</div>
<script>/*@DATA@*/
/*@LIB@*/
const ME = DATA.me, ds = mine(ME);
let sel = ds.findIndex(d => d.via === 'escalation');
const S0 = () => ({ mute: P(ME).muted.includes(ds[sel].n.app), toast: P(ME).toasts.includes(ds[sel].n.level), to: P(ME).hours.to });
let S;
$('#top').innerHTML = topHTML(['Notifications', 'Why you?'], [['↑↓', 'notice'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
const viaShort = d => ({ addressed: 'by name', team: 'team', rota: 'on call', role: 'your role', cover: 'cover', escalation: 'asked next' })[d.via];
$('#items').innerHTML = ds.map((d, i) => { const t = d.rule === 'record' ? d.edition : d.told; return `<li class="item" data-i="${i}" role="option" aria-selected="${i === sel}"><span class="ti">${d.n.title}</span><span class="pm"><span class="ring ${d.held || d.rule === 'record' ? 'h' : ''}">${dayName(t)} ${hhmm(t)}</span>${viaShort(d)} · ${CLASSES[classOf(d.n)].word}</span></li>`; }).join('');
function mid() {
  const d = ds[sel], r = route(d.n), Hs = hops(r, ME), me = Hs.findIndex(h => h.me && h.rule);
  $('#mid').innerHTML = `<p class="eyebrow">${A(d.n.app).name} · ${at(r.t)}</p><h1 class="heading">${d.n.title}</h1><p class="because">${viaWords(d)} ${ruleWords(d)}</p>
    <p class="eyebrow">How it reached you</p><ol class="hops">${Hs.map((h, i) => `<li class="hop ${h.me ? 'me' : ''} ${i > me && me >= 0 ? 'after' : ''}"><span class="t">${at(h.t)}</span><span class="ic">${I(h.icon, 14)}</span><span>${h.w}</span></li>`).join('')}</ol>`;
  Icons.hydrate($('#mid'));
}
function preview() {
  const d = ds[sel], n = d.n;
  const mod = D => { const q = D.people[ME]; q.muted = S.mute ? [...new Set([...q.muted, n.app])] : q.muted.filter(a => a !== n.app); q.toasts = S.toast ? [...new Set([...q.toasts, n.level])] : q.toasts.filter(l => l !== n.level); q.hours.to = S.to; };
  const after = whatIf(mod, () => { const x = route(n.id).deliveries.find(z => z.p === ME); const all = forPerson(ME); return { d: x ? { ch: x.ch, rule: x.rule, told: x.told, held: !!x.held, edition: x.edition, via: x.via } : null, live: all.filter(z => z.ch.includes('band') && !z.held).length, toast: all.filter(z => z.ch.includes('toast')).length, held: all.filter(z => z.held).length }; });
  const base = whatIf(() => { }, () => { const all = forPerson(ME); return { live: all.filter(z => z.ch.includes('band') && !z.held).length, toast: all.filter(z => z.ch.includes('toast')).length, held: all.filter(z => z.held).length }; });
  const changed = JSON.stringify(S) !== JSON.stringify(S0());
  const a = after.d;
  const dl = k => after[k] === base[k] ? '' : `<span class="d">${after[k] > base[k] ? '+' : ''}${after[k] - base[k]}</span>`;
  const onRota = d.via === 'rota' || d.via === 'escalation';
  $('#chg').innerHTML = `<p class="eyebrow">Change how this reaches you</p>
    <div class="opt"><span class="w">Mute ${A(n.app).name}<small>${n.level === 'needs' ? 'Needs you still reaches your Inbox; no pulse or toast.' : 'Its notices go to your list only.'}</small></span><button class="sw" role="switch" data-k="mute" aria-checked="${S.mute}"></button></div>
    <div class="opt"><span class="w">Toast for ${LEVELS[n.level].word.toLowerCase()}<small>A toast while you work, from any app.</small></span><button class="sw" role="switch" data-k="toast" aria-checked="${S.toast}"></button></div>
    <div class="opt"><span class="w">My day ends at <b class="num">${S.to}</b><small>After it, everything but urgent waits for your start.</small></span><span class="acts"><button class="btn sm" data-k="to-">${I('minus', 12)}</button><button class="btn sm" data-k="to+">${I('plus', 12)}</button></span></div>
    ${onRota ? `<div class="opt"><span class="w">On call ${dayName(d.sent)}<small>${P(DATA.rota.setBy).name}’s rota. Not yours to change.</small></span><button class="btn sm">${I('send', 12)} Ask to swap</button></div>` : ''}
    <div class="prev ${changed ? 'changed' : ''}"><p class="eyebrow">${changed ? 'With these settings, this notice' : 'This notice, as it was'}</p>${a ? `<div class="chs">${a.ch.map(c => chip(c)).join('')}</div><p>${a.held ? `Held until ${at(a.told)}.` : a.rule === 'record' ? `In your ${at(a.edition)} edition.` : `At ${at(a.told)}.`} ${a.rule === 'muted' && onRota ? 'You would still be asked: muting never takes you off a rota.' : ''}</p>` : '<p>You would not have been told.</p>'}</div>
    <p class="eyebrow">Last week, with these settings</p><div class="tal"><b>${after.live}</b><span>pulsed the band ${dl('live')}</span><b>${after.toast}</b><span>toasts ${dl('toast')}</span><b>${after.held}</b><span>waited for your start ${dl('held')}</span></div>
    <div class="acts"><button class="btn ${changed ? 'go' : ''}" ${changed ? '' : 'aria-disabled="true"'}>${I('check', 14)} Save</button><button class="btn" data-k="reset">Put back</button></div>`;
  Icons.hydrate($('#chg'));
}
$('#chg').addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k;
  if (k === 'mute' || k === 'toast') S[k] = !S[k];
  if (k === 'to-' || k === 'to+') { const m = mins(S.to) + (k === 'to+' ? 30 : -30); S.to = `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; }
  if (k === 'reset') S = S0();
  preview();
});
function pick(i) { sel = Math.max(0, Math.min(ds.length - 1, i)); $$('.item').forEach((x, k) => x.setAttribute('aria-selected', k === sel)); $(`.item[data-i="${sel}"]`).scrollIntoView({ block: 'nearest' }); S = S0(); mid(); preview(); }
$('#items').addEventListener('click', e => { const li = e.target.closest('.item'); if (li) pick(+li.dataset.i); });
function play() { clearLater(); document.body.classList.add('pre'); pick(ds.findIndex(d => d.via === 'escalation')); later(() => document.body.classList.remove('pre'), 60); later(() => { S.mute = true; preview(); }, 1200); }
document.addEventListener('keydown', e => { if (commonKeys(e, play)) return; if (e.key === 'ArrowDown') { e.preventDefault(); pick(sel + 1); } if (e.key === 'ArrowUp') { e.preventDefault(); pick(sel - 1); } });
Icons.hydrate(document.body); play();
</script></body></html>
