<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-shot-wait" content="4400">
<title>Combined · V3 Escalation with handover</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>/*@CSS@*/
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto auto minmax(0,1fr);gap:var(--space-3) var(--space-4);height:100%}
.hd{grid-column:1 / -1;display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap}
.hd .now{margin-left:auto;font:300 var(--type-title-s)/1 var(--font-mono);color:var(--light)}
.hd .now small{font-size:var(--type-small);color:var(--ink-muted);margin-left:var(--space-2)}
.bays{grid-column:1 / -1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-2)}
.bay{padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);display:flex;flex-direction:column;gap:var(--space-1);min-height:calc(var(--target-md) * 2);transition:border-color var(--motion-base),background var(--motion-base),opacity var(--motion-base)}
.bay small{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.bay .st{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);margin-top:auto}
.bay.holds{border-color:var(--hairline-strong);background:var(--surface-raised)}
.bay.holds .st{color:var(--light)}
.bay.offer{border-color:var(--x-proposed-lit);border-style:dashed}
.bay.offer .st{color:var(--x-proposed-lit)}
.bay.took{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.bay.took .st{color:var(--x-proposed-lit)}
.bay.not{opacity:.45}
.bay.down{opacity:.6}
.scrub{grid-column:1 / -1;position:relative;height:calc(var(--target-md) + var(--space-4));border-radius:var(--radius-key);background:color-mix(in srgb,var(--slate-deep) 50%,transparent)}
.scrub .seam{position:absolute;top:0;bottom:0;width:var(--space-3);margin-left:calc(var(--space-3) / -2);background:var(--x-proposed-night);border-left:1px dashed var(--hairline-strong);border-right:1px dashed var(--hairline-strong)}
.scrub .hop{position:absolute;top:50%;transform:translate(-50%,-50%);width:var(--space-5);height:var(--space-5);border-radius:50%;background:var(--slate-deep);border:1px solid var(--hairline-strong);display:flex;align-items:center;justify-content:center;color:var(--ink-muted)}
.scrub .hop[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--x-proposed-lit)}
.scrub .lab{position:absolute;bottom:2px;transform:translateX(-50%);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.scrub .line{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--x-proposed-lit);transition:left var(--motion-base) var(--ease-standard)}
.scrub .lim{position:absolute;top:0;bottom:0;border-left:1px solid var(--warning)}
.scrub .lim span{position:absolute;top:2px;left:var(--space-1);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--warning);white-space:nowrap}
.say{grid-column:1 / -1;font-size:var(--type-meta);line-height:var(--leading-meta)}
.say b{font-weight:400;color:var(--light)}
.pane.box{padding:var(--space-3) var(--space-4);overflow:auto;min-height:0}
table{border-collapse:collapse;width:100%;font-size:var(--type-small);line-height:var(--leading-small);margin-top:var(--space-2)}
th{font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:var(--space-1);border-bottom:1px solid var(--hairline-strong)}
td{padding:var(--space-1);border-bottom:1px solid var(--hairline)}
td.mono{font-family:var(--font-mono);white-space:nowrap}
tr.this td{background:var(--x-proposed-lit-wash)}
.f{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);margin-top:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}
.f .l{display:flex;align-items:center;justify-content:center;width:var(--space-5);height:var(--space-5);border:1px solid var(--x-proposed-lit);border-radius:var(--radius-key);font:400 var(--type-meta)/1 var(--font-mono);color:var(--x-proposed-lit)}
.f .k{display:block;font:400 var(--x-proposed-type-micro)/1.3 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.f .auto{color:var(--ink-muted);font-style:italic}
</style></head><body class="pre">
<div class="app-frame">
  <div id="top"></div>
  <main class="main"><div class="wrap">
    <div class="hd"><p class="eyebrow">Escalation</p><h1 class="heading" id="h"></h1><span class="now" id="now"></span></div>
    <div class="bays" id="bays"></div>
    <div class="scrub" id="scrub"></div>
    <p class="say" id="say"></p>
    <section class="pane box" id="board"></section>
    <section class="pane box" id="note"></section>
  </div></main>
</div>
<div class="x-cap"><b>Combined · V3</b> escalation with handover: who holds it, who is offered it, the working clock, the team board and the handover note · Escalation V1–V5</div>
<script>/*@DATA@*/
/*@LIB@*/
const ME = DATA.me, r = route('n16'), n = r.n;
const HOPS = hops(r, ME).filter(h => !h.quiet || /saw it/.test(h.w));
let k = 0;
const admin = Object.keys(DATA.people).find(id => P(id).admin === 'department');
const BAYS = [...r.deliveries.map(d => ({ p: d.p, d })), { p: admin, d: null }];
$('#top').innerHTML = topHTML(['Inbox', n.title, 'Escalation'], [['←→', 'step'], ['R', 'replay'], ['T', 'technical words', 'h-t']]);
$('#h').textContent = n.title;
/* the working clock, as the scrubber: nights fold */
const t0 = r.t, t1 = addWork(TEAMH, r.acted.acted, 60);
const segs = []; { let t = t0; while (t < t1) { const s = Math.max(t, dayOf(t) * DAY + TEAMH.from), e = Math.min(t1, dayOf(t) * DAY + TEAMH.to); if (e > s && TEAMH.days.includes(dayOf(t) % 7)) segs.push([s, e]); t = nextStart(TEAMH, dayOf(t) * DAY + TEAMH.to); if (t <= s) break; } }
const tot = segs.reduce((a, [s, e]) => a + e - s, 0);
const X = tt => { let acc = 0; for (const [s, e] of segs) { if (tt < s) return acc / tot; if (tt <= e) return (acc + tt - s) / tot; acc += e - s; } return 1; };
const pc = tt => (2 + X(tt) * 96).toFixed(2) + '%';
function role(d) { if (!d) return 'Department admin'; if (d.via === 'addressed') return 'named'; if (d.via === 'cover') return `cover for ${first(P(d.coverFor).name)}`; const s = r.steps.find(x => x.k === d.step); return s.who === 'rota' ? `on call ${dayName(d.sent)}` : 'team lead'; }
function state(b, t) {
  const d = b.d; if (!d) { const nx = nextAsk(r, t); return nx && nx.people[0] === b.p ? ['not', `next, ${at(nx.at)}`] : ['not', 'not reached']; }
  if (d.told > t) return ['not', `not yet`];
  if (r.resolved != null && r.resolved <= t) return d.p === r.by ? ['took', r.acted.acted <= t ? `${r.acted.act.toLowerCase()} ${hhmm(r.acted.acted)}` : `has it since ${hhmm(r.resolved)}`] : ['down', `stood down ${hhmm(r.resolved)}`];
  if (d.passed != null && d.passed <= t) return ['down', `passed on ${hhmm(d.passed)}`];
  if (d.via === 'addressed') return ['holds', awayAt(d.p, t) ? 'owner · away' : 'owner'];
  return ['offer', d.seen != null && d.seen <= t ? `offered · seen ${hhmm(d.seen)}` : 'offered'];
}
function render() {
  const h = HOPS[k], t = h.t;
  $('#now').innerHTML = `${hhmm(t)}<small>${dayLong(t)}</small>`;
  $('#bays').innerHTML = BAYS.map(b => { const [c, w] = state(b, t); return `<div class="bay ${c}">${who(b.p)}<small>${role(b.d)}</small><span class="st">${w}</span></div>`; }).join('');
  $('#scrub').innerHTML = segs.slice(1).map(s => `<span class="seam" style="left:${pc(s[0])}"></span>`).join('') + `<span class="lim" style="left:${pc(tm(n.limit))}"><span>limit ${hhmm(tm(n.limit))}</span></span>` + HOPS.map((x, i) => `<button class="hop" data-i="${i}" style="left:${pc(x.t)}" aria-pressed="${i === k}" title="${at(x.t)}: ${x.w.replace(/"/g, '')}">${I(x.icon, 12)}</button>`).join('') + `<span class="line" style="left:${pc(t)}"></span><span class="lab" style="left:${pc(segs[0][0])}">${at(segs[0][0])}</span>${segs.slice(1).map(s => `<span class="lab" style="left:${pc(s[0])}">${dayName(s[0])} ${hhmm(s[0])}</span>`).join('')}`;
  $('#say').innerHTML = `<b>${at(t)}</b> · ${h.w}`;
  /* the team board at this moment */
  const rows = ALL().filter(x => (x.cls === 'needs') && x.t <= t && !(x.acted && x.acted.acted <= t) && x.deliveries.some(d => DATA.teams[DATA.rota.team].members.includes(d.p)));
  $('#board').innerHTML = `<p class="eyebrow">The team board at ${hhmm(t)}</p><table><thead><tr><th>Item</th><th>With</th><th>Next ask</th></tr></thead><tbody>${rows.map(x => { const taken = x.resolved != null && x.resolved <= t; const withP = taken ? [x.by] : x.deliveries.filter(d => d.told <= t && !(d.passed != null && d.passed <= t)).map(d => d.p); const nx = taken ? null : nextAsk(x, t); return `<tr class="${x === r ? 'this' : ''}"><td>${x.n.title}</td><td>${withP.map(p => who(p, { first: true })).join(', ') || '<span class="muted">held</span>'}</td><td class="mono">${taken ? 'taken' : nx ? `${first(P(nx.people[0]).name)} ${at(nx.at)}` : '—'}</td></tr>`; }).join('')}</tbody></table>`;
  /* the handover note, when someone passes it on */
  const pd = r.deliveries.find(d => d.passed != null && d.passed <= t);
  if (pd && t >= pd.passed) {
    const prev = r.deliveries.filter(d => d.told < pd.told);
    $('#note').innerHTML = `<p class="eyebrow">Handover note from ${P(pd.p).name}, ${at(pd.passed)}</p>
      <div class="f"><span class="l">S</span><span><span class="k">Situation · from the trail</span><span class="auto">${n.title}. Limit ${at(tm(n.limit))}, passed.</span></span></div>
      <div class="f"><span class="l">B</span><span><span class="k">Background · from the trail</span><span class="auto">${prev.map(d => `${P(d.p).name} (${role(d)}) asked ${at(d.told)}, saw it ${hhmm(d.seen)}`).join('; ')}.</span></span></div>
      <div class="f"><span class="l">A</span><span><span class="k">Assessment · ${first(P(pd.p).name)}</span>${pd.note.split('. ')[1] || pd.note}</span></div>
      <div class="f"><span class="l">R</span><span><span class="k">Recommendation · ${first(P(pd.p).name)}</span>${pd.note.split('. ')[0]}.</span></div>`;
  } else {
    const nx = nextAsk(r, t);
    $('#note').innerHTML = `<p class="eyebrow">What happens next</p><p class="meta" style="margin-top:var(--space-2)">${r.resolved != null && r.resolved <= t ? `${P(r.by).name} has it. Nobody else is asked; everyone who was asked has been told so.` : nx ? `If nobody takes it, ${P(nx.people[0]).name} is asked at <b>${at(nx.at)}</b>. Anyone it was offered to can take it now, or pass it on with a note.` : 'Nobody else is asked.'}</p>`;
  }
  Icons.hydrate(document.body);
}
$('#scrub').addEventListener('click', e => { const b = e.target.closest('.hop'); if (b) { k = +b.dataset.i; render(); } });
function play() {
  clearLater(); k = 0; document.body.classList.add('pre'); render(); later(() => document.body.classList.remove('pre'), 60);
  const stop = HOPS.findIndex(h => /passed it on/.test(h.w));
  for (let i = 1; i <= stop; i++) later(() => { k = i; render(); }, 1200 + (i - 1) * 260);
}
document.addEventListener('keydown', e => { if (commonKeys(e, play)) return; if (e.key === 'ArrowRight') { k = Math.min(HOPS.length - 1, k + 1); render(); } if (e.key === 'ArrowLeft') { k = Math.max(0, k - 1); render(); } });
Icons.hydrate(document.body); play();
</script></body></html>
