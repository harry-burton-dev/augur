<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Bring in V5 · Decided by the file</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: the bench reads what the file itself decides, shows the evidence, and asks only what would change what lands ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--space-6)}
.col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.rd{list-style:none;margin:0;padding:0;display:grid;gap:0}
.rd li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--hairline)}
.rd li > svg{color:var(--ink-muted);margin-top:2px}
.rd .w{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.rd .ev{grid-column:2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rd .ev .rawv{font-size:var(--x-proposed-type-micro)}
.rd .ov{grid-row:1 / span 2;grid-column:3;align-self:start}
.ask{border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);padding:var(--space-4);display:grid;gap:var(--space-3);transition:border-color var(--motion-calm) var(--ease-out)}
.ask.lit{border-color:var(--x-proposed-lit)}
.ask .qq{font-size:var(--type-body);line-height:var(--leading-body);color:var(--light);margin:0}
.ask .why{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:0}
.opts{display:grid;gap:var(--space-2)}
.opt{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2);align-items:start;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta);text-align:left}
.opt:hover{background:var(--surface-raised)}
.opt[aria-pressed="true"]{border-color:var(--light);background:var(--surface-raised)}
.opt .c{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.opt small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.foot{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-top:1px solid var(--hairline-strong);padding-top:var(--space-3)}
.foot b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){.rd li{padding:var(--space-2) 0}.ask{padding:var(--space-3);gap:var(--space-2)}.opt{padding:var(--space-1) var(--space-2);font-size:var(--type-small);line-height:var(--leading-small)}.ask .qq{font-size:var(--type-meta);line-height:var(--leading-meta)}.rd .ev{font-size:var(--x-proposed-type-micro)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Bring in · V5</b> decided by the file: read what the evidence settles, ask only what changes what lands · reference interview, ask only what changes</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), PL = plate(R), F0 = R.file, H = R.header;
/* evidence for day first: dates whose first part can't be a month, or whose second part can't be */
const dmy = dataLinesOf(R).map(l => l.cells[H.indexOf(R.st.s7.col)]).filter(v => dateShape(v) === 'd/m/y');
const onlyDay = dmy.filter(v => +v.split('/')[0] > 12), onlyMonth = dmy.filter(v => +v.split('/')[1] > 12);
const serials = R.recs.filter(r => r.v.on.shape === 'serial');
const noYear = R.recs.filter(r => r.v.on.shape === 'd Mon');
const mi = dataLinesOf(R).map(l => l.cells[H.indexOf(R.st.s10.col)]).filter(v => /mi/i.test(v || '')), km = dataLinesOf(R).map(l => l.cells[H.indexOf(R.st.s10.col)]).filter(v => /km/i.test(v || ''));
const loan = PL.aside[0], ask = DATA.asked[0];
const S = { a1: null, a2: null, lit: false };
const READ = [
  { ic: 'calendar', w: 'Dates like 01/10/2026 are day first', ev: `${onlyDay.length} of ${dmy.length} only make sense day first (${onlyDay.slice(0, 3).map(raw).join(' ')}); ${onlyMonth.length} only make sense month first. The file decides.` },
  { ic: 'calendar-days', w: `Dates with no year are in ${STEP('s7').year}`, ev: `${noYear.map(r => raw(r.v.on.raw)).join(' ')}: every dated line that has a year says ${STEP('s7').year}, and so does the title.` },
  { ic: 'hash', w: 'Five-digit numbers in Date are the spreadsheet’s own day numbers', ev: `${serials.map(r => `${raw(r.v.on.raw)} is ${r.v.on.val}`).join(', ')}; each sits between its neighbours’ dates.` },
  { ic: 'gauge', w: 'Odometers are in miles', ev: `${mi.length} says ${mi.map(raw).join(' ')}; ${km.length} say km.` },
  { ic: 'copy', w: `Line ${PL.copies[0].n} is the same visit as line ${PL.copies[0].of}`, ev: `every cell matches, and ${R.total.said} visits in the TOTAL only works if it is counted once.` }
];
const Q = [
  { k: 'a1', q: `Line ${loan.n} says ${raw(loan.cells[0])} where a van number goes. What was it?`, why: `Its note: “${esc(loan.cells[loan.cells.length - 1])}”. ${FIRM.short} counted it in their ${R.total.said}. This changes what lands, so the bench won’t guess.`,
    o: [['aside', 'archive', `Set it aside and ask ${P(F0.from).name}`, 'kept in the tray, counted at the pass', `${PL.land} land`],
        ['new', 'plus', 'A van with no number', `proposes a new van in Triage; ${P('p2').name} would have to name it`, `${PL.land + 1} land`],
        ['skip', 'circle-slash', 'Not a visit we keep', 'set aside for good, with your reason', `${PL.land} land`]] },
  { k: 'a2', q: `${raw(H[H.indexOf('Type')])} holds ${ask.values.map(raw).join(' ')}. ${DATA.app} has no detail for it.`, why: `Every visit has one. Leaving it out loses it; keeping it needs a word only an admin can add.`,
    o: [['ask', 'message-circle-question-mark', `Ask ${P(ask.decides).name} for “${ask.word}”`, `kept in the note until then; filled in when the word exists`, `${PL.land} notes`],
        ['note', 'sticky-note', 'Keep it in the note', 'readable, but not something to count by', `${PL.land} notes`],
        ['leave', 'eye-off', 'Leave it out', 'the pass will list it as left out', '0']] }
];
function render() {
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, F0.name, 'First reading'], [['1–3', 'answer'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <section class="col"><div><h1 class="t">What the file settles by itself</h1><p class="lede" style="margin-top:var(--space-1)">The bench reads these without asking, because the file’s own values decide them. Each shows its evidence and can be overruled.</p></div>
      <ul class="rd">${READ.map((r, i) => `<li class="dep" style="--i:${i}">${I(r.ic, 16)}<span class="w">${r.w}</span><span class="ev">${r.ev}</span><button class="btn sm ov">Not so</button></li>`).join('')}</ul>
      <p class="foot"><b>Why it doesn’t ask about these:</b> a question whose answer is already in the file wastes a person’s time, and a person who is asked too much starts answering without reading. Each reading is still written into the recipe, so next month’s file has to agree with it.</p></section>
    <section class="col"><p class="eyebrow">${I('hand', 12)} Only you can answer · ${Q.filter(q => S[q.k]).length} of ${Q.length}</p>
      ${Q.map((q, qi) => `<div class="ask ${S.lit && !S[q.k] && Q.findIndex(x => !S[x.k]) === qi ? 'lit' : ''}"><p class="qq">${q.q}</p><p class="why">${q.why}</p>
        <div class="opts">${q.o.map(([id, ic, w, s, c], i) => `<button class="opt" data-q="${q.k}" data-o="${id}" aria-pressed="${S[q.k] === id}">${I(ic, 14)}<span>${w}<small>${s}</small></span><span class="c">${c}</span></button>`).join('')}</div></div>`).join('')}</section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('.opt').forEach(b => b.onclick = () => { S[b.dataset.q] = b.dataset.o; render(); });
}
function replay() { clearLater(); Object.assign(S, { a1: null, a2: null, lit: false }); document.body.classList.add('pre'); render(); settle(ms('--motion-quick')); later(() => { S.lit = true; render(); }, ms('--motion-run')); later(() => { S.a1 = 'aside'; render(); }, ms('--motion-run') + ms('--motion-calm')); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (/^[1-3]$/.test(e.key)) { const q = Q.find(x => !S[x.k]) || Q[Q.length - 1]; S[q.k] = q.o[+e.key - 1][0]; render(); }
});
replay();
</script>
</body>
</html>
