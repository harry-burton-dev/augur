<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Bring in V2 · The column shelf</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: one card per column, on a shelf: what kind of value, in how many shapes, what's odd ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.head{display:flex;align-items:flex-end;gap:var(--space-5);flex-wrap:wrap}
.shelf{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--space-3);min-height:0;align-items:stretch;border-bottom:2px solid var(--hairline-strong);padding-bottom:var(--space-3)}
.col{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset) var(--radius-inset) var(--radius-key) var(--radius-key);background:var(--surface-pane);min-height:0;overflow:hidden}
.col.odd{border-color:var(--hairline-strong)}
.col .nm{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.col .nm .letter{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.col .kind{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.col .kind svg{color:var(--ink-muted)}
.col .sum{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:0}
.shapes{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-1)}
.shapes li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-2);align-items:center;font:400 var(--x-proposed-type-micro)/var(--leading-small) var(--font-mono);color:var(--ink)}
.shapes li .ex{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shapes li .c{color:var(--ink-muted)}
.shapes li .bar{grid-column:1 / span 2;height:3px;border-radius:1px;background:var(--hairline);overflow:hidden}
.shapes li .bar i{display:block;height:100%;background:var(--ink-muted);width:calc(var(--w) * 100%);transform-origin:left;transition:transform var(--motion-calm) var(--ease-out)}
.shapes li.top1 .bar i{background:var(--light)}
.pre .shapes li .bar i{transform:scaleX(0)}
.flag{margin-top:auto;display:grid;grid-template-columns:var(--space-4) minmax(0,1fr);gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.flag svg{color:var(--x-proposed-disagree);margin-top:2px}
.flag.ok svg{color:var(--ink-muted)}
.below{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5);font-size:var(--type-meta);line-height:var(--leading-meta)}
.below p{margin:0}
.below b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.col{padding:var(--space-2)}.col .kind{font-size:var(--type-small)}.below{font-size:var(--type-small);line-height:var(--leading-small)}.shapes li:nth-child(n+5){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Bring in · V2</b> the column shelf: each column's kind of value, its shapes counted, what's odd · Wrangler and Trifacta profiles, a larder shelf</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), F0 = R.file, PL = plate(R);
/* what kind of value a column holds, guessed from its shapes. words from the bench, not the file */
function guess(p) {
  const vals = Object.keys(p.values);
  const share = f => vals.filter(f).reduce((a, v) => a + p.values[v].length, 0) / p.n;
  if (share(v => readVan(v)) > .8) return { k: 'van numbers', ic: 'truck' };
  if (share(v => readDate(v, 2026)) > .8) return { k: 'dates', ic: 'calendar' };
  if (share(v => readMiles(v) != null) > .8) return { k: 'readings', ic: 'gauge' };
  if (share(v => readResult(v)) > .8) return { k: 'results', ic: 'clipboard-check' };
  if (p.distinct <= 12 && p.blanks.length === 0) return { k: p.distinct <= 4 ? 'a few words' : 'names of places', ic: p.distinct <= 4 ? 'tags' : 'map-pin' };
  return { k: 'free text', ic: 'text' };
}
function flag(p, g) {
  if (g.k === 'van numbers') { const bad = Object.keys(p.values).filter(v => !readVan(v)); return { t: `${bad.length} value isn’t a van number: “${esc(bad[0])}”`, ok: false }; }
  if (g.k === 'dates') { const no = Object.keys(p.values).filter(v => dateShape(v) === 'd Mon').length; return { t: `${Object.keys(R.st.s7.shapes).length} shapes; ${no} with no year; ${p.shapes['99'] ? p.shapes['99'].lines.length : 0} spreadsheet day numbers`, ok: false }; }
  if (g.k === 'readings') { const bad = Object.keys(p.values).filter(v => readMiles(v) == null); return { t: `${bad.length} can’t be read: ${bad.map(v => `“${esc(v)}”`).join(', ')}`, ok: false }; }
  if (g.k === 'results') return { t: `${p.distinct} ways to write ${new Set(Object.keys(p.values).map(v => readResult(v)?.result)).size} results, with notes inside`, ok: false };
  if (g.k === 'names of places') return { t: `${p.distinct} spellings; they look like ${Object.keys(R.st.s8.groups).length} places`, ok: false };
  if (g.k === 'free text') return { t: `${p.blanks.length} of ${p.n} empty; that’s normal for notes`, ok: true };
  return { t: `${p.distinct} values, all filled`, ok: true };
}
function render() {
  const cards = R.header.map((h, i) => {
    const p = profile(R, h), g = guess(p), f = flag(p, g);
    const byValue = p.distinct <= 12;
    const sh = (byValue ? Object.entries(p.values).map(([ex, lines]) => ({ ex, lines })) : Object.values(p.shapes)).sort((a, b) => b.lines.length - a.lines.length);
    return `<section class="col ${f.ok ? '' : 'odd'} dep" style="--i:${i}"><div class="nm">${raw(h)}<span class="letter">${COLS[i]}</span></div>
      <span class="kind">${I(g.ic, 14)} ${g.k}</span>
      <p class="sum">${p.n - p.blanks.length} filled · ${p.distinct} different · by ${byValue ? 'value' : 'shape'}</p>
      <ul class="shapes">${sh.slice(0, 6).map((s, k) => `<li class="${k === 0 ? 'top1' : ''}"><span class="ex" title="${esc(s.ex)}">${esc(s.ex)}</span><span class="c">${s.lines.length}</span><span class="bar"><i style="--w:${s.lines.length / p.n}"></i></span></li>`).join('')}${sh.length > 6 ? `<li class="muted"><span>and ${sh.length - 6} more</span></li>` : ''}</ul>
      <p class="flag ${f.ok ? 'ok' : ''}">${f.ok ? I('check', 12) : I('eye', 12)}<span>${f.t}</span></p></section>`;
  });
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, F0.name], [['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div class="head"><div><h1 class="t">${R.header.length} columns on the shelf</h1><p class="lede" style="margin-top:var(--space-1)">${esc(F0.name)} · ${dataLinesOf(R).length} lines of visits under line ${STEP('s2').line}. Each column shows the kind of value the bench thinks it holds, and the shapes or values it comes in, most common first, with how many lines use each. Columns with a dozen values or fewer are listed by value; the rest by shape (“NV-01” stands for every AA-99).</p></div></div>
    <div class="shelf">${cards.join('')}</div>
    <div class="below"><p><b>Shapes, not errors.</b> “nv 03” isn’t wrong, it is a second way of writing the same thing. Each shape becomes one tidy step, taught by fixing one example.</p>
      <p><b>The kind is a guess, and says so.</b> “Names of places” isn’t yet a ${DATA.kinds.depot.word}; matching to what ${DATA.app} keeps comes later, after tidying.</p>
      <p><b>Above and below the shelf.</b> ${R.lines.filter(l => l.role === 'title').length} title lines, ${R.st.s4.aside.length} empty lines and the TOTAL line (“${R.total.said} visits”) aren’t columns; they wait on the first steps of the recipe.</p></div>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); document.body.classList.add('pre'); render(); settle(ms('--motion-run')); }
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
replay();
</script>
</body>
</html>
