<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Bring in V6 · Tasting spoons</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: not the first 20 lines, but the fewest lines that show every shape in the file ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(280px,1fr);gap:var(--space-6)}
.main-col{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.spoons{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2);min-height:0}
.sp{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) minmax(170px,.42fr);gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane)}
.sp .ln{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.sp .ln b{display:block;font:300 var(--type-heading)/1 var(--font-mono);color:var(--light);margin-bottom:var(--space-1)}
.cells{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.cells .rawv{opacity:.55}
.cells .rawv.first{opacity:1;border-color:var(--light);color:var(--light)}
.sp .why{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.sp .why b{font-weight:400;color:var(--ink)}
.cover{display:flex;align-items:center;gap:var(--space-3);font-size:var(--type-meta);color:var(--ink)}
.cover .bar{flex:1;height:var(--space-1);border-radius:var(--radius-pill);background:var(--hairline);overflow:hidden;display:flex}
.cover .bar i{height:100%;background:var(--ink-muted);border-right:1px solid var(--slate-deep);transition:opacity var(--motion-calm) var(--ease-out)}
.cover .bar i.new{background:var(--light)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.left{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.left span{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);color:var(--ink-muted)}
.side p{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.side p b{font-weight:400;color:var(--ink)}
.side .btn{align-self:flex-start}
@media (max-width:1400px){.sp{grid-template-columns:var(--space-5) minmax(0,1fr) minmax(150px,.45fr);padding:var(--space-1) var(--space-2)}.sp .ln b{font-size:var(--type-lead)}.sp .why{font-size:var(--x-proposed-type-micro);line-height:var(--leading-small)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Bring in · V6</b> tasting spoons: the fewest lines that show every shape in the file, not its first twenty · a chef tasting each pot, stratified sampling</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), F0 = R.file, H = R.header, L = dataLinesOf(R);
const SPOONS = 7;
/* a feature is a column's shape; for names of places and kinds the exact spelling matters, so it is the value */
const exact = new Set([R.st.s8.col, 'Type']), skip = new Set(['Notes']);
const feat = l => H.map((h, i) => { const v = String(l.cells[i] || '').trim(); if (skip.has(h)) return null; if (exact.has(h)) return `${h}␟${v}`; if (h === R.st.s7.col) return `${h}␟${dateShape(v) || shapeOf(v)}`; return `${h}␟${shapeOf(v)}`; });
const ALL = [...new Set(L.flatMap(l => feat(l).filter(Boolean)))];
function pick() {
  const left = new Set(ALL), out = [];
  while (left.size && out.length < SPOONS) {
    let best = null; L.forEach(l => { const g = feat(l).filter(f => f && left.has(f)); if (!best || g.length > best.g.length) best = { l, g }; });
    best.g.forEach(f => left.delete(f)); out.push(best);
  }
  /* each other line goes with the spoon it shares most with */
  const like = out.map(() => 0);
  L.filter(l => !out.some(o => o.l === l)).forEach(l => { const f = feat(l); let bi = 0, bs = -1; out.forEach((o, i) => { const s = feat(o.l).filter((x, k) => x && x === f[k]).length; if (s > bs) { bs = s; bi = i; } }); like[bi]++; });
  return { out, like, left: [...left] };
}
const P0 = pick();
const S = { n: 0 };
const say = f => { const [h, v] = f.split('␟'); return exact.has(h) ? `${h} “${esc(v)}”` : h === R.st.s7.col ? `${h} as ${SHAPE_WORD[v] || v}` : `${h} like ${esc(L.find(l => feat(l).includes(f)).cells[H.indexOf(h)])}`; };
function render() {
  const shown = P0.out.slice(0, S.n), got = shown.reduce((a, o) => a + o.g.length, 0);
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, F0.name, 'Tasting'], [['N', 'next spoon'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <section class="main-col"><div><h1 class="t">${SPOONS} lines that taste of the whole file</h1><p class="lede" style="margin-top:var(--space-1)">In a long file the first twenty lines are often its tidiest. These are picked so that each one shows something no line above it did. Lit values are the first of their shape.</p></div>
      <div class="cover"><span>${got} of ${ALL.length} shapes</span><span class="bar">${P0.out.map((o, i) => `<i class="${i === S.n - 1 ? 'new' : ''}" style="width:${o.g.length / ALL.length * 100}%;opacity:${i < S.n ? 1 : 0}"></i>`).join('')}</span></div>
      <ol class="spoons">${shown.map((o, i) => { const f = feat(o.l);
        return `<li class="sp dep" style="--i:0"><span class="ln"><b>${o.l.n}</b>line</span><span class="cells">${o.l.cells.map((c, k) => `<span class="rawv ${f[k] && o.g.includes(f[k]) ? 'first' : ''}">${c ? esc(c) : '<i class="emp">empty</i>'}</span>`).join('')}</span>
          <span class="why"><b>${plural(o.g.length, 'new shape')}</b>${i ? '' : ', the most common line'} · ${plural(P0.like[i], 'other line')} like it</span></li>`; }).join('')}</ol></section>
    <aside class="side"><p class="eyebrow">${I('utensils', 12)} Not on a spoon yet</p>
      <div class="left">${[...P0.left, ...P0.out.slice(S.n).flatMap(o => o.g)].slice(0, 14).map(f => `<span>${I('circle-dashed', 12)} ${say(f)}</span>`).join('')}${P0.left.length + P0.out.slice(S.n).reduce((a, o) => a + o.g.length, 0) > 14 ? `<span>and ${P0.left.length + P0.out.slice(S.n).reduce((a, o) => a + o.g.length, 0) - 14} more</span>` : ''}</div>
      <p><b>Why not the first twenty.</b> This file is short, so its first 20 lines do show ${new Set(L.slice(0, 20).flatMap(l => feat(l).filter(Boolean))).size} of ${ALL.length} shapes; these ${SPOONS} show ${ALL.length - P0.left.length} in a third of the reading. In a file of thousands of lines the spoons stay at ${SPOONS}; the top of the pot doesn’t get any more honest.</p>
      <p><b>What a spoon is for.</b> Tidying by example works best when the examples are the odd ones: fix line ${P0.out[1] ? P0.out[1].l.n : ''} and the bench already knows ${P0.out[1] ? P0.out[1].g.length : 0} shapes it must handle.</p>
      <p><b>Honest about what it skipped.</b> ${P0.left.length} shapes aren’t on any of the ${SPOONS} spoons; they are listed above, never hidden.</p>
      <button class="btn">${I('table', 14)} Show every line</button></aside>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.n = 0; render(); settle(); const t = ms('--motion-run'); for (let i = 1; i <= SPOONS; i++) later(() => { S.n = i; render(); }, t + (i - 1) * ms('--motion-instant') * 2); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key.toLowerCase() === 'n') { clearLater(); S.n = Math.min(SPOONS, S.n + 1); render(); } });
replay();
</script>
</body>
</html>
