<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Pass V2 · It balances</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: the pass as a reconciliation: every line and every value accounted for, down to what lands ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:var(--space-5)}
.ledger{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.ledger h2{margin:0 0 var(--space-1);font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.ln{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline;padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta);text-align:left;width:100%}
.ln:hover{background:var(--surface-raised)}
.ln[aria-pressed="true"]{background:var(--surface-raised);box-shadow:inset 2px 0 0 var(--light)}
.ln .op{font-family:var(--font-mono);color:var(--ink-muted);text-align:center}
.ln .w{color:var(--ink)}
.ln .w small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ln .n{font:400 var(--type-body)/var(--leading-meta) var(--font-mono);color:var(--light);text-align:right;min-width:4ch}
.ln.sub{border-top:1px solid var(--hairline-strong);border-radius:0;margin-top:var(--space-1);padding-top:var(--space-2)}
.ln.sub .w{color:var(--light)}
.ln.land .n{font-size:var(--type-heading);font-weight:300}
.ln.check .w{color:var(--x-proposed-lit)}
.ln.check .n{color:var(--x-proposed-lit)}
.ln.out .w{color:var(--ink-muted)}
.sheetbox{min-height:0;overflow:hidden;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset)}
.sheetbox .sheet{font-size:var(--x-proposed-type-micro)}
.sheetbox .sheet td,.sheetbox .sheet th{padding:0 var(--space-1);max-width:14ch}
@media (max-width:1400px){.ln{font-size:var(--type-small);line-height:var(--leading-small);padding:2px var(--space-2)}.ln .w small{display:none}.ln .n{font-size:var(--type-meta)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Pass · V2</b> it balances: every line and every value accounted for, down to what lands · bank reconciliation, the cross-foot, the answer has a base</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), PL = plate(R), recs = R.recs, K = DATA.kinds.inspection, F0 = R.file;
const L = role => R.lines.filter(l => l.role === role).map(l => l.n);
const DET = ['van', 'depot', 'on', 'result', 'odometer', 'note', 'by'];
const cls = v => !v ? 'empty' : v.fromFile ? 'added' : v.aside ? 'unknown' : v.val === '' ? 'empty' : v.by.length && v.raw !== v.val ? 'changed' : 'came';
const vals = recs.flatMap(r => DET.map(d => ({ r, d, c: cls(r.v[d]) })));
const vcount = c => vals.filter(x => x.c === c);
const ROWS = {
  lines: [
    { op: '', w: 'lines in the sheet', s: `${F0.sheet}, as it came`, n: R.lines.length, hl: R.lines.map(l => l.n) },
    { op: '−', w: 'title lines', s: 'skipped by recipe line 1', n: L('title').length, hl: L('title'), out: 1 },
    { op: '−', w: 'column names', s: 'line 2 of the recipe', n: L('header').length, hl: L('header'), out: 1 },
    { op: '−', w: 'empty lines', s: 'recipe line 4', n: L('blank').length, hl: L('blank'), out: 1 },
    { op: '−', w: 'the TOTAL line', s: `says ${R.total.said}; kept as the check`, n: L('total').length, hl: L('total'), out: 1 },
    { op: '=', w: 'lines of visits', n: PL.data, hl: R.lines.filter(l => !['title', 'header', 'blank', 'total'].includes(l.role)).map(l => l.n), sub: 1 },
    { op: '−', w: 'exact copy', s: `line ${PL.copies[0].n} = line ${PL.copies[0].of}`, n: PL.copies.length, hl: PL.copies.flatMap(l => [l.n, l.of]), out: 1 },
    { op: '=', w: 'visits', s: `the file’s own TOTAL says ${R.total.said}`, n: PL.data - PL.copies.length, hl: [R.total.line], sub: 1, check: PL.data - PL.copies.length === R.total.said },
    { op: '−', w: 'set aside', s: PL.aside.map(l => `line ${l.n}: ${l.why}`).join('; '), n: PL.aside.length, hl: PL.aside.map(l => l.n), out: 1 },
    { op: '=', w: `${K.word}s land`, n: PL.land, hl: recs.map(r => r.n), sub: 1, land: 1 }
  ],
  values: [
    { op: '', w: 'statements', s: `${PL.land} ${K.word}s × ${DET.length} details`, n: vals.length, hl: recs.map(r => r.n) },
    { op: '', w: 'as the file had them', s: 'not touched by any line', n: vcount('came').length, hl: [...new Set(vcount('came').map(x => x.r.n))] },
    { op: '+', w: 'changed by a recipe line', s: [...new Set(vcount('changed').flatMap(x => x.r.v[x.d].by))].sort((a, b) => a.slice(1) - b.slice(1)).map(s => `line ${s.slice(1)}: ${vcount('changed').filter(x => x.r.v[x.d].by.includes(s)).length}`).join(' · '), n: vcount('changed').length, hl: [...new Set(vcount('changed').map(x => x.r.n))] },
    { op: '+', w: 'said once for the file', s: `${KD('by').word}: ${FIRM.name}`, n: vcount('added').length, hl: [] },
    { op: '+', w: 'nothing to say', s: `${KD('note').word} empty in the file`, n: vcount('empty').length, hl: [...new Set(vcount('empty').map(x => x.r.n))], out: 1 },
    { op: '+', w: 'not known yet', s: PL.valuesAside.map(v => `${v.van} odometer “${v.raw}”`).join('; '), n: vcount('unknown').length, hl: vcount('unknown').map(x => x.r.n), out: 1 },
    { op: '=', w: 'accounted for', n: ['came', 'changed', 'added', 'empty', 'unknown'].reduce((a, c) => a + vcount(c).length, 0), hl: [], sub: 1, check: ['came', 'changed', 'added', 'empty', 'unknown'].reduce((a, c) => a + vcount(c).length, 0) === vals.length },
    { op: '', w: `waiting on “${DATA.asked[0].word}”`, s: `${DATA.asked[0].from}, kept in the note meanwhile`, n: recs.filter(r => r.v.kindOfVisit).length, hl: recs.map(r => r.n), out: 1 }
  ]
};
const S = { on: 'lines:9', shown: 0 };
function ledger(key, title) {
  return `<section class="ledger"><h2>${title}</h2>${ROWS[key].map((r, i) => `<button class="ln ${r.sub ? 'sub' : ''} ${r.land ? 'land' : ''} ${r.check ? 'check' : ''} ${r.out ? 'out' : ''}" data-k="${key}:${i}" aria-pressed="${S.on === key + ':' + i}" style="opacity:${S.shown > i ? 1 : 0};transition:opacity var(--motion-base) var(--ease-out)"><span class="op">${r.op}</span><span class="w">${r.w}${r.check ? ` ${I('check', 12)}` : ''}${r.s ? `<small>${r.s}</small>` : ''}</span><span class="n">${fmt(r.n)}</span></button>`).join('')}</section>`;
}
function render() {
  const [k, i] = S.on.split(':'), hl = ROWS[k][+i].hl;
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, F0.name, 'The pass'], [['↑↓', 'line'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    ${ledger('lines', `Every line, ${R.lines.length} to ${PL.land}`)}
    ${ledger('values', `Every value on what lands`)}
    <section class="sheetbox scroll" aria-label="The file, lit where the chosen line of the ledger points">${sheetHTML(R, { line: l => hl.includes(l.n) ? 'on' : 'dim', cell: l => hl.includes(l.n) ? 'hit' : '' })}</section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('[data-k]').forEach(b => b.onclick = () => { S.on = b.dataset.k; render(); });
}
function replay() { clearLater(); S.shown = 0; S.on = 'lines:9'; render(); const t = ms('--motion-run'); for (let i = 1; i <= 10; i++) later(() => { S.shown = i; render(); }, t + (i - 1) * ms('--motion-instant')); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const [k, i] = S.on.split(':'); const n = ROWS[k].length;
  if (e.key === 'ArrowDown') { S.on = `${k}:${(+i + 1) % n}`; S.shown = 10; render(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { S.on = `${k}:${(+i - 1 + n) % n}`; S.shown = 10; render(); e.preventDefault(); }
});
replay();
</script>
</body>
</html>
