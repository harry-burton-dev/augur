<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Pass V5 · The cook sends, the pass decides</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: the same pass seen from both ends: the bench that sent it, and Triage that decides it ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:var(--space-5)}
.end{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane)}
.end.tri{border-color:var(--hairline-strong)}
.who{display:flex;align-items:center;gap:var(--space-3)}
.who .av{width:var(--target-sm);height:var(--target-sm);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--hairline-strong);color:var(--ink)}
.who b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta)}
.who small{font-size:var(--type-small);color:var(--ink-muted)}
.who .st{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.rows{display:grid;gap:0}
.row{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto auto;gap:var(--space-3);align-items:center;padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.row svg{color:var(--ink-muted)}
.row .n{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light);text-align:right;min-width:3ch}
.row .s{font-size:var(--type-small);color:var(--ink-muted);min-width:9ch;text-align:right}
.row.held .s{color:var(--x-proposed-disagree)}
.row.kept .s{color:var(--x-proposed-lit)}
.fold{border-top:1px solid var(--hairline-strong);padding-top:var(--space-2);display:grid;gap:var(--space-1)}
.fold p{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.fold p b{font-weight:400;color:var(--ink)}
.acts{margin-top:auto;display:flex;flex-wrap:wrap;gap:var(--space-2)}
.note{border-left:2px solid var(--x-proposed-disagree);padding:var(--space-1) var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.note small{display:block;font-size:var(--type-small);color:var(--ink-muted)}
.bench-sum{display:grid;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.bench-sum p{margin:0}
.end .tray{padding:var(--space-2) var(--space-3)}
.end .tray li{font-size:var(--type-small);line-height:var(--leading-small)}
@media (max-width:1400px){.end{padding:var(--space-3);gap:var(--space-2)}.row{padding:var(--space-1) 0;font-size:var(--type-small)}.fold p:nth-child(n+3){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Pass · V5</b> the cook sends, the pass decides: one plate seen from the bench and from Triage · the brigade's pass, two-person rule</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), PL = plate(R), recs = R.recs, K = DATA.kinds.inspection, F0 = R.file, H = DATA.triageHold, me = P(DATA.me), boss = P(H.by);
const newVan = PL.fresh[0], newInsp = recs.filter(r => r.van.status === 'new').length;
const GROUPS = [
  { id: 'insp', ic: K.icon, w: `new ${K.word}s`, n: recs.length },
  { id: 'new', ic: DATA.kinds.van.icon, w: `new ${DATA.kinds.van.word}, ${newVan}`, n: PL.fresh.length },
  { id: 'odo', ic: 'gauge', w: 'odometers changed', n: PL.odo.length }
];
const S = { decided: false };
function state(g) {
  if (!S.decided) return { s: 'waiting', cls: '' };
  if (g.id === H.what) return { s: 'held', cls: 'held' };
  if (g.id === 'insp') return { s: `${g.n - newInsp} kept · ${newInsp} held`, cls: 'kept' };
  return { s: 'kept', cls: 'kept' };
}
function render() {
  const total = GROUPS.reduce((a, g) => a + g.n, 0), held = S.decided ? PL.fresh.length + newInsp : 0;
  $('#app').innerHTML = topHTML([DATA.app, 'Triage', `From ${me.name.split(' ')[0]}’s bench`], [['D', S.decided ? 'undo decision' : 'decide'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <section class="end"><div class="who"><span class="av">${I('chef-hat', 16)}</span><div><b>${me.name}’s bench</b><small>${me.role}</small></div><span class="st">${S.decided ? `heard ${H.at.split(', ')[1]}` : `sent ${F0.run.at.split(', ')[1]}`}</span></div>
      <div class="bench-sum"><p class="eyebrow">${I('send', 12)} ${esc(F0.name)}</p>
        ${S.decided ? `<p><span class="heard">${I('check', 12)} heard</span> ${boss.name} kept ${total - held} of ${total}. ${held} are held with a question:</p><p class="note">“${esc(H.note)}”<small>${boss.name} · ${H.at}</small></p><p>The held ${DATA.kinds.van.word} and its ${K.word} wait in Triage; nothing comes back to the bench unless it is sent back.</p>`
          : `<p>${plural(total, 'proposal')} with ${boss.name} in Triage. The recipe, the answers you gave and the tray went with them, so the pass is the same at both ends.</p>`}</div>
      ${trayHTML(R)}
      <p class="lede" style="font-size:var(--type-small)">The tray stays with you. It never reaches Triage until you answer it and send it on its own.</p></section>
    <section class="end tri"><div class="who"><span class="av">${I('clipboard-check', 16)}</span><div><b>${boss.name}, Triage</b><small>${F(DATA.myFloor).name} · ${F(DATA.myFloor).word} floor</small></div><span class="st">${S.decided ? 'decided' : 'new'}</span></div>
      <div><h2 class="t" style="font-size:var(--type-lead);line-height:var(--leading-lead)">${FIRM.short}’s ${F0.month} visits, from ${me.name}</h2><p class="lede">${plural(total, 'proposal')} made by recipe “${DATA.recipe.name}” (v${DATA.recipe.version}) from ${F0.doc.id}. It balances: the file says ${R.total.said}, ${PL.land} land and ${PL.aside.length} is set aside.</p></div>
      <div class="rows">${GROUPS.map(g => { const st = state(g); return `<div class="row ${st.cls}">${I(g.ic, 14)}<span>${g.w}</span><span class="n">${g.n}</span><span class="s">${st.s}</span></div>`; }).join('')}</div>
      <div class="fold"><p><b>The recipe</b>, ${DATA.recipe.steps.length} lines, each with its count on this file.</p><p><b>Answers ${me.name.split(' ')[0]} gave:</b> ${PL.aside.map(l => `line ${l.n} set aside`).join(', ')}; ${PL.valuesAside.map(v => `${v.van}’s odometer set aside`).join(', ')}; ${newVan} proposed as new, with its reason.</p><p><b>Tasted at the bench:</b> the plates those answers touched, and three at random. You can taste the same ones.</p></div>
      <div class="acts">${S.decided ? `<button class="btn" data-d>${I('undo-2', 14)} Undo</button>` : `<button class="btn go">${I('check-check', 14)} Keep all ${total}</button><button class="btn" data-d>${I('pause', 14)} Keep all but the new van</button><button class="btn">${I('corner-up-left', 14)} Send back with a note</button>`}</div></section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('[data-d]').forEach(b => b.onclick = () => { S.decided = !S.decided; render(); });
}
function replay() { clearLater(); S.decided = false; document.body.classList.add('pre'); render(); settle(ms('--motion-quick')); later(() => { S.decided = true; render(); }, ms('--motion-run')); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key.toLowerCase() === 'd') { S.decided = !S.decided; render(); } });
replay();
</script>
</body>
</html>
