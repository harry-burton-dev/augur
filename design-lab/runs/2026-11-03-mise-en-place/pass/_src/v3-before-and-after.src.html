<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Pass V3 · Before and after</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: the pass as a diff of what Data Atlas keeps: each van as it is now, and as it would be ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-3)}
.sum{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-meta);color:var(--ink)}
.sum b{font:300 var(--type-heading)/1 var(--font-mono);color:var(--light);margin-right:var(--space-1)}
.sum .m{display:inline-flex;align-items:center;gap:var(--space-1)}
.tablebox{min-height:0;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset)}
table.diff{width:100%;border-collapse:collapse;font-size:var(--type-small);line-height:var(--leading-small)}
.diff th,.diff td{text-align:left;padding:var(--space-1) var(--space-3);border-bottom:1px solid var(--hairline);white-space:nowrap}
.diff th{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);position:sticky;top:0;background:var(--slate-deep);z-index:1}
.diff td.mk{width:var(--space-5);font-family:var(--font-mono);color:var(--ink-muted);text-align:center}
.diff .was{color:var(--ink-muted);text-decoration:line-through;text-decoration-color:var(--hairline-strong);margin-right:var(--space-2)}
.diff .now{color:var(--light);border-bottom:1px dotted var(--x-proposed-seam)}
.diff .same{color:var(--ink-muted)}
.diff .now,.diff .plus,.diff tr.new{transition:opacity var(--motion-calm) var(--ease-out)}
.pre .diff .now,.pre .diff .plus,.pre .diff tr.new{opacity:0}
.diff tr.new td{background:color-mix(in srgb,var(--light) 4%,transparent)}
.diff tr.new td.mk{color:var(--light)}
.diff tr.quiet td{opacity:var(--x-proposed-quiet)}
.diff tr.sep td{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);padding-top:var(--space-3);border-bottom:1px solid var(--hairline-strong)}
.od{display:inline-flex;align-items:center;gap:var(--space-1)}
.od.late{color:var(--x-proposed-disagree)}
.plus{display:inline-flex;gap:2px}
.plus i{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--light)}
.diff td .mk-gap{width:var(--space-4);height:var(--space-3)}
@media (max-width:1400px){.diff th,.diff td{padding:2px var(--space-2)}.sum{gap:var(--space-4);font-size:var(--type-small)}.sum b{font-size:var(--type-lead)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Pass · V3</b> before and after: every van as Data Atlas keeps it now, and as it would after this run · a diff, a stocktake sheet</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), PL = plate(R), recs = R.recs, K = DATA.kinds.inspection;
const was = Object.fromEntries(DATA.depots.map(d => [d.id, overdue(d.id).ids])), now = Object.fromEntries(DATA.depots.map(d => [d.id, overdue(d.id, R).ids]));
const S = { only: true };
function row(id, isNew) {
  const v = VAN(id), rs = recs.filter(r => r.van.id === id), last = rs[rs.length - 1], depot = isNew ? last.v.depot.id : v.depot;
  const lastAfter = rs.reduce((a, r) => pd(r.v.on.val) > pd(a) ? r.v.on.val : a, isNew ? rs[0].v.on.val : v.last);
  const odoR = [...rs].reverse().find(r => r.v.odometer.num != null);
  const lateW = !isNew && was[depot].includes(id), lateN = now[depot].includes(id);
  return `<tr class="${isNew ? 'new' : ''} ${rs.length ? '' : 'quiet'}"><td class="mk">${isNew ? '+' : rs.length ? '~' : ''}</td><td>${kept(id)}${isNew ? ' <span class="muted">new van</span>' : ''}</td><td>${DEPOT(depot).name}</td>
    <td>${isNew ? '' : `<span class="${rs.length ? 'was' : 'same'}">${v.last}</span>`}${rs.length ? `<span class="now">${lastAfter}</span>` : ''}</td>
    <td>${isNew ? '' : `<span class="${odoR && odoR.v.odometer.num !== v.odo ? 'was' : 'same'}">${fmt(v.odo)}</span>`}${odoR && (isNew || odoR.v.odometer.num !== v.odo) ? `<span class="now">${fmt(odoR.v.odometer.num)}</span>` : rs.length && !odoR ? `<span class="mk-gap" title="not known yet this month"></span>` : ''}</td>
    <td>${rs.length ? `<span class="plus" title="${rs.length} new ${K.word}${rs.length > 1 ? 's' : ''}">${rs.map(() => '<i></i>').join('')}</span> ${rs.map(r => r.v.result.val).join(', ')}` : ''}</td>
    <td>${isNew ? '' : lateW !== lateN ? `<span class="od was">overdue</span><span class="now">in date</span>` : lateN ? `<span class="od late">${I('clock', 12)} overdue</span>` : '<span class="same">in date</span>'}</td></tr>`;
}
function render() {
  const touched = [...new Set(recs.map(r => r.van.id))], kept0 = DATA.vans.map(v => v[0]);
  const inFile = kept0.filter(id => touched.includes(id)), notIn = kept0.filter(id => !touched.includes(id));
  const clearedN = DATA.depots.reduce((a, d) => a + was[d.id].filter(x => !now[d.id].includes(x)).length, 0), stillLate = DATA.depots.reduce((a, d) => a + now[d.id].length, 0);
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, R.file.name, 'The pass', 'Before and after'], [['A', S.only ? 'show all vans' : 'only changed'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div><h1 class="t">${DATA.app}, before and after this run</h1><p class="lede" style="margin-top:var(--space-1)">Each van as it is kept now, and as it would be if ${P('p2').name} accepts everything in Triage. Struck values are today’s; values with a seam are what this file brings.</p></div>
    <div class="sum"><span class="m"><b>${inFile.length}</b>vans change</span><span class="m"><b>${PL.fresh.length}</b>new van</span><span class="m"><b>${recs.length}</b>new ${K.word}s</span><span class="m"><b>${PL.odo.length}</b>odometers move</span><span class="m"><b>${clearedN}</b>come back in date</span><span class="m"><b>${stillLate}</b>still overdue</span><span class="m"><b>${notIn.length}</b>not in this file, unchanged</span></div>
    <div class="tablebox scroll"><table class="diff"><thead><tr><th></th><th>${DATA.kinds.van.word}</th><th>${KD('depot').word}</th><th>last inspected</th><th>${KD('odometer').word} (miles)</th><th>${K.word}s added</th><th>due</th></tr></thead>
      <tbody>${PL.fresh.map(id => row(id, true)).join('')}${inFile.map(id => row(id)).join('')}
      <tr class="sep"><td></td><td colspan="6">${plural(notIn.length, 'van')} not in this file${S.only ? ` · ${notIn.filter(id => now[VAN(id).depot].includes(id)).length} of them overdue, press A to see` : ''}</td></tr>
      ${S.only ? '' : notIn.map(id => row(id)).join('')}</tbody></table></div>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.only = true; document.body.classList.add('pre'); render(); settle(ms('--motion-run')); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key.toLowerCase() === 'a') { S.only = !S.only; render(); } });
replay();
</script>
</body>
</html>
