<style>
/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; listed as
   "needs token" in notes.md. Marks carried from earlier runs,
   then this run's own (raw, kept, seam, set aside, stop).
   --------------------------------------------------------------- */
:root{
  /* six ways to be empty (catalogue run): corner ticks for not known yet */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  /* not yours to see: 135 degree hatch */
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  /* sources disagree / a check: a warning-tinted edge, never red */
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  --x-proposed-quiet: .62;
  --x-proposed-type-micro: .6875rem;
  /* the lit next step (light language) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* pencil (reference desk): what a model or a rule proposed, until a person confirms it */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  /* NEW this run ----------------------------------------------------------- */
  /* raw: a value as the file holds it, on a faint ruled ground (typewriter on a form) */
  --x-proposed-raw-ground: color-mix(in srgb, var(--slate-deep) 60%, transparent);
  /* the seam a recipe line leaves on a value it changed (visible repair): ink, never glow */
  --x-proposed-seam: color-mix(in srgb, var(--ink-muted) 55%, transparent);
  /* set aside: a tray, dashed edge and a low wash, kept in view */
  --x-proposed-aside-edge: color-mix(in srgb, var(--ink-muted) 50%, transparent);
  --x-proposed-aside-wash: color-mix(in srgb, var(--ink-muted) 6%, transparent);
  /* stop (jidoka andon): the line stopped and asks; warning, with the light that says "needs you" */
  --x-proposed-stop: color-mix(in srgb, var(--warning) 82%, var(--light));
  --x-proposed-stop-wash: color-mix(in srgb, var(--warning) 10%, transparent);
  /* the pass: the plate rail's edge */
  --x-proposed-pass-edge: color-mix(in srgb, var(--light) 40%, transparent);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{display:flex;align-items:center;gap:var(--space-2);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.lite{color:var(--light)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}

/* floors */

[data-tier="org"]{--fc:var(--floor-org-high);--fl:var(--floor-org-low)}

.fchip::before{content:"";width:var(--space-4);height:2px;background:var(--fc);border-radius:1px}

/* two registers: admin words one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:block}
.tech .tk.inl{display:inline}

/* six ways to be empty: not known yet */
.mk-gap{display:inline-block;width:var(--space-5);height:var(--space-4);vertical-align:-3px;
  --t:var(--space-1);
  background:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--t) no-repeat}
.mk-unseen{display:inline-block;width:var(--space-4);height:var(--space-3);background:var(--x-proposed-unseen);border:1px solid var(--hairline);border-radius:2px;vertical-align:-1px}

/* pencil and ink */
.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3)}
.pencil .pt{font-style:italic;color:var(--ink)}
.pencil .pl{display:flex;align-items:center;gap:var(--space-2);font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);margin:0 0 var(--space-1)}
.pencil.inked{border-style:solid;border-color:var(--hairline-strong);background:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);white-space:nowrap;transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard)}
.btn:hover{background:var(--surface-raised)}
.btn.go{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.btn.sm{height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-3);font-size:var(--type-small)}
.btn[aria-disabled="true"]{opacity:var(--x-proposed-quiet);cursor:not-allowed}
.btn[aria-pressed="true"]{border-color:var(--light);color:var(--light)}

/* app frame */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--slate-deep) 70%,transparent);min-width:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.crumb b{font-weight:400;color:var(--light)}
.crumb svg{opacity:var(--x-proposed-quiet);flex:none}
.top .hints{margin-left:auto;justify-content:flex-end}
.main{min-height:0;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-2));overflow:hidden}
h1.t,h2.t{margin:0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);letter-spacing:var(--tracking-tight);color:var(--light)}
.lede{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);max-width:72ch}

/* ---------- raw and kept: the run's core grammar ---------- */
/* raw = as the file holds it: mono, on a ruled ground. kept = as Data Atlas keeps it: Jost, plain */
.rawv{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink);background:var(--x-proposed-raw-ground);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-1);white-space:pre}
.rawv .emp{font-style:italic;color:var(--ink-muted)}
.keptv{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light);border-bottom:1px dotted var(--x-proposed-seam);white-space:nowrap}
.pair{display:inline-flex;align-items:center;gap:var(--space-1);white-space:nowrap}
.to{display:inline-flex;color:var(--ink-muted)}
.sno{display:inline-flex;align-items:center;justify-content:center;min-width:var(--space-4);height:var(--space-4);padding:0 2px;border:1px solid var(--x-proposed-seam);border-radius:var(--radius-pill);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);flex:none}

/* ---------- the sheet ---------- */
.sheet{border-collapse:collapse;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink);width:100%;table-layout:auto}
.sheet th,.sheet td{border:1px solid var(--hairline);padding:2px var(--space-2);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.sheet .ch th{font-weight:400;color:var(--ink-muted);background:var(--surface-inset);text-align:center}
.sheet .rn{width:var(--space-6);font-weight:400;color:var(--ink-muted);background:var(--surface-inset);text-align:right}
.sheet td.merged{text-align:center;color:var(--ink-muted);letter-spacing:var(--tracking-soft)}
.sheet .r-header td{color:var(--light);background:color-mix(in srgb,var(--surface-raised) 60%,transparent)}
.sheet .rg{font-family:var(--font-sans);color:var(--ink-muted);border-color:transparent;background:none;max-width:none}
.sheet .rg svg{vertical-align:-2px}
.sheet tr.dim td{opacity:var(--x-proposed-quiet)}
.sheet tr.strike td{text-decoration:line-through;text-decoration-color:var(--ink-muted);color:var(--ink-muted)}
.sheet tr.aside td{background:var(--x-proposed-aside-wash)}
.sheet tr.aside th.rn{box-shadow:inset 2px 0 0 var(--x-proposed-aside-edge)}
.sheet tr.stop td{background:var(--x-proposed-stop-wash)}
.sheet tr.stop th.rn{box-shadow:inset 2px 0 0 var(--x-proposed-stop);color:var(--x-proposed-stop)}
.sheet td.pr{box-shadow:inset 0 -2px 0 var(--x-proposed-disagree)}
.sheet td.hit{background:color-mix(in srgb,var(--light) 9%,transparent);color:var(--light)}
.sheet td.ex{outline:1px solid var(--light);outline-offset:-1px;color:var(--light)}
.sheet td.pen{font-style:italic;color:var(--ink);background:var(--x-proposed-pencil-wash);box-shadow:inset 0 0 0 1px var(--x-proposed-pencil)}
.sheet td.ok{color:var(--light);font-family:var(--font-sans)}
.sheet td.stopc{color:var(--x-proposed-stop);box-shadow:inset 0 0 0 1px var(--x-proposed-stop)}
.sheet td.lost{color:var(--ink-muted);text-decoration:line-through}
.sheet tr.on th.rn{color:var(--light)}

/* ---------- the recipe ---------- */
.recipe{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:none}
.rl{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto var(--space-4);gap:var(--space-2);align-items:start;padding:var(--space-2) 0;border-top:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.rl:first-child{border-top:0}
.rl .rn{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);text-align:right}
.rl .rw{color:var(--ink);min-width:0}
.rl .rm{color:var(--ink-muted)}
.rl .rex{display:block;margin-top:2px}
.rl .rc{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);white-space:nowrap;text-align:right}
.rl .rs{display:inline-flex;padding-top:2px;color:var(--ink-muted)}
.rl.st-stop{background:linear-gradient(90deg,var(--x-proposed-stop-wash),transparent)}
.rl.st-stop .rs,.rl.st-stop .rc{color:var(--x-proposed-stop)}
.rl.st-check .rs,.rl.st-check .rc{color:var(--x-proposed-disagree)}
.rl.st-todo .rw{color:var(--ink-muted)}
.rl.on{box-shadow:inset 2px 0 0 var(--light)}
.rl.on .rw{color:var(--light)}
.recipe.tight .rl{padding:var(--space-1) 0}
.recipe.tight .rex{display:none}

/* ---------- set aside ---------- */
.tray{border:1px dashed var(--x-proposed-aside-edge);background:var(--x-proposed-aside-wash);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4)}
.tray ul{list-style:none;margin:var(--space-2) 0 0;padding:0;display:grid;gap:var(--space-2)}
.tray li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-3);align-items:start;font-size:var(--type-meta);line-height:var(--leading-meta)}
.tray .tn{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.tray .tw{color:var(--ink);min-width:0}
.tray .tw small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}

/* panes */
.pane{border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);min-height:0}
.pane > .ph{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--hairline)}
.pane > .pb{padding:var(--space-3) var(--space-4)}
.stopbox{border:1px solid var(--x-proposed-stop);background:var(--x-proposed-stop-wash);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4)}
.stopbox .eyebrow{color:var(--x-proposed-stop)}
.heard{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-proposed-lit)}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant) / 2)}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}
.x-cap{max-width:calc(100vw - 2 * var(--edge-tight))}

/* ---- V4: the head chef tastes some plates: every plate a person's answer touched, plus a few at random, each against its raw line ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,.85fr);gap:var(--space-6)}
.plates{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.pl{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) minmax(0,1.25fr) auto;gap:var(--space-4);align-items:center;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane)}
.pl.ok{border-color:var(--hairline);background:none}
.pl.bad{border-color:var(--x-proposed-stop);background:var(--x-proposed-stop-wash)}
.pl.now{border-color:var(--x-proposed-pass-edge)}
.pl .n{font:400 var(--type-small)/1.2 var(--font-mono);color:var(--ink-muted)}
.pl .n b{display:block;font:300 var(--type-lead)/1 var(--font-mono);color:var(--light)}
.pl .raw{display:flex;flex-wrap:wrap;gap:2px}
.pl .raw .rawv{font-size:var(--x-proposed-type-micro)}
.pl .plt{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}

.pl .plt .why{display:block;color:var(--ink-muted)}
.pl .acts{display:flex;gap:var(--space-2)}
.pl .tag{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.meter{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px}
.meter i{height:var(--space-2);border-radius:1px;background:var(--hairline)}
.meter i.pick{background:var(--ink-muted)}
.meter i.ok{background:var(--x-proposed-lit)}
.side p{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.side p.muted{font-size:var(--type-small);line-height:var(--leading-small)}
.side p b{font-weight:400;color:var(--light)}
.side .btn{align-self:flex-start}
@media (max-width:1400px){.pl{grid-template-columns:var(--space-5) minmax(0,1fr) minmax(0,1.2fr) auto;gap:var(--space-2);padding:var(--space-1) var(--space-2)}.pl .raw .rawv:nth-child(n+6){display:none}.side p{font-size:var(--type-small);line-height:var(--leading-small)}}
</style>

/* ---- shared helpers and the recipe engine (same in every variant) ---- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const I = (n, size = 16, stroke = 1.5) => Icons.svg(n, { size, stroke });
const P = id => DATA.people[id];
const F = id => DATA.floors[id];
const fmt = n => n == null ? '' : n.toLocaleString('en-GB');
const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : (many || one + 's')}`;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ms = v => parseFloat(css(v)) || 0;
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const COLS = 'ABCDEFGHIJKLMNOP';
const lc = s => s.charAt(0).toLowerCase() + s.slice(1);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DEPOT = id => DATA.depots.find(d => d.id === id);
const KD = id => DATA.kinds.inspection.details.find(d => d.id === id);
const VAN = id => { const v = DATA.vans.find(x => x[0] === id); return v && { id: v[0], depot: v[1], odo: v[2], last: v[3] }; };
const STEP = id => DATA.recipe.steps.find(s => s.id === id);
const FIRM = DATA.firm;

/* ---------- reading values: each returns null when it can't read, never a guess ---------- */
const RE_VAN = /^\s*([A-Za-z]{2})[\s.\-]*(\d{1,2})\s*$/;
function readVan(v) { const m = String(v || '').match(RE_VAN); return m ? `${m[1].toUpperCase()}-${m[2].padStart(2, '0')}` : null; }
function dateShape(v) {
  v = String(v || '').trim();
  if (/^\d{5}$/.test(v)) return 'serial';
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v)) return 'd/m/y';
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return 'y-m-d';
  if (/^\d{1,2}\s+[A-Za-z]{3}$/.test(v)) return 'd Mon';
  return null;
}
const SHAPE_WORD = { serial: 'a spreadsheet day number', 'd/m/y': 'day/month/year', 'y-m-d': 'year-month-day', 'd Mon': 'day and month, no year' };
function readDate(v, year) {
  v = String(v || '').trim(); const sh = dateShape(v); let d, m, y;
  if (sh === 'serial') { const t = new Date(Date.UTC(1899, 11, 30) + (+v) * 864e5); d = t.getUTCDate(); m = t.getUTCMonth(); y = t.getUTCFullYear(); }
  else if (sh === 'd/m/y') { const p = v.split('/'); d = +p[0]; m = +p[1] - 1; y = +p[2]; }
  else if (sh === 'y-m-d') { const p = v.split('-'); y = +p[0]; m = +p[1] - 1; d = +p[2]; }
  else if (sh === 'd Mon') { const p = v.split(/\s+/); d = +p[0]; m = MON.findIndex(x => x.toLowerCase() === p[1].toLowerCase()); y = year; }
  else return null;
  return { d, m, y, shape: sh, text: `${d} ${MON[m]} ${y}` };
}
function readResult(v) {
  const s = String(v || '').replace(/[–—]/g, '-').trim();
  const m = s.match(/^(pass|fail)\b(.*)$/i); if (!m) return null;
  const rest = m[2].replace(/[()]/g, '').replace(/^\s*-\s*/, '').trim();
  const adv = /^advisory\b/i.test(rest);
  const note = rest.replace(/^advisory\s*:?\s*/i, '').trim();
  return { result: /fail/i.test(m[1]) ? 'failed' : adv ? 'passed with advisory' : 'passed', note };
}
function readMiles(v) {
  const s = String(v || '').replace(/\s*mi(les)?\.?$/i, '').replace(/[,\s]/g, '');
  return /^\d+$/.test(s) ? +s : null;
}
const squash = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
function lev(a, b) { const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }

/* ---------- a first look at a column, before any recipe: shapes, blanks, distinct values ---------- */
const shapeOf = v => String(v).trim().replace(/[A-Z]/g, 'A').replace(/[a-z]/g, 'a').replace(/[0-9]/g, '9').replace(/(.)\1+/g, '$1$1').replace(/\s+/g, ' ');
function dataLinesOf(res) { return res.lines.filter(l => l.n > 3 && l.cells.some(c => String(c || '').trim()) && String(l.cells[0] || '').trim().toUpperCase() !== 'TOTAL'); }
function profile(res, col) {
  const i = res.header.indexOf(col), out = { col, i, shapes: {}, blanks: [], values: {}, n: 0 };
  dataLinesOf(res).forEach(l => { const v = String(l.cells[i] ?? '').trim(); out.n++;
    if (!v) { out.blanks.push(l.n); return; }
    const sh = shapeOf(v); (out.shapes[sh] = out.shapes[sh] || { ex: v, lines: [] }).lines.push(l.n);
    (out.values[v] = out.values[v] || []).push(l.n); });
  out.ways = Object.keys(out.shapes).length; out.distinct = Object.keys(out.values).length;
  return out;
}

/* ---------- the engine: run a recipe over a file. Nothing is dropped: every line ends with a role ---------- */
/* roles: title, header, blank, total (not records); copy, aside (didn't fit); stop (waiting on a person); land (becomes a record) */
function run(fileKey, steps = DATA.recipe.steps, answers = {}) {
  const file = DATA.files[fileKey];
  const L = file.lines.map((c, i) => ({ n: i + 1, cells: c.slice(), role: null, by: null, why: '' }));
  const res = { fileKey, file, lines: L, header: [], st: {}, stops: [], recs: [], total: null, leftOut: [], checks: [] };
  const S = id => res.st[id] || (res.st[id] = { changed: 0, values: [], aside: [], shapes: {}, groups: {}, near: [], stop: null, col: null, found: true });
  const live = () => L.filter(l => !l.role || l.role === 'land' || l.role === 'stop');
  const named = st => { const n = [...(st.col || [])]; if (answers.rename && answers.rename[n[0]]) n.push(answers.rename[n[0]]); return n; };
  const col = st => { for (const n of named(st)) { const i = res.header.indexOf(n); if (i >= 0) return i; } return -1; };
  const recOf = l => l.rec || (l.rec = { n: l.n, cells: l.cells, v: {}, flags: [] });
  const stopCol = (st, s) => {
    const want = named(st)[0];
    const guess = res.header.map((h, i) => ({ h, i, fit: live().filter(l => st.op === 'van' || st.op === 'match' ? readVan(l.cells[i]) : true).length }))
      .filter(x => !res.used.has(x.h)).sort((a, b) => b.fit - a.fit)[0];
    s.found = false;
    const stop = { step: st.id, kind: 'column', want, guess: guess && guess.h, fit: guess && guess.fit, of: live().length };
    if (!res.stops.find(x => x.kind === 'column' && x.want === want)) res.stops.push(stop); else stop.also = true;
    s.stop = stop;
  };
  res.used = new Set();
  for (const st of steps) {
    const s = S(st.id);
    if (st.op === 'skipTop') { L.slice(0, st.n).forEach(l => { l.role = 'title'; l.by = st.id; }); s.aside = L.slice(0, st.n).map(l => l.n); }
    else if (st.op === 'header') { const h = L[st.line - 1]; h.role = 'header'; h.by = st.id; res.header = h.cells.slice(); }
    else if (st.op === 'total') {
      live().filter(l => String(l.cells[0] || '').trim().toUpperCase() === st.first).forEach(l => {
        l.role = 'total'; l.by = st.id; const m = l.cells.join(' ').match(/(\d+)\s+visits/i);
        res.total = { said: m ? +m[1] : null, line: l.n, text: l.cells.filter(Boolean).join(' · ') }; s.aside.push(l.n);
      });
    }
    else if (st.op === 'blank') live().filter(l => l.cells.every(c => !String(c || '').trim())).forEach(l => { l.role = 'blank'; l.by = st.id; s.aside.push(l.n); });
    else if (st.op === 'copies') {
      const seen = {};
      live().forEach(l => { const k = l.cells.join('␟'); if (seen[k]) { l.role = 'copy'; l.by = st.id; l.of = seen[k]; l.why = `an exact copy of line ${seen[k]}`; s.aside.push(l.n); } else seen[k] = l.n; });
    }
    else if (st.op === 'van') {
      const i = col(st); if (i < 0) { stopCol(st, s); continue; } s.col = res.header[i]; res.used.add(res.header[i]);
      live().forEach(l => {
        const raw = l.cells[i], out = readVan(raw);
        if (!out) {
          if (st.unreadable === 'aside') { l.role = 'aside'; l.by = st.id; l.why = `“${raw}” isn’t a van number`; s.aside.push(l.n); }
          else { l.role = 'stop'; l.by = st.id; l.why = `“${raw}” isn’t a van number`; s.stop = s.stop || { step: st.id, kind: 'value', lines: [] }; s.stop.lines.push(l.n); if (!res.stops.includes(s.stop)) res.stops.push(s.stop); }
          return;
        }
        const r = recOf(l); r.v.van = { raw, val: out, col: res.header[i], by: out !== raw ? [st.id] : [] };
        if (out !== raw) { s.changed++; s.values.push([raw, out, l.n]); }
      });
    }
    else if (st.op === 'date') {
      const i = col(st); if (i < 0) { stopCol(st, s); continue; } s.col = res.header[i]; res.used.add(res.header[i]);
      live().forEach(l => {
        const raw = l.cells[i], d = readDate(raw, st.year);
        if (!d) { l.role = 'stop'; l.by = st.id; l.why = `“${raw}” can’t be read as a date`; return; }
        s.shapes[d.shape] = (s.shapes[d.shape] || 0) + 1;
        const r = recOf(l); r.v.on = { raw, val: d.text, col: res.header[i], by: [st.id], shape: d.shape }; s.changed++; s.values.push([raw, d.text, l.n]);
      });
    }
    else if (st.op === 'group') {
      const i = col(st); if (i < 0) { stopCol(st, s); continue; } s.col = res.header[i]; res.used.add(res.header[i]);
      const map = {}; st.groups.forEach(g => g.from.forEach(f => map[f] = g.to));
      live().forEach(l => {
        const raw = l.cells[i]; let to = map[raw], near = false;
        if (!to && st.near) {
          let best = null; Object.keys(map).forEach(k => { const dd = lev(squash(k), squash(raw)); if (dd <= 2 && (!best || dd < best.d)) best = { k, d: dd }; });
          if (best) { to = map[best.k]; near = best.k; }
        }
        if (!to) { l.role = 'stop'; l.by = st.id; l.why = `“${raw}” isn’t one of the depots`; return; }
        (s.groups[to] = s.groups[to] || {})[raw] = ((s.groups[to] || {})[raw] || 0) + 1;
        if (near && !s.near.find(x => x.raw === raw)) s.near.push({ raw, like: near, to, lines: [] });
        if (near) s.near.find(x => x.raw === raw).lines.push(l.n);
        const r = recOf(l); r.v.depot = { raw, val: DEPOT(to).name, id: to, col: res.header[i], by: [st.id], near };
        if (raw !== DEPOT(to).name) { s.changed++; s.values.push([raw, DEPOT(to).name, l.n]); }
      });
    }
    else if (st.op === 'result') {
      const i = col(st); if (i < 0) { stopCol(st, s); continue; } s.col = res.header[i]; res.used.add(res.header[i]);
      live().forEach(l => {
        const raw = l.cells[i], r0 = readResult(raw);
        if (!r0) {
          const ans = answers.value && answers.value[raw];
          if (ans === 'aside') { l.role = 'aside'; l.by = st.id; l.why = `“${raw}” isn’t a result ${DATA.app} knows yet`; l.waiting = true; s.aside.push(l.n); }
          else { l.role = 'stop'; l.by = st.id; l.why = `“${raw}” isn’t a result ${DATA.app} knows`; s.stop = s.stop || { step: st.id, kind: 'value', value: raw, lines: [] }; s.stop.lines.push(l.n); if (!res.stops.includes(s.stop)) res.stops.push(s.stop); }
          return;
        }
        const r = recOf(l); r.v.result = { raw, val: r0.result, col: res.header[i], by: [st.id] };
        if (r0.note) r.v.rnote = { raw, val: r0.note, col: res.header[i], by: [st.id] };
        s.changed++; s.values.push([raw, r0.result + (r0.note ? ' · ' + r0.note : ''), l.n]);
      });
    }
    else if (st.op === 'miles') {
      const i = col(st); if (i < 0) { stopCol(st, s); continue; } s.col = res.header[i]; res.used.add(res.header[i]);
      live().forEach(l => {
        const raw = l.cells[i], m = readMiles(raw), r = recOf(l);
        if (m == null) { r.v.odometer = { raw, val: null, col: res.header[i], by: [st.id], aside: true, why: `“${raw}” can’t be read as miles` }; s.aside.push(l.n); return; }
        const out = fmt(m); r.v.odometer = { raw, val: out, num: m, col: res.header[i], by: out !== raw ? [st.id] : [] };
        if (out !== raw) { s.changed++; s.values.push([raw, out, l.n]); }
      });
    }
    else if (st.op === 'match') {
      const i = col(st); if (i < 0) { stopCol(st, s); continue; }
      s.matched = new Set(); s.fresh = new Set();
      live().filter(l => l.rec && l.rec.v.van).forEach(l => {
        const id = l.rec.v.van.val, v = VAN(id);
        if (v) { l.rec.van = { id, status: 'match' }; s.matched.add(id); }
        else { l.rec.van = { id, status: 'new' }; s.fresh.add(id); }
      });
    }
    else if (st.op === 'map') {
      const asked = Object.entries(st.cols).filter(([, d]) => d === 'asked').map(([c]) => c);
      res.leftOut = res.header.filter(h => h && !(h in st.cols) && !res.used.has(h));
      res.asked = asked;
      if (!res.header.length) continue;
      const iNote = res.header.indexOf('Notes'), iType = res.header.indexOf('Type');
      live().filter(l => l.role !== 'stop').forEach(l => {
        const r = recOf(l); l.role = 'land'; l.by = l.by || st.id;
        const notes = [r.v.rnote && r.v.rnote.val, iNote >= 0 && l.cells[iNote]].filter(Boolean);
        if (iType >= 0 && l.cells[iType]) r.v.kindOfVisit = { raw: l.cells[iType], val: l.cells[iType], col: 'Type', by: [st.id], waiting: true };
        r.v.note = { raw: iNote >= 0 ? l.cells[iNote] : '', val: notes.join('; '), col: 'Notes', by: r.v.rnote ? ['s9'] : [] };
        if (st.firm) r.v.by = { raw: '', val: FIRM.name, col: null, by: [st.id], fromFile: true };
      });
    }
  }
  res.recs = L.filter(l => l.role === 'land').map(l => l.rec);
  L.filter(l => l.role === 'stop' && !res.stops.some(s => s.lines && s.lines.includes(l.n))).forEach(l => {
    const s = res.st[l.by]; if (!s.stop) { s.stop = { step: l.by, kind: 'value', lines: [] }; res.stops.push(s.stop); } if (s.stop.lines) s.stop.lines.push(l.n);
  });
  return res;
}

/* what the run would send to Triage, and what it sets aside. All counted from the run */
function plate(res) {
  const data = res.lines.filter(l => !['title', 'header', 'blank', 'total'].includes(l.role));
  const land = res.lines.filter(l => l.role === 'land'), aside = res.lines.filter(l => l.role === 'aside'), copies = res.lines.filter(l => l.role === 'copy'), stopped = res.lines.filter(l => l.role === 'stop');
  const fresh = [...new Set(res.recs.filter(r => r.van && r.van.status === 'new').map(r => r.van.id))];
  const latest = {}; res.recs.forEach(r => { if (r.van && r.van.status === 'match' && r.v.odometer && r.v.odometer.num != null) latest[r.van.id] = r; });
  const odo = Object.values(latest).map(r => ({ id: r.van.id, was: VAN(r.van.id).odo, now: r.v.odometer.num, n: r.n })).filter(x => x.was !== x.now);
  const valuesAside = res.recs.filter(r => r.v.odometer && r.v.odometer.aside).map(r => ({ n: r.n, raw: r.v.odometer.raw, why: r.v.odometer.why, van: r.v.van.val }));
  const depots = [...new Set(res.recs.map(r => r.v.depot && r.v.depot.id).filter(Boolean))];
  const spellings = res.recs.filter(r => r.v.depot && r.v.depot.raw !== r.v.depot.val).length;
  const waiting = res.recs.filter(r => r.v.kindOfVisit).length;
  return {
    data: data.length, land: land.length, aside, copies, stopped, fresh, odo, valuesAside, depots, spellings, waiting,
    vans: [...new Set(res.recs.map(r => r.van && r.van.id))].length,
    notRecords: res.lines.filter(l => ['title', 'header', 'blank', 'total'].includes(l.role)),
    balances: res.total ? res.total.said === land.length + aside.length + stopped.length : null
  };
}

/* ---------- what landing a run would move elsewhere (consequence preview), worked out from the dates ---------- */
const pd = s => { const p = String(s).split(/\s+/); return Date.UTC(+p[2], MON.indexOf(p[1]), +p[0]); };
function overdue(depot, res, today = DATA.today) {
  const t = new Date(pd(today)); t.setUTCMonth(t.getUTCMonth() - DATA.inspectEveryMonths);
  const vans = DATA.vans.filter(v => v[1] === depot).map(v => VAN(v[0]));
  const last = id => { let d = pd(VAN(id).last); (res ? res.recs : []).forEach(r => { if (r.van && r.van.id === id) d = Math.max(d, pd(r.v.on.val)); }); return d; };
  return { of: vans.length, ids: vans.filter(v => last(v.id) < +t).map(v => v.id) };
}
function downstream(res) {
  return DATA.downstream.map(d => {
    const was = overdue(d.depot), now = overdue(d.depot, res), name = DEPOT(d.depot).name, cleared = was.ids.filter(x => !now.ids.includes(x));
    if (d.kind === 'overdue') return { ...d, now: `${was.ids.length} of ${was.of} overdue`, after: `${now.ids.length} of ${now.of} overdue`, why: `${plural(cleared.length, 'overdue van')} (${cleared.join(', ')}) ${cleared.length === 1 ? 'was' : 'were'} inspected in this file` };
    if (d.kind === 'intent') return { ...d, now: d.state, after: `${plural(res.recs.filter(r => r.v.depot.id === d.depot).length, 'inspection')} added as evidence; ${P(d.owner).name} decides its state`, why: `it is bound to the ${was.of} ${name} vans` };
    return { ...d, now: 'quiet', after: `tells ${P(d.owner).name.split(' ')[0]} once: “something happened”`, why: `the count it watches moves from ${was.ids.length} to ${now.ids.length}` };
  });
}

/* ---------- the recipe in words (plain first, admin words with T) ---------- */
function stepWords(st, res) {
  const s = res && res.st[st.id] || {}, c = (st.col || [])[0], used = s.col || c;
  const g = st.groups ? st.groups.reduce((a, x) => a + x.from.length, 0) : 0;

    case 'group': return { w: `Group ${g} spellings in ${used} into ${st.groups.length} depots`, tk: `cluster(${used}; fingerprint, distance ≤ 2) → Site`, icon: 'combine', more: st.near ? 'and near spellings of them' : '' };
    case 'result': return { w: `Split ${used} into a result and a note`, ex: st.example, tk: `${used} → outcome ∈ {passed, passed with advisory, failed}, comment`, icon: 'split' };
    case 'miles': return { w: `Read ${used} as miles`, ex: st.example, tk: `try_cast(replace(${used}, ',', '') as int)`, icon: 'gauge', more: 'set aside a reading that can’t be read' };

/* the count each line shows, from the run */
function stepCount(st, res) {

  if (s.stop && s.stop.kind === 'column') return `can’t find ${s.stop.want}`;
  if (s.stop && s.stop.lines) return `${plural(s.stop.lines.length, 'line')} stopped`;
  switch (st.op) {
    case 'skipTop': return plural(s.aside.length, 'line');
    case 'header': return `${res.header.length} columns`;
    case 'total': return res.total ? `it says ${res.total.said}` : 'none found';
    case 'blank': case 'copies': return s.aside.length ? `${plural(s.aside.length, 'line')} set aside` : 'none';
    case 'van': return s.changed || s.aside.length ? `${plural(s.changed, 'value')}${s.aside.length ? ` · ${s.aside.length} set aside` : ''}` : 'all fine as they came';
    case 'date': return `${plural(s.changed, 'date')} · ${Object.keys(s.shapes).length} ways`;
    case 'group': return `${plural(s.changed, 'value')}${s.near.length ? ` · ${s.near.length} new spelling` : ''}`;
    case 'result': return `${plural(s.changed, 'value')}${s.aside.length ? ` · ${s.aside.length} set aside` : ''}`;
    case 'miles': return s.changed || s.aside.length ? `${plural(s.changed, 'value')}${s.aside.length ? ` · ${s.aside.length} can’t read` : ''}` : 'all fine as they came';
    case 'match': return s.matched ? `${s.matched.size} known · ${s.fresh.size} new` : '';
    case 'map': return plural(res.recs.length, DATA.kinds[st.kind].word);

}
function stepState(st, res) { const s = res.st[st.id]; if (!s) return 'todo'; if (s.stop) return 'stop'; if (s.near && s.near.length) return 'check'; return 'ok'; }

/* the sheet as the file holds it. opts: lines (subset), cell(l, i) -> class, line(l) -> class, roles (show role gutter), cols */
function sheetHTML(res, o = {}) {

      <p><b>If one is not right,</b> the pass stops. It shows which recipe line made the wrong value, and every other plate that line made, before anything goes.</p>
      <p class="muted">The random pick is seeded by the file, so ${P('p2').name} can taste the same plates in Triage and see what you saw.</p>
      ${all ? `<p><span class="heard">${I('check', 12)} heard</span> All ${PICK.length} the same. The other ${recs.length - PICK.length} go on the same recipe.</p><button class="btn go">${I('send', 14)} Send to Triage</button>` : nBad ? '' : `<button class="btn" aria-disabled="true">${I('send', 14)} Send when tasted</button>`}</aside>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('[data-y]').forEach(b => b.onclick = () => mark(+b.dataset.y, 'ok'));
  $$('[data-n]').forEach(b => b.onclick = () => mark(+b.dataset.n, 'bad'));
}
function mark(n, v) { S.done[n] = v; S.at = PICK.findIndex(p => !S.done[p.r.n]); render(); }
function replay() { clearLater(); S.done = {}; S.at = 0; document.body.classList.add('pre'); render(); settle(ms('--motion-quick')); const t = ms('--motion-run'); later(() => mark(PICK[0].r.n, 'ok'), t); later(() => mark(PICK[1].r.n, 'ok'), t + ms('--motion-calm')); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const p = PICK.find(x => !S.done[x.r.n]); if (!p) return;
  if (e.key.toLowerCase() === 'y') mark(p.r.n, 'ok');
  if (e.key.toLowerCase() === 'n') mark(p.r.n, 'bad');
});
replay();
</script>
