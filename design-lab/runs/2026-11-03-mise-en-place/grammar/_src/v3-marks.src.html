<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Grammar V3 · Marks on a value</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: the twelve marks a value can carry between the file and Triage ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:var(--space-3);min-height:0}
.mk{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);min-height:0;overflow:hidden}
.mk .nm{display:flex;align-items:baseline;gap:var(--space-2);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mk .nm b{font-weight:400;color:var(--light)}
.mk .sp{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;min-height:var(--target-sm)}
.mk .say{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.mk .say i{font-style:normal;color:var(--ink-muted)}
.mk.need{border-color:var(--x-proposed-stop)}
.pen{font-style:italic;border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);padding:0 var(--space-2);font-size:var(--type-meta);color:var(--ink)}
.aside{display:inline-flex;align-items:center;gap:var(--space-2);border:1px dashed var(--x-proposed-aside-edge);background:var(--x-proposed-aside-wash);border-radius:var(--radius-key);padding:2px var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.stop{display:inline-flex;align-items:center;gap:var(--space-2);border:1px solid var(--x-proposed-stop);background:var(--x-proposed-stop-wash);border-radius:var(--radius-key);padding:2px var(--space-2);font-size:var(--type-small);color:var(--x-proposed-stop)}
.new{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-meta);color:var(--light)}
.new::before{content:"";width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--light)}
.match{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-meta);color:var(--light)}
.merge{display:inline-grid;grid-template-columns:auto auto auto;align-items:center;gap:var(--space-2)}
.merge .from{display:grid;gap:2px}
.merge .from .rawv{font-size:var(--x-proposed-type-micro)}
.left{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.left .rawv{text-decoration:line-through;text-decoration-color:var(--ink-muted)}
.ask{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink)}
.foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.foot b{font-weight:400;color:var(--light)}
.foot p{margin:0}
@media (max-width:1400px){.mk{padding:var(--space-2) var(--space-3)}.mk .say{font-size:var(--x-proposed-type-micro);line-height:var(--leading-small)}.foot{font-size:var(--type-small);line-height:var(--leading-small)}.mk .sp{min-height:var(--space-6)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V3</b> twelve marks a value can carry, raw to word asked for · type specimens, conservators' repairs, six ways to be empty</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), PL = plate(R), N = run('nov'), NA = run('nov', DATA.recipe.steps, { rename: { Reg: 'Vehicle' } });
const v6 = R.lines.find(l => l.rec && l.rec.v.van.raw !== l.rec.v.van.val).rec;
const g = R.st.s8.groups['S-N'], near = N.st.s8.near[0], stopV = N.stops.find(s => s.kind === 'value'), aside = PL.aside[0], va = PL.valuesAside[0], ask = DATA.asked[0];
function marks() {
  return [
    { n: 'Raw', s: raw(v6.v.van.raw), say: `As the file holds it: typewriter on a ruled ground. <i>Cell ${COLS[R.header.indexOf(v6.v.van.col)]}${v6.n}, never changed.</i>` },
    { n: 'Kept', s: kept(v6.v.van.val), say: `As ${DATA.app} will keep it: plain type, with a dotted seam under it because a step made it.` },
    { n: 'Seam', s: `${kept(v6.v.van.val)} ${v6.v.van.by.map(stepNo).join('')} <span class="muted" style="font-size:var(--type-small)">was ${raw(v6.v.van.raw)}</span>`, say: `Which recipe line changed it, and what it was. The repair stays visible after Triage.` },
    { n: 'Pencil', s: `<span class="pen">${esc(near.raw)} → ${DEPOT(near.to).name}?</span>`, say: `Proposed by a rule or the model, not yet confirmed by a person. <i>Pencil never counts.</i>` },
    { n: 'Set aside · line', s: `<span class="aside">${I('archive', 12)} line ${aside.n} · ${esc(aside.cells[0])}</span>`, say: `${aside.why}. The whole line waits in the tray, counted at the pass.` },
    { n: 'Set aside · value', s: `${kept(va.van)} <span class="mk-gap" title="not known yet"></span> <span class="muted" style="font-size:var(--type-small)">odometer</span>`, say: `“${esc(va.raw)}” can’t be read. The line lands; its odometer is <i>not known yet</i> (corner ticks), and the raw stays in the tray.` },
    { n: 'Stop', s: `<span class="stop">${I('hand', 12)} ${esc(stopV.value)}</span>`, say: `The line stopped and asks: a value no line knows. <i>The only mark that uses light.</i>`, need: true },
    { n: 'New', s: `<span class="new">van ${PL.fresh[0]}</span>`, say: `Will be proposed as a new thing in Triage. ${DATA.app} holds no van like it.` },
    { n: 'Matched', s: `<span class="match">${I('link', 14)} van ${v6.van.id}</span>`, say: `Linked to a van ${DATA.app} already keeps, by its number. <i>Exact match, so ink.</i>` },
    { n: 'Merged', s: `<span class="merge"><span class="from">${Object.keys(g).slice(0, 3).map(raw).join('')}</span>${arrow()}${kept(DEPOT('S-N').name)}</span>`, say: `${Object.keys(g).length} spellings, one depot. The spellings are kept as names the file uses.` },
    { n: 'Left out', s: `<span class="left">${raw(NA.leftOut[0])} not brought in</span>`, say: `A column the recipe doesn’t use. Said at the pass, never silently ignored. <i>From next month’s file.</i>` },
    { n: 'Word asked for', s: `<span class="ask">${I('message-circle-question', 14)} “${ask.word}”</span>`, say: `${DATA.app} has no detail for ${ask.from} yet. Asked of ${P(ask.decides).name}; kept in the note meanwhile.` }
  ];
}
function render() {
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, 'Kitchen sheet', 'Marks'], [['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div><h1 class="t">Twelve marks a value can carry on its way to Triage</h1><p class="lede">Every example below is a real value from ${FIRM.short}’s files. The same mark means the same thing on every screen of the bench, in the pass, and later on the record.</p></div>
    <div class="grid">${marks().map((m, i) => `<section class="mk dep ${m.need ? 'need' : ''}" style="--i:${i}"><p class="nm"><b>${i + 1}</b> ${m.n}</p><div class="sp">${m.s}</div><p class="say">${m.say}</p></section>`).join('')}</div>
    <div class="foot"><p><b>Only a stop glows.</b> History (raw, seam, merged) is ink; proposals are pencil; light is kept for what needs a person now.</p>
      <p><b>Set aside is a place, not a bin.</b> Lines and values go to one tray, each with its reason and the line that put it there.</p>
      <p><b>Raw is never lost.</b> Every kept value can show what it was, which cell it came from, and which recipe line changed it.</p></div>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); document.body.classList.add('pre'); render(); settle(ms('--motion-run')); }
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
replay();
</script>
</body>
</html>
