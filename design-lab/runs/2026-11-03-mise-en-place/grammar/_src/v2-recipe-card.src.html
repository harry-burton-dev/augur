<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Grammar V2 · The recipe card</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: the recipe as a card, and the anatomy of one line ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:var(--space-6)}
.card{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-5);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane)}
.card h2{margin:0;font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light);letter-spacing:var(--tracking-tight)}
.meta{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.meta b{font-weight:400;color:var(--ink)}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2)}
.ing li{font-size:var(--type-small);line-height:var(--leading-small)}
.card .recipe{flex:1;min-height:0}
.card .rl{background:none}
.card .rl.on{background:var(--surface-raised)}
.anat{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.big{position:relative;border:1px solid var(--light);border-radius:var(--radius-inset);padding:var(--space-4) var(--space-5);background:var(--surface-raised);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2) var(--space-4);align-items:start}
.big .n{font:300 var(--type-title-s)/1 var(--font-mono);color:var(--ink-muted)}
.big .w{font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.big .w u{text-decoration:none;border-bottom:1px solid var(--hairline-strong)}
.big .c{font:400 var(--type-meta)/var(--leading-lead) var(--font-mono);color:var(--ink)}
.big .x{grid-column:2 / span 2;display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
.big .acts{grid-column:2 / span 2;display:flex;gap:var(--space-2)}
.big [data-c]{position:relative}
.big [data-c]::after{content:attr(data-c);position:absolute;top:calc(var(--space-3) * -1);right:calc(var(--space-2) * -1);width:var(--space-4);height:var(--space-4);border-radius:50%;background:var(--slate-deep);border:1px solid var(--light);color:var(--light);font:400 var(--x-proposed-type-micro)/calc(var(--space-4) - 2px) var(--font-mono);text-align:center;opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.big.show [data-c]::after{opacity:1}
.calls{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2) var(--space-5);min-height:0}
.calls li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.calls li .k{display:inline-flex;align-items:center;justify-content:center;width:var(--space-4);height:var(--space-4);border-radius:50%;border:1px solid var(--light);color:var(--light);font:400 var(--x-proposed-type-micro)/1 var(--font-mono);margin-top:2px}
.calls li small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.next{display:grid;gap:var(--space-1);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-2) var(--space-4)}
.rules{border-top:1px solid var(--hairline-strong);padding-top:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta)}
.rules b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.calls li{font-size:var(--type-small);line-height:var(--leading-small)}.card h2{font-size:var(--type-heading);line-height:var(--leading-heading)}.big .w{font-size:var(--type-body)}.calls{gap:var(--space-1) var(--space-4)}.card{padding:var(--space-3) var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V2</b> the recipe card: eight parts of one line · recipe cards, Power Query's applied steps, knitting patterns</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), PL = plate(R), REC = DATA.recipe, N = run('nov');
const S = { on: 's6', show: false };
const CALLS = [
  ['Its number', 'The order it runs in. Drag to reorder; the pass recounts at once.'],
  ['One verb, first', 'Write, read, group, split, set aside, match, make. Seven verbs cover this recipe.'],
  ['The column, by name', 'Named as the file names it, so next month it can say “I can’t find Reg”.'],
  ['The example it was taught', 'The person’s own before and after. It is how the line explains itself.'],
  ['How many, on this file', 'Counted every run. A count that jumps is a reason to look.'],
  ['What it does with misfits', 'Stop and ask, set aside the line, or set aside the value. Never guess.'],
  ['Who taught it, and how', 'By example, by confirming a group, or written. Kept with the version.'],
  ['Turn off, undo, edit', 'A line turned off stays in the recipe, struck through, so the next person sees it was tried.']
];
function big() {
  const st = STEP(S.on), w = stepWords(st, R), s = R.st[st.id];
  const verb = w.w.split(' ')[0], rest = w.w.slice(verb.length);
  const col = s.col || (st.col || [])[0];
  const restHTML = col ? esc(rest).replace(esc(col), `<u data-c="3">${esc(col)}</u>`) : esc(rest);
  const how = st.by === 'example' ? `taught by example · ${P(REC.owner).name} · ${REC.saved}` : st.by === 'confirmed' ? `groups confirmed by ${P(REC.owner).name} · ${REC.saved}` : `written by ${P(REC.owner).name} · ${REC.saved}`;
  return `<div class="big ${S.show ? 'show' : ''}">
    <span class="n" data-c="1">${st.id.slice(1)}</span>
    <span class="w"><span data-c="2">${esc(verb)}</span>${restHTML}<span class="tk">${esc(w.tk)}</span></span>
    <span class="c" data-c="5">${stepCount(st, R)}</span>
    <span class="x">${w.ex ? `<span data-c="4">${pair(w.ex[0], w.ex[1])}</span>` : ''}${w.more ? `<span data-c="6">${I('archive', 12)} ${w.more}</span>` : `<span data-c="6">${I('hand', 12)} stops and asks if a value doesn’t fit</span>`}<span data-c="7">${I('graduation-cap', 12)} ${how}</span></span>
    <span class="acts" data-c="8"><button class="btn sm">${I('eye-off', 12)} Turn off</button><button class="btn sm">${I('undo-2', 12)} Undo</button><button class="btn sm">${I('pencil', 12)} Teach again</button></span></div>`;
}
function render() {
  const cols = R.header;
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, 'Recipes', REC.name], [['↑↓', 'line'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <article class="card scroll" aria-label="Recipe card">
      <p class="eyebrow">${I('book-open', 12)} Recipe ${REC.id} · version ${REC.version}</p>
      <h2>${REC.name}</h2>
      <div class="meta"><span>Makes <b>${PL.land} ${DATA.kinds.inspection.word}s</b> from one ${FIRM.short} file</span><span>Sets aside <b>${PL.aside.length + PL.copies.length} lines, ${PL.valuesAside.length} value</b></span><span>Owner <b>${P(REC.owner).name}</b></span><span>Run <b>${REC.runs}</b> time</span></div>
      <p class="eyebrow">Ingredients</p>
      <ul class="ing">${cols.map(c => `<li>${raw(c)}</li>`).join('')}<li class="muted">from ${esc(R.file.name)}, sheet ${R.file.sheet}</li></ul>
      <p class="eyebrow">Method</p>
      ${recipeHTML(R, { on: S.on, cls: 'tight', examples: false })}
    </article>
    <section class="anat" aria-label="Anatomy of one line">
      <div><p class="eyebrow">One line, taken apart</p><p class="lede" style="margin-top:var(--space-1)">Every line of every recipe has the same eight parts, in the same places, so anyone can follow one and check it. ↑↓ shows another line.</p></div>
      ${big()}
      <ol class="calls">${CALLS.map(([a, b], i) => `<li class="dep" style="--i:${i}"><span class="k">${i + 1}</span><span>${a}<small>${b}</small></span></li>`).join('')}</ol>
      <div class="next"><p class="eyebrow">${I('calendar-clock', 12)} The same line on ${FIRM.short}’s ${N.file.month} file</p>${recipeHTML(N, { steps: [STEP(S.on)], cls: 'tight' })}<p class="lede">Part 3 is why: the line names its column, so when the file renames it the line stops and says what it can’t find, instead of reading the wrong one.</p></div>
      <p class="rules">${I('ruler', 14)} <b>The format rule.</b> One verb, one column, one example, one count, one rule for misfits. A line that needs two verbs is two lines. A line with no example says how it was written instead.</p>
    </section>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.on = 's6'; S.show = false; render(); settle(); later(() => { S.show = true; render(); }, ms('--motion-run')); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const i = REC.steps.findIndex(s => s.id === S.on);
  if (e.key === 'ArrowDown') { S.on = REC.steps[Math.min(i + 1, REC.steps.length - 1)].id; render(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { S.on = REC.steps[Math.max(i - 1, 0)].id; render(); e.preventDefault(); }
});
replay();
</script>
</body>
</html>
