<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Grammar V6 · Wordless steps</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: each recipe line as a wordless before/after picture, with a count, as flat-pack instructions ---- */
:root{
  /* needs token: one pictogram cell (a spreadsheet cell drawn at icon size) */
  --x-proposed-pict-w: calc(var(--space-4) + var(--space-1));
  --x-proposed-pict-h: calc(var(--space-2) + var(--space-1));
}
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:var(--space-3);min-height:0}
.st{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-2);padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);min-height:0;overflow:hidden}
.st .no{display:flex;justify-content:space-between;align-items:baseline;font:300 var(--type-heading)/1 var(--font-mono);color:var(--ink)}
.st .no .x{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light)}
.pic{display:flex;align-items:center;gap:var(--space-3);justify-content:center}
.g{display:grid;gap:2px}
.g .r{display:flex;gap:2px}
.c{width:var(--x-proposed-pict-w);height:var(--x-proposed-pict-h);border-radius:1px;background:var(--hairline-strong)}
.c.e{background:none;outline:1px dashed var(--hairline);outline-offset:-1px}
.c.T{background:var(--ink-muted)}
.c.H{background:var(--ink);box-shadow:0 2px 0 var(--light)}
.c.S{background:repeating-linear-gradient(90deg,var(--ink-muted) 0 2px,transparent 2px 4px)}
.c.A{background:var(--ink)}
.c.B{background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px)}
.c.C{background:radial-gradient(circle,var(--ink) 1px,transparent 1.5px) 0 0 / 4px 4px}
.c.D{background:var(--ink-muted);box-shadow:inset 0 0 0 1px var(--ink)}
.c.K{background:var(--light)}
.c.M{background:color-mix(in srgb,var(--light) 55%,transparent)}
.c.x{background:var(--x-proposed-unseen);outline:1px solid var(--ink-muted);outline-offset:-1px}
.c.g{background:none;outline:1px dotted var(--x-proposed-gap-ink);outline-offset:-1px}
.c.L{background:var(--light);box-shadow:0 0 0 2px var(--slate-deep),0 0 0 3px var(--ink-muted)}
.c.N{background:var(--light);border-radius:50%;width:var(--x-proposed-pict-h)}
.c.P{width:calc(var(--x-proposed-pict-w) * 3);height:calc(var(--x-proposed-pict-h) * 4);border-radius:var(--radius-key);background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--light),inset 0 var(--x-proposed-pict-h) 0 0 var(--light)}
.tray{padding:var(--space-1);border-radius:var(--radius-key)}
.tray.none{border-color:transparent;background:none}
.arr{color:var(--ink-muted);display:inline-flex}
.st .w{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);min-height:calc(var(--leading-small) * 2);transition:opacity var(--motion-base) var(--ease-out)}
.wordless .st .w{opacity:0}
.foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5);font-size:var(--type-meta);line-height:var(--leading-meta)}
.foot p{margin:0}
.foot b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.st{padding:var(--space-2)}.st .no{font-size:var(--type-lead)}.foot{font-size:var(--type-small);line-height:var(--leading-small)}}
</style>
</head>
<body class="pre wordless">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V6</b> wordless steps: each recipe line drawn as before, after and the tray, with a count · IKEA assembly instructions, knitting charts</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), PL = plate(R);
const S = { words: false };
/* one picture per kind of step. codes: . value, e empty, T title, H names, S sum, A B C three shapes of one thing, D a copy,
   K M kept values, x can't be read, g not known yet, L matched, N new, P a record */
const PICT = {
  skipTop: { b: ['TTTT', 'eeee', 'HHHH', '....'], a: ['HHHH', '....'], t: ['TTTT', 'eeee'] },
  header:  { b: ['....', '....'], a: ['HHHH', '....'], t: [] },
  total:   { b: ['....', '....', 'SeSe'], a: ['....', '....'], t: ['SeSe'] },
  blank:   { b: ['....', 'eeee', '....'], a: ['....', '....'], t: ['eeee'] },
  copies:  { b: ['DDDD', 'DDDD', '....'], a: ['DDDD', '....'], t: ['DDDD'] },
  van:     { b: ['A...', 'B...', 'C...', 'x...'], a: ['K...', 'K...', 'K...'], t: ['x...'] },
  date:    { b: ['.A..', '.B..', '.C..'], a: ['.K..', '.K..', '.K..'], t: [] },
  group:   { b: ['..A.', '..B.', '..C.'], a: ['..K.', '..K.', '..M.'], t: [] },
  result:  { b: ['...A'], a: ['...KM'], t: [] },
  miles:   { b: ['..A.', '..x.'], a: ['..K.', '..g.'], t: ['x'] },
  match:   { b: ['K...', 'K...'], a: ['L...', 'N...'], t: [] },
  map:     { b: ['....'], a: ['P'], t: [] }
};
const grid = rows => `<span class="g" aria-hidden="true">${rows.map(r => `<span class="r">${[...r].map(c => `<span class="c ${c === '.' ? '' : c}"></span>`).join('')}</span>`).join('')}</span>`;
/* the count a line shows, as a number only */
function num(st) {
  const s = R.st[st.id];
  if (st.op === 'skipTop' || st.op === 'blank' || st.op === 'copies' || st.op === 'total') return s.aside.length;
  if (st.op === 'header') return R.header.length;
  if (st.op === 'match') return `${s.matched.size}+${s.fresh.size}`;
  if (st.op === 'map') return R.recs.length;
  if (st.op === 'group') return `${Object.values(s.groups).reduce((a, x) => a + Object.keys(x).length, 0)}→${Object.keys(s.groups).length}`;
  return s.changed + (s.aside.length ? `+${s.aside.length}` : '');
}
function render() {
  document.body.classList.toggle('wordless', !S.words);
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, 'Kitchen sheet', 'Wordless'], [['W', S.words ? 'hide words' : 'show words'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div><h1 class="t">Twelve steps, no words</h1><p class="lede" style="margin-top:var(--space-1)">The same recipe as a flat-pack sheet: what the cells look like before, after, and what goes into the tray, with the count for ${FIRM.short}’s ${R.file.month} file. Try reading it, then press W.</p></div>
    <ol class="steps">${DATA.recipe.steps.map((st, i) => { const p = PICT[st.op], w = stepWords(st, R);
      return `<li class="st dep" style="--i:${i}"><span class="no">${st.id.slice(1)}<span class="x">${num(st)}</span></span>
        <span class="pic">${grid(p.b)}<span class="arr">${I('arrow-right', 16)}</span>${grid(p.a)}${p.t.length ? `<span class="tray">${grid(p.t)}</span>` : ''}</span>
        <span class="w">${w.w}<span class="tk">${esc(w.tk)}</span></span></li>`; }).join('')}</ol>
    <div class="foot"><p><b>What the pictures carry well:</b> order, before and after, and that misfits go to the tray, not away. A new hand can check a step by matching shapes.</p>
      <p><b>What they can’t carry:</b> which column, which example, why a value didn’t fit. Steps 7 and 8 draw almost the same; only the column tells them apart.</p>
      <p><b>Where it earns its place:</b> as the icon of each line in the real recipe, and on a phone-sized summary later. Not on its own.</p></div>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); S.words = false; document.body.classList.add('pre'); render(); settle(ms('--motion-run')); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key.toLowerCase() === 'w') { S.words = !S.words; render(); } });
replay();
</script>
</body>
</html>
