<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Grammar V4 · Calls and “heard”</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: the bench calls, the person answers, the recipe says "heard" ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,2.4fr);gap:var(--space-6)}
.brig{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.role{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2) var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--hairline)}
.role svg{color:var(--ink-muted);margin-top:2px}
.role b{display:block;font-weight:400;color:var(--light);font-size:var(--type-meta);line-height:var(--leading-meta)}
.role span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.role i{font-style:normal;color:var(--ink)}
.rules{margin-top:auto;display:grid;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);border-top:1px solid var(--hairline-strong);padding-top:var(--space-3)}
.rules p{margin:0}
.rules b{font-weight:400;color:var(--light)}
.tx{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.calls{flex:1;min-height:0;list-style:none;margin:0;padding:0 var(--space-2) 0 0;display:flex;flex-direction:column;gap:var(--space-3)}
.ex{display:grid;grid-template-columns:var(--space-8) minmax(0,1fr) minmax(220px,30%);gap:var(--space-2) var(--space-4);align-items:start;padding-bottom:var(--space-3);border-bottom:1px solid var(--hairline);transition:opacity var(--motion-calm) var(--ease-out)}
.ex.wait{opacity:.18}
.ex .who{font:400 var(--type-label)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.ex .call{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.ex .call .rawv{font-size:var(--x-proposed-type-micro)}
.ex .ans{display:grid;gap:var(--space-1)}
.ex .a{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.ex .a svg{color:var(--ink-muted)}
.ex .h{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ex .h .heard{margin-right:var(--space-1)}
.ex .alt{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.ex.open .call{color:var(--x-proposed-stop)}
.ex.open .who{color:var(--x-proposed-stop)}
.role span{display:block}
@media (max-width:1400px){.role span{display:none}.role{padding:var(--space-2) 0}.rules p:last-child{display:none}.ex{grid-template-columns:var(--space-7) minmax(0,1fr) minmax(200px,32%)}.ex .call,.ex .a{font-size:var(--type-small);line-height:var(--leading-small)}.role{padding:var(--space-2) 0}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V4</b> calls and “heard”: call only when a guess would change what lands · the brigade's call and response, jidoka</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), PL = plate(R), me = P(DATA.me), ask = DATA.asked[0];
const g = R.st.s8.groups, nSp = Object.values(g).reduce((a, x) => a + Object.keys(x).length, 0);
const S = { shown: 0 };
const CALLS = [
  { call: `Lines 1–2 look like a title and line 3 like column names: ${R.header.map(raw).join(' ')}. Read them so?`, a: 'Yes', steps: ['s1', 's2'], alt: 'or pick another line as the names' },
  { call: `Line ${R.total.line} starts ${raw(STEP('s3').first)} and says ${R.total.said} visits. Set it aside and check our count against it?`, a: 'Yes, check against it', steps: ['s3'], alt: 'or keep it as a line (it would fail the pass)' },
  { call: `You wrote ${raw(STEP('s6').example[0])} as ${kept(STEP('s6').example[1])}. ${R.st.s6.changed - 1} more van numbers fit. Line ${PL.aside[0].n}, ${raw(PL.aside[0].cells[0])}, doesn’t. Set it aside, or which van was it?`, a: `Set it aside; I’ll ask ${P(R.file.from).name}`, steps: ['s6'], alt: `or name the van; ${P(R.file.from).name} could also answer` },
  { call: `${nSp} spellings in Depot look like ${DATA.depots.length} depots ${DATA.app} keeps. Confirm the groups?`, a: 'Confirmed, and take near spellings next time', steps: ['s8'], alt: 'or split a group, or make a new depot (a proposal)' },
  { call: `On line ${PL.valuesAside[0].n}, Odometer ${raw(PL.valuesAside[0].raw)} can’t be read as miles. Set aside just the value, and land the rest of the line?`, a: 'Just the value', steps: ['s10'], alt: 'or the whole line, or type the reading' },
  { call: `${DATA.app} has no detail for Type (${ask.values.map(raw).join(' ')}). Ask ${P(ask.decides).name} for “${ask.word}”, and keep Type in the note until then?`, a: `Ask ${P(ask.decides).name.split(' ')[0]}`, steps: ['s12'], alt: 'or leave Type out (said at the pass)' }
];
function render() {
  const roles = [
    ['user-round', `${me.name}, at the bench`, `<i>The cook.</i> Brings the file in, teaches each step by example, answers the calls.`],
    ['book-open', `The recipe, “${DATA.recipe.name}”`, `<i>Written down as it’s taught.</i> ${DATA.recipe.steps.length} lines, each one an answer below.`],
    ['clipboard-check', `${P('p2').name}, at Triage`, `<i>The pass.</i> Decides what is kept. Sees the same plate and the same tray.`],
    ['message-circle-question-mark', `${P(ask.decides).name}, ${DATA.app} admin`, `<i>Supplies new words.</i> Answers calls no cook can, like a detail ${DATA.app} doesn’t have.`],
    ['mail', `${P(R.file.from).name}, ${FIRM.short}`, `<i>The supplier.</i> Can be asked about a line; never sees the bench.`]
  ];
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, 'Kitchen sheet', 'Calls'], [['N', 'next call'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <aside class="brig"><div><h1 class="t">Calls and “heard”</h1><p class="lede" style="margin-top:var(--space-1)">In a kitchen the pass calls and the line answers “heard”. Here the bench calls, the person answers, and the recipe says heard by writing a numbered line.</p></div>
      ${roles.map(([ic, b, s]) => `<div class="role">${I(ic, 16)}<div><b>${b}</b><span>${s}</span></div></div>`).join('')}
      <div class="rules"><p><b>Call only when a guess would change what lands.</b> Six calls for ${PL.data} lines.</p><p><b>Every answer becomes a line.</b> “Heard” names which, so it reruns next month without the call.</p><p><b>Every call offers the other answers</b> and who else could give one.</p></div></aside>
    <section class="tx"><p class="eyebrow">${I('messages-square', 12)} Bringing in ${esc(R.file.name)} · ${S.shown} of ${CALLS.length} calls answered</p>
      <ol class="calls scroll">${CALLS.map((c, i) => {
        const done = i < S.shown, open = i === S.shown;
        return `<li class="ex ${done ? '' : open ? 'open' : 'wait'}"><span class="who">${open ? I('hand', 12) + ' Bench' : 'Bench'}</span><span class="call">${c.call}</span>
        <span class="ans">${done ? `<span class="a">${I('corner-down-right', 14)} ${c.a}</span><span class="h"><span class="heard">${I('check', 12)} heard</span> recipe line ${c.steps.map(s => s.slice(1)).join(' and ')}: ${stepWords(STEP(c.steps[c.steps.length - 1]), R).w.replace(/^./, c => c.toLowerCase())}</span>` : open ? `<span class="a">${I('corner-down-right', 14)} <button class="btn sm go" data-ans>${c.a}</button></span>` : ''}<span class="alt">${c.alt}</span></span></li>`;
      }).join('')}</ol></section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $('[data-ans]') && ($('[data-ans]').onclick = () => { S.shown++; render(); });
}
function replay() {
  clearLater(); S.shown = 0; render(); settle();
  const t = ms('--motion-run'), step = ms('--motion-calm') / 2;
  for (let i = 1; i <= 4; i++) later(() => { S.shown = i; render(); }, t + (i - 1) * step);
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'n') { clearLater(); S.shown = Math.min(S.shown + 1, CALLS.length); render(); }
});
replay();
</script>
</body>
</html>
