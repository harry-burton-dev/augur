<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Next month V2 · Month over month</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: this month's file against last month's, column by column; only differences are lit ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-4)}
.whole{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-3)}
.w1{padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.w1 b{display:block;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.w1.diff{border-color:var(--hairline-strong)}
.w1.diff b{color:var(--light)}
.grid{min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:0;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);overflow:hidden}
.r{display:grid;grid-template-columns:minmax(150px,.6fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);gap:var(--space-4);align-items:start;padding:var(--space-2) var(--space-4);border-top:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.r:first-child{border-top:0}
.r.h{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;background:var(--surface-inset)}
.r .nm{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.r .vals{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.r .vals .rawv{font-size:var(--x-proposed-type-micro)}
.r .vals .rawv.new{border-color:var(--light);color:var(--light)}
.r .vals .rawv.gone{text-decoration:line-through;opacity:var(--x-proposed-quiet)}
.r .say{color:var(--ink)}
.r.same{opacity:.55}
.r.same .say{color:var(--ink-muted)}
.r.stop .say{color:var(--x-proposed-stop)}
.r.stop{box-shadow:inset 2px 0 0 var(--x-proposed-stop)}
.r.check .say{color:var(--x-proposed-disagree)}
.r.check{box-shadow:inset 2px 0 0 var(--x-proposed-disagree)}
.r.new{box-shadow:inset 2px 0 0 var(--light)}
.r .say svg{vertical-align:-2px}
@media (max-width:1400px){.r{padding:var(--space-1) var(--space-3);gap:var(--space-3)}.whole{grid-template-columns:repeat(3,minmax(0,1fr))}.whole .w1:nth-child(n+4){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Next month · V2</b> month over month: this file against last month's, column by column; only differences are lit · a tailor's fitting, diff</div>
<script>
/*@DATA@*/
/*@LIB@*/
const OCT = run('oct'), NOV = run('nov'), F0 = OCT.file, F1 = NOV.file;
const SHOW = 8;
function sum(p) { const byValue = p.distinct <= 12; return { byValue, items: byValue ? Object.keys(p.values) : Object.values(p.shapes).map(s => s.ex), shapes: Object.keys(p.shapes) }; }
function compare(h) {
  const inO = OCT.header.includes(h), inN = NOV.header.includes(h);
  const po = inO && profile(OCT, h), pn = inN && profile(NOV, h);
  if (inO && !inN) {
    const twin = NOV.header.find(x => !OCT.header.includes(x) && Object.keys(profile(NOV, x).shapes).every(s => po.shapes[s]));
    return { h, cls: 'stop', o: sum(po).items, n: [], say: `${I('hand', 12)} Gone. ${twin ? `${raw(twin)} is new and its values have the same shapes, so it is probably ${raw(h)} renamed. The recipe reads ${raw(h)} on ${plural(DATA.recipe.steps.filter(s => (s.col || [])[0] === h).length, 'line')}, so it stops there.` : 'The recipe stops where it reads it.'}`, twin };
  }
  if (!inO && inN) {
    const looksLikeOld = OCT.header.find(x => !NOV.header.includes(x) && Object.keys(pn.shapes).every(s => profile(OCT, x).shapes[s]));
    if (looksLikeOld) return { h, cls: 'new', o: [], n: sum(pn).items.slice(0, SHOW), say: `${I('arrow-right-left', 12)} New name, old shapes: ${pn.n} of ${pn.n} look like ${raw(looksLikeOld)} did.` };
    return { h, cls: 'check', o: [], n: sum(pn).items, say: `${I('eye', 12)} New column, ${pn.distinct} different values.${Object.keys(pn.values).every(v => /^[A-Z]\.\s?[A-Z][a-z]+$/.test(v)) ? ' They look like people’s names (an initial and a surname).' : ''} Not brought in unless you say so, and the pass will list it.` };
  }
  const so = sum(po), sn = sum(pn);
  const fresh = so.byValue ? sn.items.filter(v => !so.items.includes(v)) : sn.shapes.filter(s => !so.shapes.includes(s)).map(s => pn.shapes[s].ex);
  const gone = so.byValue ? so.items.filter(v => !sn.items.includes(v)) : [];
  if (!fresh.length) return { h, cls: 'same', o: so.items.slice(0, SHOW), n: sn.items.slice(0, SHOW), say: `${I('check', 12)} Same ${so.byValue ? 'values' : 'shapes'} as ${F0.month.split(' ')[0]}${gone.length ? `, ${gone.length} not used this month` : ''}.`, fresh, gone };
  /* new values the recipe already handles are not news; only those it can't read stop it */
  const handles = v => h === OCT.st.s9.col ? !!readResult(v) : h === OCT.st.s8.col ? STEP('s8').groups.some(g => g.from.includes(v)) : h === OCT.st.s10.col ? readMiles(v) != null : h === OCT.st.s7.col ? !!readDate(v, 2026) : true;
  const bad = fresh.filter(v => !handles(v) && !(h === OCT.st.s8.col && NOV.st.s8.near.some(x => x.raw === v)));
  const near = h === OCT.st.s8.col ? fresh.filter(v => NOV.st.s8.near.some(x => x.raw === v)) : [];
  if (!bad.length && !near.length) return { h, cls: 'same', o: so.items.slice(0, SHOW), n: sn.items.slice(0, SHOW), fresh: [], gone: [], say: `${I('check', 12)} ${STEP('s12').cols[h] === 'note' || STEP('s12').cols[h] === 'asked' ? 'Free text: new words every month, which is not news.' : `${plural(fresh.length, 'new value')} the recipe already reads (${fresh.map(raw).join(' ')}).`}` };
  if (!bad.length) return { h, cls: 'check', o: so.items.slice(0, SHOW), n: sn.items.slice(0, SHOW), fresh, gone, fresh: near, say: `${I('eye', 12)} ${near.map(raw).join(' ')} is new. It is near ${raw(NOV.st.s8.near[0].like)}, so the recipe joins it to ${DEPOT(NOV.st.s8.near[0].to).name}; check once.` };
  return { h, cls: 'stop', o: so.items.slice(0, SHOW), n: sn.items.slice(0, SHOW), fresh, gone, say: `${I('hand', 12)} ${bad.map(raw).join(' ')} is new, ${plural(pn.values[bad[0]] ? pn.values[bad[0]].length : 0, 'line')}. No line of the recipe knows what to do with it.${fresh.length > bad.length ? ` (${fresh.filter(v => !bad.includes(v)).map(raw).join(' ')} is new too, and is read as before.)` : ''}`, fresh: bad };
}
function render() {
  const cols = [...new Set([...NOV.header, ...OCT.header])];
  const rows = cols.map(compare).sort((a, b) => ['stop', 'check', 'new', 'same'].indexOf(a.cls) - ['stop', 'check', 'new', 'same'].indexOf(b.cls));
  const DL0 = dataLinesOf(OCT).length, DL1 = dataLinesOf(NOV).length;
  const sheets0 = F0.otherSheets.map(s => s.name), sheets1 = F1.otherSheets.map(s => s.name);
  const whole = [
    { d: true, b: `${DL1} lines of visits`, s: `${DL0} last month; the TOTAL says ${NOV.total.said}` },
    { d: false, b: 'title and names in the same place', s: `line ${STEP('s2').line}, under a merged title` },
    { d: NOV.total.text !== OCT.total.text, b: 'TOTAL moved one column', s: `it still starts with ${STEP('s3').first}, so the recipe finds it` },
    { d: sheets0.join() !== sheets1.join(), b: `${sheets0.filter(s => !sheets1.includes(s)).map(s => `“${s}”`).join(', ')} sheet gone`, s: `other sheets: ${sheets1.join(', ')}` },
    { d: F1.formulas !== F0.formulas, b: `${plural(F1.formulas, 'formula')}`, s: `${F0.formulas} last month; its value is read, never the formula` }
  ];
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, F1.name], [['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div><h1 class="t">${F1.month.split(' ')[0]} against ${F0.month.split(' ')[0]}</h1><p class="lede" style="margin-top:var(--space-1)">${esc(F1.name)} from ${P(F1.from).name}, held against ${esc(F0.name)}. What is the same is dimmed; what is different is said, worst first.</p></div>
    <div class="whole">${whole.map(w => `<div class="w1 ${w.d ? 'diff' : ''}"><b>${w.b}</b>${w.s}</div>`).join('')}</div>
    <div class="grid scroll"><div class="r h"><span>column</span><span>${F0.month}</span><span>${F1.month}</span><span>what changed</span></div>
      ${rows.map((r, i) => `<div class="r ${r.cls} dep" style="--i:${i}"><span class="nm">${raw(r.h)}</span>
        <span class="vals">${r.o.map(v => `<span class="rawv ${r.gone && r.gone.includes(v) ? 'gone' : ''}">${esc(v)}</span>`).join('') || '<span>—</span>'}</span>
        <span class="vals">${r.n.map(v => `<span class="rawv ${r.fresh && r.fresh.includes(v) ? 'new' : ''}">${esc(v)}</span>`).join('') || '<span>—</span>'}</span>
        <span class="say">${r.say}</span></div>`).join('')}</div>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); document.body.classList.add('pre'); render(); settle(ms('--motion-run')); }
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
replay();
</script>
</body>
</html>
