<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Next month V6 · Rehearsed to the pass</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: a saved recipe runs on its own when the file arrives, up to the pass and never past it; only a stop asks for anyone ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:var(--space-6)}
.home{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.grp{display:grid;gap:var(--space-2)}
.grp > .eyebrow{margin-bottom:var(--space-1)}
.it{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:center;padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane)}
.it .ic{display:inline-flex;align-items:center;justify-content:center;width:var(--space-6);height:var(--space-6);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);color:var(--ink-muted);grid-row:span 2}
.it .w{font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink)}
.it .s{grid-column:2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.it .r{grid-row:span 2;display:flex;gap:var(--space-2);align-items:center}
.it.need{border-color:var(--x-proposed-stop)}
.it.need .ic{border-color:var(--x-proposed-stop);color:var(--x-proposed-stop);box-shadow:0 0 var(--glow-blur) color-mix(in srgb,var(--x-proposed-stop) 35%,transparent)}
.it.need .w{color:var(--light)}
.it.quiet{background:none}
.empty{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted);padding:var(--space-2) var(--space-4)}
.how{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.steps li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.steps li svg{color:var(--ink-muted);margin-top:2px}
.steps li.no svg{color:var(--x-proposed-stop)}
.steps li small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.how .toggle{align-self:flex-start}
@media (max-width:1400px){.it{padding:var(--space-2) var(--space-3)}.it .w{font-size:var(--type-meta);line-height:var(--leading-meta)}.steps li{font-size:var(--type-small);line-height:var(--leading-small)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Next month · V6</b> rehearsed to the pass: saved recipes run when the file arrives, stop at the pass, and only a stop asks · dark when normal, a prep list</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = DATA.december, steps = DATA.recipe.steps, F1 = DATA.files.nov, me = P(DATA.me);
const N0 = run('nov'), NA = run('nov', steps, { rename: { [D.rename.from]: D.rename.to }, value: { [D.newWord.value]: D.newWord.choice } });
const S = { normal: false, arrived: false };
function render() {
  const P0 = plate(N0), PA = plate(NA);
  const kestrel = { recipe: DATA.recipe.name, from: FIRM.name, file: F1.name, arrived: F1.received };
  const stops = N0.stops.filter(s => !s.also);
  const need = !S.normal && S.arrived;
  const ready = [...(S.arrived && S.normal ? [{ ...kestrel, land: PA.land, aside: PA.aside.length, kind: DATA.kinds.inspection.word }] : []), ...DATA.otherRuns];
  $('#app').innerHTML = topHTML(['Home'], [['N', S.normal ? 'this month' : 'a normal month'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <section class="home"><div><h1 class="t">Good morning, ${me.name.split(' ')[0]}</h1><p class="lede" style="margin-top:var(--space-1)">${D.today}. Files that arrived overnight have been prepared by their saved recipes, as far as the pass.</p></div>
      <div class="grp"><p class="eyebrow">${I('hand', 12)} Needs you</p>
        ${need ? `<div class="it need dep" style="--i:0"><span class="ic">${I('chef-hat', 18)}</span><span class="w">“${kestrel.recipe}” stopped at ${plural(stops.length, 'line')} on ${FIRM.short}’s ${F1.month} file</span><span class="r"><button class="btn go sm">${I('arrow-right', 12)} Answer</button></span>
          <span class="s">${stops.map(s => s.kind === 'column' ? `can’t find ${s.want}` : `“${s.value}” on ${plural(s.lines.length, 'line')}`).join(' · ')} · ${P0.land} ready behind the stops · arrived ${kestrel.arrived}</span></div>`
          : `<p class="empty">${I('circle', 12)} Nothing. ${S.arrived ? 'Every run that arrived went to the pass without stopping.' : 'Nothing has stopped.'}</p>`}</div>
      <div class="grp"><p class="eyebrow">${I('utensils', 12)} Ready at the pass</p>
        ${ready.map((r, i) => `<div class="it quiet dep" style="--i:${i + 1}"><span class="ic">${I('clipboard-check', 18)}</span><span class="w">“${r.recipe}”: ${plural(r.land, r.kind)} ready${r.aside ? `, ${r.aside} set aside` : ''}</span><span class="r"><button class="btn sm">Check and send</button></span>
          <span class="s">${esc(r.file)} from ${r.from} · arrived ${r.arrived} · nothing stopped</span></div>`).join('')}</div>
      <p class="lede" style="font-size:var(--type-small)">Nothing here has reached Triage. A recipe never sends on its own: someone checks the pass every time.</p></section>
    <aside class="how"><p class="eyebrow">${I('book-open', 12)} What happens when a file arrives</p>
      <ol class="steps"><li>${I('mail', 14)}<span>It is kept as it came<small>${F1.doc.id} in ${F1.doc.library}, before anything reads it</small></span></li>
        <li>${I('book-open', 14)}<span>The recipe that matches its sender and columns runs<small>${DATA.recipe.name}, version ${DATA.recipe.version}, for files from ${FIRM.short}</small></span></li>
        <li>${I('check', 14)}<span>Lines that run as before stay quiet<small>no notice, no badge, no count on Home</small></span></li>
        <li class="no">${I('hand', 14)}<span>A line that can’t run stops the recipe there<small>and it is the only thing that lands under “Needs you”</small></span></li>
        <li>${I('utensils', 14)}<span>It stops at the pass, every time<small>a person checks and sends; ${P('p2').name} decides in Triage</small></span></li></ol>
      <p class="lede" style="font-size:var(--type-small)">Press N to see the same morning in a month where ${FIRM.short}’s file didn’t change shape: nothing lights, and the run waits quietly with the others.</p></aside>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); Object.assign(S, { normal: false, arrived: false }); render(); settle(); later(() => { S.arrived = true; document.body.classList.add('pre'); render(); settle(ms('--motion-instant')); }, ms('--motion-run')); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key.toLowerCase() === 'n') { S.normal = !S.normal; S.arrived = true; render(); } });
replay();
</script>
</body>
</html>
