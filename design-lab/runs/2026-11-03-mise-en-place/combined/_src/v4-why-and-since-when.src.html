<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Combined V4 · Why, and since when</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V4: a van in Data Atlas a month later; every reading says which file, cell, recipe line, version and hand made it ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(260px,.75fr) minmax(0,1.5fr) minmax(300px,.95fr);gap:var(--space-5)}
.rec{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.rec h1{margin:0;display:flex;align-items:center;gap:var(--space-2);font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light)}
.rec dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2) var(--space-4);margin:0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.rec dt{color:var(--ink-muted)}
.rec dd{margin:0;color:var(--ink)}
.rec dd .keptv{font-size:var(--type-meta)}
.insps{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-1)}
.insps li{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink);padding:var(--space-1) 0;border-top:1px solid var(--hairline)}
.insps li .m{color:var(--ink-muted);margin-left:auto;font-family:var(--font-mono)}
.time{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.rd{display:grid;grid-template-columns:var(--space-8) var(--space-5) minmax(0,1fr) auto;gap:var(--space-3);align-items:start;padding:var(--space-3) var(--space-3);border:1px solid transparent;border-radius:var(--radius-inset);text-align:left;width:100%}
.rd:hover{background:var(--surface-raised)}
.rd[aria-pressed="true"]{border-color:var(--hairline-strong);background:var(--surface-pane)}
.rd .d{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);text-align:right}
.rd .pin{position:relative;display:flex;justify-content:center;padding-top:var(--space-1)}
.rd .pin i{width:var(--space-3);height:var(--space-3);border-radius:50%;border:1px solid var(--ink-muted);background:var(--slate-deep)}
.rd.cur .pin i{background:var(--ink)}
.rd .v{font-size:var(--type-body);line-height:var(--leading-body);color:var(--light)}
.rd .v .sm{font-size:var(--type-small);color:var(--ink-muted)}
.rd .src{grid-column:3 / span 2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rd .hand{font:400 var(--x-proposed-type-micro)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.rd.repair .v{border-left:2px solid var(--ink-muted);padding-left:var(--space-2)}
.rd.repair .hand{color:var(--ink)}
.rd.gapr .v{color:var(--ink-muted)}
.line{position:relative}
.line::before{content:"";position:absolute;left:calc(var(--space-8) + var(--space-3) + var(--space-3) + var(--space-2));top:var(--space-5);bottom:var(--space-5);width:1px;background:var(--hairline-strong)}
.why{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane)}
.why h2{margin:0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.prov{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink)}
.prov span:nth-child(odd){color:var(--ink-muted)}
.why p{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.why p b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){.rd{grid-template-columns:var(--space-7) var(--space-4) minmax(0,1fr) auto;padding:var(--space-2)}.rd .v{font-size:var(--type-meta);line-height:var(--leading-meta)}.why{padding:var(--space-3)}.line::before{display:none}.rec dl{font-size:var(--type-small);line-height:var(--leading-small)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V4</b> why, and since when: a van a month later; every reading names its file, cell, recipe line and hand · grammar V5, wear and time</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = DATA.december, REC = DATA.recipe, F0 = DATA.files.oct, F1 = DATA.files.nov, K = DATA.kinds.inspection, REG = DATA.register;
const ANS = { rename: { [D.rename.from]: D.rename.to }, value: { [D.newWord.value]: D.newWord.choice } };
const R1 = run('oct'), R2 = run('nov', DATA.recipe.steps, ANS);
const TA = DATA.trayAnswers.find(a => a.detail === 'odometer');
const VID = TA.van, V = VAN(VID);
const r1 = R1.recs.find(r => r.van.id === VID), r2 = R2.recs.find(r => r.van.id === VID);
const cellOf = (res, r, col) => `${res.file.sheet}!${COLS[res.header.indexOf(col)]}${r.n}`;
/* the odometer readings this van has, oldest first, each with where it came from */
const READS = [
  { d: V.last, v: fmt(V.odo), src: `from ${REG.name} (${REG.doc}), before any recipe`, hand: 'register', prov: [['from', `${REG.doc} · ${REG.name}`], ['by', `${P(REG.by).name} · ${REG.at}`]], note: `The reading ${DATA.app} held when ${FIRM.short}’s first file arrived.` },
  { d: r1.v.on.val, v: null, raw: r1.v.odometer.raw, src: `${F0.doc.id} · ${cellOf(R1, r1, r1.v.odometer.col)} said “${r1.v.odometer.raw}”; set aside by line ${r1.v.odometer.by[0].slice(1)}`, hand: 'set aside', gap: true, prov: [['was', `“${r1.v.odometer.raw}”`], ['from', `${F0.doc.id} · ${cellOf(R1, r1, r1.v.odometer.col)}`], ['made by', `${REC.id} v${REC.version} line ${r1.v.odometer.by[0].slice(1)}: set aside, can’t be read as miles`], ['run', `${F0.run.n} · ${F0.run.at}`], ['note', `“${r1.v.note.val}”`]], note: `The ${K.word} landed; this reading stayed in the tray, marked not known yet, never guessed.` },
  { d: TA.at.split(',')[0], v: fmt(TA.value), src: `${P(TA.by).name}, ${TA.how}`, hand: 'by hand', repair: true, prov: [['was', `not known yet (tray, line ${TA.line} of ${F0.doc.id})`], ['by', `${P(TA.by).name} · ${TA.at}`], ['how', TA.how], ['kept by', `Triage ${TA.triage} · ${P('p2').name}`]], note: `A repair, not an edit: it stays on the record as a seam with who, when and how. It is the only reading here no file gave.` },
  { d: r2.v.on.val, v: r2.v.odometer.val, src: `${F1.doc.id} · ${cellOf(R2, r2, r2.v.odometer.col)} · ${REC.id} v${REC.version + 1}${r2.v.odometer.by.length ? ` line ${r2.v.odometer.by[0].slice(1)}` : ', as it came'}`, hand: 'from file', cur: true, prov: [['was', `“${r2.v.odometer.raw}”`], ['from', `${F1.doc.id} · ${cellOf(R2, r2, r2.v.odometer.col)}`], ['made by', `${REC.id} v${REC.version + 1} line ${STEP('s10').id.slice(1)}: ${lc(stepWords(STEP('s10'), R2).w)}${r2.v.odometer.by.length ? '' : ' (nothing to change)'}`], ['run', `${F1.run.n} · ${F1.run.at} · ${P(DATA.me).name}`], ['kept by', `Triage ${F1.run.triage} · ${P('p2').name} · ${F1.run.decided}`], ['note', `“${r2.v.note.val}”`]], note: `The current reading. Its note, “${r2.v.note.val}”, agrees with the job card ${P(TA.by).name.split(' ')[0]} typed the October reading from.` }
];
const S = { on: 3 };
function render() {
  const x = READS[S.on];
  $('#app').innerHTML = topHTML([DATA.app, 'Vans', VID], [['↑↓', 'reading'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <section class="rec"><p class="eyebrow">${I(DATA.kinds.van.icon, 12)} ${DATA.kinds.van.word} · ${F(DATA.myFloor).name}</p><h1>${VID}</h1>
      <dl><dt>${KD('depot').word}</dt><dd>${DEPOT(V.depot).name}</dd><dt>${KD('odometer').word}</dt><dd>${kept(r2.v.odometer.val)} miles</dd><dt>last inspected</dt><dd>${kept(r2.v.on.val)}</dd><dt>due</dt><dd>${overdue(V.depot, R2, D.today).ids.includes(VID) ? 'overdue' : 'in date'}</dd></dl>
      <p class="eyebrow">${I(K.icon, 12)} ${K.word}s</p>
      <ul class="insps">${[r2, r1].map(r => `<li>${kept(r.v.on.val)} ${r.v.result.val}<span class="m">${r === r1 ? `${F0.doc.id} · v${REC.version}` : `${F1.doc.id} · v${REC.version + 1}`}</span></li>`).join('')}<li class="muted">${V.last} · from the register</li></ul></section>
    <section class="time"><div><h2 class="t">Odometer, since when</h2><p class="lede" style="margin-top:var(--space-1)">Every reading this van has had, with where it came from. Three hands: a file read by a recipe, a register, and a person.</p></div>
      <div class="line">${READS.map((r, i) => `<button class="rd ${r.cur ? 'cur' : ''} ${r.repair ? 'repair' : ''} ${r.gap ? 'gapr' : ''} dep" style="--i:${i}" data-i="${i}" aria-pressed="${S.on === i}"><span class="d">${r.d}</span><span class="pin"><i></i></span><span class="v">${r.v ? `${r.v} <span class="sm">miles</span>` : `<span class="mk-gap"></span> <span class="sm">not known yet</span>`}</span><span class="hand">${r.hand}</span><span class="src">${r.src}</span></button>`).join('')}</div></section>
    <aside class="why"><p class="eyebrow">${I('history', 12)} Why, and since when</p><h2>${x.v ? `${x.v} miles` : 'Not known yet'}, ${x.d}</h2>
      <div class="prov">${x.prov.map(([a, b]) => `<span>${a}</span><span>${esc(b)}</span>`).join('')}</div>
      <p>${x.note}</p>
      <p class="tk">prov: ${x.hand === 'from file' || x.hand === 'set aside' ? `wasDerivedFrom ${x.prov[1][1].split(' · ')[0]}#${x.prov[1][1].split(' · ')[1]} · wasGeneratedBy run/${x.hand === 'from file' ? F1.run.n : F0.run.n} · used ${REC.id}@${x.hand === 'from file' ? REC.version + 1 : REC.version}` : x.hand === 'by hand' ? `wasAttributedTo ${TA.by} · hadPrimarySource JC-5512` : `wasDerivedFrom ${REG.doc}`}</p>
      <p><b>If the recipe changes again,</b> readings made by an older version keep their version. A rerun of version ${REC.version + 2} would show which of them it would make differently before touching any.</p>
      <p>${x.hand === 'by hand' ? `<b>If this reading is corrected,</b> the correction is one more seam, with its own who and how; this one stays visible under it.` : `<b>If ${x.hand === 'register' ? REG.doc : x.hand === 'set aside' ? F0.doc.id : F1.doc.id} is withdrawn</b> in Artifacts, what was read from it stays, marked, and stops counting as evidence.`}</p></aside>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('[data-i]').forEach(b => b.onclick = () => { S.on = +b.dataset.i; render(); });
}
function replay() { clearLater(); S.on = 3; document.body.classList.add('pre'); render(); settle(ms('--motion-quick')); later(() => { S.on = 2; render(); }, ms('--motion-run')); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowDown') { S.on = Math.min(READS.length - 1, S.on + 1); render(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { S.on = Math.max(0, S.on - 1); render(); e.preventDefault(); }
});
replay();
</script>
</body>
</html>
