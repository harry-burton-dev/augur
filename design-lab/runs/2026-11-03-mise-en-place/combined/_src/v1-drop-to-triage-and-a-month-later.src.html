<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Combined V1 · From drop to Triage, and a month later</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V1: one messy file from arrival to Triage, then next month's file with two new problems ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4)}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) var(--space-6) repeat(4,minmax(0,1fr));gap:var(--space-1);align-items:end}
.sg{display:grid;gap:var(--space-1);padding:var(--space-1) var(--space-2) var(--space-2);border-bottom:2px solid var(--hairline);text-align:left;color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);transition:border-color var(--motion-base) var(--ease-out),color var(--motion-base) var(--ease-out)}
.sg .k{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.sg.done{border-bottom-color:var(--ink-muted);color:var(--ink)}
.sg.on{border-bottom-color:var(--light);color:var(--light)}
.sg.stop{border-bottom-color:var(--x-proposed-stop)}
.gap{align-self:stretch;display:flex;align-items:flex-end;justify-content:center;padding-bottom:var(--space-2);font:400 var(--x-proposed-type-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:center;border-left:1px dashed var(--hairline-strong);border-right:1px dashed var(--hairline-strong)}
.body{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,26%);gap:var(--space-5)}
.stage{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.stage .h{display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap}
.stage .h .when{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.rail{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);border-left:1px solid var(--hairline);padding-left:var(--space-5)}
.rail .rbox{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.rail .rm{display:none}
.rail .tray{flex:none;max-height:40%;overflow:auto}
.rail .tray{padding:var(--space-2) var(--space-3)}
.rail .tray li{font-size:var(--type-small);line-height:var(--leading-small)}
.rail .vers{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.card{border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);padding:var(--space-3) var(--space-4);display:grid;gap:var(--space-2);align-content:start}
.card.lit{border-color:var(--x-proposed-pass-edge)}
.card.stop{border-color:var(--x-proposed-stop);background:var(--x-proposed-stop-wash)}
.card p{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.card p.s{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.card b{font-weight:400;color:var(--light)}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-1)}
.chk li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.chk li svg{margin-top:1px;color:var(--x-proposed-lit)}
.chk li.look svg{color:var(--x-proposed-disagree)}
.chk li.stop svg{color:var(--x-proposed-stop)}
.chk li.ink svg{color:var(--ink-muted)}
.chk li small{display:block;color:var(--ink-muted)}
.big-n{display:flex;gap:var(--space-5);flex-wrap:wrap}
.big-n span{font-size:var(--type-small);color:var(--ink-muted)}
.big-n b{display:block;font:300 var(--type-heading)/1 var(--font-mono);color:var(--light)}
.sheetbox{min-height:0;flex:1;overflow:hidden;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset)}
.sheetbox .sheet td,.sheetbox .sheet th{padding:0 var(--space-2)}
.sheetbox .sheet td.ok{border-bottom:1px dotted var(--x-proposed-seam)}
.sent{font-size:var(--type-lead);line-height:var(--leading-lead);font-weight:300;color:var(--ink);margin:0;max-width:64ch}
.sent b{font-weight:400;color:var(--light);border-bottom:1px dotted var(--x-proposed-seam)}
.note{border-left:2px solid var(--x-proposed-disagree);padding:var(--space-1) var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.note small{display:block;color:var(--ink-muted);font-size:var(--type-small)}
.prov{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-4);font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink)}
.prov span:nth-child(odd){color:var(--ink-muted)}
.foot{margin-top:auto;display:flex;align-items:center;gap:var(--space-3);font-size:var(--type-small);color:var(--ink-muted)}
.foot .btn{margin-left:auto}
.dl{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) minmax(0,1fr);gap:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);padding:var(--space-1) 0;border-top:1px solid var(--hairline)}
.dl del{color:var(--ink-muted)}
.dl ins{text-decoration:none;color:var(--light);border-bottom:1px solid var(--light)}
@media (max-width:1400px){.body{grid-template-columns:minmax(0,1fr) minmax(280px,28%);gap:var(--space-4)}.rail{padding-left:var(--space-4)}.card{padding:var(--space-2) var(--space-3)}.card p{font-size:var(--type-small);line-height:var(--leading-small)}.sent{font-size:var(--type-body);line-height:var(--leading-body)}.sg{font-size:var(--x-proposed-type-micro);padding:var(--space-1)}.rail .recipe .rl .rc{display:none}.rail .recipe .rl{grid-template-columns:var(--space-5) minmax(0,1fr) var(--space-4)}.rail .tray li small{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V1</b> one messy file to Triage, then next month's with two new problems · bring-in, by-example, mapping, pass, next month</div>
<script>
/*@DATA@*/
/*@LIB@*/
const steps = DATA.recipe.steps, D = DATA.december, F0 = DATA.files.oct, F1 = DATA.files.nov, K = DATA.kinds.inspection, me = P(DATA.me), boss = P('p2'), ask = DATA.asked[0], H = DATA.triageHold;
const R = run('oct'), PL = plate(R), N0 = run('nov');
const ANS = { rename: { [D.rename.from]: D.rename.to }, value: { [D.newWord.value]: D.newWord.choice } };
const v2 = steps.map(st => (st.col || [])[0] === D.rename.from ? { ...st, col: [D.rename.from, D.rename.to] } : st.op === 'map' ? { ...st, cols: { ...st.cols, [D.newCol.name]: 'left out' } } : st);
const NA = run('nov', v2, ANS), PN = plate(NA), DS = downstream(R);
const ST = [
  { k: 'Arrives', m: 'oct', w: F0.received }, { k: 'First look', m: 'oct', w: F0.received }, { k: 'Tidy', m: 'oct', w: '' }, { k: 'Map', m: 'oct', w: '' }, { k: 'The pass', m: 'oct', w: F0.run.at }, { k: 'Triage', m: 'oct', w: F0.run.decided },
  { k: 'Arrives, reruns', m: 'nov', w: F1.received }, { k: 'Two answers', m: 'nov', w: '' }, { k: 'The pass', m: 'nov', w: F1.run.at }, { k: 'Kept', m: 'nov', w: F1.run.decided }
];
const S = { at: 0 };
const ex = l => `${raw(l)}`;
/* the recipe as it stands at each stage */
function railRecipe() {
  const i = S.at;
  if (i === 0) return `<p class="lede">No recipe yet. This is ${FIRM.short}’s first file on the bench.</p>`;
  const lines = i === 1 ? steps.slice(0, 5) : i === 2 ? steps.slice(0, 10) : steps;
  if (i < 6) return `<p class="vers">${I('book-open', 12)} “${DATA.recipe.name}” · version ${DATA.recipe.version}${i >= 4 ? ' · saved' : ' · being written'}</p><div class="rbox">${recipeHTML(run('oct', lines), { steps: lines, cls: 'tight' })}</div>`;
  if (i === 6) return `<p class="vers">${I('book-open', 12)} version ${DATA.recipe.version} on ${F1.month.split(' ')[0]}’s file</p><div class="rbox">${recipeHTML(N0, { cls: 'tight' })}</div>`;
  return `<p class="vers">${I('book-open', 12)} version ${DATA.recipe.version + 1} · three lines changed by your answers</p><div class="rbox">${recipeHTML(NA, { steps: v2, cls: 'tight' })}</div>`;
}
function railTray() { if (S.at < 2) return ''; return trayHTML(S.at < 6 ? R : S.at === 6 ? N0 : NA); }
/* the sheet as tidied by the first ten lines, kept values shown with their seam */
function tidySheet() {
  const T = run('oct', steps.slice(0, 10)), H0 = T.header, KEY = { van: 's6', on: 's7', depot: 's8', result: 's9', odometer: 's10' };
  const cols = Object.fromEntries(Object.entries(KEY).map(([k, s]) => [H0.indexOf(STEP(s).col[0]), k]));
  const tmp = document.createElement('div');
  tmp.innerHTML = sheetHTML(T, { line: l => l.role === 'aside' ? 'aside' : ['title', 'blank', 'total', 'copy', 'header'].includes(l.role) ? (l.role === 'header' ? '' : 'dim') : '', cell: (l, i) => l.rec && cols[i] && l.rec.v[cols[i]] && l.rec.v[cols[i]].val !== l.rec.v[cols[i]].raw ? (l.rec.v[cols[i]].aside ? 'pen' : 'ok') : '' });
  $$('tbody tr', tmp).forEach(tr => { const l = T.lines[+tr.dataset.n - 1]; if (!l.rec) return; Object.entries(cols).forEach(([i, k]) => { const v = l.rec.v[k]; if (v && v.val !== v.raw) { tr.children[+i + 1].textContent = v.aside ? 'not known yet' : v.val; tr.children[+i + 1].title = `was “${v.raw}” · recipe line ${v.by[0].slice(1)}`; } }); });
  return tmp.innerHTML;
}
const STAGE = [
  /* 1 · arrives */ () => `<div class="cards">
    <div class="card dep" style="--i:0"><p class="s">${I('mail', 12)} ${F0.received} · ${F0.via}</p><p><b>${esc(F0.subject)}</b>, from ${P(F0.from).name}</p><p class="s">${I('file-spreadsheet', 12)} ${esc(F0.name)} · ${F0.otherSheets.length + 1} sheets</p><p class="s">${I('receipt', 12)} Kept as it came: ${F0.doc.id} in ${F0.doc.library}. Nothing below changes it.</p></div>
    <div class="card dep" style="--i:1"><p class="s">${I('clipboard-list', 12)} Goods in</p><ul class="chk">
      <li>${I('check', 12)}<span>From ${FIRM.name}, a firm ${DATA.app} keeps</span></li>
      <li class="look">${I('eye', 12)}<span>${F0.otherSheets.length + 1} sheets; only ${F0.sheet} holds visits<small>${F0.otherSheets.map(s => `${s.name}: ${s.what}`).join('; ')}; listed at the pass</small></span></li>
      <li>${I('check', 12)}<span>Its own count agrees<small>${PL.data} lines of visits − ${PL.copies.length} exact copy = ${R.total.said}, as the TOTAL says</small></span></li>
      <li>${I('check', 12)}<span>No people’s names found</span></li></ul></div></div>
    <p class="sent dep" style="--i:2">A spreadsheet of <b>${PL.data} visits</b> by ${FIRM.short} in ${F0.month}: van numbers written ${profile(R, R.st.s6.col).ways} ways, dates in ${Object.keys(R.st.s7.shapes).length} shapes, ${Object.values(R.st.s8.groups).reduce((a, g) => a + Object.keys(g).length, 0)} spellings of ${PL.depots.length} depots, results with notes inside, an odometer that isn’t a reading, a loan van with no number, and a title, empty lines and a TOTAL around them.</p>`,
  /* 2 · first look */ () => `<div class="cards"><div class="card dep" style="--i:0"><p class="s">${I('scale', 12)} Settled by the file</p><ul class="chk">
      <li class="ink">${I('calendar', 12)}<span>Dates are day first<small>${R.recs.filter(r => r.v.on.shape === 'd/m/y' && +r.v.on.raw.split('/')[0] > 12).length} only make sense day first, none month first</small></span></li>
      <li class="ink">${I('calendar-days', 12)}<span>Dates with no year are ${STEP('s7').year}</span></li>
      <li class="ink">${I('hash', 12)}<span>${R.recs.filter(r => r.v.on.shape === 'serial').map(r => ex(r.v.on.raw)).join(' ')} are the spreadsheet’s day numbers</span></li>
      <li class="ink">${I('copy', 12)}<span>Line ${PL.copies[0].n} is the same visit as line ${PL.copies[0].of}</span></li></ul></div>
    <div class="card lit dep" style="--i:1"><p class="s">${I('hand', 12)} Asked, because it changes what lands</p><ul class="chk">
      <li>${I('check', 12)}<span>Line ${PL.aside[0].n}, ${ex(PL.aside[0].cells[0])}: set aside, ask ${P(F0.from).name}<small>heard · recipe line ${PL.aside[0].by.slice(1)}</small></span></li>
      <li>${I('check', 12)}<span>${ex(ask.from)} has no detail: ask ${P(ask.decides).name} for “${ask.word}”<small>heard · kept in the note meanwhile</small></span></li></ul></div></div>
    <div class="sheetbox scroll dep" style="--i:2">${sheetHTML(run('oct', steps.slice(0, 5)), { line: l => ['title', 'blank', 'total', 'copy'].includes(l.role) ? 'dim' : '' })}</div>`,
  /* 3 · tidy */ () => `<div class="cards"><div class="card dep" style="--i:0"><p class="s">${I('pen-line', 12)} You changed line ${R.lines.find(l => l.cells[0] === STEP('s6').example[0]).n}: ${pair(...STEP('s6').example)}</p><p>Reading 1 of 3: <b>write every van number like ${STEP('s6').example[1]}</b> · ${R.st.s6.changed} values; ${ex(PL.aside[0].cells[0])} can’t be read, as you said.</p></div>
      <div class="card dep" style="--i:1"><p class="s">${I('hand', 12)} The line stopped once</p><p>Line ${PL.valuesAside[0].n}, odometer ${ex(PL.valuesAside[0].raw)}: <b>set aside just this reading</b>. The visit lands; its odometer is not known yet.</p></div></div>
    <div class="sheetbox scroll dep" style="--i:2">${tidySheet()}</div>`,
  /* 4 · map */ () => { const r = R.recs.find(x => x.v.result.val === 'failed' && x.v.rnote), nv = R.recs.find(x => x.van.status === 'new'), near = VAN(DATA.vans.filter(v => lev(v[0], nv.van.id) <= 1).map(v => v[0]).sort().pop()), lk = DATA.model.links[0];
    return `<p class="sent dep" style="--i:0">Each line is an ${K.word} of a <b>van</b> at a <b>depot</b> on <b>inspected on</b>, <b>result</b>, with <b>odometer</b> miles and a <b>note</b>, by <b>${FIRM.short}</b>. <span class="muted">Line ${r.n} reads: an ${K.word} of ${r.v.van.val} at ${r.v.depot.val} on ${r.v.on.val}: ${r.v.result.val} (${esc(r.v.note.val)}), ${r.v.odometer.val} miles.</span></p>
    <div class="cards"><div class="card dep" style="--i:1"><p class="s">${I('link', 12)} In ink</p><p>${R.st.s11.matched.size} vans match exactly by number, all ${PL.depots.length} depots, and ${FIRM.name}. ${ex(ask.from)} has no place yet; it waits in the note.</p></div>
      <div class="card lit dep" style="--i:2"><p class="s">${I('scale', 12)} Weighed</p><p><b>${nv.van.id}</b> isn’t a van ${DATA.app} keeps. The nearest, ${near.id}, reads ${fmt(near.odo)} miles; this one ${nv.v.odometer.val}, and its note says “${esc(nv.v.note.val)}”. You proposed it as new.</p></div>
      <div class="card dep" style="--i:3;grid-column:span 2"><p class="s">${I('pencil', 12)} Pencil, from the model</p><p><i>Line ${lk.from} follows up line ${lk.to}</i>: ${lk.why}. You inked it.</p></div></div>` },
  /* 5 · pass */ () => `<div class="big-n dep" style="--i:0">${[[PL.land, `new ${K.word}s`], [PL.fresh.length, 'new van'], [PL.odo.length, 'odometers'], [PL.depots.length + 1, 'kept things linked'], [PL.aside.length + PL.valuesAside.length, 'set aside'], [PL.copies.length + PL.notRecords.length + F0.otherSheets.length, 'not brought in, said']].map(([n, w]) => `<span><b>${n}</b>${w}</span>`).join('')}</div>
    <div class="cards"><div class="card lit dep" style="--i:1"><p class="s">${I('check', 12)} It balances</p><p>${R.lines.length} lines − ${PL.notRecords.length} not visits = ${PL.data} − ${PL.copies.length} copy = <b>${R.total.said}</b>, as the file says, = <b>${PL.land}</b> land + <b>${PL.aside.length}</b> set aside.</p></div>
      <div class="card dep" style="--i:2"><p class="s">${I('utensils', 12)} Tasted 7 of ${PL.land}</p><p>Every plate one of your answers touched, and three at random. All the same as their lines.</p></div>
      <div class="card dep" style="--i:3"><p class="s">${I(DS[0].icon, 12)} What it moves</p><p>${DS[0].what}: ${DS[0].now} → <b>${DS[0].after}</b>. ${P(DS[2].owner).name}’s watch tells her once.</p></div>
      <div class="card dep" style="--i:4"><p class="s">${I('send', 12)} Sent</p><p>${PL.land + PL.fresh.length + PL.odo.length} proposals to ${boss.name}’s Triage, with the recipe, your answers and what you tasted.</p></div></div>`,
  /* 6 · triage */ () => `<div class="cards"><div class="card dep" style="--i:0"><p class="s">${I('clipboard-check', 12)} ${boss.name}, Triage · ${F0.run.decided}</p><p>Kept <b>${PL.land + PL.fresh.length + PL.odo.length - PL.fresh.length - 1}</b> of ${PL.land + PL.fresh.length + PL.odo.length}. Held the new van and its ${K.word}:</p><p class="note">“${esc(H.note)}”<small>${boss.name} · ${H.at}</small></p></div>
      <div class="card dep" style="--i:1"><p class="s">${I('chef-hat', 12)} At the bench</p><p><span class="heard">${I('check', 12)} heard</span> The tray stays with you: ${PL.aside.length} line and ${PL.valuesAside.length} value to answer when ${P(F0.from).name} replies. The recipe is saved for next month.</p></div></div>
    <p class="sent dep" style="--i:2">${DATA.app} now keeps ${PL.land - 1} new ${K.word}s, each pointing at its line in ${F0.doc.id} and at the recipe lines that made it. ${DS[0].what.split('“')[1].replace('”', '')} reads <b>${DS[0].after}</b>.</p>`,
  /* 7 · next month arrives */ () => { const stops = N0.stops.filter(s => !s.also); return `<div class="card stop dep" style="--i:0"><p class="s">${I('hand', 12)} Needs you · ${F1.received}</p><p><b>“${DATA.recipe.name}” stopped at ${plural(stops.length, 'line')}</b> on ${FIRM.short}’s ${F1.month} file. ${plate(N0).land} ${K.word}s are ready behind the stops. Nothing has reached Triage.</p></div>
    <div class="cards"><div class="card dep" style="--i:1"><p class="s">${I('check', 12)} Ran as last month</p><p>${steps.filter(st => stepState(st, N0) === 'ok').length} of ${steps.length} recipe lines, quietly: the title, the names, the TOTAL (now in another column), the dates, the odometers.</p></div>
      <div class="card dep" style="--i:2"><p class="s">${I('eye', 12)} Check once</p><p>${N0.st.s8.near.map(n => `${ex(n.raw)} is new and near ${ex(n.like)}; joined ${DEPOT(n.to).name}`).join('')}.</p></div></div>
    <div class="sheetbox scroll dep" style="--i:3">${sheetHTML(N0, { lines: [3, ...stops.flatMap(s => s.lines || []), ...N0.st.s8.near.flatMap(n => n.lines)].sort((a, b) => a - b), cell: (l, i) => (l.n === 3 && N0.header[i] === D.rename.to) || (stops.some(s => s.lines && s.lines.includes(l.n)) && N0.header[i] === STEP('s9').col[0]) ? 'stopc' : N0.st.s8.near.some(n => n.lines.includes(l.n)) && N0.header[i] === STEP('s8').col[0] ? 'pr' : '' })}</div>`; },
  /* 8 · two answers */ () => { const col = N0.stops.find(s => s.kind === 'column'), val = N0.stops.find(s => s.kind === 'value');
    return `<div class="cards"><div class="card dep" style="--i:0"><p class="s">${I('hand', 12)} Stopped · answered</p><p><b>${ex(col.want)} is called ${ex(col.guess)} now.</b> ${col.fit} of ${col.of} of its values look like van numbers, as ${col.want}’s did. You said yes.</p></div>
      <div class="card dep" style="--i:1"><p class="s">${I('hand', 12)} Stopped · answered</p><p><b>${ex(val.value)}</b> on ${plural(val.lines.length, 'line')}: no result ${DATA.app} keeps is like it. You set them aside and asked ${P(D.newWord.decides).name} for “${D.newWord.ask}”.</p></div></div>
    <div class="card dep" style="--i:2"><p class="s">${I('history', 12)} So the recipe changes, not the data: version ${DATA.recipe.version} → ${DATA.recipe.version + 1}</p>
      ${steps.map((st, i) => { const a = stepWords(st, R).w, b = stepWords(v2[i], NA).w; const ch = st.op === 'van' || st.op === 'result' || st.op === 'map'; if (!ch) return ''; const b2 = st.op === 'result' ? `${b}<ins>; set aside “${esc(D.newWord.value)}” until “${D.newWord.ask}” exists</ins>` : st.op === 'map' ? `${b}<ins>; leave ${D.newCol.name} out</ins>` : b.replace(D.rename.to, `${D.rename.from} or <ins>${D.rename.to}</ins>`); return `<div class="dl"><span class="muted">${st.id.slice(1)}</span><del>${a}</del><span>${b2}</span></div>`; }).join('')}
      <p class="s">${R.recs.length} ${K.word}s from ${F0.month} keep “made by version ${DATA.recipe.version}”.</p></div>` },
  /* 9 · pass again */ () => `<div class="big-n dep" style="--i:0">${[[PN.land, `new ${K.word}s`], [PN.odo.length, 'odometers'], [PN.aside.length, 'set aside, waiting on a word'], [NA.leftOut.length, 'column left out, said']].map(([n, w]) => `<span><b>${n}</b>${w}</span>`).join('')}</div>
    <div class="cards"><div class="card lit dep" style="--i:1"><p class="s">${I('check', 12)} It balances</p><p>The file says <b>${NA.total.said}</b> = <b>${PN.land}</b> land + <b>${PN.aside.length}</b> set aside.</p></div>
      <div class="card dep" style="--i:2"><p class="s">${I('truck', 12)} ${PN.fresh.join(', ')} again</p><p>Still waiting in Triage since ${F0.month.split(' ')[0]} (held by ${boss.name}). This month’s ${PN.fresh[0]} ${K.word} joins that proposal instead of proposing the van twice.</p></div>
      <div class="card dep" style="--i:3"><p class="s">${I('eye-off', 12)} Left out, said</p><p>${NA.leftOut.map(ex).join(' ')}: ${profile(N0, D.newCol.name).distinct} names, no detail fits. ${F0.otherSheets.filter(s => !F1.otherSheets.some(x => x.name === s.name)).map(s => `“${s.name}” sheet gone`).join('')}.</p></div>
      <div class="card dep" style="--i:4"><p class="s">${I('send', 12)} Sent</p><p>${PN.land + PN.odo.length} proposals to ${boss.name}, made by version ${DATA.recipe.version + 1}. At ${F1.run.decided.split(', ')[1]} she keeps all but the ${PN.fresh[0]} ${K.word}, which waits with its van.</p></div></div>`,
  /* 10 · kept */ () => { const r = NA.recs.find(x => x.v.van.raw !== x.v.van.val), v = r.v, cell = `${COLS[NA.header.indexOf(v.van.col)]}${r.n}`;
    return `<p class="sent dep" style="--i:0">An ${K.word} of <b>${v.van.val}</b> at <b>${v.depot.val}</b> on <b>${v.on.val}</b>: <b>${v.result.val}</b>${v.note.val ? ` (${esc(v.note.val)})` : ''}, <b>${v.odometer.val}</b> miles, by ${FIRM.name}.</p>
    <div class="cards"><div class="card dep" style="--i:1"><p class="s">${I('history', 12)} Why, and since when: the van</p><div class="prov"><span>was</span><span>“${esc(v.van.raw)}”, column ${v.van.col}</span><span>from</span><span>${F1.doc.id} · ${F1.sheet}!${cell}</span><span>made by</span><span>${DATA.recipe.id} v${DATA.recipe.version + 1} line ${v.van.by[0].slice(1)}</span><span>run</span><span>${F1.run.n} · ${F1.run.at} · ${me.name}</span><span>kept by</span><span>Triage ${F1.run.triage} · ${boss.name}</span></div></div>
      <div class="card dep" style="--i:2"><p class="s">${I('history', 12)} Why, and since when: the depot</p><div class="prov"><span>was</span><span>“${esc(v.depot.raw)}”</span><span>made by</span><span>${DATA.recipe.id} v${DATA.recipe.version} line ${v.depot.by[0].slice(1)}, unchanged in v${DATA.recipe.version + 1}</span><span>joined</span><span>${Object.keys(NA.st.s8.groups[v.depot.id]).length} spellings, confirmed ${DATA.recipe.saved.split(',')[0]}</span></div></div></div>
    <p class="lede dep" style="--i:3">Two months, two versions of one recipe, ${(R.recs.length - PL.fresh.length) + (NA.recs.length - PN.fresh.length)} ${K.word}s kept, and every value can say which file, cell, recipe line and run made it. The tray still holds ${PL.aside.length + PL.valuesAside.length + PN.aside.length} things to answer, each with its reason.</p>` }
];
function render() {
  const i = S.at, st = ST[i];
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, st.m === 'oct' ? F0.name : F1.name], [['←→', 'stage'], ['1–0', 'jump'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <nav class="stages" aria-label="Stages">${ST.map((s, j) => (j === 6 ? `<span class="gap">a month later</span>` : '') + `<button class="sg ${j < i ? 'done' : ''} ${j === i ? 'on' : ''} ${j === 6 && i >= 6 ? 'stop' : ''}" data-s="${j}"><span class="k">${j + 1} · ${s.m === 'oct' ? F0.month.split(' ')[0] : F1.month.split(' ')[0]}</span>${s.k}</button>`).join('')}</nav>
    <div class="body"><section class="stage"><div class="h"><h1 class="t">${i + 1}. ${st.k}</h1><span class="when">${st.w}</span></div>${STAGE[i]()}</section>
      <aside class="rail">${railRecipe()}${railTray()}</aside></div>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('[data-s]').forEach(b => b.onclick = () => go(+b.dataset.s));
}
function go(i) { S.at = Math.max(0, Math.min(ST.length - 1, i)); document.body.classList.add('pre'); render(); settle(ms('--motion-instant')); }
function replay() { clearLater(); const h = +(location.hash.match(/s=(\d+)/) || [])[1]; S.at = h ? h - 1 : 0; document.body.classList.add('pre'); render(); settle(ms('--motion-quick')); if (!h) later(() => go(1), ms('--motion-run')); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowRight') go(S.at + 1);
  if (e.key === 'ArrowLeft') go(S.at - 1);
  if (/^[0-9]$/.test(e.key)) go(e.key === '0' ? 9 : +e.key - 1);
});
replay();
</script>
