<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Combined V2 · The bench</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V2: the working surface: the sheet, readings beside the cell you fixed, the recipe writing itself, calls, and the tray underneath ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,30%);grid-template-rows:minmax(0,1fr) auto;gap:var(--space-4) var(--space-5)}
.sheetwrap{position:relative;min-height:0;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);overflow:hidden}
.sheetwrap .scroll{height:100%}
.sheetwrap .sheet td,.sheetwrap .sheet th{padding:1px var(--space-2)}
.sheetwrap .sheet td.ok{font-family:var(--font-sans);border-bottom:1px dotted var(--x-proposed-seam)}
.pop{position:absolute;z-index:2;width:min(400px,46%);display:grid;gap:var(--space-2);padding:var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));box-shadow:var(--shadow-overlay);transition:opacity var(--motion-base) var(--ease-out)}
.pop.hide{opacity:0;pointer-events:none}
.pop .y{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.pop .rd{display:grid;grid-template-columns:var(--space-4) minmax(0,1fr) auto;gap:var(--space-2);padding:var(--space-1) var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);text-align:left}
.pop .rd[aria-pressed="true"]{border-color:var(--light);background:var(--surface-raised)}
.pop .rd .k{font-family:var(--font-mono);color:var(--ink-muted)}
.pop .rd .c{font-family:var(--font-mono);color:var(--ink-muted)}
.pop .rd small{display:block;color:var(--ink-muted)}
.pop .rd .miss{color:var(--x-proposed-stop)}
.side{min-height:0;grid-row:span 2;display:flex;flex-direction:column;gap:var(--space-3)}
.side .rbox{flex:1;min-height:0}
.side .rm{display:none}
.rl.fresh{animation:land var(--motion-calm) var(--ease-out)}
@keyframes land{from{opacity:0;transform:translateX(var(--space-2))}to{opacity:1;transform:none}}
.call{border:1px solid var(--x-proposed-stop);background:var(--x-proposed-stop-wash);border-radius:var(--radius-inset);padding:var(--space-3);display:grid;gap:var(--space-2)}
.call .eyebrow{color:var(--x-proposed-stop)}
.call p{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.call p.s{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.call .acts{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.heardline{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.tray.strip{padding:var(--space-2) var(--space-4)}
.tray.strip ul{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.tray.strip li{font-size:var(--type-small);line-height:var(--leading-small)}
.next{display:flex;align-items:center;gap:var(--space-3);font-size:var(--type-small);color:var(--ink-muted)}
.next .btn{margin-left:auto}
@media (max-width:1400px){.sheetwrap .sheet{font-size:var(--x-proposed-type-micro)}.side .rbox .rl .rc{display:none}.side .rbox .rl{grid-template-columns:var(--space-5) minmax(0,1fr) var(--space-4)}.tray.strip li small{display:none}.pop{width:min(360px,52%)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V2</b> the bench: readings beside the cell you fixed, the recipe writing itself, one call, the tray under it · by-example, grammar</div>
<script>
/*@DATA@*/
/*@LIB@*/
const steps = DATA.recipe.steps, F0 = DATA.files.oct, st6 = STEP('s6');
/* lines 1-5 from the first reading, 7-8 already taught; this is the moment Ade fixes a van number */
const BEFORE = ['s1', 's2', 's3', 's4', 's5', 's7', 's8'].map(STEP);
const S = { reading: null, used: false, call: false, heard: false };
const ex = l => l.cells[0] === st6.example[0];
function current() {
  const list = [...BEFORE]; if (S.used) list.splice(5, 0, S.heard ? st6 : { ...st6, unreadable: undefined });
  return run('oct', list);
}
const READ = [
  { w: `Write every van number like ${st6.example[1]}`, f: readVan },
  { w: `Change only “${st6.example[0]}”`, f: v => v === st6.example[0] ? st6.example[1] : v },
  { w: 'Make the column upper case', f: v => v.toUpperCase() }
];
function render() {
  const R = current(), H = R.header, ci = H.indexOf(st6.col[0]);
  const exLine = R.lines.find(ex), live = R.lines.filter(l => !l.role || l.role === 'land' || l.role === 'stop');
  const KEY = { van: ci, on: H.indexOf(STEP('s7').col[0]), depot: H.indexOf(STEP('s8').col[0]) };
  const tmp = document.createElement('div');
  tmp.innerHTML = sheetHTML(R, {
    line: l => l.role === 'aside' ? 'aside' : l.role === 'stop' ? 'stop' : ['title', 'blank', 'total', 'copy'].includes(l.role) ? 'dim' : '',
    cell: (l, i) => {
      if (i === ci && l === exLine) return 'ex';
      if (i === ci && S.reading != null && !S.used && !l.role) { const o = READ[S.reading].f(l.cells[i]); return o == null ? 'stopc' : o !== l.cells[i] ? 'pen' : ''; }
      const k = Object.keys(KEY).find(k => KEY[k] === i); const v = l.rec && k && l.rec.v[k]; return v && v.val !== v.raw ? 'ok' : '';
    } });
  $$('tbody tr', tmp).forEach(tr => { const l = R.lines[+tr.dataset.n - 1];
    if (l === exLine) tr.children[ci + 1].textContent = st6.example[1];
    else if (S.reading != null && !S.used && !l.role) { const o = READ[S.reading].f(l.cells[ci]); if (o) tr.children[ci + 1].textContent = o; }
    if (!l.rec) return; Object.entries(KEY).forEach(([k, i]) => { const v = l.rec.v[k]; if (v && v.val !== v.raw) { tr.children[i + 1].textContent = v.val; tr.children[i + 1].title = `was “${v.raw}” · recipe line ${v.by[0].slice(1)}`; } }); });
  const shown = [...BEFORE]; if (S.used) shown.splice(5, 0, st6);
  const stopLine = R.lines.find(l => l.role === 'stop');
  const asideLine = R.lines.find(l => l.role === 'aside');
  const eff = s => { let ch = 0, miss = 0, still = 0; live.forEach(l => { if (l === exLine) return; const o = s.f(l.cells[ci]); if (o == null) miss++; else { if (o !== l.cells[ci]) ch++; if (!/^[A-Z]{2}-\d{2}$/.test(o)) still++; } }); return { ch, miss, still }; };
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, F0.name, 'Tidy'], [['1–3', 'reading'], ['Enter', 'use it'], ['S', 'set aside'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <section class="sheetwrap" id="sw"><div class="scroll">${tmp.innerHTML}</div>
      <div class="pop ${S.used ? 'hide' : ''}" id="pop"><span class="y">${I('pen-line', 12)} You changed line ${exLine.n}: ${pair(...st6.example)}. What did you mean?</span>
        ${READ.map((r, i) => { const e = eff(r); return `<button class="rd" data-r="${i}" aria-pressed="${S.reading === i}"><span class="k">${i + 1}</span><span>${r.w}${e.miss ? `<small class="miss">${e.miss} can’t be read this way: it will stop and ask</small>` : `<small>${e.still} would still not be like ${st6.example[1]}</small>`}</span><span class="c">${e.ch + 1}</span></button>`; }).join('')}</div></section>
    <aside class="side"><p class="eyebrow">${I('book-open', 12)} “${DATA.recipe.name}” · being written</p>
      <div class="rbox scroll">${recipeHTML(R, { steps: shown, cls: 'tight', on: S.used && !S.heard ? 's6' : null })}</div>
      ${stopLine && !S.heard ? `<div class="call"><p class="eyebrow">${I('hand', 12)} The line stopped</p><p>Line ${stopLine.n} says ${raw(stopLine.cells[ci])} where a van number goes. Which van was it?</p><p class="s">Its note: “${esc(stopLine.cells[stopLine.cells.length - 1])}”. ${FIRM.short} counted it in their ${R.total.said}. Guessing would put a visit on the wrong van.</p>
        <div class="acts"><button class="btn sm go" data-h>${I('archive', 12)} Set aside, ask ${P(F0.from).name.split(' ')[0]}</button><button class="btn sm">Name the van</button><button class="btn sm">Not a visit</button></div></div>` : ''}
      ${S.heard ? `<p class="heardline"><span class="heard">${I('check', 12)} heard</span> recipe line ${st6.id.slice(1)} now also says: set aside a line with no van number. Next month it won’t ask.</p>` : ''}
      <div class="next">${I('arrow-right', 12)} Next: ${raw(STEP('s9').col[0])} has ${profile(R, STEP('s9').col[0]).distinct} ways of writing ${new Set(Object.keys(profile(R, STEP('s9').col[0]).values).map(v => readResult(v)?.result)).size} results <button class="btn sm">Fix one</button></div></aside>
    ${trayHTML(R, { cls: 'strip' })}
  </div></main>`;
  Icons.hydrate($('#app'));
  place();
  $$('[data-r]').forEach(b => b.onclick = () => { S.reading = +b.dataset.r; render(); });
  $('[data-h]') && ($('[data-h]').onclick = () => { S.heard = true; render(); });
}
function place() {
  const sw = $('#sw'), pop = $('#pop'), R = current(), exLine = R.lines.find(ex); if (!pop) return;
  const tr = $(`tr[data-n="${exLine.n}"]`, sw), td = tr && tr.children[R.header.indexOf(st6.col[0]) + 2];
  if (!td) return; const a = sw.getBoundingClientRect(), b = td.getBoundingClientRect();
  pop.style.left = `${Math.min(b.left - a.left, a.width - pop.offsetWidth - 8)}px`; pop.style.top = `${b.top - a.top - 4}px`;
}
function use() { if (S.reading == null || S.reading !== 0) return; S.used = true; render(); }
function replay() { clearLater(); Object.assign(S, { reading: null, used: false, heard: false }); document.body.classList.add('pre'); render(); settle(ms('--motion-quick')); later(() => { S.reading = 0; render(); }, ms('--motion-run')); later(use, ms('--motion-run') + ms('--motion-calm') * 2); }
addEventListener('resize', place);
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) { place(); return; }
  if (/^[1-3]$/.test(e.key) && !S.used) { clearLater(); S.reading = +e.key - 1; render(); }
  if (e.key === 'Enter' && !e.target.closest('button')) { clearLater(); use(); }
  if (e.key.toLowerCase() === 's' && S.used) { S.heard = true; render(); }
});
replay();
</script>
</body>
</html>
