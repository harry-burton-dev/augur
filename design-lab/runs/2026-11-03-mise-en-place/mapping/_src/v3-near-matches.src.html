<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Mapping V3 · Near matches to confirm</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: what the file names, matched to what Data Atlas keeps: exact matches in ink, the near one weighed with evidence ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--space-6)}
.left{min-height:0;display:flex;flex-direction:column;gap:var(--space-4)}
.band{display:grid;gap:var(--space-2)}
.band .hd{display:flex;align-items:baseline;gap:var(--space-3)}
.band .hd b{font-weight:400;font-size:var(--type-lead);color:var(--light)}
.band .hd span{font-size:var(--type-small);color:var(--ink-muted)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2)}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-pill);font-size:var(--type-small);color:var(--ink)}
.chip svg{color:var(--ink-muted)}
.chip.new{border-color:var(--light);color:var(--light)}
.chip.new::before{content:"";width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--light)}
.chip .c{font-family:var(--font-mono);color:var(--ink-muted)}
.how{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:0}
.weigh{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane)}
.weigh h2{margin:0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.cmp{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:0;font-size:var(--type-meta);line-height:var(--leading-meta);border:1px solid var(--hairline);border-radius:var(--radius-key);overflow:hidden}
.cmp > span{padding:var(--space-1) var(--space-3);border-bottom:1px solid var(--hairline)}
.cmp > span:nth-last-child(-n+3){border-bottom:0}
.cmp .h{font:400 var(--type-label)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);background:var(--surface-inset)}
.cmp .k{color:var(--ink-muted)}
.cmp .same{color:var(--ink)}
.cmp .diff{color:var(--x-proposed-disagree)}
.verdict{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.verdict svg{color:var(--ink-muted);margin-top:2px}
.opts{display:grid;gap:var(--space-2)}
.opt{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2);align-items:start;padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);text-align:left;font-size:var(--type-meta);line-height:var(--leading-meta)}
.opt:hover{background:var(--surface-raised)}
.opt[aria-pressed="true"]{border-color:var(--light);background:var(--surface-raised)}
.opt small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.opt .c{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.prop{border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.prop b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.weigh{padding:var(--space-3);gap:var(--space-2)}.cmp{font-size:var(--type-small);line-height:var(--leading-small)}.opt{padding:var(--space-1) var(--space-2);font-size:var(--type-small)}.chip{font-size:var(--x-proposed-type-micro)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Mapping · V3</b> exact matches in ink; the near one weighed side by side with evidence before it is called new · record linkage, OpenRefine reconciliation</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), PL = plate(R), recs = R.recs;
const matched = [...R.st.s11.matched].sort(), fresh = [...R.st.s11.fresh];
const newRec = recs.find(r => r.van.id === fresh[0]);
/* nearest van Data Atlas keeps, by spelling */
const NEAR = DATA.vans.map(v => ({ v: VAN(v[0]), d: lev(v[0], fresh[0]) })).filter(x => x.d <= 1).sort((a, b) => a.v.id < b.v.id ? 1 : -1).map(x => x.v);
const near = NEAR[0];
const visits = id => recs.filter(r => r.van.id === id).length;
const S = { pick: null };
function render() {
  const nv = newRec.v, gapMiles = near.odo - nv.odometer.num;
  const rows = [
    ['number', nv.van.val, near.id, 'diff'],
    ['depot', nv.depot.val, DEPOT(near.depot).name, nv.depot.id === near.depot ? 'same' : 'diff'],
    ['odometer', `${nv.odometer.val} miles`, `${fmt(near.odo)} miles, ${near.last}`, 'diff'],
    ['note', nv.note.val || '—', '—', nv.note.val ? 'diff' : 'same'],
    ['in this file', `line ${newRec.n}`, visits(near.id) ? `line ${recs.find(r => r.van.id === near.id).n}` : 'not in this file', visits(near.id) ? 'diff' : 'same']
  ];
  const OPT = [['new', 'plus', `Propose a new van, ${fresh[0]}`, `Triage gets one new ${DATA.kinds.van.word}; ${P('p2').name} decides`, `${matched.length} + 1`],
    ['same', 'link', `It is ${near.id}; the number is a typo`, `the visit goes on ${near.id}, and line ${newRec.n} keeps a seam saying so`, `${matched.length}`],
    ['aside', 'archive', 'Not sure: set the line aside', `ask ${P(R.file.from).name}; it is counted at the pass`, `${matched.length}`]];
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, R.file.name, 'Map', 'Matches'], [['1–3', 'decide'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <section class="left"><div><h1 class="t">What the file names, and what ${DATA.app} keeps</h1><p class="lede" style="margin-top:var(--space-1)">Exact matches are ink and need nothing from you. Only a thing with no exact match is weighed, and nothing becomes new without a person saying so.</p></div>
      <div class="band dep" style="--i:0"><div class="hd"><b>${plural(matched.length + fresh.length, 'van')}</b><span>${matched.length} match exactly by number · ${fresh.length} has no match</span></div>
        <div class="chips">${matched.map(id => `<span class="chip">${I('link', 12)} ${id}${visits(id) > 1 ? `<span class="c">×${visits(id)}</span>` : ''}</span>`).join('')}${fresh.map(id => `<span class="chip new">${id}</span>`).join('')}</div>
        <p class="how">Matched on the number ${DATA.app} keeps for each van, after tidying wrote them all like ${STEP('s6').example[1]}.<span class="tk">Vehicle.fleetNumber = value (exact)</span></p></div>
      <div class="band dep" style="--i:1"><div class="hd"><b>${plural(PL.depots.length, 'depot')}</b><span>all match; ${Object.values(R.st.s8.groups).reduce((a, g) => a + Object.keys(g).length, 0)} spellings were joined when tidying</span></div>
        <div class="chips">${PL.depots.map(id => `<span class="chip">${I(DATA.kinds.depot.icon, 12)} ${DEPOT(id).name}<span class="c">${Object.keys(R.st.s8.groups[id]).length} spellings</span></span>`).join('')}</div></div>
      <div class="band dep" style="--i:2"><div class="hd"><b>1 firm</b><span>matches by name, from the title and the sender</span></div>
        <div class="chips"><span class="chip">${I(DATA.kinds.firm.icon, 12)} ${FIRM.name}<span class="c">${FIRM.id}</span></span></div></div>
      <p class="how">${DATA.app} matches by keys, names and spelling. With the model gateway on it can also match by meaning; those matches would be pencil and never land without a person.</p></section>
    <section class="weigh"><p class="eyebrow">${I('scale', 12)} One to weigh</p><h2>${fresh[0]} isn’t a van ${DATA.app} keeps</h2>
      <p class="how">${NEAR.length} vans it keeps are one character away (${NEAR[NEAR.length - 1].id} to ${NEAR[0].id}). The last in the series, ${near.id}, side by side:</p>
      <div class="cmp"><span class="h"></span><span class="h">This file</span><span class="h">${DATA.app} keeps</span>${rows.map(([k, a, b, c]) => `<span class="k">${k}</span><span class="${c}">${esc(a)}</span><span class="${c}">${esc(b)}</span>`).join('')}</div>
      <p class="verdict">${I('scale', 14)}<span>Probably a different van: ${near.id} last read ${fmt(near.odo)} miles, and an odometer doesn’t go back ${fmt(gapMiles)} miles. The note says “${esc(nv.note.val)}”.</span></p>
      <div class="opts">${OPT.map(([k, ic, w, s, c], i) => `<button class="opt" data-o="${k}" aria-pressed="${S.pick === k}">${I(ic, 14)}<span>${i + 1} · ${w}<small>${s}</small></span><span class="c">${c} known</span></button>`).join('')}</div>
      ${S.pick === 'new' ? `<p class="prop">${I('clipboard-check', 12)} <b>To Triage:</b> a new ${DATA.kinds.van.word} ${fresh[0]} at ${nv.depot.val}, first seen on line ${newRec.n} of ${esc(R.file.name)}, odometer ${nv.odometer.val} miles. The verdict above goes with it as the reason.</p>` : ''}</section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('.opt').forEach(b => b.onclick = () => { S.pick = b.dataset.o; render(); });
}
function replay() { clearLater(); S.pick = null; document.body.classList.add('pre'); render(); settle(ms('--motion-quick')); later(() => { S.pick = 'new'; render(); }, ms('--motion-run')); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (/^[1-3]$/.test(e.key)) { S.pick = ['new', 'same', 'aside'][+e.key - 1]; render(); } });
replay();
</script>
</body>
</html>
