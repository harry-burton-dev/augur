<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Mapping V5 · The gap in the tree</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: columns placed on the kinds Data Atlas keeps; a column with no place becomes a visible gap, asked of an admin ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:var(--space-6)}
.tree{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.node{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2);align-items:center;padding:var(--space-1) 0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.node .ic{color:var(--ink-muted);display:inline-flex}
.node .nm{color:var(--light)}
.node .nm small{color:var(--ink-muted);margin-left:var(--space-2)}
.node.k{font-size:var(--type-body)}
.node.k .nm{font-size:var(--type-lead);font-weight:300}
.lvl1{padding-left:var(--space-5);border-left:1px solid var(--hairline-strong);margin-left:calc(var(--space-2) + 1px)}
.lvl2{padding-left:var(--space-5);border-left:1px solid var(--hairline);margin-left:calc(var(--space-2) + 1px)}
.tag{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);color:var(--ink-muted)}
.tag .rawv{font-size:var(--x-proposed-type-micro)}
.node.gap{margin:var(--space-2) 0;padding:var(--space-2) var(--space-3);border:1px dashed var(--ink-muted);border-radius:var(--radius-key);background:var(--x-proposed-pencil-wash)}
.node.gap .nm{color:var(--ink)}
.node.gap .vals{grid-column:2 / span 2;display:flex;flex-wrap:wrap;gap:var(--space-2);font-size:var(--type-small);color:var(--ink-muted)}
.node.dim{opacity:var(--x-proposed-quiet)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.req{border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);padding:var(--space-4);display:grid;gap:var(--space-2)}
.req h2{margin:0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.req dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);margin:0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.req dt{color:var(--ink-muted)}
.req dd{margin:0;color:var(--ink)}
.after{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);margin:0}
.after b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){.node{font-size:var(--type-small);line-height:var(--leading-small)}.node.k .nm{font-size:var(--type-body)}.req{padding:var(--space-3)}.req dl{font-size:var(--type-small);line-height:var(--leading-small)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Mapping · V5</b> columns placed on the kinds Data Atlas keeps; a column with no place is a visible gap, asked of an admin · the structure predicts its gaps</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), recs = R.recs, K = DATA.kinds.inspection, map = STEP('s12'), ask = DATA.asked[0];
const colFor = id => Object.entries(map.cols).find(([, d]) => d === id)?.[0];
const typeCounts = ask.values.map(v => [v, recs.filter(r => r.v.kindOfVisit && r.v.kindOfVisit.val === v).length]);
const S = { lit: false, decided: false };
function render() {
  const detail = d => `<div class="node lvl2-n dep" style="--i:${K.details.indexOf(d) + 1}"><span class="ic">${d.links ? I(DATA.kinds[d.links].icon, 14) : I('minus', 14)}</span><span class="nm">${d.word}<small class="tk inl">${d.tech}</small></span><span class="tag">${colFor(d.id) ? `${raw(colFor(d.id))} ${I('arrow-left', 12)}` : d.id === 'by' ? `who sent the file ${I('arrow-left', 12)}` : ''}</span></div>`;
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, R.file.name, 'Map', 'What we keep'], [['A', 'admin adds the word'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <section class="tree"><div><h1 class="t">Where the columns go in what ${DATA.app} keeps</h1><p class="lede" style="margin-top:var(--space-1)">The kinds of thing ${DATA.app} keeps, as its admins have set them up. Each column of the file sits on the detail it fills. One column has nowhere to go, and that shows as a gap where it would belong.</p></div>
      <div class="node k"><span class="ic">${I('calendar-check', 16)}</span><span class="nm">an event<small class="tk inl">cco:Event</small></span><span></span></div>
      <div class="lvl1"><div class="node k"><span class="ic">${I(K.icon, 16)}</span><span class="nm">${K.word}<small class="tk inl">${K.tech}</small></span><span class="tag">${plural(recs.length, 'line')} ${I('arrow-left', 12)}</span></div>
        <div class="lvl2">${K.details.map(detail).join('')}
          ${S.decided ? `<div class="node lvl2-n"><span class="ic">${I('list', 14)}</span><span class="nm">${ask.word}<small>new, added by ${P(ask.decides).name}</small></span><span class="tag">${raw(ask.from)} ${I('arrow-left', 12)}</span></div>`
          : `<div class="node gap ${S.lit ? '' : 'dim'}"><span class="ic">${I('circle-dashed', 14)}</span><span class="nm">no place for ${raw(ask.from)} yet</span><span class="tag">asked for “${ask.word}”</span>
            <span class="vals">${typeCounts.map(([v, n]) => `<span>${raw(v)} ${n}</span>`).join('')}<span>kept in the note until then</span></span></div>`}</div></div>
      <div class="node k"><span class="ic">${I('box', 16)}</span><span class="nm">a thing<small class="tk inl">cco:Artifact, cco:Facility, cco:Organization</small></span><span></span></div>
      <div class="lvl1">${['van', 'depot', 'firm'].map(k => `<div class="node"><span class="ic">${I(DATA.kinds[k].icon, 14)}</span><span class="nm">${DATA.kinds[k].word}<small class="tk inl">${DATA.kinds[k].tech}</small></span><span class="tag">linked from ${K.word}</span></div>`).join('')}</div></section>
    <aside class="side"><div class="req"><p class="eyebrow">${I('message-circle-question-mark', 12)} A word a source asked for</p><h2>“${ask.word}”, for ${K.word}</h2>
        <dl><dt>values</dt><dd>${ask.values.join(', ')}</dd><dt>waiting</dt><dd>${plural(recs.length, K.word)} from this file</dd><dt>asked by</dt><dd>${P(ask.by).name}, ${ask.when}</dd><dt>decides</dt><dd>${P(ask.decides).name}, ${P(ask.decides).role.split(', ')[0]}</dd><dt>also asked</dt><dd>by no other source yet</dd><dt>state</dt><dd>${S.decided ? `added by ${P(ask.decides).name}` : 'waiting'}</dd></dl></div>
      <p class="after"><b>Nothing is lost while it waits.</b> ${raw(ask.from)} goes into each ${K.word}’s note, word for word, and the recipe line that maps it says “until ${ask.word} exists”.</p>
      <p class="after"><b>When the word is added</b> (press A): only recipe line ${map.id.slice(1)} reruns, for the ${recs.length} ${K.word}s that waited. They get “${ask.word}” filled from their note, each with a seam; nothing else moves, and Triage sees it as ${recs.length} changes, not ${recs.length} new records.</p>
      <p class="after"><b>Why an admin.</b> A new detail changes what every app can ask of an ${K.word}. ${DATA.app}’s studio already lists the words sources asked for; this is one more entry there, with its ${recs.length} waiting records as the reason.</p></aside>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); Object.assign(S, { lit: false, decided: false }); document.body.classList.add('pre'); render(); settle(ms('--motion-quick')); later(() => { S.lit = true; render(); }, ms('--motion-run')); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key.toLowerCase() === 'a') { S.decided = !S.decided; render(); } });
replay();
</script>
</body>
</html>
