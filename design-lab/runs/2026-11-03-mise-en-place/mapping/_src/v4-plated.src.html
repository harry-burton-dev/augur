<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Mapping V4 · Plated</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: map by looking at the record each line will become, with the line it came from under it ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.plates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4);min-height:0}
.plate{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.card{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-raised);box-shadow:var(--shadow-raised)}
.card .kd{display:flex;align-items:center;gap:var(--space-2);font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.card h2{margin:0;font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.card h2 small{display:block;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.stm{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-1)}
.stm li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2);align-items:baseline;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);border-top:1px solid var(--hairline);padding-top:var(--space-1)}
.stm li b{font-weight:400;color:var(--light)}
.stm li .lk{color:var(--light);text-decoration:underline;text-decoration-color:var(--hairline-strong);text-underline-offset:var(--focus-gap)}
.stm li .src{display:inline-flex;gap:var(--space-1);align-items:center;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.stm li.wait{color:var(--ink-muted)}
.card .why{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.card .why b{font-weight:400;color:var(--ink)}
.from{display:flex;flex-wrap:wrap;gap:var(--space-1);align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
.from .rawv{font-size:var(--x-proposed-type-micro)}
.foot{display:flex;align-items:center;gap:var(--space-5);font-size:var(--type-meta);color:var(--ink)}
.foot b{font-weight:400;color:var(--light)}
.foot .btn{margin-left:auto}
@media (max-width:1400px){.card{padding:var(--space-3)}.card h2{font-size:var(--type-lead);line-height:var(--leading-lead)}.stm li{font-size:var(--type-small);line-height:var(--leading-small)}.from .rawv:nth-child(n+6){display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Mapping · V4</b> plated: map by looking at the record each line becomes, the raw line under it · the pass's plate check, statements for one record</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), PL = plate(R), recs = R.recs, K = DATA.kinds.inspection, ask = DATA.asked[0], map = STEP('s12');
/* four plates that show the range: a failure, its re-test, a new van, a reading not known yet */
const failed = recs.find(r => r.v.result.val === 'failed' && r.v.rnote);
const pick = [failed, recs.find(r => r !== failed && r.van.id === failed.van.id), recs.find(r => r.van.status === 'new'), recs.find(r => r.v.odometer.aside)].filter(Boolean);
const why = r => r === pick[0] ? `<b>A failure,</b> with its reason split out of ${raw(STEP('s9').col[0])} into the note.`
  : r === pick[1] ? `<b>Its re-test,</b> a week later on the same van. The two are separate ${K.word}s; nothing joins them unless someone says so.`
  : r.van.status === 'new' ? `<b>A new van.</b> The ${K.word} lands only if ${P('p2').name} accepts the van in Triage too.`
  : `<b>A reading not known yet.</b> The ${K.word} lands; its odometer is empty, and says which kind of empty.`;
const S = { i: 0 };
function card(r) {
  const v = r.v, src = (c, step) => `<span class="src">${c ? esc(c) : ''}${step ? stepNo(step) : ''}</span>`;
  return `<div class="card"><p class="kd">${I(K.icon, 12)} ${K.word}${r.van.status === 'new' ? ' · with a new van' : ''}</p>
    <h2>${v.van.val}<small>${v.on.val}</small></h2>
    <ul class="stm">
      <li><span>van <span class="lk">${v.van.val}</span>${r.van.status === 'new' ? ' <b>(new)</b>' : ''}</span>${src(v.van.col, v.van.by[0])}</li>
      <li><span>at <span class="lk">${v.depot.val}</span></span>${src(v.depot.col, v.depot.by[0])}</li>
      <li><span>result <b>${v.result.val}</b></span>${src(v.result.col, v.result.by[0])}</li>
      ${v.note.val ? `<li><span>note ${esc(v.note.val)}</span>${src(v.note.col, v.note.by[0])}</li>` : ''}
      <li class="${v.odometer.val ? '' : 'wait'}"><span>odometer ${v.odometer.val ? `<b>${v.odometer.val}</b> miles` : `<span class="mk-gap"></span> not known yet`}</span>${src(v.odometer.col, v.odometer.by[0])}</li>
      <li class="wait"><span>${ask.word}: waiting on a word (${esc(v.kindOfVisit.val)} kept in the note)</span>${src(ask.from)}</li>
      <li><span>by <span class="lk">${v.by.val}</span></span>${src('', 's12')}</li></ul>
    <p class="why">${why(r)}</p></div>`;
}
function render() {
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, R.file.name, 'Map', 'Plated'], [['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div><h1 class="t">What each line becomes</h1><p class="lede" style="margin-top:var(--space-1)">Map by looking at the plate, not the wiring: four of the ${recs.length} ${K.word}s this file makes, as ${DATA.app} will show them, each with the line it came from. Small tags say which column and which recipe line made each statement.</p></div>
    <div class="plates">${pick.map((r, i) => `<section class="plate dep" style="--i:${i * 2}">${card(r)}<p class="from">line ${r.n} ${r.cells.map(c => raw(c)).join('')}</p></section>`).join('')}</div>
    <div class="foot"><span><b>${recs.length}</b> ${K.word}s · <b>${PL.vans}</b> vans · <b>${PL.depots.length}</b> depots · <b>1</b> firm</span><span class="muted">every plate has the same ${K.details.length} statements in the same order; a missing one shows its kind of empty</span><button class="btn">${I('layout-grid', 14)} See all ${recs.length}</button></div>
  </div></main>`;
  Icons.hydrate($('#app'));
}
function replay() { clearLater(); document.body.classList.add('pre'); render(); settle(ms('--motion-run')); }
document.addEventListener('keydown', e => { commonKeys(e, render, replay); });
replay();
</script>
</body>
</html>
