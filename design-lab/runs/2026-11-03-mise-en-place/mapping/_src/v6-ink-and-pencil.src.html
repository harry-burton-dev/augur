<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Mapping V6 · Matched in ink, proposed in pencil</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: matches by keys, names and spelling are ink; what the model proposes by meaning is pencil and changes no count ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-4)}
.lanes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-5);min-height:0}
.lane{min-height:0;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);border-radius:var(--radius-inset)}
.lane.ink{border:1px solid var(--hairline-strong);background:var(--surface-pane)}
.lane.pen{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash)}
.lane.pen.off{border-style:dashed;border-color:var(--hairline)}
.lane h2{margin:0;display:flex;align-items:center;gap:var(--space-2);font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.lane h2 small{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.lane .sub{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.m{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.m li{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:start;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);padding:var(--space-2) 0;border-top:1px solid var(--hairline)}
.m li > svg{color:var(--ink-muted);margin-top:2px}
.m li .c{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.m li small{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.lane.pen .m li .what{font-style:italic}
.lane.pen .m li .act{grid-column:2 / span 2;display:flex;gap:var(--space-2)}
.m li.ok .what{font-style:normal;color:var(--light)}
.offnote{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.offnote svg{color:var(--ink-muted);margin-top:2px}
.same{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset)}
.same div{display:grid;gap:2px}
.same b{font:300 var(--type-heading)/1 var(--font-mono);color:var(--light)}
.same span{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
@media (max-width:1400px){.lane{padding:var(--space-3)}.m li{font-size:var(--type-small);line-height:var(--leading-small);padding:var(--space-1) 0}.same b{font-size:var(--type-lead)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Mapping · V6</b> matches by spelling in ink; what the model proposes by meaning in pencil; G turns it off and no count moves · pencil and ink</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), PL = plate(R), recs = R.recs, K = DATA.kinds.inspection, M = DATA.model;
const byLine = n => R.lines[n - 1];
const S = { ok: new Set() };
function render() {
  const on = STATE.gateway, g = R.st.s8.groups, spellings = Object.values(g).reduce((a, x) => a + Object.keys(x).length, 0);
  const pencil = [
    ...M.links.map((l, i) => { const a = byLine(l.from).rec, b = byLine(l.to); const lk = K.links.find(x => x.id === l.link);
      return { id: 'lk' + i, ic: 'link-2', what: lk ? `line ${l.from} (${a.v.van.val}, ${a.v.on.val}) ${lk.word} line ${l.to}` : `line ${l.from}’s note points at line ${l.to}`, why: l.why, c: lk ? 'a link' : 'a note' }; })
  ];
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, R.file.name, 'Map', 'Matches'], [['G', 'model off', 'h-g'], ['A', 'accept next'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div><h1 class="t">Ink is matched. Pencil is proposed.</h1><p class="lede" style="margin-top:var(--space-1)">${DATA.app} matches by keys, names and spelling on its own. With the model gateway on, it can also propose matches by meaning. Those are pencil: they never count, and never land, until a person inks them.</p></div>
    <div class="lanes">
      <section class="lane ink"><h2>${I('pen-tool', 16)} Ink · by keys, names and spelling<small>always on</small></h2>
        <ul class="m">
          <li>${I(DATA.kinds.van.icon, 14)}<span class="what">${R.st.s11.matched.size} vans matched by number<small>exact, after tidying</small></span><span class="c">${recs.filter(r => r.van.status === 'match').length} lines</span></li>
          <li>${I('plus', 14)}<span class="what">${R.st.s11.fresh.size} van with no match: ${[...R.st.s11.fresh].join(', ')}<small>proposed as new, weighed against the nearest numbers</small></span><span class="c">1 line</span></li>
          <li>${I(DATA.kinds.depot.icon, 14)}<span class="what">${spellings - M.spellings.length} spellings joined into ${Object.keys(g).length} depots<small>by spelling and shared words, confirmed in tidying</small></span><span class="c">${recs.length - M.spellings.reduce((a, s) => a + ((g[s.to] || {})[s.raw] || 0), 0)} lines</span></li>
          <li>${I('hand', 14)}<span class="what">${M.spellings.length} spelling joined by a person: ${M.spellings.map(s => `“${s.raw}”`).join(', ')}<small>${on ? `no spelling rule reaches it; the model proposed it in pencil (“${M.spellings[0].why}”) and ${P(DATA.me).name} inked it while tidying` : `no spelling rule reaches it; ${P(DATA.me).name} joined it by hand while tidying`}</small></span><span class="c">${M.spellings.reduce((a, s) => a + ((g[s.to] || {})[s.raw] || 0), 0)} lines</span></li>
          <li>${I(DATA.kinds.firm.icon, 14)}<span class="what">${FIRM.name}<small>by name, from the title and the sender</small></span><span class="c">${FIRM.id}</span></li></ul></section>
      <section class="lane pen ${on ? '' : 'off'}"><h2>${I('pencil', 16)} Pencil · by meaning<small>${on ? 'model gateway on' : 'model gateway off'}</small></h2>
        ${on ? `<p class="sub">Proposals only. Each says why. Accepting one inks it and names you as the one who did.</p>
        <ul class="m">${pencil.map(p => `<li class="${S.ok.has(p.id) ? 'ok' : ''}">${I(p.ic, 14)}<span class="what">${p.what}<small>${p.why}</small></span><span class="c">${p.c}</span>
          <span class="act">${S.ok.has(p.id) ? `<span class="heard">${I('check', 12)} inked by ${P(DATA.me).name}</span>` : `<button class="btn sm" data-ok="${p.id}">${I('check', 12)} Ink it</button><button class="btn sm">Not so</button>`}</span></li>`).join('')}</ul>`
        : `<p class="offnote">${I('power-off', 14)}<span>The model gateway is off. ${DATA.app} matches by keys, names and spelling only, and says so. The spelling a person joined stays joined: it was ink the moment they joined it. The ${M.links.length} links between lines aren’t proposed; nobody loses anything that had landed.</span></p>`}</section>
    </div>
    <div class="same">${[[recs.length, `${K.word}s land`], [PL.vans, 'vans'], [PL.fresh.length, 'new van'], [PL.aside.length + PL.copies.length, 'lines set aside'], [S.ok.size, 'pencil inked']].map(([n, w]) => `<div><b>${n}</b><span>${w}</span></div>`).join('')}</div>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('[data-ok]').forEach(b => b.onclick = () => { S.ok.add(b.dataset.ok); render(); });
}
function replay() { clearLater(); S.ok = new Set(); STATE.gateway = true; $('#h-g')?.classList.remove('on'); document.body.classList.add('pre'); render(); settle(ms('--motion-quick')); later(() => { S.ok.add('lk0'); render(); }, ms('--motion-run')); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'a' && STATE.gateway) { const n = ['lk0', 'lk1'].find(x => !S.ok.has(x)); if (n) { S.ok.add(n); render(); } }
});
replay();
</script>
</body>
</html>
