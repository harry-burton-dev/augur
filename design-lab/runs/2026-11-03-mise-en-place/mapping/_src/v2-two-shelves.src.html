<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · Mapping V2 · Two shelves</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: the file's columns on one shelf, what Data Atlas keeps on the other, a thread between each pair ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(var(--space-8),.7fr) minmax(0,1.1fr);gap:0;position:relative}
.shelf{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.shelf h2{margin:0 0 var(--space-2);font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--surface-pane);min-height:calc(var(--target-md) + var(--space-2))}
.item .nm{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);color:var(--light)}
.item .ex{grid-column:1 / span 2;display:flex;gap:var(--space-1);flex-wrap:wrap;font-size:var(--type-small);color:var(--ink-muted)}
.item .fit{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.item.gap{border-style:dashed;background:none}
.item.gap .nm{color:var(--ink-muted)}
.item.fixed{border-style:dotted}
.item.on{border-color:var(--light)}
svg.threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.threads path{fill:none;stroke:var(--ink-muted);stroke-width:1.25;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset var(--motion-calm) var(--ease-out)}
svg.threads path.drawn{stroke-dashoffset:0}
svg.threads path.dash{stroke-dasharray:3 4;stroke-dashoffset:0;opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
svg.threads path.dash.drawn{opacity:1}
svg.threads path.hot{stroke:var(--light);stroke-width:1.75}
@media (prefers-reduced-motion: reduce){svg.threads path{stroke-dasharray:none;stroke-dashoffset:0}}
.mid{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 var(--space-4) var(--space-2);text-align:center;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);gap:var(--space-2)}
@media (max-width:1400px){.item{min-height:var(--target-md);padding:var(--space-1) var(--space-2)}.item .ex{display:none}.item .nm{font-size:var(--type-small)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Mapping · V2</b> the file's columns on one shelf, what Data Atlas keeps on the other, a thread for each pair · patch bays, schema matchers</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), map = STEP('s12'), K = DATA.kinds.inspection, ask = DATA.asked[0], recs = R.recs, PL = plate(R);
const DKEY = { van: 'van', depot: 'depot', on: 'on', result: 'result', odometer: 'odometer', note: 'note' };
const fitN = id => id === 'van' ? recs.filter(r => r.van).length : id === 'odometer' ? recs.filter(r => r.v.odometer.val).length : recs.filter(r => r.v[id] && r.v[id].val !== undefined).length;
const S = { drawn: false, on: null };
function render() {
  const left = R.header.map(h => ({ h, d: map.cols[h], ex: [...new Set(recs.map(r => { const d = map.cols[h]; return d && d !== 'asked' && r.v[d] ? r.v[d].val : r.cells[R.header.indexOf(h)]; }).filter(Boolean))].slice(0, 3) }));
  const right = K.details.map(d => ({ d, col: Object.entries(map.cols).find(([, x]) => x === d.id)?.[0] }));
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, R.file.name, 'Map'], [['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap" id="wrap">
    <section class="shelf"><h2>${R.file.name.replace(/\.xlsx$/, '')}<span class="tk">${R.header.length} columns, after tidying</span></h2>
      ${left.map(x => `<div class="item ${x.d === 'asked' ? 'gap' : ''} ${S.on === x.h ? 'on' : ''}" data-l="${esc(x.h)}"><span class="nm">${raw(x.h)}</span><span class="fit">${x.d === 'asked' ? 'no place yet' : ''}</span><span class="ex">${x.ex.map(v => kept(v)).join('<span class="muted">·</span>')}</span></div>`).join('')}
      <div class="item fixed" data-l="__file"><span class="nm">${I('mail', 14)} who sent the file</span><span class="fit">for every line</span><span class="ex">${FIRM.name}</span></div></section>
    <div class="mid"><span>${R.header.length - 1} of ${R.header.length} columns have a place</span><span>${plural(recs.length, 'line')} each make one ${K.word}</span></div>
    <section class="shelf"><h2>${K.word} <span class="tk">${K.tech}</span></h2>
      ${right.map(x => `<div class="item ${x.d.id === 'by' ? 'fixed' : ''} ${S.on && map.cols[S.on] === x.d.id ? 'on' : ''}" data-r="${x.d.id}"><span class="nm">${x.d.links ? I(DATA.kinds[x.d.links].icon, 14) : I('minus', 14)} ${x.d.word}<span class="tk inl">${x.d.tech}</span></span><span class="fit">${x.d.id === 'by' ? `${FIRM.id}` : `${fitN(x.d.id)} of ${recs.length} fit`}</span>
        <span class="ex">${x.d.links ? `links to a ${DATA.kinds[x.d.links].word} ${DATA.app} keeps` : x.d.words ? `one of ${x.d.words.map(w => `“${w}”`).join(', ')}` : x.d.unit ? `a number of ${x.d.unit}` : x.d.id === 'on' ? 'a date' : 'words'}${x.d.id === 'odometer' ? ` · ${PL.valuesAside.length} not known yet` : ''}</span></div>`).join('')}
      <div class="item gap" data-r="__asked"><span class="nm">${I('message-circle-question-mark', 14)} ${ask.word}</span><span class="fit">asked for</span><span class="ex">${P(ask.decides).name} decides; until then ${ask.from} is kept in the note</span></div></section>
    <svg class="threads" id="threads" aria-hidden="true"></svg>
  </div></main>`;
  Icons.hydrate($('#app'));
  draw();
  $$('[data-l]').forEach(el => { el.onmouseenter = () => { S.on = el.dataset.l; render(); }; });
}
function draw() {
  const w = $('#wrap'), box = w.getBoundingClientRect(), svg = $('#threads');
  const pairs = R.header.map(h => [h, map.cols[h] === 'asked' ? '__asked' : map.cols[h]]).concat([['__file', 'by']]);
  svg.innerHTML = pairs.map(([l, r]) => {
    const a = $(`[data-l="${CSS.escape(l)}"]`), b = $(`[data-r="${r}"]`); if (!a || !b) return '';
    const A = a.getBoundingClientRect(), B = b.getBoundingClientRect();
    const x1 = A.right - box.left, y1 = A.top + A.height / 2 - box.top, x2 = B.left - box.left, y2 = B.top + B.height / 2 - box.top, mx = (x1 + x2) / 2;
    const len = Math.hypot(x2 - x1, y2 - y1) * 1.3;
    const dash = r === '__asked' || l === '__file';
    return `<path class="${dash ? 'dash' : ''} ${S.drawn ? 'drawn' : ''} ${S.on === l ? 'hot' : ''}" style="--len:${len.toFixed(0)}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
  }).join('');
}
function replay() { clearLater(); S.drawn = false; S.on = null; render(); later(() => { S.drawn = true; $$('#threads path').forEach(p => p.classList.add('drawn')); }, ms('--motion-run')); }
addEventListener('resize', draw);
document.addEventListener("keydown", e => { commonKeys(e, render, replay); draw(); });
replay();
</script>
</body>
</html>
