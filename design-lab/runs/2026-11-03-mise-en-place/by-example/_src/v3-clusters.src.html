<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · By example V3 · Spellings that belong together</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: near-duplicate spellings grouped three ways, for a person to confirm, each group aimed at a place Data Atlas keeps ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,2fr) minmax(240px,.8fr);gap:var(--space-5)}
.how{min-height:0;display:flex;flex-direction:column;gap:var(--space-2)}
.m{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-1) var(--space-2);padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);text-align:left;width:100%}
.m:hover{background:var(--surface-raised)}
.m[aria-pressed="true"]{border-color:var(--light);background:var(--surface-raised)}
.m svg{color:var(--ink-muted);margin-top:2px}
.m b{font-weight:400;color:var(--light);font-size:var(--type-meta)}
.m small{grid-column:2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.m .found{grid-column:2;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink)}
.groups{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.grp{border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);padding:var(--space-3) var(--space-4);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(220px,.8fr);gap:var(--space-4);align-items:center}
.grp.done{border-color:var(--hairline);background:none}
.sp{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-1)}
.sp li{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta)}
.sp li .c{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);min-width:var(--space-5);text-align:right}
.sp li .by{font-size:var(--type-small);color:var(--ink-muted)}
.sp li.hand .rawv{border-style:dashed;border-color:var(--light)}
.chk{display:inline-flex;align-items:center;justify-content:center;width:var(--space-4);height:var(--space-4);border:1px solid var(--hairline-strong);border-radius:2px;color:var(--light)}
.tgt{display:grid;gap:var(--space-1)}
.tgt .lab{font-size:var(--type-small);color:var(--ink-muted)}
.tgt .nm{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-body);color:var(--light)}
.tgt .act{display:flex;gap:var(--space-2);margin-top:var(--space-1)}
.alone{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.alone .rest{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.alone .rest li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2);align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
.alone p{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.alone p b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){.grp{grid-template-columns:minmax(0,1fr) auto;padding:var(--space-2) var(--space-3)}.grp .tgt{grid-column:1 / span 2}.m{padding:var(--space-2)}.m small{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>By example · V3</b> spellings grouped three ways for a person to confirm, each aimed at a depot already kept · OpenRefine clustering</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct'), F0 = R.file, colName = R.st.s8.col, P0 = profile(R, colName);
const VALS = Object.keys(P0.values), count = v => P0.values[v].length;
const STOP = new Set(['depot', 'store']);
const words = v => v.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(w => w && !STOP.has(w));
const METHODS = [
  { id: 'key', ic: 'key-round', w: 'Same letters', s: 'Case, spaces, punctuation and word order ignored.', same: (a, b) => [...new Set(a.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(Boolean))].sort().join(' ') === [...new Set(b.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(Boolean))].sort().join(' '), tk: 'fingerprint keying' },
  { id: 'word', ic: 'whole-word', w: 'Shares a word', s: `Words like “depot” and “store” don’t count.`, same: (a, b) => words(a).some(w => words(b).includes(w)), tk: 'token overlap, stop words removed' },
  { id: 'near', ic: 'spell-check', w: 'Near spelling', s: 'At most two letters different.', same: (a, b) => lev(squash(a), squash(b)) <= 2, tk: 'Levenshtein ≤ 2 on letters only' }
];
function cluster(ms) {
  const parent = Object.fromEntries(VALS.map(v => [v, v])), find = v => parent[v] === v ? v : (parent[v] = find(parent[v]));
  const by = {};
  VALS.forEach((a, i) => VALS.slice(i + 1).forEach(b => ms.forEach(m => { if (m.same(a, b)) { const ra = find(a), rb = find(b); if (ra !== rb) parent[rb] = ra; by[a] = by[a] || m.w; by[b] = by[b] || m.w; } })));
  const g = {}; VALS.forEach(v => (g[find(v)] = g[find(v)] || []).push(v));
  return { groups: Object.values(g).filter(x => x.length > 1).map(x => x.sort((a, b) => count(b) - count(a))), alone: Object.values(g).filter(x => x.length === 1).map(x => x[0]), by };
}
/* the depot Data Atlas keeps that a group most likely is */
function target(vals) { let best = null; DATA.depots.forEach(d => { const s = vals.reduce((a, v) => a + (words(v).some(w => words(d.name).includes(w)) ? count(v) : 0) + (lev(squash(v), squash(d.name)) <= 2 ? count(v) : 0) + (words(v).some(w => w.length >= 4 && words(d.name).some(x => x !== w && (x.endsWith(w) || x.startsWith(w)))) ? count(v) : 0), 0); if (!best || s > best.s) best = { d, s }; }); return best && best.s ? best.d : null; }
const S = { m: 'all', joined: new Set(), hand: null };
function render() {
  const ms = S.m === 'all' ? METHODS : METHODS.filter(m => m.id === S.m);
  const c = cluster(ms);
  if (S.hand) { const g = c.groups.find(g => target(g) && target(g).id === S.hand.to); if (g) { g.push(S.hand.v); c.alone = c.alone.filter(v => v !== S.hand.v); } }
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, F0.name, 'Tidy', colName], [['M', 'method'], ['J', 'join next'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <section class="how"><div><h1 class="t">${P0.distinct} spellings</h1><p class="lede" style="margin-top:var(--space-1)">in ${raw(colName)}. Three ways to find the ones that belong together; each finds different groups. A person confirms every group.</p></div>
      ${METHODS.map(m => { const x = cluster([m]); return `<button class="m" data-m="${m.id}" aria-pressed="${S.m === m.id}">${I(m.ic, 16)}<b>${m.w}</b><small>${m.s}<span class="tk">${m.tk}</span></small><span class="found">${x.groups.length ? `${plural(x.groups.length, 'group')} · ${x.groups.flat().length} spellings` : 'finds nothing here'}</span></button>`; }).join('')}
      <button class="m" data-m="all" aria-pressed="${S.m === 'all'}">${I('layers', 16)}<b>All three</b><small>Groups joined where any method agrees.</small><span class="found">${plural(cluster(METHODS).groups.length, 'group')} · ${cluster(METHODS).groups.flat().length} spellings</span></button></section>
    <section class="groups scroll">${c.groups.map((g, gi) => { const t = target(g), done = t && S.joined.has(t.id);
      return `<div class="grp dep ${done ? 'done' : ''}" style="--i:${gi}"><ul class="sp">${g.map(v => `<li class="${S.hand && S.hand.v === v ? 'hand' : ''}"><span class="chk">${I('check', 12)}</span><span class="c">${count(v)}</span>${raw(v)}<span class="by">${S.hand && S.hand.v === v ? 'joined by hand' : c.by[v] ? lc(c.by[v]) : ''}</span></li>`).join('')}</ul>
        <span class="to">${I('arrow-right', 18)}</span>
        <div class="tgt"><span class="lab">${t ? `a ${DATA.kinds.depot.word} ${DATA.app} keeps` : 'no match in ' + DATA.app}</span><span class="nm">${I(DATA.kinds.depot.icon, 16)} ${t ? t.name : 'propose a new depot'}</span>
          <span class="act">${done ? `<span class="heard">${I('check', 12)} heard · ${g.reduce((a, v) => a + count(v), 0)} lines</span>` : `<button class="btn sm go" data-j="${t ? t.id : ''}">${I('combine', 12)} Join ${g.length} as one</button><button class="btn sm">Split</button>`}</span></div></div>`; }).join('')}</section>
    <aside class="alone"><p class="eyebrow">${I('circle-dashed', 12)} In no group · ${c.alone.length}</p>
      <ul class="rest">${c.alone.map(v => { const t = target([v]); return `<li><span>${raw(v)} <span class="c">${count(v)}</span></span>${t ? `<button class="btn sm" data-h="${esc(v)}" data-t="${t.id}">to ${t.name}</button>` : ''}</li>`; }).join('')}</ul>
      <p><b>Nothing is merged on its own.</b> A method only proposes; joining is a person’s choice, and the recipe keeps every spelling it joined, so next month the same spellings go straight to the same depot.</p>
      <p><b>Aimed at what is kept.</b> Each group points at a depot ${DATA.app} already has. A group that matches none would be proposed as a new depot in Triage, not created here.</p></aside>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('[data-m]').forEach(b => b.onclick = () => { S.m = b.dataset.m; render(); });
  $$('[data-j]').forEach(b => b.onclick = () => { S.joined.add(b.dataset.j); render(); });
  $$('[data-h]').forEach(b => b.onclick = () => { S.hand = { v: b.dataset.h, to: b.dataset.t }; render(); });
}
function replay() { clearLater(); Object.assign(S, { m: 'key', joined: new Set(), hand: null }); document.body.classList.add('pre'); render(); settle(ms('--motion-quick'));
  const t = ms('--motion-run'); later(() => { S.m = 'all'; document.body.classList.add('pre'); render(); settle(ms('--motion-instant')); }, t);
  later(() => { S.joined.add(target(cluster(METHODS).groups[0]).id); render(); }, t + ms('--motion-calm') * 1.5); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const k = e.key.toLowerCase();
  if (k === 'm') { const ids = [...METHODS.map(m => m.id), 'all']; S.m = ids[(ids.indexOf(S.m) + 1) % ids.length]; render(); }
  if (k === 'j') { const g = cluster(METHODS).groups.map(target).find(t => t && !S.joined.has(t.id)); if (g) S.joined.add(g.id); else { const v = cluster(METHODS).alone[0]; if (v && target([v])) S.hand = { v, to: target([v]).id }; } render(); }
});
replay();
</script>
</body>
</html>
