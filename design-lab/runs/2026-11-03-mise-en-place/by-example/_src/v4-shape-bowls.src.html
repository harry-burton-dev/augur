<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · By example V4 · Bowls by shape</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: values sorted into bowls by their shape; pour a bowl into the one you want, the odd bowl stays on the bench ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto auto;align-content:start;gap:var(--space-6)}
.bench{display:flex;gap:var(--space-4);align-items:stretch;min-height:0;padding:var(--space-6) 0 var(--space-2);border-bottom:2px solid var(--hairline-strong)}
.bowl{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:var(--space-2);transition:opacity var(--motion-calm) var(--ease-out),flex-grow var(--motion-calm) var(--ease-out)}
.bowl.empty{flex-grow:.35;opacity:.45}
.bowl.target{flex-grow:2}
.bowl .lab{display:grid;gap:2px}
.bowl .lab b{font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.bowl .lab small{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.bowl .lab{min-height:calc(var(--leading-meta) + var(--leading-small) * 2)}
.bowl .in{min-height:calc(var(--space-8) * 2);display:flex;flex-wrap:wrap;gap:var(--space-1);align-content:flex-end;justify-content:center;padding:var(--space-3);border:1px solid var(--hairline-strong);border-top:0;border-radius:0 0 calc(var(--radius-card) * 2) calc(var(--radius-card) * 2);background:linear-gradient(transparent,var(--surface-pane))}
.bowl.target .in{border-color:var(--light)}
.bowl.odd .in{border-style:dashed;border-color:var(--x-proposed-aside-edge);background:var(--x-proposed-aside-wash)}
.bowl .in .rawv{font-size:var(--x-proposed-type-micro);transition:opacity var(--motion-calm) var(--ease-out)}
.bowl .in .keptv{font-size:var(--type-meta)}
.bowl .in .rawv{font-size:var(--type-small)}
.bowl .in .keptv.fresh{border-bottom-color:var(--light)}
.bowl .act{display:flex;gap:var(--space-2);justify-content:center;min-height:var(--target-sm)}
.bowl .n{font:300 var(--type-heading)/1 var(--font-mono);color:var(--ink)}
.foot{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:var(--space-5);align-items:start}
.foot p{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.foot b{font-weight:400;color:var(--light)}
@media (max-width:1400px){.bowl .in{min-height:var(--space-8)}.foot p{font-size:var(--type-small);line-height:var(--leading-small)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>By example · V4</b> values sorted into bowls by shape; pour a bowl into the one you want, the odd one stays out · mise en place bowls, Trifacta patterns</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct', DATA.recipe.steps.slice(0, 5)), F0 = R.file, st = STEP('s6'), colName = st.col[0], col = R.header.indexOf(colName);
const live = R.lines.filter(l => !l.role);
/* a shape in words, from the runs of one example value */
function said(v) {
  return (v.match(/[A-Z][a-z]+|[A-Z]+|[a-z]+|\d+|./g) || []).map(r => /^[A-Z][a-z]+$/.test(r) ? 'a word' : /^[A-Z]+$/.test(r) ? `${r.length} capital${r.length > 1 ? 's' : ''}` : /^[a-z]+$/.test(r) ? (r.length > 3 ? 'a word' : `${r.length} small letter${r.length > 1 ? 's' : ''}`) : /^\d+$/.test(r) ? `${r.length} digit${r.length > 1 ? 's' : ''}` : r === ' ' ? 'a space' : r === '-' ? 'a dash' : r === '/' ? 'a slash' : `“${r}”`).join(', ');
}
const SH = {}; live.forEach(l => { const v = l.cells[col], k = shapeOf(v); (SH[k] = SH[k] || { k, ex: v, items: [] }).items.push({ n: l.n, v }); });
const BOWLS = Object.values(SH).sort((a, b) => b.items.length - a.items.length);
const TARGET = BOWLS.find(b => b.items.some(i => i.v === st.example[1]) || shapeOf(st.example[1]) === b.k);
const S = { poured: new Set(), aside: false };
function render() {
  const into = TARGET.items.length + BOWLS.filter(b => S.poured.has(b.k)).reduce((a, b) => a + b.items.length, 0);
  const left = BOWLS.filter(b => b !== TARGET && !S.poured.has(b.k) && b.items.some(i => !readVan(i.v)));
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, F0.name, 'Tidy', colName], [['P', 'pour next'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <div><h1 class="t">${raw(colName)} in ${BOWLS.length} bowls</h1><p class="lede" style="margin-top:var(--space-1)">Every value sorted by its shape, not its meaning. The widest bowl is how you want them (${pair(st.example[0], st.example[1])}); pour the others into it. A bowl that can’t be poured stays on the bench.</p></div>
    <div class="bench">${BOWLS.map((b, i) => { const isT = b === TARGET, done = S.poured.has(b.k), can = b.items.every(x => readVan(x.v));
      const items = isT ? [...b.items, ...BOWLS.filter(x => S.poured.has(x.k)).flatMap(x => x.items.map(y => ({ ...y, fresh: true })))] : done ? [] : b.items;
      return `<section class="bowl ${isT ? 'target' : ''} ${done ? 'empty' : ''} ${!can ? 'odd' : ''} dep" style="--i:${i}">
        <div class="lab"><b>${isT ? 'Like this' : done ? 'Poured' : can ? 'Can be poured' : 'Stays out'}</b><small>${said(b.ex)}<span class="tk">${esc(b.k)}</span></small></div>
        <div class="in">${items.map(x => x.fresh ? `<span class="keptv fresh" title="line ${x.n}, was ${esc(x.v)}">${readVan(x.v)}</span>` : isT ? `<span class="keptv" title="line ${x.n}">${esc(x.v)}</span>` : raw(x.v)).join('')}</div>
        <div class="act">${isT ? `<span class="n">${into}</span>` : done ? `<span class="heard">${I('check', 12)} ${b.items.length} in</span>` : can ? `<button class="btn sm" data-p="${esc(b.k)}">${I('arrow-left', 12)} Pour ${b.items.length} in</button>` : `<button class="btn sm" data-a>${I('archive', 12)} ${S.aside ? 'Set aside ✓' : 'Set aside'}</button>`}</div></section>`; }).join('')}</div>
    <div class="foot"><p><b>${S.poured.size === BOWLS.length - 1 - left.length ? `${plural(into, 'value')} in one shape` : `${BOWLS.length - 1 - S.poured.size - left.length} bowls left to pour`}.</b> Each pour is one line in the recipe: “${stepWords(st, run('oct')).w}” covers all of them, because every bowl that can be poured has two letters and up to two digits.</p>
      <p><b>The odd bowl:</b> ${left.map(b => b.items.map(i => `${raw(i.v)} on line ${i.n}`).join(', ')).join('; ') || 'none'}. No pour can make a van number from it. ${S.aside ? 'Set aside, waiting on a question to Kestrel.' : 'Set it aside or ask.'}</p>
      <p><b>Why bowls:</b> a cook groups by what things are, not by where they came from. Pouring a whole shape at once is a single decision a person can check by eye.</p></div>
  </div></main>`;
  Icons.hydrate($('#app'));
  $$('[data-p]').forEach(b => b.onclick = () => { S.poured.add(b.dataset.p); render(); });
  $('[data-a]') && ($('[data-a]').onclick = () => { S.aside = true; render(); });
}
const pourNext = () => { const b = BOWLS.find(b => b !== TARGET && !S.poured.has(b.k) && b.items.every(x => readVan(x.v))); if (b) S.poured.add(b.k); else S.aside = true; render(); };
function replay() { clearLater(); Object.assign(S, { poured: new Set(), aside: false }); document.body.classList.add('pre'); render(); settle(ms('--motion-quick')); const t = ms('--motion-run'); later(pourNext, t); later(pourNext, t + ms('--motion-calm')); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key.toLowerCase() === 'p') { clearLater(); pourNext(); } });
replay();
</script>
</body>
</html>
