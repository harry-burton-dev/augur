<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Mise en place · By example V2 · One more example where they differ</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: before and after, filled in pencil from your example; where two readings differ, ask for one more ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:var(--space-6)}
.ba{min-height:0;display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);overflow:hidden}
.ba .hd,.ba .r{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) minmax(0,1.6fr);gap:var(--space-3);align-items:center;padding:var(--space-1) var(--space-4)}
.ba .hd{border-bottom:1px solid var(--hairline-strong);padding:var(--space-2) var(--space-4)}
.ba .rows{flex:1;min-height:0}
.ba .r{border-bottom:1px solid var(--hairline);min-height:calc(var(--leading-meta) + var(--space-2))}
.ba .r .n{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);text-align:right}
.ba .r.yours{background:color-mix(in srgb,var(--light) 5%,transparent)}
.ba .r.two{background:var(--x-proposed-disagree-wash)}
.out{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.out .yours{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-meta);color:var(--light);border-bottom:1px solid var(--light)}
.out .pen{font-style:italic;font-size:var(--type-meta);color:var(--ink);border-bottom:1px dotted var(--x-proposed-pencil)}
.out .or{font-size:var(--type-small);color:var(--x-proposed-disagree)}
.out .alt{font-style:italic;font-size:var(--type-meta);color:var(--x-proposed-disagree);border-bottom:1px dotted var(--x-proposed-disagree)}
.out .why{font-size:var(--type-small);color:var(--ink-muted)}
.side{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.ex{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.ex li{display:flex;align-items:center;gap:var(--space-3);font-size:var(--type-meta);padding:var(--space-2) var(--space-3);border:1px solid var(--light);border-radius:var(--radius-key)}
.ex li .n{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.ask{border:1px solid var(--x-proposed-disagree);border-radius:var(--radius-inset);background:var(--x-proposed-disagree-wash);padding:var(--space-3) var(--space-4);display:grid;gap:var(--space-2)}
.ask p{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.ask .opts{display:flex;gap:var(--space-2);flex-wrap:wrap}
.counts{display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);margin:0}
.counts dt{font-family:var(--font-mono);color:var(--light);text-align:right}
.counts dd{margin:0;color:var(--ink-muted)}
.side .foot{margin-top:auto;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.side .foot b{font-weight:400;color:var(--ink)}
@media (max-width:1400px){.ba .r{min-height:var(--leading-meta);padding:2px var(--space-3)}.out .pen,.out .alt,.out .yours{font-size:var(--type-small)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>By example · V2</b> your example fills the rest in pencil; where two readings differ, give one more · FlashFill, programming by example</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = run('oct', DATA.recipe.steps.slice(0, 5)), F0 = R.file, H = R.header;
const st = STEP('s7'), col = H.indexOf(st.col[0]), YEAR = st.year;
const live = R.lines.filter(l => !l.role);
const ex1 = live.find(l => l.cells[col] === st.example[0]);
/* a second example where the two readings disagree */
const ex2 = live.find(l => dateShape(l.cells[col]) === 'd/m/y' && +l.cells[col].split('/')[0] <= 12 && +l.cells[col].split('/')[0] !== +l.cells[col].split('/')[1]);
const monthFirst = v => { const p = v.split('/'); const m = +p[0] - 1, d = +p[1]; return m < 12 && d <= 31 ? `${d} ${MON[m]} ${p[2]}` : null; };
const S = { ex: 1, pick: null };
function reading(v) {
  const sh = dateShape(v), d = readDate(v, YEAR);
  if (sh === 'd/m/y') { const mf = monthFirst(v); return { a: d.text, b: S.ex < 2 && mf && mf !== d.text ? mf : null, why: mf ? '' : 'only works day first' }; }
  if (sh === 'serial') return { a: d.text, why: 'the spreadsheet’s day number' };
  if (sh === 'd Mon') return { a: d.text, why: `year from your example` };
  return { a: d.text, why: '' };
}
function render() {
  const rows = live.map(l => ({ l, v: l.cells[col], r: reading(l.cells[col]) }));
  const two = rows.filter(x => x.r.b), yours = [ex1, ...(S.ex > 1 ? [ex2] : [])];
  $('#app').innerHTML = topHTML([DATA.app, DATA.bench, F0.name, 'Tidy', st.col[0]], [['E', 'give the example'], ['T', 'admin words', 'h-t'], ['R', 'replay']]) +
  `<main class="main"><div class="wrap">
    <section class="ba"><div class="hd"><span></span><span class="eyebrow">As it came · ${raw(st.col[0])}</span><span class="eyebrow">As we keep it</span></div>
      <div class="rows scroll">${rows.map((x, idx) => { const mine = yours.includes(x.l);
        return `<div class="r dep ${mine ? 'yours' : ''} ${x.r.b ? 'two' : ''}" style="--i:${mine ? 0 : idx}"><span class="n">${x.l.n}</span><span>${raw(x.v)}</span><span class="out">${mine ? `<span class="yours">${I('pen-line', 12)} ${x.r.a}</span><span class="why">your example</span>` : x.r.b ? `<span class="pen">${x.r.a}</span><span class="or">or</span><span class="alt">${x.r.b}</span>` : `<span class="pen">${x.r.a}</span>${x.r.why ? `<span class="why">${x.r.why}</span>` : ''}`}</span></div>`; }).join('')}</div></section>
    <section class="side"><div><h1 class="t">Your examples</h1><p class="lede" style="margin-top:var(--space-1)">Write how one value should look. The bench fills the rest in pencil and only asks again where two readings of your examples give different answers.</p></div>
      <ol class="ex">${yours.map(l => `<li><span class="n">line ${l.n}</span>${pair(l.cells[col], reading(l.cells[col]).a)}</li>`).join('')}</ol>
      ${two.length ? `<div class="ask"><p class="eyebrow">${I('split', 12)} ${plural(two.length, 'date')} can be read two ways</p><p>Your example has no day or month to tell them apart. ${raw(ex2.cells[col])} on line ${ex2.n} is either <b>${reading(ex2.cells[col]).a}</b> or <b>${reading(ex2.cells[col]).b}</b>. Which?</p>
        <div class="opts"><button class="btn sm" data-e>${reading(ex2.cells[col]).a}</button><button class="btn sm">${reading(ex2.cells[col]).b}</button></div></div>`
      : `<p class="heard">${I('check', 12)} heard · recipe line ${st.id.slice(1)}: ${lc(stepWords(st, run('oct')).w)}</p>`}
      <dl class="counts"><dt>${rows.length}</dt><dd>dates in ${Object.keys(rows.reduce((a, x) => (a[dateShape(x.v)] = 1, a), {})).length} shapes</dd><dt>${rows.length - two.length - yours.length}</dt><dd>filled in pencil, one reading each</dd><dt>${two.length}</dt><dd>with two readings${two.length ? ', waiting on one more example' : ''}</dd></dl>
      <p class="foot"><b>Why two examples, not one.</b> “${st.example[0]}” → “${st.example[1]}” teaches the year and the way to write it, but not the order of day and month. The bench could guess (${live.filter(l => dateShape(l.cells[col]) === 'd/m/y' && +l.cells[col].split('/')[0] > 12).length} dates only work day first), but a guess that is wrong moves visits by months, so it asks once and writes the answer into the recipe.</p></section>
  </div></main>`;
  Icons.hydrate($('#app'));
  $('[data-e]') && ($('[data-e]').onclick = () => { S.ex = 2; render(); });
}
function replay() { clearLater(); S.ex = 1; document.body.classList.add('pre'); render(); settle(ms('--motion-run')); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; if (e.key.toLowerCase() === 'e') { S.ex = S.ex === 1 ? 2 : 1; render(); } });
replay();
</script>
</body>
</html>
