/* ======================================================================
   Helpers
   ====================================================================== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ROOT = document.documentElement, BODY = document.body;
const tok = n => getComputedStyle(ROOT).getPropertyValue('--' + n).trim();
const T = n => parseFloat(tok('motion-' + n));          // a motion token, ms
const PX = n => parseFloat(tok(n));                      // a distance token, px
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ico = (n, s, w) => Icons.svg(n, { size: s || 16, stroke: w || 1.5 });
const RM = { on: matchMedia('(prefers-reduced-motion: reduce)').matches };
function setRM(v) { RM.on = v; ROOT.classList.toggle('rm', v); const el = $('#rm-state'); if (el) el.textContent = v ? 'on' : 'off'; }
setRM(RM.on);
let _timers = new Set();
const later = (fn, ms) => { const t = setTimeout(() => { _timers.delete(t); fn(); }, ms); _timers.add(t); return t; };
const clearLater = () => { _timers.forEach(clearTimeout); _timers.clear(); };
const say = m => { const l = $('#live'); l.textContent = ''; requestAnimationFrame(() => { l.textContent = m; }); };
const fill = (tpl, o) => tpl.replace(/\{(\w+)\}/g, (_, k) => o[k] != null ? o[k] : '');
const pct = v => v.toFixed(1) + '%';
let T0 = performance.now();
let CLOCK_OFF = 0;
const hms = t => { const [h, m, s] = t.split(':').map(Number); return h * 3600 + m * 60 + (s || 0); };
const clockSec = () => hms(DATA.clockStart) + Math.floor((performance.now() - T0) / 1000) + CLOCK_OFF;
const ensureClock = t => { const d = hms(t) - clockSec(); if (d > 0) CLOCK_OFF += d; };
const clock = () => { const tot = clockSec(), p = n => String(n).padStart(2, '0');
  return `${p(Math.floor(tot / 3600) % 24)}:${p(Math.floor(tot / 60) % 60)}:${p(tot % 60)}`; };
const timeAt = i => { const [h, m, s] = DATA.series.start.split(':').map(Number), tot = h * 3600 + m * 60 + s + i * DATA.series.stepSec, p = n => String(n).padStart(2, '0');
  return `${p(Math.floor(tot / 3600) % 24)}:${p(Math.floor(tot / 60) % 60)}`; };

/* the frame: 2.39 from the token, never shorter bars than --letterbox; ultrawide keeps 2.39 with side curtains */
function fit() {
  const ratio = parseFloat(tok('letterbox-ratio')), minBar = parseFloat(tok('letterbox')) / 100 * innerHeight;
  const fh = Math.min(innerHeight - 2 * minBar, innerWidth / ratio), fw = Math.min(innerWidth, fh * ratio);
  ROOT.style.setProperty('--lb-fh', fh + 'px'); ROOT.style.setProperty('--lb-fw', fw + 'px');
  ROOT.style.setProperty('--lb-bar', (innerHeight - fh) / 2 + 'px'); ROOT.style.setProperty('--lb-side', (innerWidth - fw) / 2 + 'px');
}
addEventListener('resize', () => { fit(); if (S.lb === 'open') drawPlot(); });

/* ======================================================================
   Series
   ====================================================================== */
const SER = {};
function buildSeries() {
  let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647 - .5; };
  DATA.series.servers.forEach(s => {
    const a = Array.from({ length: DATA.series.points }, () => Math.max(.05, s.base + rnd() * .08));
    if (s.shape) s.shape.values.forEach((v, k) => { a[s.shape.from + k] = v; });
    SER[s.id] = a;
  });
}
const W3 = () => DATA.series.servers.find(s => s.watch);

/* one plot function for the small multiple and the frame: bands, limits, the line coloured by band (alerts V5) */
function plotSVG(o) {
  const D = DATA.series, W = 1000, H = 300, cap = D.points - 1 + D.future;
  const X = i => i / cap * W, Y = v => H - Math.min(v, D.max) / D.max * H;
  const line = (a, n) => a.slice(0, n + 1).map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const a = SER[o.id], n = o.upto, d = line(a, n), k = o.key;
  let h = `<defs><clipPath id="cy${k}"><rect x="0" y="0" width="${W}" height="${Y(D.watch)}"/></clipPath><clipPath id="cr${k}"><rect x="0" y="0" width="${W}" height="${Y(D.limit)}"/></clipPath></defs>`;
  h += `<rect class="bnd y" x="0" y="${Y(D.limit)}" width="${W}" height="${Y(D.watch) - Y(D.limit)}"/><rect class="bnd r" x="0" y="0" width="${W}" height="${Y(D.limit)}"/>`;
  h += `<line class="lim y" x1="0" x2="${W}" y1="${Y(D.watch)}" y2="${Y(D.watch)}"/><line class="lim r" x1="0" x2="${W}" y1="${Y(D.limit)}" y2="${Y(D.limit)}"/>`;
  if (o.ghosts) DATA.series.servers.filter(s => !s.watch).forEach(s => { h += `<path class="ln ghost" d="${line(SER[s.id], Math.min(n, D.points - 1))}"/>`; });
  if (o.marks) { D.marks.forEach(m => { if (m.i <= n) h += `<line class="mkl" x1="${X(m.i)}" x2="${X(m.i)}" y1="0" y2="${H}"/>`; }); h += `<line class="mkl now" x1="${X(n)}" x2="${X(n)}" y1="0" y2="${H}"/>`; }
  if (o.proj) { const r = (a[n] - a[n - 4]) / 4; if (r > 0) { const steps = Math.min(cap - n, (D.max - a[n]) / r); h += `<path class="proj" d="M${X(n)},${Y(a[n])} L${X(n + steps)},${Y(a[n] + r * steps)}"/>`; } }
  if (o.after) h += `<path class="ln ok" d="${o.after}"/>`;
  h += `<path class="ln base" d="${d}"/><path class="ln y" d="${d}" clip-path="url(#cy${k})"/><path class="ln r" d="${d}" clip-path="url(#cr${k})"/>`;
  return { svg: `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${h}</svg>`, X: i => i / cap * 100, Y: v => 100 - Math.min(v, D.max) / D.max * 100 };
}

/* a word-sized sparkline (Tufte): grey normal band, the line, an end dot */
function spark(vals, o = {}) {
  const w = o.w || PX('space-7') - PX('space-3'), h = o.h || PX('space-4');
  const lo = Math.min(...vals, o.band ? o.band[0] : Infinity), hi = Math.max(...vals, o.band ? o.band[1] : -Infinity);
  const x = i => (i / (vals.length - 1)) * w, y = v => h - ((v - lo) / ((hi - lo) || 1)) * h;
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const band = o.band ? `<rect x="0" y="${y(o.band[1])}" width="${w}" height="${Math.max(1, y(o.band[0]) - y(o.band[1]))}" fill="currentColor" opacity=".12"/>` : '';
  return `<svg class="sp" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${band}<polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="${o.sw || 1}" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="${o.r || 2}" fill="currentColor"/></svg>`;
}
const progress = (p, w) => { w = w || PX('space-6'); const h = PX('space-3'); return `<svg class="sp" width="${w}" height="${h}" aria-hidden="true"><rect x="0" y="${h / 2 - 1}" width="${w}" height="2" fill="currentColor" opacity=".3"/><rect x="0" y="${h / 2 - 2}" width="${w * p}" height="4" fill="currentColor"/></svg>`; };
