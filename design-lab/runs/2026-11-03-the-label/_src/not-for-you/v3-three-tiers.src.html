<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Not for you V3 · Open, locked, not told</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: in a list of results, three tiers: open, locked (grouped by whom to ask), and not told, said once at the foot of every list ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:var(--space-6)}
.res{min-height:0;display:flex;flex-direction:column;gap:var(--space-3)}
.q{display:flex;align-items:center;gap:var(--space-3);height:var(--target-md);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);font-size:var(--type-body);color:var(--light);background:var(--surface-inset)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:0;overflow:auto}
.it{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-2);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.it .t{color:var(--light)}
.it .s{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.it > svg{color:var(--ink-muted)}
.it.locked{background:var(--x-proposed-unseen);background-size:auto}
.it.locked .t{color:var(--ink)}
.grp{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);background:var(--x-proposed-unseen),var(--surface-inset);margin-top:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.grp b{font-weight:400;color:var(--light)}
.foot{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-top:1px dashed var(--hairline-strong);padding-top:var(--space-2);margin-top:var(--space-2);display:flex;gap:var(--space-2)}
.tiers{display:grid;gap:var(--space-4);align-content:start}
.tier{display:grid;grid-template-columns:calc(var(--space-6) + var(--space-2)) minmax(0,1fr);gap:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta)}
.tier .sw{height:var(--space-6);border:1px solid var(--hairline);border-radius:var(--radius-key)}
.tier b{font-weight:400;color:var(--light)}
.tier .who{display:block;margin-top:var(--space-1)}
.collapsed .it.locked{display:none}
@media (max-width:1400px){.it{padding:var(--space-2) var(--space-1)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Not for you · V3</b> open, locked, not told: locked results stay in place and group by whom to ask; what you may not even know of is said once, on every list · six ways to be empty, the Glomar response</div>
<script>
/*@DATA@*/
/*@LIB@*/
const me = READERS.leah;
const S = { grouped: false };
/* results for the query: the record's values plus the source report, each with its own view for this reader */
function results() {
  const r = [];
  r.push({ icon: 'file-text', t: DATA.doc.title, s: `${DATA.doc.app} · ${DATA.doc.library}`, keptOn: DATA.doc.keptOn, label: 'lbHours', ask: DATA.doc.by });
  r.push({ icon: 'ship', t: DATA.record.title, s: `${DATA.record.app} · ${DATA.record.kind}`, keptOn: DATA.record.keptOn, label: 'lbOff', ask: DATA.record.keeper });
  DATA.record.facts.filter(f => ['f4', 'f5', 'f6', 'f8'].includes(f.id)).forEach(f => r.push({ icon: 'circle-dot', t: `${f.k} · ${DATA.record.title}`, s: `${DATA.record.app} · fact`, fact: f, label: f.label, keptOn: f.keptOn }));
  r.push({ icon: 'database', t: DATA.dataset.title, s: `${DATA.record.app} · collection`, keptOn: DATA.dataset.keptOn, label: 'lbHours', ask: DATA.dataset.keeper });
  return r.map(x => {
    if (x.fact) { const v = viewFact(x.fact, me); return { ...x, state: v.state === 'said' ? 'open' : v.state, said: v.state === 'said' ? v.text : null, ask: v.ask, why: v.why }; }
    return { ...x, state: canOpen(x.keptOn, me.floor) ? 'open' : 'unseen', why: `Kept by ${F(x.keptOn).name}.` };
  });
}
function render() {
  const R = results(), shown = R.filter(x => x.state !== 'hidden');
  const locked = shown.filter(x => x.state === 'unseen');
  const by = {}; locked.forEach(x => { (by[x.ask] = by[x.ask] || []).push(x); });
  $('#app').innerHTML = topHTML(['Search'], [['G', 'group the locked', 'h-g'], ...STD_HINTS], me.person) +
  `<main class="main"><div class="wrap">
    <section class="res"><p class="eyebrow">Results for ${P(me.person).name} · ${F(me.floor).name}</p>
      <div class="q">${I('search', 18)} Marlow Star fatigue</div>
      <ul class="list ${S.grouped ? 'collapsed' : ''}">${shown.map((x, i) => `<li class="it dep ${x.state === 'unseen' ? 'locked' : ''}" style="--i:${i}">${I(x.state === 'unseen' ? 'lock' : x.icon, 16)}<span><span class="t">${x.t}</span><span class="s">${x.s}${x.state === 'unseen' ? ` · ${x.why} Ask ${P(x.ask).name}.` : ''}${x.said ? ` · reads <span class="said">${x.said}</span> for you` : ''}</span></span>${whyBtn(x.label, pmHTML(x.label))}</li>`).join('')}</ul>
      ${S.grouped ? Object.entries(by).map(([p, xs]) => `<div class="grp dep">${I('lock', 16)}<span><b>${xs.length} result${xs.length > 1 ? 's' : ''}</b> you can’t open, kept by ${andList([...new Set(xs.map(x => F(x.keptOn || 'pil').name))])}<span class="who" style="display:block">${xs.map(x => x.t.split(' · ')[0]).join(' · ')}</span></span><button class="btn sm">${I('hand', 12)} Ask ${P(p).name}</button></div>`).join('') : ''}
      <p class="foot">${I('info', 14)}<span>${GLOMAR()} <span class="tk">hidden here: results whose label has hideExistence (${Object.entries(POL.descriptors).filter(([, d]) => d.hideExistence).map(([, d]) => d.word).join(', ')}) and that this reader can’t open</span></span></p>
    </section>
    <aside class="tiers"><p class="eyebrow">Three tiers, one rule each</p>
      <div class="tier"><span class="sw" style="background:var(--surface-raised)"></span><span><b>Open.</b> Yours to read. A value said another way is still open: it says so.</span></div>
      <div class="tier"><span class="sw" style="background:var(--x-proposed-unseen),var(--surface-inset)"></span><span><b>Locked.</b> You may know it exists. It stays in its place in the list, hatched, with why and whom to ask. Many locked results from one keeper fold into one line with one ask (G).</span></div>
      <div class="tier"><span class="sw" style="border-style:dashed"></span><span><b>Not told.</b> When even its existence would cause harm (the policy names which descriptors), it is left out with no mark. So that no list gives that away, every list ends with the same line, whether anything was left out or not.<span class="who">Design note, not shown to ${first(P(me.person).name)}: the record also holds the radar blind sector (${DS('security').word}), kept by ${F('vts').name}. It is left out of this list, and the list looks exactly as it would if it weren’t there.</span></span></div>
    </aside>
  </div></main>`;
  afterRender(); $('#h-g')?.classList.toggle('on', S.grouped);
}
function replay() { clearLater(); closeDeed(); S.grouped = false; settleIn(); render(); later(() => { S.grouped = true; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'g') { S.grouped = !S.grouped; render(); }
});
replay();
</script>
</body>
</html>
