<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Not for you V6 · Ask in a sentence</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: the ask is a sentence. Whom to ask is worked out, the purpose is checked against the label as you choose, and the keeper's card arrives already checked ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(340px,1fr);gap:var(--space-6)}
.left{display:flex;flex-direction:column;gap:var(--space-4);min-height:0}
.sent{font-weight:300;font-size:var(--type-heading);line-height:calc(var(--leading-heading) + var(--space-3));color:var(--ink-muted);max-width:var(--measure-wide)}
.slot{color:var(--light);border-bottom:1px dashed var(--ink-muted);padding:0 2px;font-weight:400}
.slot[aria-expanded="true"]{background:var(--surface-raised);border-bottom-color:var(--x-proposed-lit)}
.calc{color:var(--light);font-weight:400}
.sent.no .slot[data-k="use"]{text-decoration:line-through;text-decoration-color:var(--x-proposed-stopped)}
.opts{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.opt{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.opt[aria-selected="true"]{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.opt.no{color:var(--ink-muted);border-style:dashed}
.opt .v{font:400 var(--x-proposed-type-micro)/1 var(--font-mono);color:var(--ink-muted)}
.check{display:grid;gap:var(--space-2)}
.okline{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);border-left:2px solid var(--x-proposed-lit);padding:var(--space-1) var(--space-3);background:var(--x-proposed-lit-wash)}
.okline svg{flex:none;margin-top:2px;color:var(--x-proposed-lit)}
.card{align-self:start;display:grid;gap:var(--space-3);padding:var(--space-4) var(--space-5);border:1px solid var(--hairline-strong);border-radius:var(--radius-card);background:var(--surface-overlay);box-shadow:var(--shadow-overlay)}
.card h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.card .rows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}
.card .rows .h{font:400 var(--type-label)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.card .btns{display:flex;gap:var(--space-2);flex-wrap:wrap}
.card.no{opacity:var(--x-proposed-quiet)}
@media (max-width:1400px){.sent{font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-2))}.card{padding:var(--space-3) var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Not for you · V6</b> ask in a sentence: whom to ask is worked out, the purpose is checked against the label as you choose, the keeper gets a card already checked · said in a sentence, consent receipts (Kantara)</div>
<script>
/*@DATA@*/
/*@LIB@*/
const me = READERS.sam;
const S = { f: 'f5', use: 'safety', until: '31 Dec 2026', open: 'use', preview: null };
const VALUES = ['f4', 'f5', 'f6', 'f7'];
const UNTILS = ['30 Nov 2026', '31 Dec 2026', '31 Mar 2027'];
function verdict(f, u) {
  const lb = L(f.label), w = lb.uses[u], consent = DATA.consents.find(c => c.facts.includes(f.id));
  if (consent && u !== consent.purpose) return { ok: false, t: `${P(consent.subject).name} gave it for ${consent.purposeNote}. Only he can widen that.` };
  if (w === 'no') return { ok: false, t: `No one can grant this. ${tpl(POL.clauses[u] || POL.clauses.marking)}` };
  if (w === 'count') return { ok: true, count: true, t: `The label allows this only as a count. If ${first(P(whom(f)).name)} says yes, you get it inside counts.` };
  return { ok: true, t: `The label allows ${US(u).long.toLowerCase()}. ${P(whom(f)).name} can say yes.` };
}
function whom(f) { const v = viewFact(f, me); const c = DATA.consents.find(c => c.facts.includes(f.id)); return c ? c.subject : v.ask || L(f.label).setBy; }
function slot(k, txt) { return `<button class="slot" data-k="${k}" aria-expanded="${S.open === k}">${txt}</button>`; }
function render() {
  const f = FACT(S.f), use = S.preview && S.open === 'use' ? S.preview : S.use, v = verdict(f, use), w = P(whom(f));
  const opts = S.open === 'value' ? VALUES.map(id => ({ id, w: FACT(id).k.toLowerCase(), v: viewFact(FACT(id), me).state === 'open' ? 'yours already' : '' }))
    : S.open === 'use' ? USE_IDS().map(u => ({ id: u, w: US(u).long.toLowerCase(), no: !verdict(f, u).ok, v: !verdict(f, u).ok ? 'no one can' : verdict(f, u).count ? 'as a count' : '' }))
    : S.open === 'until' ? UNTILS.map(d => ({ id: d, w: d })) : [];
  const cur = S.open === 'value' ? S.f : S.open === 'use' ? use : S.until;
  $('#app').innerHTML = topHTML(['Data Atlas', DATA.record.title, 'Ask'], [['Tab', 'a choice'], ['← →', 'an option'], ...STD_HINTS], me.person) +
  `<main class="main"><div class="wrap">
    <section class="left"><p class="eyebrow">${P(me.person).name} · ${F(me.floor).name} · asking</p>
      <p class="sent ${v.ok ? '' : 'no'}">Ask <span class="calc">${w.name}</span> to let me see ${slot('value', 'the ' + f.k.toLowerCase())} on ${DATA.record.title} for ${slot('use', US(use).long.toLowerCase())}, until ${slot('until', S.until)}.</p>
      <div class="opts" role="listbox">${opts.map(o => `<button class="opt ${o.no ? 'no' : ''}" role="option" aria-selected="${o.id === cur}" data-id="${o.id}">${o.w}${o.v ? ` <span class="v">${o.v}</span>` : ''}</button>`).join('')}</div>
      <div class="check">${v.ok ? `<p class="okline">${I('check', 14)}<span>${v.t}</span></p>` : `<p class="stopnote">${I('ban', 14)}<span>${v.t} The ask can’t be sent for this purpose.</span></p>`}
        <p class="who">Whom to ask is worked out from the value’s label, not chosen: the person who keeps it, or, for something given by consent, the person it is about.</p></div>
    </section>
    <aside class="card ${v.ok ? '' : 'no'}" aria-label="What ${w.name} will see"><p class="eyebrow">What ${w.name} will get</p>
      <h2>${P(me.person).name} asks to see the ${f.k.toLowerCase()}</h2>
      <div class="rows"><span class="h">For</span><span>${US(use).long}</span><span class="h">Until</span><span>${S.until}, then it locks again</span><span class="h">Label</span><span>${markHTML(f.label)}</span><span class="h">Checked</span><span>${v.ok ? `${I('check', 12)} the label allows this purpose` : `${I('ban', 12)} not allowed`}</span><span class="h">Reach</span><span>1 person, ${P(me.person).role}, ${F(me.floor).name}</span></div>
      <div class="btns"><button class="btn sm go">${I('check', 12)} Yes, until ${S.until}</button>${L(f.label).uses.report === 'count' ? `<button class="btn sm">${I('hash', 12)} Yes, as a count</button>` : ''}<button class="btn sm">No, and say why</button></div>
      <p class="who">Either answer leaves a receipt for both of you, and the value’s custody records it.</p>
    </aside>
  </div></main>`;
  afterRender();
  $$('.slot').forEach(b => b.onclick = () => { S.open = b.dataset.k; S.preview = null; render(); });
  $$('.opt').forEach(b => { b.onclick = () => choose(b.dataset.id); b.onmouseenter = () => { if (S.open === 'use') { S.preview = b.dataset.id; render(); } }; });
}
function choose(id) { if (S.open === 'value') S.f = id; else if (S.open === 'use') { if (!verdict(FACT(S.f), id).ok) { S.preview = id; render(); return; } S.use = id; } else S.until = id; S.preview = null; render(); }
function replay() {
  clearLater(); closeDeed(); Object.assign(S, { f: 'f5', use: 'safety', until: '31 Dec 2026', open: 'use', preview: null }); settleIn(); render();
  later(() => { S.preview = 'appraisal'; render(); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'Tab') { e.preventDefault(); const ks = ['value', 'use', 'until']; S.open = ks[(ks.indexOf(S.open) + 1) % 3]; S.preview = null; render(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const ids = $$('.opt').map(o => o.dataset.id); const cur = S.open === 'value' ? S.f : S.open === 'use' ? (S.preview || S.use) : S.until; const i = ids.indexOf(cur); const nx = ids[(i + (e.key === 'ArrowRight' ? 1 : -1) + ids.length) % ids.length]; if (S.open === 'use') { S.preview = nx; if (verdict(FACT(S.f), nx).ok) S.use = nx; render(); } else choose(nx); }
});
replay();
</script>
</body>
</html>
