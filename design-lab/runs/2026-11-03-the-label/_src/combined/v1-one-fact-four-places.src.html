<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Combined V1 · One fact, four places</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V1: one sensitive fact from a source document, into Data Atlas, into an answer, into a shared briefing, with its label intact and every change of label said ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:var(--space-3)}
.main{padding-bottom:calc(var(--space-7) - var(--space-2))}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5)}
.stations{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3);min-height:0}
.st{position:relative;display:flex;flex-direction:column;min-height:0;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);overflow:hidden;transition:filter var(--motion-slow) var(--ease-standard),opacity var(--motion-slow) var(--ease-standard),border-color var(--motion-slow) var(--ease-standard)}
.st.far{filter:saturate(.55);opacity:.62}
.st.on{border-color:var(--x-proposed-lit);box-shadow:0 0 var(--glow-blur) var(--x-proposed-lit-wash)}
.st.wait{opacity:.25}
.st .hd{display:grid;gap:2px;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--hairline);text-align:left;width:100%}
.st .hd .n{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.st .hd b{font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.st .bd{flex:1;min-height:0;overflow:auto;padding:var(--space-3);display:grid;gap:var(--space-2);align-content:start;font-size:var(--type-small);line-height:var(--leading-small)}
.st .bd p{color:var(--ink)}
.st .bd .big{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.st .bd .q{font-style:italic;color:var(--ink-muted)}
.st .banner{font-size:var(--x-proposed-type-micro);letter-spacing:var(--tracking-caps);padding:2px var(--space-2)}
.lv{text-decoration:underline dotted var(--ink-muted);text-underline-offset:var(--space-1);text-decoration-thickness:1.5px;color:var(--light)}
.lv sup{font:500 var(--x-proposed-type-micro)/0 var(--font-mono);color:var(--ink-muted);margin-left:1px}
.para{display:grid;grid-template-columns:calc(var(--space-6) + var(--space-1)) minmax(0,1fr);gap:var(--space-1)}
.para.x span:last-child{text-decoration:line-through;text-decoration-color:var(--x-proposed-stopped);color:var(--ink-muted)}
/* the label at each station, and what changed on the way in */
.lab{display:grid;gap:var(--space-1);padding:var(--space-2) var(--space-3);border-top:var(--x-proposed-mark-rule-2);background:var(--surface-inset)}
.lab .mk{font-size:var(--x-proposed-type-micro);letter-spacing:var(--tracking-soft);white-space:normal}
.diff{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.df{display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);font-size:var(--x-proposed-type-micro);line-height:1.6;color:var(--ink);white-space:nowrap}
.df.same{color:var(--ink-muted);border-style:dotted}
.df.down{border-color:var(--x-proposed-said-other);color:var(--x-proposed-said-other)}
.df.stop{border-color:var(--x-proposed-stopped);color:var(--x-proposed-stopped)}
.lab .who{font-size:var(--x-proposed-type-micro);line-height:1.5}
/* the path between stations: the lit navigation path */
.path{position:absolute;top:var(--space-5);right:calc(var(--space-3) * -1 - 1px);width:var(--space-3);height:2px;background:var(--hairline-strong);z-index:2}
.path.lit{background:var(--x-proposed-lit);box-shadow:0 0 var(--space-2) var(--x-proposed-lit)}
.chain{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.chain .c{display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);color:var(--ink);white-space:nowrap;transition:opacity var(--motion-base) var(--ease-standard)}
.chain .c.brk{border-style:dashed;border-color:var(--x-proposed-disagree)}
.chain .c.said{border-color:var(--x-proposed-said-other)}
.chain .c.off{opacity:.25}
@media (prefers-reduced-motion: reduce){.st{transition:opacity var(--motion-base)}.st.far{filter:none}}
@media (max-width:1400px){.st .bd .big{font-size:var(--type-lead);line-height:var(--leading-lead)}.st .bd{padding:var(--space-2)}.head .sub{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V1</b> one fact, four places: the pilot's hours from report to Data Atlas to an answer to a shared briefing, the label carried and every change of it said · portion marks, said another way, the strictest wins, custody chain</div>
<script>
/*@DATA@*/
/*@LIB@*/
const f = FACT('f5'), fName = FACT('f4'), D = DATA.doc, A = DATA.answer, B = DATA.briefing, sec = D.sections.find(s => s.n === f.src);
const S = { at: 1, reached: 1 };
const countLb = { ...L('lbHours'), desc: [] };
const briefC = shareCheck(TG('t1')), briefLb = paperLabel(briefC);
/* the four stations: each says where the value is, how it reads, its label there, and what changed on the way in */
function stations() {
  const leah = READERS.leah, sh = DATA.shares[0];
  return [
    { n: '1 · Source', app: `${D.app} · ${D.library}`, t: D.title, who: `${P(D.by).name} · ${F(D.keptOn).name}`, lb: L(f.label),
      body: `<p class="para"><span>${pmHTML(sec.label)}</span><span><b class="lite" style="font-weight:400">${sec.n} ${sec.h}.</b> ${sec.text.replace(fName.v, `<span class="lv">${fName.v}<sup>${DS('personal').short}</sup></span>`).replace(f.v, `<span class="lv">${f.v}<sup>${DS('personal').short}</sup></span>`)}</span></p>
        <p class="who">The value is underlined by what it contains. ${P(D.by).name} labelled the paragraph when he wrote it.</p>`,
      diff: [{ c: 'new', t: `set ${markWord(f.label)}` }, { c: 'new', t: `caveat: count only beyond ${F('pil').name}` }],
      note: `Kept ${keepWord(f.label)}.` },
    { n: '2 · Fact', app: `${DATA.record.app} · ${DATA.record.kind}`, t: `${DATA.record.title}: ${f.k}`, who: `${F(f.keptOn).name} · seen by ${P(leah.person).name} through share ${sh.id}`, lb: L(f.label),
      body: `<p class="big">${f.v}</p><p>${lineHTML(f.label)}</p><p class="who">From ${D.title} ${f.src}, proposed by Data Atlas and accepted by ${P(D.by).name}, keeping the report’s label. Shared with ${P(sh.to).name} for ${US(sh.purpose).word.toLowerCase()}, until ${sh.until}.</p>`,
      diff: [{ c: 'same', t: 'label unchanged' }, { c: 'new', t: `+ share ${sh.id}, until ${sh.until}` }],
      note: DATA.custody.find(k => k.repair).repair },
    { n: '3 · Answer', app: 'Explorer · answer ' + A.id, t: A.q, who: `${P(A.by).name} · ${F(A.keptOn).name}`, lb: countLb,
      body: `<p class="big">${A.n} of ${A.of}</p><p>${A.text.replace('{n}', A.n).replace('{of}', A.of)}</p>
        <p class="who">The base: ${A.of} groundings this year (${MK('off').word}), and the ${A.of} pilots’ time on duty (${markWord('lbHours')}). Which groundings: <span class="unseen">${I('lock', 10)} counted, not shown</span></p>
        <p class="who">${I('bot-off', 12)} Not sent to the model gateway: ${US('model').word.toLowerCase()} is “${POL.useWords.no}”. The sentence is a template.</p>`,
      diff: [{ c: 'down', t: `− ${DS('personal').word} by rule 3: a count over ${A.of}, none named` }, { c: 'same', t: `stays ${MK('os').word}: the strictest part` }],
      note: tpl(POL.clauses.count) },
    { n: '4 · Briefing, shared', app: `${D.app} · ${TG('t1').via}`, t: B.title, who: `${P(B.by).name} → ${DATA.groups.sc.name}, ${DATA.groups.sc.people} people`, lb: briefLb,
      body: briefC.map((c, i) => `<p class="para ${c.v === 'stop' ? 'x' : ''}"><span>${pmHTML(paraLabel(c.p))}</span><span>${c.p.text}</span></p>`).join('') +
        `<p class="stopnote">${I('ban', 12)}<span>¶4 stayed behind: ${briefC.find(c => c.v === 'stop').why}</span></p>`,
      diff: [{ c: 'same', t: `banner ${MK(briefLb.marking).word}, raised by ¶3` }, { c: 'stop', t: '¶4 stopped by the label' }, { c: 'new', t: `+ receipt ${DATA.custody.find(k => k.id === 'k9').receipt}` }],
      note: `Readers outside the committee never get ¶3 in a whole-floor library: ${MK('os').word} goes to named groups.` }
  ];
}
function render() {
  const ST = stations();
  $('#app').innerHTML = topHTML(['One fact', f.k, 'from source to briefing'], [['1–4', 'a place'], ['← →', 'follow it'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <div class="head"><div><p class="eyebrow">${DATA.record.title} · ${f.k} · ${f.v}</p><h1 class="title">One fact, four places</h1></div>
      <p class="sub">The same value, followed from where it was written to where it was shared. Under each place, its label there and what changed on the way in. It is never typed again and never loses its label; it is only ever said another way, by a rule that says so.</p></div>
    <div class="stations">${ST.map((s, i) => `<section class="st ${i + 1 === S.at ? 'on' : i + 1 > S.reached ? 'wait' : 'far'}" aria-current="${i + 1 === S.at}">
      ${i < 3 ? `<span class="path ${i + 1 < S.reached ? 'lit' : ''}"></span>` : ''}
      <button class="hd" data-at="${i + 1}"><span class="n">${s.n} · ${s.app}</span><b>${s.t}</b><span class="who">${s.who}</span></button>
      <div class="banner" data-rank="${MK(s.lb.marking).rank}">${markWord(s.lb)}</div>
      <div class="bd scroll">${s.body}</div>
      <div class="lab"><span>${markHTML(s.lb)}</span><span>${usesHTML(s.lb, { compact: true })}</span><span class="diff">${s.diff.map(d => `<span class="df ${d.c}">${d.t}</span>`).join('')}</span><span class="who">${s.note}</span></div>
    </section>`).join('')}</div>
    <div class="chain" aria-label="Custody so far">${I('link', 14)} Custody ${DATA.custody.map((k, i) => { const st = k.id <= 'k4' ? 1 : k.id <= 'k6' ? 2 : k.id === 'k7' ? 3 : 4; return `<span class="c ${k.gap ? 'brk' : ''} ${k.said ? 'said' : ''} ${st > S.reached ? 'off' : ''}">${k.act === 'read' ? `${I('eye', 10)} ${k.reads} reads` : `${handName(k.hand).split(' ')[0]} ${k.act}`}</span>`; }).join(I('chevron-right', 12))}</div>
  </div></main>`;
  afterRender();
  $$('[data-at]').forEach(b => b.onclick = () => go(+b.dataset.at));
}
function go(n) { S.at = Math.max(1, Math.min(4, n)); S.reached = Math.max(S.reached, S.at); render(); }
function replay() {
  clearLater(); closeDeed(); S.at = 1; S.reached = 1; settleIn(); render();
  const t = MOMENT(), step = ms('--motion-calm');
  later(() => go(2), t); later(() => go(3), t + step * 1.4); later(() => go(4), t + step * 2.8);
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (/^[1-4]$/.test(e.key)) { S.reached = 4; go(+e.key); }
  if (e.key === 'ArrowRight') go(S.at + 1); if (e.key === 'ArrowLeft') go(S.at - 1);
});
replay();
</script>
</body>
</html>
