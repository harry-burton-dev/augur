<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Combined V2 · Not for you, and the way to yes</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V2: an operator meets what they can't open. Each value says which kind of no, why, who can change it and when it opens; asking is one sentence, checked against the label ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(380px,1fr);gap:var(--space-5)}
.rec{display:flex;flex-direction:column;min-height:0;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);overflow:hidden}
.rec .in{flex:1;min-height:0;overflow:auto;padding:var(--space-3) var(--space-4);display:grid;gap:var(--space-2);align-content:start}
.fact{display:grid;grid-template-columns:auto minmax(150px,.7fr) minmax(0,1.6fr);gap:var(--space-1) var(--space-3);align-items:start;padding:var(--space-2);border-radius:var(--radius-key);border:1px solid transparent;font-size:var(--type-meta);line-height:var(--leading-meta);text-align:left;width:100%}
.fact:hover{background:var(--surface-raised)}
.fact.on{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.fact .k{color:var(--ink-muted)}
.fact .val{color:var(--light)}
.fact .why-l{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.fact .when{display:inline-flex;align-items:center;gap:var(--space-1);font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--x-proposed-said-other)}
.ask{display:flex;flex-direction:column;gap:var(--space-3);min-height:0}
.panel{display:grid;gap:var(--space-3);padding:var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-card);background:var(--surface-overlay);box-shadow:var(--shadow-overlay);transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.panel.shut{opacity:0;transform:translateY(var(--travel-near))}
.kind{display:flex;gap:var(--space-2);align-items:center;font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.sent{font-weight:300;font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-2));color:var(--ink-muted)}
.sent .calc{color:var(--light);font-weight:400}
.sent .slot{color:var(--light);font-weight:400;border-bottom:1px dashed var(--ink-muted)}
.opts{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.opt{padding:var(--space-1) var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);font-size:var(--type-small);color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.opt.no{border-style:dashed;color:var(--ink-muted)}
.okline{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--type-small);line-height:var(--leading-small);border-left:2px solid var(--x-proposed-lit);padding:var(--space-1) var(--space-3);background:var(--x-proposed-lit-wash)}
.alt{display:grid;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);border-top:1px solid var(--hairline);padding-top:var(--space-2)}
.sentok{display:grid;gap:var(--space-1);padding:var(--space-3);border:1px dashed var(--hairline-strong);border-radius:var(--radius-inset);font-size:var(--type-small);line-height:var(--leading-small)}
@media (max-width:1400px){.fact{grid-template-columns:auto minmax(120px,.6fr) minmax(0,1.6fr)}.sent{font-size:var(--type-body);line-height:var(--leading-body)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V2</b> not for you, and the way to yes: each value says its kind of no, who can change it and when it opens; the ask is one sentence checked against the label · seen as, four kinds of answer, closed until, ask in a sentence</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = DATA.record, me = READERS.sam, B = DATA.briefing;
const S = { on: null, use: 'safety', sent: false };
/* the kind of no, and when it opens, worked out from the label, consent and the briefing that carries the count */
function kindOf(f) {
  const v = viewFact(f, me);
  if (v.state === 'open') return { k: 'open', ic: 'check', t: 'Open' };
  if (v.state === 'said') return { k: 'said', ic: 'corner-down-right', t: 'Said another way', who: whoChanges(f.label), why: v.why };
  if (DATA.consents.some(c => c.facts.includes(f.id))) return { k: 'person', ic: 'user-round', t: 'Only the person it’s about', who: v.ask, why: v.why };
  return { k: 'ask', ic: 'hand', t: 'Ask someone', who: v.ask, why: v.why, when: f.id === 'f5' ? `in counts from ${B.embargo.until}, in ${B.title}` : f.id === 'f7' ? `never to you; kept until ${L(f.label).keepDate}` : null };
}
function verdict(f, u) {
  const lb = L(f.label), w = lb.uses[u], c = DATA.consents.find(c => c.facts.includes(f.id));
  if (c && u !== c.purpose) return { ok: false, t: `${P(c.subject).name} gave it for ${c.purposeNote}.` };
  if (w === 'no') return { ok: false, t: `No one can grant this. ${tpl(POL.clauses[u] || POL.clauses.marking)}` };
  return { ok: true, t: `The label allows ${US(u).long.toLowerCase()}${w === 'count' ? ', as a count' : ''}. ${P(kindOf(f).who).name} can say yes.` };
}
function render() {
  const vis = R.facts.filter(f => viewFact(f, me).state !== 'hidden');
  const f = S.on && FACT(S.on), K = f && kindOf(f), V = f && K.k !== 'open' && K.k !== 'said' && verdict(f, S.use);
  const recLb = combine(vis.filter(x => viewFact(x, me).state === 'open').map(x => x.label));
  $('#app').innerHTML = topHTML(['Data Atlas', 'Groundings', R.title], [['↑ ↓', 'a value'], ['1–6', 'a purpose'], ['Enter', 'send'], ...STD_HINTS], me.person) +
  `<main class="main"><div class="wrap">
    <section class="rec"><div class="banner" data-rank="${MK(recLb.marking).rank}">${markWord(recLb)}<span class="r">· for ${P(me.person).name}</span></div>
      <div class="in"><p class="eyebrow">${R.kind} · ${R.id} · kept by ${F(R.keptOn).name}</p><h1 class="title" style="font-size:var(--type-heading);line-height:var(--leading-heading);letter-spacing:var(--tracking-caps)">${R.title}</h1>
        ${vis.map((x, i) => { const k = kindOf(x); return `<button class="fact dep ${S.on === x.id ? 'on' : ''}" style="--i:${i}" data-f="${x.id}"><span>${k.k === 'open' ? pmHTML(x.label) : `<span class="pm">${I(k.ic, 12)}</span>`}</span><span class="k">${x.k}</span>
          <span>${valueHTML(x, me)}${k.why ? `<span class="why-l">${k.t} · ${k.why}</span>` : ''}${k.when ? `<span class="when">${I('calendar-clock', 10)} opens ${k.when}</span>` : ''}</span></button>`; }).join('')}
        <p class="who">${I('info', 12)} ${GLOMAR()}</p></div></section>
    <aside class="ask">
      ${f && V ? `<div class="panel ${S.on ? '' : 'shut'}" role="dialog" aria-label="Ask">
        <span class="kind">${I(K.ic, 12)} ${K.t}</span>
        <p class="sent">Ask <span class="calc">${P(K.who).name}</span> to let me see <span class="calc">the ${f.k.toLowerCase()}</span> for <span class="slot">${US(S.use).long.toLowerCase()}</span>, until <span class="slot">31 Dec 2026</span>.</p>
        <div class="opts">${USE_IDS().map((u, i) => `<button class="opt ${verdict(f, u).ok ? '' : 'no'}" aria-pressed="${S.use === u}" data-u="${u}">${i + 1} · ${US(u).word}</button>`).join('')}</div>
        ${V.ok ? `<p class="okline">${I('check', 14)}<span>${V.t}</span></p>` : `<p class="stopnote">${I('ban', 14)}<span>${V.t}</span></p>`}
        ${K.when ? `<div class="alt"><span class="eyebrow">Or wait</span><span>${I('calendar-clock', 12)} It reaches you ${K.when}, without asking anyone.</span></div>` : ''}
        ${S.sent ? `<div class="sentok">${I('receipt', 14)}<b class="lite" style="font-weight:400">Asked. Receipt kept for you and ${P(K.who).name}.</b><span class="who">${P(K.who).name} sees your purpose with the label already checked, and answers yes until a date, yes as a count, or no with why.</span></div>`
          : `<button class="btn ${V.ok ? 'go' : ''}" ${V.ok ? '' : 'aria-disabled="true"'} data-send>${I('send', 14)} Ask ${first(P(K.who).name)}</button>`}
      </div>` : `<div class="panel"><p class="eyebrow">Pick a value</p><p class="sub">Every value you can’t open says which kind of no it is. Pick one to see who can change it, when it opens, and to ask.</p></div>`}
    </aside>
  </div></main>`;
  afterRender();
  $$('.fact').forEach(b => b.onclick = () => { S.on = b.dataset.f; S.sent = false; render(); });
  $$('.opt').forEach(b => b.onclick = () => { S.use = b.dataset.u; S.sent = false; render(); });
  $('[data-send]')?.addEventListener('click', send);
}
function send() { const f = FACT(S.on); if (verdict(f, S.use).ok) { S.sent = true; render(); } }
function replay() { clearLater(); closeDeed(); S.on = null; S.use = 'safety'; S.sent = false; settleIn(); render(); later(() => { S.on = 'f5'; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const ids = R.facts.filter(f => viewFact(f, me).state !== 'hidden').map(f => f.id);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const i = ids.indexOf(S.on); S.on = ids[(i + (e.key === 'ArrowDown' ? 1 : -1) + ids.length) % ids.length]; S.sent = false; render(); }
  if (/^[1-6]$/.test(e.key)) { S.use = USE_IDS()[+e.key - 1]; S.sent = false; render(); }
  if (e.key === 'Enter' && S.on) send();
});
replay();
</script>
</body>
</html>
