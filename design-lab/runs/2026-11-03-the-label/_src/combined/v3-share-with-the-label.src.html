<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Combined V3 · Share with the reach and the label</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- Combined V3: sharing a labelled paper. The reach ruler on top, the slip of recipients with the label's verdict per line, the paper as each recipient gets it, and the letterbox only when it leaves the organisation ---- */
.stage{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4);transition:filter var(--motion-slow) var(--ease-standard),opacity var(--motion-slow) var(--ease-standard)}
.boxed .stage{filter:blur(calc(var(--space-2) * .75)) saturate(.5);opacity:.5}
.ruler{position:relative;height:calc(var(--space-7) + var(--space-2));margin:0 var(--space-5)}
.track{position:absolute;left:0;right:0;top:var(--space-5);height:var(--space-1);background:var(--hairline);border-radius:var(--radius-pill)}
.band{position:absolute;top:var(--space-5);height:var(--space-1);background:var(--fc);opacity:.55}
.mark{position:absolute;top:var(--space-3);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--x-proposed-type-micro);color:var(--ink-muted);white-space:nowrap}
.mark i{display:block;width:var(--space-3);height:var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);background:var(--slate-deep)}
.mark.on i{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit)}
.mark.part i{border-color:var(--x-proposed-stopped)}
.lim{position:absolute;top:var(--space-2);height:var(--space-6);border-left:1px dashed var(--x-proposed-stopped)}
.lim span{position:absolute;top:calc(var(--space-1) * -1);left:var(--space-1);font-size:var(--x-proposed-type-micro);color:var(--x-proposed-stopped);white-space:nowrap}
.body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);gap:var(--space-5);min-height:0}
.slip{display:flex;flex-direction:column;min-height:0;border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--surface-pane)}
.slip .hd{display:flex;justify-content:space-between;align-items:center;padding:var(--space-2) var(--space-4);border-bottom:var(--x-proposed-mark-rule-2)}
.line{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1.6fr);gap:var(--space-3);align-items:start;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta);text-align:left;width:100%}
.line.on{background:var(--x-proposed-lit-wash)}
.line b{font-weight:400;color:var(--light);display:block}
.line .n{font-family:var(--font-mono);color:var(--light)}
.line .v{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.line .v b{display:inline;color:var(--ink)}
.add{display:flex;gap:var(--space-2);flex-wrap:wrap;padding:var(--space-3) var(--space-4)}
.add button{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--target-sm);padding:0 var(--space-3);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink-muted);font-size:var(--type-small)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-top:var(--x-proposed-mark-rule-2)}
.copy{display:grid;gap:var(--space-2);align-content:start;font-size:var(--type-small);line-height:var(--leading-small)}
.copy p.pp{display:grid;grid-template-columns:calc(var(--space-7) - var(--space-3)) minmax(0,1fr);gap:var(--space-2);color:var(--ink)}
.copy p.pp.x span:last-child{text-decoration:line-through;text-decoration-color:var(--x-proposed-stopped);color:var(--ink-muted)}
/* letterbox for leaving the organisation */
.lb{position:fixed;inset:0;z-index:var(--layer-overlay);display:flex;flex-direction:column;pointer-events:none}
.lb .bar{flex:1;background:linear-gradient(var(--scrim),var(--scrim));transform:scaleY(0);transition:transform var(--motion-slow) var(--ease-out)}
.lb .bar.t{transform-origin:top}.lb .bar.b{transform-origin:bottom}
.boxed .lb .bar{transform:scaleY(1)}
.frame{width:100%;aspect-ratio:var(--letterbox-ratio);flex:none;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--space-6);padding:var(--space-5) var(--space-7);opacity:0;pointer-events:none;transition:opacity var(--motion-calm) var(--ease-out)}
.boxed .frame{opacity:1;pointer-events:auto}
.frame h2{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.frame .col{display:grid;gap:var(--space-2);align-content:start}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);padding:var(--space-1) var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);font-size:var(--type-small);margin:0 var(--space-1) var(--space-1) 0}
.chip.warn{border-color:var(--x-proposed-stopped)}
@media (prefers-reduced-motion: reduce){.boxed .stage{filter:none}.lb .bar{transform:none;opacity:0;transition:opacity var(--motion-base)}.boxed .lb .bar{opacity:1}}
@media (max-width:1400px){.line{padding:var(--space-2) var(--space-3)}.frame{padding:var(--space-3) var(--space-5)}.frame h2{font-size:var(--type-heading);line-height:var(--leading-heading)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Combined · V3</b> share with the reach and the label: the ruler shows how far each paragraph may go, each recipient line gets the label's verdict, the paper as they'd get it, and the letterbox only at the organisation's edge · reach ruler, handling slip, share receipt, PDR-009</div>
<script>
/*@DATA@*/
/*@LIB@*/
const B = DATA.briefing;
const S = { lines: ['t1'], on: 't1', fixed: {}, boxed: false };
const MAXP = F('org').people, pos = n => n == null ? 97 : (Math.log10(Math.max(1, n)) / Math.log10(MAXP) * 88).toFixed(2);
function lineVerdict(id) {
  const C = shareCheck(TG(id)), st = C.filter(c => c.v === 'stop'), ask = [...new Set(C.filter(c => c.v === 'ask').map(c => c.who))];
  if (S.fixed[id]) return { C, t: `Sends ${C.length - st.length} of ${C.length}`, s: `${st.map(c => '¶' + (B.paras.indexOf(c.p) + 1)).join(', ')} left out by you; the reason stays on the receipt.`, ok: !ask.length, ask };
  if (st.length) return { C, t: `${st.length} paragraph${st.length > 1 ? 's' : ''} can’t go`, s: st.map(c => `¶${B.paras.indexOf(c.p) + 1}: ${c.why}`).join(' '), ok: false, fix: true, ask };
  return { C, t: ask.length ? `Waits for ${P(ask[0]).name}` : 'All of it may go', s: '', ok: !ask.length, ask };
}
function render() {
  const t = TG(S.on), V = lineVerdict(S.on), lb = paperLabel(V.C);
  const lims = B.paras.map((p, i) => { const ord = [...DATA.targets].sort((a, b) => (a.people ?? 1e9) - (b.people ?? 1e9)); let last = null; for (const x of ord) { if (shareCheck(x)[i].v === 'stop') return { i, at: x, last }; last = x; } return null; }).filter(Boolean);
  const blocked = S.lines.some(id => lineVerdict(id).fix);
  $('#app').innerHTML = topHTML(['Artifacts', B.title, 'Share'], [['1–4', 'add a recipient'], ['F', 'take the fix'], ['Esc', 'step back'], ...STD_HINTS]) +
  `<main class="main"><div class="stage">
    <div class="ruler" aria-label="Reach">
      <span class="track"></span>${[['pil', 'team'], ['mops', 'department'], ['org', 'org']].map(([fl, tier], i, a) => `<span class="band" data-tier="${tier}" style="left:${i ? pos(F(a[i - 1][0]).people) : 0}%;width:calc(${pos(F(fl).people)}% - ${i ? pos(F(a[i - 1][0]).people) : 0}%)"></span>`).join('')}
      ${lims.map(l => `<span class="lim" style="left:calc((${pos(l.last ? l.last.people : 1)}% + ${pos(l.at.people)}%) / 2)"><span>¶${l.i + 1} stops</span></span>`).join('')}
      ${DATA.targets.map(x => `<span class="mark ${S.lines.includes(x.id) ? 'on' : ''} ${S.lines.includes(x.id) && lineVerdict(x.id).fix ? 'part' : ''}" style="left:${pos(x.people)}%"><i></i>${x.kind === 'outside' ? 'Outside' : tgName(x)} · ${x.people ? fmt(x.people) : '?'}</span>`).join('')}
    </div>
    <div class="body">
      <section class="slip"><div class="hd"><span class="eyebrow">Distribution · ${B.title}</span>${markHTML(paperLabel(shareCheck(TG('t1'))))}</div>
        ${S.lines.map(id => { const x = TG(id), v = lineVerdict(id); return `<button class="line ${S.on === id ? 'on' : ''}" data-l="${id}"><span><b>${tgName(x)}</b><span class="who">${x.via}</span></span><span class="n">${x.people ? fmt(x.people) : '?'}</span><span class="v"><b>${I(v.fix ? 'ban' : v.ok ? 'check' : 'hand', 12)} ${v.t}</b> ${v.s}${v.fix ? ` <span class="kbd">F</span> send it without ${v.C.filter(c => c.v === 'stop').length > 1 ? 'them' : 'it'}` : ''}</span></button>`; }).join('')}
        <div class="add">${DATA.targets.filter(x => !S.lines.includes(x.id)).map(x => `<button data-add="${x.id}">${I('plus', 12)} ${DATA.targets.indexOf(x) + 1} · ${tgName(x)}</button>`).join('')}</div>
        <div class="foot"><span class="who">Each line leaves its own receipt; readers of values inside are told upstream.</span><button class="btn ${blocked ? '' : 'go'}" ${blocked ? 'aria-disabled="true"' : ''}>${I('send', 14)} Send</button></div>
      </section>
      <aside class="copy"><p class="eyebrow">${tgName(t)} would get · ${markWord(lb)}</p>
        ${V.C.map(c => `<p class="pp ${c.v === 'stop' ? 'x' : ''}"><span>${pmHTML(paraLabel(c.p))}</span><span>${c.p.text}</span></p>`).join('')}
        <p class="who">${usesHTML(lb, { only: ['no', 'count'] })}</p></aside>
    </div>
  </div></main>
  <div class="lb" role="dialog" aria-modal="true" aria-label="Leaving the organisation" aria-hidden="${!S.boxed}"><div class="bar t"></div>
    <div class="frame">${(() => { const x = TG('t4'), C = shareCheck(x), ask = [...new Set(C.filter(c => c.v === 'ask').map(c => c.who))]; return `
      <div class="col"><p class="eyebrow">Leaving ${DATA.org}</p><h2>To ${tgName(x)}</h2>${C.map(c => `<p class="who">${pmHTML(paraLabel(c.p))} <span class="${c.v === 'stop' ? 'stopped' : ''}">${c.p.text}</span></p>`).join('')}</div>
      <div class="col"><p class="eyebrow">What it means</p><div><span class="chip warn">${I('globe', 12)} can’t be recalled</span><span class="chip">${I('users', 12)} reach unknown</span><span class="chip">${I('shield', 12)} marked ${MK(paperLabel(C).marking).word} in words</span></div>
        <p class="who">${C.filter(c => c.v === 'stop').length} paragraphs stay behind by their labels. ${ask.map(p => `${P(p).name} must agree`).join('; ')}; a lawful basis is recorded on the receipt.</p>
        <div style="display:flex;gap:var(--space-2)"><button class="btn go">${I('hand', 14)} Ask ${first(P(ask[0]).name)}</button><button class="btn" data-back>Step back</button></div></div>`; })()}</div>
    <div class="bar b"></div></div>`;
  afterRender();
  document.body.classList.toggle('boxed', S.boxed);
  $$('[data-l]').forEach(b => b.onclick = () => { S.on = b.dataset.l; render(); });
  $$('[data-add]').forEach(b => b.onclick = () => add(b.dataset.add));
  $('[data-back]').onclick = () => { S.boxed = false; S.lines = S.lines.filter(x => x !== 't4'); S.on = S.lines[S.lines.length - 1]; render(); };
}
function add(id) { if (!S.lines.includes(id)) S.lines.push(id); S.on = id; S.boxed = TG(id).kind === 'outside'; render(); }
function replay() { clearLater(); closeDeed(); Object.assign(S, { lines: ['t1'], on: 't1', fixed: {}, boxed: false }); settleIn(); render(); later(() => add('t3'), MOMENT()); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.boxed) { $('[data-back]').click(); return; }
  if (commonKeys(e, render, replay)) return;
  if (/^[1-4]$/.test(e.key)) add(DATA.targets[+e.key - 1].id);
  if (e.key.toLowerCase() === 'f' && lineVerdict(S.on).fix) { S.fixed[S.on] = true; render(); }
});
replay();
</script>
</body>
</html>
