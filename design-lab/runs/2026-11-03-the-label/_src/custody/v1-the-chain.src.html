<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Custody V1 · The chain</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: custody as a chain of links, one per hand. A break is drawn broken and stays; the mend is a seam; looks are a thin counted link ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-5)}
.chain{display:flex;flex-wrap:wrap;row-gap:var(--space-4);align-items:stretch;gap:0;padding:var(--space-3) 0 var(--space-4)}
.lk{position:relative;flex:none;display:grid;gap:var(--space-1);align-content:start;width:calc(var(--measure-rail) - var(--space-6));padding:var(--space-3);border:2px solid var(--hairline-strong);border-radius:var(--radius-card);background:var(--surface-pane);text-align:left;font-size:var(--type-small);line-height:var(--leading-small);transition:border-color var(--motion-base) var(--ease-standard),opacity var(--motion-base) var(--ease-standard)}
.lk::after{content:"";position:absolute;bottom:calc(var(--space-1) * -1 - 2px);left:var(--space-3);right:var(--space-3);height:2px;background:var(--fc, var(--hairline))}
.lk .h{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.lk .a{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.lk.on{border-color:var(--x-proposed-lit)}
.lk.reads{width:calc(var(--space-8) + var(--space-3));border-width:1px;border-style:dotted;background:none;color:var(--ink-muted)}
.lk.said{border-color:var(--x-proposed-said-other)}
/* the join between links: solid when the hand-over is recorded, broken when it isn't */
.jn{flex:none;align-self:center;width:var(--space-6);height:var(--space-4);border:2px solid var(--hairline-strong);border-left:0;border-right:0;border-radius:var(--radius-pill);margin:0 calc(var(--space-2) * -1);position:relative;z-index:1}
.jn.brk{border-style:dashed;border-color:var(--x-proposed-disagree)}
.jn.rep{border-color:var(--x-proposed-seam)}
.jn svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--slate-deep);border-radius:var(--radius-pill)}
.pre-chain .lk,.pre-chain .jn{opacity:0}
.lk,.jn{transition:opacity var(--motion-base) var(--ease-out);transition-delay:calc(var(--i) * var(--motion-quick))}
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--space-6);align-content:start}
.detail .card{display:grid;gap:var(--space-2);padding:var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);font-size:var(--type-meta);line-height:var(--leading-meta)}
.detail .card h2{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.note{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--type-small);line-height:var(--leading-small)}
.note.brk{color:var(--x-proposed-disagree)}
.note.rep{color:var(--x-proposed-seam)}
.rules{display:grid;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rules p{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2)}
@media (prefers-reduced-motion: reduce){.lk,.jn{transition-delay:0ms}}
</style>
</head>
<body class="pre pre-chain">
<div class="app" id="app"></div>
<div class="x-cap"><b>Custody · V1</b> the chain: one link per hand, joined where the hand-over is recorded; a break stays broken, the mend is a seam, looks are counted · evidence chain of custody, visible repair</div>
<script>
/*@DATA@*/
/*@LIB@*/
const f = FACT('f5'), K = DATA.custody;
const S = { on: 'k2' };
function render() {
  const k = K.find(x => x.id === S.on);
  $('#app').innerHTML = topHTML(['Data Atlas', DATA.record.title, f.k, 'Custody'], [['← →', 'a link'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5)"><div><p class="eyebrow">${DATA.record.title} · ${f.k} · ${f.v} ${pmHTML(f.label)}</p><h1 class="title">The chain</h1></div>
      <p class="sub">Read left to right: every hand this value has passed through. A join is solid when AUGUR recorded the hand-over, broken when it didn’t. The break stays on the chain after it is mended.</p></div>
    <div class="chain" role="list">${K.map((x, i) => `${i ? `<span class="jn ${x.gap ? 'brk' : K[i - 1].gap && x.repair ? 'rep' : ''}" style="--i:${i}" aria-hidden="true">${x.gap ? I('unlink', 14) : K[i - 1].gap && x.repair ? I('link', 14) : ''}</span>` : ''}
      <button class="lk ${x.act === 'read' ? 'reads' : ''} ${x.said ? 'said' : ''} ${S.on === x.id ? 'on' : ''}" style="--i:${i}" data-tier="${tierOf(x.floor || x.readFloor)}" data-k="${x.id}" role="listitem">
        <span class="a">${x.on}${x.at ? ' · ' + x.at : ''}</span>
        ${x.act === 'read' ? `<span>${I('eye', 12)} read ${x.reads} times · you ${x.mine}</span>` : `<span class="h">${I(handIcon(x.hand), 14)} ${handName(x.hand)}</span><span>${actWord(x)}${x.to ? ` to ${toName(x)}` : ''}</span>`}
      </button>`).join('')}</div>
    <div class="detail">
      <div class="card dep"><p class="eyebrow">${k.on}${k.at ? ' · ' + k.at : ''} · ${F(k.floor || k.readFloor).name}</p>
        <h2>${k.act === 'read' ? `Read ${k.reads} times` : `${handName(k.hand)} ${k.act} ${k.what || ''}`}</h2>
        ${k.where ? `<p>${I('map-pin', 12)} ${k.where}</p>` : ''}${k.to ? `<p>${I('send', 12)} to <b class="lite" style="font-weight:400">${toName(k)}</b>, for ${US(k.purpose).long.toLowerCase()}${k.until ? `, until ${k.until}` : ''} · receipt ${k.receipt}</p>` : ''}
        ${k.label ? `<p>${I('tag', 12)} Labelled ${markHTML(k.label)}</p>` : ''}${k.said ? `<p>${I('corner-down-right', 12)} <span class="said">${k.said}</span></p>` : ''}
        ${k.act === 'read' ? `<p class="who">Who read it isn’t shown: reads by others are counted only when there are ${POL.minGroup} or more. Your own reads are exact: ${k.mine}.</p>` : ''}
        ${k.gap ? `<p class="note brk">${I('unlink', 14)} ${k.gap}</p>` : ''}${k.repair ? `<p class="note rep">${I('link', 14)} ${k.repair}</p>` : ''}
        <p class="tk">${k.tech}</p></div>
      <div class="rules"><p class="eyebrow" style="display:block">What the chain keeps</p>
        <p>${I('user-round', 14)}<span>Acts are named: who held, changed, quoted or shared it, and when.</span></p>
        <p>${I('eye', 14)}<span>Looks are counted: reads by others only as a number, never below ${POL.minGroup}. Yours are exact.</span></p>
        <p>${I('unlink', 14)}<span>A hand-over AUGUR didn’t see is a broken join, never a smooth one. Mending it adds a seam; it doesn’t erase the break.</span></p>
        <p>${I('corner-down-right', 14)}<span>Where the value was said another way, the link says how.</span></p></div>
    </div>
  </div></main>`;
  afterRender();
  $$('.lk').forEach(b => b.onclick = () => { S.on = b.dataset.k; render(); document.body.classList.remove('pre-chain'); });
}
function replay() { clearLater(); closeDeed(); S.on = 'k9'; document.body.classList.add('pre-chain'); settleIn(); render(); later(() => document.body.classList.remove('pre-chain'), MOMENT() * .4); later(() => { S.on = 'k2'; render(); }, MOMENT() + ms('--motion-run')); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const i = K.findIndex(x => x.id === S.on); S.on = K[(i + (e.key === 'ArrowRight' ? 1 : -1) + K.length) % K.length].id; render(); }
});
replay();
</script>
</body>
</html>
