<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Custody V2 · Hands as lanes</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: one lane per hand, time along the bottom. The value's line steps from lane to lane; where it is said another way the line changes ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4)}
.fig{min-height:0;position:relative}
svg.ln{width:100%;height:100%;overflow:visible}
.ln .lane{fill:var(--surface-inset)}
.ln .lane.alt{fill:none}
.ln .nm{fill:var(--ink);font-family:var(--font-sans);font-size:var(--type-small)}
.ln .fl{font-family:var(--font-mono);font-size:var(--x-proposed-type-micro);letter-spacing:var(--tracking-caps)}
.ln .tick{stroke:var(--hairline);stroke-width:1}
.ln .tl{fill:var(--ink-muted);font-family:var(--font-mono);font-size:var(--x-proposed-type-micro)}
.ln .path{fill:none;stroke:var(--light);stroke-width:2;stroke-linejoin:round;transition:stroke-dashoffset var(--motion-run) var(--ease-out)}
.ln .path.said{stroke:var(--x-proposed-said-other);stroke-width:3}
.ln .path.brk{stroke:var(--x-proposed-disagree);stroke-dasharray:4 4}
.ln .dot{fill:var(--slate-deep);stroke:var(--light);stroke-width:1.5}
.ln .dot.on{fill:var(--x-proposed-lit);stroke:var(--x-proposed-lit)}
.ln .act{fill:var(--ink-muted);font-family:var(--font-sans);font-size:var(--x-proposed-type-micro)}
.ln .reads{fill:var(--ink-muted);opacity:.5}
.pre-draw .ln .path{stroke-dasharray:3000;stroke-dashoffset:3000}
.pre-draw .ln .path.brk{stroke-dasharray:3000}
.ln .now{stroke:var(--x-proposed-lit);stroke-width:1}
@media (prefers-reduced-motion: reduce){.pre-draw .ln .path{stroke-dasharray:none;stroke-dashoffset:0;opacity:0}}
</style>
</head>
<body class="pre pre-draw">
<div class="app" id="app"></div>
<div class="x-cap"><b>Custody · V2</b> hands as lanes: one lane per hand, time along the bottom; the value's line steps between lanes and changes where it is said another way · Marey's train graph, swimlanes, metro maps</div>
<script>
/*@DATA@*/
/*@LIB@*/
const K = DATA.custody, f = FACT('f5');
/* lanes, in the order the value first reached them; computed from custody */
function lanes() {
  const L2 = [];
  K.forEach(k => { if (k.hand && !L2.includes(k.hand)) L2.push(k.hand); const tk = DATA.people[k.to] ? k.to : '@' + k.to; if (k.to && !L2.includes(tk)) L2.push(tk); });
  return L2;
}
const DAY = s => { const m = s.match(/(\d+)(?:–\d+)? (Oct|Nov)/); return m ? (m[2] === 'Oct' ? +m[1] : 31 + +m[1]) : 0; };
function render() {
  const W = Math.max(900, innerWidth - 48), H = Math.max(380, innerHeight - 230), LN = lanes();
  const left = 190, right = 40, top = 10, lh = (H - top - 40) / LN.length;
  const d0 = 12, d1 = 35, X = d => left + (d - d0) / (d1 - d0) * (W - left - right), Y = i => top + i * lh + lh / 2;
  const laneOf = h => LN.indexOf(h);
  let svg = LN.map((h, i) => { const nm = h[0] === '@' ? (DATA.people[h.slice(1)] ? P(h.slice(1)).name : DATA.groups[h.slice(1)].name) : handName(h);
    const fl = h[0] === '@' ? (DATA.people[h.slice(1)] ? P(h.slice(1)).floor : DATA.groups[h.slice(1)].floor) : DATA.people[h] ? P(h).floor : 'pil';
    return `<rect class="lane ${i % 2 ? 'alt' : ''}" x="0" y="${top + i * lh}" width="${W}" height="${lh}"/><text class="nm" x="8" y="${Y(i) - 2}">${nm}</text><text class="fl" x="8" y="${Y(i) + 13}" style="fill:var(--floor-${tierOf(fl) === 'org' ? 'org' : tierOf(fl) === 'department' ? 'department' : 'team'}-high)">${F(fl).word}</text>`; }).join('');
  for (let d = d0; d <= d1; d += 2) svg += `<line class="tick" x1="${X(d)}" x2="${X(d)}" y1="${top}" y2="${H - 30}"/><text class="tl" x="${X(d) - 8}" y="${H - 14}">${d <= 31 ? d + ' Oct' : (d - 31) + ' Nov'}</text>`;
  /* the value's path: from each act's hand to the next act's hand */
  const acts = K.filter(k => k.hand);
  let pts = [], segs = [];
  acts.forEach((k, i) => {
    const x = X(DAY(k.on) + (k.at ? +k.at.slice(0, 2) / 24 : 0)), y = Y(laneOf(k.hand));
    if (i) { const p = pts[pts.length - 1]; segs.push({ d: `M${p.x},${p.y} L${x},${p.y} L${x},${y}`, cls: k.gap ? 'brk' : acts[i - 1].said || k.act === 'quoted' || k.act === 'shared' && k.to === 'sc' ? 'said' : '' }); }
    pts.push({ x, y, k });
    if (k.to) { const ty = Y(laneOf(DATA.people[k.to] ? k.to : '@' + k.to)); segs.push({ d: `M${x},${y} L${x},${ty} L${X(d1)},${ty}`, cls: k.to === 'sc' ? 'said' : '' }); }
  });
  svg += segs.map(s => `<path class="path ${s.cls}" d="${s.d}"/>`).join('');
  svg += pts.map(p => `<circle class="dot ${p.k.gap || p.k.repair ? 'on' : ''}" cx="${p.x}" cy="${p.y}" r="5"/><text class="act" x="${p.k.act === 'wrote' ? p.x - 8 : p.x + 8}" text-anchor="${p.k.act === 'wrote' ? 'end' : 'start'}" y="${p.y + (pts.indexOf(p) % 2 ? 18 : -8)}">${p.k.act}${p.k.said ? ' · as a count' : ''}</text>`).join('');
  const rd = K.find(k => k.act === 'read');
  svg += `<rect class="reads" x="${X(21)}" y="${Y(laneOf('p2')) + 14}" width="${X(31) - X(21)}" height="6" rx="3"/><text class="act" x="${X(21)}" y="${Y(laneOf('p2')) + 34}">read ${rd.reads} times in ${F(rd.readFloor).name} (you ${rd.mine})</text>`;
  svg += `<line class="now" x1="${X(34.4)}" x2="${X(34.4)}" y1="${top}" y2="${H - 30}"/>`;
  $('#app').innerHTML = topHTML(['Data Atlas', DATA.record.title, f.k, 'Custody'], [...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5)"><div><p class="eyebrow">${f.k} · ${f.v} ${pmHTML(f.label)}</p><h1 class="title">Hands</h1></div>
      <p class="sub">Each lane is a hand. The line is the value: it steps down a lane when it changes hands. Dashed where the hand-over wasn’t recorded; thicker and blue once it travels as a count, none named.</p></div>
    <div class="fig"><svg class="ln" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet" role="img" aria-label="Custody lanes">${svg}</svg></div>
  </div></main>`;
  afterRender();
}
function replay() { clearLater(); closeDeed(); document.body.classList.add('pre-draw'); settleIn(); render(); later(() => document.body.classList.remove('pre-draw'), MOMENT()); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; });
addEventListener('resize', () => render());
replay();
</script>
</body>
</html>
