<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Custody V6 · Seals</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: custody as seals. Each hop says what it held and checks it against the hop before; correct the source, and every seal downstream re-checks and says what moved ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:var(--space-6)}
.hops{display:grid;gap:0;align-content:start}
.hop{display:grid;grid-template-columns:var(--space-6) minmax(0,1fr) minmax(0,.8fr);gap:var(--space-3);align-items:start;padding:var(--space-3) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.seal{display:inline-flex;align-items:center;justify-content:center;width:calc(var(--space-6) - var(--space-2));height:calc(var(--space-6) - var(--space-2));border-radius:var(--radius-pill);border:2px solid var(--x-proposed-lit);color:var(--x-proposed-lit);transition:border-color var(--motion-calm) var(--ease-out),color var(--motion-calm) var(--ease-out)}
.seal.re{border-color:var(--x-proposed-seam);color:var(--x-proposed-seam)}
.seal.brk{border-style:dashed;border-color:var(--x-proposed-disagree);color:var(--x-proposed-disagree)}
.hop b{font-weight:400;color:var(--light)}
.hop .v{font:400 var(--type-meta)/var(--leading-meta) var(--font-mono);color:var(--light)}
.hop .v .was{color:var(--ink-muted);text-decoration:line-through;margin-right:var(--space-2)}
.hop .s{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.hop .s.re{color:var(--x-proposed-seam)}
.side{display:grid;gap:var(--space-4);align-content:start}
.fix{display:grid;gap:var(--space-2);padding:var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);font-size:var(--type-meta);line-height:var(--leading-meta)}
.fix b{font-weight:400;color:var(--light)}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Custody · V6</b> seals: each hop checks what it holds against the hop before; correct the source and every seal downstream re-checks and says what moved, and what didn't · tamper-evident seals, assay marks, visible repair</div>
<script>
/*@DATA@*/
/*@LIB@*/
/* the value at each hop is worked out from the roster start time; a correction changes the start and everything re-derives */
const S = { corrected: false };
const BOARD = { h: 4, m: 52 };
function hours(start) { let mins = (24 * 60 - (start.h * 60 + start.m)) + BOARD.h * 60 + BOARD.m; return mins; }
const fmtH = mins => `${Math.floor(mins / 60)} h ${String(mins % 60).padStart(2, '0')} min`;
function hops() {
  const was = hours({ h: 15, m: 12 }), now = S.corrected ? hours({ h: 16, m: 12 }) : was;
  const over = a => a.rows.filter(r => (r.vessel === 'Marlow Star' ? now / 60 : r.hours) > 12).length;
  const A = DATA.answer, n = over(A);
  return [
    { k: 'k1', who: 'Duty roster', what: `on duty from ${S.corrected ? '16:12' : '15:12'} on 11 Oct`, v: S.corrected ? '16:12' : '15:12', was: S.corrected ? '15:12' : null, seal: S.corrected ? 're' : 'ok', s: S.corrected ? `Corrected by ${P('p2').name} on ${DATA.today}: the 15:12 act was cancelled.` : 'Source row 88412.' },
    { k: 'k2', who: P('p2').name, what: `report §3`, v: fmtH(was), was: null, seal: S.corrected ? 'brk' : 'ok', s: S.corrected ? `Typed by hand, so it can’t re-derive. Its seal is broken and it says so: “the roster now says ${fmtH(now)}”.` : 'Typed from the paper roster; matched later by Data Atlas.' },
    { k: 'k3', who: 'Data Atlas', what: 'fact: time on duty', v: fmtH(now), was: S.corrected ? fmtH(was) : null, seal: S.corrected ? 're' : 'ok', s: S.corrected ? 'Re-derived from the roster. A seam records the change.' : 'Derived from roster row 88412.' },
    { k: 'k7', who: `Answer ${A.id}`, what: 'groundings over 12 hours', v: `${n} of ${A.of}`, was: null, seal: S.corrected ? 're' : 'ok', s: S.corrected ? `Re-checked: ${fmtH(now)} is still over 12 hours, so the count holds at ${n}.` : `Counted over ${A.of} groundings.` },
    { k: 'k8', who: DATA.briefing.title, what: '¶3', v: `${n} of ${A.of}`, was: null, seal: S.corrected ? 're' : 'ok', s: S.corrected ? 'Nothing it says has moved. The seal is re-made, with no seam.' : 'Quotes the answer.' },
    { k: 'k9', who: DATA.groups.sc.name, what: 'their copy', v: `${n} of ${A.of}`, was: null, seal: 'ok', s: S.corrected ? 'Not told: nothing they read has changed.' : 'Shared 3 Nov.' }
  ];
}
function render() {
  const H = hops();
  $('#app').innerHTML = topHTML(['Data Atlas', DATA.record.title, FACT('f5').k, 'Seals'], [['C', 'correct the roster'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <section style="display:flex;flex-direction:column;gap:var(--space-4);min-height:0"><div><p class="eyebrow">${FACT('f5').k} ${pmHTML('lbHours')} · from source to the last copy</p><h1 class="title">Seals</h1></div>
      <div class="hops">${H.map((h, i) => `<div class="hop dep" style="--i:${i}"><span class="seal ${h.seal === 're' ? 're' : h.seal === 'brk' ? 'brk' : ''}" title="${h.seal}">${I(h.seal === 'brk' ? 'unlink' : h.seal === 're' ? 'rotate-ccw' : 'stamp', 16)}</span><span><b>${h.who}</b> · ${h.what}<span class="s ${h.seal !== 'ok' ? 're' : ''}">${h.s}</span></span><span class="v">${h.was ? `<span class="was">${h.was}</span>` : ''}${h.v}</span></div>`).join('')}</div></section>
    <aside class="side"><p class="eyebrow">What a seal is</p>
      <p class="sub">Each hop keeps what it was given and how it was made from the hop before. When anything upstream changes, AUGUR re-makes each seal in turn. A hop that can re-derive does, with a seam. A hop someone typed can’t, so its seal breaks and says what the source now says.</p>
      <div class="fix"><b>${S.corrected ? 'The roster was corrected' : 'Try a correction'}</b><span>${S.corrected ? `The pilot’s start moved by an hour. The hours changed in two places, the count didn’t move, and the committee wasn’t disturbed.` : 'Press C: the pilot’s start time on the roster moves from 15:12 to 16:12.'}</span><button class="btn sm" data-c>${I('pencil', 12)} ${S.corrected ? 'Undo the correction' : 'Correct the roster'} <span class="kbd">C</span></button></div>
      <p class="who">${I('info', 12)} Only what changed tells anyone. A re-check that moves nothing stays quiet: calm when normal.</p>
    </aside>
  </div></main>`;
  afterRender();
  $('[data-c]').onclick = () => { S.corrected = !S.corrected; render(); };
}
function replay() { clearLater(); closeDeed(); S.corrected = false; settleIn(); render(); later(() => { S.corrected = true; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'c') { S.corrected = !S.corrected; render(); }
});
replay();
</script>
</body>
</html>
