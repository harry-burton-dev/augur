<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Grammar V5 · Evidence tag</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: the label as a tag tied to the value. Front: what it is and how to handle it. Back: every hand, signed ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,34%);gap:var(--space-6);align-items:center}
.stage{display:flex;justify-content:center;align-items:center;perspective:calc(var(--space-8) * 12);min-height:0}
.tag{position:relative;width:calc(var(--measure-card) + var(--space-6));height:min(calc(100vh - var(--space-8) - var(--space-6)),calc(var(--measure-glance) + var(--space-7)));transform-style:preserve-3d;transition:transform var(--motion-calm) var(--ease-out)}
.tag.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-6) var(--space-5) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset) var(--radius-inset) var(--radius-key) var(--radius-key);background:linear-gradient(var(--surface-raised),var(--surface-pane));box-shadow:var(--shadow-raised);overflow:hidden}
.face.back{transform:rotateY(180deg)}
.tag.flip .face.front,.tag:not(.flip) .face.back{pointer-events:none}
/* the eyelet and the string */
.face::before{content:"";position:absolute;top:var(--space-3);left:50%;width:var(--space-4);height:var(--space-4);margin-left:calc(var(--space-2) * -1);border-radius:var(--radius-pill);border:2px solid var(--hairline-strong);background:var(--slate-deep)}
.face .mk.big{align-self:center}
.face h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);text-align:center}
.face .v{font-weight:200;font-size:var(--type-title);line-height:var(--leading-title);text-align:center;color:var(--light)}
.field{display:grid;grid-template-columns:calc(var(--space-7) + var(--space-3)) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);border-top:1px dashed var(--hairline);padding-top:var(--space-2)}
.field .h{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.seal{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted)}
/* continuity: one signed line per hand-over */
.cont{display:grid;gap:0;font-size:var(--type-small);line-height:var(--leading-small);overflow:auto}
.cont .ln{display:grid;grid-template-columns:calc(var(--space-7) - var(--space-2)) minmax(0,1fr);gap:var(--space-2);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline)}
.cont .t{font-family:var(--font-mono);color:var(--ink-muted)}
.cont .sig{font-style:italic;color:var(--light)}
.cont .brk{color:var(--x-proposed-disagree)}
.cont .rep{color:var(--x-proposed-seam)}
.cont .reads{color:var(--ink-muted)}
.side{display:grid;gap:var(--space-4);align-content:center}
.side ol{margin:0;padding-left:var(--space-5);display:grid;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
@media (prefers-reduced-motion: reduce){.tag{transition:none}.tag.flip{transform:none}.face{transition:opacity var(--motion-base) var(--ease-standard)}.face.back{transform:none;opacity:0}.tag.flip .face.back{opacity:1}.tag.flip .face.front{opacity:0}}
@media (max-width:1400px){.face{padding:var(--space-6) var(--space-4) var(--space-3);gap:var(--space-2)}.face .v{font-size:var(--type-title-s);line-height:var(--leading-title-s)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V5</b> the tag: handling on the front, every hand signed on the back, a break shown and mended · evidence continuity labels, chain of custody</div>
<script>
/*@DATA@*/
/*@LIB@*/
const f = FACT('f5'), lb = L(f.label);
const S = { flip: false };
function render() {
  $('#app').innerHTML = topHTML(['Label sheet', 'The tag'], [['F', 'turn the tag'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <div class="stage"><div class="tag ${S.flip ? 'flip' : ''}" id="tag">
      <section class="face front" aria-hidden="${S.flip}">
        ${whyBtn(f.label, markHTML(lb, 'big'))}
        <h2>${DATA.record.title}<br><span class="muted">${f.k}</span></h2>
        <p class="v">${f.v}</p>
        <div class="field"><span class="h">Use for</span><span>${usesHTML(lb, { only: ['yes', 'count'] })}</span></div>
        <div class="field"><span class="h">Not for</span><span>${usesHTML(lb, { only: ['no'] })}</span></div>
        <div class="field"><span class="h">Caveat</span><span>${tpl(lb.caveat.plain)}</span></div>
        <div class="field"><span class="h">Keep</span><span>${keepWord(lb)}</span></div>
        <div class="seal"><span>${I('stamp', 14)} ${DATA.record.id}/${f.id}</span><span>${POL.name.split(' ')[0]} ${POL.version.split(' ')[0]}</span></div>
      </section>
      <section class="face back" aria-hidden="${!S.flip}">
        <p class="eyebrow" style="text-align:center">Continuity · every hand signs</p>
        <div class="cont scroll">${DATA.custody.map(k => k.act === 'read'
          ? `<div class="ln reads"><span class="t">${k.on}</span><span>Read ${k.reads} times in ${F(k.readFloor).name}. You: ${k.mine}. <span class="tk">${k.tech}</span></span></div>`
          : `<div class="ln"><span class="t">${k.on}<br>${k.at || ''}</span><span>${k.act[0].toUpperCase() + k.act.slice(1)} ${k.what}${k.to ? ` to ${DATA.people[k.to] ? P(k.to).name : DATA.groups[k.to].name}, for ${US(k.purpose).word.toLowerCase()}` : ''}${k.where ? `, in ${k.where}` : ''}. <span class="sig">${handName(k.hand)}</span>
              ${k.gap ? `<br><span class="brk">${I('unlink', 12)} ${k.gap}</span>` : ''}${k.repair ? `<br><span class="rep">${I('link', 12)} ${k.repair}</span>` : ''}<span class="tk">${k.tech}</span></span></div>`).join('')}</div>
      </section>
    </div></div>
    <aside class="side"><p class="eyebrow">The label · grammar</p><h1 class="title">The tag</h1>
      <p class="sub">An evidence tag goes where the item goes. The front says how to handle it, and the back lists every hand-over, signed. Here, a hand is a person, an app or a feed, and AUGUR does the signing. A break in the chain stays on the tag even after it is mended.</p>
      <ol><li>The front stays short enough to read across a room.</li><li>The back shows names for what people did (held, changed, shared). Reads are counted, never named, except your own.</li><li>When the value is quoted, the copy gets a new tag. Its first line points back to this one.</li></ol>
    </aside>
  </div></main>`;
  afterRender();
}
function flip(v) { S.flip = v ?? !S.flip; $('#tag').classList.toggle('flip', S.flip); $('.front').setAttribute('aria-hidden', S.flip); $('.back').setAttribute('aria-hidden', !S.flip); }
function replay() { clearLater(); closeDeed(); S.flip = false; settleIn(); render(); later(() => flip(true), MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'f') flip();
});
replay();
</script>
</body>
</html>
