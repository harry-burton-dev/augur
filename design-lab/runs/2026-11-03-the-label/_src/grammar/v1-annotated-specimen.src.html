<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Grammar V1 · Annotated specimen</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V1: one labelled value, its six parts numbered, the deed one click away ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(360px,34%) minmax(0,1fr);gap:var(--space-6)}
.parts{display:flex;flex-direction:column;gap:var(--space-3);min-height:0}
.parts ol{list-style:none;margin:var(--space-2) 0 0;padding:0;display:grid;gap:var(--space-1)}
.part{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-1) var(--space-3);width:100%;padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);border:1px solid transparent}
.part:hover,.part.on{background:var(--surface-raised);border-color:var(--hairline)}
.part .n{grid-row:span 2;display:inline-flex;align-items:center;justify-content:center;width:var(--space-5);height:var(--space-5);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink)}
.part.on .n{border-color:var(--x-proposed-lit);color:var(--light)}
.part b{font-weight:400;color:var(--light)}
.part .q{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.spec{position:relative;width:min(100%,var(--measure-wide));display:grid;gap:var(--space-4);padding:0 0 var(--space-3);background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);box-shadow:var(--shadow-raised)}
.spec .body{padding:0 var(--space-5);display:grid;gap:var(--space-4)}
.spec .v{font-weight:200;font-size:var(--type-display);line-height:var(--leading-display);color:var(--light);letter-spacing:var(--tracking-tight)}
.spec .k{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.spec .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3) var(--space-5)}
.cell{position:relative;display:grid;gap:var(--space-1);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);border:1px solid transparent;transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard)}
.cell .h{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.cell .t{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.cell.on{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.pin{position:absolute;top:calc(var(--space-2) * -1);right:calc(var(--space-2) * -1);display:inline-flex;align-items:center;justify-content:center;width:var(--space-5);height:var(--space-5);border-radius:var(--radius-pill);background:var(--slate-deep);border:1px solid var(--x-proposed-lit);font:400 var(--type-small)/1 var(--font-mono);color:var(--light)}
.chain{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.chain .lk{display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);white-space:nowrap}
.chain .gap{border-style:dashed;color:var(--ink-muted)}
.rule{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
@media (max-width:1400px){.spec .v{font-size:var(--type-title);line-height:var(--leading-title)}.spec .body{gap:var(--space-3)}.part .q{display:none}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V1</b> annotated specimen: six parts in a fixed order, banner at head and foot · UK GSC marking, CC deed, chain of custody</div>
<script>
/*@DATA@*/
/*@LIB@*/
const f = FACT('f5'), lb = L(f.label), doc = DATA.doc;
const S = { on: 0 };
const PARTS = () => [
  { id: 'mark',   icon: 'shield',            w: 'Marking',      q: 'How careful must I be?', t: markWord(lb) },
  { id: 'use',    icon: 'circle-check',      w: 'Permitted use',q: 'What may I do with it?', t: 'Uses, each may, may not, ask first or as a count only' },
  { id: 'origin', icon: 'file-text',         w: 'Origin',       q: 'Where did it come from?', t: `${doc.title} ${f.src}` },
  { id: 'keep',   icon: 'hourglass',         w: 'Keep until',   q: 'How long is it kept?', t: keepWord(lb) },
  { id: 'caveat', icon: 'corner-down-right', w: 'Caveat',       q: 'What happens when it travels?', t: tpl(lb.caveat.plain) },
  { id: 'custody',icon: 'link',              w: 'Custody',      q: 'Who has held it?', t: `${DATA.custody.filter(k => k.hand).length} hands since ${DATA.custody[0].on}` }
];
function render() {
  const parts = PARTS(), on = parts[S.on - 1]?.id;
  const hands = DATA.custody.filter(k => k.hand).filter((k, i, a) => !i || a[i - 1].hand !== k.hand).slice(0, 6);
  const cell = (id, n, h, body) => `<div class="cell dep ${on === id ? 'on' : ''}" style="--i:${n}" data-cell="${id}">${S.pins ? `<span class="pin">${n}</span>` : ''}<span class="h">${h}</span><div class="t">${body}</div></div>`;
  $('#app').innerHTML = topHTML(['Label sheet', 'Annotated specimen'], [['1–6', 'a part'], ['Click', 'the deed'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <section class="parts"><p class="eyebrow">The label · grammar</p><h1 class="title">Six parts</h1>
      <p class="sub">Always in this order, always the same words. Each part reads in a second; its deed (plain words, the rule, who can change it) is one click away. The words come from the deployment’s policy, not from AUGUR: press <span class="kbd">S</span> to see another one.</p>
      <ol>${parts.map((p, i) => `<li><button class="part ${S.on === i + 1 ? 'on' : ''}" data-n="${i + 1}"><span class="n">${i + 1}</span><span>${I(p.icon, 14)} <b>${p.w}</b> · <span class="q">${p.q}</span></span><span class="q">${p.t}</span></button></li>`).join('')}</ol>
      <p class="rule">${tpl(POL.rules[0])}</p>
    </section>
    <section class="stage"><article class="spec">
      <div class="banner dep" data-rank="${MK(lb.marking).rank}">${markWord(lb)}</div>
      <div class="body">
        <div class="dep" style="--i:1"><p class="k">${DATA.record.title} · ${f.k} ${pmHTML(lb)}</p><p class="v">${f.v}</p>
          <p class="who">About <b>${P(f.about).name}</b> · kept by ${F(f.keptOn).name} · <span class="tk">fact ${f.id} · ${DATA.record.id}</span></p></div>
        <div class="grid">
          ${cell('mark', 1, 'Marking', whyBtn(f.label, markHTML(lb)) + `<span class="who" style="display:block">${MK(lb.marking).handle}</span>`)}
          ${cell('use', 2, 'Permitted use', usesHTML(lb, { verdict: false }))}
          ${cell('origin', 3, 'Origin', `${I('file-text', 12)} <b class="lite" style="font-weight:400">${doc.title}</b> ${f.src} · ${P(doc.by).name}, ${doc.on}`)}
          ${cell('keep', 4, 'Keep until', `${I('hourglass', 12)} ${keepWord(lb)} <span class="muted">(${lb.keepDate})</span>`)}
          ${cell('caveat', 5, 'Caveat', tpl(lb.caveat.plain))}
          ${cell('custody', 6, 'Custody', `<span class="chain">${hands.map((k, i) => `${i ? I('arrow-right', 12) : ''}<span class="lk ${k.gap ? 'gap' : ''}" title="${k.act} ${k.on}">${k.hand && DATA.people[k.hand] ? first(P(k.hand).name) : DATA.hands[k.hand].name}</span>`).join('')}</span>`)}
        </div>
      </div>
      <div class="banner dep" data-rank="${MK(lb.marking).rank}" style="--i:7">${markWord(lb)} <span class="r">· the strictest part sets the banner, at the head and the foot</span></div>
    </article></section>
  </div></main>`;
  afterRender();
  $$('.part').forEach(b => { b.onclick = () => { S.on = S.on === +b.dataset.n ? 0 : +b.dataset.n; render(); }; b.onmouseenter = () => { S.on = +b.dataset.n; $$('.cell').forEach(c => c.classList.toggle('on', c.dataset.cell === PARTS()[S.on - 1].id)); $$('.part').forEach(p => p.classList.toggle('on', p === b)); }; });
}
function replay() {
  clearLater(); closeDeed(); S.on = 0; S.pins = false; settleIn(); render();
  const t = MOMENT();
  later(() => { S.pins = true; render(); }, t);
  later(() => { S.on = 1; render(); openDeed($('[data-cell="mark"] .why')); }, t + ms('--motion-calm'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (/^[1-6]$/.test(e.key)) { S.on = +e.key; closeDeed(); render(); }
});
replay();
</script>
</body>
</html>
