<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Grammar V4 · Six questions</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: the label as six fixed questions with one-line answers. A new value shows its gaps and who could fill them ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4)}
.sheet{display:grid;grid-template-columns:minmax(200px,.6fr) minmax(0,1fr) minmax(0,1fr);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);overflow:hidden;align-content:start}
.sheet > div{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.sheet .q{color:var(--light);display:flex;gap:var(--space-2);align-items:flex-start}
.sheet .q svg{margin-top:2px;color:var(--ink-muted);flex:none}
.sheet .a{border-left:1px solid var(--hairline);color:var(--ink)}
.sheet .a .who{margin-top:var(--space-1)}
.sheet .hd{background:var(--surface-inset)}
.sheet .hd h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.gap{display:flex;gap:var(--space-2);align-items:flex-start;color:var(--ink-muted)}
.gap .mk-gap{flex:none;margin-top:2px}
.default{display:inline-flex;align-items:center;gap:var(--space-1)}
.pencil{display:grid;gap:var(--space-1);margin-top:var(--space-2)}
.pencil .pl{font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);display:flex;align-items:center;gap:var(--space-2)}
.late{opacity:0;transition:opacity var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i) * var(--motion-quick))}
.shown .late{opacity:1}
.inked{border:1px solid var(--x-proposed-lit);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3);background:var(--x-proposed-lit-wash)}
@media (max-width:1400px){.sheet > div{padding:var(--space-2) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small)}.sheet .hd h2{font-size:var(--type-meta);line-height:var(--leading-meta)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V4</b> six questions every value answers; an unlabelled value shows its gaps and is handled strictly until labelled · Datasheets for Datasets, Dataset Nutrition Label</div>
<script>
/*@DATA@*/
/*@LIB@*/
const f = FACT('f5'), lb = L(f.label), nv = DATA.fresh;
const S = { shown: false, inked: false };
const Q = [
  { id: 'care',   icon: 'shield',            q: 'How careful must I be?' },
  { id: 'who',    icon: 'users',             q: 'Who may see it?' },
  { id: 'use',    icon: 'circle-check',      q: 'What may it be used for?' },
  { id: 'from',   icon: 'file-text',         q: 'Where did it come from?' },
  { id: 'keep',   icon: 'hourglass',         q: 'How long is it kept?' },
  { id: 'held',   icon: 'link',              q: 'Who has held it?' }
];
const gap = (t, who) => `<div class="gap"><span class="mk-gap" aria-hidden="true"></span><span>${t}${who ? `<span class="who" style="display:block"><b>${P(who).name}</b> (${P(who).role}) could answer this.</span>` : ''}</span></div>`;
function answersLabelled() {
  const hands = [...new Set(DATA.custody.filter(k => k.hand).map(k => k.hand))];
  return {
    care: `${whyBtn(f.label, markHTML(lb))}<p class="who">${MK(lb.marking).handle}</p>`,
    who: `Pilotage (${F('pil').people} people), and ${P('p1').name} by share ${DATA.shares[0].id} until ${DATA.shares[0].until}. ${tpl(lb.caveat.plain)}`,
    use: usesHTML(lb, { verdict: true }),
    from: `${DATA.doc.title} ${f.src}, by ${P(DATA.doc.by).name} on ${DATA.doc.on}, from the duty roster.`,
    keep: `${keepWord(lb)} (${lb.keepDate}).`,
    held: `${hands.length} hands: ${hands.map(h => DATA.people[h] ? P(h).name : DATA.hands[h].name).join(', ')}.`
  };
}
function answersNew() {
  const sug = L(nv.suggest);
  return {
    care: S.inked ? `<div class="inked">${markHTML(sug)} <span class="who">labelled by <b>${P(nv.keeper).name}</b> just now</span></div>`
      : `${gap('Not labelled yet.', nv.keeper)}<p class="who">Until then it is handled as <b>${MK(POL.defaultMarking).word}</b>, as the policy says for anything unlabelled. <span class="tk">${tpl(POL.clauses.unlabelled)}</span></p>
         <div class="pencil"><p class="pl">${I('pencil', 12)} Suggested by rule, not yet accepted</p><p class="pt">${markHTML(sug)} ${nv.suggestWhy}</p><button class="btn sm" data-ink>${I('check', 12)} Accept as ${P(nv.keeper).name} <span class="kbd">A</span></button></div>`,
    who: S.inked ? `Marine Operations (${F(nv.keptOn).people} people) and every team under it.` : `For now, only ${P(nv.keeper).name} and whoever she names. A value with no label never reaches a whole floor.`,
    use: S.inked ? usesHTML(L(nv.suggest), { verdict: true }) : gap('No uses yet: every use is “ask first”.', nv.keeper),
    from: `${nv.from}.`,
    keep: S.inked ? `${keepWord(L(nv.suggest))}.` : gap('No keep rule yet.', nv.keeper),
    held: '1 hand: the tide gauge feed.'
  };
}
function render() {
  const A = answersLabelled(), B = answersNew();
  $('#app').innerHTML = topHTML(['Label sheet', 'Six questions'], [['A', 'accept the suggestion'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <div><p class="eyebrow">The label · grammar</p><h1 class="title">Six questions</h1><p class="sub">Every value answers the same six questions in one line each. A question nobody has answered is a gap with a name beside it, never a blank, and an unlabelled value is handled strictly until someone labels it.</p></div>
    <div class="sheet">
      <div class="hd"></div><div class="hd a"><p class="eyebrow">${DATA.record.title}</p><h2>${f.k}: ${f.v}</h2></div><div class="hd a"><p class="eyebrow">Arrived this morning</p><h2>${nv.k}: ${nv.v}</h2></div>
      ${Q.map((q, i) => `<div class="q dep" style="--i:${i}">${I(q.icon, 16)}<span>${q.q}</span></div><div class="a dep" style="--i:${i}">${A[q.id]}</div><div class="a late" style="--i:${i}">${B[q.id]}</div>`).join('')}
    </div>
  </div></main>`;
  afterRender();
  $('[data-ink]')?.addEventListener('click', ink);
}
function ink() { S.inked = true; render(); }
function replay() {
  clearLater(); closeDeed(); S.shown = false; S.inked = false; settleIn(); render();
  document.body.classList.remove('shown');
  later(() => { S.shown = true; document.body.classList.add('shown'); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'a' && S.shown) { S.inked = !S.inked; render(); }
});
replay();
</script>
</body>
</html>
