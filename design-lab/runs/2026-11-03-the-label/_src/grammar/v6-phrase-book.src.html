<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Grammar V6 · Phrase book</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: the GHS anatomy. Signal word, pictograms, what it is, what to do; every line drawn from a fixed phrase book ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--space-6)}
.ghs{align-self:start;display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-4) var(--space-5);padding:var(--space-5);border:var(--x-proposed-mark-rule-2);border-radius:var(--radius-key);background:var(--surface-pane)}
.ghs .id{grid-column:1 / -1;display:flex;justify-content:space-between;gap:var(--space-4);align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:var(--space-3)}
.ghs .id h2{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.picto{display:grid;grid-template-columns:repeat(2,calc(var(--space-7) - var(--space-2)));gap:var(--space-5) var(--space-4);align-content:start;padding:var(--space-2)}
.dia{position:relative;width:calc(var(--space-7) - var(--space-2));height:calc(var(--space-7) - var(--space-2));display:flex;align-items:center;justify-content:center;color:var(--light)}
.dia::before{content:"";position:absolute;inset:var(--space-2);transform:rotate(45deg);border:2px solid var(--x-proposed-mark-ink);border-radius:2px}
.dia.no::after{content:"";position:absolute;inset:calc(var(--space-4) + 2px);background:linear-gradient(135deg,transparent calc(50% - 1px),var(--light) calc(50% - 1px),var(--light) calc(50% + 1px),transparent calc(50% + 1px))}
.dia span{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:calc(var(--space-7) + var(--space-2));text-align:center;line-height:1.2;font-size:var(--x-proposed-type-micro);color:var(--ink-muted)}
.sig{font:500 var(--type-title-s)/var(--leading-title-s) var(--font-mono);letter-spacing:var(--tracking-caps);color:var(--light)}
.sig .ds{display:block;font-size:var(--type-lead);line-height:var(--leading-lead);font-weight:var(--x-proposed-mark-weight)}
.st{display:grid;gap:var(--space-1);margin-top:var(--space-3)}
.st h3{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-bottom:var(--space-1)}
.st p{display:grid;grid-template-columns:calc(var(--space-6) + var(--space-2)) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.st p.hot{color:var(--light);box-shadow:inset 2px 0 0 var(--x-proposed-lit);padding-left:var(--space-2)}
.code{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.supplier{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);border-top:1px solid var(--hairline);padding-top:var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.supplier b{font-weight:400;color:var(--ink)}
.book{display:flex;flex-direction:column;gap:var(--space-3);min-height:0}
.book ul{list-style:none;margin:0;padding:0;display:grid;gap:1px;overflow:auto}
.book li{display:grid;grid-template-columns:calc(var(--space-6) + var(--space-2)) minmax(0,1fr);gap:var(--space-2);padding:var(--space-1) var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-radius:var(--radius-key);transition:background var(--motion-base) var(--ease-standard),color var(--motion-base) var(--ease-standard)}
.book li.used{color:var(--ink);background:var(--surface-raised)}
.book li.hot{background:var(--x-proposed-lit-wash);color:var(--light)}
.book li .code{line-height:var(--leading-small)}
.pick{display:flex;gap:var(--space-2);flex-wrap:wrap}
.pick button{padding:var(--space-1) var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);font-size:var(--type-small);color:var(--ink-muted)}
.pick button[aria-pressed="true"]{color:var(--light);border-color:var(--x-proposed-lit)}
@media (max-width:1400px){.book ul{padding-bottom:var(--space-6)}.ghs{padding:var(--space-4);gap:var(--space-3) var(--space-4)}.sig{font-size:var(--type-heading);line-height:var(--leading-heading)}.st p{font-size:var(--type-small);line-height:var(--leading-small)}.picto{grid-template-columns:repeat(2,var(--space-6));gap:var(--space-5) var(--space-3)}.dia{width:var(--space-6);height:var(--space-6)}.dia.no::after{inset:var(--space-4)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V6</b> phrase book: signal word, pictograms, coded "what it is" and "what to do" lines, all from the policy's fixed phrases · GHS chemical labels (UN), H and P statements</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { fact: 'f5', hot: null };
/* the phrase book: fixed, numbered, worded by the deployment's policy. A label is a set of codes */
function book() {
  const b = [];
  Object.entries(POL.markings).forEach(([k, m], i) => b.push({ code: 'H1' + i, kind: 'H', when: lb => lb.marking === k, text: `${m.word}: ${m.plain}` }));
  Object.entries(POL.descriptors).forEach(([k, d], i) => b.push({ code: 'H2' + i, kind: 'H', when: lb => lb.desc.includes(k), text: `${d.plain} (${d.word})` }));
  USE_IDS().forEach((u, i) => b.push({ code: 'P1' + i, kind: 'P', when: lb => lb.uses[u] === 'no', text: `Not for ${US(u).long.toLowerCase()}.` }));
  USE_IDS().forEach((u, i) => b.push({ code: 'P2' + i, kind: 'P', when: lb => lb.uses[u] === 'count', text: `${US(u).long}: only as a count over ${POL.minGroup} or more, naming none.` }));
  USE_IDS().forEach((u, i) => b.push({ code: 'P3' + i, kind: 'P', when: lb => lb.uses[u] === 'ask', text: `${US(u).long}: ask the label’s owner first.` }));
  b.push({ code: 'P40', kind: 'P', when: lb => !!lb.caveat && !!lb.caveat.other, text: 'Outside its home floor, say who it is by role, not by name.' });
  b.push({ code: 'P41', kind: 'P', when: lb => !!lb.caveat && !lb.caveat.other && !lb.consent, text: 'Outside its home floor, show it only inside a count.' });
  b.push({ code: 'P42', kind: 'P', when: lb => !!lb.consent, text: 'Given by consent: only the named person may see it, and it is withdrawn everywhere if consent ends.' });
  Object.entries(POL.keepRules).forEach(([k, w], i) => b.push({ code: 'P5' + i, kind: 'P', when: lb => lb.keep === k, text: `Keep ${w}, then remove it wherever it was quoted.` }));
  return b;
}
const glyph = lb => {
  const g = lb.desc.map(d => ({ icon: DS(d).icon, w: DS(d).word.toLowerCase(), no: false }));
  USE_IDS().filter(u => lb.uses[u] === 'no').forEach(u => g.push({ icon: US(u).icon, w: 'no ' + US(u).word.toLowerCase(), no: true }));
  return g.slice(0, 4);
};
function render() {
  const f = FACT(S.fact), lb = L(f.label), B = book(), used = B.filter(p => p.when(lb));
  const src = f.src.startsWith('§') ? `${DATA.doc.title} ${f.src}` : f.src;
  $('#app').innerHTML = topHTML(['Label sheet', 'Phrase book'], [['1–4', 'another value'], ['↑ ↓', 'a phrase'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <section style="display:flex;flex-direction:column;gap:var(--space-4);min-height:0">
      <div><p class="eyebrow">The label · grammar</p><h1 class="title">Phrase book</h1></div>
      <div class="pick" role="group" aria-label="Value">${['f5', 'f6', 'f7', 'f1'].map((id, i) => `<button aria-pressed="${S.fact === id}" data-f="${id}">${i + 1} · ${FACT(id).k}</button>`).join('')}</div>
      <article class="ghs dep">
        <div class="id"><h2>${DATA.record.title} · ${f.k}</h2><span class="mono muted">${DATA.record.id}/${f.id}</span></div>
        <div class="picto">${glyph(lb).map(g => `<span class="dia ${g.no ? 'no' : ''}" title="${g.w}">${I(g.icon, 22)}<span>${g.w}</span></span>`).join('')}</div>
        <div>
          ${whyBtn(f.label, `<p class="sig">${MK(lb.marking).word}${lb.desc.map(d => `<span class="ds">${DS(d).word}</span>`).join('')}</p>`)}
          <div class="st"><h3>What it is</h3>${used.filter(p => p.kind === 'H').map(p => `<p data-c="${p.code}"><span class="code">${p.code}</span><span>${p.text}</span></p>`).join('')}</div>
          <div class="st"><h3>What to do</h3>${used.filter(p => p.kind === 'P').map(p => `<p data-c="${p.code}"><span class="code">${p.code}</span><span>${p.text}</span></p>`).join('')}</div>
        </div>
        <div class="supplier"><span>From <b>${src}</b></span><span>Labelled by <b>${P(lb.setBy).name}</b></span><span>Questions: <b>${P(whoChanges(lb)).name}</b></span><span class="tk">codes ${used.map(p => p.code).join(' ')}</span></div>
      </article>
    </section>
    <aside class="book"><p class="eyebrow">${POL.name} · ${B.length} phrases · ${used.length} on this label</p>
      <p class="sub">Every line on a label is a numbered phrase from the deployment’s own book, so it reads the same in every app and can be translated once. Nobody types a label’s wording.</p>
      <ul>${B.map(p => `<li class="${used.includes(p) ? 'used' : ''} ${S.hot === p.code ? 'hot' : ''}" data-c="${p.code}"><span class="code">${p.code}</span><span>${p.text}</span></li>`).join('')}</ul></aside>
  </div></main>`;
  afterRender();
  $$('.pick button').forEach(b => b.onclick = () => { S.fact = b.dataset.f; S.hot = null; render(); });
}
function hot(code) { S.hot = code; document.querySelectorAll('.st p').forEach(p => p.classList.toggle('hot', p.dataset.c === code)); $$('.book li').forEach(li => li.classList.toggle('hot', li.dataset.c === code)); $(`.book li[data-c="${code}"]`)?.scrollIntoView({ block: 'nearest' }); }
function replay() {
  clearLater(); closeDeed(); S.fact = 'f5'; S.hot = null; settleIn(); render();
  later(() => hot(book().find(p => p.code.startsWith('P4') && p.when(L(FACT('f5').label)))?.code), MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (/^[1-4]$/.test(e.key)) { S.fact = ['f5', 'f6', 'f7', 'f1'][+e.key - 1]; S.hot = null; render(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const u = book().filter(p => p.when(L(FACT(S.fact).label))); const i = u.findIndex(p => p.code === S.hot); hot(u[(i + (e.key === 'ArrowDown' ? 1 : -1) + u.length) % u.length].code); }
});
replay();
</script>
</body>
</html>
