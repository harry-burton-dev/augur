<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Grammar V2 · Allergen panel</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: the food label. Front of pack: four boxes read at a glance. Back: "contains" in bold ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--space-4)}
.head{display:flex;align-items:flex-end;gap:var(--space-6);justify-content:space-between}
.packs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5);min-height:0;align-items:start}
.pack{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);min-height:0}
.pack h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.pack .v{font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);color:var(--ink)}
/* front of pack: four boxes, same order on every pack; the level is a fill of three steps, the word says it */
.fop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-1)}
.box{display:grid;gap:var(--space-1);justify-items:center;text-align:center;padding:var(--space-2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key) var(--radius-key) var(--radius-inset) var(--radius-inset)}
.box .h{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.box .n{font:400 var(--type-meta)/var(--leading-meta) var(--font-sans);color:var(--light)}
.box .lv{display:grid;grid-template-columns:repeat(3,var(--space-3));gap:2px}
.box .lv i{height:var(--space-1);border-radius:1px;background:var(--hairline);transition:background var(--motion-calm) var(--ease-out)}
.box .lv i.on{background:var(--ink)}
.box .w{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
/* colour mode (C): the food version, for comparison */
.colour .box[data-l="1"]{background:color-mix(in srgb,var(--success) 12%,transparent);border-color:color-mix(in srgb,var(--success) 45%,transparent)}
.colour .box[data-l="2"]{background:color-mix(in srgb,var(--warning) 12%,transparent);border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.colour .box[data-l="3"]{background:color-mix(in srgb,var(--danger) 12%,transparent);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
/* back of pack */
.back{display:grid;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.back p b{font-weight:var(--x-proposed-mark-weight);color:var(--light)}
.back .lab{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-right:var(--space-2)}
.foot{margin-top:var(--space-2);display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
.pack.pre-fill .lv i.on{background:var(--hairline)}
@media (max-width:1400px){.pack{padding:var(--space-3)}.back{font-size:var(--type-small);line-height:var(--leading-small)}.pack .v{font-size:var(--type-lead);line-height:var(--leading-lead)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Grammar · V2</b> allergen panel: four boxes on the front, "contains" in bold on the back, the same on every value · food labelling (FIC allergen emphasis, UK front-of-pack)</div>
<script>
/*@DATA@*/
/*@LIB@*/
const S = { filled: false, colour: false };
const PICK = ['f5', 'f7', 'f1'];
/* four boxes, each worked out from the label and the record: never typed */
function boxes(f) {
  const lb = L(f.label), rank = MK(lb.marking).rank;
  const care = rank === 0 ? 1 : lb.desc.length ? 3 : 2;
  const people = F(f.keptOn).people;
  const reach = people <= 20 ? 3 : people <= 100 ? 2 : 1;
  const yes = USE_IDS().filter(u => lb.uses[u] === 'yes').length, all = USE_IDS().length;
  const use = yes >= all - 1 ? 1 : yes >= all / 2 ? 2 : 3;
  const yrs = { 'R-INC-10': 10, 'R-SAF-6': 6, 'R-CNS': 0, 'R-CON-7': 7, 'R-SEC-1': 1 }[lb.keep];
  return [
    { h: 'Care', n: MK(lb.marking).short + lb.desc.map(d => ' ' + DS(d).short).join(''), l: care, w: ['', 'everyday', 'careful', 'very careful'][care] },
    { h: 'Reach', n: `${people} people`, l: reach, w: ['', 'whole floor', 'a department', 'one team'][reach] },
    { h: 'Uses', n: `${yes} of ${all}`, l: use, w: ['', 'most uses', 'some uses', 'few uses'][use] },
    { h: 'Kept', n: lb.keepDate, l: yrs >= 6 ? 3 : yrs >= 2 ? 2 : 1, w: keepWord(lb).split(' ').slice(0, 3).join(' ') + '…' }
  ];
}
function packHTML(f, i) {
  const lb = L(f.label);
  const no = USE_IDS().filter(u => lb.uses[u] === 'no').map(u => `<b>${US(u).word.toLowerCase()}</b>`);
  const cnt = USE_IDS().filter(u => lb.uses[u] === 'count').map(u => US(u).word.toLowerCase());
  const ask = USE_IDS().filter(u => lb.uses[u] === 'ask').map(u => `${US(u).word.toLowerCase()} (ask ${P(askFor(lb, u)).name})`);
  const src = f.src.startsWith('§') ? `${DATA.doc.title} ${f.src}, written by ${P(DATA.doc.by).name}` : f.src;
  return `<article class="pack dep ${S.filled ? '' : 'pre-fill'}" style="--i:${i}">
    <p class="eyebrow">${DATA.record.title} · ${pmHTML(lb)}</p>
    <h2>${f.k}</h2><p class="v">${f.v}</p>
    <div class="fop" role="list" aria-label="At a glance">${boxes(f).map(b => `<div class="box" role="listitem" data-l="${b.l}"><span class="h">${b.h}</span><span class="n">${b.n}</span><span class="lv" aria-hidden="true">${[1, 2, 3].map(k => `<i class="${k <= b.l ? 'on' : ''}"></i>`).join('')}</span><span class="w">${b.w}</span></div>`).join('')}</div>
    <div class="back">
      <p><span class="lab">Contains</span>${lb.desc.length ? lb.desc.map(d => `<b>${DS(d).word}</b> (${DS(d).plain.toLowerCase().replace(/\.$/, '')})`).join(', ') : 'nothing that needs care'}</p>
      <p><span class="lab">Not for</span>${no.length ? andList(no) : 'no limits'}${cnt.length ? `; ${andList(cnt)} only as a count` : ''}${ask.length ? `; ${andList(ask)}` : ''}</p>
      <p><span class="lab">Made from</span>${src}</p>
      ${lb.caveat ? `<p><span class="lab">Caveat</span>${tpl(lb.caveat.plain)}</p>` : ''}
      <p class="tk">label=${f.label} · kept on ${f.keptOn} · reach from floor people</p>
    </div>
    <div class="foot"><span class="who">Kept by ${F(f.keptOn).name}</span>${whyBtn(f.label, `<span class="btn sm">${I('info', 14)} The deed</span>`)}</div>
  </article>`;
}
function render() {
  $('#app').innerHTML = topHTML(['Label sheet', 'Allergen panel'], [['C', 'food colours', 'h-c'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap ${S.colour ? 'colour' : ''}">
    <div class="head"><div><p class="eyebrow">The label · grammar</p><h1 class="title">What it contains</h1></div>
      <p class="sub">The same four boxes, in the same order, on every value, so two values can be compared at a glance, as two packs on a shelf. The level is a fill of three steps with a word; colour is off, because in AUGUR green and red already mean states. <span class="kbd">C</span> shows the food version.</p></div>
    <div class="packs">${PICK.map((id, i) => packHTML(FACT(id), i)).join('')}</div>
  </div></main>`;
  afterRender(); $('#h-c')?.classList.toggle('on', S.colour);
}
function replay() {
  clearLater(); closeDeed(); S.filled = false; settleIn(); render();
  later(() => { S.filled = true; $$('.pack').forEach(p => p.classList.remove('pre-fill')); }, MOMENT());
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'c') { S.colour = !S.colour; render(); }
});
replay();
</script>
</body>
</html>
