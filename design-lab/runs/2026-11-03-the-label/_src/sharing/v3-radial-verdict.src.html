<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Sharing V3 · Radial with the label's verdict</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V3: the right-click radial's Share wedge. Each target carries its reach and the label's verdict; the readout says what arrives before release ---- */
:root{--radial-r:calc(var(--space-8) + var(--space-3));--radial-r2:calc(var(--space-8) * 2)}
.stage{position:relative;height:100%}
.lib{position:absolute;inset:0;display:grid;grid-template-columns:minmax(260px,22%) minmax(0,1fr);gap:var(--space-5);transition:filter var(--motion-slow) var(--ease-standard),opacity var(--motion-slow) var(--ease-standard)}
.racked .lib{filter:blur(calc(var(--space-2) * .75)) saturate(.6);opacity:.55}
.rail{display:grid;gap:var(--space-1);align-content:start;font-size:var(--type-meta);line-height:var(--leading-meta)}
.rail span{padding:var(--space-1) var(--space-2);color:var(--ink-muted)}
.rows{display:grid;align-content:start}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--space-4);align-items:center;padding:var(--space-3);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.r b{font-weight:400;color:var(--light)}
.r.sel{background:var(--surface-raised)}
.menu{position:absolute;width:0;height:0;z-index:var(--layer-menu)}
.hub{position:absolute;left:calc(var(--target-md) / -2);top:calc(var(--target-md) / -2);width:var(--target-md);height:var(--target-md);border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);background:var(--surface-overlay);display:flex;align-items:center;justify-content:center;color:var(--ink-muted)}
.verb,.tgt{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--space-2);min-width:calc(var(--space-7) + var(--space-3));border-radius:var(--radius-inset);background:var(--surface-overlay);border:1px solid var(--hairline);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out)}
.verb.on{border-color:var(--x-proposed-lit);color:var(--light)}
.tgt{min-width:calc(var(--space-8) + var(--space-2))}
.tgt b{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light)}
.tgt .vd{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--x-proposed-type-micro);color:var(--ink-muted)}
.tgt.on{border-color:var(--fc, var(--x-proposed-lit));background:var(--surface-raised)}
.tgt[data-v="stop"] .vd{color:var(--x-proposed-stopped)}
.tgt[data-v="part"] .vd{color:var(--x-proposed-said-other)}
.closed .verb,.closed .tgt,.closed .hub{opacity:0;transform:translate(-50%,-50%) scale(.8)}
.closed .hub{transform:scale(.8)}
.readout{position:absolute;z-index:var(--layer-menu);width:var(--measure-decision);display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-overlay);box-shadow:var(--shadow-overlay);font-size:var(--type-small);line-height:var(--leading-small)}
.readout .path{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.readout .big{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.readout ul{margin:0;padding-left:var(--space-4);display:grid;gap:2px;color:var(--ink)}
.closed + .readout{opacity:0}
@media (prefers-reduced-motion: reduce){.racked .lib{filter:none}.closed .verb,.closed .tgt{transform:translate(-50%,-50%)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Sharing · V3</b> radial with the verdict: each Share target shows its reach and what the label lets through; the readout says what arrives · cinematic radial menu, consequence preview</div>
<script>
/*@DATA@*/
/*@LIB@*/
const B = DATA.briefing;
const S = { open: false, hot: 't1' };
const VERBS = [['Open', 'external-link', -90], ['Share', 'share-2', -45], ['Publish', 'send', 0], ['Move', 'folder-input', 45], ['Delete', 'trash-2', 90], ['History', 'history', 135], ['Rename', 'pencil', 180], ['More', 'ellipsis', -135]];
function verdict(t) { const C = shareCheck(t), st = C.filter(c => c.v === 'stop').length, ask = C.filter(c => c.v === 'ask'); return { C, v: st === 0 ? (ask.length ? 'ask' : 'ok') : 'part', st, ask }; }
function render() {
  const rows = [B.title, 'Night shift handover notes, October', 'Halden Bar survey request', 'Pilot boarding ladder checks'];
  $('#app').innerHTML = topHTML(['Artifacts', 'Marine Operations library'], [['Right-click', 'menu'], ['1–4', 'a target'], ['Esc', 'close'], ...STD_HINTS]) +
  `<main class="main"><div class="stage ${S.open ? 'racked' : ''}" id="stage">
    <div class="lib" aria-hidden="${S.open}"><div class="rail"><p class="eyebrow">Libraries</p><span>Marine Operations library</span><span>Pilotage incident reports</span><span>Safety committee papers</span></div>
      <div class="rows">${rows.map((r, i) => `<div class="r ${i === 0 ? 'sel' : ''}" ${i === 0 ? 'id="row"' : ''}><b>${r}</b>${i === 0 ? markHTML(paperLabel(shareCheck(TG('t1')))) : markHTML('lbOff')}<span class="who">${i === 0 ? P(B.by).name : 'Marine Operations'}</span></div>`).join('')}</div></div>
    <div class="menu ${S.open ? '' : 'closed'}" id="menu" role="menu" aria-label="Actions on ${B.title}">
      <div class="hub">${I('x', 16)}</div>
      ${VERBS.map(([w, ic, a]) => `<button class="verb ${w === 'Share' ? 'on' : ''}" role="menuitem" style="left:calc(cos(${a}deg) * var(--radial-r));top:calc(sin(${a}deg) * var(--radial-r))">${I(ic, 16)}${w}</button>`).join('')}
      ${DATA.targets.map((t, i) => { const a = -112 + i * 38, vd = verdict(t); return `<button class="tgt ${S.hot === t.id ? 'on' : ''}" data-tier="${t.floor ? tierOf(t.floor) : ''}" data-t="${t.id}" data-v="${vd.v}" role="menuitem" style="left:calc(cos(${a}deg) * var(--radial-r2) + var(--space-6));top:calc(sin(${a}deg) * var(--radial-r2) + var(--space-3))"><span>${tgName(t)}</span><b>${t.people ? fmt(t.people) : 'outside'}</b><span class="vd">${I(vd.v === 'ok' ? 'check' : vd.v === 'ask' ? 'hand' : 'scissors', 10)} ${vd.v === 'ok' ? 'all of it' : vd.v === 'ask' ? 'ask first' : `${vd.C.length - vd.st} of ${vd.C.length} ¶`}</span></button>`; }).join('')}
    </div>
    ${readoutHTML()}
  </div></main>`;
  afterRender(); place();
  $$('.tgt').forEach(b => { b.onmouseenter = () => { S.hot = b.dataset.t; render(); }; });
}
function readoutHTML() {
  const t = TG(S.hot), vd = verdict(t), lb = paperLabel(vd.C);
  return `<div class="readout" id="ro" role="status"><span class="path">Share › ${tgName(t)}</span>
    <span class="big">${t.people ? `${fmt(t.people)} people` : 'Outside the organisation'} · arrives as ${markWord(lb)}</span>
    <ul>${vd.C.filter(c => c.v !== 'ok').map(c => `<li>¶${B.paras.indexOf(c.p) + 1} ${c.v === 'stop' ? `stays behind: ${c.why}` : c.v === 'said' ? 'goes as a count, none named' : `waits for ${P(c.who).name}`}</li>`).join('')}</ul>
    <span class="who">${vd.st ? 'Release sends what passes; what stays behind is listed on the receipt.' : 'Release sends it.'} Undo for 10 seconds.${t.approval ? ` Then ${P(t.approval).name} approves.` : ''}</span></div>`;
}
function place() {
  const r = $('#row').getBoundingClientRect(), st = $('#stage').getBoundingClientRect();
  const x = Math.min(r.left + r.width * .38, st.right - 520) - st.left, y = r.top + r.height / 2 - st.top + 230;
  const m = $('#menu'); m.style.left = x + 'px'; m.style.top = y + 'px';
  const ro = $('#ro'); ro.style.left = Math.min(x + 300, st.width - ro.offsetWidth) + 'px'; ro.style.top = Math.max(0, y + 120) + 'px'; if (!S.open) ro.style.opacity = 0;
}
function replay() {
  clearLater(); closeDeed(); S.open = false; S.hot = 't1'; settleIn(); render();
  later(() => { S.open = true; render(); }, MOMENT() * .7);
  later(() => { S.hot = 't3'; render(); }, MOMENT() + ms('--motion-calm'));
}
document.addEventListener('contextmenu', e => { e.preventDefault(); S.open = true; render(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.open) { S.open = false; render(); return; }
  if (commonKeys(e, render, replay)) return;
  if (/^[1-4]$/.test(e.key)) { S.open = true; S.hot = DATA.targets[+e.key - 1].id; render(); }
});
addEventListener('resize', () => render());
replay();
</script>
</body>
</html>
