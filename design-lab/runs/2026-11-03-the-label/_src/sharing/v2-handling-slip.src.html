<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Sharing V2 · Handling slip</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: a distribution slip. One line per recipient: whom, for what, until when, how many people, and the label's verdict on that line ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:var(--space-6)}
.slip{display:flex;flex-direction:column;min-height:0;border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--surface-pane)}
.slip .hd{display:flex;justify-content:space-between;align-items:baseline;padding:var(--space-3) var(--space-4);border-bottom:var(--x-proposed-mark-rule-2)}
.slip .hd h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.tbl{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto auto minmax(0,1.6fr);align-content:start;overflow:auto}
.tbl > span{padding:var(--space-3) var(--space-3);border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.tbl .h{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.tbl .to b{font-weight:400;color:var(--light);display:block}
.tbl .n{font-family:var(--font-mono);color:var(--light);text-align:right}
.verd{display:grid;gap:var(--space-1)}
.verd b{font-weight:400;color:var(--light)}
.verd .s{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.row-stop{background:var(--x-proposed-disagree-wash)}
.row-new{animation:in var(--motion-calm) var(--ease-out)}
@keyframes in{from{opacity:0;transform:translateY(calc(var(--space-2) * -1))}}
.fix{display:inline-flex;align-items:center;gap:var(--space-1);margin-top:var(--space-1)}
.add{display:flex;gap:var(--space-2);flex-wrap:wrap;padding:var(--space-3) var(--space-4)}
.add button{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px dashed var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink-muted);font-size:var(--type-small)}
.paper{display:grid;gap:var(--space-2);align-content:start;font-size:var(--type-small);line-height:var(--leading-small)}
.paper p{display:grid;grid-template-columns:calc(var(--space-7) - var(--space-3)) minmax(0,1fr);gap:var(--space-2);color:var(--ink)}
.paper p.x{color:var(--ink-muted)}
.paper p.x span:last-child{text-decoration:line-through;text-decoration-color:var(--x-proposed-stopped)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-top:var(--x-proposed-mark-rule-2)}
@media (prefers-reduced-motion: reduce){.row-new{animation:none}}
@media (max-width:1400px){.tbl > span{padding:var(--space-2)}.tbl{grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr) auto auto minmax(0,1.6fr)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Sharing · V2</b> handling slip: one line per recipient with purpose, until, reach and the label's verdict; a stopped line offers the version that can go · staff distribution lists, GSC handling instructions</div>
<script>
/*@DATA@*/
/*@LIB@*/
const B = DATA.briefing;
const S = { lines: ['t1'], last: null, fixed: {} };
const PURP = { t1: 'safety', t2: 'report', t3: 'report', t4: 'outside' };
function lineHTML(id) {
  const t = TG(id), C = shareCheck(t), stop = C.filter(c => c.v === 'stop'), ask = C.filter(c => c.v === 'ask');
  const fixed = S.fixed[id];
  const all = stop.length === C.length;
  const v = fixed ? { b: `Sends ${C.length - stop.length} of ${C.length} paragraphs`, s: `${stop.map(c => '¶' + (B.paras.indexOf(c.p) + 1)).join(', ')} left out, by you, with the reason kept on the slip.`, ic: 'check' }
    : stop.length && !all ? { b: `${stop.length} paragraph${stop.length > 1 ? 's' : ''} can’t go`, s: stop.map(c => `¶${B.paras.indexOf(c.p) + 1}: ${c.why}`).join(' '), ic: 'ban', fix: true }
    : ask.length ? { b: `Waits for ${P(ask[0].who).name}`, s: ask[0].why, ic: 'hand' } : { b: 'All of it may go', s: '', ic: 'check' };
  return `<span class="to ${S.last === id ? 'row-new' : ''} ${v.fix ? 'row-stop' : ''}"><b>${tgName(t)}</b><span class="who">${t.via}</span></span>
    <span class="${S.last === id ? 'row-new' : ''} ${v.fix ? 'row-stop' : ''}">${I(US(PURP[id]).icon, 12)} ${US(PURP[id]).word}</span>
    <span class="${S.last === id ? 'row-new' : ''} ${v.fix ? 'row-stop' : ''}">${t.kind === 'outside' ? 'no recall' : '31 Mar 2027'}</span>
    <span class="n ${S.last === id ? 'row-new' : ''} ${v.fix ? 'row-stop' : ''}">${t.people ? fmt(t.people) : '?'}</span>
    <span class="verd ${S.last === id ? 'row-new' : ''} ${v.fix ? 'row-stop' : ''}"><b>${I(v.ic, 12)} ${v.b}</b>${v.s ? `<span class="s">${v.s}</span>` : ''}${v.fix ? `<button class="btn sm fix" data-fix="${id}">${I('scissors', 12)} Send it without ${stop.length > 1 ? 'them' : 'it'}</button>` : ''}</span>`;
}
function render() {
  const firstStop = S.lines.find(id => shareCheck(TG(id)).some(c => c.v === 'stop') && !S.fixed[id]);
  const C = shareCheck(TG(firstStop || S.lines[S.lines.length - 1]));
  $('#app').innerHTML = topHTML(['Artifacts', B.title, 'Distribution'], [['1–4', 'add a recipient'], ['F', 'take the fix'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <section class="slip">
      <div class="hd"><h2>Distribution · ${B.title}</h2>${markHTML(paperLabel(shareCheck(TG('t1'))))}</div>
      <div class="tbl"><span class="h">To</span><span class="h">For</span><span class="h">Until</span><span class="h" style="text-align:right">People</span><span class="h">The label says</span>
        ${S.lines.map(lineHTML).join('')}</div>
      <div class="add">${DATA.targets.filter(t => !S.lines.includes(t.id)).map(t => `<button data-add="${t.id}">${I('plus', 12)} ${DATA.targets.indexOf(t) + 1} · ${tgName(t)}</button>`).join('')}</div>
      <div class="foot"><span class="who">${S.lines.length} line${S.lines.length > 1 ? 's' : ''} · ${fmt(S.lines.reduce((a, id) => a + (TG(id).people || 0), 0))} people · each line leaves its own receipt</span><button class="btn ${firstStop ? '' : 'go'}" ${firstStop ? 'aria-disabled="true"' : ''}>${I('send', 14)} Send</button></div>
    </section>
    <aside class="paper"><p class="eyebrow" style="display:block">What ${tgName(TG(firstStop || S.lines[S.lines.length - 1]))} would get</p>
      ${C.map((c, i) => `<p class="${c.v === 'stop' ? 'x' : ''}"><span>${pmHTML(paraLabel(c.p))}</span><span>${c.p.text}</span></p>`).join('')}
      <p class="who" style="display:block">A stopped line is never sent in part without you choosing it. Taking the fix keeps the reason on the slip, so whoever reads the receipt knows what was left out and why.</p>
    </aside>
  </div></main>`;
  afterRender();
  $$('[data-add]').forEach(b => b.onclick = () => add(b.dataset.add));
  $$('[data-fix]').forEach(b => b.onclick = () => { S.fixed[b.dataset.fix] = true; S.last = null; render(); });
}
function add(id) { if (S.lines.includes(id)) return; S.lines.push(id); S.last = id; render(); S.last = null; }
function replay() { clearLater(); closeDeed(); S.lines = ['t1']; S.fixed = {}; settleIn(); render(); later(() => add('t3'), MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (/^[1-4]$/.test(e.key)) add(DATA.targets[+e.key - 1].id);
  if (e.key.toLowerCase() === 'f') { const id = S.lines.find(x => shareCheck(TG(x)).some(c => c.v === 'stop') && !S.fixed[x]); if (id) { S.fixed[id] = true; render(); } }
});
replay();
</script>
</body>
</html>
