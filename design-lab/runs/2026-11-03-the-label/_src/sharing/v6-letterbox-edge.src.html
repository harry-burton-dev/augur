<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Sharing V6 · The edge in the letterbox</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: only one share is important enough for the letterbox: leaving the organisation. The far plane racks back; the frame holds what leaves, what stays and who must agree ---- */
.stage{position:relative;height:100%}
.far{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:var(--space-5);transition:filter var(--motion-slow) var(--ease-standard),opacity var(--motion-slow) var(--ease-standard)}
.boxed .far{filter:blur(calc(var(--space-2) * .75)) saturate(.5);opacity:.5}
.far .paper{display:grid;gap:var(--space-3);align-content:start;padding:var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);font-size:var(--type-meta);line-height:var(--leading-meta)}
.far .tg{display:grid;gap:var(--space-2);align-content:start}
.far .tg span{padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);font-size:var(--type-meta)}
.far .tg span.on{border-color:var(--x-proposed-lit)}
/* the letterbox: a 2.39:1 frame from the token, bars from the scrim */
.lb{position:fixed;inset:0;z-index:var(--layer-overlay);display:flex;flex-direction:column;pointer-events:none}
.bar{flex:1;background:linear-gradient(var(--scrim),var(--scrim));transform:scaleY(0);transition:transform var(--motion-slow) var(--ease-out)}
.bar.t{transform-origin:top}
.bar.b{transform-origin:bottom}
.boxed .bar{transform:scaleY(1)}
.frame{width:100%;aspect-ratio:var(--letterbox-ratio);flex:none;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr);gap:var(--space-5);padding:var(--space-4) var(--space-6);pointer-events:auto;opacity:0;transition:opacity var(--motion-calm) var(--ease-out) var(--motion-quick)}
.boxed .frame{opacity:1}
.frame h2{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.col{display:flex;flex-direction:column;gap:var(--space-2);min-height:0}
.leaves p:not(.eyebrow):not(.who){display:grid;grid-template-columns:calc(var(--space-7) - var(--space-3)) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.leaves p.x span:last-child{text-decoration:line-through;text-decoration-color:var(--x-proposed-stopped);color:var(--ink-muted)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);padding:var(--space-1) var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.chip.warn{border-color:var(--x-proposed-stopped)}
.appr{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline)}
.appr b{font-weight:400;color:var(--light)}
.basis{display:flex;gap:var(--space-2);flex-wrap:wrap}
.basis button{padding:var(--space-1) var(--space-3);border:1px dashed var(--hairline-strong);border-radius:var(--radius-pill);font-size:var(--type-small);color:var(--ink-muted)}
.basis button[aria-pressed="true"]{border-style:solid;border-color:var(--x-proposed-lit);color:var(--light)}
.acts{margin-top:auto;display:flex;gap:var(--space-2)}
@media (prefers-reduced-motion: reduce){.bar{transition:opacity var(--motion-base);transform:none;opacity:0}.boxed .bar{opacity:1}.boxed .far{filter:none}}
@media (max-width:1400px){.frame{padding:var(--space-3) var(--space-5);gap:var(--space-4)}.frame h2{font-size:var(--type-heading);line-height:var(--leading-heading)}.leaves p:not(.eyebrow){font-size:var(--x-proposed-type-micro);line-height:1.4}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Sharing · V6</b> the edge in the letterbox: leaving the organisation is the one share that takes the 2.39:1 frame; it shows what leaves, what stays and who must agree · PDR-009 letterbox, rack focus, GSC handling outside</div>
<script>
/*@DATA@*/
/*@LIB@*/
const B = DATA.briefing, t = TG('t4');
const S = { boxed: false, basis: null };
const BASES = ['Public task (safety duty)', 'Legal obligation (reporting a marine casualty)', 'Agreement with the agency'];
function render() {
  const C = shareCheck(t), lb = paperLabel(C), ask = [...new Set(C.filter(c => c.v === 'ask').map(c => c.who))];
  $('#app').innerHTML = topHTML(['Artifacts', B.title, 'Share'], [['Esc', 'step back'], ['1–3', 'lawful basis'], ...STD_HINTS]) +
  `<main class="main"><div class="stage ${S.boxed ? 'boxed' : ''}" id="stage">
    <div class="far" aria-hidden="${S.boxed}">
      <div class="paper"><p class="eyebrow">${B.title}</p>${B.paras.map(p => `<p>${pmHTML(paraLabel(p))} ${p.text}</p>`).join('')}</div>
      <div class="tg"><p class="eyebrow">Share with</p>${DATA.targets.map(x => `<span class="${x.id === t.id ? 'on' : ''}">${tgName(x)} · ${x.people ? fmt(x.people) : 'outside'}</span>`).join('')}</div>
    </div>
  </div></main>
  <div class="lb ${S.boxed ? 'boxed' : ''}" role="dialog" aria-modal="true" aria-label="Leaving the organisation">
    <div class="bar t"></div>
    <div class="frame">
      <div class="col leaves"><p class="eyebrow">Leaving ${DATA.org} · to ${tgName(t)}</p><h2>What leaves</h2>
        ${C.map((c, i) => `<p class="${c.v === 'stop' ? 'x' : ''}"><span>${pmHTML(paraLabel(c.p))}</span><span>${c.p.text}</span></p>`).join('')}
        <p class="who" style="display:block">${C.filter(c => c.v === 'stop').length} paragraphs stay behind: ${C.filter(c => c.v === 'stop').map(c => `¶${B.paras.indexOf(c.p) + 1}`).join(' and ')}, by their labels.</p></div>
      <div class="col"><p class="eyebrow">What it means</p>
        <div class="chips"><span class="chip warn">${I('globe', 12)} leaves AUGUR: can’t be recalled</span><span class="chip">${I('users', 12)} reach unknown</span><span class="chip">${I('shield', 12)} marked ${MK(lb.marking).word} in the email</span><span class="chip">${I('receipt', 12)} receipt kept here</span></div>
        <p class="who">The label can’t follow it out. The email carries the marking in words and a line saying what was left out.</p>
        <p class="eyebrow" style="margin-top:var(--space-3)">Lawful basis · needed for anything leaving</p>
        <div class="basis">${BASES.map((b, i) => `<button aria-pressed="${S.basis === i}" data-b="${i}">${i + 1} · ${b}</button>`).join('')}</div></div>
      <div class="col"><p class="eyebrow">Who must agree</p>
        ${ask.map(p => `<div class="appr">${I('hand', 16)}<span><b>${P(p).name}</b>, ${P(p).role}<span class="who" style="display:block">for ${C.filter(c => c.who === p).length} paragraphs marked ${MK('off').word}: ${US('outside').long.toLowerCase()} is “${POL.useWords.ask}”.</span></span></div>`).join('')}
        <div class="appr">${I('check', 16)}<span><b>Not needed: ${P(DS('personal').owner).name}</b><span class="who" style="display:block">Nothing ${DS('personal').word} leaves.</span></span></div>
        <div class="acts"><button class="btn ${S.basis != null ? 'go' : ''}" ${S.basis == null ? 'aria-disabled="true"' : ''}>${I('send', 14)} Ask ${first(P(ask[0]).name)}</button><button class="btn" data-back>Step back</button></div></div>
    </div>
    <div class="bar b"></div>
  </div>`;
  afterRender();
  $$('[data-b]').forEach(b => b.onclick = () => { S.basis = +b.dataset.b; render(); });
  $('[data-back]').onclick = () => { S.boxed = false; render(); };
}
function replay() { clearLater(); closeDeed(); S.boxed = false; S.basis = null; settleIn(); render(); later(() => { S.boxed = true; $('#stage').classList.add('boxed'); $('.lb').classList.add('boxed'); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.boxed) { S.boxed = false; render(); return; }
  if (commonKeys(e, render, replay)) return;
  if (/^[1-3]$/.test(e.key)) { S.basis = +e.key - 1; render(); }
});
replay();
</script>
</body>
</html>
