<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Record V5 · Seen as</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: one record, four readers. Switch the reader and each value turns into what that reader gets, in place ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(260px,24%) minmax(0,1fr);gap:var(--space-5)}
.dial{display:flex;flex-direction:column;gap:var(--space-2)}
.who-b{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:0 var(--space-3);padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);text-align:left;transition:border-color var(--motion-base) var(--ease-standard),background var(--motion-base) var(--ease-standard)}
.who-b[aria-pressed="true"]{border-color:var(--fc);background:var(--surface-raised)}
.who-b .n{grid-row:span 2;font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.who-b b{font-weight:400;color:var(--light)}
.who-b .fchip{font-size:var(--type-small)}
.card{min-height:0;display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);overflow:hidden}
.card .in{padding:var(--space-4) var(--space-5);display:grid;gap:var(--space-3);align-content:start;overflow:auto;flex:1}
.facts{display:grid;grid-template-columns:auto minmax(160px,.7fr) minmax(0,1.6fr);gap:0 var(--space-4);align-items:center}
.facts > *{padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.facts .k{color:var(--ink-muted)}
.facts .val{color:var(--light)}
.cell{transition:opacity var(--motion-base) var(--ease-standard),filter var(--motion-base) var(--ease-standard)}
.swap .cell.ch{opacity:0;filter:blur(var(--space-1))}
.why-l{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.tally{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.tally b{font:400 var(--type-meta)/1 var(--font-mono);color:var(--light);margin-right:var(--space-1)}
@media (prefers-reduced-motion: reduce){.swap .cell.ch{filter:none}}
@media (max-width:1400px){.card .in{padding:var(--space-3) var(--space-4)}.facts > *{padding:var(--space-1) 0}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Record · V5</b> seen as: one record, four readers; each value turns into what that reader gets, in place, and says why · printer's proofs, "view as" in privacy settings</div>
<script>
/*@DATA@*/
/*@LIB@*/
const R = DATA.record, ORDER = ['kofi', 'leah', 'sam', 'owen'];
const S = { who: 'kofi', prev: null };
function cellFor(f, rd) {
  const v = viewFact(f, rd);
  if (v.state === 'hidden') return null;
  const why = v.state === 'said' ? v.why : v.state === 'unseen' ? v.why : v.via === 'share' ? `Shared by ${P(v.share.from).name} for ${US(v.share.purpose).word.toLowerCase()}, until ${v.share.until}.` : v.via === 'consent' ? `Given by consent ${v.consent.id}, for ${v.consent.purposeNote}.` : '';
  return { html: valueHTML(f, rd), why, state: v.state };
}
function render() {
  const rd = READERS[S.who], p = P(rd.person);
  const cells = R.facts.map(f => ({ f, c: cellFor(f, rd), was: S.prev ? cellFor(f, READERS[S.prev]) : null }));
  const shown = cells.filter(x => x.c);
  const n = st => shown.filter(x => x.c.state === st).length;
  const lb = combine(shown.filter(x => x.c.state === 'open').map(x => x.f.label));
  $('#app').innerHTML = topHTML(['Data Atlas', R.title, 'Seen as'], [['1–4', 'a reader'], ...STD_HINTS], rd.person) +
  `<main class="main"><div class="wrap">
    <aside class="dial"><p class="eyebrow">Seen as</p><p class="sub">The record is the same. Each value is labelled, and the label decides what each reader gets: the value, the value said another way, a locked slot with whom to ask, or nothing at all.</p>
      ${ORDER.map((k, i) => { const r = READERS[k], pp = P(r.person); return `<button class="who-b" data-tier="${tierOf(r.floor)}" aria-pressed="${S.who === k}" data-k="${k}"><span class="n">${i + 1}</span><b>${pp.name}</b><span class="fchip" data-tier="${tierOf(r.floor)}">${pp.role} · ${F(r.floor).name}</span></button>`; }).join('')}
    </aside>
    <section class="card">
      <div class="banner" data-rank="${MK(lb.marking).rank}">${markWord(lb)} <span class="r">· for ${p.name}</span></div>
      <div class="in">
        <div><p class="eyebrow">${R.kind} · ${R.id} · kept by ${F(R.keptOn).name}</p><h1 class="title" style="font-size:var(--type-heading);line-height:var(--leading-heading);letter-spacing:var(--tracking-caps)">${R.title}</h1></div>
        <div class="facts" id="facts">${shown.map(({ f, c, was }, i) => `<span class="cell ${was && was.html !== c.html ? 'ch' : ''}">${c.state === 'open' ? whyBtn(f.label, pmHTML(f.label)) : '<span class="pm">·</span>'}</span><span class="k">${f.k}</span><span class="cell ${was && was.html !== c.html ? 'ch' : ''}">${c.html}${c.why ? `<span class="why-l">${c.why}</span>` : ''}</span>`).join('')}</div>
        <p class="who">${I('info', 12)} ${GLOMAR()}</p>
        <div class="tally"><span><b>${n('open')}</b>open</span><span><b>${n('said')}</b>said another way</span><span><b>${n('unseen')}</b>locked, with whom to ask</span><span class="tk">and ${R.facts.length - shown.length} not shown at all (this count is for the design only; no reader sees it)</span></div>
      </div>
    </section>
  </div></main>`;
  afterRender();
  $$('.who-b').forEach(b => b.onclick = () => pick(b.dataset.k));
}
function pick(k) {
  if (k === S.who) return;
  S.prev = S.who; S.who = k; render();
  const fx = $('#facts'); fx.classList.add('swap');
  requestAnimationFrame(() => requestAnimationFrame(() => fx.classList.remove('swap')));
}
function replay() { clearLater(); closeDeed(); S.who = 'kofi'; S.prev = null; settleIn(); render(); later(() => pick('sam'), MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (/^[1-4]$/.test(e.key)) pick(ORDER[+e.key - 1]);
});
replay();
</script>
</body>
</html>
