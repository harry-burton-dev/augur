<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Record V4 · Marked in the ink</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: in a document, the label is in the ink: a labelled value is underlined by its descriptor, the paragraph carries a portion mark, and a copy carries both ---- */
:root{
  /* NEW: underline styles for descriptors in running text (needs token) */
  --x-proposed-ul-personal: dotted;
  --x-proposed-ul-commercial: double;
}
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,30%);gap:var(--space-6)}
.paper{min-height:0;display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane);overflow:hidden}
.paper .in{flex:1;min-height:0;padding:var(--space-5) var(--space-6);display:flex;flex-direction:column;gap:var(--space-4);max-width:calc(var(--measure-read) + var(--space-8))}
.paper h1{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light)}
.sec{display:grid;grid-template-columns:calc(var(--space-7) + var(--space-2)) minmax(0,1fr);gap:var(--space-3);border-radius:var(--radius-key);transition:background var(--motion-base) var(--ease-standard)}
.sec .side{display:grid;gap:var(--space-1);align-content:start;padding-top:var(--space-1)}
.sec h3{font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.sec p{font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-1));font-weight:300;color:var(--ink)}
.sec.sel{background:var(--x-proposed-lit-wash);box-shadow:0 0 0 var(--space-2) var(--x-proposed-lit-wash)}
/* the value in ink: underline style by descriptor, a tiny superscript letter, and nothing else */
.lv{text-decoration-line:none;text-underline-offset:var(--space-1);text-decoration-thickness:1.5px;transition:text-decoration-color var(--motion-calm) var(--ease-out);color:inherit;border-radius:2px}
.marked .lv{text-decoration-line:underline;text-decoration-color:var(--ink-muted)}
.lv[data-d="personal"]{text-decoration-style:var(--x-proposed-ul-personal)}
.lv[data-d="commercial"]{text-decoration-style:var(--x-proposed-ul-commercial)}
.lv sup{font:500 var(--x-proposed-type-micro)/0 var(--font-mono);color:var(--ink-muted);margin-left:2px;opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.marked .lv sup{opacity:1}
.lv:hover,.lv:focus-visible{color:var(--light)}
.key{display:grid;gap:var(--space-3);align-content:start}
.key .row{display:grid;grid-template-columns:var(--space-7) minmax(0,1fr);gap:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);align-items:baseline}
.key .sw{font-weight:300;text-decoration-line:underline;text-underline-offset:var(--space-1);text-decoration-thickness:1.5px;text-decoration-color:var(--ink-muted);color:var(--light)}
.clip{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-overlay);box-shadow:var(--shadow-overlay);font-size:var(--type-small);line-height:var(--leading-small)}
.clip .q{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);border-left:2px solid var(--hairline-strong);padding-left:var(--space-3)}
@media (max-width:1400px){.sec p{font-size:var(--type-body);line-height:var(--leading-body)}.paper .in{padding:var(--space-4);gap:var(--space-3)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Record · V4</b> marked in the ink: a labelled value is underlined by what it contains, the paragraph carries a portion mark, a copy carries both · allergen emphasis in ingredient lists, GSC portion marking</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = DATA.doc, me = READERS.kofi;
const S = { marked: false, sel: null };
/* find labelled values inside the prose: any fact whose value appears verbatim */
function inked(sec) {
  let t = sec.text;
  DATA.record.facts.forEach(f => { if (L(f.label).desc.length && t.includes(f.v)) t = t.replace(f.v, `<button class="lv why" data-why="${f.label}" data-origin="${D.title} ${sec.n}" data-d="${L(f.label).desc[0]}" aria-label="${f.v}, ${markWord(f.label)}">${f.v}<sup>${L(f.label).desc.map(d => DS(d).short).join('')}</sup></button>`); });
  return t;
}
function carried(sec) { return DATA.record.facts.filter(f => L(f.label).desc.length && sec.text.includes(f.v)); }
function render() {
  const docLb = combine(D.sections.map(s => s.label));
  const sel = D.sections.find(s => s.n === S.sel);
  $('#app').innerHTML = topHTML(['Artifacts', D.library, D.title], [['↑ ↓', 'a section'], ['C', 'copy it'], ['M', 'marks on and off'], ...STD_HINTS], me.person) +
  `<main class="main"><div class="wrap">
    <article class="paper ${S.marked ? 'marked' : ''}">
      <div class="banner" data-rank="${MK(docLb.marking).rank}">${markWord(docLb)}</div>
      <div class="in scroll">
        <div><p class="eyebrow">${D.id} · by ${P(D.by).name} · ${D.on}</p><h1>${D.title}</h1></div>
        ${D.sections.map((s, i) => `<section class="sec dep ${S.sel === s.n ? 'sel' : ''}" style="--i:${i}" data-s="${s.n}"><div class="side"><span class="mono muted">${s.n}</span>${pmHTML(s.label)}</div><div><h3>${s.h}</h3><p>${inked(s)}</p></div></section>`).join('')}
      </div>
      <div class="banner" data-rank="${MK(docLb.marking).rank}">${markWord(docLb)}</div>
    </article>
    <aside class="key"><p class="eyebrow">In the ink</p>
      <p class="sub">No chips, no colour. The words that carry a label are underlined by what they contain, the way an ingredient list sets allergens in bold. The paragraph says its marking at the start, and the banner says the strictest.</p>
      ${Object.entries(POL.descriptors).filter(([k]) => k !== 'security').map(([k, d]) => `<div class="row"><span class="sw" style="text-decoration-style:var(--x-proposed-ul-${k})">${d.short}</span><span><b class="lite" style="font-weight:400">${d.word}</b> · ${d.plain}</span></div>`).join('')}
      <div class="row"><span>${pmHTML('lbHours')}</span><span>Portion mark: this paragraph’s strictest label.</span></div>
      ${sel ? `<div class="clip dep" role="status"><p class="eyebrow">${I('clipboard', 12)} Copied ${sel.n}</p><p class="q">${sel.text}</p>
        <p>Carries ${markHTML(sel.label)} from ${carried(sel).length ? andList(carried(sel).map(f => f.k.toLowerCase())) : 'the paragraph'}.</p>
        <p class="who">Pasted anywhere in AUGUR, it keeps its marks and its source. Pasted outside, the text starts with “${markWord(sel.label)}” and AUGUR can’t follow it further (record V6).</p></div>` : ''}
    </aside>
  </div></main>`;
  afterRender();
  $$('.sec').forEach(s => s.onclick = e => { if (e.target.closest('.lv')) return; S.sel = s.dataset.s; render(); });
}
function replay() {
  clearLater(); closeDeed(); S.marked = false; S.sel = null; settleIn(); render();
  later(() => { S.marked = true; $('.paper').classList.add('marked'); }, MOMENT() * .7);
  later(() => { S.sel = '§3'; render(); }, MOMENT() + ms('--motion-calm'));
}
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  const k = e.key.toLowerCase(), ns = D.sections.map(s => s.n);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const i = ns.indexOf(S.sel); S.sel = ns[(i + (e.key === 'ArrowDown' ? 1 : -1) + ns.length) % ns.length]; render(); }
  if (k === 'c' && !S.sel) { S.sel = '§3'; render(); }
  if (k === 'm') { S.marked = !S.marked; render(); }
});
replay();
</script>
</body>
</html>
