<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Record V6 · At the edge</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: copying a labelled value out. Inside AUGUR the label follows; at the edge, the label decides what may leave, at the moment of copying ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.6fr);gap:var(--space-5)}
.src{display:flex;flex-direction:column;gap:var(--space-3)}
.pickv{display:grid;gap:var(--space-2)}
.pv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);text-align:left}
.pv[aria-pressed="true"]{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.pv .vv{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.pv .k{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.lands{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-radius:var(--radius-card);overflow:hidden;border:1px solid var(--hairline)}
.land{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);min-height:0}
.land.in{background:var(--surface-pane)}
.land.out{background:repeating-linear-gradient(135deg,transparent 0 var(--space-3),color-mix(in srgb,var(--hairline) 50%,transparent) var(--space-3) calc(var(--space-3) + 1px)),var(--surface-inset);border-left:2px dashed var(--hairline-strong)}
.land h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light);display:flex;gap:var(--space-2);align-items:center}
.paste{display:grid;gap:var(--space-2);padding:var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:var(--slate-deep);font-size:var(--type-meta);line-height:var(--leading-meta)}
.paste .hdr{font:500 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);color:var(--light)}
.way{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-2) var(--space-3);align-items:start;padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.way.ok{border-color:var(--x-proposed-lit)}
.way .s{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);display:block}
.way.stop{border-left:2px solid var(--x-proposed-stopped)}
.land .ways{display:grid;gap:var(--space-2)}
.arrive{animation:arrive var(--motion-calm) var(--ease-out)}
@keyframes arrive{from{opacity:0;transform:translateX(calc(var(--travel-near) * -1))}}
@media (prefers-reduced-motion: reduce){.arrive{animation:fade var(--motion-base) var(--ease-standard)}@keyframes fade{from{opacity:0}}}
@media (max-width:1400px){.land{padding:var(--space-3)}.way{font-size:var(--type-small);line-height:var(--leading-small)}.pv .vv{font-size:var(--type-body)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Record · V6</b> at the edge: inside AUGUR a copy keeps its label; what may leave is decided when you copy, and the text that leaves is marked · GSC email marking, data loss prevention</div>
<script>
/*@DATA@*/
/*@LIB@*/
const me = READERS.leah, A = DATA.answer;
const S = { f: 'f5', copied: false };
/* the ways out, worked out from the label's uses: never a list of special cases */
function ways(f) {
  const lb = L(f.label), out = lb.uses.outside;
  const w = [];
  w.push({ id: 'as', w: `“${f.v}”`, ok: out === 'yes' || out === 'ask', s: out === 'no' ? `Not for ${US('outside').long.toLowerCase()}. ${tpl(POL.clauses.outside)}` : out === 'ask' ? `Ask ${P(askFor(lb, 'outside')).name} first.` : 'May leave.', ask: out === 'ask' });
  if (lb.uses.report === 'count') w.push({ id: 'count', w: `“${A.n} of ${A.of} groundings over 12 hours”`, ok: true, s: `A count, none named: PERSONAL comes off by rule 3. It leaves marked ${MK(lb.marking).word}.` });
  w.push({ id: 'link', w: 'A link to the record', ok: true, s: 'Opens only for people who may see it. Nothing leaves but the address.' });
  return w;
}
function render() {
  const f = FACT(S.f), lb = L(f.label), W = ways(f);
  const best = W.find(x => x.ok && x.id !== 'link') || W[W.length - 1];
  const mine = viewFact(f, me);
  if (S.copied && mine.state !== 'open') S.copied = false;
  $('#app').innerHTML = topHTML(['Data Atlas', DATA.record.title, 'Copy'], [['1–3', 'a value'], ['C', 'copy'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <aside class="src"><p class="eyebrow">Copy a value</p><p class="sub">AUGUR can carry a label anywhere inside it. Once text leaves, nothing follows it. So the label has its say at the moment of copying, and the text that leaves carries its marking in words.</p>
      <div class="pickv">${['f5', 'f7', 'f1'].map((id, i) => { const x = FACT(id); return `<button class="pv" aria-pressed="${S.f === id}" data-f="${id}"><span class="k">${i + 1} · ${x.k}</span>${pmHTML(x.label)}<span class="vv">${viewFact(x, me).state === 'open' ? x.v : 'not yours to see'}</span></button>`; }).join('')}</div>
    </aside>
    <section class="lands">
      <div class="land in"><p class="eyebrow">Inside AUGUR</p><h2>${I('file-text', 18)} Pasted into a draft</h2>
        ${S.copied ? `<div class="paste arrive"><span class="hdr">${pmHTML(lb)} ${f.k}</span><span>${f.v}</span><span class="who">${I('link', 12)} from ${DATA.record.title} · label kept: ${markHTML(lb)}</span></div>
        <p class="who">The draft’s banner rises to the strictest part, and readers outside the home floor get the caveat (record V1). Custody records the paste.</p>` : (mine.state !== 'open' ? `<p class="unseen">${I('lock', 12)} Not yours to see, so not yours to copy · ask ${P(mine.ask).name}</p>` : '<p class="who">Nothing copied yet.</p>')}
      </div>
      <div class="land out"><p class="eyebrow">Outside AUGUR · email, a spreadsheet, a chat</p><h2>${I('globe', 18)} What may leave</h2>
        ${S.copied ? `<div class="ways">${W.map(x => `<div class="way ${x.ok ? (x === best ? 'ok' : '') : 'stop'} arrive">${I(x.ok ? (x.ask ? 'hand' : 'check') : 'ban', 16)}<span><span class="${x.ok ? '' : 'stopped'}">${x.w}</span><span class="s">${x.s}</span></span>${x.ok ? `<button class="btn sm ${x === best ? 'go' : ''}">${x.ask ? 'Ask' : 'Copy this'}</button>` : ''}</div>`).join('')}</div>
          <div class="paste arrive"><span class="hdr">${markWord(best.id === 'count' ? { ...lb, desc: [] } : best.id === 'link' ? 'lbOff' : lb)}</span><span>${best.id === 'count' ? `In ${A.n} of ${A.of} groundings this year, the pilot had been on duty for more than 12 hours.` : best.id === 'link' ? 'augur/atlas/' + DATA.record.id : f.v}</span><span class="who">What lands in the email: the marking first, in words, because labels can’t travel as data out here.</span></div>` : '<p class="who">Press C to copy.</p>'}
      </div>
    </section>
  </div></main>`;
  afterRender();
  $$('.pv').forEach(b => b.onclick = () => { S.f = b.dataset.f; S.copied = false; render(); });
}
function replay() { clearLater(); closeDeed(); S.f = 'f5'; S.copied = false; settleIn(); render(); later(() => { S.copied = true; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (/^[1-3]$/.test(e.key)) { S.f = ['f5', 'f7', 'f1'][+e.key - 1]; S.copied = false; render(); }
  if (e.key.toLowerCase() === 'c') { S.copied = true; render(); }
});
replay();
</script>
</body>
</html>
