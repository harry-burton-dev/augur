<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Dataset V6 · Ingredients by weight</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V6: the ingredients list. Parts in order of weight, each with its share; what it contains in bold; and the one part made of people's consent, counted person by person ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(340px,1fr);gap:var(--space-6)}
.ing{display:grid;gap:var(--space-4);align-content:start}
.ing .line{font-weight:300;font-size:var(--type-lead);line-height:calc(var(--leading-lead) + var(--space-2));color:var(--ink)}
.ing .line b{font-weight:var(--x-proposed-mark-weight);color:var(--light)}
.ing .line .pc{font-family:var(--font-mono);font-size:var(--type-meta);color:var(--ink-muted)}
.ing .line button{border-bottom:1px dotted var(--hairline-strong);border-radius:2px}
.ing .line button.on{background:var(--x-proposed-lit-wash);border-bottom-color:var(--x-proposed-lit)}
.stack{display:flex;height:var(--space-5);border-radius:2px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%;background:var(--ink);opacity:.25;transition:opacity var(--motion-base) var(--ease-standard),flex-grow var(--motion-calm) var(--ease-out)}
.stack i.on{opacity:.75}
.pre-fill .stack i{flex-grow:0!important}
.contains{display:grid;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);border-top:var(--x-proposed-mark-rule-2);padding-top:var(--space-3)}
.contains p b{font-weight:var(--x-proposed-mark-weight);color:var(--light)}
.contains .lab{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin-right:var(--space-2)}
.side{display:grid;gap:var(--space-4);align-content:start}
.part{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline);border-radius:var(--radius-inset);font-size:var(--type-meta);line-height:var(--leading-meta)}
.part h2{font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.figs{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.fg{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--x-proposed-type-micro);color:var(--ink-muted)}
.fg[data-s="gave"]{color:var(--light)}
.fg[data-s="declined"]{opacity:var(--x-proposed-quiet)}
.fg[data-s="withdrew"]{color:var(--x-proposed-seam)}
@media (prefers-reduced-motion: reduce){.pre-fill .stack i{flex-grow:1!important}}
@media (max-width:1400px){.ing .line{font-size:var(--type-body);line-height:var(--leading-body)}}
</style>
</head>
<body class="pre pre-fill">
<div class="app" id="app"></div>
<div class="x-cap"><b>Dataset · V6</b> ingredients by weight: parts in order of their share, what they contain in bold, and the part made of consent counted person by person · food ingredient lists (QUID), allergen emphasis, Isotype, consent receipts</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = DSET();
const S = { on: 'dia' };
function render() {
  const parts = [...D.parts].sort((a, b) => b.n - a.n), lb = dsetLabel();
  const p = D.parts.find(x => x.id === S.on);
  const c = p.consent;
  const people = c ? [...Array(c.gave).fill('gave'), ...Array(c.withdrew).fill('withdrew'), ...Array(c.declined).fill('declined')] : [];
  $('#app').innerHTML = topHTML(['Data Atlas', 'Collections', D.title, 'Ingredients'], [['1–5', 'a part'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <section class="ing"><p class="eyebrow">${D.title} · ${fmt(D.records)} records</p><h1 class="title">Ingredients</h1>
      <div class="stack" aria-hidden="true">${parts.map(x => `<i class="${x.id === S.on ? 'on' : ''}" style="flex-grow:${x.n}"></i>`).join('')}</div>
      <p class="line"><span class="muted">Made of</span> ${parts.map((x, i) => `<button class="${x.id === S.on ? 'on' : ''}" data-p="${x.id}">${x.name.toLowerCase()}</button> <span class="pc">${pct(x.n, D.records)}%</span>${L(x.label).desc.length ? ` (<b>${L(x.label).desc.map(d => DS(d).word).join(', ')}</b>)` : ''}`).join(', ')}.</p>
      <div class="contains">
        <p><span class="lab">Contains</span>${lb.desc.map(d => `<b>${DS(d).word}</b> in ${D.parts.filter(x => L(x.label).desc.includes(d)).length} of ${D.parts.length} parts`).join(', ')}</p>
        <p><span class="lab">Given by consent</span><b>${D.parts.filter(x => x.consent).map(x => x.name).join(', ')}</b>: ${c ? `${c.gave} of ${c.asked} people` : `${D.parts.find(x => x.consent).consent.gave} people`}</p>
        <p><span class="lab">Under licence</span>${D.parts.filter(x => x.licence).map(x => `${x.name}: ${x.origin}`).join('')}</p>
        <p><span class="lab">Not for</span>${USE_IDS().filter(u => lb.uses[u] === 'no').map(u => `<b>${US(u).word.toLowerCase()}</b>`).join(', ')}</p>
        <p class="who">Listed by weight, heaviest first, as food law requires of ingredients, so the part that dominates the answers is the one you read first.</p>
      </div>
    </section>
    <aside class="side"><p class="eyebrow">Part · ${pct(p.n, D.records)}% of the collection</p>
      <div class="part dep"><h2>${p.name} · ${p.n}</h2><p>${lineHTML(p.label)}</p><p class="who">${p.origin}. ${p.cover}.</p>
        ${c ? `<p class="eyebrow" style="margin-top:var(--space-2)">One figure per pilot asked</p>
          <div class="figs" role="img" aria-label="${c.gave} gave, ${c.withdrew} withdrew, ${c.declined} declined">${people.map(s => `<span class="fg" data-s="${s}">${I(s === 'declined' ? 'user-round-x' : s === 'withdrew' ? 'user-round-minus' : 'user-round-check', 22)}</span>`).join('')}</div>
          <p class="who">${c.gave} gave · ${c.withdrew} withdrew (their diary has left every answer it reached) · ${c.declined} declined. Those who said no aren’t missing at random: tired pilots may be the ones who declined.</p>` : ''}
        ${p.gap ? `<p class="who">${I('square-dashed', 12)} ${p.gap}</p>` : ''}${p.caution ? `<p class="who">${I('triangle-alert', 12)} ${p.caution}</p>` : ''}</div>
    </aside>
  </div></main>`;
  afterRender();
  $$('[data-p]').forEach(b => b.onclick = () => { S.on = b.dataset.p; render(); });
}
function replay() { clearLater(); closeDeed(); S.on = 'dia'; document.body.classList.add('pre-fill'); settleIn(); render(); later(() => document.body.classList.remove('pre-fill'), MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (/^[1-5]$/.test(e.key)) { S.on = [...D.parts].sort((a, b) => b.n - a.n)[+e.key - 1].id; render(); }
});
replay();
</script>
</body>
</html>
