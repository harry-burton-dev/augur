<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Dataset V5 · Fit for this use?</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V5: the label read against what you mean to do. Say the use; every part answers; the collection says what you can take and what you'd be missing ---- */
.wrap{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-4)}
.ask{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--ink-muted)}
.ask b{font-weight:400;color:var(--light)}
.uses-p{display:flex;gap:var(--space-2);flex-wrap:wrap}
.uses-p button{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);font-size:var(--type-meta);color:var(--ink-muted)}
.uses-p button[aria-pressed="true"]{color:var(--light);border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.body{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:var(--space-6);min-height:0}
.parts{display:grid;gap:var(--space-2);align-content:start}
.pt{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr) auto;gap:var(--space-1) var(--space-3);align-items:start;padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-inset);transition:opacity var(--motion-base) var(--ease-standard),border-color var(--motion-base) var(--ease-standard)}
.pt b{font-weight:400;color:var(--light)}
.pt .s{grid-column:2 / -1;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.pt .n{font:400 var(--type-meta)/var(--leading-meta) var(--font-mono);color:var(--light)}
.pt[data-v="no"]{opacity:var(--x-proposed-quiet);border-style:dashed}
.pt[data-v="no"] > svg{color:var(--x-proposed-stopped)}
.pt[data-v="yes"] > svg{color:var(--x-proposed-lit)}
.pt[data-v="count"] > svg{color:var(--x-proposed-said-other)}
.verdict{display:grid;gap:var(--space-3);align-content:start;padding:var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-card);background:var(--surface-pane)}
.verdict .big{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light)}
.meter{display:flex;height:var(--space-3);border-radius:1px;overflow:hidden;background:var(--x-proposed-unseen)}
.meter i{display:block;height:100%;transition:width var(--motion-calm) var(--ease-out)}
.meter .y{background:var(--ink)}
.meter .c{background:var(--x-proposed-said-other)}
.swap .pt{opacity:0}
@media (max-width:1400px){.ask{font-size:var(--type-lead);line-height:var(--leading-lead)}.pt{padding:var(--space-2)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Dataset · V5</b> fit for this use? say what you mean to do; every part answers yes, as a count, or no with why, and the collection says what you'd be missing · CC licence chooser, Data Nutrition Project "intended use"</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = DSET();
const S = { u: 'safety' };
const WHAT = { ops: 'plan next month’s pilot rota', safety: 'look for patterns in fatigue and groundings', report: 'publish fatigue figures in the annual safety report', appraisal: 'review a pilot’s performance', model: 'have the assistant summarise near misses', outside: 'send it to a university study' };
function render(swap) {
  const u = S.u, rows = D.parts.map(p => ({ p, v: L(p.label).uses[u] }));
  const tot = D.records, y = rows.filter(r => r.v === 'yes').reduce((a, r) => a + r.p.n, 0), c = rows.filter(r => r.v === 'count').reduce((a, r) => a + r.p.n, 0);
  const no = rows.filter(r => r.v === 'no' || r.v === 'ask');
  $('#app').innerHTML = topHTML(['Data Atlas', 'Collections', D.title, 'Fit for use'], [['1–6', 'a use'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <p class="ask">I want to <b>${WHAT[u]}</b> with ${D.title}.</p>
    <div class="uses-p">${USE_IDS().map((x, i) => `<button aria-pressed="${u === x}" data-u="${x}">${I(US(x).icon, 14)} ${i + 1} · ${US(x).word}</button>`).join('')}</div>
    <div class="body">
      <div class="parts ${swap ? 'swap' : ''}" id="parts">${rows.map(({ p, v }) => `<div class="pt" data-v="${v}">${I(v === 'yes' ? 'check' : v === 'count' ? 'hash' : v === 'ask' ? 'hand' : 'ban', 16)}<span><b>${p.name}</b> ${pmHTML(p.label)}</span><span class="n">${p.n}</span>
        <span class="s">${v === 'yes' ? 'Yes.' : v === 'count' ? `Only as counts over ${POL.minGroup} or more, naming none.` : v === 'ask' ? `Ask ${P(askFor(p.label, u)).name}.` : `No. ${p.consent && u !== 'safety' ? 'The pilots’ consents are for the safety investigation only.' : p.licence && ['model', 'outside'].includes(u) ? 'The AIS licence forbids it.' : tpl(POL.clauses[u] || POL.clauses.marking)}`}</span></div>`).join('')}</div>
      <aside class="verdict"><p class="eyebrow">For this use</p>
        <p class="big">${y + c ? `${fmt(y + c)} of ${fmt(tot)} records` : 'None of it'}</p>
        <div class="meter" aria-hidden="true"><i class="y" style="width:${y / tot * 100}%"></i><i class="c" style="width:${c / tot * 100}%"></i></div>
        <p class="who">${y ? `<b>${fmt(y)}</b> as they are` : ''}${y && c ? ' · ' : ''}${c ? `<b>${fmt(c)}</b> as counts only` : ''}${no.length ? ` · without ${andList(no.map(r => r.p.name.toLowerCase()))}` : ''}</p>
        ${no.length && y + c ? `<p class="stopnote">${I('triangle-alert', 14)}<span>What you’d be missing matters: ${no.some(r => r.p.id === 'dia') ? 'without the diaries, “fatigue” means hours on duty only, not sleep.' : `${no.map(r => r.p.name.toLowerCase()).join(', ')} won’t be in it.`}</span></p>` : ''}
        ${!(y + c) ? `<p class="stopnote">${I('ban', 14)}<span>${D.usesWhy[u]}</span></p>` : `<p class="who">${D.usesWhy[u]}</p>`}
        <button class="btn ${y + c ? 'go' : ''}" ${y + c ? '' : 'aria-disabled="true"'}>${I('database', 14)} ${y + c ? 'Take what fits' : 'Nothing to take'}</button>
        <p class="who">Taking it makes a working copy with the label of what you took, and the use you said goes in its custody.</p>
      </aside>
    </div>
  </div></main>`;
  afterRender();
  $$('.uses-p button').forEach(b => b.onclick = () => pick(b.dataset.u));
  if (swap) requestAnimationFrame(() => requestAnimationFrame(() => $('#parts').classList.remove('swap')));
}
function pick(u) { if (u === S.u) return; S.u = u; render(true); }
function replay() { clearLater(); closeDeed(); S.u = 'safety'; settleIn(); render(); later(() => pick('report'), MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (/^[1-6]$/.test(e.key)) pick(USE_IDS()[+e.key - 1]);
});
replay();
</script>
</body>
</html>
