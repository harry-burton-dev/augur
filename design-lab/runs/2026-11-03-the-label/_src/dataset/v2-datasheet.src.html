<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Dataset V2 · Datasheet</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V2: the datasheet. Seven fixed sections of questions; answers from the collection; an unanswered question is a gap with a name ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(240px,20%) minmax(0,1fr);gap:var(--space-6)}
.toc{display:grid;gap:var(--space-1);align-content:start}
.toc button{display:flex;justify-content:space-between;gap:var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);text-align:left}
.toc button[aria-current="true"]{background:var(--surface-raised);color:var(--light)}
.toc .mk{white-space:normal;font-size:var(--x-proposed-type-micro);letter-spacing:var(--tracking-soft)}
.sheet{position:relative}
.toc .g{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.sheet{min-height:0;overflow:auto;display:grid;gap:var(--space-5);align-content:start;padding-right:var(--space-3)}
.sec h2{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light);margin-bottom:var(--space-2)}
.qa{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,1.6fr);gap:var(--space-4);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.qa .q{color:var(--ink-muted)}
.qa .a{color:var(--ink)}
.qa .a b{font-weight:400;color:var(--light)}
.gap{display:flex;gap:var(--space-2);align-items:flex-start;color:var(--ink-muted)}
.gap .mk-gap{flex:none;margin-top:2px}
.sec.on h2{color:var(--x-proposed-lit)}
@media (max-width:1400px){.qa{grid-template-columns:minmax(180px,.7fr) minmax(0,1.6fr);font-size:var(--type-small);line-height:var(--leading-small)}}
</style>
</head>
<body class="pre">
<div class="app" id="app"></div>
<div class="x-cap"><b>Dataset · V2</b> the datasheet: seven fixed sections of questions, answers from the collection, a gap with a name where nobody has answered · Datasheets for Datasets (Gebru and others, 2018)</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = DSET();
const S = { on: 'uses' };
const gap = who => `<span class="gap"><span class="mk-gap" aria-hidden="true"></span><span>Not answered yet. <b>${P(who).name}</b> could answer.</span></span>`;
function sections() {
  const lb = dsetLabel(), dia = D.parts.find(p => p.id === 'dia');
  return [
    { id: 'why', h: 'Motivation', qa: [['Why does it exist?', D.why], ['Who keeps it?', `<b>${P(D.keeper).name}</b>, ${P(D.keeper).role}, on ${F(D.keptOn).name}`], ['Who paid for or asked for it?', gap(D.keeper)]] },
    { id: 'comp', h: 'Composition', qa: [['What is in it?', D.parts.map(p => `${p.n} ${p.name.toLowerCase()}`).join(', ') + ` (${D.records} in all)`], ['Is anything missing?', D.parts.filter(p => p.gap).map(p => p.gap).join(' ')], ['Does it name people?', `Yes. ${D.parts.filter(p => L(p.label).desc.includes('personal')).length} of ${D.parts.length} parts are ${DS('personal').word}.`]] },
    { id: 'coll', h: 'Collection', qa: [['How was it collected?', D.parts.map(p => `<b>${p.name}</b>: ${p.origin.toLowerCase()}`).join('. ') + '.'], ['Did people agree?', `The diaries, yes, one consent each: ${dia.consent.gave} of ${dia.consent.asked} pilots gave, ${dia.consent.declined} declined, ${dia.consent.withdrew} withdrew. The rest is held under the port’s safety duty.`]] },
    { id: 'prep', h: 'Preparation', qa: [['Was anything worked out?', 'Time on duty is worked out from the roster (start to boarding).'], ['Is the raw data kept?', 'Yes, in the roster system and Artifacts.']] },
    { id: 'uses', h: 'Uses', qa: USE_IDS().map(u => [`${US(u).long}?`, `<b>${POL.useWords[lb.uses[u]]}</b>. ${D.usesWhy[u]}`]) },
    { id: 'dist', h: 'Distribution', qa: [['Who may receive it?', `Named people or groups only (${MK(lb.marking).word}). Never outside.`], ['Under what licence?', D.parts.find(p => p.licence).origin + '.']] },
    { id: 'keep', h: 'Maintenance', qa: [['How long is it kept?', D.parts.map(p => `${p.name}: ${keepWord(p.label)}`).join('; ') + '.'], ['When was it last checked?', D.checked + ` by ${P(D.keeper).name}`], ['Known issues?', D.issues.join(' ')], ['How do I report an error?', gap(D.keeper)]] }
  ];
}
function render() {
  const SS = sections();
  $('#app').innerHTML = topHTML(['Data Atlas', 'Collections', D.title, 'Datasheet'], [['↑ ↓', 'a section'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <nav class="toc" aria-label="Sections"><p class="eyebrow">Datasheet · ${D.id}</p>${SS.map(s => `<button aria-current="${S.on === s.id}" data-s="${s.id}">${s.h}<span class="g">${s.qa.filter(q => q[1].includes('mk-gap')).length ? '1 gap' : ''}</span></button>`).join('')}
      <p class="who" style="margin-top:var(--space-3)">${markHTML(dsetLabel())}</p></nav>
    <div class="sheet" id="sheet">${SS.map((s, i) => `<section class="sec dep ${S.on === s.id ? 'on' : ''}" style="--i:${i}" id="s-${s.id}"><h2>${s.h}</h2>${s.qa.map(([q, a]) => `<div class="qa"><span class="q">${q}</span><span class="a">${a}</span></div>`).join('')}</section>`).join('')}</div>
  </div></main>`;
  afterRender();
  $$('.toc button').forEach(b => b.onclick = () => go(b.dataset.s));
}
function go(id) { S.on = id; render(); const sh = $('#sheet'); sh.scrollTo({ top: $('#s-' + id).offsetTop, behavior: reduced ? 'auto' : 'smooth' }); }
function replay() { clearLater(); closeDeed(); S.on = 'why'; settleIn(); render(); $('#sheet').scrollTop = 0; later(() => go('uses'), MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const ids = sections().map(s => s.id); const i = ids.indexOf(S.on); go(ids[(i + (e.key === 'ArrowDown' ? 1 : -1) + ids.length) % ids.length]); }
});
replay();
</script>
</body>
</html>
