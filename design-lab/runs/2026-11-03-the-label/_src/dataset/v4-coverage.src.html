<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Label · Dataset V4 · Coverage</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/*@CSS@*/
/* ---- V4: completeness as a picture. Part by year; each cell's ink is its records; each kind of empty has its own mark and sentence ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:var(--space-6)}
.grid{display:grid;grid-template-columns:minmax(200px,1.2fr) repeat(6,minmax(0,1fr)) auto;gap:2px;align-content:start}
.grid .h{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);color:var(--ink-muted);padding:var(--space-2) var(--space-1);text-align:center}
.grid .nm{display:grid;gap:2px;padding:var(--space-2) var(--space-3) var(--space-2) 0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--light)}
.grid .nm .who{font-size:var(--type-small)}
.cell{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:var(--space-2) var(--space-1);min-height:calc(var(--space-7) + var(--space-2));border-radius:2px;background:var(--surface-inset);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.cell .ink{position:absolute;left:var(--space-2);right:var(--space-2);bottom:calc(var(--space-5));background:var(--ink);opacity:.8;border-radius:1px;transform-origin:bottom;transition:transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i) * var(--motion-instant))}
.pre-fill .cell .ink{transform:scaleY(0)}
.cell[data-k="none"]{background:repeating-linear-gradient(45deg,transparent 0 calc(var(--space-1) - 1px),var(--x-proposed-hatch) calc(var(--space-1) - 1px) var(--space-1)),var(--surface-inset)}
.cell[data-k="na"]{background:none;border:1px dashed var(--hairline)}
.cell[data-k="caution"]{box-shadow:inset 0 2px 0 var(--x-proposed-disagree)}
.cell .flag{position:absolute;top:var(--space-1);right:var(--space-1)}
.cell.on{outline:var(--focus-ring) solid var(--x-proposed-lit);outline-offset:1px}
.tot{font:400 var(--type-meta)/var(--leading-meta) var(--font-mono);color:var(--light);padding:var(--space-2);align-self:center}
.legend{display:grid;gap:var(--space-3);align-content:start}
.lg{display:grid;grid-template-columns:calc(var(--space-6) + var(--space-2)) minmax(0,1fr);gap:var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta)}
.lg .sw{height:var(--space-5);border-radius:2px;background:var(--surface-inset);position:relative}
.lg b{font-weight:400;color:var(--light)}
.notes{display:grid;gap:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);border-top:1px solid var(--hairline);padding-top:var(--space-3)}
.notes p{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2)}
.notes p.on{color:var(--light)}
@media (prefers-reduced-motion: reduce){.pre-fill .cell .ink{transform:none;opacity:0}}
@media (max-width:1400px){.cell{min-height:var(--space-7)}}
</style>
</head>
<body class="pre pre-fill">
<div class="app" id="app"></div>
<div class="x-cap"><b>Dataset · V4</b> coverage: part by year, ink by records; none, a gap, doesn't apply and a caution each have their own mark and sentence · six ways to be empty, Bertin's reorderable matrix</div>
<script>
/*@DATA@*/
/*@LIB@*/
const D = DSET();
const S = { on: null };
const MARK = { none: ['No record', 'Time the system lost. Can’t be recovered.', 'circle-off'], gap: ['A gap', 'Exists somewhere, not entered yet. Someone could fill it.', 'square-dashed'], na: ['Doesn’t apply', 'There was nothing to record then.', 'minus'], caution: ['Read with care', 'Held, but what it measures changed.', 'triangle-alert'] };
function render() {
  const max = Math.max(...D.parts.flatMap(p => D.byYear[p.id].n));
  const notes = [];
  $('#app').innerHTML = topHTML(['Data Atlas', 'Collections', D.title, 'Coverage'], [['click', 'a mark'], ...STD_HINTS]) +
  `<main class="main"><div class="wrap">
    <section style="display:flex;flex-direction:column;gap:var(--space-4);min-height:0"><div><p class="eyebrow">${D.title} · ${markWord(dsetLabel())}</p><h1 class="title">Coverage</h1></div>
      <div class="grid" role="table"><span></span>${D.years.map(y => `<span class="h">${y}</span>`).join('')}<span class="h">All</span>
      ${D.parts.map((p, r) => { const b = D.byYear[p.id]; return `<span class="nm">${p.name}<span class="who">${pmHTML(p.label)} ${p.origin.split(',')[0]}</span></span>` +
        D.years.map((y, c) => { const m = b.marks[y], n = b.n[c]; if (m && m.t) notes.push({ id: p.id + y, k: m.k, t: `${p.name}, ${y}: ${m.t}`, who: m.k === 'gap' ? D.keeper : null });
          return `<button class="cell ${S.on === p.id + y ? 'on' : ''}" style="--i:${r + c}" data-k="${m ? m.k : ''}" data-n="${p.id + y}" aria-label="${p.name} ${y}: ${n} records${m ? ', ' + MARK[m.k][0] : ''}">${n ? `<span class="ink" style="height:calc((100% - var(--space-6)) * ${n / max})"></span>` : ''}${m ? `<span class="flag">${I(MARK[m.k][2], 12)}</span>` : ''}${n || (m && m.k === 'na' ? '' : '0')}</button>`; }).join('') +
        `<span class="tot">${p.n}</span>`; }).join('')}
      </div>
    </section>
    <aside class="legend"><p class="eyebrow">Each empty says which kind</p>
      ${Object.entries(MARK).map(([k, [w, t, ic]]) => `<div class="lg"><span class="cell sw" data-k="${k}"><span class="flag">${I(ic, 12)}</span></span><span><b>${w}.</b> ${t}</span></div>`).join('')}
      <div class="notes">${notes.map(n => `<p class="${S.on === n.id ? 'on' : ''}" data-note="${n.id}">${I(MARK[n.k][2], 14)}<span>${n.t}${n.who ? ` <b class="lite" style="font-weight:400">${P(n.who).name}</b> could enter them.` : ''}</span></p>`).join('')}</div>
    </aside>
  </div></main>`;
  afterRender();
  $$('.cell[data-n]').forEach(c => c.onclick = () => light(c.dataset.n));
}
function light(id) { S.on = id; $$('.cell[data-n]').forEach(c => c.classList.toggle('on', c.dataset.n === id)); $$('[data-note]').forEach(n => n.classList.toggle('on', n.dataset.note === id)); }
function replay() { clearLater(); closeDeed(); S.on = null; document.body.classList.add('pre-fill'); settleIn(); render(); later(() => document.body.classList.remove('pre-fill'), MOMENT() * .6); later(() => light('ros2023'), MOMENT() + ms('--motion-calm')); }
document.addEventListener('keydown', e => { if (commonKeys(e, render, replay)) return; });
replay();
</script>
</body>
</html>
