<style>
/* ---------------------------------------------------------------
   Proposed tokens. All are mixes of kit tokens; each is listed as
   "needs token" in the notes. Marks carried from earlier runs first.
   --------------------------------------------------------------- */
:root{
  /* six ways to be empty (catalogue run) */
  --x-proposed-gap-ink: color-mix(in srgb, var(--ink-muted) 78%, transparent);
  --x-proposed-hatch: color-mix(in srgb, var(--ink-muted) 34%, transparent);
  --x-proposed-unseen: repeating-linear-gradient(135deg, transparent 0 calc(var(--space-1) - 1px), var(--hairline-strong) calc(var(--space-1) - 1px) var(--space-1));
  --x-proposed-disagree: color-mix(in srgb, var(--warning) 70%, var(--ink));
  --x-proposed-disagree-wash: color-mix(in srgb, var(--warning) 7%, transparent);
  --x-proposed-quiet: .62;
  --x-proposed-type-micro: .6875rem;
  /* the lit next step (light language) */
  --x-proposed-lit: color-mix(in srgb, var(--green) 80%, var(--light));
  --x-proposed-lit-wash: color-mix(in srgb, var(--green) 9%, transparent);
  /* pencil (reference desk) */
  --x-proposed-pencil: color-mix(in srgb, var(--ink-muted) 70%, transparent);
  --x-proposed-pencil-wash: color-mix(in srgb, var(--ink) 3%, transparent);
  /* seam (wear and time, briefing) */
  --x-proposed-seam: color-mix(in srgb, var(--info) 70%, var(--ink));
  --x-proposed-seam-wash: color-mix(in srgb, var(--info) 8%, transparent);

  /* NEW in this run: the label is carried by type and rule, never by a new colour.
     A marking's strength is its rule weight: one hairline, a double rule, or "not kept here". */
  --x-proposed-mark-ink: var(--light);
  --x-proposed-mark-rule-1: 1px solid var(--hairline-strong);
  --x-proposed-mark-rule-2: 3px double color-mix(in srgb, var(--ink) 70%, transparent);
  /* a descriptor (PERSONAL, COMMERCIAL) is set bold, the way allergens are */
  --x-proposed-mark-weight: 600;
  /* the transform: a value said another way for this reader (name -> role, value -> count) */
  --x-proposed-said-other: color-mix(in srgb, var(--info) 55%, var(--ink));
  --x-proposed-said-other-wash: color-mix(in srgb, var(--info) 6%, transparent);
  /* what the label stops: a struck value, the warning edge, never red */
  --x-proposed-stopped: color-mix(in srgb, var(--warning) 62%, var(--ink-muted));
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-muted)}
.lite{color:var(--light)}
.kbd{display:inline-block;font:400 var(--x-proposed-type-micro)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1);color:var(--ink);min-width:1.6em;text-align:center}
.hints{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);align-items:center;font:400 var(--x-proposed-type-micro)/1.6 var(--font-mono);color:var(--ink-muted)}
.hints span{display:inline-flex;gap:var(--space-1);align-items:center;white-space:nowrap}
.hints .on{color:var(--x-proposed-lit)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
h1,h2,h3,p{margin:0}

/* floors */
[data-tier="department"]{--fc:var(--floor-department-high);--fl:var(--floor-department-low)}
[data-tier="team"]{--fc:var(--floor-team-high);--fl:var(--floor-team-low)}
[data-tier="org"]{--fc:var(--floor-org-high);--fl:var(--floor-org-low)}

.fchip::before{content:"";width:var(--space-4);height:2px;background:var(--fc);border-radius:1px}
.fword{color:var(--fc)}

/* two registers: the admin line one step down, shown with T */
.tk{display:none;font:400 var(--x-proposed-type-micro)/1.5 var(--font-mono);color:var(--ink-muted);opacity:var(--x-proposed-quiet);margin:0}
.tech .tk{display:block}
.tech span.tk{display:inline}

/* six ways to be empty: not yours to see, not known yet */
.unseen{display:inline-flex;align-items:center;gap:var(--space-1);background:var(--x-proposed-unseen),var(--surface-inset);border:1px solid var(--hairline);border-radius:2px;padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-small);line-height:var(--leading-small);vertical-align:1px;white-space:nowrap}
.mk-gap{display:inline-block;width:var(--space-5);height:var(--space-4);vertical-align:-3px;--t:var(--space-1);
  background:
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right top / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) left bottom / 1px var(--t) no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / var(--t) 1px no-repeat,
    linear-gradient(var(--x-proposed-gap-ink),var(--x-proposed-gap-ink)) right bottom / 1px var(--t) no-repeat}

/* ---------------- the label ---------------- */
/* marking: mono caps; strength is the rule (one hairline, a double rule) */
.mk{display:inline-flex;align-items:center;gap:var(--space-2);font:500 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--x-proposed-mark-ink);padding:1px var(--space-2);border:var(--x-proposed-mark-rule-1);border-radius:2px;white-space:nowrap;vertical-align:1px}
.mk[data-rank="1"]{border:var(--x-proposed-mark-rule-2);padding:0 var(--space-2)}
.mk[data-rank="2"]{border:1px dashed var(--hairline-strong);color:var(--ink-muted)}
.mk .ds{font-weight:var(--x-proposed-mark-weight)}
.mk .sep{opacity:var(--x-proposed-quiet)}
.mk.big{font-size:var(--type-meta);line-height:var(--leading-meta);padding:var(--space-1) var(--space-3)}
/* portion mark, at the start of a paragraph or a value: (O-S P) */
.pm{font:500 var(--x-proposed-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);white-space:nowrap;vertical-align:1px}
.pm[data-rank="1"]{color:var(--x-proposed-mark-ink)}
.pm b{font-weight:var(--x-proposed-mark-weight)}
/* uses: a symbol each, with a word; "no" is struck, "ask" is outlined, "count" has a hash */
.uses{display:inline-flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2);align-items:center}
.use{position:relative;display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);white-space:nowrap}
.use .ic{position:relative;display:inline-flex;align-items:center;justify-content:center;width:calc(var(--space-4) + var(--space-1));height:calc(var(--space-4) + var(--space-1));border-radius:var(--radius-pill);border:1px solid var(--hairline-strong);color:var(--ink)}
.use[data-v="no"]{color:var(--ink-muted)}
.use[data-v="no"] .ic{color:var(--ink-muted);border-color:var(--hairline)}
.use[data-v="no"] .ic::after{content:"";position:absolute;inset:2px;background:linear-gradient(135deg,transparent calc(50% - .75px),var(--ink-muted) calc(50% - .75px),var(--ink-muted) calc(50% + .75px),transparent calc(50% + .75px))}
.use[data-v="ask"] .ic{border-style:dashed}
.use[data-v="count"] .ic{border-style:dotted}
.use .w{max-width:16ch;overflow:hidden;text-overflow:ellipsis}
.uses.compact .w{display:none}
/* the one-line label: marking · uses · keep · origin, fixed order */
.lbl{display:inline-flex;flex-wrap:wrap;align-items:center;gap:var(--space-1) var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.lbl .k{display:inline-flex;align-items:center;gap:var(--space-1);white-space:nowrap}
.lbl .k svg{opacity:.8}
.lbl .k b{font-weight:400;color:var(--ink)}
/* explain button: every label part is one */
.why{border-radius:2px}
.why:hover .mk,.why:hover{color:var(--light)}
/* the deed: plain words behind a label */
.deed{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));box-shadow:var(--shadow-overlay);font-size:var(--type-meta);line-height:var(--leading-meta);max-width:var(--measure-glance)}
.deed .row{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:var(--space-2);align-items:start}
.deed .row > svg{margin-top:2px;color:var(--ink-muted)}
.deed .row b{font-weight:400;color:var(--light)}
.deed .who{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
/* said another way for this reader */
.said{color:var(--x-proposed-said-other);border-bottom:1px dotted var(--x-proposed-said-other);background:var(--x-proposed-said-other-wash);padding:0 2px;border-radius:2px}
/* stopped by the label */
.stopped{text-decoration:line-through;text-decoration-color:var(--x-proposed-stopped);text-decoration-thickness:1.5px;color:var(--ink-muted)}
.stopnote{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink);border-left:2px solid var(--x-proposed-stopped);padding:var(--space-1) var(--space-3);background:var(--x-proposed-disagree-wash)}
.stopnote svg{flex:none;margin-top:1px;color:var(--x-proposed-stopped)}
/* GSC-style banner, head and foot */
.banner{display:flex;justify-content:center;align-items:center;gap:var(--space-3);padding:var(--space-1) var(--space-4);font:500 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--x-proposed-mark-ink);border-top:var(--x-proposed-mark-rule-1);border-bottom:var(--x-proposed-mark-rule-1)}
.banner[data-rank="1"]{border-top:var(--x-proposed-mark-rule-2);border-bottom:var(--x-proposed-mark-rule-2)}
.banner .r{font:400 var(--type-small)/var(--leading-small) var(--font-sans);letter-spacing:0;text-transform:none;color:var(--ink-muted)}

/* pencil and ink */
.pencil{border:1px dotted var(--x-proposed-pencil);background:var(--x-proposed-pencil-wash);border-radius:var(--radius-key);padding:var(--space-2) var(--space-3)}
.pencil .pt{font-style:italic;color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-4);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink);white-space:nowrap;transition:background var(--motion-quick) var(--ease-standard),border-color var(--motion-quick) var(--ease-standard)}
.btn:hover{background:var(--surface-raised)}
.btn.go{border-color:var(--x-proposed-lit);color:var(--light);background:var(--x-proposed-lit-wash)}
.btn.sm{height:calc(var(--target-sm) - var(--space-2));padding:0 var(--space-3);font-size:var(--type-small)}
.btn[aria-disabled="true"]{opacity:var(--x-proposed-quiet);cursor:not-allowed}
.lock{display:inline-flex;align-items:center;justify-content:center;width:var(--space-4);height:var(--space-4);border-radius:2px;background:var(--x-proposed-unseen);border:1px solid var(--hairline);color:var(--ink-muted);flex:none}

/* app frame */
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb,var(--slate-deep) 70%,transparent);min-width:0}
.brand{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);white-space:nowrap;min-width:0;overflow:hidden}
.crumb b{font-weight:400;color:var(--light)}
.crumb svg{opacity:var(--x-proposed-quiet);flex:none}
.top .hints{margin-left:auto;justify-content:flex-end}
.main{min-height:0;padding:var(--space-4) var(--edge) calc(var(--space-6) + var(--space-1));overflow:hidden}
.title{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.sub{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);max-width:var(--measure-read)}
.pane{border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-pane)}
.who{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.who b{font-weight:400;color:var(--ink)}

/* deposit, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-instant))}
.pre .dep{opacity:0;transform:translateY(var(--space-1))}
@media (prefers-reduced-motion: reduce){.pre .dep{transform:none}.dep{transition-delay:0ms}}
.lit{box-shadow:0 0 0 1px var(--x-proposed-lit), 0 0 var(--glow-blur) var(--x-proposed-lit-wash)}
.x-cap{max-width:calc(100vw - 2 * var(--edge-tight))}

/* ---- V1: a record you can't open is a closed file cover: its title, its marking, why it's closed to you, and whose hand opens it ---- */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,.9fr);gap:var(--space-6);align-items:start}
.cover{position:relative;display:grid;gap:var(--space-4);padding:var(--space-6) var(--space-6) var(--space-5);border:1px solid var(--hairline-strong);border-radius:var(--radius-key) var(--radius-inset) var(--radius-inset) var(--radius-key);background:var(--x-proposed-unseen),var(--surface-pane);box-shadow:var(--shadow-raised)}
.cover::before{content:"";position:absolute;top:calc(var(--space-4) * -1);left:var(--space-5);width:calc(var(--space-8) + var(--space-6));height:var(--space-4);border:1px solid var(--hairline-strong);border-bottom:0;border-radius:var(--radius-key) var(--radius-key) 0 0;background:var(--surface-pane)}
.cover h1{font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);color:var(--light)}
.cover .grid{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-3)) minmax(0,1fr);gap:var(--space-2) var(--space-4);font-size:var(--type-meta);line-height:var(--leading-meta);background:var(--surface-pane);padding:var(--space-3) var(--space-4);border-radius:var(--radius-key)}
.cover .grid .h{font:400 var(--type-label)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.cover .grid b{font-weight:400;color:var(--light)}
.cover .yours{display:grid;gap:var(--space-1);background:var(--surface-pane);padding:var(--space-3) var(--space-4);border-radius:var(--radius-key);font-size:var(--type-meta);line-height:var(--leading-meta)}
.ask{display:grid;gap:var(--space-3);padding:var(--space-4) var(--space-5);border:1px solid var(--hairline-strong);border-radius:var(--radius-card);background:var(--surface-overlay);box-shadow:var(--shadow-overlay);transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out)}
.ask.shut{opacity:0;transform:translateY(var(--travel-near));pointer-events:none}
.ask h2{font-weight:300;font-size:var(--type-heading);line-height:var(--leading-heading);color:var(--light)}
.purps{display:grid;gap:var(--space-1)}
.pu{display:grid;grid-template-columns:var(--space-5) minmax(0,1fr);gap:0 var(--space-2);padding:var(--space-2) var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);text-align:left;font-size:var(--type-meta);line-height:var(--leading-meta)}
.pu[aria-checked="true"]{border-color:var(--x-proposed-lit);background:var(--x-proposed-lit-wash)}
.pu[aria-disabled="true"]{cursor:not-allowed;color:var(--ink-muted)}
.pu .s{grid-column:2;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.row2{display:flex;gap:var(--space-3);align-items:center;justify-content:space-between}
@media (max-width:1400px){.cover{padding:var(--space-5) var(--space-4) var(--space-4)}.ask{padding:var(--space-3) var(--space-4)}.pu{padding:var(--space-1) var(--space-2)}}
</style>

<script>

   and nothing in the markup or scripts repeats any of it. S swaps in a second deployment's policy. */

  /* ---- the deployment's handling policy: the only place marking words live ---- */
  policies: [
    {
      id: 'gsc', name: 'Information handling policy', version: 'v3 · April 2026', owner: 'p4', basis: 'UK Government Security Classifications',
      markings: {

  const cnt = USE_IDS().filter(u => lb.uses[u] === 'count').map(u => US(u).word.toLowerCase());
  const ask = USE_IDS().filter(u => lb.uses[u] === 'ask').map(u => US(u).word.toLowerCase() + ' (ask ' + P(askFor(lb, u)).name + ')');
  const no = USE_IDS().filter(u => lb.uses[u] === 'no').map(u => US(u).word.toLowerCase());
  rows.push(['circle-check', `<b>May be used for</b> ${andList(yes) || 'nothing yet'}${cnt.length ? `; ${andList(cnt)} only as a count` : ''}${ask.length ? `; ${andList(ask)}` : ''}.${no.length ? ` <b>Not for</b> ${andList(no)}.` : ''}`]);
  if (lb.caveat) rows.push(['corner-down-right', `<b>Caveat</b>: ${tpl(lb.caveat.plain)}`]);
  rows.push(['hourglass', `<b>Kept</b> ${keepWord(lb)}${lb.keepDate ? ` (${lb.keepDate})` : ''}.`]);
  if (extra.origin) rows.push(['file-text', `<b>From</b> ${extra.origin}`]);
  rows.push(['message-square-text', `<b>Why this label</b>: ${lb.why} Set by ${P(lb.setBy).name}.`]);
  return `<div class="deed" role="dialog" aria-label="What this label means">${rows.map(([i, t]) => `<div class="row">${I(i, 14)}<span>${t}</span></div>`).join('')}
    <p class="who">${I('user-round', 12)} Anyone may make it stricter. Only <b>${ch.name}</b> (${ch.role}) may make it less strict. From ${POL.name}, ${POL.version}.</p>
    <p class="tk">label=${Object.keys(DATA.labels).find(k => DATA.labels[k] === lb)} · marking=${lb.marking} · desc=[${lb.desc}] · keep=${lb.keep}${lb.caveat ? ' · caveat=' + lb.caveat.id : ''}</p></div>`;
}

/* combining labels: the strictest marking wins, uses narrow, each part keeps its own keep-until */
function combine(ids) {
  const ls = ids.map(L);
  const top = Math.max(...ls.map(l => MK(l.marking).rank));
  const marking = Object.keys(POL.markings).find(k => POL.markings[k].rank === top);
  const desc = [...new Set(ls.flatMap(l => l.desc))];
  const uses = {};
  USE_IDS().forEach(u => { uses[u] = ls.map(l => l.uses[u]).sort((a, b) => USE_ORDER[a] - USE_ORDER[b])[0]; });
  const causes = ids.filter(id => MK(L(id).marking).rank === top);
  const narrowedBy = {};
  USE_IDS().forEach(u => { narrowedBy[u] = ids.filter(id => L(id).uses[u] === uses[u] && uses[u] !== 'yes'); });
  return { marking, desc, uses, causes, narrowedBy, keep: ls.map(l => l.keep), setBy: ls[0].setBy, why: 'Combined from its parts.', caveat: ls.find(l => l.caveat)?.caveat };
}

/* what a reader sees of a fact */
function viewFact(f, reader) {
  const lb = L(f.label);
  const share = DATA.shares.find(s => s.to === reader.person && s.facts.includes(f.id));
  const consent = DATA.consents.find(c => c.facts.includes(f.id));
  if (consent) {
    if (consent.to === reader.person) return { state: 'open', via: 'consent', consent };
    return { state: 'unseen', why: 'Given by the person it is about, to one investigator only.', ask: consent.subject, askWhy: 'only they can extend their consent' };
  }
  if (canOpen(f.keptOn, reader.floor)) return { state: 'open' };
  if (share) return { state: 'open', via: 'share', share };
  if (lb.desc.some(d => DS(d).hideExistence)) return { state: 'hidden' };
  if (lb.caveat && lb.caveat.other) return { state: 'said', text: lb.caveat.other, why: tpl(lb.caveat.plain) };
  if (lb.caveat) return { state: 'unseen', why: tpl(lb.caveat.plain), ask: lb.setBy, counted: true };
  return { state: 'unseen', why: `Kept by ${F(f.keptOn).name}.`, ask: lb.setBy };
}

/* top bar */
function topHTML(crumbs, hints, viewer) {
  const me = P(viewer || DATA.me);
  return `<header class="top"><p class="brand">AUGUR</p>
    <nav class="crumb" aria-label="Where you are">${crumbs.map((c, i) => (i ? I('chevron-right', 14) : '') + (i === crumbs.length - 1 ? `<b>${c}</b>` : `<span>${c}</span>`)).join('')}</nav>
    <span class="fchip" data-tier="${tierOf(me.floor)}">${me.name} · ${F(me.floor).name}</span>
    <div class="hints">${hints.map(([k, w, id]) => `<span ${id ? `id="${id}"` : ''}><span class="kbd">${k}</span>${w}</span>`).join('')}</div></header>`;
}
const STD_HINTS = [['R', 'replay'], ['T', 'admin words', 'h-t'], ['S', 'other policy', 'h-s']];

/* one popover for every "explained in a click": any [data-why] opens the label's deed */
let DEED = null;
function openDeed(el) {
  closeDeed();
  const lb = el.dataset.why === '@' ? window.__label?.() : el.dataset.why;
  if (!lb) return;
  const box = document.createElement('div');
  box.className = 'deedpop';
  box.style.cssText = `position:fixed;z-index:var(--layer-overlay);`;
  box.innerHTML = deedHTML(lb, { origin: el.dataset.origin });
  document.body.appendChild(box); Icons.hydrate(box);
  const r = el.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(16, Math.min(r.left, innerWidth - w - 16)) + 'px';
  box.style.top = (r.bottom + h + 8 < innerHeight ? r.bottom + 6 : Math.max(8, r.top - h - 6)) + 'px';
  el.setAttribute('aria-expanded', 'true'); DEED = { box, el };
}
function closeDeed() { if (DEED) { DEED.box.remove(); DEED.el.setAttribute('aria-expanded', 'false'); DEED = null; } }
document.addEventListener('click', e => {
  const w = e.target.closest('[data-why]');
  if (w) { e.stopPropagation(); if (DEED && DEED.el === w) closeDeed(); else openDeed(w); return; }
  if (DEED && !e.target.closest('.deedpop')) closeDeed();
});
const whyBtn = (lb, inner, origin = '') => `<button class="why" data-why="${lb}" aria-expanded="false" ${origin ? `data-origin="${origin.replace(/"/g, '&quot;')}"` : ''} aria-label="What this label means">${inner}</button>`;

/* keys shared by every page */
const STATE = { tech: false };
function commonKeys(e, rerender, replay) {
  const k = e.key.toLowerCase();
  if (e.metaKey || e.ctrlKey || e.altKey) return false;
  if (e.key === 'Escape' && DEED) { closeDeed(); return true; }
  if (k === 'r') { closeDeed(); replay(); return true; }
  if (k === 't') { STATE.tech = !STATE.tech; document.body.classList.toggle('tech', STATE.tech); $('#h-t')?.classList.toggle('on', STATE.tech); return true; }
  if (k === 's') { closeDeed(); POL = POL === DATA.policies[0] ? DATA.policies[1] : DATA.policies[0]; rerender(); $('#h-s')?.classList.toggle('on', POL !== DATA.policies[0]); return true; }
  return false;
}
function settleIn() {
  document.body.classList.add('pre');
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('pre')));
}
function afterRender(root) { Icons.hydrate(root || document.body); document.body.classList.toggle('tech', STATE.tech); $('#h-t')?.classList.toggle('on', STATE.tech); $('#h-s')?.classList.toggle('on', POL !== DATA.policies[0]); }

/* timers for the auto demo, cleared on replay */
let TIMERS = [];
const later = (fn, t) => TIMERS.push(setTimeout(fn, reduced ? Math.min(t, 50) : t));
const clearLater = () => { TIMERS.forEach(clearTimeout); TIMERS = []; };
const MOMENT = () => ms('--motion-run');

/* readers used across the run */
const READERS = {
  kofi: { person: 'p2', floor: 'pil' },
  leah: { person: 'p1', floor: 'mops' },
  sam:  { person: 'p7', floor: 'vts' },
  owen: { person: 'p9', floor: 'com' }
};
/* a fact's value as this reader gets it: open, said another way, not yours to see, or not there at all */
function valueHTML(f, reader, opt = {}) {
  const v = viewFact(f, reader), lb = L(f.label);
  if (v.state === 'open') return `<span class="val">${f.v}</span>`;
  if (v.state === 'said') return `<span class="said" title="${v.why}">${v.text}</span>`;
  if (v.state === 'hidden') return '';
  return `<span class="unseen">${I('lock', 12)} ${v.counted ? 'counted, not shown' : 'not yours to see'} · ask ${P(v.ask).name}</span>`;
}
const GLOMAR = () => tpl(POL.rules[3]);

/* sharing: what the label lets through to a target, paragraph by paragraph */
const TG = id => DATA.targets.find(t => t.id === id);
const tgName = t => t.kind === 'outside' ? DATA.groups[t.ref].name : t.kind === 'group' ? DATA.groups[t.ref].name : F(t.ref).name;
function shareCheck(t) {
  return DATA.briefing.paras.map(p => {
    const lb = L(p.label), os = MK(lb.marking).rank >= 1;
    if (p.stop) return { p, v: 'stop', why: p.stop, fix: 'Leave it out. The count before it says the same without naming anyone.' };
    if (t.kind === 'outside') {
      const u = lb.uses.outside;
      if (u === 'no') return { p, v: 'stop', why: `${US('outside').long}: ${POL.useWords.no}. ${tpl(POL.clauses.outside)}`, fix: 'Send the paper without it.' };
      if (u === 'ask') return { p, v: 'ask', who: askFor(lb, 'outside'), why: `${US('outside').long}: ${POL.useWords.ask}.` };
      return { p, v: 'ok' };
    }
    if (os && (t.kind === 'floor' || t.people >= F(t.floor).people)) return { p, v: 'stop', why: `${MK(lb.marking).word} goes to named people or groups, never a whole floor.`, fix: 'Send it to a named group, or send the paper without it.' };
    if (p.said) return { p, v: 'said', why: `Already a count over ${DATA.answer.of} groundings, none named.` };
    return { p, v: 'ok' };
  });
}
const paraLabel = p => p.said ? { ...L(p.label), desc: [] } : L(p.label);
function paperLabel(checks) {
  const pass = checks.filter(c => c.v !== 'stop').map(c => paraLabel(c.p));
  return combine(pass.length ? pass : ['lbOff']);
}

/* a collection's own label, worked out from its parts */
const DSET = () => DATA.dataset;
const partLabel = id => L(DSET().parts.find(p => p.id === id).label);
const dsetLabel = () => combine(DSET().parts.map(p => p.label));
const pct = (a, b) => Math.round(a / b * 100);

/* custody helpers */
const handName = h => !h ? '' : DATA.people[h] ? P(h).name : DATA.hands[h].name;
const handIcon = h => DATA.people[h] ? 'user-round' : DATA.hands[h].icon;
const toName = k => !k.to ? '' : DATA.people[k.to] ? P(k.to).name : DATA.groups[k.to].name;
const actWord = k => k.act[0].toUpperCase() + k.act.slice(1);

const R = DATA.record, me = READERS.owen, keeper = P(R.keeper);
const S = { open: false, pick: 'ops' };
function render() {
  const lb = L('lbOff'), mine = R.facts.filter(f => viewFact(f, me).state === 'open');
  const anyLb = combine(R.facts.filter(f => viewFact(f, me).state !== 'hidden').map(f => f.label));
  $('#app').innerHTML = topHTML(['Search', '“Marlow Star”', R.title], [['A', 'ask'], ['↑ ↓', 'a purpose'], ...STD_HINTS], me.person) +
  `<main class="main"><div class="wrap">
    <article class="cover dep">
      <p class="eyebrow">${R.app} · ${R.kind} · ${R.id}</p>
      <h1>${R.title}</h1>
      <div class="grid">
        <span class="h">Marking</span><span>${whyBtn('lbOff', markHTML(lb))} <span class="who">on its title and outline. Some values inside are ${markWord(anyLb)}.</span></span>
        <span class="h">Why closed</span><span>It is kept by <b>${F(R.keptOn).name}</b>. You are in ${F(me.floor).name}, and your floor doesn’t reach it.</span>
        <span class="h">Who opens it</span><span><b>${keeper.name}</b>, ${keeper.role}, keeps it. She can share it with you for a purpose, until a date. Values inside with their own labels stay with their own keepers.</span>
        <span class="h">You can say</span><span>That it exists, its title and that it is kept by ${F(R.keptOn).name}. Its title is ${MK(lb.marking).word}.</span>
      </div>
      ${mine.length ? `<div class="yours"><p class="eyebrow">Yours already</p>${mine.map(f => `<p>${pmHTML(f.label)} ${f.k}: <b class="lite" style="font-weight:400">${f.v}</b> <span class="who">kept by ${F(f.keptOn).name}</span></p>`).join('')}</div>` : ''}
      <div class="row2"><span class="who">${I('info', 12)} ${GLOMAR()}</span><button class="btn go" data-ask>${I('hand', 14)} Ask ${first(keeper.name)} <span class="kbd">A</span></button></div>
    </article>
    <section class="ask ${S.open ? '' : 'shut'}" role="dialog" aria-label="Ask to open" aria-hidden="${!S.open}">
      <p class="eyebrow">Ask ${keeper.name} · ${R.title}</p>
      <h2>What do you need it for?</h2>
      <p class="sub">A share is for a purpose and until a date. Only purposes the record’s labels allow are offered; the rest stay listed, with why.</p>
      <div class="purps" role="radiogroup">${USE_IDS().map(u => { const v = lb.uses[u]; const ok = v === 'yes' || v === 'ask'; const no = L('lbName').uses[u] === 'no';
        return `<button class="pu" role="radio" data-u="${u}" aria-checked="${S.pick === u}" aria-disabled="${!ok}">${I(US(u).icon, 16)}<span>${US(u).long}</span><span class="s">${!ok ? `Not allowed for this record (${POL.useWords[v]}). No one can grant it.` : no ? `Allowed for the record. The pilot’s name and hours inside are kept back for this.` : v === 'ask' ? `Also needs ${P(askFor(lb, u)).name}.` : 'Allowed.'}</span></button>`; }).join('')}</div>
      <div class="row2"><span class="who">Until <b>31 Jan 2027</b> · ${keeper.name} sees your purpose and the record’s labels, already checked.</span><button class="btn go">${I('send', 14)} Send</button></div>
    </section>
  </div></main>`;
  afterRender();
  $('[data-ask]').onclick = () => { S.open = true; render(); };
  $$('.pu').forEach(b => b.onclick = () => { if (b.getAttribute('aria-disabled') === 'true') return; S.pick = b.dataset.u; render(); });
}
function replay() { clearLater(); closeDeed(); S.open = false; S.pick = 'ops'; settleIn(); render(); later(() => { S.open = true; render(); }, MOMENT()); }
document.addEventListener('keydown', e => {
  if (commonKeys(e, render, replay)) return;
  if (e.key.toLowerCase() === 'a') { S.open = !S.open; render(); }
  if (S.open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const ok = USE_IDS().filter(u => ['yes', 'ask'].includes(L('lbOff').uses[u])); const i = ok.indexOf(S.pick); S.pick = ok[(i + (e.key === 'ArrowDown' ? 1 : -1) + ok.length) % ok.length]; render(); }
});
replay();
</script>
</body>
</html>
