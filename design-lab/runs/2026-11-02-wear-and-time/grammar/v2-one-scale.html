<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar · V2 · One scale</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
:root{
  --x-seam: color-mix(in srgb, var(--warning) 55%, var(--ink));          /* --mark-seam */
  --x-tide: color-mix(in srgb, var(--ink-muted) 60%, transparent);       /* --mark-tide */
  --x-now: color-mix(in srgb, var(--light) 80%, transparent);            /* --mark-now */
  --x-hatch: color-mix(in srgb, var(--ink-muted) 26%, transparent);      /* --mark-stale-hatch */
  --x-past-dim: .62;
  --x-lane: var(--space-6);
}
body{overflow:auto}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.wrap{max-width:calc(var(--measure-wide) * 1.7);margin:0 auto;padding:var(--space-5) var(--edge) var(--space-8)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
h1{font-weight:200;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-title);text-transform:uppercase;margin:var(--space-2) 0 var(--space-2);color:var(--light)}
.lede{margin:0 0 var(--space-4);color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta);max-width:110ch}
.chart{position:relative;border-radius:var(--radius-inset);background:var(--slate-deep);border:1px solid var(--hairline);padding:var(--space-3) var(--space-4) var(--space-2)}
.chart svg{display:block;width:100%;overflow:visible}
.lab{font:400 var(--type-small) var(--font-mono);fill:var(--ink-muted)}
.lab.hi{fill:var(--ink)}
.lane-l{font:400 var(--type-meta) var(--font-sans);fill:var(--ink)}
.dep{transition:opacity var(--motion-slow) var(--ease-out);transition-delay:calc(var(--t) * var(--motion-run) * 1.4)}
.pre .dep{opacity:0}
.nowl{transition:opacity var(--motion-calm)}
.pre .nowl{opacity:0}
table{width:100%;border-collapse:collapse;margin-top:var(--space-4);font-size:var(--type-small);line-height:var(--leading-small)}
th{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:0 var(--space-3) var(--space-2) 0;border-bottom:1px solid var(--hairline-strong)}
td{padding:var(--space-2) var(--space-3) var(--space-2) 0;border-bottom:1px solid var(--hairline);vertical-align:top;color:var(--ink-muted)}
td:first-child{color:var(--light);white-space:nowrap}
td b{font-weight:400;color:var(--ink)}
.cost{display:inline-flex;align-items:center;gap:var(--space-1);white-space:nowrap}
.cost i{display:inline-block;width:var(--space-2);height:var(--space-2);border-radius:50%;border:1px solid var(--ink-muted)}
.cost.c1 i{background:var(--ink-muted)} .cost.c2 i{background:linear-gradient(90deg,var(--ink-muted) 50%,transparent 50%)}
.priv{color:var(--ink-muted)} .priv.hi{color:var(--light)}
.hints{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:999;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);background:var(--scrim);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key)}
.kbd{border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="stale" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--x-hatch);stroke-width:1"/></pattern>
</defs></svg>
<div class="wrap" id="wrap">
  <span class="eyebrow" id="eyebrow"></span>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
  <div class="chart" id="chart" role="img"></div>
  <table id="tbl"></table>
</div>
<div class="hints"><span class="kbd">R</span> replay</div>
<div class="x-cap"><b>Grammar · V2</b> one object, one scale, one now; what each mark needs from the events service · Bret Victor, tide tables</div>
<script>
/* ===== Sample data: one document's life, and what each mark needs ===== */
const SHEET = {
  eyebrow: 'Wear and time · grammar',
  title: 'One scale, one now',
  lede: 'Every mark on the same axis: the record kept, compressed by the square root of age, then the next six months, linear. One now line crosses every lane. The table says what each mark needs and what it costs. Entries marked "to check" are assumptions about the events service, not facts.',
  object: 'Travel and expenses policy',
  keptAgo: 900, readsAgo: 500, future: 182,
  lanes: [
    { id: 'edit', label: 'Edits', marks: [[900, 'd'], [700, 'd'], [610, 'd'], [430, 't'], [400, 'o'], [300, 'd'], [210, 'o'], [200, 't'], [190, 'o'], [185, 't'], [180, 'o'], [60, 'd'], [45, 't'], [44, 'o'], [40, 'd'], [30, 'd']] },
    { id: 'seam', label: 'Repairs', marks: [[75, 'Booking: 7 → 14 days'], [9, 'Allowance: €45 → €54']] },
    { id: 'review', label: 'Reviews', missed: [[250, 'Claiming: due 25 Feb']], next: [65, 'Exceptions'] },
    { id: 'read', label: 'Readers', gap: 'not tracked before Jun 2025', reset: 'repair: the count starts again', series: [[500, 0], [420, 14], [300, 24], [200, 29], [120, 31], [40, 31], [9, 31], [8, 2], [4, 4], [0, 6]], high: 31 },
    { id: 'record', label: 'Record', gaps: [[900, 'nothing before May 2024: moved from the old intranet']] }
  ],
  table: [
    ['Wear (edit)', 'Update events with actor, time and <b>which section</b> changed', 'Document-level updates with actor (to check)', 'Section anchor on each update', [1, 'one histogram per document, ≤ 32 bins'], ['none', '']],
    ['Wear (read)', 'Read events per section, after a dwell', 'No', '<b>section.read</b>, aggregated per day and group, no per-person rows kept', [2, 'cheap only if aggregated server-side'], ['high', 'Shows what colleagues read. Question for Harry.']],
    ['Seam', 'A correction flag and a reason on an update', 'No', '<b>update.kind = correction</b> plus reason text', [1, 'a few per document'], ['none', '']],
    ['Ring', 'Periods: releases, review cycles, years', 'Releases from the updater (to check)', 'None for upgrades; documents derive from edits', [1, 'one SVG per object, only when open'], ['none', '']],
    ['Stratum', 'Every value a field or fact has held, with source', 'Accepted proposals in Data Atlas (to check)', 'Value-level history for documents', [3, 'per object, load on open only'], ['none', '']],
    ['Unconformity', 'Where the record starts, and why', 'No', '<b>record.started</b> {since, reason} per object or source', [1, 'one row'], ['none', '']],
    ['Tide line', 'Due dates and every time one moved', 'Intent deadlines in Mandate (to check)', '<b>review.due</b> field and <b>due.changed</b> events for documents', [1, 'date compare'], ['none', '']],
    ['High-water mark', 'The peak of a count, with its date', 'Derived', 'Store max and date with the count', [1, 'two numbers'], ['low', 'Follows the read rule when it counts readers']],
    ['Now line', 'The clock', 'Yes', 'None', [1, 'free'], ['none', '']],
    ['Stale hatch', 'A freshness rule per library or type, and who refreshes', 'No', 'Review interval and refresher on the library', [1, 'CSS only: fine on 5,000 rows'], ['none', '']],
    ['Distance to travel', 'The next known event', 'As tide line', 'As tide line', [1, 'one line'], ['none', '']]
  ]
};
const $ = s => document.querySelector(s);
const ms = n => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)) || 0;
const px = n => { const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim(); return v.endsWith('rem') ? parseFloat(v) * 16 : parseFloat(v); };
function draw() {
  const box = $('#chart'), W = box.clientWidth - px('--space-4') * 2, L = px('--space-8'), lane = px('--x-lane'), top = px('--space-5'), NX = L + (W - L) * .8;
  const X = d => d >= 0 ? L + (NX - L) * (1 - Math.sqrt(Math.min(d, SHEET.keptAgo) / SHEET.keptAgo)) : NX + (W - NX) * Math.min(-d, SHEET.future) / SHEET.future;
  const T = d => (1 - Math.sqrt(Math.min(d, SHEET.keptAgo) / SHEET.keptAgo)).toFixed(3);   /* deposit order: time-lapse from old to new */
  const H = top + lane * SHEET.lanes.length;
  let h = '';
  SHEET.lanes.forEach((ln, i) => {
    const y = top + i * lane, m = y + lane / 2;
    h += `<text class="lane-l" x="0" y="${m + 5}">${ln.label}</text><line x1="${L}" y1="${y + lane}" x2="${W}" y2="${y + lane}" style="stroke:var(--hairline)"/>`;
    if (ln.id === 'edit') ln.marks.forEach(([d, f]) => { const fr = 1 - Math.sqrt(d / SHEET.keptAgo); h += `<line class="dep" style="--t:${T(d)};stroke:color-mix(in srgb, var(--floor-${{ d: 'department', t: 'team', o: 'org' }[f]}-high) ${45 + fr * 50}%, transparent);stroke-width:2" x1="${X(d)}" y1="${m - 10}" x2="${X(d)}" y2="${m + 10}"/>`; });
    if (ln.id === 'seam') ln.marks.forEach(([d, l], k) => { h += `<g class="dep" style="--t:${T(d)}"><line x1="${X(d)}" y1="${m - 10}" x2="${X(d)}" y2="${m + 10}" style="stroke:var(--x-seam);stroke-width:2"/><text class="lab" x="${X(d) - 6}" y="${m + (k ? 14 : -4)}" text-anchor="end">${l}</text></g>`; });
    if (ln.id === 'review') {
      ln.missed.forEach(([d, l]) => { h += `<g class="dep" style="--t:${T(d)}"><rect x="${X(d)}" y="${m - 9}" width="${NX - X(d)}" height="18" style="fill:url(#stale)"/><line x1="${X(d)}" y1="${y + 4}" x2="${X(d)}" y2="${y + lane - 4}" style="stroke:var(--x-tide);stroke-dasharray:3 2"/><text class="lab" x="${X(d) - 6}" y="${m + 4}" text-anchor="end">${l}, missed</text></g>`; });
      const [dn, ln2] = ln.next; h += `<g class="dep" style="--t:1"><line x1="${NX}" y1="${m}" x2="${X(-dn)}" y2="${m}" style="stroke:var(--ink-muted);stroke-dasharray:2 3"/><line x1="${X(-dn)}" y1="${m - 8}" x2="${X(-dn)}" y2="${m + 8}" style="stroke:var(--ink);stroke-width:2"/><text class="lab hi" x="${NX + 6}" y="${m - 8}">${ln2}, in ${Math.round(dn / 7)} weeks</text></g>`;
    }
    if (ln.id === 'read') {
      const yv = v => y + lane - 6 - v / ln.high * (lane - 14);
      let p = ''; ln.series.forEach(([d, v], k) => p += `${k ? 'L' : 'M'}${X(d)},${yv(v)}`);
      h += `<path class="dep" style="--t:.6;fill:none;stroke:var(--ink);stroke-width:1.5" d="${p}"/><g class="dep" style="--t:.85"><line x1="${X(ln.series[0][0])}" y1="${yv(ln.high)}" x2="${NX}" y2="${yv(ln.high)}" style="stroke:var(--ink-muted);stroke-dasharray:4 3"/><text class="lab" x="${X(120)}" y="${yv(ln.high) - 4}">high water ${ln.high}</text><text class="lab" x="${X(9) - 6}" y="${yv(3) + 4}" text-anchor="end">${ln.reset}</text></g>`;
      let w = ''; for (let x = L; x <= X(ln.series[0][0]); x += 6) w += `${w ? 'L' : 'M'}${x},${m + ((x / 6) % 2 > 1 ? 3 : -3)}`;
      h += `<g class="dep" style="--t:0"><path d="${w}" style="fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2"/><text class="lab" x="${L + 4}" y="${m - 8}">${ln.gap}</text></g>`;
    }
    if (ln.id === 'record') ln.gaps.forEach(([d, l], k) => {
      let w = ''; for (let x = L; x <= X(d); x += 6) w += `${w ? 'L' : 'M'}${x},${m + ((x / 6) % 2 > 1 ? 3 : -3)}`;
      h += `<g class="dep" style="--t:0">${X(d) > L + 2 ? `<path d="${w}" style="fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2"/>` : `<path d="M${L},${y + 4} l3,6 l-3,6 l3,6 l-3,6 l3,6" style="fill:none;stroke:var(--ink-muted)"/>`}<text class="lab" x="${X(d) + 8}" y="${m + 4 + (k ? 0 : 0)}">${l}</text></g>`;
    });
  });
  /* the one now line, across every lane */
  h += `<g class="nowl"><line x1="${NX}" y1="${top - 8}" x2="${NX}" y2="${H}" style="stroke:var(--x-now)"/><text class="lab hi" x="${NX}" y="${top - 12}" text-anchor="middle">now</text></g>`;
  [[900, 'May 2024'], [500, 'Jun 2025'], [180, 'May 2026'], [30, 'Oct'], [-182, '+6 months']].forEach(([d, l]) => h += `<text class="lab" x="${X(d)}" y="${H + 18}" text-anchor="${d === 900 ? 'start' : d < 0 ? 'end' : 'middle'}">${l}</text><line x1="${X(d)}" y1="${H}" x2="${X(d)}" y2="${H + 5}" style="stroke:var(--hairline-strong)"/>`);
  box.innerHTML = `<svg height="${H + 26}" viewBox="0 0 ${W} ${H + 26}" aria-hidden="true">${h}</svg>`;
  box.setAttribute('aria-label', `${SHEET.object}: edits, repairs, reviews, readers and gaps in the record on one time scale`);
}
function table() {
  const cost = ['', 'cheap', 'medium', 'heavy'];
  $('#tbl').innerHTML = `<thead><tr><th>Mark</th><th>Needs</th><th>Recorded today</th><th>New event or field</th><th>On 5,000 documents</th><th>Privacy</th></tr></thead><tbody>${SHEET.table.map(r =>
    `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="cost c${r[4][0]}"><i></i>${cost[r[4][0]]}</span> · ${r[4][1]}</td><td class="priv ${r[5][0] === 'high' ? 'hi' : ''}">${r[5][0] === 'high' ? '<b>HIGH</b>' : r[5][0]}${r[5][1] ? ': ' + r[5][1] : ''}</td></tr>`).join('')}</tbody>`;
}
function render() { $('#eyebrow').textContent = SHEET.eyebrow; $('#h1').textContent = SHEET.title; $('#lede').textContent = SHEET.lede; draw(); table(); }
let TM = 0;
function play() { clearTimeout(TM); const w = $('#wrap'); w.classList.add('pre'); TM = setTimeout(() => w.classList.remove('pre'), ms('--motion-run')); }
document.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') play(); });
addEventListener('resize', draw);
render(); play();
</script>
</body>
</html>
