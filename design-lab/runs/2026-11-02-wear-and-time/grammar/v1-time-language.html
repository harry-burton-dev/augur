<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar · V1 · Time language</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ---------------------------------------------------------------
   Proposed tokens: the time marks. Every one is a combination of kit tokens
   and is listed as "needs token" in notes.md.
   --------------------------------------------------------------- */
:root{
  --x-seam: color-mix(in srgb, var(--warning) 55%, var(--ink));          /* --mark-seam */
  --x-wear: color-mix(in srgb, var(--ink) 55%, transparent);             /* --mark-wear */
  --x-wear-read: color-mix(in srgb, var(--ink-muted) 28%, transparent);  /* --mark-wear-read */
  --x-tide: color-mix(in srgb, var(--ink-muted) 60%, transparent);       /* --mark-tide */
  --x-now: color-mix(in srgb, var(--light) 80%, transparent);            /* --mark-now */
  --x-hatch: color-mix(in srgb, var(--ink-muted) 26%, transparent);      /* --mark-stale-hatch */
  --x-stale: repeating-linear-gradient(45deg, transparent 0 var(--space-2), var(--x-hatch) var(--space-2) calc(var(--space-2) + 1px));
  --x-shadow: repeating-linear-gradient(135deg, transparent 0 var(--space-2), var(--hairline) var(--space-2) calc(var(--space-2) + 1px)); /* light language "shadow", for contrast */
  --x-past-dim: .62;                                                      /* --time-past-dim */
  --x-stage: calc(var(--space-8) + var(--space-5));                       /* cell stage height, 144 */
}
body{overflow:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.wrap{max-width:calc(var(--measure-wide) * 1.7);margin:0 auto;padding:var(--space-5) var(--edge) var(--space-8)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:var(--space-5);align-items:end;margin-bottom:var(--space-5)}
h1{font-weight:200;font-size:var(--type-title);line-height:var(--leading-title);letter-spacing:var(--tracking-title);text-transform:uppercase;margin:var(--space-2) 0 var(--space-2);color:var(--light)}
.lede{margin:0;color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta);max-width:60ch}
.rules{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-3);margin:0;padding:0;list-style:none}
.rules li{padding-top:var(--space-2);border-top:1px solid var(--hairline-strong);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rules b{display:block;font-weight:400;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);margin-bottom:var(--space-1)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-5) var(--space-4)}
.cell{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.stage{position:relative;height:var(--x-stage);border-radius:var(--radius-inset);background:var(--slate-deep);border:1px solid var(--hairline);overflow:hidden;padding:var(--space-3)}
.stage > svg{display:block;width:100%;height:100%;overflow:visible}
.n{display:flex;align-items:baseline;gap:var(--space-2);font-weight:300;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.n small{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.d{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.tok{margin:0;font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);word-break:break-word}
.never{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.never b{font-weight:400;color:var(--ink)}
.lab{font:400 var(--type-small)/1 var(--font-mono);fill:var(--ink-muted);color:var(--ink-muted)}
.lab.hi{fill:var(--ink);color:var(--ink)}
/* deposit animation: marks appear in order, once */
.dep{transition:opacity var(--motion-calm) var(--ease-out),transform var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-quick))}
.pre .dep{opacity:0;transform:translateY(calc(var(--space-1) * -1))}
.pre .grow{transform:scaleX(0)}
.grow{transform-origin:100% 50%}
.grow.l{transform-origin:0 50%}

/* 1 wear */
.wear-s{display:grid;grid-template-columns:1fr var(--space-8);gap:var(--space-4);height:100%}
.lines{display:grid;gap:var(--space-2);align-content:start;padding-top:var(--space-1)}
.lines i{position:relative;display:block;height:var(--space-1);border-radius:var(--radius-pill);background:var(--hairline-strong)}
.lines i::before{content:"";position:absolute;left:calc(var(--space-3) * -1);top:calc(var(--space-1) * -1);bottom:calc(var(--space-1) * -1);width:2px;border-radius:var(--radius-pill);background:var(--x-wear);opacity:var(--e)}
.rail{position:relative;border-left:1px solid var(--hairline);border-right:1px solid var(--hairline)}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--hairline)}
.wb{position:absolute;top:var(--y);height:var(--space-2);display:flex}
.wb.e{right:50%;flex-direction:row-reverse}
.wb.r{left:50%}
.wb i{display:block;height:100%;width:var(--w);background:color-mix(in srgb, var(--fc) 46%, transparent)}
.wb.r i{background:var(--x-wear-read)}
[data-f="d"]{--fc:var(--floor-department-high)} [data-f="t"]{--fc:var(--floor-team-high)} [data-f="o"]{--fc:var(--floor-org-high)}
/* 2 seam */
.seam-s{display:flex;flex-direction:column;justify-content:center;gap:var(--space-3);height:100%}
.txt{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);display:flex;gap:var(--space-3);align-items:flex-start}
.txt .m{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;width:var(--space-7);font:400 var(--type-small)/1 var(--font-mono);color:var(--x-seam)}
.txt .m i{display:block;width:2px;height:var(--space-4);background:linear-gradient(var(--x-seam),transparent)}
.txt .m span{color:var(--ink-muted)}
.fix{padding-bottom:2px;background:linear-gradient(var(--x-seam),var(--x-seam)) 0 100% / 100% 1px no-repeat,linear-gradient(var(--x-seam),var(--x-seam)) 0 calc(100% - 3px) / 100% 1px no-repeat}
.was{color:var(--ink-muted);text-decoration:line-through;text-decoration-color:var(--x-seam)}
/* 5 unconformity */
.unc-hatch{fill:url(#stale)}
/* 9 stale */
.stale-s{display:flex;flex-direction:column;justify-content:center;gap:var(--space-2);height:100%}
.vcard{display:flex;justify-content:space-between;align-items:center;padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);border:1px dashed var(--hairline-strong);font-size:var(--type-meta)}
.vcard.stale{background:var(--x-stale),var(--surface-inset)}
.vcard.shadow{background:var(--x-shadow);color:var(--ink-muted);opacity:.7}
.vcard b{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted)}
.vcard .v{color:var(--ink)}
.vwhy{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.vwhy b{font-weight:400;color:var(--ink)}
.hints{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:999;display:flex;gap:var(--space-3);align-items:center;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);background:var(--scrim);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key)}
.kbd{font:400 var(--type-small)/1 var(--font-mono);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1)}
@media (max-width:1400px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.rules{grid-template-columns:repeat(3,minmax(0,1fr))}.top{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="stale" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--x-hatch);stroke-width:1"/></pattern>
</defs></svg>
<div class="wrap" id="wrap">
  <div class="top">
    <div>
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <ul class="rules" id="rules"></ul>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="hints"><span><span class="kbd">R</span> replay</span></div>
<div class="x-cap"><b>Grammar · V1</b> time language: ten marks, their tokens, what they must never mean · Hill and Hollan, geology, tide tables, Open MCT</div>
<script>
/* ===== Sample data: every label on this sheet comes from here ===== */
const SHEET = {
  eyebrow: 'Wear and time · grammar',
  title: 'Time language',
  lede: 'Ten marks that let an object carry its own history. They are made of matter (ink, hairline, hatch) and never of light. The light language stays the only way to say "this needs you".',
  rules: [
    ['Time is matter, attention is light', 'Marks never glow, breathe or move at rest. When time needs you (a date arrives, a change you must read) the light language takes over: bloom, beacon.'],
    ['One now', 'Every time scale on a screen shares one now line. Past to the left or below, future to the right or above.'],
    ['The past is quieter', 'Freshness fades with the square root of age. Older marks step down to the past-dim opacity, never to nothing.'],
    ['Every mark answers', 'Hover or focus any mark: what happened, since when, who did it, who can change it. In place, never a trip to a log.'],
    ['One scale', 'Past compressed (square root of age over the record kept), next six months linear. The same scale on every strip, so marks compare.']
  ],
  marks: [
    { id: 'wear', name: 'Wear', means: 'How much a part was edited (left, by the editor’s floor) or read (right). Length is the count.', tok: 'edit: --fc 46% · read: --ink-muted 28% · no blur, no glow', never: 'importance, quality, or "needs you". Never names a reader.' },
    { id: 'seam', name: 'Seam', means: 'A repair: something was wrong and was put right. The fix stays visible for good.', tok: '--mark-seam = --warning 55% in --ink · two 1px lines, 3px apart', never: 'a warning, an open problem, or an ordinary edit. Never smoothed away.' },
    { id: 'ring', name: 'Ring', means: 'One ring per period (a year, a release train). Width is how much changed; a gap is a scar (a rollback).', tok: '--hairline-strong, width ∝ change · newest ring brightest', never: 'progress or completion. A ring never fills up.' },
    { id: 'stratum', name: 'Stratum', means: 'One layer per value or version, oldest at the bottom. Thickness is how long it was in force.', tok: '--fc 14–36% by freshness · 2px left edge in --fc', never: 'rank or priority. Layers are never reordered.' },
    { id: 'unconformity', name: 'Unconformity', means: 'A gap in the record: we do not know what happened here, and the label says why.', tok: '1px dashed wavy --ink-muted · stale hatch inside · label with dates', never: '"nothing happened" or zero. Never left as empty space.' },
    { id: 'tide', name: 'Tide line', means: 'A date that passed: a missed review, a deadline that moved. Left where it was, with its date.', tok: '--mark-tide = --ink-muted 60% · 1px, dash 3 2', never: 'the current deadline. Never lit, never red.' },
    { id: 'high', name: 'High-water mark', means: 'The highest level something reached: the most readers, the peak of effort.', tok: '1px dashed --ink-muted, dash 4 3 · value label at the end', never: 'a target or goal to reach.' },
    { id: 'now', name: 'Now line', means: 'The present. One per view, on every time scale at once.', tok: '--mark-now = --light 80% · 1px · label "now"', never: 'a selection, a cursor or a playhead (a scrubber uses an --ink knob).' },
    { id: 'stale', name: 'Stale hatch', means: 'Out of date: it says how old, and who can refresh it.', tok: '--mark-stale-hatch = --ink-muted 26% · 45°, every --space-2', never: 'unavailable (that is shadow, 135°). Never without its age and who.' },
    { id: 'distance', name: 'Distance to travel', means: 'The future as a length: from now to the next known event, on the same scale as the past.', tok: '1px dotted --ink-muted from now · 2px end tick in --ink', never: 'a progress bar or a countdown. It never fills and never ticks.' }
  ],
  examples: { value: '€54', was: '€45', repairedAgo: '9 days', staleValue: 'Claim form', staleAge: '8 months', refresher: 'Jonas Meyer', shadowWhy: 'Needs Finance access', readers: 6, high: 31, dueIn: 'in 9 weeks', missed: '25 Feb', gapFrom: '2023', gapTo: 'May 2024', gapWhy: 'moved from the old intranet', years: ['2022', '2023', '2024', '2025', '2026'] }
};
const $ = s => document.querySelector(s);
const ms = n => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n)) || 0;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const E = SHEET.examples;
const stages = {
  wear: () => `<div class="wear-s"><div class="lines">${[.2, .9, .9, .5, .1, .3, .8, .4].map((e, i) => `<i class="dep" style="--i:${i};--e:${e};width:${[96, 88, 100, 70, 92, 84, 100, 60][i]}%"></i>`).join('')}</div>
    <div class="rail">${[[6, [['d', 8]], 30], [26, [['d', 14], ['t', 10]], 22], [46, [['d', 6], ['t', 8], ['o', 10]], 12], [66, [['d', 4]], 34], [86, [['t', 12]], 18]].map(([y, e, r], i) =>
      `<span class="wb e grow dep" style="--y:${y}%;--i:${i}">${e.map(([f, w]) => `<i data-f="${f}" style="--w:${w}px"></i>`).join('')}</span><span class="wb r grow l dep" style="--y:${y}%;--i:${i}"><i style="--w:${r}px"></i></span>`).join('')}</div></div>`,
  seam: () => `<div class="seam-s"><div class="txt"><span class="m dep" style="--i:1"><i></i>repair<span>${E.repairedAgo}</span></span><span>The daily allowance is <span class="fix dep" style="--i:2">${E.value}</span>, covering breakfast and dinner.</span></div>
    <div class="txt dep" style="--i:3;opacity:var(--x-past-dim)"><span class="m"></span><span>Before: <span class="was">${E.was}</span></span></div></div>`,
  ring: () => { const w = [3, 1.5, 6, 2.5, 4], r0 = 8; let r = r0, h = '';
    w.forEach((x, i) => { r += x + 5; const op = .35 + .65 * (i / (w.length - 1)); h += `<circle class="dep" style="--i:${i};stroke:var(--hairline-strong);stroke-width:${x};opacity:${op};fill:none" cx="58" cy="60" r="${r}" ${i === 2 ? `stroke-dasharray="${2 * Math.PI * r * .86} ${2 * Math.PI * r * .14}" transform="rotate(-40 58 60)"` : ''}/>`; });
    return `<svg viewBox="0 0 220 120" aria-hidden="true">${h}<line x1="112" y1="60" x2="132" y2="60" style="stroke:var(--hairline)"/><text class="lab hi" x="136" y="56">${E.years[4]}</text><text class="lab" x="136" y="72">wide: busy year</text><text class="lab" x="104" y="18">scar: rollback</text></svg>`; },
  stratum: () => { const L = [['d', 'v1 · 1.6 years', 34], ['d', 'v2 · 9 months', 26], ['t', 'v3 · 4 weeks', 15], ['d', 'now · 9 days', 15]]; let y = 112, h = '';
    L.forEach(([f, l, t], i) => { y -= t + 3; const fr = .2 + .8 * i / 3; h += `<g class="dep" style="--i:${3 - i}"><rect data-f="${f}" x="0" y="${y}" width="150" height="${t}" style="fill:color-mix(in srgb, var(--fc) ${14 + fr * 22}%, transparent)"/><rect data-f="${f}" x="0" y="${y}" width="2" height="${t}" style="fill:var(--fc)"/><text class="lab ${i === 3 ? 'hi' : ''}" x="160" y="${y + t / 2 + 4}">${l}</text></g>`; });
    return `<svg viewBox="0 0 240 116" aria-hidden="true">${h}</svg>`; },
  unconformity: () => { let w = ''; for (let x = 0; x <= 150; x += 6) w += `${w ? 'L' : 'M'}${x},${46 + ((x / 6) % 2 ? 3 : -3)}`;
    return `<svg viewBox="0 0 240 116" aria-hidden="true"><rect x="0" y="66" width="150" height="44" style="fill:color-mix(in srgb, var(--floor-department-high) 22%, transparent)"/><rect class="unc-hatch dep" style="--i:1" x="0" y="18" width="150" height="30"/><path class="dep" style="--i:2;fill:none;stroke:var(--ink-muted);stroke-dasharray:2 2" d="${w}"/> <rect x="0" y="0" width="150" height="16" style="fill:color-mix(in srgb, var(--floor-department-high) 12%, transparent)"/>
      <text class="lab hi" x="158" y="24">no record</text><text class="lab" x="158" y="38">${E.gapFrom} to</text><text class="lab" x="158" y="52">${E.gapTo}:</text><text class="lab" x="158" y="66">${E.gapWhy.split(' ').slice(0, 2).join(' ')}</text><text class="lab" x="158" y="80">${E.gapWhy.split(' ').slice(2, 4).join(' ')}</text><text class="lab" x="158" y="94">${E.gapWhy.split(' ').slice(4).join(' ')}</text></svg>`; },
  tide: () => `<svg viewBox="0 0 240 116" aria-hidden="true"><line x1="0" y1="70" x2="200" y2="70" style="stroke:var(--hairline-strong)"/>
    <g class="dep" style="--i:1"><line x1="70" y1="20" x2="70" y2="96" style="stroke:var(--x-tide);stroke-dasharray:3 2"/><text class="lab" x="74" y="30">due ${E.missed}</text><text class="lab" x="74" y="44">missed</text></g>
    <g class="dep" style="--i:2"><line x1="130" y1="40" x2="130" y2="96" style="stroke:var(--x-tide);stroke-dasharray:3 2;opacity:.6"/><text class="lab" x="134" y="52">moved</text></g>
    <rect x="70" y="62" width="130" height="16" style="fill:url(#stale)"/><line x1="200" y1="14" x2="200" y2="100" style="stroke:var(--x-now)"/><text class="lab hi" x="196" y="112" text-anchor="end">now</text></svg>`,
  high: () => { const v = [3, 9, 17, 24, 29, 31, 30, 31], hw = 31, n = E.readers; let p = ''; v.forEach((x, i) => p += `${i ? 'L' : 'M'}${i * 12},${100 - x * 2.4}`);
    return `<svg viewBox="0 0 240 116" aria-hidden="true"><path d="${p}" style="fill:none;stroke:var(--ink-muted);opacity:var(--x-past-dim)"/><line x1="96" y1="10" x2="96" y2="104" style="stroke:var(--x-seam)"/><path class="dep" style="--i:2;fill:none;stroke:var(--ink);stroke-width:1.5" d="M96,100 L120,${100 - 3 * 2.4} L150,${100 - n * 2.4}"/>
      <g class="dep" style="--i:1"><line x1="0" y1="${100 - hw * 2.4}" x2="220" y2="${100 - hw * 2.4}" style="stroke:var(--ink-muted);stroke-dasharray:4 3"/><text class="lab hi" x="220" y="${100 - hw * 2.4 - 6}" text-anchor="end">${hw}, high water</text></g>
      <text class="lab" x="100" y="112">changed</text><line x1="150" y1="${100 - hw * 2.4 + 4}" x2="150" y2="104" style="stroke:var(--x-now)"/><text class="lab" x="156" y="${100 - n * 2.4 + 4}">${n} now</text></svg>`; },
  now: () => `<svg viewBox="0 0 240 116" aria-hidden="true"><line x1="0" y1="60" x2="160" y2="60" style="stroke:var(--hairline-strong)"/>${[10, 34, 60, 96, 120, 140].map((x, i) => `<line x1="${x}" y1="50" x2="${x}" y2="70" style="stroke:var(--floor-department-high);stroke-width:2;opacity:${.3 + i * .12}"/>`).join('')}
    <line x1="160" y1="60" x2="230" y2="60" style="stroke:var(--ink-muted);stroke-dasharray:2 3"/><line class="dep" style="--i:1" x1="160" y1="8" x2="160" y2="104" style="stroke:var(--x-now)"/><text class="lab hi" x="160" y="114" text-anchor="middle">now</text><text class="lab" x="0" y="96">past, quieter</text><text class="lab" x="230" y="96" text-anchor="end">future</text></svg>`,
  stale: () => `<div class="stale-s"><div class="vcard stale dep" style="--i:1"><span class="v">${E.staleValue}</span><b>${E.staleAge}</b></div><span class="vwhy dep" style="--i:2">Stale for <b>${E.staleAge}</b>. <b>${E.refresher}</b> can refresh it.</span>
    <div class="vcard shadow dep" style="--i:3"><span>Shadow, for contrast</span><i data-lucide="lock" data-size="14"></i></div><span class="vwhy dep" style="--i:3">${E.shadowWhy}: unavailable, not old.</span></div>`,
  distance: () => `<svg viewBox="0 0 240 116" aria-hidden="true"><line x1="0" y1="60" x2="70" y2="60" style="stroke:var(--hairline-strong)"/><line x1="70" y1="10" x2="70" y2="104" style="stroke:var(--x-now)"/><text class="lab hi" x="70" y="114" text-anchor="middle">now</text>
    <line class="dep grow l" style="--i:1;stroke:var(--ink-muted);stroke-dasharray:2 3" x1="70" y1="60" x2="196" y2="60"/><line class="dep" style="--i:2;stroke:var(--ink);stroke-width:2" x1="196" y1="48" x2="196" y2="72"/><text class="lab hi dep" style="--i:2" x="196" y="40" text-anchor="middle">review</text><text class="lab dep" style="--i:2" x="196" y="90" text-anchor="middle">${E.dueIn}</text></svg>`
};
function render() {
  $('#eyebrow').textContent = SHEET.eyebrow; $('#h1').textContent = SHEET.title; $('#lede').textContent = SHEET.lede;
  $('#rules').innerHTML = SHEET.rules.map(([b, t]) => `<li><b>${b}</b>${t}</li>`).join('');
  $('#grid').innerHTML = SHEET.marks.map((m, i) => `<section class="cell" aria-labelledby="m-${m.id}"><div class="stage" role="img" aria-label="${m.name}: ${m.means}">${stages[m.id]()}</div>
    <div class="n" id="m-${m.id}"><small>${String(i + 1).padStart(2, '0')}</small>${m.name}</div><p class="d">${m.means}</p><p class="tok">${m.tok}</p><p class="never"><b>Never means</b> ${m.never}</p></section>`).join('');
  Icons.hydrate($('#grid'));
}
let T = 0;
function play() { clearTimeout(T); const w = $('#wrap'); w.classList.add('pre'); T = setTimeout(() => w.classList.remove('pre'), ms('--motion-run')); }
document.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') play(); });
render(); play();
</script>
</body>
</html>
