<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provenance · V4 ring section</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<style>
/* Proposed tokens (each listed under "needs token" in notes.md) */
:root{
  --x-type-micro: .6875rem;                 /* proposed --type-micro */
  --x-stratum-mix: 24%;                     /* proposed --stratum-mix (rings sit lower than strata: a disc is a lot of area) */
  --x-past-dim: .5;                         /* proposed --time-past-dim */
  --x-seam: color-mix(in srgb, var(--light) 80%, transparent);   /* proposed --mark-seam */
  --x-fault: var(--warning);                /* proposed --mark-fault (scar) */
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
body{overflow:hidden}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink)}
.head{position:fixed;top:var(--edge);left:calc(var(--edge) + var(--space-2))}
.head h1{margin:var(--space-2) 0 0;font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.head .attr{margin-top:var(--space-1);font-size:var(--type-meta);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}
.keys{position:fixed;right:var(--edge);top:var(--edge);display:flex;gap:var(--space-3);align-items:center;font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
svg#sec{position:fixed;inset:0;width:100%;height:100%}
.ring{transform-box:view-box;transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-slow) var(--ease-out);opacity:0}
.ring.in{opacity:var(--op,1)}
.ring.sel path.body{stroke:var(--info);stroke-width:1.5}
.late{opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.late.in{opacity:1}
.bud{filter:drop-shadow(0 0 calc(var(--glow-blur) / 3) var(--green))}
.t-micro{font:400 var(--x-type-micro) var(--font-mono);letter-spacing:var(--tracking-caps)}

.panel{position:fixed;right:var(--edge);top:calc(var(--band-top) * 2);width:var(--measure-card);display:grid;gap:var(--space-4)}
.read{background:var(--surface-pane);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-4) var(--space-5)}
.read h2{margin:var(--space-2) 0;font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.read p{margin:0 0 var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.read p.m{color:var(--ink-muted)}
.stale{display:inline-block;padding:0 var(--space-1);border-radius:var(--radius-key);background:repeating-linear-gradient(135deg,transparent 0 var(--space-1),var(--hairline-strong) var(--space-1) calc(var(--space-1) + 1px))}
.chron{padding:0 var(--space-1)}
.chron svg{width:100%;height:calc(var(--space-8) - var(--space-4));display:block;overflow:visible}
.btn{display:inline-flex;align-items:center;height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid color-mix(in srgb,var(--green) 50%,transparent);color:var(--green);font-size:var(--type-meta);margin-top:var(--space-2)}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.legend span{display:flex;align-items:center;gap:var(--space-2)}
.legend i{display:inline-block;width:var(--space-3);height:var(--space-3);border-radius:var(--radius-pill)}
@media (prefers-reduced-motion: reduce){.ring{transform:none!important}}
</style>
</head>
<body>
<header class="head">
  <div class="eyebrow" id="crumb"></div>
  <h1 id="ename"></h1>
  <div class="attr" id="attr"></div>
</header>
<div class="keys"><span><span class="kbd">←</span> <span class="kbd">→</span> ring by ring</span><span><span class="kbd">T</span> the bud</span><span><span class="kbd">R</span> replay</span></div>
<svg id="sec" role="img" aria-label="Fact history as a tree-ring cross-section"></svg>
<aside class="panel">
  <div class="read" id="read" aria-live="polite"></div>
  <div class="chron"><div class="eyebrow" style="margin-bottom:var(--space-2)">Ring widths · evidence per quarter</div><svg id="chron" aria-hidden="true"></svg></div>
  <div class="legend" id="legend"></div>
</aside>
<div class="x-cap"><b>Provenance · V4</b> ring section: one ring per quarter, width = evidence, scars and missing rings · dendrochronology, Tufte sparklines</div>
<script src="../../../_kit/icons.js"></script>
<script>
/* ------------------------------------------------------------------ sample data (one object) */
const DATA = {
  now: '2026-11-02',
  app: 'Data Atlas',
  viewer: { name: 'Harry', teams: ['Supplier data'] },
  entity: { type: 'Supplier', name: 'Kestrel Logistics' },
  fact: { attr: 'Headcount', unit: 'employees', refreshMonths: 12, steward: 'Supplier data' },
  ringMonths: 3,
  sources: {
    register: { label: 'Companies register', floor: 'org' },
    report: { label: 'Annual report', floor: 'department' },
    questionnaire: { label: 'Supplier questionnaire', floor: 'team' },
    payroll: { label: 'Payroll extract', floor: 'department' },
    web: { label: 'Web profile crawl', floor: null }
  },
  record: [
    { kind: 'value', from: '2023-03-06', value: 240, source: 'register', by: 'Register import' },
    { kind: 'value', from: '2023-09-18', value: 265, source: 'report', by: 'Dana Okafor' },
    { kind: 'rejected', at: '2023-12-02', value: 268, source: 'web', by: 'Dana Okafor', reason: 'Rounded copy of the annual report' },
    { kind: 'gap', from: '2024-01-10', to: '2024-11-04', reason: 'Register feed paused (licence lapsed)' },
    { kind: 'value', from: '2024-11-04', value: 265, source: 'report', by: 'Sam Reyes' },
    { kind: 'rejected', at: '2024-11-04', value: 410, source: 'web', by: 'Sam Reyes', reason: 'Counts contractors, not employees' },
    { kind: 'value', from: '2025-02-20', value: 312, source: 'questionnaire', by: 'Sam Reyes' },
    { kind: 'dispute', from: '2025-06-03', to: '2025-08-14', sides: [ { value: 290, party: 'Procurement' }, { value: 312, party: 'Finance' } ] },
    { kind: 'value', from: '2025-08-14', value: 305, source: 'payroll', by: 'Ines Duarte', seam: true },
    { kind: 'pending', at: '2026-04-22', value: 330, source: 'report', by: 'Annual report import' }
  ],
  /* evidence events per quarter (source checks, imports, triage decisions), oldest first, from the events service */
  evidence: [4, 3, 6, 5, 0, 0, 0, 3, 5, 9, 8, 3, 2, 1, 1],
  ahead: [ { at: '2026-12-01', label: 'Questionnaire Q4' }, { at: '2027-03-31', label: 'Annual report 2026' } ]
};

/* ------------------------------------------------------------------ helpers */
const $ = s => document.querySelector(s);
const D = s => new Date(s + 'T00:00:00Z');
const days = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = s => { const d = D(s); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const age = n => n < 45 ? n + ' days' : n < 540 ? Math.round(n / 30.4) + ' months' : (n / 365).toFixed(1) + ' years';
const addMonths = (s, m) => { const d = D(s); d.setUTCMonth(d.getUTCMonth() + m); return d.toISOString().slice(0, 10); };
const css = v => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v));
const FV = { org: '--floor-org-high', department: '--floor-department-high', team: '--floor-team-high', you: '--floor-you-high' };
const fill = f => f ? `color-mix(in srgb, var(${FV[f]}) var(--x-stratum-mix), var(--slate-deep))` : 'color-mix(in srgb, var(--ink-muted) 22%, var(--slate-deep))';
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const qLabel = s => { const d = D(s); return 'Q' + (Math.floor(d.getUTCMonth() / 3) + 1) + ' ' + d.getUTCFullYear(); };

/* rings: one per quarter from the first record to now */
const first = DATA.record[0].from;
const qStart = (() => { const d = D(first); d.setUTCMonth(Math.floor(d.getUTCMonth() / 3) * 3, 1); return d.toISOString().slice(0, 10); })();
const RINGS = DATA.evidence.map((n, i) => {
  const from = addMonths(qStart, i * DATA.ringMonths), to = i === DATA.evidence.length - 1 ? DATA.now : addMonths(qStart, (i + 1) * DATA.ringMonths);
  const held = [...DATA.record].reverse().find(r => r.kind === 'value' && D(r.from) < D(to));
  const gap = DATA.record.find(r => r.kind === 'gap' && D(r.from) < D(to) && D(r.to) > D(from));
  const ev = DATA.record.filter(r => D(r.from || r.at) >= D(from) && D(r.from || r.at) < D(to));
  return { i, from, to, n, held, gap: gap && n === 0 ? gap : null, ev };
});
const values = DATA.record.filter(r => r.kind === 'value');
const current = values[values.length - 1];
const staleFrom = addMonths(current.from, DATA.fact.refreshMonths);
const pending = DATA.record.find(r => r.kind === 'pending');
const canTriage = DATA.viewer.teams.includes(DATA.fact.steward);

/* ------------------------------------------------------------------ draw */
let G = null, sel = RINGS.length - 1;
function draw() {
  const W = innerWidth, H = innerHeight, svg = $('#sec'); svg.innerHTML = '';
  const panelL = W - css('--edge') - css('--measure-card');
  const R = Math.min(H * .34, (panelL - 80) * .36);
  const cx = Math.min(panelL / 2 + 20, panelL - R - 150), cy = H * .55;
  const defs = el('defs', {}, svg);
  const pat = el('pattern', { id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 6, style: 'stroke:var(--hairline-strong);stroke-width:1.5' }, pat);
  /* ring radii: a pith, then width proportional to evidence, missing rings a fixed thin hatch */
  const pith = R * .07, minW = R * .022, sum = RINGS.reduce((a, r) => a + (r.n || 0), 0);
  const missing = RINGS.filter(r => r.n === 0).length;
  const k = (R - pith - missing * minW - RINGS.length * minW) / sum;
  let r0 = pith; const radii = [];
  RINGS.forEach(r => { const w = minW + (r.n ? r.n * k : 0); radii.push([r0, r0 + w]); r0 += w; });
  const ann = (a, b) => `M${cx - b},${cy} a${b},${b} 0 1,0 ${2 * b},0 a${b},${b} 0 1,0 ${-2 * b},0 M${cx - a},${cy} a${a},${a} 0 1,1 ${2 * a},0 a${a},${a} 0 1,1 ${-2 * a},0Z`;
  const ageOp = s => (1 - days(s, DATA.now) / days(first, DATA.now) * (1 - css('--x-past-dim'))).toFixed(2);
  el('circle', { cx, cy, r: pith, style: 'fill:color-mix(in srgb,var(--ink-muted) 30%,var(--slate-deep))' }, svg);
  const ringsG = el('g', {}, svg);
  RINGS.forEach((r, i) => {
    const [a, b] = radii[i];
    const g = el('g', { class: 'ring', style: `--op:${ageOp(r.to)};transform-origin:${cx}px ${cy}px;transform:scale(${reduce ? 1 : .92})`, 'data-i': i }, ringsG);
    const f = r.gap ? 'url(#hatch)' : fill(DATA.sources[r.held.source].floor);
    el('path', { d: ann(a, b), class: 'body', 'fill-rule': 'evenodd', style: `fill:${f};stroke:var(--slate-deep);stroke-width:1` }, g);
    if (r.gap) el('circle', { cx, cy, r: b, style: 'fill:none;stroke:var(--ink-muted);stroke-dasharray:2 3' }, g);
    /* latewood line: a darker edge at each ring's end, as in real wood */
    el('circle', { cx, cy, r: b - .5, style: 'fill:none;stroke:color-mix(in srgb,var(--shade) 35%,transparent);stroke-width:1' }, g);
    /* stale rings: hatch over the colour */
    if (D(r.to) > D(staleFrom)) el('path', { d: ann(Math.max(a, a), b), 'fill-rule': 'evenodd', fill: 'url(#hatch)' }, g);
    r.g = g; r.a = a; r.b = b;
  });
  const late = el('g', { class: 'late' }, svg);
  const ang = d => d * Math.PI / 180;
  const pt = (rad, deg) => [cx + rad * Math.cos(ang(deg)), cy + rad * Math.sin(ang(deg))];
  const ringOf = s => RINGS.findIndex(r => D(s) >= D(r.from) && D(s) < D(r.to));
  /* seam: the correction drawn as a bright ring boundary */
  DATA.record.filter(r => r.seam).forEach(r => { const i = ringOf(r.from); el('circle', { cx, cy, r: radii[i][0] + (radii[i][1] - radii[i][0]) * .5, style: 'fill:none;stroke:var(--x-seam);stroke-width:1.5' }, late); });
  /* fire scar: the dispute burns a wedge into the rings it spans */
  DATA.record.filter(r => r.kind === 'dispute').forEach(r => {
    const i0 = ringOf(r.from), i1 = ringOf(r.to);
    const ra = radii[i0][0], rb = radii[i1][1], a0 = -62, a1 = -38;
    const [x0, y0] = pt(ra, -50), [x1, y1] = pt(rb, a0), [x2, y2] = pt(rb, a1);
    el('path', { d: `M${x0},${y0} L${x1},${y1} A${rb},${rb} 0 0,1 ${x2},${y2} Z`, style: 'fill:color-mix(in srgb,var(--x-fault) 14%,var(--slate-deep));stroke:var(--x-fault);stroke-opacity:.7;stroke-width:1' }, late);
    const [lx, ly] = pt(R + 26, -50);
    const t = el('text', { x: lx, y: ly, class: 't-micro', style: 'fill:var(--x-fault)' }, late); t.textContent = 'SCAR · DISPUTE ' + r.sides.map(s => s.value).join('/');
  });
  /* knots: rejected proposals, set into the ring of their quarter */
  DATA.record.filter(r => r.kind === 'rejected').forEach((r, k) => {
    const i = ringOf(r.at), rr = (radii[i][0] + radii[i][1]) / 2, deg = 150 + k * 40;
    const [x, y] = pt(rr, deg);
    el('circle', { cx: x, cy: y, r: 4, style: 'fill:var(--slate-deep);stroke:var(--ink-muted)' }, late);
    const [lx, ly] = pt(R + 22, deg);
    el('line', { x1: x, y1: y, x2: lx, y2: ly, style: 'stroke:var(--hairline-strong);stroke-dasharray:1 3' }, late);
    const t = el('text', { x: lx - 6, y: ly + 4, 'text-anchor': 'end', style: 'fill:var(--ink-muted);font:400 var(--type-small) var(--font-sans)' }, late); t.textContent = 'knot · ' + r.value + ' rejected';
  });
  /* missing rings: an honest blank */
  const gi = RINGS.findIndex(r => r.gap);
  if (gi >= 0) {
    const gl = RINGS.filter(r => r.gap);
    const rr = (radii[gi][0] + radii[gi + gl.length - 1][1]) / 2, [lx, ly] = pt(R + 22, 200);
    const [x, y] = pt(rr, 200);
    el('line', { x1: x, y1: y, x2: lx, y2: ly, style: 'stroke:var(--hairline-strong);stroke-dasharray:1 3' }, late);
    const t = el('text', { x: lx - 6, y: ly + 4, 'text-anchor': 'end', style: 'fill:var(--ink-muted);font:400 var(--type-small) var(--font-sans)' }, late); t.textContent = gl.length + ' missing rings · no record';
  }
  /* bark = now line; future rings dashed beyond it: distance to travel */
  el('circle', { cx, cy, r: R + 1.5, style: 'fill:none;stroke:var(--light);stroke-opacity:.55;stroke-width:1.5' }, late);
  const perDay = (radii[radii.length - 1][1] - radii[radii.length - 1][0]) / days(RINGS[RINGS.length - 1].from, DATA.now);
  const fScale = Math.max(perDay, R * .1 / days(DATA.now, DATA.ahead[DATA.ahead.length - 1].at));
  DATA.ahead.forEach((a, k) => {
    const rr = R + 1.5 + days(DATA.now, a.at) * fScale;
    el('circle', { cx, cy, r: rr, style: 'fill:none;stroke:var(--ink-muted);stroke-opacity:.6;stroke-dasharray:3 5' }, late);
    const [lx, ly] = pt(rr + 8, 28 + k * 9);
    const t = el('text', { x: lx, y: ly, style: 'fill:var(--ink-muted);font:400 var(--type-small) var(--font-sans)' }, late); t.textContent = a.label + ' · in ' + age(days(DATA.now, a.at));
  });
  const [nx, ny] = pt(R + 12, 90);
  const nt = el('text', { x: nx, y: ny + 12, 'text-anchor': 'middle', class: 't-micro', style: 'fill:var(--light)' }, late); nt.textContent = 'BARK · NOW · ' + fmt(DATA.now).toUpperCase();
  const [sx, sy] = pt(R + 12, 112);
  const sTxt = el('text', { x: sx - 4, y: sy + 14, 'text-anchor': 'end', class: 't-micro', style: 'fill:var(--ink-muted)' }, late); sTxt.textContent = 'HATCHED RINGS · STALE SINCE ' + fmt(staleFrom).toUpperCase();
  /* the bud: a proposal waiting on the bark */
  if (pending) {
    const [bx, by] = pt(R + 2, -128);
    const bud = el('g', { class: 'bud late', id: 'bud' }, svg);
    el('circle', { cx: bx, cy: by, r: 6, style: 'fill:color-mix(in srgb,var(--green) 40%,var(--slate-deep));stroke:var(--green)' }, bud);
    const t = el('text', { x: bx - 12, y: by - 10, 'text-anchor': 'end', style: 'fill:var(--green);font:400 var(--type-small) var(--font-sans)' }, bud);
    t.textContent = 'bud · ' + pending.value + ' proposed · ' + days(pending.at, DATA.now) + ' days in triage';
    if (canTriage) { const t2 = el('text', { x: bx - 12, y: by + 6, 'text-anchor': 'end', style: 'fill:var(--green);font:400 var(--type-small) var(--font-sans)' }, bud); t2.textContent = 'you can decide'; }
  }
  /* the borer: a radius through the selected ring */
  el('line', { id: 'borer', x1: cx, y1: cy, x2: cx, y2: cy, style: 'stroke:var(--info);stroke-width:1.25;stroke-opacity:.8' }, svg);
  G = { cx, cy, R, radii, pt };
  /* the chronology plot (ring width index) */
  const cs = $('#chron'); cs.innerHTML = '';
  const cw = cs.clientWidth, ch = cs.clientHeight, bw = cw / RINGS.length, mx = Math.max(...RINGS.map(r => r.n));
  RINGS.forEach((r, i) => {
    const h = r.n ? r.n / mx * (ch - 16) : 0;
    if (r.n) el('rect', { x: i * bw + 1, y: ch - 14 - h, width: bw - 2, height: h, 'data-i': i, style: `fill:${fill(DATA.sources[r.held.source].floor)}` }, cs);
    else el('rect', { x: i * bw + 1, y: ch - 18, width: bw - 2, height: 4, fill: 'url(#hatch)', style: 'stroke:var(--hairline-strong);stroke-dasharray:2 2' }, cs);
    if (i % 4 === 0) { const t = el('text', { x: i * bw + 1, y: ch, class: 't-micro', style: 'fill:var(--ink-muted)' }, cs); t.textContent = qLabel(r.from); }
  });
  el('rect', { id: 'csel', x: 0, y: 0, width: bw, height: ch - 12, style: 'fill:none;stroke:var(--info);stroke-width:1;rx:2' }, cs);
  G.bw = bw;
  const used = [...new Set(values.map(v => DATA.sources[v.source].floor))];
  const nm = { org: 'Org', department: 'Department', team: 'Team', you: 'You' };
  $('#legend').innerHTML = 'Ring colour = floor of the value held · '.toUpperCase().split('·')[0] + used.map(f => `<span><i style="background:${fill(f)}"></i>${nm[f]}</span>`).join('') +
    '<span><i style="background:repeating-linear-gradient(135deg,transparent 0 3px,var(--hairline-strong) 3px 4px)"></i>Stale or missing</span>';
}

function pick(i) {
  sel = Math.max(0, Math.min(RINGS.length - 1, i));
  const r = RINGS[sel];
  RINGS.forEach(q => q.g.classList.toggle('sel', q === r));
  const deg = -75, [x, y] = G.pt(G.radii[sel][1], deg);
  const b = $('#borer'); b.setAttribute('x2', x); b.setAttribute('y2', y);
  $('#csel').setAttribute('x', sel * G.bw);
  const isLast = sel === RINGS.length - 1;
  const v = r.held;
  const evText = r.ev.length ? r.ev.map(e => e.kind === 'value' ? 'accepted ' + e.value + ' (' + e.by + ')' : e.kind === 'rejected' ? 'rejected ' + e.value + ': ' + e.reason.toLowerCase() : e.kind === 'dispute' ? 'dispute opened, ' + e.sides.map(s => s.party + ' ' + s.value).join(' vs ') : e.kind === 'gap' ? 'feed paused' : 'proposed ' + e.value).join('; ') : 'no new values';
  let h = `<div class="eyebrow">Ring ${sel + 1} of ${RINGS.length} · ${qLabel(r.from)}${isLast ? ' · bark' : ''}</div>`;
  if (r.gap) h += `<h2>Missing ring</h2><p>${r.gap.reason}. Nothing checked this quarter; the record showed ${v.value} with no evidence behind it.</p>`;
  else h += `<h2>${v.value} ${DATA.fact.unit}</h2><p>${r.n} ${r.n === 1 ? 'piece' : 'pieces'} of evidence this quarter: ${evText}.</p>`;
  h += `<p class="m">Held value from ${DATA.sources[v.source].label}, accepted by ${v.by}.</p>`;
  if (isLast) {
    h += `<p><span class="stale">Stale since ${fmt(staleFrom)}</span> (${age(days(staleFrom, DATA.now))}). Re-verified every ${DATA.fact.refreshMonths} months; the ${DATA.fact.steward} team can refresh it.</p>`;
    if (pending) h += `<button class="btn" id="goBud">Proposal on the bark: ${pending.value}</button>`;
  }
  $('#read').innerHTML = h;
  const g = $('#goBud'); if (g) g.onclick = bud;
}
function bud() {
  $('#read').innerHTML = `<div class="eyebrow">Bud · proposal in triage</div><h2>${pending.value} from ${DATA.sources[pending.source].label}</h2>
    <p>Waiting ${days(pending.at, DATA.now)} days. Accepting it grows a new ring in this quarter and clears the stale hatch.</p>
    <p class="m">Would change ${current.value} → ${pending.value}. ${canTriage ? 'You are in the ' + DATA.fact.steward + ' team, so you can decide.' : 'The ' + DATA.fact.steward + ' team decides.'}</p>
    <button class="btn">Accept</button> <button class="btn" style="color:var(--ink);border-color:var(--hairline-strong)">Reject with reason</button>`;
}

/* ------------------------------------------------------------------ demo */
let timers = [];
function demo() {
  timers.forEach(clearTimeout); timers = [];
  draw(); $('#read').innerHTML = '<div class="eyebrow">Reading the section</div><p class="m">One ring per quarter. Wide rings had much evidence; thin rings little.</p>';
  const start = css('--motion-run'), step = reduce ? 0 : css('--motion-instant');
  RINGS.forEach((r, i) => timers.push(setTimeout(() => { r.g.classList.add('in'); r.g.style.transform = 'scale(1)'; }, start + i * step)));
  const done = start + RINGS.length * step + css('--motion-slow');
  timers.push(setTimeout(() => document.querySelectorAll('.late').forEach(n => n.classList.add('in')), done));
  timers.push(setTimeout(() => pick(RINGS.length - 1), done));
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') demo();
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); pick(sel - 1); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); pick(sel + 1); }
  else if (e.key === 't' || e.key === 'T') bud();
});
$('#sec').addEventListener('click', e => { const g = e.target.closest('.ring'); if (g) pick(+g.dataset.i); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { draw(); RINGS.forEach(r => { r.g.classList.add('in'); r.g.style.transform = 'scale(1)'; }); document.querySelectorAll('.late').forEach(n => n.classList.add('in')); pick(sel); }, 100); });
$('#crumb').textContent = DATA.app + ' · ' + DATA.entity.type;
$('#ename').textContent = DATA.entity.name;
$('#attr').textContent = DATA.fact.attr + ' (' + DATA.fact.unit + ') · cross-section, pith ' + qLabel(first) + ', bark now';
demo();
</script>
</body>
