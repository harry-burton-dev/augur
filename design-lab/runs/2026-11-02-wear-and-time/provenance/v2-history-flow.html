<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provenance · V2 history flow</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<style>
/* Proposed tokens (each listed under "needs token" in notes.md) */
:root{
  --x-type-micro: .6875rem;                 /* proposed --type-micro (mono numerals) */
  --x-stratum-mix: 34%;                     /* proposed --stratum-mix: floor colour share in a band */
  --x-past-dim: .5;                         /* proposed --time-past-dim */
  --x-seam: color-mix(in srgb, var(--light) 80%, transparent);   /* proposed --mark-seam */
  --x-fault: var(--warning);                /* proposed --mark-fault */
  --x-label-col: calc(var(--measure-rail) - var(--space-5));     /* 212: row label column */
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
body{overflow:hidden}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink)}
.head{position:fixed;top:var(--edge);left:calc(var(--edge) + var(--space-2))}
.head .crumb{display:flex;gap:var(--space-2);align-items:center}
.head h1{margin:var(--space-2) 0 0;font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.head .attr{margin-top:var(--space-1);font-size:var(--type-meta);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}
.head .attr b{font-weight:400;color:var(--ink)}
.keys{position:fixed;right:var(--edge);top:var(--edge);display:flex;gap:var(--space-3);align-items:center;font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}

svg#flow{position:fixed;inset:0;width:100%;height:100%}
.draw{clip-path:inset(0 100% 0 0);transition:clip-path var(--motion-run) var(--ease-standard)}
.draw.in{clip-path:inset(0 0 0 0)}
@media (prefers-reduced-motion: reduce){.draw{clip-path:none;opacity:0;transition:opacity var(--motion-calm) var(--ease-standard)}.draw.in{opacity:1}}
.t-micro{font:400 var(--x-type-micro) var(--font-mono);letter-spacing:var(--tracking-caps)}

/* rows of small multiples: real buttons over the svg */
.rows{position:fixed;left:0;right:0;top:0;height:0}
.row{position:absolute;left:var(--edge);display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);
  width:calc(var(--x-label-col));padding:0 var(--space-2);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink-muted)}
.row .val{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink)}
.row[aria-pressed="true"]{background:var(--surface-raised);color:var(--light)}
.row:hover{color:var(--ink)}
.row .st{font:400 var(--x-type-micro)/1 var(--font-mono);padding:var(--space-1);border-radius:var(--radius-key);background:repeating-linear-gradient(135deg,transparent 0 3px,var(--hairline-strong) 3px 4px)}

/* the scrub card: what the record said at the cursor */
.card{position:fixed;width:var(--measure-rail);background:var(--surface-pane);backdrop-filter:blur(var(--surface-blur));
  border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-4);pointer-events:none;
  opacity:0;transition:opacity var(--motion-base) var(--ease-out),left var(--motion-quick) var(--ease-standard),top var(--motion-quick) var(--ease-standard)}
.card.in{opacity:1}
.card h3{margin:var(--space-1) 0;font:300 var(--type-body)/var(--leading-body) var(--font-sans);color:var(--light)}
.card p{margin:0;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink)}
.card p+p{margin-top:var(--space-1);color:var(--ink-muted)}

/* shapes that mean something: the History Flow glossary */
.gloss{position:fixed;right:var(--edge);display:grid;gap:var(--space-2);width:calc(var(--measure-rail) - var(--space-4));font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.gloss{gap:var(--space-1)!important}
.gloss .g{display:grid;grid-template-columns:var(--space-6) 1fr;gap:var(--space-3);align-items:center}
.gloss .g b{font-weight:400;color:var(--ink)}
.gloss svg{width:var(--space-6);height:var(--space-4)}
.beacon{filter:drop-shadow(0 0 calc(var(--glow-blur) / 3) var(--green))}
</style>
</head>
<body>
<header class="head">
  <div class="crumb eyebrow"><span id="crumb"></span></div>
  <h1 id="ename"></h1>
  <div class="attr" id="attr"></div>
</header>
<div class="keys"><span><span class="kbd">←</span> <span class="kbd">→</span> scrub</span><span><span class="kbd">↑</span> <span class="kbd">↓</span> fact</span><span><span class="kbd">R</span> replay</span></div>
<svg id="flow" aria-hidden="true"></svg>
<div class="rows" id="rows" role="group" aria-label="Facts on this entity"></div>
<div class="card" id="card" aria-live="polite"></div>
<div class="gloss" id="gloss" aria-label="What the shapes mean"></div>
<div class="x-cap"><b>Provenance · V2</b> history flow: one picture of every revision, shapes that mean something · Viégas and Wattenberg, Tufte small multiples</div>
<script src="../../../_kit/icons.js"></script>
<script>
/* ------------------------------------------------------------------ sample data (one object) */
const DATA = {
  now: '2026-11-02', start: '2023-03-01', end: '2027-04-30',
  app: 'Data Atlas',
  viewer: { name: 'Harry', teams: ['Supplier data'] },
  entity: { type: 'Supplier', name: 'Kestrel Logistics' },
  steward: 'Supplier data',
  sources: {
    register: { label: 'Companies register', floor: 'org' },
    report: { label: 'Annual report', floor: 'department' },
    questionnaire: { label: 'Supplier questionnaire', floor: 'team' },
    payroll: { label: 'Payroll extract', floor: 'department' },
    contract: { label: 'Contract system', floor: 'team' },
    you: { label: 'Entered by hand', floor: 'you' },
    web: { label: 'Web profile crawl', floor: null }
  },
  facts: [
    { attr: 'Headcount', unit: 'employees', refreshMonths: 12, record: [
      { kind: 'value', from: '2023-03-06', value: 240, source: 'register', by: 'Register import', note: 'First record' },
      { kind: 'value', from: '2023-09-18', value: 265, source: 'report', by: 'Dana Okafor', note: 'Annual report 2023, page 4' },
      { kind: 'rejected', at: '2023-12-02', value: 268, source: 'web', by: 'Dana Okafor', reason: 'Rounded copy of the annual report' },
      { kind: 'gap', from: '2024-01-10', to: '2024-11-04', reason: 'Register feed paused; the value still read 265 with nothing behind it' },
      { kind: 'value', from: '2024-11-04', value: 265, source: 'report', by: 'Sam Reyes', note: 'Re-checked after the gap' },
      { kind: 'rejected', at: '2024-11-04', value: 410, source: 'web', by: 'Sam Reyes', reason: 'Counts contractors, not employees' },
      { kind: 'value', from: '2025-02-20', value: 312, source: 'questionnaire', by: 'Sam Reyes', note: 'Questionnaire, Q1 2025' },
      { kind: 'dispute', from: '2025-06-03', to: '2025-08-14', sides: [ { value: 290, party: 'Procurement', floor: 'team' }, { value: 312, party: 'Finance', floor: 'department' } ] },
      { kind: 'value', from: '2025-08-14', value: 305, source: 'payroll', by: 'Ines Duarte', seam: true, note: 'Payroll extract settled the dispute' },
      { kind: 'pending', at: '2026-04-22', value: 330, source: 'report', by: 'Annual report import', note: 'Annual report 2025, page 6' } ] },
    { attr: 'Annual revenue', unit: 'GBP m', refreshMonths: 12, record: [
      { kind: 'value', from: '2023-03-06', value: 38.2, source: 'register', by: 'Register import', note: 'Filed accounts 2022' },
      { kind: 'value', from: '2023-09-18', value: 41.0, source: 'report', by: 'Dana Okafor', note: 'Annual report 2023' },
      { kind: 'rejected', at: '2024-06-12', value: 52.0, source: 'web', by: 'Sam Reyes', reason: 'Group figure, not this company' },
      { kind: 'value', from: '2024-09-30', value: 44.6, source: 'report', by: 'Sam Reyes', note: 'Annual report 2024' },
      { kind: 'value', from: '2025-10-01', value: 47.9, source: 'report', by: 'Sam Reyes', note: 'Annual report 2025' } ] },
    { attr: 'Registered office', unit: '', refreshMonths: 24, record: [
      { kind: 'value', from: '2023-03-06', value: 'Leeds', source: 'register', by: 'Register import', note: 'Register entry' },
      { kind: 'value', from: '2025-04-07', value: 'York', source: 'register', by: 'Register import', note: 'Change of address filed' } ] },
    { attr: 'Payment terms', unit: 'days', refreshMonths: 6, record: [
      { kind: 'value', from: '2023-05-02', value: 60, source: 'contract', by: 'Contract system', note: 'Framework agreement' },
      { kind: 'dispute', from: '2024-02-01', to: '2024-03-20', sides: [ { value: 30, party: 'Procurement', floor: 'team' }, { value: 60, party: 'Finance', floor: 'department' } ] },
      { kind: 'value', from: '2024-03-20', value: 45, source: 'contract', by: 'Ines Duarte', seam: true, note: 'Contract variation 3' },
      { kind: 'gap', from: '2025-01-15', to: '2026-11-02', reason: 'Contract system no longer syncs this field' } ] },
    { attr: 'Primary contact', unit: '', refreshMonths: 6, record: [
      { kind: 'value', from: '2023-03-20', value: 'A. Brooks', source: 'you', by: 'Harry', note: 'Entered by hand' },
      { kind: 'value', from: '2024-05-13', value: 'M. Chen', source: 'questionnaire', by: 'Sam Reyes', note: 'Questionnaire' },
      { kind: 'rejected', at: '2025-03-03', value: 'J. Patel', source: 'web', by: 'Sam Reyes', reason: 'Left the company' },
      { kind: 'value', from: '2026-07-01', value: 'R. Silva', source: 'questionnaire', by: 'Sam Reyes', note: 'Questionnaire Q2 2026' } ] },
    { attr: 'Risk rating', unit: '', refreshMonths: 6, record: [
      { kind: 'value', from: '2023-04-11', value: 'Low', source: 'contract', by: 'Risk review', note: 'Onboarding review' },
      { kind: 'value', from: '2025-06-03', value: 'Medium', source: 'contract', by: 'Risk review', note: 'Raised during the headcount dispute' },
      { kind: 'value', from: '2025-12-09', value: 'Low', source: 'contract', by: 'Risk review', note: 'Review closed' } ] }
  ],
  ahead: [ { at: '2026-12-01', label: 'Questionnaire Q4' }, { at: '2027-03-31', label: 'Annual report 2026' } ]
};

/* ------------------------------------------------------------------ helpers */
const $ = s => document.querySelector(s);
const D = s => new Date(s + 'T00:00:00Z');
const days = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = s => { const d = D(s); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const fmtM = s => { const d = D(s); return MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const age = n => n < 45 ? n + ' days' : n < 540 ? Math.round(n / 30.4) + ' months' : (n / 365).toFixed(1) + ' years';
const addMonths = (s, m) => { const d = D(s); d.setUTCMonth(d.getUTCMonth() + m); return d.toISOString().slice(0, 10); };
const css = v => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v));
const FV = { org: '--floor-org-high', department: '--floor-department-high', team: '--floor-team-high', you: '--floor-you-high' };
const fill = f => f ? `color-mix(in srgb, var(${FV[f]}) var(--x-stratum-mix), var(--slate-deep))` : 'color-mix(in srgb, var(--ink-muted) 22%, var(--slate-deep))';
const edge = f => f ? `var(${FV[f]})` : 'var(--ink-muted)';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const txt = (p, x, y, s, style, anchor) => { const t = el('text', { x, y, style: style || '', 'text-anchor': anchor || 'start' }, p); t.textContent = s; return t; };

/* derive the shape list of one fact */
function shape(f) {
  const out = [], rec = f.record;
  rec.forEach((r, i) => {
    if (r.kind !== 'value') return;
    const nxt = rec.slice(i + 1).find(q => q.kind === 'value' || q.kind === 'gap' || q.kind === 'dispute');
    out.push({ ...r, to: nxt ? nxt.from : DATA.now });
  });
  const cur = out[out.length - 1];
  const lastCheck = [...rec].reverse().find(r => r.kind === 'value' || r.kind === 'dispute');
  const verified = cur.from;
  const staleFrom = addMonths(verified, f.refreshMonths);
  const gapToNow = rec.find(r => r.kind === 'gap' && r.to === DATA.now);
  return { segs: out, cur, staleFrom, stale: D(DATA.now) >= D(staleFrom) || !!gapToNow, gapToNow };
}
const numeric = f => f.record.every(r => r.kind === 'gap' || (r.kind === 'dispute' ? r.sides.every(s => typeof s.value === 'number') : typeof r.value === 'number'));
function scaleFor(f, top, bot, th0 = 0) {
  const vals = [];
  f.record.forEach(r => { if (r.kind === 'dispute') r.sides.forEach(s => vals.push(s.value)); else if ('value' in r && r.kind !== 'rejected') vals.push(r.value); });
  if (!numeric(f)) f.record.forEach(r => { if (r.kind === 'rejected') vals.push(r.value); });
  if (numeric(f)) {
    const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * .12 || 1;
    return v => Math.max(top - th0, Math.min(bot + th0, bot - (v - (lo - pad)) / ((hi + pad) - (lo - pad)) * (bot - top)));
  }
  const lanes = [...new Set(vals)];
  return v => lanes.length < 2 ? (top + bot) / 2 : bot - lanes.indexOf(v) / (lanes.length - 1) * (bot - top);
}

/* draw one fact as a flow into group g. big = the main chart */
function drawFlow(g, f, x, top, bot, th, big) {
  const y = scaleFor(f, top + th * 2, bot - th, th);
  const S = shape(f);
  const defs = $('#defs');
  const lineS = big ? 1.25 : 1;
  const ageOp = s => (1 - days(s, DATA.now) / days(DATA.start, DATA.now) * (1 - css('--x-past-dim'))).toFixed(2);
  let prev = null;
  f.record.forEach((r, i) => {
    if (r.kind === 'value') {
      const s = S.segs.find(q => q === r || (q.from === r.from && q.value === r.value));
      const src = DATA.sources[r.source];
      const yy = y(r.value);
      const band = el('g', { style: `opacity:${ageOp(s.to)}` }, g);
      if (prev && prev.y !== yy && !prev.dispute) {
        const k = Math.min(10, (x(s.to) - x(r.from)) / 3);
        el('path', { d: `M${x(r.from) - k},${prev.y - th / 2} L${x(r.from) + k},${yy - th / 2} L${x(r.from) + k},${yy + th / 2} L${x(r.from) - k},${prev.y + th / 2}Z`, style: `fill:${fill(src.floor)};opacity:.7` }, band);
      }
      el('rect', { x: x(r.from) + (prev && prev.y !== yy && !prev.dispute ? Math.min(10, (x(s.to) - x(r.from)) / 3) : 0), y: yy - th / 2, width: Math.max(1, x(s.to) - x(r.from) - (prev && prev.y !== yy && !prev.dispute ? Math.min(10, (x(s.to) - x(r.from)) / 3) : 0)), height: th, style: `fill:${fill(src.floor)}` }, band);
      el('line', { x1: x(r.from), x2: x(s.to), y1: yy - th / 2, y2: yy - th / 2, style: `stroke:${edge(src.floor)};stroke-opacity:.45;stroke-width:1` }, band);
      if (r.seam) el('line', { x1: x(r.from), x2: x(r.from), y1: yy - th / 2 - 3, y2: yy + th / 2 + 3, style: `stroke:var(--x-seam);stroke-width:${big ? 2 : 1.5}` }, g);
      if (big) {
        txt(band, x(r.from) + (prev && prev.y !== yy && !prev.dispute ? 16 : 6), yy + 4, r.value, 'fill:var(--light);font:400 var(--type-small) var(--font-mono)');
      }
      prev = { y: yy, x: x(s.to), floor: src.floor, value: r.value };
    } else if (r.kind === 'gap' && prev) {
      const a = x(r.from), b = x(r.to);
      el('rect', { x: a, y: prev.y - th / 2, width: b - a, height: th, fill: 'url(#hatch)', style: 'stroke:var(--hairline-strong);stroke-dasharray:2 3' }, g);
      [a, b].forEach((xx, k) => { if (r.to === DATA.now && k) return; el('path', { d: `M${xx},${prev.y - th / 2 - 4} q3,${(th + 8) / 4} 0,${(th + 8) / 2} q-3,${(th + 8) / 4} 0,${(th + 8) / 2}`, style: `fill:none;stroke:var(--ink-muted);stroke-width:${lineS}` }, g); });
      if (big) txt(g, (a + b) / 2, prev.y + th / 2 + 16, 'UNCONFORMITY · NO RECORD ' + age(days(r.from, r.to)).toUpperCase(), 'fill:var(--ink-muted)', 'middle').classList.add('t-micro');
    } else if (r.kind === 'dispute' && prev) {
      /* fork: one band splits into two claims, then a seam joins them again (1 + 1 = 3) */
      const a = x(r.from), b = x(r.to), k = Math.min(14, (b - a) / 4);
      const nxt = f.record.slice(i + 1).find(q => q.kind === 'value');
      const ny = nxt ? y(nxt.value) : prev.y;
      const t2 = th * .6;
      r.sides.forEach(sd => {
        const sy = y(sd.value);
        el('path', { d: `M${a},${prev.y - t2 / 2} L${a + k},${sy - t2 / 2} L${b - k},${sy - t2 / 2} L${b},${ny - t2 / 2} L${b},${ny + t2 / 2} L${b - k},${sy + t2 / 2} L${a + k},${sy + t2 / 2} L${a},${prev.y + t2 / 2}Z`, style: `fill:${fill(sd.floor)};stroke:${edge(sd.floor)};stroke-opacity:.4` }, g);
      });
      el('path', { d: `M${a + k},${y(r.sides[0].value)} L${a + k},${y(r.sides[1].value)}`, style: `stroke:var(--x-fault);stroke-width:${lineS};stroke-dasharray:2 2` }, g);
      if (big) { const lowY = Math.max(...r.sides.map(sd => y(sd.value))) + t2 / 2;
        txt(g, (a + b) / 2, lowY + 16, 'FAULT · ' + r.sides.map(sd => sd.value).join(' / ') + ' · ' + age(days(r.from, r.to)).toUpperCase(), 'fill:var(--x-fault)', 'middle').classList.add('t-micro');
      }
      prev = { y: ny, dispute: true };
    } else if (r.kind === 'rejected' && prev) {
      /* spur: a proposal that branched off and died */
      const a = x(r.at), ty = y(r.value), len = big ? 46 : 18;
      el('path', { d: `M${a},${prev.y - th / 3} L${a + len},${ty} L${a},${prev.y + th / 3}Z`, style: `fill:color-mix(in srgb,var(--ink-muted) 30%,transparent);opacity:${ageOp(r.at)}` }, g);
      el('circle', { cx: a + len, cy: ty, r: big ? 3.5 : 2, style: 'fill:none;stroke:var(--ink-muted)' }, g);
      if (big) txt(g, a + len + 8, Math.min(ty, prev.y - th / 2 - 18) + 4, r.value + ' rejected' + (ty <= top + th ? ' (off scale)' : '') + ' · ' + r.reason.toLowerCase(), `fill:var(--ink-muted);font:400 var(--type-small) var(--font-sans);opacity:${ageOp(r.at)}`);
    } else if (r.kind === 'pending' && prev) {
      const a = x(DATA.now), ty = y(r.value), len = big ? 54 : 18;
      const pg = el('g', { class: 'beacon' }, g); pg.id = big ? 'pend' : '';
      el('path', { d: `M${a},${prev.y - th / 3} L${a + len},${ty} L${a},${prev.y + th / 3}Z`, style: 'fill:color-mix(in srgb,var(--green) 35%,transparent);stroke:var(--green);stroke-width:1' }, pg);
      el('circle', { cx: a + len, cy: ty, r: big ? 4 : 2.5, style: 'fill:var(--green)' }, pg);
      if (big) txt(pg, a - 8, ty - 6, r.value + ' proposed · in triage ' + days(r.at, DATA.now) + ' days' + (DATA.viewer.teams.includes(DATA.steward) ? ' · you can decide' : ''), 'fill:var(--green);font:400 var(--type-small) var(--font-sans)', 'end');
    }
  });
  /* stale hatch and tide line on the current band */
  if (S.stale && !S.gapToNow) {
    const yy = y(S.cur.value), a = x(S.staleFrom), b = x(DATA.now);
    el('rect', { x: a, y: yy - th / 2, width: b - a, height: th, fill: 'url(#hatch)' }, g);
    el('line', { x1: a, x2: a, y1: yy - th / 2 - (big ? 14 : 3), y2: yy + th / 2 + (big ? 14 : 3), style: 'stroke:var(--ink-muted);stroke-dasharray:2 2' }, g);
    if (big) txt(g, a - 6, yy + th / 2 + 16, 'TIDE LINE · DUE ' + fmtM(S.staleFrom).toUpperCase(), 'fill:var(--ink-muted)', 'end').classList.add('t-micro');
  }
  /* high-water mark: the highest accepted value */
  if (big && numeric(f)) {
    const hv = Math.max(...S.segs.map(s => s.value)); const hs = S.segs.find(s => s.value === hv);
    el('line', { x1: x(hs.from), x2: x(DATA.now), y1: y(hv) - th / 2 - 1, y2: y(hv) - th / 2 - 1, style: 'stroke:var(--info);stroke-opacity:.45;stroke-dasharray:6 4' }, g);
    txt(g, x(DATA.now) - 6, y(hv) - th / 2 - 8, 'HIGH-WATER MARK ' + hv + ' · ' + fmtM(hs.from).toUpperCase(), 'fill:var(--info);opacity:.8', 'end').classList.add('t-micro');
  }
  return { y, S };
}

/* ------------------------------------------------------------------ layout */
let fi = 0, cursor = null, L = null;
function layout() {
  const W = innerWidth, H = innerHeight, svg = $('#flow');
  svg.innerHTML = '';
  const defs = el('defs', { id: 'defs' }, svg);
  const pat = el('pattern', { id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 6, style: 'stroke:var(--hairline-strong);stroke-width:1.5' }, pat);
  const left = css('--edge') + css('--measure-rail') - css('--space-5') + css('--space-5');
  const right = W - css('--edge') - css('--measure-rail') - css('--space-5');
  const x = s => left + days(DATA.start, s) / days(DATA.start, DATA.end) * (right - left);
  const mainTop = H < 850 ? 150 : 168, rowH = H < 850 ? 30 : 34;
  const rowsTop = H - 70 - DATA.facts.length * rowH;
  const mainBot = rowsTop - 64;
  L = { W, H, x, left, right, mainTop, mainBot, rowsTop, rowH };

  /* axis: years, now, the future */
  const ax = el('g', {}, svg);
  for (let yr = 2024; yr <= 2027; yr++) {
    const xx = x(yr + '-01-01');
    el('line', { x1: xx, x2: xx, y1: mainTop - 10, y2: H - 64, style: 'stroke:var(--hairline)' }, ax);
    txt(ax, xx + 4, mainTop - 14, yr, 'fill:var(--ink-muted)').classList.add('t-micro');
  }
  const nx = x(DATA.now);
  el('rect', { x: nx, y: mainTop - 10, width: right - nx, height: H - 64 - mainTop + 10, style: 'fill:color-mix(in srgb,var(--slate-deep) 45%,transparent)' }, ax);
  el('line', { x1: nx, x2: nx, y1: mainTop - 28, y2: H - 64, style: 'stroke:var(--light);stroke-opacity:.55' }, ax);
  txt(ax, nx + 6, mainTop - 32, 'NOW · ' + fmt(DATA.now).toUpperCase(), 'fill:var(--light)').classList.add('t-micro');
  DATA.ahead.forEach((a, k) => {
    const xx = x(a.at), yy = mainBot + 20 + k * 16;
    el('line', { x1: nx, x2: xx, y1: yy, y2: yy, style: 'stroke:var(--ink-muted);stroke-dasharray:3 4' }, ax);
    el('line', { x1: xx, x2: xx, y1: yy - 4, y2: yy + 4, style: 'stroke:var(--ink-muted)' }, ax);
    txt(ax, nx - 8, yy + 4, a.label + ' · in ' + age(days(DATA.now, a.at)), 'fill:var(--ink-muted);font:400 var(--type-small) var(--font-sans)', 'end');
  });

  /* main flow */
  const mg = el('g', { class: 'draw', id: 'main' }, svg);
  const th = H < 850 ? 16 : 20;
  L.main = drawFlow(mg, DATA.facts[fi], x, mainTop, mainBot, th, true);

  /* small multiples: every fact on the entity, same time axis */
  const sg = el('g', { class: 'draw', id: 'small' }, svg);
  el('line', { x1: left, x2: right, y1: rowsTop - 14, y2: rowsTop - 14, style: 'stroke:var(--hairline)' }, sg);
  txt(sg, left, rowsTop - 22, 'EVERY FACT ON THIS ' + DATA.entity.type.toUpperCase() + ', SAME TIME AXIS', 'fill:var(--ink-muted)').classList.add('t-micro');
  const rows = $('#rows'); rows.innerHTML = '';
  DATA.facts.forEach((f, k) => {
    const top = rowsTop + k * rowH;
    if (k === fi) el('rect', { x: left - 8, y: top + 1, width: right - left + 16, height: rowH - 2, rx: 4, style: 'fill:var(--surface-inset)' }, sg);
    const r = drawFlow(el('g', {}, sg), f, x, top + 2, top + rowH - 2, H < 850 ? 5 : 6, false);
    const b = document.createElement('button');
    b.className = 'row'; b.style.top = top + 'px'; b.style.height = rowH + 'px';
    const cur = r.S.cur.value;
    b.innerHTML = `<span>${f.attr}</span><span class="val">${r.S.stale ? '<span class="st" title="stale">' + cur + '</span>' : cur}</span>`;
    b.setAttribute('aria-pressed', k === fi ? 'true' : 'false');
    b.setAttribute('aria-label', `${f.attr}: ${cur}${f.unit ? ' ' + f.unit : ''}${r.S.stale ? ', stale' : ''}`);
    b.onclick = () => pick(k);
    rows.appendChild(b);
  });

  /* cursor */
  el('line', { id: 'cur', x1: 0, x2: 0, y1: mainTop - 10, y2: H - 64, style: 'stroke:var(--info);stroke-width:1;opacity:0;transition:opacity var(--motion-base) var(--ease-out)' }, svg);
  $('#gloss').style.top = (rowsTop - 22) + 'px';
  const f = DATA.facts[fi];
  $('#attr').innerHTML = `<b>${f.attr}</b>${f.unit ? ' (' + f.unit + ')' : ''} · re-verified every ${f.refreshMonths} months by ${DATA.steward}`;
}

/* stops along the record for the scrubber */
function stops() {
  const f = DATA.facts[fi], out = [];
  f.record.forEach(r => out.push({ t: r.from || r.at, r }));
  out.push({ t: DATA.now, r: { kind: 'now' } });
  return out.sort((a, b) => D(a.t) - D(b.t));
}
function stateAt(t) {
  const f = DATA.facts[fi]; let v = null, src = null, by = null;
  f.record.forEach(r => { if (r.kind === 'value' && D(r.from) <= D(t)) { v = r.value; src = r.source; by = r.by; } });
  return { v, src, by };
}
function scrub(k) {
  const st = stops(); k = Math.max(0, Math.min(st.length - 1, k)); cursor = k;
  const s = st[k], r = s.r, f = DATA.facts[fi], S = shape(f);
  const xx = L.x(s.t); const c = $('#cur'); c.setAttribute('x1', xx); c.setAttribute('x2', xx); c.style.opacity = 1;
  const at = stateAt(s.t), card = $('#card');
  let h = '';
  const unit = f.unit ? ' ' + f.unit : '';
  if (r.kind === 'now') {
    h = `<div class="eyebrow">Now · why ${S.cur.value}?</div><h3>${S.cur.value}${unit} since ${fmt(S.cur.from)}</h3><p>${DATA.sources[S.cur.source].label} · ${S.cur.by}. ${S.cur.note}.</p>` +
        (S.stale ? `<p>Stale ${S.gapToNow ? ': no source since ' + fmt(S.gapToNow.from) : 'since ' + fmt(S.staleFrom)}. ${DATA.steward} can refresh it.</p>` : `<p>Verified, next check ${fmt(S.staleFrom)}.</p>`);
  } else if (r.kind === 'value') {
    h = `<div class="eyebrow">${fmt(r.from)}</div><h3>${r.value}${unit}</h3><p>${DATA.sources[r.source].label} · accepted by ${r.by}. ${r.note}.</p>`;
  } else if (r.kind === 'rejected') {
    h = `<div class="eyebrow">${fmt(r.at)} · spur</div><h3>${r.value} rejected</h3><p>${r.reason}. ${r.by} decided. The record kept saying ${at.v}.</p>`;
  } else if (r.kind === 'gap') {
    h = `<div class="eyebrow">${fmt(r.from)} · unconformity</div><h3>No record for ${age(days(r.from, r.to))}</h3><p>${r.reason}.</p>`;
  } else if (r.kind === 'dispute') {
    h = `<div class="eyebrow">${fmt(r.from)} · fork</div><h3>${r.sides.map(s => s.party + ' ' + s.value).join(' vs ')}</h3><p>Two claims for ${age(days(r.from, r.to))}; joined again by a seam on ${fmt(r.to)}.</p>`;
  } else if (r.kind === 'pending') {
    h = `<div class="eyebrow">${fmt(r.at)} · proposed, waiting</div><h3>${r.value}${unit} in triage</h3><p>${DATA.sources[r.source].label}. ${days(r.at, DATA.now)} days waiting. ${DATA.viewer.teams.includes(DATA.steward) ? 'You can accept or reject it.' : DATA.steward + ' decides.'}</p>`;
  }
  card.innerHTML = h;
  const cw = card.offsetWidth;
  card.style.left = (L.right + css('--space-5')) + 'px';
  card.style.top = (L.mainTop - 10) + 'px';
  card.classList.add('in');
}
function pick(k) { fi = (k + DATA.facts.length) % DATA.facts.length; layout(); ['main', 'small'].forEach(id => $('#' + id).classList.add('in')); scrub(stops().length - 1); $('#rows').children[fi].focus(); }

function gloss() {
  const G = [
    ['spur', 'Spur', 'rejected'],
    ['fork', 'Fork + seam', 'dispute, corrected'],
    ['hatch', 'Hatch', 'no record or stale'],
    ['step', 'Step', 'accepted; colour = floor'],
    ['hwm', 'High water', 'highest accepted']
  ];
  $('#gloss').innerHTML = '<div class="eyebrow">Shapes</div>' + G.map(([k, n, d]) => `<div class="g" title="${d}"><svg data-k="${k}" viewBox="0 0 72 28" preserveAspectRatio="none"></svg><span><b>${n}</b> · ${d}</span></div>`).join('');
  $('#gloss').querySelectorAll('svg').forEach(s => {
    const k = s.dataset.k;
    const b = (x1, x2, y) => el('rect', { x: x1, y: y - 4, width: x2 - x1, height: 8, style: `fill:${fill('department')}` }, s);
    if (k === 'spur') { b(0, 72, 18); el('path', { d: 'M30,15 L48,4 L30,21Z', style: 'fill:color-mix(in srgb,var(--ink-muted) 35%,transparent)' }, s); }
    if (k === 'fork') { b(0, 18, 14); b(54, 72, 14); el('path', { d: 'M18,11 L26,4 L46,4 L54,11 L54,17 L46,10 L26,10 L18,17Z', style: `fill:${fill('team')}` }, s); el('path', { d: 'M18,11 L26,18 L46,18 L54,11 L54,17 L46,24 L26,24 L18,17Z', style: `fill:${fill('department')}` }, s); el('line', { x1: 54, x2: 54, y1: 6, y2: 22, style: 'stroke:var(--x-seam);stroke-width:2' }, s); }
    if (k === 'hatch') { b(0, 24, 14); el('rect', { x: 24, y: 10, width: 48, height: 8, fill: 'url(#hatch)', style: 'stroke:var(--hairline-strong);stroke-dasharray:2 3' }, s); }
    if (k === 'step') { el('rect', { x: 0, y: 16, width: 32, height: 8, style: `fill:${fill('org')}` }, s); el('path', { d: 'M32,16 L42,6 L42,14 L32,24Z', style: `fill:${fill('team')};opacity:.7` }, s); el('rect', { x: 42, y: 6, width: 30, height: 8, style: `fill:${fill('team')}` }, s); }
    if (k === 'hwm') { b(0, 72, 20); el('line', { x1: 0, x2: 72, y1: 8, y2: 8, style: 'stroke:var(--info);stroke-opacity:.6;stroke-dasharray:6 4' }, s); }
  });
}

/* ------------------------------------------------------------------ demo */
let timers = [];
function demo() {
  timers.forEach(clearTimeout); timers = [];
  fi = 0; layout(); gloss(); $('#card').classList.remove('in');
  const run = css('--motion-run');
  timers.push(setTimeout(() => ['main', 'small'].forEach(id => $('#' + id).classList.add('in')), run));
  timers.push(setTimeout(() => scrub(stops().length - 1), run * 2));
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') demo();
  else if (e.key === 'ArrowLeft') { e.preventDefault(); scrub((cursor ?? stops().length - 1) - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); scrub((cursor ?? stops().length - 1) + 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); pick(fi + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); pick(fi - 1); }
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layout(); gloss(); ['main', 'small'].forEach(id => $('#' + id).classList.add('in')); if (cursor != null) scrub(cursor); }, 100); });
$('#crumb').textContent = DATA.app + ' · ' + DATA.entity.type;
$('#ename').textContent = DATA.entity.name;
demo();
</script>
</body>
