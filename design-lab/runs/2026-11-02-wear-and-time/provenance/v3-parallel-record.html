<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provenance · V3 parallel record</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<style>
/* Proposed tokens (each listed under "needs token" in notes.md) */
:root{
  --x-type-micro: .6875rem;                 /* proposed --type-micro */
  --x-stratum-mix: 34%;                     /* proposed --stratum-mix */
  --x-link-fill: color-mix(in srgb, var(--ink) 7%, transparent);         /* proposed --link-same: Xanadu ribbon for "unchanged" */
  --x-link-edge: color-mix(in srgb, var(--ink) 22%, transparent);
  --x-seam: color-mix(in srgb, var(--light) 80%, transparent);           /* proposed --mark-seam */
  --x-gutter: calc(var(--space-8) + var(--space-8));                      /* 232: space between the two states */
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
body{overflow:hidden}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink)}
.head{position:fixed;top:var(--edge);left:calc(var(--edge) + var(--space-2))}
.head h1{margin:var(--space-2) 0 0;font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.head .attr{margin-top:var(--space-1);font-size:var(--type-meta);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}
.keys{position:fixed;right:var(--edge);top:var(--edge);display:flex;gap:var(--space-3);align-items:center;font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}

/* the strip: the whole record, two handles */
.strip{position:fixed;left:calc(var(--edge) * 2);right:calc(var(--edge) * 2);top:calc(var(--band-top) * 2 + var(--space-6));height:var(--space-6)}
.strip svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.handle{position:absolute;top:calc(var(--space-2) * -1);bottom:calc(var(--space-2) * -1);width:var(--space-4);transform:translateX(-50%);
  display:flex;justify-content:center;transition:left var(--motion-slow) var(--ease-standard)}
.handle::before{content:"";width:2px;background:var(--light);border-radius:1px;opacity:.85}
.handle span{position:absolute;bottom:calc(100% + var(--space-1));white-space:nowrap;font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.handle:not(.then) span{right:0}
.handle.then::before{background:var(--info)}
.handle.then span{color:var(--info)}

/* the two states */
.pair{position:fixed;left:calc(var(--edge) * 2);right:calc(var(--edge) * 2);top:calc(var(--band-top) * 2 + var(--space-6) + var(--space-8));display:grid;grid-template-columns:1fr var(--x-gutter) 1fr}
.state{background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset);padding:var(--space-3) var(--space-5) var(--space-2);
  transition:opacity var(--motion-base) var(--ease-standard)}
.state.then{border-color:color-mix(in srgb,var(--info) 35%,var(--hairline))}
.state .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-2)}
.state .top .when{font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.rowf{display:grid;grid-template-columns:calc(var(--space-8) + var(--space-4)) 1fr;align-items:center;min-height:var(--x-row);gap:var(--space-3);border-top:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.rowf .k{color:var(--ink-muted);font-size:var(--type-small);letter-spacing:var(--tracking-soft)}
.rowf .v{color:var(--ink)}
.tok{border-radius:var(--radius-key);padding:0 calc(var(--space-1) / 2);margin:0 calc(var(--space-1) / -2);transition:background var(--motion-calm) var(--ease-out)}
.tok.on{background:var(--x-link-fill);box-shadow:0 0 0 1px var(--x-link-edge)}
.rowf .v.big{font:300 var(--type-heading)/1 var(--font-mono);color:var(--light)}
.rowf.chg .v{color:var(--light)}
.rowf .sub{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.stale{display:inline-block;padding:0 var(--space-1);border-radius:var(--radius-key);background:repeating-linear-gradient(135deg,transparent 0 var(--space-1),var(--hairline-strong) var(--space-1) calc(var(--space-1) + 1px))}
.pendrow .v{color:var(--green)}
.pendrow{border-radius:var(--radius-key);box-shadow:inset var(--space-1) 0 0 color-mix(in srgb,var(--green) 70%,transparent)}
.pendrow.lit{background:color-mix(in srgb,var(--green) 7%,transparent);box-shadow:inset var(--space-1) 0 0 var(--green),0 0 var(--glow-blur) color-mix(in srgb,var(--green) 18%,transparent)}
.pendrow .k,.pendrow .v{padding-left:var(--space-2)}
.btn{display:inline-flex;align-items:center;height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid color-mix(in srgb,var(--green) 50%,transparent);color:var(--green);font-size:var(--type-small);margin-left:var(--space-2)}

@media (max-height: 850px){
  .strip{top:calc(var(--band-top) * 2 + var(--space-4))}
  .pair{top:calc(var(--band-top) * 2 + var(--space-4) + var(--space-8) - var(--space-5))}
  .state .top{margin-bottom:0}
}
svg#links{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ln{opacity:0;transition:opacity var(--motion-calm) var(--ease-out)}
.ln.in{opacity:1}
.delta{position:fixed;transform:translate(-50%,-50%);font:400 var(--type-small)/1 var(--font-mono);color:var(--light);background:var(--slate-deep);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-2);white-space:nowrap;
  opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.delta.in{opacity:1}
.sum{position:fixed;left:50%;transform:translateX(-50%);display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - var(--space-8) * 2);font-size:var(--type-small);color:var(--ink-muted)}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);border:1px solid var(--hairline);background:var(--surface-inset);color:var(--ink)}
.chip i.sw{display:inline-block;width:var(--space-2);height:var(--space-2);border-radius:1px}
</style>
</head>
<body>
<header class="head">
  <div class="eyebrow" id="crumb"></div>
  <h1 id="ename"></h1>
  <div class="attr" id="attr"></div>
</header>
<div class="keys"><span><span class="kbd">←</span> <span class="kbd">→</span> move then</span><span><span class="kbd">Shift</span> + arrows move now</span><span><span class="kbd">R</span> replay</span></div>
<div class="strip" id="strip"><svg id="stripsvg" aria-hidden="true"></svg>
  <div class="handle then" id="hThen" role="slider" tabindex="0" aria-label="Then"><span id="hThenL"></span></div>
  <div class="handle" id="hNow" role="slider" tabindex="0" aria-label="Now"><span id="hNowL"></span></div>
</div>
<section class="pair" id="pair">
  <div class="state then" id="sThen" aria-label="The record then"></div>
  <div></div>
  <div class="state" id="sNow" aria-label="The record now"></div>
</section>
<svg id="links" aria-hidden="true"></svg>
<div id="deltas"></div>
<div class="sum" id="sum" aria-live="polite"></div>
<div class="x-cap"><b>Provenance · V3</b> parallel record: two states of one fact, ribbons join what stayed the same · Nelson / Xanadu, Appleton's Xanadu patterns</div>
<script src="../../../_kit/icons.js"></script>
<script>
/* ------------------------------------------------------------------ sample data (one object) */
const DATA = {
  now: '2026-11-02', start: '2023-03-01',
  app: 'Data Atlas',
  viewer: { name: 'Harry', teams: ['Supplier data'] },
  entity: { type: 'Supplier', name: 'Kestrel Logistics' },
  fact: { attr: 'Headcount', unit: 'employees', refreshMonths: 12, steward: 'Supplier data', method: 'Highest-trust source wins; disputes go to the steward' },
  sources: {
    register: { label: 'Companies register', floor: 'org' },
    report: { label: 'Annual report', floor: 'department' },
    questionnaire: { label: 'Supplier questionnaire', floor: 'team' },
    payroll: { label: 'Payroll extract', floor: 'department' },
    web: { label: 'Web profile crawl', floor: null }
  },
  record: [
    { kind: 'value', from: '2023-03-06', value: 240, source: 'register', by: 'Register import', note: 'First record' },
    { kind: 'value', from: '2023-09-18', value: 265, source: 'report', by: 'Dana Okafor', note: 'Annual report 2023, page 4' },
    { kind: 'rejected', at: '2023-12-02', value: 268, source: 'web', by: 'Dana Okafor', reason: 'Rounded copy of the annual report' },
    { kind: 'gap', from: '2024-01-10', to: '2024-11-04', reason: 'Register feed paused' },
    { kind: 'value', from: '2024-11-04', value: 265, source: 'report', by: 'Sam Reyes', note: 'Re-checked after the gap' },
    { kind: 'rejected', at: '2024-11-04', value: 410, source: 'web', by: 'Sam Reyes', reason: 'Counts contractors' },
    { kind: 'value', from: '2025-02-20', value: 312, source: 'questionnaire', by: 'Sam Reyes', note: 'Questionnaire, Q1 2025' },
    { kind: 'dispute', from: '2025-06-03', to: '2025-08-14', sides: [ { value: 290, party: 'Procurement', floor: 'team' }, { value: 312, party: 'Finance', floor: 'department' } ] },
    { kind: 'value', from: '2025-08-14', value: 305, source: 'payroll', by: 'Ines Duarte', note: 'Payroll extract, 31 Jul 2025', seam: true },
    { kind: 'pending', at: '2026-04-22', value: 330, source: 'report', by: 'Annual report import', note: 'Annual report 2025, page 6' }
  ],
  demoThen: '2023-09-18'
};

/* ------------------------------------------------------------------ helpers */
const $ = s => document.querySelector(s);
const D = s => new Date(s + 'T00:00:00Z');
const days = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = s => { const d = D(s); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const age = n => n < 45 ? n + ' days' : n < 540 ? Math.round(n / 30.4) + ' months' : (n / 365).toFixed(1) + ' years';
const addMonths = (s, m) => { const d = D(s); d.setUTCMonth(d.getUTCMonth() + m); return d.toISOString().slice(0, 10); };
const css = v => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v));
const FV = { org: '--floor-org-high', department: '--floor-department-high', team: '--floor-team-high', you: '--floor-you-high' };
const fill = f => f ? `color-mix(in srgb, var(${FV[f]}) var(--x-stratum-mix), var(--slate-deep))` : 'color-mix(in srgb, var(--ink-muted) 22%, var(--slate-deep))';
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canTriage = DATA.viewer.teams.includes(DATA.fact.steward);

/* the record as it stood on day t: every field the sheet shows */
function snapshot(t) {
  const R = DATA.record.filter(r => D(r.from || r.at) <= D(t));
  const vals = R.filter(r => r.kind === 'value');
  const cur = vals[vals.length - 1];
  const inGap = DATA.record.find(r => r.kind === 'gap' && D(r.from) <= D(t) && D(t) < D(r.to));
  const inDispute = DATA.record.find(r => r.kind === 'dispute' && D(r.from) <= D(t) && D(t) < D(r.to));
  const staleFrom = addMonths(cur.from, DATA.fact.refreshMonths);
  const stale = D(t) >= D(staleFrom) || !!inGap;
  const pend = R.filter(r => r.kind === 'pending');
  return {
    t, cur, inGap, inDispute, stale,
    fields: [
      { k: 'Value', v: inDispute ? inDispute.sides.map(s => s.value).join(' or ') : cur.value, big: true, cmp: inDispute ? 'disputed' : cur.value,
        sub: inDispute ? 'Disputed: ' + inDispute.sides.map(s => s.party).join(' and ') : DATA.fact.unit },
      { k: 'Source', v: tok(DATA.sources[cur.source].label), cmp: DATA.sources[cur.source].label, sub: cur.note },
      { k: 'Accepted by', v: tok(cur.by), cmp: cur.by, sub: fmt(cur.from) },
      { k: 'Verified', v: inGap ? 'No record' : stale ? 'Stale' : 'Current', stale, sub: inGap ? inGap.reason + ', ' + age(days(inGap.from, t)) + ' so far' : stale ? 'Due ' + fmt(staleFrom) + ', ' + age(days(staleFrom, t)) + ' ago' : 'Next check ' + fmt(staleFrom) },
      (() => { const rj = R.filter(r => r.kind === 'rejected'), dp = DATA.record.filter(r => r.kind === 'dispute' && D(r.from) <= D(t));
        return { k: 'Triage history', v: rj.length + ' rejected · ' + dp.length + (dp.length === 1 ? ' dispute' : ' disputes'), sub: rj.length ? 'Rejected ' + rj.map(r => r.value).join(', ') + ' (' + [...new Set(rj.map(r => r.by))].map(tok).join(', ') + ')' : 'none yet' }; })(),
      { k: 'Steward', v: tok(DATA.fact.steward + ' team'), cmp: DATA.fact.steward, sub: 'Can refresh and decide' },
      { k: 'Refresh rule', v: tok('Every ' + DATA.fact.refreshMonths + ' months'), cmp: DATA.fact.refreshMonths, sub: DATA.fact.method },
      { k: 'In triage', v: pend.length ? pend.map(p => p.value + ' from ' + tok(DATA.sources[p.source].label)).join(', ') : 'Nothing waiting', cmp: pend.map(p => p.value).join() || 'none', pend: pend.length > 0,
        sub: pend.length ? 'Waiting ' + days(pend[0].at, t) + ' days' + (canTriage && t === DATA.now ? ' · you can decide' : '') : '' }
    ]
  };
}
const key = f => String(f.cmp ?? f.v);
function tok(t) { return `<span class="tok" data-tok="${t}">${t}</span>`; }

/* stops: every dated moment in the record, plus now */
const STOPS = [...new Set(DATA.record.flatMap(r => [r.from || r.at]).concat([DATA.now]))].sort((a, b) => D(a) - D(b));
let iThen = STOPS.indexOf(DATA.demoThen), iNow = STOPS.length - 1;

function renderState(box, s, label, isNow) {
  box.innerHTML = `<div class="top"><span class="eyebrow">${label}</span><span class="when">${s.t === DATA.now ? 'Now · ' : ''}${fmt(s.t)}</span></div>` +
    s.fields.map((f, i) => `<div class="rowf${f.pend ? ' pendrow' : ''}" data-i="${i}"><span class="k">${f.k}</span><span class="v${f.big ? ' big' : ''}">${f.stale ? '<span class="stale">' + f.v + '</span>' : f.v}${f.pend && isNow && canTriage ? '<button class="btn">Decide</button>' : ''}<span class="sub">${f.sub}</span></span></div>`).join('');
}

/* ribbons: same = filled band, changed = a dashed thread with the delta */
function links(a, b, draw) {
  const svg = $('#links'); svg.innerHTML = ''; $('#deltas').innerHTML = '';
  const L = [...$('#sThen').querySelectorAll('.rowf')], Rr = [...$('#sNow').querySelectorAll('.rowf')];
  const x0 = $('#sThen').getBoundingClientRect().right, x1 = $('#sNow').getBoundingClientRect().left;
  const mx = (x0 + x1) / 2;
  let same = 0, changed = 0;
  const ribbon = (l, r) => {
    const a0 = l.right + 2, a1 = r.left - 2;
    const d = `M${a0},${l.top} L${x0},${l.top} C${mx},${l.top} ${mx},${r.top} ${x1},${r.top} L${a1},${r.top} L${a1},${r.bottom} L${x1},${r.bottom} C${mx},${r.bottom} ${mx},${l.bottom} ${x0},${l.bottom} L${a0},${l.bottom}Z`;
    el('path', { d, class: 'ln', style: 'fill:var(--x-link-fill);stroke:var(--x-link-edge);stroke-width:1' }, svg);
  };
  /* 1. what changed: a dashed thread between the same field, and the delta */
  a.fields.forEach((f, i) => {
    if (key(f) === key(b.fields[i])) { same++; return; }
    changed++;
    const l = L[i].getBoundingClientRect(), r = Rr[i].getBoundingClientRect();
    const ly = (l.top + l.bottom) / 2, ry = (r.top + r.bottom) / 2;
    el('path', { d: `M${x0},${ly} C${mx},${ly} ${mx},${ry} ${x1},${ry}`, class: 'ln', style: 'fill:none;stroke:var(--x-seam);stroke-width:1;stroke-dasharray:3 4;stroke-opacity:.5' }, svg);
    const c = document.createElement('div'); c.className = 'delta';
    const fv = f.v, tv = b.fields[i].v;
    c.textContent = (typeof fv === 'number' && typeof tv === 'number') ? (tv - fv > 0 ? '+' : '') + (tv - fv) : 'changed';
    c.style.left = mx + 'px'; c.style.top = (ly + ry) / 2 + 'px';
    $('#deltas').appendChild(c);
  });
  /* 2. what stayed: ribbons between identical content, wherever it now sits (transclusion) */
  const lt = [...$('#sThen').querySelectorAll('.tok')], rt = [...$('#sNow').querySelectorAll('.tok')];
  const used = new Set();
  lt.forEach(t => {
    const m = rt.find(q => q.dataset.tok === t.dataset.tok && !used.has(q));
    if (!m) return; used.add(m);
    const l = t.getBoundingClientRect(), r = m.getBoundingClientRect();
    ribbon({ top: l.top - 2, bottom: l.bottom + 2, right: l.right }, { top: r.top - 2, bottom: r.bottom + 2, left: r.left });
    t.classList.add('on'); m.classList.add('on');
  });
  const show = () => { svg.querySelectorAll('.ln').forEach(n => n.classList.add('in')); $('#deltas').querySelectorAll('.delta').forEach(n => n.classList.add('in')); };
  if (draw) requestAnimationFrame(() => requestAnimationFrame(show)); else show();
  return { same, changed };
}

/* the strip: the record as one flat stratum band */
function strip() {
  const svg = $('#stripsvg'); svg.innerHTML = '';
  const w = $('#strip').clientWidth, h = $('#strip').clientHeight;
  const x = s => days(DATA.start, s) / days(DATA.start, DATA.now) * w;
  const defs = el('defs', {}, svg);
  const pat = el('pattern', { id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 6, style: 'stroke:var(--hairline-strong);stroke-width:1.5' }, pat);
  const vals = DATA.record.filter(r => r.kind === 'value');
  vals.forEach((r, i) => {
    const to = (DATA.record.slice(DATA.record.indexOf(r) + 1).find(q => q.kind === 'value' || q.kind === 'gap' || q.kind === 'dispute') || { from: DATA.now }).from;
    el('rect', { x: x(r.from), y: h * .25, width: x(to) - x(r.from), height: h * .5, style: `fill:${fill(DATA.sources[r.source].floor)}` }, svg);
    if (r.seam) el('line', { x1: x(r.from), x2: x(r.from), y1: h * .15, y2: h * .85, style: 'stroke:var(--x-seam);stroke-width:2' }, svg);
  });
  DATA.record.forEach(r => {
    if (r.kind === 'gap') el('rect', { x: x(r.from), y: h * .25, width: x(r.to) - x(r.from), height: h * .5, fill: 'url(#hatch)', style: 'stroke:var(--hairline-strong);stroke-dasharray:2 3' }, svg);
    if (r.kind === 'dispute') r.sides.forEach((s, k) => el('rect', { x: x(r.from), y: h * .25 + k * h * .25, width: x(r.to) - x(r.from), height: h * .25, style: `fill:${fill(s.floor)};stroke:var(--warning);stroke-opacity:.5` }, svg));
    if (r.kind === 'rejected') el('circle', { cx: x(r.at), cy: h * .1, r: 3, style: 'fill:none;stroke:var(--ink-muted)' }, svg);
    if (r.kind === 'pending') el('circle', { cx: x(r.at), cy: h * .1, r: 3.5, style: 'fill:var(--green)' }, svg);
  });
  const cur = vals[vals.length - 1], sf = addMonths(cur.from, DATA.fact.refreshMonths);
  if (D(sf) < D(DATA.now)) el('rect', { x: x(sf), y: h * .25, width: x(DATA.now) - x(sf), height: h * .5, fill: 'url(#hatch)' }, svg);
  for (let yr = 2024; yr <= 2026; yr++) { const t = el('text', { x: x(yr + '-01-01'), y: h + 14, style: 'fill:var(--ink-muted);font:400 var(--x-type-micro) var(--font-mono);letter-spacing:var(--tracking-caps)' }, svg); t.textContent = yr; }
  /* the span between the handles */
  el('rect', { id: 'span', x: 0, y: 0, width: 0, height: h, style: 'fill:color-mix(in srgb,var(--info) 8%,transparent);transition:x var(--motion-slow) var(--ease-standard),width var(--motion-slow) var(--ease-standard)' }, svg);
  return x;
}
let X;
function place(draw) {
  const a = snapshot(STOPS[iThen]), b = snapshot(STOPS[iNow]);
  renderState($('#sThen'), a, 'Then', false);
  renderState($('#sNow'), b, iNow === STOPS.length - 1 ? 'Now' : 'Later', iNow === STOPS.length - 1);
  $('#hThen').style.left = X(STOPS[iThen]) + 'px'; $('#hThenL').textContent = 'Then · ' + fmt(STOPS[iThen]);
  $('#hNow').style.left = X(STOPS[iNow]) + 'px'; $('#hNowL').textContent = (iNow === STOPS.length - 1 ? 'Now · ' : '') + fmt(STOPS[iNow]);
  $('#hThen').setAttribute('aria-valuetext', fmt(STOPS[iThen])); $('#hNow').setAttribute('aria-valuetext', fmt(STOPS[iNow]));
  const sp = $('#span'); sp.setAttribute('x', X(STOPS[iThen])); sp.setAttribute('width', Math.max(0, X(STOPS[iNow]) - X(STOPS[iThen])));
  const res = links(a, b, draw);
  /* what happened between the two states */
  const between = DATA.record.filter(r => D(r.from || r.at) > D(STOPS[iThen]) && D(r.from || r.at) <= D(STOPS[iNow]));
  const name = r => r.kind === 'value' ? 'accepted ' + r.value : r.kind === 'rejected' ? 'rejected ' + r.value : r.kind === 'gap' ? 'no record ' + age(days(r.from, r.to)) : r.kind === 'dispute' ? 'dispute ' + r.sides.map(s => s.value).join('/') : 'proposed ' + r.value;
  const sw = r => r.kind === 'value' ? fill(DATA.sources[r.source].floor) : r.kind === 'pending' ? 'var(--green)' : r.kind === 'dispute' ? 'var(--warning)' : 'var(--hairline-strong)';
  $('#sum').innerHTML = `<span>${res.same} fields the same, ${res.changed} changed; ribbons join what carried over. Between them:</span>` +
    (between.length ? between.map(r => `<span class="chip"><i class="sw" style="background:${sw(r)}"></i>${name(r)}</span>`).join('') : '<span class="chip">nothing</span>');
  document.querySelectorAll('.pendrow').forEach(p => setTimeout(() => p.classList.add('lit'), draw ? css('--motion-calm') : 0));
  $('#sum').style.top = ($('#pair').getBoundingClientRect().bottom + css('--space-4')) + 'px';
}
function sizeRows() {
  const H = innerHeight;
  document.documentElement.style.setProperty('--x-row', (H < 850 ? 40 : 50) + 'px');
}

/* ------------------------------------------------------------------ demo */
let timers = [];
function demo() {
  timers.forEach(clearTimeout); timers = [];
  sizeRows(); X = strip();
  iThen = STOPS.indexOf(DATA.demoThen); iNow = STOPS.length - 1;
  $('#pair').style.opacity = 0; $('#sum').style.opacity = 0;
  $('#links').innerHTML = ''; $('#deltas').innerHTML = '';
  timers.push(setTimeout(() => {
    $('#pair').style.transition = 'opacity var(--motion-calm) var(--ease-standard)'; $('#pair').style.opacity = 1;
    place(true);
    $('#sum').style.transition = 'opacity var(--motion-calm) var(--ease-standard)'; $('#sum').style.opacity = 1;
  }, css('--motion-run')));
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') return demo();
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  const d = e.key === 'ArrowLeft' ? -1 : 1;
  if (e.shiftKey || document.activeElement === $('#hNow')) iNow = Math.max(iThen + 1, Math.min(STOPS.length - 1, iNow + d));
  else iThen = Math.max(0, Math.min(iNow - 1, iThen + d));
  place(false);
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { sizeRows(); X = strip(); place(false); }, 100); });
$('#crumb').textContent = DATA.app + ' · ' + DATA.entity.type;
$('#ename').textContent = DATA.entity.name;
$('#attr').textContent = DATA.fact.attr + ' (' + DATA.fact.unit + ') · the record then, beside the record now';
demo();
</script>
</body>
