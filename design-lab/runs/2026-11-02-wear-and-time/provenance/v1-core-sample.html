<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provenance · V1 core sample</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<style>
/* Proposed tokens (each listed under "needs token" in notes.md) */
:root{
  --x-type-micro: .6875rem;                 /* proposed --type-micro (mono numerals), same as cinematic v3 */
  --x-past-dim: .5;                         /* proposed --time-past-dim: opacity of the oldest stratum; now = 1 */
  --x-stratum-mix: 30%;                     /* proposed --stratum-mix: floor colour share in a stratum fill */
  --x-seam: color-mix(in srgb, var(--light) 80%, transparent);   /* proposed --mark-seam */
  --x-fault: var(--warning);                /* proposed --mark-fault (a past dispute; open disputes use the beacon) */
  --x-core-w: calc(var(--space-8) + var(--space-5));   /* 144: core width */
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
body{overflow:hidden}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kbd{display:inline-block;font:400 var(--x-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink)}

.head{position:fixed;top:var(--edge);left:calc(var(--edge) + var(--space-2));z-index:2}
.head .crumb{display:flex;gap:var(--space-2);align-items:center}
.head .crumb svg{color:var(--ink-muted)}
.head h1{margin:var(--space-2) 0 0;font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light)}
.head .attr{margin-top:var(--space-1);font-size:var(--type-meta);color:var(--ink-muted);letter-spacing:var(--tracking-soft)}

.stage{position:fixed;inset:0}
svg.core{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;pointer-events:auto;display:grid;grid-template-columns:auto 1fr;column-gap:var(--space-3);align-items:baseline;
  padding:var(--space-1) var(--space-2);border-radius:var(--radius-key);transform:translateY(-50%);
  opacity:0;transition:opacity var(--motion-base) var(--ease-out),background var(--motion-quick) var(--ease-standard)}
.lab.in{opacity:var(--age-op,1)}
.lab:hover,.lab[aria-pressed="true"]{background:var(--surface-raised);opacity:1}
.lab .v{font:300 var(--type-heading)/1 var(--font-mono);color:var(--ink)}
.lab .s{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.lab .s b{font-weight:400;color:var(--ink)}
.lab.now .v{color:var(--light);font-size:var(--type-title-s)}
.lab.gap .v{font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase}
.lab.rej{grid-template-columns:auto;text-align:right;transform:translate(-100%,-50%)}
.lab.rej .s,.lab.pend .s{max-width:var(--rejw)}
.lab.rej .v{font-size:var(--type-lead);color:var(--ink-muted);text-decoration:line-through;text-decoration-color:var(--hairline-strong)}

/* the pending proposal: the one thing here that needs you (beacon from the light language) */
.lab.pend .v{color:var(--green)}
.lab.pend{box-shadow:0 0 0 1px color-mix(in srgb,var(--green) 40%,transparent);background:color-mix(in srgb,var(--green) 8%,transparent)}
.lab.pend.lit{box-shadow:0 0 0 1px color-mix(in srgb,var(--green) 60%,transparent),0 0 var(--glow-blur) color-mix(in srgb,var(--green) 30%,transparent)}

.svgfade{opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.svgfade.in{opacity:var(--age-op,1)}

/* in-place answer: why are you like this, and since when? */
.why{position:fixed;right:var(--edge);top:50%;transform:translate(var(--travel-near),-50%);width:var(--measure-card);
  background:var(--surface-pane);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline);border-radius:var(--radius-inset);
  padding:var(--space-5);opacity:0;transition:opacity var(--motion-slow) var(--ease-out),transform var(--motion-slow) var(--ease-out)}
.why.in{opacity:1;transform:translate(0,-50%)}
.why h2{margin:var(--space-2) 0 var(--space-3);font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.why p{margin:0 0 var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta)}
.why dl{display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) var(--space-3);margin:var(--space-4) 0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.why dt{color:var(--ink-muted)}
.why dd{margin:0}
.why .act{display:flex;gap:var(--space-2);margin-top:var(--space-4)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta)}
.btn.go{border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green)}
.stale{display:inline-block;padding:0 var(--space-1);border-radius:var(--radius-key);background:repeating-linear-gradient(135deg,transparent 0 var(--space-1),var(--hairline-strong) var(--space-1) calc(var(--space-1) + 1px));color:var(--ink)}

.keys{position:fixed;right:var(--edge);top:var(--edge);z-index:3;display:flex;gap:var(--space-3);align-items:center;font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.legend{position:fixed;right:var(--edge);top:calc(var(--edge) + var(--space-5));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-4);max-width:calc(var(--measure-wide) * .75);font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.legend span{display:flex;align-items:center;gap:var(--space-2)}
.legend i.sw{display:inline-block;width:var(--space-4);height:var(--space-2);border-radius:1px}
@media (prefers-reduced-motion: reduce){.why{transform:translate(0,-50%)}}
</style>
</head>
<body>
<header class="head">
  <div class="crumb eyebrow"><i data-lucide="database" data-size="14"></i><span id="crumb"></span></div>
  <h1 id="ename"></h1>
  <div class="attr" id="attr"></div>
</header>
<main class="stage" id="stage" aria-label="Fact provenance as a core sample">
  <svg class="core" id="svg" aria-hidden="true"></svg>
  <div class="labels" id="labels"></div>
</main>
<aside class="why" id="why" aria-live="polite"></aside>
<div class="legend" id="legend" aria-hidden="true"></div>
<div class="keys"><span><span class="kbd">↑</span> <span class="kbd">↓</span> walk the core</span><span><span class="kbd">T</span> open the proposal</span><span><span class="kbd">R</span> replay</span></div>
<div class="x-cap"><b>Provenance · V1</b> core sample: the fact drilled out, youngest on top · stratigraphy, Open MCT now line, Hill and Hollan</div>
<script src="../../../_kit/icons.js"></script>
<script>
/* ------------------------------------------------------------------ sample data (one object) */
const DATA = {
  now: '2026-11-02',
  app: 'Data Atlas',
  viewer: { name: 'Harry', teams: ['Supplier data'] },
  entity: { type: 'Supplier', name: 'Kestrel Logistics' },
  fact: { attr: 'Headcount', unit: 'employees', refreshMonths: 12,
          steward: { name: 'Supplier data', floor: 'team', role: 'Data steward' } },
  sources: {
    register:      { label: 'Companies register', floor: 'org' },
    report:        { label: 'Annual report', floor: 'department' },
    questionnaire: { label: 'Supplier questionnaire', floor: 'team' },
    payroll:       { label: 'Payroll extract', floor: 'department' },
    web:           { label: 'Web profile crawl', floor: null }
  },
  /* the record, oldest first */
  record: [
    { kind: 'value', from: '2023-03-06', value: 240, source: 'register', by: 'Register import', note: 'First record for this supplier' },
    { kind: 'value', from: '2023-09-18', value: 265, source: 'report', by: 'Dana Okafor', note: 'Annual report 2023, page 4' },
    { kind: 'rejected', at: '2023-12-02', value: 268, source: 'web', by: 'Dana Okafor', reason: 'Rounded copy of the annual report figure' },
    { kind: 'gap', from: '2024-01-10', to: '2024-11-04', reason: 'Register feed paused (licence lapsed). The value still read 265, but no source confirmed it.' },
    { kind: 'value', from: '2024-11-04', value: 265, source: 'report', by: 'Sam Reyes', note: 'Re-checked after the gap' },
    { kind: 'rejected', at: '2024-11-04', value: 410, source: 'web', by: 'Sam Reyes', reason: 'Counts contractors, not employees' },
    { kind: 'value', from: '2025-02-20', value: 312, source: 'questionnaire', by: 'Sam Reyes', note: 'Questionnaire, Q1 2025' },
    { kind: 'dispute', from: '2025-06-03', to: '2025-08-14', sides: [
        { value: 290, party: 'Procurement', floor: 'team' }, { value: 312, party: 'Finance', floor: 'department' } ] },
    { kind: 'value', from: '2025-08-14', value: 305, source: 'payroll', by: 'Ines Duarte', role: 'Data steward', seam: true,
      note: 'Payroll extract, 31 Jul 2025. Settled the dispute between Procurement and Finance.' },
    { kind: 'pending', at: '2026-04-22', value: 330, source: 'report', by: 'Annual report import', note: 'Annual report 2025, page 6' }
  ],
  ahead: [
    { at: '2026-12-01', label: 'Questionnaire round Q4' },
    { at: '2027-03-31', label: 'Annual report 2026 expected' }
  ]
};

/* ------------------------------------------------------------------ helpers */
const $ = s => document.querySelector(s);
const D = s => new Date(s + 'T00:00:00Z');
const days = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = s => { const d = D(s); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const fmtM = s => { const d = D(s); return MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const age = n => n < 45 ? n + ' days' : n < 540 ? Math.round(n / 30.4) + ' months' : (n / 365).toFixed(1) + ' years';
const addMonths = (s, m) => { const d = D(s); d.setUTCMonth(d.getUTCMonth() + m); return d.toISOString().slice(0, 10); };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const FLOORVAR = { org: '--floor-org-high', department: '--floor-department-high', team: '--floor-team-high', you: '--floor-you-high' };
const fill = floor => floor ? `color-mix(in srgb, var(${FLOORVAR[floor]}) var(--x-stratum-mix), var(--slate-deep))` : 'color-mix(in srgb, var(--ink-muted) 18%, var(--slate-deep))';
const edge = floor => floor ? `var(${FLOORVAR[floor]})` : 'var(--ink-muted)';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };

/* derived state */
const values = DATA.record.filter(r => r.kind === 'value');
const current = values[values.length - 1];
const verified = current.from;
const staleFrom = addMonths(verified, DATA.fact.refreshMonths);
const isStale = D(DATA.now) >= D(staleFrom);
const pending = DATA.record.find(r => r.kind === 'pending');
const canTriage = DATA.viewer.teams.includes(DATA.fact.steward.name);

$('#crumb').textContent = DATA.app + ' · ' + DATA.entity.type;
$('#ename').textContent = DATA.entity.name;
$('#attr').textContent = DATA.fact.attr + ' (' + DATA.fact.unit + ')';

/* ------------------------------------------------------------------ layout */
let items = [], sel = -1;
function layout() {
  const W = innerWidth, H = innerHeight;
  const svg = $('#svg'), labs = $('#labels');
  svg.innerHTML = ''; labs.innerHTML = ''; items = [];
  const first = DATA.record[0].from, last = DATA.ahead[DATA.ahead.length - 1].at;
  const top = Math.max(150, H * .19), bottom = H - 70;
  const span = days(first, last);
  const y = s => bottom - (days(first, s) / span) * (bottom - top);   // youngest on top
  const cw = parseFloat(css('--space-8')) + parseFloat(css('--space-5'));
  const panelLeft = W - parseFloat(css('--edge')) - parseFloat(css('--measure-card')) - 32;
  const cx = Math.round(Math.max(W * .3, panelLeft - 460 - 28 - cw / 2));
  const x0 = cx - cw / 2, x1 = cx + cw / 2;
  const labX = x1 + 28, rejX = x0 - 40;
  labs.style.setProperty('--rejw', Math.min(300, rejX - 12 - parseFloat(css('--edge'))) + 'px');
  const labW = panelLeft - labX - 16;
  const nowY = y(DATA.now);
  const dates = values.map(v => v.from);
  const defs = el('defs', {}, svg);
  const pat = el('pattern', { id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 6, style: 'stroke:var(--hairline-strong);stroke-width:1.5' }, pat);
  const cyl = el('linearGradient', { id: 'cyl', x1: 0, x2: 1, y1: 0, y2: 0 }, defs);
  [['0', '.32'], ['.18', '0'], ['.7', '0'], ['1', '.4']].forEach(([o, a]) => el('stop', { offset: o, style: `stop-color:var(--shade);stop-opacity:${a}` }, cyl));
  const clip = el('clipPath', { id: 'coreclip' }, defs);
  el('rect', { x: x0, y: nowY, width: cw, height: bottom - nowY, rx: 6 }, clip);

  /* time axis on the far left of the core */
  const ax = el('g', { class: 'svgfade in' }, svg);
  for (let yr = D(first).getUTCFullYear() + 1; yr <= D(last).getUTCFullYear(); yr++) {
    const yy = y(yr + '-01-01');
    el('line', { x1: x0 - 12, x2: x0 - 4, y1: yy, y2: yy, style: 'stroke:var(--hairline-strong)' }, ax);
    const t = el('text', { x: x0 - 16, y: yy + 4, 'text-anchor': 'end', style: 'fill:var(--ink-muted);font:400 var(--x-type-micro) var(--font-mono);letter-spacing:var(--tracking-caps)' }, ax);
    t.textContent = yr;
  }

  const coreG = el('g', { 'clip-path': 'url(#coreclip)' }, svg);
  const n = DATA.record.length;
  let order = 0;
  const ageOp = s => { const a = days(s, DATA.now) / days(first, DATA.now); return (1 - a * (1 - parseFloat(css('--x-past-dim')))).toFixed(2); };

  DATA.record.forEach((r, i) => {
    if (r.kind === 'value') {
      const vi = values.indexOf(r);
      const next = DATA.record.slice(i + 1).find(q => q.kind === 'value' || q.kind === 'gap' || q.kind === 'dispute');
      const to = next ? next.from : DATA.now;
      const src = DATA.sources[r.source];
      const g = el('g', { class: 'svgfade', style: `--age-op:${ageOp(to)}` }, coreG);
      el('rect', { x: x0, y: y(to), width: cw, height: y(r.from) - y(to), style: `fill:${fill(src.floor)}` }, g);
      el('line', { x1: x0, x2: x1, y1: y(r.from), y2: y(r.from), style: `stroke:${edge(src.floor)};stroke-opacity:.5` }, g);
      if (r === current && isStale) {
        el('rect', { x: x0, y: y(DATA.now), width: cw, height: y(staleFrom) - y(DATA.now), fill: 'url(#hatch)' }, g);
        const tl = el('line', { x1: x0 - 6, x2: x1 + 22, y1: y(staleFrom), y2: y(staleFrom), style: 'stroke:var(--ink-muted);stroke-dasharray:2 3' }, svg);
        const tt = el('text', { x: x1 + 28, y: y(staleFrom) + 4, class: 'svgfade', style: 'fill:var(--ink-muted);font:400 var(--x-type-micro) var(--font-mono);letter-spacing:var(--tracking-caps)' }, svg);
        tt.textContent = 'TIDE LINE · DUE ' + fmt(staleFrom).toUpperCase() + ' · MISSED';
        tl.classList.add('svgfade'); g._extra = [tl, tt];
      }
      if (r.seam) {
        const s = el('path', { d: seamPath(x0, x1, y(r.from)), style: 'fill:none;stroke:var(--x-seam);stroke-width:1.5' }, svg);
        s.classList.add('svgfade'); (g._extra = g._extra || []).push(s);
      }
      const mid = (y(r.from) + y(to)) / 2;
      const lab = document.createElement('button');
      lab.className = 'lab' + (r === current ? ' now' : '');
      lab.style.left = labX + 'px'; lab.style.top = mid + 'px'; lab.style.setProperty('--age-op', ageOp(to));
      lab.innerHTML = `<span class="v">${r.value}</span><span class="s"><b>${src.label}</b> · ${r.by} · ${fmtM(r.from)}${r === current ? ' · now' : ''}</span>`;
      lab.setAttribute('aria-label', `${r.value} ${DATA.fact.unit}, from ${src.label}, ${fmt(r.from)} to ${to === DATA.now ? 'now' : fmt(to)}`);
      labs.appendChild(lab);
      items.push({ r, to, g, lab, order: order++ });
    } else if (r.kind === 'gap') {
      const g = el('g', { class: 'svgfade' }, coreG);
      const a = y(r.to), b = y(r.from);
      el('rect', { x: x0, y: a, width: cw, height: b - a, style: 'fill:var(--slate-deep)' }, g);
      el('rect', { x: x0, y: a, width: cw, height: b - a, fill: 'url(#hatch)' }, g);
      el('path', { d: wave(x0, x1, a), style: 'fill:none;stroke:var(--ink-muted);stroke-width:1.25' }, g);
      el('path', { d: wave(x0, x1, b), style: 'fill:none;stroke:var(--ink-muted);stroke-width:1.25;stroke-opacity:.6' }, g);
      const lab = document.createElement('button');
      lab.className = 'lab gap';
      lab.style.left = labX + 'px'; lab.style.top = (a + b) / 2 + 'px';
      lab.innerHTML = `<span class="v">Unconformity</span><span class="s">no record for ${age(days(r.from, r.to))} · ${fmtM(r.from)} to ${fmtM(r.to)}</span>`;
      labs.appendChild(lab);
      items.push({ r, g, lab, order: order++ });
    } else if (r.kind === 'dispute') {
      /* a fault: the core breaks, the two claims sit side by side, offset */
      const g = el('g', { class: 'svgfade' }, svg);
      const a = y(r.to), b = y(r.from), off = 10;
      const half = cw / 2;
      r.sides.forEach((s, k) => {
        const dx = k === 0 ? -off / 2 : off / 2, dy = k === 0 ? off / 2 : -off / 2;
        el('rect', { x: x0 + k * half + dx, y: a + dy, width: half, height: b - a, style: `fill:${fill(s.floor)}` }, g);
        const t = el('text', { x: x0 + k * half + half / 2 + dx, y: (a + b) / 2 + 4 + dy, 'text-anchor': 'middle', style: 'fill:var(--ink);font:400 var(--type-small) var(--font-mono)' }, g);
        t.textContent = s.value;
      });
      el('path', { d: `M${cx - 6},${a - 6} L${cx + 4},${(a + b) / 2} L${cx - 4},${(a + b) / 2 + 2} L${cx + 6},${b + 6}`, style: 'fill:none;stroke:var(--x-fault);stroke-width:1.5' }, g);
      const lab = document.createElement('button');
      lab.className = 'lab';
      lab.style.left = labX + 'px'; lab.style.top = (a + b) / 2 + 'px';
      lab.innerHTML = `<span class="v">${r.sides[0].value} | ${r.sides[1].value}</span><span class="s"><b>Fault</b> · ${r.sides[0].party} and ${r.sides[1].party} disagreed for ${age(days(r.from, r.to))}</span>`;
      labs.appendChild(lab);
      items.push({ r, g, lab, order: order++ });
    } else if (r.kind === 'rejected') {
      const src = DATA.sources[r.source];
      const yy = y(r.at);
      const g = el('g', { class: 'svgfade', style: `--age-op:${ageOp(r.at)}` }, svg);
      el('line', { x1: rejX + 6, x2: x0, y1: yy, y2: yy, style: 'stroke:var(--hairline-strong);stroke-dasharray:1 3' }, g);
      el('circle', { cx: rejX, cy: yy, r: 5, style: `fill:none;stroke:${edge(src.floor)};stroke-opacity:.7` }, g);
      const lab = document.createElement('button');
      lab.className = 'lab rej';
      lab.style.left = (rejX - 12) + 'px'; lab.style.top = yy + 'px'; lab.style.setProperty('--age-op', ageOp(r.at));
      lab.innerHTML = `<span class="v">${r.value}</span><span class="s">rejected · ${r.reason.toLowerCase()}</span>`;
      labs.appendChild(lab);
      items.push({ r, g, lab, order: order++ });
    }
  });

  /* core outline and cylinder shading */
  const sh = el('g', { class: 'svgfade in' }, svg);
  el('rect', { x: x0, y: nowY, width: cw, height: bottom - nowY, rx: 6, fill: 'url(#cyl)', style: 'pointer-events:none' }, sh);
  el('rect', { x: x0, y: nowY, width: cw, height: bottom - nowY, rx: 6, style: 'fill:none;stroke:var(--hairline-strong)' }, sh);

  /* now line (Open MCT) */
  const nl = el('g', { class: 'svgfade in' }, svg);
  el('line', { x1: x0 - 20, x2: panelLeft - 8, y1: nowY, y2: nowY, style: 'stroke:var(--light);stroke-opacity:.55' }, nl);
  const nt = el('text', { x: panelLeft - 8, y: nowY - 8, 'text-anchor': 'end', style: 'fill:var(--light);font:400 var(--x-type-micro) var(--font-mono);letter-spacing:var(--tracking-label)' }, nl);
  nt.textContent = 'NOW · ' + fmt(DATA.now).toUpperCase();

  /* the future: distance to travel, dashed above the surface */
  DATA.ahead.forEach(a => {
    const yy = y(a.at);
    const g = el('g', { class: 'svgfade in' }, svg);
    el('line', { x1: cx, x2: cx, y1: nowY - 2, y2: yy, style: 'stroke:var(--ink-muted);stroke-dasharray:3 4' }, g);
    el('line', { x1: x0 + 18, x2: x1 - 18, y1: yy, y2: yy, style: 'stroke:var(--ink-muted)' }, g);
    const t = el('text', { x: labX + 8, y: yy + 4, style: 'fill:var(--ink-muted);font:400 var(--type-small) var(--font-sans)' }, g);
    t.textContent = `${a.label} · in ${age(days(DATA.now, a.at))}`;
  });

  /* pending proposal: sits on the surface, not yet deposited */
  if (pending) {
    const g = el('g', { class: 'svgfade' }, svg);
    const pY = nowY - 12, pLabY = nowY - 44;
    el('rect', { x: x0 + 8, y: pY - 6, width: cw - 16, height: 8, rx: 3, style: 'fill:color-mix(in srgb,var(--green) 30%,var(--slate-deep));stroke:var(--green);stroke-opacity:.7' }, g);
    const src = DATA.sources[pending.source];
    const lab = document.createElement('button');
    lab.className = 'lab pend';
    lab.id = 'pendLab';
    lab.style.left = (rejX - 12) + 'px'; lab.style.top = pLabY + 'px'; lab.style.transform = 'translate(-100%,-50%)';
    lab.style.gridTemplateColumns = 'auto'; lab.style.textAlign = 'right';
    lab.innerHTML = `<span class="v">${pending.value}</span><span class="s">proposed · ${src.label} · in triage ${days(pending.at, DATA.now)} days${canTriage ? ' · you can decide' : ''}</span>`;
    labs.appendChild(lab);
    el('path', { d: `M${rejX - 8},${pLabY} L${x0 - 6},${pLabY} L${x0 + 8},${pY - 2}`, fill: 'none', style: 'stroke:color-mix(in srgb,var(--green) 50%,transparent);stroke-dasharray:1 3' }, g);
    items.push({ r: pending, g, lab, order: order++ });
  }

  items.forEach(it => { if (!it.lab.classList.contains('rej') && !it.lab.classList.contains('pend')) it.lab.style.maxWidth = labW + 'px'; });
  items.forEach((it, k) => { it.lab.onclick = () => select(k); it.lab.onfocus = () => select(k); });
  legend();
}
function wave(x0, x1, yy) {
  let d = `M${x0},${yy}`; const n = 9, w = (x1 - x0) / n;
  for (let i = 0; i < n; i++) d += ` q${w / 2},${i % 2 ? 4 : -4} ${w},0`;
  return d;
}
function seamPath(x0, x1, yy) {
  let d = `M${x0},${yy}`; const n = 12, w = (x1 - x0) / n;
  for (let i = 1; i <= n; i++) d += ` L${x0 + i * w},${yy + (i % 2 ? -1.5 : 1.5)}`;
  return d;
}
function legend() {
  const used = [...new Set(values.map(v => DATA.sources[v.source].floor))];
  const name = { org: 'Org', department: 'Department', team: 'Team', you: 'You' };
  $('#legend').innerHTML = '<span>colour = floor that supplied the value</span>' +
    used.map(f => `<span><i class="sw" style="background:${fill(f)};border-top:1px solid ${edge(f)}"></i>${name[f]}</span>`).join('') +
    `<span><i class="sw" style="background:repeating-linear-gradient(135deg,transparent 0 3px,var(--hairline-strong) 3px 4px)"></i>stale hatch / no record</span>`;
}

/* ------------------------------------------------------------------ the answer, in place */
function explain(it) {
  const r = it.r, w = $('#why');
  const who = canTriage ? 'You and the ' + DATA.fact.steward.name + ' team' : 'The ' + DATA.fact.steward.name + ' team';
  let h = '';
  if (r.kind === 'value') {
    const src = DATA.sources[r.source];
    const held = days(r.from, it.to);
    const isNow = r === current;
    h = `<div class="eyebrow">${isNow ? 'Why ' + r.value + ', and since when?' : 'Stratum · ' + fmtM(r.from)}</div>
      <h2>${r.value} ${DATA.fact.unit}${isNow ? ' since ' + fmt(r.from) : ', held ' + age(held)}</h2>
      <p>${r.note.replace(/\.$/, '')}.</p>
      <dl><dt>Source</dt><dd>${src.label}</dd><dt>Accepted by</dt><dd>${r.by}${r.role ? ', ' + r.role : ''}</dd>
      <dt>Held</dt><dd>${fmt(r.from)} to ${isNow ? 'now' : fmt(it.to)} (${age(held)})</dd>
      ${isNow ? `<dt>Verified</dt><dd>${isStale ? `<span class="stale">stale for ${age(days(staleFrom, DATA.now))}</span>` : 'current'}</dd>` : ''}</dl>
      ${isNow && isStale ? `<p>${DATA.entity.type} facts are re-verified every ${DATA.fact.refreshMonths} months; this one was due on ${fmt(staleFrom)}. ${who} can refresh it.</p>` : ''}
      ${isNow && r.seam ? `<p style="color:var(--ink-muted)">The bright seam under this layer is the correction that ended the fault below it.</p>` : ''}`;
    if (isNow && pending) h += `<div class="act"><button class="btn go" id="openP"><span>Proposal waiting: ${pending.value}</span></button></div>`;
  } else if (r.kind === 'gap') {
    h = `<div class="eyebrow">Unconformity · missing record</div><h2>No source checked for ${age(days(r.from, r.to))}</h2>
      <p>${r.reason}</p><dl><dt>From</dt><dd>${fmt(r.from)}</dd><dt>To</dt><dd>${fmt(r.to)}</dd></dl>
      <p style="color:var(--ink-muted)">Drawn as a blank, not as a continuous layer: during these months the value was shown without anything behind it.</p>`;
  } else if (r.kind === 'dispute') {
    h = `<div class="eyebrow">Fault · resolved dispute</div><h2>${r.sides.map(s => s.party + ' said ' + s.value).join(', ')}</h2>
      <p>The record split for ${age(days(r.from, r.to))}, ${fmt(r.from)} to ${fmt(r.to)}. Both claims stay in the core.</p>
      <p>Settled by ${current.by} at ${current.value}: ${current.note}</p>`;
  } else if (r.kind === 'rejected') {
    const src = DATA.sources[r.source];
    h = `<div class="eyebrow">Rejected in triage · ${fmt(r.at)}</div><h2>${r.value} was proposed and turned down</h2>
      <dl><dt>Source</dt><dd>${src.label}</dd><dt>Decided by</dt><dd>${r.by}</dd><dt>Reason</dt><dd>${r.reason}</dd></dl>
      <p style="color:var(--ink-muted)">Rejected proposals never deposit; they stay beside the core so the next person sees them.</p>`;
  } else if (r.kind === 'pending') {
    const src = DATA.sources[r.source];
    h = `<div class="eyebrow">Proposal in triage · needs you</div><h2>${r.value} from ${src.label}</h2>
      <p>${r.note}. Waiting ${days(r.at, DATA.now)} days. If accepted it becomes the top layer and clears the stale hatch.</p>
      <dl><dt>Would change</dt><dd>${current.value} → ${r.value} (${r.value > current.value ? '+' : ''}${r.value - current.value})</dd>
      <dt>Who decides</dt><dd>${DATA.fact.steward.name} team${canTriage ? ' (you are in it)' : ''}</dd></dl>
      <div class="act"><button class="btn go">Accept</button><button class="btn">Reject with reason</button></div>`;
  }
  w.innerHTML = h; w.classList.add('in');
  const op = $('#openP'); if (op) op.onclick = () => select(items.findIndex(i => i.r === pending));
}
function select(k) {
  if (k < 0 || k >= items.length) return;
  sel = k;
  items.forEach((it, j) => it.lab.setAttribute('aria-pressed', j === k ? 'true' : 'false'));
  explain(items[k]);
}

/* ------------------------------------------------------------------ demo */
let timers = [];
function demo() {
  timers.forEach(clearTimeout); timers = [];
  layout(); Icons.hydrate();
  $('#why').classList.remove('in');
  const step = reduce ? 0 : parseFloat(css('--motion-quick'));
  const start = parseFloat(css('--motion-run'));
  const reveal = it => { it.g.classList.add('in'); (it.g._extra || []).forEach(e => e.classList.add('in')); it.lab.classList.add('in'); };
  if (reduce) { timers.push(setTimeout(() => items.forEach(reveal), start)); }
  else items.forEach((it, k) => timers.push(setTimeout(() => reveal(it), start + k * step)));
  const done = start + items.length * step + parseFloat(css('--motion-base'));
  timers.push(setTimeout(() => select(items.findIndex(i => i.r === current)), done));
  timers.push(setTimeout(() => { const p = $('#pendLab'); p && p.classList.add('lit'); }, done + parseFloat(css('--motion-calm'))));
}
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') demo();
  else if (e.key === 'ArrowUp') { e.preventDefault(); select(Math.min(items.length - 1, sel + 1)); items[sel].lab.focus(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); select(Math.max(0, sel - 1)); items[sel].lab.focus(); }
  else if (e.key === 't' || e.key === 'T') select(items.findIndex(i => i.r === pending));
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const s = sel; layout(); items.forEach(it => { it.g.classList.add('in'); (it.g._extra || []).forEach(e => e.classList.add('in')); it.lab.classList.add('in'); }); if (s >= 0) select(s); }, 100); });
demo();
</script>
</body>
