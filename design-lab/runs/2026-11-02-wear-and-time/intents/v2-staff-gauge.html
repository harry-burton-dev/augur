<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff gauge</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ======================================================================
   Proposed tokens (time language). Each is listed in notes.md "Needs".
   Derived from kit tokens only: no new hex values, no new ms values.
   ====================================================================== */
:root{
  --x-type-micro:.6875rem;                    /* proposed --type-micro (mono numerals), as the cinematic run */
  --x-now:var(--light);                       /* now line: the only bright vertical */
  --x-now-glow:color-mix(in srgb,var(--light) 35%,transparent);
  --x-tide:color-mix(in srgb,var(--info) 40%,var(--ink-muted));  /* tide line: a missed date, a water stain, never an alert */
  --x-tide-stain:color-mix(in srgb,var(--info) 10%,transparent);
  --x-hw:var(--ink);                          /* high-water mark: engraved, not lit */
  --x-seam:color-mix(in srgb,var(--light) 62%,transparent); /* seam: a visible repair (kintsugi), neutral light, never severity */
  --x-travel:var(--hairline-strong);          /* distance to travel: dashed, dry, ahead of now */
  --x-past:.62;                               /* past is quieter than now: opacity for anything before the latest state */
  --x-stale-hatch:repeating-linear-gradient(135deg,transparent 0 var(--space-1),var(--hairline-strong) var(--space-1) calc(var(--space-1) + 1px));
  --x-water-lo:color-mix(in srgb,var(--navy) 70%,transparent);
  --x-water-hi:color-mix(in srgb,var(--green) 55%,transparent);
  --x-org:var(--floor-org-high);--x-department:var(--floor-department-high);--x-team:var(--floor-team-high);--x-you:var(--floor-you-high);
}
button{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.micro{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.kbd{display:inline-block;font:400 var(--x-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid currentColor;border-radius:var(--radius-key);opacity:.75;letter-spacing:0;text-transform:none}
.x-cap .k{margin-left:var(--space-4);color:var(--ink-muted)}
.x-cap .k b{color:var(--ink)}

/* the intent header: the same on every variant */
.top{position:relative;padding:var(--space-5) var(--edge) var(--space-4);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2) var(--space-6);align-items:end;border-bottom:1px solid var(--hairline)}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--floor-team-high) 30%,var(--floor-team-low) 70%,transparent);opacity:.7}
.crumb{display:flex;align-items:center;gap:var(--space-2)}
.crumb .dot{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--floor-team-high);box-shadow:0 0 var(--space-2) var(--floor-team-low)}
.top h1{grid-column:1;margin:var(--space-1) 0 0;font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts{grid-column:2;grid-row:1 / span 2;display:flex;gap:var(--space-5);align-items:flex-end}
.fact{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.fact .v{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);white-space:nowrap}
.fact .v b{font-weight:400;color:var(--light)}
.who-org{color:var(--x-org)}.who-department{color:var(--x-department)}.who-team{color:var(--x-team)}
/* ember (light language: going stale, cools with age) */
.ember{display:inline-flex;align-items:center;gap:var(--space-2);background:none;border:0;padding:0;cursor:help;text-align:left}
.ember i{display:block;width:var(--space-2);height:var(--space-2);border-radius:50%;background:color-mix(in srgb,var(--warning) calc((1 - var(--age,.4)) * 100%),var(--ink-muted));box-shadow:0 0 calc((1 - var(--age,.4)) * var(--space-4)) color-mix(in srgb,var(--warning) calc((1 - var(--age,.4)) * 80%),transparent)}
/* stale hatch */
.stale{background-image:var(--x-stale-hatch)}
/* the "why are you like this, and since when?" pane: one for every mark */
.why{position:fixed;z-index:var(--layer-overlay);width:var(--measure-card);padding:var(--space-4);background:var(--surface-overlay);-webkit-backdrop-filter:blur(var(--surface-blur));backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);opacity:0;transform:translateY(var(--space-1));pointer-events:none;transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out)}
.why.on{opacity:1;transform:none}
.why .t{margin:var(--space-1) 0 var(--space-2);font-size:var(--type-body);line-height:var(--leading-body);color:var(--light)}
.why .b{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.why dl{display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) var(--space-3);margin:var(--space-3) 0 0;padding-top:var(--space-3);border-top:1px solid var(--hairline)}
.why dt{font:400 var(--x-type-micro)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.why dd{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
[data-why]{cursor:help}
@media (prefers-reduced-motion: reduce){.why{transform:none!important;transition:opacity var(--motion-base) linear!important}}

body{display:flex;flex-direction:column;overflow:hidden}
.stage{position:relative;flex:1;min-height:0;margin:0 var(--edge) var(--space-7)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lbl{font:400 var(--x-type-micro) var(--font-mono);letter-spacing:var(--tracking-caps);fill:var(--ink-muted);text-transform:uppercase}
.lbl.hi{fill:var(--ink)}.lbl.lit{fill:var(--light)}
.body{font:400 var(--type-small) var(--font-sans);fill:var(--ink)}
.hit{fill:transparent}
.mark{cursor:help;outline:none}
.mark:focus-visible .hit{stroke:var(--focus);stroke-width:var(--focus-ring)}
/* water: the past is under it */
.water{position:absolute;bottom:0;height:0;pointer-events:none;background:linear-gradient(to top,color-mix(in srgb,var(--navy) 34%,transparent),color-mix(in srgb,var(--green) 9%,transparent));border-top:1px solid var(--x-now);-webkit-mask-image:linear-gradient(90deg,transparent,var(--shade) var(--space-6),var(--shade) calc(100% - var(--space-6)),transparent);mask-image:linear-gradient(90deg,transparent,var(--shade) var(--space-6),var(--shade) calc(100% - var(--space-6)),transparent);transition:height var(--motion-run) var(--ease-out);opacity:.9}
.water::before{content:"";position:absolute;left:0;right:0;top:calc(var(--space-2) * -1);height:var(--space-2);background:linear-gradient(to top,var(--x-now-glow),transparent)}
.water .nowl{position:absolute;right:var(--space-6);top:calc(var(--space-5) * -1);font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--light)}
.reveal{opacity:0;transition:opacity var(--motion-calm) var(--ease-standard)}
.reveal.in{opacity:1}
.glint{animation:glint var(--motion-calm) var(--ease-standard) 1}
@keyframes glint{0%{opacity:1}30%{opacity:.35}60%{opacity:1}}
/* side panel: the dry staff in words */
.dry{position:absolute;right:0;top:0;width:var(--measure-card);display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-4);background:var(--surface-pane);border:1px solid var(--hairline);border-radius:var(--radius-inset)}
.dry .big{font:200 var(--type-display)/var(--leading-display) var(--font-sans);color:var(--light);letter-spacing:var(--tracking-soft)}
.dry .big small{font-size:var(--type-lead);font-weight:300;color:var(--ink);margin-left:var(--space-2)}
.dry ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-2)}
.dry li{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--type-meta);line-height:var(--leading-meta)}
.dry li svg{flex:none;margin-top:calc(var(--space-1) / 2);color:var(--ink-muted)}
.dry li.met{color:var(--ink-muted)}
.dry li.met svg{color:var(--success)}
.dry li .when{margin-left:auto;font:400 var(--x-type-micro)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);color:var(--ink-muted);text-transform:uppercase;white-space:nowrap}
.dry .sep{border-top:1px solid var(--hairline)}
@media (prefers-reduced-motion: reduce){.water{transition:opacity var(--motion-calm) linear!important}.glint{animation:none}}
@media (max-width:1400px){.dry{width:calc(var(--measure-card) - var(--space-7))}.dry .big{font-size:var(--type-title)}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="stage" id="stage"></div>
<div class="why" id="why" role="tooltip"></div>
<div class="x-cap"><b>Intents · V2</b> staff gauge: time rises, the past is under water, the dry staff is distance to travel · river gauges, bridge flood marks, kintsugi seams <span class="k"><b>Hover / Tab</b> any mark · <b>R</b> replay</span></div>
<script>
const DATA={
  app:'Mandate',
  now:'2026-11-02', asked:'2026-08-04', staleAfter:14,
  labels:{asked:'Asked by',owner:'Owner',due:'Due',toTravel:'to travel',status:'Status',why:'Why, and since when',since:'Since',whoCan:'Who can change it',now:'Now'},
  people:{
    'Maya Okafor':{name:'Maya Okafor',floor:'org',unit:'Org · Finance Director'},
    'Lena Hart':{name:'Lena Hart',floor:'department',unit:'Finance Operations'},
    'Ana Sousa':{name:'Ana Sousa',floor:'team',unit:'Payables lead'},
    'Tom Reyes':{name:'Tom Reyes',floor:'team',unit:'Payables'}},
  intent:{name:'Supplier payments on the new ledger',where:['Finance Operations','Payables'],asker:'Maya Okafor',owner:'Ana Sousa'},
  /* every deadline the ask has carried; a passed, unmet one is a tide line */
  deadlines:[
    {date:'2026-09-30',set:'2026-08-04',by:'Maya Okafor',movedOn:'2026-10-02',movedBy:'Ana Sousa',why:'The bank sent its new payment file format three weeks late.'},
    {date:'2026-10-31',set:'2026-10-02',by:'Ana Sousa',movedOn:'2026-10-31',movedBy:'Maya Okafor',why:'Overseas reconciliation failed its dry run; Internal Audit added a sign-off.'},
    {date:'2026-11-28',set:'2026-10-31',by:'Maya Okafor'}],
  /* effort: contributions a week (tasks closed, linked documents edited, approvals given); null = no record */
  effortLabel:'contributions a week',
  weeks:['2026-08-03','2026-08-10','2026-08-17','2026-08-24','2026-08-31','2026-09-07','2026-09-14','2026-09-21','2026-09-28','2026-10-05','2026-10-12','2026-10-19','2026-10-26','2026-11-02'],
  effort:[2,5,8,6,null,null,9,15,24,12,18,31,22,1],
  gap:{from:'2026-08-31',to:'2026-09-13',why:'Events from these two weeks were lost when storage moved servers. Work happened; the record of it did not survive.',who:'Platform admins (events service)'},
  /* acceptance criteria: the distance to travel in work, not only days */
  criteria:[
    {text:'Domestic suppliers paid from the new ledger',added:'2026-08-04',met:'2026-09-16'},
    {text:'Old ledger read-only',added:'2026-08-04',met:'2026-10-21'},
    {text:'Overseas suppliers paid from the new ledger',added:'2026-08-18',met:null},
    {text:'Reconciled daily with no manual step',added:'2026-10-07',met:null},
    {text:'Signed off by Internal Audit',added:'2026-10-31',met:null}],
  /* the ask's own edit history */
  revisions:[
    {n:1,date:'2026-08-04',by:'Maya Okafor',note:'Asked',text:'Pay every supplier from the new ledger by 30 Sep, and make the old ledger read-only.'},
    {n:2,date:'2026-08-18',by:'Lena Hart',note:'Scope widened',text:'Pay every supplier, including overseas suppliers, from the new ledger by 30 Sep, and make the old ledger read-only.'},
    {n:3,date:'2026-09-09',by:'Tom Reyes',note:'Scope cut',text:'Pay every supplier, including overseas suppliers but not legacy card payments, from the new ledger by 30 Sep, and make the old ledger read-only.'},
    {n:4,date:'2026-10-02',by:'Ana Sousa',note:'Deadline moved',text:'Pay every supplier, including overseas suppliers but not legacy card payments, from the new ledger by 31 Oct, and make the old ledger read-only.'},
    {n:5,date:'2026-10-07',by:'Maya Okafor',note:'Criterion added',text:'Pay every supplier, including overseas suppliers but not legacy card payments, from the new ledger by 31 Oct, reconciled daily with no manual step, and make the old ledger read-only.'},
    {n:6,date:'2026-10-31',by:'Maya Okafor',note:'Deadline moved, sign-off added',text:'Pay every supplier, including overseas suppliers but not legacy card payments, from the new ledger by 28 Nov, reconciled daily with no manual step, signed off by Internal Audit, and make the old ledger read-only.'}],
  status:{date:'2026-10-14',by:'Tom Reyes',text:'Overseas file tests pass with two of three banks.'},
  /* known events ahead (the almanac side) */
  ahead:[
    {date:'2026-11-10',label:'Third bank file test',by:'Tom Reyes'},
    {date:'2026-11-16',label:'Audit freeze begins',by:'Maya Okafor'},
    {date:'2026-11-23',label:'Internal Audit review',by:'Lena Hart'}],

  v2:{dry:'Dry staff',dryNote:'between now and the deadline',work:'Work left',hw:'High water',ext:'Staff extended',tide:'Tide line',gap:'No record',stale:'Stale'}
};
/* ---------- shared helpers (time language) ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const ROOT=getComputedStyle(document.documentElement);
function ms(n){const v=ROOT.getPropertyValue(n).trim();return v.endsWith('ms')?parseFloat(v):parseFloat(v)*1000}
function px(n){return parseFloat(ROOT.getPropertyValue(n))}
const DAY=864e5,MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const D=s=>+new Date(s+"T00:00:00Z");
const days=(a,b)=>Math.round((D(b)-D(a))/DAY);
const fmt=s=>{const x=new Date(D(s));return x.getUTCDate()+' '+MON[x.getUTCMonth()]};
const plural=(n,w)=>n+' '+w+(Math.abs(n)===1?'':'s');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const person=n=>DATA.people[n]||{name:n,floor:'you',unit:''};
const whoTag=n=>{const p=person(n);return `<span class="who-${p.floor}">${esc(p.name)}</span>`};
function deadline(){return DATA.deadlines[DATA.deadlines.length-1].date}
function header(){
  const I=DATA.intent,dl=deadline(),left=days(DATA.now,dl),st=DATA.status,age=days(st.date,DATA.now);
  return `<div class="crumb eyebrow"><span class="dot"></span>${esc(I.where.join(' / '))} · ${esc(DATA.app)}</div>
  <h1>${esc(I.name)}</h1>
  <div class="facts">
    <div class="fact"><span class="micro">${esc(DATA.labels.asked)}</span><span class="v">${whoTag(I.asker)} · ${fmt(DATA.asked)}</span></div>
    <div class="fact"><span class="micro">${esc(DATA.labels.owner)}</span><span class="v">${whoTag(I.owner)}</span></div>
    <div class="fact"><span class="micro">${esc(DATA.labels.due)}</span><span class="v"><b>${fmt(dl)}</b> · ${plural(left,'day')} ${esc(DATA.labels.toTravel)}</span></div>
    <div class="fact"><span class="micro">${esc(DATA.labels.status)}</span><button class="ember v" style="--age:${Math.min(1,age/30).toFixed(2)}" data-why="status"><i></i>${plural(age,'day')} old</button></div>
  </div>`;
}
/* why-pane: any [data-why] element answers "why are you like this, and since when?" */
const WHY={};
function baseWhy(){
  const st=DATA.status,age=days(st.date,DATA.now);
  WHY.status={k:DATA.labels.status,t:`Last status ${plural(age,'day')} old`,b:`“${st.text}”`,since:`${fmt(st.date)} · ${whoTag(st.by)}`,who:`${whoTag(DATA.intent.owner)} or anyone on ${esc(DATA.intent.where.at(-1))} can refresh it. Stale after ${plural(DATA.staleAfter,'day')}.`};
}
function showWhy(el,anchor){
  const w=WHY[el.dataset.why];if(!w)return;const p=$('#why');
  p.innerHTML=`<div class="eyebrow">${esc(w.k||DATA.labels.why)}</div><div class="t">${w.t}</div>${w.b?`<div class="b">${w.b}</div>`:''}<dl>${w.since?`<dt>${esc(DATA.labels.since)}</dt><dd>${w.since}</dd>`:''}${w.who?`<dt>${esc(DATA.labels.whoCan)}</dt><dd>${w.who}</dd>`:''}</dl>`;
  const r=(anchor||el).getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight,g=px('--space-3');
  let x=Math.min(innerWidth-pw-g,Math.max(g,r.left+r.width/2-pw/2)),y=r.bottom+g;
  if(y+ph>innerHeight-g*4)y=Math.max(g,r.top-ph-g);
  p.style.left=x+'px';p.style.top=y+'px';p.classList.add('on');
}
function hideWhy(){$('#why')?.classList.remove('on')}
function wireWhy(){
  document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-why]');if(el)showWhy(el)});
  document.addEventListener('mouseout',e=>{const el=e.target.closest('[data-why]');if(el&&!el.contains(e.relatedTarget))hideWhy()});
  document.addEventListener('focusin',e=>{const el=e.target.closest('[data-why]');if(el)showWhy(el)});
  document.addEventListener('focusout',hideWhy);
}
/* auto-demo: the moment plays ~1.2 s after load (motion-run) and replays with R */
let TIMERS=[];
function later(fn,t){TIMERS.push(setTimeout(fn,t))}
function boot(reset,play){
  baseWhy();wireWhy();
  const go=()=>{TIMERS.forEach(clearTimeout);TIMERS=[];hideWhy();reset();later(play,ms('--motion-run'))};
  addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='r'||e.key==='R')go();if(e.key==='Escape')hideWhy()});
  go();Icons.hydrate(document.body);
}

const G=$('#stage');let S={};
function build(){
  const W=G.clientWidth,H=G.clientHeight,top=px('--space-6'),base=H-px('--space-3');
  const t0=D(DATA.asked),t1=D(deadline())+2*DAY,Y=s=>base-(D(s)-t0)/(t1-t0)*(base-top);
  const panelW=$('.dry')?.offsetWidth||px('--measure-card');
  const sw=px('--space-7'),cx=(W-panelW)*0.5,sl=cx-sw/2,sr=cx+sw/2;
  const plateR=sl-px('--space-6'),plateW=Math.min(px('--measure-card')*0.8,plateR-px('--space-4'));
  const maxE=Math.max(...DATA.effort.filter(v=>v!=null)),profW=Math.min(px('--measure-card')*0.75,(W-panelW)-sr-px('--space-8')),E=v=>v/maxE*profW;
  const nowY=Y(DATA.now),dl=deadline();
  /* staff segments: one per deadline the ask has carried; each extension is a seam */
  let segs='',prev=DATA.asked;
  DATA.deadlines.forEach((d,i)=>{const y0=Y(prev),y1=Y(d.date);const op=i===DATA.deadlines.length-1?1:.55+.15*i;
    segs+=`<rect x="${sl}" y="${y1}" width="${sw}" height="${y0-y1}" fill="var(--surface-raised)" opacity="${op}" stroke="var(--hairline-strong)"/>`;prev=d.date});
  /* graduations, staff-gauge style: alternate E blocks per week */
  let grads='';DATA.weeks.concat(['2026-11-09','2026-11-16','2026-11-23']).forEach((w,i)=>{if(D(w)<t0)return;const y=Y(w);
    const yn=Y(new Date(D(w)+7*DAY).toISOString().slice(0,10)),h=(y-yn);
    grads+=`<rect x="${sl}" y="${y-h*.5}" width="${sw*.42}" height="${h*.5}" fill="var(--ink)" opacity=".22"/><rect x="${sl}" y="${y-1}" width="${sw*.7}" height="1" fill="var(--ink)" opacity=".5"/>`;
    grads+=`<text class="lbl" x="${sr-px('--space-1')}" y="${y-px('--space-1')}" text-anchor="end">${fmt(w).replace(' ','\u2009')}</text>`});
  /* seams + tide lines at each missed deadline */
  let seams='';DATA.deadlines.filter(d=>d.movedOn).forEach((d,i)=>{const y=Y(d.date),x0=plateR-plateW,x1=sr+profW;
    seams+=`<g class="mark reveal" id="tide${i}" data-why="tide${i}" tabindex="0" role="button" aria-label="Tide line: due ${fmt(d.date)}, missed">
      <rect x="${x0}" y="${y}" width="${x1-x0}" height="${px('--space-3')}" fill="var(--x-tide-stain)"/>
      <line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--x-tide)" stroke-dasharray="1 3"/>
      <text class="lbl" x="${x1}" y="${y+px('--space-4')}" text-anchor="end" style="fill:var(--x-tide)">${DATA.v2.tide} · due ${fmt(d.date)} · missed</text>
      <rect class="hit" x="${x0}" y="${y-px('--space-4')}" width="${x1-x0}" height="${px('--space-5')}"/></g>
      <g class="mark reveal" id="seam${i}" data-why="seam${i}" tabindex="0" role="button" aria-label="Staff extended ${fmt(d.movedOn)}">
      <line x1="${sl-px('--space-2')}" x2="${sr+px('--space-2')}" y1="${y-1}" y2="${y-1}" stroke="var(--x-seam)"/>
      <line x1="${sl-px('--space-2')}" x2="${sr+px('--space-2')}" y1="${y+1}" y2="${y+1}" stroke="var(--x-seam)"/>
      <rect class="hit" x="${sl-px('--space-3')}" y="${y-px('--space-2')}" width="${sw+px('--space-5')}" height="${px('--space-4')}"/></g>`});
  /* effort profile: one bar a week on the downstream side */
  let prof='';DATA.weeks.forEach((w,i)=>{const v=DATA.effort[i];const yA=Y(w<DATA.asked?DATA.asked:w),yB=Y(DATA.weeks[i+1]&&DATA.weeks[i+1]<DATA.now?DATA.weeks[i+1]:DATA.now);
    if(v==null)return;prof+=`<rect x="${sr}" y="${yB+1}" width="${E(v)}" height="${Math.max(1,yA-yB-2)}" fill="var(--green)" opacity="${v===maxE?.42:.2}"/>`});
  const hwI=DATA.effort.indexOf(maxE),hwY=(Y(DATA.weeks[hwI])+Y(DATA.weeks[hwI+1]))/2;
  const gy0=Y(DATA.gap.from),gy1=Y(DATA.gap.to)-(Y(DATA.weeks[0])-Y(DATA.weeks[1]))/7;
  const wave=(y,x0,x1,a)=>{let d=`M${x0},${y}`;const n=10,w=(x1-x0)/n;for(let k=1;k<=n;k++)d+=` Q${x0+w*(k-.5)},${y+(k%2?a:-a)} ${x0+w*k},${y}`;return d};
  /* plates: ask edits, engraved; pushed apart so they never overlap, with a leader to their true height */
  const ph=px('--space-6')+px('--space-1'),gap=px('--space-1');
  let ys=DATA.revisions.map(r=>Y(r.date));let pos=ys.map(y=>y-ph/2);
  for(let k=0;k<60;k++){for(let i=1;i<pos.length;i++){const ov=pos[i-1]-(pos[i]+ph+gap);if(ov<0){pos[i]+=ov/2;pos[i-1]-=ov/2}}pos=pos.map(y=>Math.min(base-ph,Math.max(top,y)))}
  let plates='';DATA.revisions.forEach((r,i)=>{const y=pos[i],p=person(r.by);
    plates+=`<g class="mark reveal plate" id="rev${r.n}" data-why="rev${r.n}" tabindex="0" role="button" aria-label="r${r.n} ${fmt(r.date)} ${esc(r.note)}">
      <path d="M${plateR},${y+ph/2} L${plateR+px('--space-3')},${ys[i]} L${sl},${ys[i]}" fill="none" stroke="var(--hairline-strong)"/>
      <rect x="${plateR-plateW}" y="${y}" width="${plateW}" height="${ph}" rx="var(--radius-key)" fill="var(--surface-inset)" stroke="var(--hairline-strong)"/>
      <rect x="${plateR-plateW}" y="${y}" width="${px('--space-1')/2}" height="${ph}" fill="var(--x-${p.floor})"/>
      <text class="lbl" x="${plateR-plateW+px('--space-3')}" y="${y+px('--space-4')}">r${r.n} · ${fmt(r.date)} · ${esc(p.name)}</text>
      <text class="body" x="${plateR-plateW+px('--space-3')}" y="${y+px('--space-5')+px('--space-3')}">${esc(r.note)}</text>
      <rect class="hit" x="${plateR-plateW}" y="${y}" width="${plateW}" height="${ph}"/></g>`});
  /* ahead: printed (dashed) marks on the dry staff */
  let ahead='';DATA.ahead.forEach(a=>{const y=Y(a.date);ahead+=`<line x1="${plateR-plateW*.6}" x2="${sl}" y1="${y}" y2="${y}" stroke="var(--x-travel)" stroke-dasharray="3 3"/><text class="lbl" x="${sl-px('--space-3')}" y="${y-px('--space-1')}" text-anchor="end">${fmt(a.date)} · ${esc(a.label)}</text>`});
  const st=DATA.status,stY=Y(st.date),staleY=Y(new Date(D(st.date)+DATA.staleAfter*DAY).toISOString().slice(0,10));
  G.innerHTML=`<svg>
   <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--hairline-strong)"/></pattern></defs>
   ${segs}${grads}
   <g class="reveal" id="prof">${prof}</g>
   <g class="mark reveal" id="gap" data-why="gap" tabindex="0" role="button" aria-label="${DATA.v2.gap}">
     <rect x="${sl-px('--space-2')}" y="${gy1}" width="${sw+profW+px('--space-2')}" height="${gy0-gy1}" fill="url(#hatch)"/>
     <path d="${wave(gy1,sl-px('--space-2'),sr+profW,px('--space-1'))}" fill="none" stroke="var(--ink-muted)" stroke-opacity=".6"/>
     <path d="${wave(gy0,sl-px('--space-2'),sr+profW,px('--space-1'))}" fill="none" stroke="var(--ink-muted)" stroke-opacity=".6"/>
     <text class="lbl" x="${sr+px('--space-3')}" y="${(gy0+gy1)/2+px('--space-1')}">${DATA.v2.gap} · ${fmt(DATA.gap.from)} – ${fmt(DATA.gap.to)}</text>
     <rect class="hit" x="${sl}" y="${gy1}" width="${sw+profW}" height="${gy0-gy1}"/></g>
   <g class="mark reveal" id="hw" data-why="hw" tabindex="0" role="button" aria-label="${DATA.v2.hw}">
     <line x1="${sr+E(maxE)}" x2="${sr+profW+px('--space-3')}" y1="${hwY}" y2="${hwY}" stroke="var(--x-hw)" stroke-opacity=".5"/>
     <path d="M${sr+profW+px('--space-3')},${hwY} l${px('--space-2')},-${px('--space-1')*1.5} l0,${px('--space-1')*3} z" fill="var(--x-hw)"/>
     <text class="lbl hi" x="${sr+profW+px('--space-5')}" y="${hwY-px('--space-1')}">${DATA.v2.hw}</text>
     <text class="lbl" x="${sr+profW+px('--space-5')}" y="${hwY+px('--space-3')}">${maxE} · w/c ${fmt(DATA.weeks[hwI])}</text>
     <rect class="hit" x="${sr}" y="${hwY-px('--space-4')}" width="${profW+px('--space-8')}" height="${px('--space-5')+px('--space-2')}"/></g>
   ${seams}
   <g class="mark reveal" id="stale" data-why="status" tabindex="0" role="button" aria-label="Status ${days(st.date,DATA.now)} days old">
     <line x1="${sr}" x2="${sr+px('--space-6')}" y1="${stY}" y2="${stY}" stroke="var(--warning)" stroke-opacity=".7"/>
     <circle cx="${sr+px('--space-6')+px('--space-2')}" cy="${stY}" r="${px('--space-1')}" fill="var(--warning)" opacity=".6"/>
     <text class="lbl" x="${sr+px('--space-6')+px('--space-4')}" y="${stY+px('--space-1')}" style="fill:var(--warning)">Status ${fmt(st.date)} · ${esc(person(st.by).name)}</text>
     <rect x="${sr}" y="${nowY}" width="${px('--space-2')}" height="${Math.max(0,staleY-nowY)}" fill="url(#hatch)" stroke="var(--warning)" stroke-opacity=".5"/>
     <rect class="hit" x="${sr}" y="${nowY}" width="${profW}" height="${stY-nowY+px('--space-2')}"/></g>
   <g class="reveal" id="ahead">${ahead}
     <line x1="${cx}" x2="${cx}" y1="${Y(dl)}" y2="${nowY}" stroke="var(--x-travel)" stroke-dasharray="4 4"/>
   </g>
   <g class="mark" data-why="due" tabindex="0" role="button" aria-label="Due ${fmt(dl)}">
     <line x1="${sl-px('--space-4')}" x2="${sr+px('--space-4')}" y1="${Y(dl)}" y2="${Y(dl)}" stroke="var(--light)"/>
     <text class="lbl lit" x="${cx}" y="${Y(dl)-px('--space-3')}" text-anchor="middle">Due ${fmt(dl)}</text>
     <rect class="hit" x="${sl-px('--space-4')}" y="${Y(dl)-px('--space-5')}" width="${sw+px('--space-5')*2}" height="${px('--space-5')+px('--space-2')}"/></g>
   ${plates}
  </svg>
  <div class="water" id="water" style="left:${plateR-plateW-px('--space-3')}px;width:${sr+profW+px('--space-8')-(plateR-plateW-px('--space-3'))}px"><span class="nowl">${DATA.labels.now} · ${fmt(DATA.now)}</span></div>
  ${dry()}`;
  S={nowH:base>nowY?H-nowY-(H-base):0,base,H};
  $('#water').style.bottom=(H-base)+'px';
  Icons.hydrate(G);
}
function dry(){
  const left=days(DATA.now,deadline()),open=DATA.criteria.filter(c=>!c.met);
  return `<aside class="dry reveal" id="dry" aria-label="${DATA.v2.dry}"><div><div class="eyebrow">${DATA.v2.dry} · ${DATA.v2.dryNote}</div><div class="big">${left}<small>days to travel</small></div></div>
  <div class="sep"></div><div><div class="eyebrow">${DATA.v2.work} · ${open.length} of ${DATA.criteria.length}</div></div>
  <ul>${DATA.criteria.map(c=>`<li class="${c.met?'met':''}"><i data-lucide="${c.met?'check-circle':'circle-dashed'}" data-size="14"></i><span>${esc(c.text)}</span><span class="when">${c.met?'met '+fmt(c.met):'added '+fmt(c.added)}</span></li>`).join('')}</ul>
  <div class="sep"></div><div class="micro">Staff extended ${DATA.deadlines.length-1} times · ${plural(days(DATA.deadlines[0].date,deadline()),'day')} longer than asked</div></aside>`;
}
function whys(){
  const maxE=Math.max(...DATA.effort.filter(v=>v!=null)),hwI=DATA.effort.indexOf(maxE);
  DATA.deadlines.filter(d=>d.movedOn).forEach((d,i)=>{const nx=DATA.deadlines[i+1];
    WHY['tide'+i]={k:DATA.v2.tide,t:`Due ${fmt(d.date)}, missed`,b:'The water passed this mark before the work was done. The stain stays, even after the deadline moved.',since:`${fmt(d.date)}`,who:'Nobody: a tide line is a record.'};
    WHY['seam'+i]={k:'Seam · '+DATA.v2.ext,t:`Extended ${fmt(d.movedOn)}: ${fmt(d.date)} → ${fmt(nx.date)}`,b:esc(d.why),since:`${fmt(d.movedOn)} · ${whoTag(d.movedBy)}`,who:`${whoTag(DATA.intent.asker)} (the asker) approves an extension.`}});
  WHY.hw={k:DATA.v2.hw,t:`${maxE} ${DATA.effortLabel}`,b:`Week of ${fmt(DATA.weeks[hwI])}, the run-up to the second deadline.`,since:`${days(DATA.weeks[hwI+1],DATA.now)} days unbeaten`,who:'Nobody: a record of what happened.'};
  WHY.gap={k:DATA.v2.gap,t:`No record ${fmt(DATA.gap.from)} – ${fmt(DATA.gap.to)}`,b:DATA.gap.why,since:'Found on import',who:esc(DATA.gap.who)};
  WHY.due={k:DATA.labels.due,t:`Due ${fmt(deadline())}`,b:`The top of the staff. ${plural(days(DATA.now,deadline()),'day')} of dry staff above the water.`,since:`${fmt(DATA.deadlines.at(-1).set)} · ${whoTag(DATA.deadlines.at(-1).by)}`,who:whoTag(DATA.intent.asker)};
  DATA.revisions.forEach(v=>WHY['rev'+v.n]={k:'The ask · r'+v.n,t:esc(v.note),b:`“${esc(v.text)}”`,since:`${fmt(v.date)} · ${whoTag(v.by)}`,who:`${whoTag(DATA.intent.asker)} and ${whoTag(DATA.intent.owner)}`});
}
function reset(){build();const w=$('#water');w.style.transition='none';w.style.height=RM.matches?S.nowH+'px':'0px';w.style.opacity=RM.matches?0:'';w.getBoundingClientRect();w.style.transition='';$$('.reveal').forEach(e=>e.classList.remove('in'))}
function play(){
  const w=$('#water'),run=ms('--motion-run'),g=ms('--motion-base');w.style.height=S.nowH+'px';w.style.opacity='';
  later(()=>$('#prof').classList.add('in'),0);
  /* each mark surfaces as the water passes it; seams glint once */
  const at=id=>{const el=$('#'+id);if(!el)return 0;const b=el.getBBox(),y=b.y+b.height;return Math.max(0,Math.min(1,(S.base-y)/S.nowH))};
  ['rev1','rev2','gap','rev3','tide0','seam0','rev4','rev5','hw','stale','tide1','seam1','rev6'].forEach(id=>later(()=>{const el=$('#'+id);el?.classList.add('in');if(id.startsWith('seam'))el?.classList.add('glint')},RM.matches?0:run*Math.pow(at(id),.6)));
  later(()=>{$('#ahead').classList.add('in');$('#dry').classList.add('in')},run);
  later(()=>showWhy($('#seam1')),run+g*2);
}
$('#top').innerHTML=header();whys();
addEventListener('resize',()=>{build();$$('.reveal').forEach(e=>e.classList.add('in'));$('#water').style.height=S.nowH+'px'});
boot(reset,play);
</script>
</body>
