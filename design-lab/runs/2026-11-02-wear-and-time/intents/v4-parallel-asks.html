    if(!here&&!(side==='R'&&alive(c,A)&&c.slot))return '';
    const isNew=side==='R'&&here&&!alive(c,A)&&!(c.slot&&CL.some(k=>k.slot===c.slot&&alive(k,A))),isRw=side==='R'&&here&&!alive(c,A)&&!isNew,missed=c.missed&&D(DATA.now)>D(DATA.deadlines.find(d=>'by '+fmt(d.date)===c.text)?.date||DATA.now);
    if(!here)return '';
    return `<div class="cl${isNew?' new':''}${isRw?' rw':''}${missed?' tide':''}" data-c="${c.id}" data-f="${person(c.by).floor}">${esc(c.text)}${isNew||isRw?`<span class="tag">${isNew?'added':'rewritten'} r${c.from} · ${fmt(R[c.from-1].date)} · ${esc(person(c.by).name)}</span>`:''}${missed?`<span class="tag" style="color:var(--x-tide)">tide line · missed</span>`:''}</div>`}).join('');
  const gone=side==='R'?CL.filter(c=>alive(c,A)&&!alive(c,n)&&!c.slot).map(c=>`<div class="cl gone" data-c="${c.id}" data-f="${person(c.by).floor}">${esc(c.text)}<span class="tag">removed</span></div>`).join(''):'';
  return `<div class="eyebrow">${side==='L'?DATA.v4.left:DATA.v4.right} · r${v.n} · ${fmt(v.date)} · <span class="who-${p.floor}">${esc(p.name)}</span></div>
   <h2>${esc(v.note)}</h2>
   <div class="travel"><span class="micro">${isNow?DATA.labels.now:'Then'}</span><span class="track"><b style="width:${isNow?Math.round(100*elapsed/(elapsed+toGo)):0}%"></b></span><span class="v">${plural(toGo,'day')} ${DATA.labels.toTravel}</span></div>
   <div class="micro">Due ${fmt(due)} · ${met} of ${all} criteria met${isNow?` · <button class="ember" data-why="status" style="--age:.6"><i></i>status ${plural(days(DATA.status.date,DATA.now),'day')} old</button>`:''}</div>
   <div class="cls">${rows}${gone}</div>
   <div class="foot micro">${side==='L'?`Asked by ${whoTag(DATA.intent.asker)}`:`${plural(B-A,'edit')} since r${A} · ${plural(days(R[A-1].date,R[B-1].date),'day')}`}</div>`;
}
function bridges(){
  const box=$('#cmp').getBoundingClientRect(),svg=$('#br');let out='';
  const fc=c=>`var(--x-${person(c.by).floor})`;
  CL.forEach(c=>{
    const l=$(`#L .cl[data-c="${c.id}"]`);let r=$(`#Rp .cl[data-c="${c.id}"]`),rewritten=false;
    if(!l)return;
    if(!r&&c.slot){r=CL.filter(k=>k.slot===c.slot).map(k=>$(`#Rp .cl[data-c="${k.id}"]:not(.gone)`)).find(Boolean);rewritten=true}
    if(!r)return;
    const a=l.getBoundingClientRect(),b=r.getBoundingClientRect(),pl=$('#L').getBoundingClientRect().right-box.left,pr=$('#Rp').getBoundingClientRect().left-box.left;
    const a0=a.top-box.top,a1=a.bottom-box.top,b0=b.top-box.top,b1=b.bottom-box.top,m=(pl+pr)/2;
    if(!rewritten){out+=`<path class="b" d="M${pl},${a0} C${m},${a0} ${m},${b0} ${pr},${b0} L${pr},${b1} C${m},${b1} ${m},${a1} ${pl},${a1} Z" fill="${fc(c)}" fill-opacity=".14"/>`
      +`<path class="b" d="M${pl},${a0} C${m},${a0} ${m},${b0} ${pr},${b0} M${pr},${b1} C${m},${b1} ${m},${a1} ${pl},${a1}" fill="none" stroke="${fc(c)}" stroke-opacity=".35"/>`}
    else{const n=DATA.deadlines.filter(d=>d.movedOn&&D(d.date)>=D(R[A-1].date)&&D(d.movedOn)<=D(R[B-1].date)).length;
      out+=`<g class="b mark" data-why="slot" tabindex="0" role="button" aria-label="Deadline rewritten ${n} times">
      <path d="M${pl},${(a0+a1)/2} C${m},${(a0+a1)/2} ${m},${(b0+b1)/2} ${pr},${(b0+b1)/2}" fill="none" stroke="var(--x-tide)" stroke-dasharray="1 3" stroke-width="2"/>
      ${DATA.deadlines.filter(d=>d.movedOn).map((d,k)=>{const t=(k+1)/(DATA.deadlines.length);const x=pl+(pr-pl)*t,y=(a0+a1)/2+((b0+b1)/2-(a0+a1)/2)*(3*t*t-2*t*t*t);return `<line x1="${x}" x2="${x}" y1="${y-px('--space-3')}" y2="${y+px('--space-3')}" stroke="var(--x-tide)"/><text class="lbl" x="${x}" y="${y-px('--space-4')}" text-anchor="middle" style="fill:var(--x-tide)">${fmt(d.date)}</text>`}).join('')}
      <text class="lbl" x="${pl+(pr-pl)*.4}" y="${Math.max(a1,b1)+px('--space-5')}" text-anchor="middle">rewritten ${n}× · both dates missed</text>
      <rect x="${pl}" y="${Math.min(a0,b0)-px('--space-4')}" width="${pr-pl}" height="${Math.abs(b1-a0)+px('--space-6')}" fill="transparent"/></g>`}
  });
  /* added clauses: a seam stub in the gutter, no bridge to the past */
  $$('#Rp .cl.new').forEach(r=>{const b=r.getBoundingClientRect(),pr=$('#Rp').getBoundingClientRect().left-box.left,y0=b.top-box.top,y1=b.bottom-box.top;
    out+=`<g class="b"><line x1="${pr-px('--space-5')}" x2="${pr}" y1="${y0+px('--space-3')}" y2="${y0+px('--space-3')}" stroke="var(--x-seam)"/><line x1="${pr-px('--space-5')}" x2="${pr}" y1="${y0+px('--space-3')+3}" y2="${y0+px('--space-3')+3}" stroke="var(--x-seam)"/><text class="lbl" x="${pr-px('--space-5')-px('--space-1')}" y="${y0+px('--space-3')+px('--space-1')}" text-anchor="end">new</text></g>`});
  svg.innerHTML=out;
}
function render(stage){
  $('#L').innerHTML=pane(A,'L');$('#Rp').innerHTML=pane(B,'R');
  $('#chips').innerHTML=R.map(v=>`<button class="chip" ${v.n===A?'data-l':''} ${v.n===B?'data-r':''} data-n="${v.n}" aria-label="Edit ${v.n} ${fmt(v.date)}">r${v.n}</button>`).join('');
  $('#span').textContent=`r${A} ${fmt(R[A-1].date)} → r${B} ${fmt(R[B-1].date)}`;
  $$('#chips .chip').forEach(b=>b.onclick=e=>{const n=+b.dataset.n;if(e.shiftKey||n>B||(n>A&&n!==B&&Math.abs(n-B)<Math.abs(n-A)))B=Math.max(n,A+1>N?N:n);else A=Math.min(n,B-1);if(A>=B)A=B-1;render(true)});
  requestAnimationFrame(()=>{bridges();if(stage)$$('.bridges .b').forEach(e=>e.classList.add('in'))});
}
function whys(){
  WHY.slot={k:'Tide lines on the deadline',t:'The deadline clause was rewritten twice',b:DATA.deadlines.filter(d=>d.movedOn).map(d=>`Due ${fmt(d.date)}, missed, moved ${fmt(d.movedOn)} by ${whoTag(d.movedBy)}: ${esc(d.why)}`).join('<br><br>'),since:`${fmt(DATA.deadlines.at(-1).set)} · ${whoTag(DATA.deadlines.at(-1).by)}`,who:`${whoTag(DATA.intent.asker)} (the asker)`};
}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const d=e.key==='ArrowRight'?1:-1;if(e.shiftKey)B=Math.min(N,Math.max(A+1,B+d));else A=Math.max(1,Math.min(B-1,A+d));render(true)}});
addEventListener('resize',()=>{bridges();$$('.bridges .b').forEach(e=>e.classList.add('in'))});
$('#top').innerHTML=header();whys();
function reset(){A=1;B=N;document.body.classList.add('pre');render(false)}
function play(){document.body.classList.remove('pre');const g=ms('--motion-instant');$$('.bridges .b').forEach((e,i)=>later(()=>e.classList.add('in'),RM.matches?0:i*g));
  later(()=>{const el=$('[data-why=slot]');if(el)showWhy(el,$('#L .cl.tide'))},ms('--motion-run'));}
document.fonts.ready.then(()=>boot(reset,play));
</script>
</body>
