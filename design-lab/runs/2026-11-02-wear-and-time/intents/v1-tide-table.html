<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide table</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* ======================================================================
   Proposed tokens (time language). Each is listed in notes.md "Needs".
   Derived from kit tokens only: no new hex values, no new ms values.
   ====================================================================== */
:root{
  --x-type-micro:.6875rem;                    /* proposed --type-micro (mono numerals), as the cinematic run */
  --x-now:var(--light);                       /* now line: the only bright vertical */
  --x-now-glow:color-mix(in srgb,var(--light) 35%,transparent);
  --x-tide:color-mix(in srgb,var(--info) 40%,var(--ink-muted));  /* tide line: a missed date, a water stain, never an alert */
  --x-tide-stain:color-mix(in srgb,var(--info) 10%,transparent);
  --x-hw:var(--ink);                          /* high-water mark: engraved, not lit */
  --x-seam:color-mix(in srgb,var(--light) 62%,transparent); /* seam: a visible repair (kintsugi), neutral light, never severity */
  --x-travel:var(--hairline-strong);          /* distance to travel: dashed, dry, ahead of now */
  --x-past:.62;                               /* past is quieter than now: opacity for anything before the latest state */
  --x-stale-hatch:repeating-linear-gradient(135deg,transparent 0 var(--space-1),var(--hairline-strong) var(--space-1) calc(var(--space-1) + 1px));
  --x-water-lo:color-mix(in srgb,var(--navy) 70%,transparent);
  --x-water-hi:color-mix(in srgb,var(--green) 55%,transparent);
  --x-org:var(--floor-org-high);--x-department:var(--floor-department-high);--x-team:var(--floor-team-high);--x-you:var(--floor-you-high);
}
button{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.eyebrow{font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.micro{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.kbd{display:inline-block;font:400 var(--x-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid currentColor;border-radius:var(--radius-key);opacity:.75;letter-spacing:0;text-transform:none}
.x-cap .k{margin-left:var(--space-4);color:var(--ink-muted)}
.x-cap .k b{color:var(--ink)}

/* the intent header: the same on every variant */
.top{position:relative;padding:var(--space-5) var(--edge) var(--space-4);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2) var(--space-6);align-items:end;border-bottom:1px solid var(--hairline)}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--floor-team-high) 30%,var(--floor-team-low) 70%,transparent);opacity:.7}
.crumb{display:flex;align-items:center;gap:var(--space-2)}
.crumb .dot{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--floor-team-high);box-shadow:0 0 var(--space-2) var(--floor-team-low)}
.top h1{grid-column:1;margin:var(--space-1) 0 0;font:300 var(--type-heading)/var(--leading-heading) var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts{grid-column:2;grid-row:1 / span 2;display:flex;gap:var(--space-5);align-items:flex-end}
.fact{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.fact .v{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink);white-space:nowrap}
.fact .v b{font-weight:400;color:var(--light)}
.who-org{color:var(--x-org)}.who-department{color:var(--x-department)}.who-team{color:var(--x-team)}
/* ember (light language: going stale, cools with age) */
.ember{display:inline-flex;align-items:center;gap:var(--space-2);background:none;border:0;padding:0;cursor:help;text-align:left}
.ember i{display:block;width:var(--space-2);height:var(--space-2);border-radius:50%;background:color-mix(in srgb,var(--warning) calc((1 - var(--age,.4)) * 100%),var(--ink-muted));box-shadow:0 0 calc((1 - var(--age,.4)) * var(--space-4)) color-mix(in srgb,var(--warning) calc((1 - var(--age,.4)) * 80%),transparent)}
/* stale hatch */
.stale{background-image:var(--x-stale-hatch)}
/* the "why are you like this, and since when?" pane: one for every mark */
.why{position:fixed;z-index:var(--layer-overlay);width:var(--measure-card);padding:var(--space-4);background:var(--surface-overlay);-webkit-backdrop-filter:blur(var(--surface-blur));backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);opacity:0;transform:translateY(var(--space-1));pointer-events:none;transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out)}
.why.on{opacity:1;transform:none}
.why .t{margin:var(--space-1) 0 var(--space-2);font-size:var(--type-body);line-height:var(--leading-body);color:var(--light)}
.why .b{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.why dl{display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) var(--space-3);margin:var(--space-3) 0 0;padding-top:var(--space-3);border-top:1px solid var(--hairline)}
.why dt{font:400 var(--x-type-micro)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.why dd{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
[data-why]{cursor:help}
@media (prefers-reduced-motion: reduce){.why{transform:none!important;transition:opacity var(--motion-base) linear!important}}

body{display:flex;flex-direction:column;overflow:hidden}
.chart{position:relative;flex:1;min-height:0;margin:0 var(--edge);}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.axis text,.lbl{font:400 var(--x-type-micro) var(--font-mono);letter-spacing:var(--tracking-caps);fill:var(--ink-muted);text-transform:uppercase}
.lbl.hi{fill:var(--ink)}
.lbl.now{fill:var(--light)}
.grid{stroke:var(--hairline)}
.water{position:absolute;inset:0;transition:clip-path var(--motion-run) var(--ease-standard),opacity var(--motion-calm) var(--ease-standard)}
.reveal{opacity:0;transition:opacity var(--motion-calm) var(--ease-standard)}
.on .reveal.in,.reveal.in{opacity:1}
.mark{cursor:help}
.mark:focus-visible{outline:none}
.mark:focus-visible .hit{stroke:var(--focus);stroke-width:var(--focus-ring)}
.hit{fill:transparent}
/* the almanac spread */
.almanac{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--space-6);margin:var(--space-4) var(--edge) var(--space-7);padding-top:var(--space-3);border-top:1px solid var(--hairline)}
.page h2{display:flex;justify-content:space-between;margin:0 0 var(--space-2);font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.page h2 span:last-child{letter-spacing:var(--tracking-caps)}
table{width:100%;border-collapse:collapse;font-size:var(--type-meta)}
td{padding:calc(var(--space-1) / 2) var(--space-2) calc(var(--space-1) / 2) 0;line-height:var(--leading-meta);border-bottom:1px solid var(--hairline);white-space:nowrap;vertical-align:baseline}
td.d{width:calc(var(--space-7) + var(--space-2));font:400 var(--x-type-micro)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
td.e{white-space:normal;color:var(--ink)}
td.h{text-align:right;font:400 var(--x-type-micro)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);color:var(--ink-muted);text-transform:uppercase}
.past tr{opacity:var(--x-past)}
.past tr.tide td.e{color:var(--x-tide)}
.past tr.hw td.e{color:var(--light)}
.past tr.seam td.e::before{content:"";display:inline-block;width:var(--space-3);height:0;border-top:1px solid var(--x-seam);border-bottom:1px solid var(--x-seam);margin-right:var(--space-2);vertical-align:middle;padding-top:1px}
.ahead tr.due td{color:var(--light);border-bottom-color:var(--hairline-strong)}
.ahead tr.due td.h{color:var(--light)}
.ahead tr.nowrow td{color:var(--light)}
.open{margin-top:var(--space-3);display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3)}
.open span{font-size:var(--type-small);color:var(--ink-muted);display:inline-flex;align-items:center;gap:var(--space-1)}
.open span svg{color:var(--ink-muted)}
.open .lead{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink)}
@media (max-height:820px){td{padding-block:0}.almanac{margin-top:var(--space-3)}}
@media (prefers-reduced-motion: reduce){.water{position:absolute;inset:0;transition:opacity var(--motion-calm) linear!important}.reveal{transition:opacity var(--motion-calm) linear!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="chart" id="chart" aria-label="Effort over time, with deadlines" role="img"></div>
<section class="almanac" id="alm"></section>
<div class="why" id="why" role="tooltip"></div>
<div class="x-cap"><b>Intents · V1</b> tide table: the past recorded, the future printed, one scale · tide tables, bridge flood marks, Open MCT now line <span class="k"><b>Hover / Tab</b> any mark: why and since when · <b>R</b> replay</span></div>
<script>
const DATA={
  app:'Mandate',
  now:'2026-11-02', asked:'2026-08-04', staleAfter:14,
  labels:{asked:'Asked by',owner:'Owner',due:'Due',toTravel:'to travel',status:'Status',why:'Why, and since when',since:'Since',whoCan:'Who can change it',now:'Now'},
  people:{
    'Maya Okafor':{name:'Maya Okafor',floor:'org',unit:'Org · Finance Director'},
    'Lena Hart':{name:'Lena Hart',floor:'department',unit:'Finance Operations'},
    'Ana Sousa':{name:'Ana Sousa',floor:'team',unit:'Payables lead'},
    'Tom Reyes':{name:'Tom Reyes',floor:'team',unit:'Payables'}},
  intent:{name:'Supplier payments on the new ledger',where:['Finance Operations','Payables'],asker:'Maya Okafor',owner:'Ana Sousa'},
  /* every deadline the ask has carried; a passed, unmet one is a tide line */
  deadlines:[
    {date:'2026-09-30',set:'2026-08-04',by:'Maya Okafor',movedOn:'2026-10-02',movedBy:'Ana Sousa',why:'The bank sent its new payment file format three weeks late.'},
    {date:'2026-10-31',set:'2026-10-02',by:'Ana Sousa',movedOn:'2026-10-31',movedBy:'Maya Okafor',why:'Overseas reconciliation failed its dry run; Internal Audit added a sign-off.'},
    {date:'2026-11-28',set:'2026-10-31',by:'Maya Okafor'}],
  /* effort: contributions a week (tasks closed, linked documents edited, approvals given); null = no record */
  effortLabel:'contributions a week',
  weeks:['2026-08-03','2026-08-10','2026-08-17','2026-08-24','2026-08-31','2026-09-07','2026-09-14','2026-09-21','2026-09-28','2026-10-05','2026-10-12','2026-10-19','2026-10-26','2026-11-02'],
  effort:[2,5,8,6,null,null,9,15,24,12,18,31,22,1],
  gap:{from:'2026-08-31',to:'2026-09-13',why:'Events from these two weeks were lost when storage moved servers. Work happened; the record of it did not survive.',who:'Platform admins (events service)'},
  /* acceptance criteria: the distance to travel in work, not only days */
  criteria:[
    {text:'Domestic suppliers paid from the new ledger',added:'2026-08-04',met:'2026-09-16'},
    {text:'Old ledger read-only',added:'2026-08-04',met:'2026-10-21'},
    {text:'Overseas suppliers paid from the new ledger',added:'2026-08-18',met:null},
    {text:'Reconciled daily with no manual step',added:'2026-10-07',met:null},
    {text:'Signed off by Internal Audit',added:'2026-10-31',met:null}],
  /* the ask's own edit history */
  revisions:[
    {n:1,date:'2026-08-04',by:'Maya Okafor',note:'Asked',text:'Pay every supplier from the new ledger by 30 Sep, and make the old ledger read-only.'},
    {n:2,date:'2026-08-18',by:'Lena Hart',note:'Scope widened',text:'Pay every supplier, including overseas suppliers, from the new ledger by 30 Sep, and make the old ledger read-only.'},
    {n:3,date:'2026-09-09',by:'Tom Reyes',note:'Scope cut',text:'Pay every supplier, including overseas suppliers but not legacy card payments, from the new ledger by 30 Sep, and make the old ledger read-only.'},
    {n:4,date:'2026-10-02',by:'Ana Sousa',note:'Deadline moved',text:'Pay every supplier, including overseas suppliers but not legacy card payments, from the new ledger by 31 Oct, and make the old ledger read-only.'},
    {n:5,date:'2026-10-07',by:'Maya Okafor',note:'Criterion added',text:'Pay every supplier, including overseas suppliers but not legacy card payments, from the new ledger by 31 Oct, reconciled daily with no manual step, and make the old ledger read-only.'},
    {n:6,date:'2026-10-31',by:'Maya Okafor',note:'Deadline moved, sign-off added',text:'Pay every supplier, including overseas suppliers but not legacy card payments, from the new ledger by 28 Nov, reconciled daily with no manual step, signed off by Internal Audit, and make the old ledger read-only.'}],
  status:{date:'2026-10-14',by:'Tom Reyes',text:'Overseas file tests pass with two of three banks.'},
  /* known events ahead (the almanac side) */
  ahead:[
    {date:'2026-11-10',label:'Third bank file test',by:'Tom Reyes'},
    {date:'2026-11-16',label:'Audit freeze begins',by:'Maya Okafor'},
    {date:'2026-11-23',label:'Internal Audit review',by:'Lena Hart'}],

  v1:{past:'Recorded',ahead:'Ahead',hw:'High water',tide:'Tide line',gap:'No record',open:'Work to travel'}
};
/* ---------- shared helpers (time language) ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const ROOT=getComputedStyle(document.documentElement);
function ms(n){const v=ROOT.getPropertyValue(n).trim();return v.endsWith('ms')?parseFloat(v):parseFloat(v)*1000}
function px(n){return parseFloat(ROOT.getPropertyValue(n))}
const DAY=864e5,MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const D=s=>+new Date(s+"T00:00:00Z");
const days=(a,b)=>Math.round((D(b)-D(a))/DAY);
const fmt=s=>{const x=new Date(D(s));return x.getUTCDate()+' '+MON[x.getUTCMonth()]};
const plural=(n,w)=>n+' '+w+(Math.abs(n)===1?'':'s');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const person=n=>DATA.people[n]||{name:n,floor:'you',unit:''};
const whoTag=n=>{const p=person(n);return `<span class="who-${p.floor}">${esc(p.name)}</span>`};
function deadline(){return DATA.deadlines[DATA.deadlines.length-1].date}
function header(){
  const I=DATA.intent,dl=deadline(),left=days(DATA.now,dl),st=DATA.status,age=days(st.date,DATA.now);
  return `<div class="crumb eyebrow"><span class="dot"></span>${esc(I.where.join(' / '))} · ${esc(DATA.app)}</div>
  <h1>${esc(I.name)}</h1>
  <div class="facts">
    <div class="fact"><span class="micro">${esc(DATA.labels.asked)}</span><span class="v">${whoTag(I.asker)} · ${fmt(DATA.asked)}</span></div>
    <div class="fact"><span class="micro">${esc(DATA.labels.owner)}</span><span class="v">${whoTag(I.owner)}</span></div>
    <div class="fact"><span class="micro">${esc(DATA.labels.due)}</span><span class="v"><b>${fmt(dl)}</b> · ${plural(left,'day')} ${esc(DATA.labels.toTravel)}</span></div>
    <div class="fact"><span class="micro">${esc(DATA.labels.status)}</span><button class="ember v" style="--age:${Math.min(1,age/30).toFixed(2)}" data-why="status"><i></i>${plural(age,'day')} old</button></div>
  </div>`;
}
/* why-pane: any [data-why] element answers "why are you like this, and since when?" */
const WHY={};
function baseWhy(){
  const st=DATA.status,age=days(st.date,DATA.now);
  WHY.status={k:DATA.labels.status,t:`Last status ${plural(age,'day')} old`,b:`“${st.text}”`,since:`${fmt(st.date)} · ${whoTag(st.by)}`,who:`${whoTag(DATA.intent.owner)} or anyone on ${esc(DATA.intent.where.at(-1))} can refresh it. Stale after ${plural(DATA.staleAfter,'day')}.`};
}
function showWhy(el,anchor){
  const w=WHY[el.dataset.why];if(!w)return;const p=$('#why');
  p.innerHTML=`<div class="eyebrow">${esc(w.k||DATA.labels.why)}</div><div class="t">${w.t}</div>${w.b?`<div class="b">${w.b}</div>`:''}<dl>${w.since?`<dt>${esc(DATA.labels.since)}</dt><dd>${w.since}</dd>`:''}${w.who?`<dt>${esc(DATA.labels.whoCan)}</dt><dd>${w.who}</dd>`:''}</dl>`;
  const r=(anchor||el).getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight,g=px('--space-3');
  let x=Math.min(innerWidth-pw-g,Math.max(g,r.left+r.width/2-pw/2)),y=r.bottom+g;
  if(y+ph>innerHeight-g*4)y=Math.max(g,r.top-ph-g);
  p.style.left=x+'px';p.style.top=y+'px';p.classList.add('on');
}
function hideWhy(){$('#why')?.classList.remove('on')}
function wireWhy(){
  document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-why]');if(el)showWhy(el)});
  document.addEventListener('mouseout',e=>{const el=e.target.closest('[data-why]');if(el&&!el.contains(e.relatedTarget))hideWhy()});
  document.addEventListener('focusin',e=>{const el=e.target.closest('[data-why]');if(el)showWhy(el)});
  document.addEventListener('focusout',hideWhy);
}
/* auto-demo: the moment plays ~1.2 s after load (motion-run) and replays with R */
let TIMERS=[];
function later(fn,t){TIMERS.push(setTimeout(fn,t))}
function boot(reset,play){
  baseWhy();wireWhy();
  const go=()=>{TIMERS.forEach(clearTimeout);TIMERS=[];hideWhy();reset();later(play,ms('--motion-run'))};
  addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='r'||e.key==='R')go();if(e.key==='Escape')hideWhy()});
  go();Icons.hydrate(document.body);
}

const C=$('#chart');let S={};
function build(){
  const W=C.clientWidth,H=C.clientHeight,top=px('--space-7'),bot=px('--space-6'),l=0,r=W-px('--space-6');
  const t0=D(DATA.asked)-3*DAY,t1=D(deadline())+24*DAY;
  const X=s=>l+(D(s)-t0)/(t1-t0)*(r-l);
  const max=Math.max(...DATA.effort.filter(v=>v!=null)),base=H-bot,Y=v=>base-(v/max)*(base-top-px('--space-6'));
  const nowX=X(DATA.now);
  /* water: a step area per week, broken where there is no record */
  let segs=[],cur=[];
  DATA.weeks.forEach((w,i)=>{const v=DATA.effort[i];const x0=Math.max(X(w),X(DATA.asked)),x1=Math.min(X(DATA.weeks[i+1]||DATA.now),nowX);
    if(v==null){if(cur.length)segs.push(cur);cur=[];return}cur.push([x0,x1,Y(v)])});
  if(cur.length)segs.push(cur);
  const area=segs.map(sg=>{let d=`M${sg[0][0]},${base}`;sg.forEach(([a,b,y],k)=>{d+=` L${a},${y} L${b},${y}`});return d+` L${sg.at(-1)[1]},${base} Z`}).join(' ');
  const crest=segs.map(sg=>{let d='';sg.forEach(([a,b,y],k)=>{d+=(k?' L':'M')+`${a},${y} L${b},${y}`});return d}).join(' ');
  const hwI=DATA.effort.indexOf(max),hwX=(X(DATA.weeks[hwI])+X(DATA.weeks[hwI+1]))/2,hwY=Y(max);
  const dw=(X(DATA.weeks[1])-X(DATA.weeks[0]))/7,gx0=X(DATA.gap.from),gx1=X(DATA.gap.to)+dw;
  /* month grid */
  let grid='';for(let m=7;m<=11;m++){const s=`2026-${String(m+1).padStart(2,'0')}-01`;const x=X(s);if(x<l||x>r)continue;grid+=`<line class="grid" x1="${x}" x2="${x}" y1="${base-px('--space-2')}" y2="${base+px('--space-2')}" style="stroke:var(--hairline-strong)"/>`+(Math.abs(x-X(DATA.now))<px('--space-7')?'':`<text x="${x+px('--space-1')}" y="${base+px('--space-4')}">${MON[m]}</text>`)}
  const wave=(x,y0,y1,a)=>{let d=`M${x},${y0}`;const n=8,h=(y1-y0)/n;for(let k=1;k<=n;k++)d+=` Q${x+(k%2?a:-a)},${y0+h*(k-.5)} ${x},${y0+h*k}`;return d};
  const missed=DATA.deadlines.filter(d=>d.movedOn&&d.movedOn>=d.date);
  let tides='';missed.forEach((d,i)=>{const x=X(d.date);
    tides+=`<g class="mark reveal" data-why="tide${i}" tabindex="0" role="button" aria-label="Tide line: due ${fmt(d.date)}, missed">
      <rect x="${x-px('--space-6')}" y="${top}" width="${px('--space-6')}" height="${base-top}" fill="url(#stain)"/>
      <line x1="${x}" x2="${x}" y1="${top-px('--space-3')}" y2="${base}" stroke="var(--x-tide)" stroke-dasharray="1 3"/>
      <text class="lbl" x="${x-px('--space-2')}" y="${top-px('--space-4')}" text-anchor="end" style="fill:var(--x-tide)">${DATA.v1.tide} · due ${fmt(d.date)}</text>
      <text class="lbl" x="${x-px('--space-2')}" y="${top-px('--space-1')}" text-anchor="end">missed · moved ${fmt(d.movedOn)}</text>
      <rect class="hit" x="${x-px('--space-8')*1.4}" y="${top-px('--space-5')}" width="${px('--space-8')*1.4+px('--space-2')}" height="${base-top+px('--space-5')}"/></g>`});
  /* ask edits as seams on the baseline */
  let seams='';DATA.revisions.slice(1).forEach((v,i)=>{const x=X(v.date);seams+=`<g class="mark reveal" data-why="rev${v.n}" tabindex="0" role="button" aria-label="Ask changed ${fmt(v.date)}: ${esc(v.note)}">
    <line x1="${x-px('--space-1')}" x2="${x+px('--space-1')}" y1="${base+px('--space-5')}" y2="${base+px('--space-5')}" stroke="var(--x-seam)"/>
    <line x1="${x}" x2="${x}" y1="${base+px('--space-5')-px('--space-1')}" y2="${base+px('--space-5')+px('--space-1')}" stroke="var(--x-seam)"/>
    <text class="lbl" x="${x}" y="${base+px('--space-6')+px('--space-1')}" text-anchor="middle">r${v.n}</text>
    <rect class="hit" x="${x-px('--space-3')}" y="${base+px('--space-4')}" width="${px('--space-5')-px('--space-1')}" height="${px('--space-5')}"/></g>`});
  /* criteria met: small engraved ticks on the crest */
  /* ahead: printed marks on the dry side */
  let ahead='';DATA.ahead.forEach((a,i)=>{const x=X(a.date);const y=base-px('--space-5')-i*px('--space-4'),txt=`${fmt(a.date)} · ${a.label}`,end=x+txt.length*px('--space-2')*1.1>W;ahead+=`<line x1="${x}" x2="${x}" y1="${y+px('--space-1')}" y2="${base}" stroke="var(--ink-muted)" stroke-opacity=".6"/><text class="lbl" x="${end?x-px('--space-1'):x+px('--space-1')}" y="${y}" text-anchor="${end?'end':'start'}">${esc(txt)}</text>`});
  const dX=X(deadline()),left=days(DATA.now,deadline());
  C.innerHTML=`<div class="water" id="water"><svg aria-hidden="true"><defs><linearGradient id="wg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--navy)" stop-opacity=".55"/><stop offset="1" stop-color="var(--green)" stop-opacity=".42"/></linearGradient></defs>  
    <path d="${area}" fill="url(#wg)" opacity="var(--x-past)"/>
    <path d="${crest}" fill="none" stroke="var(--green)" stroke-opacity=".7"/>
  </svg></div><svg aria-hidden="false">
  <defs>
    <linearGradient id="wg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--navy)" stop-opacity=".55"/><stop offset="1" stop-color="var(--green)" stop-opacity=".42"/></linearGradient>
    <linearGradient id="stain" x1="1" x2="0"><stop offset="0" stop-color="var(--info)" stop-opacity=".12"/><stop offset="1" stop-color="var(--info)" stop-opacity="0"/></linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--hairline-strong)"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <g class="axis">${grid}</g>
  <line x1="${l}" x2="${nowX}" y1="${base}" y2="${base}" stroke="var(--hairline-strong)"/>

  <g class="mark reveal" data-why="gap" tabindex="0" role="button" aria-label="No record from ${fmt(DATA.gap.from)} to ${fmt(DATA.gap.to)}">
    <rect x="${gx0}" y="${top+px('--space-5')}" width="${gx1-gx0}" height="${base-top-px('--space-5')}" fill="url(#hatch)" opacity=".8"/>
    <path d="${wave(gx0,top+px('--space-5'),base,px('--space-1'))}" fill="none" stroke="var(--ink-muted)" stroke-opacity=".6"/>
    <path d="${wave(gx1,top+px('--space-5'),base,px('--space-1'))}" fill="none" stroke="var(--ink-muted)" stroke-opacity=".6"/>
    <text class="lbl" x="${(gx0+gx1)/2}" y="${top+px('--space-4')}" text-anchor="middle">${DATA.v1.gap}</text>
    <rect class="hit" x="${gx0}" y="${top}" width="${gx1-gx0}" height="${base-top}"/></g>
  ${tides}
  <g class="mark reveal" id="hw" data-why="hw" tabindex="0" role="button" aria-label="High-water mark ${max} ${DATA.effortLabel}, week of ${fmt(DATA.weeks[hwI])}">
    <line x1="${l}" x2="${nowX}" y1="${hwY}" y2="${hwY}" stroke="var(--x-hw)" stroke-opacity=".28" stroke-dasharray="2 4"/>
    <path d="M${hwX-px('--space-2')},${hwY-px('--space-3')} L${hwX+px('--space-2')},${hwY-px('--space-3')} L${hwX},${hwY-px('--space-1')} Z" fill="var(--x-hw)"/>
    <text class="lbl hi" x="${hwX}" y="${hwY-px('--space-4')}" text-anchor="middle">${DATA.v1.hw} · ${max} · w/c ${fmt(DATA.weeks[hwI])}</text>
    <rect class="hit" x="${hwX-px('--space-8')}" y="${hwY-px('--space-5')}" width="${px('--space-8')*2}" height="${px('--space-5')}"/></g>
  <g class="reveal" id="fut">
    <line x1="${nowX}" x2="${dX}" y1="${base}" y2="${base}" stroke="var(--x-travel)" stroke-dasharray="4 4"/>
    ${ahead}
    <g class="mark" data-why="due" tabindex="0" role="button" aria-label="Due ${fmt(deadline())}, ${left} days to travel">
      <line x1="${dX}" x2="${dX}" y1="${top-px('--space-3')}" y2="${base}" stroke="var(--ink)" stroke-opacity=".7"/>
      <text class="lbl hi" x="${dX+px('--space-2')}" y="${top-px('--space-4')}">Due ${fmt(deadline())}</text>
      <text class="lbl" x="${dX+px('--space-2')}" y="${top-px('--space-1')}">set ${fmt(DATA.deadlines.at(-1).set)}</text>
      <rect class="hit" x="${dX-px('--space-2')}" y="${top-px('--space-5')}" width="${px('--space-8')}" height="${base-top+px('--space-5')}"/></g>
    <text class="lbl hi" x="${(nowX+dX)/2}" y="${base+px('--space-4')}" text-anchor="middle">${plural(left,'day')} ${DATA.labels.toTravel}</text>
  </g>
  ${seams}
  <g class="mark reveal" id="stale" data-why="status" tabindex="0" role="button" aria-label="Status ${days(DATA.status.date,DATA.now)} days old">
        <line x1="${X(DATA.status.date)}" x2="${X(DATA.status.date)}" y1="${base}" y2="${base+px('--space-3')}" stroke="var(--warning)" stroke-opacity=".7"/>
    <rect x="${Math.min(nowX,X(DATA.status.date)+(X(DATA.weeks[1])-X(DATA.weeks[0]))*DATA.staleAfter/7)}" y="${base+px('--space-1')}" width="${Math.max(0,nowX-X(DATA.status.date)-(X(DATA.weeks[1])-X(DATA.weeks[0]))*DATA.staleAfter/7)}" height="${px('--space-2')}" fill="url(#hatch)" stroke="var(--hairline-strong)"/>
    <text class="lbl" x="${nowX-px('--space-1')}" y="${base+px('--space-4')}" text-anchor="end" style="fill:var(--warning)">Status ${fmt(DATA.status.date)} · stale</text>
    <rect class="hit" x="${X(DATA.status.date)-px('--space-8')}" y="${base}" width="${nowX-X(DATA.status.date)+px('--space-8')}" height="${px('--space-4')}"/></g>
  <g id="now">
    <line x1="${nowX}" x2="${nowX}" y1="${top-px('--space-5')}" y2="${base+px('--space-2')}" stroke="var(--x-now-glow)" stroke-width="4" filter="url(#glow)"/>
    <line x1="${nowX}" x2="${nowX}" y1="${top-px('--space-5')}" y2="${base+px('--space-2')}" stroke="var(--x-now)"/>
    <text class="lbl now" x="${nowX}" y="${top-px('--space-5')-px('--space-2')}" text-anchor="middle">${DATA.labels.now} · ${fmt(DATA.now)}</text>
  </g>
  </svg>`;
  S={nowX,l,W,H};
}
function almanac(){
  const P=[],R=DATA.revisions,max=Math.max(...DATA.effort.filter(v=>v!=null));
  P.push({d:DATA.asked,e:`Asked by ${whoTag(R[0].by)}`,h:'r1',c:''});
  R.slice(1).forEach(v=>P.push({d:v.date,e:`${esc(v.note)} · ${whoTag(v.by)}`,h:'r'+v.n,c:'seam'}));
  DATA.deadlines.filter(d=>d.movedOn).forEach(d=>P.push({d:d.date,e:`Due · missed`,h:DATA.v1.tide,c:'tide'}));
  DATA.criteria.filter(c=>c.met).forEach(c=>P.push({d:c.met,e:`Met: ${esc(c.text)}`,h:'✓',c:''}));
  const hwI=DATA.effort.indexOf(max);P.push({d:DATA.weeks[hwI],e:`${DATA.v1.hw}: ${max} ${DATA.effortLabel}`,h:'HW',c:'hw'});
  P.push({d:DATA.gap.from,e:`${DATA.v1.gap} to ${fmt(DATA.gap.to)}`,h:'—',c:''});
  P.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const A=[{d:DATA.now,e:DATA.labels.now,h:'0',c:'nowrow'}].concat(DATA.ahead.map(a=>({d:a.date,e:`${esc(a.label)} · ${whoTag(a.by)}`,h:plural(days(DATA.now,a.date),'day'),c:''})),[{d:deadline(),e:`Due`,h:plural(days(DATA.now,deadline()),'day'),c:'due'}]);
  const row=r=>`<tr class="${r.c}"><td class="d">${fmt(r.d)}</td><td class="e">${r.e}</td><td class="h">${r.h}</td></tr>`;
  const open=DATA.criteria.filter(c=>!c.met);
  $('#alm').innerHTML=`<div class="page past"><h2><span>${DATA.v1.past}</span><span>${fmt(DATA.asked)} – ${fmt(DATA.now)}</span></h2><table>${P.map(row).join('')}</table></div>
  <div class="page ahead"><h2><span>${DATA.v1.ahead}</span><span>${fmt(DATA.now)} – ${fmt(deadline())}</span></h2><table>${A.map(row).join('')}</table>
  <div class="open"><span class="lead">${DATA.v1.open} · ${open.length} of ${DATA.criteria.length}</span>${open.map(c=>`<span><i data-lucide="circle-dashed" data-size="12"></i>${esc(c.text)}</span>`).join('')}</div></div>`;
  Icons.hydrate($('#alm'));
}
function whys(){
  const max=Math.max(...DATA.effort.filter(v=>v!=null)),hwI=DATA.effort.indexOf(max);
  DATA.deadlines.filter(d=>d.movedOn&&d.movedOn>=d.date).forEach((d,i)=>WHY['tide'+i]={k:DATA.v1.tide,t:`Due ${fmt(d.date)}, missed`,b:d.why,since:`Set ${fmt(d.set)} by ${whoTag(d.by)} · moved ${fmt(d.movedOn)} by ${whoTag(d.movedBy)}`,who:`Only ${whoTag(DATA.intent.asker)} (the asker) can move a deadline. A tide line never fades.`});
  WHY.hw={k:DATA.v1.hw,t:`${max} ${DATA.effortLabel}, week of ${fmt(DATA.weeks[hwI])}`,b:`The most work this intent has had in a week. It came in the run-up to the second deadline.`,since:`Mark set ${fmt(DATA.weeks[hwI+1])}; ${days(DATA.weeks[hwI+1],DATA.now)} days unbeaten`,who:'Nobody: it is a record of what happened.'};
  WHY.gap={k:DATA.v1.gap,t:`No record ${fmt(DATA.gap.from)} – ${fmt(DATA.gap.to)}`,b:DATA.gap.why,since:'Gap found on import',who:esc(DATA.gap.who)};
  WHY.due={k:DATA.labels.due,t:`Due ${fmt(deadline())} · ${plural(days(DATA.now,deadline()),'day')} to travel`,b:`${DATA.criteria.filter(c=>!c.met).length} of ${DATA.criteria.length} criteria still open.`,since:`${fmt(DATA.deadlines.at(-1).set)} · ${whoTag(DATA.deadlines.at(-1).by)}`,who:`${whoTag(DATA.intent.asker)}`};
  DATA.revisions.slice(1).forEach(v=>WHY['rev'+v.n]={k:'Seam · the ask changed',t:esc(v.note),b:`“${esc(v.text)}”`,since:`${fmt(v.date)} · ${whoTag(v.by)} (r${v.n})`,who:`${whoTag(DATA.intent.asker)} and ${whoTag(DATA.intent.owner)}`});
}
function reset(){build();const w=$('#water');w.style.transition='none';w.style.clipPath=RM.matches?'none':`inset(0 ${S.W-S.l}px 0 0)`;w.style.opacity=RM.matches?0:1;$$('.reveal').forEach(e=>e.classList.remove('in'));w.getBoundingClientRect()}
function play(){
  const w=$('#water');w.style.transition='';w.style.clipPath=RM.matches?'none':`inset(0 ${S.W-S.nowX-1}px 0 0)`;w.style.opacity=1;
  const g=ms('--motion-base'),run=ms('--motion-run');
  /* each mark is uncovered as the water reaches it */
  [['[data-why=gap]',.3],['[data-why=tide0]',.62],['#hw',.88],['[data-why=tide1]',.96],['#stale',1],['#fut',1]].forEach(([s,f])=>later(()=>$(s)?.classList.add('in'),run*f));
  later(()=>$$('[data-why^=rev]').forEach(e=>e.classList.add('in')),run+g);
  later(()=>showWhy($('[data-why=tide1]')),run+g*2);
}
$('#top').innerHTML=header();almanac();whys();
addEventListener('resize',()=>{build();$$('.reveal').forEach(e=>e.classList.add('in'))});
boot(reset,play);
</script>
</body>
