      v:[['2021-03-15','R. Haines',1200],['2022-04-11','R. Haines',300],['2023-03-27','R. Haines',90]],
      reads:[4,3,5,3,4,4,6,5,4,3,4,1], review:{ next:'2026-04-06', by:'Security & Risk admins' }, you:'2023-04-01' },
    { id:'vds', title:'Vulnerability disclosure statement', owner:'Ana Sousa', created:'2023-11-06', published:'org',
      v:[['2023-11-06','Ana Sousa',600],['2025-05-19','Ana Sousa',80]],
      reads:[120,140,133,151,128,160,170,149,138,150,162,58], review:{ next:'2026-11-19', by:'Ana Sousa' }, you:'2025-05-20' },
    { id:'bga', title:'Break-glass account procedure', owner:'Tom Reyes', created:'2022-12-05',
      v:[['2022-12-05','Tom Reyes',900],['2023-12-04','Tom Reyes',60],['2024-12-02','Tom Reyes',40],['2025-11-24','Tom Reyes',50]],
      reads:[1,0,2,1,0,1,0,3,1,0,2,0], review:{ next:'2026-11-24', by:'Tom Reyes' }, you:'2025-11-25' }
  ]
};

/* ===== shared helpers (time, wear, staleness, the "why" card, demo + replay) ===== */
const NOW = new Date(DATA.now + 'T12:00:00');
const DAY = 864e5;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = getComputedStyle(document.documentElement);
const T = n => parseFloat(css.getPropertyValue('--motion-' + n)) || 0;   /* durations only from motion tokens */
const px = n => parseFloat(css.getPropertyValue(n)) || 0;
const dt = s => new Date(s + 'T12:00:00');
const daysSince = s => Math.round((NOW - dt(s)) / DAY);
const daysUntil = s => Math.round((dt(s) - NOW) / DAY);
function span(n){ n = Math.abs(n);
  if (n < 1) return 'today'; if (n < 14) return n + (n === 1 ? ' day' : ' days');
  if (n < 63) return Math.round(n / 7) + ' weeks'; if (n < 730) return Math.round(n / 30.4) + ' months';
  return (n / 365).toFixed(n < 1460 ? 1 : 0).replace('.0', '') + ' years'; }
const fmt = s => dt(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const lastV = d => d.v[d.v.length - 1];
const lastEdit = d => lastV(d)[0];
const pastDays = d => d.review ? -daysUntil(d.review.next) : -1;    /* > 0 = stale for this many days */
const isStale = d => pastDays(d) > 0;
const LASTM = DATA.months[DATA.months.length - 2];
const recentReads = d => d.reads[d.reads.length - 2];  /* readers in the last full month */
const MAXR = Math.max(...DATA.docs.map(recentReads));
/* wear is relative and compressed (sqrt) so one very popular doc does not flatten the rest */
const wear = d => Math.sqrt(recentReads(d) / MAXR);
const readerText = n => n < DATA.privacy.minReaders ? (n === 0 ? 'no readers' : 'fewer than ' + DATA.privacy.minReaders + ' readers') : n + ' readers';
const changedSinceYou = d => d.you && dt(lastEdit(d)) > dt(d.you);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const byId = id => DATA.docs.find(d => d.id === id);

/* ---- shell: rail and masthead from DATA ---- */
function mountShell(){
  const L = DATA.library;
  document.querySelector('.rail').innerHTML = `
    <div class="tile"><div class="tile-icon"><i data-lucide="library-big"></i></div>
      <div class="tile-text"><div class="tile-name">${esc(DATA.app.name)}</div><div class="tile-owner">${esc(L.owner)}</div></div></div>
    <button class="nav"><i data-lucide="folder"></i>Your collections</button>
    <button class="nav lit"><i data-lucide="library"></i>${esc(L.name)}<span class="n">${L.collections.reduce((a,c)=>a+c[1],0)}</span></button>
    <div class="rail-section eyebrow">Collections</div>
    ${L.collections.map((c,i)=>`<button class="nav${i===0?' lit':''}"><i data-lucide="${i===L.collections.length-1?'archive':'folder-open'}"></i>${esc(c[0])}<span class="n">${c[1]}</span></button>`).join('')}
    <div class="rail-note" id="railNote"></div>`;
  const m = document.querySelector('.mast');
  if (m) m.innerHTML = `<div class="mast-owner eyebrow">${esc(L.owner)} · ${esc(L.name)}</div><h1 class="mast-title">${esc(L.collection)}</h1>`;
  const n = document.getElementById('railNote');
  if (n) n.innerHTML = `<b>Read wear</b> ${esc(DATA.privacy.rule)} <span class="mono">Audience ${L.audience}</span>`;
}

/* ---- "why are you like this, and since when?" ---- */
const Why = (() => {
  let el, cur = null;
  function ensure(){ if (!el){ el = document.createElement('div'); el.className = 'why'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-live', 'polite'); document.body.appendChild(el); } }
  function show(anchor, info){
    ensure(); cur = anchor;
    el.innerHTML = `<h4>${info.title}</h4><dl>${info.rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>` +
      (info.actions ? `<div class="act">${info.actions.map(a => `<button ${a.unavail ? `class="unavail" aria-disabled="true" title="${esc(a.unavail)}"` : ''}>${Icons.svg(a.icon, { size: 16 })}${esc(a.label)}</button>`).join('')}</div>` : '');
    const r = anchor.getBoundingClientRect(), w = px('--measure-card'), g = px('--space-3');
    let x = r.right + g, y = r.top - g;
    if (x + w > innerWidth - g) x = Math.max(g, r.left - w - g);
    if (x < g) x = Math.min(innerWidth - w - g, Math.max(g, r.left));
    el.style.left = x + 'px'; el.style.top = '0px'; el.classList.add('on');
    const h = el.offsetHeight; y = Math.min(Math.max(g, y), innerHeight - h - px('--space-7'));
    el.style.top = y + 'px';
  }
  function hide(){ if (el) el.classList.remove('on'); cur = null; }
  return { show, hide, get anchor(){ return cur; } };
})();

/* standard explanations for each mark, used by every variant */
function explain(d, mark, extra){
  const who = d.review ? d.review.by : d.owner;
  const refresh = d.ownerLeft ? [{ label: 'Ask ' + who, icon: 'message-square' }] : (who === DATA.viewer.name ? [{ label: 'Review now', icon: 'check' }] : [{ label: 'Review now', icon: 'lock', unavail: 'Only ' + who + ' can review this' }, { label: 'Ask ' + who, icon: 'message-square' }]);
  const base = { title: esc(d.title), rows: [] };
  switch (mark){
    case 'wear': base.rows = [['Wear', readerText(recentReads(d)) + ' in ' + LASTM], ['Since', 'Read wear counts from ' + DATA.months[0] + ' (12 months kept)'], ['Peak', readerText(Math.max(...d.reads)) + ' in ' + DATA.months[d.reads.indexOf(Math.max(...d.reads))]], ['Why', 'Brighter edge = handled more. Counts only, never names.']]; break;
    case 'age': base.rows = [['Age', span(daysSince(d.created)) + ' (' + fmt(d.created) + ')'], ['Last change', span(daysSince(lastEdit(d))) + ' ago by ' + esc(lastV(d)[1])], ['Versions', d.v.length], ['Why', 'Older and untouched reads quieter. Nothing is wrong with quiet.']]; break;
    case 'stale': base.rows = [['Stale', span(pastDays(d)) + ', review was due ' + fmt(d.review.next)], ['Last change', span(daysSince(lastEdit(d))) + ' ago'], ['Who', esc(who) + (d.ownerLeft ? ' (the owner has left)' : '')], ['Still read', readerText(recentReads(d)) + ' in ' + LASTM]]; base.actions = refresh; break;
    case 'due': { const n = daysUntil(d.review.next); base.rows = [[d.review.what || 'Review', n >= 0 ? 'in ' + span(n) + ', ' + fmt(d.review.next) : span(-n) + ' overdue'], ['Who', esc(who)], ['Why', 'Future dates are distance to travel: they do not light up until they are yours and close.']]; break; }
    case 'seam': { const f = d.fix || d.back; base.rows = [[d.fix ? 'Correction' : 'Rollback', esc(f.what)], ['When', fmt(f.on) + ', v' + f.v], ['By', esc(f.by)], ['Why', 'A repair stays visible as a seam (reversible and visible).']]; base.actions = [{ label: 'Compare', icon: 'git-compare-arrows' }]; break; }
    case 'gap': base.rows = [['No record', fmt(d.gap.from) + ' to ' + fmt(d.gap.to)], ['Why', esc(d.gap.why)], ['Means', 'Not "nothing happened": we do not know.']]; break;
    case 'you': base.rows = d.you ? [['You read', fmt(d.you) + (changedSinceYou(d) ? '' : ', the current version')], ['Since then', changedSinceYou(d) ? (d.v.filter(v => dt(v[0]) > dt(d.you)).length + ' change(s), latest ' + span(daysSince(lastEdit(d))) + ' ago') : 'No changes']] : [['You', 'Have not opened this yet']]; break;
    case 'needs': base.title = '<span class="needs">Needs you</span> · ' + esc(d.title); base.rows = [['Why', esc(d.needsWhy)], ['Since', 'Review due ' + fmt(d.review.next) + ', ' + span(pastDays(d)) + ' ago'], ['Who', 'You (' + esc(DATA.viewer.name) + ')']]; base.actions = refresh; break;
    case 'archive': base.rows = [['Superseded', 'Archives itself in ' + span(daysUntil(d.archive)) + ', ' + fmt(d.archive)], ['Who can stop it', esc(d.owner)], ['Still read', readerText(recentReads(d)) + ' in ' + LASTM]]; break;
  }
  if (extra) base.rows.push(...extra);
  return base;
}
function bindWhy(root, resolve){
  const open = e => { const t = e.target.closest('[data-why]'); if (!t || !root.contains(t)) return; const [id, mark, x] = t.dataset.why.split(':'); Why.show(t, resolve ? resolve(byId(id), mark, x, t) : explain(byId(id), mark)); };
  root.addEventListener('mouseover', open); root.addEventListener('focusin', open);
  root.addEventListener('mouseleave', () => Why.hide()); root.addEventListener('focusout', () => Why.hide());
  addEventListener('keydown', e => { if (e.key === 'Escape') Why.hide(); });
}

/* ---- demo: show the moment after ~1.2 s, R replays ---- */
const Demo = (() => { let timers = [];
  function play(reset, steps){ timers.forEach(clearTimeout); timers = []; Why.hide(); reset();
    let t = 0; steps.forEach(([wait, fn]) => { t += wait; timers.push(setTimeout(fn, t)); }); }
  function wire(reset, steps){ const go = () => play(reset, steps);
    addEventListener('keydown', e => { if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== 'INPUT') go(); });
    go(); }
  return { wire };
})();

mountShell();
const list = document.getElementById('list');
const ageOf = d => Math.min(1, Math.log1p(daysSince(lastEdit(d))) / Math.log1p(1500));
function render(){
  const docs = [...DATA.docs].sort((a, b) => a.title.localeCompare(b.title));
  list.innerHTML = docs.map(d => {
    const st = isStale(d), meta = [];
    if (d.needsYou) meta.push(`<span class="st" data-why="${d.id}:needs" tabindex="-1"><i data-lucide="hand"></i>Review overdue · yours</span>`);
    else if (st) meta.push(`<span class="st" data-why="${d.id}:stale"><i data-lucide="hourglass"></i>Stale ${span(pastDays(d))} · ${esc(d.review.by)}</span>`);
    else if (d.archive) meta.push(`<span data-why="${d.id}:archive">Superseded · archives in ${span(daysUntil(d.archive))}</span>`);
    if (d.gap) meta.push(`<span class="gap" data-why="${d.id}:gap">record since ${dt(d.gap.to).toLocaleDateString('en-GB',{month:'short',year:'numeric'})}</span>`);
    if (changedSinceYou(d)) meta.push(`<span class="new" data-why="${d.id}:you">changed since you read</span>`);
    meta.push(`<span data-why="${d.id}:age">${span(daysSince(lastEdit(d)))} · ${esc(lastV(d)[1])}</span>`);
    meta.push(`<span data-why="${d.id}:wear">${readerText(recentReads(d))}</span>`);
    const seam = (d.fix || d.back) ? `<i class="seam" data-why="${d.id}:seam" title="${d.fix ? 'Correction' : 'Rollback'}"></i>` : '';
    return `<div class="row${st ? ' stale' : ''}${d.needsYou ? ' needs-you' : ''}" role="listitem" id="r-${d.id}" style="--age:${ageOf(d).toFixed(3)};--wear:${wear(d).toFixed(3)}">
      <button class="open" aria-label="Open ${esc(d.title)}"></button>
      <span class="ic"><i data-lucide="${d.status === 'draft' ? 'file-pen-line' : d.archive ? 'file-clock' : 'file-text'}"></i></span>
      <span class="t"><span class="name-wrap${d.back ? ' scar' : ''}"><span class="name">${esc(d.title)}</span>${seam}</span>
        <span class="own">${esc(d.owner)}${d.status ? ' · ' + d.status : ''}${d.published ? ' · published to Org' : ''}</span></span>
      <span class="meta">${meta.join('')}</span></div>`;
  }).join('');
  Icons.hydrate(list);
}
render();
bindWhy(list);
const rows = () => [...list.querySelectorAll('.open')];
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ const r = rows(), i = r.indexOf(document.activeElement); const n = r[Math.max(0, Math.min(r.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; n.focus(); e.preventDefault(); }
  if (e.key === '?'){ const row = document.activeElement.closest('.row'); if (row){ const m = row.querySelector('.meta [data-why]'); const [id, mark] = m.dataset.why.split(':'); Why.show(m, explain(byId(id), mark)); } }
});
Demo.wire(() => { document.body.classList.add('unaged'); render(); }, [
  [T('run'), () => document.body.classList.remove('unaged')],
  [T('calm') + T('slow'), () => { const r = document.getElementById('r-lms'); r.classList.add('edited'); }],
  [T('calm'), () => { const s = document.querySelector('#r-irp .st'); Why.show(s, explain(byId('irp'), 'stale')); }],
  [T('hold'), () => Why.hide()]
]);
</script>
