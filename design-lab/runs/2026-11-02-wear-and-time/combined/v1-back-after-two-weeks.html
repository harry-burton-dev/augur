<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combined · V1 · Back after two weeks</title>
<link rel="stylesheet" href="../../../_kit/tokens.css">
<script src="../../../_kit/icons.js"></script>
<style>
/* =====================================================================
   Proposed tokens. Names and recipes from ../grammar/v1-time-language.html;
   every one is "needs token" in notes-v1.md. All are combinations of kit tokens.
   ===================================================================== */
:root{
  --x-seam: color-mix(in srgb, var(--warning) 55%, var(--ink));          /* --mark-seam: a repair, never "warning" */
  --x-wear-min: 6%;                                                       /* --wear-min: an untouched object still shows a trace */
  --x-wear-max: 62%;                                                      /* --wear-max: the most handled, never as bright as now */
  --x-tide: color-mix(in srgb, var(--ink-muted) 60%, transparent);       /* --mark-tide */
  --x-now: color-mix(in srgb, var(--light) 80%, transparent);            /* --mark-now: the one now line */
  --x-hatch: color-mix(in srgb, var(--ink-muted) 26%, transparent);      /* --mark-stale-hatch */
  --x-stale: repeating-linear-gradient(45deg, transparent 0 var(--space-2), var(--x-hatch) var(--space-2) calc(var(--space-2) + 1px)); /* 45deg; shadow (unavailable) is 135deg */
  --x-shadow: repeating-linear-gradient(135deg, transparent 0 var(--space-2), var(--hairline) var(--space-2) calc(var(--space-2) + 1px));
  --x-past-dim: .62;                                                      /* --time-past-dim */
  --x-since: color-mix(in srgb, var(--ink) 5%, transparent);             /* --mark-since: the span since you were here, matter not light */
  --x-since-edge: color-mix(in srgb, var(--ink) 70%, transparent);       /* --mark-since-edge: the "changed since you left" notch */
  --x-deposit: color-mix(in srgb, var(--ink) 10%, transparent);          /* --mark-deposit: a change landing during replay (ink, not flicker) */
  --x-settle: var(--motion-hold);                                         /* --time-arrival-hold: how long arrival marks stay unfolded */
  --x-trail-h: var(--space-7);                                            /* time rail height */
}
@property --age{syntax:'<number>';inherits:true;initial-value:0}
@property --wear{syntax:'<number>';inherits:true;initial-value:0}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.lucide{flex:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kbd{font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:2px var(--space-1)}

/* ground: water + department horizon */
.water{position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 55% 110%, color-mix(in srgb, var(--navy) 46%, transparent), transparent 70%)}
.horizon{position:fixed;left:0;right:0;bottom:0;height:55%;pointer-events:none;background:radial-gradient(55% 70% at 58% 100%, color-mix(in srgb, var(--floor-department-low) 22%, transparent), transparent 76%)}

/* ===== app frame: rail · main · About (house style: cinematic combined V2) ===== */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr) var(--measure-drawer)}
.rail{display:flex;flex-direction:column;gap:var(--space-1);padding:var(--edge-tight) var(--edge-tight) var(--space-7);background:color-mix(in srgb, var(--slate-deep) 70%, transparent);border-right:1px solid var(--hairline);min-width:0;overflow:hidden}
.tile{display:flex;height:var(--space-7);border-radius:var(--radius-key);background:var(--surface-raised);overflow:hidden;box-shadow:inset 3px 0 0 var(--floor-department-high);margin-bottom:var(--space-4);flex:none}
.tile-icon{width:var(--space-7);flex:none;display:grid;place-items:center;background:color-mix(in srgb, var(--ink) 78%, transparent);color:var(--slate-deep)}
.tile-text{display:flex;flex-direction:column;justify-content:center;padding:0 var(--space-3);min-width:0}
.tile-name{font-size:var(--type-meta);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.tile-owner{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);color:var(--ink-muted);font-size:var(--type-meta);white-space:nowrap;flex:none;text-align:left}
.nav:hover{background:var(--surface-inset);color:var(--ink)}
.nav.lit{background:var(--surface-raised);color:var(--light)} .nav.lit .lucide{color:var(--green)}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav .n{font:400 var(--type-small)/1 var(--font-mono)}
.nav .n.chg{color:var(--ink)}
.rail-section{margin:var(--space-4) var(--space-3) var(--space-1)}
.rail-note{margin-top:auto;padding:var(--space-3);border:1px solid var(--hairline);border-radius:var(--radius-key);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rail-note b{color:var(--ink);font-weight:400}

.main{position:relative;min-width:0;display:flex;flex-direction:column;padding:var(--space-4) var(--space-5) var(--space-6);overflow:hidden}
.mast{text-align:center;flex:none}
.mast-owner{display:inline-flex;align-items:center;gap:var(--space-3)}
.mast-owner::before,.mast-owner::after{content:"";width:var(--space-5);height:1px;background:var(--hairline-strong)}
.mast-title{font-size:var(--type-title-s);line-height:var(--leading-title-s);font-weight:300;letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);margin:0}

/* ===== the "When you left" line: the shell's one sentence about time ===== */
.left{flex:none;display:flex;align-items:center;gap:var(--space-3) var(--space-4);flex-wrap:wrap;margin:var(--space-3) 0 var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline);background:var(--surface-inset);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted);transition:opacity var(--motion-calm) var(--ease-standard),background-color var(--motion-calm)}
.left .lucide{color:var(--ink-muted)}
.left b{font-weight:400;color:var(--ink)}
.left .lit{color:var(--green)}
.left .sep{width:1px;align-self:stretch;background:var(--hairline)}
.left .else{display:inline-flex;gap:var(--space-2);align-items:center}
.left .else button{color:var(--ink);border-bottom:1px dashed var(--hairline-strong)}
.left .else button:hover{color:var(--light)}
.left .acts{margin-left:auto;display:flex;gap:var(--space-2)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);background:var(--surface-inset);font-size:var(--type-meta);color:var(--ink);white-space:nowrap;transition:background var(--motion-quick)}
.btn:hover{background:var(--surface-raised)}
.btn[aria-disabled="true"]{cursor:not-allowed;color:var(--ink-muted);border-style:dashed;background:var(--x-shadow)}
.btn .kbd{padding:0 var(--space-1)}
body.calm .left{background:transparent;border-color:transparent;padding-top:0;padding-bottom:0}
body.calm .left .full{display:none}
.left .short{display:none}
body.calm .left .short{display:inline}
body.replay .acts .btn:not(#bStop){display:none}
.acts{display:flex;gap:var(--space-2)}
#bStop{display:none}
body.replay #bStop{display:inline-flex}

/* ===== toolbar ===== */
.toolbar{display:flex;gap:var(--space-2);align-items:center;margin:0 0 var(--space-2);flex:none}
.search{flex:1;display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-4);background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink-muted);min-width:0;font-size:var(--type-meta);white-space:nowrap;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);background:var(--surface-inset);border:1px solid var(--hairline);color:var(--ink-muted);font-size:var(--type-meta);white-space:nowrap}
.chip:hover{color:var(--ink);background:var(--surface-raised)}
.chip[aria-pressed="true"]{color:var(--light);border-color:var(--hairline-strong);background:var(--surface-raised)}

/* ===== list + overview ruler ===== */
.listwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--space-3);gap:var(--space-2)}
.list{overflow:auto;padding:var(--space-1) var(--space-1) var(--space-6);display:flex;flex-direction:column;gap:var(--space-1);scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.ruler{position:relative;border-left:1px solid var(--hairline);margin:var(--space-1) 0 var(--space-6)}
.ruler .thumb{position:absolute;left:-1px;right:0;top:var(--y);height:var(--h);border-left:1px solid var(--hairline-strong);background:color-mix(in srgb, var(--ink) 4%, transparent);pointer-events:none}
.ruler i{position:absolute;left:0;right:0;top:var(--y);height:2px;background:var(--x-since-edge)}
.ruler i.st{height:var(--h);background:var(--x-stale)}
.ruler i.need{left:calc(var(--space-1) * -1);right:auto;width:var(--space-2);height:var(--space-2);margin-top:calc(var(--space-1) * -1);border-radius:50%;background:var(--green);box-shadow:0 0 var(--space-2) color-mix(in srgb, var(--green) 50%, transparent)}

/* a row ages in place (library V1): tone = time since change, edge = read wear, hatch = stale */
.row{flex:none;position:relative;isolation:isolate;display:grid;grid-template-columns:var(--target-md) minmax(0,1fr) auto;align-items:center;min-height:var(--target-md);padding:0 var(--space-4) 0 0;border-radius:var(--radius-key);border:1px solid transparent;
  background:linear-gradient(90deg,color-mix(in srgb,var(--ink) calc(var(--wear) * 9%),transparent),transparent 45%),var(--surface-inset);
  transition:--age var(--motion-calm) var(--ease-standard),--wear var(--motion-calm) var(--ease-standard),background-color var(--motion-quick),opacity var(--motion-base)}
.row:hover,.row:focus-within{background-color:var(--surface-raised)}
.row:focus-within{border-color:var(--hairline-strong)}
.row::before{content:"";position:absolute;left:0;top:var(--space-1);bottom:var(--space-1);width:3px;border-radius:2px;background:color-mix(in srgb,var(--ink) calc(var(--x-wear-min) + var(--wear) * (var(--x-wear-max) - var(--x-wear-min))),transparent)}
.row .open{position:absolute;inset:0;border-radius:inherit;z-index:0}
.row .open:focus-visible{outline-offset:-1px}
.row .ic,.row .t,.row .meta{position:relative;z-index:1;pointer-events:none}
.row .ic{display:grid;place-items:center;color:color-mix(in srgb,var(--ink) calc((1 - var(--age)) * 100%),var(--ink-muted));opacity:calc(1 - var(--age) * (1 - var(--x-past-dim)))}
.row .t{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:var(--space-2) 0}
.row .name{font-size:var(--type-body);line-height:var(--leading-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--light) calc((1 - var(--age)) * 100%),var(--ink-muted));opacity:calc(1 - var(--age) * (1 - var(--x-past-dim)))}
.row .sub{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;gap:var(--space-3);align-items:center;font:400 var(--type-small)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-soft);color:var(--ink-muted);white-space:nowrap;text-align:right}
.row .meta > span{display:inline-flex;gap:var(--space-1);align-items:center}
.row .meta > span + span{padding-left:var(--space-3);border-left:1px solid var(--hairline)}
.row .meta .who{color:var(--ink)}
/* stale: a state, hatched, with its age and who */
.row.stale{background-image:var(--x-stale),linear-gradient(90deg,color-mix(in srgb,var(--ink) calc(var(--wear) * 9%),transparent),transparent 45%)}
.row .st{color:var(--ink)}
/* seam: the repaired words keep a fine gold double line, for good */
.fix{color:var(--ink);padding-bottom:2px;background:linear-gradient(var(--x-seam),var(--x-seam)) 0 100% / 100% 1px no-repeat,linear-gradient(var(--x-seam),var(--x-seam)) 0 calc(100% - 3px) / 100% 1px no-repeat}
.was-v{text-decoration:line-through;text-decoration-color:var(--x-seam)}
.seamk{color:var(--x-seam)}
/* the honest blank */
.gap{border-bottom:1px dashed var(--hairline-strong)}
/* distance to travel, word-sized */
.dist{display:inline-block;width:calc(var(--d) * var(--space-6));height:0;border-top:1px dotted var(--ink-muted);position:relative;margin-right:var(--space-1)}
.dist::after{content:"";position:absolute;right:0;top:calc(var(--space-1) * -1 - 1px);height:var(--space-2);width:2px;background:var(--ink)}
/* archived: still here, says so and who can bring it back */
.row.gone{border-style:dashed;border-color:var(--hairline-strong);background:var(--surface-inset)}
.row.gone .name{text-decoration:line-through;text-decoration-color:var(--hairline-strong)}
.row.notyet{opacity:var(--x-past-dim);border:1px dashed var(--hairline)}
.row.notyet .name,.row.notyet .sub{color:var(--ink-muted)}

/* ===== changed since you left: matter, not light ===== */
.row.chg::after{content:"";position:absolute;right:calc(var(--space-1) * -1);top:var(--space-3);bottom:var(--space-3);width:2px;border-radius:var(--radius-pill);background:var(--x-since-edge)}
.tag{color:var(--ink)}
.tag::before{content:"";display:inline-block;width:var(--space-2);height:2px;background:var(--x-since-edge);margin-right:var(--space-1);vertical-align:middle}
/* "When you left": the value it had, one quiet line on the object */
.was{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--motion-calm) var(--ease-standard),opacity var(--motion-calm) var(--ease-standard)}
.was > span{overflow:hidden;min-height:0;font-size:var(--type-small);line-height:var(--leading-small);color:color-mix(in srgb,var(--ink-muted) 85%,transparent);white-space:nowrap;text-overflow:ellipsis}
.was > span > span{display:block;margin-top:var(--space-1);padding-top:var(--space-1);border-top:1px dashed var(--hairline);overflow:hidden;text-overflow:ellipsis}
.was i{font:400 var(--type-label)/1 var(--font-mono);font-style:normal;letter-spacing:var(--tracking-caps);text-transform:uppercase;margin-right:var(--space-2);color:var(--ink-muted)}
body.calm .was,body.pre .was{grid-template-rows:0fr;opacity:0}
body.pre .row.chg::after,body.pre .tag{opacity:0}
.row.chg::after,.tag{transition:opacity var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-quick))}
.was{transition-delay:calc(var(--i, 0) * var(--motion-quick))}
body.calm .was{transition-delay:0s}
/* a change landing, during replay only: an ink deposit, never a flicker of light */
.row.dep{animation:deposit var(--motion-calm) var(--ease-out) 1 both}
@keyframes deposit{from{background-color:var(--x-deposit)}to{background-color:var(--surface-inset)}}

/* ===== needs you: the one place time borrows light (light language bloom) ===== */
.row.need{border-color:color-mix(in srgb, var(--green) 40%, var(--hairline))}
.row.need::marker{content:none}
.row.need .bloomer{position:absolute;inset:calc(var(--space-2) * -1);border-radius:calc(var(--radius-key) + var(--space-2));background:radial-gradient(closest-side, color-mix(in srgb, var(--green) 16%, transparent), transparent);z-index:-1;pointer-events:none;
  animation:breathe var(--motion-still) var(--ease-standard) 6 alternate both}
@keyframes breathe{from{opacity:calc(1 - var(--breathe) * 3)}to{opacity:1}}
body.pre .row.need .bloomer{opacity:0;animation:none}
.row.need .ic,.row .needt{color:var(--green)}
body.pre .row .needt{color:var(--ink)}

/* ===== the time rail: one now line for the whole view ===== */
.trail{flex:none;position:relative;height:var(--x-trail-h);margin:0 calc(var(--space-3) + var(--space-2)) 0 0;border-top:1px solid var(--hairline)}
.trail .lab{position:absolute;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.trail .track{position:absolute;left:0;right:0;top:var(--space-6);height:1px;background:var(--hairline-strong)}
.trail .day{position:absolute;top:var(--space-6);width:1px;height:var(--space-1);background:var(--hairline-strong)}
.trail .day.wk{height:var(--space-2);background:var(--ink-muted)}
.trail .dl{top:calc(var(--space-6) + var(--space-3));transform:translateX(-50%)}
.trail .since{position:absolute;top:var(--space-3);height:calc(var(--space-6) - var(--space-3));background:var(--x-since)}
.trail .tick{position:absolute;bottom:calc(var(--x-trail-h) - var(--space-6));width:var(--space-3);margin-left:calc(var(--space-3) / -2);height:var(--h);display:flex;justify-content:center;border-radius:2px}
.trail .tick::before{content:"";width:2px;height:100%;background:var(--x-since-edge);border-radius:1px 1px 0 0}
.trail .tick:hover::before,.trail .tick:focus-visible::before{background:var(--light)}
.trail .ring{position:absolute;top:calc(var(--space-6) - var(--space-1) - 1px);width:var(--space-3);height:var(--space-3);margin-left:calc(var(--space-3) / -2);margin-top:calc(var(--space-1) * -1 + 1px);border-radius:50%;border:1px solid var(--ink);background:var(--slate-deep)}
.trail .ringl{top:var(--space-1);transform:translateX(-50%)}
.trail .ringl b{font-weight:400;color:var(--ink)}
.trail .fut{position:absolute;top:var(--space-6);height:0;border-top:1px dotted var(--ink-muted)}
.trail .due{position:absolute;top:calc(var(--space-6) - var(--space-2));width:2px;height:var(--space-4);background:var(--ink)}
.trail .duel{top:var(--space-1);transform:translateX(calc(-100% - var(--space-2)));text-align:right}
.trail .duel.r{transform:translateX(var(--space-2));text-align:left}
.trail .duel b{font-weight:400;color:var(--ink)}
.trail .now{position:absolute;top:0;height:calc(var(--space-6) + var(--space-3));width:1px;background:var(--x-now)}
.trail .nowl{top:calc(var(--space-6) + var(--space-3));transform:translateX(-50%);color:var(--light)}
.trail .head{position:absolute;top:var(--space-2);height:calc(var(--space-6) - var(--space-1));width:2px;margin-left:-1px;background:var(--ink);border-radius:var(--radius-pill);opacity:0;transition:opacity var(--motion-base)}
.trail .head::after{content:"";position:absolute;left:50%;top:0;width:var(--space-3);height:var(--space-3);margin:calc(var(--space-3) / -2);border-radius:50%;background:var(--ink)}
body.replay .trail .head{opacity:1}
.trail .headl{position:absolute;top:calc(var(--space-6) + var(--space-2));z-index:1;transform:translateX(-50%);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink);background:var(--surface-overlay);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2);white-space:nowrap;opacity:0}
body.replay .trail .headl{opacity:1}
body.pre .trail .tick,body.pre .trail .since{opacity:0}
.trail .tick,.trail .since{transition:opacity var(--motion-calm) var(--ease-out);transition-delay:calc(var(--i, 0) * var(--motion-quick))}

/* ===== About: why are you like this, and since when? ===== */
.about{position:relative;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-5) var(--space-4) calc(var(--space-7) + var(--space-4));border-left:1px solid var(--hairline);background:color-mix(in srgb, var(--slate-deep) 62%, transparent);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
.about h3{margin:0;font-weight:400;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.about p{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.about p b{font-weight:400;color:var(--ink)}
.swap{display:flex;flex-direction:column;gap:var(--space-3);transition:opacity var(--motion-quick)}
.swap.out{opacity:0}
.then{padding:var(--space-2) var(--space-3);border-top:1px dashed var(--hairline-strong);color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.ledger{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.ledger li{display:grid;grid-template-columns:var(--space-7) 1fr;gap:var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.ledger .d{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted)}
.ledger li.rep{padding-left:var(--space-2);margin-left:calc(var(--space-2) * -1);border-left:2px solid var(--x-seam)}
.ledger li.nd .d{color:var(--green)}
.why{display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) var(--space-3);margin:0;font-size:var(--type-meta);line-height:var(--leading-meta)}
.why dt{font:400 var(--type-label)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.why dd{margin:0;color:var(--ink)}

const fday = t => { const d = new Date(t); return DN[d.getDay()] + ' ' + d.getDate() + ' ' + MN[d.getMonth()]; };
const ftime = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function span(n) { n = Math.abs(n); if (n < 1) return 'today'; if (n < 14) return Math.round(n) + (Math.round(n) === 1 ? ' day' : ' days'); if (n < 63) return Math.round(n / 7) + ' weeks'; if (n < 730) return Math.round(n / 30.4) + ' months'; return (n / 365).toFixed(1).replace('.0', '') + ' years'; }

/* the state of one document at time t (now, or a moment of the replay) */

  if (s.seam) sub += ` · <span class="seamk">repair ${fd(T(d.seam.on))}</span> ${esc(d.seam.what)} <span class="fix">${esc(d.seam.now)}</span>`;
  else if (d.back) sub += ` · <span class="seamk">rollback ${MN[new Date(T(d.back.on)).getMonth()]} ${new Date(T(d.back.on)).getFullYear()}</span>`;
  const was = chg && d.then ? `<span class="was" style="--i:${i}"><span><span><i>When you left</i>${esc(d.then)}</span></span></span>` : '';
  const cls = ['row', s.stale && !s.need ? 'stale' : '', s.need ? 'need' : '', s.gone ? 'gone' : '', chg ? 'chg' : ''].join(' ');
  const label = `${d.title}. ${s.need ? 'Needs you: ' + d.needs.short + '. ' : ''}${chg ? 'Changed since you left on ' + fd(LAST) + '. ' : ''}`;
  return `<div class="${cls}" role="listitem" id="r-${d.id}" data-id="${d.id}" style="--age:${s.age.toFixed(3)};--wear:${wear(d).toFixed(3)};--i:${i}">
    ${s.need ? '<span class="bloomer" aria-hidden="true"></span>' : ''}
    <button class="open" data-id="${d.id}" aria-label="${esc(label)}"></button>
    <span class="ic"><i data-lucide="${d.status === 'draft' ? 'file-pen-line' : s.gone ? 'archive' : 'file-text'}"></i></span>
    <span class="t"><span class="name">${esc(d.title)}</span><span class="sub">${sub}</span>${was}</span>
    <span class="meta">${meta.join('')}</span></div>`;
}
let prevState = {};
function renderList(t = NOW, deposit) {
  const L = $('#list'), keep = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.id : null;
  let n = 0;
  L.innerHTML = docs.map(d => rowHTML(d, t, at(d, t).chg.length ? n++ : 0)).join('');
  Icons.hydrate(L);
  if (deposit) docs.forEach(d => { const k = JSON.stringify(at(d, t).chg.length) + at(d, t).exists; if (prevState[d.id] !== undefined && prevState[d.id] !== k) $('#r-' + d.id).classList.add('dep'); });
  docs.forEach(d => prevState[d.id] = JSON.stringify(at(d, t).chg.length) + at(d, t).exists);
  if (keep && t >= NOW) { const b = $(`.open[data-id="${keep}"]`); if (b) b.focus({ preventScroll: true }); }
  ruler();
}
function ruler() {
  const L = $('#list'), R = $('#ruler'), H = R.clientHeight, sh = L.scrollHeight || 1;
  let h = `<div class="thumb" style="--y:${L.scrollTop / sh * H}px;--h:${L.clientHeight / sh * H}px"></div>`;
  $$('.row', L).forEach(r => {
    const y = r.offsetTop / sh * H, hh = r.offsetHeight / sh * H;
    if (r.classList.contains('stale')) h += `<i class="st" style="--y:${y}px;--h:${hh}px"></i>`;
    if (r.classList.contains('chg')) h += `<i style="--y:${y + hh / 2}px"></i>`;
    if (r.classList.contains('need')) h += `<i class="need" style="--y:${y + hh / 2}px"></i>`;
  });
  R.innerHTML = h;
}

/* ===== the time rail: last visit, what landed since, the one now line, distance to travel ===== */
const R0 = T(DATA.rail.from), R1 = T(DATA.rail.to);
const X = t => ((t - R0) / (R1 - R0) * 100).toFixed(3) + '%';
function trail() {
  let h = '<div class="track"></div>';
  for (let t = R0; t <= R1; t += DAY) { const d = new Date(t), wk = d.getDay() === 1; h += `<div class="day${wk ? ' wk' : ''}" style="left:${X(t)}"></div>`; if (wk && Math.abs(t - NOW) > DAY) h += `<span class="lab dl" style="left:${X(t)}">${fday(t)}</span>`; }
  h += `<div class="since" style="left:${X(LAST)};width:calc(${X(NOW)} - ${X(LAST)})"></div>`;
  /* what landed: one tick per change, stacked when they share a day */
  const evs = docs.flatMap(d => (d.changes || []).filter(c => T(c.on) > LAST && T(c.on) <= NOW).map(c => ({ d, c, t: T(c.on) }))).sort((a, b) => a.t - b.t);
  const per = {};
  evs.forEach((e, i) => { const k = Math.floor((e.t - R0) / DAY); per[k] = (per[k] || 0) + 1;
    h += `<button class="tick" data-id="${e.d.id}" style="left:${X(e.t)};--h:calc(var(--space-2) + ${per[k]} * var(--space-2));--i:${i}" aria-label="${fday(e.t)}: ${esc(e.c.text)} Go to ${esc(e.d.title)}" title="${fday(e.t)} · ${esc(e.d.title)}: ${esc(e.c.text)}"></button>`; });
  h += `<div class="ring" style="left:${X(LAST)}" aria-hidden="true"></div><span class="lab ringl" style="left:${X(LAST)}"><b>You were here</b> · ${fd(LAST)}</span>`;
  /* the known future: distance to travel to dated events on these documents */
  const fut = docs.filter(d => d.review && T(d.review.next) > NOW && T(d.review.next) <= R1).map(d => ({ d, t: T(d.review.next) })).sort((a, b) => a.t - b.t);
  if (fut.length) h += `<div class="fut" style="left:${X(NOW)};width:calc(${X(fut[fut.length - 1].t)} - ${X(NOW)})"></div>`;
  fut.forEach((f, i) => h += `<div class="due" style="left:${X(f.t)}" aria-hidden="true"></div><span class="lab duel" style="left:${X(f.t)};top:calc(var(--space-1) + ${i % 2} * var(--space-4))" title="${esc(f.d.title)}"><b>${esc(f.d.review.what || 'Review')} ${fd(f.t)}</b></span>`);
  h += `<div class="now" style="left:${X(NOW)}"></div><span class="lab nowl" style="left:${X(NOW)}">now · ${fday(NOW)}</span>`;
  h += `<div class="head" id="head" style="left:${X(NOW)}"><span class="headl" id="headl"></span></div>`;
  $('#trail').innerHTML = h;
  $('#trail').setAttribute('aria-label', `Time in this collection: your last visit ${fday(LAST)}, ${evs.length} changes since, now, and ${fut.length} dates ahead`);
  $$('.tick').forEach(b => b.onclick = () => focusRow(b.dataset.id));
}

/* ===== About: what changed, why, since when, who can change it ===== */
let CUR = null;
function about(id, instant) {
  CUR = id; const d = byId(id), s = at(d, NOW), sw = $('#swap');
  const fill = () => {
    const chg = (d.changes || []).filter(c => T(c.on) > LAST);
    const who = s.stale || s.need ? (d.review ? d.review.by : s.owner) : s.owner;
    const isYou = who === DATA.viewer.name;
    let h = `<span class="eyebrow">${chg.length ? 'Since you were here' : 'About'} · ${esc(DATA.library.name)}</span><h3>${esc(d.title)}</h3>
      <p>${esc(d.v)} · ${esc(s.owner)}${d.status ? ' · ' + d.status : ''}</p>`;
    if (s.need) h += `<div class="box need"><i data-lucide="${d.needs.kind === 'read' ? 'eye' : 'hand'}" data-size="16"></i><span><b>Needs you.</b> ${esc(d.needs.why)}</span></div>`;
    if (chg.length) {
      h += d.then ? `<div class="then"><span class="eyebrow">When you left · ${fd(LAST)}</span><br>${esc(d.then)}</div>` : '';
      h += `<ol class="ledger">${chg.map(c => `<li class="${c.kind === 'repair' ? 'rep' : c.kind === 'ask' || c.kind === 'stale' ? 'nd' : ''}"><span class="d">${fd(T(c.on))}</span><span>${c.kind === 'repair' ? `${esc(d.seam.by)} repaired the ${esc(d.seam.what)}: <span class="was-v">${esc(d.seam.was)}</span> → <span class="fix">${esc(d.seam.now)}</span>. ${esc(d.seam.why)}` : esc(c.text)}</span></li>`).join('')}</ol>`;
    } else h += `<p>Nothing changed while you were away. Last change <b>${span(days(T(s.last[0]), NOW))} ago</b> by <b>${esc(s.last[1])}</b>.</p>`;
    const rows = [];
    if (s.seam) rows.push(['Wrong for', span(days(T(d.seam.stood), T(d.seam.on))) + ', from ' + fdy(T(d.seam.stood))]);
    if (s.stale) rows.push(['Stale', span(s.staleFor) + ', review was due ' + fdy(T(d.review.next))]);
    if (s.gone) rows.push(['Archived', fdy(T(d.archived.on)) + ' by ' + esc(d.archived.by) + '. ' + esc(d.archived.restore)]);
    if (d.ownerChange && s.owner === d.ownerChange.to) rows.push(['Owner', esc(d.ownerChange.to) + ', since ' + esc(d.ownerChange.why) + ' on ' + fd(T(d.ownerChange.on))]);
    if (d.gap) rows.push(['No record', 'before ' + fdy(T(d.gap.to)) + '. ' + esc(d.gap.why)]);
    if (d.back) rows.push(['Rollback', esc(d.back.what)]);
    if (d.review && !s.stale && T(d.review.next) > NOW && days(NOW, T(d.review.next)) < 62) rows.push([esc(d.review.what || 'Review'), 'in ' + span(days(NOW, T(d.review.next))) + ', ' + fdy(T(d.review.next)) + ' · ' + esc(d.review.by)]);
    rows.push(['Read', d.readSince != null ? count(d.readSince, 'people') + ' of ' + DATA.library.audience + ' since the last change' : count(d.readers, 'readers') + ' in ' + DATA.lastMonth]);
    h += `<dl class="why">${rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>`;
    if (d.groups) { const all = d.groups.every(g => g[2] >= K);
      h += `<p class="note">${all ? d.groups.map(g => `${esc(g[0])} <b>${g[2]} of ${g[1]}</b>`).join(' · ') : `<b>Split by group hidden.</b> One group has fewer than ${K} readers since the repair, so the others would give its number away.`}</p>`; }
    if (d.you) { const read = T(d.you.on), old = d.seam && read < T(d.seam.on) && read > T(d.seam.stood);
      h += `<div class="box you"><i data-lucide="user-round" data-size="16"></i><span><b>You</b> last opened it on ${fdy(read)} at ${ftime(read)} (${esc(d.you.v)})${old ? `, when it said <span class="was-v">${esc(d.seam.was)}</span>` : ''}.${s.chg.length && read < LAST ? ' It has changed since.' : ''} Only you see this line.</span></div>`; }
    else h += `<div class="box you"><i data-lucide="user-round" data-size="16"></i><span><b>You</b> have not opened it yet. Only you see this line.</span></div>`;
    const acts = [];
    if (s.need) acts.push(isYou || d.needs.kind ? `<button class="btn"><i data-lucide="${d.needs.kind === 'read' ? 'book-open' : 'check'}" data-size="16"></i>${esc(d.needs.act)}</button>` : '');
    else if (s.stale) acts.push(`<button class="btn" aria-disabled="true" aria-describedby="why-${d.id}"><i data-lucide="lock" data-size="16"></i>Review now</button><button class="btn"><i data-lucide="message-square" data-size="16"></i>Ask ${esc(d.review.by)}</button><span class="note" id="why-${d.id}">Only <b>${esc(d.review.by)}</b> can review it.</span>`);
    else if (s.gone) acts.push(`<button class="btn" aria-disabled="true" aria-describedby="why-${d.id}"><i data-lucide="archive-restore" data-size="16"></i>Restore</button><span class="note" id="why-${d.id}">${esc(d.archived.restore)}</span>`);
    else acts.push(`<button class="btn"><i data-lucide="book-open" data-size="16"></i>Open</button>`);
    if (s.seam) acts.push(`<button class="btn"><i data-lucide="git-compare-arrows" data-size="16"></i>Before and after</button>`);
    h += `<div class="acts2">${acts.join('')}</div>`;
    sw.innerHTML = h; Icons.hydrate(sw);
  };
  if (instant || RM) { fill(); return; }
  sw.classList.add('out'); setTimeout(() => { fill(); sw.classList.remove('out'); }, ms('--motion-quick'));
}

/* ===== moves ===== */
function focusRow(id) {
  const b = $(`.open[data-id="${id}"]`); if (!b) return;
  b.focus({ preventScroll: true });
  const r = b.closest('.row'), L = $('#list');
  L.scrollTo({ top: r.offsetTop - L.clientHeight / 3, behavior: RM ? 'auto' : 'smooth' });
}
function seen(id) {      /* opening an object is what clears its "changed" mark; needs-you stays until it is done */
  const d = byId(id); if (!at(d, NOW).chg.length || SEEN.has(id)) return;
  SEEN.add(id); renderList(); leftLine(); focusRow(id);
}
function done() { docs.forEach(d => { if (at(d, NOW).chg.length) SEEN.add(d.id); }); calm(); renderList(); leftLine(); }
let settleT = 0;
function calm() { clearTimeout(settleT); document.body.classList.add('calm'); }
function show() { clearTimeout(settleT); document.body.classList.remove('calm'); }
const changed = () => docs.filter(d => at(d, NOW).chg.length && !SEEN.has(d.id));
function step(dir) {
  const list = changed(); if (!list.length) return;
  const i = list.findIndex(d => d.id === CUR), n = list[(i + dir + list.length) % list.length] || list[0];
  focusRow(n.id);
}

/* replay the two weeks, on request: the view at your last visit, then each day forward to now */
let RUN = 0;
async function replay() {
  const my = ++RUN; show(); document.body.classList.add('replay');
  const head = $('#head'), hl = $('#headl');
  const set = t => { head.style.left = X(t); hl.textContent = t >= NOW ? 'now' : fday(t); renderList(t, true); };
  prevState = {}; set(LAST); await wait(ms('--motion-calm')); if (my !== RUN) return;
  for (let t = LAST + DAY; t < NOW; t += DAY) { set(t); await wait(ms('--motion-slow')); if (my !== RUN) return; }
  stopReplay();
}
function stopReplay() { RUN++; document.body.classList.remove('replay'); $('#head').style.left = X(NOW); renderList(NOW); if (CUR) focusRow(CUR); }

/* ===== arrival: on load the view is the end state; at ~1.2 s the marks deposit, then settle ===== */
let ARR = 0;
async function arrive() {
  const my = ++ARR; RUN++; clearTimeout(settleT);
  SEEN.clear(); document.body.classList.remove('replay', 'calm'); document.body.classList.add('pre');
  renderList(); leftLine(); $('#list').scrollTo({ top: 0 }); about(docs.find(d => at(d, NOW).chg.length).id, true);
  await wait(ms('--motion-run')); if (my !== ARR) return;
  document.body.classList.remove('pre');
  await wait(ms('--motion-calm') * 2); if (my !== ARR) return;
  const star = DATA.docs.find(d => d.seam && at(d, NOW).need) || changed()[0];
  focusRow(star.id);
  settleT = setTimeout(() => { if (my === ARR && !document.body.classList.contains('replay')) calm(); }, ms('--x-settle'));
}

/* ===== wiring ===== */
shell(); trail(); Icons.hydrate();
const L = $('#list');
L.addEventListener('scroll', ruler, { passive: true });
L.addEventListener('focusin', e => { const b = e.target.closest('.open'); if (b && b.dataset.id !== CUR) about(b.dataset.id); });
L.addEventListener('click', e => { const b = e.target.closest('.open'); if (b) seen(b.dataset.id); });
$('#ruler').addEventListener('click', e => { const r = $('#ruler').getBoundingClientRect(); L.scrollTo({ top: (e.clientY - r.top) / r.height * L.scrollHeight - L.clientHeight / 2, behavior: RM ? 'auto' : 'smooth' }); });
addEventListener('resize', ruler);
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowdown' || k === 'arrowup') { const bs = $$('.open'), i = bs.indexOf(document.activeElement); const n = bs[Math.max(0, Math.min(bs.length - 1, i < 0 ? 0 : i + (k === 'arrowdown' ? 1 : -1)))]; if (n) focusRow(n.dataset.id); e.preventDefault(); }
  else if (k === 'enter' && document.activeElement.matches('.open')) { /* click handles it */ }
  else if (k === ']') step(1); else if (k === '[') step(-1);
  else if (k === 'p') replay();
  else if (k === 's') document.body.classList.contains('calm') ? show() : calm();
  else if (k === 'd') done();
  else if (k === 'r') arrive();
  else if (k === 'escape') { if (document.body.classList.contains('replay')) stopReplay(); }
});
arrive();
</script>
</body>
</html>
