<!doctype html>
<html lang="en-GB">
<head>

<style>
/* ======================================================================
   Proposed tokens. All are combinations of kit tokens; listed in notes-v3.md.
   ====================================================================== */
:root{
  --x-type-micro:.6875rem;                                                   /* --type-micro: mono numerals and eyebrows inside data */
  --x-stratum-mix:34%;                                                       /* --stratum-mix: floor colour into slate */
  --x-past-dim:.62;                                                          /* --time-past-dim: the oldest marks, never fainter */
  --x-seam:color-mix(in srgb,var(--warning) 55%,var(--ink));                 /* --mark-seam (grammar V1 recipe) */
  --x-fault:color-mix(in srgb,var(--danger) 55%,var(--ink-muted));           /* --mark-fault: a settled break, muted like the upgrades scar */
  --x-now:color-mix(in srgb,var(--light) 80%,transparent);                   /* --mark-now */
  --x-hatch:color-mix(in srgb,var(--ink-muted) 34%,transparent);             /* --mark-stale-hatch ink */
  --x-stale:repeating-linear-gradient(45deg,transparent 0 var(--space-1),var(--x-hatch) var(--space-1) calc(var(--space-1) + 1px));
  --x-link-fill:color-mix(in srgb,var(--ink) 8%,transparent);                /* --link-same: a carry-over ribbon */
  --x-link-edge:color-mix(in srgb,var(--ink) 22%,transparent);
  --x-near-blur:1px;                                                         /* cinematic --focus-near-blur, softened for a data table */
  --x-near-dim:.72;
  --x-glyph-w:calc(var(--space-8) + var(--space-5));                         /* 144: word-sized strata */
  --x-col-fact:calc(var(--space-8) + var(--space-6));                        /* 160 */
  --x-col-val:calc(var(--space-8) + var(--space-4));                         /* 132 */
  --x-col-ver:calc(var(--space-8) + var(--space-1));                         /* 120 */
  --x-row:calc(var(--space-6) + var(--space-3));                             /* 56 */
  --x-row-h:calc(var(--space-7) + var(--space-2));                           /* 80: history rows */
  --x-gutter:calc(var(--space-8) + var(--space-7));                          /* 188: ribbon gutter */
}
@media (max-height:840px){:root{--x-row:var(--target-md);--x-row-h:calc(var(--space-7) - var(--space-2))}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.micro{font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}
.kbd{display:inline-block;font:400 var(--x-type-micro)/1 var(--font-mono);padding:calc(var(--space-1) / 2) var(--space-1);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);color:var(--ink);letter-spacing:0}
.keys{position:fixed;right:var(--edge-tight);bottom:var(--edge-tight);z-index:var(--layer-chrome);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-1) var(--space-3);max-width:calc(var(--measure-wide) * .62);font:400 var(--x-type-micro)/var(--leading-small) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:lowercase;color:var(--ink-muted);background:var(--scrim);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key)}

/* ---- app frame (Data Atlas) ---- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--measure-rail) minmax(0,1fr)}
.rail{background:color-mix(in srgb,var(--slate-deep) 70%,transparent);border-right:1px solid var(--hairline);padding:var(--edge) var(--edge-tight);display:flex;flex-direction:column;gap:var(--space-1)}
.rail .an{font:400 var(--type-meta)/1 var(--font-sans);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--light);padding:var(--space-2);margin-bottom:var(--space-4)}
.nav{text-decoration:none;display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-2);color:var(--ink-muted);font-size:var(--type-meta);border-radius:var(--radius-key)}
.nav.on{background:var(--surface-raised);color:var(--ink)}
.nav .n{margin-left:auto;font:400 var(--type-small)/1 var(--font-mono)}
.rail .foot{margin-top:auto;margin-bottom:var(--space-6);padding:var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.rail .foot b{font-weight:400;color:var(--ink)}
.main{position:relative;padding:var(--edge) var(--space-6) var(--space-7);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-4)}
.head h1{margin:var(--space-2) 0 var(--space-1);font:200 var(--type-title-s)/var(--leading-title-s) var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.head .sub{font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}
.head .sub b{font-weight:400;color:var(--ink)}
/* the mode switch: one record, three distances */
.seg{display:inline-flex;padding:var(--space-1);gap:var(--space-1);border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--surface-inset);flex:none}
.seg button{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);font-size:var(--type-meta);color:var(--ink-muted)}
.seg button[aria-pressed="true"]{background:var(--surface-raised);color:var(--light);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.seg .kbd{opacity:.7}

.stage{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;padding:var(--space-1);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent;transition:opacity var(--motion-base) var(--ease-standard)}
.view[hidden]{display:block;opacity:0;pointer-events:none;visibility:hidden}

/* ---- the fact table (facts and history share it) ---- */
.tbl{position:relative;max-width:calc(var(--measure-wide) + var(--space-8) * 2.6)}
.th,.tr{display:grid;grid-template-columns:var(--space-3) var(--x-col-fact) var(--x-col-val) var(--x-glyph-w) var(--x-col-ver) minmax(0,1fr);align-items:center;column-gap:var(--space-4)}
.hist .th,.hist .tr{grid-template-columns:var(--space-3) var(--x-col-fact) var(--x-col-val) minmax(0,1fr) 0 0}
.hist .th .ver,.hist .th .src,.hist .tr .age,.hist .tr .src{visibility:hidden;overflow:hidden}
.th{padding:0 var(--space-3) var(--space-2);border-bottom:1px solid var(--hairline);height:var(--space-6);align-items:end}
.th .axis{position:relative;height:100%}
.th .axis span{position:absolute;bottom:0;transform:translateX(-50%);white-space:nowrap}
.th .axis span.l{transform:none}
.row{position:relative;border-bottom:1px solid var(--hairline);transition:filter var(--motion-slow) var(--ease-standard),opacity var(--motion-slow) var(--ease-standard)}
.tr{width:100%;min-height:var(--x-row);padding:0 var(--space-3);border-radius:var(--radius-key)}
.hist .tr{min-height:var(--x-row-h)}
.tr:hover{background:color-mix(in srgb,var(--surface-raised) 50%,transparent)}
.tr .a{font-size:var(--type-meta);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .v{display:flex;align-items:baseline;gap:var(--space-1);min-width:0;white-space:nowrap}
.tr .v b{font:400 var(--type-body)/1 var(--font-mono);color:var(--ink)}
.tr .v small{color:var(--ink-muted);font-size:var(--type-small)}
.tr .fl{position:relative;display:block;height:var(--space-5);min-width:0}
.hist .tr .fl{height:calc(var(--x-row-h) - var(--space-2))}
.tr .fl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tr .age{font:400 var(--type-small)/var(--leading-small) var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.stale{color:var(--ink);background:var(--x-stale);padding:0 var(--space-1);border-radius:var(--radius-key)}
.tr .src{font-size:var(--type-small);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* read wear in the margin (Hill and Hollan): use, counted, never named */
.wear{display:flex;flex-direction:column;gap:1px;align-self:stretch;justify-content:center}
.wear i{display:block;height:2px;border-radius:1px;background:var(--ink-muted)}
.beacon{display:inline-block;flex:none;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-pill);background:var(--green);box-shadow:0 0 var(--glow-blur) color-mix(in srgb,var(--green) 70%,transparent)}
.lbl{font:400 var(--x-type-micro) var(--font-mono);letter-spacing:var(--tracking-caps);fill:var(--ink-muted)}
.lbl.v{fill:var(--ink);letter-spacing:0}
.lbl.go{fill:var(--green);letter-spacing:0}
/* overlays that cross every row of the history: the now line and the record gap */
.over{position:absolute;top:0;bottom:0;z-index:1;pointer-events:none}
.over.now{width:1px;background:var(--x-now)}
.over.gap{background:var(--x-stale);border-left:1px dashed var(--ink-muted);border-right:1px dashed var(--ink-muted);opacity:.9}
.over .tag{position:absolute;top:calc(var(--space-5) * -1);left:50%;transform:translateX(-50%);white-space:nowrap;padding:0 var(--space-1);background:var(--slate-deep);border-radius:var(--radius-key);color:var(--ink)}
.over.gap .tag{pointer-events:auto;cursor:help;color:var(--ink-muted)}
.tbl:not(.hist) .over{display:none}

/* the answer opens in place, under the value */
.why{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--motion-slow) var(--ease-out)}
.why > div{overflow:hidden}
.row.open .why{grid-template-rows:1fr}
.row.open .tr{background:var(--surface-raised)}
.row.open{border-bottom-color:transparent}
.ans{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:var(--space-6);padding:var(--space-4) var(--space-4) var(--space-4) calc(var(--space-3) * 2 + var(--space-4));background:linear-gradient(var(--surface-raised),var(--surface-inset)),var(--slate-deep);border-radius:0 0 var(--radius-inset) var(--radius-inset)}
.ans h2{margin:var(--space-1) 0 var(--space-2);font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.ans p{margin:0 0 var(--space-2);font-size:var(--type-meta);line-height:var(--leading-meta)}
.ans p.m{color:var(--ink-muted)}
.qa{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2) var(--space-3);margin:var(--space-3) 0;padding-top:var(--space-3);border-top:1px solid var(--hairline)}
.qa dt{font:400 var(--x-type-micro)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.qa dd{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink)}
.qa dd .m{color:var(--ink-muted)}
.rec{list-style:none;margin:var(--space-2) 0 0;padding:0;display:grid;gap:calc(var(--space-1) / 2);font-size:var(--type-small);line-height:var(--leading-small)}
.rec li{display:grid;grid-template-columns:calc(var(--space-6) + var(--space-3)) var(--space-4) minmax(0,1fr);gap:var(--space-2);color:var(--ink-muted);align-items:start}
.rec li b{font-weight:400;color:var(--ink)}
.rec li .d{font-family:var(--font-mono)}
.rec li svg{width:var(--space-4);height:var(--space-4);overflow:visible}
.rec li.gap svg{background:var(--slate-deep)}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);font-size:var(--type-meta);margin:var(--space-1) var(--space-2) 0 0;background:var(--surface-inset)}
.btn.go{border-color:color-mix(in srgb,var(--green) 50%,transparent);color:var(--green)}
.btn[aria-disabled="true"]{color:var(--ink-muted);border-style:dashed;cursor:help}
/* rack focus: the rest of the record steps back while one value answers */
.tbl.asking .row:not(.open){filter:blur(var(--x-near-blur)) saturate(.6) brightness(var(--x-near-dim))}
.tbl.asking .row:not(.open):hover,.tbl.asking .row:not(.open):focus-within{filter:none}
.dep{opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.dep.in{opacity:var(--op,1)}

/* ---- compare: the parallel record ---- */
.cmp{display:flex;flex-direction:column;gap:var(--space-3);max-width:calc(var(--measure-wide) + var(--space-8) * 2.6)}
.strip{position:relative;height:calc(var(--space-7) + var(--space-3));border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--slate-deep);padding:0 var(--space-4)}
.strip svg{position:absolute;left:var(--space-4);right:var(--space-4);top:var(--space-5);height:var(--space-6);width:calc(100% - var(--space-4) * 2);overflow:visible}
.hnd{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);transition:left var(--motion-slow) var(--ease-out)}
.hnd span{position:absolute;top:var(--space-1);white-space:nowrap;color:var(--ink);transform:translateX(-50%)}
.hnd.now{background:var(--x-now)}
.hnd.now span{color:var(--light)}
.hnd::after{content:"";position:absolute;bottom:var(--space-2);left:calc(var(--space-1) * -1);width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--slate-deep);border:1px solid currentColor;color:var(--ink)}
.pair{position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--x-gutter) minmax(0,1fr)}
.pair > svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.card{position:relative;border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);background:var(--surface-pane);padding:var(--space-3) var(--space-4) var(--space-2)}
.card.then{opacity:var(--x-card-past,1)}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:var(--space-2);border-bottom:1px solid var(--hairline)}
.card .ch b{font:300 var(--type-lead)/var(--leading-lead) var(--font-sans);color:var(--light)}
.card .gapnote{margin:var(--space-2) 0 0;padding:var(--space-1) var(--space-2);font-size:var(--type-small);line-height:var(--leading-small);background:var(--x-stale);border-radius:var(--radius-key);color:var(--ink)}
.fld{display:grid;grid-template-columns:calc(var(--space-8) - var(--space-3)) minmax(0,1fr);gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--hairline);font-size:var(--type-meta);line-height:var(--leading-meta)}
.fld:last-child{border-bottom:0}
.fld > span:first-child{color:var(--ink-muted);font-size:var(--type-small)}
.fld .m{display:block;font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.fld .big{font:400 var(--type-lead)/1 var(--font-mono);color:var(--light)}
.tok{border-radius:var(--radius-key);padding:0 calc(var(--space-1) / 2);box-shadow:inset 0 -1px 0 var(--x-link-edge)}
.tok.carried{background:var(--x-link-fill)}
.fld.waiting{box-shadow:inset 2px 0 0 var(--green);padding-left:var(--space-2);margin-left:calc(var(--space-2) * -1)}
.chip{position:absolute;transform:translate(-50%,-50%);font:400 var(--x-type-micro)/1 var(--font-mono);color:var(--ink);background:var(--slate-deep);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-2);white-space:nowrap}
.chip.same{color:var(--ink-muted);border-style:dashed}
.between{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
.between .b{display:inline-flex;align-items:center;gap:var(--space-2);height:calc(var(--space-5) - var(--space-1));padding:0 var(--space-2);border:1px solid var(--hairline);border-radius:var(--radius-key);color:var(--ink)}
.between .b svg{width:var(--space-3);height:var(--space-3);overflow:visible}
.between .b.gap{background:var(--x-stale)}
.lnk{transition:opacity var(--motion-calm) var(--ease-out)}
.pre .lnk{opacity:0}

@media (max-height:840px){
  .cmp{gap:var(--space-2)}
  .strip{height:calc(var(--space-7) - var(--space-1))}
  .strip svg{top:var(--space-4);height:var(--space-5)}
  .fld{padding:calc(var(--space-1) + 1px) 0;line-height:var(--leading-small)}
  .card{padding:var(--space-2) var(--space-4) var(--space-1)}
  .card .ch{padding-bottom:var(--space-1)}
  .fld .big{font-size:var(--type-body)}
}
/* why-pane for marks outside the answer (record-gap tag, disabled buttons) */
.tip{position:fixed;z-index:var(--layer-overlay);width:var(--measure-card);padding:var(--space-3) var(--space-4);background:var(--surface-overlay);-webkit-backdrop-filter:blur(var(--surface-blur));backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);border-radius:var(--radius-inset);box-shadow:var(--shadow-overlay);opacity:0;pointer-events:none;transition:opacity var(--motion-base) var(--ease-out)}
.tip.on{opacity:1}
.tip .t{margin:var(--space-1) 0;color:var(--light);font-size:var(--type-body);line-height:var(--leading-body)}
.tip p{margin:0 0 var(--space-1);font-size:var(--type-meta);line-height:var(--leading-meta)}
.tip p.m{color:var(--ink-muted)}

/* reduced motion: crossfades only, rack focus as dim without blur */
@media (prefers-reduced-motion: reduce){
  .why{transition:none!important}
  .view,.dep,.lnk,.tip{transition:opacity var(--motion-base) linear!important}
  .hnd{transition:none!important}
  .tbl.asking .row:not(.open){filter:brightness(var(--x-near-dim))}
}
</style>

<div class="x-cap"><b>Combined · V3</b> fact in place · provenance V5 ask in place, V2 history flow, V3 parallel record</div>
<script>
/* ======================================================================
   Sample data: every name, label, count and date on this page comes from here.
   In AUGUR it comes from Data Atlas (facts, triage), the entity schema
   (refresh rules, kinds) and the events service (record gaps).
   ====================================================================== */
const DATA = {
  now: '2026-11-02', start: '2023-03-01', futureDays: 183,
  app: 'Data Atlas',
  nav: [ { label: 'Entities', icon: 'boxes', n: 1284 }, { label: 'Suppliers', icon: 'truck', n: 212, on: true }, { label: 'Triage', icon: 'inbox', n: 7 }, { label: 'Disputes', icon: 'git-fork', n: 1 }, { label: 'Sources', icon: 'database', n: 14 } ],
  viewer: { name: 'Harry Burton', teams: ['Supplier data'], lastVisit: '2024-12-02' },
  entity: { type: 'Supplier', name: 'Kestrel Logistics', owner: 'Supplier data' },
  labels: {
    modes: { facts: 'Facts', history: 'History', compare: 'Compare' },
    cols: ['Fact', 'Value', 'Strata', 'Verified', 'Source'],
    scale: 'since {start} · past √ compressed · next 6 months linear',
    wear: 'uses this quarter, counted, never named',
    lastVisit: 'your last visit',
    proposeAnyone: 'Anyone with access can propose a value; it waits in triage until a steward decides.'
  },
  /* record continuity: the events service declares its own gaps. One gap, every fact. */
  recordGaps: [ { from: '2026-08-31', to: '2026-09-13', by: 'Events service',
    why: 'The events store moved to a new disk. Events from these two weeks were not carried over.',
    who: 'Nobody can restore them. Values held on either side are known; any change inside is not.' } ],
  sources: {
    register: { label: 'Companies register', floor: 'org' },
    report: { label: 'Annual report', floor: 'department' },
    questionnaire: { label: 'Supplier questionnaire', floor: 'team' },
    payroll: { label: 'Payroll extract', floor: 'department' },
    contract: { label: 'Contract system', floor: 'team' },
    risk: { label: 'Risk review', floor: 'department' },
    hand: { label: 'Entered by hand', floor: 'you' },
    web: { label: 'Web profile crawl', floor: null }
  },
  /* kinds: value (a stratum), rejected (a spur), dispute (a fault), silent (the source said nothing: stale),

/* TimeScale (grammar V2, "one scale"): the past compressed by the square root of age over the

function derive(f) {

    const w = r.kind === 'value' ? `<b>${esc(r.value)}</b> accepted · ${esc(src.label)} · ${esc(r.by)}${r.seam ? ' · <b>seam</b>: settled the dispute' : ''}${r.inferred ? ' · first seen after the gap' : ''}`

      ${gapLine}
      <p class="m">${f.uses} ${esc(DATA.labels.wear)}.</p>
      ${d.pending ? (canDecide ? `<button class="btn go"><span class="beacon"></span>Review proposal: ${esc(d.pending.value)}</button>` : `<button class="btn" aria-disabled="true" data-tip="decide">Review proposal: ${esc(d.pending.value)}</button>`) : ''}<button class="btn"><i data-lucide="refresh-cw" data-size="14"></i>Refresh from source</button><button class="btn" data-cmp="${i}"><i data-lucide="git-compare" data-size="14"></i>Compare with ${esc(DATA.labels.lastVisit)} <span class="kbd">C</span></button>
    </div>
    <div><div class="eyebrow">The record · newest first</div><ol class="rec">${recordList(f)}</ol></div>`;
}

/* ====================================================================== render: facts and history */
let mode = 'facts', open = -1, cur = 0;
function render() {
  const L = DATA.labels, hist = mode === 'history';
  $('#tbl').classList.toggle('hist', hist);
  $('#th').innerHTML = `<span></span><span>${esc(L.cols[0])}</span><span>${esc(L.cols[1])}</span><span class="axis" id="axis">${hist ? '' : `<span class="l" style="left:0">${esc(L.cols[2])}</span>`}</span><span class="ver">${esc(L.cols[3])}</span><span class="src">${esc(L.cols[4])}</span>`;
  const mx = Math.max(...DATA.facts.map(f => f.uses));
  $('#rows').innerHTML = DATA.facts.map((f, i) => {
    const d = derive(f), marks = Math.max(1, Math.round(f.uses / mx * 8));
    return `<div class="row" role="row" data-i="${i}">
      <button class="tr" aria-expanded="false" aria-label="${esc(f.attr)}: ${esc(d.cur.value)}${esc(unit(f))}. ${d.stale ? 'Stale. ' : ''}${d.pending ? 'A proposal is waiting. ' : ''}Ask why, and since when.">
        <span class="wear" title="${f.uses} ${esc(L.wear)}" style="opacity:${(.35 + .65 * f.uses / mx).toFixed(2)}">${'<i></i>'.repeat(marks)}</span>
        <span class="a">${esc(f.attr)}</span>
        <span class="v"><b>${esc(d.cur.value)}</b>${f.unit ? `<small>${esc(f.unit)}</small>` : ''}${d.pending && canDecide ? '<span class="beacon" title="A proposal is waiting for you" style="align-self:center;margin-left:var(--space-2)"></span>' : ''}</span>
        <span class="fl"><svg data-i="${i}" aria-hidden="true"></svg></span>
        <span class="age">${d.stale ? `<span class="stale">${d.openSilent ? 'silent ' : 'stale '}${ageS(days(d.staleFrom, DATA.now))}</span>` : ageS(days(d.cur.from, DATA.now)) + ' ago'}</span>
        <span class="src">${esc(DATA.sources[d.cur.source].label)} · ${esc(d.cur.by)}</span>
      </button>
      <div class="why" role="region" aria-label="Why ${esc(f.attr)}"><div><div class="ans"></div></div></div>
    </div>`;
  }).join('') + `<div class="over gap" id="ogap"><span class="tag micro" data-tip="gap" tabindex="0">no record</span></div><div class="over now" id="onow"><span class="tag micro" style="color:var(--light)">now · ${fmtD(DATA.now)}</span></div>`;
  $$('.tr').forEach((b, i) => { b.onclick = () => toggle(i); b.onfocus = () => { cur = i; }; });
  draw();
}
function draw() {
  const hist = mode === 'history', svgs = $$('.fl svg');
  if (!svgs.length) return;
  const box = svgs[0].parentElement, w = box.clientWidth, h = box.clientHeight;
  svgs.forEach(s => { s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.innerHTML = flow(DATA.facts[+s.dataset.i], w, h, hist); });
  const x = TimeScale(w), off = box.getBoundingClientRect().left - $('#tbl').getBoundingClientRect().left;
  const top = $('#rows').offsetTop, g = DATA.recordGaps[0];
  const on = $('#onow'), og = $('#ogap');
  on.style.left = (off + x.now) + 'px'; on.style.top = top + 'px';
  og.style.left = (off + x(g.from)) + 'px'; og.style.width = Math.max(2, x(g.to) - x(g.from)) + 'px'; og.style.top = top + 'px';
  if (hist) {
    const ys = []; for (let y = D(DATA.start).getUTCFullYear() + 1; y <= D(DATA.now).getUTCFullYear(); y++) ys.push(y);
    $('#axis').innerHTML = `<span class="l" style="left:0">${fmtS(DATA.start)}</span>` + ys.filter(y => x(y + '-01-01') > 72).map(y => `<span style="left:${x(y + '-01-01')}px">${y}</span>`).join('');
  }
}
function toggle(i, force) {
  const rows = $$('.row'), willOpen = force !== undefined ? force : open !== i;
  rows.forEach(r => { r.classList.remove('open'); r.querySelector('.tr').setAttribute('aria-expanded', 'false'); });
  $('#tbl').classList.remove('asking'); open = -1;
  if (!willOpen) return;
  open = i; cur = i;
  const r = rows[i], a = r.querySelector('.ans');
  a.innerHTML = answer(DATA.facts[i], i); Icons.hydrate(a);
  a.querySelector('[data-cmp]').onclick = () => setMode('compare');
  r.classList.add('open'); r.querySelector('.tr').setAttribute('aria-expanded', 'true');
  $('#tbl').classList.add('asking');
}

/* ====================================================================== compare: the parallel record */
let thenD = DATA.viewer.lastVisit, nowD = DATA.now;
function stateAt(f, t) {
  const rec = f.record.filter(r => D(r.from || r.at) <= D(t));
  const vals = rec.filter(r => r.kind === 'value'), c = vals[vals.length - 1];
  if (!c) return null;
  const silent = rec.find(r => r.kind === 'silent' && (!r.to || D(r.to) > D(t)));
  const due = addMonths(c.from, f.refreshMonths), stale = silent || D(t) >= D(due);
  const rej = rec.filter(r => r.kind === 'rejected'), disp = rec.filter(r => r.kind === 'dispute' && D(r.to) <= D(t));
  const openDisp = rec.find(r => r.kind === 'dispute' && D(r.to) > D(t));
  const pend = rec.find(r => r.kind === 'pending');
  return { c, src: DATA.sources[c.source], stale, silent, due, rej, disp, openDisp, pend, gap: inGap(t) };
}
const T = (id, txt, cls = '') => `<span class="tok ${cls}" data-id="${esc(id)}">${esc(txt)}</span>`;
function card(f, t, side) {
  const s = stateAt(f, t);
  if (!s) return `<div class="card ${side}"><div class="ch"><span class="micro">${side}</span><b>${fmt(t)}</b></div><p class="m">No record of this fact yet.</p></div>`;
  const last = t === DATA.viewer.lastVisit ? ` · ${esc(DATA.labels.lastVisit)}` : '';
  const fields = [
    ['value', 'Value', `<span class="big">${T('v:' + s.c.value, s.c.value)}</span><span class="m">${esc(f.unit)}</span>`, String(s.c.value)],
    ['source', 'Source', `${T('src:' + s.c.source, s.src.label)}<span class="m">${esc(s.c.note)}</span>`, s.c.source],
    ['by', 'Accepted by', `${T('p:' + s.c.by, s.c.by)}<span class="m">${fmt(s.c.from)}</span>`, s.c.by],
    ['verified', 'Verified', s.stale ? `<span class="stale">${s.silent ? 'Source silent' : 'Stale'}</span><span class="m">${s.silent ? esc(s.silent.reason) : 'Fell due ' + fmt(s.due)}</span>` : `Current<span class="m">Next check ${fmt(s.due)}</span>`, s.stale ? 'stale' : 'current'],
    ['triage', 'Triage history', `${s.rej.length ? s.rej.map(r => T('rej:' + r.value, 'rejected ' + r.value)).join(' ') : 'none rejected'} · ${s.disp.length ? s.disp.length + ' dispute settled' : s.openDisp ? 'in dispute' : 'no disputes'}<span class="m">${s.rej.length ? 'by ' + [...new Set(s.rej.map(r => r.by))].join(', ') : ''}</span>`, s.rej.length + '/' + s.disp.length],
    ['steward', 'Steward', `${T('team:' + DATA.entity.owner, DATA.entity.owner + ' team')}<span class="m">can refresh and decide</span>`, DATA.entity.owner],
    ['rule', 'Refresh rule', `${T('rule:' + f.refreshMonths, 'every ' + f.refreshMonths + ' months')}<span class="m">highest-trust source wins</span>`, f.refreshMonths],
    ['waiting', 'In triage', s.pend ? `<span style="color:var(--green)">${esc(s.pend.value)}</span> from ${T('src:' + s.pend.source, DATA.sources[s.pend.source].label)}<span class="m">waiting ${days(s.pend.at, t)} days${canDecide && t === DATA.now ? ' · you can decide' : ''}</span>` : 'nothing waiting', s.pend ? 'p' + s.pend.value : '']
  ];
  return { html: `<div class="card ${side}" data-side="${side}"><div class="ch"><span class="micro">${side === 'then' ? 'Then' : t === DATA.now ? 'Now' : 'Later'}${last}</span><b>${fmt(t)}</b></div>
    ${s.gap ? `<p class="gapnote">No record on this day (${fmtD(s.gap.from)} to ${fmtD(s.gap.to)}, ${esc(s.gap.by.toLowerCase())}). Shown: the last state the record holds.</p>` : ''}
    ${fields.map(([k, l, v]) => `<div class="fld ${k === 'waiting' && s.pend ? 'waiting' : ''}" data-f="${k}"><span>${esc(l)}</span><span>${v}</span></div>`).join('')}</div>`, keys: Object.fromEntries(fields.map(z => [z[0], z[3]])), s };
}
function moments(f) {
  const m = new Set([DATA.viewer.lastVisit, DATA.now]);
  f.record.forEach(r => m.add(r.from || r.at)); DATA.recordGaps.forEach(g => m.add(addDays(g.from, 3)));
  return [...m].filter(t => D(t) >= D(f.record[0].from) && D(t) <= D(DATA.now)).sort((a, b) => D(a) - D(b));
}
function renderCompare(animate) {
  const f = DATA.facts[cur], A = card(f, thenD, 'then'), B = card(f, nowD, 'now');
  const between = [];
  f.record.forEach(r => { const t = r.from || r.at; if (D(t) > D(thenD) && D(t) <= D(nowD)) between.push({ t, r }); });
  DATA.recordGaps.forEach(g => { if (D(g.to) > D(thenD) && D(g.from) <= D(nowD)) between.push({ t: g.from, r: { kind: 'gap', ...g } }); });
  between.sort((a, b) => D(a.t) - D(b.t));
  const chips = between.map(({ r }) => { const src = r.source ? DATA.sources[r.source] : null;
    const mk = r.kind === 'value' ? (r.seam ? MARK.seam(src.floor) : MARK.value(src.floor)) : MARK[r.kind]();
    const w = r.kind === 'value' ? `accepted ${esc(r.value)}` : r.kind === 'rejected' ? `rejected ${esc(r.value)}` : r.kind === 'dispute' ? `dispute ${r.sides.map(s => s.value).join('/')}` : r.kind === 'silent' ? 'source silent' : r.kind === 'gap' ? `no record ${fmtD(r.from)}–${fmtD(r.to)}` : `proposed ${esc(r.value)}`;
    return `<span class="b ${r.kind === 'gap' ? 'gap' : ''}">${mk}${w}</span>`; }).join('');
  $('#cmp').innerHTML = `
    <div class="strip" id="strip"><svg id="ssvg" aria-hidden="true"></svg>
      <div class="hnd" id="hThen"><span class="micro">Then · ${fmt(thenD)}${thenD === DATA.viewer.lastVisit ? ' · ' + esc(DATA.labels.lastVisit) : ''}</span></div>
      <div class="hnd now" id="hNow"><span class="micro">${nowD === DATA.now ? 'Now' : 'Later'} · ${fmt(nowD)}</span></div></div>
    <div class="pair ${animate ? 'pre' : ''}" id="pair">${A.html}<div class="gut" aria-hidden="true"></div>${B.html}<svg id="links" aria-hidden="true"></svg></div>
    <div class="between"><span>${esc(f.attr)}: ${between.length} things happened between them</span>${chips}</div>`;
  const ss = $('#ssvg'), w = ss.clientWidth, h = ss.clientHeight;
  ss.setAttribute('viewBox', `0 0 ${w} ${h}`); ss.innerHTML = flow(f, w, h, false).replace(/<line x1="[\d.]+" x2="[\d.]+" y1="0"[^>]*x-now[^>]*\/>/, '');
  DATA.recordGaps.forEach(g => { const x = TimeScale(w); ss.innerHTML += `<text class="lbl" x="${(x(g.from) + x(g.to)) / 2}" y="-6" text-anchor="middle">no record</text>`; });
  const x = TimeScale(w), pad = css('--space-4');
  $('#hThen').style.left = (pad + x(thenD)) + 'px'; $('#hNow').style.left = (pad + x(nowD)) + 'px';
  const yr = []; for (let y = D(DATA.start).getUTCFullYear() + 1; y <= D(DATA.now).getUTCFullYear(); y++) yr.push(y);
  ss.innerHTML += yr.map(y => `<text class="lbl" x="${x(y + '-01-01')}" y="${h + 14}" text-anchor="middle">${y}</text>`).join('');
  links(A, B);
  $('.card.then').style.setProperty('--x-card-past', pastOp(thenD));
  if (animate) setTimeout(() => $('#pair')?.classList.remove('pre'), RM ? 0 : ms('--motion-base'));
}
/* carry-over links: a ribbon joins content that carried over, by id, wherever it now sits.
   Ribbons live in the gutter only, so they never cross the labels. Changed fields get a dashed thread. */
function links(A, B) {
  const pair = $('#pair'), P = pair.getBoundingClientRect(), svg = $('#links');
  const L = $('.card.then', pair).getBoundingClientRect(), R = $('.card.now', pair).getBoundingClientRect();
  const lx = L.right - P.left, rx = R.left - P.left, mx = (lx + rx) / 2;
  let s = '', chips = '';
  const rowY = (side, k) => { const e = $(`.card.${side} [data-f="${k}"]`, pair); if (!e) return null; const r = e.getBoundingClientRect(); return (r.top + r.bottom) / 2 - P.top; };
  Object.keys(A.keys).forEach(k => {
    const ya = rowY('then', k), yb = rowY('now', k); if (ya == null || yb == null) return;
    if (String(A.keys[k]) !== String(B.keys[k])) {
      s += `<path class="lnk" d="M${lx},${ya} L${rx},${yb}" style="fill:none;stroke:var(--hairline-strong);stroke-dasharray:3 3"/>`;
      const dv = k === 'value' && !isNaN(A.keys[k]) && !isNaN(B.keys[k]) ? ((B.keys[k] - A.keys[k] > 0 ? '+' : '') + (Math.round((B.keys[k] - A.keys[k]) * 10) / 10)) : 'changed';
      chips += `<span class="chip lnk" style="left:${mx}px;top:${(ya + yb) / 2}px">${dv}</span>`;
    }
  });
  /* ribbons: same id on both sides */
  const toks = side => $$(`.card.${side} .tok`, pair).map(e => ({ id: e.dataset.id, e, r: e.getBoundingClientRect() }));
  const a = toks('then'), b = toks('now'); let carried = 0;
  a.forEach(t => b.filter(u => u.id === t.id).forEach(u => {
    carried++; t.e.classList.add('carried'); u.e.classList.add('carried');
    const y0 = t.r.top - P.top, y1 = t.r.bottom - P.top, z0 = u.r.top - P.top, z1 = u.r.bottom - P.top;
    s += `<path class="lnk" d="M${lx},${y0} C${mx},${y0} ${mx},${z0} ${rx},${z0} L${rx},${z1} C${mx},${z1} ${mx},${y1} ${lx},${y1} Z" style="fill:var(--x-link-fill);stroke:var(--x-link-edge);stroke-width:.75"/>`;
  }));
  svg.innerHTML = s;
  pair.querySelectorAll('.chip').forEach(c => c.remove());
  pair.insertAdjacentHTML('beforeend', chips);
}

/* ====================================================================== modes, tips, keys */
function setMode(m, quiet) {
  if (mode === m && !quiet) return;
  const was = mode; mode = m;
  $$('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  const fv = $('#vFacts'), cv = $('#vCompare');
  if (m === 'compare') { fv.hidden = true; cv.hidden = false; thenD = DATA.viewer.lastVisit; nowD = DATA.now; renderCompare(true); }
  else { cv.hidden = true; fv.hidden = false; if (was !== m || quiet) { render(); open = -1; } $$('.tr')[cur]?.focus({ preventScroll: true }); }
  $('#esub').innerHTML = sub();
  keys();
}
function sub() {
  const f = DATA.facts[cur];
  return mode === 'compare' ? `<b>${esc(f.attr)}</b> · the record then, beside the record now · ribbons join what carried over`
    : `${DATA.facts.length} facts · owned by the <b>${esc(DATA.entity.owner)}</b> team · ${mode === 'history' ? 'every fact on one time axis, ' + esc(DATA.labels.scale.replace('{start}', fmtS(DATA.start))) : 'each value carries its strata · margin marks show use, not users'}`;
}
function keys() {
  const k = mode === 'compare' ? [['← →', 'move then'], ['⇧ ← →', 'move now'], ['↑ ↓', 'fact'], ['1 2 3', 'view'], ['R', 'replay']]
    : [['↑ ↓', 'fact'], ['? or Enter', 'why, since when'], ['Esc', 'close'], ['1 2 3', 'view'], ['C', 'compare'], ['R', 'replay']];
  $('#keys').innerHTML = k.map(([a, b]) => `<span>${a.split(' ').map(x => x === 'or' ? 'or' : `<span class="kbd">${x}</span>`).join(' ')} ${b}</span>`).join('');
}
const TIPS = {
  gap: () => { const g = DATA.recordGaps[0]; return `<div class="micro">Unconformity · declared by the ${esc(g.by.toLowerCase())}</div><div class="t">No record, ${fmtD(g.from)} to ${fmtD(g.to)}</div><p>${esc(g.why)}</p><p class="m">${esc(g.who)}</p>`; },
  decide: () => `<div class="micro">Unavailable</div><div class="t">Only stewards decide</div><p>The ${esc(DATA.entity.owner)} team decides proposals for this entity. Ask them, or propose your own value.</p>`
};
function tip(el) { const p = $('#tip'), k = el.dataset.tip; if (!TIPS[k]) return; p.innerHTML = TIPS[k](); const r = el.getBoundingClientRect(), g = css('--space-3');
  p.style.left = Math.max(g, Math.min(innerWidth - p.offsetWidth - g, r.left + r.width / 2 - p.offsetWidth / 2)) + 'px'; p.style.top = (r.bottom + g) + 'px'; p.classList.add('on'); }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) tip(el); });
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) $('#tip').classList.remove('on'); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) tip(el); else $('#tip').classList.remove('on'); });

let timers = [];
function demo() {
  timers.forEach(clearTimeout); timers = [];
  const start = (location.hash || '#facts').slice(1);
  open = -1; cur = DATA.demo.fact; mode = '';
  setMode(['facts', 'history', 'compare'].includes(start) ? start : 'facts', true);
  if (mode === 'facts') timers.push(setTimeout(() => { toggle(DATA.demo.fact, true); $$('.tr')[DATA.demo.fact].focus({ preventScroll: true }); }, ms('--motion-run')));
  if (mode === 'history') { $('#rows').style.opacity = 0; timers.push(setTimeout(() => { $('#rows').style.transition = `opacity var(--motion-calm) var(--ease-out)`; $('#rows').style.opacity = 1; }, ms('--motion-run'))); }
}
addEventListener('keydown', e => {
  const trs = $$('.tr');
  if (e.key === 'r' || e.key === 'R') return demo();
  if (e.key === '1') return setMode('facts');
  if (e.key === '2' || e.key === 'h' || e.key === 'H') return setMode('history');
  if (e.key === '3' || e.key === 'c' || e.key === 'C') return setMode('compare');
  if (mode === 'compare') {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); const m = moments(DATA.facts[cur]), dir = e.key === 'ArrowRight' ? 1 : -1;
      if (e.shiftKey) { const i = m.indexOf(nowD) >= 0 ? m.indexOf(nowD) : m.length - 1; const n = m[Math.max(0, Math.min(m.length - 1, i + dir))]; if (D(n) > D(thenD)) nowD = n; }
      else { const i = m.findIndex(t => t === thenD); const n = m[Math.max(0, Math.min(m.length - 1, (i < 0 ? m.findIndex(t => D(t) > D(thenD)) - (dir > 0 ? 1 : 0) : i) + dir))]; if (D(n) < D(nowD)) thenD = n; }
      renderCompare(false); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cur = Math.max(0, Math.min(DATA.facts.length - 1, cur + (e.key === 'ArrowDown' ? 1 : -1))); renderCompare(true); $('#esub').innerHTML = sub(); }
    if (e.key === 'Escape') setMode('facts');
    return;
  }
  if (e.key === 'Escape') { toggle(open, false); trs[cur]?.focus(); }
  else if (e.key === '?') toggle(cur, true);
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cur = Math.max(0, Math.min(trs.length - 1, cur + (e.key === 'ArrowDown' ? 1 : -1))); trs[cur].focus(); if (open >= 0) toggle(cur, true); $('#esub').innerHTML = sub(); }
});

/* ====================================================================== boot */
$('#appname').textContent = DATA.app;
$('#navs').innerHTML = DATA.nav.map(n => `<a class="nav${n.on ? ' on' : ''}" href="#"><i data-lucide="${n.icon}" data-size="16"></i>${esc(n.label)}<span class="n">${n.n}</span></a>`).join('');
$('#railfoot').innerHTML = `Record continuity: the <b>${esc(DATA.recordGaps[0].by.toLowerCase())}</b> declares ${DATA.recordGaps.length} gap${DATA.recordGaps.length > 1 ? 's' : ''} in this deployment's record.`;
$('#crumb').textContent = DATA.app + ' · ' + DATA.entity.type;
$('#ename').textContent = DATA.entity.name;
const ICON = { facts: 'table-2', history: 'chart-gantt', compare: 'columns-2' };
$('#seg').innerHTML = Object.entries(DATA.labels.modes).map(([k, l], i) => `<button data-m="${k}" aria-pressed="false"><i data-lucide="${ICON[k]}" data-size="14"></i>${esc(l)}<span class="kbd">${i + 1}</span></button>`).join('');
$$('#seg button').forEach(b => b.onclick = () => setMode(b.dataset.m));
Icons.hydrate();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (mode === 'compare') renderCompare(false); else { const o = open; render(); if (o >= 0) toggle(o, true); } }, 100); });
addEventListener('hashchange', demo);
document.fonts.ready.then(demo);
</script>
</body>
