    tide: `<line x1="12" x2="12" y1="0" y2="12" style="stroke:var(--x-tide);stroke-dasharray:1 2"/>`, seam: `<line x1="10.5" x2="10.5" y1="1" y2="11" style="stroke:var(--x-seam)"/><line x1="13.5" x2="13.5" y1="1" y2="11" style="stroke:var(--x-seam)"/>`,
    scar: `<line x1="12" x2="12" y1="0" y2="12" style="stroke:var(--x-scar);stroke-width:3"/>`, gap: `<rect x="4" y="0" width="16" height="12" fill="url(#hatch)" style="stroke:var(--ink-muted);stroke-dasharray:2 2"/>`,
    window: `<rect x="10" y="0" width="4" height="12" style="fill:color-mix(in srgb,var(--green) 22%,transparent)"/>`, effort: `<rect x="0" y="3" width="24" height="9" fill="url(#wg)"/>` };
  const k = [['water', 'past, under water'], ['travel', 'distance to travel'], ['effort', 'effort'], ['tide', 'tide line · missed'], ['seam', 'seam · moved, with reason'], ['scar', 'scar · rollback'], ['gap', 'no record'], ['window', 'window ahead']];
  $('#key').innerHTML = k.map(([id, t]) => `<span><svg aria-hidden="true">${defs}${g[id]}</svg>${t}</span>`).join('');
}

/* ====================================================================== the gauge panel */
function select(id, focusPanel) {
  sel = id; $('#panel').classList.remove('forming'); $$('.row').forEach(r => r.classList.toggle('sel', r.dataset.id === id));
  const r = ROWS.find(z => z.id === id); if (!r) return;
  const build = (W, H) => r.kind === 'intent' ? (r.i.shadow ? shadowPanel(r.i) : staff(r.i, W, H)) : pier(r.p, W, H);
  $('#panel').innerHTML = build();
  const g = $('#panel .gauge'); if (g) $('#panel').innerHTML = build(g.clientWidth, g.clientHeight);
  Icons.hydrate($('#panel'));
  const mv = $('#move'); if (mv) mv.onclick = () => openForm(r.i);
  if (focusPanel) $('#panel').querySelector('button,[tabindex]')?.focus();
}
function shadowPanel(i) { return `<div class="micro">Unavailable</div><h2>${esc(i.name)}</h2><p>${esc(i.shadow.why)}</p><p>Due <b>${fmt(due(i))}</b>, ${plural(left(i), 'day')} to travel. Ask <b>${esc(i.shadow.who)}</b> for access.</p>`; }
/* staff gauge (intents V2): time rises; the past is under water; the dry staff above is the distance to travel;
   each extension is a seam where a new section was bolted on, and its old top stays as a tide line */
function staff(i, W = 300, H = 400) {
  const asked = i.asked, top = due(i), first = i.deadlines[0].date, longer = days(first, top), l = left(i);
  const y = s => 10 + (1 - (D(s) - D(asked)) / (Math.max(D(top), D(DATA.now)) - D(asked))) * (H - 20);
  const sx = Math.round(W * .38), sw = 26;
  let s = `<rect x="${sx}" y="${y(top)}" width="${sw}" height="${y(asked) - y(top)}" style="fill:var(--slate-deep);stroke:var(--hairline-strong)"/>`;
  /* graduations: one a week, E-pattern every other */
  const busy = [...i.deadlines.map(k => y(k.date)), y(DATA.now)];
  for (let t = D(asked); t <= Math.max(D(top), D(DATA.now)); t += 7 * DAY) { const yy = y(iso(t)), k = Math.round((t - D(asked)) / (7 * DAY)); s += `<line x1="${sx}" x2="${sx + (k % 2 ? 8 : 14)}" y1="${yy}" y2="${yy}" style="stroke:var(--ink-muted)"/>`; if (k % 2 === 0 && busy.every(b => Math.abs(b - yy) > 14)) s += `<text class="lbl" x="${sx - 8}" y="${yy + 4}" text-anchor="end" style="opacity:.7">${fmt(iso(t))}</text>`; }
  /* water: everything up to now */
  const ny = Math.max(y(top), y(DATA.now));
  s += `<rect x="${sx - 8}" y="${ny}" width="${W - sx + 8}" height="${y(asked) - ny}" style="fill:var(--x-water-deep)"/><line x1="${sx - 8}" x2="${W}" y1="${ny}" y2="${ny}" style="stroke:var(--x-now);stroke-width:1.5"/>`;
  s += `<text class="lbl v" x="${W - 2}" y="${ny - 6}" text-anchor="end" style="fill:var(--light)">NOW · ${fmt(DATA.now)}</text>`;
  /* the record gap on the staff */
  const g = DATA.recordGaps[0]; if (D(g.to) > D(asked)) s += `<rect x="${sx}" y="${y(g.to)}" width="${sw}" height="${y(g.from) - y(g.to)}" fill="url(#hatch)"/>`;
  /* tide lines and seams */
  i.deadlines.forEach((k, n) => { const yy = y(k.date), lastOne = n === i.deadlines.length - 1, missed = !lastOne && D(i.deadlines[n + 1].set) >= D(k.date);
    if (!lastOne) s += mark(why({ k: missed ? 'Tide line' : 'Old deadline', t: `Due ${fmt(k.date)}; ${missed ? 'missed' : 'moved before it fell due'}`, b: `Moved on ${fmt(i.deadlines[n + 1].set)}.`, since: fmt(k.date), who: 'Nobody: a missed date stays.' }), sx + sw / 2, yy - 6, yy + 6,
      `<line x1="${sx - 4}" x2="${sx + sw + 50}" y1="${yy}" y2="${yy}" style="stroke:${missed ? 'var(--x-tide)' : 'var(--hairline-strong)'};stroke-dasharray:2 3"/>`, `${missed ? 'Tide line' : 'Old deadline'} ${fmt(k.date)}`);
    s += `<text class="lbl" x="${sx - 8}" y="${yy + 4}" text-anchor="end" style="${lastOne ? 'fill:var(--ink)' : ''}">${fmt(k.date)}${lastOne ? ' due' : missed ? ' missed' : ' moved'}</text>`;
    if (n > 0) { const prev = y(i.deadlines[n - 1].date), legacy = !k.reason;
      s += mark(why({ k: legacy ? 'Seam · no reason recorded' : 'Seam · staff extended', t: `${fmt(i.deadlines[n - 1].date)} → ${fmt(k.date)}`, b: k.reason ? esc(k.reason) : 'Moved before reasons were required.', since: `${fmt(k.set)} · ${who(k.by)}`, who: `${who(i.asker)} (the asker) agrees a move.` }), sx + sw / 2, prev - 6, prev + 6,
        `<line x1="${sx - 3}" x2="${sx + sw + 3}" y1="${prev - 1.5}" y2="${prev - 1.5}" style="stroke:var(--x-seam)"/><line x1="${sx - 3}" x2="${sx + sw + 3}" y1="${prev + 1.5}" y2="${prev + 1.5}" style="stroke:var(--x-seam)"/>`, `Seam: extended on ${fmt(k.set)}`); } });
  /* the cap: the deadline now */
  s += `<rect x="${sx - 6}" y="${y(top) - 4}" width="${sw + 12}" height="4" style="fill:var(--ink)"/>`;
  /* effort flows on the downstream side, its widest week carries the high-water plate */
  const ef = i.effort || [], m = Math.max(1, ...ef.filter(v => v != null)), hi = ef.indexOf(m);
  ef.forEach((v, k) => { if (v == null) return; const t0 = iso(D(asked) + k * 7 * DAY), t1 = iso(Math.min(D(asked) + (k + 1) * 7 * DAY, D(DATA.now)));
    if (D(t0) > D(DATA.now)) return; s += `<rect x="${sx + sw}" y="${y(t1)}" width="${v / m * 56}" height="${Math.max(1, y(t0) - y(t1) - 1)}" style="fill:color-mix(in srgb,var(--green) 26%,transparent)"/>`; });
  if (hi >= 0) { const hy = y(iso(D(asked) + hi * 7 * DAY + 3.5 * DAY)); s += `<path d="M${sx + sw + 60},${hy} l6,-4 l0,8 Z" style="fill:var(--ink)"/><text class="lbl" x="${sx + sw + 70}" y="${hy + 12}">high</text><text class="lbl" x="${sx + sw + 70}" y="${hy + 24}">water ${m}</text>`; }
  const reasons = i.deadlines.slice(1).map(k => `<b>${fmt(k.set)}</b> · ${k.reason ? esc(k.reason) : '<i>no reason recorded</i>'}`).join('<br>');
  return `<div class="micro">${esc(DATA.mandate.app)} · selected intent</div><h2>${esc(i.name)}</h2>
    <div class="big"><b>${Math.abs(l)}</b><span>${l >= 0 ? 'days to travel' : 'days past its deadline'} · to ${fmt(top)}</span></div>
    <p>Asked by ${who(i.asker)} on ${fmt(asked)}. Staff extended <b>${i.deadlines.length - 1}×</b>, <b>${plural(longer, 'day')}</b> longer than asked.${i.work ? ` Work left: <b>${i.work.of - i.work.done} of ${i.work.of}</b> criteria.` : ''}</p>
    <div class="gauge"><svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Staff gauge">${defs}${s}</svg></div>
    <p class="reasons" style="margin-top:var(--space-2)">${reasons}</p>
    <button class="btn" id="move"><i data-lucide="calendar-clock" data-size="14"></i>Move deadline <span class="kbd">M</span></button>
    <div class="form" id="form"></div>`;
}
function openForm(i) {
  const f = $('#form'), def = iso(D(due(i)) + 14 * DAY);
  f.innerHTML = `<label class="micro" for="nd">New deadline</label><input id="nd" type="date" value="${def}" min="${DATA.now}">
    <label class="micro" for="rs">Reason (required)</label><textarea id="rs" aria-describedby="need"></textarea>
    <p class="need" id="need">A reason is required: it becomes the seam’s label on every view of this intent, and ${who(i.asker)} (the asker) is asked to agree.</p>
    <button class="btn go" id="ok" aria-disabled="true">Move</button><button class="btn" id="cancel">Cancel</button>`;
  f.classList.add('on'); $('#panel').classList.add('forming'); $('#rs').focus();
  const ok = $('#ok'); $('#rs').oninput = () => ok.setAttribute('aria-disabled', $('#rs').value.trim().length < 8);
  ok.onclick = () => { if (ok.getAttribute('aria-disabled') === 'true') { $('#need').innerHTML = `<b>Add a reason first</b> (a sentence is enough). ${$('#need').innerHTML.replace(/^<b>.*?<\/b>\s*/, '')}`; $('#rs').focus(); return; }
    i.deadlines.push({ date: $('#nd').value, set: DATA.now, by: DATA.viewer.name, reason: $('#rs').value.trim() + ' (waiting for ' + i.asker + ')' });
    header(); render(); select(i.id); };
  $('#cancel').onclick = () => { f.classList.remove('on'); $('#panel').classList.remove('forming'); $('#move').focus(); };
}
/* pier (upgrades V3): each bake carved at its peak error rate; the forecast from Preview is a known tide ahead */
function pier(p, W = 300, H = 400) {
  const U = DATA.upgrades, P = U.pending, max = 3.5;
  const y = v => 20 + (1 - v / max) * (H - 60), sx = Math.round(W * .48), sw = 24;
  let s = `<rect x="${sx}" y="${y(max)}" width="${sw}" height="${y(0) - y(max)}" style="fill:var(--slate-deep);stroke:var(--hairline-strong)"/>`;
  for (let v = 0; v <= max; v += .5) s += `<line x1="${sx}" x2="${sx + (v % 1 ? 8 : 14)}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--ink-muted)"/>${v % 1 ? '' : `<text class="lbl" x="${sx + sw + 6}" y="${y(v) + 4}">${v}${U.limits.unit}</text>`}`;
  /* limits: watch and halt */
  s += `<line x1="${sx - 40}" x2="${sx + sw + 60}" y1="${y(U.limits.limit)}" y2="${y(U.limits.limit)}" style="stroke:var(--x-scar);stroke-dasharray:4 3"/><text class="lbl" x="${sx + sw + 64}" y="${y(U.limits.limit) + 4}" style="fill:var(--x-scar)">halts</text>`;
  s += `<line x1="${sx - 40}" x2="${sx + sw + 60}" y1="${y(U.limits.watch)}" y2="${y(U.limits.watch)}" style="stroke:var(--hairline-strong);stroke-dasharray:4 3"/><text class="lbl" x="${sx + sw + 64}" y="${y(U.limits.watch) + 4}">watch</text>`;
  /* past bakes: under water, carved at their peak */
  const past = U.releases.filter(r => r.peak != null), hw = past.reduce((a, b) => b.peak > a.peak ? b : a);
  past.forEach(r => { const yy = y(r.peak), isHw = r === hw;
    s += mark(why({ k: isHw ? 'High-water mark' : 'Bake peak', t: `${esc(r.v)} · ${r.peak}${U.limits.unit}`, b: esc(r.scar || r.seam || 'Applied in the window.'), since: fmt(r.at), who: `${U.approvers.map(who).join(' or ')} approve upgrades.` }), sx + sw / 2, yy - 5, yy + 5,
      `<line x1="${sx - (isHw ? 30 : 10)}" x2="${sx}" y1="${yy}" y2="${yy}" style="stroke:${r.scar ? 'var(--x-scar)' : 'var(--ink)'};stroke-width:${isHw ? 2 : 1};opacity:${isHw ? 1 : .55}"/>`, `${r.v} peaked at ${r.peak}`); });
  s += `<text class="lbl v" x="${sx - 36}" y="${y(hw.peak) - 2}" text-anchor="end">high water</text><text class="lbl" x="${sx - 36}" y="${y(hw.peak) + 10}" text-anchor="end">${hw.peak}${U.limits.unit} · ${esc(hw.v)}</text>`;
  const gap = U.releases.filter(r => r.peak == null).map(r => r.v).join(', ');
  /* forecast: Preview's bake of the pending release, dashed */
  const fy = y(P.previewPeak);
  s += mark(why({ k: 'Forecast · from Preview', t: `${esc(P.v)} peaked at ${P.previewPeak}${U.limits.unit} on Preview`, b: `Measured over ${P.previewDays} days on Preview deployments. A forecast, not a promise.`, since: fmt(iso(D(P.at) - (P.previewDays + 4) * DAY)), who: 'The release team publishes Preview bakes.' }), sx + sw / 2, fy - 6, fy + 6,
    `<line x1="${sx - 30}" x2="${sx + sw}" y1="${fy}" y2="${fy}" style="stroke:var(--green);stroke-width:2;stroke-dasharray:4 3"/>`, `Forecast ${P.previewPeak}`);
  s += `<text class="lbl go" x="${sx - 36}" y="${fy - 2}" text-anchor="end">forecast</text><text class="lbl go" x="${sx - 36}" y="${fy + 10}" text-anchor="end">${esc(P.v)} on Preview</text>`;
  const dd = days(DATA.now, P.at);
  return `<div class="micro">${esc(U.app)} · selected part</div><h2>${esc(p.label)} ${esc(p.running)}${p.next ? ' → ' + esc(p.next.v) : ''}</h2>
    ${p.next ? `<div class="big"><b>${dd}</b><span>days to the ${esc(U.window.label)} · ${fmtW(P.at)} ${esc(U.window.start)}</span></div>
    <p>Approve by <b>${esc(P.approveBy)}</b>. ${esc(P.ifWait)} ${U.approvers.map(who).join(' or ')} can approve.</p>` : `<p>No change in ${esc(P.v)}.</p>`}
    <div class="gauge"><svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Bake peaks and forecast">${defs}${s}</svg></div>
    <p style="margin-top:var(--space-2)">Each notch is one bake at its peak ${esc(U.limits.label)}. ${gap ? `<b>${esc(gap)}</b> has no bake record (the gap).` : ''} Dashed green: the forecast from Preview.</p>
    ${p.stale ? `<p><span style="background:repeating-linear-gradient(45deg,transparent 0 var(--space-1),var(--x-hatch) var(--space-1) calc(var(--space-1) + 1px));padding:0 var(--space-1)">${esc(p.stale.what)}</span> ${esc(p.stale.who)}</p>` : ''}
    ${p.needs ? `<button class="btn go"><i data-lucide="check" data-size="14"></i>Approve ${esc(P.v)}</button>` : ''}`;
}

/* ====================================================================== keys and demo */
$('#keys').innerHTML = [['↑ ↓', 'row'], ['Enter', 'closer'], ['Tab', 'marks'], ['M', 'move'], ['R', 'replay']].map(([a, b]) => `<span>${a.split(' ').map(k => `<span class="kbd">${k}</span>`).join(' ')} ${b}</span>`).join('');
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) { if (e.key === 'Escape') { $('#form')?.classList.remove('on'); $('#panel').classList.remove('forming'); $('#move')?.focus(); } return; }
  const lines = $$('.row > .ln');
  if (e.key === 'r' || e.key === 'R') return demo();
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cur = Math.max(0, Math.min(lines.length - 1, cur + (e.key === 'ArrowDown' ? 1 : -1))); lines[cur].focus(); }
  if ((e.key === 'm' || e.key === 'M') && $('#move')) { e.preventDefault(); $('#move').click(); }
  if (e.key === 'Escape') hideWhy();
});
let timers = [];
function demo() {
  timers.forEach(clearTimeout); timers = [];
  document.body.classList.remove('lit'); $('#wrap').classList.add('pre'); hideWhy();
  const start = location.hash.slice(1);
  select(ROWS.some(r => r.id === start) ? start : DATA.demo.select);
  timers.push(setTimeout(() => { $('#wrap').classList.remove('pre'); }, ms('--motion-run')));
  timers.push(setTimeout(() => document.body.classList.add('lit'), ms('--motion-run') + ms('--motion-calm')));
}
function header() {
  const U = DATA.upgrades, M = DATA.mandate, P = U.pending;
  const next = [...M.intents.filter(i => !i.done && !i.shadow).map(i => ({ n: i.name, d: left(i) })), { n: U.product + ' ' + P.v + ' in the ' + U.window.label, d: days(DATA.now, P.at) }].filter(z => z.d >= 0).sort((a, b) => a.d - b.d);
  const needs = M.intents.filter(i => i.needs).length + U.parts.filter(p => p.needs).length;
  $('#top').innerHTML = `<div><div class="crumb eyebrow"><span class="dot"></span>${esc(DATA.view.crumb)}</div><h1>${esc(DATA.view.title)}</h1>
    <div class="line">One now line for <b>${esc(M.app)}</b> and <b>${esc(U.app)}</b>. Nearest: <b>${esc(next[0].n)}</b> in ${plural(next[0].d, 'day')}, then <b>${esc(next[1].n)}</b> in ${plural(next[1].d, 'day')}. ${needs} need you.</div></div>
    <div class="facts"><div class="fact"><span class="micro">Viewing as</span><span class="v">${who(DATA.viewer.name)}</span></div><div class="fact"><span class="micro">Now</span><span class="v"><b>${fmtW(DATA.now)} ${DATA.nowTime}</b></span></div></div>`;
}
header(); render();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { draw(); if (sel) select(sel); }, 100); });
document.fonts.ready.then(() => { draw(); demo(); });
</script>
</body>
