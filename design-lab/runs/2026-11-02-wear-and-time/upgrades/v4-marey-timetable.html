/* ---------- Proposed tokens (not in the kit yet; listed in notes.md as "needs token") ---------- */
:root{
  --x-type-micro: .6875rem;      /* needs token: 11px mono numerals for dense marks (mono only) */
  /* stale hatch: the same diagonal hatch as "unavailable" in the cinematic run. Proposed: --pattern-stale */
  --x-stale-hatch: repeating-linear-gradient(135deg, transparent 0 var(--space-1), var(--hairline-strong) var(--space-1) calc(var(--space-1) * 1.5));
  --x-past: .62;                 /* needs token: --time-past-opacity, how much quieter the past is than now */
  --x-seam: color-mix(in srgb, var(--light) 78%, transparent);   /* seam: a repair, kept visible */
  --x-scar: color-mix(in srgb, var(--danger) 55%, var(--ink-muted)); /* scar: a rollback, past so muted */
  --x-org: var(--floor-org-high);
  --x-org-low: var(--floor-org-low);
  --x-head: calc(var(--space-8) - var(--space-2));
}
button{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
svg :focus-visible{outline:none}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.micro{font:400 var(--x-type-micro)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}

.head .run{font-size:var(--type-meta);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.need{display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-4);border-radius:var(--radius-pill);background:var(--surface-raised);

.need .dot{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--green);box-shadow:0 0 var(--space-2) var(--green)}
.need small{font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--green)}

/* ---------- "Why are you like this, and since when?" card, in place ---------- */

.lbl{font:400 var(--x-type-micro) var(--font-mono);letter-spacing:var(--tracking-caps);fill:var(--ink-muted);text-transform:uppercase}

.reveal{transition:width var(--motion-run) var(--ease-out)}
.fut{opacity:0;transition:opacity var(--motion-calm) var(--ease-standard)}

.bar{display:flex;gap:var(--space-5);align-items:center;font:400 var(--x-type-micro)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);padding-top:var(--space-2);border-top:1px solid var(--hairline)}

.ln{display:inline-block;width:var(--space-5);height:0;border-top:2px solid var(--x-org)}

const DAY = 864e5;

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

const fdt = s => fd(s) + ' · ' + ft(s);

}
function needCard() {
  const p = pendingRel();
  return { eyebrow: 'Needs you · ' + DATA.app.floor, title: `${rname(p.v)} waits for the ${DATA.window.label}`,
    rows: [['Why', `It reached Stable on ${fd(p.stable)}. Upgrades need an approval before the window opens.`],
      ['When', `${fwd(p.here)} ${DATA.window.start}–${DATA.window.end} · ${until(p.here)}. Approve by ${ft(DATA.pending.approveBy)}.`],
      ['If you wait', DATA.pending.ifWait],
      ['Who', `${person(DATA.roles.approver)} approves upgrades; ${person(DATA.roles.alsoApprover)} can too.`]],
    foot: [['calendar-clock', DATA.window.note]] };
}
/* the in-place answer to "why are you like this, and since when?" */
function showWhy(anchor, c, at) {
  const w = $('#why');
  w.innerHTML = `<div class="eyebrow">${esc(c.eyebrow)}</div><h3>${esc(c.title)}</h3><dl>${c.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    ${c.foot ? `<div class="foot micro">${c.foot.map(([i, t]) => `<span class="tag">${Icons.svg(i, { size: 14 })}${esc(t)}</span>`).join('')}</div>` : ''}`;
  const r = at || anchor.getBoundingClientRect(), W = innerWidth, H = innerHeight, g = PX('space-3');
  const ww = w.offsetWidth, wh = w.offsetHeight;
  let x = r.right + g, y = r.top;
  if (x + ww > W - g || (r.prefer === 'left' && r.left - ww - g > g)) x = r.left - ww - g;
  if (x < g) x = Math.min(W - ww - g, Math.max(g, r.left));
  if (x === Math.max(g, r.left) || x < r.right && x + ww > r.left) y = r.bottom + g;
  if (r.above) y = r.top - wh - g;
  if (y + wh > H - PX('space-6')) y = Math.max(PX('space-8'), H - PX('space-6') - wh);
  w.style.left = x + 'px'; w.style.top = y + 'px'; w.classList.add('on');
  say(c.title + '. ' + c.rows.map(r => r.join(': ')).join('. '));
}
const hideWhy = () => $('#why').classList.remove('on');

function boot(render, demo) {
  const go = () => { clearLater(); hideWhy(); render(); Icons.hydrate(); later(T('run'), demo); };   // the moment shows after one --motion-run
  addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') { if (!e.metaKey && !e.ctrlKey) go(); }
    if (e.key === 'Escape') hideWhy();
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { render(); Icons.hydrate(); }, T('base')); });
  go();
}

const NS = 'http://www.w3.org/2000/svg';
const el = (n, a, p) => { const e = document.createElementNS(NS, n); for (const k in a) if (a[k] != null) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const text = (p, x, y, s, cls = '', anchor = 'start') => { const t = el('text', { x, y, class: 'lbl ' + cls, 'text-anchor': anchor, 'dominant-baseline': 'middle' }, p); t.textContent = s; return t; };
let sel = null;

function layout() {
  const box = $('#chart').getBoundingClientRect(), W = box.width, H = box.height;
  const left = PX('space-8') + PX('space-5'), right = W - PX('space-4'), top = PX('space-5'), bottom = H - PX('space-5');
  const x = s => left + (D(s) - D(DATA.range.from)) / (D(DATA.range.to) - D(DATA.range.from)) * (right - left);
  const rows = [...DATA.channels.map(c => ({ id: c.id, label: c.label, up: true, w: 1.25 })), { id: 'wait', label: DATA.rows.waiting, w: 1 }, ...DATA.servers.map(s => ({ id: s.id, label: s.label, s, w: .6 }))];
  const tot = rows.reduce((a, r) => a + r.w, 0) - rows[rows.length - 1].w;
  let acc = 0; rows.forEach(r => { r.y = top + (acc / tot) * (bottom - top); acc += r.w; });
  const Y = id => rows.find(r => r.id === id).y;
  return { W, H, left, right, top, bottom, x, rows, Y };
}
/* the path of one release: channel stops, a dwell in the waiting row, then the drop through the servers */
function trainPts(L, r) {
  const pts = [];
  DATA.channels.forEach(c => { if (r[c.id] && D(r[c.id]) >= D(DATA.range.from) - 60 * DAY) pts.push([L.x(r[c.id]), L.Y(c.id), c.id]); });
  if (r.state === 'skipped' || r.state === 'upcoming') return pts;
  const at = r.here || r.seen;
  pts.push([L.x(r.stable), L.Y('wait'), 'wait']);
  pts.push([L.x(at), L.Y('wait'), 'wait']);
  if (r.rollback) {
    const reached = r.rollback.reached, xs = L.x(r.here);
    reached.forEach((sid, i) => pts.push([xs + i * DATA.serverDrop, L.Y(sid), sid]));
    for (let i = reached.length - 2; i >= 0; i--) pts.push([xs + (2 * reached.length - 2 - i) * DATA.serverDrop, L.Y(reached[i]), 'back']);
    pts.push([xs + (2 * reached.length - 1) * DATA.serverDrop, L.Y('wait'), 'back']);
    return pts;
  }
  DATA.servers.forEach((s, i) => pts.push([L.x(at) + i * DATA.serverDrop, L.Y(s.id), s.id]));
  return pts;
}
function cardFor(r) {
  if (r.state === 'scheduled') return needCard();
  const hops = [`Dev ${fd(r.dev)}`, `Preview ${fd(r.preview)}`, `Stable ${fd(r.stable)}`];
  const base = { eyebrow: `${r.kind} · ${r.state === 'applied' ? 'applied ' + fdt(r.here) : r.state}`, title: `${DATA.product} ${rname(r.v)}` };
  if (r.state === 'skipped') return { ...base, rows: [['Path', hops.join(' → ')], ['Why', r.note], ['Who', 'Nobody needs to act: the next patch carries its fixes.']] };
  if (r.state === 'upcoming') return { ...base, eyebrow: 'Estimate', rows: [['Path', `Dev ${fd(r.dev)} → Preview ${fd(r.preview)} (est.) → Stable ${fd(r.stable)} (est.)`], ['Known', 'Dates after Dev are estimates and move until it reaches Stable.']] };
  if (r.state === 'inferred') return { ...base, eyebrow: DATA.text.inferred, rows: [['Path', hops.join(' → ')], ['Why', r.note], ['Gap', DATA.gaps[0].why]] };
  const wait = Math.round(days(r.stable, r.here));
  const rows = [['Path', hops.join(' → ') + ` → here ${fd(r.here)}`], ['Waited', `${wait} days on Stable${r.missed ? ', including a missed window on ' + fd(r.missed) : ''}.`], ['Bake', `Errors peaked at ${r.peak}${DATA.limits.unit}.`], ['Who', person(r.by)]];
  if (r.rollback) rows.splice(1, 0, ['Scar', r.rollback.why]);
  if (r.repairs) rows.splice(1, 0, ['Seam', r.note]);
  if (r.missed) rows.push(['Why', DATA.missed.find(m => m.v === r.v).why]);
  return { ...base, rows };
}

function render() {
  renderHead();
  $('#h2').textContent = DATA.text.title; $('#sub').textContent = DATA.text.sub;
  const L = layout(), svg = $('#svg');
  svg.innerHTML = `<title id="svgT">${esc(DATA.text.title)}: ${DATA.releases.length} releases</title>`;
  svg.setAttribute('viewBox', `0 0 ${L.W} ${L.H}`);
  const defs = el('defs', {}, svg);
  const pat = el('pattern', { id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: tok('hairline-strong'), 'stroke-width': 2 }, pat);
  const clip = el('clipPath', { id: 'past' }, defs);
  el('rect', { x: L.left - PX('space-1'), y: -PX('space-6'), width: L.x(DATA.now) - L.left + PX('space-1'), height: L.H + PX('space-7'), class: 'reveal', id: 'revealRect' }, clip);

  // months
  for (let m = D(DATA.range.from); m <= D(DATA.range.to); m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
    const xx = L.x(m.toISOString().slice(0, 10)); el('line', { x1: xx, x2: xx, y1: L.top - PX('space-3'), y2: L.bottom + PX('space-3'), stroke: tok('hairline'), 'stroke-width': 1 }, svg);
    if (xx >= L.left) text(svg, xx + PX('space-1'), L.bottom + PX('space-4'), MON[m.getMonth()]);
  }
  // windows: every Thursday a thin band across your rows; the next one is lit (needs you)
  const [hh] = DATA.window.start.split(':').map(Number);
  for (let d = D(DATA.range.from); d <= D(DATA.range.to); d = new Date(+d + DAY)) {
    if (d.getDay() !== DATA.window.dow) continue; d.setHours(hh, 0, 0, 0);
    const iso = new Date(+d); const xx = L.x(iso.toISOString().slice(0, 16).replace(/T.*/, 'T' + DATA.window.start));
    const isNext = Math.abs(D(pendingRel().here) - d) < 3600e3, past = d < NOW;
    el('rect', { x: xx - 1, y: L.Y('wait') - PX('space-3'), width: 3, height: L.bottom - L.Y('wait') + PX('space-3') * 2, fill: isNext ? tok('green') : tok('ink'), opacity: isNext ? .35 : past ? .05 : .1 }, svg);
  }
  // rows
  L.rows.forEach(r => {
    el('line', { x1: L.left - PX('space-2'), x2: L.right, y1: r.y, y2: r.y, stroke: r.id === 'wait' ? tok('hairline-strong') : tok('hairline'), 'stroke-width': 1, 'stroke-dasharray': r.id === 'wait' ? '2 4' : null }, svg);
    const t = el('text', { x: L.left - PX('space-4'), y: r.y, class: 'row-l' + (r.up ? ' up' : ''), 'text-anchor': 'end', 'dominant-baseline': 'middle' }, svg); t.textContent = r.label;
  });
  text(svg, L.left - PX('space-4'), L.rows[0].y - PX('space-5'), DATA.text.upstream, 'h', 'end');
  text(svg, L.left - PX('space-4'), L.Y('wait') - PX('space-5'), DATA.deployment.name, 'h', 'end');
  // unconformity across your rows
  DATA.gaps.forEach(g => { const x0 = L.x(g.from), x1 = L.x(g.to);
    const r = el('rect', { x: x0, y: L.Y('wait') - PX('space-3'), width: x1 - x0, height: L.bottom - L.Y('wait') + PX('space-3') * 2, fill: 'url(#hatch)', tabindex: 0, role: 'button', 'aria-label': g.label, style: 'cursor:pointer' }, svg);
    text(svg, x0 + PX('space-2'), L.Y('wait') + PX('space-5'), `${DATA.text.gap} · ${fd(g.from)}–${fd(g.to)}`, 'v');
    const c = () => ({ eyebrow: 'Unconformity', title: `${g.label} for ${Math.round(days(g.from, g.to))} days`, rows: [['Why', g.why], ['Who', g.who]] });
    r.addEventListener('click', () => showWhy(r, c())); r.addEventListener('keydown', e => { if (e.key === 'Enter') showWhy(r, c()); }); });

  // the trains: past inside a clip that the demo opens, future dashed beyond the now line
  const past = el('g', { 'clip-path': 'url(#past)' }, svg), fut = el('g', { class: 'fut', id: 'fut' }, svg);
  const cur = running();
  DATA.releases.forEach(r => {
    const pts = trainPts(L, r); if (pts.length < 2) return;
    const minor = r.kind === 'minor', isCur = r === cur, scheduled = r.state === 'scheduled', upcoming = r.state === 'upcoming';
    const col = r.rollback ? `color-mix(in srgb, ${tok('danger')} 55%, ${tok('ink-muted')})` : scheduled ? tok('green') : r.repairs ? tok('light') : tok('floor-org-high');
    const opacity = isCur ? 1 : scheduled ? 1 : upcoming ? .55 : r.state === 'skipped' ? .35 : minor ? .75 : .45;
    const d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');
    // a future release keeps its past (Dev, Preview) solid and its future dashed
    const nowX = L.x(DATA.now);
    const layer = scheduled || upcoming ? null : past;
    if (layer) el('path', { d, class: 'train', 'data-v': r.v, stroke: col, 'stroke-width': minor ? 2 : 1.25, opacity, style: r.repairs ? `filter:drop-shadow(0 0 ${tok('space-1')} ${tok('light')})` : '' }, layer);
    else {
      const a = pts.filter(p => p[0] <= nowX), b = pts.filter(p => p[0] > nowX);
      if (a.length) { const lastA = a[a.length - 1], firstB = b[0] || lastA; const midY = lastA[1] + (firstB[1] - lastA[1]) * ((nowX - lastA[0]) / Math.max(1, firstB[0] - lastA[0]));
        el('path', { d: 'M' + a.map(p => p.slice(0, 2).join(',')).join(' L') + ` L${nowX},${midY}`, class: 'train', 'data-v': r.v, stroke: col, 'stroke-width': 2, opacity }, past);
        if (b.length) el('path', { d: `M${nowX},${midY} L` + b.map(p => p.slice(0, 2).join(',')).join(' L'), class: 'train', 'data-v': r.v, stroke: col, 'stroke-width': 2, opacity, 'stroke-dasharray': '3 5' }, fut); }
    }
    const hit = el('path', { d, class: 'train-hit', tabindex: 0, role: 'button', 'aria-label': rname(r.v) }, svg);
    hit.addEventListener('click', e => { e.stopPropagation(); select(r, hit); }); hit.addEventListener('keydown', e => { if (e.key === 'Enter') select(r, hit); });
    // labels: minors at their Dev stop; marks where something happened
    if (minor) { const p0 = pts[0]; text(r.state === 'upcoming' || scheduled ? fut : past, p0[0] - PX('space-1'), p0[1] - PX('space-3'), minorOf(r.v) + ' ' + bird(r.v), isCur || scheduled ? 'v' : '', 'start'); }
    if (r.state === 'skipped') { const pl = pts[pts.length - 1]; el('line', { x1: pl[0] - 4, x2: pl[0] + 4, y1: pl[1] + 5, y2: pl[1] + 5, stroke: tok('ink-muted') }, past); text(past, pl[0], pl[1] + PX('space-4'), r.v.split('.')[2] === '3' ? `${DATA.text.skipped} ×2` : '', '', 'middle'); }
    if (r.rollback) { const deep = pts.find(p => p[2] === r.rollback.server); text(past, deep[0] + PX('space-4'), deep[1] + PX('space-3'), `${r.v} ${DATA.text.rolled}`, '', 'start').style.fill = 'var(--x-scar)'; }
    if (r.missed) { const xm = L.x(r.missed); el('circle', { cx: xm, cy: L.Y('wait'), r: 4, fill: tok('slate-deep'), stroke: tok('ink'), 'stroke-dasharray': '1 2' }, past); text(past, xm, L.Y('wait') + PX('space-4'), DATA.text.missed, 'v', 'middle'); }
    if (r.repairs) { const pl = pts.find(p => p[2] === 's1'); text(past, pl[0] + PX('space-2'), pl[1] - PX('space-3'), `${r.v} · seam`, 'v'); }
  });
  // stale: the newest stretch of one server is unknown
  DATA.servers.filter(s => s.stale).forEach(s => { const xx = L.x(DATA.now), y = L.Y(s.id);
    el('rect', { x: xx - PX('space-4'), y: y - PX('space-2'), width: PX('space-4'), height: PX('space-4'), fill: 'url(#hatch)' }, svg);
    text(svg, xx - PX('space-5'), y, `no report ${span(NOW - D(s.stale.since))}`, '', 'end'); });
  // now line and the distance to the window
  const nx = L.x(DATA.now), p = pendingRel(), px = L.x(p.here);
  el('line', { x1: nx, x2: nx, y1: L.top - PX('space-5'), y2: L.bottom + PX('space-3'), stroke: tok('ink'), 'stroke-width': 1.5 }, svg);
  text(svg, nx + PX('space-2'), L.top - PX('space-5'), `${DATA.text.now} · ${fwd(DATA.now)} ${ft(DATA.now)}`, 'now');
  const ag = el('g', { class: 'fut' }, svg); ag.id = 'ahead';
  el('line', { x1: nx, x2: px, y1: L.Y('wait') - PX('space-4'), y2: L.Y('wait') - PX('space-4'), stroke: tok('green'), 'stroke-width': 1.5, 'marker-end': '' }, ag);
  el('path', { d: `M${px},${L.Y('wait') - PX('space-4')} l-${PX('space-2')},-${PX('space-1')} v${PX('space-2')} z`, fill: tok('green') }, ag);
  const at_ = text(ag, nx - PX('space-2'), L.Y('wait') - PX('space-4'), DATA.text.ahead.replace('{u}', until(p.here)), 'need', 'end'); at_.setAttribute('paint-order', 'stroke'); at_.setAttribute('stroke', tok('slate-deep')); at_.setAttribute('stroke-width', 4);
  // the past is quieter than now
  el('rect', { x: L.left, y: L.top - PX('space-3'), width: Math.max(0, L.x('2026-09-01') - L.left), height: L.bottom - L.top + PX('space-5'), fill: tok('slate-deep'), opacity: .25, 'pointer-events': 'none' }, svg);

  $('#bar').innerHTML = `<span><i class="ln"></i>minor</span><span><i class="ln" style="border-top-width:1px;opacity:.6"></i>patch</span><span><i class="ln" style="border-color:var(--x-scar)"></i>scar · reversal</span><span><i class="ln" style="border-color:var(--x-seam)"></i>seam · repair</span><span><i class="ln" style="border-top-style:dashed;border-color:var(--green)"></i>ahead</span><span><i class="sw hatch"></i>no record / stale</span><span style="margin-left:auto">${esc(DATA.rows.waiting)} = ${esc(DATA.rows.waitNote)}</span>`;
  if (sel) highlight(sel);
}
function highlight(r) { $('#svg').classList.toggle('focus', !!r); $$('.train').forEach(t => t.classList.toggle('sel', !!r && t.dataset.v === r.v)); }
function select(r, node) {
  sel = r; highlight(r);
  const L = layout(), pts = trainPts(L, r), last = pts[pts.length - 1], bb = $('#svg').getBoundingClientRect();
  const ax = Math.min(last[0], L.x(DATA.now)), ay = last[1];
  showWhy(node, cardFor(r), { left: bb.left + ax - PX('space-3'), right: bb.left + ax + PX('space-3'), top: bb.top + Math.max(L.top, ay - PX('space-8')), bottom: bb.top + ay, prefer: 'left' });
}
const order = () => DATA.releases.filter(r => trainPts(layout(), r).length > 1);
addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const o = order(), i = sel ? o.indexOf(sel) : o.indexOf(running());
  const n = o[Math.max(0, Math.min(o.length - 1, i + (e.key === 'ArrowRight' ? 1 : -1)))];
  select(n, $(`.train-hit[aria-label="${CSS.escape(rname(n.v))}"]`));
});
addEventListener('keydown', e => { if (e.key === 'Escape') { sel = null; highlight(null); } });
document.addEventListener('click', e => { if (!e.target.closest('.why') && !e.target.closest('.need')) { sel = null; highlight(null); hideWhy(); } });
function demo() {
  const rr = $('#revealRect'), L = layout(), w = L.x(DATA.now);
  if (!REDUCED) { rr.style.transition = 'none'; rr.setAttribute('width', L.left); rr.getBoundingClientRect(); rr.style.transition = ''; requestAnimationFrame(() => rr.setAttribute('width', w)); }
  later(REDUCED ? 0 : T('run'), () => { $('#fut').classList.add('on'); $('#ahead').classList.add('on'); });
  later(REDUCED ? T('base') : T('run') + T('calm'), () => { const p = pendingRel(); select(p, $(`.train-hit[aria-label="${CSS.escape(rname(p.v))}"]`)); });
}
function start() { sel = null; render(); }
boot(start, demo);
</script>
