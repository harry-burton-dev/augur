const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const D = s => new Date(s.length <= 10 ? s + 'T12:00' : s);
const NOW = D(DATA.now);
const DAY = 864e5;
const days = (a, b) => (D(b) - D(a)) / DAY;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fd = s => { const d = D(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const ft = s => { const d = D(s); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const fdt = s => fd(s) + ' · ' + ft(s);
const fwd = s => WD[D(s).getDay()] + ' ' + fd(s);
const minorOf = v => v.split('.').slice(0, 2).join('.');
const bird = v => DATA.birds[minorOf(v)] || '';
const rname = v => v + ' ' + bird(v);
const person = id => DATA.people[id] || id;
const rel = v => DATA.releases.find(r => r.v === v);
const server = id => DATA.servers.find(s => s.id === id);
const appLabel = id => (DATA.apps.find(a => a.id === id) || {}).label || id;
/* how far: "in 3 d 0 h 46 m" or "47 min ago" */
const span = ms => { const m = Math.round(Math.abs(ms) / 6e4), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return d ? `${d} d ${h} h ${mm} m` : h ? `${h} h ${mm} m` : `${mm} min`; };
const until = s => 'in ' + span(D(s) - NOW);
const ago = s => span(NOW - D(s)) + ' ago';
const running = () => { const a = DATA.releases.filter(r => r.state === 'applied' && D(r.here) <= NOW); return a[a.length - 1]; };
const pendingRel = () => rel(DATA.pending.v);
const ageDays = s => Math.round((NOW - D(s)) / DAY);
/* the app versions running after a release (accumulated) */
const appsAt = v => { const o = {}; for (const r of DATA.releases) { if (r.state === 'skipped' || r.state === 'upcoming') { if (r.v === v) break; continue; } if (r.state !== 'rolledback') Object.assign(o, r.apps); if (r.v === v) break; } return o; };

let _timers = [];
const later = (ms, fn) => { const id = setTimeout(fn, ms); _timers.push(id); return id; };
const clearLater = () => { _timers.forEach(clearTimeout); _timers = []; };
const say = m => { const l = $('#live'); if (l) l.textContent = m; };

function renderHead() {
  const cur = running(), p = pendingRel(), A = DATA.app;
  const servers = DATA.servers.length, stale = DATA.servers.filter(s => s.stale);
  $('#head').innerHTML = `
    <div class="ttl"><span class="eyebrow">${esc(A.floor)} · ${esc(A.area)}</span><h1>${esc(A.title)}</h1></div>
    <div class="run">${esc(DATA.deployment.name)} runs <b>${esc(DATA.product)} ${esc(rname(cur.v))}</b> on ${servers} servers since ${fd(cur.here)}${stale.length ? ` · <b>${esc(stale.map(s => s.label).join(', '))}</b> not reporting for ${span(NOW - D(stale[0].stale.since))}` : ''}</div>
    <button class="need" id="need" aria-describedby="needWhy"><span class="dot" aria-hidden="true"></span><small>Needs you</small><span>${esc(DATA.pending.words.replace(p.v, rname(p.v)))}</span><span class="mono" style="color:var(--ink-muted)">by ${WD[D(DATA.pending.approveBy).getDay()]} ${ft(DATA.pending.approveBy)}</span></button>
    <span class="sr" id="needWhy">${esc(DATA.pending.ifWait)}</span>`;

}
function needCard() {
  const p = pendingRel();
  return { eyebrow: 'Needs you · ' + DATA.app.floor, title: `${rname(p.v)} waits for the ${DATA.window.label}`,
    rows: [['Why', `It reached Stable on ${fd(p.stable)}. Upgrades need an approval before the window opens.`],
      ['When', `${fwd(p.here)} ${DATA.window.start}–${DATA.window.end} · ${until(p.here)}. Approve by ${ft(DATA.pending.approveBy)}.`],
      ['If you wait', DATA.pending.ifWait],
      ['Who', `${person(DATA.roles.approver)} approves upgrades; ${person(DATA.roles.alsoApprover)} can too.`]],
    foot: [['calendar-clock', DATA.window.note]] };
}
/* the in-place answer to "why are you like this, and since when?" */
function showWhy(anchor, c, at) {
  const w = $('#why');
  w.innerHTML = `<div class="eyebrow">${esc(c.eyebrow)}</div><h3>${esc(c.title)}</h3><dl>${c.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    ${c.foot ? `<div class="foot micro">${c.foot.map(([i, t]) => `<span class="tag">${Icons.svg(i, { size: 14 })}${esc(t)}</span>`).join('')}</div>` : ''}`;
  const r = at || anchor.getBoundingClientRect(), W = innerWidth, H = innerHeight, g = PX('space-3');
  const ww = w.offsetWidth, wh = w.offsetHeight;
  let x = r.right + g, y = r.top;
  if (x + ww > W - g || (r.prefer === 'left' && r.left - ww - g > g)) x = r.left - ww - g;
  if (x < g) x = Math.min(W - ww - g, Math.max(g, r.left));
  if (x === Math.max(g, r.left) || x < r.right && x + ww > r.left) y = r.bottom + g;
  if (r.above) y = r.top - wh - g;
  if (y + wh > H - PX('space-6')) y = Math.max(PX('space-8'), H - PX('space-6') - wh);
  w.style.left = x + 'px'; w.style.top = y + 'px'; w.classList.add('on');

}
const hideWhy = () => $('#why').classList.remove('on');

function boot(render, demo) {
  const go = () => { clearLater(); hideWhy(); render(); Icons.hydrate(); later(T('run'), demo); };   // the moment shows after one --motion-run
  addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') { if (!e.metaKey && !e.ctrlKey) go(); }
    if (e.key === 'Escape') hideWhy();
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { render(); Icons.hydrate(); }, T('base')); });
  go();
}

const A0 = D(DATA.axisFrom), A1 = D(DATA.axisTo);
const pos = s => ((D(s) - A0) / (A1 - A0) * 100).toFixed(2) + '%';
/* the strip of a multi row stacks one lane per server */
const applied = DATA.releases.filter(r => r.here && D(r.here) <= NOW);
/* every change to one part, from the releases that carried it */
function historyOf(id) {
  const h = [];
  if (id === 'augur') DATA.releases.forEach(r => { if (r.state === 'skipped' || r.state === 'upcoming') return; h.push({ v: r.v, at: r.here || r.seen, r, kind: r.kind }); });
  else if (id.startsWith('s')) applied.forEach(r => { if (r.rollback && !r.rollback.reached.includes(id)) return; h.push({ v: r.v, at: r.here, r, kind: r.kind }); });
  else DATA.releases.forEach(r => { if (!r.apps[id] || r.state === 'upcoming') return; const prev = h[h.length - 1]; const kind = !prev ? 'maj' : r.apps[id].split('.')[0] !== prev.v.split('.')[0] ? 'maj' : r.apps[id].split('.')[1] !== prev.v.split('.')[1] ? 'minor' : 'patch'; h.push({ v: r.apps[id], at: r.here || r.seen, r, kind }); });
  return h;
}
function partsList() {
  const g = DATA.groups;
  return [
    { group: g.platform, id: 'augur', label: DATA.product, icon: 'layers' },
    ...DATA.apps.filter(a => a.kind === 'platform').map((a, i) => ({ group: i ? null : g.apps, id: a.id, label: a.label, icon: { home: 'house', admin: 'settings', upgrade: 'refresh-cw', explorer: 'compass' }[a.id] || 'package' })),
    ...DATA.apps.filter(a => a.kind === 'pillar').map((a, i) => ({ group: i ? null : g.pillars, id: a.id, label: a.label, icon: { artifacts: 'library', mandate: 'target', atlas: 'database' }[a.id] || 'package' })),
    { group: g.servers, id: 'servers', label: DATA.servers.length + ' ' + g.servers.toLowerCase(), icon: 'server', multi: true }];
}
function current(h) { const ok = h.filter(x => x.r.state !== 'rolledback' && x.r.state !== 'scheduled' && x.at && D(x.at) <= NOW); return ok[ok.length - 1]; }
function lane(sid) {
  const s = server(sid), h = historyOf(sid);
  return `<span class="lane">${h.map(x => `<i class="t ${x.r.rollback ? 'scar' : x.r.repairs ? 'seam' : x.kind === 'minor' ? 'maj' : 'pat2'}" style="left:${pos(x.at)}"></i>`).join('')}${s.stale ? `<i class="st" style="left:calc(${pos(s.stale.since)} - var(--space-2));width:var(--space-2)"></i>` : ''}</span>`;
}
function rowHTML(p) {
  if (p.multi) return multiHTML(p);
  const h = historyOf(p.id), cur = current(h), next = h.find(x => x.r.state === 'scheduled'), W = DATA.words, pend = pendingRel();
  const ticks = h.filter(x => x.at && x.r.state !== 'scheduled').map(x => {
    const cls = x.r.rollback ? 'scar' : x.r.repairs ? 'seam' : p.id === 'augur' || p.s ? (x.kind === 'minor' ? 'maj' : x.kind === 'hotfix' ? 'seam' : 'pat2') : x.kind === 'maj' ? 'maj' : x.kind === 'minor' ? 'min' : 'pat2';
    return `<i class="t ${cls}" style="left:${pos(x.at)}" title="${esc(x.v)} · ${fd(x.at)}"></i>`; }).join('');
  const gaps = DATA.gaps.map(g => `<i class="gap" style="left:${pos(g.from)};width:calc(${pos(g.to)} - ${pos(g.from)})"></i>`).join('');
  const tide = p.id === 'augur' || p.s ? DATA.missed.map(m => `<i class="tide" style="left:${pos(m.at)}"></i>`).join('') : '';
  const stale = p.s && p.s.stale ? `<i class="st" style="left:calc(${pos(p.s.stale.since)} - var(--space-2));width:var(--space-2)"></i>` : '';
  const pat = cur ? `<i class="pat" style="left:${pos(cur.at)};width:calc(${pos(DATA.now)} - ${pos(cur.at)})"></i>` : '';
  const nx = next ? `<i class="t next" style="left:${pos(next.at)}"></i>` : '';
  const age = cur ? ageDays(cur.at) : 0;
  const changes = h.filter(x => x.at && x.r.state !== 'scheduled').length;
  const ahead = p.s && p.s.stale ? `<span class="ahead">${esc(W.stale.replace('{a}', ago(p.s.stale.since)))}</span>`
    : next ? `<span class="ahead due"><b>${esc(next.v)}</b> · ${esc(fwd(next.at))} ${DATA.window.start}</span>` : `<span class="ahead">${esc(W.noChange.replace('{v}', minorOf(pend.v)))}</span>`;
  return `<div class="row${age > 60 ? ' past-q' : ''}" data-id="${p.id}"><button aria-expanded="false" aria-controls="m-${p.id}">
    <span class="nm">${Icons.svg(p.icon, { size: 16 })}${esc(p.label)}</span>
    <span class="ver">${esc(cur ? cur.v : '—')}${p.id === 'augur' ? `<small>${esc(bird(cur.v))}</small>` : ''}</span>
    <span class="strip" aria-hidden="true">${pat}${gaps}${ticks}${tide}${stale}<i class="fut" style="left:${pos(DATA.now)}"></i>${nx}</span>
    <span class="since">${fd(cur.at)} · ${age} d<br>${esc(W.changed.replace('{n}', changes))}</span>
    ${ahead}</button>
    <div class="more" id="m-${p.id}" role="region" aria-label="${esc(p.label)} history"><div><div class="in">${moreHTML(p, h, cur, next)}</div></div></div></div>`;
}
function multiHTML(p) {
  const h = historyOf(DATA.servers[0].id), cur = current(h), next = h.find(x => x.r.state === 'scheduled') || { v: pendingRel().v, at: pendingRel().here };
  const st = DATA.servers.filter(s => s.stale), sc = DATA.releases.filter(r => r.rollback);
  const why = `All ${DATA.servers.length} servers run ${cur.v} since ${fdt(cur.at)}${st.length ? `, as far as we know: ${st.map(s => s.label).join(', ')} last reported at ${ft(st[0].stale.since)}. ${st[0].stale.why} ${st[0].stale.who}` : '.'} ${sc.map(r => `${r.rollback.reached.map(x => server(x).short).join(', ')} carry a scar from ${r.v} (${fd(r.here)}); ${DATA.servers.filter(x => !r.rollback.reached.includes(x.id)).map(x => x.short).join(' and ')} never ran it.`).join(' ')}`;
  return `<div class="row" data-id="${p.id}"><button aria-expanded="false" aria-controls="m-${p.id}">
    <span class="nm">${Icons.svg(st.length ? 'server-off' : 'server', { size: 16 })}${esc(p.label)}</span>
    <span class="ver">${esc(cur.v)}<small>${DATA.servers.length - st.length}/${DATA.servers.length} report</small></span>
    <span class="strip multi" aria-hidden="true">${DATA.servers.map(s => lane(s.id)).join('')}<i class="fut" style="left:${pos(DATA.now)}"></i><i class="t next" style="left:${pos(next.at)}"></i></span>
    <span class="since">${fd(cur.at)} · ${ageDays(cur.at)} d<br>${DATA.servers.map(s => s.short).join(' ')}</span>
    <span class="ahead due"><b>${esc(next.v)}</b> · ${esc(fwd(next.at))} ${DATA.window.start}</span></button>
    <div class="more" id="m-${p.id}" role="region" aria-label="${esc(p.label)} history"><div><div class="in"><p class="say"><span class="eyebrow">Why ${esc(cur.v)}, and since when</span>${esc(why)}</p>
    <div class="ladder">${DATA.servers.map(s => `<span class="chip ${s.stale ? '' : ''}" style="${s.stale ? 'background-image:var(--x-stale-hatch)' : ''}">${esc(s.short)}<small>${s.people} people${s.stale ? ' · ' + ago(s.stale.since) : ''}</small></span>`).join('')}</div></div></div></div></div>`;
}
function moreHTML(p, h, cur, next) {
  const r = cur.r, bits = [];
  let why;
  if (p.s && p.s.stale) why = `${p.s.label} last reported at ${ft(p.s.stale.since)}, running ${cur.v}. ${p.s.stale.why} ${p.s.stale.who}`;
  else if (p.s) why = `${p.s.label} runs ${cur.v} since ${fdt(cur.at)}, with the rest of ${DATA.deployment.name}.${h.some(x => x.r.rollback) ? ` It carries a scar: ${h.find(x => x.r.rollback).v} was rolled back here on ${fd(h.find(x => x.r.rollback).at)}.` : ''}`;
  else why = `${p.label} is ${cur.v} because ${DATA.product} ${rname(r.v)} brought it on ${fd(cur.at)}${r.by ? `, applied by ${person(r.by)}` : ''}. ${next ? `${next.v} comes with ${rname(next.r.v)} in ${DATA.window.label} (${until(next.at)}), once someone approves it.` : `${rname(pendingRel().v)} does not change it.`}`;
  if (p.id === 'augur') why += ` ${DATA.notesRead.label.replace('{r}', DATA.notesRead.read).replace('{n}', DATA.notesRead.of)}.`;
  const chips = h.map(x => {
    const cls = x.r.rollback ? 'scar' : x.r.repairs ? 'seam' : x.r.state === 'scheduled' ? 'next' : (NOW - D(x.at)) / DAY > 60 ? 'old' : '';
    const note = x.r.rollback ? 'rolled back' : x.r.repairs ? 'repair' : x.r.state === 'scheduled' ? until(x.at) : x.r.state === 'inferred' ? 'inferred' : fd(x.at);
    return `<span class="chip ${cls}">${esc(x.v)}<small>${esc(note)}</small></span>`; }).join('');
  return `<p class="say"><span class="eyebrow">Why ${esc(cur.v)}, and since when</span>${esc(why)}</p><div class="ladder">${chips}</div>`;
}
function render() {
  renderHead();
  const C = DATA.cols, parts = partsList();
  const months = []; for (let m = new Date(A0); m < A1; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) months.push(m);
  $('#stage').innerHTML = `<div class="hdr"><span>${esc(C[0])}</span><span>${esc(C[1])}</span><span class="axis">${months.filter(m => Math.abs(m - NOW) > 12 * DAY).map(m => `<i style="left:${pos(m.toISOString().slice(0, 10))}">${MON[m.getMonth()]}</i>`).join('')}<i style="left:${pos(DATA.now)};color:var(--light)">now</i></span><span>${esc(C[3])}</span><span>${esc(C[4])}</span></div>
    ${parts.map(p => (p.group ? `<div class="eyebrow grp">${esc(p.group)}</div>` : '') + rowHTML(p)).join('')}
    <div class="foot"><span><i style="background:var(--ink)"></i>change, taller = bigger</span><span><i style="background:var(--x-scar)"></i>scar · rolled back</span><span><i style="background:var(--x-seam)"></i>seam · repair</span><span><i class="hatch" style="width:var(--space-4)"></i>no record / stale</span><span><i style="border-left:1px dotted var(--ink)"></i>tide line · window missed</span><span><i style="border-left:2px dashed var(--green)"></i>arrives in the window</span><span><i style="width:var(--space-5);background:linear-gradient(to right,transparent,color-mix(in srgb,var(--x-org-low) 60%,transparent))"></i>patina · time unchanged</span></div>`;
  $$('.row>button').forEach(b => b.addEventListener('click', () => toggle(b.parentElement)));
  $$('.row>button').forEach((b, i, all) => b.addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = all[i + (e.key === 'ArrowDown' ? 1 : -1)]; if (n) n.focus(); } }));
}
function toggle(row, force) {
  const open = force != null ? force : !row.classList.contains('open');
  $$('.row.open').forEach(r => { if (r !== row) { r.classList.remove('open'); r.firstElementChild.setAttribute('aria-expanded', 'false'); } });
  row.classList.toggle('open', open); row.firstElementChild.setAttribute('aria-expanded', String(open));
  if (open) say($('.say', row).textContent);
}
addEventListener('keydown', e => { if (e.key === 'Escape') $$('.row.open').forEach(r => toggle(r, false)); });
function demo() { const r = $(`.row[data-id="${DATA.demoOpen}"]`); if (r) toggle(r, true); }
boot(render, demo);
</script>
