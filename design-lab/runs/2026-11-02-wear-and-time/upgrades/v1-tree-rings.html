const fd = s => { const d = D(s); return d.getDate() + ' ' + MON[d.getMonth()]; };

    <div class="core" id="core" aria-hidden="true">
      ${minors.map((m, i) => { const n = minors[i + 1]; return `<div class="seg" style="left:${pos(m.here)}%;width:${pos(n ? n.here : DATA.now) - pos(m.here)}%;background:color-mix(in srgb,var(--x-org-low) ${i % 2 ? 34 : 20}%,var(--slate-deep))"></div>`; }).join('')}
      ${DATA.gaps.map(gp => `<div class="seg hatch" style="left:${pos(gp.from)}%;width:${pos(gp.to) - pos(gp.from)}%"></div>`).join('')}
      ${applied.map(r => r.rollback ? (r.rollback.reached.includes(coreServer) ? `<div class="mk" style="left:${pos(r.here)}%;border-left:${r.rollback.server === coreServer ? 3 : 2}px solid var(--x-scar)"></div>` : '') : `<div class="mk" style="left:${pos(r.here)}%;border-left:${r.repairs ? '2px solid var(--x-seam);box-shadow:0 0 var(--space-2) var(--light)' : r.kind === 'minor' ? `${1 + Math.round(r.peak * 1.6)}px solid color-mix(in srgb,var(--x-org) ${45 + r.peak * 20}%,transparent)` : '1px solid var(--hairline-strong)'}"></div>`).join('')}
      ${DATA.missed.map(m => `<div class="mk" style="left:${pos(m.at)}%;border-left:1px dotted var(--ink)"></div>`).join('')}
      <div class="mk" style="left:86%;border-left:2px solid var(--ink)"></div>
      <div class="seg" style="left:86%;right:0;background:color-mix(in srgb,var(--green) 10%,transparent)"></div>
      <div class="mk" style="left:${86 + 14 * days(DATA.now, pendingRel().here) / days(DATA.now, '2026-11-26')}%;border-left:1px dashed var(--green)"></div>
      ${s.stale ? `<div class="seg hatch" style="left:84.5%;width:1.5%"></div>` : ''}
      <div class="fill"></div>
    </div>
    <div class="micro" style="display:flex;justify-content:space-between;margin-top:calc(-1 * var(--space-3))"><span>Centre · ${fd(applied[0].here)}</span><span>Bark · now</span><span style="color:var(--green)">Ahead</span></div>
    <ul class="events" id="events">${ev.map((e, i) => `<li class="${e.future ? '' : 'past'}" style="transition-delay:calc(var(--motion-instant) * ${Math.min(i, 10)})"><button data-i="${i}"><span class="d">${e.future ? fd(e.at) : fd(e.at)}</span><span class="ic">${Icons.svg(e.icon, { size: 16 })}</span><span>${esc(e.t)}</span><span class="m">${esc(e.m)}</span></button></li>`).join('')}</ul>
    <div class="legend"><span><i class="sw" style="background:color-mix(in srgb,var(--x-org-low) 46%,var(--slate-deep))"></i>ring = minor</span><span><i class="sw" style="border-left:3px solid var(--x-scar)"></i>scar</span><span><i class="sw" style="border-left:2px solid var(--x-seam)"></i>seam</span><span><i class="sw hatch"></i>no record / stale</span><span><i class="sw" style="border:1px dashed var(--green)"></i>window ahead</span></div>`;
  $$('#side .servers button').forEach(b => b.onclick = () => { coreServer = b.dataset.s; hideWhy(); render(); bore(false); });
  $$('#events button').forEach(b => b.onclick = () => { $$('#events button').forEach(x => x.classList.toggle('on', x === b)); const e = ev[+b.dataset.i]; showWhy(b, cardFor(e.kind, e.r)); });
}
function bore(withCard = true) {
  const g = geo(), a = sectorAngle(coreServer), [x, y] = pol(g, g.R + PX('space-3'), a), [x2, y2] = pol(g, g.pith, a);
  const len = Math.hypot(x - x2, y - y2);
  const l = el('line', { x1: x, y1: y, x2, y2, class: 'borer', style: `--len:${len}` }, $('#svg'));
  requestAnimationFrame(() => requestAnimationFrame(() => l.classList.add('on')));
  later(REDUCED ? 0 : T('run') * .6, () => { $('#core').classList.add('on'); $('#events').classList.add('on'); });
  if (withCard) later(REDUCED ? T('base') : T('run') + T('slow'), () => {
    const r = DATA.releases.find(x => x.rollback && x.rollback.reached.includes(coreServer)); if (!r) return;
    const btn = $$('#events button').find(b => b.textContent.includes(r.v + ' rolled back')); if (btn) btn.classList.add('on');
    const rr = geo(), [sx, sy] = pol(rr, rr.r(r.here), a), bb = $('#svg').getBoundingClientRect();
    showWhy(btn, cardFor('scar', r), { prefer: 'left', left: bb.left + sx - PX('space-5'), right: bb.left + sx + PX('space-4'), top: bb.top + sy - PX('space-8') * 1.5, bottom: bb.top + sy });
  });
}
addEventListener('keydown', e => { const i = +e.key; if (i >= 1 && i <= DATA.servers.length) { coreServer = DATA.servers[i - 1].id; hideWhy(); render(); Icons.hydrate(); bore(false); } });
boot(render, () => bore(true));
</script>
</body>
</html>
