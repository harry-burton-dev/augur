/* how far: "in 3 d 0 h 46 m" or "47 min ago" */
const span = ms => { const m = Math.round(Math.abs(ms) / 6e4), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return d ? `${d} d ${h} h ${mm} m` : h ? `${h} h ${mm} m` : `${mm} min`; };
const until = s => 'in ' + span(D(s) - NOW);
const ago = s => span(NOW - D(s)) + ' ago';
const running = () => { const a = DATA.releases.filter(r => r.state === 'applied' && D(r.here) <= NOW); return a[a.length - 1]; };
const pendingRel = () => rel(DATA.pending.v);
const ageDays = s => Math.round((NOW - D(s)) / DAY);
/* the app versions running after a release (accumulated) */
const appsAt = v => { const o = {}; for (const r of DATA.releases) { if (r.state === 'skipped' || r.state === 'upcoming') { if (r.v === v) break; continue; } if (r.state !== 'rolledback') Object.assign(o, r.apps); if (r.v === v) break; } return o; };

let _timers = [];
const later = (ms, fn) => { const id = setTimeout(fn, ms); _timers.push(id); return id; };
const clearLater = () => { _timers.forEach(clearTimeout); _timers = []; };
const say = m => { const l = $('#live'); if (l) l.textContent = m; };

function renderHead() {
  const cur = running(), p = pendingRel(), A = DATA.app;
  const servers = DATA.servers.length, stale = DATA.servers.filter(s => s.stale);
  $('#head').innerHTML = `
    <div class="ttl"><span class="eyebrow">${esc(A.floor)} · ${esc(A.area)}</span><h1>${esc(A.title)}</h1></div>
    <div class="run">${esc(DATA.deployment.name)} runs <b>${esc(DATA.product)} ${esc(rname(cur.v))}</b> on ${servers} servers since ${fd(cur.here)}${stale.length ? ` · <b>${esc(stale.map(s => s.label).join(', '))}</b> not reporting for ${span(NOW - D(stale[0].stale.since))}` : ''}</div>
    <button class="need" id="need" aria-describedby="needWhy"><span class="dot" aria-hidden="true"></span><small>Needs you</small><span>${esc(DATA.pending.words.replace(p.v, rname(p.v)))}</span><span class="mono" style="color:var(--ink-muted)">by ${WD[D(DATA.pending.approveBy).getDay()]} ${ft(DATA.pending.approveBy)}</span></button>
    <span class="sr" id="needWhy">${esc(DATA.pending.ifWait)}</span>`;
  $('#need').onclick = () => showWhy($('#need'), needCard());
}
function needCard() {
  const p = pendingRel();
  return { eyebrow: 'Needs you · ' + DATA.app.floor, title: `${rname(p.v)} waits for the ${DATA.window.label}`,
    rows: [['Why', `It reached Stable on ${fd(p.stable)}. Upgrades need an approval before the window opens.`],
      ['When', `${fwd(p.here)} ${DATA.window.start}–${DATA.window.end} · ${until(p.here)}. Approve by ${ft(DATA.pending.approveBy)}.`],
      ['If you wait', DATA.pending.ifWait],

/* the in-place answer to "why are you like this, and since when?" */
function showWhy(anchor, c, at) {
  const w = $('#why');
  w.innerHTML = `<div class="eyebrow">${esc(c.eyebrow)}</div><h3>${esc(c.title)}</h3><dl>${c.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    ${c.foot ? `<div class="foot micro">${c.foot.map(([i, t]) => `<span class="tag">${Icons.svg(i, { size: 14 })}${esc(t)}</span>`).join('')}</div>` : ''}`;
  const r = at || anchor.getBoundingClientRect(), W = innerWidth, H = innerHeight, g = PX('space-3');
  const ww = w.offsetWidth, wh = w.offsetHeight;
  let x = r.right + g, y = r.top;
  if (x + ww > W - g || (r.prefer === 'left' && r.left - ww - g > g)) x = r.left - ww - g;
  if (x < g) x = Math.min(W - ww - g, Math.max(g, r.left));
  if (x === Math.max(g, r.left) || x < r.right && x + ww > r.left) y = r.bottom + g;
  if (r.above) y = r.top - wh - g;
  if (y + wh > H - PX('space-6')) y = Math.max(PX('space-8'), H - PX('space-6') - wh);
  w.style.left = x + 'px'; w.style.top = y + 'px'; w.classList.add('on');
  say(c.title + '. ' + c.rows.map(r => r.join(': ')).join('. '));
}
const hideWhy = () => $('#why').classList.remove('on');

function boot(render, demo) {
  const go = () => { clearLater(); hideWhy(); render(); Icons.hydrate(); later(T('run'), demo); };   // the moment shows after one --motion-run
  addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') { if (!e.metaKey && !e.ctrlKey) go(); }
    if (e.key === 'Escape') hideWhy();
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { render(); Icons.hydrate(); }, T('base')); });
  go();
}

const NS = 'http://www.w3.org/2000/svg';
const el = (n, a, p) => { const e = document.createElementNS(NS, n); for (const k in a) if (a[k] != null) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const stops = DATA.releases.filter(r => r.here && D(r.here) <= NOW && r.state === 'applied');
let leftV = running().v, overlay = false, pick = null;
const ICON = { augur: 'layers', home: 'house', admin: 'settings', upgrade: 'refresh-cw', explorer: 'compass', artifacts: 'library', mandate: 'target', atlas: 'database' };

function items(atV, side) {
  const apps = appsAt(atV), list = [{ id: 'augur', label: DATA.product, v: atV, sub: bird(atV) }];
  DATA.apps.forEach(a => list.push({ id: a.id, label: a.label, v: apps[a.id] || '—', sub: a.kind === 'platform' ? 'platform app' : 'pillar app' }));
  const A = DATA.ahead;
  A.settings.forEach(s => list.push({ id: s.id, label: s.label, v: side === 'r' ? s.to : s.from, sub: side === 'r' ? s.note : 'setting', icon: s.icon, setting: s }));
  if (side === 'r') A.migrations.forEach(m => list.push({ id: m.id, label: m.label, v: '', sub: m.note, icon: m.icon, mig: m, isNew: true }));
  return list;
}
/* what happened to a part between two releases: scars and seams ride on the bridge */
function between(id, fromV, toV) {
  const a = DATA.releases.findIndex(r => r.v === fromV), b = DATA.releases.findIndex(r => r.v === toV), out = { scars: [], seams: [], changes: 0 };
  DATA.releases.slice(a + 1, b + 1).forEach(r => {
    if (id !== 'augur' && !r.apps[id] && !(r.rollback || r.repairs)) return;
    if (id !== 'augur' && !(r.apps[id])) return;
    if (r.rollback) out.scars.push(r); else if (r.repairs) out.seams.push(r); else if (r.state !== 'skipped' && r.state !== 'upcoming') out.changes++;
  });
  return out;
}
function paneHTML(side) {
  const p = pendingRel(), atV = side === 'l' ? leftV : p.v, list = items(atV, side);
  const L = side === 'l' ? items(leftV, 'l') : null, R = side === 'r' ? null : items(p.v, 'r');
  let ordered = list;
  if (side === 'r') { const left = items(leftV, 'l'); const changed = x => x.isNew || (left.find(l => l.id === x.id) || {}).v !== x.v; ordered = [...list.filter(changed), ...list.filter(x => !changed(x))]; }
  const title = side === 'l' ? (leftV === running().v ? `${DATA.text.left} · ${rname(leftV)}` : `${fd(rel(leftV).here)} · ${rname(leftV)}`) : DATA.text.right.replace('{w}', `${fwd(p.here)} ${DATA.window.start} · ${rname(p.v)}`);
  const eyebrow = side === 'l' ? (leftV === running().v ? `Running since ${fd(running().here)}` : `${Math.round(days(rel(leftV).here, DATA.now))} days ago`) : `After the window · ${until(p.here)}`;
  return `<header><span class="eyebrow" style="${side === 'r' ? 'color:var(--green)' : ''}">${esc(eyebrow)}</span><h2>${esc(title)}</h2></header>` + ordered.map(x => {
    const other = side === 'r' ? items(leftV, 'l').find(l => l.id === x.id) : items(p.v, 'r').find(l => l.id === x.id);
    const same = other && other.v === x.v, cls = x.isNew ? 'new' : same ? 'same' : '';
    const hist = overlay && side === 'l' && !x.setting ? ghosts(x.id) : '';
    return `<button class="it ${cls}" data-id="${x.id}" data-side="${side}">${Icons.svg(x.icon || ICON[x.id] || 'package', { size: 18 })}<span class="t"><span>${esc(x.label)}</span><small>${esc(side === 'r' && DATA.ahead.notes[x.id] && !same ? DATA.ahead.notes[x.id] : x.sub)}</small></span><span class="v">${hist || esc(x.v)}${x.isNew ? `<small style="color:var(--green)">${DATA.text.new}</small>` : !same && other ? `<small>${side === 'r' ? 'was ' + esc(other.v) : DATA.text.changes}</small>` : `<small>${DATA.text.same}</small>`}</span></button>`;
  }).join('');
}
function ghosts(id) {
  const vs = []; stops.forEach(r => { const v = id === 'augur' ? r.v : appsAt(r.v)[id]; if (v && vs[vs.length - 1] !== v) vs.push(v); });
  const cut = vs.indexOf(id === 'augur' ? leftV : appsAt(leftV)[id]); const show = vs.slice(Math.max(0, cut - 4), cut + 1);
  return `<span class="ghosts">${show.map((v, i) => `<span style="--o:${(i + 1) / show.length}">${esc(v)}</span>`).join('')}</span>`;
}
function drawBridges(anim) {
  const svg = $('#br'), box = $('#cols').getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`); svg.innerHTML = '';
  const x0 = $('#L').getBoundingClientRect().right - box.left, x1 = $('#Rp').getBoundingClientRect().left - box.left, mx = (x0 + x1) / 2;
  $$('#Rp .it').forEach(r => {
    const id = r.dataset.id, l = $(`#L .it[data-id="${id}"]`), rb = r.getBoundingClientRect();
    const ry0 = rb.top - box.top + 1, ry1 = rb.bottom - box.top - 1, ryc = (ry0 + ry1) / 2;
    const g = el('g', { class: 'br' + (anim ? ' hide' : ''), 'data-id': id }, svg);
    if (!l) { // new: fans in from nothing
      el('path', { class: 'band', d: `M${mx},${ryc} C${mx + (x1 - mx) / 2},${ryc} ${mx + (x1 - mx) / 2},${ry0} ${x1},${ry0} L${x1},${ry1} C${mx + (x1 - mx) / 2},${ry1} ${mx + (x1 - mx) / 2},${ryc} ${mx},${ryc} Z`, fill: tok('green'), 'fill-opacity': .16, stroke: tok('green'), 'stroke-opacity': .5 }, g);
      el('circle', { cx: mx, cy: ryc, r: 3, fill: tok('green') }, g);
      return; }
    const lb = l.getBoundingClientRect(), ly0 = lb.top - box.top + 1, ly1 = lb.bottom - box.top - 1, lyc = (ly0 + ly1) / 2;
    const same = r.classList.contains('same');
    if (same) { el('path', { d: `M${x0},${lyc} C${mx},${lyc} ${mx},${ryc} ${x1},${ryc}`, fill: 'none', stroke: tok('ink'), 'stroke-opacity': .22, 'stroke-width': 1 }, g); }
    else {
      el('path', { class: 'band', d: `M${x0},${ly0} C${mx},${ly0} ${mx},${ry0} ${x1},${ry0} L${x1},${ry1} C${mx},${ry1} ${mx},${ly1} ${x0},${ly1} Z`, fill: tok('floor-org-high'), 'fill-opacity': .18, stroke: tok('floor-org-high'), 'stroke-opacity': .45, 'stroke-width': 1 }, g);
    }
    // history that happened in between rides on the bridge
    if (!id.startsWith('set') && !id.startsWith('mig')) {
      const b = between(id, leftV, running().v);
      const marks = [...b.scars.map(r => ['scar', r]), ...b.seams.map(r => ['seam', r])];
      marks.forEach(([k, r], i) => { const t = .3 + i * .14, xx = x0 + (x1 - x0) * t, yy = lyc + (ryc - lyc) * (3 * t * t - 2 * t * t * t);
        el('line', { x1: xx, x2: xx, y1: yy - PX('space-3'), y2: yy + PX('space-3'), stroke: k === 'scar' ? `color-mix(in srgb, ${tok('danger')} 55%, ${tok('ink-muted')})` : tok('light'), 'stroke-width': k === 'scar' ? 3 : 2, style: k === 'seam' ? `filter:drop-shadow(0 0 ${tok('space-1')} ${tok('light')})` : '' }, g);
        const tt = el('text', { x: xx, y: yy - PX('space-4'), 'text-anchor': 'middle', style: `font:400 var(--x-type-micro) var(--font-mono);letter-spacing:var(--tracking-caps);fill:var(--ink-muted)` }, g); tt.textContent = r.v; });
    }
  });
  if (anim) $$('#br .br').forEach((g, i) => later(T('instant') * i, () => g.classList.remove('hide')));
}
function cardFor(id) {
  const p = pendingRel(), A = DATA.ahead;
  const s = A.settings.find(x => x.id === id); if (s) return { eyebrow: 'Setting · changes ' + fwd(p.here), title: `${s.label}: ${s.from.toLowerCase()} → ${s.to.toLowerCase()}`, rows: [['Why', `${rname(p.v)} changes the default.`], ['Since', `${s.from} since ${fd(stops[0].here)}.`], ['Keep', s.note], ['Who', `${person(DATA.roles.approver)} or ${person(DATA.roles.alsoApprover)}, in Admin.`]], foot: [['shield-check', 'Seen before it happens, not after']] };
  const m = A.migrations.find(x => x.id === id); if (m) return { eyebrow: 'New · runs in the window', title: m.label, rows: [['What', m.note], ['Why', `${rname(p.v)} rebuilds it for ${appLabel(m.part)}.`], ['When', `${fwd(p.here)} ${DATA.window.start}–${DATA.window.end}`]] };
  const l = items(leftV, 'l').find(x => x.id === id), r = items(p.v, 'r').find(x => x.id === id), b = between(id, leftV, running().v);
  const rows = [['Left', `${l.v} on ${leftV === running().v ? 'now' : fd(rel(leftV).here)}`], ['Right', `${r.v} after ${fwd(p.here)}`]];
  if (A.notes[id] && l.v !== r.v) rows.push(['What', A.notes[id]]);
  if (b.scars.length) rows.push(['Scar', b.scars.map(x => `${x.v} rolled back ${fd(x.here)}`).join('; ')]);
  if (b.seams.length) rows.push(['Seam', b.seams.map(x => `${x.v} ${x.note.toLowerCase()}`).join('; ')]);
  return { eyebrow: l.v === r.v ? 'Stays the same' : 'Changes', title: `${l.label} ${l.v}${l.v === r.v ? '' : ' → ' + r.v}`, rows };
}
function renderScrub() {
  const p = pendingRel(), t0 = D(stops[0].here), t1 = +D(p.here) + 2 * DAY;
  const pos = s => ((D(s) - t0) / (t1 - t0) * 100).toFixed(2) + '%';
  $('#scrub').innerHTML = `<span class="eyebrow">${esc(DATA.text.scrubLabel)}</span><div class="track" role="group" aria-label="Move the left side to a release">
    <div class="rail"></div>${DATA.gaps.map(g => `<i class="gap" style="left:${pos(g.from)};width:calc(${pos(g.to)} - ${pos(g.from)})"></i>`).join('')}
    ${stops.map(r => `<button title="${esc(rname(r.v))} · ${fd(r.here)}" aria-label="${esc(rname(r.v))}" aria-pressed="${r.v === leftV}" data-v="${r.v}" style="left:${pos(r.here)};--h:${r.kind === 'minor' ? 'var(--space-5)' : 'var(--space-3)'};--c:${r.repairs ? 'var(--x-seam)' : 'var(--ink-muted)'}"></button>`).join('')}
    ${DATA.releases.filter(r => r.rollback).map(r => `<i class="nowm" style="left:${pos(r.here)};border-left:3px solid var(--x-scar);top:var(--space-2);bottom:var(--space-2)"></i>`).join('')}
    <i class="nowm" style="left:${pos(DATA.now)}"></i><i class="win" style="left:${pos(p.here)}"></i>
    <div class="knob micro" style="left:${pos(rel(leftV).here)}"><span>${esc(leftV)}</span></div></div>
    <span class="micro">${overlay ? esc(DATA.text.all) : ''}</span>`;
  $$('#scrub .track button').forEach(b => b.onclick = () => setLeft(b.dataset.v));
}
function setLeft(v) { leftV = v; hideWhy(); render(true); }
function render(anim) {
  renderHead();
  $('#L').innerHTML = paneHTML('l'); $('#Rp').innerHTML = paneHTML('r'); renderScrub();
  $$('.it').forEach(b => b.onclick = () => select(b.dataset.id));
  requestAnimationFrame(() => drawBridges(anim));
}
function select(id) {
  pick = id; $$('.it').forEach(b => b.classList.toggle('on', b.dataset.id === id)); $$('#br .br').forEach(g => g.classList.toggle('sel', g.dataset.id === id));
  const r = $(`#Rp .it[data-id="${id}"]`), rb = r.getBoundingClientRect(), gx = $('#L').getBoundingClientRect().right;
  showWhy(r, cardFor(id), { left: gx + PX('space-4'), right: gx + PX('space-4'), top: rb.bottom + PX('space-2'), bottom: rb.bottom + PX('space-2') });
}
addEventListener('keydown', e => {
  const i = stops.findIndex(r => r.v === leftV);
  if (e.key === '[' && i > 0) setLeft(stops[i - 1].v);
  if (e.key === ']' && i < stops.length - 1) setLeft(stops[i + 1].v);
  if (e.key === 'o' || e.key === 'O') { overlay = !overlay; render(false); }
});
document.addEventListener('click', e => { if (!e.target.closest('.why') && !e.target.closest('.it') && !e.target.closest('.need')) { hideWhy(); $$('.it.on').forEach(b => b.classList.remove('on')); } });
function demo() { later(REDUCED ? 0 : T('calm') + T('slow'), () => select(DATA.text.demoPick)); }
boot(() => { leftV = running().v; overlay = false; render(true); }, demo);
</script>
