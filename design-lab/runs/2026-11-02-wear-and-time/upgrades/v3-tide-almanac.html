  --x-past: .62;                 /* needs token: --time-past-opacity, how much quieter the past is than now */
  --x-seam: color-mix(in srgb, var(--light) 78%, transparent);   /* seam: a repair, kept visible */
  --x-scar: color-mix(in srgb, var(--danger) 55%, var(--ink-muted)); /* scar: a rollback, past so muted */

  --x-org-low: var(--floor-org-low);
  --x-head: calc(var(--space-8) - var(--space-2));

.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
svg :focus-visible{outline:none}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.micro{font:400 var(--x-type-micro)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted)}

.x-cap .k{margin-left:var(--space-3);color:var(--ink-muted)}
.x-cap .k b{color:var(--ink)}

/* ---------- Page head: title, the deployment sentence, the one thing that needs you ---------- */
.head{position:fixed;left:0;right:0;top:0;height:var(--x-head);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--space-5);

.head .ttl{display:flex;flex-direction:column;gap:var(--space-1)}
.head h1{margin:0;font:var(--weight-title-s) var(--type-heading)/var(--leading-heading) var(--font-sans);letter-spacing:var(--tracking-title);text-transform:uppercase;color:var(--light);white-space:nowrap}
.head .run{font-size:var(--type-meta);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .run b{font-weight:400;color:var(--ink)}
.need{display:flex;align-items:center;gap:var(--space-3);height:var(--target-sm);padding:0 var(--space-4);border-radius:var(--radius-pill);background:var(--surface-raised);
  border:1px solid color-mix(in srgb,var(--green) 55%,transparent);color:var(--ink);font-size:var(--type-meta);cursor:pointer;white-space:nowrap;
  box-shadow:0 0 var(--glow-blur) color-mix(in srgb,var(--green) 30%,transparent)}  /* bloom: needs you (light language) */
.need .dot{width:var(--space-2);height:var(--space-2);border-radius:50%;background:var(--green);box-shadow:0 0 var(--space-2) var(--green)}
.need small{font:400 var(--x-type-micro)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--green)}

/* ---------- "Why are you like this, and since when?" card, in place ---------- */
.why{position:fixed;z-index:var(--layer-overlay);width:var(--measure-card);padding:var(--space-4) var(--space-4) var(--space-3);border-radius:var(--radius-inset);
  background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));-webkit-backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);box-shadow:var(--shadow-overlay);
  opacity:0;transform:translateY(var(--space-1));pointer-events:none;transition:opacity var(--motion-base) var(--ease-standard),transform var(--motion-base) var(--ease-out)}
.why.on{opacity:1;transform:none;pointer-events:auto}
.why h3{margin:var(--space-1) 0 var(--space-3);font:400 var(--type-body)/var(--leading-body) var(--font-sans);color:var(--light)}
.why dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:var(--space-2) var(--space-3);font-size:var(--type-meta);line-height:var(--leading-meta)}
.why dt{font:400 var(--x-type-micro)/var(--leading-meta) var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.why dd{margin:0;color:var(--ink)}
.why .foot{margin-top:var(--space-3);padding-top:var(--space-2);border-top:1px solid var(--hairline);display:flex;justify-content:space-between;gap:var(--space-3)}
.why .tag{display:inline-flex;align-items:center;gap:var(--space-2)}

/* marks shared by the variants (recipes; the grammar sheet names them) */

.legend{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4)}

.sw{display:inline-block;width:var(--space-4);height:var(--space-3);border-radius:2px}

th{position:sticky;top:0;background:var(--slate-deep);z-index:1;font:400 var(--x-type-micro)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:0 var(--space-3) var(--space-2);border-bottom:1px solid var(--hairline-strong)}
td{padding:0 var(--space-3);height:calc(var(--target-sm) - var(--space-2));border-bottom:1px solid var(--hairline);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:var(--type-small)}
tr.row{cursor:pointer}

tr.past{opacity:var(--x-past)}

// ---------- shared helpers for the Upgrade Centre explorations ----------
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ROOT = getComputedStyle(document.documentElement);
const tok = n => ROOT.getPropertyValue('--' + n).trim();
const T = n => parseFloat(tok('motion-' + n));          // a motion token, in ms
const PX = n => parseFloat(tok(n));                       // a distance token, in px
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const D = s => new Date(s.length <= 10 ? s + 'T12:00' : s);

const DAY = 864e5;
const days = (a, b) => (D(b) - D(a)) / DAY;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fd = s => { const d = D(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const ft = s => { const d = D(s); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const fdt = s => fd(s) + ' · ' + ft(s);
const fwd = s => WD[D(s).getDay()] + ' ' + fd(s);
const minorOf = v => v.split('.').slice(0, 2).join('.');
const bird = v => DATA.birds[minorOf(v)] || '';
const rname = v => v + ' ' + bird(v);
const person = id => DATA.people[id] || id;
const rel = v => DATA.releases.find(r => r.v === v);
const server = id => DATA.servers.find(s => s.id === id);
const appLabel = id => (DATA.apps.find(a => a.id === id) || {}).label || id;
/* how far: "in 3 d 0 h 46 m" or "47 min ago" */
const span = ms => { const m = Math.round(Math.abs(ms) / 6e4), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return d ? `${d} d ${h} h ${mm} m` : h ? `${h} h ${mm} m` : `${mm} min`; };
const until = s => 'in ' + span(D(s) - NOW);
const ago = s => span(NOW - D(s)) + ' ago';
const running = () => { const a = DATA.releases.filter(r => r.state === 'applied' && D(r.here) <= NOW); return a[a.length - 1]; };
const pendingRel = () => rel(DATA.pending.v);
const ageDays = s => Math.round((NOW - D(s)) / DAY);
/* the app versions running after a release (accumulated) */
const appsAt = v => { const o = {}; for (const r of DATA.releases) { if (r.state === 'skipped' || r.state === 'upcoming') { if (r.v === v) break; continue; } if (r.state !== 'rolledback') Object.assign(o, r.apps); if (r.v === v) break; } return o; };

let _timers = [];
const later = (ms, fn) => { const id = setTimeout(fn, ms); _timers.push(id); return id; };
const clearLater = () => { _timers.forEach(clearTimeout); _timers = []; };
const say = m => { const l = $('#live'); if (l) l.textContent = m; };

function renderHead() {
  const cur = running(), p = pendingRel(), A = DATA.app;
  const servers = DATA.servers.length, stale = DATA.servers.filter(s => s.stale);
  $('#head').innerHTML = `
    <div class="ttl"><span class="eyebrow">${esc(A.floor)} · ${esc(A.area)}</span><h1>${esc(A.title)}</h1></div>
    <div class="run">${esc(DATA.deployment.name)} runs <b>${esc(DATA.product)} ${esc(rname(cur.v))}</b> on ${servers} servers since ${fd(cur.here)}${stale.length ? ` · <b>${esc(stale.map(s => s.label).join(', '))}</b> not reporting for ${span(NOW - D(stale[0].stale.since))}` : ''}</div>
    <button class="need" id="need" aria-describedby="needWhy"><span class="dot" aria-hidden="true"></span><small>Needs you</small><span>${esc(DATA.pending.words.replace(p.v, rname(p.v)))}</span><span class="mono" style="color:var(--ink-muted)">by ${WD[D(DATA.pending.approveBy).getDay()]} ${ft(DATA.pending.approveBy)}</span></button>
    <span class="sr" id="needWhy">${esc(DATA.pending.ifWait)}</span>`;
  $('#need').onclick = () => showWhy($('#need'), needCard());
}
function needCard() {
  const p = pendingRel();
  return { eyebrow: 'Needs you · ' + DATA.app.floor, title: `${rname(p.v)} waits for the ${DATA.window.label}`,
    rows: [['Why', `It reached Stable on ${fd(p.stable)}. Upgrades need an approval before the window opens.`],
      ['When', `${fwd(p.here)} ${DATA.window.start}–${DATA.window.end} · ${until(p.here)}. Approve by ${ft(DATA.pending.approveBy)}.`],
      ['If you wait', DATA.pending.ifWait],
      ['Who', `${person(DATA.roles.approver)} approves upgrades; ${person(DATA.roles.alsoApprover)} can too.`]],
    foot: [['calendar-clock', DATA.window.note]] };
}
/* the in-place answer to "why are you like this, and since when?" */
function showWhy(anchor, c, at) {
  const w = $('#why');
  w.innerHTML = `<div class="eyebrow">${esc(c.eyebrow)}</div><h3>${esc(c.title)}</h3><dl>${c.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    ${c.foot ? `<div class="foot micro">${c.foot.map(([i, t]) => `<span class="tag">${Icons.svg(i, { size: 14 })}${esc(t)}</span>`).join('')}</div>` : ''}`;
  const r = at || anchor.getBoundingClientRect(), W = innerWidth, H = innerHeight, g = PX('space-3');
  const ww = w.offsetWidth, wh = w.offsetHeight;
  let x = r.right + g, y = r.top;
  if (x + ww > W - g || (r.prefer === 'left' && r.left - ww - g > g)) x = r.left - ww - g;
  if (x < g) x = Math.min(W - ww - g, Math.max(g, r.left));
  if (x === Math.max(g, r.left) || x < r.right && x + ww > r.left) y = r.bottom + g;
  if (r.above) y = r.top - wh - g;
  if (y + wh > H - PX('space-6')) y = Math.max(PX('space-8'), H - PX('space-6') - wh);
  w.style.left = x + 'px'; w.style.top = y + 'px'; w.classList.add('on');
  say(c.title + '. ' + c.rows.map(r => r.join(': ')).join('. '));
}
const hideWhy = () => $('#why').classList.remove('on');

function boot(render, demo) {
  const go = () => { clearLater(); hideWhy(); render(); Icons.hydrate(); later(T('run'), demo); };   // the moment shows after one --motion-run
  addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') { if (!e.metaKey && !e.ctrlKey) go(); }
    if (e.key === 'Escape') hideWhy();
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { render(); Icons.hydrate(); }, T('base')); });
  go();
}

const NS = 'http://www.w3.org/2000/svg';
const el = (n, a, p) => { const e = document.createElementNS(NS, n); for (const k in a) if (a[k] != null) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const text = (p, x, y, s, cls = '', anchor = 'start') => { const t = el('text', { x, y, class: 'lbl ' + cls, 'text-anchor': anchor, 'dominant-baseline': 'middle' }, p); t.textContent = s; return t; };

/* one row per window, from the deployment's window rule */
function windows() {
  const A = DATA.almanac, rows = [];
  let d = D(A.from); const [hh, mm] = DATA.window.start.split(':').map(Number);
  while (d.getDay() !== DATA.window.dow) d = new Date(+d + DAY);
  d.setHours(hh, mm, 0, 0);
  let n = 0;
  while (n < A.ahead || d < NOW) { if (d > NOW) n++; rows.push(new Date(d)); d = new Date(+d + 7 * DAY); }
  return rows;
}
const sameWin = (w, s) => s && Math.abs(D(s) - w) < 1.5 * 3600e3;
function rowsData() {
  const out = []; let gapRun = null;
  windows().forEach(w => {
    const iso = w.getFullYear() + '-' + String(w.getMonth() + 1).padStart(2, '0') + '-' + String(w.getDate()).padStart(2, '0') + 'T' + DATA.window.start;
    const gap = DATA.gaps.find(g => w > D(g.from) && w < D(g.to));
    if (gap) { if (!gapRun) { gapRun = { kind: 'gap', gap, at: iso, n: 0 }; out.push(gapRun); } gapRun.n++; return; }
    gapRun = null;
    const r = DATA.releases.find(x => sameWin(w, x.here));
    const miss = DATA.missed.find(m => sameWin(w, m.at));
    const est = DATA.releases.find(x => x.state === 'upcoming' && Math.abs(D(x.stable) - w) < 7 * DAY && D(x.stable) < w);
    out.push({ kind: 'win', at: iso, w, r, miss, est, future: w > NOW });
  });
  return out;
}
function rowCard(o) {
  if (o.kind === 'gap') return { eyebrow: 'Unconformity · ' + fd(o.gap.from) + ' to ' + fd(o.gap.to), title: DATA.words.noRecord.replace('{n}', o.n), rows: [['Why', o.gap.why], ['Who', o.gap.who]] };
  if (o.r && o.r.state === 'scheduled') return needCard();
  if (o.miss) { const m = o.miss; return { eyebrow: 'Tide line · ' + fdt(m.at), title: `The window passed with ${rname(m.v)} waiting`, rows: [['Why', m.why], ['Then', `Applied ${fd(rel(m.v).here)}.`], ['Who', m.who]] }; }
  if (o.r && o.r.rollback) { const b = o.r.rollback, fix = DATA.releases.find(x => x.repairs === o.r.v); return { eyebrow: 'Scar · ' + fdt(b.at), title: `${rname(o.r.v)} was rolled back after ${Math.round((D(b.at) - D(o.r.here)) / 6e4)} minutes`, rows: [['Why', b.why], ['High water', `${o.r.peak}${DATA.limits.unit}, the highest mark on the pier`], ['Seam', `${fix.v} repaired it the next week.`], ['Who', person(b.by)]] }; }
  if (o.r) return { eyebrow: (o.r.repairs ? 'Seam · ' : '') + fdt(o.r.here), title: `${DATA.product} ${rname(o.r.v)}`, rows: [['Why', o.r.repairs ? o.r.note : `On Stable since ${fd(o.r.stable)}; applied by ${person(o.r.by)}.`], ['High water', `${o.r.peak}${DATA.limits.unit}${o.r.peak > DATA.limits.watch ? ' · over the watch line' : ''}`], ['Apps', Object.entries(o.r.apps).map(([a, v]) => appLabel(a) + ' ' + v).join(' · ') || 'No app changes']] };
  if (o.est) return { eyebrow: 'Estimate · ' + fwd(o.at), title: `${rname(o.est.v)} could arrive`, rows: [['Why', `On Dev since ${fd(o.est.dev)}. Preview is expected ${fd(o.est.preview)} and Stable ${fd(o.est.stable)}.`], ['Known', 'An estimate: dates move until it reaches Stable.']] };
  return { eyebrow: fwd(o.at), title: o.future ? 'Nothing is due in this window' : 'The window passed quietly', rows: [['Why', o.future ? 'No release is on Stable for it yet.' : 'No release was waiting.'], ['Rule', DATA.window.note]] };
}

let ROWS = [];
function renderTable() {
  const A = DATA.almanac, W = DATA.words, p = pendingRel();
  $('#bookE').textContent = A.eyebrow.replace('{w}', `${DATA.window.label} · ${DATA.window.start}–${DATA.window.end}`);
  $('#bookT').textContent = A.title; $('#bookS').textContent = A.sub;
  ROWS = rowsData();
  let html = `<colgroup><col style="width:22%"><col style="width:24%"><col style="width:22%"><col></colgroup><thead><tr>${DATA.cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>`;
  let nowDone = false;
  ROWS.forEach((o, i) => {
    if (!nowDone && o.future) { nowDone = true; html += `<tr class="now"><td colspan="4" class="mono">${esc(W.ahead.replace('{d}', fwd(DATA.now) + ' ' + ft(DATA.now)).replace('{u}', until(p.here)))}</td></tr>`; }
    if (o.kind === 'gap') { html += `<tr class="row gap past" data-i="${i}" tabindex="0"><td class="n">${fd(o.at)} – ${fd(o.gap.to)}</td><td colspan="3">${esc(W.noRecord.replace('{n}', o.n))} · ${esc(o.gap.why.split('.')[0])}</td></tr>`; return; }
    const r = o.r, cls = ['row', o.future ? 'ahead' : 'past', o.miss ? 'missed' : '', r && r.rollback ? 'scar' : '', r && r.repairs ? 'seam' : '', r && r.state === 'scheduled' ? 'due' : '', o.est ? 'est' : ''].join(' ');
    const peak = r ? (r.state === 'scheduled' ? `<span class="hw fcast" style="width:calc(${r.previewPeak} * var(--space-5))"></span>${r.previewPeak}${DATA.limits.unit} <span style="color:var(--ink-muted)">${W.forecast}</span>` : `<span class="hw ${r.peak > DATA.limits.watch ? 'over' : ''}" style="width:calc(${r.peak} * var(--space-5))"></span>${r.peak}${DATA.limits.unit}`) : '';
    const rel_ = r ? `${Icons.svg(r.kind === 'minor' ? 'circle-dot' : r.kind === 'hotfix' ? 'git-merge' : 'git-commit-horizontal', { size: 14 }).replace('<svg', '<svg class="ic"')}${esc(rname(r.v))}` : o.est ? `${esc(rname(o.est.v))} · ${W.est}` : o.miss ? `<span style="color:var(--ink-muted)">${esc(o.miss.v)} waited</span>` : `<span style="color:var(--ink-muted)">${W.noRelease}</span>`;
    const note = r && r.state === 'scheduled' ? `<span class="pill g">${W.needs}</span> approve by ${ft(DATA.pending.approveBy)} Thu` : r && r.rollback ? `<span class="pill" style="color:var(--x-scar);border-color:var(--x-scar)">${W.rolled}</span> ${esc(server(r.rollback.server).label)} · ${ft(r.rollback.at)}` : r && r.repairs ? `<span class="pill">${W.repair}</span> ${esc(r.repairs)}` : o.miss ? `<span class="pill">${W.missed}</span> approval waiting` : r ? esc(person(r.by)) : o.future ? '' : `<span style="color:var(--ink-muted)">${W.quiet}</span>`;
    html += `<tr class="${cls}" data-i="${i}" tabindex="0"><td class="n">${esc(fwd(o.at))}</td><td>${rel_}</td><td class="n">${peak}</td><td>${note}</td></tr>`;
  });
  $('#tbl').innerHTML = html + '</tbody>';
  $$('#tbl tr.row').forEach(tr => {
    const o = ROWS[+tr.dataset.i];
    const go = () => { $$('#tbl tr.row').forEach(x => x.classList.toggle('on', x === tr)); hilite(o); showWhy(tr, rowCard(o), (() => { const b = tr.getBoundingClientRect(); return { left: b.right - PX('space-2'), right: b.right, top: b.top, bottom: b.bottom, prefer: 'left', above: true }; })()); };
    tr.addEventListener('click', go); tr.addEventListener('keydown', e => { if (e.key === 'Enter') go(); if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const rows = $$('#tbl tr.row'), k = rows.indexOf(tr) + (e.key === 'ArrowDown' ? 1 : -1); if (rows[k]) rows[k].focus(); } });
    tr.addEventListener('mouseenter', () => hilite(o)); tr.addEventListener('mouseleave', () => hilite(null));
  });
}
let PG = null;
function renderPier() {
  const P = DATA.pier, svg = $('#pier'), b = svg.getBoundingClientRect(), W = b.width, H = b.height;
  $('#pierT').textContent = P.title;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = '';
  const px = 0, pw = W * .62, top = PX('space-4'), bot = H - PX('space-4');
  const y = v => bot - Math.sqrt(v / P.max) * (bot - top);   // square-root scale: ordinary weeks stay readable
  PG = { y, pw, px };
  const wg = el('linearGradient', { id: 'water', x1: 0, y1: 0, x2: 0, y2: 1 }, el('defs', {}, svg));
  el('stop', { offset: 0, 'stop-color': tok('navy'), 'stop-opacity': .45 }, wg); el('stop', { offset: 1, 'stop-color': tok('navy'), 'stop-opacity': .12 }, wg);
  // the pier: stone courses
  el('rect', { x: px, y: top - PX('space-3'), width: pw, height: bot - top + PX('space-3'), fill: `color-mix(in srgb, ${tok('ink')} 6%, ${tok('slate-deep')})`, stroke: tok('hairline'), rx: 2 }, svg);
  for (let yy = top + PX('space-6'); yy < bot; yy += PX('space-6')) el('line', { x1: px, x2: px + pw, y1: yy, y2: yy, stroke: tok('hairline'), 'stroke-width': 1 }, svg);
  // painted bands: watch and limit
  [[DATA.limits.watch, 'Watch'], [DATA.limits.limit, 'Limit']].forEach(([v, n]) => {
    el('line', { x1: px, x2: px + pw, y1: y(v), y2: y(v), stroke: n === 'Limit' ? tok('warning') : tok('ink'), 'stroke-opacity': n === 'Limit' ? .5 : .3, 'stroke-width': 1, 'stroke-dasharray': '6 4' }, svg);
    text(svg, px + pw + PX('space-2'), y(v), `${n} ${v}${DATA.limits.unit}`, '', 'start');
  });
  // the water today
  el('rect', { x: px, y: y(P.water), width: pw, height: bot - y(P.water), fill: 'url(#water)' }, svg);
  el('line', { x1: px - PX('space-2'), x2: px + pw + PX('space-2'), y1: y(P.water), y2: y(P.water), stroke: tok('info'), 'stroke-opacity': .7, 'stroke-width': 1.5 }, svg);
  text(svg, px + pw + PX('space-2'), y(P.water) + PX('space-3'), P.waterLabel.replace('{v}', P.water + DATA.limits.unit), 'v');
  // carved marks: every bake; the cluster near the bottom is the wear of ordinary weeks
  const bakes = DATA.releases.filter(r => r.peak != null && r.here && D(r.here) <= NOW);
  const hw = bakes.reduce((a, b) => b.peak > a.peak ? b : a), last = bakes[bakes.length - 1];
  bakes.forEach(r => {
    const age = (NOW - D(r.here)) / (NOW - D(bakes[0].here)), notable = r === hw || r === last || r.peak > DATA.limits.watch;
    const g = el('g', { class: 'mk', 'data-v': r.v }, svg);
    const yy = y(r.peak), len = notable ? pw * .5 : pw * .22;
    el('line', { x1: px + PX('space-3'), x2: px + PX('space-3') + len, y1: yy, y2: yy, stroke: r.rollback ? `color-mix(in srgb, ${tok('danger')} 55%, ${tok('ink-muted')})` : tok('ink'), 'stroke-opacity': notable ? .9 : .25 + .35 * (1 - age), 'stroke-width': notable ? 2 : 1 }, g);
    if (notable) { el('path', { d: `M${px + PX('space-3')},${yy} l-${PX('space-2')},-${PX('space-1')} v${PX('space-2')} z`, fill: tok('ink') }, g);
      text(g, px + PX('space-3'), yy - PX('space-3'), `${fd(r.here)} · ${r.v}`, 'v'); }
  });
  text(svg, px + pw + PX('space-2'), y(hw.peak), `High water ${hw.peak}${DATA.limits.unit}`, 'v');
  // the forecast for the window ahead (drawn by the demo)
  const p = pendingRel(), fy = y(p.previewPeak);
  const fl = el('line', { x1: px + PX('space-3'), x2: px + pw * .75, y1: fy, y2: fy, stroke: tok('green'), 'stroke-width': 1.5, 'stroke-dasharray': '3 3', class: 'fc', style: `--len:${pw}` }, svg);
  const ft_ = el('g', { class: 'fcl' }, svg); text(ft_, px + pw + PX('space-2'), fy, `${p.v} forecast ${p.previewPeak}${DATA.limits.unit}`, 'need'); text(ft_, px + pw + PX('space-2'), fy + PX('space-4'), 'from Preview', '');
}
function hilite(o) {
  $$('#pier .mk').forEach(g => g.classList.toggle('dim', !!(o && o.r && g.dataset.v !== o.r.v)));
}
function render() { renderHead(); renderTable(); renderPier(); const sc = $('.scroll'), nw = $('#tbl tr.now'); sc.scrollTop = nw.offsetTop - sc.clientHeight * .55; }
function demo() {
  const f = $('#pier .fc'); requestAnimationFrame(() => requestAnimationFrame(() => { f.classList.add('on'); $('#pier .fcl').classList.add('on'); }));
  later(REDUCED ? T('base') : T('calm') + T('slow'), () => { const tr = $('#tbl tr.due'); if (tr) tr.click(); });
}
document.addEventListener('click', e => { if (!e.target.closest('.why') && !e.target.closest('tr.row') && !e.target.closest('.need')) hideWhy(); });
boot(render, demo);
</script>
