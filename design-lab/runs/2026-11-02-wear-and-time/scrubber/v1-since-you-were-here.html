function at(obj,t){if(!obj.h||obj.h[0].t>t)return null;const s={id:obj.id};for(const e of obj.h){if(e.t>t)break;Object.assign(s,e.s)}s.born=obj.h[0].t;s.last=obj.h.filter(e=>e.t<=t).pop().t;return s}
function prep(list){list.forEach(o=>{o.h.forEach(e=>e.t=T(e.t));o.h.sort((a,b)=>a.t-b.t)});return list}

/* the rail: one time axis for a whole view. Wear ticks, your last visit, the now line, distance to travel. */
function Rail(host,o){
  const x=t=>((t-o.start)/(o.end-o.start)*100).toFixed(3)+'%';
  let h='<div class="track" tabindex="0" role="slider" aria-label="Time in this view" aria-valuemin="'+o.start+'" aria-valuemax="'+o.now+'"><div class="base"></div>';
  for(let d=new Date(o.start);d<=o.end;d.setDate(d.getDate()+1)){const t=+d,wk=d.getDay()===1;
    h+='<div class="day'+(wk?' wk':'')+'" style="left:'+x(t)+'">'+((o.label||(d=>d.getDay()%2===1))(d)&&t-o.start>(o.end-o.start)*.02&&o.end-t>(o.end-o.start)*.02?'<span>'+DN[d.getDay()]+' '+d.getDate()+'</span>':'')+'</div>'}
  if(o.last)h+='<div class="since" style="left:'+x(o.last)+';width:calc('+x(o.now)+' - '+x(o.last)+')"><span class="micro">'+esc(o.sinceLabel||'')+'</span></div>';
  /* wear: one tick per event, stacking where events cluster */
  const bins={};(o.events||[]).forEach(e=>{const k=Math.round((e.t-o.start)/(3*H));bins[k]=(bins[k]||0)+1;
    h+='<div class="wear'+(e.need?' need':'')+'" style="left:'+x(e.t)+';height:calc('+Math.min(bins[k],5)+' * var(--space-1) + var(--space-1))"></div>'});
  h+='<div class="future" style="left:'+x(o.now)+';right:0"></div>';
  const nf=(o.future||[]).length;(o.future||[]).forEach((f,i)=>h+='<div class="tide" style="left:'+x(f.t)+';height:calc(var(--space-5) * '+(nf-i)+')"><span><b>'+esc(f.label)+'</b>in '+fSpan(f.t-o.now)+'</span></div>');
  h+='<div class="nowline" style="left:'+x(o.now)+'"><span>NOW</span></div>';
  if(o.last)h+='<div class="mark" style="left:'+x(o.last)+'" title="Your last visit"><span class="micro">'+esc(o.markLabel||'')+'</span></div>';
  h+='<div class="head" style="left:'+x(o.now)+'"><span></span></div></div>';
  host.innerHTML=h;
  const tr=$('.track',host),hd=$('.head',host),lb=$('.head span',host);
  const api={t:o.now,
    set(t,live){t=Math.max(o.start,Math.min(o.max||o.now,t));api.t=t;hd.classList.toggle('live',!!live);hd.style.left=x(t);
      const atnow=Math.abs(t-o.now)<6e4;hd.classList.toggle('atnow',atnow);lb.textContent=atnow?'Now · '+fTime(t):fWhen(t);
      tr.setAttribute('aria-valuenow',t);tr.setAttribute('aria-valuetext',atnow?'Now':fWhen(t));o.onScrub&&o.onScrub(t,live)},
    x};
  const fromEv=e=>{const r=tr.getBoundingClientRect();return o.start+(e.clientX-r.left)/r.width*(o.end-o.start)};
  tr.addEventListener('pointerdown',e=>{RUN++;tr.setPointerCapture(e.pointerId);api.set(fromEv(e),true);
    const mv=e=>api.set(fromEv(e),true),up=()=>{tr.removeEventListener('pointermove',mv);tr.removeEventListener('pointerup',up);hd.classList.remove('live');o.onRelease&&o.onRelease(api.t)};
    tr.addEventListener('pointermove',mv);tr.addEventListener('pointerup',up)});
  return api}

const NOW=T(DATA.now),LAST=T(DATA.lastVisit);
prep(DATA.items);
$('#flKind').textContent=DATA.floor.kind;$('#flName').textContent=DATA.floor.name;
/* every change after your last visit is a keyframe */
const EVS=DATA.items.flatMap(o=>o.h.filter(e=>e.s.ev).map(e=>({t:e.t,id:o.id,text:e.s.ev,need:/need|urgent/.test(e.s.cls||'')}))).sort((a,b)=>a.t-b.t);
const SINCE=EVS.filter(e=>e.t>LAST&&e.t<=NOW);
const kindOf={need:'need you',docs:'documents',intents:'intents'};
const rail=Rail($('#rail'),{start:T(DATA.start),end:T(DATA.end),now:NOW,last:LAST,events:EVS,
  future:DATA.future.map(f=>({t:T(f.t),label:f.label})),
  sinceLabel:'',markLabel:'You were here · '+SINCE.length+' changes since',
  onScrub:(t,live)=>{if(live){render(t);tick(null)}}});
let prev={};
function render(t,flash){
  const past=NOW-t>6e4;document.body.classList.toggle('past',past);
  const tc=$('#tchip');tc.classList.toggle('past',past);
  $('span',tc).innerHTML=past?'Viewing <b>'+fWhen(t)+'</b> · '+fSpan(NOW-t)+' ago':'<b>Now</b> · '+fWhen(t);
  const seen=SINCE.filter(e=>e.t<=t);
  $('#sumEb').textContent=past&&t<=LAST?'As it was on your last visit':'Since you were here · '+fWhen(LAST);
  $('#sumH').innerHTML=t<=LAST?'This is what you saw. <b>'+SINCE.length+'</b> changes came after.':
    '<b>'+Math.round((t-LAST)/DAY)+' days</b> · <b>'+seen.length+'</b> changes · <b>'+DATA.items.filter(o=>{const s=at(o,t);return s&&/need|urgent/.test(s.cls)}).length+'</b> need you';
  const per={};seen.forEach(e=>{const c=DATA.items.find(o=>o.id===e.id).col;per[c]=(per[c]||0)+1});
  $('#kinds').innerHTML=DATA.columns.map(c=>'<span><b>'+(per[c.id]||0)+'</b> '+esc(c.label)+'</span>').join('');
  $('#cols').innerHTML=DATA.columns.map(c=>{
    const rows=DATA.items.filter(o=>o.col===c.id).map(o=>({o,s:at(o,t)})).filter(r=>r.s);
    return '<section class="col"><h2><b>'+esc(c.label)+'</b> '+rows.length+'</h2><div class="list">'+rows.map(({o,s})=>{
      const chg=o.h.filter(e=>e.t>LAST&&e.t<=t).pop();
      const then=at(o,LAST),was=chg&&then&&t>LAST?'<div class="was"><i>When you left</i>'+then.meta.replace(/<em>|<\/em>/g,'')+'</div>':'';
      const tag=chg?(o.h[0].t>LAST?'New ':'Changed ')+fShort(chg.t):'';
      const fl=flash&&prev[o.id]!==s.last&&chg?' flicker':'';
      const cls=(s.cls||'')+(s.cls==='need'&&!past?' bloom':'')+(chg?' chg':'');
      return '<button class="row '+cls+fl+'" title="'+esc(s.title)+(chg?' · '+esc(chg.s.ev):'')+'"><span class="ic"><i data-lucide="'+o.icon+'" data-size="18"></i></span><span style="min-width:0"><div class="t">'+esc(s.title)+'</div><div class="m">'+s.meta+'</div>'+was+'</span>'+(tag?'<span class="since">'+tag+'</span>':'')+'</button>'}).join('')+'</div></section>'}).join('');
  DATA.items.forEach(o=>{const s=at(o,t);prev[o.id]=s&&s.last});
  Icons.hydrate($('#cols'));
}
function tick(e){$('#ticker').innerHTML=e?'<span class="micro">'+fWhen(e.t)+'</span><b>'+esc(e.text)+'</b>':''}
function go(t,flash){rail.set(t);render(t,flash);const e=[...EVS].reverse().find(e=>e.t<=t&&e.t>LAST);tick(Math.abs(t-NOW)<6e4?null:e)}
async function demo(){const id=++RUN;go(NOW);tick(null);$('#bSince').classList.add('on');
  if(!await wait(ms('--motion-run'),id))return;
  go(LAST);tick({t:LAST,text:'Your last visit. Playing forward.'});
  if(!await wait(ms('--motion-slow'),id))return;
  const days=[...new Set(SINCE.map(e=>new Date(e.t).toDateString()))];
  for(const d of days){const last=SINCE.filter(e=>new Date(e.t).toDateString()===d).pop();go(last.t,true);if(!await wait(ms('--motion-quick'),id))return}
  go(NOW);tick({t:NOW,text:SINCE.length+' changes landed. Each one keeps a quiet mark until you open it.'});
}
document.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){demo();return}
  const t=rail.t;let n=null;
  if(e.key==='ArrowLeft')n=t-H;else if(e.key==='ArrowRight')n=t+H;
  else if(e.key==='[')n=([...EVS].reverse().find(v=>v.t<t-1e3)||{t:T(DATA.start)}).t;
  else if(e.key===']')n=(EVS.find(v=>v.t>t+1e3)||{t:NOW}).t;
  else if(e.key==='s'||e.key==='S')n=LAST;else if(e.key==='n'||e.key==='N'||e.key==='End')n=NOW;
  else if(e.key===' '){e.preventDefault();demo();return}
  if(n!==null){e.preventDefault();RUN++;go(Math.min(n,NOW),true)}});
$('#bSince').onclick=()=>{RUN++;go(LAST)};$('#bNow').onclick=()=>{RUN++;go(NOW)};
go(NOW);demo();
</script>
</body>
</html>
