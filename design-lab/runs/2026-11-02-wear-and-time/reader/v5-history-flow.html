<style>
/* ---------------------------------------------------------------
   Proposed tokens (time language, see ../grammar/v1-time-language.html).
   Each is "needs token" in notes.md. All are combinations of kit tokens.
   --------------------------------------------------------------- */
:root{
  --x-seam: color-mix(in srgb, var(--warning) 55%, var(--ink));          /* proposed --mark-seam: repair gold, never "warning" */
  --x-wear: color-mix(in srgb, var(--ink) 55%, transparent);             /* proposed --mark-wear: matter, never light */
  --x-wear-read: color-mix(in srgb, var(--ink-muted) 45%, transparent);  /* proposed --mark-wear-read */
  --x-tide: color-mix(in srgb, var(--ink-muted) 60%, transparent);       /* proposed --mark-tide: a past date left behind */
  --x-now: color-mix(in srgb, var(--light) 80%, transparent);            /* proposed --mark-now: the one now line */
  --x-hatch: color-mix(in srgb, var(--ink-muted) 26%, transparent);      /* proposed --mark-stale-hatch ink */
  --x-stale: repeating-linear-gradient(45deg, transparent 0 var(--space-2), var(--x-hatch) var(--space-2) calc(var(--space-2) + 1px)); /* 45deg: shadow (unavailable) is 135deg */
  --x-past-dim: .62;                                                      /* proposed --time-past-dim: past is quieter than now */
  --x-margin: var(--space-8);
  --x-aside: var(--measure-drawer);
  --f-department: var(--floor-department-high);
  --f-team: var(--floor-team-high);
  --f-org: var(--floor-org-high);
  --f-you: var(--floor-you-high);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}

.water{position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 50% 115%, color-mix(in srgb, var(--navy) 42%, transparent), transparent 70%)}

.band-r{margin-left:auto;display:flex;align-items:center;gap:var(--space-4);font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}

.stage{position:fixed;top:var(--band-top);left:0;right:0;bottom:0}
.reader{position:absolute;top:0;bottom:0;left:0;right:var(--x-aside);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
body.noaside{--x-aside:0px}
.page{position:relative;width:calc(var(--measure-read) + 2 * var(--x-margin));margin:0 auto;padding:var(--space-6) 0 var(--space-8)}
.row{position:relative;display:grid;grid-template-columns:var(--x-margin) var(--measure-read) var(--x-margin)}
.ml,.mr{position:relative;min-width:0}
.tx{margin:0;min-width:0}
.dhead .tx{padding-bottom:var(--space-5);border-bottom:1px solid var(--hairline);margin-bottom:var(--space-5)}
.dhead h1{margin:var(--space-2) 0 var(--space-2);font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-soft);color:var(--light)}

.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);background:var(--surface-inset);font-size:var(--type-meta);white-space:nowrap;transition:background var(--motion-quick)}

/* floor colours for people */
[data-floor="department"]{--fc:var(--f-department)}
[data-floor="team"]{--fc:var(--f-team)}
[data-floor="org"]{--fc:var(--f-org)}

/* tip: in-place "why and since when" */
.tip{position:fixed;z-index:var(--layer-overlay);max-width:var(--measure-card);padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);box-shadow:var(--shadow-overlay);font-size:var(--type-meta);line-height:var(--leading-meta);pointer-events:none;opacity:0;transform:translateY(var(--space-1));transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out)}
.tip.on{opacity:1;transform:none}
.tip .eyebrow{display:block;margin-bottom:var(--space-1)}
.tip .l{display:flex;gap:var(--space-2);align-items:baseline;color:var(--ink-muted)}

</style>
<style>

.acts{display:flex;gap:var(--space-2);flex-wrap:wrap}
.btn.on{border-color:color-mix(in srgb, var(--f-you) 50%, transparent);color:var(--light)}

.flow-key span{display:inline-flex;align-items:center;gap:var(--space-2)}
.flow-key i{display:block;width:var(--space-3);height:var(--space-2);border-radius:1px;background:color-mix(in srgb, var(--fc) 52%, transparent)}
.flow-key i.u{height:0;border-top:1px dashed var(--ink-muted);background:none}
/* the page in the past: quieter, and says so */
.reader{transition:filter var(--motion-slow) var(--ease-standard)}
body.past .reader{filter:saturate(.55) brightness(.9)}
.pastbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--space-3);margin:0 auto;width:calc(var(--measure-read) + 2 * var(--x-margin));padding:var(--space-2) var(--space-3);border-radius:0 0 var(--radius-inset) var(--radius-inset);background:var(--surface-bar);border:1px solid var(--hairline-strong);border-top:0;font-size:var(--type-meta);color:var(--ink);transform:translateY(-110%);opacity:0;transition:transform var(--motion-base) var(--ease-out),opacity var(--motion-base)}
body.past .pastbar{transform:none;opacity:1}
.pastbar .grow{flex:1}
.pastbar b{font-weight:400;color:var(--light)}
.prow p{transition:opacity var(--motion-base)}
.prow.diff .ml::after{content:attr(data-d);position:absolute;right:var(--space-4);top:var(--space-1);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);white-space:nowrap}
.prow.diff .ml::before{content:"";position:absolute;right:var(--space-3);top:var(--space-1);bottom:var(--space-4);width:1px;background:var(--hairline-strong)}
.prow.swap p{opacity:.15}
mark{background:color-mix(in srgb, var(--ink) 12%, transparent);color:inherit;border-radius:2px;padding:0 2px}
</style>
</head>
<body class="">
<div class="water" aria-hidden="true"></div>
<header class="band" id="band"></header>

  <div class="reader" id="reader"><article class="page" id="page"></article></div>

</main>

<div class="hints"><span><span class="kbd">←</span><span class="kbd">→</span> versions</span><span><span class="kbd">Y</span> since my last visit</span><span><span class="kbd">End</span> now</span> <span><span class="kbd">R</span> replay</span></div>

<script>
/* ===== Sample data: every name, label and count on this page comes from here. ===== */
const DATA = {
  now: '2026-11-02',
  app: 'Artifacts',
  orgName: 'Org',
  floor: { kind: 'department', name: 'Finance' },

    jm: { name: 'Jonas Meyer', floor: 'team', role: 'Editor, Field Operations' },
    al: { name: 'Ade Lawal', floor: 'org', role: 'Org compliance' }
  },
  audience: { groups: [ { floor: 'department', name: 'Finance', n: 22 }, { floor: 'team', name: 'Field Operations', n: 16 } ] },
  privacy: { minGroup: 5, namesNeedConsent: true },       /* a question for Harry, not a decision */
  readTrackingSinceAgo: 500,                              /* read events only exist from here: older is an unconformity */
  historyKeptSinceAgo: 900,                               /* imported from the old intranet; nothing older survives */
  doc: { kind: 'Policy', title: 'Travel and expenses policy', owner: 'pr', status: 'Published' },
  sections: [
    { id: 's1', title: 'Purpose', reviewedAgo: 120, reviewEvery: 365, refresh: 'pr', readSince: { department: 18, team: 13 },
      edits: [[900,'pr','write'],[610,'pr','edit']],
      paras: [
        { id: 'p1', read: .92, edit: .10, ret: 4, t: 'This policy sets out how we book, pay for and claim back travel and expenses for work. It applies the same rules to everyone and keeps spending visible to the people who approve it.' },
        { id: 'p2', read: .55, edit: .25, ret: 2, t: 'Where this policy and a local agreement disagree, the stricter rule applies until the policy owner says otherwise.' } ] },
    { id: 's2', title: 'Who this applies to', reviewedAgo: 120, reviewEvery: 365, refresh: 'pr', readSince: { department: 16, team: 11 },
      edits: [[900,'pr','write'],[400,'al','edit'],[210,'al','edit']],
      paras: [
        { id: 'p1', read: .45, edit: .50, ret: 3, t: 'Everyone who travels or spends money on behalf of the department, including contractors with a purchase order. Guests we invite are covered by section 7.' },
        { id: 'p2', read: .30, edit: .30, ret: 1, t: 'Team leads make sure new starters read this policy in their first week.' } ] },
    { id: 's3', title: 'Booking travel', reviewedAgo: 75, reviewEvery: 365, refresh: 'jm', readSince: { department: 13, team: 9 },
      edits: [[900,'pr','write'],[200,'jm','edit'],[75,'jm','correction']],
      paras: [
        { id: 'p1', read: .85, edit: .60, ret: 19, t: 'Book rail travel at least {14 days} ahead where you can, and choose standard class unless the journey is longer than three hours.',

          history: [[900,'Book rail travel at least 7 days ahead where you can, and choose standard class.'],[200,'Book rail travel at least 7 days ahead where you can, and choose standard class unless the journey is longer than three hours.']] },
        { id: 'p2', read: .70, edit: .30, ret: 11, t: 'Flights need approval before booking. Ask the travel desk for two quotes and attach both to the request.' },
        { id: 'p3', read: .40, edit: .45, ret: 6, t: 'Hotels should be within the city cap in the allowance table. If none is available, book the nearest option and note why.' } ] },
    { id: 's4', title: 'Daily allowances', reviewedAgo: 9, reviewEvery: 365, refresh: 'sk', readSince: { department: 4, team: 2 }, readBefore: 31, changedSinceYou: true,
      edits: [[900,'pr','write'],[300,'pr','edit'],[40,'sk','edit'],[9,'sk','correction']],
      paras: [
        { id: 'p1', read: .97, edit: .85, ret: 46, t: 'The daily allowance for an overnight stay is {€54}, which covers breakfast, dinner and incidental costs. Lunch is covered only when you are away from your usual place of work for more than five hours.',
          seam: { ago: 9, who: 'sk', was: '€45', why: 'The figure was transposed when the new year’s rate table was copied in. €45 was never the approved rate.' },
          history: [[900,'The daily allowance for an overnight stay is €42, which covers breakfast, dinner and incidental costs.'],[300,'The daily allowance for an overnight stay is €48, which covers breakfast, dinner and incidental costs. Lunch is covered only when you are away for more than five hours.'],[40,'The daily allowance for an overnight stay is €45, which covers breakfast, dinner and incidental costs. Lunch is covered only when you are away from your usual place of work for more than five hours.']] },
        { id: 'p2', read: .60, edit: .35, ret: 9, t: 'Allowances are paid with your next salary run. You do not need receipts for the allowance itself, only for costs above it.' } ] },
    { id: 's5', title: 'Approvals', reviewedAgo: 30, reviewEvery: 365, refresh: 'pr', readSince: { department: 9, team: 5 }, readBefore: 26, changedSinceYou: true,
      edits: [[900,'pr','write'],[200,'jm','edit'],[190,'al','edit'],[185,'jm','edit'],[180,'al','edit'],[60,'pr','edit'],[45,'jm','edit'],[44,'al','edit'],[30,'pr','edit']],
      paras: [
        { id: 'p1', read: .50, edit: .98, ret: 14, t: 'Any single cost above €1,000 needs approval from your budget holder before you commit to it. Below that, your line manager approves.',
          history: [[900,'Any single cost above €500 needs approval from your budget holder.'],[200,'Any single cost above €1,000 needs approval from your budget holder.'],[190,'Any single cost above €500 needs approval from your budget holder.'],[185,'Any single cost above €1,000 needs approval from your budget holder.'],[180,'Any single cost above €500 needs approval from your budget holder.'],[60,'Any single cost above €750 needs approval from your budget holder before you commit to it.'],[45,'Any single cost above €1,000 needs approval from your budget holder before you commit to it.'],[44,'Any single cost above €750 needs approval from your budget holder before you commit to it.']] },
        { id: 'p2', read: .35, edit: .40, ret: 3, t: 'Approvals are recorded against the request, so anyone in the approval chain can see who agreed and when.' } ] },
    { id: 's6', title: 'Claiming and receipts', reviewedAgo: 430, reviewEvery: 180, refresh: 'jm', readSince: { department: 17, team: 13 },

};

/* ===== helpers ===== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const root = document.documentElement;
const tok = n => getComputedStyle(root).getPropertyValue(n).trim();
const ms = n => parseFloat(tok(n)) || 0;
const px = n => { const v = tok(n); return v.endsWith('rem') ? parseFloat(v) * 16 : parseFloat(v) || 0; };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NOW = new Date(DATA.now + 'T12:00:00');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dateOf = ago => { const d = new Date(NOW); d.setDate(d.getDate() - ago); return d; };
const fdate = ago => { const d = dateOf(ago); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const span = d => { d = Math.abs(d); if (d < 1) return 'today'; if (d < 14) return d + (d === 1 ? ' day' : ' days'); if (d < 60) return Math.round(d / 7) + ' weeks'; if (d < 540) return Math.round(d / 30.4) + ' months'; return (Math.round(d / 36.5) / 10) + ' years'; };
const ago = d => d < 1 ? 'today' : span(d) + ' ago';
const person = id => id === 'you' ? DATA.you : DATA.people[id];
const audienceTotal = () => DATA.audience.groups.reduce((a, g) => a + g.n, 0);
const lastChange = s => Math.min(...s.edits.map(e => e[0]));
const lastEdit = s => s.edits.reduce((a, e) => e[0] < a[0] ? e : a);
const docChanged = () => Math.min(...DATA.sections.map(lastChange));
const versions = () => [...new Set(DATA.sections.flatMap(s => s.edits.map(e => e[0])))].sort((a, b) => b - a);
const readSinceTotal = s => Object.values(s.readSince).reduce((a, b) => a + b, 0);
const dueIn = s => s.reviewEvery - s.reviewedAgo;            /* negative: overdue */
const seamHTML = (p, cls = 'fix') => p.t.replace(/\{([^}]*)\}/g, (_, w) => `<span class="${cls}" data-fix="${p.id}">${w}</span>`);
const plain = t => t.replace(/[{}]/g, '');
const wait = t => new Promise(r => setTimeout(r, RM ? Math.min(t, ms('--motion-instant')) : t));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sid = (s, p) => s.id + '-' + p.id;

/* band */
function renderBand() {
  const o = person(DATA.doc.owner);
  $('#band').innerHTML = `
    <span class="app-name">${esc(DATA.app)}</span>
    <span class="fchip" data-floor="${DATA.floor.kind}">${esc(DATA.floor.name)}</span>
    <nav class="crumbs" aria-label="Breadcrumb">${esc(DATA.library)} <i data-lucide="chevron-right" data-size="14"></i> <b>${esc(DATA.doc.title)}</b></nav>
    <div class="band-r"><span>Version ${versions().length}</span><span>${esc(DATA.doc.status)}</span><span class="me" title="${esc(DATA.you.name)}">${esc(DATA.you.initials)}</span></div>`;
}

/* document */
function renderDoc(opts = {}) {
  const o = person(DATA.doc.owner);
  let h = `<header class="row dhead"><div class="ml"></div><div class="tx">
      <div class="eyebrow">${esc(DATA.doc.kind)} · ${esc(DATA.library)}</div>
      <h1>${esc(DATA.doc.title)}</h1>
      <div class="dmeta"><span>Owner <b>${esc(o.name)}</b></span><span>Changed <b>${ago(docChanged())}</b></span><span>Audience <b>${audienceTotal()}</b></span>${opts.meta || ''}</div>
    </div><div class="mr"></div></header>`;
  DATA.sections.forEach((s, i) => {
    h += `<section class="sec" id="${s.id}" data-sid="${s.id}"><div class="row hrow"><div class="ml"></div><h2 class="tx"><span class="n">${i + 1}</span>${esc(s.title)}</h2><div class="mr"></div></div>`;
    s.paras.forEach(p => { h += `<div class="row prow" data-pid="${sid(s, p)}"><div class="ml"></div><p class="tx">${seamHTML(p)}</p><div class="mr"></div></div>`; });
    h += `</section>`;
  });
  $('#page').innerHTML = h;
}

/* tip */
function tip(html, x, y, place = 'left', maxW) {
  const t = $('#tip'); t.innerHTML = html; Icons.hydrate(t); t.style.maxWidth = maxW ? maxW + 'px' : '';
  const r = t.getBoundingClientRect(), W = innerWidth, H = innerHeight, g = px('--space-3');
  let L = place === 'left' ? x - r.width - g : place === 'below' ? x - r.width / 2 : x + g, T = place === 'below' ? y + g : y - r.height / 2;
  L = Math.max(g, Math.min(W - r.width - g, L)); T = Math.max(px('--band-top') + g, Math.min(H - r.height - g * 4, T));
  t.style.left = L + 'px'; t.style.top = T + 'px'; t.classList.add('on');
}
/* room between the text column and a right-hand x */
const roomRight = x => x - $('#page .prow .tx').getBoundingClientRect().right - px('--space-3');
const untip = () => $('#tip').classList.remove('on');

/* demo runner: shows its moment ~1.2 s after load; R replays */
let RUN = 0;
async function play() {
  const my = ++RUN; const alive = () => my === RUN;
  untip(); if (typeof reset === 'function') reset();
  await wait(ms('--motion-run'));
  if (alive() && typeof demo === 'function') await demo(alive);
}
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea')) return;
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); play(); }
  if (e.key === 'Escape') untip();
});
function boot() { renderBand(); if (typeof setup === 'function') setup(); Icons.hydrate(); play(); }

/* ===== variant ===== */
const V = versions();                     /* days ago, oldest first */
let CUR = V.length - 1, YOU = -1, FX = [];
const curAgo = (s, p) => p.seam ? p.seam.ago : p.history ? lastChange(s) : DATA.historyKeptSinceAgo;
function textAt(s, p, a) {
  const c = [...(p.history || []), [curAgo(s, p), plain(p.t)]].filter(e => e[0] >= a);
  return c.length ? c[c.length - 1][1] : '';
}
const editorAt = (s, a) => { const e = s.edits.filter(e => e[0] >= a); return e[e.length - 1]; };
function setup() {
  renderDoc();
  $('#page').insertAdjacentHTML('beforebegin', `<div class="pastbar" id="pastbar"><i data-lucide="history" data-size="16"></i><span class="grow" id="pasttext"></span><button class="btn" onclick="setV(V.length - 1)">Back to now <span class="kbd">End</span></button></div>`);
  YOU = V.reduce((b, a, i) => a >= DATA.you.lastReadAgo ? i : b, 0);
  $('h3', $('#aside')).textContent = `${V.length} versions in one picture`;
  const sc = $('#scrub'); sc.max = V.length - 1; sc.value = CUR;
  sc.addEventListener('input', () => setV(+sc.value));
  $('#since').addEventListener('click', () => setV(YOU));
  $('#tonow').addEventListener('click', () => setV(V.length - 1));
  document.addEventListener('keydown', e => {
    if (e.target === sc) return;
    if (e.key === 'ArrowLeft') setV(Math.max(0, CUR - 1)); if (e.key === 'ArrowRight') setV(Math.min(V.length - 1, CUR + 1));
    if (e.key === 'End') setV(V.length - 1); if (e.key === 'Home') setV(0); if (e.key === 'y' || e.key === 'Y') setV(YOU);
  });
  const fl = [...new Set(Object.values(DATA.people).map(p => p.floor))];
  $('#fkey').innerHTML = fl.map(f => `<span><i data-floor="${f}"></i>${esc((DATA.audience.groups.find(g => g.floor === f) || { name: DATA.orgName }).name)}</span>`).join('') + `<span><i class="u"></i>no record before ${fdate(DATA.historyKeptSinceAgo)}</span>`;
  drawFlow(); addEventListener('resize', drawFlow);
  setV(CUR, true);
}
function drawFlow() {
  const box = $('#flow'), W = box.clientWidth, H = Math.min(innerHeight * .42, px('--measure-card')), padL = px('--space-4'), padR = px('--space-5'), top = px('--space-5');
  const len = V.map(a => DATA.sections.map(s => s.paras.reduce((n, p) => n + textAt(s, p, a).length, 0)));
  const max = Math.max(...len.map(l => l.reduce((a, b) => a + b, 0))), gap = px('--space-2'), k = (H - gap * DATA.sections.length) / max;
  const step = (W - padL - padR) / (V.length - 1), cw = Math.max(2, step * .14), xs = V.map((a, i) => padL + i * step);
  FX = xs;
  let h = '', ys = len.map(l => { let y = top; return l.map(n => { const r = [y, y + n * k]; y += n * k + gap; return r; }); });
  /* links between versions, then bands */
  for (let i = 0; i < V.length - 1; i++) DATA.sections.forEach((s, j) => {
    const a = ys[i][j], b = ys[i + 1][j], f = person(editorAt(s, V[i])[1]).floor;
    h += `<path class="link" data-floor="${f}" d="M${xs[i] + cw / 2},${a[0]} L${xs[i + 1] - cw / 2},${b[0]} L${xs[i + 1] - cw / 2},${b[1]} L${xs[i] + cw / 2},${a[1]} Z"/>`;
  });
  V.forEach((a, i) => DATA.sections.forEach((s, j) => {
    const e = editorAt(s, a), y = ys[i][j];
    h += `<rect class="band ${e[0] === a && e[2] === 'correction' ? 'fix' : ''}" data-floor="${person(e[1]).floor}" x="${xs[i] - cw / 2}" y="${y[0]}" width="${cw}" height="${Math.max(1, y[1] - y[0])}"/>`;
  }));
  /* unconformity: nothing before the first kept version */
  let w = '', x0 = padL - cw;
  for (let y = top; y <= top + H; y += 6) w += `${w ? 'L' : 'M'}${x0 + ((y / 6) % 2 ? 2 : -2)},${y}`;
  h += `<path class="unc" d="${w}"/>`;
  DATA.sections.forEach((s, j) => { const y = ys[V.length - 1][j]; h += `<text class="lbl" x="${xs[V.length - 1] + px('--space-3')}" y="${(y[0] + y[1]) / 2 + 4}">${j + 1}</text>`; });
  h += `<line class="you" x1="${xs[YOU]}" y1="${top - px('--space-1')}" x2="${xs[YOU]}" y2="${top + H + px('--space-2')}"/><text class="lbl you-l" x="${xs[YOU]}" y="${top - px('--space-2')}" text-anchor="end">you were here </text>`;
  h += `<line class="now" x1="${xs[V.length - 1] + cw}" y1="${top - px('--space-1')}" x2="${xs[V.length - 1] + cw}" y2="${top + H + px('--space-2')}"/><text class="lbl" x="${xs[V.length - 1] + cw}" y="${top + H + px('--space-5')}" text-anchor="end">now</text>`;
  h += `<text class="lbl" x="${padL}" y="${top + H + px('--space-5')}">${fdate(V[0]).slice(-8)}</text>`;
  h += `<g id="curg"><line class="cur" x1="0" y1="0" x2="0" y2="${top + H}"/><circle class="knob" cx="0" cy="${top + H}" r="5"/></g>`;
  h += V.map((a, i) => `<rect class="hit" data-i="${i}" x="${xs[i] - step / 2}" y="0" width="${step}" height="${top + H}"><title>Version ${i + 1}, ${fdate(a)}</title></rect>`).join('');
  box.innerHTML = `<svg height="${top + H + px('--space-6')}" viewBox="0 0 ${W} ${top + H + px('--space-6')}" role="img" aria-label="History flow: sections as bands, versions left to right, coloured by who changed them">${h}</svg>`;
  $$('.hit', box).forEach(r => r.addEventListener('click', () => setV(+r.dataset.i)));
  moveCur();
}
function moveCur() { const g = $('#curg'); if (g) g.setAttribute('transform', `translate(${FX[CUR]},0)`); }
function setV(i, quiet) {
  CUR = i; $('#scrub').value = i; moveCur();
  const a = V[i], isNow = i === V.length - 1, changed = DATA.sections.flatMap(s => s.edits.filter(e => e[0] === a).map(e => ({ s, e })));
  document.body.classList.toggle('past', !isNow);
  $('#since').classList.toggle('on', i === YOU);
  DATA.sections.forEach(s => s.paras.forEach(p => {
    const row = $(`[data-pid="${sid(s, p)}"]`), t = textAt(s, p, a), nowT = plain(p.t), pEl = row.querySelector('p');
    const html = isNow ? seamHTML(p) : esc(t);
    if (pEl.dataset.v !== String(i)) {
      pEl.dataset.v = i;
      if (!quiet && !RM && pEl.innerHTML !== html) { row.classList.add('swap'); setTimeout(() => { pEl.innerHTML = html; row.classList.remove('swap'); }, ms('--motion-quick')); }
      else pEl.innerHTML = html;
    }
    const diff = !isNow && t !== nowT;
    row.classList.toggle('diff', diff); row.querySelector('.ml').dataset.d = diff ? 'changed since' : '';
  }));
  const ed = changed.map(c => `<b>${esc(c.s.title)}</b> by ${esc(person(c.e[1]).name)}${c.e[2] === 'correction' ? ' (a repair)' : c.e[2] === 'write' ? ' (first written here)' : ''}`).join('; ');
  $('#ver').innerHTML = `<div class="h"><span>Version ${i + 1}${isNow ? ' · now' : i === YOU ? ' · when you last read it' : ''}</span><span>${fdate(a)}</span></div><div class="d">${ed}.</div>${i === YOU ? `<div class="d">Since then: <b>${V.length - 1 - i} versions</b>, ${DATA.sections.filter(s => lastChange(s) < V[i]).length} sections changed.</div>` : ''}`;
  $('#pasttext').innerHTML = `Viewing <b>version ${i + 1}</b> as it stood on ${fdate(a)}, ${ago(a)}. Changed paragraphs are marked.`;
}
function reset() { setV(V.length - 1, true); $('#reader').scrollTo({ top: 0 }); }
async function demo(alive) {
  const r = $('#reader'), el = $('#s4'); r.scrollTo({ top: el.offsetTop - px('--space-7'), behavior: RM ? 'auto' : 'smooth' });
  const target = V.indexOf(185);
  for (let i = V.length - 2; i >= target; i--) { setV(i); await wait(ms('--motion-quick') + ms('--motion-instant')); if (!alive()) return; }
}
boot();
</script>
</body>
</html>
