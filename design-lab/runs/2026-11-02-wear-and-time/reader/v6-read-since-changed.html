/* ===== helpers ===== */

  const o = person(DATA.doc.owner);
  $('#band').innerHTML = `
    <span class="app-name">${esc(DATA.app)}</span>
    <span class="fchip" data-floor="${DATA.floor.kind}">${esc(DATA.floor.name)}</span>
    <nav class="crumbs" aria-label="Breadcrumb">${esc(DATA.library)} <i data-lucide="chevron-right" data-size="14"></i> <b>${esc(DATA.doc.title)}</b></nav>
    <div class="band-r"><span>Version ${versions().length}</span><span>${esc(DATA.doc.status)}</span><span class="me" title="${esc(DATA.you.name)}">${esc(DATA.you.initials)}</span></div>`;
}

/* document */
function renderDoc(opts = {}) {
  const o = person(DATA.doc.owner);
  let h = `<header class="row dhead"><div class="ml"></div><div class="tx">
      <div class="eyebrow">${esc(DATA.doc.kind)} · ${esc(DATA.library)}</div>
      <h1>${esc(DATA.doc.title)}</h1>
      <div class="dmeta"><span>Owner <b>${esc(o.name)}</b></span><span>Changed <b>${ago(docChanged())}</b></span><span>Audience <b>${audienceTotal()}</b></span>${opts.meta || ''}</div>
    </div><div class="mr"></div></header>`;
  DATA.sections.forEach((s, i) => {
    h += `<section class="sec" id="${s.id}" data-sid="${s.id}"><div class="row hrow"><div class="ml"></div><h2 class="tx"><span class="n">${i + 1}</span>${esc(s.title)}</h2><div class="mr"></div></div>`;
    s.paras.forEach(p => { h += `<div class="row prow" data-pid="${sid(s, p)}"><div class="ml"></div><p class="tx">${seamHTML(p)}</p><div class="mr"></div></div>`; });
    h += `</section>`;
  });
  $('#page').innerHTML = h;
}

/* tip */
function tip(html, x, y, place = 'left', maxW) {
  const t = $('#tip'); t.innerHTML = html; Icons.hydrate(t); t.style.maxWidth = maxW ? maxW + 'px' : '';
  const r = t.getBoundingClientRect(), W = innerWidth, H = innerHeight, g = px('--space-3');
  let L = place === 'left' ? x - r.width - g : place === 'below' ? x - r.width / 2 : x + g, T = place === 'below' ? y + g : y - r.height / 2;
  L = Math.max(g, Math.min(W - r.width - g, L)); T = Math.max(px('--band-top') + g, Math.min(H - r.height - g * 4, T));
  t.style.left = L + 'px'; t.style.top = T + 'px'; t.classList.add('on');
}
/* room between the text column and a right-hand x */
const roomRight = x => x - $('#page .prow .tx').getBoundingClientRect().right - px('--space-3');
const untip = () => $('#tip').classList.remove('on');

/* demo runner: shows its moment ~1.2 s after load; R replays */
let RUN = 0;
async function play() {
  const my = ++RUN; const alive = () => my === RUN;
  untip(); if (typeof reset === 'function') reset();
  await wait(ms('--motion-run'));
  if (alive() && typeof demo === 'function') await demo(alive);
}
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea')) return;
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); play(); }
  if (e.key === 'Escape') untip();
});
function boot() { renderBand(); if (typeof setup === 'function') setup(); Icons.hydrate(); play(); }

/* ===== variant ===== */
const K = DATA.privacy.minGroup, TOT = audienceTotal();
let SEL = 's4', AS = 'you', READ = new Set();
const groupCount = (s, g) => s.readSince[g.floor] + (READ.has(s.id) && g.floor === DATA.floor.kind ? 1 : 0);
const total = s => DATA.audience.groups.reduce((a, g) => a + groupCount(s, g), 0);
/* privacy floor: a breakdown shows only when every group has at least K readers; otherwise the others would reveal the small one */
const split = s => DATA.audience.groups.every(g => groupCount(s, g) >= K);
function bars(s) { return split(s) ? DATA.audience.groups.map(g => `<span class="gb" data-floor="${g.floor}" style="--n:${g.n}"><i style="--f:${groupCount(s, g) / g.n}"></i></span>`).join('') : `<span class="gb all" style="--n:1"><i style="--f:${total(s) / TOT}"></i></span>`; }
const needs = s => s.changedSinceYou && !READ.has(s.id) && s.paras.some(p => p.seam && p.seam.ago < DATA.you.lastReadAgo);
function gauge(s) {
  const el = $('#' + s.id + ' .gauge'); el.innerHTML = `<span>${total(s)} of ${TOT}</span><span class="bars">${bars(s)}</span>`;
  el.classList.toggle('need', needs(s)); el.classList.toggle('done', READ.has(s.id));
  el.setAttribute('aria-label', `${total(s)} of ${TOT} have read this section since it changed ${ago(lastChange(s))}.${needs(s) ? ' You have not read this change yet.' : ''}`);
}
function setup() {
  renderDoc({ meta: `<span>Read since last change <b id="docread"></b></span>` });
  DATA.sections.forEach(s => {
    const h = $('#' + s.id + ' .hrow .tx'); h.innerHTML = `<span>${h.innerHTML}</span><button class="gauge" data-sec="${s.id}"></button>`;
    if (needs(s)) $('#' + s.id + ' .hrow').insertAdjacentHTML('afterend', `<div class="row"><div class="ml"></div><p class="tx unread-note" data-note="${s.id}"><i data-lucide="eye" data-size="16"></i>Changed since you last read it, ${ago(DATA.you.lastReadAgo)}: a figure was corrected.</p><div class="mr"></div></div>`);
    gauge(s);
  });
  $$('.gauge').forEach(b => b.addEventListener('click', () => select(b.dataset.sec)));
  $$('.seg button').forEach(b => b.addEventListener('click', () => viewAs(b.dataset.as)));
  document.addEventListener('keydown', e => { if (e.key === 'o' || e.key === 'O') viewAs(AS === 'you' ? 'owner' : 'you'); });
  $('#reader').addEventListener('scroll', spy, { passive: true });
  docRead(); panel();
}
function docRead() { const s = DATA.sections.reduce((a, s) => lastChange(s) < lastChange(a) ? s : a); $('#docread').textContent = `${total(s)} of ${TOT}`; }
function viewAs(a) { AS = a; $$('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.as === a)); panel(); }
let spyT = 0;
function spy() {
  clearTimeout(spyT); spyT = setTimeout(() => {
    const r = $('#reader'), mid = r.scrollTop + r.clientHeight * .4;
    const s = [...DATA.sections].reverse().find(s => $('#' + s.id).offsetTop <= mid) || DATA.sections[0];
    if (s.id !== SEL) select(s.id);
  }, ms('--motion-quick'));
}
function select(id) { SEL = id; const p = $('#panel'); p.classList.add('out'); setTimeout(() => { panel(); p.classList.remove('out'); }, RM ? 0 : ms('--motion-quick')); }
function chart(s) {
  const le = lastEdit(s);
  /* cumulative readers since the change, against the high-water mark the previous version reached */
  const W = $('#aside').clientWidth - px('--space-4') * 2 - px('--space-2'), H = px('--space-8'), days = Math.max(1, lastChange(s)), hw = s.readBefore || total(s), max = Math.max(hw, total(s)) * 1.15;
  const y = v => H - v / max * H, x = d => d / days * W;
  const n = total(s), pts = []; for (let d = 0; d <= days; d += Math.max(1, Math.round(days / 24))) pts.push([x(d), y(n * Math.sqrt(d / days))]); pts.push([x(days), y(n)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  return `<svg height="${H + px('--space-5')}" viewBox="0 0 ${W} ${H + px('--space-5')}" role="img" aria-label="${n} readers since the change; the previous version reached ${hw}">
    <path class="ar" d="${line} L${x(days)},${H} L0,${H} Z"/><path class="ln" d="${line}"/>
    <line class="ch" x1="0" y1="0" x2="0" y2="${H}" style="${le[2] === 'correction' ? '' : 'stroke:var(--ink-muted)'}"/>
    ${s.readBefore ? `<line class="hw" x1="0" y1="${y(hw)}" x2="${W}" y2="${y(hw)}"/><text x="${W}" y="${y(hw) - px('--space-2')}" text-anchor="end" class="hi">${hw} read the old version</text>
      <line class="gap" x1="${x(days) - px('--space-2')}" y1="${y(hw)}" x2="${x(days) - px('--space-2')}" y2="${y(n)}"/><text x="${x(days) - px('--space-3')}" y="${(y(hw) + y(n)) / 2 + 4}" text-anchor="end">${hw - n} still to read it</text>` : ''}
    <line class="now" x1="${x(days)}" y1="0" x2="${x(days)}" y2="${H}"/>
    <text x="0" y="${H + px('--space-4')}">changed ${fdate(days).slice(0, -5)}</text><text x="${x(days)}" y="${H + px('--space-4')}" text-anchor="end">now</text></svg>`;
}
function panel() {
  const s = DATA.sections.find(x => x.id === SEL), n = total(s), le = lastEdit(s), owner = person(DATA.doc.owner), stale = s.readBefore ? s.readBefore - n : 0;
  $('#panel').innerHTML = `<div style="display:grid;gap:var(--space-3)">
    <h3>${esc(s.title)}</h3>
    <p>Changed <b>${ago(le[0])}</b> by ${esc(person(le[1]).name)}${le[2] === 'correction' ? ', a repair' : ''}.</p>
    <div class="big"><b>${n}</b><span>of ${TOT} have read it since</span></div>
    <div class="grp">${split(s) ? DATA.audience.groups.map(g => `<div class="gr"><span>${esc(g.name)}</span><span class="v">${groupCount(s, g)} of ${g.n}</span><span class="gb" data-floor="${g.floor}"><i style="--f:${groupCount(s, g) / g.n}"></i></span></div>`).join('')
      : `<div class="gr"><span>${DATA.audience.groups.map(g => esc(g.name)).join(' · ')}</span><span class="v">breakdown hidden</span><span class="why" style="grid-column:1 / -1">One group has fewer than ${K} readers since the change. Showing the other would give its number away, so only the total is shown.</span></div>`}</div>
    <div class="tide-chart">${chart(s)}</div>
    <div class="acts">${AS === 'owner'
      ? `<button class="btn"><i data-lucide="send" data-size="16"></i>Tell the ${stale > 0 ? stale + ' who read the old version' : 'audience'}</button><span class="why">Sends one note with what changed. You will not see who they are.</span>`
      : `<button class="btn" aria-disabled="true" aria-describedby="tell-why"><i data-lucide="send" data-size="16"></i>Tell the ${stale > 0 ? stale + ' who read the old version' : 'audience'}</button><span class="why" id="tell-why">Only <b>${esc(owner.name)}</b> (${esc(owner.role.toLowerCase())}) can notify readers.</span>`}</div>
    <div class="priv"><i data-lucide="lock" data-size="16"></i><span><b>Counts only, never names.</b> Groups are split out only when each has ${K} or more readers, so nobody can be picked out. ${AS === 'owner' ? 'Owners see the same counts as everyone.' : 'Your own reading counts once you have been on a section for a while.'}</span></div></div>`;
  Icons.hydrate($('#panel'));
}
function markRead(id) { READ.add(id); const s = DATA.sections.find(x => x.id === id); gauge(s); const n = $(`[data-note="${id}"]`); if (n) { n.classList.add('done'); setTimeout(() => n.closest('.row').hidden = true, RM ? 0 : ms('--motion-slow')); } docRead(); if (SEL === id) panel(); }
function reset() { READ.clear(); DATA.sections.forEach(gauge); $$('.unread-note').forEach(n => { n.classList.remove('done'); n.closest('.row').hidden = false; }); docRead(); viewAs('you'); SEL = 's1'; $('#reader').scrollTo({ top: 0 }); panel(); }
async function demo(alive) {
  const s = DATA.sections.find(s => needs(s)), r = $('#reader');
  await wait(ms('--motion-calm')); if (!alive()) return;
  r.scrollTo({ top: $('#' + s.id).offsetTop - px('--space-6'), behavior: RM ? 'auto' : 'smooth' });
  await wait(ms('--motion-run')); if (!alive()) return;
  select(s.id);
  await wait(ms('--motion-run') * 2); if (!alive()) return;   /* dwell: reading counts after a while on the section */
  markRead(s.id);
}
boot();
</script>
</body>
</html>
