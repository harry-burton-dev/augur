/* ---------------------------------------------------------------

:root{

  --x-tide: color-mix(in srgb, var(--ink-muted) 60%, transparent);       /* proposed --mark-tide: a past date left behind */
  --x-now: color-mix(in srgb, var(--light) 80%, transparent);            /* proposed --mark-now: the one now line */
  --x-hatch: color-mix(in srgb, var(--ink-muted) 26%, transparent);      /* proposed --mark-stale-hatch ink */

  --x-aside: var(--measure-drawer);
  --f-department: var(--floor-department-high);
  --f-team: var(--floor-team-high);

}

.tip{position:fixed;z-index:var(--layer-overlay);max-width:var(--measure-card);padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);box-shadow:var(--shadow-overlay);font-size:var(--type-meta);line-height:var(--leading-meta);pointer-events:none;opacity:0;transform:translateY(var(--space-1));transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out)}

</style>
<style>

.fix{position:relative;cursor:pointer;border-radius:2px;background:linear-gradient(var(--x-seam),var(--x-seam)) 0 100% / 100% 1px no-repeat,linear-gradient(var(--x-seam),var(--x-seam)) 0 calc(100% - 3px) / 100% 1px no-repeat;padding-bottom:2px;transition:background-color var(--motion-base)}

.seam-m{position:absolute;right:var(--space-4);top:var(--space-1);display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-1);font:400 var(--type-small)/1 var(--font-mono);color:var(--x-seam);white-space:nowrap}
.seam-m i{display:block;width:2px;height:var(--space-5);border-radius:var(--radius-pill);background:linear-gradient(var(--x-seam),color-mix(in srgb, var(--x-seam) 20%, transparent))}

/* parallel page: the document as it stood before the repair */
.aside{gap:var(--space-3);padding-top:var(--space-5)}
.pane{position:absolute;inset:0;padding:var(--space-5) var(--space-5) var(--space-7);display:flex;flex-direction:column;gap:var(--space-3);transition:opacity var(--motion-slow) var(--ease-standard)}

.rule{margin-top:auto;padding-top:var(--space-3);border-top:1px solid var(--hairline)}
.then{filter:saturate(.6);opacity:var(--x-past-dim)}
.then h4{margin:0 0 var(--space-3);font-weight:400;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--ink)}

.pane-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
.repair{display:grid;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-left:2px solid var(--x-seam);background:color-mix(in srgb, var(--x-seam) 6%, transparent);border-radius:0 var(--radius-key) var(--radius-key) 0}
.repair p{color:var(--ink)}
.repair .who{display:flex;gap:var(--space-2);align-items:center;font-size:var(--type-small);color:var(--ink-muted)}
.acts{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
/* ribbons joining what stayed the same (Xanadu) */
#links{position:fixed;inset:0;pointer-events:none;z-index:var(--layer-view);overflow:visible}
#links .same{fill:color-mix(in srgb, var(--ink) 5%, transparent);stroke:var(--hairline);stroke-width:1}
#links .seam{fill:none;stroke:var(--x-seam);stroke-width:1.5;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset var(--motion-calm) var(--ease-out)}
#links.on .seam{stroke-dashoffset:0}
#links .same{opacity:0;transition:opacity var(--motion-slow)}
#links.on .same{opacity:1}
</style>

<script>
/* ===== Sample data: every name, label and count on this page comes from here. ===== */
const DATA = {
  now: '2026-11-02',
  app: 'Artifacts',
  orgName: 'Org',

  },
  audience: { groups: [ { floor: 'department', name: 'Finance', n: 22 }, { floor: 'team', name: 'Field Operations', n: 16 } ] },

  readTrackingSinceAgo: 500,                              /* read events only exist from here: older is an unconformity */
  historyKeptSinceAgo: 900,                               /* imported from the old intranet; nothing older survives */
  doc: { kind: 'Policy', title: 'Travel and expenses policy', owner: 'pr', status: 'Published' },
  sections: [
    { id: 's1', title: 'Purpose', reviewedAgo: 120, reviewEvery: 365, refresh: 'pr', readSince: { department: 18, team: 13 },
      edits: [[900,'pr','write'],[610,'pr','edit']],
      paras: [
        { id: 'p1', read: .92, edit: .10, ret: 4, t: 'This policy sets out how we book, pay for and claim back travel and expenses for work. It applies the same rules to everyone and keeps spending visible to the people who approve it.' },
        { id: 'p2', read: .55, edit: .25, ret: 2, t: 'Where this policy and a local agreement disagree, the stricter rule applies until the policy owner says otherwise.' } ] },
    { id: 's2', title: 'Who this applies to', reviewedAgo: 120, reviewEvery: 365, refresh: 'pr', readSince: { department: 16, team: 11 },
      edits: [[900,'pr','write'],[400,'al','edit'],[210,'al','edit']],
      paras: [
        { id: 'p1', read: .45, edit: .50, ret: 3, t: 'Everyone who travels or spends money on behalf of the department, including contractors with a purchase order. Guests we invite are covered by section 7.' },
        { id: 'p2', read: .30, edit: .30, ret: 1, t: 'Team leads make sure new starters read this policy in their first week.' } ] },
    { id: 's3', title: 'Booking travel', reviewedAgo: 75, reviewEvery: 365, refresh: 'jm', readSince: { department: 13, team: 9 },

          history: [[900,'Book rail travel at least 7 days ahead where you can, and choose standard class.'],[200,'Book rail travel at least 7 days ahead where you can, and choose standard class unless the journey is longer than three hours.']] },
        { id: 'p2', read: .70, edit: .30, ret: 11, t: 'Flights need approval before booking. Ask the travel desk for two quotes and attach both to the request.' },
        { id: 'p3', read: .40, edit: .45, ret: 6, t: 'Hotels should be within the city cap in the allowance table. If none is available, book the nearest option and note why.' } ] },
    { id: 's4', title: 'Daily allowances', reviewedAgo: 9, reviewEvery: 365, refresh: 'sk', readSince: { department: 4, team: 2 }, readBefore: 31, changedSinceYou: true,
      edits: [[900,'pr','write'],[300,'pr','edit'],[40,'sk','edit'],[9,'sk','correction']],
      paras: [
        { id: 'p1', read: .97, edit: .85, ret: 46, t: 'The daily allowance for an overnight stay is {€54}, which covers breakfast, dinner and incidental costs. Lunch is covered only when you are away from your usual place of work for more than five hours.',
          seam: { ago: 9, who: 'sk', was: '€45', why: 'The figure was transposed when the new year’s rate table was copied in. €45 was never the approved rate.' },
          history: [[900,'The daily allowance for an overnight stay is €42, which covers breakfast, dinner and incidental costs.'],[300,'The daily allowance for an overnight stay is €48, which covers breakfast, dinner and incidental costs. Lunch is covered only when you are away for more than five hours.'],[40,'The daily allowance for an overnight stay is €45, which covers breakfast, dinner and incidental costs. Lunch is covered only when you are away from your usual place of work for more than five hours.']] },
        { id: 'p2', read: .60, edit: .35, ret: 9, t: 'Allowances are paid with your next salary run. You do not need receipts for the allowance itself, only for costs above it.' } ] },
    { id: 's5', title: 'Approvals', reviewedAgo: 30, reviewEvery: 365, refresh: 'pr', readSince: { department: 9, team: 5 }, readBefore: 26, changedSinceYou: true,
      edits: [[900,'pr','write'],[200,'jm','edit'],[190,'al','edit'],[185,'jm','edit'],[180,'al','edit'],[60,'pr','edit'],[45,'jm','edit'],[44,'al','edit'],[30,'pr','edit']],
      paras: [
        { id: 'p1', read: .50, edit: .98, ret: 14, t: 'Any single cost above €1,000 needs approval from your budget holder before you commit to it. Below that, your line manager approves.',
          history: [[900,'Any single cost above €500 needs approval from your budget holder.'],[200,'Any single cost above €1,000 needs approval from your budget holder.'],[190,'Any single cost above €500 needs approval from your budget holder.'],[185,'Any single cost above €1,000 needs approval from your budget holder.'],[180,'Any single cost above €500 needs approval from your budget holder.'],[60,'Any single cost above €750 needs approval from your budget holder before you commit to it.'],[45,'Any single cost above €1,000 needs approval from your budget holder before you commit to it.'],[44,'Any single cost above €750 needs approval from your budget holder before you commit to it.']] },
        { id: 'p2', read: .35, edit: .40, ret: 3, t: 'Approvals are recorded against the request, so anyone in the approval chain can see who agreed and when.' } ] },
    { id: 's6', title: 'Claiming and receipts', reviewedAgo: 430, reviewEvery: 180, refresh: 'jm', readSince: { department: 17, team: 13 },

};

/* ===== helpers ===== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const root = document.documentElement;
const tok = n => getComputedStyle(root).getPropertyValue(n).trim();
const ms = n => parseFloat(tok(n)) || 0;
const px = n => { const v = tok(n); return v.endsWith('rem') ? parseFloat(v) * 16 : parseFloat(v) || 0; };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NOW = new Date(DATA.now + 'T12:00:00');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dateOf = ago => { const d = new Date(NOW); d.setDate(d.getDate() - ago); return d; };
const fdate = ago => { const d = dateOf(ago); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const span = d => { d = Math.abs(d); if (d < 1) return 'today'; if (d < 14) return d + (d === 1 ? ' day' : ' days'); if (d < 60) return Math.round(d / 7) + ' weeks'; if (d < 540) return Math.round(d / 30.4) + ' months'; return (Math.round(d / 36.5) / 10) + ' years'; };
const ago = d => d < 1 ? 'today' : span(d) + ' ago';
const person = id => id === 'you' ? DATA.you : DATA.people[id];
const audienceTotal = () => DATA.audience.groups.reduce((a, g) => a + g.n, 0);
const lastChange = s => Math.min(...s.edits.map(e => e[0]));
const lastEdit = s => s.edits.reduce((a, e) => e[0] < a[0] ? e : a);
const docChanged = () => Math.min(...DATA.sections.map(lastChange));
const versions = () => [...new Set(DATA.sections.flatMap(s => s.edits.map(e => e[0])))].sort((a, b) => b - a);
const readSinceTotal = s => Object.values(s.readSince).reduce((a, b) => a + b, 0);
const dueIn = s => s.reviewEvery - s.reviewedAgo;            /* negative: overdue */
const seamHTML = (p, cls = 'fix') => p.t.replace(/\{([^}]*)\}/g, (_, w) => `<span class="${cls}" data-fix="${p.id}">${w}</span>`);
const plain = t => t.replace(/[{}]/g, '');
const wait = t => new Promise(r => setTimeout(r, RM ? Math.min(t, ms('--motion-instant')) : t));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sid = (s, p) => s.id + '-' + p.id;

/* band */
function renderBand() {
  const o = person(DATA.doc.owner);
  $('#band').innerHTML = `
    <span class="app-name">${esc(DATA.app)}</span>
    <span class="fchip" data-floor="${DATA.floor.kind}">${esc(DATA.floor.name)}</span>
    <nav class="crumbs" aria-label="Breadcrumb">${esc(DATA.library)} <i data-lucide="chevron-right" data-size="14"></i> <b>${esc(DATA.doc.title)}</b></nav>
    <div class="band-r"><span>Version ${versions().length}</span><span>${esc(DATA.doc.status)}</span><span class="me" title="${esc(DATA.you.name)}">${esc(DATA.you.initials)}</span></div>`;
}

/* document */
function renderDoc(opts = {}) {
  const o = person(DATA.doc.owner);
  let h = `<header class="row dhead"><div class="ml"></div><div class="tx">
      <div class="eyebrow">${esc(DATA.doc.kind)} · ${esc(DATA.library)}</div>
      <h1>${esc(DATA.doc.title)}</h1>
      <div class="dmeta"><span>Owner <b>${esc(o.name)}</b></span><span>Changed <b>${ago(docChanged())}</b></span><span>Audience <b>${audienceTotal()}</b></span>${opts.meta || ''}</div>
    </div><div class="mr"></div></header>`;
  DATA.sections.forEach((s, i) => {
    h += `<section class="sec" id="${s.id}" data-sid="${s.id}"><div class="row hrow"><div class="ml"></div><h2 class="tx"><span class="n">${i + 1}</span>${esc(s.title)}</h2><div class="mr"></div></div>`;
    s.paras.forEach(p => { h += `<div class="row prow" data-pid="${sid(s, p)}"><div class="ml"></div><p class="tx">${seamHTML(p)}</p><div class="mr"></div></div>`; });
    h += `</section>`;
  });
  $('#page').innerHTML = h;
}

/* tip */
function tip(html, x, y, place = 'left', maxW) {
  const t = $('#tip'); t.innerHTML = html; Icons.hydrate(t); t.style.maxWidth = maxW ? maxW + 'px' : '';
  const r = t.getBoundingClientRect(), W = innerWidth, H = innerHeight, g = px('--space-3');
  let L = place === 'left' ? x - r.width - g : place === 'below' ? x - r.width / 2 : x + g, T = place === 'below' ? y + g : y - r.height / 2;
  L = Math.max(g, Math.min(W - r.width - g, L)); T = Math.max(px('--band-top') + g, Math.min(H - r.height - g * 4, T));
  t.style.left = L + 'px'; t.style.top = T + 'px'; t.classList.add('on');
}
/* room between the text column and a right-hand x */
const roomRight = x => x - $('#page .prow .tx').getBoundingClientRect().right - px('--space-3');
const untip = () => $('#tip').classList.remove('on');

/* demo runner: shows its moment ~1.2 s after load; R replays */
let RUN = 0;
async function play() {
  const my = ++RUN; const alive = () => my === RUN;
  untip(); if (typeof reset === 'function') reset();
  await wait(ms('--motion-run'));
  if (alive() && typeof demo === 'function') await demo(alive);
}
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea')) return;
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); play(); }
  if (e.key === 'Escape') untip();
});
function boot() { renderBand(); if (typeof setup === 'function') setup(); Icons.hydrate(); play(); }

/* ===== variant ===== */
const seams = () => DATA.sections.flatMap(s => s.paras.filter(p => p.seam).map(p => ({ s, p })));
let OPEN = null, IDX = -1;
function setup() {
  renderDoc({ meta: `<span><b>${seams().length} repairs</b>, kept visible</span>` });
  seams().forEach(({ s, p }, i) => {
    const row = $(`[data-pid="${sid(s, p)}"]`);
    row.querySelector('.ml').innerHTML = `<div class="seam-m"><i></i>repair<span>${span(p.seam.ago)}</span></div>`;
    const f = row.querySelector('.fix'); f.tabIndex = 0; f.setAttribute('role', 'button'); f.setAttribute('aria-label', `${f.textContent}: repaired ${ago(p.seam.ago)}. Open the seam.`);
    f.addEventListener('click', () => openSeam(i)); f.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSeam(i); } });
  });
  $('#list').innerHTML = `<span class="eyebrow">Seams in this ${esc(DATA.doc.kind.toLowerCase())}</span>
    <h3>${seams().length} repairs</h3>
    <p>A repair fixes something that was wrong. It keeps a visible seam, so nobody mistakes the old figure for a rule that changed. Ordinary edits leave no seam.</p>
    <div class="seamlist">${seams().map(({ s, p }, i) => `<button class="si" data-i="${i}"><span class="k">${fdate(p.seam.ago).replace(/ \d{4}$/, '')}</span><span class="w"><s>${esc(p.seam.was)}</s> → ${esc(p.t.match(/\{([^}]*)\}/)[1])}</span><span class="m">${esc(s.title)} · ${esc(person(p.seam.who).name)}</span></button>`).join('')}</div>
    <p class="why rule">A seam can be undone by the ${esc(person(DATA.doc.owner).role.toLowerCase())} (${esc(person(DATA.doc.owner).name)}), and the undo leaves a seam too. Nothing is smoothed away.</p>`;
  $$('.si').forEach(b => b.addEventListener('click', () => openSeam(+b.dataset.i)));
  $('#reader').addEventListener('scroll', draw, { passive: true }); addEventListener('resize', draw);
  document.addEventListener('keydown', e => { if (e.key === 'n' || e.key === 'N') openSeam((IDX + 1) % seams().length); if (e.key === 'Escape') closeSeam(); });
}
function before(p) { const h = p.history.filter(h => h[0] > p.seam.ago); return h[h.length - 1][1]; }
function openSeam(i) {
  IDX = i; const { s, p } = seams()[i]; OPEN = { s, p };
  $$('.fix.open').forEach(f => f.classList.remove('open')); $$('.prow.lit').forEach(r => r.classList.remove('lit'));
  const row = $(`[data-pid="${sid(s, p)}"]`); row.classList.add('lit'); row.querySelector('.fix').classList.add('open');
  const r = $('#reader'); r.scrollTo({ top: row.offsetTop - r.clientHeight / 3, behavior: RM ? 'auto' : 'smooth' });
  const was = before(p), who = person(p.seam.who), owner = person(DATA.doc.owner), wasFor = p.history.find(h => h[1] === was)[0] - p.seam.ago;
  $('#par').innerHTML = `<div class="pane-head"><span class="eyebrow">Before the repair · ${fdate(p.seam.ago + 1)}</span><button class="icon-btn btn" aria-label="Close" onclick="closeSeam()"><i data-lucide="x" data-size="16"></i></button></div>
    <div class="then"><h4>${esc(s.title)}</h4>${s.paras.map(q => q === p ? `<p data-then="${q.id}">${esc(was).replace(esc(p.seam.was), `<span class="was">${esc(p.seam.was)}</span>`)}</p>` : `<p class="same" data-then="${q.id}">${esc(plain(q.t))}</p>`).join('')}</div>
    <div class="repair"><div class="who"><i data-lucide="scissors" data-size="14"></i>Repaired by ${esc(who.name)} · ${fdate(p.seam.ago)}</div>
      <p>${esc(p.seam.why)}</p>
      <p class="why">The wrong text stood for <b>${span(wasFor)}</b>. <b>${readSinceTotal(s)} of ${audienceTotal()}</b> have read this since the repair.</p></div>
    <div class="acts"><button class="btn"><i data-lucide="history" data-size="16"></i>All changes here</button><button class="btn" aria-disabled="true" aria-describedby="undo-why"><i data-lucide="undo-2" data-size="16"></i>Undo repair</button></div>
    <p class="why" id="undo-why">Only <b>${esc(owner.name)}</b> (${esc(owner.role.toLowerCase())}) can undo a repair. You can ask in a comment.</p>`;
  Icons.hydrate($('#par'));
  $('#list').classList.add('off'); $('#par').classList.remove('off');
  setTimeout(() => { draw(); requestAnimationFrame(() => $('#links').classList.add('on')); }, RM ? 0 : ms('--motion-slow'));
}
function closeSeam() {
  OPEN = null; $('#links').classList.remove('on'); $('#links').innerHTML = '';
  $$('.fix.open').forEach(f => f.classList.remove('open')); $$('.prow.lit').forEach(r => r.classList.remove('lit'));
  $('#par').classList.add('off'); $('#list').classList.remove('off');
}
function draw() {
  const svg = $('#links'); if (!OPEN) { svg.innerHTML = ''; return; }
  const { s, p } = OPEN, g = px('--space-2'); let h = '';
  const top = $('#reader').getBoundingClientRect().top;
  s.paras.forEach(q => {
    const a = $(`[data-pid="${sid(s, q)}"] .tx`).getBoundingClientRect(), b = $(`[data-then="${q.id}"]`).getBoundingClientRect();
    if (a.bottom < top) return;
    const x1 = a.right + g, x2 = b.left - g, m = (x1 + x2) / 2;
    if (q !== p) h += `<path class="same" d="M${x1},${a.top} C${m},${a.top} ${m},${b.top} ${x2},${b.top} L${x2},${b.bottom - g} C${m},${b.bottom - g} ${m},${a.bottom - g} ${x1},${a.bottom - g} Z"/>`;
    else {
      h += `<path class="same" d="M${x1},${a.top} C${m},${a.top} ${m},${b.top} ${x2},${b.top} L${x2},${b.bottom - g} C${m},${b.bottom - g} ${m},${a.bottom - g} ${x1},${a.bottom - g} Z"/>`;
      const f = $(`[data-pid="${sid(s, q)}"] .fix`).getBoundingClientRect(), w = $('#par .was').getBoundingClientRect();
      const fy = f.top + f.height / 2, wy = w.top + w.height / 2;
      const L = Math.hypot(x2 - x1, wy - fy) * 1.6;
      h += `<path class="seam" style="--len:${L}" d="M${x1},${fy} C${m},${fy} ${m},${wy} ${x2},${wy}"/><circle cx="${x1}" cy="${fy}" r="2" style="fill:var(--x-seam)"/><circle cx="${x2}" cy="${wy}" r="2" style="fill:var(--x-seam)"/>`;
    }
  });
  svg.innerHTML = h;
}
function reset() { closeSeam(); $('#reader').scrollTo({ top: 0 }); IDX = -1; }
async function demo(alive) { openSeam(seams().findIndex(x => x.s.id === 's4')); }
boot();
</script>
</body>
