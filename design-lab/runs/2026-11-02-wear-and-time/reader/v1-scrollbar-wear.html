<style>
/* ---------------------------------------------------------------
   Proposed tokens (time language, see ../grammar/v1-time-language.html).
   Each is "needs token" in notes.md. All are combinations of kit tokens.
   --------------------------------------------------------------- */
:root{
  --x-seam: color-mix(in srgb, var(--warning) 55%, var(--ink));          /* proposed --mark-seam: repair gold, never "warning" */
  --x-wear: color-mix(in srgb, var(--ink) 55%, transparent);             /* proposed --mark-wear: matter, never light */
  --x-wear-read: color-mix(in srgb, var(--ink-muted) 45%, transparent);  /* proposed --mark-wear-read */
  --x-tide: color-mix(in srgb, var(--ink-muted) 60%, transparent);       /* proposed --mark-tide: a past date left behind */
  --x-now: color-mix(in srgb, var(--light) 80%, transparent);            /* proposed --mark-now: the one now line */
  --x-hatch: color-mix(in srgb, var(--ink-muted) 26%, transparent);      /* proposed --mark-stale-hatch ink */
  --x-stale: repeating-linear-gradient(45deg, transparent 0 var(--space-2), var(--x-hatch) var(--space-2) calc(var(--space-2) + 1px)); /* 45deg: shadow (unavailable) is 135deg */
  --x-past-dim: .62;                                                      /* proposed --time-past-dim: past is quieter than now */
  --x-margin: var(--space-8);
  --x-aside: var(--measure-drawer);
  --f-department: var(--floor-department-high);
  --f-team: var(--floor-team-high);
  --f-org: var(--floor-org-high);
  --f-you: var(--floor-you-high);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:var(--focus-ring) solid var(--focus);outline-offset:var(--focus-gap)}
.mono{font-family:var(--font-mono)}
.eyebrow{font:400 var(--type-label)/var(--leading-label) var(--font-mono);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted)}
.lucide{flex:none}
.kbd{display:inline-block;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);padding:var(--space-1) var(--space-2)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.water{position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 50% 115%, color-mix(in srgb, var(--navy) 42%, transparent), transparent 70%)}

/* top band */
.band{position:fixed;top:0;left:0;right:0;height:var(--band-top);display:flex;align-items:center;gap:var(--space-4);padding:0 var(--edge);border-bottom:1px solid var(--hairline);background:color-mix(in srgb, var(--slate-deep) 82%, transparent);z-index:var(--layer-chrome)}

.fchip::before{content:"";width:var(--space-2);height:var(--space-2);border-radius:50%;background:currentColor}
.crumbs{display:flex;align-items:center;gap:var(--space-2);color:var(--ink-muted);font-size:var(--type-meta);white-space:nowrap;min-width:0}

.band-r{margin-left:auto;display:flex;align-items:center;gap:var(--space-4);font:400 var(--type-small)/1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.me{width:var(--target-sm);height:var(--target-sm);border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb, var(--f-you) 18%, var(--slate-deep));border:1px solid color-mix(in srgb, var(--f-you) 45%, transparent);color:var(--light);font:400 var(--type-small)/1 var(--font-sans);letter-spacing:var(--tracking-soft)}

/* reader */
.stage{position:fixed;top:var(--band-top);left:0;right:0;bottom:0}
.reader{position:absolute;top:0;bottom:0;left:0;right:var(--x-aside);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
body.noaside{--x-aside:0px}
.page{position:relative;width:calc(var(--measure-read) + 2 * var(--x-margin));margin:0 auto;padding:var(--space-6) 0 var(--space-8)}
.row{position:relative;display:grid;grid-template-columns:var(--x-margin) var(--measure-read) var(--x-margin)}
.ml,.mr{position:relative;min-width:0}
.tx{margin:0;min-width:0}
.dhead .tx{padding-bottom:var(--space-5);border-bottom:1px solid var(--hairline);margin-bottom:var(--space-5)}
.dhead h1{margin:var(--space-2) 0 var(--space-2);font-weight:300;font-size:var(--type-title-s);line-height:var(--leading-title-s);letter-spacing:var(--tracking-soft);color:var(--light)}
.dmeta{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}

.sec{margin-bottom:var(--space-5)}
.hrow h2{margin:0 0 var(--space-3);font-weight:400;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.hrow h2 .n{font:400 var(--type-meta)/1 var(--font-mono);color:var(--ink-muted);margin-right:var(--space-3)}
.prow p{margin:0 0 var(--space-4);color:var(--ink);font-size:var(--type-body);line-height:var(--leading-body)}
.fix{color:inherit}

.aside{position:absolute;top:0;bottom:0;right:0;width:var(--x-aside);border-left:1px solid var(--hairline);background:color-mix(in srgb, var(--slate-deep) 62%, transparent);padding:var(--space-5) var(--space-4) var(--space-7);overflow:hidden;display:flex;flex-direction:column;gap:var(--space-4)}
body.noaside .aside{display:none}
.aside h3{margin:0;font-weight:400;font-size:var(--type-lead);line-height:var(--leading-lead);color:var(--light)}
.aside p{margin:0;font-size:var(--type-meta);line-height:var(--leading-meta);color:var(--ink-muted)}

.btn{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--target-sm);padding:0 var(--space-3);border-radius:var(--radius-key);border:1px solid var(--hairline-strong);background:var(--surface-inset);font-size:var(--type-meta);white-space:nowrap;transition:background var(--motion-quick)}
.btn:hover{background:var(--surface-raised)}
.btn[aria-disabled="true"]{cursor:not-allowed;color:var(--ink-muted);border-style:dashed;background:repeating-linear-gradient(135deg,transparent 0 var(--space-2),var(--hairline) var(--space-2) calc(var(--space-2) + 1px))}
.why{font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.why b{font-weight:400;color:var(--ink)}

.hints{position:fixed;left:var(--edge-tight);bottom:calc(var(--edge-tight) + var(--space-5));z-index:999;display:flex;gap:var(--space-4);align-items:center;font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);background:var(--scrim);padding:var(--space-1) var(--space-2);border-radius:var(--radius-key)}
.hints span{display:inline-flex;gap:var(--space-2);align-items:center}
.hints .kbd{padding:2px var(--space-1)}

/* floor colours for people */
[data-floor="department"]{--fc:var(--f-department)}
[data-floor="team"]{--fc:var(--f-team)}
[data-floor="org"]{--fc:var(--f-org)}
[data-floor="you"]{--fc:var(--f-you)}

/* tip: in-place "why and since when" */
.tip{position:fixed;z-index:var(--layer-overlay);max-width:var(--measure-card);padding:var(--space-3) var(--space-4);border-radius:var(--radius-inset);background:var(--surface-overlay);backdrop-filter:blur(var(--surface-blur));border:1px solid var(--hairline-strong);box-shadow:var(--shadow-overlay);font-size:var(--type-meta);line-height:var(--leading-meta);pointer-events:none;opacity:0;transform:translateY(var(--space-1));transition:opacity var(--motion-base) var(--ease-out),transform var(--motion-base) var(--ease-out)}
.tip.on{opacity:1;transform:none}
.tip .eyebrow{display:block;margin-bottom:var(--space-1)}
.tip .l{display:flex;gap:var(--space-2);align-items:baseline;color:var(--ink-muted)}
.tip .l b{font-weight:400;color:var(--ink)}
@media (prefers-reduced-motion: reduce){.tip{transform:none}}

</style>
<style>

.reader{scrollbar-width:none}
.reader::-webkit-scrollbar{display:none}
.aside{padding:var(--space-4) 0 var(--space-6);gap:var(--space-2);background:color-mix(in srgb, var(--slate-deep) 70%, transparent)}
.rail-head{display:grid;grid-template-columns:1fr 1fr;text-align:center;padding:0 var(--space-2)}

.rail{position:relative;flex:1;margin:0 var(--space-2);cursor:pointer;border-radius:var(--radius-key)}
.rail:focus-visible{outline-offset:0}
.spine{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--hairline)}
.wear{position:absolute;height:var(--h);top:var(--y);display:flex;transform-origin:var(--o) 50%;transition:transform var(--motion-calm) var(--ease-out),opacity var(--motion-calm)}
.wear.e{right:50%;flex-direction:row-reverse;--o:100%}
.wear.r{left:50%;--o:0%}
.wear i{display:block;height:100%;width:var(--w);background:color-mix(in srgb, var(--fc) 46%, transparent)}
.wear.r i{background:color-mix(in srgb, var(--ink-muted) 28%, transparent)}
.wear.e i:first-child{border-radius:var(--radius-key) 0 0 var(--radius-key)}
.wear.pre{transform:scaleX(0);opacity:0}
.sec-tick{position:absolute;left:0;right:0;top:var(--y);height:1px;background:var(--hairline);pointer-events:none}
.sec-tick b{position:absolute;left:0;top:calc(var(--space-1) * -1);font:400 var(--type-small)/1 var(--font-mono);color:var(--ink-muted);opacity:.7;transform:translateY(-50%)}
.seam-tick{position:absolute;left:calc(50% - var(--space-4));width:var(--space-5);top:var(--y);height:2px;margin-top:-1px;background:var(--x-seam);border-radius:var(--radius-pill);pointer-events:none}
.stale-band{position:absolute;left:0;right:0;top:var(--y);height:var(--h);background:var(--x-stale);border-top:1px dashed var(--hairline-strong);border-bottom:1px dashed var(--hairline-strong);pointer-events:none}
.since{position:absolute;right:calc(100% + var(--space-1));top:var(--y);height:var(--h);width:2px;border-radius:var(--radius-pill);background:var(--ink-muted);pointer-events:none}
.since.flick{animation:flick var(--motion-run) steps(1,end) 1}
@keyframes flick{0%{background:var(--ink-muted)}6%{background:var(--info)}12%{background:var(--ink-muted)}18%{background:var(--info)}24%,100%{background:var(--ink-muted)}}
.thumb{position:absolute;left:calc(var(--space-1) * -1);right:calc(var(--space-1) * -1);top:var(--y);height:var(--h);border:1px solid var(--hairline-strong);border-radius:var(--radius-key);background:color-mix(in srgb, var(--light) 5%, transparent);pointer-events:none}
.rail-foot{padding:0 var(--space-2);text-align:center}
.rail-foot .why{display:block}
.legend{display:grid;gap:var(--space-1);padding:0 var(--space-3);font-size:var(--type-small);line-height:var(--leading-small);color:var(--ink-muted)}
.legend span{display:flex;align-items:center;gap:var(--space-2)}
.legend i{display:block;flex:none;width:var(--space-4);height:var(--space-2)}
.lg-seam{height:2px!important;background:var(--x-seam);border-radius:var(--radius-pill)}
.lg-stale{background:var(--x-stale);border:1px dashed var(--hairline-strong)}
.lg-since{width:2px!important;height:var(--space-3)!important;background:var(--ink-muted)}
/* the same wear, faint, in the page's own margin */
.prow .ml::after{content:"";position:absolute;right:var(--space-4);top:var(--space-1);bottom:var(--space-5);width:2px;border-radius:var(--radius-pill);background:var(--x-wear);opacity:calc(var(--e, 0) * .8)}
.prow.hot .tx{background:linear-gradient(90deg, color-mix(in srgb, var(--light) 4%, transparent), transparent);}
.fix{box-shadow:inset 0 -1px 0 var(--x-seam)}
.sec.stale .prow .tx{background:var(--x-stale)}
.stale-note{display:flex;gap:var(--space-2);align-items:flex-start;margin:0 0 var(--space-3);color:var(--ink-muted);font-size:var(--type-meta);line-height:var(--leading-meta)}
.stale-note b{color:var(--ink);font-weight:400}
.sw{display:inline-block;width:var(--space-3);height:var(--space-2);border-radius:1px;background:color-mix(in srgb, var(--fc) 62%, transparent);margin-right:var(--space-1)}
</style>
</head>
<body class="">
<div class="water" aria-hidden="true"></div>
<header class="band" id="band"></header>

</main>

<div class="tip" id="tip" role="status" aria-live="polite"></div>

<div class="x-cap"><b>Reader · V1</b> the scroll bar is the record: edit wear left, read wear right · Hill and Hollan</div>
<script>
/* ===== Sample data: every name, label and count on this page comes from here. ===== */
const DATA = {
  now: '2026-11-02',
  app: 'Artifacts',
  orgName: 'Org',
  floor: { kind: 'department', name: 'Finance' },
  library: 'Policies',
  you: { id: 'you', initials: 'MO', name: 'You', lastReadAgo: 24 },
  people: {
    pr: { name: 'Priya Raman', floor: 'department', role: 'Policy owner' },
    sk: { name: 'Sana Kader', floor: 'department', role: 'Editor' },
    jm: { name: 'Jonas Meyer', floor: 'team', role: 'Editor, Field Operations' },
    al: { name: 'Ade Lawal', floor: 'org', role: 'Org compliance' }
  },
  audience: { groups: [ { floor: 'department', name: 'Finance', n: 22 }, { floor: 'team', name: 'Field Operations', n: 16 } ] },
  privacy: { minGroup: 5, namesNeedConsent: true },       /* a question for Harry, not a decision */
  readTrackingSinceAgo: 500,                              /* read events only exist from here: older is an unconformity */
  historyKeptSinceAgo: 900,                               /* imported from the old intranet; nothing older survives */
  doc: { kind: 'Policy', title: 'Travel and expenses policy', owner: 'pr', status: 'Published' },
  sections: [
    { id: 's1', title: 'Purpose', reviewedAgo: 120, reviewEvery: 365, refresh: 'pr', readSince: { department: 18, team: 13 },
      edits: [[900,'pr','write'],[610,'pr','edit']],
      paras: [
        { id: 'p1', read: .92, edit: .10, ret: 4, t: 'This policy sets out how we book, pay for and claim back travel and expenses for work. It applies the same rules to everyone and keeps spending visible to the people who approve it.' },
        { id: 'p2', read: .55, edit: .25, ret: 2, t: 'Where this policy and a local agreement disagree, the stricter rule applies until the policy owner says otherwise.' } ] },
    { id: 's2', title: 'Who this applies to', reviewedAgo: 120, reviewEvery: 365, refresh: 'pr', readSince: { department: 16, team: 11 },
      edits: [[900,'pr','write'],[400,'al','edit'],[210,'al','edit']],
      paras: [
        { id: 'p1', read: .45, edit: .50, ret: 3, t: 'Everyone who travels or spends money on behalf of the department, including contractors with a purchase order. Guests we invite are covered by section 7.' },
        { id: 'p2', read: .30, edit: .30, ret: 1, t: 'Team leads make sure new starters read this policy in their first week.' } ] },
    { id: 's3', title: 'Booking travel', reviewedAgo: 75, reviewEvery: 365, refresh: 'jm', readSince: { department: 13, team: 9 },
      edits: [[900,'pr','write'],[200,'jm','edit'],[75,'jm','correction']],
      paras: [
        { id: 'p1', read: .85, edit: .60, ret: 19, t: 'Book rail travel at least {14 days} ahead where you can, and choose standard class unless the journey is longer than three hours.',
          seam: { ago: 75, who: 'jm', was: '7 days', why: 'The 14-day rule took effect in April and this line was missed when the section was updated.' },
          history: [[900,'Book rail travel at least 7 days ahead where you can, and choose standard class.'],[200,'Book rail travel at least 7 days ahead where you can, and choose standard class unless the journey is longer than three hours.']] },
        { id: 'p2', read: .70, edit: .30, ret: 11, t: 'Flights need approval before booking. Ask the travel desk for two quotes and attach both to the request.' },
        { id: 'p3', read: .40, edit: .45, ret: 6, t: 'Hotels should be within the city cap in the allowance table. If none is available, book the nearest option and note why.' } ] },
    { id: 's4', title: 'Daily allowances', reviewedAgo: 9, reviewEvery: 365, refresh: 'sk', readSince: { department: 4, team: 2 }, readBefore: 31, changedSinceYou: true,
      edits: [[900,'pr','write'],[300,'pr','edit'],[40,'sk','edit'],[9,'sk','correction']],
      paras: [
        { id: 'p1', read: .97, edit: .85, ret: 46, t: 'The daily allowance for an overnight stay is {€54}, which covers breakfast, dinner and incidental costs. Lunch is covered only when you are away from your usual place of work for more than five hours.',
          seam: { ago: 9, who: 'sk', was: '€45', why: 'The figure was transposed when the new year’s rate table was copied in. €45 was never the approved rate.' },
          history: [[900,'The daily allowance for an overnight stay is €42, which covers breakfast, dinner and incidental costs.'],[300,'The daily allowance for an overnight stay is €48, which covers breakfast, dinner and incidental costs. Lunch is covered only when you are away for more than five hours.'],[40,'The daily allowance for an overnight stay is €45, which covers breakfast, dinner and incidental costs. Lunch is covered only when you are away from your usual place of work for more than five hours.']] },
        { id: 'p2', read: .60, edit: .35, ret: 9, t: 'Allowances are paid with your next salary run. You do not need receipts for the allowance itself, only for costs above it.' } ] },
    { id: 's5', title: 'Approvals', reviewedAgo: 30, reviewEvery: 365, refresh: 'pr', readSince: { department: 9, team: 5 }, readBefore: 26, changedSinceYou: true,
      edits: [[900,'pr','write'],[200,'jm','edit'],[190,'al','edit'],[185,'jm','edit'],[180,'al','edit'],[60,'pr','edit'],[45,'jm','edit'],[44,'al','edit'],[30,'pr','edit']],
      paras: [
        { id: 'p1', read: .50, edit: .98, ret: 14, t: 'Any single cost above €1,000 needs approval from your budget holder before you commit to it. Below that, your line manager approves.',
          history: [[900,'Any single cost above €500 needs approval from your budget holder.'],[200,'Any single cost above €1,000 needs approval from your budget holder.'],[190,'Any single cost above €500 needs approval from your budget holder.'],[185,'Any single cost above €1,000 needs approval from your budget holder.'],[180,'Any single cost above €500 needs approval from your budget holder.'],[60,'Any single cost above €750 needs approval from your budget holder before you commit to it.'],[45,'Any single cost above €1,000 needs approval from your budget holder before you commit to it.'],[44,'Any single cost above €750 needs approval from your budget holder before you commit to it.']] },
        { id: 'p2', read: .35, edit: .40, ret: 3, t: 'Approvals are recorded against the request, so anyone in the approval chain can see who agreed and when.' } ] },
    { id: 's6', title: 'Claiming and receipts', reviewedAgo: 430, reviewEvery: 180, refresh: 'jm', readSince: { department: 17, team: 13 },
      stale: 'It still names the paper claim form, which was retired in June. Claims now go through the Expenses app.',

/* ===== helpers ===== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const root = document.documentElement;
const tok = n => getComputedStyle(root).getPropertyValue(n).trim();
const ms = n => parseFloat(tok(n)) || 0;
const px = n => { const v = tok(n); return v.endsWith('rem') ? parseFloat(v) * 16 : parseFloat(v) || 0; };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NOW = new Date(DATA.now + 'T12:00:00');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dateOf = ago => { const d = new Date(NOW); d.setDate(d.getDate() - ago); return d; };
const fdate = ago => { const d = dateOf(ago); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const span = d => { d = Math.abs(d); if (d < 1) return 'today'; if (d < 14) return d + (d === 1 ? ' day' : ' days'); if (d < 60) return Math.round(d / 7) + ' weeks'; if (d < 540) return Math.round(d / 30.4) + ' months'; return (Math.round(d / 36.5) / 10) + ' years'; };
const ago = d => d < 1 ? 'today' : span(d) + ' ago';
const person = id => id === 'you' ? DATA.you : DATA.people[id];
const audienceTotal = () => DATA.audience.groups.reduce((a, g) => a + g.n, 0);
const lastChange = s => Math.min(...s.edits.map(e => e[0]));
const lastEdit = s => s.edits.reduce((a, e) => e[0] < a[0] ? e : a);
const docChanged = () => Math.min(...DATA.sections.map(lastChange));
const versions = () => [...new Set(DATA.sections.flatMap(s => s.edits.map(e => e[0])))].sort((a, b) => b - a);
const readSinceTotal = s => Object.values(s.readSince).reduce((a, b) => a + b, 0);
const dueIn = s => s.reviewEvery - s.reviewedAgo;            /* negative: overdue */
const seamHTML = (p, cls = 'fix') => p.t.replace(/\{([^}]*)\}/g, (_, w) => `<span class="${cls}" data-fix="${p.id}">${w}</span>`);
const plain = t => t.replace(/[{}]/g, '');
const wait = t => new Promise(r => setTimeout(r, RM ? Math.min(t, ms('--motion-instant')) : t));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sid = (s, p) => s.id + '-' + p.id;

/* band */
function renderBand() {
  const o = person(DATA.doc.owner);
  $('#band').innerHTML = `
    <span class="app-name">${esc(DATA.app)}</span>
    <span class="fchip" data-floor="${DATA.floor.kind}">${esc(DATA.floor.name)}</span>
    <nav class="crumbs" aria-label="Breadcrumb">${esc(DATA.library)} <i data-lucide="chevron-right" data-size="14"></i> <b>${esc(DATA.doc.title)}</b></nav>
    <div class="band-r"><span>Version ${versions().length}</span><span>${esc(DATA.doc.status)}</span><span class="me" title="${esc(DATA.you.name)}">${esc(DATA.you.initials)}</span></div>`;
}

/* document */
function renderDoc(opts = {}) {
  const o = person(DATA.doc.owner);
  let h = `<header class="row dhead"><div class="ml"></div><div class="tx">
      <div class="eyebrow">${esc(DATA.doc.kind)} · ${esc(DATA.library)}</div>
      <h1>${esc(DATA.doc.title)}</h1>
      <div class="dmeta"><span>Owner <b>${esc(o.name)}</b></span><span>Changed <b>${ago(docChanged())}</b></span><span>Audience <b>${audienceTotal()}</b></span>${opts.meta || ''}</div>
    </div><div class="mr"></div></header>`;
  DATA.sections.forEach((s, i) => {
    h += `<section class="sec" id="${s.id}" data-sid="${s.id}"><div class="row hrow"><div class="ml"></div><h2 class="tx"><span class="n">${i + 1}</span>${esc(s.title)}</h2><div class="mr"></div></div>`;
    s.paras.forEach(p => { h += `<div class="row prow" data-pid="${sid(s, p)}"><div class="ml"></div><p class="tx">${seamHTML(p)}</p><div class="mr"></div></div>`; });
    h += `</section>`;
  });
  $('#page').innerHTML = h;
}

/* tip */
function tip(html, x, y, place = 'left', maxW) {
  const t = $('#tip'); t.innerHTML = html; Icons.hydrate(t); t.style.maxWidth = maxW ? maxW + 'px' : '';
  const r = t.getBoundingClientRect(), W = innerWidth, H = innerHeight, g = px('--space-3');
  let L = place === 'left' ? x - r.width - g : place === 'below' ? x - r.width / 2 : x + g, T = place === 'below' ? y + g : y - r.height / 2;
  L = Math.max(g, Math.min(W - r.width - g, L)); T = Math.max(px('--band-top') + g, Math.min(H - r.height - g * 4, T));
  t.style.left = L + 'px'; t.style.top = T + 'px'; t.classList.add('on');
}
/* room between the text column and a right-hand x */
const roomRight = x => x - $('#page .prow .tx').getBoundingClientRect().right - px('--space-3');
const untip = () => $('#tip').classList.remove('on');

/* demo runner: shows its moment ~1.2 s after load; R replays */
let RUN = 0;
async function play() {
  const my = ++RUN; const alive = () => my === RUN;
  untip(); if (typeof reset === 'function') reset();
  await wait(ms('--motion-run'));
  if (alive() && typeof demo === 'function') await demo(alive);
}
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea')) return;
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); play(); }
  if (e.key === 'Escape') untip();
});
function boot() { renderBand(); if (typeof setup === 'function') setup(); Icons.hydrate(); play(); }

/* ===== variant ===== */
let marks = [];
const floorName = f => (DATA.audience.groups.find(g => g.floor === f) || { name: DATA.orgName }).name;
function setup() {
  renderDoc();
  DATA.sections.forEach(s => {
    if (s.stale) {
      $('#' + s.id).classList.add('stale');
      const h = $('#' + s.id + ' .hrow');
      h.insertAdjacentHTML('afterend', `<div class="row"><div class="ml"></div><p class="tx stale-note"><i data-lucide="clock" data-size="16"></i><span><b>Stale for ${span(-dueIn(s))}.</b> ${esc(s.stale)} ${esc(person(s.refresh).name)} can refresh it.</span></p><div class="mr"></div></div>`);
    }
    s.paras.forEach(p => { const r = $(`[data-pid="${sid(s, p)}"]`); r.style.setProperty('--e', p.edit); });
  });
  $('#legend').innerHTML = `<span><i class="lg-seam"></i>repair</span><span><i class="lg-stale"></i>stale</span><span><i class="lg-since"></i>new since you read, ${ago(DATA.you.lastReadAgo)}</span>`;
  $('#railfoot').innerHTML = `Read wear since <b>${fdate(DATA.readTrackingSinceAgo)}</b>.<br>No read record before.`;
  layout();
  addEventListener('resize', layout);
  $('#reader').addEventListener('scroll', thumb, { passive: true });
  const rail = $('#rail');
  rail.addEventListener('click', e => { const r = rail.getBoundingClientRect(); goTo((e.clientY - r.top) / r.height); });
  rail.addEventListener('mousemove', e => hover(e.clientY));
  rail.addEventListener('mouseleave', untip);
  rail.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { $('#reader').scrollBy(0, px("--travel-floor")); e.preventDefault(); } if (e.key === 'ArrowUp') { $('#reader').scrollBy(0, -px("--travel-floor")); e.preventDefault(); } });
  document.addEventListener('keydown', e => { if (e.key === ']' || e.key === '[') peak(e.key === ']' ? 1 : -1); });
}
function floorsOf(s) { const c = {}; s.edits.forEach(e => { const f = person(e[1]).floor; c[f] = (c[f] || 0) + 1; }); return c; }
function layout() {
  const rail = $('#rail'), H = rail.clientHeight, page = $('#page'), total = page.offsetHeight, half = rail.clientWidth / 2 - px('--space-1');
  const Y = el => el.offsetTop / total * H, Hh = el => Math.max(2, el.offsetHeight / total * H - 2);
  let h = '<div class="spine"></div>';
  marks = [];
  DATA.sections.forEach((s, i) => {
    const se = $('#' + s.id);
    h += `<div class="sec-tick" style="--y:${Y(se)}px"><b>${i + 1}</b></div>`;
    if (s.stale) h += `<div class="stale-band" style="--y:${Y(se)}px;--h:${Hh(se)}px"></div>`;
    if (s.changedSinceYou) h += `<div class="since" data-since style="--y:${Y(se)}px;--h:${Hh(se)}px"></div>`;
    const fl = floorsOf(s), n = s.edits.length;
    s.paras.forEach(p => {
      const el = $(`[data-pid="${sid(s, p)}"]`), y = Y(el), hh = Hh(el), w = p.edit * half;
      const segs = Object.entries(fl).map(([f, c]) => `<i data-floor="${f}" style="--w:${(w * c / n).toFixed(1)}px"></i>`).join('');
      h += `<div class="wear e pre" style="--y:${y}px;--h:${hh}px">${segs}</div>`;
      h += `<div class="wear r pre" style="--y:${y}px;--h:${hh}px"><i style="--w:${(p.read * half).toFixed(1)}px"></i></div>`;
      if (p.seam) h += `<div class="seam-tick" style="--y:${y + hh / 2}px"></div>`;
      marks.push({ s, p, y, hh, el });
    });
  });
  h += '<div class="thumb" id="thumb"></div>';
  rail.innerHTML = h;
  if (!RUN || DONE) $$('.wear.pre').forEach(w => w.classList.remove('pre'));
  thumb();
}
let DONE = false;
function thumb() {
  const r = $('#reader'), rail = $('#rail'), H = rail.clientHeight, t = $('#thumb'); if (!t) return;
  const sh = r.scrollHeight; t.style.setProperty('--y', (r.scrollTop / sh * H) + 'px'); t.style.setProperty('--h', (r.clientHeight / sh * H) + 'px');
  rail.setAttribute('aria-valuenow', Math.round(r.scrollTop / Math.max(1, sh - r.clientHeight) * 100));
}
function goTo(f) { const r = $('#reader'); r.scrollTo({ top: f * r.scrollHeight - r.clientHeight / 2, behavior: RM ? 'auto' : 'smooth' }); }
function describe(m) {
  const { s, p } = m, le = lastEdit(s), who = person(le[1]), fl = floorsOf(s), tot = audienceTotal();
  const n = s.paras.indexOf(p) + 1;
  const floors = Object.entries(fl).map(([f, c]) => `<span><i class="sw" data-floor="${f}"></i>${esc(floorName(f))} ${c}</span>`).join(' &nbsp; ');
  return `<span class="eyebrow">${esc(s.title)} · ¶${n}</span>
    <div class="l"><i data-lucide="pencil" data-size="14"></i><span>Edited <b>${s.edits.length - 1} times</b>, last <b>${ago(le[0])}</b> by <b>${esc(who.name)}</b>${le[2] === 'correction' ? ' (a correction)' : ''}</span></div>
    <div class="l"><i data-lucide="eye" data-size="14"></i><span>Read by <b>${readSinceTotal(s)} of ${tot}</b> since it changed · returned to <b>${p.ret} times</b></span></div>
    <div class="l" style="margin-top:var(--space-1)">${floors}</div>`;
}
function hover(cy) {
  const r = $('#rail').getBoundingClientRect(), y = cy - r.top;
  const m = marks.find(m => y >= m.y - 2 && y <= m.y + m.hh + 2); if (!m) return untip();
  tip(describe(m), r.left, cy, 'left');
}
function peak(dir) {
  const r = $('#reader'), cur = r.scrollTop + r.clientHeight / 2;
  const hot = marks.filter(m => m.p.edit > .7 || m.p.read > .8);
  const list = dir > 0 ? hot.filter(m => m.el.offsetTop > cur + 4) : hot.filter(m => m.el.offsetTop < cur - 4).reverse();
  const m = list[0] || (dir > 0 ? hot[0] : hot[hot.length - 1]); focusMark(m);
}
function focusMark(m) {
  const r = $('#reader'); $$('.prow.hot').forEach(x => x.classList.remove('hot')); m.el.classList.add('hot');
  r.scrollTo({ top: m.el.offsetTop - r.clientHeight / 2 + m.el.offsetHeight / 2, behavior: RM ? 'auto' : 'smooth' });
  setTimeout(() => { const rr = $('#rail').getBoundingClientRect(); const room = roomRight(rr.left); tip(describe(m), rr.left, rr.top + m.y + m.hh / 2, 'left', room > px('--measure-rail') - px('--space-5') ? Math.min(room, px('--measure-card')) : 0); }, RM ? 0 : ms('--motion-calm'));
}
function reset() {
  DONE = false; $('#reader').scrollTo({ top: 0 }); $$('.prow.hot').forEach(x => x.classList.remove('hot'));
  $$('.wear').forEach(w => w.classList.add('pre')); $$('[data-since]').forEach(s => s.classList.remove('flick'));
}
async function demo(alive) {
  for (const s of DATA.sections) {
    $$('.wear').filter(w => { const m = marks.find(m => Math.abs(m.y - parseFloat(w.style.getPropertyValue('--y'))) < .5); return m && m.s === s; }).forEach(w => w.classList.remove('pre'));
    await wait(ms('--motion-instant')); if (!alive()) return;
  }
  DONE = true;
  await wait(ms('--motion-calm')); if (!alive()) return;
  focusMark(marks.find(m => m.p.seam && m.s.id === 's4'));
  await wait(ms('--motion-calm')); if (!alive()) return;
  $$('[data-since]').forEach(s => s.classList.add('flick'));
}
boot();
</script>
</body>
</html>
