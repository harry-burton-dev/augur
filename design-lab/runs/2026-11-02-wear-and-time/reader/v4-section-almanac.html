<style>
/* ---------------------------------------------------------------
   Proposed tokens (time language, see ../grammar/v1-time-language.html).

:root{

  --x-wear: color-mix(in srgb, var(--ink) 55%, transparent);             /* proposed --mark-wear: matter, never light */
  --x-wear-read: color-mix(in srgb, var(--ink-muted) 45%, transparent);  /* proposed --mark-wear-read */
  --x-tide: color-mix(in srgb, var(--ink-muted) 60%, transparent);       /* proposed --mark-tide: a past date left behind */
  --x-now: color-mix(in srgb, var(--light) 80%, transparent);            /* proposed --mark-now: the one now line */
  --x-hatch: color-mix(in srgb, var(--ink-muted) 26%, transparent);      /* proposed --mark-stale-hatch ink */
  --x-stale: repeating-linear-gradient(45deg, transparent 0 var(--space-2), var(--x-hatch) var(--space-2) calc(var(--space-2) + 1px)); /* 45deg: shadow (unavailable) is 135deg */
  --x-past-dim: .62;                                                      /* proposed --time-past-dim: past is quieter than now */
  --x-margin: var(--space-8);
  --x-aside: var(--measure-drawer);
  --f-department: var(--floor-department-high);
  --f-team: var(--floor-team-high);
  --f-org: var(--floor-org-high);
  --f-you: var(--floor-you-high);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

<style>

.alm-axis .lab span.n{color:var(--light)}

.alm{display:grid;gap:var(--space-1)}
.ar{display:grid;grid-template-columns:var(--space-4) 1fr;gap:var(--space-1) var(--space-2);align-items:center;text-align:left;padding:var(--space-2) 0;border-radius:var(--radius-key);transition:background var(--motion-quick)}
.ar:hover{background:var(--surface-inset)}

.ar .t span:last-child{font:400 var(--type-small)/var(--leading-meta) var(--font-mono);color:var(--ink-muted);white-space:nowrap}

.next .l span:last-child{font-family:var(--font-mono);font-size:var(--type-small);color:var(--ink-muted)}

.key span{display:flex;gap:var(--space-2);align-items:center}
.key svg{flex:none;width:var(--space-5);height:var(--space-3)}
</style>

<script>

const DATA = {

const fdate = ago => { const d = dateOf(ago); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const span = d => { d = Math.abs(d); if (d < 1) return 'today'; if (d < 14) return d + (d === 1 ? ' day' : ' days'); if (d < 60) return Math.round(d / 7) + ' weeks'; if (d < 540) return Math.round(d / 30.4) + ' months'; return (Math.round(d / 36.5) / 10) + ' years'; };
const ago = d => d < 1 ? 'today' : span(d) + ' ago';
const person = id => id === 'you' ? DATA.you : DATA.people[id];
const audienceTotal = () => DATA.audience.groups.reduce((a, g) => a + g.n, 0);
const lastChange = s => Math.min(...s.edits.map(e => e[0]));
const lastEdit = s => s.edits.reduce((a, e) => e[0] < a[0] ? e : a);
const docChanged = () => Math.min(...DATA.sections.map(lastChange));
const versions = () => [...new Set(DATA.sections.flatMap(s => s.edits.map(e => e[0])))].sort((a, b) => b - a);
const readSinceTotal = s => Object.values(s.readSince).reduce((a, b) => a + b, 0);
const dueIn = s => s.reviewEvery - s.reviewedAgo;            /* negative: overdue */
const seamHTML = (p, cls = 'fix') => p.t.replace(/\{([^}]*)\}/g, (_, w) => `<span class="${cls}" data-fix="${p.id}">${w}</span>`);
const plain = t => t.replace(/[{}]/g, '');
const wait = t => new Promise(r => setTimeout(r, RM ? Math.min(t, ms('--motion-instant')) : t));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sid = (s, p) => s.id + '-' + p.id;

/* band */
function renderBand() {
  const o = person(DATA.doc.owner);
  $('#band').innerHTML = `
    <span class="app-name">${esc(DATA.app)}</span>
    <span class="fchip" data-floor="${DATA.floor.kind}">${esc(DATA.floor.name)}</span>
    <nav class="crumbs" aria-label="Breadcrumb">${esc(DATA.library)} <i data-lucide="chevron-right" data-size="14"></i> <b>${esc(DATA.doc.title)}</b></nav>
    <div class="band-r"><span>Version ${versions().length}</span><span>${esc(DATA.doc.status)}</span><span class="me" title="${esc(DATA.you.name)}">${esc(DATA.you.initials)}</span></div>`;
}

/* document */
function renderDoc(opts = {}) {
  const o = person(DATA.doc.owner);
  let h = `<header class="row dhead"><div class="ml"></div><div class="tx">
      <div class="eyebrow">${esc(DATA.doc.kind)} · ${esc(DATA.library)}</div>
      <h1>${esc(DATA.doc.title)}</h1>
      <div class="dmeta"><span>Owner <b>${esc(o.name)}</b></span><span>Changed <b>${ago(docChanged())}</b></span><span>Audience <b>${audienceTotal()}</b></span>${opts.meta || ''}</div>
    </div><div class="mr"></div></header>`;
  DATA.sections.forEach((s, i) => {
    h += `<section class="sec" id="${s.id}" data-sid="${s.id}"><div class="row hrow"><div class="ml"></div><h2 class="tx"><span class="n">${i + 1}</span>${esc(s.title)}</h2><div class="mr"></div></div>`;
    s.paras.forEach(p => { h += `<div class="row prow" data-pid="${sid(s, p)}"><div class="ml"></div><p class="tx">${seamHTML(p)}</p><div class="mr"></div></div>`; });
    h += `</section>`;
  });
  $('#page').innerHTML = h;
}

/* tip */
function tip(html, x, y, place = 'left', maxW) {
  const t = $('#tip'); t.innerHTML = html; Icons.hydrate(t); t.style.maxWidth = maxW ? maxW + 'px' : '';
  const r = t.getBoundingClientRect(), W = innerWidth, H = innerHeight, g = px('--space-3');
  let L = place === 'left' ? x - r.width - g : place === 'below' ? x - r.width / 2 : x + g, T = place === 'below' ? y + g : y - r.height / 2;
  L = Math.max(g, Math.min(W - r.width - g, L)); T = Math.max(px('--band-top') + g, Math.min(H - r.height - g * 4, T));
  t.style.left = L + 'px'; t.style.top = T + 'px'; t.classList.add('on');
}
/* room between the text column and a right-hand x */
const roomRight = x => x - $('#page .prow .tx').getBoundingClientRect().right - px('--space-3');
const untip = () => $('#tip').classList.remove('on');

/* demo runner: shows its moment ~1.2 s after load; R replays */
let RUN = 0;
async function play() {
  const my = ++RUN; const alive = () => my === RUN;
  untip(); if (typeof reset === 'function') reset();
  await wait(ms('--motion-run'));
  if (alive() && typeof demo === 'function') await demo(alive);
}
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea')) return;
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); play(); }
  if (e.key === 'Escape') untip();
});
function boot() { renderBand(); if (typeof setup === 'function') setup(); Icons.hydrate(); play(); }

/* ===== variant ===== */
/* one scale for every strip on the page */
const PAST = DATA.historyKeptSinceAgo, FUT = 182, NOWX = 760;
const X = d => d >= 0 ? NOWX * (1 - Math.sqrt(Math.min(d, PAST) / PAST)) : NOWX + (1000 - NOWX) * Math.min(-d, FUT) / FUT;   /* d = days ago; negative = future */
const fresh = a => Math.max(0, 1 - Math.sqrt(a / PAST));
function strip(s) {
  const due = -dueIn(s), over = due > 0;    /* due as days ago */
  let h = `<svg class="strip" viewBox="0 0 1000 24" preserveAspectRatio="none" aria-hidden="true">`;
  if (over) h += `<rect class="hatch" x="${X(due)}" y="2" width="${NOWX - X(due)}" height="20"/>`;
  h += `<line class="base" x1="0" y1="12" x2="${NOWX}" y2="12"/>`;
  s.edits.forEach(e => { h += `<line class="tick ${e[2] === 'correction' ? 'fix' : ''}" data-floor="${person(e[1]).floor}" style="--fresh:${fresh(e[0]).toFixed(2)}" x1="${X(e[0])}" y1="5" x2="${X(e[0])}" y2="19"/>`; });
  h += `<line class="rev" x1="${X(s.reviewedAgo)}" y1="19" x2="${X(s.reviewedAgo)}" y2="24"/>`;
  if (over) h += `<line class="tide" x1="${X(due)}" y1="0" x2="${X(due)}" y2="24"/>`;
  else h += `<line class="travel" x1="${NOWX}" y1="12" x2="${X(due)}" y2="12"/>` + (dueIn(s) <= FUT ? `<line class="due" x1="${X(due)}" y1="6" x2="${X(due)}" y2="18"/>` : '');
  h += `<line class="now" x1="${NOWX}" y1="0" x2="${NOWX}" y2="24"/></svg>`;
  return h;
}
const stateOf = s => { const d = dueIn(s); return d < 0 ? { t: `review ${span(-d)} overdue`, over: true } : d <= FUT ? { t: `review in ${span(d)}` } : { t: `reviewed ${ago(s.reviewedAgo)}` }; };
function setup() {
  renderDoc();
  DATA.sections.forEach((s, i) => {
    const h = $('#' + s.id + ' .hrow .tx'), st = stateOf(s);
    h.innerHTML = `<span class="t">${h.innerHTML}</span><span class="state ${st.over ? 'over' : ''}">${st.t}</span>${strip(s)}`;
    if (s.stale) {
      $('#' + s.id).classList.add('stale');
      const who = person(s.refresh), dueAgo = -dueIn(s);
      $('#' + s.id + ' .hrow').insertAdjacentHTML('afterend', `<div class="row"><div class="ml"></div><div class="tx stale-card"><i data-lucide="clock" data-size="18"></i>
        <div><b>Out of date for ${span(dueAgo)}.</b> Its review fell due on ${fdate(dueAgo)} and nobody has looked at it since ${fdate(s.reviewedAgo)}. ${esc(s.stale)}</div>
        <div class="acts"><button class="btn"><i data-lucide="mail" data-size="16"></i>Ask ${esc(who.name)} to refresh</button><span class="why"><b>${esc(who.name)}</b> (${esc(who.role)}) can refresh it; ${esc(person(DATA.doc.owner).name)} can mark it as still right.</span></div></div><div class="mr"></div></div>`);
    }
  });
  const over = DATA.sections.filter(s => dueIn(s) < 0), soon = DATA.sections.filter(s => dueIn(s) >= 0 && dueIn(s) <= FUT).sort((a, b) => dueIn(a) - dueIn(b));
  $('#alm-h').textContent = `${over.length} out of date, ${soon.length} due soon`;
  $('#next').innerHTML = [...over.map(s => `<div class="l"><span>${esc(s.title)}</span><span>${span(-dueIn(s))} overdue</span></div>`), ...soon.map(s => `<div class="l"><span>${esc(s.title)}</span><span>in ${span(dueIn(s))}</span></div>`)].join('');
  const ticks = [[PAST, fdate(PAST).slice(-4)], [365, fdate(365).slice(-4)], [0, 'now', 'n'], [-FUT, '+6 mo']];
  $('#axis').innerHTML = ticks.map(t => `<span class="${t[2] || ''}" style="left:${X(t[0]) / 10}%">${t[1]}</span>`).join('');
  $('#alm').innerHTML = DATA.sections.map((s, i) => { const st = stateOf(s); return `<button class="ar" data-go="${s.id}"><span class="n">${i + 1}</span><span class="t"><span>${esc(s.title)}</span><span class="${st.over ? 'over' : ''}">${st.t}</span></span><span></span>${strip(s)}</button>`; }).join('');
  const k = (inner, l) => `<span><svg viewBox="0 0 28 12" class="strip" preserveAspectRatio="none">${inner}</svg>${l}</span>`;
  $('#key').innerHTML = k('<line class="tick" data-floor="department" style="--fresh:1" x1="14" y1="1" x2="14" y2="11"/>', 'a change') + k('<line class="tick fix" x1="14" y1="1" x2="14" y2="11"/>', 'a repair') + k('<line class="now" x1="14" y1="0" x2="14" y2="12"/>', 'now') + k('<line class="travel" x1="2" y1="6" x2="22" y2="6"/><line class="due" x1="23" y1="2" x2="23" y2="10"/>', 'distance to review') + k('<line class="tide" x1="6" y1="0" x2="6" y2="12"/><rect class="hatch" x="6" y="1" width="20" height="10"/>', 'missed date, stale since') + k('<line class="rev" x1="14" y1="6" x2="14" y2="12"/>', 'last review');
  $$('.ar').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}
function go(id) { const r = $('#reader'), el = $('#' + id); r.scrollTo({ top: el.offsetTop - px('--space-6'), behavior: RM ? 'auto' : 'smooth' }); }
function reset() { $('#reader').scrollTo({ top: 0 }); document.body.classList.add('pre'); document.body.classList.remove('draw'); }
async function demo(alive) {
  document.body.classList.add('draw'); document.body.classList.remove('pre');
  await wait(ms('--motion-calm') * 2); if (!alive()) return;
  go(DATA.sections.find(s => s.stale).id);
}
boot();
</script>
</body>
</html>
