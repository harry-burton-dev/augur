const root = document.documentElement;
const tok = n => getComputedStyle(root).getPropertyValue(n).trim();
const ms = n => parseFloat(tok(n)) || 0;
const px = n => { const v = tok(n); return v.endsWith('rem') ? parseFloat(v) * 16 : parseFloat(v) || 0; };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NOW = new Date(DATA.now + 'T12:00:00');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dateOf = ago => { const d = new Date(NOW); d.setDate(d.getDate() - ago); return d; };
const fdate = ago => { const d = dateOf(ago); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const span = d => { d = Math.abs(d); if (d < 1) return 'today'; if (d < 14) return d + (d === 1 ? ' day' : ' days'); if (d < 60) return Math.round(d / 7) + ' weeks'; if (d < 540) return Math.round(d / 30.4) + ' months'; return (Math.round(d / 36.5) / 10) + ' years'; };
const ago = d => d < 1 ? 'today' : span(d) + ' ago';
const person = id => id === 'you' ? DATA.you : DATA.people[id];
const audienceTotal = () => DATA.audience.groups.reduce((a, g) => a + g.n, 0);
const lastChange = s => Math.min(...s.edits.map(e => e[0]));
const lastEdit = s => s.edits.reduce((a, e) => e[0] < a[0] ? e : a);
const docChanged = () => Math.min(...DATA.sections.map(lastChange));
const versions = () => [...new Set(DATA.sections.flatMap(s => s.edits.map(e => e[0])))].sort((a, b) => b - a);
const readSinceTotal = s => Object.values(s.readSince).reduce((a, b) => a + b, 0);
const dueIn = s => s.reviewEvery - s.reviewedAgo;            /* negative: overdue */
const seamHTML = (p, cls = 'fix') => p.t.replace(/\{([^}]*)\}/g, (_, w) => `<span class="${cls}" data-fix="${p.id}">${w}</span>`);
const plain = t => t.replace(/[{}]/g, '');
const wait = t => new Promise(r => setTimeout(r, RM ? Math.min(t, ms('--motion-instant')) : t));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sid = (s, p) => s.id + '-' + p.id;

/* band */
function renderBand() {
  const o = person(DATA.doc.owner);
  $('#band').innerHTML = `
    <span class="app-name">${esc(DATA.app)}</span>
    <span class="fchip" data-floor="${DATA.floor.kind}">${esc(DATA.floor.name)}</span>
    <nav class="crumbs" aria-label="Breadcrumb">${esc(DATA.library)} <i data-lucide="chevron-right" data-size="14"></i> <b>${esc(DATA.doc.title)}</b></nav>
    <div class="band-r"><span>Version ${versions().length}</span><span>${esc(DATA.doc.status)}</span><span class="me" title="${esc(DATA.you.name)}">${esc(DATA.you.initials)}</span></div>`;
}

/* document */
function renderDoc(opts = {}) {
  const o = person(DATA.doc.owner);
  let h = `<header class="row dhead"><div class="ml"></div><div class="tx">
      <div class="eyebrow">${esc(DATA.doc.kind)} · ${esc(DATA.library)}</div>
      <h1>${esc(DATA.doc.title)}</h1>
      <div class="dmeta"><span>Owner <b>${esc(o.name)}</b></span><span>Changed <b>${ago(docChanged())}</b></span><span>Audience <b>${audienceTotal()}</b></span>${opts.meta || ''}</div>
    </div><div class="mr"></div></header>`;
  DATA.sections.forEach((s, i) => {
    h += `<section class="sec" id="${s.id}" data-sid="${s.id}"><div class="row hrow"><div class="ml"></div><h2 class="tx"><span class="n">${i + 1}</span>${esc(s.title)}</h2><div class="mr"></div></div>`;
    s.paras.forEach(p => { h += `<div class="row prow" data-pid="${sid(s, p)}"><div class="ml"></div><p class="tx">${seamHTML(p)}</p><div class="mr"></div></div>`; });
    h += `</section>`;
  });
  $('#page').innerHTML = h;
}

/* tip */
function tip(html, x, y, place = 'left', maxW) {
  const t = $('#tip'); t.innerHTML = html; Icons.hydrate(t); t.style.maxWidth = maxW ? maxW + 'px' : '';
  const r = t.getBoundingClientRect(), W = innerWidth, H = innerHeight, g = px('--space-3');
  let L = place === 'left' ? x - r.width - g : place === 'below' ? x - r.width / 2 : x + g, T = place === 'below' ? y + g : y - r.height / 2;
  L = Math.max(g, Math.min(W - r.width - g, L)); T = Math.max(px('--band-top') + g, Math.min(H - r.height - g * 4, T));
  t.style.left = L + 'px'; t.style.top = T + 'px'; t.classList.add('on');
}
/* room between the text column and a right-hand x */
const roomRight = x => x - $('#page .prow .tx').getBoundingClientRect().right - px('--space-3');
const untip = () => $('#tip').classList.remove('on');

/* demo runner: shows its moment ~1.2 s after load; R replays */
let RUN = 0;
async function play() {
  const my = ++RUN; const alive = () => my === RUN;
  untip(); if (typeof reset === 'function') reset();
  await wait(ms('--motion-run'));
  if (alive() && typeof demo === 'function') await demo(alive);
}
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea')) return;
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); play(); }
  if (e.key === 'Escape') untip();
});
function boot() { renderBand(); if (typeof setup === 'function') setup(); Icons.hydrate(); play(); }

/* ===== variant ===== */
const changesOf = (s, p) => {
  const who = a => (s.edits.find(e => e[0] === a) || [0, DATA.doc.owner])[1];
  let list = p.history ? [...p.history.map(h => h[0]), p.seam ? p.seam.ago : lastChange(s)] : (p.edit > .3 && lastChange(s) < DATA.historyKeptSinceAgo ? [DATA.historyKeptSinceAgo, lastChange(s)] : [DATA.historyKeptSinceAgo]);
  return list.map(a => ({ ago: a, who: who(a), fix: !!(p.seam && p.seam.ago === a) }));
};
const fresh = a => Math.max(0, 1 - Math.sqrt(a / DATA.historyKeptSinceAgo));
function setup() {
  renderDoc();
  $('#legend').innerHTML = `<span class="eyebrow">In the margins</span><span><i class="lg-led"></i>a change, newest on top, by floor</span><span><i class="lg-fix"></i>a repair</span><span><i class="lg-worn"></i>worn edge: how much it is read</span><span><i class="lg-ear"></i>dog-ear: people come back to it</span>`;
  DATA.sections.forEach(s => {
    if (s.stale) $('#' + s.id).classList.add('stale'), $('#' + s.id + ' .hrow').insertAdjacentHTML('afterend', `<div class="row"><div class="ml"></div><p class="tx stale-note"><i data-lucide="clock" data-size="16"></i><span><b>Stale for ${span(-dueIn(s))}.</b> ${esc(s.stale)} ${esc(person(s.refresh).name)} can refresh it.</span></p><div class="mr"></div></div>`);
    s.paras.forEach(p => {
      const row = $(`[data-pid="${sid(s, p)}"]`), ch = changesOf(s, p).slice().reverse();
      row.tabIndex = 0; row.setAttribute('aria-label', `Paragraph ${s.paras.indexOf(p) + 1} of ${s.title}. Last changed ${ago(ch[0].ago)}. Press Enter for its history.`);
      row.querySelector('.ml').innerHTML = `<div class="ledger">${ch.map((c, i) => `<i data-floor="${person(c.who).floor}" class="${c.fix ? 'fix' : ''}" style="--len:calc(var(--space-5) - ${Math.min(i, 4)} * var(--space-1));--fresh:${fresh(c.ago).toFixed(2)};transition-delay:calc(${ch.length - i} * var(--motion-instant))"></i>`).join('')}<span class="age" style="--fresh:${fresh(ch[0].ago).toFixed(2)}">${span(ch[0].ago)}</span></div>`;
      let mr = `<div class="worn" style="--r:${p.read}"></div>`;
      if (p.ret >= 10) { row.classList.add('ear'); mr += `<span class="rets" title="Opened at this paragraph ${p.ret} times">${p.ret}×</span>`; }
      row.querySelector('.mr').innerHTML = mr;
      row.querySelectorAll('.fix').forEach(f => { f.tabIndex = 0; f.setAttribute('role', 'button'); f.setAttribute('aria-label', f.textContent + ', since when?'); });
      row.addEventListener('mouseenter', () => !PINNED && openPara(s, p));
      row.addEventListener('mouseleave', () => !PINNED && closeCard());
      row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const f = e.target.closest('.fix'); f ? openValue(s, p, true) : openPara(s, p, true); } });
      row.querySelectorAll('.fix').forEach(f => { f.addEventListener('mouseenter', e => { e.stopPropagation(); openValue(s, p); }); f.addEventListener('click', () => openValue(s, p, true)); });
    });
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { PINNED = false; closeCard(); } });
  document.addEventListener('click', e => { if (!e.target.closest('.card,.fix')) { PINNED = false; closeCard(); } });
}
let PINNED = false;
function place(row) {
  const c = $('#card'), tr = row.querySelector('.tx').getBoundingClientRect(), L = tr.right + px('--space-6'), W = Math.min(px('--measure-card'), innerWidth - L - px('--edge-tight'));
  c.style.left = L + 'px'; c.style.width = W + 'px';
  const h = c.offsetHeight; c.style.top = Math.max(px('--band-top') + px('--space-3'), Math.min(innerHeight - h - px('--space-7'), tr.top - px('--space-2'))) + 'px';
}
function openPara(s, p, pin) {
  const row = $(`[data-pid="${sid(s, p)}"]`), ch = changesOf(s, p), first = ch[0], last = ch[ch.length - 1], tot = audienceTotal();
  $$('.prow.ask').forEach(r => r.classList.remove('ask')); row.classList.add('ask');
  $('#card').innerHTML = `<span class="eyebrow">${esc(s.title)} · paragraph ${s.paras.indexOf(p) + 1}</span>
    <p>Written <b>${ago(first.ago)}</b> by <b>${esc(person(first.who).name)}</b>. ${ch.length > 1 ? `Changed <b>${ch.length - 1} ${ch.length > 2 ? 'times' : 'time'}</b> since, last <b>${ago(last.ago)}</b> by <b>${esc(person(last.who).name)}</b>.` : 'Not changed since.'}</p>
    <p>Read by <b>${readSinceTotal(s)} of ${tot}</b> since that change. People opened the document at this paragraph <b>${p.ret} times</b>.</p>
    ${first.ago >= DATA.historyKeptSinceAgo ? `<p class="why">History before ${fdate(DATA.historyKeptSinceAgo)} was not kept when the policy moved here.</p>` : ''}`;
  Icons.hydrate($('#card')); place(row); $('#card').classList.add('on'); PINNED = !!pin;
}
function valuesOf(s, p) {
  const fx = (p.t.match(/\{([^}]*)\}/) || [])[1], cur = plain(p.t).split(' '), pre = p.t.split('{')[0].trim().split(' ').length;
  const out = (p.history || []).map(([a, t]) => { const w = t.split(' ')[pre] || ''; return { ago: a, v: w.replace(/[,.]$/, '') + fx.slice(fx.split(' ')[0].length) }; });
  out.push({ ago: p.seam.ago, v: fx, now: true });
  if (p.seam) { const i = out.findIndex(o => o.v === p.seam.was); if (i >= 0) out[i].err = true; }
  return out.map((o, i) => ({ ...o, until: i < out.length - 1 ? out[i + 1].ago : 0, who: (s.edits.find(e => e[0] === o.ago) || [0, DATA.doc.owner])[1] }));
}
function openValue(s, p, pin) {
  const row = $(`[data-pid="${sid(s, p)}"]`), vs = valuesOf(s, p), H = DATA.historyKeptSinceAgo, X = a => Math.sqrt(a / H);
  const cur = vs[vs.length - 1];
  $$('.prow.ask').forEach(r => r.classList.remove('ask')); row.classList.add('ask');
  $('#card').innerHTML = `<span class="eyebrow">Why is this ${esc(cur.v)}, and since when?</span>
    <h4>${esc(cur.v)} since ${fdate(cur.ago)}</h4>
    <div class="strata">${vs.slice().reverse().map(v => `<div class="st ${v.now ? 'now' : ''} ${v.err ? 'err' : ''}" data-floor="${person(v.who).floor}"><span class="v">${esc(v.v)}</span>
      <span class="bar" style="--fresh:${fresh(v.ago).toFixed(2)};margin-left:${((1 - X(v.ago)) * 100).toFixed(1)}%;margin-right:${(X(v.until) * 100).toFixed(1)}%"></span></div>
      <div class="st"><span></span><span>${v.now ? 'now' : 'for ' + span(v.ago - v.until)} · ${esc(person(v.who).name)}${v.err ? ' · an error' : ''}</span></div>`).join('')}</div>
    <div class="axis"><span></span><div><span>${fdate(H).replace(/^\d+ /, '')}</span><span>now</span></div></div>
    <div class="seamwhy"><i data-lucide="info" data-size="16"></i><span>${esc(p.seam.why)} Corrected by ${esc(person(p.seam.who).name)}, ${ago(p.seam.ago)}.</span></div>
    <div class="acts"><button class="btn"><i data-lucide="history" data-size="16"></i>Full history</button><button class="btn"><i data-lucide="mail" data-size="16"></i>Ask ${esc(person(p.seam.who).name.split(' ')[0])}</button></div>`;
  Icons.hydrate($('#card')); place(row); $('#card').classList.add('on'); PINNED = !!pin;
}
function closeCard() { $('#card').classList.remove('on'); $$('.prow.ask').forEach(r => r.classList.remove('ask')); }
function reset() { PINNED = false; closeCard(); $('#reader').scrollTo({ top: 0 }); $('#page').classList.add('pre'); }
async function demo(alive) {
  $('#page').classList.remove('pre');
  await wait(ms('--motion-calm')); if (!alive()) return;
  const s = DATA.sections.find(s => s.id === 's4'), p = s.paras[0], row = $(`[data-pid="${sid(s, p)}"]`), r = $('#reader');
  r.scrollTo({ top: row.offsetTop - px('--space-8') * 1.5, behavior: RM ? 'auto' : 'smooth' });
  await wait(ms('--motion-slow') * 3); if (!alive()) return;
  openValue(s, p, true);
}
boot();
</script>
</body>
</html>
