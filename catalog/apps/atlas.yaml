    augur.dev/release-unit: augur
    augur.dev/app-id: atlas
spec:
  type: service
  lifecycle: experimental
  owner: group:default/augur-core
  system: atlas
  consumesApis:
    - api:default/events-api
    - api:default/gateway-api
    - api:default/identity-api
    - api:default/models-api
