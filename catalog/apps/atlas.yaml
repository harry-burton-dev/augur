spec:
  type: augur-intent
  lifecycle: experimental
  owner: group:default/augur-core
  system: atlas
  definition: |
    intents:
      - entity.open
      - entity.pick
      - entity.explain
      - entity.propose
---
apiVersion: backstage.io/v1alpha1
kind: Resource
