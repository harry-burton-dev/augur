# AUGUR's email theme (ADR 0041): Keycloak's own emails and wording, in every language Keycloak has, in
# AUGUR's layout (html/template.ftl, written by scripts/email-layout.mjs from email-layout.ftl).
parent=base
locales=ar,az,ca,cs,da,de,el,en,es,eu,fa,fr,fi,hr,hu,hy,id,it,ja,kk,ko,ky,lt,nl,no,pl,pt,pt-BR,ro,ru,sk,sl,sv,th,tr,uk,vi,zh-CN,zh-TW
# The organisation's name, from Keycloak's environment, as the sign-in pages have it (vite.config.ts).
orgName=${env.ORG_NAME:Organisation}
