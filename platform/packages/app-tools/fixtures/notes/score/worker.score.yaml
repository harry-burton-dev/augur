apiVersion: score.dev/v1b1
metadata:
  name: worker
  annotations:
    augur.dev/part: worker
containers:
  worker:
    image: ghcr.io/example-org/augur-notes-worker@sha256:1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809
    variables:
      GATEWAY_URL: ${resources.gateway.url}
      CLIENT_ID: ${resources.gateway.client_id}
      S3_ENDPOINT: ${resources.files.endpoint}
      S3_REGION: ${resources.files.region}
      S3_BUCKET: ${resources.files.bucket}
      S3_ACCESS_KEY_ID: ${resources.files.access_key_id}
      MAPS_DIR: /maps
    files:
      /run/augur/client-secret:
        mode: "0400"
        content: ${resources.gateway.client_secret}
      /run/augur/s3-secret:
        mode: "0400"
        content: ${resources.files.secret_access_key}
    volumes:
      /maps:
        source: ${resources.maps}
        readOnly: true
    resources:
      limits:
        memory: 256Mi
        cpu: 500m
resources:
  gateway:
    type: augur-gateway
  files:
    type: augur-bucket
  maps:
    type: augur-files
    params:
      label: Map tiles
      detail: Offline map tiles the worker renders previews from
  internet:
    type: augur-outbound
    params:
      hosts: [tiles.example.org]
      why: Fetches map tiles the admin has not provided offline
