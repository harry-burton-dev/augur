apiVersion: score.dev/v1b1
metadata:
  name: web
  annotations:
    augur.dev/part: service
    augur.dev/ready-seconds: "120"
service:
  ports:
    http:
      port: 8080
containers:
  web:
    image: ghcr.io/example-org/augur-notes@sha256:0f3d6a4c1b6b8d9e2f7a5c4b3e2d1c0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b
    variables:
      PORT: "8080"
      GATEWAY_URL: ${resources.gateway.url}
      CLIENT_ID: ${resources.gateway.client_id}
      CALLER_KEYS_URL: ${resources.gateway.caller_keys_url}
      DATABASE_HOST: ${resources.db.host}
      DATABASE_NAME: ${resources.db.name}
      DATABASE_USER: ${resources.db.user}
      DATABASE_SCHEMA: ${resources.db.schema}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${resources.telemetry.otlp_endpoint}
      OTEL_SERVICE_NAME: ${resources.telemetry.service_name}
      RETENTION_DAYS: ${resources.settings.retentionDays}
      ALLOW_SHARING: ${resources.settings.allowSharing}
    files:
      /run/augur/client-secret:
        mode: "0400"
        content: ${resources.gateway.client_secret}
      /run/augur/database-password:
        mode: "0400"
        content: ${resources.db.password}
      /run/augur/export-key:
        mode: "0400"
        content: ${resources.settings.exportKey}
    volumes:
      /scratch:
        source: ${resources.scratch}
    resources:
      limits:
        memory: 512Mi
        cpu: "1"
      requests:
        memory: 128Mi
        cpu: 100m
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
resources:
  gateway:
    type: augur-gateway
    params:
      inbound: true
  db:
    type: augur-database
    params:
      connections: 10
  telemetry:
    type: augur-telemetry
  settings:
    type: augur-settings
    params:
      ids: [retentionDays, allowSharing, exportKey]
  scratch:
    type: augur-scratch
    params:
      size: 256Mi
