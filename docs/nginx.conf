# The docs site's server (docs/Dockerfile). nginx fills in ${DOCS_BASE} from the environment when the container starts.
server {
    listen 8080;
    root /usr/share/nginx/html;
    # A redirect (/run to /run/) keeps the address the reader used, not nginx's own port behind a proxy.
    absolute_redirect off;
    server_tokens off;
    error_page 404 ${DOCS_BASE}404.html;

    # Astro's built assets have a hash in their names, so they never change.
    location ${DOCS_BASE}_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
