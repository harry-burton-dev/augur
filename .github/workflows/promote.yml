name: Promote to stable
# Makes a beta release stable (docs/release-channels.md): the same release, built and signed once, is
# marked stable, with promotion.json attached to say who did it and when. Nothing is rebuilt, and no
# branch or pull request is made. Only the repository's owner may run it. The unit is augur or an
# app's id; the version, by default, is that unit's newest beta.
on:
  workflow_dispatch:
    inputs:
      unit:
        description: 'What to make stable: augur, or the id of an app released from this repository'
        required: true
        default: augur
      version:
        description: 'The version (by default, the newest beta)'
        required: false
      skip_bake:
        description: 'Skip the bake time (ADR 0018): make it stable even if it hasn’t run long enough on a preview deployment. Recorded in promotion.json.'
        type: boolean
        default: false
concurrency: promote-${{ inputs.unit }}
permissions:
  contents: write
  packages: write
  # For the Release feed workflow, which signs the feed.
  id-token: write
env:
  # Reads AUGUR's kit packages from GitHub Packages (.npmrc): a classic token with read:packages, else this run's own.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be tested in a step's `if`, so whether one is set is read from here.
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    outputs:
      promoted: ${{ steps.stable.outputs.promoted }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bake time is asked of the portal (Backstage), which is only on the tailnet (ADR 0045). Without
      # the Tailscale client and PORTAL_URL, the promotion says bake time wasn't checked.
      - name: Join the tailnet to ask the portal
        if: env.TS_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Make it stable
        id: stable
        run: node scripts/promote.mjs stable "$UNIT" "$VERSION"
        env:
          UNIT: ${{ inputs.unit }}
          VERSION: ${{ inputs.version }}
          SKIP_BAKE: ${{ inputs.skip_bake }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Deployments learn the release is stable from the feed beside the images.
  feed:
    needs: promote
    if: needs.promote.outputs.promoted != ''
    uses: ./.github/workflows/feed.yml
    # A called workflow gets no secrets unless passed: the feed reads the app repositories with APP_RELEASES_TOKEN.
    secrets: inherit
