name: Lockfile
# Brings pnpm-lock.yaml up to date on a pull request's branch and pushes it there. For a change that
# adds or bumps a package from GitHub Packages (the kit, ADR 0046) made where no read token is set, such
# as a cloud session: Actions → Lockfile → Run workflow, with the branch. It pushes with RELEASE_TOKEN,
# so CI runs on the new commit. Never on main.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: The pull request's branch
        required: true
permissions:
  contents: read
  packages: read
env:
  # Reads AUGUR's kit packages from GitHub Packages (.npmrc): a classic token with read:packages, else this run's own.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
jobs:
  lock:
    if: inputs.branch != 'main' && !startsWith(inputs.branch, 'release/')
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --lockfile-only
      - name: Push it, if it changed
        run: |
          if [ -z "$(git status --porcelain pnpm-lock.yaml)" ]; then
            echo "pnpm-lock.yaml is already up to date" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update pnpm-lock.yaml" pnpm-lock.yaml
          git push origin "HEAD:$BRANCH"
        env:
          BRANCH: ${{ inputs.branch }}
