name: Lockfile
# Brings pnpm-lock.yaml up to date on a pull request's branch, and release/kit.json with it once the kit
# bundle is pinned there (scripts/kit.mjs), and THIRD_PARTY_NOTICES.md (scripts/licences.mjs), and pushes them.
# With freeze, it also keeps the contract reference app built against the current SDK minor. For a change that adds or bumps a package from
# GitHub Packages (the kit, ADR 0046) made where no read token is set, such as a cloud session:
# Actions → Lockfile → Run workflow, with the branch. It pushes with RELEASE_TOKEN, so CI runs on the new
# commit. Never on main or a release branch. Two jobs: the first runs the branch's code with no secret but
# the packages read token, and hands over only a patch of the files above; the second runs none of the
# branch's code, refuses a patch that touches anything else, and alone has the token it pushes with.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: The pull request's branch
        required: true
      freeze:
        description: Also keep the contract reference app built against this SDK minor (platform/contract/freeze.mjs)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lock:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: read
    env:
      # Reads AUGUR's kit packages from GitHub Packages (.npmrc): a classic token with read:packages, else this run's own.
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      sha: ${{ steps.patch.outputs.sha }}
    steps:
      # The branch's own code runs below, so first make sure it is a branch, and one this may push to:
      # never main, a release branch or any other ref (refs/pull/<n>/head, refs/heads/main, a tag).
      - name: Is it a branch this may push to?
        run: |
          refuse() { echo "::error::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          case "$BRANCH" in
            refs/*) refuse "Give the branch's name, not a ref: \"$BRANCH\"." ;;
            main | release/*) refuse "The Lockfile workflow never pushes to $BRANCH: give a pull request's branch." ;;
          esac
          git check-ref-format --branch "$BRANCH" > /dev/null 2>&1 || refuse "\"$BRANCH\" isn't a branch name."
        env:
          BRANCH: ${{ inputs.branch }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/heads/${{ inputs.branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Pin the kit bundle installed
        run: if [ -f scripts/kit.mjs ]; then node scripts/kit.mjs pin; fi
      - name: Write the open-source notices from what is installed
        run: if [ -f scripts/licences.mjs ]; then node scripts/licences.mjs notices; fi
      # After a release that moves the SDK's minor, where no package token can build it (a cloud session).
      - name: Keep the frozen contract build
        if: inputs.freeze
        run: |
          pnpm turbo run build --filter=@augur/contract-tests^...
          pnpm --filter @augur/contract-tests freeze
      # Only these paths go in the patch; the push job checks that again, as nothing here is trusted.
      - name: Make the patch
        id: patch
        run: |
          paths=()
          for path in pnpm-lock.yaml release/kit.json THIRD_PARTY_NOTICES.md platform/contract/frozen; do
            [ -e "$path" ] && paths+=("$path")
          done
          git add --intent-to-add -- "${paths[@]}"
          git diff --binary -- "${paths[@]}" > "$RUNNER_TEMP/lockfile.patch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ ! -s "$RUNNER_TEMP/lockfile.patch" ]; then
            echo "pnpm-lock.yaml, release/kit.json, THIRD_PARTY_NOTICES.md and the frozen builds are already up to date" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lockfile-patch
          path: ${{ runner.temp }}/lockfile.patch
          retention-days: 1
          if-no-files-found: error

  # Runs none of the branch's code: no pnpm, no repository script, no hook. It checks the patch touches
  # only the files the first job may change, applies it to the commit that job built from, and pushes.
  push:
    needs: lock
    if: needs.lock.outputs.changed == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    permissions:
      # Only for the run's own token, when RELEASE_TOKEN isn't set.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.lock.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lockfile-patch
          path: ${{ runner.temp }}/patch
      - name: Does it touch only what it may?
        run: |
          refuse() { echo "::error::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          # No renames, copies, symbolic links or submodules: only plain files, changed, added or deleted.
          if grep -qE '^(rename|copy) (from|to) |^(new file |deleted file |old |new )?mode 1[26]0000' "$PATCH"; then
            refuse "The patch renames or copies a file, or adds a link or submodule, which the Lockfile workflow never does."
          fi
          git -c core.hooksPath=/dev/null apply --check "$PATCH" || refuse "The patch doesn't apply to $SHA."
          while IFS= read -r -d '' line; do
            path=${line#*$'\t'}
            path=${path#*$'\t'}
            case "/$path/" in */../* | */./* | //*) refuse "The patch names a path outside the repository: $path" ;; esac
            case "$path" in
              pnpm-lock.yaml | release/kit.json | THIRD_PARTY_NOTICES.md | platform/contract/frozen/*) ;;
              *) refuse "The patch changes $path, which the Lockfile workflow never changes." ;;
            esac
          done < <(git apply --numstat -z "$PATCH")
        env:
          PATCH: ${{ runner.temp }}/patch/lockfile.patch
          SHA: ${{ needs.lock.outputs.sha }}
      - name: Commit it
        run: |
          git -c core.hooksPath=/dev/null apply --index --binary "$PATCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit --no-verify -m "Update pnpm-lock.yaml, the kit pin, the open-source notices and the frozen builds"
        env:
          PATCH: ${{ runner.temp }}/patch/lockfile.patch
      # The token is given to this one git command, as a header, never written to .git/config or echoed.
      # It pushes to the branch by its full name, so a branch that moved since is refused, not overwritten.
      - name: Push it
        run: |
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c core.hooksPath=/dev/null -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $auth" \
            push "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
        env:
          BRANCH: ${{ inputs.branch }}
          PUSH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
