name: Lockfile
# Brings pnpm-lock.yaml up to date on a pull request's branch, and release/kit.json with it once the kit
# bundle is pinned there (scripts/kit.mjs), and pushes them. For a change that adds or bumps a package from
# GitHub Packages (the kit, ADR 0046) made where no read token is set, such as a cloud session:
# Actions → Lockfile → Run workflow, with the branch. It pushes with RELEASE_TOKEN, so CI runs on the new
# commit. Never on main.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: The pull request's branch
        required: true
permissions:
  contents: read
  packages: read
env:
  # Reads AUGUR's kit packages from GitHub Packages (.npmrc): a classic token with read:packages, else this run's own.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
jobs:
  lock:
    if: inputs.branch != 'main' && !startsWith(inputs.branch, 'release/')
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Pin the kit bundle installed
        run: if [ -f scripts/kit.mjs ]; then node scripts/kit.mjs pin; fi
      - name: Push them, if they changed
        run: |
          if [ -z "$(git status --porcelain pnpm-lock.yaml release/kit.json)" ]; then
            echo "pnpm-lock.yaml and release/kit.json are already up to date" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          [ -f release/kit.json ] && git add release/kit.json
          git commit -m "Update pnpm-lock.yaml and the kit pin"
          git push origin "HEAD:$BRANCH"
        env:
          BRANCH: ${{ inputs.branch }}
