name: App dev builds
# Every merge into main that changes an app in apps/ (other than those that ship with AUGUR) gets a dev
# build of each app it changes: a signed bundle, as the Release workflow makes, with the version
# <next patch>-dev.<run>, released as the pre-release app/<id>@<that version>. Only a preview server
# (SERVER_RING=preview) whose admin set the app to take dev builds installs it, after a backup, as it
# would a release. Each app keeps its newest few dev builds. See docs/release-channels.md, "Dev builds".
on:
  push:
    branches: [main]
    # The apps that ship with AUGUR go out in its dev builds (augur-dev.yml).
    paths: ['apps/**', '!apps/*.md']
concurrency:
  group: app-dev
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
  # Signed keyless, as refs/heads/main: the app runner takes a dev build only from this workflow on main.
  id-token: write
env:
  # Reads AUGUR's kit packages from GitHub Packages (.npmrc): a classic token with read:packages, else this run's own.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
  # Where AUGUR's images and release feed go. They stay at ghcr.io/<owner>/im-platform, the repository's
  # first name, where servers pull them from; the IMAGE_REPO variable moves them (docs/upgrade.md).
  IMAGE_REPO: ${{ vars.IMAGE_REPO || format('ghcr.io/{0}/im-platform', github.repository_owner) }}
jobs:
  dev:
    # Builds and pushes images, so only on an x86-64 runner: RELEASE_RUNNER, if CI_RUNNER names an Arm one.
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER || vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Which apps does it change?
        id: apps
        run: echo "changed=$(node scripts/app-release.mjs changed HEAD^)" >> "$GITHUB_OUTPUT"
      - if: steps.apps.outputs.changed != '[]'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: steps.apps.outputs.changed != '[]'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.apps.outputs.changed != '[]'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - if: steps.apps.outputs.changed != '[]'
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      - name: Build, sign and release a dev build of each
        if: steps.apps.outputs.changed != '[]'
        run: |
          echo "## Dev builds" >> "$GITHUB_STEP_SUMMARY"
          while read -r app; do
            id=$(jq -r .id <<< "$app")
            version=$(node scripts/app-release.mjs dev "$id" "$GITHUB_RUN_NUMBER")
            infra/release-app.sh "$id" "$version" dev > "$RUNNER_TEMP/$id.json"
            node scripts/app-release.mjs publish "$id" "$RUNNER_TEMP/$id.json"
            node scripts/app-release.mjs devs-clean "$id" "app/$id@$version"
            echo "- $id $version: a preview server set to take its dev builds installs it at its next check (Admin → Apps → Check now)." >> "$GITHUB_STEP_SUMMARY"
            git checkout -- "apps/$id"
          done < <(jq -c '.[]' <<< "$CHANGED")
        env:
          CHANGED: ${{ steps.apps.outputs.changed }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET: ${{ github.sha }}
    outputs:
      changed: ${{ steps.apps.outputs.changed }}
  # Deployments' app runners learn of a new dev build from the feed beside the images.
  feed:
    needs: dev
    if: needs.dev.outputs.changed != '[]'
    uses: ./.github/workflows/feed.yml
    # A called workflow gets no secrets unless passed: the feed reads the app repositories with APP_RELEASES_TOKEN.
    secrets: inherit
