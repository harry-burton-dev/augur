name: Pipeline feed
# Keeps ghcr.io/<repo>/feed:pipeline, where each unit is between main, its newest beta and its newest
# stable release (scripts/pipeline.mjs), in step: on every push to main, when a pull request into it
# opens or closes, and after a workflow that makes, promotes or removes releases. Backstage and each
# deployment's Upgrade Centre read it with the same read key as the release feed. See
# docs/release-channels.md, "The pipeline feed".
# Once per change to main or to what's released: Release runs on every push to main (and opens or
# updates the Version packages PR), so the feed follows it rather than each push and pull request,
# which ran it about 300 times a night for the same answer. A pull request that opens a promotion
# shows on the next run. Run it by hand to refresh it sooner.
on:
  workflow_run:
    workflows: [Release, Promote to stable, AUGUR dev builds, App dev builds]
    types: [completed]
  workflow_dispatch:
concurrency:
  # Only the newest matters: it reads everything again.
  group: pipeline-feed
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  packages: write
env:
  # Reads AUGUR's kit packages from GitHub Packages (.npmrc): a classic token with read:packages, else this run's own.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
  # Where AUGUR's images and release feed go. They stay at ghcr.io/<owner>/im-platform, the repository's
  # first name, where servers pull them from; the IMAGE_REPO variable moves them (docs/upgrade.md).
  IMAGE_REPO: ${{ vars.IMAGE_REPO || format('ghcr.io/{0}/im-platform', github.repository_owner) }}
jobs:
  pipeline:
    # A pull request from a fork can't push to the registry.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      # The script from this commit; what it describes comes from the default branch and the release tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags origin ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oras-project/setup-oras@v1
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish the pipeline feed
        run: node scripts/pipeline.mjs --out "$RUNNER_TEMP/pipeline.json" --push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUNK: ${{ github.event.repository.default_branch }}
