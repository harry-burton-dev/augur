name: Pipeline feed
# Keeps ghcr.io/<repo>/feed:pipeline, where each unit is between dev, preview and production
# (scripts/pipeline.mjs), in step: on every push to the three branches, when a pull request into one
# opens or closes (Version packages, Promote), and after the release feed changes. Backstage and each
# deployment's Upgrade Centre read it with the same read key as the release feed. See
# docs/release-channels.md, "The pipeline feed".
on:
  push:
    branches: [dev, preview, production]
  pull_request:
    types: [opened, reopened, closed]
    branches: [dev, preview, production]
  # After a workflow that makes or removes releases (dev builds, previews, releases) finishes.
  workflow_run:
    workflows: [Release, Release feed, AUGUR dev builds, App dev builds, App previews]
    types: [completed]
  workflow_dispatch:
concurrency:
  # Only the newest matters: it reads everything again.
  group: pipeline-feed
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  packages: write
jobs:
  pipeline:
    # A pull request from a fork can't push to the registry.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      # The script from this commit; what it describes comes from origin/dev, preview and production.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin dev preview production
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Our own runner keeps the pnpm store between jobs (docs/ci-runner.md).
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - uses: oras-project/setup-oras@v1
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish the pipeline feed
        run: node scripts/pipeline.mjs --out "$RUNNER_TEMP/pipeline.json" --push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
