name: App previews
# A pull request that changes an app in apps/ (other than those that ship with AUGUR) gets a preview
# of each app it changes: a signed bundle, as the Release workflow makes, with the version
# <x.y.z>-pr.<number>.<run>, released as app/<id>@<that version>. Deployments whose app runner has
# the app installed run the newest one beside the app for the app's developers (Admin → Apps), who
# switch to it themselves. Each new push replaces the pull request's last preview; closing the pull
# request deletes them, and deployments take them away. See docs/app-previews.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # The apps that ship with AUGUR go out in its dev builds and releases, not as previews.
    paths: ['apps/**', '!apps/folio/**', '!apps/auspex/**', '!apps/atlas/**', '!apps/*.md']
concurrency:
  group: app-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write
  packages: write
  # Signed keyless, as refs/pull/<number>/merge: the app runner takes a build only as the pull request it says it is.
  id-token: write
env:
  # Reads AUGUR's kit packages from GitHub Packages (.npmrc): a classic token with read:packages, else this run's own.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
  # Where AUGUR's images and release feed go. They stay at ghcr.io/<owner>/im-platform, the repository's
  # first name, where servers pull them from; the IMAGE_REPO variable moves them (docs/upgrade.md).
  IMAGE_REPO: ${{ vars.IMAGE_REPO || format('ghcr.io/{0}/im-platform', github.repository_owner) }}
jobs:
  preview:
    # A fork's pull request gets no token to push or sign with, so it has no preview.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    # Builds and pushes images, so only on an x86-64 runner: RELEASE_RUNNER, if CI_RUNNER names an Arm one.
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER || vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Which apps does it change?
        id: apps
        run: echo "changed=$(node scripts/app-release.mjs changed "origin/$BASE")" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.base_ref }}
      - if: steps.apps.outputs.changed != '[]'
        uses: docker/setup-buildx-action@v3
      - if: steps.apps.outputs.changed != '[]'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.apps.outputs.changed != '[]'
        uses: sigstore/cosign-installer@v3
      - if: steps.apps.outputs.changed != '[]'
        uses: oras-project/setup-oras@v1
      - name: Build, sign and release a preview of each
        id: previews
        if: steps.apps.outputs.changed != '[]'
        run: |
          tags=()
          echo "## Previews" >> "$GITHUB_STEP_SUMMARY"
          while read -r app; do
            id=$(jq -r .id <<< "$app")
            version=$(node scripts/app-release.mjs preview "$id" "$PR_NUMBER" "$GITHUB_RUN_NUMBER")
            infra/release-app.sh "$id" "$version" preview > "$RUNNER_TEMP/$id.json"
            node scripts/app-release.mjs publish "$id" "$RUNNER_TEMP/$id.json"
            tags+=("app/$id@$version")
            echo "- $id $version: its developers can switch to it once their server's next check of the app feed (Admin → Apps → Check now)." >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -c '.[]' <<< "$CHANGED")
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"
        env:
          CHANGED: ${{ steps.apps.outputs.changed }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RELEASE_TARGET: ${{ github.event.pull_request.head.sha }}
      # Only the newest preview of each app is kept, and none of an app the pull request no longer changes.
      - name: Delete this pull request's older previews
        run: node scripts/app-release.mjs previews-clean "$PR_NUMBER" $TAGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAGS: ${{ steps.previews.outputs.tags }}

  closed:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Its previews leave the app feed, so deployments take them, and their scratch data, away.
      - name: Delete the pull request's previews
        run: node scripts/app-release.mjs previews-clean "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
  # Deployments' app runners learn of a new or removed preview from the feed beside the images. The
  # feed is signed as the Release feed workflow on main (ADR 0017), never as a pull request, so this
  # asks for a run on main rather than publishing it from here.
  feed:
    needs: [preview, closed]
    if: always() && (needs.preview.result == 'success' || needs.closed.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run feed.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
