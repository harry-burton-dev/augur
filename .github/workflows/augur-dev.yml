name: AUGUR dev builds
# Every merge into main that changes AUGUR (the platform, the pins of the apps that ship with it, or how it is
# deployed) gets a dev build: every image, built, pushed and signed as the Release workflow does,
# with the version <next patch>-dev.<run>, released as the pre-release augur@<that version>. What it
# changes and its notes come from the changesets waiting. Only the workbench (SERVER_RING=dev) takes
# it, by itself and after a backup, as it would a release. AUGUR keeps its newest few dev builds.
# See docs/release-channels.md, "AUGUR dev builds".
on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'infra/**'
      - 'release/**'
      # Nothing that goes into an image: notes and the contract tests.
      - '!**/*.md'
      - '!platform/contract/**'
  workflow_dispatch:
concurrency:
  group: augur-dev
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
  # Signed keyless, as refs/heads/main: the updater takes a dev build only from this workflow on main.
  id-token: write
env:
  # Reads AUGUR's kit packages from GitHub Packages (.npmrc): a classic token with read:packages, else this run's own.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
  # Where AUGUR's images and release feed go. They stay at ghcr.io/<owner>/im-platform, the repository's
  # first name, where servers pull them from; the IMAGE_REPO variable moves them (docs/upgrade.md).
  IMAGE_REPO: ${{ vars.IMAGE_REPO || format('ghcr.io/{0}/im-platform', github.repository_owner) }}
jobs:
  dev:
    if: github.ref_name == 'main'
    # Builds and pushes images, so only on an x86-64 runner: RELEASE_RUNNER, if CI_RUNNER names an Arm one.
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER || vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # In this checkout only: the release file and the registry's own idea of its release say the dev build.
      - name: Which dev build is it?
        id: build
        run: echo "version=$(node scripts/augur-release.mjs dev "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      # The images' install of the workspace, kept until the dependencies change (infra/release-images.sh,
      # BUILDX_CACHE). The same key as CI's deploy-images job, which reads it.
      - name: The workspace's install, from the last dev build
        id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/buildx-deps
          key: buildx-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'package.json', 'platform/*/*/package.json', 'platform/contract/package.json', 'apps/*/*/package.json', 'infra/*.Dockerfile') }}
          restore-keys: buildx-deps-${{ runner.os }}-
      - name: Build, push and sign the images
        run: infra/release-images.sh "${{ steps.build.outputs.version }}" dev > "$RUNNER_TEMP/images.json"
        env:
          BUILDX_CACHE: ${{ runner.temp }}/buildx-deps
          BUILDX_CACHE_SAVE: ${{ steps.deps.outputs.cache-hit != 'true' }}
          # The shipped apps' releases, source and images, in their own repositories (ADR 0049).
          APP_RELEASES_TOKEN: ${{ secrets.APP_RELEASES_TOKEN }}
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - name: Release the dev build
        run: |
          node scripts/augur-release.mjs publish "$RUNNER_TEMP/images.json"
          node scripts/augur-release.mjs devs-clean "augur@${{ steps.build.outputs.version }}"
          echo "## AUGUR ${{ steps.build.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The workbench (SERVER_RING=dev) upgrades to it by itself at its updater's next check, after a backup." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET: ${{ github.sha }}
  # The workbench learns of the dev build from the feed beside the images.
  feed:
    needs: dev
    uses: ./.github/workflows/feed.yml
    # A called workflow gets no secrets unless passed: the feed reads the app repositories with APP_RELEASES_TOKEN.
    secrets: inherit
