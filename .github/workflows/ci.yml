name: CI
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  # Everything, every frozen build included, whatever changed.
  workflow_dispatch:
# Every job runs on GitHub's hosted runners unless the repository variable CI_RUNNER names
# others (as JSON, such as a runner provider's label). The same goes for every other workflow;
# RELEASE_RUNNER, if set, names the x86-64 runner the image-building jobs use.

# A new push to a pull request stops its last run.
# What each run does, and what it costs, is in docs/ci-cd.md. In short: a pull request runs only the
# jobs its change needs (scripts/ci-changes.sh); the push that merges it runs only build-test, because
# the pull request already ran the rest on the same code. The kit's Storybook is published from augur-kit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Reads AUGUR's kit packages from GitHub Packages (.npmrc): a classic token with read:packages, else this run's own.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
  # Turbo's cache outside the checkout, which checkout cleans, so a task whose inputs haven't
  # changed since an earlier run replays instead of running, kept in GitHub's cache (build-test and
  # contract). A push to main replays what its base already had, and saves the cache every new pull
  # request starts from.
  TURBO_CACHE_DIR: /home/runner/.cache/turbo
jobs:
  # Which of the jobs below this change needs. The others are skipped before they take a runner, so
  # they cost nothing and still count as passed where they are required checks.
  changes:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    outputs:
      contract: ${{ steps.changes.outputs.contract }}
      contract_frozen: ${{ steps.changes.outputs.contract_frozen }}
      images: ${{ steps.changes.outputs.images }}
      folio: ${{ steps.changes.outputs.folio }}
      worker: ${{ steps.changes.outputs.worker }}
      scaffold: ${{ steps.changes.outputs.scaffold }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: scripts/ci-changes.sh
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE: ${{ github.event.before }}

  build-test:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # The registry's Postgres store is tested against a real database.
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform-ci-only
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets compares the branch with its base to find what it changes.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On GitHub's runners the turbo cache starts empty, so every task ran every time. Keep it in
      # GitHub's cache instead: restored from this branch's (or its base's) last run, entries older
      # than a week dropped, saved again under this commit.
      - uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: mkdir -p "$TURBO_CACHE_DIR" && find "$TURBO_CACHE_DIR" -type f -mtime +7 -delete
      - run: pnpm check:boundaries
      - run: pnpm check:reasons
      # ESLint (ADR 0043): errors fail the run.
      - run: pnpm lint
      - run: pnpm check:versions
      - run: pnpm check:release
      - run: pnpm check:catalog
      - run: pnpm test:scripts
      # Into a hotfix's release/<unit>-<major.minor> branch only that unit's fixes go, as patches
      # (docs/release-channels.md).
      - name: May it go into its branch?
        if: github.event_name == 'pull_request'
        run: node scripts/promote.mjs check-pr
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
      - name: Every change says how it is released
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
      # Turbo's default of ten tasks at once is too many for a small runner: builds are killed for
      # memory, and tests time out and deadlock in Postgres. About 2 GB a task (a Vite build, or a
      # package's tests), after 1.5 GB for Postgres and the runner, and no more than the CPUs: four
      # on GitHub's. Tests run two at most, as they share the one database.
      - name: How many tasks at once
        id: fit
        run: |
          node -e '
            const os = require("node:os"), fs = require("node:fs");
            const limit = process.constrainedMemory?.();
            const memory = limit && limit < os.totalmem() ? limit : os.totalmem();
            let cpus = os.availableParallelism();
            try {
              const [quota, period] = fs.readFileSync("/sys/fs/cgroup/cpu.max", "utf8").trim().split(" ");
              if (quota !== "max") cpus = Math.min(cpus, Math.ceil(quota / period));
            } catch {}
            const n = Math.max(1, Math.min(cpus, Math.floor((memory - 1.5e9) / 2e9)));
            console.log(`${n} tasks at once (${(memory / 1e9).toFixed(1)} GB, ${cpus} CPUs), tests ${Math.min(n, 2)}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tasks=${n}\ntests=${Math.min(n, 2)}\n`);
          '
      - run: pnpm build --concurrency=${{ steps.fit.outputs.tasks }}
      # Every app's manifest, against the registry's own rules.
      - run: pnpm check:manifest
      - run: pnpm check:migrations
        env:
          # Into main, a migration already on main is frozen too: dev builds have run it on the workbench.
          MIGRATIONS_FROZEN_AT: ${{ github.base_ref == 'main' && 'origin/main' || '' }}
      - run: pnpm typecheck --concurrency=${{ steps.fit.outputs.tasks }}
      - run: pnpm test --concurrency=${{ steps.fit.outputs.tests }}
        env:
          DATABASE_URL: postgres://platform:platform-ci-only@localhost:5432/platform

  # Folio's rendition worker, in Python: its tests against a real Postgres with Folio's
  # schema, PDFs included (Docling fetches its models once; they're cached), and its image
  # when the worker changed.
  folio-worker:
    needs: changes
    if: needs.changes.outputs.folio == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform-ci-only
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://platform:platform-ci-only@localhost:5432/platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/folio/worker/pyproject.toml
      # Torch's CPU-only build, as the image has it.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "apps/folio/worker[test]"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docling-models-${{ hashFiles('apps/folio/worker/pyproject.toml') }}
      # The worker works on the tables Folio's service makes, which needs the packages Folio's store is built on.
      - run: pnpm turbo run build --filter="@apps/folio^..."
      - run: pnpm --filter @apps/folio migrate
      - run: python -m pytest apps/folio/worker -v
        env:
          RUN_PDF_TESTS: "1"
      - name: The worker's image builds, holds its models and doesn't run as root
        if: needs.changes.outputs.worker == 'true'
        run: |
          docker build -f apps/folio/worker/Dockerfile -t folio-worker .
          test "$(docker run --rm folio-worker id -u)" != 0
          docker run --rm folio-worker python -c "from folio_worker.render import ENGINE_VERSION; print(ENGINE_VERSION)"
          test -n "$(docker run --rm folio-worker sh -c 'ls "$DOCLING_ARTIFACTS_PATH"')"

  # The developer kit still makes an app that builds, passes its tests and is accepted by the registry.
  app-scaffold:
    needs: changes
    if: needs.changes.outputs.scaffold == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm create-app scaffold-check --name "Scaffold check"
      - run: pnpm turbo run build --filter="@apps/scaffold-check*" --filter=@augur/registry
      # One task at a time: on a two-core runner, tests racing builds time out on their first request.
      - run: pnpm turbo run typecheck test --filter="@apps/scaffold-check*" --concurrency=1
      - run: pnpm check:manifest
      - run: pnpm check:boundaries
      - run: pnpm check:versions

  # The shell keeps its promise to apps: the reference app, as built today and
  # as built against each earlier SDK minor, mounted by the real shell, with
  # Folio (which ships with AUGUR) on and off.
  # The longest job. On an ordinary pull request it runs today's build and the oldest and newest
  # frozen ones; on the Version packages pull request, and by hand, every frozen build.
  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }} # Playwright 1.56 has no browsers for ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On GitHub's runners the turbo cache starts empty, so every task ran every time. Keep it in
      # GitHub's cache instead: restored from this branch's (or its base's) last run, entries older
      # than a week dropped, saved again under this commit.
      - uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          # Its builds are build-test's too, and main saves only build-test's cache.
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-build-test-
      - run: mkdir -p "$TURBO_CACHE_DIR" && find "$TURBO_CACHE_DIR" -type f -mtime +7 -delete
      - run: pnpm turbo run build --filter=@augur/contract-tests... --filter=@augur/shell^... --filter=@augur/home --filter=@apps/folio... --filter=@apps/folio-frontend...
      # The browser is cached by Playwright version. No --with-deps: the runner image
      # already has Chrome's system libraries, and apt-get was the slow, uneven part
      # (half a minute on a good day, twelve on a bad one).
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @augur/contract-tests exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - run: pnpm --filter @augur/contract-tests exec playwright install --only-shell chromium
      - run: pnpm --filter @augur/contract-tests test:contract
        env:
          CONTRACT_FROZEN: ${{ needs.changes.outputs.contract_frozen }}

  # The server setup in infra/deploy: the compose file is valid and the images build.
  # Secrets committed by mistake, and dependencies with known vulnerabilities (ADR 0043).
  # Pinned scanner images; no install, so it finishes in well under a minute.
  scan:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secrets in the commits (gitleaks)
        run: |
          # A pull request's own commits; on a push, the commits it added.
          range="origin/${BASE_REF}..HEAD"
          [ -z "$BASE_REF" ] && range="${BEFORE}..HEAD"
          [ "$BEFORE" = 0000000000000000000000000000000000000000 ] && range=HEAD~1..HEAD
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.24.0 \
            git --redact --no-banner --log-opts="$range" .
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
      # Every vulnerability found is listed in the run's summary. Only ones this change brings in fail
      # it: the ones already on the base branch are Renovate's to fix (its weekly PRs), not this PR's.
      - name: No new dependencies with known vulnerabilities (OSV-Scanner)
        run: |
          ids() { jq -r '[.results[]?.packages[]? | .package as $p | .vulnerabilities[]? | "\($p.name)@\($p.version) \(.id)"] | unique | .[]'; }
          mkdir -p "$RUNNER_TEMP/base"
          base=${BASE_REF:+origin/$BASE_REF}
          git show "${base:-HEAD~1}:pnpm-lock.yaml" > "$RUNNER_TEMP/base/pnpm-lock.yaml"
          cp osv-scanner.toml "$RUNNER_TEMP/osv-scanner.toml"
          osv() { docker run --rm -v "$1:/src:ro" -v "$RUNNER_TEMP/osv-scanner.toml:/cfg/osv-scanner.toml:ro" -w /src ghcr.io/google/osv-scanner:v2.0.2 scan source --config=/cfg/osv-scanner.toml -L pnpm-lock.yaml --format json 2>/dev/null || true; }
          osv "$PWD" > "$RUNNER_TEMP/now.json"
          osv "$RUNNER_TEMP/base" > "$RUNNER_TEMP/before.json"
          # A scan that didn't run is a failure, not a clean result.
          jq -e '.results' "$RUNNER_TEMP/now.json" "$RUNNER_TEMP/before.json" > /dev/null
          ids < "$RUNNER_TEMP/now.json" > "$RUNNER_TEMP/now.txt"
          ids < "$RUNNER_TEMP/before.json" > "$RUNNER_TEMP/before.txt"
          { echo "### Known vulnerabilities in dependencies: $(wc -l < "$RUNNER_TEMP/now.txt")"; sed 's/^/- /' "$RUNNER_TEMP/now.txt"; } >> "$GITHUB_STEP_SUMMARY"
          new=$(comm -23 <(sort "$RUNNER_TEMP/now.txt") <(sort "$RUNNER_TEMP/before.txt"))
          if [ -n "$new" ]; then echo "This change brings in:"; echo "$new"; exit 1; fi
          echo "Nothing new: $(wc -l < "$RUNNER_TEMP/now.txt") known, all already on the base branch."
        env:
          BASE_REF: ${{ github.base_ref }}
  # About 8 minutes, so only when the change could alter an image beyond the code build-test builds:
  # the Dockerfiles and deploy files, the dependencies, or this workflow. A push doesn't run it: the
  # dev build builds the same images for real.
  deploy-images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: |
          sed -e 's/=$/=ci-placeholder/' infra/deploy/.env.example > /tmp/ci.env
          docker compose -f infra/deploy/compose.yml --env-file /tmp/ci.env config -q
          docker compose -f infra/deploy/compose.yml -f infra/deploy/compose.build.yml --env-file /tmp/ci.env config -q
          COMPOSE_PROFILES=updater docker compose -f infra/deploy/compose.yml -f infra/deploy/compose.build.yml --env-file /tmp/ci.env config -q
      # The apps that ship with AUGUR come from their own repositories' releases (ADR 0049), which the
      # release puts in .shipped/frontends; one made up here shows the web image serves what's put there.
      - run: |
          mkdir -p .shipped/frontends/shipped-probe && echo 'export {};' > .shipped/frontends/shipped-probe/entry.js
          docker build --secret id=node_auth_token,env=NODE_AUTH_TOKEN -f infra/web.Dockerfile --target web -t platform-web .
      - run: docker build --secret id=node_auth_token,env=NODE_AUTH_TOKEN -f infra/service.Dockerfile --build-arg PACKAGE=@augur/identity --target service -t platform-identity .
      - run: docker build --secret id=node_auth_token,env=NODE_AUTH_TOKEN -f infra/service.Dockerfile --build-arg PACKAGE=@augur/storage --target service -t platform-storage .
      - run: docker build --secret id=node_auth_token,env=NODE_AUTH_TOKEN -f infra/service.Dockerfile --build-arg PACKAGE=@augur/updater --target updater -t platform-updater .
      - name: The updater has the tools it drives
        run: docker run --rm --entrypoint sh platform-updater -c 'docker --version && docker compose version && cosign version'
      - name: The images don't run as root
        run: |
          for image in platform-web platform-identity platform-storage platform-updater; do
            uid=$(docker run --rm --entrypoint id "$image" -u)
            echo "$image runs as $uid"
            test "$uid" != 0
          done
      - name: The front door's nginx config loads
        run: docker run --rm --add-host gateway:127.0.0.1 --add-host keycloak:127.0.0.1 platform-web nginx -t
      - name: The shell's page carries its Content Security Policy
        run: |
          docker run -d --name web --add-host gateway:127.0.0.1 --add-host keycloak:127.0.0.1 \
            -e APP_ORIGINS=https://apps.example.org -p 8088:8080 platform-web
          for i in $(seq 1 20); do curl -fsI http://localhost:8088/admin > /tmp/headers && break; sleep 1; done
          cat /tmp/headers
          grep -iE "^content-security-policy: default-src 'self'; script-src 'self' 'sha256-[A-Za-z0-9+/=]+' https://apps.example.org ?;" /tmp/headers
          # Anywhere but the workbench, nothing on the tailnet may run in the shell.
          ! grep -i "ts.net" /tmp/headers
          # The apps that ship with AUGUR: the front door serves their frontends too.
          curl -fsI http://localhost:8088/apps/shipped-probe/entry.js
          docker rm -f web
      - name: On the workbench, the shell may load an app from a machine on its own tailnet
        run: |
          docker run -d --name web-dev --add-host gateway:127.0.0.1 --add-host keycloak:127.0.0.1 -e SERVER_RING=dev -e PLATFORM_URL=https://augur.tail1234.ts.net -p 8089:8080 platform-web
          for i in $(seq 1 20); do curl -fsI http://localhost:8089/admin > /tmp/headers-dev && break; sleep 1; done
          grep -iE "^content-security-policy: .*script-src 'self' 'sha256-[A-Za-z0-9+/=]+'  https://\*\.tail1234\.ts\.net wss://\*\.tail1234\.ts\.net;" /tmp/headers-dev
          # Never every Tailscale user's machines.
          ! grep -iE "[ /]\*\.ts\.net" /tmp/headers-dev
          docker rm -f web-dev
          # A workbench that isn't at a Tailscale address loads from no machine.
          docker run -d --name web-dev2 --add-host gateway:127.0.0.1 --add-host keycloak:127.0.0.1 -e SERVER_RING=dev -e PLATFORM_URL=https://augur.example.org -p 8090:8080 platform-web
          for i in $(seq 1 20); do curl -fsI http://localhost:8090/admin > /tmp/headers-dev2 && break; sleep 1; done
          ! grep -i "ts.net" /tmp/headers-dev2
          docker rm -f web-dev2
      - name: The nightly backup writes a restorable dump
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci postgres:16-alpine
          # Over TCP: during first start Postgres answers on its socket before its real start.
          until docker exec pg pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done
          # Just enough of the platform's and Keycloak's tables for the restore test to look for.
          docker exec -i pg psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create database platform;
          create database keycloak;
          \c platform
          create schema registry; create table registry.apps (id text);
          create schema events; create table events.audit (id int); create table events.notifications (id int);
          create schema identity; create table identity.preferences (id text);
          \c keycloak
          create table realm (id text, name text); insert into realm values ('r1', 'platform');
          create table user_entity (id text, realm_id text); insert into user_entity values ('u1', 'r1');
          SQL
          mkdir -p /tmp/backups
          # Stand-in for Garage's volumes: a block, a metadata snapshot, and the live database the backup leaves out.
          mkdir -p /tmp/objects/data/00 /tmp/objects/meta/snapshots
          echo block > /tmp/objects/data/00/block; echo snap > /tmp/objects/meta/snapshots/s1; echo live > /tmp/objects/meta/db.sqlite
          docker run --rm --link pg -e PGHOST=pg -e PGUSER=postgres -e PGPASSWORD=ci \
            -v "$PWD/infra/deploy/backup:/backup:ro" -v /tmp/backups:/backups -v /tmp/objects:/objects:ro \
            postgres:16-alpine /bin/sh /backup/backup.sh --once
          zcat /tmp/backups/platform-*.sql.gz | grep -q "PostgreSQL database cluster dump complete"
          grep -q '"ok":true' /tmp/backups/last-backup.json
          tar -tzf /tmp/backups/objects-*.tar.gz | tee /tmp/objects.txt
          grep -q '^data/00/block$' /tmp/objects.txt && grep -q '^meta/snapshots/s1$' /tmp/objects.txt && ! grep -q 'db.sqlite' /tmp/objects.txt
      - name: The updater's backup is a fresh one, and the newest
        run: |
          docker run --rm --link pg -e PGHOST=pg -e PGUSER=postgres -e PGPASSWORD=ci \
            -v "$PWD/infra/deploy/backup:/backup:ro" -v /tmp/backups:/backups \
            postgres:16-alpine /bin/sh /backup/backup.sh --now | tee /tmp/now.log
          grep -E "backup: wrote /backups/platform-[0-9-]+T[0-9]+Z\.sql\.gz" /tmp/now.log
          test "$(ls /tmp/backups/platform-*.sql.gz | sort | tail -n 1)" = "$(grep -oE '/backups/platform-[^ ]+' /tmp/now.log | sed 's#^#/tmp#')"
      - name: The weekly restore test restores the newest backup and checks it
        run: |
          docker run --rm -v "$PWD/infra/deploy/backup:/backup:ro" -v /tmp/backups:/backups \
            postgres:16-alpine /bin/sh /backup/backup.sh --restore-test
          cat /tmp/backups/restore-test.json
          grep -q '"ok":true' /tmp/backups/restore-test.json
