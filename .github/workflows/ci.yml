name: CI
on:
  pull_request:
  push:
    branches: [main]
# Every job runs on GitHub's hosted runners unless the repository variable CI_RUNNER names
# others, such as ["self-hosted","augur-ci"] for our own (docs/ci-runner.md). The same goes for
# the Release, App previews and Release feed workflows.
#
# On our own runner, caches live on its volumes between jobs (the pnpm store, pip's and
# Playwright's and Docling's caches, turbo's), so the steps that fetch GitHub's cache run only
# on hosted runners: from our server they downloaded ~1 GB a run at about 7 MB/s.

# A new push to a pull request stops its last run, so the one runner isn't kept busy with it.
# Pushes to main each run in full.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Turbo's cache outside the checkout, which checkout cleans, so a task whose inputs haven't
  # changed since an earlier run on the runner replays instead of running. Main runs every task.
  TURBO_CACHE_DIR: /home/runner/.cache/turbo
  TURBO_FORCE: ${{ github.event_name == 'push' }}
jobs:
  build-test:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # The registry's Postgres store is tested against a real database.
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform-ci-only
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets compares the branch with main to find what it changes.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm check:versions
      - run: pnpm check:release
      - run: pnpm test:scripts
      - name: Every change says how it is released
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
      # Turbo's default of ten tasks at once is too many for our 8 GB runner on a shared server:
      # builds were killed for memory, and tests timed out and deadlocked in Postgres. About 2 GB a
      # task (a Vite build, or a package's tests), after 1.5 GB for Postgres and the runner, and no
      # more than the CPUs: three on the 8 GB runner, four on GitHub's. Tests run two at most, as
      # they share the one database. More memory (CI_MEMORY) makes this quicker by itself.
      - name: How many tasks at once
        id: fit
        run: |
          node -e '
            const os = require("node:os"), fs = require("node:fs");
            const limit = process.constrainedMemory?.();
            const memory = limit && limit < os.totalmem() ? limit : os.totalmem();
            let cpus = os.availableParallelism();
            try {
              const [quota, period] = fs.readFileSync("/sys/fs/cgroup/cpu.max", "utf8").trim().split(" ");
              if (quota !== "max") cpus = Math.min(cpus, Math.ceil(quota / period));
            } catch {}
            const n = Math.max(1, Math.min(cpus, Math.floor((memory - 1.5e9) / 2e9)));
            console.log(`${n} tasks at once (${(memory / 1e9).toFixed(1)} GB, ${cpus} CPUs), tests ${Math.min(n, 2)}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tasks=${n}\ntests=${Math.min(n, 2)}\n`);
          '
      - run: pnpm build --concurrency=${{ steps.fit.outputs.tasks }}
      # Every app's manifest, against the registry's own rules.
      - run: pnpm check:manifest
      - run: pnpm check:migrations
      - run: pnpm typecheck --concurrency=${{ steps.fit.outputs.tasks }}
      - run: pnpm test --concurrency=${{ steps.fit.outputs.tests }}
        env:
          DATABASE_URL: postgres://platform:platform-ci-only@localhost:5432/platform
      - run: pnpm --filter @augur/ui-kit build-storybook

  # Folio's rendition worker, in Python: its tests against a real Postgres with Folio's
  # schema, PDFs included (Docling fetches its models once; they're cached), and its image
  # when the worker changed.
  folio-worker:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform-ci-only
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://platform:platform-ci-only@localhost:5432/platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only when Folio (its worker, or the service whose tables it works on) or this workflow
      # changed; main runs it always. The job still reports, so it can stay a required check.
      - name: Does this change Folio?
        id: folio
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || ! git diff --quiet "origin/$BASE..." -- apps/folio .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Folio is unchanged: nothing to test here."
          fi
        env:
          BASE: ${{ github.base_ref }}
      - if: steps.folio.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.folio.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - if: steps.folio.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.folio.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: apps/folio/worker/pyproject.toml
      # Torch's CPU-only build, as the image has it.
      - if: steps.folio.outputs.run == 'true'
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "apps/folio/worker[test]"
      - if: steps.folio.outputs.run == 'true' && runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docling-models-${{ hashFiles('apps/folio/worker/pyproject.toml') }}
      # The worker works on the tables Folio's service makes.
      - if: steps.folio.outputs.run == 'true'
        run: pnpm --filter @apps/folio migrate
      - if: steps.folio.outputs.run == 'true'
        run: python -m pytest apps/folio/worker -v
        env:
          RUN_PDF_TESTS: "1"
      - name: Did the worker change?
        if: steps.folio.outputs.run == 'true'
        id: changed
        run: |
          base=${{ github.event_name == 'pull_request' && format('origin/{0}...', github.base_ref) || 'HEAD~1' }}
          git diff --quiet "$base" -- apps/folio/worker || echo "worker=true" >> "$GITHUB_OUTPUT"
      - name: The worker's image builds, holds its models and doesn't run as root
        if: steps.changed.outputs.worker == 'true'
        run: |
          docker build -f apps/folio/worker/Dockerfile -t folio-worker .
          test "$(docker run --rm folio-worker id -u)" != 0
          docker run --rm folio-worker python -c "from folio_worker.render import ENGINE_VERSION; print(ENGINE_VERSION)"
          test -n "$(docker run --rm folio-worker sh -c 'ls "$DOCLING_ARTIFACTS_PATH"')"

  # The developer kit still makes an app that builds, passes its tests and is accepted by the registry.
  app-scaffold:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm create-app scaffold-check --name "Scaffold check"
      - run: pnpm turbo run build --filter="@apps/scaffold-check*" --filter=@augur/registry
      # One task at a time: on a two-core runner, tests racing builds time out on their first request.
      - run: pnpm turbo run typecheck test --filter="@apps/scaffold-check*" --concurrency=1
      - run: pnpm check:manifest
      - run: pnpm check:boundaries
      - run: pnpm check:versions

  # The shell keeps its promise to apps: the reference app, as built today and
  # as built against each earlier SDK minor, mounted by the real shell, with
  # Folio (which ships with AUGUR) on and off.
  contract:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }} # Playwright 1.56 has no browsers for ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@augur/contract-tests... --filter=@augur/home --filter=@apps/folio... --filter=@apps/folio-frontend...
      # The browser is cached by Playwright version. No --with-deps: the runner image
      # already has Chrome's system libraries, and apt-get was the slow, uneven part
      # (half a minute on a good day, twelve on a bad one).
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @augur/contract-tests exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - run: pnpm --filter @augur/contract-tests exec playwright install --only-shell chromium
      - run: pnpm --filter @augur/contract-tests test:contract

  # The server setup in infra/deploy: the compose file is valid and the images build.
  deploy-images:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: |
          sed -e 's/=$/=ci-placeholder/' infra/deploy/.env.example > /tmp/ci.env
          docker compose -f infra/deploy/compose.yml --env-file /tmp/ci.env config -q
          docker compose -f infra/deploy/compose.yml -f infra/deploy/compose.build.yml --env-file /tmp/ci.env config -q
          COMPOSE_PROFILES=updater docker compose -f infra/deploy/compose.yml -f infra/deploy/compose.build.yml --env-file /tmp/ci.env config -q
      - run: docker build -f infra/web.Dockerfile --target web -t platform-web .
      - run: docker build -f infra/service.Dockerfile --build-arg PACKAGE=@augur/identity --target service -t platform-identity .
      - run: docker build -f infra/service.Dockerfile --build-arg PACKAGE=@augur/storage --target service -t platform-storage .
      - run: docker build -f infra/service.Dockerfile --build-arg PACKAGE=@augur/updater --target updater -t platform-updater .
      # Folio ships with AUGUR: its service is in every release (its worker is built in folio-worker).
      - run: docker build -f infra/service.Dockerfile --build-arg PACKAGE=@apps/folio --build-arg FRONTEND=@apps/folio-frontend --target service -t platform-folio .
      - name: Folio's image carries its manifest, to register itself with
        run: docker run --rm --entrypoint node platform-folio -e "const m = require('/app/dist/manifest.json'); if (m.id !== 'folio') process.exit(1); console.log(m.id, m.version)"
      - name: Folio's image carries its frontend, to give the registry by version
        run: docker run --rm --entrypoint test platform-folio -f /app/frontend/entry.js
      # Auspex ships with AUGUR too.
      - run: docker build -f infra/service.Dockerfile --build-arg PACKAGE=@apps/auspex --build-arg FRONTEND=@apps/auspex-frontend --target service -t platform-auspex .
      - name: Auspex's image carries its manifest and frontend
        run: |
          docker run --rm --entrypoint node platform-auspex -e "const m = require('/app/dist/manifest.json'); if (m.id !== 'auspex') process.exit(1); console.log(m.id, m.version)"
          docker run --rm --entrypoint test platform-auspex -f /app/frontend/entry.js
      # And Data Atlas.
      - run: docker build -f infra/service.Dockerfile --build-arg PACKAGE=@apps/atlas --build-arg FRONTEND=@apps/atlas-frontend --target service -t platform-atlas .
      - name: Data Atlas's image carries its manifest and frontend
        run: |
          docker run --rm --entrypoint node platform-atlas -e "const m = require('/app/dist/manifest.json'); if (m.id !== 'atlas') process.exit(1); console.log(m.id, m.version)"
          docker run --rm --entrypoint test platform-atlas -f /app/frontend/entry.js
      - name: The updater has the tools it drives
        run: docker run --rm --entrypoint sh platform-updater -c 'docker --version && docker compose version && cosign version'
      - name: The images don't run as root
        run: |
          for image in platform-web platform-identity platform-storage platform-updater platform-folio platform-auspex platform-atlas; do
            uid=$(docker run --rm --entrypoint id "$image" -u)
            echo "$image runs as $uid"
            test "$uid" != 0
          done
      - name: The front door's nginx config loads
        run: docker run --rm --add-host gateway:127.0.0.1 --add-host keycloak:127.0.0.1 platform-web nginx -t
      - name: The shell's page carries its Content Security Policy
        run: |
          docker run -d --name web --add-host gateway:127.0.0.1 --add-host keycloak:127.0.0.1 \
            -e APP_ORIGINS=https://apps.example.org -p 8088:8080 platform-web
          for i in $(seq 1 20); do curl -fsI http://localhost:8088/admin > /tmp/headers && break; sleep 1; done
          cat /tmp/headers
          grep -iE "^content-security-policy: default-src 'self'; script-src 'self' 'sha256-[A-Za-z0-9+/=]+' https://apps.example.org;" /tmp/headers
          # Folio ships with AUGUR, so the front door serves its frontend too.
          curl -fsI http://localhost:8088/apps/folio/entry.js
          curl -fsI http://localhost:8088/apps/auspex/entry.js
          curl -fsI http://localhost:8088/apps/atlas/entry.js
          docker rm -f web
      - name: The nightly backup writes a restorable dump
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci postgres:16-alpine
          # Over TCP: during first start Postgres answers on its socket before its real start.
          until docker exec pg pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done
          # Just enough of the platform's and Keycloak's tables for the restore test to look for.
          docker exec -i pg psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create database platform;
          create database keycloak;
          \c platform
          create schema registry; create table registry.apps (id text);
          create schema events; create table events.audit (id int); create table events.notifications (id int);
          create schema identity; create table identity.preferences (id text);
          \c keycloak
          create table realm (id text, name text); insert into realm values ('r1', 'platform');
          create table user_entity (id text, realm_id text); insert into user_entity values ('u1', 'r1');
          SQL
          mkdir -p /tmp/backups
          # Stand-in for Garage's volumes: a block, a metadata snapshot, and the live database the backup leaves out.
          mkdir -p /tmp/objects/data/00 /tmp/objects/meta/snapshots
          echo block > /tmp/objects/data/00/block; echo snap > /tmp/objects/meta/snapshots/s1; echo live > /tmp/objects/meta/db.sqlite
          docker run --rm --link pg -e PGHOST=pg -e PGUSER=postgres -e PGPASSWORD=ci \
            -v "$PWD/infra/deploy/backup:/backup:ro" -v /tmp/backups:/backups -v /tmp/objects:/objects:ro \
            postgres:16-alpine /bin/sh /backup/backup.sh --once
          zcat /tmp/backups/platform-*.sql.gz | grep -q "PostgreSQL database cluster dump complete"
          grep -q '"ok":true' /tmp/backups/last-backup.json
          tar -tzf /tmp/backups/objects-*.tar.gz | tee /tmp/objects.txt
          grep -q '^data/00/block$' /tmp/objects.txt && grep -q '^meta/snapshots/s1$' /tmp/objects.txt && ! grep -q 'db.sqlite' /tmp/objects.txt
      - name: The updater's backup is a fresh one, and the newest
        run: |
          docker run --rm --link pg -e PGHOST=pg -e PGUSER=postgres -e PGPASSWORD=ci \
            -v "$PWD/infra/deploy/backup:/backup:ro" -v /tmp/backups:/backups \
            postgres:16-alpine /bin/sh /backup/backup.sh --now | tee /tmp/now.log
          grep -E "backup: wrote /backups/platform-[0-9-]+T[0-9]+Z\.sql\.gz" /tmp/now.log
          test "$(ls /tmp/backups/platform-*.sql.gz | sort | tail -n 1)" = "$(grep -oE '/backups/platform-[^ ]+' /tmp/now.log | sed 's#^#/tmp#')"
      - name: The weekly restore test restores the newest backup and checks it
        run: |
          docker run --rm -v "$PWD/infra/deploy/backup:/backup:ro" -v /tmp/backups:/backups \
            postgres:16-alpine /bin/sh /backup/backup.sh --restore-test
          cat /tmp/backups/restore-test.json
          grep -q '"ok":true' /tmp/backups/restore-test.json
