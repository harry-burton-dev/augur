name: Attribution
# Nothing in the repository names the tool that wrote it (AGENTS.md). Its own workflow, not a job in CI,
# so that editing a pull request's description checks it again without running all of CI. It installs
# nothing, so it takes seconds.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  attribution:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-attribution.mjs
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
