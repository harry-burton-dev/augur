name: Review
# A pull request's review tier, from the paths it changes (.github/review-tiers.json), and whether its
# description carries what that tier needs: the sections, the pre-merge /code-review run and, on Harry's
# paths, his ok as the harry-ok label (REVIEW.md). Its own workflow, like Attribution, so that editing the
# description or adding the label checks it again without running CI. It installs nothing: seconds.
# AUGUR's other repositories call this one (workflow_call), each with its own review-tiers.json, so the
# script lives once, here.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
  workflow_call:
permissions:
  contents: read
  # To take Harry's ok off when new commits change the pull request after it. A repository that calls this
  # workflow grants the same to its caller job.
  pull-requests: write
# Not cancelled by a newer run: a push's run must finish taking Harry's ok off, even when an edit follows it.
concurrency:
  group: review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  tier:
    # The Version packages pull request is the release itself: its contents were each reviewed as they merged.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The tier script, from AUGUR's main
        if: github.repository != 'harry-burton-dev/augur'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: harry-burton-dev/augur
          ref: main
          path: .augur-review
          sparse-checkout: scripts/review-tier.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Harry's ok is for the change he was asked about. A push that changes the pull request's own diff takes
      # it off, and he is asked again; bringing the branch up to date with its base (same patch) doesn't.
      - name: A changed diff takes Harry's ok off
        id: labels
        run: |
          labels=$(jq -c . <<<"$PR_LABELS")
          if [ "$ACTION" = synchronize ] && jq -e 'map(.name) | index("harry-ok")' <<<"$labels" >/dev/null; then
            patch() { git diff "$(git merge-base "origin/$BASE" "$1")" "$1" | git patch-id --stable | cut -d' ' -f1; }
            if [ "$(patch "$BEFORE" 2>/dev/null)" != "$(patch "$AFTER")" ]; then
              gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/harry-ok" >/dev/null
              labels=$(jq -c 'map(select(.name != "harry-ok"))' <<<"$labels")
              echo "::warning::The change is different from the one Harry said ok to: the harry-ok label is off until he says ok again."
            fi
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
        env:
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - run: node "${SCRIPT_DIR}/scripts/review-tier.mjs"
        env:
          SCRIPT_DIR: ${{ github.repository == 'harry-burton-dev/augur' && '.' || '.augur-review' }}
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ steps.labels.outputs.labels }}
          PR_BOT: ${{ github.event.pull_request.user.type == 'Bot' }}
