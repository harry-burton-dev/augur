name: Review
# A pull request's review tier, from the paths it changes (.github/review-tiers.json, as the base branch has
# it), and whether its description carries what that tier needs: the sections, the pre-merge /code-review run
# and, on Harry's paths, his ok as the harry-ok label (REVIEW.md). Its own workflow, like Attribution, so that
# editing the description or adding the label checks it again without running CI. It installs nothing: seconds.
# AUGUR's other repositories call this one (workflow_call), each with its own review-tiers.json, so the
# script lives once, here.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, closed]
  workflow_call:
    inputs:
      script-ref:
        description: The augur commit to take the tier script from; the same one the caller pins this workflow at.
        type: string
        default: main
permissions:
  contents: read
  # To record what Harry said ok to, and take his ok off when the change is no longer that. A repository that
  # calls this workflow grants the same to its caller job.
  pull-requests: write
# Every run checks the pull request as it is when it runs, whatever ran before it, so a newer run may cancel
# an older one. The run that records Harry's ok has a group of its own, so a push or an edit straight after
# the label goes on can't cancel it before it records; so has the run that writes the auto-ok record on a merge.
concurrency:
  group: review-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name == 'harry-ok') && github.run_id || github.event.action == 'closed' && 'record' || 'check' }}
  cancel-in-progress: true
jobs:
  tier:
    # The Version packages pull request is the release itself: its contents were each reviewed as they merged.
    # A pull request that is no longer open has nothing left to check, even when a label goes on after the merge
    # (harry-would-not); the record job below handles a merge.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.state == 'open' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The tier script, from AUGUR
        if: github.repository != 'harry-burton-dev/augur'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: harry-burton-dev/augur
          ref: ${{ inputs.script-ref || 'main' }}
          path: .augur-review
          sparse-checkout: scripts/review-tier.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Harry's ok is for the change he was asked about. When the label goes on, this records a fingerprint of
      # the change as it is then, in a comment from github-actions[bot]. Any later run whose change has a
      # different fingerprint takes the label off, and he is asked again. The fingerprint is the diff against
      # where the branch left its base, with no context lines and no line numbers, whitespace kept: bringing
      # the branch up to date with its base leaves it alone, and a change to one character (or a binary) doesn't.
      # This catches mistakes, not a hostile pull request: a pull request's own workflows run with a token that
      # can write the same comments (REVIEW.md).
      - name: Harry's ok covers this change
        id: labels
        run: |
          fingerprint() {
            git diff -U0 --no-color --binary "$(git merge-base "origin/$BASE" "$1")" "$1" \
              | { grep -v '^index ' || true; } | sed -E 's/^@@ .*/@@/' | sha256sum | cut -c1-16
          }
          now=$(fingerprint "$HEAD")
          labels() { gh api "repos/$GH_REPO/issues/$PR/labels" --jq '[.[].name]'; }
          drop() { labels=$(jq -c 'map(select(. != "harry-ok"))' <<<"$labels"); }
          labels=$(labels)
          if [ "$ACTION" = labeled ] && [ "$LABEL" = harry-ok ]; then
            if gh api "repos/$GH_REPO/issues/$PR/comments" -f body="<!-- harry-ok: $now -->
          Harry's ok recorded for this change as it is at ${HEAD:0:7}. A push that changes it takes the harry-ok label off." >/dev/null; then
              echo "Recorded Harry's ok for $now at $HEAD."
              # The label may have come off while this run recorded: what counts is what is on now.
              labels=$(labels)
            else
              drop
              echo "::warning::Couldn't record Harry's ok (a read-only token?), so it doesn't count yet."
            fi
          elif jq -e 'index("harry-ok")' <<<"$labels" >/dev/null; then
            # The newest record ("time fingerprint") and when the label last went on. Both lists are oldest first.
            recorded() {
              gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
                --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | test("<!-- harry-ok: [0-9a-f]+ -->")) | "\(.created_at) \(.body | capture("<!-- harry-ok: (?<fp>[0-9a-f]+) -->").fp)"' | tail -1
            }
            on=$(gh api "repos/$GH_REPO/issues/$PR/events" --paginate \
              --jq '[.[] | select(.event == "labeled" and .label.name == "harry-ok")] | last | .created_at // empty' | tail -1)
            # The label's own run hasn't recorded yet when there's no record made after the label last went on.
            pending() { rec=$(recorded); [ -n "$on" ] && { [ -z "$rec" ] || [[ "${rec%% *}" < "$on" ]]; }; }
            age() { echo $(( $(date +%s) - $(date -d "$on" +%s) )); }
            waited=0
            while pending && [ "$(age)" -lt "$RECORD_WINDOW" ] && [ "$waited" -lt "$WAIT" ]; do
              sleep 10; waited=$((waited + 10))
            done
            if pending && [ "$(age)" -lt "$RECORD_WINDOW" ]; then
              # Still being recorded: leave the label on, and this run doesn't count it.
              drop
              echo "::warning::Harry's ok is still being recorded by its own run. Re-run this check once the \"Harry's ok recorded\" comment is on the pull request."
            elif pending || [ -z "$rec" ]; then
              # A label with nothing recorded behind it comes off, so what shows is what counts: no label, no ok.
              gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/harry-ok" >/dev/null || echo "::warning::Couldn't take the label off (a read-only token)."
              drop
              echo "::warning::The harry-ok label had no recorded change behind it, so it is off. Add it again if Harry's ok still covers this change."
            elif [ "${rec#* }" != "$now" ]; then
              gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/harry-ok" >/dev/null || echo "::warning::Couldn't take the label off (a read-only token): this check stays red instead."
              drop
              echo "::warning::The change is different from the one Harry said ok to: the harry-ok label is off until he says ok again."
            fi
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
        env:
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # How long a run waits for the label's own run to record, and how long after the label goes on a
          # missing record still counts as on its way (a queued run) rather than lost.
          WAIT: 180
          RECORD_WINDOW: 900
      - run: node "${SCRIPT_DIR}/scripts/review-tier.mjs"
        env:
          SCRIPT_DIR: ${{ github.repository == 'harry-burton-dev/augur' && '.' || '.augur-review' }}
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ steps.labels.outputs.labels }}
          # Only Renovate's pull requests are taken as a bot's; any other app's are checked like a person's.
          PR_BOT: ${{ github.event.pull_request.user.login == 'renovate[bot]' }}

  # The auto-ok log (REVIEW.md): a merged pull request that waited for Harry's ok, but that the next rules
  # would have merged without him, gets a comment recording what was merged, why and on what checks, and the
  # auto-ok label. In the shadow week it records what he would have been spared; after it, each High change
  # that merged without him. The control centre reads the comments and labels.
  record:
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') && github.event.action == 'closed' && github.event.pull_request.merged }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The branch as it merged, with the history to find the base just before the merge (below). Blobs come
          # only as the diff needs them.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      # The tier script from AUGUR's main, in AUGUR too: one script writes every record, whatever the branch had.
      - name: The tier script, from AUGUR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: harry-burton-dev/augur
          ref: ${{ inputs.script-ref || 'main' }}
          path: .augur-review
          sparse-checkout: scripts/review-tier.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Where main was just before the merge: the merge commit's first parent for a squash or a merge commit;
      # for a rebase merge, the commit before the rebased ones (their change is the pull request's own).
      - name: The base before the merge
        id: base
        run: |
          git fetch --no-tags --filter=blob:none origin "$MERGE_SHA"
          base="$MERGE_SHA^1"
          if [ "$(git rev-list --no-walk --count --min-parents=2 "$MERGE_SHA")" = 0 ] && [ "$COMMITS" -gt 1 ] \
            && git rev-parse -q --verify "$MERGE_SHA~$COMMITS^{commit}" >/dev/null; then
            before="$MERGE_SHA~$COMMITS"
            same() { git diff "$1" "$2" | git patch-id --stable | cut -d' ' -f1; }
            if [ "$(same "$before" "$MERGE_SHA")" = "$(same "$(git merge-base "$before" HEAD)" HEAD)" ]; then base="$before"; fi
          fi
          echo "commit=$(git rev-parse "$base")" >> "$GITHUB_OUTPUT"
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
      - name: What it merged on
        id: checks
        # The checks on the branch's last commit, by name, apart from this workflow's own. A public repository's
        # checks need no extra permission; asking for checks: read here would break every caller that doesn't
        # grant it. If they can't be read (a private repository), the record says so rather than listing none.
        run: |
          if runs=$(gh api "repos/$GH_REPO/commits/$HEAD/check-runs" --paginate \
              --jq '[.check_runs[] | select(.name | test("(^|/ )(tier|record)$") | not) | {name, conclusion}]'); then
            checks=$(jq -cs 'add // [] | unique_by(.name)' <<<"$runs")
          else
            echo "::warning::Couldn't read the checks this pull request merged on."
            checks=unread
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - id: record
        run: node "${SCRIPT_DIR}/scripts/review-tier.mjs" --record
        env:
          SCRIPT_DIR: .augur-review
          BASE_COMMIT: ${{ steps.base.outputs.commit }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          CHECKS: ${{ steps.checks.outputs.checks }}
          RECORD_FILE: ${{ runner.temp }}/auto-ok.md
      - name: Record it on the pull request
        if: steps.record.outputs.logged == 'true'
        run: |
          # The comment is the record; the label is how the control centre finds it, so a label that can't go
          # on is a warning, not a lost record.
          gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@"$RECORD_FILE" >/dev/null
          gh api "repos/$GH_REPO/issues/$PR/labels" -f 'labels[]=auto-ok' >/dev/null \
            || echo "::warning::The auto-ok record is on the pull request, but the auto-ok label couldn't go on."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RECORD_FILE: ${{ runner.temp }}/auto-ok.md
