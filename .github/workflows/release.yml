name: Release
on:
  push:
    branches: [main]
concurrency: release-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushes made with the built-in token don't start other workflows, so CI
          # would never run on the Version packages PR. RELEASE_TOKEN can (docs/versioning.md).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # While changesets are waiting, keeps one "Version packages" PR open that bumps
      # versions and writes changelogs. Merging that PR tags each released package
      # (e.g. @platform/registry@0.2.0) and makes a GitHub release for it.
      - uses: changesets/action@v1
        id: changesets
        with:
          title: Version packages
          commit: Version packages
          version: pnpm version-packages
          publish: pnpm release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # Once nothing is waiting (the Version packages PR just merged), tags the platform release that PR
      # wrote to release/platform-release.json and makes its GitHub release, with the file attached.
      # Does nothing when that version is already released.
      - name: Platform release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/platform-release.mjs publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
