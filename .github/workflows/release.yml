name: Release
on:
  push:
    branches: [main]
concurrency: release-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  # AUGUR's images go to GitHub's container registry, signed keyless through GitHub's OIDC.
  packages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushes made with the built-in token don't start other workflows, so CI
          # would never run on the Version packages PR. RELEASE_TOKEN can (docs/versioning.md).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # While changesets are waiting, keeps one "Version packages" PR open that bumps
      # versions and writes changelogs. Merging that PR tags each released package
      # (e.g. @augur/registry@0.2.0) and makes a GitHub release for it.
      - uses: changesets/action@v1
        id: changesets
        with:
          title: Version packages
          commit: Version packages
          version: pnpm version-packages
          publish: pnpm release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # Once nothing is waiting (the Version packages PR just merged), releases the AUGUR version
      # that PR wrote to release/augur-release.json, unless it's out already: builds, pushes and
      # signs every image, then makes the GitHub release augur@<version> with the file attached.
      - name: Is there an AUGUR release to make?
        id: augur
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/augur-release.mjs pending >> "$GITHUB_OUTPUT"
      - if: steps.augur.outputs.new == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.augur.outputs.new == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.augur.outputs.new == 'true'
        uses: sigstore/cosign-installer@v3
      - name: Build, push and sign the images
        if: steps.augur.outputs.new == 'true'
        run: infra/release-images.sh "${{ steps.augur.outputs.version }}" "${{ steps.augur.outputs.channel }}" > "$RUNNER_TEMP/images.json"
      - name: AUGUR release
        if: steps.augur.outputs.new == 'true'
        run: node scripts/augur-release.mjs publish "$RUNNER_TEMP/images.json"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # Apps in apps/ that don't ship with AUGUR are released on their own, whenever their version
      # moves: each gets a signed bundle (service image and frontend) and the GitHub release
      # app/<id>@<version> with app-release.json attached, which deployments' app runners install from.
      - name: Are there app releases to make?
        id: apps
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: echo "pending=$(node scripts/app-release.mjs pending)" >> "$GITHUB_OUTPUT"
      - if: steps.apps.outputs.pending != '' && steps.apps.outputs.pending != '[]'
        uses: docker/setup-buildx-action@v3
      - if: steps.apps.outputs.pending != '' && steps.apps.outputs.pending != '[]'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.apps.outputs.pending != '' && steps.apps.outputs.pending != '[]'
        uses: sigstore/cosign-installer@v3
      - if: steps.apps.outputs.pending != '' && steps.apps.outputs.pending != '[]'
        uses: oras-project/setup-oras@v1
      - name: Build, sign and release each app
        if: steps.apps.outputs.pending != '' && steps.apps.outputs.pending != '[]'
        run: |
          echo "$PENDING" | jq -c '.[]' | while read -r app; do
            id=$(jq -r .id <<< "$app")
            infra/release-app.sh "$id" "$(jq -r .version <<< "$app")" "$(jq -r .channel <<< "$app")" > "$RUNNER_TEMP/$id.json"
            node scripts/app-release.mjs publish "$id" "$RUNNER_TEMP/$id.json"
          done
        env:
          PENDING: ${{ steps.apps.outputs.pending }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
