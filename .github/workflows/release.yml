name: Release
# Release channels (docs/release-channels.md): on main and on a hotfix's release/<unit>-<major.minor> branch, it keeps the Version packages PR open while
# changesets wait; once that's merged, it builds, signs and releases each unit whose version moved,
# once, as a pre-release: the beta channel. The Promote workflow makes a release stable, with no rebuild.
on:
  push:
    branches: [main, 'release/**']
permissions:
  contents: write
  pull-requests: write
  # AUGUR's images go to GitHub's container registry, signed keyless through GitHub's OIDC.
  packages: write
  id-token: write
env:
  # Reads AUGUR's kit packages from GitHub Packages (.npmrc): a classic token with read:packages, else this run's own.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
  # Where AUGUR's images and release feed go. They stay at ghcr.io/<owner>/im-platform, the repository's
  # first name, where servers pull them from; the IMAGE_REPO variable moves them (docs/upgrade.md).
  IMAGE_REPO: ${{ vars.IMAGE_REPO || format('ghcr.io/{0}/im-platform', github.repository_owner) }}
jobs:
  release:
    # Builds and pushes images, so only on an x86-64 runner: RELEASE_RUNNER, if CI_RUNNER names an Arm one.
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER || vars.CI_RUNNER || '"ubuntu-latest"') }}
    # One release job per branch at a time, held by this job only: the feed and the deploy test have
    # their own groups, so a push no longer waits behind a 20-minute deploy test. GitHub keeps one run
    # waiting per group and a newer push replaces it, which is fine: the newest push sees every change.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      released: ${{ steps.augur.outputs.new == 'true' || (steps.apps.outputs.pending != '' && steps.apps.outputs.pending != '[]') }}
      augur: ${{ steps.augur.outputs.new == 'true' && steps.augur.outputs.version || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Pushes made with the built-in token don't start other workflows, so CI
          # would never run on the Version packages PR. RELEASE_TOKEN can (docs/versioning.md).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # An empty changeset bumps nothing, so when only empty ones wait they mustn't hold back the
      # release below (PER-277): they're set aside for this run, and the next Version packages PR consumes them.
      - name: Set empty changesets aside
        run: node scripts/empty-changesets.mjs
      # While changesets are waiting, keeps one "Version packages" PR open that bumps versions and
      # writes changelogs. No publish step: packages aren't tagged or released one by one. The only
      # GitHub releases are the units a deployment installs, augur@<version> and app/<id>@<version>, made below.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          title: ${{ startsWith(github.ref_name, 'release/') && format('Version packages ({0})', github.ref_name) || 'Version packages' }}
          commit: Version packages
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # Once nothing is waiting, publishes each library in platform/packages whose version isn't in
      # GitHub Packages yet, as @<owner>/augur-<name>, for apps built in their own repositories.
      - name: Publish the library packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          pnpm turbo run build --filter='./platform/packages/*'
          node scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Once nothing is waiting (the Version packages PR just merged), releases the AUGUR version
      # that PR wrote to release/augur-release.json, unless it's out already: builds, pushes and
      # signs every image, then makes the GitHub release augur@<version> with the file attached.
      - name: Is there an AUGUR release to make?
        id: augur
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/augur-release.mjs pending >> "$GITHUB_OUTPUT"
      - if: steps.augur.outputs.new == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: steps.augur.outputs.new == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.augur.outputs.new == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Build, push and sign the images
        if: steps.augur.outputs.new == 'true'
        run: infra/release-images.sh "${{ steps.augur.outputs.version }}" "${{ steps.augur.outputs.channel }}" > "$RUNNER_TEMP/images.json"
        env:
          # The shipped apps' releases, source and images, in their own repositories (ADR 0049).
          APP_RELEASES_TOKEN: ${{ secrets.APP_RELEASES_TOKEN }}
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - name: AUGUR release
        if: steps.augur.outputs.new == 'true'
        run: node scripts/augur-release.mjs publish "$RUNNER_TEMP/images.json"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # Apps in apps/ that don't ship with AUGUR are released on their own, whenever their version
      # moves: each gets a signed bundle (service image and frontend) and the GitHub release
      # app/<id>@<version> with app-release.json attached, which deployments' app runners install from.
      - name: Are there app releases to make?
        id: apps
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: echo "pending=$(node scripts/app-release.mjs pending)" >> "$GITHUB_OUTPUT"
      - if: steps.apps.outputs.pending != '' && steps.apps.outputs.pending != '[]'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: steps.apps.outputs.pending != '' && steps.apps.outputs.pending != '[]'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.apps.outputs.pending != '' && steps.apps.outputs.pending != '[]'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - if: steps.apps.outputs.pending != '' && steps.apps.outputs.pending != '[]'
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      - name: Build, sign and release each app
        if: steps.apps.outputs.pending != '' && steps.apps.outputs.pending != '[]'
        run: |
          echo "$PENDING" | jq -c '.[]' | while read -r app; do
            id=$(jq -r .id <<< "$app")
            infra/release-app.sh "$id" "$(jq -r .version <<< "$app")" "$(jq -r .channel <<< "$app")" > "$RUNNER_TEMP/$id.json"
            node scripts/app-release.mjs publish "$id" "$RUNNER_TEMP/$id.json"
          done
        env:
          PENDING: ${{ steps.apps.outputs.pending }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
  # Deployments learn of what was just released from the feed beside the images, read with their read key.
  feed:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/feed.yml
    # A called workflow gets no secrets unless passed: the feed reads the app repositories with APP_RELEASES_TOKEN.
    secrets: inherit
  # A new AUGUR release is installed fresh, upgraded to from the release before, and gone back
  # from, with the images just pushed (docs/deploy-test.md). Once per release, nothing rebuilt.
  deploy-test:
    needs: release
    if: needs.release.outputs.augur != ''
    uses: ./.github/workflows/deploy-test.yml
    with:
      to: ${{ needs.release.outputs.augur }}
