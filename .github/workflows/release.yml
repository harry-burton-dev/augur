name: Release
on:
  push:
    branches: [main]
concurrency: release-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # While changesets are waiting, keeps one "Version packages" PR open that bumps
      # versions and writes changelogs. Merging that PR tags each released package
      # (e.g. @platform/registry@0.2.0) and makes a GitHub release for it.
      - uses: changesets/action@v1
        with:
          title: Version packages
          commit: Version packages
          version: pnpm version-packages
          publish: pnpm release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
