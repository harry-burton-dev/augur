name: Release feed
# Keeps ghcr.io/<repo>/feed:latest, the list of AUGUR's and apps' releases that deployments read with
# their read key (scripts/publish-feed.mjs, docs/upgrade.md "The read key"), in step with GitHub's
# releases. Each workflow that makes or removes releases (Release, the dev builds, App previews) calls
# it once when it's done, so it runs once per release run, not once per release event. An app in its own
# repository (release/app-repos.json) starts it from its release workflow. Run it by hand
# after changing a release in GitHub yourself. It signs the feed with cosign keyless, as this workflow
# on main (or a hotfix's release branch), and the feed expires after two weeks, so it also runs weekly
# to issue it again (ADR 0017).
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
concurrency:
  group: release-feed
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
  # Signs the feed keyless: deployments check it came from this workflow (ADR 0017).
  id-token: write
env:
  # Reads AUGUR's kit packages from GitHub Packages (.npmrc): a classic token with read:packages, else this run's own.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
  # Where AUGUR's images and release feed go. They stay at ghcr.io/<owner>/im-platform, the repository's
  # first name, where servers pull them from; the IMAGE_REPO variable moves them (docs/upgrade.md).
  IMAGE_REPO: ${{ vars.IMAGE_REPO || format('ghcr.io/{0}/im-platform', github.repository_owner) }}
jobs:
  feed:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - run: echo "$ORAS_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
        env:
          ORAS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the feed
        run: node scripts/publish-feed.mjs --out "$RUNNER_TEMP/feed.json" --sign --push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Reads the releases of apps in their own repositories (release/app-repos.json, ADR 0047).
          APP_RELEASES_TOKEN: ${{ secrets.APP_RELEASES_TOKEN }}
      # The signature as deployments check it, with the registry's own code: a mismatch would make every
      # deployment refuse the feed, so it shows here first.
      - name: Check the signature as deployments do
        run: node --experimental-strip-types scripts/check-feed-signature.mjs "$RUNNER_TEMP/feed.json" "$GITHUB_REPOSITORY"
