packages:
  - "platform/packages/*"
  - "platform/services/*"
  - "platform/frontends/*"
  - "platform/contract"
  - "apps/*/*"
# The versions shared by more than one package (pnpm catalogs, PER-166): a package asks for
# `catalog:` and gets the range here, so one line moves them all. `pnpm check:versions` fails when
# two packages name the same dependency without it. Packages from AUGUR's other repositories (the
# kit's `npm:` aliases) and peer ranges stay in each package.json.
catalogMode: prefer
catalog:
  "@aws-sdk/client-s3": "^3.1156.0"
  "@fastify/swagger": "^9.9.0"
  "@fastify/type-provider-typebox": "^6.3.0"
  "@opentelemetry/api": "^1.10.0"
  "@tailwindcss/vite": "4.3.3"
  "@types/node": "^22.0.0"
  "@types/pg": "^8.23.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@types/semver": "^7.8.0"
  "@vitejs/plugin-react": "^5.2.0"
  fastify: "^5.12.7"
  happy-dom: "^21.0.4"
  jose: "^6.2.12"
  pg: "^8.23.1"
  react: "^19.3.1"
  react-dom: "^19.3.1"
  semver: "^7.8.5"
  tailwindcss: "4.3.3"
  typebox: "^1.4.0"
  typescript: "^5.6.0"
  vite: "^7.3.7"
  vitest: "^4.1.12"
  yaml: "^2.9.1"
onlyBuiltDependencies:
  - esbuild
# API Extractor and ESLint ask for minimatch releases with a known vulnerability; take the patched release
# the rest of the tree already uses. Drop these once they move past it. fast-uri comes in through Fastify and
# Ajv, whose ranges haven't reached its patched releases. Drop these once they do.
overrides:
  "@microsoft/api-extractor>minimatch": 11.0.4
  "minimatch@10": 11.0.4
  "fast-uri@3": 3.1.9
  "fast-uri@4": 4.2.3
