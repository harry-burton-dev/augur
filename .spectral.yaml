# Lints contracts/*.openapi.yaml (pnpm check:contracts, ADR 0055). Spectral's OpenAPI rules, with the
# ones AUGUR's contracts don't follow turned down: see docs/api-contracts.md.
extends: ["spectral:oas"]
rules:
  # Clients are generated by path (openapi-fetch), so operation ids and tags are not needed.
  operation-operationId: off
  operation-tags: off
  openapi-tags: off
  # The servers are relative (/v1): the gateway mounts each service under /api/<service>.
  oas3-api-servers: off
  info-contact: off
  # Each operation has a summary; a description only where there is more to say.
  operation-description: off
