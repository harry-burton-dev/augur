  /admin/organisation:
    patch:
      summary: Change the organisation's settings, audited as organisation.changed (admins only; security and retention need a deployment admin)
      description: Only the fields sent change. The name renames the organisation’s floor, which everyone sees. `security` needs the deployment-admin role and a password entered in the last 10 minutes, or it answers 401 sign_in_again. `notice.askAgain` asks everyone to accept the notice at their next sign-in, audited as organisation.notice-asked. The notice, languages and two steps for everyone reach the sign-in service when AUGUR next starts or upgrades.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[^\r\n/]*[^\s/][^\r\n/]*$
                  description: No slash and not only spaces
                timeZone:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: An IANA time zone; GET /admin/organisation/time-zones lists them
                sender:
                  type: object
                  required:
                    - name
                    - address
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 100
                      pattern: ^[^\r\n]*\S[^\r\n]*$
                    address:
                      anyOf:
                        - type: string
                          format: email
                          maxLength: 254
                        - type: "null"
                      description: null takes the address away
                  additionalProperties: false
                idle:
                  type: object
                  properties:
                    on:
                      type: boolean
                      description: Whether accounts nobody signs in to are warned and then turned off
                    warningDays:
                      type: integer
                      minimum: 7
                      maximum: 723
                      description: Days without a sign-in before the warning email
                    turnOffDays:
                      type: integer
                      minimum: 14
                      maximum: 730
                      description: "Days without a sign-in before their sign-in turns off: at least 7 after the warning"
                  additionalProperties: false
                  minProperties: 1
                  description: Only what changes; the warning stays at least a week before the turn-off
                notice:
                  type: object
                  properties:
                    on:
                      type: boolean
                    title:
                      type: string
                      maxLength: 80
                      pattern: ^[^\r\n]*$
                    text:
                      type: string
                      maxLength: 5000
                    askAgain:
                      type: boolean
                      description: Ask everyone to accept it again at their next sign-in
                  additionalProperties: false
                  minProperties: 1
                languages:
                  type: array
                  items:
                    type: string
                    maxLength: 35
                  minItems: 1
                  maxItems: 40
                  uniqueItems: true
                  description: GET /admin/organisation/languages lists the ones there are
                defaultLanguage:
                  type: string
                  maxLength: 35
                security:
                  type: object
                  properties:
                    twoStepForAll:
                      type: boolean
                      description: Everyone, not only the admin roles, signs in with a code app or a passkey
                    leaverRetentionDays:
                      type: integer
                      minimum: 7
                      maximum: 3650
                      description: Days a leaver’s account is kept after they leave
                    activityRetentionDays:
                      type: integer
                      minimum: 90
                      maximum: 3650
                      description: Days Activity keeps its entries
                  additionalProperties: false
                  minProperties: 1
                  description: Only a deployment admin who just entered their password
              additionalProperties: false
              minProperties: 1
              description: Only what changes
        description: Only what changes
      responses:
        "200":
          description: The settings now
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - timeZone
                  - sender
                  - idle
                  - notice
                  - languages
                  - defaultLanguage
                  - security
                properties:
                  name:
                    type: string
                    description: "The organisation's name: its floor's name, seeded from ORG_NAME at first start"
                  timeZone:
                    type: string
                    description: An IANA time zone, e.g. Europe/London. UTC until an admin chooses one
                  sender:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 100
                        pattern: ^[^\r\n]*$
                        description: Who email says it is from, e.g. the organisation's name
                      address:
                        type: string
                        format: email
                        maxLength: 254
                        description: The address email is sent from. Absent until an admin sets one; mail is not sent from AUGUR without it
                    additionalProperties: false
                  idle:
                    type: object
                    required:
                      - on
                      - warningDays
                      - turnOffDays
                    properties:
                      on:
                        type: boolean
                        description: Whether accounts nobody signs in to are warned and then turned off
                      warningDays:
                        type: integer
                        minimum: 7
                        maximum: 723
                        description: Days without a sign-in before the warning email
                      turnOffDays:
                        type: integer
                        minimum: 14
                        maximum: 730
                        description: "Days without a sign-in before their sign-in turns off: at least 7 after the warning"
                    additionalProperties: false
                    description: Idle accounts. 60 and 90 days, on, until an admin changes them
                  logo:
                    type: object
                    required:
                      - url
                      - sha256
                      - width
                      - height
                    properties:
                      url:
                        type: string
                        description: "Where anyone, signed in or not, fetches it: changes when the logo does"
                      sha256:
                        type: string
                      width:
                        type: integer
                      height:
                        type: integer
                    additionalProperties: false
                    description: The organisation’s logo, a PNG
                  notice:
                    type: object
                    required:
                      - on
                      - version
                    properties:
                      on:
                        type: boolean
                        description: Whether people read and accept it before they use AUGUR
                      title:
                        type: string
                        maxLength: 80
                      text:
                        type: string
                        maxLength: 5000
                        description: Plain text; a blank line between paragraphs
                      version:
                        type: integer
                        description: Goes up each time everyone is asked to accept it again
                      changedAt:
                        type: string
                        format: date-time
