                        type: string
                    additionalProperties: false
                    description: The sign-in notice, shown as Keycloak’s Terms and Conditions step. Off until an admin turns it on
                  languages:
                    type: array
                    items:
                      type: string
                    description: "The languages offered at sign-in and in Account: REALM_LANGUAGES until an admin chooses"
                  defaultLanguage:
                    type: string
                    description: One of `languages`, for anyone who hasn’t chosen
                  security:
                    type: object
                    required:
                      - twoStepForAll
                      - leaverRetentionDays
                      - activityRetentionDays
                    properties:
                      twoStepForAll:
                        type: boolean
                        description: Everyone, not only the admin roles, signs in with a code app or a passkey
                      leaverRetentionDays:
                        type: integer
                        minimum: 7
                        maximum: 3650
                        description: Days a leaver’s account is kept after they leave
                      activityRetentionDays:
                        type: integer
                        minimum: 90
                        maximum: 3650
                        description: Days Activity keeps its entries
                    additionalProperties: false
                    description: Changed only by a deployment admin who just entered their password. Two steps for admins only, 90 and 365 days, until one changes them
                  updatedAt:
                    type: string
                    format: date-time
                    description: When an admin last changed them
                  updatedBy:
                    type: string
                    description: Who last changed them
                description: The settings now
        "400":
          description: A name with a slash or only spaces, an unknown time zone or language, a sender that is not one line or not an email address, idle or retention days out of bounds, or a notice turned on without a title and text
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: No signed-in caller, or sign_in_again for security
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin, or security from someone who isn’t a deployment admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Asked everyone again, but the sign-in service can’t be reached
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /admin/organisation/logo:
    put:
      summary: Set the organisation's logo, a PNG (admins only), audited as organisation.changed
      description: A PNG of at most 256 KB and 1024 px on each side, at least 32 px tall. Sent as image/png.
      responses:
        "200":
          description: The organisation’s logo, a PNG
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                  - sha256
                  - width
                  - height
                properties:
                  url:
                    type: string
                    description: "Where anyone, signed in or not, fetches it: changes when the logo does"
                  sha256:
                    type: string
                  width:
                    type: integer
                  height:
                    type: integer
                additionalProperties: false
                description: The organisation’s logo, a PNG
        "400":
          description: Not a PNG, or the wrong size
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "413":
          description: Larger than the limit
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "415":
          description: Not sent as image/png
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    delete:
      summary: Take the organisation's logo away (admins only)
      responses:
        "204":
          description: Default Response
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /notice-settings:
    get:
      summary: How people want their notices emailed (the events service only)
      description: "For each person named in ids, or everyone who chose the digest given: their confirmed address, language, time zone (theirs, else the organisation’s) and choices in Account → Notifications. A person without an account is left out."
      parameters:
        - schema:
            type: string
          in: query
          name: ids
          required: false
          description: Comma-separated person ids, at most 200
        - schema:
            type: string
