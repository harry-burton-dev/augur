  /me/workspaces:
    get:
      summary: Every floor the caller can stand on
      description: Their own floor (made the first time they ask), the org, each team they are on, and every team above those. Being on a team doesn't put you on the teams below it. Ordered own floor, org, then teams in tree order.
      responses:
        "200":
          description: The caller's floors
          content:
            application/json:
              schema:
                type: object
                required:
                  - workspaces
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Floor"
                description: The caller's floors
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /me/map:
    get:
      summary: The caller's map of the org
      description: "For Auspex. Every floor the caller can stand on, with who is there and why they can come in; the teams inside ones they lead (and, for admins, every team) to see into without standing on; and every other team as a closed door that names only itself, where it sits and its leads, so the caller knows who can add them. Nothing inside a closed team is said: not its people, how many, or what it uses. Floors are the org, then teams depth first, then the caller's own floor."
      responses:
        "200":
          description: The caller's map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonMap"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /me/directory:
    get:
      summary: Find people and teams to share with
      description: "What the people picker asks as someone types (searchPrincipals in the SDK, since 1.15): people whose name, email or username has `q` in it, and every team whose name does, each sorted by name, first `limit` of each. With `ids` instead, the people and teams with those ids, to name who something is shared with. Teams the caller isn't on are found too, as on their map: a team names only itself and where it sits. People whose sign-in is turned off aren't listed."
      parameters:
        - schema:
            type: string
            maxLength: 100
          in: query
          name: q
          required: false
        - schema:
            type: string
            maxLength: 4000
          in: query
          name: ids
          required: false
          description: Comma-separated person and team ids
        - schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: People and teams
          content:
            application/json:
              schema:
                type: object
                required:
                  - people
                  - teams
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                  teams:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - within
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        within:
                          type: array
                          items:
                            type: string
                          description: Names of the teams it sits in, from the top down
                        path:
                          type: array
                          items:
                            type: string
                          description: The ids of those teams, then its own (1.9)
                description: People and teams
        "400":
          description: A query it does not know, or a value out of range
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /me/workspaces/{id}/rollup:
    get:
      summary: A floor and every team below it the caller is on
      description: What an app rolls up when someone asks to include sub-teams. Access flows down only, so a team below appears only if the caller is on it.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: The floor first, then the teams below it in tree order
          content:
            application/json:
              schema:
                type: object
                required:
                  - workspace
                  - workspaces
                properties:
                  workspace:
                    type: string
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Floor"
                description: The floor first, then the teams below it in tree order
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: The caller isn't on that floor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
