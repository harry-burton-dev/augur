                $ref: "#/components/schemas/Refusal"
  /admin/people:
    get:
      summary: Everyone in the directory
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
                description: People
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Identity isn't connected to the sign-in service
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    post:
      summary: "Add someone: an invite email, or a one-time password they replace at first sign-in"
      description: "`start` is `email` by default when the sign-in service can send email, else `temporary-password`. An invite emails a link that works for 72 hours to confirm their email and choose a password. If the account is made but the email can’t be sent, the answer is still 201, with `invite.error`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPerson"
      responses:
        "201":
          description: Added. A one-time password is returned once and kept nowhere it can be read again.
          content:
            application/json:
              schema:
                type: object
                required:
                  - person
                  - invite
                properties:
                  person:
                    $ref: "#/components/schemas/Person"
                  invite:
                    type: object
                    required:
                      - method
                    properties:
                      method:
                        type: string
                        enum:
                          - email
                          - temporary-password
                      sentTo:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                      error:
                        type: string
                        description: "The account was made but the email couldn’t be sent: resend it, or give a one-time password"
                    description: How they start
                  temporaryPassword:
                    type: string
                description: Added. A one-time password is returned once and kept nowhere it can be read again.
        "400":
          description: A field is missing or wrong, a role or department doesn't exist, or an invite was asked for and email isn't set up
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin, or not a deployment admin when the deployment-admin role or a deployment admin’s sign-in is touched
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: The username or email is taken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Identity isn't connected to the sign-in service
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /admin/people/{id}:
    get:
      summary: One person
      description: "With `lockout` as the sign-in service has it now: whether wrong passwords have locked them out, and how many in a row."
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Person"
                  - type: object
                    properties:
                      lockout:
                        type: object
                        required:
                          - locked
                          - failures
                        properties:
                          locked:
                            type: boolean
                          failures:
                            type: integer
                            minimum: 0
                          lastFailureAt:
                            type: string
                            format: date-time
                        description: Left out when the sign-in service couldn’t say
                description: The person
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: No such person
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Identity isn't connected to the sign-in service
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    patch:
      summary: Change someone's name, email, roles, departments or sign-in
      description: Only the fields sent change. roles and departments replace the whole list. An admin can't turn off their own sign-in or remove their own admin role (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonChanges"
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: The person as they now are
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          description: A field is wrong, or a role or department doesn't exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin, or not a deployment admin when the deployment-admin role or a deployment admin’s sign-in is touched
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: No such person
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: The change would lock the caller out, the email is taken, or they have left and the change would turn their sign-in back on
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Identity isn't connected to the sign-in service
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    delete:
      summary: Delete a leaver’s account now, without waiting for the retention period (deployment admins only)
      description: "Only for someone who has left, by a deployment admin who entered their password in the last 10 minutes (401 sign_in_again otherwise). Runs the same steps as deletion after retention (ADR 0072): Activity loses their personal values, identity forgets their preferences and teams, Keycloak deletes the account, then `person.deleted` is recorded, which followers hear as `platform.person.deleted`. It can’t be undone."
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Deleted; only their id is kept, in Activity
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: boolean
                    enum:
                      - true
                description: Deleted; only their id is kept, in Activity
        "401":
          description: "sign_in_again: enter the password again first"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not a deployment admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: No such person
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: They haven’t left
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Activity couldn’t be reached, so the deletion isn’t finished; identity carries it on within five minutes
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
