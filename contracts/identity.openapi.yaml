# Generated from platform/services/identity: its routes' TypeBox schemas and src/contract.ts (ADR 0055).
# Change those, then run pnpm contracts. CI fails when this file is out of step.
# Paths below are relative to the server: the major of info.version is the path prefix.
# A breaking change bumps the major and is served under /v2 beside /v1.
openapi: 3.1.0
info:
  title: Identity
  version: 1.33.0
  description: Who people are. Reached through the gateway, which verifies the caller's sign-in token and passes the caller on in x-user-* headers. The /admin paths manage people and roles, kept in the sign-in provider (Keycloak), and departments, which are identity's own teams (copied in once from the provider's groups). Every /admin path answers 403 to a caller without the admin role, and 503 when identity isn't connected to the provider. Changes are audited, never a password. /organisation is the organisation's name, time zone and email sender (ADR 0042), for anyone signed in and any service; only an admin changes them.
components:
  schemas:
    Refusal:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - reason
        - error
        - message
      properties:
        type:
          type: string
          description: about:blank unless the problem names its own type
        title:
          type: string
          description: The status's own phrase
        status:
          type: integer
        detail:
          type: string
          description: Says why, and what would change it
        instance:
          type: string
        reason:
          type: string
          description: A stable code a client can switch on
          examples:
            - forbidden
        whoCanChange:
          type: string
          description: Who can fix it, in plain words, when someone can
        error:
          type: string
          description: The same as reason, for SDK 1.x clients
        message:
          type: string
          description: The same as detail, for SDK 1.x clients
    TeamLevels:
      type: object
      required:
        - levels
        - max
      properties:
        levels:
          type: array
          items:
            type: string
          description: Default ["Department", "Team"]
        max:
          type: integer
          description: How many levels departments can nest
    WorkspaceRef:
      type: object
      required:
        - id
        - kind
        - name
        - slug
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - personal
            - team
            - org
        name:
          type: string
          description: '"You" for your own floor'
        slug:
          type: string
          description: The word in links, /@finance/…; your own floor is always "me"
        level:
          type: string
          description: 'Teams only: the name of the level the team sits at, "Department" right below the org and "Team" below that unless an admin renamed them (GET /admin/levels). The kind stays team.'
    Floor:
      allOf:
        - $ref: "#/components/schemas/WorkspaceRef"
        - type: object
          required:
            - path
            - role
            - direct
          properties:
            path:
              type: array
              items:
                $ref: "#/components/schemas/WorkspaceRef"
              description: From the org down to this floor, itself included. Your own floor is alone on its path.
            role:
              type: string
              enum:
                - member
                - lead
              description: lead on your own floor and on teams you lead
            direct:
              type: boolean
              description: False when you're on it only through a team below it
    MapPerson:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    FloorReason:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - own
            - org
            - member
            - inside
            - leads-above
            - admin
        role:
          type: string
          enum:
            - member
            - lead
        via:
          $ref: "#/components/schemas/MapPerson"
        team:
          $ref: "#/components/schemas/MapPerson"
      description: "Why the caller can come in: own (their own floor), org (everyone is), member (with role), inside (on a team inside it, `via`), leads-above (leads `team`, which this sits inside), admin."
    PersonMap:
      type: object
      required:
        - floors
        - closed
        - principals
      properties:
        floors:
          type: array
          items:
            type: object
            required:
              - id
              - kind
              - name
              - slug
              - depth
              - open
              - why
              - people
              - leads
            properties:
              id:
                type: string
              kind:
                type: string
                enum:
                  - org
                  - personal
                  - team
              name:
                type: string
              slug:
                type: string
              parentId:
                type: string
              depth:
                type: integer
                minimum: 0
                maximum: 5
              open:
                type: boolean
                description: False for a team the caller sees into without standing on it
              why:
                $ref: "#/components/schemas/FloorReason"
              people:
                type: integer
                description: Everyone who can stand on it
              leads:
                type: array
                items:
                  $ref: "#/components/schemas/MapPerson"
              members:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/MapPerson"
                    - type: object
                      required:
                        - role
                      properties:
                        role:
                          type: string
                          enum:
                            - member
                            - lead
                description: Who is on a team directly, leads first
        closed:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - depth
              - leads
            properties:
              id:
                type: string
              name:
                type: string
              parentId:
                type: string
              depth:
                type: integer
                minimum: 1
                maximum: 5
              leads:
                type: array
                items:
                  $ref: "#/components/schemas/MapPerson"
        principals:
          type: array
          items:
            type: string
    Role:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
    Person:
      type: object
      required:
        - id
        - username
        - firstName
        - lastName
        - enabled
        - invited
        - roles
        - departments
      properties:
        id:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        enabled:
          type: boolean
          description: False when their sign-in is turned off
        invited:
          type: boolean
          description: Still has to choose their own password
        roles:
          type: array
          items:
            type: string
        departments:
          type: array
          items:
            type: string
          description: Department ids
        createdAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
            - invited
            - active
            - disabled
            - left
          description: "Where their account is in its life (ADR 0040): invited until their first sign-in, then active; disabled while their sign-in is off; left for good"
        invite:
          type: object
          required:
            - method
            - expired
            - count
          properties:
            method:
              type: string
              enum:
                - email
                - temporary-password
            sentAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
            expired:
              type: boolean
              description: Still invited, and the link has run out
            count:
              type: integer
              minimum: 0
              description: Invite emails sent
          description: How they were asked to start, when AUGUR made the account
        lastSignInAt:
          type: string
          format: date-time
          description: Their last sign-in that AUGUR has seen
        joinedAt:
          type: string
          format: date-time
          description: Their first sign-in that AUGUR has seen
        disabledCause:
          type: string
          enum:
            - admin
            - idle
            - leaver
            - outside
          description: Why their sign-in is off, when AUGUR knows
        left:
          type: object
          required:
            - at
            - by
          properties:
            at:
              type: string
              format: date-time
            by:
              type: string
            handOverTo:
              type: string
            deleteAfter:
              type: string
              format: date-time
              description: When their account is deleted, once the organisation’s leaver retention has passed (ADR 0072)
          description: When they left, who ran the leaver flow, and who took on their work
        deleting:
          type: string
          enum:
            - redacted
            - tidied
            - keycloak-deleted
          description: Deleting their account has started and got this far; it carries on within five minutes (ADR 0072)
        source:
          type: string
          enum:
            - local
            - federated
          description: "How they sign in: a password here, or the organisation’s sign-in (Entra) since their first sign-in through it"
        locked:
          type: boolean
          description: Locked out for now after repeated wrong passwords; an admin can lift it
        leaving:
          type: object
          required:
            - on
          properties:
            on:
              type: string
              format: date
              description: Their last day, in the organisation’s time zone
            handOverTo:
              type: string
          description: A leaver flow set to run once their last day is over
        idle:
          anyOf:
            - type: object
              required:
                - warnsAt
                - turnsOffAt
                - warned
              properties:
                warnsAt:
                  type: string
                  format: date-time
                  description: When they’re emailed that their sign-in will turn off, unless they sign in first
                turnsOffAt:
                  type: string
                  format: date-time
                  description: When their sign-in turns off, unless they sign in first
                warned:
                  type: boolean
                  description: The warning day has passed
              additionalProperties: false
            - type: object
              required:
                - exempt
              properties:
                exempt:
                  type: string
                  enum:
                    - off
                    - no-email
                    - deployment-admin
                    - not-tracked
                  description: "Why their sign-in won’t turn off for being idle: idle accounts are off, email isn’t set up so nobody could be warned, they’re a deployment admin, or AUGUR hasn’t seen them sign in yet"
              additionalProperties: false
          description: "For an active person: when an idle sign-in turns off, from their last sign-in and the organisation’s days"
    NewPerson:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        username:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{1,59}$
          description: Defaults to the part of the email before the @
        firstName:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
        lastName:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
        email:
          type: string
          minLength: 3
          maxLength: 254
          pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
        roles:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 50
          uniqueItems: true
        departments:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 50
          uniqueItems: true
        start:
          type: string
          enum:
            - email
            - temporary-password
          description: "How they start: an invite email with a link to choose a password (the default when email works), or a one-time password an admin gives them"
      additionalProperties: false
    PersonChanges:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
        lastName:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
        email:
          type: string
          minLength: 3
          maxLength: 254
          pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
        enabled:
          type: boolean
        roles:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 50
          uniqueItems: true
        departments:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 50
          uniqueItems: true
      additionalProperties: false
      minProperties: 1
    Department:
      type: object
      required:
        - id
        - name
        - members
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: string
          description: The department it sits inside; absent at the top
        members:
          type: array
          items:
            type: string
          description: Ids of its own members
    Caller:
      type: object
      required:
        - id
        - name
        - departments
        - roles
      properties:
        id:
          type: string
          description: Stable id from the sign-in provider
        name:
          type: string
        email:
          type: string
        departments:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        signedInAt:
          type: string
          format: date-time
          description: When they last entered their password, when the gateway said
        workspace:
          type: object
          required:
            - id
            - kind
            - role
          properties:
            id:
              type: string
            kind:
              type: string
              enum:
                - personal
                - team
                - org
            role:
              type: string
              enum:
                - member
                - lead
          description: The floor the request is for, when it named one (x-workspace-id) and the gateway checked the caller is on it
    Preferences:
      type: object
      properties:
        reduceMotion:
          type: boolean
        density:
          type: string
          enum:
            - comfortable
            - compact
        areaTitles:
          type: boolean
          description: Area title cards on arriving at a floor or opening an app; on unless false
        toasts:
          type: boolean
          description: Each new notification also said once as a toast; off unless true
        barStop:
          anyOf:
            - type: number
              enum:
                - 0
            - type: number
              enum:
                - 1
            - type: number
              enum:
                - 2
            - type: number
              enum:
                - 3
          description: "Where the app bar rests on the desktop: under the band (0), upper (1, the default), lower (2) or at the bottom (3)"
        away:
          type: boolean
        recent:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 12
          description: App ids, most recent first
        muted:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 100
          uniqueItems: true
          description: App ids whose notifications land in the stream silently and never on Home
        quietKinds:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9-]{1,39}:[a-z][a-z0-9-]{0,39}$
          maxItems: 200
          uniqueItems: true
          description: Kinds of notification, as "<app>:<kind>", that land in the stream silently and never on Home or as a toast
        pinned:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 12
          uniqueItems: true
          description: App ids they keep first on Home and in the list of apps, in their order
        startFloor:
          type: string
          minLength: 1
          maxLength: 64
          description: The floor id AUGUR opens on when an address names none; their own floor without it
        awayMessage:
          type: string
          maxLength: 140
          description: What their away status says
        awayUntil:
          type: string
          format: date-time
          description: When being away ends by itself
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA, such as Europe/London; without it the organisation's, then the browser's
        dateFormat:
          type: string
          minLength: 2
          maxLength: 35
          pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
          description: The region whose way of writing dates, times and numbers they want, as a language tag such as en-GB; without it their language’s, then the browser’s (since 1.20)
        clock:
          type: string
          enum:
            - "12"
            - "24"
          description: A 12- or 24-hour clock; without it, as their date format writes it (since 1.20)
        notifications:
          type: object
          properties:
            email:
              type: boolean
              description: An email for each thing that needs them; on unless false
            digest:
              type: string
              enum:
                - off
                - daily
                - weekly
              description: One email gathering the rest; off unless chosen
            quietHours:
              type: object
              required:
                - from
                - to
              properties:
                from:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                to:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              additionalProperties: false
              description: "HH:MM in their time zone: no toasts and no email between them"
          additionalProperties: false
      additionalProperties: false
      description: Every field is optional; what's missing takes the shell's default.
    AccountProfile:
      type: object
      required:
        - username
        - firstName
        - lastName
        - emailVerified
        - managed
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        jobTitle:
          type: string
        phone:
          type: string
        pronouns:
          type: string
        picture:
          type: string
          description: A link to their picture in AUGUR’s storage
        locale:
          type: string
          description: Their language (the user profile’s locale), which sign-in pages use too
        managed:
          type: array
          items:
            type: string
            enum:
              - firstName
              - lastName
              - email
              - jobTitle
              - phone
              - pronouns
              - picture
              - locale
          description: Fields their organisation’s sign-in sets at every sign-in, so they can’t be changed here
        managedBy:
          type: string
          description: That sign-in’s name
        languages:
          type: array
          items:
            type: string
          description: The languages this deployment offers, the first its default (since 1.20)
    AccountProfileChanges:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 120
        lastName:
          type: string
          maxLength: 120
        jobTitle:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 40
          pattern: ^[+0-9 ()-]*$
        pronouns:
          type: string
          maxLength: 40
        picture:
          type: string
          maxLength: 2048
          description: A link, or empty to take it away
        locale:
          type: string
          maxLength: 35
          description: One of `languages`, or empty for the deployment’s default (since 1.20)
      additionalProperties: false
      minProperties: 1
      description: Only what changes. An empty string takes a fact away. The email address changes through the email action.
    AccountSecurity:
      type: object
      required:
        - password
        - codeApps
        - passkeys
        - recoveryCodes
        - twoStep
        - linked
        - canLink
        - actions
        - emails
      properties:
        password:
          type: object
          required:
            - set
          properties:
            set:
              type: boolean
            createdAt:
              type: string
              format: date-time
            managedBy:
              type: string
              description: The organisation’s sign-in that holds it, when they have no password here
        codeApps:
          type: array
          items:
            type: object
            required:
              - id
              - type
              - removeAction
              - removable
            properties:
              id:
                type: string
              type:
                type: string
                description: otp, webauthn, webauthn-passwordless or recovery-authn-codes
              label:
                type: string
              createdAt:
                type: string
                format: date-time
              removeAction:
                type: string
                description: "The kc_action that removes it: delete_credential:<id>"
              removable:
                type: boolean
              reason:
                type: string
                description: Why it can’t be removed
        passkeys:
          type: array
          items:
            type: object
            required:
              - id
              - type
              - removeAction
              - removable
            properties:
              id:
                type: string
              type:
                type: string
                description: otp, webauthn, webauthn-passwordless or recovery-authn-codes
              label:
                type: string
              createdAt:
                type: string
                format: date-time
              removeAction:
                type: string
                description: "The kc_action that removes it: delete_credential:<id>"
              removable:
                type: boolean
              reason:
                type: string
                description: Why it can’t be removed
        recoveryCodes:
          anyOf:
            - type: object
              required:
                - id
                - type
                - removeAction
                - removable
              properties:
                id:
                  type: string
                type:
                  type: string
                  description: otp, webauthn, webauthn-passwordless or recovery-authn-codes
                label:
                  type: string
                createdAt:
                  type: string
                  format: date-time
                removeAction:
                  type: string
                  description: "The kc_action that removes it: delete_credential:<id>"
                removable:
                  type: boolean
                reason:
                  type: string
                  description: Why it can’t be removed
            - type: "null"
        twoStep:
          type: object
          required:
            - required
            - set
          properties:
            required:
              type: boolean
              description: Their role signs in with a second step
            set:
              type: boolean
              description: They have a code app or a passkey
            reason:
              type: string
        linked:
          type: array
          items:
            type: object
            required:
              - provider
              - name
            properties:
              provider:
                type: string
              name:
                type: string
              username:
                type: string
        canLink:
          type: array
          items:
            type: object
            required:
              - alias
              - name
              - action
            properties:
              alias:
                type: string
              name:
                type: string
              action:
                type: string
                description: idp_link:<alias>
        actions:
          type: array
          items:
            type: object
            required:
              - id
              - action
              - available
            properties:
              id:
                type: string
                enum:
                  - password
                  - code-app
                  - passkey
                  - recovery-codes
                  - email
              action:
                type: string
                description: The kc_action that opens Keycloak’s screen for it
              available:
                type: boolean
              reason:
                type: string
                description: Why not, and who can change it
        emails:
          type: object
          required:
            - on
            - verified
          properties:
            on:
              type: boolean
              description: This deployment emails people when their password, code app or passkeys change
            address:
              type: string
              description: Where those emails go
            verified:
              type: boolean
              description: They have confirmed that address
          description: Emails about changes to how they sign in
      description: "How they sign in. Each change is made on Keycloak’s own screen: sign in again with kc_action set to its action, and come back."
    AccountSession:
      type: object
      required:
        - id
        - startedAt
        - lastSeenAt
        - clients
      properties:
        id:
          type: string
          description: The sign-in session, as the sid claim in their tokens names it
        startedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        ipAddress:
          type: string
        clients:
          type: array
          items:
            type: string
          description: What it’s signed in to
        rememberMe:
          type: boolean
    AccountSignIn:
      type: object
      required:
        - time
        - kind
        - event
      properties:
        time:
          type: string
          format: date-time
        kind:
          type: string
          enum:
            - signed-in
            - failed
            - changed
        event:
          type: string
          description: Keycloak’s event type
        ipAddress:
          type: string
        client:
          type: string
        error:
          type: string
    NoticeSettings:
      type: object
      required:
        - person
        - language
        - timeZone
        - emailOn
        - digest
        - quietKinds
        - muted
      properties:
        person:
          type: string
        email:
          type: string
          description: Their confirmed address; absent when they have none or haven’t confirmed it
        language:
          type: string
          description: Their language, else the deployment’s first
        timeZone:
          type: string
          description: Their time zone, else the organisation’s
        emailOn:
          type: boolean
          description: An email for each thing that needs them
        digest:
          type: string
          enum:
            - off
            - daily
            - weekly
        quietHours:
          type: object
          required:
            - from
            - to
          properties:
            from:
              type: string
            to:
              type: string
          description: HH:MM in their time zone
        quietKinds:
          type: array
          items:
            type: string
          description: Kinds, as <app>:<kind>, set to Quiet
        muted:
          type: array
          items:
            type: string
          description: Apps they muted
      description: How a person wants their notices emailed
paths:
  /workspaces/{id}:
    get:
      summary: Where a floor sits (platform services only)
      description: For AUGUR's own services, signed in as themselves, which store only a floor's id. Archived teams are still found, so old records resolve. "org" in place of an id names the organisation's own floor.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: The floor's place in the tree
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - kind
                  - path
                  - org
                properties:
                  id:
                    type: string
                  kind:
                    type: string
                    enum:
                      - org
                      - personal
                      - team
                  path:
                    type: array
                    items:
                      type: string
                    description: Ids from the floor's root down to it; a personal floor is alone on its path
                  org:
                    type: string
                    description: The org's id, which every rule starts from
                  archivedAt:
                    type: string
                    format: date-time
                description: The floor's place in the tree
        "403":
          description: Not a platform service
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: No such floor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The caller's token can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /workspaces/{id}/people:
    get:
      summary: Everyone who can stand on a team (platform services only)
      description: Its members and those of the teams below it. Events asks this as each team notice is sent.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Person ids, sorted
          content:
            application/json:
              schema:
                type: object
                required:
                  - workspace
                  - people
                properties:
                  workspace:
                    type: string
                  people:
                    type: array
                    items:
                      type: string
                description: Person ids, sorted
        "403":
          description: Not a platform service
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: No such team
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The caller's token can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /people/{id}/principals:
    get:
      summary: Who a person stands for (platform services, and apps with people:read)
      description: "The principals an app matches against who may see something: person:<id>; team:<id> for each team they're on; tree:<id> for each of those teams and every team above it (shared with a team and the teams below it); and org, which everyone is in. Archived teams don't count. Apps keep each answer for 30 seconds (identityPrincipals in the service kit)."
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 100
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Their principals
          content:
            application/json:
              schema:
                type: object
                required:
                  - person
                  - principals
                properties:
                  person:
                    type: string
                  principals:
                    type: array
                    items:
                      type: string
                description: Their principals
        "400":
          description: An id longer than 100 characters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not a platform service, nor an app (or an app acting for a person) with people:read
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The caller's token or the app's grants can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /directory:
    get:
      summary: Find people and teams (platform services, and apps with people:read)
      description: "For sharing: people whose name, email or username has `q` in it, and teams whose name does, each sorted by name, first `limit` of each. With `ids` instead, the people and teams with those ids, so an app can name who it has shared with. People whose sign-in is turned off aren't listed. A signed-in person asks the same at /me/directory (1.15)."
      parameters:
        - schema:
            type: string
            maxLength: 100
          in: query
          name: q
          required: false
        - schema:
            type: string
            maxLength: 4000
          in: query
          name: ids
          required: false
          description: Comma-separated person and team ids
        - schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: People and teams
          content:
            application/json:
              schema:
                type: object
                required:
                  - people
                  - teams
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                  teams:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - within
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        within:
                          type: array
                          items:
                            type: string
                          description: Names of the teams it sits in, from the top down
                        path:
                          type: array
                          items:
                            type: string
                          description: The ids of those teams, then its own (1.9)
                description: People and teams
        "400":
          description: A query it does not know, or a value out of range
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not a platform service, nor an app (or an app acting for a person) with people:read
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The caller's token or the app's grants can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /members:
    get:
      summary: Who an audience reaches (platform services, and apps with people:read)
      description: "The ids of everyone who stands for at least one of the principals (person:, team:, tree: or org), so an app can tell an audience that something was published to it. People whose sign-in is turned off aren't listed. Since 1.9. Platform services may also name role:<realm role>, such as role:deployment-admin (1.14, ADR 0044); an app that does is refused with 403."
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 4000
          in: query
          name: principals
          required: true
          description: Comma-separated principals
      responses:
        "200":
          description: Person ids, sorted
          content:
            application/json:
              schema:
                type: object
                required:
                  - people
                properties:
                  people:
                    type: array
                    items:
                      type: string
                description: Person ids, sorted
        "400":
          description: No principals, or a query it does not know
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not a platform service, nor an app (or an app acting for a person) with people:read
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The caller's token or the app's grants can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /admin/apps/{id}/credential:
    put:
      summary: Set an app's sign-in to a given secret (the app runner only)
      description: The app runner (platform-updater) sets the sign-in of an app it installs to the secret it works out from APP_SECRETS_KEY, making the client if it's missing. Audited as app.credential-set, without the secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - secret
              properties:
                secret:
                  type: string
                  pattern: ^[0-9a-f]{64}$
              additionalProperties: false
      parameters:
        - schema:
            type: string
            pattern: ^[a-z][a-z0-9-]{1,39}$
          in: path
          name: id
          required: true
      responses:
        "200":
          description: The app's client
          content:
            application/json:
              schema:
                type: object
                required:
                  - clientId
                properties:
                  clientId:
                    type: string
                    examples:
                      - app-notes
                description: The app's client
        "400":
          description: Not an app id, one AUGUR keeps for itself, or not 64 hex characters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not the app runner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The sign-in service refused the change
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The caller's token can't be checked right now, or identity isn't connected to the sign-in service or can't reach it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    delete:
      summary: Take away an app's sign-in (the app runner only)
      description: Deletes the app's Keycloak client (app-<id>), when it removes the app from the server. One already gone changes nothing. Audited as app.credential-removed.
      parameters:
        - schema:
            type: string
            pattern: ^[a-z][a-z0-9-]{1,39}$
          in: path
          name: id
          required: true
      responses:
        "204":
          description: Gone, or never there
        "400":
          description: Not an app id, or one AUGUR keeps for itself
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not the app runner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The sign-in service refused the change
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The caller's token can't be checked right now, or identity isn't connected to the sign-in service or can't reach it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    post:
      summary: Issue an app's own sign-in, or replace its secret (deployment admins only)
      description: "Makes the app's Keycloak client (app-<id>: client credentials only, 5-minute tokens for the audience platform-services), or gives it a new secret, after which the old one stops working. The secret is in this answer only; the app's service is given it as SERVICE_CLIENT_SECRET. Audited as app.credential-issued, without the secret."
      parameters:
        - schema:
            type: string
            pattern: ^[a-z][a-z0-9-]{1,39}$
          in: path
          name: id
          required: true
      responses:
        "201":
          description: The app's client and its secret
          content:
            application/json:
              schema:
                type: object
                required:
                  - clientId
                  - secret
                properties:
                  clientId:
                    type: string
                    examples:
                      - app-library
                  secret:
                    type: string
                description: The app's client and its secret
        "400":
          description: Not an app id, or one AUGUR keeps for itself
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not a deployment admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The sign-in service refused the change
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Identity isn't connected to the sign-in service, or can't reach it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /organisation:
    get:
      summary: "The organisation's settings: name, time zone, email sender, idle-account days, logo, sign-in notice, languages, security and retention"
      description: For anyone signed in, and any service signed in as itself, so every part of AUGUR shows the same name and times (ADR 0042).
      responses:
        "200":
          description: The organisation's settings (ADR 0042)
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - timeZone
                  - sender
                  - idle
                  - notice
                  - languages
                  - defaultLanguage
                  - security
                properties:
                  name:
                    type: string
                    description: "The organisation's name: its floor's name, seeded from ORG_NAME at first start"
                  timeZone:
                    type: string
                    description: An IANA time zone, e.g. Europe/London. UTC until an admin chooses one
                  sender:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 100
                        pattern: ^[^\r\n]*$
                        description: Who email says it is from, e.g. the organisation's name
                      address:
                        type: string
                        format: email
                        maxLength: 254
                        description: The address email is sent from. Absent until an admin sets one; mail is not sent from AUGUR without it
                    additionalProperties: false
                  idle:
                    type: object
                    required:
                      - on
                      - warningDays
                      - turnOffDays
                    properties:
                      on:
                        type: boolean
                        description: Whether accounts nobody signs in to are warned and then turned off
                      warningDays:
                        type: integer
                        minimum: 7
                        maximum: 723
                        description: Days without a sign-in before the warning email
                      turnOffDays:
                        type: integer
                        minimum: 14
                        maximum: 730
                        description: "Days without a sign-in before their sign-in turns off: at least 7 after the warning"
                    additionalProperties: false
                    description: Idle accounts. 60 and 90 days, on, until an admin changes them
                  logo:
                    type: object
                    required:
                      - url
                      - sha256
                      - width
                      - height
                    properties:
                      url:
                        type: string
                        description: "Where anyone, signed in or not, fetches it: changes when the logo does"
                      sha256:
                        type: string
                      width:
                        type: integer
                      height:
                        type: integer
                    additionalProperties: false
                    description: The organisation’s logo, a PNG
                  notice:
                    type: object
                    required:
                      - on
                      - version
                    properties:
                      on:
                        type: boolean
                        description: Whether people read and accept it before they use AUGUR
                      title:
                        type: string
                        maxLength: 80
                      text:
                        type: string
                        maxLength: 5000
                        description: Plain text; a blank line between paragraphs
                      version:
                        type: integer
                        description: Goes up each time everyone is asked to accept it again
                      changedAt:
                        type: string
                        format: date-time
                      changedBy:
                        type: string
                    additionalProperties: false
                    description: The sign-in notice, shown as Keycloak’s Terms and Conditions step. Off until an admin turns it on
                  languages:
                    type: array
                    items:
                      type: string
                    description: "The languages offered at sign-in and in Account: REALM_LANGUAGES until an admin chooses"
                  defaultLanguage:
                    type: string
                    description: One of `languages`, for anyone who hasn’t chosen
                  security:
                    type: object
                    required:
                      - twoStepForAll
                      - leaverRetentionDays
                      - activityRetentionDays
                    properties:
                      twoStepForAll:
                        type: boolean
                        description: Everyone, not only the admin roles, signs in with a code app or a passkey
                      leaverRetentionDays:
                        type: integer
                        minimum: 7
                        maximum: 3650
                        description: Days a leaver’s account is kept after they leave
                      activityRetentionDays:
                        type: integer
                        minimum: 90
                        maximum: 3650
                        description: Days Activity keeps its entries
                    additionalProperties: false
                    description: Changed only by a deployment admin who just entered their password. Two steps for admins only, 90 and 365 days, until one changes them
                  updatedAt:
                    type: string
                    format: date-time
                    description: When an admin last changed them
                  updatedBy:
                    type: string
                    description: Who last changed them
                description: The organisation's settings (ADR 0042)
        "401":
          description: Not signed in, and not a service
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Services' sign-ins can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
