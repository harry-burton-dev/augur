                      $ref: "#/components/schemas/NoticeSettings"
                description: Their settings
        "400":
          description: Neither ids nor digest, or too many ids
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not the events service
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The caller's token can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /me:
