            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    delete:
      summary: Sign the caller out everywhere
      description: Every session, or every one but `keep` (the one they’re using) to sign out everywhere else.
      parameters:
        - schema:
            type: string
            minLength: 1
          in: query
