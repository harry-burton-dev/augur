  /admin/people/{id}/leave:
    post:
      summary: "Someone leaves the organisation: the leaver flow, now or after their last day"
      description: "Turns off their sign-in, signs them out everywhere (sessions and offline tokens) and records `person.left`, which followers hear as `platform.person.left` so apps hand on or archive what the person owns, to `handOverTo` when it is given. Their teams, roles and data stay as they were until the deployment's retention period ends. Closes their request to leave, if they made one. With `lastDay` (today to 90 days ahead, in the organisation's time zone) nothing happens yet: the flow is set to run once that day is over (`leaving` on the person), recorded as `person.leave-scheduled`, and can be cancelled until then. Sending it again moves the day."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handOverTo:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: "Who takes on what they own: someone whose sign-in is on"
                note:
                  type: string
                  maxLength: 500
                  description: Why, or what was agreed, for Activity
                lastDay:
                  type: string
                  format: date
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: Their last day; the flow runs once it is over
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: The person, now turned off, or with `leaving` set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          description: The person to hand over to is the leaver, is turned off, or isn’t in the directory, or the last day is in the past or too far ahead
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin, or not a deployment admin when the deployment-admin role or a deployment admin’s sign-in is touched
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: No such person
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: The caller is the leaver, or they have already left
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Activity can’t be reached, so the flow isn’t finished; identity carries it on within five minutes
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    delete:
      summary: Cancel a leaver flow set for after someone’s last day
      description: Recorded as `person.leave-cancelled`. Nothing had happened to them yet, so nothing is undone.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: The person, no longer leaving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin, or not a deployment admin when the deployment-admin role or a deployment admin’s sign-in is touched
