openapi: 3.1.0
info:
  title: Gateway
  version: 1.4.0
  description: >
    The gateway's own API, beside the services it forwards to. Reached at
    /api/gateway/v1 by a signed-in caller. Everything else under /api/<service>
    is forwarded to that service with the caller in x-user-* headers and in
    x-augur-caller, a token the gateway signs (EdDSA, one minute) for that
    service alone (its `aud` is the service's name), and without the caller's
    Authorization header. Services that check callers believe only the signed
    one. Every path but /healthz and /caller-keys needs a signed-in caller,
    however it is spelt. x-user-signed-in-at (and the token's `signedInAt`)
    carries when the caller last entered their password (the token's
    auth_time, ISO 8601), for a service that wants a fresh sign-in for
    something drastic; the shell's /auth/again?return=<path> asks for the
    password and comes back.
# Paths below are relative to the server: the major of info.version is the path prefix.
# A breaking change bumps the major and is served under /v2 beside /v1.
servers:
  - url: /v1
paths:
  /status:
    get:
      summary: Whether every part of the platform is answering (admins only)
      description: >
        The gateway checks every service's /healthz and the sign-in service's
        signing keys every 30 seconds and keeps the last answer, so this never
        waits on a slow service. A component that failed its last check, or has
        not answered for 2 minutes, is down. `backups` is present when the
        gateway is told where the backup container writes (BACKUP_DIR).
      responses:
        "200":
          description: Every component, the gateway first
          content:
            application/json:
              schema:
                type: object
                required: [components]
                properties:
                  components: { type: array, items: { $ref: "#/components/schemas/ComponentStatus" } }
                  backups: { $ref: "#/components/schemas/BackupStatus" }
                  publicAccess: { $ref: "#/components/schemas/PublicAccess" }
        "401": { description: No signed-in caller }
        "403": { description: Not an admin }
  /caller-keys:
    get:
      summary: The public key signed callers are checked with
      description: >
        A JSON Web Key Set with the gateway's Ed25519 key. No sign-in is needed.
        The key is new each time the gateway starts unless CALLER_SIGNING_KEY is
        set, so fetch it again when a token names a key id you don't have.
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, crv, x, kid, alg]
                      properties:
                        kty: { const: OKP }
                        crv: { const: Ed25519 }
                        x: { type: string }
                        kid: { type: string }
                        alg: { const: EdDSA }
                        use: { const: sig }
components:
  schemas:
    ComponentStatus:
      type: object
      required: [name, kind, state]
      properties:
        name: { type: string, description: 'The name it is reached at, e.g. "registry" or "sign-in"' }
        kind: { enum: [gateway, service, app, sign-in], description: A platform service, or an app's own service }
        state: { enum: [up, slow, down, checking], description: '"slow" answered in more than 2 seconds; "checking" has not been checked yet' }
        version: { type: string, description: The release its /healthz reports }
        api: { type: string, description: 'The API major it serves, e.g. "v1"' }
        latencyMs: { type: integer, description: How long the last answer took }
        checkedAt: { type: string, format: date-time }
        seenAt: { type: string, format: date-time, description: When it last answered }
        problem: { type: string, description: Why it is down, in words an admin can act on }
    BackupRun:
      type: object
      required: [at, ok]
      properties:
        at: { type: string, format: date-time }
        ok: { type: boolean }
        file: { type: string }
        bytes: { type: integer }
        problem: { type: string }
    PublicAccess:
      type: object
      description: Whether AUGUR is open to the internet through Tailscale Funnel (infra/deploy/public.sh). Absent when the gateway isn't told.
      required: [open]
      properties:
        open: { type: boolean }
        until: { type: string, format: date-time, description: When it closes by itself }
    BackupStatus:
      type: object
      required: [state]
      properties:
        state: { enum: [ok, attention], description: '"attention" when backups cannot be relied on right now' }
        problem: { type: string, description: Why, in words an admin can act on }
        lastBackup: { $ref: "#/components/schemas/BackupRun" }
        lastRestoreTest:
          allOf:
            - $ref: "#/components/schemas/BackupRun"
            - type: object
              properties:
                seconds: { type: integer }
                people: { type: integer, description: People in the restored sign-in realm }
                apps: { type: integer }
                auditEntries: { type: integer }
