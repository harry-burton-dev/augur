# Generated from platform/services/models: its routes' TypeBox schemas and src/contract.ts (ADR 0055).
# Change those, then run pnpm contracts. CI fails when this file is out of step.
# Paths below are relative to the server: the major of info.version is the path prefix.
# A breaking change bumps the major and is served under /v2 beside /v1.
openapi: 3.1.0
info:
  title: Models
  version: 1.2.0
  description: |-
    The model gateway: the only place AUGUR keeps a model provider's key. It speaks the OpenAI-style chat completions API to whichever provider the server is set up with (MODEL_API_URL: OpenRouter, a LiteLLM proxy, any compatible API, or the built-in stand-in model), so nothing else holds an AI key or knows the provider.
    Two kinds of caller. An app's service signs in as itself (a bearer token for its Keycloak client app-<id>, audience platform-services) and needs models:use granted by the registry on the floor named by x-workspace-id. A person reaches it through the gateway (caller in x-user-* headers) from the shell's Agents, naming the agent they are talking to: "assistant", the shell's own, or an AI app granted models:use on their floor.
    Apps' services may also turn text into vectors (/embeddings, 1.1), to match by meaning, when an embedding model is set up (MODEL_EMBEDDING_NAME; the stand-in always has one). Each request counts as one call and is recorded as model.embedded, with how many texts and never what they say.
    Every call is written to the audit log (model.called, with the model, how many messages and which tools, never what was said) before it is made; a call that can't be recorded isn't made (503). Each app (the shell's assistant counts as one) gets a number of calls a day, UTC (429 after). Models are off until an admin turns them on (403 while off).
components:
  schemas:
    Refusal:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - reason
        - error
        - message
      properties:
        type:
          type: string
          description: about:blank unless the problem names its own type
        title:
          type: string
          description: The status's own phrase
        status:
          type: integer
        detail:
          type: string
          description: Says why, and what would change it
        instance:
          type: string
        reason:
          type: string
          description: A stable code a client can switch on
          examples:
            - forbidden
        whoCanChange:
          type: string
          description: Who can fix it, in plain words, when someone can
        error:
          type: string
          description: The same as reason, for SDK 1.x clients
        message:
          type: string
          description: The same as detail, for SDK 1.x clients
    ChatRequest:
      type: object
      required:
        - messages
      properties:
        agent:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,39}$
          description: "A person's call only: assistant, or an AI app's id"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          minItems: 1
          maxItems: 100
        tools:
          type: array
          items:
            $ref: "#/components/schemas/Tool"
          maxItems: 32
      additionalProperties: false
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          enum:
            - system
            - user
            - assistant
            - tool
        content:
          type: string
          maxLength: 32000
        toolCalls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
          maxItems: 8
          description: On an assistant message
        toolCallId:
          type: string
          minLength: 1
          maxLength: 100
          description: On a tool message, the call it answers
      additionalProperties: false
    Tool:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,64}$
        description:
          type: string
          minLength: 1
          maxLength: 1024
        parameters:
          type: object
          description: A JSON schema for its arguments
      additionalProperties: false
      description: Something the model may ask to use. The caller does it, never the gateway.
    ToolCall:
      type: object
      required:
        - id
        - name
        - arguments
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          maxLength: 64
        arguments:
          type: object
      additionalProperties: false
    ChatAnswer:
      type: object
      required:
        - message
        - usage
        - model
      properties:
        message:
          type: object
          required:
            - role
            - content
          properties:
            role:
              type: string
              enum:
                - assistant
            content:
              type: string
            toolCalls:
              type: array
              items:
                $ref: "#/components/schemas/ToolCall"
        usage:
          type: object
          required:
            - inputTokens
            - outputTokens
          properties:
            inputTokens:
              type: integer
            outputTokens:
              type: integer
        model:
          type: string
          description: The model that answered, as the provider names it
    Settings:
      type: object
      required:
        - enabled
        - dailyLimit
        - ready
      properties:
        enabled:
          type: boolean
        dailyLimit:
          type: integer
          description: Calls per app per day, UTC
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        ready:
          type: boolean
          description: A model is set up on this server
        provider:
          type: string
          description: 'Where the model is: "openrouter.ai", "stand-in"'
        model:
          type: string
        embeddingModel:
          type: string
          description: The model behind /embeddings, when one is set up
    Usage:
      type: object
      required:
        - day
        - app
        - calls
        - inputTokens
        - outputTokens
      properties:
        day:
          type: string
          format: date
        app:
          type: string
        calls:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
paths:
  /status:
    get:
      summary: Whether models can be used, for anyone signed in (the shell shows Agents when enabled)
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema:
                type: object
                required:
                  - enabled
                  - ready
                properties:
                  enabled:
                    type: boolean
                    description: Turned on, with a model set up
                  ready:
                    type: boolean
                    description: A model is set up on this server
                description: The state
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /settings:
    get:
      summary: How models are used (admins)
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    put:
      summary: Turn models on or off, or set each app's calls a day (admins; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                dailyLimit:
                  type: integer
                  minimum: 0
                  maximum: 100000
              additionalProperties: false
              minProperties: 1
      responses:
        "200":
          description: The settings now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: An invalid change
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: Turning on with no model set up
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The change can't be recorded in the audit log, so it wasn't made
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /usage:
    get:
      summary: Each app's use over the last seven days, newest first (admins)
      responses:
        "200":
          description: Use by day and app
          content:
            application/json:
              schema:
                type: object
                required:
                  - dailyLimit
                  - days
                properties:
                  dailyLimit:
                    type: integer
                  days:
                    type: array
                    items:
                      $ref: "#/components/schemas/Usage"
                description: Use by day and app
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /chat:
    post:
      summary: Ask the model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: The model's answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAnswer"
        "400":
          description: An invalid request, or a person's call without an agent
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: Neither a signed-in person nor a service
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Models are off, the app isn't granted models:use there, or an app acting for a person named another agent or holds a delegation without models:use
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "429":
          description: The app has used its calls for today
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The model provider failed or refused; the message says what to check
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: No model is set up, or grants or the audit log can't be reached
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "504":
          description: The model took too long
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /embeddings:
    post:
      summary: Turn texts into vectors, to match by meaning (apps' services only, as themselves)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
              properties:
                input:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 8000
                  minItems: 1
                  maxItems: 64
              additionalProperties: false
      responses:
        "200":
          description: A vector per text, in the order given, all the same length
          content:
            application/json:
              schema:
                type: object
                required:
                  - vectors
                  - model
                  - usage
                properties:
                  vectors:
                    type: array
                    items:
                      type: array
                      items:
                        type: number
                  model:
                    type: string
                    description: The embedding model, as the provider names it; vectors from different models don't compare
                  usage:
                    type: object
                    required:
                      - inputTokens
                    properties:
                      inputTokens:
                        type: integer
                description: A vector per text, in the order given, all the same length
        "400":
          description: An invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: Neither a signed-in person nor a service
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Models are off, a person asked, or the app isn't granted models:use there
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "429":
          description: The app has used its calls for today
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The model provider failed or refused; the message says what to check
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: No model or no embedding model is set up, or grants or the audit log can't be reached
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "504":
          description: The model took too long
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
servers:
  - url: /v1
