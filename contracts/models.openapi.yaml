openapi: 3.1.0
info:
  title: Models
  version: 1.0.0
  description: >
    The model gateway: the only place AUGUR keeps a model provider's key. It
    speaks the OpenAI-style chat completions API to whichever provider the
    server is set up with (MODEL_API_URL: OpenRouter, a LiteLLM proxy, any
    compatible API, or the built-in stand-in model), so nothing else holds an
    AI key or knows the provider.

    Two kinds of caller. An app's service signs in as itself (a bearer token
    for its Keycloak client app-<id>, audience platform-services) and needs
    models:use granted by the registry on the floor named by x-workspace-id.
    A person reaches it through the gateway (caller in x-user-* headers) from
    the shell's Agents, naming the agent they are talking to: "assistant", the
    shell's own, or an AI app granted models:use on their floor.

    Every call is written to the audit log (model.called, with the model, how
    many messages and which tools, never what was said) before it is made; a
    call that can't be recorded isn't made (503). Each app (the shell's
    assistant counts as one) gets a number of calls a day, UTC (429 after).
    Models are off until an admin turns them on (403 while off).
servers:
  - url: /v1
paths:
  /chat:
    post:
      summary: Ask the model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: The model's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAnswer" }
        "400": { description: An invalid request, or a person's call without an agent }
        "401": { description: Neither a signed-in person nor a service }
        "403": { description: Models are off, or the app isn't granted models:use there }
        "429": { description: The app has used its calls for today }
        "502": { description: The model provider failed or refused; the message says what to check }
        "503": { description: No model is set up, or grants or the audit log can't be reached }
        "504": { description: The model took too long }
  /status:
    get:
      summary: Whether models can be used, for anyone signed in (the shell shows Agents when enabled)
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema:
                type: object
                required: [enabled, ready]
                properties:
                  enabled: { type: boolean, description: Turned on, with a model set up }
                  ready: { type: boolean, description: A model is set up on this server }
  /settings:
    get:
      summary: How models are used (admins)
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { description: Not an admin }
    put:
      summary: Turn models on or off, or set each app's calls a day (admins; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                enabled: { type: boolean }
                dailyLimit: { type: integer, minimum: 0, maximum: 100000 }
      responses:
        "200":
          description: The settings now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { description: Not an admin }
        "409": { description: Turning on with no model set up }
        "503": { description: The change can't be recorded in the audit log, so it wasn't made }
  /usage:
    get:
      summary: Each app's use over the last seven days, newest first (admins)
      responses:
        "200":
          description: Use by day and app
          content:
            application/json:
              schema:
                type: object
                required: [dailyLimit, days]
                properties:
                  dailyLimit: { type: integer }
                  days: { type: array, items: { $ref: "#/components/schemas/Usage" } }
        "403": { description: Not an admin }
components:
  schemas:
    ChatRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        agent: { type: string, pattern: "^[a-z][a-z0-9-]{1,39}$", description: "A person's call only: assistant, or an AI app's id" }
        messages: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/ChatMessage" } }
        tools: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/Tool" } }
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { enum: [system, user, assistant, tool] }
        content: { type: string, maxLength: 32000 }
        toolCalls: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/ToolCall" }, description: On an assistant message }
        toolCallId: { type: string, description: On a tool message, the call it answers }
    Tool:
      type: object
      additionalProperties: false
      required: [name, description]
      description: Something the model may ask to use. The caller does it, never the gateway.
      properties:
        name: { type: string, pattern: "^[a-zA-Z0-9_-]{1,64}$" }
        description: { type: string, maxLength: 1024 }
        parameters: { type: object, description: A JSON schema for its arguments }
    ToolCall:
      type: object
      additionalProperties: false
      required: [id, name, arguments]
      properties:
        id: { type: string }
        name: { type: string }
        arguments: { type: object }
    ChatAnswer:
      type: object
      required: [message, usage, model]
      properties:
        message:
          type: object
          required: [role, content]
          properties:
            role: { const: assistant }
            content: { type: string }
            toolCalls: { type: array, items: { $ref: "#/components/schemas/ToolCall" } }
        usage:
          type: object
          required: [inputTokens, outputTokens]
          properties:
            inputTokens: { type: integer }
            outputTokens: { type: integer }
        model: { type: string, description: The model that answered, as the provider names it }
    Settings:
      type: object
      required: [enabled, dailyLimit, ready]
      properties:
        enabled: { type: boolean }
        dailyLimit: { type: integer, description: Calls per app per day, UTC }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        ready: { type: boolean, description: A model is set up on this server }
        provider: { type: string, description: 'Where the model is: "openrouter.ai", "stand-in"' }
        model: { type: string }
    Usage:
      type: object
      required: [day, app, calls, inputTokens, outputTokens]
      properties:
        day: { type: string, format: date }
        app: { type: string }
        calls: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
