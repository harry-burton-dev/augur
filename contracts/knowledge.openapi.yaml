# Generated from platform/services/knowledge: its routes' TypeBox schemas and src/contract.ts (ADR 0055).
# Change those, then run pnpm contracts. CI fails when this file is out of step.
# Paths below are relative to the server: the major of info.version is the path prefix.
# A breaking change bumps the major and is served under /v2 beside /v1.
openapi: 3.1.0
info:
  title: Knowledge
  version: 1.1.0
  description: |-
    The knowledge graph of each floor (ADR 0079): the entities AUGUR knows about and what each floor believes of them, with the evidence. A floor sees itself and every floor above it; your own floor also sees the floors you are on. Nothing below or beside a floor is in its sight, and what you may know exists but cannot open comes back as an Unseen, which never carries a label.
    A person reaches it through the gateway, standing on a floor (X-Workspace-Id). Every change is an action posted to POST /actions/{action}, whose input is the one GET /actions gives, with an Idempotency-Key; reads answer as the person on the floor they name. Apps reach it through its client in a later release.
    Version 1 grows while the seam fills in: draft 4 of the spec is its target, and paths are added until it is met.
components:
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - reason
        - error
        - message
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        reason:
          type: string
          description: "A stable code to switch on: not_found, not_on_floor, not_allowed, unknown_action, idempotency_key_required, idempotency_key_reused, invalid_input, unavailable, …"
        whoCanChange:
          type: string
          description: A role or floor, never a person’s private detail.
        problems:
          type: array
          items:
            type: string
          description: Each thing wrong with the input.
        error:
          type: string
          description: The same as reason, for SDK 1.x clients.
        message:
          type: string
          description: The same as detail, for SDK 1.x clients.
      description: RFC 9457 problem details with AUGUR’s fields.
    Meta:
      type: object
      required:
        - apiMajor
        - version
        - ontology
        - speaks
      properties:
        apiMajor:
          type: number
          enum:
            - 1
        version:
          type: string
        ontology:
          type: object
          required:
            - base
            - version
          properties:
            base:
              type: string
              description: The shipped base profile.
            version:
              type: string
              description: This deployment’s ontology version.
        speaks:
          type: object
          description: Majors this service speaks, for the registry’s install check.
          additionalProperties:
            type: array
            items:
              type: integer
    Floor:
      type: object
      required:
        - id
        - kind
        - parent
        - sight
        - trust
      properties:
        id:
          type: string
        kind:
          anyOf:
            - type: string
              enum:
                - personal
            - type: string
              enum:
                - team
            - type: string
              enum:
                - org
        parent:
          anyOf:
            - type: string
            - type: "null"
        sight:
          type: array
          items:
            type: string
          description: "This floor and every floor it sees: those above it, and for your own floor, yours and theirs."
        trust:
          type: object
          required:
            - hold
          properties:
            hold:
              anyOf:
                - type: string
                  enum:
                    - memory
                - type: string
                  enum:
                    - role
                - type: string
                  enum:
                    - auto
              description: How a faithful claim becomes a belief here.
      description: "A floor you can stand on. Its name is identity’s: ask identity for it."
    ActionDecl:
      type: object
      required:
        - name
        - since
        - summary
        - input
        - who
        - scope
        - grantedToAppsByDefault
        - undoable
        - emits
      properties:
        name:
          type: string
        since:
          type: string
        summary:
          type: string
        input:
          type: object
          description: JSON Schema for the body.
        who:
          type: string
          description: Who may take it, in words.
        scope:
          anyOf:
            - type: string
              enum:
                - knowledge:act
            - type: string
              enum:
                - knowledge:extract
        role:
          type: string
          description: The floor role or standing it also needs.
        grantedToAppsByDefault:
          type: boolean
        undoable:
          type: boolean
        emits:
          type: array
          items:
            type: string
    Catalogue:
      type: object
      required:
        - apiMajor
        - version
        - actions
      properties:
        apiMajor:
          type: number
          enum:
            - 1
        version:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionDecl"
    ActionResult:
      type: object
      required:
        - action
        - actionId
        - effects
      properties:
        action:
          type: string
        actionId:
          type: string
        effects:
          type: object
          description: "What changed, by kind: sources, entities, observations, beliefs."
          additionalProperties:
            type: array
            items:
              type: string
        replayed:
          type: boolean
          description: "A repeat of an earlier request with the same key and body: this is its first answer."
        dryRun:
          type: boolean
        wouldSucceed:
          type: boolean
        why:
          type: string
          description: On a dry run that would be refused, why.
    ActionRecord:
      type: object
      required:
        - actionId
        - action
        - by
        - at
        - effects
        - undone
      properties:
        actionId:
          type: string
        action:
          type: string
        by:
          type: string
          description: "Who took it: you, since you can read only your own."
        at:
          type: string
          format: date-time
        effects:
          type: object
          description: "What changed, by kind: sources, entities, observations, beliefs."
          additionalProperties:
            type: array
            items:
              type: string
        undone:
          type: boolean
      description: The record of one action you took.
    Unseen:
      type: object
      required:
        - reason
        - floorKind
        - message
      properties:
        reason:
          anyOf:
            - type: string
              enum:
                - elsewhere
            - type: string
              enum:
                - kept
            - type: string
              enum:
                - retracted
            - type: string
              enum:
                - forgotten
        floorKind:
          anyOf:
            - type: string
              enum:
                - personal
            - type: string
              enum:
                - team
            - type: string
              enum:
                - org
        message:
          type: string
      description: Why something can’t be seen from here. Never carries its label.
    UnseenObject:
      type: object
      required:
        - kind
        - id
        - unseen
      properties:
        kind:
          anyOf:
            - type: string
              enum:
                - entity
            - type: string
              enum:
                - observation
            - type: string
              enum:
                - belief
            - type: string
              enum:
                - source
            - type: string
              enum:
                - summary
        id:
          type: string
        unseen:
          $ref: "#/components/schemas/Unseen"
    Entity:
      type: object
      required:
        - id
        - class
        - kind
        - state
        - label
        - labelFrom
        - aliases
      properties:
        id:
          type: string
          description: "`ent_` and a ULID. Made by the service, never by a model; it survives merges."
        class:
          type: string
          description: The nearest accepted class IRI.
        kind:
          anyOf:
            - type: string
              enum:
                - continuant
            - type: string
              enum:
                - occurrent
        state:
          anyOf:
            - type: string
              enum:
                - active
            - type: string
              enum:
                - retired
            - type: string
              enum:
                - merged
        mergedInto:
          type: string
        label:
          type: string
          description: "As the floors in sight know it: the nearest floor’s label."
        labelFrom:
          type: string
          description: The floor the label is from.
        aliases:
          type: array
          items:
            type: string
    EntityPage:
      type: object
      required:
        - entities
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        next:
          type: string
          description: Pass as cursor for the next page.
        limitApplied:
          type: integer
          description: The deployment’s ceiling, when it cut the page shorter than you asked.
    Value:
      type: object
      required:
        - v
      properties:
        v:
          anyOf:
            - type: number
            - type: string
            - type: boolean
        unit:
          type: string
        approx:
          type: boolean
        asked:
          type: string
      description: A typed value. A quantity keeps its unit apart from its number.
    Evidence:
      type: object
      required:
        - observations
        - sources
        - unseen
        - byFloor
      properties:
        observations:
          type: integer
          description: Every observation behind it, those you can’t see included.
        sources:
          type: integer
          description: Distinct (app, ref). Versions count once.
        unseen:
          type: integer
          description: How many of the observations are on floors you can’t see.
        byFloor:
          type: array
          items:
            type: object
            required:
              - floor
              - floorKind
              - observations
            properties:
              floor:
                type: string
              floorKind:
                anyOf:
                  - type: string
                    enum:
                      - personal
                  - type: string
                    enum:
                      - team
                  - type: string
                    enum:
                      - org
              observations:
                type: integer
          description: The ones you can see, by floor.
      description: Structure, not a score.
    Dispute:
      type: object
      required:
        - id
        - belief
        - floor
        - by
        - reason
        - at
        - state
      properties:
        id:
          type: string
        belief:
          type: string
        floor:
          type: string
        by:
          type: string
        reason:
          type: string
        at:
          type: string
          format: date-time
        state:
          anyOf:
            - type: string
              enum:
                - open
            - type: string
              enum:
                - upheld
            - type: string
              enum:
                - retracted
            - type: string
              enum:
                - withdrawn
        settledBy:
          type: string
    Belief:
      type: object
      required:
        - id
        - homeFloor
        - reach
        - subject
        - predicate
        - kind
        - modality
        - recordedAt
        - state
        - heldBy
        - evidence
      properties:
        id:
          type: string
        homeFloor:
          type: string
        reach:
          type: array
          items:
            type: string
          description: Every floor that holds it.
        subject:
          type: string
        predicate:
          type: string
        kind:
          anyOf:
            - type: string
              enum:
                - property
            - type: string
              enum:
                - link
        value:
          $ref: "#/components/schemas/Value"
        object:
          type: string
        modality:
          type: string
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: When it stopped being so.
        supersededAt:
          type: string
          format: date-time
        supersededBy:
          type: string
        state:
          anyOf:
            - type: string
              enum:
                - memory
            - type: string
              enum:
                - held
            - type: string
              enum:
                - disputed
            - type: string
              enum:
                - superseded
            - type: string
              enum:
                - ended
            - type: string
              enum:
                - fallen
          description: "fallen: every observation behind it was retracted or forgotten."
        heldBy:
          type: string
          description: Who held it, or memory.
        disputes:
          type: array
          items:
            $ref: "#/components/schemas/Dispute"
        evidence:
          $ref: "#/components/schemas/Evidence"
    BeliefList:
      type: object
      required:
        - floor
        - seeing
        - beliefs
      properties:
        floor:
          type: string
        seeing:
          type: array
          items:
            type: string
        beliefs:
          type: array
          items:
            $ref: "#/components/schemas/Belief"
    SourceRef:
      type: object
      required:
        - id
        - app
        - ref
        - version
        - title
        - floor
        - author
      properties:
        id:
          type: string
        app:
          type: string
          description: The app that holds the source. Its text stays there.
        ref:
          type: string
        version:
          type: string
          description: Versions of one (app, ref) are one source and count once.
        title:
          type: string
        floor:
          type: string
        author:
          type: string
        writtenAt:
          type: string
          format: date-time
        publishedFrom:
          type: string
          description: The source on a personal floor this one was published from.
        extraction:
          type: object
          required:
            - observations
            - flagged
          properties:
            observations:
              type: integer
              description: Observations read from it, on this floor.
            flagged:
              type: integer
              description: Of those, text that addressed the system.
      description: "A reference to a source: the app, its ref and version. The text stays in the app that holds it."
    Observation:
      type: object
      required:
        - id
        - floor
        - source
        - subject
        - predicate
        - kind
        - quote
        - modality
        - validPrecision
        - state
        - extractor
        - ontologyVersion
        - recordedAt
      properties:
        id:
          type: string
        floor:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        subject:
          type: string
        predicate:
          type: string
          description: A declared relation or property IRI.
        kind:
          anyOf:
            - type: string
              enum:
                - property
            - type: string
              enum:
                - link
        value:
          $ref: "#/components/schemas/Value"
        object:
          type: string
        quote:
          type: string
        anchor:
          type: object
          required:
            - start
            - end
          properties:
            start:
              type: integer
            end:
              type: integer
        modality:
          anyOf:
            - type: string
              enum:
                - reported
            - type: string
              enum:
                - expected
            - type: string
              enum:
                - planned
            - type: string
              enum:
                - possible
            - type: string
              enum:
                - denied
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        validPrecision:
          anyOf:
            - type: string
              enum:
                - minute
            - type: string
              enum:
                - day
            - type: string
              enum:
                - month
            - type: string
              enum:
                - year
            - type: string
              enum:
                - unknown
        attributedTo:
          type: string
          description: The original speaker, when the source relays someone.
        flagged:
          type: boolean
          description: Text that addressed the system. Never held on a shared floor; waits for the owner on a personal one.
        flagReason:
          type: string
        state:
          anyOf:
            - type: string
              enum:
                - memory
            - type: string
              enum:
                - proposed
            - type: string
              enum:
                - faithful
            - type: string
              enum:
                - held
            - type: string
              enum:
                - disputed
            - type: string
              enum:
                - retracted
            - type: string
              enum:
                - flagged
        faithfulBy:
          type: array
          items:
            type: string
        derivedFrom:
          type: string
        extractor:
          type: string
        promptVersion:
          type: string
        ontologyVersion:
          type: string
        recordedAt:
          type: string
          format: date-time
      description: "One claim read in one source. Immutable: a wrong one is retracted, a private one forgotten."
    Class:
      type: object
      required:
        - iri
        - label
        - kind
        - status
      properties:
        iri:
          type: string
        label:
          type: string
        parent:
          type: string
        kind:
          anyOf:
            - type: string
              enum:
                - continuant
            - type: string
              enum:
                - occurrent
        status:
          anyOf:
            - type: string
              enum:
                - base
            - type: string
              enum:
                - accepted
            - type: string
              enum:
                - proposed
            - type: string
              enum:
                - dismissed
        packTerm:
          type: string
          description: skos:exactMatch to the pack (Common Core Ontologies) term.
        sinceVersion:
          type: string
    Predicate:
      type: object
      required:
        - iri
        - label
        - kind
        - singleValued
        - status
      properties:
        iri:
          type: string
        label:
          type: string
        kind:
          anyOf:
            - type: string
              enum:
                - property
            - type: string
              enum:
                - link
        domain:
          type: string
        range:
          type: string
        datatype:
          type: string
          description: quantity, date, text or boolean.
        unit:
          type: string
        singleValued:
          type: boolean
        status:
          anyOf:
            - type: string
              enum:
                - base
            - type: string
              enum:
                - accepted
            - type: string
              enum:
                - proposed
            - type: string
              enum:
                - dismissed
    Ontology:
      type: object
      required:
        - base
        - version
        - classes
        - predicates
      properties:
        base:
          type: string
        version:
          type: string
        classes:
          type: array
          items:
            $ref: "#/components/schemas/Class"
        predicates:
          type: array
          items:
            $ref: "#/components/schemas/Predicate"
      description: "The deployment’s ontology now: the base profile and the terms adopted since."
    Candidate:
      type: object
      required:
        - term
        - kind
        - askedBy
        - status
      properties:
        term:
          type: string
        kind:
          anyOf:
            - type: string
              enum:
                - class
            - type: string
              enum:
                - predicate
        suggestedParent:
          type: string
        why:
          type: string
        askedBy:
          type: integer
          description: How many sources asked for it.
        status:
          anyOf:
            - type: string
              enum:
                - proposed
            - type: string
              enum:
                - adopted
            - type: string
              enum:
                - dismissed
      description: A term extraction asked for that the ontology lacks.
paths:
  /meta:
    get:
      summary: The majors this service speaks, its version and the ontology version
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /floors:
    get:
      summary: The floors you can stand on, what each sees, and how it holds
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - floors
                properties:
                  floors:
                    type: array
                    items:
                      $ref: "#/components/schemas/Floor"
        "401":
          description: No signed-in caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Identity can’t be asked where you stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /actions:
    get:
      summary: The action catalogue, read at run time
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalogue"
  /actions/{action}:
    post:
      summary: "Take an action: the only way anything changes"
      description: "The body is the input `GET /actions` gives for the action. A repeat with the same Idempotency-Key and body answers what the first did; the same key with another body is refused. With dryRun=true the action is taken and then undone: the answer says whether it would succeed and why not."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The input schema of the action in GET /actions.
        description: The input schema of the action in GET /actions.
      parameters:
        - schema:
            type: boolean
            default: false
          in: query
          name: dryRun
          required: false
        - schema:
            type: string
            pattern: ^[a-z][a-z0-9-]{1,60}$
          in: path
          name: action
          required: true
        - schema:
            type: string
          in: header
          name: idempotency-key
          required: false
          description: 8 to 200 characters, unique per intended change.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          description: The Idempotency-Key header is missing or malformed, or no floor is named
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No signed-in caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "Not on that floor, or not allowed: says why and who can change it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such action; problems lists the ones there are
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: That key was used for another request, or what it adds is already there
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The input doesn’t fit the action’s schema, or names things the graph doesn’t have
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Identity can’t be asked where you stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      summary: One action’s declaration
      parameters:
        - schema:
            type: string
            pattern: ^[a-z][a-z0-9-]{1,60}$
          in: path
          name: action
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionDecl"
        "404":
          description: No such action; problems lists the ones there are
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /actions/runs/{actionId}:
    get:
      summary: The record of one action you took
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 80
          in: path
          name: actionId
          required: true
      responses:
        "200":
          description: The record of one action you took.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRecord"
        "401":
          description: No signed-in caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not on that floor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: You took no action with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Identity can’t be asked where you stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /floors/{floor}/entities:
    get:
      summary: Entities in sight from a floor
      parameters:
        - schema:
            type: string
            maxLength: 200
          in: query
          name: class
          required: false
          description: A class IRI or label; subclasses come too.
        - schema:
            type: string
            maxLength: 200
          in: query
          name: text
          required: false
          description: Matches labels and aliases on the floors in sight.
        - schema:
            anyOf:
              - type: string
                enum:
                  - continuant
              - type: string
                enum:
                  - occurrent
          in: query
          name: kind
          required: false
        - schema:
            type: string
            maxLength: 80
          in: query
          name: cursor
          required: false
        - schema:
            type: integer
            minimum: 1
          in: query
          name: limit
          required: false
          description: The deployment sets the ceiling; the answer says when it applied.
        - schema:
            type: string
            minLength: 1
            maxLength: 120
          in: path
          name: floor
          required: true
