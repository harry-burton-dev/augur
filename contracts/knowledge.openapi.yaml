  /floors/{floor}/export:
    get:
      summary: The beliefs held in sight from this floor as RDF with PROV-O provenance, for a reasoner or triple store beside the service
      description: Turtle gives one graph. TriG puts the beliefs in a named graph for the floor, and the entities, observations and sources they rest on in the default graph. Evidence on floors out of sight is a count, never a node. Ask with format, or with Accept.
      parameters:
        - schema:
            anyOf:
              - type: string
                enum:
                  - turtle
              - type: string
                enum:
                  - trig
          in: query
          name: format
          required: false
          description: Wins over Accept. Turtle when neither says.
        - schema:
            type: string
            minLength: 1
            maxLength: 120
          in: path
          name: floor
          required: true
          description: A floor id as identity gives it.
      responses:
        "200":
          description: Turtle or TriG.
          content:
            text/turtle:
              schema:
                type: string
                description: Turtle or TriG.
            application/trig:
              schema:
                type: string
                description: Turtle or TriG.
