  /actions/{action}:
    post:
      summary: "Take an action: the only way anything changes"
      description: "The body is the input `GET /actions` gives for the action. A repeat with the same Idempotency-Key and body answers what the first did; the same key with another body is refused. With dryRun=true the action is taken and then undone: the answer says whether it would succeed and why not."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The input schema of the action in GET /actions.
        description: The input schema of the action in GET /actions.
      parameters:
        - schema:
            type: boolean
            default: false
          in: query
          name: dryRun
          required: false
        - schema:
            type: string
            pattern: ^[a-z][a-z0-9-]{1,60}$
          in: path
          name: action
          required: true
        - schema:
            type: string
          in: header
          name: idempotency-key
          required: false
          description: 8 to 200 characters, unique per intended change.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          description: The Idempotency-Key header is missing or malformed, or no floor is named
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "Not on that floor, or not allowed: says why and who can change it"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such action; problems lists the ones there are
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: That key was used for another request, or what it adds is already there
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The input doesn’t fit the action’s schema, or names things the graph doesn’t have
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Identity can’t be asked where you stand
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
