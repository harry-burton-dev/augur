openapi: 3.1.0
info:
  title: Registry
  version: 1.7.0
  description: Catalogue of apps and micro frontends; serves the shell manifest.
# Paths below are relative to the server: the major of info.version is the path prefix.
# A breaking change bumps the major and is served under /v2 beside /v1.
servers:
  - url: /v1
paths:
  /manifest:
    get:
      summary: Apps the caller may open
      description: >
        With `workspace`, the apps on for that floor: the caller must be on it,
        so the request also carries it as X-Workspace-Id, which the gateway
        checks. An app is on a floor when it is turned on, works on that kind
        of floor (its manifest's `floors`), isn't blocked on the floor or any
        floor above, and the nearest install from the floor upwards says on (or
        there is none). A personal floor follows the org.
      parameters:
        - { name: workspace, in: query, required: false, schema: { type: string }, description: The floor to list apps for }
      responses:
        "403": { description: The workspace isn't the floor the gateway checked }
        "404": { description: No such floor }
        "503": { description: Floors can't be looked up right now }
        "200":
          description: Manifest entries filtered by the caller's roles, leaving out apps an admin has turned off, and with a workspace those off there
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppManifestEntry" }
  /apps:
    get:
      summary: The whole catalogue, for admins
      description: Every app, the platform's own first, whether or not it is turned on.
      responses:
        "200":
          description: Catalogue entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogueEntry" }
        "403": { description: Not an admin }
  /apps/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Register an app, or update it
      description: >
        Called by an app's own service on the internal network, signed in as
        itself (a bearer token for its Keycloak client app-<id>, audience
        platform-services), which may register only its own id; by a platform
        service signed in as its own client (platform-<name>); or by an admin
        through the gateway.
        Unknown fields are refused. The platform's own apps (home, admin) and
        routes another app already has cannot be taken. Every version is kept
        (the last 5, plus a pinned one); an app an admin has pinned keeps
        serving its pinned version. An entry that is a full address must be on
        an origin an admin has allowed (see /origins); a path is served by the
        platform itself and always may.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppManifestEntry" }
      responses:
        "201": { description: Registered }
        "200": { description: Updated }
        "400": { description: "The manifest is invalid, its id does not match the path, or its entry loads from an origin that isn't allowed" }
        "403": { description: "Neither the app itself, a platform service nor an admin" }
        "409": { description: The id belongs to a platform app, or the route is taken }
        "503": { description: The sign-in service can't be reached to check the app's token }
    patch:
      summary: Turn an app on or off (admins only)
      description: >
        An app that is off stays registered, keeps its id and route, and stays off
        when its service registers it again; nobody is offered it in the manifest.
        Audited as app.enabled or app.disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The app as it now is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "403": { description: Not an admin }
        "404": { description: No such app }
        "409": { description: A platform app, which is always on }
    delete:
      summary: Remove an app (admins only)
      responses:
        "204": { description: Removed }
        "403": { description: Not an admin }
        "404": { description: No such app }
  /apps/{id}/grants:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: What an app may do on a floor (platform services only)
      description: >
        The platform's services check an app's calls against this, and keep
        each answer for up to 30 seconds. An app is granted the scopes it asks
        for that an admin has granted, on floors where it is on (see
        /manifest); nothing where it is off, on a floor that doesn't exist, or
        anywhere while it is turned off. Without a workspace, what it is
        granted while turned on.
      parameters:
        - { name: workspace, in: query, required: false, schema: { type: string }, description: The floor the call is for }
      responses:
        "200":
          description: The app's grants
          content:
            application/json:
              schema:
                type: object
                required: [app, scopes]
                properties:
                  app: { type: string }
                  workspace: { type: string }
                  scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        "403": { description: Not a platform service }
        "404": { description: No such app is registered }
        "503": { description: Floors can't be looked up right now }
  /apps/{id}/scopes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Let an app use these scopes (admins)
      description: >
        An app's first registration is granted what it asks for. A later
        version that asks for more is served, but gets the extra only once an
        admin grants it here. Audited as app.scopes-granted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scopes]
              properties:
                scopes: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/Scope" } }
      responses:
        "200":
          description: The app as the catalogue now has it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "403": { description: Not an admin }
        "404": { description: No such app is registered }
  /apps/{id}/floors:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: What each floor says about an app (admins)
      responses:
        "200":
          description: The app's floor rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FloorRule" }
        "403": { description: Not an admin }
        "404": { description: No such app is registered }
  /apps/{id}/floors/{workspace}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: workspace, in: path, required: true, schema: { type: string }, description: The org or a team }
    put:
      summary: Set what one floor says about an app (admins)
      description: >
        on or off installs the app there or takes it away, carrying on to the
        teams below unless carriesOn is false or one of them says otherwise.
        blocked is a guardrail: off there and on every floor below, whatever
        they say. inherit takes the floor's rule away. Someone's own floor
        can't be set; it follows the org. Audited as app.enabled, app.disabled,
        app.blocked or app.inherited, with the floor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { type: string, enum: [on, off, blocked, inherit] }
                carriesOn: { type: boolean, default: true }
      responses:
        "200":
          description: The app's rules now, and whether it is on for this floor
          content:
            application/json:
              schema:
                type: object
                required: [rules, state]
                properties:
                  rules: { type: array, items: { $ref: "#/components/schemas/FloorRule" } }
                  state:
                    type: object
                    required: [on, why]
                    properties:
                      on: { type: boolean }
                      why: { type: string, enum: [turned-off, not-for-this-kind, blocked, set-here, set-above, approved] }
                      by: { type: string, description: The floor whose rule decided it }
        "400": { description: Someone's own floor }
        "403": { description: Not an admin }
        "404": { description: No such app or floor }
        "409": { description: A platform app, which is on everywhere }
        "503": { description: Floors can't be looked up right now }
  /apps/{id}/versions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: An app's kept versions, newest first (admins only)
      responses:
        "200":
          description: Kept versions; `serving` marks the one the shell is given
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [version, entry, registeredBy, registeredAt, serving]
                  properties:
                    version: { type: string }
                    entry: { $ref: "#/components/schemas/AppManifestEntry" }
                    registeredBy: { type: string }
                    registeredAt: { type: string, format: date-time }
                    serving: { type: boolean }
        "403": { description: Not an admin }
        "404": { description: No such app }
  /apps/{id}/pin:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Serve one kept version and hold the app there (admins only)
      description: >
        Rolls an app back, or holds it at its current version. Registrations
        after this are kept in its history but not served until it is
        unpinned. Changes the manifest the shell is given, not the code an
        app's service serves at its entry URL. Audited as app.pinned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [version], properties: { version: { type: string } } }
      responses:
        "200":
          description: The app as it now is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "403": { description: Not an admin }
        "404": { description: No such app, or no such version kept }
        "409": { description: A platform app, or another app now has that version's route }
    delete:
      summary: Let go of a pin and serve the newest version (admins only)
      description: Audited as app.unpinned.
      responses:
        "200":
          description: The app as it now is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "403": { description: Not an admin }
        "404": { description: No such app }
        "409": { description: A platform app }
  /origins:
    get:
      summary: Where apps may load from besides the platform itself (admins only)
      responses:
        "200":
          description: Allowed origins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AllowedOrigin" }
        "403": { description: Not an admin }
    post:
      summary: Allow apps to load from an origin (admins only)
      description: HTTPS only, except http://localhost for development. Audited as origin.allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [origin], properties: { origin: { type: string, example: "https://apps.example.org" } } }
      responses:
        "201":
          description: Allowed (also when it already was)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedOrigin" }
        "400": { description: Not an HTTPS origin, or has a path }
        "403": { description: Not an admin }
  /origins/{origin}:
    parameters:
      - { name: origin, in: path, required: true, schema: { type: string }, description: The origin, URL-encoded }
    delete:
      summary: Stop allowing an origin (admins only)
      description: >
        Apps already registered from it stay in the catalogue, marked blocked,
        and are left out of the manifest until it is allowed again. Audited as origin.removed.
      responses:
        "204": { description: Removed }
        "403": { description: Not an admin }
        "404": { description: Not an allowed origin }
components:
  schemas:
    CatalogueEntry:
      allOf:
        - $ref: "#/components/schemas/AppManifestEntry"
        - type: object
          required: [platform, enabled]
          properties:
            platform: { type: boolean, description: Ships with the platform and is always on }
            enabled: { type: boolean }
            registeredBy: { type: string, description: The service or admin that last registered it }
            registeredAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            pinnedVersion: { type: string, description: Set when an admin holds the app at this version }
            blocked: { type: string, description: "Set when the app's entry is on an origin no longer allowed: why it isn't offered" }
            grantedScopes: { type: array, items: { $ref: "#/components/schemas/Scope" }, description: What it asks for that an admin has granted }
            awaitingScopes: { type: array, items: { $ref: "#/components/schemas/Scope" }, description: What it asks for that no admin has granted yet }
    FloorRule:
      type: object
      required: [app, workspace, state, carriesOn, setBy, setAt]
      properties:
        app: { type: string }
        workspace: { type: string }
        state: { type: string, enum: [on, off, blocked] }
        carriesOn: { type: boolean, description: Whether it applies to the teams below too; always true for blocked }
        setBy: { type: string }
        setAt: { type: string, format: date-time }
    AllowedOrigin:
      type: object
      required: [origin, addedBy, addedAt]
      properties:
        origin: { type: string }
        addedBy: { type: string }
        addedAt: { type: string, format: date-time }
    AppManifestEntry:
      type: object
      required: [id, name, route, entry, version, sdk]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{1,39}$" }
        name: { type: string }
        route: { type: string, pattern: "^/[a-z0-9][a-z0-9/-]*$", description: Route prefix the shell maps to this app }
        entry: { type: string, description: URL of the app's ES module entry }
        version: { type: string, description: "The app's release, semver" }
        sdk: { type: string, description: "The @platform/mfe-sdk releases the app works with, a semver range such as ^1.0.0. The shell will not open an app whose range its SDK does not satisfy." }
        description: { type: string, description: One line shown under the app name in the Shell }
        icon: { type: string, description: A UI kit icon name }
        requiredRole: { type: string }
        handles:
          type: array
          items: { type: string }
          description: Intent types this app handles, e.g. document.open
        ai: { type: boolean, description: The app is an AI; the menus draw it as a bubble }
        search: { type: boolean, description: "The app's service answers GET /v1/search?q= with { results: [{ id, title, detail?, path?, workspace? }] }, and the shell's Find asks it" }
        scopes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Scope" }
          description: What the app's service asks to do on the platform. An app may always register itself.
        floors:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/FloorKind" }
          description: The kinds of floor the app works on; every kind when absent
        surfaces:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/Surface" }
          description: >
            What the app shows on each kind of floor, for the shell to place.
            When several match, the most specific floor wins, then a role
            condition, then manifest order. Each surface's floor must be in floors.
        menu:
          type: array
          maxItems: 8
          description: The app's menu, shown by the shell as Orbit at the app's root and as its chapter in Title
          items: { $ref: "#/components/schemas/AppMenuCategory" }
    FloorKind:
      type: string
      enum: [personal, team, org]
      description: team means any team, at any depth
    Surface:
      type: object
      required: [floor, slot, module]
      additionalProperties: false
      properties:
        floor: { $ref: "#/components/schemas/FloorKind" }
        slot: { type: string, enum: [page, card, panel, settings, admin] }
        module: { type: string, pattern: "^[A-Za-z0-9_./-]+$", description: The module the app's entry exposes for it }
        role: { type: string, enum: [member, lead], description: Only for people with this role on the floor }
        rollup: { type: boolean, description: Shows the floor and the teams below it the person is on (identity's roll-up) }
    Scope:
      type: string
      enum: [notifications:send, audit:write]
      description: "notifications:send: notify people (for itself only). audit:write: add entries for itself to the audit log."
    AppMenuCategory:
      type: object
      required: [label, items]
      additionalProperties: false
      properties:
        id: { type: string }
        label: { type: string }
        icon: { type: string, description: A UI kit icon name }
        ai: { type: boolean }
        items:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: "#/components/schemas/AppMenuItem" }
    AppMenuItem:
      type: object
      required: [label, path]
      additionalProperties: false
      properties:
        id: { type: string }
        label: { type: string }
        icon: { type: string }
        detail: { type: string, description: One short fact, never a sentence }
        keywords: { type: string, description: Extra words search finds it by }
        ai: { type: boolean }
        path: { type: string, pattern: "^/.+", description: Where in the app it opens, below the app's route }
