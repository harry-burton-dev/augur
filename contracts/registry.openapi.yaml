openapi: 3.1.0
info:
  title: Registry
  version: 1.31.0
  description: Catalogue of apps and micro frontends; serves the shell manifest.
# Paths below are relative to the server: the major of info.version is the path prefix.
# A breaking change bumps the major and is served under /v2 beside /v1.
servers:
  - url: /v1
paths:
  /me/apps:
    get:
      summary: Every app, and whether the caller can use it on their floor, and why
      description: >
        For Auspex, which never hides an app for being out of reach. Each app
        says whether it's on for the floor the caller is on and why (platform,
        approved, set-here, set-above, blocked, not-for-this-kind,
        turned-off), the floor whose rule decides it (`by`) and who set that
        rule and when. An app a role keeps from the caller is listed with
        `requiredRole` and `hasRole: false`. Only the floor the gateway
        checked can be asked about.
      parameters:
        - { name: workspace, in: query, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: The caller's apps on that floor
          content:
            application/json:
              schema:
                type: object
                required: [workspace, apps]
                properties:
                  workspace: { type: string }
                  apps:
                    type: array
                    items:
                      type: object
                      required: [id, name, state]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        icon: { type: string }
                        description: { type: string }
                        floors: { type: array, items: { type: string, enum: [personal, team, org] } }
                        pillar: { type: boolean }
                        requiredRole: { type: string }
                        hasRole: { type: boolean }
                        state:
                          type: object
                          required: [on, why]
                          properties:
                            on: { type: boolean }
                            why: { type: string, enum: [platform, approved, set-here, set-above, blocked, not-for-this-kind, turned-off] }
                            by: { type: string, description: The floor whose rule decides it }
                            setBy: { type: string, description: Who set that rule }
                            setAt: { type: string, format: date-time }
        "401": { description: No signed-in caller }
        "403": { description: Not the floor the gateway checked }
        "404": { description: No such floor }
        "503": { description: Floors can't be looked up right now }
  /manifest:
    get:
      summary: Apps the caller may open
      description: >
        With `workspace`, the apps on for that floor: the caller must be on it,
        so the request also carries it as X-Workspace-Id, which the gateway
        checks. An app is on a floor when it is turned on, works on that kind
        of floor (its manifest's `floors`), isn't blocked on the floor or any
        floor above, and the nearest install from the floor upwards says on (or
        there is none). A personal floor follows the org.
      parameters:
        - { name: workspace, in: query, required: false, schema: { type: string }, description: The floor to list apps for }
      responses:
        "403": { description: The workspace isn't the floor the gateway checked }
        "404": { description: No such floor }
        "503": { description: Floors can't be looked up right now }
        "200":
          description: Manifest entries filtered by the caller's roles, leaving out apps an admin has turned off, and with a workspace those off there
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppManifestEntry" }
  /apps:
    get:
      summary: The whole catalogue, for admins
      description: Every app, the platform's own first, whether or not it is turned on.
      responses:
        "200":
          description: Catalogue entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogueEntry" }
        "403": { description: Not an admin }
  /apps/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Register an app, or update it
      description: >
        Called by an app's own service on the internal network, signed in as
        itself (a bearer token for its Keycloak client app-<id>, audience
        platform-services), which may register only its own id; by a platform
        service signed in as its own client (platform-<name>); or by an admin
        through the gateway.
        Unknown fields are refused. The platform's own apps (home, admin) and
        routes another app already has cannot be taken. Every version is kept
        (the last 5, plus a pinned one); an app an admin has pinned keeps
        serving its pinned version. An entry that is a full address must be on
        an origin an admin has allowed (see /origins); a path is served by the
        platform itself and always may.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppManifestEntry" }
      responses:
        "201": { description: Registered }
        "200": { description: Updated }
        "400": { description: "The manifest is invalid, its id does not match the path, or its entry loads from an origin that isn't allowed" }
        "403": { description: "Neither the app itself, a platform service nor an admin" }
        "409": { description: The id belongs to a platform app, or the route is taken }
        "503": { description: The sign-in service can't be reached to check the app's token }
    patch:
      summary: Turn an app on or off (admins only)
      description: >
        An app that is off stays registered, keeps its id and route, and stays off
        when its service registers it again; nobody is offered it in the manifest.
        Audited as app.enabled or app.disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The app as it now is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "403": { description: Not an admin }
        "404": { description: No such app }
        "409": { description: A platform app, which is always on }
    delete:
      summary: Remove an app (admins only)
      responses:
        "204": { description: Removed }
        "403": { description: Not an admin }
        "404": { description: No such app }
        "409": { description: An app that ships with AUGUR (pillar), which is turned off instead }
  /apps/{id}/grants:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: What an app may do on a floor (platform services only)
      description: >
        The platform's services check an app's calls against this, and keep
        each answer for up to 30 seconds. An app is granted the scopes it asks
        for that an admin has granted, on floors where it is on (see
        /manifest); nothing where it is off, on a floor that doesn't exist, or
        anywhere while it is turned off. Without a workspace, what it is
        granted while turned on.
      parameters:
        - { name: workspace, in: query, required: false, schema: { type: string }, description: The floor the call is for }
      responses:
        "200":
          description: The app's grants
          content:
            application/json:
              schema:
                type: object
                required: [app, scopes]
                properties:
                  app: { type: string }
                  workspace: { type: string }
                  scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        "403": { description: Not a platform service }
        "404": { description: No such app is registered }
        "503": { description: Floors can't be looked up right now }
  /apps/{id}/scopes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Let an app use these scopes (admins)
      description: >
        An app's first registration is granted what it asks for. A later
        version that asks for more is served, but gets the extra only once an
        admin grants it here. Audited as app.scopes-granted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scopes]
              properties:
                scopes: { type: array, uniqueItems: true, items: { $ref: "#/components/schemas/Scope" } }
      responses:
        "200":
          description: The app as the catalogue now has it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "403": { description: Not an admin }
        "404": { description: No such app is registered }
  /apps/{id}/upload-limit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Lower how much an app may be sent in one request (admins)
      description: >
        The gateway holds every request to the app's service to its limit:
        its manifest's maxUpload (10 MB without one), or the lower number an
        admin sets here. `null` goes back to what the manifest asks. An admin
        can only lower it. Kept when the app registers new versions. Audited
        as app.upload-limit-set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mb]
              properties:
                mb: { oneOf: [{ type: integer, minimum: 1, maximum: 2048 }, { type: "null" }] }
      responses:
        "200":
          description: The app as the catalogue now has it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "400": { description: More than the app's manifest asks for }
        "403": { description: Not an admin }
        "404": { description: No such app is registered }
  /apps/{id}/settings:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: The app's own settings and the value of each (admins, and the app's own service)
      description: >
        Each setting the app's manifest offers, with the value in force: an
        admin's, or the setting's default. A value set before the app narrowed
        a setting's range is used only while it still fits.
      responses:
        "200":
          description: Its settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
        "403": { description: Neither an admin nor the app's own service }
        "404": { description: No such app is registered }
  /apps/{id}/settings/{setting}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: setting, in: path, required: true, schema: { type: string } }
    put:
      summary: Set one of an app's settings (admins)
      description: >
        `null` puts it back to its default. Kept when the app registers new
        versions. Audited as app.setting-changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { type: [integer, "null"] }
      responses:
        "200":
          description: Its settings as they now are
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
        "400": { description: Outside the setting's min and max }
        "403": { description: Not an admin }
        "404": { description: No such app, or it offers no such setting }
  /feature-previews:
    get:
      summary: Apps' feature previews, and whether each is on for the caller (SDK 1.7)
      description: >
        Every app the caller can open that lists `previews` in its manifest. A preview is on for
        everyone, for those who turned it on (opt-in), or off; one past its `until` day is ended
        and off. On a preview server one nobody chose for is opt-in, on a production server off.
      responses:
        "200":
          description: The apps with feature previews
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps:
                    type: array
                    items:
                      type: object
                      required: [app, name, previews]
                      properties:
                        app: { type: string }
                        name: { type: string }
                        previews:
                          type: array
                          items:
                            allOf:
                              - { $ref: "#/components/schemas/FeaturePreview" }
                              - type: object
                                required: [mode, on]
                                properties:
                                  mode: { $ref: "#/components/schemas/FeaturePreviewMode" }
                                  ended: { type: boolean }
                                  on: { type: boolean }
        "401": { description: Not signed in }
  /feature-previews/{app}/{preview}:
    parameters:
      - { name: app, in: path, required: true, schema: { type: string } }
      - { name: preview, in: path, required: true, schema: { type: string } }
    put:
      summary: Turn one of an app's opt-in feature previews on or off for the caller alone
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [on], properties: { on: { type: boolean } } }
      responses:
        "204": { description: Chosen }
        "404": { description: No such app or preview, or the caller can't open the app }
        "409": { description: "It isn't opt-in (error not_opt_in), or it has ended (ended)" }
  /apps/{id}/feature-previews:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Who gets each of an app's feature previews (admins)
      responses:
        "200":
          description: Its feature previews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeaturePreviewsAdmin" }
        "403": { description: Not an admin }
        "404": { description: No such app is registered }
  /apps/{id}/feature-previews/{preview}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: preview, in: path, required: true, schema: { type: string } }
    put:
      summary: Set who gets one of an app's feature previews (admins)
      description: "`null` goes back to the server's default. Kept when the app registers new versions. Audited as app.preview-set."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { oneOf: [{ $ref: "#/components/schemas/FeaturePreviewMode" }, { type: "null" }] }
      responses:
        "200":
          description: Its feature previews as they now are
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeaturePreviewsAdmin" }
        "403": { description: Not an admin }
        "404": { description: No such app, or it offers no such preview }
  /apps/{id}/feature-previews/people/{person}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: person, in: path, required: true, schema: { type: string } }
    get:
      summary: Which of an app's feature previews are on for one person (the app's own service, or admins)
      responses:
        "200":
          description: The ids on for them
          content:
            application/json:
              schema: { type: object, required: [on], properties: { on: { type: array, items: { type: string } } } }
        "403": { description: Neither the app's own service nor an admin }
        "404": { description: No such app is registered }
  /apps/{id}/floors:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: What each floor says about an app (admins)
      responses:
        "200":
          description: The app's floor rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FloorRule" }
        "403": { description: Not an admin }
        "404": { description: No such app is registered }
  /apps/{id}/floors/{workspace}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: workspace, in: path, required: true, schema: { type: string }, description: The org or a team }
    put:
      summary: Set what one floor says about an app (admins)
      description: >
        on or off installs the app there or takes it away, carrying on to the
        teams below unless carriesOn is false or one of them says otherwise.
        blocked is a guardrail: off there and on every floor below, whatever
        they say. inherit takes the floor's rule away. Someone's own floor
        can't be set; it follows the org. Audited as app.enabled, app.disabled,
        app.blocked or app.inherited, with the floor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { type: string, enum: [on, off, blocked, inherit] }
                carriesOn: { type: boolean, default: true }
      responses:
        "200":
          description: The app's rules now, and whether it is on for this floor
          content:
            application/json:
              schema:
                type: object
                required: [rules, state]
                properties:
                  rules: { type: array, items: { $ref: "#/components/schemas/FloorRule" } }
                  state:
                    type: object
                    required: [on, why]
                    properties:
                      on: { type: boolean }
                      why: { type: string, enum: [turned-off, not-for-this-kind, blocked, set-here, set-above, approved] }
                      by: { type: string, description: The floor whose rule decided it }
        "400": { description: Someone's own floor }
        "403": { description: Not an admin }
        "404": { description: No such app or floor }
        "409": { description: A platform app, which is on everywhere }
        "503": { description: Floors can't be looked up right now }
  /apps/{id}/versions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: An app's kept versions, newest first (admins only)
      responses:
        "200":
          description: Kept versions; `serving` marks the one the shell is given
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [version, entry, registeredBy, registeredAt, serving]
                  properties:
                    version: { type: string }
                    entry: { $ref: "#/components/schemas/AppManifestEntry" }
                    registeredBy: { type: string }
                    registeredAt: { type: string, format: date-time }
                    serving: { type: boolean }
        "403": { description: Not an admin }
        "404": { description: No such app }
  /apps/{id}/versions/{version}/frontend:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: string }, description: The release the frontend belongs to, its manifest's version }
    put:
      summary: Keep one version of an app's frontend, served at /apps/{id}/{version}/
      description: >
        The app's own service (or a platform service, or an admin) gives the
        built frontend as one gzipped tarball, before registering that version.
        From then on the manifest the shell is given points `entry` at that
        version's own copy (/apps/{id}/{version}/entry.js) whenever the entry
        is a file under /apps/{id}/ and the tarball holds it. A version's
        frontend never changes: the same tarball again answers 200, a different
        one 409. At most 2000 files and 50 MB. Audited as app.frontend-published.
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, format: binary }
      responses:
        "200": { description: This version already had exactly this frontend, content: { application/json: { schema: { $ref: "#/components/schemas/StoredFrontend" } } } }
        "201": { description: Kept, content: { application/json: { schema: { $ref: "#/components/schemas/StoredFrontend" } } } }
        "400": { description: Not a semver version, or not a usable tarball (links, odd paths, too big) }
        "403": { description: Another app, or not an admin }
        "409": { description: One of the platform's own apps, or this version already has other files }
        "415": { description: Not sent as application/gzip }
        "501": { description: This deployment doesn't keep frontends by version (FRONTENDS_BUCKET_SECRET isn't set) }
  /upstreams:
    get:
      summary: Where each app's service is, for the gateway (and admins)
      description: >
        The upstreams set for apps by what runs them, or by an admin. The
        gateway asks as itself (its signed caller augur:gateway) and sends
        /api/{id}/… there for any app not in its APP_UPSTREAMS. `previews`
        names, for each app, the developers who chose one of its pull
        requests' previews and where that preview is: the gateway sends
        their calls there instead.
      responses:
        "200":
          description: Upstreams by app id
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps: { type: object, additionalProperties: { type: string } }
                  previews: { type: object, description: "App id → person id → upstream", additionalProperties: { type: object, additionalProperties: { type: string } } }
        "403": { description: Neither the gateway nor an admin }
  /apps/{id}/upstream:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Say where the gateway reaches an app's service (a platform service or an admin, never the app)
      description: >
        http or https, a host and port only, never one of the platform's own
        parts. null forgets it. Kept when the app registers new versions.
        Audited as app.upstream-set or app.upstream-cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [url], properties: { url: { type: [string, "null"], maxLength: 300 } } }
      responses:
        "200":
          description: The app as it now is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "400": { description: Not an address an app's service can be at }
        "403": { description: Not a platform service or an admin }
        "404": { description: No such app }
        "409": { description: One of the platform's own apps }
  /apps/{id}/pin:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Serve one kept version and hold the app there (admins only)
      description: >
        Rolls an app back, or holds it at its current version. Registrations
        after this are kept in its history but not served until it is
        unpinned. When the version's frontend is kept (PUT
        /apps/{id}/versions/{version}/frontend), its code is held too, since
        the manifest then points at that version's own copy; otherwise only
        the manifest changes. Audited as app.pinned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [version], properties: { version: { type: string } } }
      responses:
        "200":
          description: The app as it now is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "403": { description: Not an admin }
        "404": { description: No such app, or no such version kept }
        "409": { description: A platform app or one that ships with AUGUR, or another app now has that version's route }
    delete:
      summary: Let go of a pin and serve the newest version (admins only)
      description: Audited as app.unpinned.
      responses:
        "200":
          description: The app as it now is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueEntry" }
        "403": { description: Not an admin }
        "404": { description: No such app }
        "409": { description: A platform app or one that ships with AUGUR }
  /origins:
    get:
      summary: Where apps may load from besides the platform itself (admins only)
      responses:
        "200":
          description: Allowed origins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AllowedOrigin" }
        "403": { description: Not an admin }
    post:
      summary: Allow apps to load from an origin (admins only)
      description: HTTPS only, except http://localhost for development. Audited as origin.allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [origin], properties: { origin: { type: string, example: "https://apps.example.org" } } }
      responses:
        "201":
          description: Allowed (also when it already was)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedOrigin" }
        "400": { description: Not an HTTPS origin, or has a path }
        "403": { description: Not an admin }
  /origins/{origin}:
    parameters:
      - { name: origin, in: path, required: true, schema: { type: string }, description: The origin, URL-encoded }
    delete:
      summary: Stop allowing an origin (admins only)
      description: >
        Apps already registered from it stay in the catalogue, marked blocked,
        and are left out of the manifest until it is allowed again. Audited as origin.removed.
      responses:
        "204": { description: Removed }
        "403": { description: Not an admin }
        "404": { description: Not an allowed origin }
  /platform/updates:
    get:
      summary: Whether a newer AUGUR release is out, and what upgrading to it needs first (admins only)
      description: >
        From the registry's last check of the release feed: this repository's GitHub releases
        (augur@<version>, pre-releases are beta) or RELEASE_FEED_URL, a mirror's list of release files.
        The registry checks once a day. Read-only: nothing is restarted or changed.
      responses:
        "200":
          description: The running release against the feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUpdates" }
        "403": { description: Not an admin }
  /platform/updates/check:
    post:
      summary: Check the release feed now (admins only)
      description: A check within 30 seconds of the last good one answers from it. Audited as platform.updates-checked.
      responses:
        "200":
          description: The running release against the feed, as just checked. A feed that can't be read is a `problem`, not an error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUpdates" }
        "403": { description: Not an admin }
  /platform/overview:
    get:
      summary: Every unit this server runs, with its desired state, what's next and what needs an admin (admins only)
      description: >
        AUGUR first, then each app the app runner installed. Each unit has its desired state (ADR 0020):
        channel, policy, how far Automatic goes, a semver pin and the weekly windows an automatic upgrade
        may start in, with whether a window is open now. Needs you lists a halted release being run, and
        a failed or went-back result until an admin marks it looked at, and AUGUR's first upgrade on a
        server, which Automatic leaves to an admin.
      responses:
        "200":
          description: The overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "403": { description: Not an admin }
  /platform/reporting:
    get:
      summary: Whether this server reports what it runs to Backstage, its public key and the last send (admins only)
      description: >
        ADR 0019. mode is send (DEPLOYMENT_ID and PORTAL_URL set), file (DEPLOYMENT_ID only: export and carry
        the record) or off (DEPLOYMENT_REPORTING=off, or no DEPLOYMENT_ID), with why in a sentence. publicKey is
        the deployment's Ed25519 key as base64 SPKI, for the augur.dev/report-key annotation in Backstage.
      responses:
        "200":
          description: How this server reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reporting" }
        "403": { description: Not an admin }
  /platform/reporting/export:
    get:
      summary: The signed record of what this server runs, as a file to carry to Backstage (admins only)
      description: >
        The same body the registry sends Backstage: the record as signed (payload, a JSON string in the format
        augur.deployment-report/1) and its Ed25519 signature. It holds no personal data.
      responses:
        "200":
          description: The signed record, as an attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedReport" }
        "403": { description: Not an admin }
        "409": { description: "Reporting is off, with why" }
  /platform/units/{unit}/desired-state:
    put:
      summary: Set how a unit takes new releases (admins only)
      description: >
        `unit` is augur or an installed app's id. AUGUR's channel comes from RELEASE_CHANNEL, so a
        different one is refused with 409; a production server's apps follow stable only (409
        production_server). Without timeZone the record takes the deployment's (DEPLOYMENT_TIME_ZONE).
        Kept in the unit's history and audited as platform.desired-state-set, with the record before.
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesiredStateInput" }
      responses:
        "200":
          description: The overview, with the new record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "400": { description: "A bad pin, time zone or window, with how to write it" }
        "403": { description: Not an admin }
        "404": { description: This server runs no such unit }
        "409": { description: "AUGUR's channel is set in .env, or a production server's apps follow stable only" }
  /platform/units/{unit}/desired-state/history:
    get:
      summary: The records a unit has had, newest first (admins only, at most 50)
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The history
          content:
            application/json:
              schema:
                type: object
                required: [unit, history]
                properties:
                  unit: { type: string }
                  history: { type: array, items: { $ref: "#/components/schemas/DesiredState" } }
        "403": { description: Not an admin }
        "404": { description: This server runs no such unit }
  /platform/results/{kind}/{id}/seen:
    post:
      summary: Mark a finished upgrade or app install looked at, for every admin (admins only)
      description: It leaves Needs you. Audited as platform.result-seen.
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [upgrade, app-job] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "403": { description: Not an admin }
        "404": { description: No finished upgrade or job with that id }
  /platform/go-back:
    put:
      summary: Go back to an earlier AUGUR release (admins who just entered their password)
      description: >
        The same steps as an upgrade, a backup first, to one of the releases the Updates page lists
        under goBack with no problem: no release between is breaking, so the data stays as it is.
        Audited as platform.go-back-requested, and platform.went-back when it's done.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [version], properties: { version: { type: string } } }
      responses:
        "202": { description: Asked; the Updates page as it now stands }
        "401": { description: "Enter your password again (error sign_in_again)" }
        "403": { description: Not an admin }
        "409": { description: "Not a release it can go back to, with why; or an upgrade is already open" }
  /platform/upgrade:
    put:
      summary: Ask the deployment's updater to upgrade AUGUR (admins only)
      description: >
        `version` must be the `next` release Updates shows. Needs an admin who entered their
        password in the last 10 minutes (x-user-signed-in-at), or it answers 401 sign_in_again.
        Only records the ask: the updater picks it up from /platform/upgrade/target. Audited as
        platform.upgrade-requested. `settings` are new settings for `.env`, each one the release
        has: they're kept in memory for the updater until the upgrade ends, never stored, and only
        their names are audited. An empty value is left out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: string }
                settings: { type: object, additionalProperties: { type: string, maxLength: 4096 }, description: "Setting name to value, one line each" }
      responses:
        "202":
          description: Waiting for the updater
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUpdates" }
        "401": { description: "sign_in_again: enter the password again first" }
        "403": { description: Not an admin }
        "400": { description: A setting the release doesn't have, or a value over more than one line }
        "409": { description: Not the next release, its release file names no images, or an upgrade is already waiting or under way }
    delete:
      summary: Take back an upgrade the updater hasn't started (admins only)
      description: Audited as platform.upgrade-cancelled.
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUpdates" }
        "403": { description: Not an admin }
        "404": { description: No upgrade is waiting }
        "409": { description: It has started; it finishes or rolls back by itself }
  /platform/upgrade/target:
    get:
      summary: The upgrade to run (the deployment's updater only)
      description: Signed in as the platform-updater client. Each call counts as the updater being seen.
      responses:
        "200":
          description: The open upgrade, with each part's image by digest
          content:
            application/json:
              schema:
                type: object
                required: [id, from, version, images, state]
                properties:
                  id: { type: string }
                  from: { type: string }
                  version: { type: string }
                  images: { type: object, additionalProperties: { type: string } }
                  state: { type: string, enum: [requested, running] }
                  parts: { type: object, additionalProperties: { type: string }, description: "Each part's version in the release, by package name. Missing when the release file can't be read." }
                  required: { type: array, items: { type: string }, description: The settings the release won't start without }
                  deploy: { type: object, additionalProperties: { type: string }, description: "The release's files in infra/deploy, by path inside it, as sha256" }
                  settings: { type: object, additionalProperties: { type: string }, description: "Settings the admin entered when asking, for the updater to write to .env" }
                  watch:
                    type: object
                    description: "Present for an upgrade to a newer release: watch it for 10 minutes before it's done, going back by itself if sign-in or the gateway's calls fail (ADR 0020)"
                    properties: { breakingSince: { type: string, description: "A breaking release between, so a problem is reported for a person rather than gone back from" } }
        "204": { description: Nothing to do }
        "403": { description: Not the updater }
  /platform/upgrade/progress:
    post:
      summary: Report a step of the open upgrade (the deployment's updater only)
      description: >
        The first report starts it. With `outcome` it ends, audited as platform.upgraded,
        platform.upgrade-rolled-back or platform.upgrade-failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, step, state]
              properties:
                id: { type: string }
                step: { $ref: "#/components/schemas/UpgradeStep" }
                state: { type: string, enum: [running, done, failed] }
                message: { type: string }
                outcome: { type: string, enum: [done, rolled-back, failed] }
                calls:
                  type: integer
                  minimum: 0
                  description: How many of AUGUR's calls the watch judged by. Fewer than 20 starts the light watch (ADR 0020, amended).
      responses:
        "200":
          description: The upgrade as it stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upgrade" }
        "403": { description: Not the updater }
        "404": { description: Not the open upgrade }
  /platform/upgrade/after-watch:
    get:
      summary: The light watch's next look (the deployment's updater only)
      description: >
        After a watch too quiet to judge errors by, the updater looks every 5 minutes until AUGUR's
        services have had 20 calls, for at most a day (ADR 0020, amended). 204 when no look is due.
      responses:
        "200":
          description: The upgrade being watched, and how many minutes of the gateway's counts to read
          content:
            application/json:
              schema:
                type: object
                required: [id, version, minutes]
                properties:
                  id: { type: string }
                  version: { type: string }
                  minutes: { type: integer, minimum: 1, maximum: 15 }
        "204": { description: No look is due }
        "403": { description: Not the updater }
    post:
      summary: Report one look of the light watch (the deployment's updater only)
      description: >
        Adds AUGUR's calls since the last look. The watch ends held, failed (more than 5% of 20 calls, or
        sign-in failing twice in a row; it doesn't go back by itself and shows in Needs you) or quiet
        after a day, audited as platform.after-watch-failed or platform.after-watch-ended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, calls, serverErrors]
              properties:
                id: { type: string }
                calls: { type: integer, minimum: 0 }
                serverErrors: { type: integer, minimum: 0 }
                signInProblem: { type: string }
      responses:
        "200": { description: The light watch as it stands }
        "403": { description: Not the updater }
        "404": { description: That upgrade isn't being watched }
  /app-runner/jobs:
    get:
      summary: The app runner's recent jobs, newest first (admins only)
      parameters:
        - { name: app, in: query, required: false, schema: { type: string }, description: Only this app's }
      responses:
        "200":
          description: Up to 50 jobs, and when the runner last asked for work (missing when it hasn't since the registry started)
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/AppJob" } }
                  runnerSeenAt: { type: string, format: date-time }
        "403": { description: Not an admin }
    post:
      summary: Ask the app runner to install a release or remove an app (admins only)
      description: >
        Installing covers a first install, an upgrade and going back to an older version alike.
        Needs an admin who entered their password in the last 10 minutes, or it answers 401
        sign_in_again. Apps that ship with AUGUR are refused. Audited as app.install-requested or
        app.uninstall-requested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, release]
                  properties:
                    action: { type: string, enum: [install] }
                    release: { $ref: "#/components/schemas/AppRelease" }
                - type: object
                  additionalProperties: false
                  required: [action, app, version]
                  description: A release from the app feed, by version
                  properties:
                    action: { type: string, enum: [install] }
                    app: { type: string }
                    version: { type: string }
                - type: object
                  additionalProperties: false
                  required: [action, app]
                  properties:
                    action: { type: string, enum: [remove] }
                    app: { type: string }
      responses:
        "202":
          description: Waiting for the runner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppJob" }
        "400": { description: "The release can't be installed: not by digest, id or version unlike its manifest's, no service, or a bad manifest" }
        "404": { description: The app feed has no release file for that app and version }
        "401": { description: "sign_in_again: enter the password again first" }
        "403": { description: Not an admin }
        "409": { description: "The app ships with AUGUR, or already has a job waiting or under way" }
  /app-runner/jobs/{id}:
    delete:
      summary: Take back a job the runner hasn't started (admins only)
      description: Audited as app.job-cancelled.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Cancelled }
        "403": { description: Not an admin }
        "404": { description: No such job is waiting }
        "409": { description: It has started; it finishes by itself }
  /app-runner/next:
    get:
      summary: The oldest open job (the deployment's app runner only)
      description: Signed in as the platform-updater client. Each call counts as the runner being seen.
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppJob" }
        "204": { description: Nothing to do }
        "403": { description: Not the app runner }
  /app-runner/jobs/{id}/progress:
    post:
      summary: Report a step of an open job (the deployment's app runner only)
      description: >
        The first report starts it. With `outcome` it ends, audited as app.installed,
        app.install-failed, app.uninstalled, app.uninstall-failed, app.preview-started,
        app.preview-failed, app.preview-removed or app.preview-remove-failed. A preview
        that started ends with `upstream`, where it answers.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [step, state]
              properties:
                step: { $ref: "#/components/schemas/AppJobStep" }
                state: { type: string, enum: [running, done, failed] }
                message: { type: string }
                outcome: { type: string, enum: [done, failed] }
                upstream: { type: string, description: "With a preview's outcome: where it answers, such as http://app-notes-pr12:8080" }
      responses:
        "200":
          description: The job as it stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppJob" }
        "403": { description: Not the app runner }
        "404": { description: The job isn't open }
  /app-runner/apps:
    get:
      summary: Installed apps and how each takes updates, and what the app feed offers (admins only)
      responses:
        "200":
          description: Admin → Apps' installs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppInstalls" }
        "403": { description: Not an admin }
  /app-runner/check:
    post:
      summary: Check the app feed now, starting any automatic updates it finds (admins only)
      responses:
        "200":
          description: Admin → Apps' installs after the check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppInstalls" }
        "403": { description: Not an admin }
  /app-runner/apps/{id}/follow:
    put:
      summary: Set how an installed app takes new releases (admins only)
      description: >
        Its channel, and its policy: automatic (a newer release on the channel that asks for nothing
        new installs by itself), ask (each waits for an admin) or hold (nothing is offered). An app
        with no choice yet follows stable, automatically. A production server (SERVER_RING=production)
        follows stable only, and refuses beta or dev with 409. dev (dev builds too) is for a preview server. Audited as app.updates-set.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel, policy]
              properties:
                channel: { type: string, enum: [stable, beta, dev] }
                policy: { type: string, enum: [automatic, ask, hold] }
      responses:
        "200":
          description: Admin → Apps' installs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppInstalls" }
        "403": { description: Not an admin }
        "404": { description: The app runner hasn't installed that app }
        "409": { description: "This is a production server: it follows stable releases only (error production_server)" }
  /app-runner/apps/{id}/developers:
    put:
      summary: Set who may try an installed app's pull requests' previews (admins only)
      description: >
        People's ids, at most 50. Previews run only for apps with developers; one taken off loses
        their choice of its previews. Audited as app.developers-set.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [people]
              properties: { people: { type: array, maxItems: 50, uniqueItems: true, items: { type: string } } }
      responses:
        "200":
          description: Admin → Apps' installs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppInstalls" }
        "403": { description: Not an admin }
        "404": { description: The app runner hasn't installed that app }
  /previews:
    get:
      summary: The previews the caller may try, of the apps they're a developer of
      description: >
        Each pull request's newest build runs beside the app on the deployment, for a week after
        its last build or until the pull request closes. `chosen` is the pull request whose
        preview the caller uses instead of the app, if any.
      responses:
        "200":
          description: The caller's apps and their previews
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps:
                    type: array
                    items:
                      type: object
                      required: [app, name, version, previews]
                      properties:
                        app: { type: string }
                        name: { type: string }
                        version: { type: string, description: The installed version }
                        chosen: { type: integer }
                        previews: { type: array, items: { $ref: "#/components/schemas/Preview" } }
                        live: { type: string, description: "Live on the workbench: the entry on the caller's own machine the shell loads instead of the app" }
                        liveProblem: { type: string, description: "Why the app can't be loaded from the caller's machine here (only the workbench, SERVER_RING=dev, does)" }
        "401": { description: Not signed in }
  /previews/{id}:
    put:
      summary: Use one of an app's previews instead of the app, for the caller alone
      description: >
        The shell is given the preview's manifest, and the gateway sends the caller's calls to the
        app to the preview, until they choose `null` (back to the app) or the preview goes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pr]
              properties: { pr: { type: [integer, "null"], minimum: 1 } }
      responses:
        "204": { description: Chosen }
        "401": { description: Not signed in }
        "403": { description: Not one of the app's developers }
        "404": { description: No preview of that pull request is running }
  /previews/{id}/live:
    put:
      summary: Load an app's frontend from the caller's own machine, for them alone (Live on the workbench)
      description: >
        Only on the workbench (SERVER_RING=dev), whose front door lets the shell load scripts from *.ts.net.
        The shell is given `url` as the app's entry for the caller until they send `null` or the registry
        restarts. The app's service stays the installed one.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties: { url: { type: [string, "null"], maxLength: 2048, description: "https://<machine>.ts.net/…/entry.ts, as pnpm dev:app <id> --live prints it" } }
      responses:
        "204": { description: Loading it from there, or stopped }
        "400": { description: Not an app entry on a machine on the tailnet }
        "401": { description: Not signed in }
        "403": { description: Not one of the app's developers }
        "409": { description: This server isn't the workbench }
components:
  schemas:
    AppInstalls:
      type: object
      required: [feed, sdkVersion, installed, available]
      properties:
        feed: { type: string, enum: [on, off] }
        checkedAt: { type: string, format: date-time }
        problem: { type: string, description: Why the app feed couldn't be read last time }
        runnerSeenAt: { type: string, format: date-time, description: "When the app runner last asked for work; missing when it hasn't since the registry started" }
        sdkVersion: { type: string }
        ring: { $ref: "#/components/schemas/ServerRing" }
        previewsAllowed: { type: boolean, description: "Whether pull requests' builds run beside apps for their developers: always on a preview server, with ALLOW_PR_PREVIEWS=on on a production one" }
        channelNote: { type: string, description: Why apps here follow stable only, on a production server }
        installed:
          type: array
          items:
            type: object
            required: [app, name, version, installedAt, channel, policy]
            properties:
              app: { type: string }
              name: { type: string }
              version: { type: string }
              installedAt: { type: string, format: date-time }
              channel: { type: string, enum: [stable, beta, dev] }
              policy: { type: string, enum: [automatic, ask, hold] }
              update:
                type: object
                required: [version, channel, needs]
                description: The newest release on its channel, when newer than what runs
                properties:
                  version: { type: string }
                  channel: { type: string, enum: [stable, beta, dev] }
                  notesUrl: { type: string }
                  needs: { type: array, items: { type: string }, description: "Why it waits for an admin; empty when it can install by itself" }
                  changes: { type: array, items: { $ref: "#/components/schemas/Change" } }
              job: { $ref: "#/components/schemas/AppJob" }
              changes: { type: array, items: { $ref: "#/components/schemas/Change" }, description: What changed in the version it runs }
              older:
                type: array
                description: Earlier versions in the feed to go back to (install one; the app is then held there)
                items: { type: object, required: [version, channel], properties: { version: { type: string }, channel: { type: string, enum: [stable, beta] } } }
              history:
                type: array
                description: Its jobs, newest first (at most 20)
                items:
                  type: object
                  required: [id, action, requestedBy, requestedAt, state]
                  properties:
                    id: { type: string }
                    action: { type: string, enum: [install, remove, preview, preview-remove] }
                    version: { type: string }
                    requestedBy: { type: string, description: "A person's id, or automatic" }
                    requestedAt: { type: string, format: date-time }
                    state: { type: string, enum: [requested, running, done, failed, cancelled] }
                    message: { type: string }
                    finishedAt: { type: string, format: date-time }
              developers: { type: array, items: { type: string }, description: "Who may try its previews, by person id" }
              previews: { type: array, items: { $ref: "#/components/schemas/Preview" } }
        available:
          type: array
          items:
            type: object
            required: [app, name, version, channel, signer, asks]
            properties:
              app: { type: string }
              name: { type: string }
              description: { type: string }
              version: { type: string }
              channel: { type: string, enum: [stable, beta] }
              notesUrl: { type: string }
              signer: { type: object, properties: { repository: { type: string }, workflow: { type: string } } }
              asks: { type: object, properties: { scopes: { type: array, items: { type: string } }, storage: { type: object }, maxUpload: { type: integer } } }
              problem: { type: string, description: "Why it can't open in this AUGUR" }
              job: { $ref: "#/components/schemas/AppJob" }
    AppRelease:
      type: object
      description: "An app's release file, app-release.json, as scripts/app-release.mjs writes it (docs/versioning.md, App releases)"
      required: [schema, id, version, channel, manifest, service, frontend, signer]
      properties:
        schema: { type: string, enum: [augur.app-release/v1] }
        id: { type: string }
        version: { type: string }
        channel: { type: string, enum: [stable, beta, dev, preview] }
        releasedAt: { type: string }
        sdk: { type: string }
        manifest: { $ref: "#/components/schemas/AppManifestEntry" }
        service:
          type: [object, "null"]
          required: [image]
          properties: { image: { type: string, description: "The service image by digest, <repo>@sha256:<hex>" } }
        frontend:
          type: [object, "null"]
          required: [artifact, digest, mediaType]
          properties:
            artifact: { type: string, description: The frontend's OCI artifact by digest }
            digest: { type: string, description: "sha256 of the frontend's tarball" }
            mediaType: { type: string }
        signer:
          type: object
          required: [repository, workflow]
          properties: { repository: { type: string }, workflow: { type: string } }
        asks: { type: object, description: "What the version asks an admin for: scopes, storage, floors, maxUpload, settings" }
        notes: { type: string }
        preview:
          type: object
          description: For a pull request's build (channel preview, version <x.y.z>-pr.<number>.<run>)
          required: [pr]
          properties: { pr: { type: integer }, title: { type: string }, url: { type: string } }
    Preview:
      type: object
      description: A pull request's build running beside the app
      required: [pr, version, startedAt, endsAt]
      properties:
        pr: { type: integer }
        version: { type: string }
        title: { type: string }
        url: { type: string, description: The pull request }
        startedAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: When it's taken away unless the pull request is built again }
    AppJob:
      type: object
      required: [id, app, action, requestedBy, requestedAt, state, steps]
      properties:
        id: { type: string }
        app: { type: string }
        action: { type: string, enum: [install, remove, preview, preview-remove] }
        release: { $ref: "#/components/schemas/AppRelease" }
        pr: { type: integer, description: For a preview's job, its pull request }
        upstream: { type: string, description: "For a preview that started, where it answers" }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        state: { type: string, enum: [requested, running, done, failed, cancelled] }
        steps:
          type: array
          items:
            type: object
            required: [step, state, at]
            properties:
              step: { $ref: "#/components/schemas/AppJobStep" }
              state: { type: string, enum: [running, done, failed] }
              at: { type: string, format: date-time }
              message: { type: string }
        message: { type: string }
        finishedAt: { type: string, format: date-time }
    AppJobStep: { type: string, enum: [verify, storage, sign-in, start, health, switch, watch, retire, remove] }
    StoredFrontend:
      type: object
      required: [app, version, digest, files, bytes, publishedBy, publishedAt]
      properties:
        app: { type: string }
        version: { type: string }
        digest: { type: string, description: "sha256 of the tarball, sha256:<hex>" }
        files: { type: array, items: { type: string } }
        bytes: { type: integer }
        publishedBy: { type: string }
        publishedAt: { type: string, format: date-time }
    AppSetting:
      type: object
      additionalProperties: false
      required: [id, label, type, min, max, default]
      properties:
        id: { type: string, pattern: "^[a-z][a-zA-Z0-9]{0,39}$", description: "How the app's service names it, e.g. retentionDays" }
        label: { type: string, maxLength: 60 }
        detail: { type: string, maxLength: 200 }
        type: { enum: [integer] }
        unit: { type: string, maxLength: 20, description: "What the number counts, e.g. days" }
        min: { type: integer }
        max: { type: integer }
        default: { type: integer, description: Between min and max }
    AppSettings:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AppSetting"
              - type: object
                required: [value]
                properties:
                  value: { type: integer, description: "An admin's value, or the default" }
                  setBy: { type: string, description: The admin who set it }
                  setAt: { type: string, format: date-time }
    Upgrade:
      type: object
      required: [id, from, version, images, requestedBy, requestedAt, state, steps]
      properties:
        id: { type: string }
        from: { type: string }
        version: { type: string }
        images: { type: object, additionalProperties: { type: string } }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        state: { type: string, enum: [requested, running, done, rolled-back, failed, cancelled] }
        steps:
          type: array
          items:
            type: object
            required: [step, state, at]
            properties:
              step: { $ref: "#/components/schemas/UpgradeStep" }
              state: { type: string, enum: [running, done, failed] }
              at: { type: string, format: date-time }
              message: { type: string }
        message: { type: string }
        finishedAt: { type: string, format: date-time }
    UpgradeStep: { type: string, enum: [preflight, backup, pull, roll-forward, verify, watch, roll-back], description: "watch: the new release is watched for 10 minutes before the upgrade is done (ADR 0020)" }
    PipelineBranch: { type: string, enum: [dev, preview, production] }
    PipelinePull:
      type: object
      required: [number, title, url]
      properties: { number: { type: integer }, title: { type: string }, url: { type: string } }
    PipelineLine:
      type: object
      description: "The Upgrade Centre's line: each unit between dev, preview and production, from the pipeline feed (docs/release-channels.md, The pipeline feed), with what this server runs of it"
      required: [feed, units, steps]
      properties:
        feed: { type: string, enum: ["on", "off"], description: Off when there's no pipeline feed (a mirror, or PIPELINE_FEED_URL=off) }
        checkedAt: { type: string, format: date-time }
        problem: { type: string, description: Why the last read failed; what it read before still shows }
        generatedAt: { type: string, format: date-time }
        repository: { type: string }
        units:
          type: array
          items:
            type: object
            required: [id, name, versions, waiting, previews]
            properties:
              id: { type: string, description: "augur, or an app's id" }
              name: { type: string }
              versions:
                type: object
                properties: { dev: { type: [string, "null"] }, preview: { type: [string, "null"] }, production: { type: [string, "null"] } }
              devBuild: { type: object, required: [version], properties: { version: { type: string }, released: { type: string } } }
              waiting: { type: array, items: { type: string }, description: The changesets on dev that move it }
              previews: { type: array, items: { type: object, required: [pr, version], properties: { pr: { type: integer }, version: { type: string } } } }
              running: { type: string, description: The version this server runs, when it runs it }
        steps:
          type: array
          items:
            type: object
            required: [from, to, merged, pulls]
            properties:
              from: { $ref: "#/components/schemas/PipelineBranch" }
              to: { $ref: "#/components/schemas/PipelineBranch" }
              merged: { type: integer, description: How many pull requests are on from that aren't on to yet }
              pulls: { type: array, items: { type: object, required: [number, title], properties: { number: { type: integer }, title: { type: string }, mergedAt: { type: string } } } }
        pulls:
          type: object
          properties:
            versionPackages: { $ref: "#/components/schemas/PipelinePull" }
            promoteToPreview: { $ref: "#/components/schemas/PipelinePull" }
            promoteToProduction:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/PipelinePull"
                  - type: object
                    required: [unit, version]
                    properties: { unit: { type: string }, version: { type: string } }
    PlatformUpdates:
      type: object
      required: [running, channel, feed, newer, needsYou]
      properties:
        running: { type: object, required: [version, channel], properties: { version: { type: string }, channel: { $ref: "#/components/schemas/ReleaseChannel" }, build: { type: string, enum: [source], description: "Set when the server was built from a checkout (compose.build.yml): version is then the last release it's based on" } } }
        channel: { $ref: "#/components/schemas/ReleaseChannel" }
        ring: { $ref: "#/components/schemas/ServerRing" }
        channelNote: { type: string, description: Why the channel isn't the one RELEASE_CHANNEL asks for (a production server follows stable only) }
        feed: { type: string, enum: ["on", "off"], description: Off when the deployment set RELEASE_FEED_URL=off }
        feedTrust: { $ref: "#/components/schemas/FeedTrust" }
        checkedAt: { type: string, format: date-time }
        problem: { type: string, description: Why the last check failed; what it found before still shows }
        available:
          description: The newest release on the channel, when newer than the running one
          allOf:
            - $ref: "#/components/schemas/ReleaseSummary"
            - type: object
              required: [parts]
              properties:
                parts:
                  type: array
                  items: { type: object, required: [name, to], properties: { name: { type: string }, from: { type: string }, to: { type: string } } }
        newer: { type: array, items: { $ref: "#/components/schemas/ReleaseSummary" }, description: Every release on the channel newer than the running one, newest first }
        beta: { $ref: "#/components/schemas/ReleaseSummary", description: "On stable: a beta newer than anything stable" }
        next: { type: string, description: The release to upgrade to next; one on the way when the newest can't be reached straight }
        upgrade: { $ref: "#/components/schemas/Upgrade", description: The upgrade asked for, while it's open and for a week after }
        history: { type: array, items: { $ref: "#/components/schemas/UpgradeHistoryEntry" }, description: Every upgrade asked for, newest first (at most 50) }
        goBack:
          type: array
          description: Earlier releases on the channel to go back to, newest first (at most 5)
          items:
            type: object
            required: [version, channel]
            properties:
              version: { type: string }
              channel: { $ref: "#/components/schemas/ReleaseChannel" }
              released: { type: string }
              problem: { type: string, description: "Why it can't go back straight; absent when it can" }
              halted: { $ref: "#/components/schemas/Halt" }
              breakingAfter: { type: string, description: The breaking release between, whose backup going back by hand restores }
        updaterSeenAt: { type: string, format: date-time, description: When the updater last asked for work, since the registry started }
        portalUrl: { type: string, description: "The company's Backstage (PORTAL_URL), which the Upgrade Centre links to" }
        line: { $ref: "#/components/schemas/PipelineLine" }
        needsYou:
          type: array
          items:
            type: object
            required: [kind, message]
            properties:
              kind: { type: string, enum: [halted, path, setting, breaking, app, unknown], description: "halted: the running release was halted by its publisher, and is the only need shown" }
              message: { type: string }
              version: { type: string }
              key: { type: string, description: The setting, for kind setting }
              required: { type: boolean }
              madeUp: { type: boolean, description: "For kind setting: a secret the updater makes up itself" }
              app: { type: string, description: The app that won't run on the new SDK, for kind app }
    ReleaseChannel: { type: string, enum: [stable, beta, dev], description: "stable is on production, beta on preview, dev a dev build of the dev branch that only the workbench takes (docs/release-channels.md)" }
    ServerRing: { type: string, enum: [dev, preview, production], description: "What kind of server this is (SERVER_RING in .env): dev is the workbench, which also runs AUGUR's dev builds; a production one takes only releases promoted to production" }
    ReleaseSummary:
      type: object
      required: [version, channel, breaking]
      properties:
        version: { type: string }
        channel: { $ref: "#/components/schemas/ReleaseChannel" }
        released: { type: string }
        notesUrl: { type: string, format: uri }
        breaking: { type: array, items: { type: string } }
        changes: { type: array, items: { $ref: "#/components/schemas/Change" }, description: "What changed in it, each change once; absent for a release made before changelogs were attached" }
        halted: { $ref: "#/components/schemas/Halt" }
    Halt:
      type: object
      description: "The publisher halted this release (ADR 0018): it is listed but never offered, installed or chosen as next"
      required: [reason, at]
      properties:
        reason: { type: string }
        at: { type: string, format: date-time }
        by: { type: string, description: Who halted it }
    UpgradeWindow:
      type: object
      description: A weekly slot an automatic upgrade may start in, in the unit's time zone
      required: [day, start, hours]
      properties:
        day: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday }
        start: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "HH:MM, 24-hour" }
        hours: { type: number, minimum: 1, maximum: 24 }
    DesiredStateInput:
      type: object
      additionalProperties: false
      required: [channel, policy, automaticUpTo, windows]
      properties:
        channel: { type: string, enum: [stable, beta, dev] }
        policy: { type: string, enum: [automatic, ask, hold], description: "automatic installs what it reaches by itself; ask waits for an admin; hold offers nothing" }
        automaticUpTo: { type: string, enum: [patch, minor], description: How far Automatic goes. A major always waits for an admin. }
        pin: { type: string, description: "A semver range the unit stays within, such as 0.13.x" }
        windows: { type: array, maxItems: 14, items: { $ref: "#/components/schemas/UpgradeWindow" }, description: When an automatic upgrade may start; none means at any time }
        timeZone: { type: string, description: "An IANA time zone; absent takes the deployment's" }
    DesiredState:
      allOf:
        - $ref: "#/components/schemas/DesiredStateInput"
        - type: object
          required: [unit, setBy, setAt]
          properties:
            unit: { type: string }
            setBy: { type: string, description: "Who set it; default for a unit nobody has set" }
            setAt: { type: string, format: date-time }
    Reporting:
      type: object
      required: [mode, why]
      properties:
        mode: { type: string, enum: [send, file, "off"] }
        why: { type: string }
        deployment: { type: string, description: DEPLOYMENT_ID, the deployment's name in Backstage's catalog }
        publicKey: { type: string, description: Base64 SPKI Ed25519 public key }
        last: { type: object, required: [at, reason, ok], properties: { at: { type: string, format: date-time }, reason: { type: string, enum: [started, changed, daily] }, ok: { type: boolean }, problem: { type: string } } }
    SignedReport:
      type: object
      required: [deployment, payload, signature]
      properties:
        deployment: { type: string }
        payload: { type: string, description: "The record as signed: JSON in the format augur.deployment-report/1, with OpAMP's agentDescription, health and packageStatuses" }
        signature: { type: string, description: Base64 Ed25519 signature over the payload's UTF-8 bytes }
    Overview:
      type: object
      required: [ring, timeZone, feed, units, needsYou]
      properties:
        reporting: { type: object, required: [mode, why], description: Whether Backstage sees what this server runs (ADR 0019), properties: { mode: { type: string, enum: [send, file, "off"] }, why: { type: string } } }
        ring: { $ref: "#/components/schemas/ServerRing" }
        timeZone: { type: string, description: The deployment's (DEPLOYMENT_TIME_ZONE) }
        feed: { type: string, enum: ["on", "off"] }
        feedTrust: { $ref: "#/components/schemas/FeedTrust" }
        checkedAt: { type: string, format: date-time }
        units:
          type: array
          items:
            type: object
            required: [unit, name, running, desired, policy, window]
            properties:
              unit: { type: string, description: augur, or an app's id }
              name: { type: string }
              running: { type: string }
              available: { type: string, description: The newest release on its channel, when newer }
              halted: { $ref: "#/components/schemas/Halt" }
              desired:
                allOf:
                  - $ref: "#/components/schemas/DesiredState"
                  - type: object
                    required: [timeZone, isDefault]
                    properties: { isDefault: { type: boolean, description: Nobody has set it; these are the defaults } }
              policy: { type: string, description: The record in a sentence }
              window: { type: object, required: [open], properties: { open: { type: boolean }, nextAt: { type: string, format: date-time } } }
              automatic: { type: object, description: "What Automatic does with the next release: takes it, or why it waits", properties: { takes: { type: string }, waits: { type: string } } }
              open: { type: object, required: [id, state], properties: { id: { type: string }, version: { type: string }, state: { type: string, enum: [requested, running] } } }
              lastResult: { $ref: "#/components/schemas/UnitResult" }
        needsYou:
          type: array
          items:
            type: object
            required: [kind, unit, message]
            properties:
              kind: { type: string, enum: [halted, failed, went-back, first-upgrade, after-watch] }
              unit: { type: string }
              message: { type: string }
              result: { type: object, required: [kind, id], properties: { kind: { type: string, enum: [upgrade, app-job] }, id: { type: string } }, description: The result to mark looked at }
    UnitResult:
      type: object
      required: [kind, id, state, finishedAt]
      properties:
        kind: { type: string, enum: [upgrade, app-job] }
        id: { type: string }
        from: { type: string }
        version: { type: string }
        state: { type: string, enum: [done, rolled-back, failed, cancelled] }
        message: { type: string }
        finishedAt: { type: string, format: date-time }
        seenBy: { type: string }
        seenAt: { type: string, format: date-time }
    FeedTrust:
      type: object
      description: "How far the release feed this server read can be trusted (ADR 0017)"
      required: [state]
      properties:
        state: { type: string, enum: [verified, mirror, unchecked], description: "verified: signed by the publisher and in date; mirror: the organisation's own mirror feed; unchecked: GitHub's releases read directly" }
        expires: { type: string, format: date-time, description: When a verified feed stops being good unless it is issued again }
        signer: { type: string, description: The workflow that signed it, as cosign checked it }
        note: { type: string, description: What to know when it isn't verified }
    Change:
      type: object
      required: [kind, text, parts]
      properties:
        id: { type: string, description: "Changesets' commit hash: the same change in two parts has the same id" }
        kind: { type: string, enum: [major, minor, patch] }
        text: { type: string, description: The changeset's words, as Markdown }
        parts: { type: array, items: { type: string } }
    UpgradeHistoryEntry:
      type: object
      required: [id, from, version, requestedBy, requestedAt, state]
      properties:
        id: { type: string }
        from: { type: string }
        version: { type: string }
        requestedBy: { type: string }
        requestedByName: { type: string }
        requestedAt: { type: string, format: date-time }
        state: { type: string, enum: [requested, running, done, rolled-back, failed, cancelled] }
        message: { type: string }
        finishedAt: { type: string, format: date-time }
        backup: { type: string, description: The backup the updater took first }
    CatalogueEntry:
      allOf:
        - $ref: "#/components/schemas/AppManifestEntry"
        - type: object
          required: [platform, enabled]
          properties:
            platform: { type: boolean, description: Ships with the platform and is always on }
            pillar:
              type: boolean
              description: >
                Ships with AUGUR (PILLAR_APPS) but is an ordinary app: it registers itself, is given the
                scopes its release asks for, changes version with the release, and can be turned off but not removed.
            enabled: { type: boolean }
            registeredBy: { type: string, description: The service or admin that last registered it }
            registeredAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            pinnedVersion: { type: string, description: Set when an admin holds the app at this version }
            blocked: { type: string, description: "Set when the app's entry is on an origin no longer allowed: why it isn't offered" }
            grantedScopes: { type: array, items: { $ref: "#/components/schemas/Scope" }, description: What it asks for that an admin has granted }
            awaitingScopes: { type: array, items: { $ref: "#/components/schemas/Scope" }, description: What it asks for that no admin has granted yet }
            uploadLimit: { type: integer, description: "What the gateway lets through to the app's service in one request, in MB" }
            uploadLimitLowered: { type: boolean, description: Set when an admin has lowered it below what the manifest asks }
            upstream: { type: string, description: "Where the gateway reaches the app's service, when set (PUT /apps/{id}/upstream)" }
    FloorRule:
      type: object
      required: [app, workspace, state, carriesOn, setBy, setAt]
      properties:
        app: { type: string }
        workspace: { type: string }
        state: { type: string, enum: [on, off, blocked] }
        carriesOn: { type: boolean, description: Whether it applies to the teams below too; always true for blocked }
        setBy: { type: string }
        setAt: { type: string, format: date-time }
    AllowedOrigin:
      type: object
      required: [origin, addedBy, addedAt]
      properties:
        origin: { type: string }
        addedBy: { type: string }
        addedAt: { type: string, format: date-time }
    FeaturePreview:
      type: object
      required: [id, name]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{0,39}$" }
        name: { type: string, maxLength: 60 }
        detail: { type: string, maxLength: 200 }
        until: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", description: "Its last day; after it, it's off for everyone" }
    FeaturePreviewMode: { type: string, enum: [off, opt-in, everyone] }
    FeaturePreviewsAdmin:
      type: object
      required: [defaultMode, ring, previews]
      properties:
        defaultMode: { $ref: "#/components/schemas/FeaturePreviewMode" }
        ring: { $ref: "#/components/schemas/ServerRing" }
        previews:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/FeaturePreview" }
              - type: object
                required: [mode, ended, chosen, optedIn]
                properties:
                  mode: { $ref: "#/components/schemas/FeaturePreviewMode" }
                  ended: { type: boolean }
                  chosen: { type: boolean, description: "An admin chose its mode; false means the server's default" }
                  setBy: { type: string }
                  setAt: { type: string, format: date-time }
                  optedIn: { type: integer, description: How many people turned it on }
    AppManifestEntry:
      type: object
      required: [id, name, route, entry, version, sdk]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{1,39}$" }
        name: { type: string }
        route: { type: string, pattern: "^/[a-z0-9][a-z0-9/-]*$", description: Route prefix the shell maps to this app }
        entry: { type: string, description: URL of the app's ES module entry }
        version: { type: string, description: "The app's release, semver" }
        sdk: { type: string, description: "The @augur/mfe-sdk releases the app works with, a semver range such as ^1.0.0. The shell will not open an app whose range its SDK does not satisfy." }
        description: { type: string, description: One line shown under the app name in the Shell }
        icon: { type: string, description: A UI kit icon name }
        requiredRole: { type: string }
        handles:
          type: array
          items: { type: string }
          description: Intent types this app handles, e.g. document.open
        ai: { type: boolean, description: The app is an AI; the menus draw it as a bubble }
        orbit: { type: boolean, description: "false: the app keeps its menu inside it, so the shell never shows its Orbit; its root opens the app, Title still lists its areas, and the band's Home and All apps are the way back to the shell's menus" }
        sameOnEveryFloor: { type: boolean, description: "true: the app shows the same on every floor, so the shell's floor gauge rests while it's open, staying in view and saying why (SDK 1.6)" }
        focus: { type: boolean, description: "true: the app can narrow what it shows to a working context inside the floor, from ctx.focus (SDK 1.10). Reserved: the shell offers none yet (ADR 0029)" }
        previews:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/FeaturePreview" }
          description: "Features the app is trying before they're everyone's (SDK 1.7): admins say who gets each, people turn opt-in ones on in the shell's Previews, and the app asks ctx.previewOn(id)"
        previewsOn:
          type: array
          items: { type: string }
          description: "In the catalogue the registry serves: the ids of the app's previews on for the caller (SDK 1.7)"
        search: { type: boolean, description: "The app's service answers GET /v1/search?q= with { results: [{ id, title, detail?, path?, workspace? }] }, and the shell's Find asks it" }
        storage:
          type: object
          additionalProperties: false
          description: "The storage the app keeps on the platform. An admin adds the app to APP_STORAGE and its service gets DATABASE_URL (a login owning one schema) and S3_* (its own bucket). See docs/app-storage.md."
          properties:
            database: { type: boolean }
            bucket: { type: boolean }
        maxUpload:
          type: integer
          minimum: 1
          maximum: 2048
          description: "The largest request, in MB, the gateway lets through to the app's service; 10 without it. In the manifest the registry serves, always present: what the app asks, or less where an admin lowered it."
        scopes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Scope" }
          description: What the app's service asks to do on the platform. An app may always register itself.
        settings:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/AppSetting" }
          description: Settings the app offers admins (Admin, Apps); its service reads them from /apps/{id}/settings.
        floors:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/FloorKind" }
          description: The kinds of floor the app works on; every kind when absent
        surfaces:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/Surface" }
          description: >
            What the app shows on each kind of floor, for the shell to place.
            When several match, the most specific floor wins, then a role
            condition, then manifest order. Each surface's floor must be in floors.
        menu:
          type: array
          maxItems: 8
          description: The app's menu, shown by the shell as Orbit at the app's root. A group with one item opens it directly
          items: { $ref: "#/components/schemas/AppMenuCategory" }
        areas:
          type: array
          maxItems: 6
          description: "The broad parts of what the app covers, which Title lists under it (SDK 1.5). With fewer than two, Title shows the app alone. Nothing repeats its parent: the registry warns when an area's label or icon matches the app's, a group's its area's, or an item's its group's, and accepts the manifest. See docs/shell-principles.md"
          items: { $ref: "#/components/schemas/AppArea" }
    FloorKind:
      type: string
      enum: [personal, team, org]
      description: team means any team, at any depth
    Surface:
      type: object
      required: [floor, slot, module]
      additionalProperties: false
      properties:
        floor: { $ref: "#/components/schemas/FloorKind" }
        slot: { type: string, enum: [page, card, panel, settings, admin] }
        module: { type: string, pattern: "^[A-Za-z0-9_./-]+$", description: The module the app's entry exposes for it }
        role: { type: string, enum: [member, lead], description: Only for people with this role on the floor }
        rollup: { type: boolean, description: Shows the floor and the teams below it the person is on (identity's roll-up) }
    Scope:
      type: string
      enum: [notifications:send, audit:write, models:use, events:publish, events:subscribe, people:read]
      description: "notifications:send: notify people (for itself only). audit:write: add entries for itself to the audit log. models:use: call the model gateway (counted against the app's daily limit). events:publish: publish domain events on its own topics (<app id>.*). events:subscribe: read domain events on any topic. people:read: ask identity who a person stands for (their teams) and find people and teams by name, for sharing."
    AppMenuCategory:
      type: object
      required: [label, items]
      additionalProperties: false
      properties:
        id: { type: string }
        label: { type: string }
        icon: { type: string, description: A UI kit icon name }
        ai: { type: boolean }
        area: { type: string, description: The id of the app's area the group belongs to (SDK 1.5) }
        items:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: "#/components/schemas/AppMenuItem" }
    AppArea:
      type: object
      required: [id, label]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{0,39}$" }
        label: { type: string, minLength: 1, maxLength: 40 }
        icon: { type: string, description: A UI kit icon name, not the app's own }
        detail: { type: string, maxLength: 60, description: One line on what's in it }
    AppMenuItem:
      type: object
      required: [label, path]
      additionalProperties: false
      properties:
        id: { type: string }
        label: { type: string }
        icon: { type: string }
        detail: { type: string, description: One short fact, never a sentence }
        keywords: { type: string, description: Extra words search finds it by }
        ai: { type: boolean }
        path: { type: string, pattern: "^/.+", description: Where in the app it opens, below the app's route }
