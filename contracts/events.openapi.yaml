              schema:
                $ref: "#/components/schemas/Refusal"
    put:
      summary: Turn team notices on or off for a team (its leads and admins)
      description: Audited as team-notices.on or team-notices.off, on that floor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - on
              properties:
                on:
                  type: boolean
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: workspace
          required: true
      responses:
        "200":
          description: The setting now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamNotices"
        "403":
          description: Not a lead standing on that team, nor an admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /notifications/{id}:
    get:
      summary: One of the caller's notifications, read or not
      description: "What a notice email links to: the shell opens it as if it were clicked there."
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: The caller has no such notification
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /notifications/{id}/read:
    post:
      summary: Mark one of the caller's notifications read
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "204":
          description: Marked read
        "404":
          description: The caller has no such notification
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    delete:
      summary: Mark it unread again (Undo)
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "204":
          description: Marked unread
        "404":
          description: The caller has no such notification
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /notifications/stream:
    get:
      summary: Each new notification for the caller, as server-sent events
      description: 'Events are named "notification" and carry a Notification as JSON. Events named "inbox" carry { id, change } (added, changed or closed) when an inbox item the caller can see changes: reload the counts, and the list if it is showing. Comment lines are sent as keep-alives. Read with fetch so the sign-in token can be sent; reload the list after reconnecting.'
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema: {}
  /domain-events:
    post:
      summary: Publish domain events (services only)
      description: "An app publishes on its own topics (\"<app id>.<what happened>\") with the events:publish scope; platform services on \"platform.*\". Every event in one call is on the same publisher's topics. An event whose id the publisher already sent is kept once. Payloads are at most 16 KB: ids and a little context, never content a follower might not be allowed to see. The events service itself publishes platform.person.*, platform.team.* and platform.app.* as identity and the registry record those changes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - events
              properties:
                events:
                  type: array
                  items:
                    $ref: "#/components/schemas/NewDomainEvent"
                  minItems: 1
                  maxItems: 100
              additionalProperties: false
      responses:
        "202":
          description: Kept
          content:
            application/json:
              schema:
                type: object
                required:
                  - added
                  - repeated
                properties:
                  added:
                    type: integer
                  repeated:
                    type: integer
                description: Kept
        "400":
          description: A topic outside the publisher's, an unknown floor, a floor the app isn't on, or a payload over 16 KB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not a service nor an app acting for a person, not this publisher's topics, no events:publish scope, or a scope the delegation doesn't carry
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Floors or grants can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    get:
      summary: Read domain events in order (services only, events:subscribe)
      description: "Events on the topics asked for, in the one order every follower reads in. Keep the last `seq` handled and pass it as `after`, or `next`, which is as far as this read went, past events on other topics: delivery is at least once, never with a gap. Events are kept 30 days (DOMAIN_EVENTS_KEEP_DAYS)."
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 2000
          in: query
          name: topics
          required: true
          description: Comma separated topics, or families such as folio.*
        - schema:
            type: string
            pattern: ^[0-9]+$
            maxLength: 19
          in: query
          name: after
          required: false
        - schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: The next events, and the cursor to read on from
          content:
            application/json:
              schema:
                type: object
                required:
                  - events
                  - next
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/DomainEvent"
                  next:
                    type: string
                description: The next events, and the cursor to read on from
        "400":
          description: A topic that is not a topic, nor a family such as folio.*
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not a service nor an app acting for a person, no events:subscribe scope, or a scope the delegation doesn’t carry
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Grants can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /domain-events/stream:
    get:
      summary: Domain events on the caller's floor, as server-sent events (people, for the shell)
      description: 'Each domain event on the topics asked for, published on the floor the caller stands on (x-workspace-id, checked by the gateway), as it is published. Events on no floor or on another floor never reach it. Events are named "domain-event" and carry a DomainEvent as JSON. It is a hint to refresh what is on screen, not a record: there is no catching up, so after a reconnect load fresh. Comment lines are keep-alives. Read with fetch so the sign-in token can be sent.'
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 4000
          in: query
          name: topics
          required: true
          description: Comma separated topics, or families such as folio.*; at most 100
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema: {}
        "400":
          description: A topic that is not a topic, too many topics, or no floor named
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /audit:
    post:
      summary: Record an audit entry (services only). Entries are never changed, except to remove a deleted person’s details, and go only after the retention period.
      description: With an Idempotency-Key header (at most 200 characters), sending the same key again answers the entry the service already recorded under it and records nothing more, so a retry keeps one. A platform entry and the domain event it stands for are kept together, or neither is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAuditEntry"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntry"
        "400":
          description: Invalid entry, an unknown floor, or a bad Idempotency-Key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not a signed-in service nor an app acting for a person, not granted this, or a scope the delegation doesn’t carry
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Floors or grants can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    get:
      summary: The audit log, newest first (admins; leads for their own floor)
      description: To page, ask again with `before` set to the id of the oldest entry already shown; a page shorter than `limit` is the last one. With `workspace`, only entries on that floor or a floor below it, as the tree stood when each was written. Admins read the whole log; a lead standing on a floor (x-workspace-id, checked by the gateway) reads that floor's with `workspace` set to it.
      parameters:
        - schema:
            type: string
          in: query
          name: app
          required: false
        - schema:
            type: string
          in: query
          name: actor
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: since
          required: false
          description: Only entries at or after this time
        - schema:
            type: string
            format: date-time
          in: query
          name: until
          required: false
          description: Only entries before this time
        - schema:
            type: string
            pattern: ^[0-9]+$
            maxLength: 19
          in: query
          name: before
          required: false
          description: An entry's id; only entries older than it
        - schema:
            type: string
            maxLength: 100
          in: query
          name: workspace
          required: false
          description: Only entries on this floor or below it
        - schema:
            type: string
            maxLength: 200
          in: query
          name: target
          required: false
          description: Only entries about this target
        - schema:
            type: string
            maxLength: 100
          in: query
          name: person
          required: false
          description: Only entries by, about or naming this person (the actor, the target or detail.person)
        - schema:
            enum:
              - change
              - sign-in
          in: query
          name: kind
          required: false
          description: Only sign-ins (detail.kind is sign-in), or only every other change
        - schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
                description: Audit entries
        "403":
          description: Not an admin, nor a lead asking for their own floor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /audit/export:
    get:
      summary: Download Activity as CSV or JSON lines (admins)
      description: "The same filters as the audit log, newest first, at most 366 days at a time: `until` defaults to now and `since` to 366 days before it. CSV columns: at, actor, actorKind, app, action, target, floor, detail (as JSON). The download is itself recorded in Activity, as `audit.exported` with the filters used."
      parameters:
        - schema:
            type: string
          in: query
          name: app
          required: false
        - schema:
            type: string
          in: query
          name: actor
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: since
          required: false
          description: Only entries at or after this time
        - schema:
            type: string
            format: date-time
          in: query
          name: until
          required: false
          description: Only entries before this time
        - schema:
            type: string
            maxLength: 100
          in: query
          name: workspace
          required: false
          description: Only entries on this floor or below it
        - schema:
            type: string
            maxLength: 200
          in: query
          name: target
          required: false
          description: Only entries about this target
        - schema:
            type: string
            maxLength: 100
          in: query
          name: person
          required: false
          description: Only entries by, about or naming this person (the actor, the target or detail.person)
        - schema:
            enum:
              - change
              - sign-in
          in: query
          name: kind
          required: false
          description: Only sign-ins (detail.kind is sign-in), or only every other change
        - schema:
            enum:
              - csv
              - jsonl
            default: csv
          in: query
          name: format
          required: false
      responses:
        "200":
          description: The file, as `text/csv` or `application/x-ndjson`
          content:
            application/json:
              schema:
                description: The file, as `text/csv` or `application/x-ndjson`
        "400":
          description: The range is longer than the most one download holds, or ends before it starts
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not an admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /audit/redact:
    post:
      summary: Remove a deleted person's personal values from Activity, and their notifications (identity only)
      description: In every entry by, about or naming them, each personal value (the keys in service-kit's PERSONAL_DETAIL_KEYS, also inside from/to pairs) becomes "[removed]"; their id stays, now pseudonymous. Their notifications and the notice that they asked to leave are deleted, the notes they left on inbox items are blanked, and the open items that were theirs are withdrawn. Recorded in Activity as `audit.redacted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - person
              properties:
                person:
                  type: string
                  minLength: 1
                  maxLength: 100
              additionalProperties: false
      responses:
        "200":
          description: How many entries were changed and notifications deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - entries
                  - notifications
                properties:
                  entries:
                    type: integer
                  notifications:
                    type: integer
                description: How many entries were changed and notifications deleted
        "403":
          description: Not identity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /people/{id}/data:
    get:
      summary: What the events service keeps about one person (identity only)
      description: "Their notifications, read or not; the inbox items waiting on them and those they finished; and the audit entries naming them as the actor: at most `limit` of each, newest first. Only identity asks, to build the copy of someone's data they download from Account (ADR 0040)."
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
          in: query
          name: limit
          required: false
        - schema:
            type: string
            minLength: 1
            maxLength: 100
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Their data here
          content:
            application/json:
              schema:
                type: object
                required:
                  - notifications
                  - inbox
                  - audit
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  inbox:
                    type: array
                    items: {}
                    description: InboxItem, as the Inbox gives it to them
                  audit:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                description: Their data here
        "403":
          description: Not identity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
servers:
  - url: /v1
