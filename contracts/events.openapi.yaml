openapi: 3.1.0
info:
  title: Events
  version: 1.3.0
  description: >
    Notifications for the Shell's stream, and the platform's audit log.
    People reach it through the gateway, which passes the caller in x-user-*
    headers. Services call it on the internal network (see @platform/service-kit:
    notify, recordAudit). An app's service signs in as itself (a bearer token
    for its Keycloak client app-<id>, audience platform-services), may send only
    for itself, and needs the scope (notifications:send, audit:write) that the
    registry grants it on the floor named by x-workspace-id; otherwise 403, or
    503 while that can't be checked. Platform services sign in the same way as
    their own clients (platform-<name>).
# Paths below are relative to the server: the major of info.version is the path prefix.
# A breaking change bumps the major and is served under /v2 beside /v1.
servers:
  - url: /v1
paths:
  /notifications:
    get:
      summary: The caller's unread notifications, newest first (up to 50)
      responses:
        "200":
          description: Unread notifications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        "401": { description: No signed-in caller }
    post:
      summary: Notify people (services only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewNotification" }
      responses:
        "202": { description: "Sent, one notification per recipient: { sent: number }" }
        "400": { description: Invalid notification }
        "403": { description: Not a signed-in service, or not granted this }
  /notifications/stream:
    get:
      summary: Each new notification for the caller, as server-sent events
      description: >
        Events are named "notification" and carry a Notification as JSON.
        Comment lines are sent as keep-alives. Read with fetch so the sign-in
        token can be sent; reload the list after reconnecting.
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream: {}
  /notifications/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Mark one of the caller's notifications read
      responses:
        "204": { description: Marked read }
        "404": { description: The caller has no such notification }
    delete:
      summary: Mark it unread again (Undo)
      responses:
        "204": { description: Marked unread }
        "404": { description: The caller has no such notification }
  /audit:
    get:
      summary: The audit log, newest first (admins only)
      description: >
        To page, ask again with `before` set to the id of the oldest entry
        already shown; a page shorter than `limit` is the last one.
      parameters:
        - { name: app, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: Only entries at or after this time }
        - { name: until, in: query, schema: { type: string, format: date-time }, description: Only entries before this time }
        - { name: before, in: query, schema: { type: string, pattern: "^[0-9]+$" }, description: An entry's id; only entries older than it }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        "403": { description: Not an admin }
    post:
      summary: Record an audit entry (services only). Entries are never changed or removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewAuditEntry" }
      responses:
        "201": { description: Recorded }
        "400": { description: Invalid entry }
        "403": { description: Not a signed-in service, or not granted this }
components:
  schemas:
    NewNotification:
      type: object
      additionalProperties: false
      required: [app, recipients, level, title]
      properties:
        app: { type: string, description: The app it is about; the Shell opens it }
        recipients: { type: array, minItems: 1, maxItems: 500, items: { type: string }, description: User ids }
        level: { enum: [needs, info, done, failed], description: '"needs" when the person has to act' }
        title: { type: string, maxLength: 200 }
        detail: { type: string, maxLength: 2000 }
        link: { type: string, pattern: "^/", description: Path inside the app to open }
    Notification:
      type: object
      required: [id, app, level, title, createdAt]
      properties:
        id: { type: string }
        app: { type: string }
        level: { enum: [needs, info, done, failed] }
        title: { type: string }
        detail: { type: string }
        link: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time }
    NewAuditEntry:
      type: object
      additionalProperties: false
      required: [actor, app, action]
      properties:
        actor:
          type: object
          required: [id, kind]
          properties:
            id: { type: string, description: A person's id or a service's name }
            kind: { enum: [user, service] }
        app: { type: string, description: The app or service it happened in }
        action: { type: string, description: 'A dotted verb, e.g. "document.published"' }
        target: { type: string }
        detail: { type: object }
    AuditEntry:
      allOf:
        - $ref: "#/components/schemas/NewAuditEntry"
        - type: object
          required: [id, at]
          properties:
            id: { type: string }
            at: { type: string, format: date-time }
