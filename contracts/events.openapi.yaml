  /notifications:
    post:
      summary: Notify people (services only)
      description: With toTeam and no recipients, to everyone on the team the call's floor names (its members and those of the teams below), asked of identity as it's sent. Only a team that has turned team notices on (403 otherwise). With audience (platform services only, ADR 0044), to everyone the principals reach now, asked of identity, such as role:deployment-admin. With key, nobody who already has a notification from that app with that key is told again, read or not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewNotification"
      responses:
        "202":
          description: Sent, one notification per recipient
          content:
            application/json:
              schema:
                type: object
                required:
                  - sent
                properties:
                  sent:
                    type: integer
                description: Sent, one notification per recipient
        "400":
          description: Invalid notification, an unknown floor, or toTeam not on a team
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not a signed-in service nor an app acting for a person, not granted this, a scope the delegation doesn’t carry, team notices are off, or urgent or an audience from an app
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Floors, grants or an audience can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    get:
      summary: The caller's unread notifications, newest first (up to 50)
      responses:
        "200":
          description: Unread notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
                description: Unread notifications
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /team-notices/{workspace}:
    get:
      summary: Whether a team has turned team notices on (its leads and admins)
      description: A lead must be standing on the team (x-workspace-id, checked by the gateway).
      parameters:
        - schema:
            type: string
          in: path
          name: workspace
          required: true
      responses:
        "200":
          description: The setting
          content:
