# Generated from platform/services/events: its routes' TypeBox schemas and src/contract.ts (ADR 0055).
# Change those, then run pnpm contracts. CI fails when this file is out of step.
# Paths below are relative to the server: the major of info.version is the path prefix.
# A breaking change bumps the major and is served under /v2 beside /v1.
openapi: 3.1.0
info:
  title: Events
  version: 1.16.0
  description: "Notifications for the Shell's stream, and AUGUR's audit log. People reach it through the gateway, which passes the caller in x-user-* headers. Services call it on the internal network (see @augur/service-kit: notify, recordAudit). An app's service signs in as itself (a bearer token for its Keycloak client app-<id>, audience platform-services), may send only for itself, and needs the scope (notifications:send, audit:write) that the registry grants it on the floor named by x-workspace-id; otherwise 403, or 503 while that can't be checked. Platform services sign in the same way as their own clients (platform-<name>). A service call that names a floor (x-workspace-id) records it, with the floor's path from the root as it stands then (asked of identity), on each notification and audit entry: 400 for a floor that doesn't exist, 503 while identity can't be reached."
components:
  schemas:
    Refusal:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - reason
        - error
        - message
      properties:
        type:
          type: string
          description: about:blank unless the problem names its own type
        title:
          type: string
          description: The status's own phrase
        status:
          type: integer
        detail:
          type: string
          description: Says why, and what would change it
        instance:
          type: string
        reason:
          type: string
          description: A stable code a client can switch on
          examples:
            - forbidden
        whoCanChange:
          type: string
          description: Who can fix it, in plain words, when someone can
        error:
          type: string
          description: The same as reason, for SDK 1.x clients
        message:
          type: string
          description: The same as detail, for SDK 1.x clients
    NewNotification:
      type: object
      required:
        - app
        - recipients
        - level
        - title
      properties:
        app:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,39}$
          description: The app it is about; the Shell opens it
        recipients:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 500
          uniqueItems: true
          description: User ids; empty only with toTeam or audience
        toTeam:
          type: boolean
          description: To everyone on the team the call's floor names, instead of recipients
        audience:
          type: array
          items:
            type: string
            pattern: ^(org|(person|team|tree|role):[A-Za-z0-9_.:-]{1,100})$
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: Platform services only. Principals such as role:deployment-admin, worked out by identity as it's sent, instead of recipients
        key:
          type: string
          minLength: 1
          maxLength: 200
          description: The sender's name for this news; each person is told an app's key once
        kind:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,39}$
          description: One of the kinds the app's manifest declares (notifications.kinds), so people can choose how each kind reaches them
        level:
          enum:
            - needs
            - info
            - done
            - failed
          description: '"needs" when the person has to act'
        urgent:
          type: boolean
          description: "Platform services only (ADR 0044 D3). News that stops work, such as a halted release: the shell may letterbox it"
        title:
          type: string
          minLength: 1
          maxLength: 200
        detail:
          type: string
          maxLength: 2000
        link:
          type: string
          pattern: ^/
          maxLength: 500
          description: Path inside the app to open
        actions:
          type: array
          items:
            $ref: "#/components/schemas/NotificationAction"
          maxItems: 2
          description: Buttons on it in the Shell; pressing one raises its intent through the shell and marks it read
      additionalProperties: false
    NotificationAction:
      type: object
      required:
        - label
        - intent
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 30
          description: '"Approve", "Open"'
        intent:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              pattern: ^[a-z][a-z0-9.-]*$
              maxLength: 80
              description: An intent type some app handles
            payload:
              description: The app's own; at most 1024 bytes as JSON
          additionalProperties: false
      additionalProperties: false
    Notification:
      type: object
      required:
        - id
        - app
        - level
        - title
        - createdAt
      properties:
        id:
          type: string
        app:
          type: string
        level:
          enum:
            - needs
            - info
            - done
            - failed
        title:
          type: string
        detail:
          type: string
        link:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/NotificationAction"
        kind:
          type: string
          description: One of the app's notifications.kinds
        urgent:
          type: boolean
          description: "News that stops work, from a platform service: the shell may letterbox it"
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
        workspace:
          $ref: "#/components/schemas/EventFloor"
    NewAuditEntry:
      type: object
      required:
        - actor
        - app
        - action
      properties:
        actor:
          type: object
          required:
            - id
            - kind
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 100
              description: A person's id or a service's name
            kind:
              enum:
                - user
                - service
          additionalProperties: false
        app:
          type: string
          minLength: 1
          maxLength: 40
          description: The app or service it happened in
        action:
          type: string
          pattern: ^[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)+$
          maxLength: 80
          description: A dotted verb, e.g. "document.published"
        target:
          type: string
          maxLength: 200
        detail:
          type: object
          maxProperties: 50
          additionalProperties: {}
      additionalProperties: false
    AuditEntry:
      allOf:
        - $ref: "#/components/schemas/NewAuditEntry"
        - type: object
          required:
            - id
            - at
          properties:
            id:
              type: string
            at:
              type: string
              format: date-time
            workspace:
              $ref: "#/components/schemas/EventFloor"
    EventFloor:
      type: object
      required:
        - id
        - path
      properties:
        id:
          type: string
        path:
          type: array
          items:
            type: string
      description: The floor it happened on, and its path from the root as it stood then
    TeamNotices:
      type: object
      required:
        - workspace
        - on
      properties:
        workspace:
          type: string
        on:
          type: boolean
    NewDomainEvent:
      type: object
      required:
        - topic
        - id
        - payload
      properties:
        topic:
          type: string
          pattern: ^[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)+$
          maxLength: 120
          examples:
            - folio.document.published
        id:
          type: string
          minLength: 1
          maxLength: 100
          description: The publisher's own id for it
        workspace:
          type: string
          minLength: 1
          maxLength: 100
          description: The floor it happened on
        payload: {}
      additionalProperties: false
    DomainEvent:
      type: object
      required:
        - seq
        - topic
        - id
        - publisher
        - at
        - payload
      properties:
        seq:
          type: string
        topic:
          type: string
        id:
          type: string
        publisher:
          type: string
        at:
          type: string
          format: date-time
        workspace:
          $ref: "#/components/schemas/EventFloor"
        payload: {}
    InboxRef:
      type: object
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          minLength: 1
          maxLength: 40
          description: '"ref", or a DocumentRef, EntityRef or UnitRef kind'
        app:
          type: string
          maxLength: 40
        id:
          type: string
          minLength: 1
          maxLength: 200
        label:
          type: string
          maxLength: 200
      additionalProperties: true
      maxProperties: 12
      description: A reference back to the thing in the app (the SDK's Ref and its kin), carried as found
    InboxOwner:
      type: object
      required:
        - kind
        - id
      properties:
        kind:
          enum:
            - person
            - team
        id:
          type: string
          minLength: 1
          maxLength: 100
        role:
          enum:
            - lead
          description: "For a team item: only the team's leads take it"
      additionalProperties: false
      description: Who an item waits on
    NewInboxItem:
      type: object
      required:
        - kind
        - owner
        - title
        - subject
      properties:
        kind:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,39}$
          description: One of the kinds the app's manifest declares (inbox.kinds)
        owner:
          $ref: "#/components/schemas/InboxOwner"
        title:
          type: string
          minLength: 1
          maxLength: 200
        detail:
          type: string
          maxLength: 1000
        subject:
          $ref: "#/components/schemas/InboxRef"
        refs:
          type: array
          items:
            $ref: "#/components/schemas/InboxRef"
          maxItems: 5
        open:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              pattern: ^[a-z][a-z0-9.-]*$
              maxLength: 80
              description: An intent type some app handles
            payload:
              description: The app's own; at most 1024 bytes as JSON
          additionalProperties: false
        path:
          type: string
          pattern: ^/
          maxLength: 500
          description: Where in the app Open goes when there is no intent
        due:
          type: string
          maxLength: 40
          pattern: ^\d{4}-\d{2}-\d{2}([T ][0-9:.]+(Z|[+-]\d{2}:?\d{2})?)?$
          description: An ISO date, or date and time
        allow:
          type: object
          properties:
            decline:
              type: boolean
              default: true
            handOn:
              type: boolean
              default: true
            selfComplete:
              type: boolean
              default: false
              description: Whether the person may mark it done in the shell
          additionalProperties: false
        from:
          type: string
          minLength: 1
          maxLength: 100
          description: The person on whose behalf the app made it
        reopen:
          type: boolean
          description: Opens a closed item again
      additionalProperties: false
    InboxChange:
      type: object
      properties:
        state:
          enum:
            - done
            - withdrawn
          description: "Closes it: the work was done, or the app took it back"
        title:
          type: string
          minLength: 1
          maxLength: 200
        detail:
          type: string
          maxLength: 1000
        due:
          type: string
          maxLength: 40
          pattern: ^\d{4}-\d{2}-\d{2}([T ][0-9:.]+(Z|[+-]\d{2}:?\d{2})?)?$
          description: An ISO date, or date and time
        refs:
          type: array
          items:
            $ref: "#/components/schemas/InboxRef"
          maxItems: 5
        note:
          type: string
          maxLength: 500
          description: Why, kept in the item's history
      additionalProperties: false
    InboxItem:
      type: object
      required:
        - id
        - app
        - key
        - kind
        - owner
        - state
        - allow
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        app:
          type: string
        key:
          type: string
        kind:
          type: string
        owner:
          $ref: "#/components/schemas/InboxOwner"
        takenBy:
          type: string
        takenAt:
          type: string
          format: date-time
        state:
          enum:
            - open
            - done
            - declined
            - handed-on
            - withdrawn
          description: "handed-on is never set: handing on changes the owner and keeps it open"
        title:
          type: string
          description: Left out of a leads-only item shown to a member
        detail:
          type: string
        subject:
          $ref: "#/components/schemas/InboxRef"
        refs:
          type: array
          items:
            $ref: "#/components/schemas/InboxRef"
        open:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              pattern: ^[a-z][a-z0-9.-]*$
              maxLength: 80
              description: An intent type some app handles
            payload:
              description: The app's own; at most 1024 bytes as JSON
          additionalProperties: false
        path:
          type: string
        due:
          type: string
          format: date-time
        overdue:
          type: boolean
        allow:
          type: object
          required:
            - decline
            - handOn
            - selfComplete
          properties:
            decline:
              type: boolean
            handOn:
              type: boolean
            selfComplete:
              type: boolean
        from:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        closedBy:
          type: string
        closeNote:
          type: string
        workspace:
          $ref: "#/components/schemas/EventFloor"
        redacted:
          type: boolean
          description: "A leads-only item shown to a member: that it's there, not what it is"
    InboxHistory:
      type: object
      required:
        - at
        - action
      properties:
        at:
          type: string
          format: date-time
        by:
          type: string
          description: A person's id; none when the app did it
        action:
          enum:
            - created
            - updated
            - taken
            - released
            - declined
            - handed-on
            - done
            - withdrawn
            - reopened
        from:
          type: string
          description: person:<id> or team:<id>
        to:
          type: string
        note:
          type: string
    InboxCounts:
      type: object
      required:
        - you
        - teams
        - overdue
        - doneDays
      properties:
        you:
          type: integer
          description: Open items on the person, or taken by them
        teams:
          type: integer
          description: Untaken items of the person's teams they could take
        overdue:
          type: integer
          description: Of `you`, those past due
        doneDays:
          type: integer
          minimum: 1
          description: How many days back the done tab looks (the deployment's INBOX_DONE_DAYS)
paths:
  /inbox/items/{app}/{key}:
    put:
      summary: Put an item in someone's inbox, or change it (services only, inbox:write)
      description: "Keyed by the app's own id for the work: putting the same key again changes the one item. The item is on the call's floor (x-workspace-id), where the grant is checked. The owner is a person who can sign in, or a team that is not archived. A closed item is reopened only with reopen. No notification is sent: the Inbox count and Home show it (ADR 0026)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewInboxItem"
      parameters:
        - schema:
            type: string
            pattern: ^[a-z][a-z0-9-]{1,39}$
          in: path
          name: app
          required: true
        - schema:
            type: string
            minLength: 1
            maxLength: 200
          in: path
          name: key
          required: true
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "400":
          description: Invalid item, a kind the manifest does not declare, an unknown owner or floor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not a signed-in service nor an app acting for a person, not this app's item, no inbox:write on that floor, or a scope the delegation doesn't carry
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: The item is closed; send reopen to open it again
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Floors, grants or people can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    patch:
      summary: Change an item the app made, or close it as done or withdrawn (services only, inbox:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxChange"
      parameters:
        - schema:
            type: string
            pattern: ^[a-z][a-z0-9-]{1,39}$
          in: path
          name: app
          required: true
        - schema:
            type: string
            minLength: 1
            maxLength: 200
          in: path
          name: key
          required: true
      responses:
        "200":
          description: The item now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "403":
          description: Not a signed-in service nor an app acting for a person, not this app's item, no inbox:write on that floor, or a scope the delegation doesn't carry
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: No such item
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: Already closed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Floors, grants or people can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
    get:
      summary: An item the app made, with its history and notes (services only, inbox:write)
      parameters:
        - schema:
            type: string
            pattern: ^[a-z][a-z0-9-]{1,39}$
          in: path
          name: app
          required: true
        - schema:
            type: string
            minLength: 1
            maxLength: 200
          in: path
          name: key
          required: true
      responses:
        "200":
          description: The item and every change to it
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InboxItem"
                  - type: object
                    required:
                      - history
                    properties:
                      history:
                        type: array
                        items:
                          $ref: "#/components/schemas/InboxHistory"
                description: The item and every change to it
        "403":
          description: Not a signed-in service nor an app acting for a person, not this app's item, no inbox:write on that floor, or a scope the delegation doesn't carry
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: No such item
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: Floors, grants or people can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /inbox:
    get:
      summary: "The caller's inbox: one tab, newest first"
      description: "you: open items on the caller, or team items they took. teams: untaken items of the teams they're on; a leads-only item is shown whole to a lead standing on that team (x-workspace-id) and redacted to anyone else on it. done: items closed in the last doneDays days (/inbox/counts) that the caller owned or acted on. To page, pass the last id shown as before."
      parameters:
        - schema:
            enum:
              - you
              - teams
              - done
            default: you
          in: query
          name: tab
          required: false
        - schema:
            type: string
            maxLength: 100
          in: query
          name: floor
          required: false
          description: Only items on this floor
        - schema:
            type: string
            maxLength: 40
          in: query
          name: before
          required: false
          description: The last item's id already shown
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxItem"
                description: Items
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The caller's teams can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /inbox/counts:
    get:
      summary: How many items wait on the caller and on their teams, for the shell's count
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxCounts"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The caller's teams can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /inbox/{id}:
    get:
      summary: One item the caller can see, with its history
      parameters:
        - schema:
            type: string
            maxLength: 40
          in: path
          name: id
          required: true
      responses:
        "200":
          description: The item and every change to it
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InboxItem"
                  - type: object
                    required:
                      - history
                    properties:
                      history:
                        type: array
                        items:
                          $ref: "#/components/schemas/InboxHistory"
                description: The item and every change to it
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: No such item, or not one the caller can see
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /inbox/{id}/take:
    post:
      summary: "Take a team item: it becomes the caller’s, shown to the team as taken"
      description: Publishes platform.inbox.taken with { item, app, key, by } and records inbox.taken in the audit log.
      parameters:
        - schema:
            type: string
            maxLength: 40
          in: path
          name: id
          required: true
      responses:
        "200":
          description: The item now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: Not the caller’s to act on, or the app does not allow it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: No such item, or not one the caller can see
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: Already closed, or someone took it first (takenBy names who)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  takenBy:
                    type: string
                additionalProperties: true
        "503":
          description: The caller's teams, or who that is, can't be checked right now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
  /inbox/{id}/release:
    post:
      summary: Give a taken item back to its team
      description: Publishes platform.inbox.released with { item, app, key, by } and records inbox.released in the audit log.
      parameters:
        - schema:
            type: string
            maxLength: 40
          in: path
          name: id
          required: true
      responses:
        "200":
          description: The item now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "401":
          description: No signed-in caller
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
